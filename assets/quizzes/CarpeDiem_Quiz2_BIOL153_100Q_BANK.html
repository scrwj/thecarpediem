<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Carpe Diem Quiz</title>
<style>
:root{--bg:#000000;--bg2:#121110;--bone:#F8F4ED;--gold:#FEB704;--line:#6b5008;--red:#9c1f1f;--red2:#e0453f;--dim:#a39a86}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--bone);font:16px/1.55 Georgia,"Times New Roman",serif;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1,h2{margin:.3em 0;letter-spacing:.08em}
h1{text-transform:uppercase;font-size:1.45rem}
.c{text-align:center}
.badge{width:170px;height:170px;display:block;margin:8px auto;animation:rise .6s ease-out both}
.badge.sm{width:104px;height:104px}
@keyframes rise{from{transform:translateY(10px) scale(.95);opacity:0}to{transform:none;opacity:1}}
.brandbar{display:flex;align-items:center;gap:10px;padding:2px 0 10px;margin-bottom:6px;border-bottom:1px solid var(--line);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.brandbar img{height:26px;width:auto}
.brandbar span{color:var(--dim);margin-left:auto;letter-spacing:.08em}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);text-align:center;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.foot b{color:var(--gold);font-weight:700}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.hdr{font-size:.85rem;color:var(--dim);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.hdr b{color:var(--bone)}
label{font-size:.85rem;color:var(--dim)}
input{width:100%;padding:12px;margin:6px 0 14px;background:#0b0a09;color:var(--bone);border:1px solid var(--line);border-radius:8px;font:inherit}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;min-height:48px;padding:12px;margin:8px 0;background:var(--gold);color:#050505;border:2px solid var(--gold);border-radius:10px;font-weight:700}
.btn.alt{background:transparent;color:var(--bone);border-color:var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.btn small{display:block;font-weight:400;opacity:.85}
.top{display:flex;justify-content:space-between;font-size:.85rem;color:var(--dim)}
.bar{height:8px;background:#1e1b17;border:1px solid var(--line);border-radius:6px;margin:8px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.78rem;font-weight:700;border:1px solid}
.easy{color:#4fd18b;border-color:#4fd18b}.medium{color:var(--gold);border-color:var(--gold)}
.hard{color:#ff8a4c;border-color:#ff8a4c}.devil{color:#ff4b4b;border-color:var(--red2);box-shadow:0 0 8px var(--red)}
.q{font-size:1.1rem;margin:12px 0}
.o{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;background:#0b0a09;color:var(--bone);border:1px solid #3a342c;border-radius:10px}
.o:disabled{opacity:1;color:var(--bone);cursor:default}
.o b{color:var(--gold);margin-right:8px}
.o.pick{border-color:var(--gold)}.o.ok{border-color:#4fd18b;background:#0f2a1c}.o.no{border-color:var(--red2);background:#2a0e0e}
.ex{display:block;font-size:.85rem;color:var(--dim);margin-top:6px}
.msg{min-height:1.7em;font-size:1.25rem;font-weight:700;color:var(--gold);text-align:center;margin:6px 0;animation:pop .25s}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none}}
.nav{display:flex;gap:10px}
.big{font-size:3.4rem;font-weight:700;color:var(--gold);line-height:1}
.err{color:var(--red2);min-height:1.4em;text-align:center}
#clk{color:var(--gold);font-weight:700}#clk.low{color:var(--red2)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div>

{difficulty:"medium",topic:"Pangenesis",question:"How does pangenesis account for the resemblance between parents and offspring?",

{difficulty:"medium",topic:"Lamarckism",question:"The example 'a tattoo or scar would be inherited as tattoo or scar pangenes' illustrates which theory?",

{difficulty:"medium",topic:"Germplasm theory",question:"Who made the first serious challenge to the theory of pangenesis?",

{difficulty:"medium",topic:"Preformation",question:"To the preformationists, development was simply",

 options:["growth only","differentiation as well as growth","the unfolding of a preformed homunculus","the transfer of pangenes to the offspring"],correct_index:1,
 explanations:["Preformation was about growth only.","Correct. Development is differentiation as well as growth, with tissues and organs forming gradually through transformations.","Unfolding of a homunculus is preformation.","Pangenes belong to pangenesis."]},
{difficulty:"medium",topic:"Epigenesis",question:"Wolff and von Baer supported epigenesis with a fairly accurate description of the embryonic development of",
 options:["the chick","the human foetus","the garden pea","the mouse"],correct_index:0,
 explanations:["Correct. They described the gradual change in the chick from egg to foetus to adult.","The human embryo was not their described example.","The pea belongs to Mendel's story.","The fruit fly became a genetic model much later."]},
{difficulty:"medium",topic:"Early theories",question:"According to the slides' conclusion, what is actually transmitted from parents to offspring?",
 options:["A physical miniature of the parent","A set of instructions (genetic information in DNA) which, interacting with the environment, directs development","Gemmules from every part of the body","A fully formed homunculus"],correct_index:1,
 explanations:["Preformation thought this, wrongly.","Correct. What is inherited are genetic instructions in DNA which interact with the environment to direct development.","Gemmules belong to the disproved pangenesis.","Preformation was inaccurate; the organism is not preformed in the zygote."]},
{difficulty:"medium",topic:"Conclusions",question:"According to the slides' conclusions, which theory was more accurate?",
 options:["The theory of preformation","The theory of epigenesis","The theory of pangenesis","The theory of Lamarckism"],correct_index:1,
 explanations:["The slides declare preformation inaccurate: the organism is not preformed in the zygote.","Correct. The theory of epigenesis was more accurate than that of preformation.","Pangenesis was not vindicated in the slides' conclusions.","Lamarckism was not vindicated either."]},
{difficulty:"medium",topic:"Mendel's organism",question:"Which species name belongs to the common garden pea used by Mendel?",
 options:["Lens culinaris","Pisum abyssinicum","Pisum sativum","Phaseolus vulgaris"],correct_index:2,
 explanations:["That is the lentil.","That is a different pea species, not the common garden pea.","Correct. The garden pea is Pisum sativum.","That is the common (French) bean."]},
{difficulty:"medium",topic:"Alleles",question:"According to the slides, each homologous chromosome at a locus",
 options:["carries several alleles simultaneously","has one allele, so a diploid individual carries two together","carries no alleles at all","carries only dominant alleles"],correct_index:1,
 explanations:["One per chromosome; several together belong to a population gene pool.","Correct. Each homologous chromosome has one allele.","Alleles ARE present on homologous chromosomes.","There is no dominance restriction on which allele a homologue carries."]},
{difficulty:"medium",topic:"Mendel's organism",question:"Which of the following was NOT among the stated reasons Mendel chose the pea plant?",
 options:["It was easy to cultivate, with a relatively short life cycle (an annual plant)","It has discontinuous characteristics such as flower colour and pea texture","The plant's proteins are easy to crystallize in a test tube","Its perfect flowers allow self-fertilization"],correct_index:2,
 explanations:["That WAS a stated reason.","That WAS a stated reason.","Correct. Protein crystallization was never cited; the stated reasons were cultivation ease, short life cycle, discontinuous traits and self-pollinating perfect flowers.","That WAS a stated reason."]},
{difficulty:"medium",topic:"Mendel's method",question:"Mendel paid attention to a single character at a time; for example, the ____ rather than the whole plant.",
 options:["number of leaves","shape of the seeds","colour of the pot","depth of the roots"],correct_index:1,
 explanations:["Leaf number was not the stated example.","Correct. Seed shape is the stated example of attending to a single character.","Pots have nothing to do with the characters studied.","Root depth was not among the example characters."]},
{difficulty:"medium",topic:"Mendel's experiment",question:"In the P1 generation, Mendel paired tall and dwarf plants how?",
 options:["Both parents were left to self-pollinate unaided","Tall plants were pollinated by dwarf plants, and dwarf plants by tall plants","Only hybrid tall plants were used as parents","The flowers never opened and still set seed"],correct_index:1,
 explanations:["Preventing self-fertilization was the whole control; the P1 were deliberately cross-pollinated.","Correct. Tall plants were pollinated by dwarf plants and vice versa (reciprocal pollination).","The P1 parents were pure-breeding lines, not hybrids.","Artificial cross-fertilization was required to make mating happen as planned."]},
{difficulty:"medium",topic:"Vocabulary",question:"A 'character' in Mendel's terminology is",
 options:["any measurable trait of an organism","a noticeable feature that varies among individuals","a variant form of a trait","a gene's position on a chromosome"],correct_index:1,
 explanations:["The trait is the measurable variant, not the character.","Correct. Characters are noticeable features that vary among individuals, such as seed shape.","This inverts the definition.","That is a locus."]},
{difficulty:"medium",topic:"Vocabulary",question:"Each variant of a character, for example tallness versus dwarfness, is called a",
 options:["locus","trait","haplotype","pollen grain"],correct_index:1,
 explanations:["A locus is a gene location on a chromosome.","Correct. Each variant of a character is a trait.","A haplotype is a set of alleles, not used here.","Pollen is the male gametophyte."]},
{difficulty:"medium",topic:"Quantitative traits",question:"Traits such as yield and seed weight, which are controlled by multiple genes, are known as",
 options:["quantitative traits","discontinuous traits","monogenic traits","testcross traits"],correct_index:0,
 explanations:["Correct. Characters governed by multiple genes (yield, seed weight) are quantitative traits; Mendel deliberately avoided them.","Discontinuous/on-or-off traits are the single-gene ones Mendel chose.","Monogenic means one gene, the opposite of the multiple-gene control described.","'Testcross trait' is not a term from the slides."]},
{difficulty:"medium",topic:"Mendel's method",question:"Counting the number of progeny of each kind to see whether carriers of alternate traits always appear in the same proportions describes Mendel's",
 options:["qualitative approach","quantitative approach","serological approach","anatomical approach"],correct_index:1,
 explanations:["Counting makes the approach quantitative, not qualitative.","Correct. His counting of progeny proportions is described as the quantitative approach.","Serology deals with blood antigens, not progeny counting.","Comparative anatomy could not quantify inheritance ratios."]},
{difficulty:"medium",topic:"Mendel's method",question:"How did Mendel control mating between plants?",
 options:["By leaving the plot open to wind and insect visitors","By grafting flower stems together","By using artificial cross-fertilization","By planting only the roots of chosen varieties"],correct_index:2,
 explanations:["Uncontrolled pollination is the opposite of what he did.","Grafting is vegetative propagation, not mating.","Correct. Using artificial cross-fertilization, Mendel controlled mating between plants.","Grafting of roots was not involved."]},
{difficulty:"medium",topic:"Generations",question:"Besides 'first filial generation', what other name do the slides give the F1 offspring?",
 options:["Hybrids","Gametes","Pangenes","Filtrates"],correct_index:0,
 explanations:["Correct. The F1 are also referred to as hybrids.","Gametes are the sex cells themselves, not the offspring.","Pangenes are pangenesis particles.","Filtrate is a fluid, not an offspring class."]},
{difficulty:"medium",topic:"Dominance",question:"In the pea experiment, the allele for dwarfness behaves as",
 options:["codominant with the tall allele","semi-dominant","a quantitative allele","recessive"],correct_index:3,
 explanations:["The heterozygote is fully tall, so there is no codominance.","The tall heterozygote shows no intermediate phenotype.","Dwarfness is a single-gene trait in these crosses.","Correct. Since the F1 was tall but dwarfness reappeared in the F2, the dwarf allele is recessive."]},
{difficulty:"medium",topic:"Mendel's results",question:"Selfing 1,064 tall F1 hybrids produced 787 tall and 277 dwarf. The observed ratio was",
 options:["1 : 1","9 : 1","2.84 : 1, i.e. nearly a perfect 3:1","2 : 1"],correct_index:2,
 explanations:["1:1 is the testcross expectation, not the F2 from selfing.","9:1 is not a Mendelian ratio.","Correct. 787/277 gives 2.84:1, described as nearly a perfect 3:1.","2:1 shows up with lethal combinations, not in this simple selfing."]},
{difficulty:"hard",topic:"Dominance",question:"Strictly speaking, dominance 'applies to the appearance of a trait' in which condition?",
 options:["The homozygous condition only","The heterozygous condition","Any condition after self-fertilization","The condition of the P1 generation"],correct_index:1,
 explanations:["In a homozygote the phenotype always shows, so dominance is not needed there as a concept.","Correct. Dominance describes the appearance of the dominant trait in the heterozygous (Dd) condition.","Self-fertilization changes genotype frequencies, not the definition of dominance.","The P1 was homozygous, so dominance is not at issue there."]},
{difficulty:"medium",topic:"Monohybrid",question:"Offspring that are hybrid for only one characteristic, e.g. height, are called",
 options:["monohybrids","dihybrids","trihybrids","allopolyploids"],correct_index:0,
 explanations:["Correct. They are called monohybrids because they are hybrid for only one characteristic.","Heterozygosity at two loci would make them dihybrids.","Three loci would make them trihybrids.","Allopolyploidy is a chromosome-level phenomenon not at issue here."]},
{difficulty:"medium",topic:"Generations",question:"In Mendel's generational labels, the letters F2 denote the",
 options:["first filial generation","parental generation itself","third backcross generation","second filial generation, arising e.g. from selfing the F1"],correct_index:3,
 explanations:["F1 is the first filial generation.","P (or P1) is the parental generation.","No third backcross generation label appears in this scheme.","Correct. F2 is the second filial generation."]},
{difficulty:"medium",topic:"Phenotype",question:"According to the slides, the phenotype is the result of",
 options:["gene products brought to expression in a given environment","the dominance of one allele over the other alone","random fertilization of the zygote","the number of chromosomes an organism carries"],correct_index:0,
 explanations:["Correct. The phenotype results from gene products expressed in a given environment.","Dominance alone ignores the role of the environment.","Fertilization is random but does not itself form the phenotype.","Chromosome number can affect phenotype, but the slide definition points to gene products plus environment."]},
{difficulty:"medium",topic:"Phenotype",question:"Which of the following is cited as an example of a phenotype visible to the eye?",
 options:["The base order of a DNA strand","The texture of hair","The type of messenger RNA","The count of chromosomes"],correct_index:1,
 explanations:["DNA sequence is genotype-level information.","Correct. The trait may be visible to the eye, such as colour of a flower or texture of hair.","mRNA is a molecular product, not a visible trait.","Chromosome counts need microscopy, not the eye alone."]},
{difficulty:"medium",topic:"Genotype",question:"Which of the following lists genotypes, as the slides explain them?",
 options:["tall, intermediate and dwarf","red, white and pink","flowering and non-flowering","TT, Tt and tt"],correct_index:3,
 explanations:["That list is of phenotypes.","That list is of colours, not genotypes.","That list is of phenotypic classes too.","Correct. The genotype is the type of genes an organism possesses, given as TT, Tt or tt."]},
{difficulty:"medium",topic:"Genes",question:"According to the gene definition, what determines an inherited trait?",
 options:["The amount of oxygen the plant receives","The soil pH around the roots","Proteins determined by the gene's coding","The number of seeds produced"],correct_index:2,
 explanations:["Oxygen availability is environmental.","Soil conditions are environmental.","Correct. A gene codes for a particular protein, and proteins determine the inherited trait.","Seed number is a yield trait, not the determining mechanism."]},
{difficulty:"medium",topic:"Locus",question:"According to the slide definition, genes reside",
 options:["in the circulatory fluid","on chromosomes","in the cell wall","nowhere in particular"],correct_index:1,
 explanations:["The circulatory system carries gemmules only in the disproved pangenesis model.","Correct. Genes reside on chromosomes, and a gene's location there is its locus.","Cell walls are structural, not genetic.","Gene position matters for inheritance; it exists on chromosomes."]},
{difficulty:"medium",topic:"Segregation",question:"After the members of each pair of alleles separate into different gametes, the sequence in Mendel's scheme is that",
 options:["the alleles recombine backwards into one gene","gemmules then travel in the blood vessels","the environment finalizes the genotype","the gametes fuse and give rise to the progeny"],correct_index:3,
 explanations:["Alleles do not merge back together.","Gemmule transport belongs to the rejected pangenesis.","The genotype is fixed at fertilization; environment shapes phenotype only.","Correct. The gametes then fuse and give rise to the progeny."]},
{difficulty:"medium",topic:"Segregation",question:"Mendel's phrase 'purity of gametes' means that",
 options:["gametes are free of dirt and contamination","each gamete carries only one member of an allelic pair, distributed to the different sex cells","each gamete carries both alleles of a pair","gametes only carry dominant alleles"],correct_index:1,
 explanations:["This is a literal but irrelevant misreading.","Correct. Purity of gametes means segregation delivers one allele per pair to each gamete.","If gametes carried both alleles, no segregation would occur.","Gametes can carry recessive alleles; purity is about one allele per pair, not dominance."]},
{difficulty:"medium",topic:"Degrees of freedom",question:"In chi-square analysis, the degrees of freedom (d/f) equals",
 options:["n − 1, where n is the number of different categories into which each datum point may fall","n + 1","the total number of progeny observed","2 × n, the number of gametes"],correct_index:0,
 explanations:["Correct. The d/f is n − 1.","One is ADDED only if you misread the rule; it is subtracted.","Total progeny is the sample size, not the d/f.","Gamete counts have nothing to do with d/f."]},
{difficulty:"hard",topic:"Segregation",question:"Why is segregation detectable ONLY in the heterozygous parent?",
 options:["Because only Dd produces two different kinds of gametes (D and d); a homozygote produces only one kind","Because homozygous parents refuse to produce gametes","Because heterozygotes produce twice as many gametes","Because heterozygotes have extra chromosomes"],correct_index:0,
 explanations:["Correct. Per the slides, Dd makes two gamete kinds (D and d) so segregation can be seen; DD or dd makes only one kind each.","Homozygous parents do produce gametes.","Heterozygotes do not necessarily make more gametes; they make qualitatively different kinds.","Heterozygotes carry the same chromosome number."]},
{difficulty:"medium",topic:"Segregation",question:"Which gamete kind(s) can the dwarf pea plant (dd) produce?",
 options:["Only one kind, d","D and d, in equal frequencies","Only D","Four kinds in a 1:1:1:1 ratio"],correct_index:0,
 explanations:["Correct. The dwarf (dd) is homozygous, so it can produce only one kind of gamete (d).","Producing two kinds characterizes the heterozygote Dd.","A dwarf cannot carry the dominant D allele.","Four kinds would come from a double heterozygote."]},
{difficulty:"hard",topic:"Testcross",question:"A tall pea plant of unknown genotype is testcrossed with a dwarf (dd). ALL the progeny are tall. The tall parent was",
 options:["heterozygous (Dd)","homozygous recessive (dd)","homozygous dominant (DD)","environmentally tall"],correct_index:2,
 explanations:["Dd would have produced half dwarf progeny in a testcross.","A dd parent would itself be dwarf.","Correct. DD yields only D gametes, so every offspring is Dd (tall).","In this simple model phenotype follows genotype, not environment."]},
{difficulty:"medium",topic:"Recessiveness",question:"Since carriers (Dd) are not detectable phenotypically, recessive alleles can be identified experimentally by",
 options:["crossing potential carriers to homozygous recessive individuals","counting the number of gametes produced","examining chromosome structure under a light microscope","growing the carriers under different environmental conditions"],correct_index:0,
 explanations:["Correct. Crossing potential carriers to homozygous recessive individuals reveals hidden recessive alleles.","Gamete counts are 2 per locus regardless of hidden recessives.","A light microscope cannot reveal allelic identity.","The phenotype of a carrier does not change with environment under this simple model."]},
{difficulty:"medium",topic:"Testcross",question:"A testcross is defined as a cross between",
 options:["an organism of unknown genotype and a known homozygous recessive organism","two homozygous dominant organisms","an F1 and one of its parents only","two organisms chosen at random"],correct_index:0,
 explanations:["Correct. In a testcross an organism with an unknown genotype is crossed to a known homozygous recessive organism.","Crossing two dominants reveals nothing about recessive alleles.","An F1 crossed to a parent is a backcross, not necessarily a testcross.","Randomness is not the requirement of a testcross."]},
{difficulty:"hard",topic:"Testcross vs backcross",question:"What is the key difference between a testcross and a backcross?",
 options:["In a testcross, a homozygous recessive is always one parent; a backcross is the F1 crossed to a parent or parental genotype, with no such requirement","In a backcross, a homozygous recessive is always one parent; in a testcross it is not","Testcrosses only work in animals; backcrosses only in plants","There is no difference; the two terms are identical"],correct_index:0,
 explanations:["Correct. The testcross always uses a recessive homozygote; the backcross is defined by mating the F1 back to a parent or parental genotype.","This swaps the two definitions.","Both crosses apply to plants and animals alike.","The slides explicitly distinguish the two."]},
{difficulty:"hard",topic:"Testcross",question:"A tall pea plant testcrossed to a dwarf (dd) yields half tall and half dwarf progeny. The tall parent was",
 options:["homozygous dominant (DD)","heterozygous (Dd)","homozygous recessive (dd)","of another species"],correct_index:1,
 explanations:["DD would give all tall progeny, not 1:1.","Correct. Dd makes D and d gametes equally, so the testcross gives half tall and half dwarf.","A dd parent would itself be dwarf.","Species mixing is irrelevant in this cross."]},
{difficulty:"medium",topic:"Independent assortment",question:"Mendel derived the law of independent assortment from crosses between plants differing in",
 options:["one character only","two separate characters","only environmental treatments","exactly seven characters in a single cross"],correct_index:1,
 explanations:["A single character supports only the law of segregation.","Correct. The dihybrid crosses (two separate characters) gave the law of independent assortment.","Environment is not the basis of this law.","The seven characters were studied in separate experiments; the law's derivation used two."]},
{difficulty:"medium",topic:"Dihybrid results",question:"When the dihybrid F1 self-fertilized, the F2 generation contained",
 options:["only the two parental combinations","all four possible combinations of the two seed characteristics","only the two recombinant combinations","no seed classes worth counting"],correct_index:1,
 explanations:["Recombination produced all four, not only parental ones.","Correct. All four combinations appeared: round-yellow, round-green, wrinkled-yellow, wrinkled-green.","Restricting to recombinants only is incomplete; parental types also reappeared.","The F2 was 556 seeds in a clear ratio."]},
{difficulty:"medium",topic:"Dihybrid results",question:"The four F2 phenotypic classes of the dihybrid cross appeared in",
 options:["a completely patternless scatter","perfect 1:1:1:1 equality","a definite pattern: the 9:3:3:1 ratio","a 27:9:9:9:3:3:3:1 ratio"],correct_index:2,
 explanations:["Mendel's counts were ratio-structured, not random.","1:1:1:1 belongs to dihybrid backcrosses.","Correct. The phenotypes appeared in the definite 9:3:3:1 pattern.","The longer ratio is trihybrid, not dihybrid."]},
{difficulty:"medium",topic:"Gamete probability",question:"A dihybrid F1 (GgWw) forms the four gamete kinds GW, Gw, gW and gw at equal frequencies. The probability that any given one (say gW) is formed is",
 options:["1/4 (25%)","1/8","1/2","1/16"],correct_index:0,
 explanations:["Correct. Four equally likely gamete kinds give each a probability of 1/4.","1/8 belongs to trihybrid (eight kinds) gametes.","1/2 would require only two gamete kinds.","1/16 is an offspring genotype probability in a dihybrid F2, not a gamete frequency."]},
{difficulty:"medium",topic:"Dihybrid results",question:"The 9:3:3:1 dihybrid ratio can be viewed as",
 options:["two monohybrid 3:1 ratios operating together","three monohybrid 3:1 ratios operating together","a single random event unrelated to the 3:1 ratio","a 1:1:1:1 ratio modified by dominance"],correct_index:0,
 explanations:["Correct. (3:1)^2 expands to 9:3:3:1, i.e. two monohybrid crosses running together.","Two pairs (dihybrid), not three, give 9:3:3:1.","The ratio is a lawful prediction, not a chance event.","1:1:1:1 is the dihybrid backcross ratio, not the F2 ratio."]},
{difficulty:"medium",topic:"Probability",question:"Combining two monohybrid 3:1 ratios into 9:3:3:1 exemplifies which law of probability?",
 options:["The addition rule","The product rule","Mendel's second law of thermodynamics","The law of segregation of chance"],correct_index:1,
 explanations:["Addition applies to mutually exclusive alternative outcomes, not combined independent pairs.","Correct. The independence of two events means their probabilities multiply: the product rule.","No such term belongs here.","Segregation is a genetic rule, not a probability law of chance."]},
{difficulty:"medium",topic:"Independent assortment",question:"Because the four F1 gamete types occur in equal frequencies, Mendel concluded that members of different pairs of alleles",
 options:["assort independently into gametes","always segregate together into the same gamete","are linked on the same chromosome","are destroyed during meiosis"],correct_index:0,
 explanations:["Correct. Equal frequencies of all four combinations show the pairs assort independently.","If pairs travelled together, only GW and gw gametes would appear.","Linked genes would NOT give equal frequencies of all four gamete classes.","Meiosis preserves alleles; nothing is destroyed."]},
{difficulty:"medium",topic:"Dihybrid backcross",question:"A dihybrid backcross (F1 crossed to the parent with the full recessive combination for two genes) is expected to give what phenotypic ratio?",
 options:["9:3:3:1","1:1:1:1","3:1","27:9:9:9:3:3:3:1"],correct_index:1,
 explanations:["9:3:3:1 requires F1 x F1 (self-fertilization), not a backcross.","Correct. F1 x full-recessive gives four equal classes, 1:1:1:1.","3:1 arises from a monohybrid self-fertilization.","This is the trihybrid self-fertilization ratio."]},
{difficulty:"hard",topic:"Dihybrid inference",question:"When a 9:3:3:1 ratio results from an experiment in which the parental genotypes are NOT known, geneticists may postulate that",
 options:["two independent pairs of alleles are involved, with one member of each pair behaving as dominant","four genes on the same chromosome are involved","a trihybrid cross has taken place","the traits are controlled entirely by the environment"],correct_index:0,
 explanations:["Correct. The signature 9:3:3:1 implies two independent allele pairs with dominance at each.","A single linkage group would not give the classic 9:3:3:1 free-recombination ratio.","A trihybrid gives 27:9:9:9:3:3:3:1, not 9:3:3:1.","Environmental control would not produce a stable Mendelian ratio."]},
{difficulty:"medium",topic:"Punnett square",question:"A standard Punnett square for a dihybrid F1 x F1 cross requires how many squares?",
 options:["4","8","16","64"],correct_index:2,
 explanations:["4 squares suit a monohybrid cross.","8 is not the grid layout needed for two parents with 4 gamete kinds each.","Correct. Four gamete kinds from each parent give a 4 x 4 = 16 square Punnett grid.","64 squares would be needed for a trihybrid cross."]},
{difficulty:"medium",topic:"Application",question:"Which principle did the slides highlight as a key component in designing plant and animal breeding experiments to improve the quantity and quality of agricultural products?",
 options:["The principle of independent assortment","The germplasm theory","Preformation","Pangenesis"],correct_index:0,
 explanations:["Correct. Understanding independent assortment is central to planning breeding programmes.","The germplasm theory is historical, about what carries heredity.","Preformation is a disproved embryology theory.","Pangenesis is a disproved heredity theory."]},
{difficulty:"medium",topic:"Dihybrid results",question:"In a 9:3:3:1 dihybrid F2, the fraction expected to show BOTH dominant characters (e.g. round and yellow seeds) is",
 options:["9/16","3/16","1/16","1/4"],correct_index:0,
 explanations:["Correct. 9/16 of the F2 shows both dominant characters.","3/16 is the fraction of each single-dominant class.","1/16 is the double-recessive class.","1/4 is the immunante gamete probability, not the joint phenotype fraction."]},
{difficulty:"medium",topic:"Trihybrid cross",question:"In the worked example, the seed parent is homozygous for the genes producing tall, yellow and round vine seeds. Its genotype is",
 options:["DdGgWw","ddggww","DDggww","DDGGWW"],correct_index:3,
 explanations:["DdGgWw is the F1 genotype.","ddggww is the pollen parent (dwarf, green, wrinkled).","That mixes dominance and recessiveness inconsistently with the example.","Correct. Tall, yellow and round being dominant, the seed parent is DDGGWW."]},
{difficulty:"medium",topic:"Trihybrid cross",question:"When the trihybrid F1 (DdGgWw) is crossed with the full recessive type (ddggww), how many kinds of gametes does each parent produce?",
 options:["Eight by the F1 and one by the full recessive parent","One by each parent","Eight by each parent","Sixteen by the F1 and eight by the recessive parent"],correct_index:0,
 explanations:["Correct. The F1 makes eight gamete kinds (2^3); the full recessive makes only dgw.","The F1 is heterozygous at three loci, so it cannot make only one gamete kind.","The homozygous recessive parent produces only one gamete kind.","Sixteen kinds would correspond to four heterozygous pairs (2^4), not three."]},
{difficulty:"medium",topic:"Trihybrid gametes",question:"Which of the following is NOT among the eight gametes produced by the trihybrid F1 (DdGgWw)?",
 options:["DGW","dGw","gGw","dgw"],correct_index:2,
 explanations:["DGW is a valid gamete (one allele per locus).","dGw is a valid gamete.","Correct. A gamete cannot carry both alleles (g and G) of the same locus; gGw is impossible.","dgw is the one gamete kind the full recessive parent can produce."]},
{difficulty:"medium",topic:"Punnett square",question:"Representing a trihybrid F1 x F1 cross with a Punnett square would require how many squares?",
 options:["16","32","64","128"],correct_index:2,
 explanations:["16 squares handle a dihybrid cross.","32 is not the required grid size.","Correct. Eight gamete kinds per parent give 8 x 8 = 64 squares.","128 is not the standard count for three heterozygous pairs."]},
{difficulty:"devil",topic:"Trihybrid results",question:"The phenotypic ratio expected from a trihybrid F1 x F1 cross, where one member of each pair is dominant, is",
 options:["9:3:3:1","27:9:9:9:3:3:3:1","1:2:1","1:1:1:1"],correct_index:1,
 explanations:["9:3:3:1 belongs to the dihybrid cross.","Correct. (3:1)^3 expands to the trihybrid ratio 27:9:9:9:3:3:3:1.","1:2:1 is the monohybrid F2 genotypic ratio.","1:1:1:1 belongs to a trihybrid TESTCROSS (F1 x full recessive), not F1 x F1."]},
{difficulty:"medium",topic:"Forked-line method",question:"The forked-line method simplifies the trihybrid cross by visualising it as",
 options:["three monohybrid crosses operating together","six parallel testcrosses","a 64-square Punnett grid drawn in three dimensions","a backcross to the recessive parent"],correct_index:0,
 explanations:["Correct. DdGgWw x DdGgWw is broken into Dd x Dd, Gg x Gg and Ww x Ww combined systematically.","Testcrosses are not the basis of the forked-line method.","The whole point is to AVOID the cumbersome 64-square Punnett square.","The forked-line method represents F1 x F1 self crosses, not backcrosses."]},
{difficulty:"medium",topic:"Forked-line method",question:"Within the forked-line system, the genotypic ratio predicted for each monohybrid cross is",
 options:["3:1","1:2:1","9:3:3:1","2:2"],correct_index:1,
 explanations:["3:1 is the monohybrid PHENOTYPIC ratio, not the genotypic one.","Correct. Each monohybrid cross gives a 1:2:1 genotypic ratio (e.g. TT:Tt:tt).","9:3:3:1 is a dihybrid phenotypic ratio.","Genotypes are three (TT, Tt, tt), in a 1:2:1 ratio."]},
{difficulty:"medium",topic:"Trihybrid cross",question:"In the trihybrid cross DdGgWw x ddggww, which gamete kind does the full recessive parent contribute?",
 options:["DGW","dGW","gGw","dgw"],correct_index:3,
 explanations:["DGW is the seed parent's gamete.","dGW requires a dominant G allele, absent in the fully recessive parent.","gGw carries two alleles of one locus, impossible in a gamete.","Correct. Being fully recessive, the parent produces only the dgw gamete."]},
{difficulty:"medium",topic:"Counting formulae",question:"The number of different F2 genotypes expected from n heterozygous pairs of genes is",
 options:["2^n","3^n","4^n","2n"],correct_index:1,
 explanations:["2^n gives the number of gamete kinds or phenotypes, not genotypes.","Correct. F2 genotypes number 3 per locus, so 3^n overall.","4^n overcounts; only three genotype classes per locus arise (AA, Aa, aa).","2n is linear and wrong."]},
{difficulty:"medium",topic:"Counting formulae",question:"When dominance is present, the number of F2 phenotypes from n heterozygous pairs is",
 options:["2^n","3^n","4^n","9^n"],correct_index:0,
 explanations:["Correct. With dominance, each pair contributes 2 phenotypic classes, so 2^n phenotypes.","3^n counts genotypes, not phenotypes.","4^n would apply only without dominance at any locus.","9^n is far too large."]},
{difficulty:"medium",topic:"Counting formulae",question:"For FOUR heterozygous pairs of genes, the numbers of gamete kinds, F2 genotypes and F2 phenotypes (with dominance) are",
 options:["8, 27 and 8","16, 81 and 16","16, 64 and 8","4, 9 and 4"],correct_index:1,
 explanations:["8, 27 and 8 correspond to THREE heterozygous pairs.","Correct. 2^4 = 16 gamete kinds, 3^4 = 81 F2 genotypes and 2^4 = 16 F2 phenotypes.","81 genotypes, not 64; and 16 phenotypes, not 8.","These figures match one pair, or two pairs (4, 9, 4), not four pairs."]},
{difficulty:"hard",topic:"Trihybrid gametes",question:"Since members of different allele pairs assort independently, the eight gamete kinds of the trihybrid F1 occur",
 options:["only as DGW and dgw","in equal frequencies, 1/8 each","in ratios set by dominance alone","in a 3:1 ratio between two classes"],correct_index:1,
 explanations:["Only two kinds would mean the pairs are linked, not independent.","Correct. Independent assortment gives all eight kinds at 1/8 frequency each.","Dominance shapes phenotype expression, not gamete frequencies.","3:1 is a monohybrid phenotype expectation, not a gamete pattern."]},
{difficulty:"medium",topic:"Counting formulae",question:"Without going through the Punnett square or the forked-line, the numbers of gametes, genotypes and phenotypes expected from given heterozygous pairs can be",
 options:["measured only with a light microscope","calculated directly with simple formulae","obtained only by raising tens of thousands of plants","ignored during experimental planning"],correct_index:1,
 explanations:["Microscopy cannot deliver these counts.","Correct. The slides give direct formulae (e.g. 2^n gamete kinds, 3^n genotypes, 2^n phenotypes).","Mass propagation is unnecessary; the formulae suffice.","These counts are central to planning breeding programmes."]},
{difficulty:"hard",topic:"Chance deviation",question:"Which THREE of the four assumptions are influenced by chance events and are therefore subject to normal deviation?",
 options:["Segregation, independent assortment and random fertilization","Dominance, segregation and linkage","Only dominance and recessiveness","Independent assortment, mutation and selection"],correct_index:0,
 explanations:["Correct. The slides state the last three (segregation, independent assortment and random fertilization) are subject to chance deviation, like coin tossing.","Dominance is not listed among the chance-dependent assumptions.","Chance deviation involves more than one assumption.","Mutation and selection are not among the four assumptions given."]},
{difficulty:"medium",topic:"Chi-square analysis",question:"Mendel's 3:1 and 9:3:3:1 ratios are hypothetical predictions based on four assumptions. Which of these is NOT one of them?",
 options:["segregation","dominance and recessiveness","allelic conversion by the environment","random fertilization"],correct_index:2,
 explanations:["Segregation IS one of the four.","Dominance/recessiveness IS one of the four.","Correct. The four are dominance/recessiveness, segregation, independent assortment and random fertilization; the environment does not convert alleles.","Random fertilization IS the last of the four."]},
{difficulty:"medium",topic:"Chance deviation",question:"With the toss of four coins, which outcome is possible?",
 options:["they must land exactly 3 heads and 1 tail","exactly 500 heads, no more","the pattern must follow 9:3:3:1","all four heads, or all four tails"],correct_index:3,
 explanations:["Any outcome is possible with such a small sample; nothing forces a 3:1 split.","500 heads would need 1,000 tosses.","Coin tossing has no genetic ratio constraints.","Correct. With only four coins, all heads or all tails is possible; that is the impact of chance deviation."]},
{difficulty:"medium",topic:"Interpretation",question:"By convention, all P values between 0.05 and 1.0 in chi-square analysis are treated as",
 options:["unacceptable, and the hypothesis is always rejected","acceptable, while values BELOW 0.05 are unacceptable with respect to goodness of fit","pure guesses","certainties"],correct_index:1,
 explanations:["That is the misreading; values at 0.05 or above are acceptable.","Correct. At or above 0.05 the data fit; below 0.05 one rejects the hypothesis and deems the data unacceptable.","They are reasoned probability estimates, not guesses.","A P of 1.0 is not certainty of the hypothesis; it simply reflects low deviation."]},
{difficulty:"medium",topic:"Chance deviation",question:"A coin experiment produces 486 heads and 514 tails against an expected 500:500. The fluctuation is attributed to",
 options:["an unequal number of alleles","chance deviation","recombination","independent assortment"],correct_index:1,
 explanations:["Allele counts belong to genetics, not coin tossing.","Correct. Any fluctuation from the hypothetical ratio, such as 486:514, is attributed to chance deviation.","Recombination is not a coin-tossing concept.","Independent assortment concerns gene transmission into gametes, not coins."]},
{difficulty:"medium",topic:"Chi-square analysis",question:"The chi-square test considers the observed deviation in each component of an expected ratio together with the ____ and reduces them to a single numerical value.",
 options:["observer's patience","cost of materials","colour of each category","sample size"],correct_index:3,
 explanations:["Patience does not enter the calculation.","Cost is not an input to chi-square.","Colours are irrelevant to the computation.","Correct. Deviation data plus sample size are collapsed into a single numerical value."]},
{difficulty:"medium",topic:"Chi-square analysis",question:"Since (o - e) is the deviation (d), the chi-square equation can be reduced to",
 options:["chi^2 = sum of d^2 / e","chi^2 = sum of d / e^2","chi^2 = d^2 / (sum of e)","chi^2 = (sum of d)^2 / e"],correct_index:0,
 explanations:["Correct. Each squared deviation is divided by that class's expected value, then summed across classes.","Squaring d is correct but the position of e and the exponent here are wrong.","The sum runs over each class's d^2/e, not one pooled division of the total.","The squaring applies to each deviation before summation."]},
{difficulty:"medium",topic:"Chi-square analysis",question:"In the worked monohybrid example (740 tall and 260 dwarf out of 1,000, against expected 750 and 250), the computed chi-square value was",
 options:["0.53","4.18","0.13","0.40"],correct_index:0,
 explanations:["Correct. 100/750 (=0.13) plus 100/250 (=0.40) gives chi^2 = 0.53.","4.18 is the chi-square for the dihybrid example, not the monohybrid one.","0.13 is only the 3/4 class contribution; the dwarf class adds 0.40.","0.40 is only the 1/4 class contribution; the tall class adds 0.13."]},
{difficulty:"medium",topic:"Degrees of freedom",question:"For a 3:1 monohybrid ratio (n = 2 categories) the degrees of freedom is 1. For the 9:3:3:1 dihybrid ratio, the d/f is",
 options:["1","2","4","3"],correct_index:3,
 explanations:["One suits the monohybrid, not the four-category dihybrid.","Half the count is not used here.","Four is the number of CATEGORIES, but d/f subtracts one.","Correct. Four categories (9:3:3:1) minus one gives d/f = 3."]},
{difficulty:"medium",topic:"Chi-square analysis",question:"In the same monohybrid example, the observed tall count is 740 against an expected 750. The deviation (d = o − e) for the tall class is",
 options:["+10","0","−10 (ten short of expectation)","−100"],correct_index:2,
 explanations:["A shortfall of ten makes d negative, not positive.","The classes differ by ten; d is not zero.","Correct. 740 − 750 = −10 for the tall class.","The magnitude of deviation is 10, not 100."]},
{difficulty:"hard",topic:"Chi-square analysis",question:"In the dihybrid table, the wrinkled-yellow (3/16) class observed 166 against an expected 187 gives d = −21. What does that class contribute to chi-square?",
 options:["d/e ≈ 0.05 directly","49/63 ≈ 0.77","d² ≈ 4.18","d²/e = 441/187 ≈ 2.36"],correct_index:3,
 explanations:["Chi-square divides the SQUARED deviation by e.","0.77 is the wrinkled-green class's contribution.","4.18 is the total chi-square across all four classes.","Correct. d² = 441, so the class contributes 441/187 ≈ 2.36."]},
{difficulty:"medium",topic:"Degrees of freedom",question:"The degrees of freedom must always be considered because",
 options:["the greater the number of categories, the more deviation is expected due to chance","it determines how many gametes the parent produces","it proves the hypothesis of dominance","it fixes the sample size for the experiment"],correct_index:0,
 explanations:["Correct. More categories give more opportunities for chance deviation, so d/f contextualises chi^2.","Gamete number follows 2^n per parent, not the d/f.","Dominance is an assumption of the expected ratio, unrelated to d/f.","Sample size is chosen by the experimenter, not by d/f."]},
{difficulty:"medium",topic:"Chi-square analysis",question:"The chi-square value is converted to a corresponding probability value (P) by",
 options:["using a prepared chi-square table or graph","drawing a Punnett square","applying the product rule","using a forked-line diagram"],correct_index:0,
 explanations:["Correct. A prepared table or chart converts chi^2 (at a given d/f) into the probability P.","Punnett squares predict Mendelian ratios, not probabilities.","The product rule combined monohybrid ratios; it does not convert chi^2 to P.","Forked-line diagrams generate ratios, not probability values."]},
{difficulty:"medium",topic:"Interpretation",question:"In the worked dihybrid example, P = 0.26. Its first interpretation is that",
 options:["the probability is 26%, or about 1 in 4, that the deviation was due to chance","the hypothesis is rejected without further analysis","26% of the data points are incorrect","the experiment must be repeated 26 times"],correct_index:0,
 explanations:["Correct. P = 0.26 means a 26% (about 1 in 4) chance that the observed deviation arose by chance alone.","Rejection happens only when P falls below the conventional 0.05.","P is not the fraction of data in error.","P is a probability, not a repetition count."]},
{difficulty:"medium",topic:"Chi-square analysis",question:"In the dihybrid example, the 9/16 class observed 583 against an expected 563. The deviation d is",
 options:["−20","+400","+8","+20"],correct_index:3,
 explanations:["Observation EXCEEDS expectation here, so d is positive.","400 is d² (20 squared), not d.","8 was the deviation of the 3/16 class observed at 195.","Correct. 583 − 563 = +20."]},
{difficulty:"devil",topic:"Homework problems",question:"Homework: matings between 'creeper' chickens (shortened, deformed legs and wings) produced 775 creeper : 388 normal progeny. How should the ratio hypothesis be judged?",
 options:["The 3:1 hypothesis is unacceptable; the data fit a 2:1 ratio much better","The data fit a 3:1 ratio perfectly","The data fit a 9:3:3:1 ratio","The creeper trait must be polygenic"],correct_index:0,
 explanations:["Correct. Against 3:1 the expected counts for 1,163 progeny are about 872:291, and the huge chi-square rejects it; 2:1 predicts about 775:388, which the data match almost exactly.","3:1 predicts roughly 872 creeper : 291 normal, far from the 775:388 observed.","9:3:3:1 requires a dihybrid situation, which this single-pair mating is not.","A single phenotypic class-offset like 2:1 points to a single-locus modification, not many genes."]},
{difficulty:"medium",topic:"Assignment #2",question:"How many different gametes, F2 genotypes and F2 phenotypes can potentially be produced by an individual of genotype AaBb?",
 options:["4 gametes, 9 genotypes and 4 phenotypes","4 gametes, 4 genotypes and 4 phenotypes","8 gametes, 27 genotypes and 8 phenotypes","2 gametes, 3 genotypes and 2 phenotypes"],correct_index:0,
 explanations:["Correct. Two heterozygous pairs: 2^2 = 4 gamete kinds, 3^2 = 9 F2 genotypes and 2^2 = 4 F2 phenotypes (with dominance).","There are 3 genotype classes per locus (AA, Aa, aa), giving 9 not 4.","8, 27 and 8 correspond to three heterozygous pairs.","These figures match one heterozygous pair."]},
{difficulty:"hard",topic:"Assignment #2",question:"How many different gametes, F2 genotypes and F2 phenotypes can potentially be produced by an individual of genotype AaBB?",
 options:["4 gametes, 9 genotypes and 4 phenotypes","2 gametes, 3 genotypes and 2 phenotypes","8 gametes, 27 genotypes and 8 phenotypes","1 gamete, 1 genotype and 1 phenotype"],correct_index:1,
 explanations:["That would need two heterozygous pairs, but BB is homozygous.","Correct. Only the A locus is heterozygous (n = 1), so there are 2 gamete kinds (AB and aB), 3 F2 genotypes and 2 phenotypes.","These are figures for three heterozygous pairs.","Being fully homozygous (n = 0) would give those figures, but Aa is heterozygous."]},
{difficulty:"hard",topic:"Assignment #2",question:"For an individual of genotype AABbccDdEE, the number of heterozygous pairs is 2 (B and D). The potential kinds of gametes, F2 genotypes and F2 phenotypes are",
 options:["8, 27 and 8","4, 9 and 4","2, 3 and 2","16, 81 and 16"],correct_index:1,
 explanations:["These figures fit n = 3 heterozygous pairs, but only b and D are heterozygous here.","Correct. With n = 2 heterozygous pairs: 2^2 = 4 gamete kinds, 3^2 = 9 F2 genotypes and 2^2 = 4 phenotypes.","Those fit n = 1, but there are two heterozygous loci.","Those fit n = 4 heterozygous pairs; here only two loci are heterozygous."]},
{difficulty:"medium",topic:"Assignment #2",question:"A pure strain of Mendel\'s peas, dominant for all seven of his independently assorting genes, was testcrossed. How many different kinds of gametes could each of the parents produce?",
 options:["One kind each: the pure strain makes gametes carrying all seven dominant alleles, and the tester carries all seven recessive ones","Seven kinds each","Fourteen kinds each","Sixty-four kinds each"],correct_index:0,
 explanations:["Correct. Being fully homozygous, each parent makes exactly one gamete type (ABCDEFG or abcdefg).","Parental genotypes are entirely homozygous, so the parents cannot recombine alleles into seven kinds.","There is no allele assortment within a homozygous line, so no such doubling occurs.","64 kinds would require six heterozygous pairs."]},
{difficulty:"medium",topic:"Assignment #2",question:"(Same setup) How many different gametes could the F1 of this cross produce?",
 options:["Seven","Fourteen","Sixty-four","One hundred and twenty-eight, from 7 heterozygous pairs (2^7)"],correct_index:3,
 explanations:["That is the number of gene pairs, not the number of gamete combinations.","Seven kinds is what the pure PARENT offers for naming its phenotype, not the hybrid.","64 kinds would correspond to six heterozygous pairs.","Correct. The F1 is heterozygous at all seven loci, so it makes 2^7 = 128 gamete kinds."]},
{difficulty:"devil",topic:"Assignment #2",question:"If the F1 was testcrossed, how many phenotypes would be expected in the offspring and in what proportion?",
 options:["128 phenotypes, each appearing at 1/128 of the progeny","128 phenotypes in a 9:3:3:1 ratio","7 phenotypes, each at 1/7 of the progeny","7 phenotypes in a 3:1 ratio"],correct_index:0,
 explanations:["Correct. A testcross against the full recessive gives equal frequencies of all 2^7 = 128 phenotypic classes.","9:3:3:1 arises from self-fertilization of a dihybrid, not a testcross.","Phenotypic classes follow gamete combinations (2^7), not the number of gene pairs.","Dominance yields 2 phenotypes per locus, not 1, so total phenotypes are not 7."]},
{difficulty:"hard",topic:"Assignment #2",question:"How many genotypes would be expected in the F2 (selfing the F1 rather than testcrossing it)?",
 options:["128","2,187 (3^7)","16,384 (4^7)","14"],correct_index:1,
 explanations:["128 is the number of F1 gamete kinds or F2 phenotypes with dominance, not genotypes.","Correct. Each locus contributes 3 genotypes (AA, Aa, aa), so the F2 has 3^7 = 2,187 genotypes.","4^n would be the full Punnett-square cell count per locus without dominance collapse.","14 is just twice the number of gene pairs."]}
];
/*QUESTIONS_END*/
const C={w1:["Hmmm.","3b3 fa."],w2:["You shaa oo.","w’akyi gu hc."],w3:["You shaa pass.","bareback.","3b3 fa."],
brk:["Omo.","Ei!","Chale!","Aden?!"],rec:["Brilla!","There it is!","Back on track!","Redemption arc!"],
t1:["Almost there!","Easy kill!"],t2:["Boom!","Baam!"],t3:["Kablui!","Enemy down!"],t4:["UNSTOPPABLE!","ON FIRE!","GODLIKE!","NO MERCY!"],
hi:["I bow.","Yes boss.","One chair.","Chairman baako p3.","Teach me erh."],sc:["Do","Re","Mi","Fa","So","La","Ti","Do"]};
const GL={A:"You seized the day. Barely.",B:"Not bad. Not great.",C:"You passed. Technically.",D:"Close is not a pass.",F:"I think you should read the slides again."};
const DL={easy:"Easy",medium:"Medium",hard:"Hard",devil:"Devil Mode"};
const BADGE=`<img class="badge" src="${BADGE_SRC}" alt="The Carpe Diem: The Beauty in the Gnarly">`,BADGE_SM=`<img class="badge sm" src="${BADGE_SRC}" alt="The Carpe Diem">`;
const HEAD=()=>screen==="mode"?"":`<div class="brandbar"><img src="${MARK_SRC}" alt="CD"><span style="margin-left:0">The Carpe Diem</span><span>${esc(CONFIG.code)}</span></div>`;
const FOOT=`<div class="foot"><b>The Carpe Diem</b> &middot; The Beauty in the Gnarly<br>Powered by Kingfahd Pappoe<br>Contact: diemc290@gmail.com · WhatsApp +233 26 836 0809</div>`;
const $=document.getElementById("app"),N=Q.length;
let screen="mode",S={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const BAG=new Map(),LAST=new Map();
/* no-repeat picker: a line is not reused until every line in its pool has been shown */
const pick=a=>{let b=BAG.get(a);
 if(!b||!b.length){b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}
  if(b.length>1&&b[b.length-1]===LAST.get(a)){const t=b[0];b[0]=b[b.length-1];b[b.length-1]=t}
  BAG.set(a,b)}
 const x=b.pop();LAST.set(a,x);return x};
const grade=p=>p>=70?"A":p>=60?"B":p>=50?"C":p>=40?"D":"F";
let T=0;
function newQuiz(mode){S={mode,i:0,far:0,a:Array(N).fill(null),cs:0,ws:0,msg:"",end:0}}
const rec=()=>Math.max(1,Math.round(Q.reduce((t,q)=>t+SEC[q.difficulty],0)/60));
const clock=()=>{const r=Math.max(0,Math.ceil((S.end-Date.now())/1000));return Math.floor(r/60)+":"+String(r%60).padStart(2,"0")};
function tick(){
 if(screen!=="quiz"||!S.end)return;
 if(Date.now()>=S.end){clearInterval(T);screen="results";draw(1);return}
 const e=document.getElementById("clk");
 if(e){e.textContent=clock();e.className=S.end-Date.now()<60000?"low":""}
}
function timer(){const r=rec();return `<div class="c">${BADGE_SM}<h1>Timer</h1></div><div class="card">Recommended: <b>${r} min</b> for ${N} questions<br><span style="color:var(--dim);font-size:.85rem">Easy 40s, medium 1 min, hard 90s, devil 2 min each. Change it if you want.</span><label style="display:block;margin-top:12px">Time in minutes</label><input id="tm" type="number" min="1" step="1" value="${r}" inputmode="numeric"><div class="err" id="er"></div><button class="btn" data-a="start">Start with timer</button></div><button class="btn alt" data-a="notimer">Start with no timer</button><button class="btn alt" data-a="again">Back</button>`}
/* Feedback logic, priority per spec 8.8 */
function judge(q,ok){
 const pc=S.cs,pw=S.ws;
 if(ok){
  const n=pc+1;let t;
  if(pw>=RECOVER_MIN)t=pick(C.rec);
  else if(n>=19)t="UNBELIEVABLE!";
  else if(n>=11)t=C.sc[n-11];
  else if(n===10)t="You are just showing off at this point.";
  else if(q.difficulty==="hard"||q.difficulty==="devil")t=pick(C.hi);
  else t=n<=2?pick(C.t1):n<=4?pick(C.t2):n<=6?pick(C.t3):pick(C.t4);
  S.cs=n;S.ws=0;return t;
 }
 const n=pw+1;let t;
 if(pc>=BREAK_MIN)t=pick(C.brk);
 else if(q.difficulty==="easy"&&Math.random()<.25)t="Herh.";
 else if(n===1)t=pick(C.w1);else if(n===2)t=pick(C.w2);else if(n===3)t=pick(C.w3);
 else t="I think you should "+"really ".repeat(n-4)+"read the slides again.";
 S.ws=n;S.cs=0;return t;
}
function modes(){const h=[CONFIG.course&&`<b>${esc(CONFIG.course)}</b>`+(CONFIG.code?` (${esc(CONFIG.code)})`:""),CONFIG.lecturer&&`Lecturer: ${esc(CONFIG.lecturer)}`,CONFIG.institution&&esc(CONFIG.institution)].filter(Boolean).join("<br>");
return `<div class="c">${BADGE}<h1>The Carpe Diem</h1><div style="color:var(--dim);font-size:.85rem;letter-spacing:.1em">SEIZE THE SEMESTER</div></div><div class="card"><b>${esc(CONFIG.title)}</b><br><span style="color:var(--dim)">${esc(CONFIG.topic)}, ${N} questions</span>${h?`<div class="hdr">${h}</div>`:""}</div><button class="btn" data-a="mode" data-v="explain">Explain As I Go<small>Answer and explanation after every question</small></button><button class="btn alt" data-a="mode" data-v="exam">Exam Mode<small>No feedback until the end, then a full review</small></button>`}
function quiz(){
 const i=S.i,q=Q[i],act=i===S.far,exp=S.mode==="explain",ans=S.a[i],shown=exp&&ans!==null;
 const opts=q.options.map((t,k)=>{
  let cls="o";
  if(shown){if(k===q.correct_index)cls+=" ok";else if(k===ans)cls+=" no"}else if(ans===k)cls+=" pick";
  const lock=!act||shown;
  return `<button class="${cls}" ${lock?"disabled":""} data-a="opt" data-v="${k}"><b>${"ABCD"[k]}</b>${esc(t)}${shown?`<span class="ex">${esc(q.explanations[k])}</span>`:""}</button>`;
 }).join("");
 const canNext=act?ans!==null:true,pct=Math.round((S.far+1)/N*100);
 return `<div class="top"><span>${esc(CONFIG.topic)}</span>${S.end?`<span id="clk">${clock()}</span>`:""}<span>Question ${i+1} of ${N}</span></div><div class="bar"><i style="width:${pct}%"></i></div><span class="tag ${q.difficulty}">${DL[q.difficulty]}</span> <span style="color:var(--dim);font-size:.85rem">${esc(q.topic)}</span><div class="q">${esc(q.question)}</div>${opts}<div class="msg">${act&&shown?esc(S.msg):""}</div><div class="nav"><button class="btn alt" data-a="back" ${i===0?"disabled":""}>Back</button><button class="btn" data-a="next" ${canNext?"":"disabled"}>${i===N-1&&act?"Finish":"Next"}</button></div>`;
}
function results(){
 let s=0;S.a.forEach((a,i)=>{if(a===Q[i].correct_index)s++});
 const p=Math.round(s/N*100),g=grade(p);
 const list=Q.map((q,i)=>{const a=S.a[i],ok=a===q.correct_index;
  return `<div class="card"><span class="tag ${q.difficulty}">${DL[q.difficulty]}</span> <b style="color:${ok?"#4fd18b":"var(--red2)"}">${ok?"Correct":a===null?"Unanswered":"Wrong"}</b><div class="q">${i+1}. ${esc(q.question)}</div>`+
  q.options.map((t,k)=>`<div class="o ${k===q.correct_index?"ok":k===a?"no":""}"><b>${"ABCD"[k]}</b>${esc(t)}${k===a?" (your pick)":""}<span class="ex">${esc(q.explanations[k])}</span></div>`).join("")+`</div>`}).join("");
 return `<div class="c">${BADGE_SM}<div class="big">${g}</div><h2>${s} / ${N}, ${p}%</h2><div class="msg">${GL[g]}</div></div><button class="btn" data-a="again">Play again</button><h2>Review</h2>${list}<button class="btn" data-a="again">Play again</button>`;
}
const view=()=>screen==="mode"?modes():screen==="timer"?timer():screen==="quiz"?quiz():results();
const draw=t=>{$.innerHTML=HEAD()+view()+FOOT;if(t)scrollTo(0,0)};
function go(a,v){
 if(a==="mode"){newQuiz(v);screen="timer";draw(1);return}
 if(a==="start"){const m=parseFloat(document.getElementById("tm").value);if(!(m>0)){document.getElementById("er").textContent="Enter a time in minutes.";return}S.end=Date.now()+m*60000;clearInterval(T);T=setInterval(tick,1000);screen="quiz";draw(1);return}
 if(a==="notimer"){S.end=0;screen="quiz";draw(1);return}
 if(a==="opt"){const k=+v,i=S.i;if(i!==S.far)return;
  if(S.mode==="explain"){if(S.a[i]!==null)return;S.a[i]=k;S.msg=judge(Q[i],k===Q[i].correct_index)}else S.a[i]=k;
  draw();return}
 if(a==="back"){if(S.i>0){S.i--;draw(1)}return}
 if(a==="next"){
  if(S.i===S.far){if(S.a[S.i]===null)return;if(S.i===N-1){clearInterval(T);screen="results";draw(1);return}S.far++;S.msg=""}
  S.i++;draw(1);return}
 if(a==="again"){clearInterval(T);screen="mode";draw(1)}
}
$.onclick=e=>{const b=e.target.closest("[data-a]");if(b&&!b.disabled)go(b.dataset.a,b.dataset.v)};
draw();
</script></body></html>
