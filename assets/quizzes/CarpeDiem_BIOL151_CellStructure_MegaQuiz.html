]},{"tag":"M1·Q113","mid":"m01","difficulty":"medium","section":"Ribosomes and protein synthesis","qt":"single","source":"codex, slides 72 to 79","qc":"Where are rRNA molecules synthesised?","options":["In the rough ER","In the nucleolus","In the Golgi cisternae","In the perinuclear space"],"correct_index":1,"explanations":["The rough ER carries ribosomes but does not make rRNA.","Correct. Nucleoli are sites of synthesis of rRNA molecules.","The Golgi packages materials and does not make rRNA.","The perinuclear space is a gap between nuclear membranes."]},{"tag":"M1·Q114","mid":"m01","difficulty":"medium","section":"Ribosomes and protein synthesis","qt":"single","source":"codex, slides 54, 58","qc":"Where are ribosomal subunits assembled?","options":["In the perinuclear space of the envelope","In the lumen of the rough endoplasmic reticulum","In the cisternae of the Golgi apparatus","In the nucleolus, a region inside the nucleus"],"correct_index":3,"explanations":["The perinuclear space lies between the two nuclear membranes and is not an assembly site.","Ribosomes work on the ER surface but are assembled in the nucleolus.","The Golgi packages materials for transport and does not assemble ribosomal subunits.","Correct. The nucleolus is the site where rRNA and proteins form ribosomal subunits."]},{"tag":"M1·Q115","mid":"m01","difficulty":"hard","section":"Ribosomes and protein synthesis","qt":"single","source":"codex, slide 72","qc":"Which sequence correctly shows how a gene directs protein synthesis?","options":["mRNA is translated into DNA, then DNA is transcribed into amino acids","Amino acids are transcribed into mRNA, then mRNA is translated into DNA","DNA is translated into amino acids, then amino acids are transcribed into mRNA","DNA is transcribed into mRNA, then mRNA is translated into amino acids"],"correct_index":3,"explanations":["This reverses the flow; DNA is the source and mRNA is the message.","Proteins are the end product, not the template for mRNA or DNA.","Transcription makes mRNA from DNA first, and translation then builds the protein.","Correct. DNA is transcribed to messenger RNA, which is translated into an amino acid sequence."]},{"tag":"M1·Q116","mid":"m01","difficulty":"hard","section":"Ribosomes and protein synthesis","qt":"single","source":"codex, slide 75","qc":"Which statement about assembly of ribosomal subunits in the nucleolus is correct?","options":["rRNA made from ribosomal genes combines with ribosomal proteins that were produced in the cytoplasm","Ribosomal proteins are made inside the nucleolus, using the rRNA transcripts as their template","Messenger RNA and histone proteins assemble directly into the large and small subunits there","Complete ribosomes form in the cytosol and are then imported into the nucleolus for storage"],"correct_index":0,"explanations":["Correct. rRNA transcripts combine with ribosomal proteins made in the cytoplasm.","The ribosomal proteins are produced in the cytoplasm, and rRNA is not their template.","Subunits are made from rRNA and ribosomal proteins, not from mRNA and histones.","Subunits are assembled in the nucleolus and exported, not made in the cytosol first."]},{"tag":"M1·Q117","mid":"m01","difficulty":"hard","section":"Ribosomes and protein synthesis","qt":"single","source":"codex, slides 79, 85","qc":"A pancreatic cell secretes digestive enzymes. Which ribosomes make those enzymes?","options":["Free ribosomes floating throughout the cytosol only","Ribosomal subunits stored inside the nucleolus","Bound ribosomes attached to the endoplasmic reticulum","Ribosomes embedded in the nuclear pore annulus"],"correct_index":2,"explanations":["Free ribosomes make proteins used within the cell, not proteins for export.","The nucleolus assembles subunits; it does not make secreted proteins.","Correct. Bound ribosomes on the ER make proteins for export from the cell.","The annulus is built of nucleoporins and does not carry ribosomes that make secreted enzymes."]},{"tag":"M1·Q118","mid":"m01","difficulty":"devil","section":"Ribosomes and protein synthesis","qt":"single","source":"codex, slide 75","qc":"A drug destroys the nucleoli in a cell. What is the ultimate effect on protein production?","options":["No mRNA can be transcribed from any gene, so proteins stop at once","Free ribosomes convert into bound ribosomes, so secretion rises","Fewer ribosomal subunits form, so overall protein synthesis declines","DNA can no longer double, so chromosomes cannot condense before division"],"correct_index":2,"explanations":["The nucleolus makes rRNA and subunits; mRNA transcription from genes is not stopped by this.","Ribosome type depends on location, and losing subunits does not raise secretion.","Correct. Without nucleoli, ribosomal subunits cannot be made, so protein synthesis falls.","Nucleoli are ribosome factories and are not needed for DNA doubling or condensing."]},{"tag":"M1·Q119","mid":"m01","difficulty":"easy","section":"The endomembrane system","qt":"single","source":"codex, slides 81 to 85","qc":"What does the prefix endo mean in endomembrane?","options":["Outside","Between","Within","Around"],"correct_index":2,"explanations":["Outside would be exo. The right answer is: Within.","Between is not the meaning of endo.","Correct. Endo means within. It matches what the lecture slides state.","Around is not the meaning of endo."]},{"tag":"M1·Q120","mid":"m01","difficulty":"easy","section":"The endomembrane system","qt":"single","source":"codex, slides 81 to 85","qc":"Which organelle is part of the endomembrane system?","options":["Mitochondria","Chloroplasts","Ribosomes","Lysosomes"],"correct_index":3,"explanations":["Mitochondria are not listed in the endomembrane system.","Chloroplasts are not listed in the endomembrane system.","Ribosomes have no membrane, so they are not endomembrane organelles.","Correct. Lysosomes are part of the endomembrane system."]},{"tag":"M1·Q121","mid":"m01","difficulty":"easy","section":"The endomembrane system","qt":"single","source":"codex, slides 81 to 85","qc":"Which pair belongs to the endomembrane system together with the nuclear envelope?","options":["The mitochondria and the chloroplasts","The ribosomes and the centrioles","The nucleoli and the chromosomes","The ER and the Golgi apparatus"],"correct_index":3,"explanations":["These are not part of the endomembrane system.","Neither has an endomembrane role. The right answer is: The ER and the Golgi apparatus.","Nucleoli and chromosomes are not membranes.","Correct. The ER and Golgi are core endomembrane organelles."]},{"tag":"M1·Q122","mid":"m01","difficulty":"medium","section":"The endomembrane system","qt":"single","source":"codex, slides 81 to 85","qc":"Why is the plasma membrane counted as part of the endomembrane system?","options":["It produces ribosomal subunits for the other organelles of the system","It is continuous with the nuclear pores and the nucleolus","It carries out cellular respiration with its inner cristae","It interacts with other endomembrane organelles and exports secreted proteins"],"correct_index":3,"explanations":["Ribosomal subunits are made in the nucleolus.","The pores are in the nuclear envelope, not the plasma membrane.","Cristae belong to mitochondria. The right answer is: It interacts with other endomembrane organelles and exports secreted proteins.","Correct. It interacts with the other organelles and is the export site for secreted proteins."]},{"tag":"M1·Q123","mid":"m01","difficulty":"medium","section":"The endomembrane system","qt":"single","source":"codex, slides 81 to 85","qc":"What does the endomembrane system regulate?","options":["Light capture and carbon fixation","Protein traffic and metabolic functions","Storage of hereditary information","Construction of the cell wall"],"correct_index":1,"explanations":["These are tasks of chloroplasts. The right answer is: Protein traffic and metabolic functions.","Correct. The system regulates protein traffic and performs metabolic functions.","Hereditary information is stored in DNA in the nucleus.","The wall is made outside the plasma membrane and is not the system's described role."]},{"tag":"M1·Q124","mid":"m01","difficulty":"medium","section":"The endomembrane system","qt":"single","source":"codex, slides 81 to 85","qc":"Besides lysosomes, which membranes does the endomembrane system include?","options":["Mitochondrial, chloroplast and peroxisome membranes only","Peroxisome, ribosome and centriole membranes only","Cell wall, extracellular matrix and cytoskeleton","Nuclear envelope, ER, Golgi apparatus and plasma membrane"],"correct_index":3,"explanations":["These organelles are not listed in the system.","Ribosomes have no membrane, and peroxisomes are not listed.","These are outside the cell and are not membranes of the system.","Correct. These are the membranes listed in the endomembrane system."]},{"tag":"M1·Q125","mid":"m01","difficulty":"medium","section":"The endomembrane system","qt":"single","source":"codex, slide 85","qc":"Which statement best describes the shared job of the endomembrane system?","options":["It generates ATP through oxidative reactions in cristae","It modifies, packages and transports lipids and proteins","It stores the genetic instructions in chromosomes","It anchors the cell to its neighbours and matrix"],"correct_index":1,"explanations":["ATP production in cristae belongs to mitochondria, which are not part of the endomembrane system.","Correct. Endomembrane organelles work together to modify, package and transport lipids and proteins.","The nucleus holds chromosomes; the endomembrane system handles lipids and proteins.","Cell junctions and the extracellular matrix, not the endomembrane system, do that."]},{"tag":"M1·Q126","mid":"m01","difficulty":"hard","section":"The endomembrane system","qt":"single","source":"codex, slides 81 to 85","qc":"A secreted protein is made on bound ribosomes. Which sequence of structures does it pass through before export?","options":["Golgi apparatus, then rough ER, then plasma membrane","Rough ER, then lysosome, then plasma membrane","Rough ER, then Golgi apparatus, then plasma membrane","Nucleolus, then Golgi apparatus, then plasma membrane"],"correct_index":2,"explanations":["The order is reversed; the rough ER comes first.","Lysosomes digest materials and are not on the export route.","Correct. Secreted proteins pass from rough ER to the Golgi and then to the plasma membrane.","The nucleolus assembles ribosomal subunits and is not on the route."]},{"tag":"M1·Q127","mid":"m01","difficulty":"easy","section":"Endoplasmic reticulum","qt":"single","source":"codex, slide 86","qc":"Which type of ER has ribosomes on its surface?","options":["Smooth ER","Neither type has ribosomes","Rough ER","Only the nuclear envelope"],"correct_index":2,"explanations":["Smooth ER has no ribosomes on its surface.","Rough ER carries ribosomes. The right answer is: Rough ER.","Correct. Rough ER has ribosomes on its surface.","The ER itself can carry ribosomes; the outer nuclear membrane is continuous with it."]},{"tag":"M1·Q128","mid":"m01","difficulty":"easy","section":"Endoplasmic reticulum","qt":"single","source":"codex, slide 86","qc":"Which type of ER synthesises lipids?","options":["Rough ER","The Golgi cisternae","The nuclear pores","Smooth ER"],"correct_index":3,"explanations":["Rough ER packages proteins for secretion.","The Golgi is a separate organelle.","Pores are channels and do not synthesise lipids.","Correct. Smooth ER synthesises lipids. It matches what the lecture slides state."]},{"tag":"M1·Q129","mid":"m01","difficulty":"easy","section":"Endoplasmic reticulum","qt":"single","source":"codex, slide 86","qc":"Which ion is stored in the smooth ER?","options":["Sodium (Na⁺)","Calcium (Ca²⁺)","Chloride (Cl⁻)","Iron (Fe²⁺)"],"correct_index":1,"explanations":["Sodium is not the ion stored in the smooth ER.","Correct. The smooth ER stores Ca²⁺.","Chloride is not the ion stored in the smooth ER.","Iron is not the ion stored in the smooth ER."]},{"tag":"M1·Q130","mid":"m01","difficulty":"easy","section":"Endoplasmic reticulum","qt":"single","source":"codex, slide 86","qc":"Where do transport vesicles from the rough ER go?","options":["To the nucleolus","To the mitochondria","To the Golgi apparatus","Directly to the chloroplast"],"correct_index":2,"explanations":["The nucleolus is inside the nucleus and receives no ER vesicles.","Mitochondria are not the destination of these vesicles.","Correct. The rough ER sends transport vesicles to the Golgi.","Chloroplasts are not the destination of these vesicles."]},{"tag":"M1·Q131","mid":"m01","difficulty":"easy","section":"Endoplasmic reticulum","qt":"single","source":"codex, slide 86","qc":"The endoplasmic reticulum is best described as a network of what?","options":["Protein filaments","Cellulose fibres","Membranes and sacs","Hydrolytic enzymes"],"correct_index":2,"explanations":["Protein filaments form the cytoskeleton. The right answer is: Membranes and sacs.","Cellulose forms the plant cell wall.","Correct. The ER is a network of membranes and sacs.","Hydrolytic enzymes are found in lysosomes."]},{"tag":"M1·Q132","mid":"m01","difficulty":"medium","section":"Endoplasmic reticulum","qt":"single","source":"codex, slide 86","qc":"What does the rough ER do with proteins?","options":["It digests them with hydrolytic enzymes","It decomposes them with catalase","It stores them as pigments","It packages them for secretion"],"correct_index":3,"explanations":["Digestion is a lysosome function. The right answer is: It packages them for secretion.","Catalase is found in peroxisomes. The right answer is: It packages them for secretion.","Storing pigments is a vacuole function.","Correct. Rough ER packages proteins for secretion."]},{"tag":"M1·Q133","mid":"m01","difficulty":"medium","section":"Endoplasmic reticulum","qt":"single","source":"codex, slide 86","qc":"Liver cells exposed to the barbiturate phenobarbital expand which organelle to detoxify the drug?","options":["Rough ER","Chloroplasts","Nucleoli","Smooth ER"],"correct_index":3,"explanations":["Rough ER packages proteins for secretion.","Chloroplasts are found in plant cells, not in liver cells.","Nucleoli assemble ribosomal subunits. The right answer is: Smooth ER.","Correct. The smooth ER detoxifies drugs and poisons."]},{"tag":"M1·Q134","mid":"m01","difficulty":"medium","section":"Endoplasmic reticulum","qt":"single","source":"codex, slide 86","qc":"What else does the rough ER make besides packaging proteins?","options":["Chlorophyll for the chloroplast","ATP in its cristae","Replacement membrane","Ribosomal RNA for new subunits"],"correct_index":2,"explanations":["Chlorophyll is a pigment in chloroplasts.","Cristae belong to mitochondria. The right answer is: Replacement membrane.","Correct. Rough ER makes replacement membrane.","rRNA is made in the nucleolus."]},{"tag":"M1·Q135","mid":"m01","difficulty":"medium","section":"Endoplasmic reticulum","qt":"single","source":"codex, slide 86","qc":"All of the following are functions of the smooth ER EXCEPT which one?","options":["Synthesising lipids for new membranes","Packaging proteins into transport vesicles","Storing calcium ions inside the lumen","Detoxifying drugs and poisons in liver cells"],"correct_index":1,"explanations":["This is a smooth ER function.","Correct choice. This is a function of the rough ER.","This is a smooth ER function.","This is a smooth ER function."]},{"tag":"M1·Q136","mid":"m01","difficulty":"hard","section":"Endoplasmic reticulum","qt":"single","source":"codex, slide 86","qc":"Cell A stores calcium and detoxifies alcohol, while cell B secretes large amounts of antibody. Which ER type dominates in each?","options":["A: rough ER; B: smooth ER","A: smooth ER; B: smooth ER","A: rough ER; B: rough ER","A: smooth ER; B: rough ER"],"correct_index":3,"explanations":["This reverses the two types. The right answer is: A: smooth ER; B: rough ER.","Antibody secretion needs rough ER for packaging secreted proteins.","Calcium storage and detoxification are smooth ER functions.","Correct. Smooth ER stores Ca²⁺ and detoxifies, while rough ER packages secreted proteins."]},{"tag":"M1·Q137","mid":"m01","difficulty":"easy","section":"Golgi apparatus","qt":"single","source":"codex, slides 88 to 90","qc":"What are the flattened membrane sacs of the Golgi apparatus called?","options":["Cristae","Cisternae","Thylakoids","Lacunae"],"correct_index":1,"explanations":["Cristae are folds of the inner mitochondrial membrane.","Correct. The Golgi is a series of flattened sacs called cisternae.","Thylakoids are disks inside chloroplasts. The right answer is: Cisternae.","Lacunae are spaces in bone that house osteocytes."]},{"tag":"M1·Q138","mid":"m01","difficulty":"easy","section":"Golgi apparatus","qt":"single","source":"codex, slides 88 to 90","qc":"Which face of the Golgi apparatus receives vesicles from the ER?","options":["The cis face","The trans face","The outer face","The nuclear face"],"correct_index":0,"explanations":["Correct. The cis face receives vesicles.","The trans face ships vesicles. The right answer is: The cis face.","The Golgi faces are named cis and trans.","The Golgi faces are named cis and trans."]},{"tag":"M1·Q139","mid":"m01","difficulty":"easy","section":"Golgi apparatus","qt":"single","source":"codex, slides 88 to 90","qc":"From which face do vesicles leave the Golgi apparatus?","options":["The cis face","The inner face","The matrix face","The trans face"],"correct_index":3,"explanations":["The cis face receives vesicles. The right answer is: The trans face.","The Golgi faces are named cis and trans.","The matrix belongs to mitochondria. The right answer is: The trans face.","Correct. The trans face ships vesicles."]},{"tag":"M1·Q140","mid":"m01","difficulty":"easy","section":"Golgi apparatus","qt":"single","source":"codex, slides 88 to 90","qc":"Which organelles does the Golgi apparatus produce?","options":["Lysosomes","Mitochondria","Ribosomes","Chloroplasts"],"correct_index":0,"explanations":["Correct. The Golgi produces lysosomes. It matches what the lecture slides state.","Mitochondria divide independently within the cell.","Ribosomal subunits are assembled in the nucleolus.","Chloroplasts reproduce independently within the cell."]},{"tag":"M1·Q141","mid":"m01","difficulty":"medium","section":"Golgi apparatus","qt":"single","source":"codex, slides 88 to 90","qc":"What is the function of the Golgi apparatus?","options":["Photosynthesis in its thylakoid disks","Packaging materials for transport in vesicles","Cellular respiration in its folded cristae","Storage of calcium ions in its lumen"],"correct_index":1,"explanations":["Photosynthesis occurs in chloroplasts. The right answer is: Packaging materials for transport in vesicles.","Correct. The Golgi synthesises and packages small molecules for transport.","Respiration occurs in mitochondria. The right answer is: Packaging materials for transport in vesicles.","Calcium storage is a smooth ER function."]},{"tag":"M1·Q142","mid":"m01","difficulty":"medium","section":"Golgi apparatus","qt":"single","source":"codex, slides 88 to 90","qc":"Which statement describes vesicle traffic through the Golgi apparatus?","options":["Vesicles arrive at the trans face and leave from the cis face","Vesicles arrive at the cis face and are shipped from the trans face","Vesicles arrive and leave only at the cis face","Vesicles pass through the nucleolus before the trans face"],"correct_index":1,"explanations":["This reverses the faces. The right answer is: Vesicles arrive at the cis face and are shipped from the trans face.","Correct. The cis face receives and the trans face ships vesicles.","The trans face ships vesicles. The right answer is: Vesicles arrive at the cis face and are shipped from the trans face.","The nucleolus is not on the route."]},{"tag":"M1·Q143","mid":"m01","difficulty":"medium","section":"Golgi apparatus","qt":"single","source":"codex, slides 88 to 90","qc":"All of the following are functions of the Golgi apparatus EXCEPT which one?","options":["Packaging materials in vesicles","Producing lysosomes","Assembling ribosomal subunits","Synthesising small molecules for transport"],"correct_index":2,"explanations":["This is a Golgi function. The right answer is: Assembling ribosomal subunits.","This is a Golgi function. The right answer is: Assembling ribosomal subunits.","Correct choice. Ribosomal subunits are assembled in the nucleolus.","This is a Golgi function. The right answer is: Assembling ribosomal subunits."]},{"tag":"M1·Q144","mid":"m01","difficulty":"hard","section":"Golgi apparatus","qt":"single","source":"codex, slides 88 to 90","qc":"A vesicle carrying a secretory protein buds from the rough ER. Which statement describes its next steps?","options":["It fuses at the cis face, and contents leave from the trans face","It fuses at the trans face, and contents leave from the cis face","It bypasses the Golgi and is exported directly by the nucleolus","It enters the nucleolus first and then the cis face"],"correct_index":0,"explanations":["Correct. Vesicles arrive at the cis face and are shipped from the trans face.","This reverses the cis and trans faces.","The nucleolus has no role in export.","The nucleolus is inside the nucleus and not on the route."]},{"tag":"M1·Q145","mid":"m01","difficulty":"easy","section":"Lysosomes and vacuoles","qt":"single","source":"codex, slides 91 to 92","qc":"Which type of enzymes do lysosomes contain?","options":["Photosynthetic enzymes","Respiratory enzymes of the cristae","Hydrolytic enzymes","DNA polymerase enzymes"],"correct_index":2,"explanations":["These are associated with chloroplasts. The right answer is: Hydrolytic enzymes.","These belong to mitochondria. The right answer is: Hydrolytic enzymes.","Correct. Lysosomes contain hydrolytic enzymes. It matches what the lecture slides state.","These are not characteristic lysosome enzymes."]},{"tag":"M1·Q146","mid":"m01","difficulty":"easy","section":"Lysosomes and vacuoles","qt":"single","source":"codex, slides 91 to 92","qc":"Lysosomes carry out which process?","options":["Photosynthesis","Protein synthesis","ATP production by cristae","Intracellular digestion"],"correct_index":3,"explanations":["Photosynthesis occurs in chloroplasts. The right answer is: Intracellular digestion of materials.","Protein synthesis occurs on ribosomes. The right answer is: Intracellular digestion of materials.","This occurs in mitochondria. The right answer is: Intracellular digestion of materials.","Correct. Lysosomes carry out intracellular digestion."]},{"tag":"M1·Q147","mid":"m01","difficulty":"easy","section":"Lysosomes and vacuoles","qt":"single","source":"codex, slides 91 to 92","qc":"What do vacuoles store?","options":["Only chromosomes and ribosomal subunits","Food, water, minerals, pigments and poisons","Only ribosomal subunits and rRNA molecules","Only hydrogen peroxide and catalase"],"correct_index":1,"explanations":["Chromosomes are in the nucleus. The right answer is: Food, water, minerals, pigments and poisons.","Correct. Vacuoles store these materials. It matches what the lecture slides state.","Subunits are assembled in the nucleolus.","Hydrogen peroxide is dealt with in peroxisomes."]},{"tag":"M1·Q148","mid":"m01","difficulty":"easy","section":"Lysosomes and vacuoles","qt":"single","source":"codex, slides 91 to 92","qc":"Which vacuole stores water and ions in plant cells?","options":["The large central vacuole","The food vacuole","The contractile vacuole","The peroxisome"],"correct_index":0,"explanations":["Correct. Plants have a large central vacuole that stores water and ions.","Food vacuoles store food in some cells.","This is a different type of vacuole.","A peroxisome is not a vacuole."]},{"tag":"M1·Q149","mid":"m01","difficulty":"medium","section":"Lysosomes and vacuoles","qt":"single","source":"codex, slides 91 to 92","qc":"Which process involving lysosomes is a form of programmed cell death?","options":["Photosynthesis","Transcription","Cytokinesis","Apoptosis"],"correct_index":3,"explanations":["Photosynthesis makes sugars and is not cell death.","Transcription copies DNA to RNA. The right answer is: Apoptosis.","Cytokinesis divides the cytoplasm, not programmed death.","Correct. Lysosomes participate in programmed cell death (apoptosis)."]},{"tag":"M1·Q150","mid":"m01","difficulty":"medium","section":"Lysosomes and vacuoles","qt":"single","source":"codex, slides 91 to 92","qc":"Which pair are examples of vacuoles?","options":["Cisternae of the Golgi and cristae","Thylakoids and grana of chloroplasts","Lacunae of bone and annuli of pores","Food vacuoles and contractile vacuoles"],"correct_index":3,"explanations":["These are Golgi sacs and mitochondrial folds.","These are structures inside chloroplasts. The right answer is: Food vacuoles and contractile vacuoles.","Lacunae house osteocytes, and annuli surround nuclear pores.","Correct. These are the examples of vacuoles listed."]},{"tag":"M1·Q151","mid":"m01","difficulty":"medium","section":"Lysosomes and vacuoles","qt":"single","source":"codex, slides 91 to 92","qc":"Which organelle produces lysosomes?","options":["The nucleolus","The mitochondrion","The chloroplast in leaf cells","The Golgi apparatus"],"correct_index":3,"explanations":["The nucleolus makes ribosomal subunits. The right answer is: The Golgi apparatus.","Mitochondria make ATP. The right answer is: The Golgi apparatus.","Chloroplasts carry out photosynthesis. The right answer is: The Golgi apparatus.","Correct. The Golgi apparatus produces lysosomes."]},{"tag":"M1·Q152","mid":"m01","difficulty":"medium","section":"Lysosomes and vacuoles","qt":"single","source":"codex, slides 91 to 92","qc":"Why are lysosomes described as recycling centres of the cell?","options":["They convert light into chemical energy for reuse","They copy DNA so the cell can reuse its genes","Hydrolytic enzymes break down materials for reuse","They store water for reuse by the cell"],"correct_index":2,"explanations":["That describes photosynthesis in chloroplasts. The right answer is: Hydrolytic enzymes break down materials for reuse.","Lysosomes do not copy DNA. The right answer is: Hydrolytic enzymes break down materials for reuse.","Correct. Hydrolytic enzymes digest materials, recycling the cell's components.","Water storage is a vacuole role."]},{"tag":"M1·Q153","mid":"m01","difficulty":"medium","section":"Lysosomes and vacuoles","qt":"single","source":"codex, slides 91 to 92","qc":"All of the following are functions of lysosomes EXCEPT which one?","options":["Decomposing hydrogen peroxide with catalase","Intracellular digestion of materials","Recycling the cell's worn-out materials","Programmed cell death (apoptosis)"],"correct_index":0,"explanations":["Correct choice. Catalase and hydrogen peroxide breakdown are peroxisome functions.","This is a lysosome function. The right answer is: Decomposing hydrogen peroxide with catalase.","This is a lysosome function. The right answer is: Decomposing hydrogen peroxide with catalase.","This is a lysosome function. The right answer is: Decomposing hydrogen peroxide with catalase."]},{"tag":"M1·Q154","mid":"m01","difficulty":"hard","section":"Lysosomes and vacuoles","qt":"single","source":"codex, slides 91 to 92","qc":"A macrophage engulfs a bacterium. Which organelle supplies the enzymes to digest it?","options":["A peroxisome, using catalase to digest it","The central vacuole, storing it as a pigment","The smooth ER, detoxifying it as a drug","A lysosome from the Golgi, using hydrolytic enzymes"],"correct_index":3,"explanations":["Catalase decomposes hydrogen peroxide and does not digest bacteria.","Central vacuoles belong to plant cells and store materials.","Smooth ER detoxifies drugs and poisons and does not digest bacteria.","Correct. Lysosomes made by the Golgi digest engulfed material with hydrolytic enzymes."]},{"tag":"M1·Q155","mid":"m01","difficulty":"easy","section":"Peroxisomes","qt":"single","source":"codex, slides 89, 98","qc":"Which enzyme in peroxisomes decomposes hydrogen peroxide?","options":["Amylase","Catalase","Pepsin","DNA polymerase"],"correct_index":1,"explanations":["Amylase digests starch and is not the peroxisome enzyme named here.","Correct. Peroxisomes contain catalase, which decomposes H₂O₂.","Pepsin digests protein in the stomach.","DNA polymerase copies DNA. The right answer is: Catalase."]},{"tag":"M1·Q156","mid":"m01","difficulty":"easy","section":"Peroxisomes","qt":"single","source":"codex, slides 89, 98","qc":"Peroxisomes take part in the breakdown of which pair of molecules?","options":["Amino acids and fatty acids","Starch and cellulose","Nucleotides and ATP","Chlorophyll and phospholipids"],"correct_index":0,"explanations":["Correct. Peroxisomes help break down amino acids and fatty acids.","These are carbohydrates and are not named for peroxisomes.","These are not named as peroxisome substrates.","These are not named as peroxisome substrates."]},{"tag":"M1·Q157","mid":"m01","difficulty":"easy","section":"Peroxisomes","qt":"single","source":"codex, slides 89, 98","qc":"How do peroxisomes form?","options":["By division of pre-existing peroxisomes","By budding from the nuclear envelope","By budding from the plasma membrane","By fusion of several lysosomes"],"correct_index":0,"explanations":["Correct. Peroxisomes form by division of pre-existing peroxisomes.","They do not bud from the nucleus.","They do not form from the plasma membrane.","They do not form by fusion of lysosomes."]},{"tag":"M1·Q158","mid":"m01","difficulty":"medium","section":"Peroxisomes","qt":"single","source":"codex, slides 89, 98","qc":"Which toxic substances do peroxisomes oxidise?","options":["Glucose and glycogen","Alcohol and formaldehyde","Chlorophyll and cellulose","Calcium and sodium ions"],"correct_index":1,"explanations":["These are fuels and not toxic substances.","Correct. Peroxisomes oxidise alcohol and formaldehyde.","These are not oxidised toxins. The right answer is: Alcohol and formaldehyde.","Ions are not oxidised toxic substances."]},{"tag":"M1·Q159","mid":"m01","difficulty":"medium","section":"Peroxisomes","qt":"single","source":"codex, slides 89, 98","qc":"How do peroxisomes compare in size with lysosomes?","options":["They are larger than lysosomes","They are the same size as lysosomes","They are smaller than lysosomes","They are larger than mitochondria"],"correct_index":2,"explanations":["They are smaller. The right answer is: They are smaller than lysosomes.","They are smaller. The right answer is: They are smaller than lysosomes.","Correct. Peroxisomes are described as smaller than lysosomes.","They are smaller than lysosomes. The right answer is: They are smaller than lysosomes."]},{"tag":"M1·Q160","mid":"m01","difficulty":"medium","section":"Peroxisomes","qt":"single","source":"codex, slides 89, 98","qc":"Which toxic compound is produced during peroxisomal oxidation reactions?","options":["Chlorophyll for the chloroplast","Glycogen","Lactic acid","Hydrogen peroxide (H₂O₂)"],"correct_index":3,"explanations":["Chlorophyll is a pigment, not a by-product.","Glycogen is a carbohydrate store. The right answer is: Hydrogen peroxide (H₂O₂).","Lactic acid is not named as a peroxisome product.","Correct. Oxidation in peroxisomes produces hydrogen peroxide."]},{"tag":"M1·Q161","mid":"m01","difficulty":"hard","section":"Peroxisomes","qt":"single","source":"codex, slides 89, 98","qc":"Why must peroxisomes contain catalase?","options":["Oxidation produces toxic hydrogen peroxide, which catalase decomposes","Catalase makes the hydrogen peroxide that oxidises fatty acids","Catalase digests worn-out organelles so the cell can recycle them","Catalase builds new peroxisomes by dividing existing ones"],"correct_index":0,"explanations":["Correct. Catalase decomposes the hydrogen peroxide produced.","Catalase decomposes hydrogen peroxide; it does not make it.","That is a lysosome function. The right answer is: Oxidation produces toxic hydrogen peroxide, which catalase decomposes.","Peroxisomes divide on their own and catalase does not build them."]},{"tag":"M1·Q162","mid":"m01","difficulty":"devil","section":"Peroxisomes","qt":"single","source":"codex, slides 89, 98","qc":"After heavy alcohol intake, which organelle oxidises alcohol in liver cells, and which enzyme then handles the toxic by-product?","options":["Lysosomes oxidise it, and hydrolytic enzymes decompose the product","Peroxisomes oxidise it, and catalase decomposes the hydrogen peroxide produced","The Golgi apparatus oxidises it, and cisternae store the product","Chloroplasts oxidise it, and chlorophyll decomposes the product"],"correct_index":1,"explanations":["Lysosomes digest materials and do not oxidise alcohol.","Correct. Peroxisomes oxidise alcohol and catalase decomposes hydrogen peroxide.","The Golgi packages materials and does not oxidise alcohol.","Liver cells have no chloroplasts. The right answer is: Peroxisomes oxidise it, and catalase decomposes the hydrogen peroxide produced."]},{"tag":"M1·Q163","mid":"m01","difficulty":"easy","section":"Plant and animal cells","qt":"single","source":"codex, slides 93 to 96","qc":"Which organelle is found in plant cells only?","options":["Lysosomes","Centrioles","Desmosomes","Chloroplasts"],"correct_index":3,"explanations":["Lysosomes are listed as animal cells only.","Centrioles are listed as animal cells only.","Desmosomes are listed as animal cell structures.","Correct. Chloroplasts are listed as plant cells only."]},{"tag":"M1·Q164","mid":"m01","difficulty":"easy","section":"Plant and animal cells","qt":"single","source":"codex, slides 93 to 96","qc":"The cell wall of plant cells is made of what?","options":["Peptidoglycan","Cellulose","Chitin","Collagen"],"correct_index":1,"explanations":["Peptidoglycan is the wall material of bacteria.","Correct. The plant cell wall is made of cellulose.","Chitin is not the wall material listed for plant cells.","Collagen is a component of the animal extracellular matrix."]},{"tag":"M1·Q165","mid":"m01","difficulty":"easy","section":"Plant and animal cells","qt":"single","source":"codex, slides 93 to 96","qc":"Which pair of structures is found in animal cells only?","options":["Central vacuoles and chloroplasts","Cellulose walls and plasmodesmata","Mitochondria and ribosomes","Lysosomes and centrioles"],"correct_index":3,"explanations":["These are plant cells only. The right answer is: Lysosomes and centrioles.","These are plant cells only. The right answer is: Lysosomes and centrioles.","These are found in both plant and animal cells.","Correct. Lysosomes and centrioles are listed as animal cells only."]},{"tag":"M1·Q166","mid":"m01","difficulty":"medium","section":"Plant and animal cells","qt":"single","source":"codex, slides 93 to 96","qc":"Which structure connects neighbouring plant cells?","options":["Desmosomes","Gap junctions","Tight junctions","Plasmodesmata"],"correct_index":3,"explanations":["Desmosomes are animal cell junctions. The right answer is: Plasmodesmata.","Gap junctions are animal cell junctions.","Tight junctions are animal cell junctions.","Correct. Plasmodesmata are listed as plant cells only."]},{"tag":"M1·Q167","mid":"m01","difficulty":"medium","section":"Plant and animal cells","qt":"single","source":"codex, slides 93 to 96","qc":"Which structure is found in animal cells only?","options":["The large central vacuole","The chloroplast in leaf cells","The extracellular matrix (ECM)","The cellulose cell wall"],"correct_index":2,"explanations":["The central vacuole is plant only.","Chloroplasts are plant only. The right answer is: The extracellular matrix (ECM).","Correct. The ECM is listed as animal cells only.","The cellulose wall is plant only."]},{"tag":"M1·Q168","mid":"m01","difficulty":"medium","section":"Plant and animal cells","qt":"single","source":"codex, slides 93 to 96","qc":"All of the following are found in plant cells only EXCEPT which one?","options":["Central vacuoles","Chloroplasts","Centrioles","Plasmodesmata"],"correct_index":2,"explanations":["These are plant only. The right answer is: Centrioles.","These are plant only. The right answer is: Centrioles.","Correct choice. Centrioles are listed as animal cells only.","These are plant only. The right answer is: Centrioles."]},{"tag":"M1·Q169","mid":"m01","difficulty":"hard","section":"Plant and animal cells","qt":"single","source":"codex, slides 93 to 96","qc":"A student sees a cell with a large central vacuole, chloroplasts and a cellulose wall. Which features should she NOT expect to find in it?","options":["Centrioles and desmosomes","Plasmodesmata and a cellulose wall","A central vacuole and chloroplasts","Mitochondria and ribosomes"],"correct_index":0,"explanations":["Correct. These are listed as animal cell features.","These are plant features and fit the cell.","These are plant features and fit the cell.","These are found in both plant and animal cells."]},{"tag":"M1·Q170","mid":"m01","difficulty":"devil","section":"Plant and animal cells","qt":"multiple completion","source":"codex, slides 93 to 96","qc":"Which structures are found in BOTH plant and animal cells? 1. Mitochondria 2. Central vacuole 3. Golgi apparatus 4. Lysosomes","options":["1, 2 and 3 only","1 and 3 only","2 and 4 only","1, 3 and 4 only"],"correct_index":1,"explanations":["The central vacuole is plant only, so statement 2 cannot be included.","Correct. Mitochondria and the Golgi apparatus are in both; the central vacuole is plant only and lysosomes are listed as animal only.","The central vacuole is plant only and lysosomes are animal only, and this option omits mitochondria.","Lysosomes are listed as animal cells only, so statement 4 cannot be included."]},{"tag":"M1·Q171","mid":"m01","difficulty":"easy","section":"Mitochondria","qt":"single","source":"codex, slide 97","qc":"What is the function of mitochondria?","options":["They are the site of cellular respiration","They are the site of photosynthesis","They are the site of protein export","They detoxify drugs and poisons"],"correct_index":0,"explanations":["Correct. Mitochondria are the site of cellular respiration.","Photosynthesis occurs in chloroplasts. The right answer is: They are the site of cellular respiration.","Protein export involves the ER, Golgi and plasma membrane.","Detoxification involves the smooth ER and peroxisomes."]},{"tag":"M1·Q172","mid":"m01","difficulty":"easy","section":"Mitochondria","qt":"single","source":"codex, slide 97","qc":"How many membranes surround a mitochondrion?","options":["One, a single outer membrane","Three, including a thylakoid membrane","None, since they are free in the cytosol","Two, an outer and an inner membrane"],"correct_index":3,"explanations":["Mitochondria have a double membrane. The right answer is: Two, an outer and an inner membrane.","Thylakoids belong to chloroplasts. The right answer is: Two, an outer and an inner membrane.","Mitochondria are membrane-bound organelles. The right answer is: Two, an outer and an inner membrane.","Correct. Mitochondria have an outer and an inner membrane."]},{"tag":"M1·Q173","mid":"m01","difficulty":"easy","section":"Mitochondria","qt":"single","source":"codex, slide 97","qc":"What are the folds of the inner mitochondrial membrane called?","options":["Cisternae","Grana","Cristae","Lacunae"],"correct_index":2,"explanations":["Cisternae are Golgi sacs. The right answer is: Cristae.","Grana are stacks of thylakoids in chloroplasts.","Correct. Cristae are folds of the inner membrane.","Lacunae are bone cavities that house osteocytes."]},{"tag":"M1·Q174","mid":"m01","difficulty":"medium","section":"Mitochondria","qt":"single","source":"codex, slide 97","qc":"What is the mitochondrial matrix?","options":["The folds of the inner membrane","The outer membrane of the organelle","The fluid-filled inner compartment","The stack of thylakoid disks"],"correct_index":2,"explanations":["Those are the cristae. The right answer is: The fluid-filled inner compartment.","The matrix is inside the inner membrane.","Correct. The matrix is the fluid-filled inner compartment.","Thylakoid stacks belong to chloroplasts. The right answer is: The fluid-filled inner compartment."]},{"tag":"M1·Q175","mid":"m01","difficulty":"medium","section":"Mitochondria","qt":"single","source":"codex, slide 97","qc":"Why do cristae increase the ATP made by a mitochondrion?","options":["They make the outer membrane thicker so ATP leaks out","They increase the surface area holding ATP enzymes","They store chlorophyll to capture sunlight","They divide the matrix into many separate cells"],"correct_index":1,"explanations":["Thickness is not the reason. The right answer is: They increase the surface area holding ATP enzymes.","Correct. Cristae contain enzymes for ATP production and increase surface area.","Chlorophyll is found in chloroplasts. The right answer is: They increase the surface area holding ATP enzymes.","Cristae are folds, not separate cells."]},{"tag":"M1·Q176","mid":"m01","difficulty":"medium","section":"Mitochondria","qt":"single","source":"codex, slide 97","qc":"All of the following are true of mitochondria EXCEPT which one?","options":["They capture sunlight using chlorophyll","They have a double membrane","Cristae are folds of the inner membrane","They are the site of cellular respiration"],"correct_index":0,"explanations":["Correct choice. Chlorophyll captures sunlight in chloroplasts.","This is true. The right answer is: They capture sunlight using chlorophyll.","This is true. The right answer is: They capture sunlight using chlorophyll.","This is true. The right answer is: They capture sunlight using chlorophyll."]},{"tag":"M1·Q177","mid":"m01","difficulty":"hard","section":"Mitochondria","qt":"single","source":"codex, slide 97","qc":"A heart muscle cell needs large amounts of ATP. Which mitochondrial feature would you expect to be extensive?","options":["Cristae, which enlarge the inner membrane surface","Thylakoid stacks, which capture sunlight energy","Cisternae, which package proteins for secretion","A single smooth membrane, which stores calcium"],"correct_index":0,"explanations":["Correct. More cristae mean more surface for ATP-producing enzymes.","Thylakoids belong to chloroplasts. The right answer is: Cristae, which enlarge the inner membrane surface.","Cisternae belong to the Golgi apparatus.","Calcium storage is a smooth ER function."]},{"tag":"M1·Q178","mid":"m01","difficulty":"hard","section":"Mitochondria","qt":"single","source":"codex, slide 97","qc":"Which description lists mitochondrial structure from the outside inwards?","options":["Outer membrane, thylakoid disks, then stroma","Outer membrane, cristae-folded inner membrane, matrix","Matrix, cristae, then a single outer membrane","Cis face, cisternae of the stack, then trans face"],"correct_index":1,"explanations":["This describes a chloroplast. The right answer is: Outer membrane, cristae-folded inner membrane, matrix.","Correct. The organelle has outer and inner membranes with cristae, and the matrix inside.","This places the matrix outside and omits the inner membrane.","This describes the Golgi apparatus. The right answer is: Outer membrane, cristae-folded inner membrane, matrix."]},{"tag":"M1·Q179","mid":"m01","difficulty":"easy","section":"Chloroplasts","qt":"single","source":"codex, slide 99","qc":"Which process takes place in chloroplasts?","options":["They are the site of photosynthesis","They are the site of cellular respiration","They are the site of protein secretion","They store calcium ions"],"correct_index":0,"explanations":["Correct. Chloroplasts are the site of photosynthesis.","Respiration occurs in mitochondria. The right answer is: They are the site of photosynthesis.","Secretion involves the ER and Golgi.","Calcium storage is a smooth ER function."]},{"tag":"M1·Q180","mid":"m01","difficulty":"easy","section":"Chloroplasts","qt":"single","source":"codex, slide 99","qc":"Which pigments capture sunlight in chloroplasts?","options":["Chlorophylls","Catalase","Histones","Hydrolases"],"correct_index":0,"explanations":["Correct. Chloroplasts contain chlorophylls for capturing sunlight energy.","Catalase is an enzyme in peroxisomes.","Histones are chromatin proteins. The right answer is: Chlorophylls.","Hydrolases are enzymes in lysosomes. The right answer is: Chlorophylls."]},{"tag":"M1·Q181","mid":"m01","difficulty":"easy","section":"Chloroplasts","qt":"single","source":"codex, slide 99","qc":"How many membranes surround a chloroplast?","options":["One","Three","None","Two"],"correct_index":3,"explanations":["Chloroplasts have a double membrane. The right answer is: Two.","Chloroplasts have two membranes surrounding them.","Chloroplasts are membrane-bound organelles. The right answer is: Two.","Correct. Chloroplasts have a double membrane."]},{"tag":"M1·Q182","mid":"m01","difficulty":"medium","section":"Chloroplasts","qt":"single","source":"codex, slide 99","qc":"What are the stacks of thylakoid disks in a chloroplast called?","options":["Grana","Cristae","Cisternae","Lacunae"],"correct_index":0,"explanations":["Correct. Thylakoid disks are in stacks called grana.","Cristae are folds of the inner mitochondrial membrane.","Cisternae are Golgi sacs. The right answer is: Grana.","Lacunae are bone cavities. The right answer is: Grana."]},{"tag":"M1·Q183","mid":"m01","difficulty":"medium","section":"Chloroplasts","qt":"single","source":"codex, slide 99","qc":"What is the fluid inside a chloroplast called?","options":["The matrix","The nucleoplasm","The stroma","The cytosol"],"correct_index":2,"explanations":["The matrix is the inner compartment of the mitochondrion.","The nucleoplasm lies inside the nucleus.","Correct. The fluid of the chloroplast is the stroma.","The cytosol lies outside the organelles."]},{"tag":"M1·Q184","mid":"m01","difficulty":"hard","section":"Chloroplasts","qt":"single","source":"codex, slide 99","qc":"A leaf cell loses its chlorophyll. Which process fails, and where is the pigment normally held?","options":["Cellular respiration fails, and the pigment is in the cristae","Protein secretion fails, and the pigment is in the Golgi cisternae","Photosynthesis fails, and the pigment is in the thylakoid disks of the grana","DNA doubling fails, and the pigment is in the nucleolus"],"correct_index":2,"explanations":["Cristae belong to mitochondria and hold no chlorophyll.","The Golgi does not hold chlorophyll.","Correct. Chlorophylls capture sunlight in the thylakoids of chloroplasts.","Chlorophyll is not found in the nucleolus."]},{"tag":"M1·Q185","mid":"m01","difficulty":"easy","section":"Endosymbiont theory","qt":"single","source":"codex, slide 100","qc":"Which two organelles are thought to share a similar origin according to the endosymbiont theory?","options":["Mitochondria and chloroplasts","Lysosomes and peroxisomes","Golgi and ER","Ribosomes and nucleoli"],"correct_index":0,"explanations":["Correct. Mitochondria and chloroplasts are thought to share a similar origin.","These are not part of the endosymbiont theory.","These are endomembrane organelles, not endosymbionts.","These are not described as endosymbionts."]},{"tag":"M1·Q186","mid":"m01","difficulty":"easy","section":"Endosymbiont theory","qt":"single","source":"codex, slide 100","qc":"According to the endosymbiont theory, what engulfed the prokaryotic cells?","options":["Ancestors of viruses","Early lysosomes","Early peroxisomes","Ancestors of eukaryotic cells"],"correct_index":3,"explanations":["Viruses are not part of the theory.","Lysosomes are not described as the engulfers.","Peroxisomes are not described as the engulfers.","Correct. Prokaryotic cells were engulfed by ancestors of eukaryotic cells."]},{"tag":"M1·Q187","mid":"m01","difficulty":"easy","section":"Endosymbiont theory","qt":"single","source":"codex, slide 100","qc":"Which structural feature of mitochondria and chloroplasts is evidence for the endosymbiont theory?","options":["A single flat membrane","A double-membrane structure","A ring of nuclear pores","A cellulose wall"],"correct_index":1,"explanations":["They have double membranes. The right answer is: They have a double-membrane structure.","Correct. A double membrane is listed as evidence.","Nuclear pores belong to the nucleus.","A cellulose wall is not listed as evidence."]},{"tag":"M1·Q188","mid":"m01","difficulty":"medium","section":"Endosymbiont theory","qt":"single","source":"codex, slide 100","qc":"Which other evidence supports the endosymbiont theory?","options":["They have no DNA at all","They are produced by the Golgi apparatus","They are made of only protein","They have their own ribosomes and DNA"],"correct_index":3,"explanations":["They carry their own DNA. The right answer is: They have their own ribosomes and DNA.","Lysosomes, not these organelles, are produced by the Golgi.","They have membranes, ribosomes and DNA.","Correct. Own ribosomes and DNA are listed as evidence."]},{"tag":"M1·Q189","mid":"m01","difficulty":"medium","section":"Endosymbiont theory","qt":"single","source":"codex, slide 100","qc":"Which behaviour of mitochondria and chloroplasts supports the endosymbiont theory?","options":["They reproduce independently within the cell","They only form when the nucleus divides","They are assembled in the nucleolus","They are made by the rough ER"],"correct_index":0,"explanations":["Correct. Independent reproduction is listed as evidence.","They reproduce independently. The right answer is: They reproduce independently within the cell.","They are not assembled in the nucleolus.","They are not made by the rough ER."]},{"tag":"M1·Q190","mid":"m01","difficulty":"hard","section":"Endosymbiont theory","qt":"single","source":"codex, slide 100","qc":"All of the following support the endosymbiont theory EXCEPT which one?","options":["They have a double-membrane structure","They have a single membrane like the ER","They have their own ribosomes and DNA","They reproduce independently within the cell"],"correct_index":1,"explanations":["This is evidence for the theory.","Correct choice. They have a double-membrane structure, which supports the theory.","This is evidence for the theory.","This is evidence for the theory."]},{"tag":"M1·Q191","mid":"m01","difficulty":"easy","section":"Putting the organelles together","qt":"single","source":"codex, slides 85 to 100","qc":"Which organelle is the site of photosynthesis?","options":["The mitochondrion","The lysosome","The peroxisome","The chloroplast in leaf cells"],"correct_index":3,"explanations":["Mitochondria are the site of cellular respiration.","Lysosomes carry out intracellular digestion. The right answer is: The chloroplast in leaf cells.","Peroxisomes oxidise toxic substances and decompose hydrogen peroxide.","Correct. Chloroplasts are the site of photosynthesis."]},{"tag":"M1·Q192","mid":"m01","difficulty":"easy","section":"Putting the organelles together","qt":"single","source":"codex, slides 85 to 100","qc":"Which organelle carries out intracellular digestion?","options":["The Golgi apparatus","The mitochondrion","The nucleolus","The lysosome"],"correct_index":3,"explanations":["The Golgi packages and ships materials.","Mitochondria carry out cellular respiration. The right answer is: The lysosome.","The nucleolus assembles ribosomal subunits. The right answer is: The lysosome.","Correct. Lysosomes carry out intracellular digestion."]},{"tag":"M1·Q193","mid":"m01","difficulty":"easy","section":"Putting the organelles together","qt":"single","source":"codex, slides 89, 98","qc":"Which organelle decomposes hydrogen peroxide using catalase?","options":["The lysosome","The peroxisome","The mitochondrion","The Golgi apparatus"],"correct_index":1,"explanations":["Lysosomes carry out intracellular digestion with hydrolytic enzymes.","Correct. Peroxisomes contain catalase, which decomposes hydrogen peroxide.","Mitochondria are the site of cellular respiration.","The Golgi packages materials for transport in vesicles."]},{"tag":"M1·Q194","mid":"m01","difficulty":"medium","section":"Putting the organelles together","qt":"single","source":"codex, slides 85 to 100","qc":"Which pairing of organelle and function is correct?","options":["Rough ER: site of photosynthesis in leaf cells","Peroxisome: intracellular digestion with hydrolytic enzymes","Golgi apparatus: packaging materials for transport","Mitochondrion: assembly of ribosomal subunits"],"correct_index":2,"explanations":["Photosynthesis occurs in chloroplasts. The right answer is: Golgi apparatus: packaging materials for transport.","That describes the lysosome. The right answer is: Golgi apparatus: packaging materials for transport.","Correct. The Golgi synthesises and packages materials for transport in vesicles.","That occurs in the nucleolus. The right answer is: Golgi apparatus: packaging materials for transport."]},{"tag":"M1·Q195","mid":"m01","difficulty":"medium","section":"Putting the organelles together","qt":"single","source":"codex, slides 85 to 100","qc":"Which pair of organelles works together to prepare a secreted protein for export?","options":["The nucleolus and the chloroplast","The mitochondrion and the peroxisome","The rough ER and the Golgi apparatus","The lysosome and the central vacuole"],"correct_index":2,"explanations":["These have no role in secretion.","These do not prepare secreted proteins.","Correct. The rough ER packages proteins and the Golgi ships them onward.","These digest or store materials rather than prepare secretion."]},{"tag":"M1·Q196","mid":"m01","difficulty":"medium","section":"Putting the organelles together","qt":"single","source":"codex, slides 85 to 100","qc":"Pick the odd one out among these organelles.","options":["The rough ER","The Golgi apparatus","The lysosome","The chloroplast in leaf cells"],"correct_index":3,"explanations":["This is part of the endomembrane system.","This is part of the endomembrane system.","This is part of the endomembrane system.","Correct choice. The chloroplast is not part of the endomembrane system."]},{"tag":"M1·Q197","mid":"m01","difficulty":"hard","section":"Putting the organelles together","qt":"single","source":"codex, slides 85 to 100","qc":"Which sequence correctly traces a secreted protein from gene to export?","options":["Gene in the nucleus, mRNA, bound ribosome on rough ER, Golgi apparatus, plasma membrane","Gene in the nucleus, mRNA, free ribosome in the cytosol, Golgi apparatus, plasma membrane","Gene in the nucleus, mRNA, bound ribosome on rough ER, lysosome, plasma membrane","Gene in the nucleolus, rRNA, bound ribosome on rough ER, Golgi apparatus, plasma membrane"],"correct_index":0,"explanations":["Correct. The gene is transcribed, and the protein is made on bound ribosomes, then passes to the Golgi and the plasma membrane.","Secreted proteins are made on bound ribosomes, not free ribosomes.","The lysosome is not on the export route.","Genes for protein are transcribed to mRNA, not rRNA, in the nucleus."]},{"tag":"M1·Q198","mid":"m01","difficulty":"hard","section":"Putting the organelles together","qt":"multiple completion","source":"codex, slides 85 to 100","qc":"Which organelles contain their own DNA and ribosomes? I. Mitochondria II. Chloroplasts III. Lysosomes IV. Peroxisomes","options":["I, II and III only","II and IV only","I and II only","I, III and IV only"],"correct_index":2,"explanations":["Lysosomes do not have their own DNA and ribosomes, so statement III is wrong.","This omits mitochondria and wrongly includes peroxisomes.","Correct. Mitochondria and chloroplasts have their own ribosomes and DNA, as the endosymbiont theory notes.","Lysosomes and peroxisomes do not have their own DNA and ribosomes."]},{"tag":"M1·Q199","mid":"m01","difficulty":"hard","section":"Putting the organelles together","qt":"single","source":"codex, slides 85 to 100","qc":"Which structure is NOT enclosed by a double membrane?","options":["The nucleus","The lysosome","The mitochondrion","The chloroplast in leaf cells"],"correct_index":1,"explanations":["The nucleus has a double-membrane envelope.","Correct choice. A lysosome has a single membrane.","Mitochondria have an outer and an inner membrane.","Chloroplasts have a double membrane. The right answer is: The lysosome."]},{"tag":"M1·Q200","mid":"m01","difficulty":"devil","section":"Putting the organelles together","qt":"single","source":"codex, slide 85","qc":"Which structure is NOT part of the endomembrane system as described in the lecture?","options":["The mitochondrion, bounded by outer and inner membranes","The plasma membrane, where secreted proteins are exported","The nuclear envelope, continuous with the rough ER","The lysosome, which holds hydrolytic enzymes"],"correct_index":0,"explanations":["Correct. The lecture lists the nuclear envelope, ER, Golgi, lysosomes and plasma membrane; mitochondria are not included.","The plasma membrane is included in the endomembrane system and is where secreted proteins leave.","The nuclear envelope is listed as part of the endomembrane system.","Lysosomes are listed as part of the endomembrane system."]},{"tag":"M2·Q1","mid":"m02","difficulty":"easy","section":"Microbodies","qt":"single","source":"codex, slides 101 to 102","qc":"Which three organelles make up the microbodies?","options":["Peroxisomes, glyoxysomes and hydrogenosomes","Lysosomes, ribosomes and central vacuoles","Mitochondria, chloroplasts and the nucleus","Golgi bodies, ER and transport vesicles"],"correct_index":0,"explanations":["Correct. Microbodies consist of peroxisomes, glyoxysomes and hydrogenosomes.","These are not the three microbody types listed.","These are not microbodies. The right answer is: Peroxisomes, glyoxysomes and hydrogenosomes.","These belong to the endomembrane system, not the microbodies."]},{"tag":"M2·Q2","mid":"m02","difficulty":"easy","section":"Microbodies","qt":"single","source":"codex, slides 101 to 102","qc":"How many membranes bound a microbody?","options":["A single membrane","A double membrane","Three membranes","No membrane at all"],"correct_index":0,"explanations":["Correct. Microbodies are bounded by a single membrane.","A double membrane surrounds mitochondria and chloroplasts.","No microbody has three membranes. The right answer is: A single membrane.","Microbodies are membrane-bounded vesicle-like organelles. The right answer is: A single membrane."]},{"tag":"M2·Q3","mid":"m02","difficulty":"easy","section":"Microbodies","qt":"single","source":"codex, slides 101 to 102","qc":"Microbodies are concerned largely with which process?","options":["Oxidation","Photosynthesis","Translation","DNA replication"],"correct_index":0,"explanations":["Correct. Microbodies are concerned largely with oxidation.","Photosynthesis occurs in chloroplasts. The right answer is: Oxidation.","Translation takes place on ribosomes. The right answer is: Oxidation.","DNA replication occurs in the nucleus."]},{"tag":"M2·Q4","mid":"m02","difficulty":"medium","section":"Microbodies","qt":"single","source":"codex, slides 101 to 102","qc":"In which vertebrate organs are microbodies found?","options":["The liver and kidneys","The skin and hair follicles","The bones and cartilage","The heart and lungs"],"correct_index":0,"explanations":["Correct. Microbodies are found in the liver and kidneys of vertebrates.","These are not named as microbody sites.","These are not named as microbody sites.","These are not named as microbody sites."]},{"tag":"M2·Q5","mid":"m02","difficulty":"medium","section":"Microbodies","qt":"single","source":"codex, slides 101 to 102","qc":"Which description fits microbodies?","options":["Large uniform organelles bounded by a double membrane","Small vesicle-like organelles bounded by a single membrane","Membraneless granules that assemble ribosomal subunits","Flattened sacs that package and ship proteins for secretion"],"correct_index":1,"explanations":["Microbodies are small, varied and single-membrane.","Correct. They are a heterogeneous group of small vesicle-like organelles with one membrane.","Microbodies have a membrane and do not assemble ribosomes.","That describes the Golgi apparatus. The right answer is: Small vesicle-like organelles bounded by a single membrane."]},{"tag":"M2·Q6","mid":"m02","difficulty":"medium","section":"Microbodies","qt":"single","source":"codex, slides 101 to 102","qc":"Microbodies are found in all of the following EXCEPT which one?","options":["The leaves and seeds of plants","The cell wall of bacteria","Protozoa and yeasts","The liver of vertebrates"],"correct_index":1,"explanations":["They are found in plant leaves and seeds.","Correct choice. Microbodies are organelles and are not found in the bacterial cell wall.","They are found in protozoa, yeasts and other fungi.","They are found in the liver of vertebrates."]},{"tag":"M2·Q7","mid":"m02","difficulty":"hard","section":"Microbodies","qt":"single","source":"codex, slides 101 to 102","qc":"Which feature distinguishes microbodies from mitochondria and chloroplasts?","options":["They produce ATP by photosynthesis in light","They have a single bounding membrane","They contain cristae and a matrix inside","They are found only in bacteria and archaea"],"correct_index":1,"explanations":["Photosynthesis occurs in chloroplasts. The right answer is: They have a single bounding membrane.","Correct. Microbodies are single-membrane vesicle-like organelles.","Cristae and matrix are mitochondrial features.","Microbodies occur in eukaryotes such as plants, fungi and vertebrates."]},{"tag":"M2·Q8","mid":"m02","difficulty":"hard","section":"Microbodies","qt":"single","source":"codex, slides 101 to 102","qc":"A cell biologist isolates small, oval, single-membrane vesicles from liver tissue that mainly carry out oxidation. Which group do they belong to?","options":["Mitochondria","Microbodies","Chloroplasts","Golgi cisternae"],"correct_index":1,"explanations":["Mitochondria have double membranes and carry out respiration.","Correct. Microbodies are small oxidative vesicles found in liver and kidney.","Chloroplasts occur in plants and have double membranes.","Golgi cisternae are flattened sacs that package materials."]},{"tag":"M2·Q9","mid":"m02","difficulty":"easy","section":"Peroxisomes: enzymes and reactions","qt":"single","source":"codex, slides 103 to 105","qc":"About how many enzymes do peroxisomes contain, according to the lecture?","options":["About 50","About 5","About 500","About 5,000"],"correct_index":0,"explanations":["Correct. The lecture says peroxisomes contain about 50 enzymes.","This is far too few. The right answer is: About 50.","This is ten times too many.","This is far too many. The right answer is: About 50."]},{"tag":"M2·Q10","mid":"m02","difficulty":"easy","section":"Peroxisomes: enzymes and reactions","qt":"single","source":"codex, slides 103 to 105","qc":"Peroxisomes are morphologically similar to which other organelle?","options":["Mitochondria","Lysosomes","Chloroplasts","The nucleus"],"correct_index":1,"explanations":["Mitochondria have double membranes and cristae.","Correct. Peroxisomes look similar to lysosomes.","Chloroplasts have thylakoids and double membranes.","The nucleus has a double envelope with pores."]},{"tag":"M2·Q11","mid":"m02","difficulty":"easy","section":"Peroxisomes: enzymes and reactions","qt":"single","source":"codex, slides 103 to 105","qc":"Which substrate is broken down by oxidative reactions in peroxisomes?","options":["Uric acid","Starch","Cellulose","Chlorophyll"],"correct_index":0,"explanations":["Correct. Uric acid is among the substrates oxidised in peroxisomes.","Starch is not named as a peroxisome substrate.","Cellulose is not named as a peroxisome substrate.","Chlorophyll is a pigment and not a peroxisome substrate."]},{"tag":"M2·Q12","mid":"m02","difficulty":"easy","section":"Peroxisomes: enzymes and reactions","qt":"single","source":"codex, slides 103 to 105","qc":"Which enzyme converts urate into allantoin, CO₂ and H₂O₂?","options":["Urate oxidase","Catalase","Pepsin","Amylase"],"correct_index":0,"explanations":["Correct. Urate oxidase catabolises urate to allantoin, CO₂ and H₂O₂.","Catalase decomposes hydrogen peroxide. The right answer is: Urate oxidase.","Pepsin digests proteins in the stomach.","Amylase digests starch. The right answer is: Urate oxidase."]},{"tag":"M2·Q13","mid":"m02","difficulty":"medium","section":"Peroxisomes: enzymes and reactions","qt":"single","source":"codex, slides 103 to 105","qc":"Which three enzymes are named as peroxisome enzymes in the lecture?","options":["Pepsin, amylase and lipase of the gut","DNA polymerase, helicase and DNA ligase","Urate oxidase, D-amino acid oxidase and catalase","ATP synthase, cytochrome c and NADH dehydrogenase"],"correct_index":2,"explanations":["These are digestive enzymes of the gut.","These are DNA replication enzymes. The right answer is: Urate oxidase, D-amino acid oxidase and catalase.","Correct. These three enzymes are named in peroxisomes.","These are respiratory chain components of mitochondria."]},{"tag":"M2·Q14","mid":"m02","difficulty":"medium","section":"Peroxisomes: enzymes and reactions","qt":"single","source":"codex, slides 103 to 105","qc":"What can catalase convert hydrogen peroxide into?","options":["Glucose","Methane","Hydrogen gas","Water"],"correct_index":3,"explanations":["Catalase does not make glucose. The right answer is: Water.","Catalase does not make methane. The right answer is: Water.","Catalase does not make hydrogen gas.","Correct. Catalase converts hydrogen peroxide to water, or uses it to oxidise another compound."]},{"tag":"M2·Q15","mid":"m02","difficulty":"medium","section":"Peroxisomes: enzymes and reactions","qt":"single","source":"codex, slides 103 to 105","qc":"Which peroxisomal process provides a major source of metabolic energy?","options":["Photosynthesis in thylakoids","Digestion by hydrolases","Oxidation of fatty acids","Transcription of rRNA"],"correct_index":2,"explanations":["Photosynthesis occurs in chloroplasts. The right answer is: Oxidation of fatty acids.","Hydrolytic digestion is a lysosome function.","Correct. Fatty acid oxidation is a major source of metabolic energy.","rRNA is made in the nucleolus."]},{"tag":"M2·Q16","mid":"m02","difficulty":"medium","section":"Peroxisomes: enzymes and reactions","qt":"single","source":"codex, slides 103 to 105","qc":"Where are fatty acids oxidised in animal cells?","options":["Only in peroxisomes of the cell","In both peroxisomes and mitochondria","Only in the mitochondria of the cell","Only in lysosomes of the cell"],"correct_index":1,"explanations":["In animal cells mitochondria also oxidise fatty acids.","Correct. In animal cells fatty acids are oxidised in both organelles.","Peroxisomes also oxidise fatty acids in animal cells.","Lysosomes digest materials and do not oxidise fatty acids."]},{"tag":"M2·Q17","mid":"m02","difficulty":"medium","section":"Peroxisomes: enzymes and reactions","qt":"single","source":"codex, slides 103 to 105","qc":"In which organisms is fatty acid oxidation restricted to peroxisomes?","options":["Humans and mice","Bacteria and archaea","Yeasts and plants","Birds and fish"],"correct_index":2,"explanations":["In animal cells both peroxisomes and mitochondria oxidise fatty acids.","Prokaryotes do not have peroxisomes. The right answer is: Yeasts and plants.","Correct. In yeasts and plants fatty acid oxidation is restricted to peroxisomes.","These are animals, where mitochondria also oxidise fatty acids."]},{"tag":"M2·Q18","mid":"m02","difficulty":"medium","section":"Peroxisomes: enzymes and reactions","qt":"single","source":"codex, slides 103 to 105","qc":"All of the following are substrates broken down by peroxisomal oxidation EXCEPT which one?","options":["Uric acid from purine breakdown","Amino acids such as D-amino acids","Cellulose from plant cell walls","Fatty acids from stored lipids"],"correct_index":2,"explanations":["Uric acid is a named substrate.","Amino acids are named substrates. The right answer is: Cellulose from plant cell walls.","Correct choice. Cellulose is not named as a peroxisomal substrate.","Fatty acids are named substrates. The right answer is: Cellulose from plant cell walls."]},{"tag":"M2·Q19","mid":"m02","difficulty":"hard","section":"Peroxisomes: enzymes and reactions","qt":"single","source":"codex, slides 103 to 105","qc":"Which statement correctly links each peroxisomal enzyme to its role?","options":["Catalase breaks down urate, urate oxidase acts on amino acids, and D-amino acid oxidase disposes of hydrogen peroxide","D-amino acid oxidase breaks down urate, catalase acts on amino acids, and urate oxidase disposes of hydrogen peroxide","Urate oxidase disposes of hydrogen peroxide, catalase acts on amino acids, and D-amino acid oxidase breaks down urate","Urate oxidase breaks down urate, D-amino acid oxidase acts on amino acids, and catalase disposes of hydrogen peroxide"],"correct_index":3,"explanations":["These roles are swapped. The right answer is: Urate oxidase breaks down urate, D-amino acid oxidase acts on amino acids, and catalase disposes of hydrogen peroxide.","These roles are swapped. The right answer is: Urate oxidase breaks down urate, D-amino acid oxidase acts on amino acids, and catalase disposes of hydrogen peroxide.","These roles are swapped. The right answer is: Urate oxidase breaks down urate, D-amino acid oxidase acts on amino acids, and catalase disposes of hydrogen peroxide.","Correct. Each enzyme has the role stated."]},{"tag":"M2·Q20","mid":"m02","difficulty":"hard","section":"Peroxisomes: enzymes and reactions","qt":"single","source":"codex, slides 103 to 105","qc":"A yeast cell with defective peroxisomes cannot grow on fatty acids as its only fuel. Why?","options":["Yeasts oxidise fatty acids equally in mitochondria, so a defect would not matter","Fatty acids are digested only by lysosomes in yeasts","Fatty acid oxidation is restricted to peroxisomes in yeasts","Catalase is the only enzyme that can oxidise fatty acids"],"correct_index":2,"explanations":["In yeasts the oxidation is restricted to peroxisomes.","Lysosomes do not oxidise fatty acids.","Correct. Without peroxisomes the yeast cannot oxidise fatty acids.","Catalase decomposes hydrogen peroxide and does not oxidise fatty acids."]},{"tag":"M2·Q21","mid":"m02","difficulty":"easy","section":"Glyoxysomes","qt":"single","source":"codex, slides 106 to 107","qc":"In which kind of cells are glyoxysomes found?","options":["Human liver cells","Bacterial cells","Animal muscle cells","Some plant cells"],"correct_index":3,"explanations":["Glyoxysomes are plant microbodies. The right answer is: Some plant cells.","Bacteria do not have glyoxysomes. The right answer is: Some plant cells.","Glyoxysomes are plant microbodies. The right answer is: Some plant cells.","Correct. Glyoxysomes are found in some plant cells."]},{"tag":"M2·Q22","mid":"m02","difficulty":"easy","section":"Glyoxysomes","qt":"single","source":"codex, slides 106 to 107","qc":"A glyoxysome is a specialised form of which organelle?","options":["Lysosome","Mitochondrion","Golgi apparatus","Peroxisome"],"correct_index":3,"explanations":["Lysosomes are a different organelle. The right answer is: Peroxisome.","Mitochondria have a double membrane. The right answer is: Peroxisome.","The Golgi is a stack of cisternae.","Correct. A glyoxysome is a specialised form of peroxisome."]},{"tag":"M2·Q23","mid":"m02","difficulty":"easy","section":"Glyoxysomes","qt":"single","source":"codex, slides 106 to 107","qc":"Glyoxysomes are notably found in the cells of what?","options":["Mature leaves","Germinating seeds","Root hairs","Dead cork tissue"],"correct_index":1,"explanations":["The lecture names germinating seeds. The right answer is: Germinating seeds.","Correct. Glyoxysomes are notable in germinating seeds.","The lecture names germinating seeds. The right answer is: Germinating seeds.","Cork consists of dead cell walls."]},{"tag":"M2·Q24","mid":"m02","difficulty":"medium","section":"Glyoxysomes","qt":"single","source":"codex, slides 106 to 107","qc":"Glyoxysomes contain the enzymes of which cycle?","options":["The glyoxylate cycle","The Calvin cycle","The urea cycle","The cell cycle"],"correct_index":0,"explanations":["Correct. Glyoxysomes contain the enzymes of the glyoxylate cycle.","The Calvin cycle belongs to photosynthesis.","The urea cycle is not named for glyoxysomes.","The cell cycle describes cell division."]},{"tag":"M2·Q25","mid":"m02","difficulty":"medium","section":"Glyoxysomes","qt":"single","source":"codex, slides 106 to 107","qc":"The glyoxylate cycle is a variant of which cycle?","options":["The Calvin cycle","The urea cycle","The cell cycle","The citric acid cycle"],"correct_index":3,"explanations":["The Calvin cycle is a separate pathway.","The urea cycle is a separate pathway.","The cell cycle is not a metabolic cycle.","Correct. It is a variant of the citric acid cycle."]},{"tag":"M2·Q26","mid":"m02","difficulty":"medium","section":"Glyoxysomes","qt":"single","source":"codex, slides 106 to 107","qc":"What does the glyoxylate cycle allow plants to convert?","options":["Stored lipids into carbohydrates","Stored carbohydrates into lipids","Stored proteins into new DNA strands","Light energy into ATP in thylakoids"],"correct_index":0,"explanations":["Correct. Stored lipids are converted to carbohydrates.","This reverses the conversion. The right answer is: Stored lipids into carbohydrates.","This is not what the cycle does.","This describes photosynthesis. The right answer is: Stored lipids into carbohydrates."]},{"tag":"M2·Q27","mid":"m02","difficulty":"hard","section":"Glyoxysomes","qt":"single","source":"codex, slides 106 to 107","qc":"A germinating seed must move energy from fat reserves to growing tissues. How do glyoxysomes help?","options":["They convert sugars into immobile fats for later storage","They digest the seed coat with hydrolytic enzymes","They convert immobile fat reserves into transportable sugars","They capture sunlight to make sugars inside the seed"],"correct_index":2,"explanations":["This reverses the direction of conversion.","Digesting the coat is not their role.","Correct. Fat reserves become sugars that can be transported to growing tissues.","Glyoxysomes do not capture light. The right answer is: They convert immobile fat reserves into transportable sugars."]},{"tag":"M2·Q28","mid":"m02","difficulty":"devil","section":"Glyoxysomes","qt":"single","source":"codex, slides 106 to 107","qc":"Which sequence describes what happens to seed fats in glyoxysomes?","options":["Fats form succinate, the cycle gives acetyl CoA, and acetyl CoA goes to mitochondria for gluconeogenesis","Fats form acetyl CoA, the glyoxylate cycle gives succinate, and succinate goes to mitochondria for gluconeogenesis","Fats form glucose, glucose gives acetyl CoA, and acetyl CoA is stored in the nucleus","Fats form acetyl CoA, which goes straight to chloroplasts for photosynthesis"],"correct_index":1,"explanations":["Acetyl CoA feeds the cycle and succinate is the product.","Correct. This is the sequence given in the lecture.","This does not follow the glyoxylate pathway.","Succinate goes to mitochondria, not chloroplasts."]},{"tag":"M2·Q29","mid":"m02","difficulty":"easy","section":"Hydrogenosomes","qt":"single","source":"codex, slide 108","qc":"Which gas does a hydrogenosome release as a by-product?","options":["Molecular hydrogen (H₂)","Oxygen","Methane","Nitrogen"],"correct_index":0,"explanations":["Correct. Hydrogenosomes release molecular hydrogen. It matches what the lecture slides state.","Oxygen is not the by-product. The right answer is: Molecular hydrogen (H₂).","Methane is produced by some archaea, not by hydrogenosomes.","Nitrogen is not the by-product. The right answer is: Molecular hydrogen (H₂)."]},{"tag":"M2·Q30","mid":"m02","difficulty":"easy","section":"Hydrogenosomes","qt":"single","source":"codex, slide 108","qc":"Hydrogenosomes are found in which kind of cells?","options":["All aerobic bacterial cells","Some anaerobic eukaryotic cells","Only plant leaf mesophyll cells","Only mature red blood cells"],"correct_index":1,"explanations":["They are found in eukaryotes. The right answer is: Some anaerobic eukaryotic cells.","Correct. They occur in some anaerobic eukaryotes.","They are not limited to plants.","Red blood cells lack organelles like these."]},{"tag":"M2·Q31","mid":"m02","difficulty":"medium","section":"Hydrogenosomes","qt":"single","source":"codex, slide 108","qc":"Under which condition do hydrogenosomes release hydrogen during energy generation?","options":["Bright light and high temperatures","High oxygen levels and abundant air","Freezing temperatures and darkness","Anaerobic, oxygen-deficient conditions"],"correct_index":3,"explanations":["Light is not the condition. The right answer is: Anaerobic, oxygen-deficient conditions.","Oxygen-rich conditions are not the setting.","Temperature is not the condition named.","Correct. Hydrogen release occurs under anaerobic conditions."]},{"tag":"M2·Q32","mid":"m02","difficulty":"medium","section":"Hydrogenosomes","qt":"single","source":"codex, slide 108","qc":"Which groups are listed as having hydrogenosomes?","options":["Cyanobacteria, archaea and spirochetes","Ciliates, trichomonads, fungi and animals","Mosses, ferns and flowering plants","Viruses, prions, viroids and phages"],"correct_index":1,"explanations":["These are prokaryotes without hydrogenosomes. The right answer is: Ciliates, trichomonads, fungi and animals.","Correct. Hydrogenosomes occur in some of each group.","These plant groups are not listed.","These are not cells. The right answer is: Ciliates, trichomonads, fungi and animals."]},{"tag":"M2·Q33","mid":"m02","difficulty":"hard","section":"Hydrogenosomes","qt":"single","source":"codex, slide 108","qc":"Which statement about hydrogenosomes is correct?","options":["They are double-membrane organelles that release O₂ during photosynthesis","They are membrane-enclosed organelles that release H₂ under anaerobic conditions","They are membraneless granules that store nutrients in bacteria","They are single-membrane organelles that digest cell debris at pH 5"],"correct_index":1,"explanations":["This describes chloroplasts. The right answer is: They are membrane-enclosed organelles that release H₂ under anaerobic conditions.","Correct. This summarises the lecture definition.","This describes inclusion granules. The right answer is: They are membrane-enclosed organelles that release H₂ under anaerobic conditions.","This describes lysosomes. The right answer is: They are membrane-enclosed organelles that release H₂ under anaerobic conditions."]},{"tag":"M2·Q34","mid":"m02","difficulty":"easy","section":"Lysosomes: formation, enzymes and pH","qt":"single","source":"codex, slides 109 to 111","qc":"Where are lysosomes formed?","options":["In the Golgi complex","In the nucleolus","In the mitochondrion","In the chloroplast"],"correct_index":0,"explanations":["Correct. Lysosomes are formed in the Golgi complex.","The nucleolus assembles ribosomal subunits. The right answer is: In the Golgi complex.","Mitochondria make ATP. The right answer is: In the Golgi complex.","Chloroplasts carry out photosynthesis. The right answer is: In the Golgi complex."]},{"tag":"M2·Q35","mid":"m02","difficulty":"easy","section":"Lysosomes: formation, enzymes and pH","qt":"single","source":"codex, slides 109 to 111","qc":"What are lysosomes filled with?","options":["Chlorophyll","Ribosomal RNA","Digestive enzymes","Hydrogen gas"],"correct_index":2,"explanations":["Chlorophyll is found in chloroplasts. The right answer is: Digestive enzymes.","rRNA is found in the nucleolus and ribosomes.","Correct. Lysosomes are filled with digestive enzymes.","Hydrogen is released by hydrogenosomes. The right answ
