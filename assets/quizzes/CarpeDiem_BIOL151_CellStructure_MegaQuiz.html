er is: Digestive enzymes."]},{"tag":"M2·Q36","mid":"m02","difficulty":"easy","section":"Lysosomes: formation, enzymes and pH","qt":"single","source":"codex, slides 109 to 111","qc":"What internal pH do lysosomes reach?","options":["About 7.0","About 9.0","About 2.0","About 5.0"],"correct_index":3,"explanations":["This is neutral and not the lysosomal pH.","This is alkaline and not the lysosomal pH.","This is too acidic. The right answer is: About 5.0.","Correct. Lysosomes pump in H⁺ until the internal pH reaches about 5.0."]},{"tag":"M2·Q37","mid":"m02","difficulty":"easy","section":"Lysosomes: formation, enzymes and pH","qt":"single","source":"codex, slides 109 to 111","qc":"Roughly how many hydrolytic enzymes do lysosomes contain?","options":["About 6","About 600","About 60","About 6,000"],"correct_index":2,"explanations":["This is far too few. The right answer is: About 60.","This is ten times too many.","Correct. Lysosomes contain about 60 hydrolytic enzymes.","This is far too many. The right answer is: About 60."]},{"tag":"M2·Q38","mid":"m02","difficulty":"easy","section":"Lysosomes: formation, enzymes and pH","qt":"single","source":"codex, slides 109 to 111","qc":"Which ions do lysosomes pump in to reach their internal pH?","options":["Na⁺ ions","Ca²⁺ ions","Cl⁻ ions","H⁺ ions"],"correct_index":3,"explanations":["Sodium is not the ion pumped in.","Calcium is stored in the smooth ER.","Chloride is not the ion pumped in.","Correct. Protons are pumped in until the pH is about 5.0."]},{"tag":"M2·Q39","mid":"m02","difficulty":"easy","section":"Lysosomes: formation, enzymes and pH","qt":"single","source":"codex, slides 109 to 111","qc":"What do lysosomes do to foreign substances?","options":["They store them as pigments","They oxidise them using catalase","They digest them","They export them from the cell"],"correct_index":2,"explanations":["Pigment storage is a vacuole function.","Catalase is found in peroxisomes. The right answer is: They digest them.","Correct. Lysosomes digest foreign substances. It matches what the lecture slides state.","Export involves the Golgi and plasma membrane."]},{"tag":"M2·Q40","mid":"m02","difficulty":"medium","section":"Lysosomes: formation, enzymes and pH","qt":"single","source":"codex, slides 109 to 111","qc":"Which pump moves protons into the lysosome?","options":["A porin in the outer membrane","A calcium channel in the smooth ER","A nucleoporin in the nuclear pore","An H⁺-ATPase in the lysosome membrane"],"correct_index":3,"explanations":["Porins are bacterial channels. The right answer is: An H⁺-ATPase in the lysosome membrane.","This is not the proton pump.","Nucleoporins form pores in the nuclear envelope.","Correct. The H⁺-ATPase pumps protons into the lysosome."]},{"tag":"M2·Q41","mid":"m02","difficulty":"medium","section":"Lysosomes: formation, enzymes and pH","qt":"single","source":"codex, slides 109 to 111","qc":"What does the internal pH of about 5.0 do?","options":["It destroys the lysosomal membrane","It activates the lysosomal enzymes","It stops hydrolysis completely","It makes the lysosome permeable to enzymes"],"correct_index":1,"explanations":["The membrane resists digestion. The right answer is: It activates the lysosomal enzymes.","Correct. The acidic pH activates the lysosomal enzymes.","The pH activates the enzymes. The right answer is: It activates the lysosomal enzymes.","The membrane is impermeable to the enzymes."]},{"tag":"M2·Q42","mid":"m02","difficulty":"medium","section":"Lysosomes: formation, enzymes and pH","qt":"single","source":"codex, slides 109 to 111","qc":"What does autolysis mean for lysosomes?","options":["They digest bacteria taken in by phagocytes","They are formed by the Golgi complex","They release hydrogen under anaerobic conditions","They recycle the cell's own organelles"],"correct_index":3,"explanations":["That is heterophagy. The right answer is: They recycle the cell's own organelles.","That describes lysosome formation. The right answer is: They recycle the cell's own organelles.","That describes hydrogenosomes. The right answer is: They recycle the cell's own organelles.","Correct. Autolysis is the recycling of the cell's own organelles."]},{"tag":"M2·Q43","mid":"m02","difficulty":"medium","section":"Lysosomes: formation, enzymes and pH","qt":"single","source":"codex, slides 109 to 111","qc":"What does the lecture say happens to lysosomes after cell death?","options":["Lysosomal damage occurs after death","Lysosomes multiply after death","Lysosomes turn into peroxisomes","Lysosomes remain unchanged"],"correct_index":0,"explanations":["Correct. The lecture notes lysosomal damage after death.","They are damaged, not multiplied. The right answer is: Lysosomal damage occurs after death.","There is no such conversion. The right answer is: Lysosomal damage occurs after death.","The lecture notes damage after death."]},{"tag":"M2·Q44","mid":"m02","difficulty":"medium","section":"Lysosomes: formation, enzymes and pH","qt":"single","source":"codex, slides 109 to 111","qc":"Lysosomes are described as what kind of structures?","options":["Membrane-bound vesicles","Membraneless granules","Double-membrane organelles","Protein filaments"],"correct_index":0,"explanations":["Correct. Lysosomes are membrane-bound vesicles. It matches what the lecture slides state.","Lysosomes have a membrane. The right answer is: Membrane-bound vesicles.","Lysosomes have a single membrane. The right answer is: Membrane-bound vesicles.","Filaments belong to the cytoskeleton. The right answer is: Membrane-bound vesicles."]},{"tag":"M2·Q45","mid":"m02","difficulty":"medium","section":"Lysosomes: formation, enzymes and pH","qt":"single","source":"codex, slides 109 to 111","qc":"All of the following are true of lysosomes EXCEPT which one?","options":["They are formed in the Golgi complex","They are filled with digestive enzymes","They are formed in the nucleolus","They pump H⁺ ions until the pH reaches 5.0"],"correct_index":2,"explanations":["This is true. The right answer is: They are formed in the nucleolus.","This is true. The right answer is: They are formed in the nucleolus.","Correct choice. Lysosomes are formed in the Golgi complex.","This is true. The right answer is: They are formed in the nucleolus."]},{"tag":"M2·Q46","mid":"m02","difficulty":"hard","section":"Lysosomes: formation, enzymes and pH","qt":"single","source":"codex, slides 109 to 111","qc":"A lysosome has a defective H⁺-ATPase. Why would it fail to digest material?","options":["Without proton pumping the lysosome membrane dissolves in its own enzymes","Without proton pumping the lysosome cannot form in the Golgi complex","Without proton pumping the pH does not fall to about 5.0, so the enzymes stay inactive","Without proton pumping the hydrolases move out into the cytosol"],"correct_index":2,"explanations":["The membrane resists digestion by the hydrolases.","Formation in the Golgi does not depend on this pump.","Correct. The enzymes are activated by the acidic pH.","The membrane is normally impermeable to the enzymes."]},{"tag":"M2·Q47","mid":"m02","difficulty":"hard","section":"Lysosomes: formation, enzymes and pH","qt":"single","source":"codex, slides 109 to 111","qc":"Which sequence is correct for a lysosome?","options":["The hydrolases become active, the H⁺-ATPase acidifies it, and the Golgi then forms it","The nucleolus forms it, catalase acidifies it, and the hydrolases become active","The Golgi forms it, the H⁺-ATPase acidifies it to about pH 5, and the hydrolases become active","The ER forms it, the porins acidify it, and the hydrolases become active"],"correct_index":2,"explanations":["The order is reversed. The right answer is: The Golgi forms it, the H⁺-ATPase acidifies it to about pH 5, and the hydrolases become active.","The nucleolus and catalase are not involved.","Correct. Formation, acidification and enzyme activation follow this order.","Porins are bacterial channels. The right answer is: The Golgi forms it, the H⁺-ATPase acidifies it to about pH 5, and the hydrolases become active."]},{"tag":"M2·Q48","mid":"m02","difficulty":"easy","section":"Lysosomal digestion pathways","qt":"single","source":"codex, slides 110 to 112","qc":"Digestion of material that enters from outside the cell is called what?","options":["Autophagy","Apoptosis","Heterophagy","Endocytosis"],"correct_index":2,"explanations":["Autophagy is degradation of intracellular material.","Apoptosis is programmed cell death. The right answer is: Heterophagy.","Correct. Digestion of extracellular material is heterophagy.","Endocytosis is the uptake of material into the cell."]},{"tag":"M2·Q49","mid":"m02","difficulty":"easy","section":"Lysosomal digestion pathways","qt":"single","source":"codex, slides 110 to 112","qc":"What is it called when lysosomes break down the cell's own components?","options":["Autophagy","Heterophagy","Transcription","Exocytosis"],"correct_index":0,"explanations":["Correct. Degradation of intracellular material is autophagy.","Heterophagy is digestion of extracellular material.","Transcription copies DNA into RNA. The right answer is: Autophagy.","Exocytosis releases material from the cell."]},{"tag":"M2·Q50","mid":"m02","difficulty":"easy","section":"Lysosomal digestion pathways","qt":"single","source":"codex, slides 110 to 112","qc":"What does an endosome fuse with to form a secondary lysosome?","options":["A peroxisome","A mitochondrion","A primary lysosome","A chloroplast"],"correct_index":2,"explanations":["Peroxisomes are not the fusion partner.","Mitochondria are not the fusion partner.","Correct. An endosome fuses with a primary lysosome.","Chloroplasts are not the fusion partner."]},{"tag":"M2·Q51","mid":"m02","difficulty":"medium","section":"Lysosomal digestion pathways","qt":"single","source":"codex, slides 110 to 112","qc":"What are phagocytic vesicles also called?","options":["Phagosomes","Endosomes","Cisternae","Thylakoids"],"correct_index":0,"explanations":["Correct. Phago "The membrane does not freely pass large proteins."]},{"tag":"M2·Q55","mid":"m02","difficulty":"hard","section":"Lysosomal digestion pathways","qt":"single","source":"codex, slides 110 to 112","qc":"Which statement about the lysosomal membrane is NOT true?","options":["It is readily digested by the hydrolases inside the lysosome","It is normally impermeable to the enzymes and their substrates","It is freely permeable to low molecular weight products of hydrolysis","It resists digestion by the lysosomal hydrolases"],"correct_index":0,"explanations":["Correct choice. The membrane is resistant to digestion by the lysosomal hydrolases.","This is true. The right answer is: It is readily digested by the hydrolases inside the lysosome.","This is true. The right answer is: It is readily digested by the hydrolases inside the lysosome.","This is true. The right answer is: It is readily digested by the hydrolases inside the lysosome."]},{"tag":"M2·Q56","mid":"m02","difficulty":"hard","section":"Lysosomal digestion pathways","qt":"single","source":"codex, slides 110 to 112","qc":"A phagocytic vesicle fuses with a primary lysosome. What forms, and what does it allow?","options":["A primary lysosome, allowing synthesis of new enzymes","A secondary lysosome, allowing digestion of the ingested material","A glyoxysome, allowing conversion of fats into sugars","A hydrogenosome, allowing release of hydrogen"],"correct_index":1,"explanations":["The product is a secondary lysosome that digests.","Correct. Fusion forms a secondary lysosome where digestion occurs.","Glyoxysomes are plant microbodies. The right answer is: A secondary lysosome, allowing digestion of the ingested material.","Hydrogenosomes are different organelles. The right answer is: A secondary lysosome, allowing digestion of the ingested material."]},{"tag":"M2·Q57","mid":"m02","difficulty":"devil","section":"Lysosomal digestion pathways","qt":"single","source":"codex, slides 110 to 112","qc":"Which pathway describes digestion after receptor-mediated endocytosis?","options":["Coated vesicle, endosome, fusion to a secondary lysosome, then products enter the cytosol","Coated vesicle, secondary lysosome, endosome, then fusion with a primary lysosome","Endosome, coated vesicle, peroxisome, then absorption into the nucleus","Phagosome, glyoxysome, hydrogenosome, then release from the cell"],"correct_index":0,"explanations":["Correct. This is the pathway in the lecture.","The endosome comes before the secondary lysosome.","Peroxisomes and the nucleus are not on this pathway.","These organelles are not on the pathway."]},{"tag":"M2·Q58","mid":"m02","difficulty":"easy","section":"Lysosomes in disease","qt":"single","source":"codex, slides 113 to 116","qc":"Which condition results from inhaling silica particles into the lungs?","options":["Asbestosis","Black lung disease","Silicosis","Tay-Sachs disease"],"correct_index":2,"explanations":["Asbestosis results from inhaling asbestos fibres.","Black lung disease results from inhaling coal dust.","Correct. Silicosis results from inhaling silica particles.","Tay-Sachs disease is a genetic lysosomal disorder."]},{"tag":"M2·Q59","mid":"m02","difficulty":"easy","section":"Lysosomes in disease","qt":"single","source":"codex, slides 113 to 116","qc":"Asbestosis is caused by breathing in what?","options":["Silica particles","Coal dust","Pollen grains","Asbestos fibres"],"correct_index":3,"explanations":["That causes silicosis. The right answer is: Asbestos fibres.","That causes black lung disease. The right answer is: Asbestos fibres.","Pollen is not the cause named.","Correct. Asbestosis is caused by breathing in asbestos fibres."]},{"tag":"M2·Q60","mid":"m02","difficulty":"easy","section":"Lysosomes in disease","qt":"single","source":"codex, slides 113 to 116","qc":"Black lung disease is caused by breathing in what?","options":["Asbestos fibres","Coal dust","Silica particles","Smoke from wood fires"],"correct_index":1,"explanations":["That causes asb ,{"tag":"M2·Q82","mid":"m02","difficulty":"hard","section":"Prokaryotes and eukaryotes compared","qt":"single","source":"codex, slides 126 to 128","qc":"A hot spring sample contains a single-celled organism with a wall, no nucleus and no peptidoglycan. How is it classified?","options":["Bacteria","Archaea","Fungi","Protista"],"correct_index":1,"explanations":["Bacterial walls contain peptidoglycan. The right answer is: Archaea.","Correct. Archaea are prokaryotes without peptidoglycan that live in extreme places.","Fungi are eukaryotes with a nucleus.","Protists are eukaryotes with a nucleus."]},{"tag":"M2·Q83","mid":"m02","difficulty":"hard","section":"Prokaryotes and eukaryotes compared","qt":"single","source":"codex, slides 126 to 128","qc":"Which statement correctly compares prokaryotes and eukaryotes?","options":["Prokaryotes enclose DNA in a nucleus, while eukaryotes have a nucleoid","Prokaryotes have nucleoid DNA without histones, eukaryotes have a nucleus","Both enclose all their DNA in a double-membrane nucleus","Both wrap their DNA around histones inside nucleoli"],"correct_index":1,"explanations":["The two are swapped. The right answer is: Prokaryotes have nucleoid DNA without histones, eukaryotes have a nucleus.","Correct. This matches the lecture comparison.","Prokaryotes have no nucleus. The right answer is: Prokaryotes have nucleoid DNA without histones, eukaryotes have a nucleus.","Prokaryotes lack histone-wrapped DNA and nucleoli."]},{"tag":"M2·Q84","mid":"m02","difficulty":"easy","section":"Inside the bacterial cell","qt":"single","source":"codex, slides 130 to 135","qc":"Which structure is common to all bacterial cells?","options":["Capsules","Ribosomes","Endospores","Flagella"],"correct_index":1,"explanations":["Capsules are found in only some bacteria.","Correct. Ribosomes are common to all bacterial cells.","Endospores are made by only a few bacteria.","Flagella are found in only some bacteria."]},{"tag":"M2·Q85","mid":"m02","difficulty":"easy","section":"Inside the bacterial cell","qt":"single","source":"codex, slides 130 to 135","qc":"What is the shape of the bacterial chromosome?","options":["Several linear strands of DNA","A single circular strand of DNA","A set of 46 rod-shaped chromosomes","A ring of histone proteins only"],"correct_index":1,"explanations":["It is a circular strand. The right answer is: A single circular strand of DNA.","Correct. The bacterial chromosome is a single circular strand.","That describes human chromosomes. The right answer is: A single circular strand of DNA.","DNA is not wrapped around histones."]},{"tag":"M2·Q86","mid":"m02","difficulty":"easy","section":"Inside the bacterial cell","qt":"single","source":"codex, slides 130 to 135","qc":"What is the dense area where bacterial DNA aggregates called?","options":["The nucleolus","The nuclear envelope","The nucleoid","The matrix"],"correct_index":2,"explanations":["The nucleolus is a eukaryotic structure.","Bacteria have no nuclear envelope. The right answer is: The nucleoid.","Correct. Bacterial DNA aggregates in the nucleoid.","The matrix is the inner mitochondrial compartment."]},{"tag":"M2·Q87","mid":"m02","difficulty":"easy","section":"Inside the bacterial cell","qt":"single","source":"codex, slides 130 to 135","qc":"About how much of bacterial cytoplasm is water?","options":["7 to 8 percent","About 20 percent","Nearly 100 percent","70 to 80 percent"],"correct_index":3,"explanations":["This is far too low. The right answer is: 70 to 80 percent.","This is too low. The right answer is: 70 to 80 percent.","The cytoplasm also contains solutes and masses.","Correct. Cytoplasm is 70 to 80 percent water."]},{"tag":"M2·Q88","mid":"m02","difficulty":"easy","section":"Inside the bacterial cell","qt":"single","source":"codex, slides 130 to 135","qc":"Plasmids are small circles of what?","options":["Protein","DNA","Lipid","Cellulose"],"correct_index":1,"explanations":["Plasmids are DNA, not protein. The right answer is: DNA.","Correct. Plasmids are circles of DNA.","Plasmids are DNA, not lipid. The right answer is: DNA.","Plasmids are DNA, not cellulose. The right answer is: DNA."]},{"tag":"M2·Q89","mid":"m02","difficulty":"medium","section":"Inside the bacterial cell","qt":"single","source":"codex, slides 130 to 135","qc":"Plasmids often confer which protective trait?","options":["A nucleus","Photosynthesis in chloroplasts","Drug resistance","A double membrane"],"correct_index":2,"explanations":["Prokaryotes have no nucleus. The right answer is: Drug resistance.","Prokaryotes have no chloroplasts. The right answer is: Drug resistance.","Correct. Plasmids often confer drug resistance.","Plasmids do not provide a double membrane."]},{"tag":"M2·Q90","mid":"m02","difficulty":"medium","section":"Inside the bacterial cell","qt":"single","source":"codex, slides 130 to 135","qc":"How are plasmids passed from one bacterium to another?","options":["In mitosis","By osmosis","By photosynthesis","In conjugation"],"correct_index":3,"explanations":["Bacteria do not undergo mitosis. The right answer is: In conjugation.","Osmosis is movement of water. The right answer is: In conjugation.","Photosynthesis is not a transfer process.","Correct. Plasmids are passed on in conjugation."]},{"tag":"M2·Q91","mid":"m02","difficulty":"medium","section":"Inside the bacterial cell","qt":"single","source":"codex, slides 130 to 135","qc":"What is the role of inclusion bodies in bacteria?","options":["They make ATP using their cristae","They assemble ribosomal subunits","They hold the chromosome inside a nucleus","They store nutrients for times of depletion"],"correct_index":3,"explanations":["Bacteria have no cristae. The right answer is: They store nutrients for times of depletion.","Ribosomal subunits are assembled in the nucleolus of eukaryotes.","Bacteria have no nucleus. The right answer is: They store nutrients for times of depletion.","Correct. Inclusions act as a storehouse."]},{"tag":"M2·Q92","mid":"m02","difficulty":"medium","section":"Inside the bacterial cell","qt":"single","source":"codex, slides 130 to 135","qc":"Which statement about granules is correct?","options":["They are membrane-bound organelles with hydrolytic enzymes","They are circular DNA that confers resistance","They are inclusions of inorganic crystals with no membrane","They are thick coats of polysaccharide on the cell"],"correct_index":2,"explanations":["That describes lysosomes. The right answer is: They are inclusions of inorganic crystals with no membrane.","That describes plasmids. The right answer is: They are inclusions of inorganic crystals with no membrane.","Correct. Granules are not enclosed by membranes.","That describes capsules. The right answer is: They are inclusions of inorganic crystals with no membrane."]},{"tag":"M2·Q93","mid":"m02","difficulty":"medium","section":"Inside the bacterial cell","qt":"multiple completion","source":"codex, slides 130 to 135","qc":"Which statements about bacterial plasmids are correct? 1. They are circles of DNA. 2. They carry about 5 to 100 genes. 3. They are essential for the survival of every bacterium. 4. They can be passed on in conjugation.","options":["1 and 2 only","1, 2 and 4 only","2, 3 and 4 only","1, 3 and 4 only"],"correct_index":1,"explanations":["This leaves out statement 4, which is also correct.","Correct. Statements 1, 2 and 4 are true; plasmids are nonessential, so statement 3 is false.","Statement 3 is false and this option omits statement 1.","Statement 3 is false because plasmids are nonessential."]},{"tag":"M2·Q94","mid":"m02","difficulty":"hard","section":"Inside the bacterial cell","qt":"single","source":"codex, slides 130 to 135","qc":"All of the following are found in only SOME bacteria EXCEPT which one?","options":["Flagella","Ribosomes","Capsules","Endospores"],"correct_index":1,"explanations":["Flagella are found in only some bacteria.","Correct choice. Ribosomes are found in all bacteria.","Capsules are found in only some bacteria.","Endospores are made by a small number of bacteria."]},{"tag":"M2·Q95","mid":"m02","difficulty":"hard","section":"Inside the bacterial cell","qt":"single","source":"codex, slides 130 to 135","qc":"Some aquatic bacteria float near the surface. Which structure explains this?","options":["Granules of inorganic crystals, which add weight","Plasmids carrying drug resistance","Capsules that anchor the cell to rocks","Gas vesicles in inclusions, which provide buoyancy"],"correct_index":3,"explanations":["Granules do not provide buoyancy. The right answer is: Gas vesicles in inclusions, which provide buoyancy.","Plasmids do not provide flotation. The right answer is: Gas vesicles in inclusions, which provide buoyancy.","Capsules help adhesion, not flotation. The right answer is: Gas vesicles in inclusions, which provide buoyancy.","Correct. Gas vesicles provide buoyancy and flotation."]},{"tag":"M2·Q96","mid":"m02","difficulty":"easy","section":"Glycocalyx, capsule and slime layer","qt":"single","source":"codex, slides 136 to 138","qc":"What is a glycocalyx?","options":["A ring of DNA that carries drug resistance","A dormant tough structure made in soil bacteria","A tube used to transfer DNA between cells","A coating of repeating polysaccharide, protein, or both"],"correct_index":3,"explanations":["That describes a plasmid. The right answer is: A coating of repeating polysaccharide, protein, or both.","That describes an endospore. The right answer is: A coating of repeating polysaccharide, protein, or both.","That describes a pilus. The right answer is: A coating of repeating polysaccharide, protein, or both.","Correct. A glycocalyx is a coating of polysaccharide, protein or both."]},{"tag":"M2·Q97","mid":"m02","difficulty":"easy","section":"Glycocalyx, capsule and slime layer","qt":"single","source":"codex, slides 136 to 138","qc":"A loose shield that protects bacteria from loss of water and nutrients is called what?","options":["A slime layer","A capsule","An endospore","A flagellum"],"correct_index":0,"explanations":["Correct. A loose shield is a slime layer.","A capsule is more tightly bound, denser and thicker.","An endospore is a dormant structure.","A flagellum is a motility appendage."]},{"tag":"M2·Q98","mid":"m02","difficulty":"easy","section":"Glycocalyx, capsule and slime layer","qt":"single","source":"codex, slides 136 to 138","qc":"A dense, thick glycocalyx tightly bound to the bacterial cell is called what?","options":["A slime layer","A plasmid","A capsule","A granule"],"correct_index":2,"explanations":["A slime layer is a loose shield.","A plasmid is a circle of DNA.","Correct. A tightly bound dense glycocalyx is a capsule.","A granule is an inclusion of crystals."]},{"tag":"M2·Q99","mid":"m02","difficulty":"easy","section":"Glycocalyx, capsule and slime layer","qt":"single","source":"codex, slides 136 to 138","qc":"Which bacterium's slime layer helps it accumulate on tooth enamel?","options":["Escherichia coli","Mycoplasma","Streptococcus mutans","Corynebacterium diphtheriae"],"correct_index":2,"explanations":["E. coli is not the example given.","Mycoplasmas lack a cell wall and are not the example.","Correct. S. mutans forms a slime layer that builds up on tooth enamel.","This is named for envelope interaction with tissue, not dental plaque."]},{"tag":"M2·Q100","mid":"m02","difficulty":"medium","section":"Glycocalyx, capsule and slime layer","qt":"single","source":"codex, slides 136 to 138","qc":"Glycocalyces are important in the formation of what?","options":["Chloroplasts","Nuclear pores","Biofilms","Lysosomes"],"correct_index":2,"explanations":["Bacteria have no chloroplasts. The right answer is: Biofilms.","Bacteria have no nucleus. The right answer is: Biofilms.","Correct. Glycocalyces take part in biofilm formation.","Bacteria have no lysosomes. The right answer is: Biofilms."]},{"tag":"M2·Q101","mid":"m02","difficulty":"medium","section":"Glycocalyx, capsule and slime layer","qt":"single","source":"codex, slides 136 to 138","qc":"Streptococcus mutans slime on tooth enamel contributes to which condition?","options":["Silicosis","Tay-Sachs disease","Dental plaque and cavities","Black lung disease"],"correct_index":2,"explanations":["Silicosis results from inhaled silica. The right answer is: Dental plaque and cavities.","Tay-Sachs is a lysosomal genetic disorder.","Correct. The slime builds plaque that contributes to cavities.","Black lung results from coal dust."]},{"tag":"M2·Q102","mid":"m02","difficulty":"medium","section":"Glycocalyx, capsule and slime layer","qt":"single","source":"codex, slides 136 to 138","qc":"What is a bacterial capsule composed of?","options":["Phospholipids embedded with porin proteins","Circular DNA carrying 5 to 100 genes","Hollow tubes made of flagellin protein","Polysaccharides firmly attached to the cell wall"],"correct_index":3,"explanations":["That describes a membrane. The right answer is: Polysaccharides firmly attached to the cell wall.","That describes a plasmid. The right answer is: Polysaccharides firmly attached to the cell wall.","That is not the capsule composition.","Correct. A capsule is composed of polysaccharides attached to the wall."]},{"tag":"M2·Q103","mid":"m02","difficulty":"medium","section":"Glycocalyx, capsule and slime layer","qt":"multiple completion","source":"codex, slides 136 to 138","qc":"Which are roles of a bacterial capsule? 1. Protection from phagocytosis. 2. Adhesion to surfaces. 3. Transfer of plasmids. 4. Formation of endospores.","options":["1 and 3 only","2 and 4 only","3 and 4 only","1 and 2 only"],"correct_index":3,"explanations":["Plasmid transfer is a pilus role, so statement 3 is not a capsule role.","Endospore formation is not a capsule role.","Statements 3 and 4 are not capsule roles.","Correct. Capsules protect against phagocytosis and help bacteria adhere to surfaces."]},{"tag":"M2·Q104","mid":"m02","difficulty":"hard","section":"Glycocalyx, capsule and slime layer","qt":"single","source":"codex, slides 136 to 138","qc":"How do a slime layer and a capsule differ?","options":["The capsule is a loose shield, while the slime layer is tightly bound and thick","The slime layer contains DNA, while the capsule contains only lipid","The slime layer is found only in archaea, while the capsule is found in humans","The slime layer is a loose shield, while the capsule is more tightly bound, denser and thicker"],"correct_index":3,"explanations":["This swaps the two. The right answer is: The slime layer is a loose shield, while the capsule is more tightly bound, denser and thicker.","Neither is defined this way. The right answer is: The slime layer is a loose shield, while the capsule is more tightly bound, denser and thicker.","Both are bacterial surface coats. The right answer is: The slime layer is a loose shield, while the capsule is more tightly bound, denser and thicker.","Correct. This is the distinction in the lecture."]},{"tag":"M2·Q105","mid":"m02","difficulty":"devil","section":"Glycocalyx, capsule and slime layer","qt":"single","source":"codex, slides 136 to 138","qc":"A capsule-deficient mutant is cleared faster by phagocytes and adheres poorly to surfaces. Which pair of capsule roles explains both observations?","options":["Storage of nutrients and release of hydrogen","Transfer of plasmids and swimming movement","Protection from phagocytosis and adhesion to surfaces","Formation of spores and digestion of waste"],"correct_index":2,"explanations":["These are not capsule roles. The right answer is: Protection from phagocytosis and adhesion to surfaces.","These are pilus and flagellum roles.","Correct. Capsules protect from phagocytes and help bacteria adhere.","These are not capsule roles. The right answer is: Protection from phagocytosis and adhesion to surfaces."]},{"tag":"M2·Q106","mid":"m02","difficulty":"easy","section":"Endospores","qt":"single","source":"codex, slide 139","qc":"What is an endospore?","options":["A circular piece of extra bacterial DNA","A dormant, tough, non-reproductive structure","A tube that transfers DNA between cells","A coating of repeating polysaccharide"],"correct_index":1,"explanations":["That describes a plasmid. The right answer is: A dormant, tough, non-reproductive structure.","Correct. An endospore is a dormant tough structure that does not reproduce.","That describes a pilus. The right answer is: A dormant, tough, non-reproductive structure.","That describes a glycocalyx. The right answer is: A dormant, tough, non-reproductive structure."]},{"tag":"M2·Q107","mid":"m02","difficulty":"easy","section":"Endospores","qt":"single","source":"codex, slide 139","qc":"Endospores are produced by what?","options":["All bacteria","A small number of bacteria","Only archaea","Only fungi"],"correct_index":1,"explanations":["Only a few make endospores. The right answer is: A small number of bacteria.","Correct. Only a small number of bacteria make endospores.","Endospores are made by some bacteria.","Endospores are made by bacteria. The right answer is: A small number of bacteria."]},{"tag":"M2·Q108","mid":"m02","difficulty":"easy","section":"Endospores","qt":"single","source":"codex, slide 139","qc":"Where are endospores commonly found?","options":["Only inside lysosomes","Only inside the nucleus","In soil and water","Only in germinating seeds"],"correct_index":2,"explanations":["They are bacterial structures. The right answer is: In soil and water.","Bacteria have no nucleus. The right answer is: In soil and water.","Correct. Endospores are found in soil and water.","They are bacterial, not plant. The right answer is: In soil and water."]},{"tag":"M2·Q109","mid":"m02","difficulty":"medium","section":"Endospores","qt":"single","source":"codex, slide 139","qc":"Endospores are resistant to which enzyme?","options":["Catalase","Amylase","Pepsin","Lysozyme"],"correct_index":3,"explanations":["Catalase is not named. The right answer is: Lysozyme.","Amylase is not named. The right answer is: Lysozyme.","Pepsin is not named. The right answer is: Lysozyme.","Correct. Endospores resist lysozyme. It matches what the lecture slides state."]},{"tag":"M2·Q110","mid":"m02","difficulty":"medium","section":"Endospores","qt":"single","source":"codex, slide 139","qc":"Why are endospores called non-reproductive?","options":["A dormant survival form, not a way to make cells","They always produce two cells at once","They transfer DNA to other living cells","They are made only by dead bacterial cells"],"correct_index":0,"explanations":["Correct. They allow survival, not reproduction.","That describes binary fission. The right answer is: A dormant survival form, not a way to make cells.","That describes conjugation. The right answer is: A dormant survival form, not a way to make cells.","They are produced by living bacteria."]},{"tag":"M2·Q111","mid":"m02","difficulty":"hard","section":"Endospores","qt":"single","source":"codex, slide 139","qc":"A food sample treated with a chemical disinfectant still contains viable bacteria after heating. Which structure best explains survival?","options":["Endospores","Slime layers","Plasmids","Fimbriae"],"correct_index":0,"explanations":["Correct. Endospores resist disinfectants, heat and starvation.","A slime layer only shields from loss of water and nutrients.","Plasmids carry genes but do not protect against disinfectants.","Fimbriae help adhesion. The right answer is: Endospores."]},{"tag":"M2·Q112","mid":"m02","difficulty":"easy","section":"Prokaryotic cytoskeleton and ribosomes","qt":"single","source":"codex, slides 140 to 141","qc":"What do bacterial ribosomes make?","options":["Proteins","Lipids","Cellulose","DNA"],"correct_index":0,"explanations":["Correct. Ribosomes carry out protein synthesis.","Lipids are made elsewhere. The right answer is: Proteins.","Cellulose is made in plants. The right answer is: Proteins.","DNA is made by polymerases. The right answer is: Proteins."]},{"tag":"M2·Q113","mid":"m02","difficulty":"easy","section":"Prokaryotic cytoskeleton and ribosomes","qt":"single","source":"codex, slides 140 to 141","qc":"How many subunits make up a prokaryotic ribosome?","options":["One","Three","Two","Four"],"correct_index":2,"explanations":["It has two subunits. The right answer is: Two.","It has two subunits. The right answer is: Two.","Correct. A prokaryotic ribosome has two subunits.","It has two subunits. The right answer is: Two."]},{"tag":"M2·Q114","mid":"m02","difficulty":"easy","section":"Prokaryotic cytoskeleton and ribosomes","qt":"single","source":"codex, slides 140 to 141","qc":"Prokaryotic ribosomes are made of protein and what else?","options":["Phospholipid","Peptidoglycan","rRNA","Glycogen"],"correct_index":2,"explanations":["Phospholipid forms membranes. The right answer is: rRNA.","Peptidoglycan is a wall polymer. The right answer is: rRNA.","Correct. Ribosomes contain protein and rRNA.","Glycogen is a storage carbohydrate. The right answer is: rRNA."]},{"tag":"M2·Q115","mid":"m02","difficulty":"medium","section":"Prokaryotic cytoskeleton and ribosomes","qt":"single","source":"codex, slides 140 to 141","qc":"Where may prokaryotic ribosomes be found?","options":["Inside a nucleus or inside a nucleolus","In the cytoplasm or on the plasma membrane","Inside mitochondria and inside chloroplasts","On the rough ER and the Golgi only"],"correct_index":1,"explanations":["Prokaryotes have neither. The right answer is: In the cytoplasm or on the plasma membrane.","Correct. They may be free or attached to the plasma membrane.","Prokaryotes have no mitochondria. The right answer is: In the cytoplasm or on the plasma membrane.","Prokaryotes have no ER. The right answer is: In the cytoplasm or on the plasma membrane."]},{"tag":"M2·Q116","mid":"m02","difficulty":"medium","section":"Prokaryotic cytoskeleton and ribosomes","qt":"single","source":"codex, slides 140 to 141","qc":"Until recently, the cytoskeleton was thought to occur in which cells only?","options":["Archaeal cells","Viral particles","Bacterial spores","Eukaryotic cells"],"correct_index":3,"explanations":["It was thought only eukaryotic. The right answer is: Eukaryotic cells.","Viruses are not cells. The right answer is: Eukaryotic cells.","Spores were not the cells named.","Correct. It was thought to be only eukaryotic."]},{"tag":"M2·Q117","mid":"m02","difficulty":"hard","section":"Prokaryotic cytoskeleton and ribosomes","qt":"single","source":"codex, slides 140 to 141","qc":"Which statement about the prokaryotic cytoskeleton is correct?","options":["It is a double membrane around the chromosome","It is a cell wall made of peptidoglycan","It is absent from all prokaryotic cells","It is a scaffold in the cytoplasm"],"correct_index":3,"explanations":["That is not a cytoskeleton. The right answer is: It is a scaffold in the cytoplasm.","That is the wall. The right answer is: It is a scaffold in the cytoplasm.","Prokaryotes have a cytoskeleton scaffold. The right answer is: It is a scaffold in the cytoplasm.","Correct. The lecture calls it a major advance."]},{"tag":"M2·Q118","mid":"m02","difficulty":"easy","section":"Cell envelope and plasma membrane","qt":"single","source":"codex, slides 142 to 145","qc":"Which layers can make up the bacterial cell envelope?","options":["Membrane, wall and sometimes an outer membrane","Nuclear envelope, ER and Golgi apparatus","Capsule, plasmid and granule inclusions","Cristae, matrix and ribosome subunits"],"correct_index":0,"explanations":["Correct. The envelope has two or three layers.","These are eukaryotic structures. The right answer is: Membrane, wall and sometimes an outer membrane.","These are not the envelope layers.","These are mitochondrial and ribosomal features."]},{"tag":"M2·Q119","mid":"m02","difficulty":"easy","section":"Cell envelope and plasma membrane","qt":"single","source":"codex, slides 142 to 145","qc":"The bacterial plasma membrane is made of what type of structure?","options":["A phospholipid bilayer with proteins","A thick layer of pure cellulose","A coat of silica around the cell","A single layer of lipid and sugar"],"correct_index":0,"explanations":["Correct. It is a phospholipid bilayer with proteins.","Cellulose is a plant wall material.","Silica is not the membrane material.","It is a bilayer. The right answer is: A phospholipid bilayer with proteins."]},{"tag":"M2·Q120","mid":"m02","difficulty":"easy","section":"Cell envelope and plasma membrane","qt":"single","source":"codex, slides 142 to 145","qc":"Where does the cell envelope lie relative to the cytoplasm?","options":["Inside it","Within the nucleus","Outside it","Within the nucleoid"],"correct_index":2,"explanations":["The envelope encloses the cytoplasm. The right answer is: Outside it.","Bacteria have no nucleus. The right answer is: Outside it.","Correct. The envelope lies outside the cytoplasm.","The nucleoid is inside the cell."]},{"tag":"M2·Q121","mid":"m02","difficulty":"medium","section":"Cell envelope and plasma membrane","qt":"single","source":"codex, slides 142 to 145","qc":"Which function does the bacterial plasma membrane provide?","options":["Photosynthesis in chloroplasts of the cell","Storage of DNA inside a true nucleus","Attachment of the cell to a tooth surface","A site for energy reactions and synthesis"],"correct_index":3,"explanations":["Bacteria have no chloroplasts. The right answer is: A site for energy reactions and synthesis.","Bacteria have no nucleus. The right answer is: A site for energy reactions and synthesis.","That is a role of glycocalyx.","Correct. These are listed functions. It matches what the lecture slides state."]},{"tag":"M2·Q122","mid":"m02","difficulty":"medium","section":"Cell envelope and plasma membrane","qt":"single","source":"codex, slides 142 to 145","qc":"The plasma membrane is selectively permeable. What does this mean?","options":["It lets all materials pass in and out freely","It regulates which materials move in and out","It lets nothing pass in or out at all","It lets only water pass in and out"],"correct_index":1,"explanations":["This contradicts selective permeability. The right answer is: It regulates which materials move in and out.","Correct. It regulates transport. It matches what the lecture slides state.","The membrane does allow selected transport.","It regulates transport of many substances."]},{"tag":"M2·Q123","mid":"m02","difficulty":"medium","section":"Cell envelope and plasma membrane","qt":"single","source":"codex, slides 142 to 145","qc":"How many layers does the Gram-positive envelope have?","options":["Two","One","Three","Four"],"correct_index":0,"explanations":["Correct. Gram-positive bacteria have two layers.","They have two layers. The right answer is: Two.","Gram-negative bacteria have three. The right answer is: Two.","No bacterial envelope here has four."]},{"tag":"M2·Q124","mid":"m02","difficulty":"hard","section":"Cell envelope and plasma membrane","qt":"single","source":"codex, slides 142 to 145","qc":"How many layers does the Gram-negative envelope have, and which are they?","options":["Two: cell wall and cytoplasmic membrane","Three: capsule, nucleus and cell wall","Four: outer membrane, wall, plasma membrane and nucleoid","Three: outer membrane, cell wall and cytoplasmic membrane"],"correct_index":3,"explanations":["That describes Gram-positive. The right answer is: Three: outer membrane, cell wall and cytoplasmic membrane.","Bacteria have no nucleus. The right answer is: Three: outer membrane, cell wall and cytoplasmic membrane.","The nucleoid is not an envelope layer.","Correct. Gram-negative envelopes have three layers."]},{"tag":"M2·Q125","mid":"m02","difficulty":"hard","section":"Cell envelope and plasma membrane","qt":"single","source":"codex, slides 142 to 145","qc":"All of the following are functions of the bacterial plasma membrane EXCEPT which one?","options":["Regulating the transport of materials","Storing the chromosome inside a nucleus","Hosting energy reactions for the cell","Secreting some substances outward"],"correct_index":1,"explanations":["This is a membrane function. The right answer is: Storing the chromosome inside a nucleus.","Correct choice. Bacteria have no nucleus.","This is a membrane function. The right answer is: Storing the chromosome inside a nucleus.","This is a membrane function. The right answer is: Storing the chromosome inside a nucleus."]},{"tag":"M2·Q126","mid":"m02","difficulty":"easy","section":"Bacterial cell walls","qt":"single","source":"codex, slides 146 to 156","qc":"What is the main polymer of the bacterial cell wall?","options":["Peptidoglycan","Cellulose","Collagen","Chitin"],"correct_index":0,"explanations":["Correct. Peptidoglycan gives the wall its rigidity.","Cellulose is in plant walls. The right answer is: Peptidoglycan.","Collagen is an animal protein. The right answer is: Peptidoglycan.","Chitin is not the bacterial polymer."]},{"tag":"M2·Q127","mid":"m02","difficulty":"easy","section":"Bacterial cell walls","qt":"single","source":"codex, slides 146 to 156","qc":"What does the bacterial cell wall provide?","options":["Photosynthesis using chlorophyll","Protein synthesis on ribosomes","Motility through the environment","Shape and strong structural support"],"correct_index":3,"explanations":["Photosynthesis needs chlorophyll. The right answer is: Shape and strong structural support.","Ribosomes make proteins. The right answer is: Shape and strong structural support.","Flagella give motility. The right answer is: Shape and strong structural support.","Correct. The wall gives shape and strength."]},{"tag":"M2·Q128","mid":"m02","difficulty":"easy","section":"Bacterial cell walls","qt":"single","source":"codex, slides 146 to 156","qc":"Which bacteria have a thick peptidoglycan layer?","options":["Gram-positive bacteria","Gram-negative bacteria","Mycoplasmas","Archaea"],"correct_index":0,"explanations":["Correct. Gram-positive walls are thick. It matches what the lecture slides state.","Their peptidoglycan layer is thin. The right answer is: Gram-positive bacteria.","They lack a wall. The right answer is: Gram-positive bacteria.","Archaea lack peptidoglycan. The right answer is: Gram-positive bacteria."]},{"tag":"M2·Q129","mid":"m02","difficulty":"easy","section":"Bacterial cell walls","qt":"single","source":"codex, slides 146 to 156","qc":"Which bacteria have an outer membrane?","options":["Gram-positive bacteria","Mycoplasmas","Gram-negative bacteria","Endospores"],"correct_index":2,"explanations":["They have a thick wall and no outer membrane.","They lack a wall. The right answer is: Gram-negative bacteria.","Correct. Gram-negative bacteria have an outer membrane.","Endospores are dormant structures. The right answer is: Gram-negative bacteria."]},{"tag":"M2·Q130","mid":"m02","difficulty":"easy","section":"Bacterial cell walls","qt":"single","source":"codex, slides 146 to 156","qc":"Which molecule is in the outermost layer of the Gram-negative outer membrane?","options":["Cellulose","Lipopolysaccharide (LPS)","Teichoic acid","Histone"],"correct_index":1,"explanations":["Cellulose is a plant material. The right answer is: Lipopolysaccharide (LPS).","Correct. LPS is in the outermost layer.","Teichoic acids are in Gram-positive walls.","Histones are chromatin proteins. The right answer is: Lipopolysaccharide (LPS)."]},{"tag":"M2·Q131","mid":"m02","difficulty":"easy","section":"Bacterial cell walls","qt":"single","source":"codex, slides 146 to 156","qc":"What is absent from archaeal cell walls?","options":["Any protective layer","Ribosomes","Peptidoglycan","DNA"],"correct_index":2,"explanations":["Archaeal walls are tough. The right answer is: Peptidoglycan.","Archaea have ribosomes. The right answer is: Peptidoglycan.","Correct. Archaea have no peptidoglycan. It matches what the lecture slides state.","Archaea have DNA. The right answer is: Peptidoglycan."]},{"tag":"M2·Q132","mid":"m02","difficulty":"medium","section":"Bacterial cell walls","qt":"single","sour ules.","Keratins are in epithelia. The right answer is: Microtubules.","Correct. Microtubules carry cargoes along axons.","These are keratin inclusions in liver cells."]},{"tag":"M3·Q42","mid":"m03","difficulty":"easy","section":"Tubulin polymerisation and drugs","qt":"single","source":"codex, slides 210 to 212, 220, 221","qc":"Which drug acts as a microtubule stabiliser?","options":["Colchicine","Taxol","Colcemid","Vincristine"],"correct_index":1,"explanations":["Colchicine inhibits polymerisation. The right answer is: Taxol.","Correct. Taxol stabilises microtubules. It matches what the lecture slides state.","Colcemid inhibits polymerisation. The right answer is: Taxol.","Vincristine inhibits assembly. The right answer is: Taxol."]},{"tag":"M3·Q43","mid":"m03","difficulty":"easy","section":"Tubulin polymerisation and drugs","qt":"single","source":"codex, slides 210 to 212, 220, 221","qc":"Which drugs inhibit microtubule polymerisation by binding the subunit?","options":["Taxol and paclitaxel","Penicillin and lysozyme","Colchicine and colcemid","Catalase and urate oxidase"],"correct_index":2,"explanations":["Taxol stabilises microtubules. The right answer is: Colchicine and colcemid.","These act on bacterial walls. The right answer is: Colchicine and colcemid.","Correct. Both bind the subunit and inhibit polymerisation.","These are peroxisome enzymes. The right answer is: Colchicine and colcemid."]},{"tag":"M3·Q44","mid":"m03","difficulty":"easy","section":"Tubulin polymerisation and drugs","qt":"single","source":"codex, slides 210 to 212, 220, 221","qc":"Which type of tubulin nucleates microtubules at the minus end?","options":["α-tubulin","β-tubulin","γ-tubulin","Actin"],"correct_index":2,"explanations":["α-tubulin is a dimer subunit. The right answer is: γ-tubulin.","β-tubulin is a dimer subunit. The right answer is: γ-tubulin.","Correct. γ-tubulin nucleates microtubules at the minus end.","Actin is not tubulin. The right answer is: γ-tubulin."]},{"tag":"M3·Q45" ","qt":"single","source":"codex, slides 206, 229, 235","qc":"What is a key function of microtubules?","options":["Chromosome movement during mitosis","Muscle contraction in muscle cells","Cell surface tension control","Protein folding in the cytosol"],"correct_index":0,"explanations":["Correct. Microtubules form the spindle. It matches what the lecture slides state.","Actin and myosin do that. The right answer is: Chromosome movement during mitosis.","This is not a microtubule job.","This is not a microtubule job."]},{"tag":"M3·Q116","mid":"m03","difficulty":"medium","section":"Comparing the three filaments","qt":"single","source":"codex, slides 206, 229, 235","qc":"Intermediate filaments differ from actin filaments and microtubules because they do what?","options":["Provide tensile strength","Are made of tubulin","Are highly dynamic","Require ATP for motor movement"],"correct_index":0,"explanations":["Correct. Tensile strength is their distinguishing role.","Microtubules are made of tubulin. The right answer is: Provide tensile strength.","Microtubules and actin are more dynamic.","They are not motor tracks. The right answer is: Provide tensile strength."]},{"tag":"M3·Q117","mid":"m03","difficulty":"medium","section":"Comparing the three filaments","qt":"single","source":"codex, slides 206, 229, 235","qc":"Which cytoskeletal filament is used for muscle contraction and cell movement?","options":["Actin filaments","Intermediate filaments","Microtubules","Lamins"],"correct_index":0,"explanations":["Correct. Actin filaments drive movement and contraction.","They give tensile strength. The right answer is: Actin filaments.","They form tracks and the spindle.","They line the nucleus. The right answer is: Actin filaments."]},{"tag":"M3·Q118","mid":"m03","difficulty":"hard","section":"Comparing the three filaments","qt":"single","source":"codex, slides 206, 229, 235","qc":"Which row correctly matches each filament with its protein and main role?","options":["Microfilaments: tubulin, strength; intermediate filaments: actin, spindle; microtubules: keratin, movement","Microfilaments: keratin, spindle; intermediate filaments: tubulin, movement; microtubules: actin, strength","Microfilaments: actin, movement; intermediate: keratin, strength; microtubules: tubulin, transport","All three filaments are made of actin and drive contraction"],"correct_index":2,"explanations":["The rows are mixed up. The right answer is: Microfilaments: actin, movement; intermediate filaments: keratin, strength; microtubules: tubulin, transport and spindle.","The rows are mixed up. The right answer is: Microfilaments: actin, movement; intermediate filaments: keratin, strength; microtubules: tubulin, transport and spindle.","Correct. Each row is right. It matches what the lecture slides state.","They are made of different proteins."]},{"tag":"M3·Q119","mid":"m03","difficulty":"devil","section":"Comparing the three filaments","qt":"single","source":"codex, slides 206, 229, 235","qc":"One drug disrupts mitosis, a second weakens skin strength and a third stops muscle contraction. Which filaments do they target, in that order?","options":["Actin filaments, microtubules and intermediate filaments","Microtubules, intermediate filaments and actin filaments","Intermediate filaments, actin filaments and microtubules","Microtubules, actin filaments and intermediate filaments"],"correct_index":1,"explanations":["The order is wrong. The right answer is: Microtubules, intermediate filaments and actin filaments.","Correct. Spindle, strength and contraction map to these filaments.","The order is wrong. The right answer is: Microtubules, intermediate filaments and actin filaments.","The second and third are swapped."]},{"tag":"M3·Q120","mid":"m03","difficulty":"easy","section":"Units of measurement","qt":"single","source":"codex, slides 240 to 246","qc":"How many micrometres are there in a millimetre?","options":["1,000","10","100","10,000"],"correct_index":0,"explanations":["Co ribes a compound microscope. The right answer is: Only one."]},{"tag":"M3·Q135","mid":"m03","difficulty":"medium","section":"Simple microscopes","qt":"single","source":"codex, slides 249 to 254","qc":"What do the lecture's two types of light microscope consist of?","options":["Phase and dark-field microscopes","Simple microscopes and compound microscopes","Electron and ultraviolet microscopes","Scanning and transmission microscopes"],"correct_index":1,"explanations":["These are techniques of the compound type.","Correct. These are the two types.","These are not the two types named.","These are electron microscopes. The right answer is: Simple microscopes and compound microscopes."]},{"tag":"M3·Q136","mid":"m03","difficulty":"medium","section":"Simple microscopes","qt":"single","source":"codex, slides 249 to 254","qc":"What do simple microscopes lack compared with compound microscopes?","options":["A lens of any kind","A light source of any kind","A way of magnifying objects","A series of lenses"],"correct_index":3,"explanations":["Simple microscopes have one lens. The right answer is: A series of lenses.","They use ambient or other light.","They magnify with one lens. The right answer is: A series of lenses.","Correct. Compound microscopes use a series of lenses."]},{"tag":"M3·Q137","mid":"m03","difficulty":"medium","section":"Simple microscopes","qt":"single","source":"codex, slides 249 to 254","qc":"Historical simple microscope designs resembled modern microscopes in which way?","options":["They used the same electron beams","They had the same series of lenses","They produced three-dimensional images","Their mounts looked like modern mounts"],"correct_index":3,"explanations":["They did not use electrons. The right answer is: Their mounts looked similar to modern microscope mounts.","They had only one lens. The right answer is: Their mounts looked similar to modern microscope mounts.","This is a stereo microscope feature.","Correct. Mounts resembled those used with :"single","source":"codex, slides 255 to 270","qc":"Which defect forms blurred images because light rays are not brought to a simultaneous focus?","options":["Chromatic aberration","Parfocal error","Airy disc","Spherical aberration"],"correct_index":3,"explanations":["That is a colour defect. The right answer is: Spherical aberration.","This is not an aberration. The right answer is: Spherical aberration.","This is a diffraction pattern. The right answer is: Spherical aberration.","Correct. This is spherical aberration. It matches what the lecture slides state."]},{"tag":"M3·Q142","mid":"m03","difficulty":"easy","section":"Spherical aberration","qt":"single","source":"codex, slides 255 to 270","qc":"Spherical aberration can affect which two image qualities?","options":["Resolution and clarity","Colour and brightness","Magnification and working distance","Contrast and polarity"],"correct_index":0,"explanations":["Correct. It affects resolution and clarity.","These are not the stated effects.","These are not the stated effects.","These are not the stated effects."]},{"tag":"M3·Q143","mid":"m03","difficulty":"easy","section":"Spherical aberration","qt":"single","source":"codex, slides 255 to 270","qc":"Which lens shape is the best choice for focusing parallel rays to a single point?","options":["Biconcave","Concavo-convex","Flat glass plate","Plano-convex"],"correct_index":3,"explanations":["A biconcave lens diverges rays. The right answer is: Plano-convex.","This is not the named best choice.","A flat plate does not focus light.","Correct. Plano-convex lenses focus parallel rays to a single point."]},{"tag":"M3·Q144","mid":"m03","difficulty":"easy","section":"Spherical aberration","qt":"single","source":"codex, slides 255 to 270","qc":"Which lens fills the space between the specimen and the lens with a medium of the same refractive index?","options":["A plano-convex lens","An aspherical lens","An achromatic doublet","An oil immersion lens"],"correct_index":3,"explanations":["This is a lens shape. The right answer is: An oil immersion lens.","This changes the lens surface. The right answer is: An oil immersion lens.","This corrects colour. The right answer is: An oil immersion lens.","Correct. Oil immersion removes the refractive index mismatch."]},{"tag":"M3·Q145","mid":"m03","difficulty":"easy","section":"Spherical aberration","qt":"single","source":"codex, slides 255 to 270","qc":"What does aspherical mean?","options":["Non-spherical","Perfectly spherical","Coloured","Opaque"],"correct_index":0,"explanations":["Correct. An aspherical surface is not spherical.","That is a spherical surface. The right answer is: Non-spherical.","This is unrelated. The right answer is: Non-spherical.","This is unrelated. The right answer is: Non-spherical."]},{"tag":"M3·Q146","mid":"m03","difficulty":"easy","section":"Spherical aberration","qt":"single","source":"codex, slides 255 to 270","qc":"Rays passing near a lens's horizontal axis are refracted how, compared with rays near its edge?","options":["Less","More","The same amount","Not at all"],"correct_index":0,"explanations":["Correct. Rays near the axis are refracted less than rays near the edge.","Edge rays are refracted more. The right answer is: Less.","If they were equal there would be no aberration.","They are refracted. The right answer is: Less."]},{"tag":"M3·Q147","mid":"m03","difficulty":"medium","section":"Spherical aberration","qt":"single","source":"codex, slides 255 to 270","qc":"Where do rays near the edge of a lens focus relative to rays near its axis?","options":["At exactly the same point of the axis","Behind the eyepiece of the microscope","Inside the specimen on the slide","At different points along the optical axis"],"correct_index":3,"explanations":["That would mean no aberration. The right answer is: At different points along the optical axis.","This is not described. The right answer is: At different points along the optical axis.","This is not described. The right answer is: At different points along the optical axis.","Correct. They end up in different spots across the optical axis."]},{"tag":"M3·Q148","mid":"m03","difficulty":"medium","section":"Spherical aberration","qt":"single","source":"codex, slides 255 to 270","qc":"What does an aspherical lens surface do?","options":["Converges rays to a single focus","Splits white light into colours","Blocks the outer rays of light","Adds immersion oil to the gap"],"correct_index":0,"explanations":["Correct. Its curvature brings rays to one focal point.","That describes dispersion. The right answer is: Converges light rays into a single focal point.","That describes an opaque coating. The right answer is: Converges light rays into a single focal point.","That describes oil immersion. The right answer is: Converges light rays into a single focal point."]},{"tag":"M3·Q149","mid":"m03","difficulty":"medium","section":"Spherical aberration","qt":"single","source":"codex, slides 255 to 270","qc":"Why do materials of different refractive index between specimen and lens worsen spherical aberration?","options":["They absorb all the blue light","They bend rays at different angles","They make the lens heavier","They change the colour of the specimen"],"correct_index":1,"explanations":["This is not described. The right answer is: They bend the light rays repeatedly at different angles.","Correct. Repeated bending at different angles causes the problem.","This is not described. The right answer is: They bend the light rays repeatedly at different angles.","This is not described. The right answer is: They bend the light rays repeatedly at different angles."]},{"tag":"M3·Q150","mid":"m03","difficulty":"medium","section":"Spherical aberration","qt":"single","source":"codex, slides 255 to 270","qc":"What does coating the periphery of a lens with opaque material do?","options":["It blocks the outer rays","It adds colour correction","It fills the gap with oil","It focuses rays at infinity"],"correct_index":0,"explanations":["Correct. Edge rays are removed. It matches what the lecture slides state.","That describes an achromat. The right answer is: It blocks the outer rays that cause the aberration.","That describes oil immersion. The right answer is: It blocks the outer rays that cause the aberration.","This is not described. The right answer is: It blocks the outer rays that cause the aberration."]},{"tag":"M3·Q151","mid":"m03","difficulty":"medium","section":"Spherical aberration","qt":"single","source":"codex, slides 255 to 270","qc":"Why does the plano-convex shape minimise spherical aberration?","options":["It is perfectly symmetrical about its axis","It removes all colours from the image","It is made of crown glass only","Its asymmetry suits unequal distances"],"correct_index":3,"explanations":["It is asymmetrical. The right answer is: Its asymmetry helps when object and image are at unequal distances.","That is not its effect. The right answer is: Its asymmetry helps when object and image are at unequal distances.","The lecture credits its shape. The right answer is: Its asymmetry helps when object and image are at unequal distances.","Correct. The asymmetry minimises aberration in that case."]},{"tag":"M3·Q152","mid":"m03","difficulty":"medium","section":"Spherical aberration","qt":"single","source":"codex, slides 255, 258","qc":"Which description matches spherical aberration?","options":["Different colours of light focus at different positions, giving colour fringes","The specimen stays in focus when the objective is changed to another power","Rays near the lens edge focus at different points from rays near the axis, blurring the image","Only scattered light enters the objective, giving a bright image on a dark background"],"correct_index":2,"explanations":["That describes chromatic aberration, caused by dispersion.","That describes parfocal objectives, not an aberration.","Correct. Rays are not brought to a simultaneous focus, so the image is blurred.","That describes dark-field illumination, not spherical aberration."]},{"tag":"M3·Q153","mid":"m03","difficulty":"hard","section":"Spherical aberration","qt":"single","source":"codex, slides 255 to 270","qc":"In which situation is a plano-convex lens optimal?","options":["The object touches the lens and the rays diverge","The object and image are at equal distances","Object at infinity, image a focused point","The light is white and the lens is thick"],"correct_index":2,"explanations":["This is not the optimum. The right answer is: The object is at infinity, parallel rays enter, and the image is a focused point.","The lens suits unequal distances. The right answer is: The object is at infinity, parallel rays enter, and the image is a focused point.","Correct. This is the optimum case.","This is not the stated optimum."]},{"tag":"M3·Q154","mid":"m03","difficulty":"hard","section":"Spherical aberration","qt":"single","source":"codex, slides 255 to 270","qc":"Which two measures reduce spherical aberration by matching refractive indices and by blocking edge rays?","options":["An achromatic doublet and oil immersion","Oil immersion and an opaque coating on the periphery","An aspherical surface and a crown–flint pair","A plano-convex lens and a colour filter"],"correct_index":1,"explanations":["The doublet corrects chromatic aberration. The right answer is: Oil immersion and an opaque coating on the periphery.","Correct. These are the two measures.","The pair corrects chromatic aberration. The right answer is: Oil immersion and an opaque coating on the periphery.","A colour filter is not described."]},{"tag":"M3·Q155","mid":"m03","difficulty":"hard","section":"Spherical aberration","qt":"single","source":"codex, slides 266, 267, 280","qc":"All of the following reduce spherical aberration EXCEPT which one?","options":["Using a specialised aspherical lens surface curved to converge rays","Coating the periphery of the lens with opaque material","Bonding crown glass and flint glass into an achromatic doublet","Using oil immersion so one refractive index fills the gap"],"correct_index":2,"explanations":["This reduces spherical aberration by converging rays to one focal point.","This blocks the outer rays that cause spherical aberration.","Correct choice. An achromatic doublet corrects chromatic aberration, not spherical aberration.","This removes the repeated bending of rays between materials, reducing spherical aberration."]},{"tag":"M3·Q156","mid":"m03","difficulty":"easy","section":"Chromatic aberration","qt":"single","source":"codex, slides 273 to 285","qc":"Chromatic aberration is also known as what?","options":["Colour fringing, or purple fringing","Spherical fringing, or oil fringing","Airy fringing, or ring fringing","Parfocal fringing, or focus fringing"],"correct_index":0,"explanations":["Correct. These are alternative names. It matches what the lecture slides state.","This is not a term used.","This is not the term used.","This is not a term used."]},{"tag":"M3·Q157","mid":"m03","difficulty":"easy","section":"Chromatic aberration","qt":"single","source":"codex, slides 273 to 285","qc":"What causes chromatic aberration?","options":["Dirt on the lens surface","The size of the stage plate","Dispersion of the lens material","A damaged illuminator bulb"],"correct_index":2,"explanations":["This is not the cause. The right answer is: Dispersion of the lens material.","This is not the cause. The right answer is: Dispersion of the lens material.","Correct. Dispersion varies refractive index with wavelength.","This is not the cause. The right answer is: Dispersion of the lens material."]},{"tag":"M3·Q158","mid":"m03","difficulty":"easy","section":"Chromatic aberration","qt":"single","source":"codex, slides 273 to 285","qc":"How does chromatic aberration appear in an image?","options":["As a grey haze across the centre","As a bright dot with rings","As a black circle at the edge","As fringes of colour around the image"],"correct_index":3,"explanations":["This is not described. The right answer is: As fringes of colour around the image.","This describes an Airy disc. The right answer is: As fringes of colour around the image.","This is not described. The right answer is: As fringes of colour around the image.","Correct. Colour fringes appear around the image."]},{"tag":"M3·Q159","mid":"m03","difficulty":"easy","section":"Chromatic aberration","qt":"single","source":"codex, slides 273 to 285","qc":"Which lens combination is used to reduce chromatic aberration?","options":["An aspherical singlet","An oil film","An achromatic doublet","A coated periphery"],"correct_index":2,"explanations":["This reduces spherical aberration. The right answer is: An achromatic doublet.","This reduces spherical aberration. The right answer is: An achromatic doublet.","Correct. An achromat bonds two materials of differing dispersion.","This reduces spherical aberration. The right answer is: An achromatic doublet."]},{"tag":"M3·Q160","mid":"m03","difficulty":"easy","section":"Chromatic aberration","qt":"single","source":"codex, slides 273 to 285","qc":"What are bonded together in an achromatic doublet?","options":["Two identical glass pieces together","A lens and an opaque ring around it","A lens and a mirror below it","Two materials with differing dispersion"],"correct_index":3,"explanations":["They must differ in dispersion. The right answer is: Two materials with differing dispersion.","This is not a doublet. The right answer is: Two materials with differing dispersion.","This is not a doublet. The right answer is: Two materials with differing dispersion.","Correct. They form a single lens."]},{"tag":"M3·Q161","mid":"m03","difficulty":"medium","section":"Chromatic aberration","qt":"single","source":"codex, slides 273 to 285","qc":"What varies with wavelength to cause chromatic aberration?","options":["The thickness of the slide","The number of lenses","The refractive index of the glass","The working distance of the eyepiece"],"correct_index":2,"explanations":["This does not vary with wavelength.","This does not vary with wavelength.","Correct. Focal length varies with wavelength.","This does not vary with wavelength."]},{"tag":"M3·Q162","mid":"m03","difficulty":"medium","section":"Chromatic aberration","qt":"single","source":"codex, slides 273 to 285","qc":"Does an achromatic doublet correct chromatic aberration perfectly?","options":["Yes, it removes all colour error","No, it makes it much worse","No, it reduces it over a range","Yes, but only for blue light"],"correct_index":2,"explanations":["The lecture says it is not perfect.","It reduces the aberration. The right answer is: No, it reduces it over a certain range of wavelengths.","Correct. It does not give perfect correction.","It reduces error over a range."]},{"tag":"M3·Q163","mid":"m03","difficulty":"medium","section":"Chromatic aberration","qt":"single","source":"codex, slides 273 to 285","qc":"Which edge colours can appear with chromatic aberration?","options":["Only black and white fringes","Only grey and brown fringes","Only infrared and ultraviolet","Red, green, blue, yellow or purple"],"correct_index":3,"explanations":["Coloured edges appear. The right answer is: Red, green, blue, yellow, purple and magenta.","Coloured edges appear. The right answer is: Red, green, blue, yellow, purple and magenta.","These are not visible colours. The right answer is: Red, green, blue, yellow, purple and magenta.","Correct. These coloured edges can appear."]},{"tag":"M3·Q164","mid":"m03","difficulty":"medium","section":"Chromatic aberration","qt":"single","source":"codex, slides 273 to 285","qc":"What is a simple way to partly correct residual chromatic aberration after the image is taken?","options":["Add immersion oil to the image","Scale the red, green and blue channels","Coat the edge of the image in black","Double the magnification afterwards"],"correct_index":1,"explanations":["This is not a digital fix.","Correct. This is the simple after-the-fact fix.","This is not described. The right answer is: Scale the red, green and blue channels independently.","This is not described. The right answer is: Scale the red, green and blue channels independently."]},{"tag":"M3·Q165","mid":"m03","difficulty":"medium","section":"Chromatic aberration","qt":"single","source":"codex, slides 263, 273 to 275, 258","qc":"Which of these is NOT a feature of chromatic aberration?","options":["Rays near the lens axis are refracted less than rays near the periphery","Coloured fringes appear around the edges of the image","Dispersion in the glass makes focal length vary with wavelength","Different colours of light are focused at different positions"],"correct_index":0,"explanations":["Correct choice. This describes spherical aberration, not chromatic aberration.","This is true; chromatic aberration shows as colour fringes.","This is true; chromatic aberration comes from dispersion of the lens material.","This is true; wavelengths fail to reach a common focus."]},{"tag":"M3·Q166","mid":"m03","difficulty":"medium","section":"Chromatic aberration","qt":"single","source":"codex, slides 280, 282","qc":"Which pair of materials, bonded together as an achromatic doublet, reduces chromatic aberration?","options":["Quartz glass and fused silica","Crown glass and flint glass","Crown glass and fused quartz","Flint glass and clear plastic"],"correct_index":1,"explanations":["Quartz is used for UV lenses, not as the pair in an achromatic doublet.","Correct. Crown and flint glass, with differing dispersion, are bonded to reduce chromatic aberration.","Quartz is not the partner of crown glass in an achromatic doublet.","Plastic is not the second material in a standard achromatic doublet."]},{"tag":"M3·Q167","mid":"m03","difficulty":"hard","section":"Chromatic aberration","qt":"single","source":"codex, slides 273 to 285","qc":"Which statement about correcting chromatic aberration is correct?","options":["Crown and flint glass bonded as ce":"codex, slides 289 to 290","qc":"How many basic types of light microscope does the lecture describe in this section?","options":["Three, including electron","One, the compound only","Two, compound and dissecting","Five, including confocal"],"correct_index":2,"explanations":["Electron microscopes are not light microscopes.","Two types are described. The right answer is: Two, compound and dissecting.","Correct. Compound and dissecting microscopes are the two.","Only two basic types are described."]},{"tag":"M3·Q179","mid":"m03","difficulty":"easy","section":"Types of light microscope","qt":"single","source":"codex, slides 289 to 290","qc":"Which light microscope needs specimens sliced thinly enough for light to pass through?","options":["The dissecting microscope","The loupe","The compound microscope","The magnifying glass"],"correct_index":2,"explanations":["It views opaque specimens. The right answer is: The compound microscope.","It views objects directly. The right answer is: The compound microscope.","Correct. Compound microscopes need thin specimens.","It views objects directly. The right answer is: The compound microscope."]},{"tag":"M3·Q180","mid":"m03","difficulty":"easy","section":"Types of light microscope","qt":"single","source":"codex, slides 289 to 290","qc":"Which light microscope permits opaque specimens to be viewed?","options":["The compound microscope","The transmission electron microscope","The dissecting (stereo) microscope","The ultraviolet microscope"],"correct_index":2,"explanations":["It needs thin specimens. The right answer is: The dissecting (stereo) microscope.","It is not a light microscope.","Correct. It permits opaque specimens to be viewed.","It is not described here. The right answer is: The dissecting (stereo) microscope."]},{"tag":"M3·Q181","mid":"m03","difficulty":"easy","section":"Types of light microscope","qt":"single","source":"codex, slides 289 to 290","qc":"What is another name for the stereo microscope?","options":["The
