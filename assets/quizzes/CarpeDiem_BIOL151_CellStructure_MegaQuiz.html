name":"Functions of the microscope","count":8},{"name":"Magnification and focal length","count":14},{"name":"Working distance and parfocal objectives","count":14},{"name":"Magnification versus resolution","count":16},{"name":"Parameters that affect resolution","count":10},{"name":"Numerical aperture","count":20},{"name":"Refractive index and immersion oil","count":12},{"name":"Wavelength and the limit of resolution","count":18},{"name":"Bright-field microscopy","count":12},{"name":"Dark-field microscopy","count":16},{"name":"Phase-contrast microscopy","count":24},{"name":"Ultraviolet microscopy","count":16},{"name":"Fluorescence microscopy","count":12}],"count":200},{"id":"m05","n":5,"title":"Principles of fluorescence → Cell lysis and homogenisation","slides":"slides 401 to 500","source":"BIOL151_Question_Bank_Slides401-500.docx","group":"BIOL 151 · Cell Structure","first":800,"sections":[{"name":"Principles of fluorescence","count":12},{"name":"Fluorescence microscopy in use","count":8},{"name":"Optics of the fluorescence microscope","count":10},{"name":"Electron microscopy: principles","count":12},{"name":"Transmission electron microscopy","count":16},{"name":"Scanning electron microscopy","count":16},{"name":"The magnetic lens system","count":8},{"name":"Light versus electron microscope","count":10},{"name":"Fixation","count":14},{"name":"Embedding","count":18},{"name":"Sectioning","count":10},{"name":"Staining for light microscopy","count":20},{"name":"Staining for electron microscopy","count":14},{"name":"Cell fractionation","count":8},{"name":"Cell lysis and homogenisation","count":24}],"count":200},{"id":"m06","n":6,"title":"Differential centrifugation → Rf values and interpreting data","slides":"slides 501 to 562","source":"BIOL151_Question_Bank_Slides501-562.docx","group":"BIOL 151 · Cell Structure","first":1000,"sections":[{"name":"Differential centrifugation","count":20},{"name":"Density gradient centrifugation","count":12},{"name":"Rate-zonal and isopycnic separation","count":12},{"name":"The analytical ultracentrifuge","count":8},{"name":"Principles of spectrophotometry","count":12},{"name":"Colour, absorbance and concentration","count":16},{"name":"Autoradiography: principle and procedure","count":12},{"name":"Autoradiography with tritiated thymidine","count":6},{"name":"Chromatography and the paper technique","count":12},{"name":"Rf values and interpreting data","count":10}],"count":120}],"questions":[{"tag":"M1·Q1","mid":"m01","difficulty":"easy","section":"What is a cell?","qt":"single","source":"codex, slides 20 to 25","qc":"What is an organism called if it consists of a single cell?","options":["Multicellular, such as a human or an oak tree","Acellular, meaning it has no cells at all","Unicellular, such as an amoeba or a bacterium","Polycellular, meaning it has two or three cells"],"correct_index":2,"explanations":["Multicellular organisms contain many cells organised into complex structures.","Acellular means without cells, which does not describe a single-celled organism.","Correct. An organism made of one cell is unicellular.","Polycellular is not the standard term; one-celled organisms are unicellular."]},{"tag":"M1·Q2","mid":"m01","difficulty":"easy","section":"What is a cell?","qt":"single","source":"codex, slide 25","qc":"Which description best defines a cell?","options":["The smallest structure that always has a membrane-bound nucleus","The smallest unit able to perform life functions on its own","A group of different tissues cooperating to perform one task","A structure found only in organisms made of many cells"],"correct_index":1,"explanations":["Many cells, such as bacteria, have no membrane-bound nucleus, so this wording wrongly excludes prokaryotic cells.","Correct. A cell is the smallest unit able to perform life functions independently, which is why it is the basic unit of life.","That describes an organ, which is built from many cells and sits above the cell in organisation.","Unicellular organisms such as amoebae and bacteria are complete organisms made of a single cell."]},{"tag":"M1·Q3","mid":"m01","difficulty":"easy","section":"What is a cell?","qt":"single","source":"codex, slide 21","qc":"Which of these is among the abilities that define life in a cell?","options":["Possessing a rigid cell wall of cellulose","Responding to stimuli in its surroundings","Containing a membrane-bound nucleus at all times","Measuring more than 200 micrometres across"],"correct_index":1,"explanations":["Animal cells show every property of life without a cellulose wall, so it is not a defining ability.","Correct. Responding to stimuli is one of the abilities, along with growth, reproduction, processing information and chemical reactions.","Bacteria are living cells with no membrane-bound nucleus, so this is not a defining ability.","Size is not a property of life; most living cells are far smaller than that."]},{"tag":"M1·Q4","mid":"m01","difficulty":"medium","section":"What is a cell?","qt":"single","source":"codex, slides 20 to 25","qc":"Which statement about multicellular organisms such as humans is correct?","options":["They consist of one very large cell with many nuclei","They contain billions of cells in complex structures","They contain only a few hundred cells that work independently","They contain no cells that are able to reproduce"],"correct_index":1,"explanations":["Multicellular organisms are made of many separate cells, not one large cell.","Correct. Humans and other multicellular organisms are built from vast numbers of cells in complex structures.","The numbers run to billions or trillions, and cells cooperate in structures.","Cells can reproduce, which is one of the abilities that define life."]},{"tag":"M1·Q5","mid":"m01","difficulty":"medium","section":"What is a cell?","qt":"single","source":"codex, slides 20 to 25","qc":"Which of the following is NOT listed among the abilities that define life in cells?","options":["Photosynthesising in sunlight","Growing and reproducing","Processing information","Carrying out chemical reactions"],"correct_index":0,"explanations":["Correct choice. Photosynthesis occurs only in some cells and is not in the list of defining abilities.","Growth and reproduction are listed among the defining abilities of cells.","Processing information is listed among the abilities that define life.","An array of chemical reactions is listed among the defining abilities."]},{"tag":"M1·Q6","mid":"m01","difficulty":"medium","section":"What is a cell?","qt":"single","source":"codex, slides 20 to 25","qc":"A bacterium swims toward a nutrient-rich region. Which defining property of life does this show?","options":["Reproducing by cell division","Responding to stimuli","Growing in overall size","Carrying out chemical reactions"],"correct_index":1,"explanations":["Swimming toward nutrients is a response, not reproduction.","Correct. Moving toward nutrients is a response to a stimulus in the environment.","Growth is an increase in size and does not describe directed movement.","Chemical reactions occur inside the cell and do not by themselves explain directed movement."]},{"tag":"M1·Q7","mid":"m01","difficulty":"hard","section":"What is a cell?","qt":"single","source":"codex, slides 20 to 25","qc":"A student argues that a mitochondrion is a cell because it contains DNA and makes ATP. Which part of the definition of a cell shows she is wrong?","options":["A cell must perform life functions on its own, and a mitochondrion cannot outside its host","A cell must be larger than 200 micrometres, and mitochondria are much smaller than that","A cell must contain a nucleus, and mitochondria have none of their own","A cell must be multicellular, and a mitochondrion is a single unit"],"correct_index":0,"explanations":["Correct. A cell is the smallest unit able to perform life functions independently.","Many cells, such as bacteria, are far smaller than 200 micrometres, so size is not the test.","Bacteria are cells without a nucleus, so having a nucleus is not the test.","Unicellular organisms are cells, so being multicellular is not required."]},{"tag":"M1·Q8","mid":"m01","difficulty":"hard","section":"What is a cell?","qt":"single","source":"codex, slide 22","qc":"Which observation best supports the idea that the cell is the fundamental unit of life?","options":["Multicellular organisms contain trillions of cells arranged in complex structures","Even simple single-celled organisms show all the major properties of life","Cells can be seen under a light microscope using suitable preparation","All cells share exactly the same shape and size in every organism"],"correct_index":1,"explanations":["This shows organisation in large organisms but does not show that one cell carries out all life functions.","Correct. A single-celled organism shows every major property of life, so the cell is the fundamental unit.","Visibility under a microscope says nothing about whether a cell is the basic unit of life.","Cells vary widely in size and shape, so this statement is false."]},{"tag":"M1·Q9","mid":"m01","difficulty":"easy","section":"History of the cell","qt":"single","source":"codex, slides 26 to 32","qc":"In which year did Robert Hooke introduce the term cell?","options":["1595","1674","1665","1855"],"correct_index":2,"explanations":["Janssen is credited with the first compound microscope in 1595.","Leeuwenhoek described living cells in 1674.","Correct. Hooke named the cell in 1665 after viewing cork.","Virchow completed classical cell theory in 1855."]},{"tag":"M1·Q10","mid":"m01","difficulty":"easy","section":"History of the cell","qt":"single","source":"codex, slides 26 to 32","qc":"Who was the first person to witness a live cell under a microscope?","options":["Robert Hooke","Antony van Leeuwenhoek","Robert Brown","Rudolf Virchow"],"correct_index":1,"explanations":["Hooke saw only the dead cell walls of cork.","Correct. Leeuwenhoek was the first to witness a live cell, in 1674.","Brown described the nucleus in the 1830s, long after the first live cell was seen.","Virchow completed cell theory in 1855 and did not first see live cells."]},{"tag":"M1·Q11","mid":"m01","difficulty":"easy","section":"History of the cell","qt":"single","source":"codex, slide 26","qc":"In 1665 Robert Hooke named the cell after comparing cork compartments to what?","options":["The honey chambers of a beehive","Small rooms that monks lived in","Tiny beads strung along a thread","Seeds packed inside a fruit"],"correct_index":1,"explanations":["Beehive chambers are a familiar image, but Hooke's recorded comparison was to the rooms monks lived in.","Correct. Hooke likened the cork compartments to the little rooms (cellulae) monks lived in, which gave us the word cell.","Beads on a thread do not resemble the box-like compartments Hooke saw in cork.","Seeds inside a fruit are not what Hooke compared the cork compartments to."]},{"tag":"M1·Q12","mid":"m01","difficulty":"easy","section":"History of the cell","qt":"single","source":"codex, slide 26","qc":"In which publication did Robert Hooke describe his cork observations?","options":["Cellular Pathology, a book on cell origins","On the Origin of Species, a work on evolution","Micrographia, a book of microscope drawings","De Humani Corporis Fabrica, a text on anatomy"],"correct_index":2,"explanations":["Cellular Pathology is associated with Virchow, not Hooke's cork observations.","Darwin's book concerns evolution and has nothing to do with Hooke's microscope work.","Correct. Hooke published his cork observations and drawings in Micrographia.","Vesalius wrote this anatomy text long before Hooke, and it does not describe cork cells."]},{"tag":"M1·Q13","mid":"m01","difficulty":"easy","section":"History of the cell","qt":"single","source":"codex, slide 32","qc":"Who is credited with building the first compound microscope in 1595?","options":["Zacharias Janssen","Robert Hooke","Antonie van Leeuwenhoek","Ernst Ruska"],"correct_index":0,"explanations":["Correct. Janssen is credited with the first compound microscope in 1595.","Hooke used a microscope to examine cork in 1665, long after the first compound microscope.","Leeuwenhoek observed living cells in 1674, well after the first compound microscope.","Ruska helped develop the electron microscope in 1931, not the 1595 compound microscope."]},{"tag":"M1·Q14","mid":"m01","difficulty":"medium","section":"History of the cell","qt":"single","source":"codex, slides 26 to 32","qc":"What did Hooke actually see when he examined cork under his microscope?","options":["The dead cell walls of plant cells","Living cells with visible nuclei","Bacteria swimming in a drop of water","Protozoa moving among algae"],"correct_index":0,"explanations":["Correct. Hooke saw the walls of dead plant cells, which looked like small rooms.","The walls gave no indication of a nucleus or other organelles.","Bacteria were described later, by Leeuwenhoek.","Protozoa were observed by Leeuwenhoek in 1674, not by Hooke."]},{"tag":"M1·Q15","mid":"m01","difficulty":"medium","section":"History of the cell","qt":"single","source":"codex, slides 26 to 32","qc":"Besides algae, what did Leeuwenhoek probably see through his microscope?","options":["Mitochondria","Ribosomes","Chromosomes","Bacteria"],"correct_index":3,"explanations":["Mitochondria are far too small for his simple microscope to show.","Ribosomes were described much later, with electron microscopy.","Chromosomes were not described from his observations.","Correct. The lecture says Leeuwenhoek probably also saw bacteria."]},{"tag":"M1·Q16","mid":"m01","difficulty":"medium","section":"History of the cell","qt":"single","source":"codex, slides 26 to 32","qc":"Which person and year pairing is correct?","options":["Janssen, 1665","Leeuwenhoek, 1595","Hooke, 1665","Brown, 1674"],"correct_index":2,"explanations":["Janssen is credited with the first compound microscope in 1595.","Leeuwenhoek's observations date from 1674, not 1595.","Correct. Hooke introduced the term cell in 1665.","Brown described the nucleus between 1831 and 1833."]},{"tag":"M1·Q17","mid":"m01","difficulty":"medium","section":"History of the cell","qt":"single","source":"codex, slides 26 to 32","qc":"How many years after Hooke named the cell (1665) did Leeuwenhoek describe the alga Spirogyra (1674)?","options":["19 years","29 years","90 years","9 years"],"correct_index":3,"explanations":["This slips by ten; the gap is 9 years.","This is a miscalculation; the gap is 9 years.","This is ten times too large.","Correct. 1674 minus 1665 is 9 years."]},{"tag":"M1·Q18","mid":"m01","difficulty":"medium","section":"History of the cell","qt":"single","source":"codex, slides 26 to 32","qc":"Leeuwenhoek lived from 1632 to 1723. About how old was he when he described the alga Spirogyra in 1674?","options":["32 years old","52 years old","42 years old","91 years old"],"correct_index":2,"explanations":["This slips ten years; 1674 minus 1632 is 42.","This adds ten too many; the age is 42.","Correct. 1674 minus 1632 is 42.","This is the age at his death in 1723, not in 1674."]},{"tag":"M1·Q19","mid":"m01","difficulty":"medium","section":"History of the cell","qt":"single","source":"codex, slide 29","qc":"Which organism did Leeuwenhoek describe in 1674 when he first saw living cells?","options":["Thin slices of dead cork seen through a lens","The green alga Spirogyra under his lens","Orchid cells showing a clear central nucleus","Red cells drawn from a drop of human blood"],"correct_index":1,"explanations":["Cork slices were Hooke's subject in 1665, and the cells were dead.","Correct. In 1674 Leeuwenhoek described the alga Spirogyra, the first living cells seen.","Orchid cells and the nucleus belong to Robert Brown in the 1830s.","His 1674 description concerned the alga Spirogyra, not red blood cells."]},{"tag":"M1·Q20","mid":"m01","difficulty":"hard","section":"History of the cell","qt":"single","source":"codex, slide 32","qc":"Which statement about early microscopists is supported by the lecture timeline?","options":["Hooke described bacteria in 1665, before Leeuwenhoek's microscopes existed","Leeuwenhoek had described bacteria by 1683, after Hooke named cells in 1665","Janssen described bacteria in 1595 with the first compound microscope","Brown described bacteria in 1831 before he identified the nucleus"],"correct_index":1,"explanations":["Hooke observed cork and named cells in 1665; bacteria were described later by Leeuwenhoek.","Correct. Hooke named cells in 1665, and Leeuwenhoek had described bacteria by 1683.","Janssen is credited only with constructing the first compound microscope in 1595.","Brown described the nucleus in plant cells between 1831 and 1833, not bacteria."]},{"tag":"M1·Q21","mid":"m01","difficulty":"easy","section":"Milestones in cell biology","qt":"single","source":"codex, slides 33 to 35","qc":"Who developed the polymerase chain reaction (PCR) in 1983?","options":["Shinya Yamanaka","Ernst Ruska","Camillo Golgi","Kary Mullis"],"correct_index":3,"explanations":["Yamanaka generated iPSCs in 2006. The right answer is: Kary Mullis.","Ruska co-developed the first electron microscope in 1931.","Golgi identified the Golgi apparatus in 1898.","Correct. Kary Mullis developed PCR in 1983."]},{"tag":"M1·Q22","mid":"m01","difficulty":"easy","section":"Milestones in cell biology","qt":"single","source":"codex, slides 33 to 35","qc":"Which genome-editing technology emerged in 2012?","options":["Polymerase chain reaction","CRISPR-Cas9","Super-resolution microscopy","The electron microscope"],"correct_index":1,"explanations":["PCR amplifies DNA and was developed in 1983.","Correct. CRISPR-Cas9 emerged in 2012 as a powerful genome-editing technology.","Super-resolution microscopy broke the diffraction limit in 2014.","The first electron microscope came in 1931."]},{"tag":"M1·Q23","mid":"m01","difficulty":"easy","section":"Milestones in cell biology","qt":"single","source":"codex, slides 33 to 35","qc":"Who generated induced pluripotent stem cells (iPSCs) in 2006?","options":["Kary Mullis","Shinya Yamanaka","Friedrich Miescher","Max Knoll"],"correct_index":1,"explanations":["Mullis developed PCR in 1983. The right answer is: Shinya Yamanaka.","Correct. Yamanaka generated iPSCs in 2006.","Miescher isolated nuclein in 1869. The right answer is: Shinya Yamanaka.","Knoll co-developed the first electron microscope in 1931."]},{"tag":"M1·Q24","mid":"m01","difficulty":"easy","section":"Milestones in cell biology","qt":"single","source":"codex, slides 33 to 35","qc":"What did Singer and Nicolson propose in 1972?","options":["The chromosome theory of inheritance","The double helix structure of DNA","The existence of introns in genes","The fluid mosaic model of the cell membrane"],"correct_index":3,"explanations":["Sutton and Boveri proposed this in 1902 to 1903.","Watson and Crick described this in 1953.","Introns and RNA splicing were discovered in 1977.","Correct. In 1972 they proposed the fluid mosaic model."]},{"tag":"M1·Q25","mid":"m01","difficulty":"easy","section":"Milestones in cell biology","qt":"single","source":"codex, slides 33 to 35","qc":"Which structure did Watson and Crick describe in 1953?","options":["The double helix of DNA","The fluid mosaic membrane","The Golgi apparatus","The nucleus of orchid cells"],"correct_index":0,"explanations":["Correct. Watson and Crick described the double helix, with contributions from Franklin and Wilkins.","That model came from Singer and Nicolson in 1972.","Golgi identified his apparatus in 1898.","Brown described the nucleus in the 1830s."]},{"tag":"M1·Q26","mid":"m01","difficulty":"medium","section":"Milestones in cell biology","qt":"single","source":"codex, slide 32","qc":"Which structure did Robert Brown describe in orchid cells between 1831 and 1833?","options":["The Golgi apparatus","The ribosome","The cell nucleus","The cork cell wall"],"correct_index":2,"explanations":["Camillo Golgi identified this structure much later, in 1898.","Ribosomes were described with electron microscopy in the 1940s and 1950s.","Correct. Brown identified and described the nucleus in plant (orchid) cells.","Hooke observed cork walls back in 1665, long before Brown."]},{"tag":"M1·Q27","mid":"m01","difficulty":"medium","section":"Milestones in cell biology","qt":"single","source":"codex, slide 33","qc":"In 1869 Friedrich Miescher isolated nuclein from cell nuclei. What molecule is this material?","options":["Messenger RNA from active genes","Deoxyribonucleic acid (DNA)","Ribosomal protein from the cytoplasm","Glycogen stored in the nucleus"],"correct_index":1,"explanations":["Messenger RNA was not what Miescher isolated; nuclein was identified as DNA.","Correct. Miescher's nuclein, isolated from nuclei in 1869, was DNA.","Nuclein came from nuclei, and ribosomes were described only in the 1940s and 1950s.","Glycogen is a carbohydrate energy store, not the nuclear material Miescher isolated."]},{"tag":"M1·Q28","mid":"m01","difficulty":"medium","section":"Milestones in cell biology","qt":"single","source":"codex, slide 33","qc":"Which cell structure did Camillo Golgi identify in 1898?","options":["The Golgi apparatus","The endoplasmic reticulum","The ribosomes","The chromosomes"],"correct_index":0,"explanations":["Correct. Golgi identified the structure that now bears his name in 1898.","The ER was described later, with electron microscopy in the 1940s and 1950s.","Ribosomes were also described by electron microscopy in the 1940s and 1950s.","Sutton and Boveri linked chromosomes to inheritance in 1902 to 1903, not Golgi."]},{"tag":"M1·Q29","mid":"m01","difficulty":"medium","section":"Milestones in cell biology","qt":"single","source":"codex, slide 33","qc":"What did Sutton and Boveri propose in 1902 and 1903?","options":["That nuclein is made of a double helix of DNA strands","That membranes are a fluid mosaic of lipids and proteins","That cells arise only from pre-existing cells","That chromosomes carry inherited information"],"correct_index":3,"explanations":["The double helix was described by Watson and Crick in 1953.","The fluid mosaic model came from Singer and Nicolson in 1972.","Virchow stated this principle in 1855, decades earlier.","Correct. Their chromosome theory of inheritance tied heredity to chromosomes."]},{"tag":"M1·Q30","mid":"m01","difficulty":"medium","section":"Milestones in cell biology","qt":"single","source":"codex, slide 34","qc":"Which scientists made key contributions alongside Watson and Crick to the 1953 double helix model?","options":["Friedrich Miescher and Camillo Golgi","Kary Mullis and Shinya Yamanaka","Rosalind Franklin and Maurice Wilkins","Singer and Nicolson in membrane research"],"correct_index":2,"explanations":["Miescher isolated nuclein in 1869 and Golgi identified his apparatus in 1898.","Mullis developed PCR in 1983 and Yamanaka generated iPSCs in 2006.","Correct. Franklin and Wilkins made key contributions to the 1953 double helix model.","Singer and Nicolson proposed the fluid mosaic model in 1972, not the double helix."]},{"tag":"M1·Q31","mid":"m01","difficulty":"medium","section":"Milestones in cell biology","qt":"single","source":"codex, slide 34","qc":"Which gene structure discovery was made in 1977?","options":["The deciphered genetic code","The double helix of DNA","Introns and RNA splicing","The polymerase chain reaction"],"correct_index":2,"explanations":["The genetic code was deciphered between 1961 and 1966.","The double helix was described in 1953.","Correct. Introns and RNA splicing were discovered in 1977.","Mullis developed PCR in 1983, a technique rather than a gene structure finding."]},{"tag":"M1·Q32","mid":"m01","difficulty":"hard","section":"Milestones in cell biology","qt":"single","source":"codex, slide 35","qc":"A lab must amplify pathogen DNA from a patient sample, reprogramme adult cells into pluripotent cells, and edit a gene. Which technologies fit these tasks, in that order?","options":["CRISPR-Cas9, PCR, induced pluripotent stem cells","Induced pluripotent stem cells, CRISPR-Cas9, PCR","PCR, induced pluripotent stem cells, CRISPR-Cas9","PCR, CRISPR-Cas9, induced pluripotent stem cells"],"correct_index":2,"explanations":["CRISPR-Cas9 does not amplify DNA samples, so the first match is wrong.","iPSC technology reprogrammes cells and cannot amplify pathogen DNA, so the first match is wrong.","Correct. PCR amplifies DNA, iPSC technology reprogrammes cells, and CRISPR-Cas9 edits genes.","PCR is right first, but CRISPR-Cas9 does not reprogramme adult cells into pluripotent cells."]},{"tag":"M1·Q33","mid":"m01","difficulty":"hard","section":"Milestones in cell biology","qt":"single","source":"codex, slides 32 to 35","qc":"Which scientist and discovery pairing is INCORRECT?","options":["Miescher: the double helix structure of DNA","Mullis: the polymerase chain reaction (PCR)","Sutton and Boveri: the chromosome theory of inheritance","Singer and Nicolson: the fluid mosaic model of the membrane"],"correct_index":0,"explanations":["Correct choice. This pairing is wrong: Miescher isolated nuclein in 1869, while Watson and Crick described the double helix in 1953.","This pairing is accurate; Kary Mullis developed PCR in 1983, so it is not the incorrect one.","This pairing is accurate; Sutton and Boveri proposed the chromosome theory of inheritance in 1902 to 1903.","This pairing is accurate; Singer and Nicolson proposed the fluid mosaic model in 1972."]},{"tag":"M1·Q34","mid":"m01","difficulty":"devil","section":"Milestones in cell biology","qt":"single","source":"codex, slides 33, 35","qc":"Which advance is correctly matched to what it made possible?","options":["PCR (1983): revealing the double helix structure of DNA through amplification of samples","iPSC generation (2006): leading to the discovery of introns and RNA splicing in genes","Electron microscope (1931): showing ultrastructure, leading to descriptions of the ER and ribosomes","CRISPR-Cas9 (2012): enabling the first isolation of nuclein from nuclei of human cells"],"correct_index":2,"explanations":["PCR amplifies DNA; the double helix was described in 1953, before PCR existed.","iPSCs came from reprogramming cells in 2006; introns and splicing were discovered in 1977.","Correct. The 1931 electron microscope revealed ultrastructure, and the ER and ribosomes were described by electron microscopy in the 1940s and 1950s.","CRISPR-Cas9 is a genome-editing tool from 2012; nuclein was isolated in 1869, long before."]},{"tag":"M1·Q35","mid":"m01","difficulty":"easy","section":"Cell theory","qt":"single","source":"codex, slides 36 to 39","qc":"According to the classical tenets, all living things are made up of what?","options":["Organs","Tissues","Organelles","Cells"],"correct_index":3,"explanations":["Organs are made of cells and are not the unit named in the tenet.","Tissues are made of cells and are not the unit named in the tenet.","Organelles are parts of cells and are not the unit named in the tenet.","Correct. The first tenet says all living things are made up of cells."]},{"tag":"M1·Q36","mid":"m01","difficulty":"easy","section":"Cell theory","qt":"single","source":"codex, slides 36 to 39","qc":"Who completed the classical cell theory in 1855?","options":["Theodor Schwann","Matthias Schleiden","Rudolf Virchow","Robert Brown"],"correct_index":2,"explanations":["Schwann extended the idea to animals in 1839.","Schleiden proposed in 1838 that plants are made of cells.","Correct. Virchow concluded in 1855 that all cells come from pre-existing cells.","Brown described the nucleus in the 1830s."]},{"tag":"M1·Q37","mid":"m01","difficulty":"easy","section":"Cell theory","qt":"single","source":"codex, slides 36 to 39","qc":"Who proposed in 1838 that all plants are composed of cells?","options":["Theodor Schwann","Rudolf Virchow","Matthias Schleiden","Robert Hooke"],"correct_index":2,"explanations":["Schwann extended the proposal to animals in 1839.","Virchow's contribution came in 1855. The right answer is: Matthias Schleiden.","Correct. Schleiden proposed this in 1838.","Hooke named the cell in 1665."]},{"tag":"M1·Q38","mid":"m01","difficulty":"easy","section":"Cell theory","qt":"single","source":"codex, slides 36 to 39","qc":"Who extended the idea that organisms are made of cells to animals in 1839?","options":["Matthias Schleiden","Rudolf Virchow","Antony van Leeuwenhoek","Theodor Schwann"],"correct_index":3,"explanations":["Schleiden's work in 1838 concerned plants.","Virchow completed the theory in 1855.","Leeuwenhoek described live cells in 1674.","Correct. Schwann extended Schleiden's idea to animals in 1839."]},{"tag":"M1·Q39","mid":"m01","difficulty":"easy","section":"Cell theory","qt":"single","source":"codex, slides 36 to 39","qc":"What name did Schleiden give to his proposed process of spontaneous crystallization?","options":["Free cell formation","Binary fission","Cell differentiation","Cell fusion"],"correct_index":0,"explanations":["Correct. Schleiden called it free cell formation, and it differs from modern theory.","Binary fission is division of an existing cell, not spontaneous crystallization.","Differentiation is specialization of cells and is a different idea.","Cell fusion joins cells, which is not what Schleiden proposed."]},{"tag":"M1·Q40","mid":"m01","difficulty":"easy","section":"Cell theory","qt":"single","source":"codex, slides 36 to 39","qc":"The classical tenets say cells are the smallest what of all living things?","options":["Storage units","Working units","Genetic units","Chemical units"],"correct_index":1,"explanations":["The tenet speaks of working units, not storage units.","Correct. Cells are the smallest working units of all living things.","Genes and DNA are not named as the unit in this tenet.","The tenet names working units, not chemical units."]},{"tag":"M1·Q41","mid":"m01","difficulty":"medium","section":"Cell theory","qt":"single","source":"codex, slides 36 to 39","qc":"Which scientist had already proposed that all cells come from pre-existing cells before Virchow?","options":["Robert Remak","Matthias Schleiden","Theodor Schwann","Robert Brown"],"correct_index":0,"explanations":["Correct. Remak had proposed it, and it has been suggested Virchow plagiarized him.","Schleiden proposed free cell formation, which is the opposite idea.","Schwann extended the theory to animals but did not state this idea.","Brown described the nucleus, not cell origin."]},{"tag":"M1·Q42","mid":"m01","difficulty":"medium","section":"Cell theory","qt":"single","source":"codex, slides 36 to 39","qc":"Which statement is part of the modern cell theory?","options":["Energy flow (metabolism) occurs within cells","Cells arise by spontaneous crystallization","Only plants are composed of cells","Cells are not the smallest working units"],"correct_index":0,"explanations":["Correct. Modern theory places metabolism within cells.","This is Schleiden's free cell formation, which was replaced.","Both plants and animals are composed of cells.","Cells are the smallest working units of living things."]},{"tag":"M1·Q43","mid":"m01","difficulty":"medium","section":"Cell theory","qt":"single","source":"codex, slides 36 to 39","qc":"Modern cell theory says hereditary information is passed from cell to cell during which process?","options":["Photosynthesis","Protein synthesis","Phagocytosis","Cell division"],"correct_index":3,"explanations":["Photosynthesis makes sugars and does not pass on hereditary information.","Protein synthesis uses genetic information but does not pass it between cells.","Phagocytosis is engulfment of material and does not pass on DNA.","Correct. DNA is passed from cell to cell during cell division."]},{"tag":"M1·Q44","mid":"m01","difficulty":"medium","section":"Cell theory","qt":"single","source":"codex, slides 36 to 39","qc":"In 1839, Schwann and Schleiden suggested what about cells?","options":["That all cells come from pre-existing cells","That cells contain hereditary DNA","That cells are the basic unit of life","That energy flow occurs outside cells"],"correct_index":2,"explanations":["Virchow completed that idea in 1855.","DNA-based heredity belongs to the modern cell theory.","Correct. They suggested that cells were the basic unit of life.","Modern theory places metabolism within cells."]},{"tag":"M1·Q45","mid":"m01","difficulty":"medium","section":"Cell theory","qt":"single","source":"codex, slides 36 to 39","qc":"How many classical tenets of cell theory are listed in the lecture?","options":["Two","Four","Three","Five"],"correct_index":2,"explanations":["Two is too few; three tenets are listed.","Four is too many; three tenets are listed.","Correct. The lecture lists three classical tenets.","Five is too many; three tenets are listed."]},{"tag":"M1·Q46","mid":"m01","difficulty":"medium","section":"Cell theory","qt":"single","source":"codex, slides 32, 37","qc":"A pathologist explains that a tumour enlarges because its cells keep dividing. Which principle, stated by Virchow in 1855, does this illustrate?","options":["Cells form spontaneously by crystallising out of fluid","Every cell must contain a prominent nucleus","All plants are composed of cells","All cells arise from pre-existing cells"],"correct_index":3,"explanations":["That is Schleiden's free cell formation, which Virchow's principle replaced.","Red blood cells lack nuclei, so this is not a rule of cell theory.","That was Schleiden's 1838 proposal, and it says nothing about where new cells come from.","Correct. Virchow's omnis cellula e cellula says new cells come from division of existing cells, as in tumour growth."]},{"tag":"M1·Q47","mid":"m01","difficulty":"hard","section":"Cell theory","qt":"multiple completion","source":"codex, slides 38, 39","qc":"Modern cell theory adds statements to the classical version. Which of these are additions rather than classical tenets? 1. Metabolism takes place within cells. 2. Cells carry hereditary DNA that is passed on during division. 3. All living things are made of cells. 4. All cells come from pre-existing cells.","options":["1 and 2 only","1, 2 and 3 only","3 and 4 only","2, 3 and 4 only"],"correct_index":0,"explanations":["Correct. Metabolism inside cells and DNA-based heredity are the modern additions; statements 3 and 4 are classical tenets.","Statement 3, that all living things are made of cells, is already a classical tenet, so it is not an addition.","Statements 3 and 4 are the classical tenets, so this choice picks the original statements and misses both additions.","Statements 3 and 4 are classical, and this option also leaves out statement 1, which is a modern addition."]},{"tag":"M1·Q48","mid":"m01","difficulty":"hard","section":"Cell theory","qt":"single","source":"codex, slides 36, 37","qc":"Which point shows that the 1839 Schwann and Schleiden theory was still incomplete?","options":["It lacked the idea that cells arise from existing cells, and Schleiden proposed spontaneous free cell formation","It rejected the idea of cells as the basic unit of life and treated whole tissues as the fundamental unit","It applied only to plants, because Schwann had not yet shown that animal tissues are also made of cells","It required every cell to contain a nucleus, a condition that red blood cells later showed to be false"],"correct_index":0,"explanations":["Correct. Cell origin from existing cells was missing, and Schleiden's free cell formation was later replaced by Virchow's principle.","Schwann and Schleiden did accept that cells are the basic unit of life, so this is not the gap.","Schwann extended the theory to animals in 1839, so it was not limited to plants.","Neither scientist made nuclei a requirement; the real gap concerned where cells come from."]},{"tag":"M1·Q49","mid":"m01","difficulty":"hard","section":"Cell theory","qt":"single","source":"codex, slides 32, 36, 37","qc":"Which statement correctly gives who proposed classical cell theory and when it was completed?","options":["Schwann and Virchow proposed it by 1839, and Schleiden completed it in 1855","Hooke and Brown proposed it by 1665, and Virchow completed it in 1831","Schleiden and Schwann proposed it by 1839, and Virchow completed it in 1855","Schleiden and Schwann proposed it by 1855, and Virchow completed it in 1839"],"correct_index":2,"explanations":["Virchow's contribution came in 1855, and Schleiden was part of the 1839 proposal.","Hooke named cells in 1665, but he and Brown did not propose cell theory.","Correct. Schleiden (1838) and Schwann (1839) established it, and Virchow completed it in 1855.","The dates are reversed; the theory began in 1839 and was completed in 1855."]},{"tag":"M1·Q50","mid":"m01","difficulty":"devil","section":"Cell theory","qt":"single","source":"codex, slide 39","qc":"Which statement would a supporter of modern cell theory reject?","options":["An organism's activity reflects the total activity of its cells","Metabolism occurs mainly in body fluid outside all cells","DNA carried in cells is passed on during cell division","Cells of similar species share basic chemical composition"],"correct_index":1,"explanations":["This matches modern cell theory, which says an organism's activity depends on the total activity of its cells.","Correct choice. Modern cell theory places energy flow (metabolism) inside cells, so this statement contradicts it.","This matches modern cell theory: hereditary DNA is passed from cell to cell during division.","This matches modern cell theory, which says such cells are basically the same in chemical composition."]},{"tag":"M1·Q51","mid":"m01","difficulty":"easy","section":"Diversity of cells","qt":"single","source":"codex, slides 41 to 49","qc":"Which blood cells are part of the immune system?","options":["White blood cells","Red blood cells","Platelets","Osteocytes"],"correct_index":0,"explanations":["Correct. White blood cells are part of the immune system.","Red blood cells carry oxygen. The right answer is: White blood cells.","Platelets provide substances that enable blood to clot.","Osteocytes are bone cells, not blood cells."]},{"tag":"M1·Q52","mid":"m01","difficulty":"easy","section":"Diversity of cells","qt":"single","source":"codex, slides 41 to 49","qc":"Gametes are haploid. What do they form when they fuse?","options":["A stem cell line","A muscle fibre","A red blood cell","A zygote"],"correct_index":3,"explanations":["Stem cells are undifferentiated cells and are not the result of gamete fusion.","A muscle fibre is a specialised cell made later in development.","Red blood cells lack nuclei and are not formed by fusion of gametes.","Correct. Gametes fuse to form a zygote."]},{"tag":"M1·Q53","mid":"m01","difficulty":"easy","section":"Diversity of cells","qt":"single","source":"codex, slides 41 to 49","qc":"What are stem cells capable of?","options":["Self-renewal and specialization","Only carrying oxygen in the blood","Only transmitting signals along axons","Only contracting to cause movement"],"correct_index":0,"explanations":["Correct. Stem cells are undifferentiated and can self-renew and specialise.","That describes red blood cells. The right answer is: Self-renewal and specialization.","That describes neurons. The right answer is: Self-renewal and specialization.","That describes muscle cells packed with contractile proteins."]},{"tag":"M1·Q54","mid":"m01","difficulty":"easy","section":"Diversity of cells","qt":"single","source":"codex, slides 41 to 49","qc":"Roughly how many distinct cell types does the human body contain?","options":["About 20","Over 200","About 50","Over 2,000"],"correct_index":1,"explanations":["This is far too few; there are over 200.","Correct. The human body has over 200 distinct cell types.","This is too few; there are over 200.","This is ten times too many."]},{"tag":"M1·Q55","mid":"m01","difficulty":"easy","section":"Diversity of cells","qt":"single","source":"codex, slide 44","qc":"Which feature distinguishes a mature human red blood cell from most other human cells?","options":["It contains two nuclei and divides quickly to repair tissue","It lacks a nucleus and is specialised to carry oxygen","It sits in lacunae and maintains the bone matrix","It is haploid and fuses with another cell to form a zygote"],"correct_index":1,"explanations":["Red blood cells have no nucleus at all, so having two is wrong.","Correct. Red blood cells have no nucleus, which suits their job of transporting oxygen.","That describes osteocytes, the bone cells, not red blood cells.","That describes gametes such as sperm and egg, not red blood cells."]},{"tag":"M1·Q56","mid":"m01","difficulty":"easy","section":"Diversity of cells","qt":"single","source":"codex, slide 43","qc":"Which cell type extends axons and dendrites to transmit signals?","options":["Osteocytes of bone tissue","Red blood cells of the circulation","Neurons of the nervous system","Gametes such as sperm and egg"],"correct_index":2,"explanations":["Osteocytes sit in lacunae and maintain bone matrix, rather than transmitting signals.","Red blood cells carry oxygen and have no nucleus; they do not extend axons or dendrites.","Correct. Neurons extend axons and dendrites to transmit signals.","Gametes are haploid cells that fuse to form a zygote, not signal-transmitting cells."]},{"tag":"M1·Q57","mid":"m01","difficulty":"easy","section":"Diversity of cells","qt":"single","source":"codex, slide 44","qc":"Which cell type is packed with contractile proteins?","options":["Red blood cells that carry oxygen","Osteocytes that maintain bone matrix","Muscle cells that generate movement","Neurons that transmit electrical signals"],"correct_index":2,"explanations":["Red blood cells lack nuclei and carry oxygen; contractile proteins define muscle cells.","Osteocytes reside in lacunae and maintain bone matrix, rather than contracting.","Correct. Muscle cells are packed with contractile proteins that generate movement.","Neurons transmit signals through axons and dendrites and are not defined by contractile proteins."]},{"tag":"M1·Q58","mid":"m01","difficulty":"medium","section":"Diversity of cells","qt":"single","source":"codex, slides 41 to 49","qc":"Which statement about oxygen and cells is supported?","options":["Oxygen is essential for every cell of every organism","Oxygen kills every cell that is exposed to it","Oxygen has no effect on any cell at all","Oxygen kills some cells but is essential for others"],"correct_index":3,"explanations":["Some cells are killed by oxygen.","Many cells need oxygen. The right answer is: Oxygen kills some cells but is essential for others.","Oxygen kills some cells and is essential to others.","Correct. Cells vary in their need for oxygen."]},{"tag":"M1·Q59","mid":"m01","difficulty":"medium","section":"Diversity of cells","qt":"single","source":"codex, slides 41 to 49","qc":"Which example shows a unicellular organism living in close association with another organism?","options":["A lone amoeba living freely in a drop of pond water","Bacteria that help plants extract nitrogen from the air","A neuron forming connections in the cerebellum","A red blood cell carrying oxygen through the blood"],"correct_index":1,"explanations":["This is a unicellular organism living in isolation.","Correct. Such bacteria live in association with plants.","A neuron is a cell within a multicellular organism, not an associated unicellular organism.","A red blood cell is part of a multicellular body."]},{"tag":"M1·Q60","mid":"m01","difficulty":"medium","section":"Diversity of cells","qt":"single","source":"codex, slides 41 to 49","qc":"About how large is the human egg cell?","options":["About 2 micrometres","About 200 micrometres","About 20 micrometres","About 2 millimetres"],"correct_index":1,"explanations":["This is the size of a small bacterium.","Correct. The human egg is about 200 micrometres.","This is too small; the egg is about 200 micrometres.","This is ten times too large."]},{"tag":"M1·Q61","mid":"m01","difficulty":"medium","section":"Diversity of cells","qt":"single","source":"codex, slides 41 to 49","qc":"Where do osteocytes reside, and what do they do?","options":["They float in the blood and carry oxygen","They sit in the cerebellum and form synapses","They line the muscles and contain contractile proteins","They reside in lacunae and maintain the bone matrix"],"correct_index":3,"explanations":["That describes red blood cells. The right answer is: They reside in lacunae and maintain the bone matrix.","That describes neurons such as Purkinje cells.","That describes muscle cells. The right answer is: They reside in lacunae and maintain the bone matrix.","Correct. Osteocytes sit in lacunae and maintain bone matrix."]},{"tag":"M1·Q62","mid":"m01","difficulty":"medium","section":"Diversity of cells","qt":"multiple completion","source":"codex, slides 41 to 49","qc":"Which statements about unicellular organisms are correct? 1. Some live in isolation. 2. Others form colonies. 3. All of them lack DNA. 4. None of them respond to stimuli.","options":["1 and 2 only","1, 2 and 3 only","2 and 4 only","3 and 4 only"],"correct_index":0,"explanations":["Correct. Some unicellular organisms live in isolation, and others form colonies or live in association.","Statement 3 is false; unicellular organisms contain DNA.","Statement 4 is false; they respond to stimuli, and this option omits statement 1.","Statements 3 and 4 are both false."]},{"tag":"M1·Q63","mid":"m01","difficulty":"medium","section":"Diversity of cells","qt":"single","source":"codex, slides 41 to 49","qc":"Which statement about the human egg and sperm cells is correct?","options":["Both are multicellular structures that divide before fusing","Both are single cells, and their union starts the development of the body","Only the egg is a cell, and sperm is a non-living particle","Both are diploid cells that contain 92 chromosomes each"],"correct_index":1,"explanations":["Each is a single cell. The right answer is: Both are single cells, and their union starts the development of the body.","Correct. The egg and sperm are single cells whose union begins development.","Sperm cells are single cells too.","Gametes are haploid. The right answer is: Both are single cells, and their union starts the development of the body."]},{"tag":"M1·Q64","mid":"m01","difficulty":"medium","section":"Diversity of cells","qt":"single","source":"codex, slide 48","qc":"Which blood element provides substances that let blood clot at a wound?","options":["The platelets circulating in blood","The red cells circulating in blood","The white cells circulating in blood","The osteocytes embedded in bone"],"correct_index":0,"explanations":["Correct. Platelets provide the substances that allow blood to clot at a wound.","Red blood cells carry oxygen rather than driving clotting.","White blood cells are part of the immune system, not the clotting response.","Osteocytes maintain bone matrix and are not found circulating in blood."]},{"tag":"M1·Q65","mid":"m01","difficulty":"hard","section":"Diversity of cells","qt":"single","source":"codex, slide 47","qc":"A microbiologist finds a microbe in cattle rumen that converts carbon dioxide and water into methane, around 150 litres of gas a day per animal. Which group does it belong to?","options":["Archaebacteria such as Methanosarcina","Filamentous algae such as Spirogyra","Rotifers that move rapidly in water","Bacteria that help plants obtain nitrogen"],"correct_index":0,"explanations":["Correct. Methanosarcina is an archaebacterium that makes methane from CO2 and water, and some live in cattle rumen.","Spirogyra is an alga that Leeuwenhoek observed; it does not produce methane in the rumen.","Rotifers are cited as fast-moving organisms, not as methane producers.","Nitrogen-helping bacteria assist plants and do not generate methane in cattle."]},{"tag":"M1·Q66","mid":"m01","difficulty":"hard","section":"Diversity of cells","qt":"single","source":"codex, slides 42, 49","qc":"A Purkinje neuron in the cerebellum can form over 100,000 connections through its dendrites. Which idea about cells does this best illustrate?","options":["All human cell types share one identical structure","Cells with more connections must contain several nuclei","Nerve cells are not true cells but extensions of tissue","Cell shape and structure are specialised for function"],"correct_index":3,"explanations":["Human cells vary widely in size, shape and structure, so they are not identical.","Connections come from dendrite branching, not extra nuclei; a neuron has one nucleus.","Neurons are true cells, specialised to transmit signals with axons and dendrites.","Correct. A cell's shape and structure reflect its specialised role, as a neuron's extensive dendrites show."]},{"tag":"M1·Q67","mid":"m01","difficulty":"hard","section":"Diversity of cells","qt":"single","source":"codex, slide 41","qc":"A lecture lists amoebae and rotifers as organisms that move rapidly, while others stay largely stationary. Which idea about living things does this illustrate?","options":["Movement is what separates living cells from non-living material","Rapid movement is required before an organism counts as single-celled","Cells that stay in place cannot reproduce or respond to stimuli","Cells and organisms show great diversity, including differences in movement"],"correct_index":3,"explanations":["Plants stay largely stationary yet are alive, so movement cannot be the dividing line.","Single-celled organisms need not move rapidly, so this is not a requirement.","Stationary cells can still reproduce and respond to stimuli, so this is false.","Correct. The examples illustrate the variety of living things, including differences in movement."]},{"tag":"M1·Q68","mid":"m01","difficulty":"devil","section":"Diversity of cells","qt":"single","source":"codex, slide 43","qc":"Which statement correctly distinguishes human gametes from stem cells?","options":["Gametes can self-renew and specialise, while stem cells are haploid and fuse to form a zygote","Both cell types are haploid, but only stem cells can fuse with another cell to form a zygote","Gametes are haploid and fuse to form a zygote, while stem cells can self-renew and specialise","Both self-renew without limit, but only gametes can specialise into different kinds of tissue"],"correct_index":2,"explanations":["This swaps the two cell types; gametes do not self-renew, and stem cells are not gametes.","Stem cells are not described as haploid and do not fuse to form a zygote; gametes do.","Correct. Gametes are haploid and fuse into a zygote; stem cells are undifferentiated and can renew themselves and specialise.","Gametes do not specialise into tissues; stem cells self-renew and specialise, so this reverses the facts."]},{"tag":"M1·Q69","mid":"m01","difficulty":"easy","section":"The nucleus: envelope and pores","qt":"single","source":"codex, slides 54 to 62","qc":"What is the gap between the two membranes of the nuclear envelope called?","options":["The perinuclear space","The nucleoplasm","The cytosol","The annulus"],"correct_index":0,"explanations":["Correct. The two membranes are separated by the perinuclear space.","The nucleoplasm is the material inside the nucleus.","The cytosol lies outside the nucleus.","The annulus is the ring of protein granules around a pore."]},{"tag":"M1·Q70","mid":"m01","difficulty":"easy","section":"The nucleus: envelope and pores","qt":"single","source":"codex, slides 54 to 62","qc":"How many protein granules surround each nuclear pore?","options":["Four","Six","Twelve","Eight"],"correct_index":3,"explanations":["Four is too few; the annulus has eight granules.","Six is too few; the annulus has eight granules.","Twelve is too many; the annulus has eight granules.","Correct. Eight protein granules are arranged symmetrically around each pore."]},{"tag":"M1·Q71","mid":"m01","difficulty":"easy","section":"The nucleus: envelope and pores","qt":"single","source":"codex, slides 54 to 62","qc":"Where are nuclear pores found?","options":["Where the outer and inner membranes fuse","Only on the surface of the nucleolus","On the inner membrane alone","Where the envelope meets the Golgi"],"correct_index":0,"explanations":["Correct. Pores sit at regions where the two membranes fuse.","The nucleolus has no membrane and no pores.","Pores form where both membranes fuse, not on one membrane alone.","The outer membrane is continuous with rough ER, not with the Golgi."]},{"tag":"M1·Q72","mid":"m01","difficulty":"easy","section":"The nucleus: envelope and pores","qt":"single","source":"codex, slides 54 to 62","qc":"The nuclear pores are described as being filled with what?","options":["Lipid","Water","DNA","Glycogen"],"correct_index":1,"explanations":["Lipid forms membranes, not the contents of the pores.","Correct. The nuclear pores are water-filled.","DNA is held within the nucleus, not in the pores.","Glycogen is a carbohydrate store and does not fill the pores."]},{"tag":"M1·Q73","mid":"m01","difficulty":"easy","section":"The nucleus: envelope and pores","qt":"single","source":"codex, slide 59","qc":"Which organelle is described as the control centre of the cell and holds its DNA?","options":["The ribosome, built from rRNA and protein","The lysosome, filled with hydrolytic enzymes","The Golgi apparatus, a stack of flattened sacs","The nucleus, enclosed by a double membrane"],"correct_index":3,"explanations":["Ribosomes make proteins; they are not the control centre that holds the DNA.","Lysosomes carry out intracellular digestion and do not hold the DNA.","The Golgi apparatus modifies and packages materials for transport, not for storing DNA.","Correct. The nucleus is the control centre of the cell and contains its DNA."]},{"tag":"M1·Q74","mid":"m01","difficulty":"easy","section":"The nucleus: envelope and pores","qt":"single","source":"codex, slides 54, 61","qc":"How many membranes surround the nucleus?","options":["One membrane, forming a single boundary layer","Two membranes, together forming the nuclear envelope","None, because the nucleus is only a free region","Three, with an extra membrane around the nucleolus"],"correct_index":1,"explanations":["The nucleus has a double membrane, so one layer is not enough.","Correct. The nuclear envelope is a double membrane separated by the perinuclear space.","The nucleus is a membrane-bound organelle with a double-membrane envelope.","The nucleolus has no membrane, so there is no third layer."]},{"tag":"M1·Q75","mid":"m01","difficulty":"medium","section":"The nucleus: envelope and pores","qt":"single","source":"codex, slides 54 to 62","qc":"What kind of symmetry does the annulus around a nuclear pore show?","options":["Fourfold (square) symmetry","Sixfold (hexagonal) symmetry","Eightfold (octagonal) symmetry","No symmetry at all"],"correct_index":2,"explanations":["The annulus has eight subunits, not four.","The annulus has eight subunits, not six.","Correct. Eight protein subunits give octagonal symmetry.","The annulus is highly organised and symmetrical."]},{"tag":"M1·Q76","mid":"m01","difficulty":"medium","section":"The nucleus: envelope and pores","qt":"single","source":"codex, slides 54 to 62","qc":"The proteins that assemble the nuclear pore complex are mainly called what?","options":["Nucleoporins","Histones","Tubulins","Lamins"],"correct_index":0,"explanations":["Correct. Nucleoporins assemble into the nuclear pore complex.","Histones are chromatin proteins that associate with DNA.","Tubulins form microtubules in the cytoskeleton.","Lamins form the nuclear lamina and are not the main pore proteins."]},{"tag":"M1·Q77","mid":"m01","difficulty":"medium","section":"The nucleus: envelope and pores","qt":"single","source":"codex, slides 54 to 62","qc":"Which statement about the nuclear pore complex is correct?","options":["It synthesises ribosomal RNA for the nucleolus","It condenses chromosomes before cell division","It regulates transport of RNA and proteins","It stores calcium ions for the cell"],"correct_index":2,"explanations":["rRNA is made in the nucleolus, not by the pore complex.","Chromosome condensation involves the DNA and its proteins, not the pore complex.","Correct. The complex regulates transport between nucleus and cytoplasm.","Calcium storage is a function of the smooth ER."]},{"tag":"M1·Q78","mid":"m01","difficulty":"medium","section":"The nucleus: envelope and pores","qt":"single","source":"codex, slides 54 to 62","qc":"All of the following are true of the nuclear envelope EXCEPT which one?","options":["It is a double membrane with a gap between","It is perforated by water-filled nuclear pores","Its outer membrane is continuous with the rough ER","Its inner membrane is continuous with the rough ER"],"correct_index":3,"explanations":["This is true; it has two membranes.","This is true; pores perforate the envelope.","This is true; the outer membrane joins the rough ER.","Correct choice. The outer membrane, not the inner one, is continuous with the rough ER."]},{"tag":"M1·Q79","mid":"m01","difficulty":"medium","section":"The nucleus: envelope and pores","qt":"single","source":"codex, slides 54, 85","qc":"Which feature links the nuclear envelope to the endomembrane system?","options":["Its inner membrane is continuous with the Golgi apparatus","Its outer membrane is continuous with the rough ER","Its pores fuse directly with the lysosome membrane","Its perinuclear space is shared with the plasma membrane"],"correct_index":1,"explanations":["The Golgi apparatus is not continuous with the nuclear envelope; the outer membrane joins the rough ER.","Correct. The outer nuclear membrane is continuous with the rough ER.","Nuclear pores regulate nucleus and cytoplasm traffic and do not fuse with lysosomes.","The perinuclear space lies between the two nuclear membranes only."]},{"tag":"M1·Q80","mid":"m01","difficulty":"hard","section":"The nucleus: envelope and pores","qt":"single","source":"codex, slides 61, 62","qc":"Which description of the nuclear pore complex is accurate?","options":["Six histone subunits in hexagonal symmetry regulate transport of RNA and proteins into the nucleus","Eight protein subunits in octagonal symmetry, mainly nucleoporins, regulate transport of RNA and proteins","Eight protein subunits in octagonal symmetry form a fixed open hole that lets all molecules pass","Four nucleoporin subunits in square symmetry, found only on the inner membrane, move DNA out"],"correct_index":1,"explanations":["The annulus has eight subunits made mainly of nucleoporins, not six histone subunits.","Correct. The annulus has eightfold symmetry and is built mainly of nucleoporins that regulate transport.","The pore complex regulates transport and does not let all molecules pass.","Pores lie where the membranes fuse, have eight subunits and do not move DNA out."]},{"tag":"M1·Q81","mid":"m01","difficulty":"hard","section":"The nucleus: envelope and pores","qt":"single","source":"codex, slide 61","qc":"On an electron micrograph the two nuclear membranes are separated by a gap but meet at certain points. What are the gap and the meeting points?","options":["The perinuclear space, and sites where pores form","The nucleoplasm, and sites where nucleoli attach","The perinuclear space, and sites where ribosomes dock","The annulus, and sites where histones bind"],"correct_index":0,"explanations":["Correct. The gap is the perinuclear space, and pores form where the membranes fuse.","The nucleoplasm is inside the nucleus, and nucleoli lie within it, not on the envelope.","The gap is correct, but pores, not ribosome docking sites, form where the membranes meet.","The annulus surrounds pores and is not the gap; histones bind DNA inside the nucleus."]},{"tag":"M1·Q82","mid":"m01","difficulty":"devil","section":"The nucleus: envelope and pores","qt":"single","source":"codex, slides 54, 58","qc":"Which statement correctly contrasts the nucleus with the nucleolus?","options":["The nucleus has a double membrane envelope, whereas the nucleolus has no membrane and assembles ribosomal subunits","The nucleolus has a double membrane envelope, whereas the nucleus has none and assembles ribosomal subunits","Both have a double membrane envelope, but only the nucleolus is involved in assembling ribosomal subunits","Both lack a surrounding membrane, but only the nucleus contains DNA and is perforated by nuclear pores"],"correct_index":0,"explanations":["Correct. The nucleus has a double membrane envelope, while the nucleolus lacks a membrane and assembles ribosomal subunits.","This swaps the two structures; the nucleus is the one with the envelope.","The nucleolus has no membrane, so it does not have a double membrane envelope.","The nucleus has a double membrane envelope, so it does not lack a surrounding membrane."]},{"tag":"M1·Q83","mid":"m01","difficulty":"easy","section":"Nuclear transport and contents","qt":"single","source":"codex, slides 62 to 71","qc":"Where are nuclear proteins produced?","options":["Inside the nucleolus","In the perinuclear space","In the nuclear pores","In the cytosol"],"correct_index":3,"explanations":["The nucleolus makes ribosomal subunits, not nuclear proteins.","The perinuclear space is a gap between membranes, not a synthesis site.","The pores are channels and do not make proteins.","Correct. Nuclear proteins, like all proteins, are produced in the cytosol."]},{"tag":"M1·Q84","mid":"m01","difficulty":"easy","section":"Nuclear transport and contents","qt":"single","source":"codex, slides 62 to 71","qc":"What do the nuclear pores regulate?","options":["The folding of chromatin into nucleosomes inside the nucleus","The assembly of ribosomal subunits in the nucleolus","The passage of molecules between the nucleus and cytoplasm","The doubling of DNA before the cell divides"],"correct_index":2,"explanations":["Nucleosome formation involves DNA and histones.","Subunit assembly happens in the nucleolus.","Correct. The pores permit some molecules to pass and block others.","DNA copying is not a pore function."]},{"tag":"M1·Q85","mid":"m01","difficulty":"easy","section":"Nuclear transport and contents","qt":"single","source":"codex, slides 62 to 71","qc":"Glycoproteins at the nuclear pore appear to regulate what?","options":["The transcription of rRNA in the nucleolus","The doubling of DNA before cell division","The entry of material into the nucleus","The size of the nucleolus in the nucleus"],"correct_index":2,"explanations":["Transcription of rRNA occurs in the nucleolus.","DNA doubling is not controlled by pore glycoproteins.","Correct. Glycoproteins appear to regulate entry into the nucleus.","Pore glycoproteins are not linked to nucleolus size."]},{"tag":"M1·Q86","mid":"m01","difficulty":"medium","section":"Nuclear transport and contents","qt":"single","source":"codex, slides 62 to 71","qc":"Some molecules much bigger than nuclear pores pass freely, while some far smaller are blocked. What does this show about nuclear entry?","options":["It depends only on the size of the molecule","It is selective and does not depend on size alone","It is completely random","It depends only on whether a molecule is charged"],"correct_index":1,"explanations":["The observations contradict a size-only rule.","Correct. Entry is regulated and selective, not purely a size filter.","Entry is regulated, not random. The right answer is: It is selective and does not depend on size alone.","The lecture does not state that charge alone decides entry."]},{"tag":"M1·Q87","mid":"m01","difficulty":"medium","section":"Nuclear transport and contents","qt":"single","source":"codex, slides 62 to 71","qc":"Which materials are allowed into the nucleus to build DNA and RNA?","options":["Fully assembled lysosomes from the cytoplasm","Building blocks and molecules that provide energy","Complete finished chromosomes from the cytoplasm","Intact mitochondria from the cytoplasm"],"correct_index":1,"explanations":["Lysosomes are far too large and are not imported.","Correct. Building blocks for DNA and RNA and energy molecules are allowed in.","Chromosomes are made inside the nucleus.","Mitochondria are far too large to pass through pores."]},{"tag":"M1·Q88","mid":"m01","difficulty":"medium","section":"Nuclear transport and contents","qt":"single","source":"codex, slides 62 to 71","qc":"Chromatin material embedded in the nucleoplasm is the precursor of what?","options":["Ribosomes","Lysosomes","Chromosomes","Nuclear pores"],"correct_index":2,"explanations":["Ribosomes are assembled from rRNA and proteins in the nucleolus.","Lysosomes are produced by the Golgi apparatus.","Correct. Chromatin is the precursor of chromosomes.","Pores are built from nucleoporins at membrane fusion sites."]},{"tag":"M1·Q89","mid":"m01","difficulty":"medium","section":"Nuclear transport and contents","qt":"single","source":"codex, slides 62 to 71","qc":"Which two structures are contained within the nucleus?","options":["The nucleolus and the nucleoplasm","The Golgi cisternae and the nucleolus","The cristae and the nucleoplasm","The thylakoids and the nucleolus"],"correct_index":0,"explanations":["Correct. The nucleus contains the nucleolus and the nucleoplasm.","Golgi cisternae are outside the nucleus.","Cristae are folds inside mitochondria. The right answer is: The nucleolus and the nucleoplasm.","Thylakoids are found in chloroplasts. The right answer is: The nucleolus and the nucleoplasm."]},{"tag":"M1·Q90","mid":"m01","difficulty":"hard","section":"Nuclear transport and contents","qt":"single","source":"codex, slide 66","qc":"Nuclear proteins are made on ribosomes in the cytosol. Which feature lets them accumulate selectively in the nucleus?","options":["Their synthesis on ribosomes located inside the nucleolus","Their small size, which lets only nuclear proteins slip through pores","Packaging into lysosomes that deliver them across the envelope","Amino acid sequences that act as signals directing them to the nucleus"],"correct_index":3,"explanations":["Nuclear proteins are made in the cytosol, so this location is wrong.","Size alone does not decide entry; signals do, and some small molecules are excluded.","Lysosomes digest materials and do not deliver proteins into the nucleus.","Correct. Signal sequences of amino acids concentrate these proteins in the nucleus."]},{"tag":"M1·Q91","mid":"m01","difficulty":"easy","section":"Chromatin and chromosomes","qt":"single","source":"codex, slides 64 to 69","qc":"What is the complex of DNA and protein in chromosomes called?","options":["Chromatin","Cytosol","Nucleoid","Cytoskeleton"],"correct_index":0,"explanations":["Correct. The nucleoprotein complex of DNA and protein is chromatin.","The cytosol is the fluid of the cytoplasm.","The nucleoid is the DNA region of a prokaryotic cell.","The cytoskeleton is a network of protein filaments."]},{"tag":"M1·Q92","mid":"m01","difficulty":"easy","section":"Chromatin and chromosomes","qt":"single","source":"codex, slides 64 to 69","qc":"Chromatin is made up of repeating structural units called what?","options":["Nucleosomes","Nucleoporins","Cisternae","Cristae"],"correct_index":0,"explanations":["Correct. Chromatin is made up of repeating nucleosomes.","Nucleoporins are proteins of the nuclear pore complex.","Cisternae are the flattened sacs of the Golgi apparatus.","Cristae are folds of the inner mitochondrial membrane."]},{"tag":"M1·Q93","mid":"m01","difficulty":"easy","section":"Chromatin and chromosomes","qt":"single","source":"codex, slides 64 to 69","qc":"On which structures are genes found?","options":["Ribosomes","Nucleoli","Lysosomes","Chromosomes"],"correct_index":3,"explanations":["Ribosomes make proteins and do not carry the genes.","Nucleoli make ribosomal subunits. The right answer is: Chromosomes.","Lysosomes digest materials. The right answer is: Chromosomes.","Correct. Genes are found on chromosomes."]},{"tag":"M1·Q94","mid":"m01","difficulty":"easy","section":"Chromatin and chromosomes","qt":"single","source":"codex, slides 64 to 69","qc":"What does each gene direct the synthesis of?","options":["A specific lipid","A specific ribosome","A specific organelle","A specific protein"],"correct_index":3,"explanations":["Lipids are not directly encoded by single genes.","Ribosomes are assembled from many components.","An organelle is built from many molecules.","Correct. Each gene directs the synthesis of a specific protein."]},{"tag":"M1·Q95","mid":"m01","difficulty":"easy","section":"Chromatin and chromosomes","qt":"single","source":"codex, slide 64","qc":"How many DNA chromosomes does a human cell contain?","options":["23 chromosomes","48 chromosomes","46 chromosomes","92 chromosomes"],"correct_index":2,"explanations":["This is the number in a haploid gamete, not in a typical human cell.","This figure is wrong for humans, who have 46.","Correct. A human cell contains 46 chromosomes.","This is double the human number and would be seen only after DNA doubling."]},{"tag":"M1·Q96","mid":"m01","difficulty":"medium","section":"Chromatin and chromosomes","qt":"single","source":"codex, slides 64 to 69","qc":"What form do the chromosomes take in dividing cells?","options":["Loosely dispersed chromatin","Free RNA strands","Tightly packed DNA","Membrane-bound vesicles"],"correct_index":2,"explanations":["Loose chromatin is typical of non-dividing cells.","Chromosomes contain DNA. The right answer is: Tightly packed DNA.","Correct. Chromosomes in dividing cells are tightly packed DNA.","Chromosomes are not enclosed in vesicles."]},{"tag":"M1·Q97","mid":"m01","difficulty":"medium","section":"Chromatin and chromosomes","qt":"single","source":"codex, slides 64 to 69","qc":"A nucleoprotein is best described as what?","options":["A protein made entirely of histones","A complex of nucleic acid and protein","A lipid bound to DNA in the nucleus","A carbohydrate bound to RNA in the cytosol"],"correct_index":1,"explanations":["Histones form only part of chromatin and need DNA.","Correct. Chromatin is a nucleoprotein, a complex of DNA and protein.","A nucleoprotein is DNA with protein, not lipid.","A nucleoprotein contains protein. The right answer is: A complex of nucleic acid and protein."]},{"tag":"M1·Q98","mid":"m01","difficulty":"medium","section":"Chromatin and chromosomes","qt":"single","source":"codex, slides 64 to 69","qc":"By mass, which component makes up about two-thirds of a eukaryotic chromosome?","options":["Protein","DNA","RNA","Lipid"],"correct_index":0,"explanations":["Correct. Chromosomes are about one-third DNA and two-thirds protein.","DNA makes up only about one-third.","RNA is not the main component of chromosomes.","Lipid is not a major component of chromosomes."]},{"tag":"M1·Q99","mid":"m01","difficulty":"medium","section":"Chromatin and chromosomes","qt":"single","source":"codex, slides 64 to 69","qc":"All of the following describe chromatin EXCEPT which one?","options":["It is a complex of DNA and protein","It makes up chromosomes","It is built from repeating nucleosomes","It is enclosed by its own double membrane"],"correct_index":3,"explanations":["This is true; chromatin is a nucleoprotein.","This is true; chromatin forms chromosomes.","This is true; nucleosomes are its repeating units.","Correct choice. Chromatin is not enclosed by its own membrane; the nucleus is."]},{"tag":"M1·Q100","mid":"m01","difficulty":"medium","section":"Chromatin and chromosomes","qt":"single","source":"codex, slide 69","qc":"By mass, how is a eukaryotic chromosome divided between DNA and protein?","options":["About one-third DNA and two-thirds protein","About two-thirds DNA and one-third protein","About equal parts DNA and protein by mass","Almost entirely DNA, with only traces of protein"],"correct_index":0,"explanations":["Correct. Eukaryotic chromosomes are about one-third DNA and two-thirds protein.","This reverses the ratio; protein is the larger share.","Protein makes up about twice as much as DNA, not an equal share.","Chromosomes are a nucleoprotein, with protein making up most of the mass."]},{"tag":"M1·Q101","mid":"m01","difficulty":"medium","section":"Chromatin and chromosomes","qt":"single","source":"codex, slide 69","qc":"Histones, the main proteins of chromatin, are best described as what?","options":["Small, basic proteins that associate with DNA","Large, acidic enzymes that copy DNA","Lipid molecules that form the nuclear envelope","RNA molecules that assemble ribosomal subunits"],"correct_index":0,"explanations":["Correct. Histones are small, basic proteins that form chromatin with DNA.","Histones are small and basic, and they are structural proteins rather than copying enzymes.","Histones are proteins, not lipids, and are part of chromatin.","Histones are proteins; rRNA is what helps form ribosomal subunits."]},{"tag":"M1·Q102","mid":"m01","difficulty":"hard","section":"Chromatin and chromosomes","qt":"single","source":"codex, slide 64","qc":"A human cell is about to divide. Which sequence of events for its chromosomal DNA is correct?","options":["The chromosomes condense first, then the DNA doubles itself in packed form","The DNA doubles itself, then the chromosomes condense into tightly packed forms","The DNA doubles itself, then it leaves the nucleus through the pores","The DNA is degraded, then rebuilt from histone proteins alone"],"correct_index":1,"explanations":["The slide gives the reverse order: the DNA doubles before it condenses.","Correct. DNA doubles itself before it condenses into tightly packed chromosomes.","Dividing cells carry packed chromosomes; DNA does not exit through the pores.","DNA is copied, not degraded, and histones alone cannot rebuild it."]},{"tag":"M1·Q103","mid":"m01","difficulty":"easy","section":"Ribosomes and protein synthesis","qt":"single","source":"codex, slides 72 to 79","qc":"What is the function of ribosomes?","options":["Lipid synthesis","ATP production","Photosynthesis","Protein synthesis"],"correct_index":3,"explanations":["Lipid synthesis is a function of the smooth ER.","ATP production happens mainly in mitochondria.","Photosynthesis occurs in chloroplasts. The right answer is: Protein synthesis.","Correct. Ribosomes make proteins. It matches what the lecture slides state."]},{"tag":"M1·Q104","mid":"m01","difficulty":"easy","section":"Ribosomes and protein synthesis","qt":"single","source":"codex, slides 72 to 79","qc":"Where do free ribosomes float?","options":["Inside the nucleolus","In the cytosol","In the perinuclear space","Inside the thylakoids"],"correct_index":1,"explanations":["The nucleolus assembles subunits; free ribosomes float in the cytosol.","Correct. Free ribosomes float in the cytosol.","The perinuclear space is between the two nuclear membranes.","Thylakoids belong to chloroplasts. The right answer is: In the cytosol."]},{"tag":"M1·Q105","mid":"m01","difficulty":"easy","section":"Ribosomes and protein synthesis","qt":"single","source":"codex, slides 72 to 79","qc":"What carries the instructions for making a protein from DNA?","options":["A ribosomal protein","Messenger RNA","A phospholipid","Glycogen"],"correct_index":1,"explanations":["Ribosomal proteins are components of ribosomes.","Correct. DNA is transcribed onto a messenger RNA molecule.","Phospholipids form membranes. The right answer is: Messenger RNA.","Glycogen is a carbohydrate store. The right answer is: Messenger RNA."]},{"tag":"M1·Q106","mid":"m01","difficulty":"easy","section":"Ribosomes and protein synthesis","qt":"single","source":"codex, slides 72 to 79","qc":"What are the two subunits of a ribosome called?","options":["The cis subunit and the trans subunit","The inner subunit and the outer subunit","The large subunit and the small subunit","The alpha subunit and the beta subunit"],"correct_index":2,"explanations":["Cis and trans are faces of the Golgi apparatus.","Inner and outer describe mitochondrial membranes.","Correct. A ribosome has a large and a small subunit.","Alpha and beta describe tubulins, which are not ribosome subunits."]},{"tag":"M1·Q107","mid":"m01","difficulty":"easy","section":"Ribosomes and protein synthesis","qt":"single","source":"codex, slides 72 to 79","qc":"What does the nucleolus make?","options":["Ribosomal subunits","Lysosomal enzymes","Chlorophyll for the chloroplast","Cell wall cellulose"],"correct_index":0,"explanations":["Correct. The nucleolus makes ribosomal subunits from rRNA and proteins.","Lysosomes are produced by the Golgi apparatus.","Chlorophyll is a pigment found in chloroplasts.","Cellulose forms the plant cell wall and is not made by the nucleolus."]},{"tag":"M1·Q108","mid":"m01","difficulty":"easy","section":"Ribosomes and protein synthesis","qt":"single","source":"codex, slide 79","qc":"Ribosomes are composed of which two components?","options":["DNA and histone protein","Ribosomal RNA and protein","Phospholipid and cholesterol","Messenger RNA and glycogen"],"correct_index":1,"explanations":["That describes chromatin, the material of chromosomes, not ribosomes.","Correct. Ribosomes are built from rRNA and protein, arranged as a large and a small subunit.","These make up membranes, whereas ribosomes have no membrane.","Messenger RNA is a template read by ribosomes, and glycogen is not a ribosome component."]},{"tag":"M1·Q109","mid":"m01","difficulty":"medium","section":"Ribosomes and protein synthesis","qt":"single","source":"codex, slides 72 to 79","qc":"Which proteins do free ribosomes produce?","options":["Proteins exported from the cell","Only membrane lipids","Proteins used within the cell","Only DNA polymerase"],"correct_index":2,"explanations":["Bound ribosomes make proteins for export.","Ribosomes make proteins, not lipids. The right answer is: Proteins used within the cell.","Correct. Free ribosomes make proteins used within the cell.","Free ribosomes make many proteins, not a single enzyme."]},{"tag":"M1·Q110","mid":"m01","difficulty":"medium","section":"Ribosomes and protein synthesis","qt":"single","source":"codex, slides 72 to 79","qc":"Which proteins are made by ribosomes attached to the ER?","options":["Proteins used only in the cytosol","Ribosomal RNA for new subunits","Proteins for export from the cell","Chlorophyll for the chloroplast"],"correct_index":2,"explanations":["Free ribosomes make proteins used within the cell.","rRNA is made in the nucleolus, not by ribosomes.","Correct. Bound ribosomes attached to the ER make proteins for export.","Chlorophyll is a pigment, not a protein made by ribosomes."]},{"tag":"M1·Q111","mid":"m01","difficulty":"medium","section":"Ribosomes and protein synthesis","qt":"single","source":"codex, slides 72 to 79","qc":"What happens during translation?","options":["DNA is copied onto messenger RNA in the nucleus","Ribosomal subunits are assembled in the nucleolus","The message is translated into a sequence of amino acids","Chromosomes condense before the cell divides"],"correct_index":2,"explanations":["That is transcription. The right answer is: The message is translated into a sequence of amino acids.","Assembly of subunits takes place in the nucleolus.","Correct. Translation builds a protein from the mRNA message.","Chromosome condensation precedes cell division. The right answer is: The message is translated into a sequence of amino acids."]},{"tag":"M1·Q112","mid":"m01","difficulty":"medium","section":"Ribosomes and protein synthesis","qt":"single","source":"codex, slides 72 to 79","qc":"What happens during transcription?","options":["DNA information is copied onto a messenger RNA","The mRNA message is turned into amino acids","Ribosomal proteins are made in the nucleolus","DNA is degraded and then rebuilt from histones"],"correct_index":0,"explanations":["Correct. Transcription copies a gene's instructions onto mRNA.","That is translation. The right answer is: DNA information is copied onto a messenger RNA.","Ribosomal proteins are produced in the cytoplasm.","Transcription copies information and does not degrade DNA."
