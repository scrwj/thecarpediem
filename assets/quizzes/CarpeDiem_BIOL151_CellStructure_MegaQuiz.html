es and eyepieces give different angles."]},{"tag":"M3·Q184","mid":"m03","difficulty":"medium","section":"Types of light microscope","qt":"single","source":"codex, slides 289, 290, 308","qc":"Which statement about the dissecting (stereo) microscope is NOT true?","options":["It gives a three-dimensional view using two optical paths","It needs specimens cut thin enough for light to pass through","It typically uses light reflected from the specimen surface","It permits viewing of opaque specimens at low magnification"],"correct_index":1,"explanations":["This is true; two objectives and eyepieces give slightly different views to each eye.","Correct choice. Thin sections are needed for compound microscopes; dissecting microscopes view opaque specimens.","This is true; reflected light lets it view opaque objects.","This is true; most dissecting microscopes magnify up to about 30×."]},{"tag":"M3·Q185","mid":"m03","difficulty":"hard","section":"Types of light microscope","qt":"single","source":"codex, slides 289 to 290","qc":"Which microscope would you choose to examine the surface of an insect, and why?","options":["A compound microscope, because it needs a thick opaque specimen","A loupe on a stage, because it has two optical paths","A compound microscope, because it gives a stereo view","A dissecting microscope, because it views opaque specimens in 3D"],"correct_index":3,"explanations":["Compound microscopes need thin sections. The right answer is: A dissecting microscope, because it uses reflected light for opaque specimens in three dimensions.","A loupe has a single lens.","It does not use two optical paths.","Correct. It suits opaque specimens. It matches what the lecture slides state."]},{"tag":"M3·Q186","mid":"m03","difficulty":"easy","section":"Parts of the compound microscope","qt":"single","source":"codex, slides 293 to 300","qc":"Which part holds the eyepiece and connects it to the objective?","options":["The arm","The body tube","The stage","The condenser"],"correct_index":1,"explanations":["The arm supports the tube and connects it to the base.","Correct. The body tube holds the eyepiece and connects it to the objective.","The stage holds the slide. The right answer is: The body tube.","The condenser focuses light. The right answer is: The body tube."]},{"tag":"M3·Q187","mid":"m03","difficulty":"easy","section":"Parts of the compound microscope","qt":"single","source":"codex, slides 293 to 300","qc":"Which part is the flat surface on which the slide is placed?","options":["The base","The diaphragm","The eyepiece","The stage"],"correct_index":3,"explanations":["The base supports the microscope. The right answer is: The stage.","The diaphragm controls light. The right answer is: The stage.","The eyepiece is the lens at the top.","Correct. The stage is the flat surface that holds the slide."]},{"tag":"M3·Q188","mid":"m03","difficulty":"easy","section":"Parts of the compound microscope","qt":"single","source":"codex, slide 298","qc":"What is the function of the condenser lens in a compound microscope?","options":["It collects light from the illuminator and focuses it on the specimen","It magnifies the image of the specimen for the observer's eye","It controls the amount of light by opening and closing an iris","It holds the slide in position over the stage aperture"],"correct_index":0,"explanations":["Correct. The condenser collects light and focuses it on the specimen, giving a sharper image.","Magnifying the specimen is the job of the objective and eyepiece lenses.","That is the job of the diaphragm, not the condenser lens.","Slide clips on the stage hold the slide; the condenser only focuses light."]},{"tag":"M3·Q189","mid":"m03","difficulty":"easy","section":"Parts of the compound microscope","qt":"single","source":"codex, slide 297","qc":"Which part controls the amount of light reaching the specimen?","options":["The revolving nosepiece, also called the turret","The coarse adjustment knob on the arm","The diaphragm, also called the iris","The body tube joining eyepiece and objective"],"correct_index":2,"explanations":["The nosepiece holds and rotates the objective lenses; it does not control light.","The coarse knob moves the specimen to approximate focus.","Correct. The diaphragm (iris) controls the amount of light reaching the specimen.","The body tube holds the eyepiece and connects it to the objective."]},{"tag":"M3·Q190","mid":"m03","difficulty":"easy","section":"Parts of the compound microscope","qt":"single","source":"codex, slides 294, 297","qc":"A 10× eyepiece is used with a 45× objective lens. What is the total magnification?","options":["55×","4,500×","450×","0.45×"],"correct_index":2,"explanations":["This adds the two powers; magnifications multiply instead.","This is ten times too large, from a slip in the multiplication.","Correct. Total magnification is eyepiece power times objective power, so 10 × 45 = 450×.","This divides instead of multiplying and gives an image smaller than the specimen."]},{"tag":"M3·Q191","mid":"m03","difficulty":"easy","section":"Parts of the compound microscope","qt":"single","source":"codex, slide 295","qc":"Which part supports the body tube, connects it to the base and is used to carry the microscope?","options":["The stage","The condenser","The arm","The turret"],"correct_index":2,"explanations":["The stage is the flat surface on which the slide is placed.","The condenser focuses light on the specimen and does not support the tube.","Correct. The arm supports the tube, connects it to the base and is held when carrying.","The turret holds and rotates the objective lenses."]},{"tag":"M3·Q192","mid":"m03","difficulty":"medium","section":"Parts of the compound microscope","qt":"single","source":"codex, slides 293 to 300","qc":"Why is the low power objective used first when viewing a slide?","options":["It gives the highest resolution of detail","Its short length avoids breaking the slide","It uses far less light than the others","It needs no focusing"],"correct_index":1,"explanations":["The high power objective gives finer detail.","Correct. The short objective protects the slide.","This is not the stated reason.","It still needs focusing. The right answer is: Its short length avoids ramming into and breaking the slide."]},{"tag":"M3·Q193","mid":"m03","difficulty":"medium","section":"Parts of the compound microscope","qt":"single","source":"codex, slides 293 to 300","qc":"What power do eyepieces usually have?","options":["4× or 6×","40× or 100×","1000× or 2000×","10× or 15×"],"correct_index":3,"explanations":["This is too low. The right answer is: 10× or 15×.","These are objective powers. The right answer is: 10× or 15×.","These are too high for an eyepiece.","Correct. Eyepieces are usually 10× or 15×."]},{"tag":"M3·Q194","mid":"m03","difficulty":"medium","section":"Parts of the compound microscope","qt":"single","source":"codex, slides 293 to 300","qc":"What does the revolving nosepiece do?","options":["It focuses the light on the specimen below","It holds the objectives and rotates them","It controls the amount of light entering","It switches the illuminator off"],"correct_index":1,"explanations":["That is the condenser. The right answer is: It holds two or more objectives and rotates to change power.","Correct. This is the role of the nosepiece.","That is the diaphragm. The right answer is: It holds two or more objectives and rotates to change power.","That is the power switch. The right answer is: It holds two or more objectives and rotates to change power."]},{"tag":"M3·Q195","mid":"m03","difficulty":"medium","section":"Parts of the compound microscope","qt":"single","source":"codex, slides 293 to 300","qc":"Which three objective powers are usual in a standard microscope?","options":["2×, 5× and 8×","10×, 40× and 100×","15×, 50× and 500×","20×, 30× and 60×"],"correct_index":1,"explanations":["These are not the usual three.","Correct. These are the usual three objectives.","These are not the usual three.","These are not the usual three."]},{"tag":"M3·Q196","mid":"m03","difficulty":"medium","section":"Parts of the compound microscope","qt":"single","source":"codex, slides 293 to 300","qc":"What are the dimensions of a typical glass slide?","options":["25 × 50 mm and 10 mm thick","75 × 26 mm and about 1 mm thick","100 × 50 mm and 5 mm thick","10 × 10 mm and 0.1 mm thick"],"correct_index":1,"explanations":["This is not the typical size.","Correct. This is the typical size and thickness.","This is not the typical size.","This is not the typical size."]},{"tag":"M3·Q197","mid":"m03","difficulty":"medium","section":"Parts of the compound microscope","qt":"single","source":"codex, slides 293 to 300","qc":"What is the cover slip for?","options":["It magnifies the specimen image","It controls the amount of light","It holds the slide on the stage","It stops the specimen spilling"],"correct_index":3,"explanations":["It does not magnify. The right answer is: It covers the specimen so it does not spill on the slide.","That is the diaphragm. The right answer is: It covers the specimen so it does not spill on the slide.","Clips hold the slide. The right answer is: It covers the specimen so it does not spill on the slide.","Correct. It keeps the specimen in place."]},{"tag":"M3·Q198","mid":"m03","difficulty":"hard","section":"Parts of the compound microscope","qt":"single","source":"codex, slides 293 to 300","qc":"Which sequence correctly follows light through a standard transmitted-light compound microscope?","options":["Eyepiece, objective, specimen, condenser, illuminator","Illuminator, objective, condenser, eyepiece, specimen","Condenser, illuminator, eyepiece, specimen, objective","Illuminator, condenser, specimen, objective, eyepiece"],"correct_index":3,"explanations":["This is the reverse of the path.","The condenser comes before the specimen.","The order is wrong. The right answer is: Illuminator, condenser, specimen, objective, eyepiece.","Correct. Light passes in this order to the eye."]},{"tag":"M3·Q199","mid":"m03","difficulty":"hard","section":"Parts of the compound microscope","qt":"single","source":"codex, slides 293 to 300","qc":"All of the following are involved in controlling or focusing the light reaching the specimen EXCEPT which one?","options":["The diaphragm","The revolving nosepiece","The condenser lens","The illuminator"],"correct_index":1,"explanations":["It controls the amount of light.","Correct choice. The nosepiece holds the objectives.","It collects and focuses light. The right answer is: The revolving nosepiece.","It is the light source. The right answer is: The revolving nosepiece."]},{"tag":"M3·Q200","mid":"m03","difficulty":"devil","section":"Parts of the compound microscope","qt":"single","source":"codex, slides 293 to 300","qc":"A student sees a dim, blurry image with the bulb on, the high power objective selected and the condenser removed. Which change most directly sharpens the image?","options":["Replacing the cover slip, which magnifies the specimen","Switching off the illuminator to reduce glare","Replacing the condenser, which focuses light on the specimen","Moving the arm to the other side of the base"],"correct_index":2,"explanations":["Cover slips do not magnify. The right answer is: Replacing the condenser, which collects and focuses light on the specimen.","This removes the light. The right answer is: Replacing the condenser, which collects and focuses light on the specimen.","Correct. A condenser gives a sharper, clearer image.","This does not change the light path."]},{"tag":"M4·Q1","mid":"m04","difficulty":"easy","section":"Coarse and fine adjustment","qt":"single","source":"codex, slides 301 to 304","qc":"Which knob moves the specimen to bring the slide to approximate focus?","options":["The fine adjustment knob","The coarse adjustment knob","The condenser knob","The diaphragm lever"],"correct_index":1,"explanations":["The fine knob brings the specimen into sharp focus.","Correct. The coarse knob moves the specimen toward approximate focus.","The condenser focuses light. The right answer is: The coarse adjustment knob.","The diaphragm controls the amount of light."]},{"tag":"M4·Q2","mid":"m04","difficulty":"easy","section":"Coarse and fine adjustment","qt":"single","source":"codex, slides 301 to 304","qc":"Which knob brings the specimen into sharp final focus?","options":["The coarse adjustment knob","The nosepiece","The fine adjustment knob","The power switch"],"correct_index":2,"explanations":["The coarse knob gives approximate focus.","The nosepiece holds the objectives. The right answer is: The fine adjustment knob.","Correct. The fine knob gives sharp focus.","The switch controls the lamp. The right answer is: The fine adjustment knob."]},{"tag":"M4·Q3","mid":"m04","difficulty":"easy","section":"Coarse and fine adjustment","qt":"single","source":"codex, slides 301 to 304","qc":"Where is the coarse adjustment knob located?","options":["On the eyepiece","On the stage aperture","On the illuminator lamp","On the arm of the microscope"],"correct_index":3,"explanations":["The eyepiece is the top lens.","The aperture is a hole in the stage.","The illuminator is the light source.","Correct. It is present on the arm."]},{"tag":"M4·Q4","mid":"m04","difficulty":"easy","section":"Coarse and fine adjustment","qt":"single","source":"codex, slides 301 to 304","qc":"What should be done carefully when focusing?","options":["Switching off the illuminator lamp","Moving and adjusting the coarse knob","Removing the coverslip first","Rotating the eyepiece tube"],"correct_index":1,"explanations":["This is not the stated care.","Correct. The lecture says the coarse adjustment must be moved carefully.","This is not the stated care.","This is not the stated care."]},{"tag":"M4·Q5","mid":"m04","difficulty":"medium","section":"Coarse and fine adjustment","qt":"single","source":"codex, slides 301 to 304","qc":"How is the fine adjustment knob related to the coarse adjustment knob?","options":["It is a sub part of the coarse knob system","It is a separate unit on the base","It is the same knob used for light control","It is a part of the objective lens"],"correct_index":0,"explanations":["Correct. The fine knob is described as a sub part of the coarse knob.","It is not described this way.","The diaphragm controls light. The right answer is: It is a sub part of the coarse knob system.","It is not part of the lens."]},{"tag":"M4·Q6","mid":"m04","difficulty":"medium","section":"Coarse and fine adjustment","qt":"single","source":"codex, slides 301 to 304","qc":"What does the coarse knob do to the slide?","options":["It rotates the objective turret","It dims the lamp slowly","It stains the specimen lightly","It moves it to bring it into focus"],"correct_index":3,"explanations":["The nosepiece does that. The right answer is: It moves it back and forth to bring it into focus.","This is not the role. The right answer is: It moves it back and forth to bring it into focus.","This is not the role. The right answer is: It moves it back and forth to bring it into focus.","Correct. The knob moves the specimen to focus."]},{"tag":"M4·Q7","mid":"m04","difficulty":"medium","section":"Coarse and fine adjustment","qt":"single","source":"codex, slides 301 to 304","qc":"After finding a roughly focused image, which knob should a student use first, and then to finish?","options":["Fine knob first, then coarse knob","Condenser first, then diaphragm","Coarse knob first, then fine knob","Nosepiece first, then base"],"correct_index":2,"explanations":["The order is reversed. The right answer is: Coarse knob first, then fine knob.","These control light, not focus. The right answer is: Coarse knob first, then fine knob.","Correct. Coarse gives approximate focus and fine gives sharp focus.","These do not focus. The right answer is: Coarse knob first, then fine knob."]},{"tag":"M4·Q8","mid":"m04","difficulty":"hard","section":"Coarse and fine adjustment","qt":"single","source":"codex, slides 301 to 304","qc":"An image is roughly in focus but still blurry. Which step best improves it?","options":["Turning the coarse adjustment knob fully","Removing the condenser lens","Switching to the dissecting microscope","Turning the fine adjustment knob slightly"],"correct_index":3,"explanations":["Large coarse moves risk losing the image.","This reduces light and focus quality.","This is unrelated to a focusing error.","Correct. The fine knob brings the specimen into sharp focus."]},{"tag":"M4·Q9","mid":"m04","difficulty":"easy","section":"Functions of the microscope","qt":"single","source":"codex, slides 305 to 307","qc":"Which two functions does microscopy serve?","options":["Fixation and staining","Magnification and resolution","Heating and cooling","Sectioning and embedding"],"correct_index":1,"explanations":["These are specimen preparation steps. The right answer is: Magnification and resolution.","Correct. Microscopy serves magnification and improved resolution.","These are not the functions. The right answer is: Magnification and resolution.","These are preparation steps. The right answer is: Magnification and resolution."]},{"tag":"M4·Q10","mid":"m04","difficulty":"easy","section":"Functions of the microscope","qt":"single","source":"codex, slides 305 to 307","qc":"Resolution is the rendering of two objects as what?","options":["A single blurred spot","The same colour","A larger image","Separate entities"],"correct_index":3,"explanations":["That is the failure of resolution.","Colour is not resolution. The right answer is: Separate entities.","That is magnification. The right answer is: Separate entities.","Correct. Resolution renders two objects as separate entities."]},{"tag":"M4·Q11","mid":"m04","difficulty":"easy","section":"Functions of the microscope","qt":"single","source":"codex, slides 305 to 307","qc":"What is enlargement of the specimen image called?","options":["Resolution","Magnification","Contrast","Aperture"],"correct_index":1,"explanations":["Resolution is detail. The right answer is: Magnification.","Correct. Enlargement is magnification. It matches what the lecture slides state.","Contrast is difference in brightness. The right answer is: Magnification.","Aperture is the opening for light."]},{"tag":"M4·Q12","mid":"m04","difficulty":"medium","section":"Functions of the microscope","qt":"single","source":"codex, slides 305 to 307","qc":"What is the use of increasing magnification without better detail?","options":["Great, since larger is clearer","Little or none","Equal to improving resolution","Useful only for dissecting microscopes"],"correct_index":1,"explanations":["Larger images need detail to be useful.","Correct. It is of little or no use.","It is not equal. The right answer is: Little or none.","It is not tied to the type."]},{"tag":"M4·Q13","mid":"m04","difficulty":"medium","section":"Functions of the microscope","qt":"single","source":"codex, slides 305 to 307","qc":"What are the two basic aims of all microscopes?","options":["To stain the specimen and to preserve it","To magnify and to show greater detail","To heat the specimen and to dry it","To section the specimen and to embed it"],"correct_index":1,"explanations":["These are preparation aims. The right answer is: To magnify the specimen and to display it in greater detail.","Correct. These are the two aims.","These are not aims. The right answer is: To magnify the specimen and to display it in greater detail.","These are preparation aims. The right answer is: To magnify the specimen and to display it in greater detail."]},{"tag":"M4·Q14","mid":"m04","difficulty":"hard","section":"Functions of the microscope","qt":"single","source":"codex, slides 305 to 307","qc":"Why are magnification and resolution described as interdependent?","options":["Resolution always equals magnification","Magnification replaces the need for resolution","Each is of little use without the other","Resolution works only in dissecting microscopes"],"correct_index":2,"explanations":["They are different quantities. The right answer is: Magnifying without improving detail is of little use, and detail needs enough magnification.","It cannot replace it. The right answer is: Magnifying without improving detail is of little use, and detail needs enough magnification.","Correct. The aims depend on each other.","It applies to all microscopes. The right answer is: Magnifying without improving detail is of little use, and detail needs enough magnification."]},{"tag":"M4·Q15","mid":"m04","difficulty":"hard","section":"Functions of the microscope","qt":"single","source":"codex, slides 305 to 307","qc":"All of the following are aims of microscopes EXCEPT which one?","options":["Magnifying the specimen","Displaying greater detail","Improving resolution","Digesting the specimen"],"correct_index":3,"explanations":["This is an aim. The right answer is: Digesting the specimen.","This is an aim. The right answer is: Digesting the specimen.","This is an aim. The right answer is: Digesting the specimen.","Correct choice. Digestion is not an aim of microscopy."]},{"tag":"M4·Q16","mid":"m04","difficulty":"devil","section":"Functions of the microscope","qt":"single","source":"codex, slides 305 to 307","qc":"A student doubles the magnification and the image becomes bigger but no more detailed. What does this show?","options":["The microscope has no condenser","Extra magnification alone adds little","The specimen has been fixed","The wavelength has become shorter"],"correct_index":1,"explanations":["This is not shown. The right answer is: Extra magnification without improved resolution is of little value.","Correct. This is empty magnification. It matches what the lecture slides state.","This is not shown. The right answer is: Extra magnification without improved resolution is of little value.","This is not shown. The right answer is: Extra magnification without improved resolution is of little value."]},{"tag":"M4·Q17","mid":"m04","difficulty":"easy","section":"Magnification and focal length","qt":"single","source":"codex, slides 308 to 310","qc":"What is the usual magnification range of an ordinary class microscope?","options":["25× to 1500×","1× to 10×","250× to 15,000×","2000× to 20,000×"],"correct_index":0,"explanations":["Correct. The ordinary class microscope magnifies 25× to 1500×.","This is far too low. The right answer is: 25× to 1500×.","This is ten times too high.","This is too high. The right answer is: 25× to 1500×."]},{"tag":"M4·Q18","mid":"m04","difficulty":"easy","section":"Magnification and focal length","qt":"single","source":"codex, slides 308 to 310","qc":"Up to what magnification do most dissecting microscopes magnify?","options":["300×","3×","3000×","30×"],"correct_index":3,"explanations":["This is ten times too high.","This is too low. The right answer is: 30×.","This is far too high. The right answer is: 30×.","Correct. Most dissecting microscopes magnify up to 30×."]},{"tag":"M4·Q19","mid":"m04","difficulty":"easy","section":"Magnification and focal length","qt":"single","source":"codex, slides 308 to 310","qc":"What useful magnification can some compound microscopes reach with the oil immersion lens?","options":["200×","2000×","20,000×","20×"],"correct_index":1,"explanations":["This is ten times too low.","Correct. Some reach a useful 2000× with oil.","This is ten times too high.","This is far too low. The right answer is: 2000×."]},{"tag":"M4·Q20","mid":"m04","difficulty":"easy","section":"Magnification and focal length","qt":"single","source":"codex, slides 308 to 310","qc":"The magnification of an optical system depends on what?","options":["The colour of the glass slide","Focal length and the lens arrangement","The thickness of the metal stage","The size of the lamp housing"],"correct_index":1,"explanations":["This is irrelevant. The right answer is: The focal length of the lenses and their arrangement.","Correct. Both focal length and arrangement matter.","This is irrelevant. The right answer is: The focal length of the lenses and their arrangement.","This is irrelevant. The right answer is: The focal length of the lenses and their arrangement."]},{"tag":"M4·Q21","mid":"m04","difficulty":"easy","section":"Magnification and focal length","qt":"single","source":"codex, slides 308 to 310","qc":"Focal length is the distance over which what are brought to a focus?","options":["Scattered rays","Diverging rays","Parallel rays","Reflected rays"],"correct_index":2,"explanations":["These are not the definition. The right answer is: Parallel rays.","These are not the definition. The right answer is: Parallel rays.","Correct. Parallel rays are brought to a focus over the focal length.","These are not the definition. The right answer is: Parallel rays."]},{"tag":"M4·Q22","mid":"m04","difficulty":"easy","section":"Magnification and focal length","qt":"single","source":"codex, slide 308","qc":"The ratio of the length of the final image to the length of the specimen is called what?","options":["Resolution","Contrast","Specimen stage","Magnification"],"correct_index":3,"explanations":["Resolution is the ability to render two objects as separate, not an image size ratio.","Contrast is the difference in brightness between specimen and background.","The specimen stage is the platform that holds the slide, not a ratio.","Correct. Magnification is the ratio of the final image length to the specimen length."]},{"tag":"M4·Q23","mid":"m04","difficulty":"medium","section":"Magnification and focal length","qt":"single","source":"codex, slides 308 to 310","qc":"Magnification above what value is considered empty for compound microscopes?","options":["Above 2000×","Above 25×","Above 100×","Above 1500× only"],"correct_index":0,"explanations":["Correct. Beyond 2000× resolution no longer improves.","This is the lower limit of the range.","This is not the limit. The right answer is: Above 2000×.","The empty limit is stated as 2000×."]},{"tag":"M4·Q24","mid":"m04","difficulty":"medium","section":"Magnification and focal length","qt":"single","source":"codex, slides 308 to 310","qc":"What does focal length measure?","options":["How bright the lamp bulb is","How strongly light is converged","How thick the specimen slice is","How fast the stage moves up"],"correct_index":1,"explanations":["This is not what it measures.","Correct. Focal length measures how strongly light is converged.","This is not what it measures.","This is not what it measures."]},{"tag":"M4·Q25","mid":"m04","difficulty":"medium","section":"Magnification and focal length","qt":"single","source":"codex, slides 308 to 310","qc":"Which statement about magnification is NOT true?","options":["It is the ratio of image length to specimen length","It always improves resolution","It depends on the focal length of the lenses","It is called empty above 2000× for compound microscopes"],"correct_index":1,"explanations":["This is true. The right answer is: It always improves resolution.","Correct choice. Magnification beyond a point does not improve resolution.","This is true. The right answer is: It always improves resolution.","This is true. The right answer is: It always improves resolution."]},{"tag":"M4·Q26","mid":"m04","difficulty":"medium","section":"Magnification and focal length","qt":"single","source":"codex, slides 308, 317","qc":"A student draws an ant 8 cm long, and its real length is 2 mm. What is the magnification of the drawing?","options":["4×","40×","400×","0.025×"],"correct_index":1,"explanations":["This treats 8 cm as 8 mm and forgets to convert centimetres to millimetres.","Correct. 8 cm is 80 mm, and 80 mm divided by 2 mm gives 40×.","This slips a factor of ten when converting centimetres to millimetres.","This inverts the ratio by dividing the real size by the drawing size."]},{"tag":"M4·Q27","mid":"m04","difficulty":"medium","section":"Magnification and focal length","qt":"single","source":"codex, slide 309","qc":"What does a shorter focal length mean for a lens?","options":["Lower optical power, because it bends rays less sharply","No change in optical power, because only aperture matters","Greater optical power, because it bends rays more sharply","A longer working distance, because rays focus farther away"],"correct_index":2,"explanations":["This is reversed; a longer focal length bends rays less sharply.","Optical power depends on how strongly the lens converges light, which relates to focal length.","Correct. A shorter focal length gives greater optical power by bringing rays to a focus over a shorter distance.","A shorter focal length brings rays to a focus over a shorter distance."]},{"tag":"M4·Q28","mid":"m04","difficulty":"medium","section":"Magnification and focal length","qt":"single","source":"codex, slide 308","qc":"Why is magnification beyond about 2000× in a compound light microscope called empty?","options":["The illuminator cannot supply enough light above that value","The working distance becomes zero once that value is reached","Resolution stops improving, so no extra detail appears","The image becomes inverted and can no longer be focused"],"correct_index":2,"explanations":["The limit is about resolution, not about the amount of light.","Working distance falls with magnification but is not what makes it empty.","Correct. Past about 2000× resolution does not improve, so the image is bigger but shows no more detail.","Inversion is unrelated to empty magnification."]},{"tag":"M4·Q29","mid":"m04","difficulty":"hard","section":"Magnification and focal length","qt":"single","source":"codex, slides 308, 347","qc":"A red blood cell is 7 µm wide. What is the width of its image at a total magnification of 450×?","options":["3.15 mm","0.315 mm","31.5 mm","3.15 µm"],"correct_index":0,"explanations":["Correct. 7 µm × 450 = 3,150 µm, which is 3.15 mm.","This slips a factor of ten when converting micrometres to millimetres.","This is ten times too large after converting micrometres to millimetres.","This forgets to convert 3,150 µm to millimetres and also mislabels the unit."]},{"tag":"M4·Q30","mid":"m04","difficulty":"devil","section":"Magnification and focal length","qt":"single","source":"codex, slides 308 to 310","qc":"A student uses a 20× eyepiece with a 100× oil objective. What is the total magnification, and how does it compare with the useful limit?","options":["200×, well below the useful limit","120×, well below the useful limit","2000×, at the useful limit for oil immersion","20,000×, far beyond the useful limit"],"correct_index":2,"explanations":["This slips a factor of ten.","This adds the powers. The right answer is: 2000×, at the useful limit for oil immersion.","Correct. 20 × 100 = 2000×, the useful limit.","This slips a factor of ten."]},{"tag":"M4·Q31","mid":"m04","difficulty":"easy","section":"Working distance and parfocal objectives","qt":"single","source":"codex, slides 311 to 316","qc":"How long is the working distance at low magnification?","options":["Zero","Relatively long","Exactly 1 mm","Equal to the focal length"],"correct_index":1,"explanations":["Oil lenses have almost none. The right answer is: Relatively long.","Correct. Working distance is relatively long at low magnification.","This is not stated. The right answer is: Relatively long.","This is not stated. The right answer is: Relatively long."]},{"tag":"M4·Q32","mid":"m04","difficulty":"easy","section":"Working distance and parfocal objectives","qt":"single","source":"codex, slides 311 to 316","qc":"What happens to working distance as magnification increases?","options":["It increases","It stays constant","It decreases considerably","It doubles"],"correct_index":2,"explanations":["It decreases. The right answer is: It decreases considerably.","It changes. The right answer is: It decreases considerably.","Correct. Working distance falls considerably. It matches what the lecture slides state.","It decreases. The right answer is: It decreases considerably."]},{"tag":"M4·Q33","mid":"m04","difficulty":"easy","section":"Working distance and parfocal objectives","qt":"single","source":"codex, slides 311 to 316","qc":"Which lenses practically touch the specimen?","options":["Low-power objectives","Eyepiece lenses","Condenser lenses","Oil immersion lenses"],"correct_index":3,"explanations":["These have long working distance. The right answer is: Oil immersion lenses.","These are far from the specimen.","These lie below the stage. The right answer is: Oil immersion lenses.","Correct. Oil immersion lenses practically touch the specimen."]},{"tag":"M4·Q34","mid":"m04","difficulty":"easy","section":"Working distance and parfocal objectives","qt":"single","source":"codex, slides 311 to 316","qc":"Parfocal objectives can be changed with what?","options":["Complete refocusing each time","A change of illuminator","A change of slide","Minimal or no refocusing"],"correct_index":3,"explanations":["That is the opposite. The right answer is: Minimal or no refocusing.","This is not related. The right answer is: Minimal or no refocusing.","This is not related. The right answer is: Minimal or no refocusing.","Correct. Parfocal objectives need little or no refocusing."]},{"tag":"M4·Q35","mid":"m04","difficulty":"easy","section":"Working distance and parfocal objectives","qt":"single","source":"codex, slides 311 to 316","qc":"If a parfocal microscope is switched from 10× to 40×, what happens to the object?","options":["It stays in focus","It disappears","It turns upside down","It changes colour"],"correct_index":0,"explanations":["Correct. It stays in focus. It matches what the lecture slides state.","It stays in focus. The right answer is: It stays in focus.","This is not described. The right answer is: It stays in focus.","This is not described. The right answer is: It stays in focus."]},{"tag":"M4·Q36","mid":"m04","difficulty":"medium","section":"Working distance and parfocal objectives","qt":"single","source":"codex, slides 311 to 316","qc":"In most compound microscopes, how is the lens moved to increase magnification?","options":["Farther away from the specimen","Sideways across the whole stage","Physically closer to the specimen","Up into the narrow body tube"],"correct_index":2,"explanations":["This is the opposite. The right answer is: Physically closer to the specimen.","This is not described. The right answer is: Physically closer to the specimen.","Correct. The lens is moved closer to the specimen.","This is not described. The right answer is: Physically closer to the specimen."]},{"tag":"M4·Q37","mid":"m04","difficulty":"medium","section":"Working distance and parfocal objectives","qt":"single","source":"codex, slides 311 to 316","qc":"What does parfocalling objectives do?","options":["Removes the need for a stage","Makes all objectives the same power","Adjusts each objective to stay in focus","Shortens the working distance to zero"],"correct_index":2,"explanations":["This is not the effect. The right answer is: Adjusts each objective so it stays in relative focus with the others.","It does not change power. The right answer is: Adjusts each objective so it stays in relative focus with the others.","Correct. Parfocalling aligns the objectives' focus.","This is not the effect. The right answer is: Adjusts each objective so it stays in relative focus with the others."]},{"tag":"M4·Q38","mid":"m04","difficulty":"medium","section":"Working distance and parfocal objectives","qt":"single","source":"codex, slides 311 to 316","qc":"Why should users be aware of working distance changes with magnification?","options":["To increase the lamp brightness","To change the immersion oil often","To reduce the staining time needed","To prevent damage to the lens and slides"],"correct_index":3,"explanations":["This is not the reason. The right answer is: To prevent damage to specimens and especially the lens.","This is not the reason. The right answer is: To prevent damage to specimens and especially the lens.","This is not the reason. The right answer is: To prevent damage to specimens and especially the lens.","Correct. Short distances risk damage. It matches what the lecture slides state."]},{"tag":"M4·Q39","mid":"m04","difficulty":"medium","section":"Working distance and parfocal objectives","qt":"single","source":"codex, slides 311 to 316","qc":"How large is the focus error in parfocal objectives?","options":["There is some, but it is insignificant","None at all in any microscope","So large it needs refocusing always","Always larger at low power"],"correct_index":0,"explanations":["Correct. There is inevitably some small error.","Some error is inevitable. The right answer is: There is some, but small enough to be insignificant.","It is small. The right answer is: There is some, but small enough to be insignificant.","This is not stated. The right answer is: There is some, but small enough to be insignificant."]},{"tag":"M4·Q40","mid":"m04","difficulty":"medium","section":"Working distance and parfocal objectives","qt":"single","source":"codex, slides 311, 316","qc":"All of the following are true about working distance EXCEPT which one?","options":["It is relatively long when the objective has low magnification","It decreases considerably as the magnification is increased","It is the distance between the eyepiece and the objective lens","Oil immersion objectives practically touch the specimen"],"correct_index":2,"explanations":["This is true; working distance is relatively long at low magnification.","This is true; higher power objectives sit closer to the specimen.","Correct choice. Working distance is the distance between the objective lens and the specimen, so this statement is false.","This is true; oil immersion lenses have almost no working distance."]},{"tag":"M4·Q41","mid":"m04","difficulty":"medium","section":"Working distance and parfocal objectives","qt":"single","source":"codex, slides 313, 314","qc":"What does it mean when a microscope's objectives are described as parfocal?","options":["The specimen stays in focus when the objective is changed to another magnification","The specimen stays in focus when the working distance is changed","The specimen stays in focus when the slide is shifted sideways","The specimen stays in focus when an opaque disc is placed in the diaphragm"],"correct_index":0,"explanations":["Correct. Parfocal objectives stay in focus, with little or no refocusing, when magnification is changed.","Working distance changes with magnification; parfocal describes keeping focus across objectives.","Moving the slide is unrelated to parfocal objectives.","An opaque disc relates to dark-field illumination, not parfocal objectives."]},{"tag":"M4·Q42","mid":"m04","difficulty":"hard","section":"Working distance and parfocal objectives","qt":"single","source":"codex, slides 311 to 316","qc":"Which statement distinguishes working distance from parfocal distance?","options":["Working distance is the eyepiece-to-objective gap, while parfocal is the specimen thickness","Both describe the distance between condenser and lamp","Working distance is objective-to-specimen, parfocal means staying in focus","Working distance is the focal length, while parfocal is magnification"],"correct_index":2,"explanations":["These are not the definitions. The right answer is: Working distance is the objective-to-specimen gap, while parfocal objectives stay in focus when changed.","This is not the definition. The right answer is: Working distance is the objective-to-specimen gap, while parfocal objectives stay in focus when changed.","Correct. These are different ideas. It matches what the lecture slides state.","These are not the definitions. The right answer is: Working distance is the objective-to-specimen gap, while parfocal objectives stay in focus when changed."]},{"tag":"M4·Q43","mid":"m04","difficulty":"hard","section":"Working distance and parfocal objectives","qt":"single","source":"codex, slides 311 to 316","qc":"A student switches fro ","difficulty":"easy","section":"Magnification versus resolution","qt":"single","source":"codex, slides 317 to 325","qc":"Magnification enlarges what about the specimen?","options":["Its appearance, not its physical size","Its physical size permanently in the cell","Its refractive index in the lens","Its wavelength of light"],"correct_index":0,"explanations":["Correct. Magnification enlarges appearance, not physical size.","The specimen's size does not change.","This is not enlarged. The right answer is: Its appearance only, not its physical size.","This is not enlarged. The right answer is: Its appearance only, not its physical size."]},{"tag":"M4·Q46","mid":"m04","difficulty":"easy","section":"Magnification versus resolution","qt":"single","source":"codex, slides 317 to 325","qc":"Which term describes the ability of an imaging system to show detail?","options":["Magnification","Resolution","Contrast","Aperture"],"correct_index":1,"explanations":["Magnification only enlarges. The right answer is: Resolution.","Correct. Resolution describes the ability to show detail.","Contrast is a brightness difference. The right answer is: Resolution.","Aperture is an opening. The right answer is: Resolution."]},{"tag":"M4·Q47","mid":"m04","difficulty":"easy","section":"Magnification versus resolution","qt":"single","source":"codex, slides 317 to 325","qc":"Which term is often confused with magnification?","options":["Resolution","Fixation","Parfocal","Dispersion"],"correct_index":0,"explanations":["Correct. Resolution is often confused with magnification.","Fixation is preparation. The right answer is: Resolution.","Parfocal refers to focus staying constant.","Dispersion causes chromatic aberration. The right answer is: Resolution."]},{"tag":"M4·Q48","mid":"m04","difficulty":"easy","section":"Magnification versus resolution","qt":"single","source":"codex, slides 317 to 325","qc":"What effect limits a microscope's ability to resolve fine details?","options":["Evaporation","Absorption by glass","Diffraction","Gravity"],"correct_index":2,"explanations":["This is not the limit. The right answer is: Diffraction.","This is not the stated limit.","Correct. Diffraction limits resolution. It matches what the lecture slides state.","This is not the stated limit."]},{"tag":"M4·Q49","mid":"m04","difficulty":"easy","section":"Magnification versus resolution","qt":"single","source":"codex, slides 317 to 325","qc":"Two micrographs at the same magnification differ in clarity. What differs?","options":["Magnification","Slide length","Resolution","Eyepiece colour"],"correct_index":2,"explanations":["They have the same magnification. The right answer is: Resolution.","This is not the difference. The right answer is: Resolution.","Correct. Resolution differs while magnification is the same.","This is not the difference. The right answer is: Resolution."]},{"tag":"M4·Q50","mid":"m04","difficulty":"easy","section":"Magnification versus resolution","qt":"single","source":"codex, slides 317 to 325","qc":"What is the finite limit beyond which separate points cannot be resolved called?","options":["The resolution limit","The focal limit","The working limit","The parfocal limit"],"correct_index":0,"explanations":["Correct. This is the resolution limit.","This is not a term used.","This is not a term used.","This is not a term used."]},{"tag":"M4·Q51","mid":"m04","difficulty":"medium","section":"Magnification versus resolution","qt":"single","source":"codex, slides 317 to 325","qc":"Which do microbiologists depend on more, magnification or resolution?","options":["Resolution, to tell microbes apart","Magnification, to make microbes large","Neither one of them","Working distance of the lens"],"correct_index":0,"explanations":["Correct. They depend on resolution to see differences.","Resolution gives the detail. The right answer is: Resolution, to tell microbes or their parts apart.","They depend on resolution. The right answer is: Resolution, to tell microbes or their parts apart.","This is not the stated answer."]},{"tag":"M4·Q52","mid":"m04","difficulty":"medium","section":"Magnification versus resolution","qt":"single","source":"codex, slides 317 to 325","qc":"Resolving power is the ability to distinguish between two closely spaced what?","options":["Cover slips","Condensers","Airy disks","Eyepieces"],"correct_index":2,"explanations":["These are not the stated objects.","These are not the stated objects.","Correct. Resolving power is the ability to distinguish adjacent Airy disks.","These are not the stated objects."]},{"tag":"M4·Q53","mid":"m04","difficulty":"medium","section":"Magnification versus resolution","qt":"single","source":"codex, slides 317 to 325","qc":"Which three factors affect the size of diffraction patterns?","options":["Slide thickness, stage size and lamp power","Wavelength, refractive index and numerical aperture","Fixative, stain and embedding medium","Magnification, working distance and parfocal distance"],"correct_index":1,"explanations":["These are not the factors. The right answer is: Wavelength, refractive index and numerical aperture.","Correct. These are the three listed.","These are preparation factors. The right answer is: Wavelength, refractive index and numerical aperture.","These are not the factors. The right answer is: Wavelength, refractive index and numerical aperture."]},{"tag":"M4·Q54","mid":"m04","difficulty":"medium","section":"Magnification versus resolution","qt":"single","source":"codex, slides 317 to 325","qc":"Why must a viewer first magnify to a point where resolution becomes relevant?","options":["Resolution is created by the eyepiece colour","Magnification replaces the lens aperture","Detail needs enough enlargement first","Staining can only occur above 1000×"],"correct_index":2,"explanations":["This is not the reason. The right answer is: Details can only be distinguished once the image is enlarged enough.","This is not the reason. The right answer is: Details can only be di nification alone will separate two structures 100 nm apart in a light microscope with a 240 nm limit. How should this be judged?","options":["It is right, because enough magnification always separates them","It is wrong, since resolution sets the limit and 100 nm is below 240 nm","It is right, because Airy discs shrink with magnification","It is wrong only if the stage is perfectly flat"],"correct_index":1,"explanations":["Magnification cannot beat the resolution limit.","Correct. Resolution limits separation. It matches what the lecture slides state.","Airy discs do not do this.","This is irrelevant. The right answer is: It is wrong, because resolution rather than magnification sets the limit, and 100 nm is below 240 nm."]},{"tag":"M4·Q61","mid":"m04","difficulty":"easy","section":"Parameters that affect resolution","qt":"single","source":"codex, slides 326 to 330","qc":"Which colour gives better resolution, blue or red light?","options":["Blue light, because its wavelength is shorter","Red light, because its wavelength is longer","Both are the same, as wavelength is irrelevant","Neither, because colour has no effect"],"correct_index":0,"explanations":["Correct. Shorter wavelength gives better resolution.","Longer wavelengths give poorer resolution. The right answer is: Blue light, because its wavelength is shorter.","They differ. The right answer is: Blue light, because its wavelength is shorter.","Wavelength matters. The right answer is: Blue light, because its wavelength is shorter."]},{"tag":"M4·Q62","mid":"m04","difficulty":"easy","section":"Parameters that affect resolution","qt":"single","source":"codex, slides 326 to 330","qc":"Which illumination method optimises light distribution?","options":["Köhler illumination","Oil illumination","Parfocal illumination","Spherical illumination"],"correct_index":0,"explanations":["Correct. Köhler illumination optimises light distribution.","This is not the term. The right answer is: Köhler illumination.","This is not the term. The right answer is: Köhler illumination.","This is not the term. The right answer is: Köhler illumination."]},{"tag":"M4·Q63","mid":"m04","difficulty":"easy","section":"Parameters that affect resolution","qt":"single","source":"codex, slides 326 to 330","qc":"Which high-quality lenses minimise distortions and improve resolution?","options":["Plan apochromats","Simple plano lenses","Opaque lenses","Dispersive lenses"],"correct_index":0,"explanations":["Correct. Plan apochromatic lenses minimise distortions.","These are not named. The right answer is: Plan apochromats.","These are not named. The right answer is: Plan apochromats.","These are not named. The right answer is: Plan apochromats."]},{"tag":"M4·Q64","mid":"m04","difficulty":"easy","section":"Parameters that affect resolution","qt":"single","source":"codex, slides 326 to 330","qc":"About what refractive index does immersion oil have?","options":["1.51","1.00","0.51","5.1"],"correct_index":0,"explanations":["Correct. Immersion oil has n of about 1.51.","This is the value for air.","This is too low. The right answer is: 1.51.","This is too high. The right answer is: 1.51."]},{"tag":"M4·Q65","mid":"m04","difficulty":"medium","section":"Parameters that affect resolution","qt":"single","source":"codex, slides 326 to 330","qc":"Blue light has about what wavelength in the lecture?","options":["About 700 nm","About 450 nm","About 180 nm","About 1500 nm"],"correct_index":1,"explanations":["This is red light. The right answer is: About 450 nm.","Correct. Blue light is about 450 nm.","This is ultraviolet. The right answer is: About 450 nm.","This is infrared. The right answer is: About 450 nm."]},{"tag":"M4·Q66","mid":"m04","difficulty":"medium","section":"Parameters that affect resolution","qt":"single","source":"codex, slides 326 to 330","qc":"In the lecture, red light lies at about what wavelength?","options":["About 700 nm","About 450 nm","About 200 nm","About 1000 nm"],"correct_index":0,"explanations":["Correct. Red light is about 700 nm.","This is blue light. The right answer is: About 700 nm.","This is ultraviolet. The right answer is: About 700 nm.","This is infrared. The right answer is: About 700 nm."]},{"tag":"M4·Q67","mid":"m04","difficulty":"medium","section":"Parameters that affect resolution","qt":"single","source":"codex, slides 326 to 330","qc":"Why do some microscopes use ultraviolet light?","options":["It is much brighter than white light","It stains the specimen automatically","It removes the need for all lenses","Its wavelength is shorter than visible"],"correct_index":3,"explanations":["This is not the reason. The right answer is: Its shorter wavelength gives even greater resolution.","This is not the reason. The right answer is: Its shorter wavelength gives even greater resolution.","This is not the reason. The right answer is: Its shorter wavelength gives even greater resolution.","Correct. UV has a shorter wavelength."]},{"tag":"M4·Q68","mid":"m04","difficulty":"medium","section":"Parameters that affect resolution","qt":"single","source":"codex, slides 326 to 330","qc":"What do lens aberrations do to image quality?","options":["They increase resolution","They improve contrast always","They shorten the working distance","They reduce clarity"],"correct_index":3,"explanations":["They reduce clarity. The right answer is: They reduce clarity.","This is not stated. The right answer is: They reduce clarity.","This is not stated. The right answer is: They reduce clarity.","Correct. Aberrations reduce clarity. It matches what the lecture slides state."]},{"tag":"M4·Q69","mid":"m04","difficulty":"hard","section":"Parameters that affect resolution","qt":"single","source":"codex, slides 326 to 330","qc":"Which list names the factors that affect resolution?","options":["Wavelength, NA, optical quality, illumination, contrast and medium index","Slide thickness, stage size, lamp colour and arm length","Fixative, stain, embedding, sectioning and mounting","Magnif function beep(f,d,type,g,delay=0){
 if(!AC||!set.sound)return;
 try{const t=AC.currentTime+delay,o=AC.createOscillator(),v=AC.createGain();

 v.gain.setValueAtTime(0.0001,t);v.gain.linearRampToValueAtTime((g||.12)*set.vol,t+.012);

}

/* ====== EUPHEME voice packs ====== */
const PLAIN={ok:"Correct.",no:"Not quite."};
const stripNote=s=>String(s).replace(/\s*\([^()]*\)\s*$/,"");
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pools=new Map(),lastLine=new Map();
function packDraw(pack,slot,arr){
 const key=pack+":"+slot;let pool=pools.get(key);
 if(!pool||!pool.length){
  pool=shuffle(arr.slice());
  const last=lastLine.get(key);
  if(last&&pool.length>1){pool=pool.filter(l=>l!==last);pool.push(last)}
  pools.set(key,pool)}
 const line=pool.shift();lastLine.set(key,line);return line;
}
const streakSlot=n=>n>=19?"streak19plus":n>=11?"streak11_18":n===10?"streak10":n>=7?"streak7_9":n>=5?"streak5_6":n>=3?"streak3_4":"streak1_2";
const packByNum=n=>PACKS.find(p=>p.num===n);
function ePack(){
 if(set.pack>=1&&set.pack<=PACKS.length)return packByNum(set.pack);
 if(set.pack===999)return packByNum(1+Math.floor(Math.random()*PACKS.length));
 return null}
function eupOk(q,streak){
 const p=ePack();if(!p)return null;
 const sl=p.slots;let slot;
 if(q.easyMiss&&Math.random()<.25)slot="easyMiss";
 else if(q.difficulty==="hard"||q.difficulty==="devil")slot="hardCorrect";
 else slot=streakSlot(streak);
 let line=packDraw(p.num,slot,sl[slot]||[])||PLAIN.ok;line=stripNote(line);
 if(slot==="streak11_18"&&line.includes(", ")){const notes=line.split(/,\s?/);line=notes[(streak-11)%notes.length]}
 return line}
function eupNo(q,attempt,broken,recovering){
 const p=ePack();if(!p)return null;
 const sl=p.slots;let slot;
 if(recovering)slot="recovering";
 else if(broken)slot="streakBroken";
 else slot=attempt===1?"wrong1":attempt===2?"wrong2":attempt===3?"wrong3":"wrong4plus";
 let line=stripNote(packDraw(p.num,slot,sl[slot]||[])||PLAIN.no);
 if(slot==="wrong4plus"&&attempt>3&&/slides again/i.test(line)){
  line="I think you should "()+"really ".repeat(attempt-4)+"read the slides again."}
 return line}
function gradeLine(g){
 const p=ePack();if(!p)return null;
 const gr=p.slots.grades;const v=gr&&gr[g];return v?stripNote(v):null;
}

function newRun(mid,sectionIdx){
 ROOM_LOADED="";
 const m=modOf(mid);
 const k=sectionIdx===undefined?-1:sectionIdx;
 const sec=(m.sections||[])[k];
 const list=[];
 if(!sec){for(let i=m.first;i<m.first+m.count;i++)list.push(i)}
 else{for(let i=m.first+sec.from;i<m.first+sec.from+sec.count;i++)list.push(i)}
 R={mid,label:(sec&&sec.name)||"Full "+(mid==="ALL"?"mix":"module"),mode:"",secIdx:k,i:0,far:0,
    a:list.map(()=>null),cs:0,ws:0,msg:"",end:0,rv:null,done:false,list,flags:{},started:Date.now()};
}
function resumeRun(mid){
 const d=loadSave(mid);if(!d)return false;
 const m=modOf(mid);
 const list=[];
 if(Array.isArray(d.order)&&d.order.length&&d.order.every(i=>Number.isInteger(i)&&i>=m.first&&i<m.first+m.count)){
   d.order.forEach(i=>list.push(i))}
  else if(Number.isInteger(d.q0)&&d.q1>d.q0&&d.q0>=m.first&&d.q1<=m.first+m.count){
   for(let i=d.q0;i<d.q1;i++)list.push(i)}
  else{for(let i=m.first;i<m.first+m.count;i++)list.push(i)}
 const a=Array.isArray(d.a)&&d.a.length===list.length?d.a:list.map(()=>null);
 R={mid,label:d.label||"Full module",mode:d.mode||"explain",secIdx:Number.isInteger(d.sec)?d.sec:-1,
    i:Math.min(d.i||0,list.length-1),far:Math.min(d.far||0,list.length-1),a,cs:d.cs||0,ws:d.ws||0,
    msg:d.msg||"",end:d.end||0,rv:null,done:false,list,started:Date.now(),flags:d.flags||{}};
 screen="quiz";
 if(R.end&&R.end<Date.now()){clearInterval(T);screen="results"}
 else if(R.end){clearInterval(T);T=setInterval(tick,1000)}
 draw(1);return true;
}
function finishRun(){
 R.done=true;delSave(R.mid);
 let s=0;R.a.forEach((a,i)=>{if(a===QALL[R.list[i]].correct_index)s++});
 const n=R.list.length,p=Math.round(s/n*100);
 const entries=LS.g("board",[]);
 entries.push({mid:R.mid,sec:R.label,name:set.name||"Guest",score:s,n,pct:p,mode:R.mode==="explain"?"Explain":"Exam",at:Date.now()});
 while(entries.length>400)entries.shift();
 LS.s("board",entries);
 return {s,p};
}

/* ====== FEEDBACK (EUPHEME + sound) ====== */
function judge(q,ok){
 let line=null;
 if(ok){
  const pw=R.ws,n=R.cs+1;
  R.cs=n;R.ws=0;
  if(pw>=RECOVER_MIN){
   line=eupNo(q,n,n<1?1:n,"",true);
   if(set.sound)sfx.streak();
   return line||PLAIN.ok;
  }
  line=eupOk(q,n);
  if(set.sound){sfx.ok();if(n===10||n===19)sfx.streak()}
  return line||PLAIN.ok;
 }
 const attempt=R.ws+1,pc=R.cs,broken=pc>=BREAK_MIN;
 R.ws=attempt;R.cs=0;
 line=eupNo(q,attempt,broken,false);
 if(set.sound)sfx.no();
 return line||PLAIN.no;
}

function boardView(){
 const all=LS.g("board",[]);
 const mids=[["ALL","Everything"],...MODS.map(m=>[m.id,"M"+m.n+": "+m.title])];
 const cur=(R&&R.boardSel)||"ALL";
 const rows=all.filter(e=>cur==="ALL"||e.mid===cur).sort((x,y)=>y.pct-x.pct||y.at-x.at).slice(0,20)
  .map((e,k)=>`<div class="row"><b style="min-width:1.5em;color:var(--gold)">${k+1}.</b><span class="mid">${esc(e.name)}<br><span class="mline">${esc(modOf(e.mid).title)} · ${esc(e.mode)} · ${new Date(e.at).toLocaleDateString()}</span></span><b class="mono">${e.score}/${e.n} (${e.pct}%)</b></div>`).join("");
 return `<div class="c">${BADGE_SM}<h1>Leaderboard</h1><div style="color:var(--dim)">Everyone's best runs · nickname only</div></div>
 <div class="card"><b>Global — all students</b><div id="lbout" style="font-size:.9rem;margin-top:4px"></div></div>
 <div class="nav" style="margin:6px 0"><button class="btn" data-a="lbget">Refresh top 10</button></div>
 <select id="bsel" style="width:100%;padding:12px;margin:8px 0;background:var(--opt);color:var(--bone);border:1px solid var(--line);border-radius:8px;font:inherit" onchange="go('bsel',this.value)">${mids.map(x=>`<option value="${x[0]}"${cur===x[0]?" selected":""}>${esc(x[1])}</option>`).join("")}</select>
 <div class="card">${rows||`<span class="mline">Nothing here yet — finish a run!</span>`}</div>
 ${CONFIG.leaderboard_url?`<div class="card"><b>The Diem Room — what classmates are saying</b><div class="nav" style="margin:6px 0"><button class="chip" data-a="bload">Refresh the room</button></div><div id="cfeed2" style="font-size:.9rem"></div></div>`:""}
 <button class="btn danger" data-a="wipeboard">Clear leaderboard</button>
 <button class="btn alt" data-a="home">Back</button>`;
}

/* ====== REMOTE LEADERBOARD (optional, needs CONFIG.leaderboard_url) ====== */
function lbpost(){
 const u=CONFIG.leaderboard_url;if(!u)return;
 let sc=0;if(R&&R.a)R.a.forEach((a,i)=>{if(a===QALL[R.list[i]].correct_index)sc++});
 const out=document.getElementById("lbout");if(out)out.textContent="Posting…";
 try{const p=new URLSearchParams({name:set.name||"Anonymous",quiz:CONFIG.title,score:String(sc),pct:String(Math.round(sc/R.list.length*100)),mode:R?R.mode||"":"",sec:R?R.label:""}).toString();
  fetch(u+"?"+p,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:p})
  .then(()=>{setTimeout(lbget,400)}).catch(()=>{if(out)out.textContent="Could not reach the board."})}catch(_){if(out)out.textContent="Could not reach the board."}
}
function lbget(){
 const u=CONFIG.leaderboard_url;if(!u)return;
 const out=document.getElementById("lbout");if(!out)return;
 out.textContent="Loading the global board…";const cb="cdLB"+String(Date.now()%100000);
 window[cb]=d=>{delete window[cb];const x=document.getElementById("cbx");x&&x.remove();
  if(!d||!d.ok||!d.top){out.textContent="Board unreachable — check your connection.";return}
  out.innerHTML=d.top.length?d.top.map((t,k)=>`<div class="row"><b style="min-width:1.5em;color:var(--gold)">${k+1}.</b><span class="mid">${esc(t.name)}<br><span class="mline">${esc(t.mode||"")} · ${esc(t.at?new Date(String(t.at).replace(" ","T")).toLocaleDateString():"")}</span></span><b class="mono">${t.score} pts · ${t.pct}%</b></div>`).join(""):`<span class="mline">No scores posted yet — be the first.</span>`};
 const x=document.createElement("script");x.src=u+"?do=top&quiz="+encodeURIComponent(CONFIG.title)+"&callback="+cb;x.id="cbx";
 document.head.appendChild(x);
}

/* ====== THE DIEM ROOM (comments via the same Apps Script) ====== */
let ROOM_LOADED="";
const VCOL={Tough:"var(--red2)",Fair:"var(--gold)",Easy:"var(--green)"};
function diemRoom(mid){
 const u=CONFIG.leaderboard_url;if(!u)return "";
 const chips=["Tough","Fair","Easy"].map(v=>`<button class="chip${R.cw===v?" on":""}" data-a="cw" data-v="${v}">${v}</button>`).join("");
 return `<div class="card"><b>The Diem Room — ${esc(modOf(mid).title)}</b>
  <span class="mline" style="display:block;margin:4px 0">Leave a note the next set should hear: which parts were brutal, what saved you. Rate it or just write.</span>
  <div style="margin:8px 0">${chips}</div>
  <input id="cmtx" maxlength="220" placeholder="Which ones were brutal? What saved you?">
  <div class="nav" style="align-items:center;margin:6px 0"><button class="chip" data-a="cpost">Post to the room</button><button class="chip" data-a="cload">Refresh</button></div>
  <div class="err" id="cout" style="color:var(--green)"></div>
  <div id="cfeed" style="font-size:.9rem"></div></div>`;
}
const roomRow=c=>{
 const t=(modOf(c.mod||"ALL")||{}).title||"";
 return `<div class="row"><span style="min-width:4em;font-size:.75rem;font-weight:700;color:${VCOL[c.verdict]||"var(--dim)"}">${esc(c.verdict||"—")}</span>
  <span class="mid">${esc(c.text||"")}<br><span class="mline">${esc(c.name)}${t?" · "+esc(t):""} · ${esc(c.at||"")}</span></span></div>`;
};
function cload(sel,id){
 const u=CONFIG.leaderboard_url;if(!u)return;
 const out=document.getElementById(id);if(!out)return;
 out.textContent="Opening the room…";
 const cb="cdCM"+String(Date.now()%100000);
 window[cb]=d=>{delete window[cb];const x=document.getElementById("cbx");x&&x.remove();
  if(!d||!d.ok||!d.comments){if(out)out.textContent="Room unreachable.";return}
  if(out)out.innerHTML=d.comments.length?d.comments.map(roomRow).join(""):`<span class="mline">Silence so far — be the first voice.</span>`};
 const x=document.createElement("script");
 x.src=u+"?do=comments&quiz="+encodeURIComponent(CONFIG.title)+"&mod="+encodeURIComponent(sel==="ALL"?"":sel)+"&callback="+cb;
 x.id="cbx";document.head.appendChild(x);
}
function cpost(){
 const u=CONFIG.leaderboard_url;if(!u)return;
 const ta=document.getElementById("cmtx"),out=document.getElementById("cout");
 const txt=(ta&&ta.value.trim())||"",verd=(R&&R.cw)||"";
 if(!txt&&!verd){if(out)out.textContent="Pick a verdict or write something first.";return}
 if(out)out.textContent="Posting…";
 try{const p=new URLSearchParams({type:"comment",quiz:CONFIG.title,mod:R.mid,label:R.label||"",name:set.name||"Anonymous",verdict:verd,text:txt}).toString();
  fetch(u+"?"+p,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:p})
  .then(()=>{if(ta)ta.value="";if(out)out.textContent="Posted — the room refreshes in a breath.";setTimeout(()=>cload(R.mid,"cfeed"),1600)})
  .catch(()=>{if(out)out.textContent="Could not reach the room."})}catch(_){if(out)out.textContent="Could not reach the room."}
}

/* ====== RENDER + ACTIONS ====== */
const views={home,hub,mod:()=>modView(R.modSel||"m01"),setup:()=>setupView(),timer:setupTimer,quiz:()=>quizView(),jump:()=>jumpView(),flaglist:()=>flagListView(),askname:()=>askNameView(),results:()=>resultsViewReal(),settings:settingsView,board:boardView};
const draw=t=>{
 $.innerHTML=HEAD()+(views[screen]||home)()+FOOT;if(t)scrollTo(0,0);
 if(CONFIG.leaderboard_url&&(screen==="results"||screen==="board")){
  if(screen==="results"&&set.autopost&&R&&!R.posted){R.posted=1;setTimeout(lbpost,50)}
  setTimeout(lbget,300);
 }
};
function go(a,v){
 if((a==="hub"||a==="board"||a==="resume")&&!((set.name||"").trim())){PEND=[a,v];screen="askname";draw(1);return}
 if(a==="namesave2"){const el=document.getElementById("unm");set.name=((el&&el.value)||"").trim().slice(0,24)||"Guest";saveSet();const p=PEND;PEND=null;screen="home";if(p){go(p[0],p[1])}else{draw(1)}return}
 if(a==="nameskip"){if(!((set.name||"").trim())){set.name="Guest";saveSet()}const p=PEND;PEND=null;screen="home";if(p){go(p[0],p[1])}else{draw(1)}return}
 if(a==="tutorial"||a==="coach"){screen="home";draw(1);try{CDCoach.start("quiz",QUIZ_COACH,()=>{set.seen_tutorial=true;saveSet();R=null;screen="home";draw(1)})}catch(e){}return}
 if(a==="home"){clearInterval(T);screen="home";R=null;draw(1);return}
 if(a==="mod"){R={modSel:v};screen="mod";draw(1);return}
 if(a==="modback"){screen="hub";draw(1);return}
 if(a==="hub"){screen="hub";draw(1);return}
 if(a==="resume"){if(!resumeRun(v)){draw(1)}return}
 if(a==="delsave"||a==="delsave2"){delSave(v);if(screen==="mod"){draw(1)}else{draw(1)}return}
 if(a==="sec"){const [mid,k]=[v.split("|")[0],parseInt(v.split("|")[1],10)];newRun(mid,k);screen="setup";draw(1);return}
 if(a==="mode"){R.mode=v;saveRun();screen="timer";draw(1);return}
 if(a==="modeback"){screen="setup";draw(1);return}
 if(a==="start"){initAC();const tm=parseFloat((document.getElementById("tm")||{}).value);
  if(!(tm>0)){document.getElementById("er").textContent="Enter a time in minutes.";return}
  R.end=Date.now()+tm*60000;clearInterval(T);T=setInterval(tick,1000);screen="quiz";saveRun();draw(1);return}
 if(a==="notimer"){initAC();R.end=0;screen="quiz";saveRun();draw(1);return}
 if(a==="opt"){const k=+v,i=R.i;
  if(i!==R.far){return}
  initAC();
  if(R.mode==="explain"){if(R.a[i]!==null)return;R.a[i]=k;R.msg=judge(QALL[R.list[i]],k===QALL[R.list[i]].correct_index)||PLAIN.ok}
  else{R.a[i]=k}
  saveRun();draw();return}
 if(a==="flag"){if(R){R.flags=R.flags||{};R.flags[R.i]=!R.flags[R.i];saveRun();draw()}return}
  if(a==="flaglist"){screen="flaglist";draw(1);return}
  if(a==="jumpgrid"){screen="jump";draw(1);return}
  if(a==="quizback"){screen="quiz";draw(1);return}
  if(a==="jump"){const k=+v;if(R&&k>=0&&k<R.list.length){R.i=k;if(k>R.far)R.far=k;saveRun();screen="quiz";draw(1)}return}
  if(a==="shuffle"){
   const pairs=R.list.map((q,i)=>({q,a:R.a[i]}));
   for(let i=pairs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pairs[i],pairs[j]]=[pairs[j],pairs[i]]}
   const oldFlags=R.flags||{};
   const fobj={};pairs.forEach((p,ni)=>{const oi=R.list.indexOf(p.q);if(oi>=0&&oldFlags[oi])fobj[ni]=true});
   R.list=pairs.map(p=>p.q);R.a=pairs.map(p=>p.a);R.flags=fobj;
   R.i=0;R.far=0;R.msg="";saveRun();screen="jump";draw(1);return}
  if(a==="back"){if(R.i>0){R.i--;draw(1)}return}
 if(a==="next"){
  if(R.i===R.far){
   if(R.a[R.i]===null)return;
   if(R.i===R.list.length-1){clearInterval(T);finishRun();sfx.done();screen="results";draw(1);return}
   R.far++;R.msg=""}
  R.i++;saveRun();draw(1);return}
 if(a==="exit"){saveRun();sfx.exit();clearInterval(T);screen="home";R=null;draw(1);return}
 if(a==="rv"){R.rv=R.rv===v?null:v;draw();return}
 if(a==="again"){newRun(R.mid,R.secIdx);R.mode="";screen="setup";draw(1);return}
 if(a==="settings"){screen="settings";draw(1);return}
 if(a==="board"){R=R||{boardSel:"ALL"};screen="board";draw(1);if(CONFIG.leaderboard_url)cload(R.boardSel,"cfeed2");return}
 if(a==="theme"){set.theme=v;saveSet();document.body.dataset.theme=v;draw();return}
 if(a==="autopost"){set.autopost=!set.autopost;saveSet();draw();return}
 if(a==="sndtoggle"){initAC();set.sound=!set.sound;saveSet();draw();return}
 if(a==="sndtest"){initAC();sfx.done();return}
 if(a==="packsave"){set.pack=parseInt((document.getElementById("packsel")||{}).value,10)||0;saveSet();draw();return}
 if(a==="namesave"){set.name=(document.getElementById("nm")||{}).value;saveSet();draw();return}
 if(a==="pctvol"){/* unused */}
 if(a==="wipeall"){if(confirm("Delete ALL saved progress? This cannot be undone.")){MODS.forEach(m=>delSave(m.id));delSave("ALL");draw(1)}return}
 if(a==="wipeboard"){if(confirm("Clear the local leaderboard?")){LS.s("board",[]);draw(1)}return}
 if(a==="repost"){
  const nm=(document.getElementById("bnm")||{}).value;const entries=LS.g("board",[]);
  const last=entries.length?entries[entries.length-1]:null;
  if(last&&last.mid===R.mid){last.name=nm.trim().slice(0,24)||"Guest";LS.s("board",entries)}
  set.name=nm.trim().slice(0,24)||set.name;saveSet();draw(1);return}
 if(a==="lbpost"){lbpost();return}
 if(a==="lbget"){lbget();return}
 if(a==="cw"){R.cw=(R.cw===v)?"":v;document.querySelectorAll('[data-a="cw"]').forEach(b=>b.classList.toggle("on",b.dataset.v===R.cw));return}
 if(a==="cpost"){cpost();return}
 if(a==="cload"){cload(R.mid,"cfeed");return}
 if(a==="bload"){cload((R&&R.boardSel)||"ALL","cfeed2");return}
 if(a==="bsel"){R.boardSel=v;draw();if(CONFIG.leaderboard_url)cload(v,"cfeed2");return}
}

/* ===== COACH-MARK TUTORIAL (guided tour with arrows) ===== */
(function () { /* shared engine — see coach_marks_snippet.js */
  if (window.CDCoach) return;
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  var st = document.createElement("style");
  st.textContent =
    "#cdCoachHole{position:fixed;z-index:99998;pointer-events:none;border-radius:12px;box-shadow:0 0 0 200vmax rgba(2,4,10,.82),inset 0 0 0 3px #d4af37,0 0 28px rgba(212,175,55,.45);transition:all .28s ease;display:none}" +
    "#cdCoachHole.dim{left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0;box-shadow:none!important;background:rgba(2,4,10,.82)}" +
    "#cdCoachCard{position:fixed;z-index:99999;display:none;left:50%;top:12px;transform:translateX(-50%);width:min(430px,calc(100vw - 24px));max-width:none;max-height:60vh;overflow:auto;background:rgba(18,22,29,.97);color:#ece7db;border:1px solid #d4af37;border-radius:12px;padding:13px 15px 11px;box-shadow:0 16px 60px rgba(0,0,0,.85);line-height:1.45;font-size:13px}" +
    "#cdCoachCard h4{margin:0 0 4px;color:#d4af37;font-size:15px;letter-spacing:.5px}" +
    "#cdCoachCard p{margin:0 0 9px;color:#cfc9bc;white-space:pre-line}" +
    "#cdCoachCard .cdots{color:#d4af37;font-size:9px;letter-spacing:3px;margin-bottom:7px}" +
    "#cdCoachCard .cbtns{display:flex;gap:6px;justify-content:flex-end;align-items:center}" +
    "#cdCoachCard .ct{margin-right:auto;color:#8b8577;font-size:11px}" +
    "#cdCoachCard button{cursor:pointer;border-radius:8px;border:1px solid #d4af37;background:transparent;color:#d4af37;font-weight:700;padding:6px 12px;font-size:12px}" +
    "#cdCoachCard button.main{background:#d4af37;color:#12161d}" +
    "#cdCoachCard .cArr{position:absolute;width:0;height:0;border:10px solid transparent;pointer-events:none}";
  document.head.appendChild(st);
  var hole = document.createElement("div"); hole.id = "cdCoachHole"; document.body.appendChild(hole);
  var card = document.createElement("div"); card.id = "cdCoachCard"; document.body.appendChild(card);
  var steps = [], i = 0, key = null, onEnd = null;
  function measure(s) {
    var el = s && s.sel ? document.querySelector(s.sel) : null;
    if (!el) return null;
    var r = el.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return null;
    if (r.bottom < 0 || r.top > innerHeight || r.right < 0 || r.left > innerWidth) return null;
    return r;
  }
  function draw() {
    var s = steps[i];
    if (!s) return end();
    if (s.if && !s.if()) { i++; draw(); return; }
    if (s.onEnter) { try { s.onEnter(); } catch (e) {} }
    var r = measure(s);
    card.style.display = "block";
    var last = i === steps.length - 1;
    var dots = steps.map(function (_, k) { return '<span style="opacity:' + (k === i ? 1 : .28) + '">●</span>'; }).join(" ");
    card.innerHTML =
      '<div class="cdots">' + dots + '</div>' +
      '<h4>' + esc(s.t) + '</h4>' +
      '<p>' + s.h + '</p>' +
      '<div class="cbtns"><span class="ct">' + (i + 1) + ' / ' + steps.length + '</span>' +
      (i > 0 ? '<button id="cdPrev">Back</button>' : '<button id="cdSkip">Skip tour</button>') +
      '<button class="main" id="cdNext">' + (last ? "Done" : "Next") + '</button></div>';
    var old = card.querySelector(".cArr"); if (old) old.remove();
    var cw = Math.min(430, innerWidth - 24);
    card.style.width = cw + "px";
    if (!r) {
      hole.classList.add("dim"); hole.style.display = "block";
      card.style.top = "12px"; card.style.transform = "translateX(-50%)";
      return;
    }
    var cw2 = Math.min(430, innerWidth - 24);
    card.style.width = cw2 + "px";
    hole.classList.remove("dim"); hole.style.display = "block";
    hole.style.left = (r.left - 6) + "px"; hole.style.top = (r.top - 6) + "px";
    hole.style.width = (r.width + 12) + "px"; hole.style.height = (r.height + 12) + "px";
    var ch = card.offsetHeight;
    var preferAbove = r.top + r.height / 2 > innerHeight / 2;
    var top;
    if (preferAbove && r.top - ch - 20 >= 8) { top = r.top - ch - 12; }
    else if (r.bottom + 12 + ch <= innerHeight - 8) { top = r.bottom + 12; }
    else if (preferAbove) { top = Math.max(8, innerHeight - ch - 8); }
    else { top = Math.min(r.bottom + 12, innerHeight - ch - 8); }
    top = Math.min(Math.max(top, 8), Math.max(8, innerHeight - ch - 8));
    card.style.top = top + "px";
    card.style.transform = "translateX(-50%)";
    var arr = document.createElement("div"); arr.className = "cArr"; card.appendChild(arr);
    var cardLeft = (innerWidth - cw2) / 2;
    var ax = Math.min(Math.max(r.left + r.width / 2 - cardLeft - 10, 8), cw2 - 28) + "px";
    if (top >= r.bottom) { arr.style.bottom = "100%"; arr.style.borderBottomColor = "#d4af37"; }
    else { arr.style.top = "100%"; arr.style.borderTopColor = "#d4af37"; }
    arr.style.left = ax;
  }
  function end() {
    try { localStorage.setItem("cdcoach:" + (key || "x"), "1"); } catch (e) {}
    hole.style.display = "none"; card.style.display = "none"; try { window.CDCoachActive = false; } catch (e) {}
    var f = onEnd; onEnd = null; if (f) f();
  }
  card.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    if (b.id === "cdNext") { i++; if (i >= steps.length) end(); else draw(); }
    else if (b.id === "cdPrev") { if (i > 0) { i--; draw(); } }
    else if (b.id === "cdSkip") { end(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && card.style.display === "block") end();
  });
  addEventListener("resize", function () { if (card.style.display === "block") draw(); });
  addEventListener("scroll", function () { if (card.style.display === "block") draw(); }, true);
  window.CDCoach = {
    start: function (k, def, cb) { key = k; steps = def.steps; i = 0; onEnd = cb || null; try { window.CDCoachActive = true; } catch (e) {} draw(); },
    maybe: function (k, def, cb) {
      var seen = null; try { seen = localStorage.getItem("cdcoach:" + k); } catch (e) {}
      if (!seen) this.start(k, def, cb);
    },
    stop: end
  };
})();
