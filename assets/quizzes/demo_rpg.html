g out glycolysis in a collected sample, so glucose in unseparated blood falls by about 5-7% per hour.\nFluoride oxalate tubes (grey top) inhibit glycolysis, so glucose is preserved for measurement.\nSeparate plasma from cells promptly if the sample is not in a preservative tube."}], "levels": [{"title": "Glycolysis Basics", "intro": "Warm-up. Learn where glycolysis happens and what it gives you.", "game": "quiz", "items": [{"q": "Where in the cell does glycolysis occur?", "options": ["Cytosol", "Mitochondrial matrix", "Nucleus", "Lysosome"], "answer": 0, "explain": "Glycolysis occurs in the cytosol, so it doesn't need mitochondria.", "slide": 1}, {"q": "What is the NET ATP yield of glycolysis per glucose?", "options": ["4", "2", "6", "36"], "answer": 1, "explain": "4 ATP are produced but 2 are consumed in the investment phase, so the net is 2 ATP (plus 2 NADH).", "slide": 1}, {"q": "Under anaerobic conditions, pyruvate is reduced to what?", "options": ["Acetyl-CoA", "Lactate", "Oxaloacetate", "Citrate"], "answer": 1, "explain": "Lactate dehydrogenase reduces pyruvate to lactate, regenerating NAD+ so glycolysis can continue.", "slide": 1}], "enemy": "Sugar Slime", "monster": "slime", "quest": "The lobby gate is sealed by a slime that feeds on sugar. Answer correctly to cut it down."}, {"title": "Build the Pathway", "intro": "Put the key steps of glycolysis in the right order.", "game": "order", "items": [{"prompt": "Put the key steps of glycolysis in order", "steps": ["Hexokinase: glucose → glucose-6-phosphate", "Glucose-6-phosphate → fructose-6-phosphate", "PFK-1: fructose-6-phosphate → fructose-1,6-bisphosphate", "Aldolase splits it into two triose phosphates", "G3P oxidized to 1,3-BPG, producing NADH", "1,3-BPG → 3-phosphoglycerate, forming ATP", "PEP → pyruvate, forming ATP"], "explain": "Glucose is phosphorylated and committed (steps 1-3), split (4), then the payoff phase makes NADH and ATP (5-7).", "slide": 2}], "enemy": "Scramble Wraith", "monster": "wraith", ibits PFK-1?", "options": ["AMP", "Fructose-2,6-bisphosphate", "ATP", "Fructose-1,6-bisphosphate"], "answer": 2, "explain": "High ATP means the cell has energy, so it inhibits PFK-1 (as does citrate). AMP and fructose-2,6-bisphosphate activate it.", "slide": 4}, {"q": "Hexokinase is inhibited by which molecule?", "options": ["Pyruvate", "Glucose-6-phosphate", "Lactate", "NAD+"], "answer": 1, "explain": "Hexokinase is inhibited by its own product, glucose-6-phosphate.", "slide": 4}, {"q": "An unseparated blood sample sits for hours and its glucose reads low. Why?", "options": ["Red cells keep doing glycolysis and consume glucose", "Glucose binds to albumin", "Plasma proteins precipitate", "Bilirubin degrades glucose"], "answer": 0, "explain": "Cells in the sample continue glycolysis, so glucose falls by about 5-7% per hour.", "slide": 5}, {"q": "Which tube additive preserves glucose by inhibiting glycolysis?", "options": ["EDTA", "Heparin", "Sodium citrate", "Fluoride oxalate"], "answer": 3, "explain": "Fluoride oxalate (grey top) inhibits glycolysis so glucose is preserved for measurement.", "slide": 5}], "enemy": "Regulator Bat", "monster": "bat", "quest": "Bats swarm the control room, flipping switches. Learn what controls the pathway and what protects a blood sample."}], "npc": "Grandmaster Orlic", "bossName": "Warden of the Pathway", "bossQuest": "The Warden wakes. It feeds on every mistake you made on the way up. Three hits and you fall. Show it everything you learned."};

{ const m = LV.filter(l => l.game !== 'boss').length, k = Math.min(3, Math.max(0, m - 1));

    document.querySelectorAll('.chip').forEach(b => b.onclick = () => { placed.push(pool.find(c => c.k == b.dataset.k)); draw(); });
    document.querySelectorAll('.slot.filled').forEach(b => b.onclick = () => { placed.splice(+b.dataset.p, 1); draw(); });
    $('#chk').onclick = () => {
      let ok = true;
      document.querySelectorAll('.slot').forEach((el, p) => { const g = placed[p].k === p; if (!g) ok = false; el.classList.add(g ? 'good' : 'bad'); el.style.pointerEvents = 'none'; });
      $('#chk').remove(); document.querySelectorAll('.chip').forEach(x => x.style.pointerEvents = 'none');
      res({ ok, correctText: ok ? '' : '<ol style="margin:6px 0;padding-left:20px">' + it.steps.map(s => `<li>${esc(s)}</li>`).join('') + '</ol>' });
    };
  };
  draw();
}
function qSort(it, res) {
  const cats = it.cats;
  ui(`<div class="card pop"><span class="badge">Weak point</span><p class="mut">${esc(it.lp || 'Which group does this belong to?')}</p><div class="sortcard">${esc(it.text)}</div><div class="cats c${Math.min(cats.length, 4)}">${cats.map((c, k) => `<button class="cat" data-k="${k}">${esc(c)}</button>`).join('')}</div></div>`);
  document.querySelectorAll('.cat').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, ok = k === it.category;
    document.querySelectorAll('.cat').forEach(x => x.style.pointerEvents = 'none');
    b.classList.add(ok ? 'good' : 'bad'); if (!ok) document.querySelector(`.cat[data-k="${it.category}"]`).classList.add('good');
    res({ ok, correctText: esc(cats[it.category]) });
  });
}

/* ================= game flow ================= */
const keyOf = it => String(it.q || it.prompt || it.text);
async function fight(l, i, boss) {
  let items = l.items.map((it, k) => Object.assign({}, it, { _id: i + ':' + k, kind: boss ? 'quiz' : l.game, cats: l.categories, lp: l.prompt, boss }));
  if (boss) items = shuffle(items).slice(0, Math.min(S.bossCount || 8, items.length)); else if (l.game !== 'order') items = shuffle(items);
  const wOf = it => it.kind === 'order' ? 3 : 1, totalW = items.reduce((a, it) => a + wOf(it), 0), queue = items.slice();
  let right = 0, wrong = 0; blockUsed = false;
  while (queue.length) {
    if (boss && mon && !mon.enraged && mon.hp <= 55) await enrage();
    const it = queue[0], t0 = Date.now();
    hero.state = 'tense'; anx.on = true; anx.t0 = performance.now(); anx.nextThought = anx.t0 + 2200; anx.nextBeat = anx.t0 + 1800; anx.nextGrowl = anx.t0 + 6000; anx.nextAtk = anx.t0 + (mon && (mon.boss || mon.enraged) ? 7000 : 9000); anx.chargeFrom = anx.t0; anx.atkN = 0;
    const a = await ask(it);
    anx.on = false; if (atkP) await atkP;
    hero.state = 'idle'; hero.sword = -.6; bubble = { txt: a.ok ? 'Yes!' : 'Ugh!', life: 70, max: 70 };
    await tween(mon, { ox: 0, oy: 0 }, 120);
    if (a.ok) {
      queue.shift(); right++; G.streak++;
      const gain = 10 + Math.min(G.streak, 5) * 2 + ((Date.now() - t0) / 1000 < 8 ? 5 : 0), before = heroLv();
      G.xp += gain; G.codex[keyOf(it)] = { t: keyOf(it), e: it.explain || '', s: it.slide }; sfx.ok(); save(); hudDom();
      const ar = allyById('mira'); if (ar) { allyShoot(ar); if (G.streak >= 2) G.xp += 5; }
      await strike(it, 100 * wOf(it) / totalW);
      if (G.streak >= 5 && G.streak % 5 === 0 && live().length && queue.length) await partyCombo();
      const ly = allyById('lyra'); if (ly && G.streak % 3 === 0 && hero.hp < hero.max && queue.length) await allyHeal(ly);
      if (queue.length) await monAttack(null, Math.random() < .55 ? 'parry' : 'dodge', true);
      if (heroLv() > before) { banner('Level up!', 'Lv ' + heroLv(), 1400); burst(hero.x, hero.y - 20, '#ffc857', 26, 3); sfx.lvl(); }
      if (!queue.length) { await monDie(); heroCheer(); }
      await feedback(true, `✅ Hit! +${gain} XP · added to Codex`, esc(it.explain || ''), it.slide);
    } else {
      G.streak = 0; wrong++; queue.shift(); queue.splice(Math.min(2, queue.length), 0, it);
      const m = G.missed[keyOf(it)] || { text: keyOf(it), slide: it.slide, explain: it.explain || '', n: 0 }; m.n++; G.missed[keyOf(it)] = m; save(); hudDom();
      const blk = allyById('brock'), canBlock = blk && !blockUsed; if (canBlock) blockUsed = true;
      await monAttack(canBlock ? blk : null);
      if (!canBlock && hero.hp <= 0) { await heroDie(); return 'dead'; }
      await feedback(false, canBlock ? '🛡 Brock blocked the hit!' : '❌ You got hit', `${a.correctText ? `<p><b>Answer:</b> ${a.correctText}</p>` : ''}${esc(it.explain || '')}`, it.slide, 'Back to battle');
    }
  }
  return { right, wrong };
}
async function enterGuild() {
  scene.guild = true; scene.noteTaken = false; scene.tower = false; scene.speed = 0; inFight = false; mon = null; titleText = null; anx.on = false; tension = 0; bubble = null;
  hero.y = HY_G; hero.x = -20; allies.forEach((a, k) => { a.x = -44 - k * 24; a.y = HY_G; a.ox = 0; a.hop = 0; }); hero.ox = 0; hero.hop = 0; hero.state = 'run'; hero.sword = -.6; hero.dead = 0;
  fx.fade = 1; hudDom();
  ui(`<div class="card dlg pop"><b>Adventurers Guild</b><p class="mut">Pushing open the heavy door…</p></div>`);
  tween(fx, { fade: 0 }, 500);
  banner('Adventurers Guild', 'Contract hall', 1600);
  await tween(hero, { x: 104 }, 1100, easeOut); hero.state = 'idle'; await wait(350);
}
function contract(l, i, boss) {
  return new Promise(res => {
    const sk = Math.max(1, Math.min(5, Math.ceil(l.items.length / 2)));
    ui(`<div class="scroll pop"><div class="sc-h">GUILD CONTRACT No. ${String(i + 1).padStart(3, '0')}</div><h2>${esc(l.title)}</h2><div class="sc-r"><span>Target</span><b>${esc(l.enemy || l.title)}</b></div><div class="sc-r"><span>Location</span><b>${boss ? 'The Summit' : 'Floor ' + (i + 1)}</b></div><div class="sc-r"><span>Danger</span><b>${'💀'.repeat(sk)}</b></div><div class="sc-r"><span>Rival</span><b>Kael · ${GRANKS[rivalIdx()]}-Rank</b></div><div class="sc-r"><span>Reward</span><b>XP · Codex · Rank</b></div><div class="stamp" id="stp">ACCEPTED</div><button class="btn" id="acc">Accept contract</button></div>`);
    $('#acc').onclick = () => { $('#acc').disabled = true; $('#stp').classList.add('on'); sfx.stamp(); wait(900).then(res); };
  });
}
async function promote(to) {
  const from = G.rank; G.rank = to; save(); hudDom(); sfx.lvl(); speedLines(40); burst(hero.x, hero.y - 24, RCOL[GRANKS[to]], 30, 3.5); flashC = RCOL[GRANKS[to]]; flashA = .4;
  banner('Rank up!', GRANKS[to] + '-Rank ' + RTITLE[GRANKS[to]], 1600);
  await new Promise(res => {
    ui(`<div class="gcard pop"><div class="tt">GUILD PROMOTION</div><div class="gl"><span class="old" style="color:${RCOL[GRANKS[from]]}">${GRANKS[from]}</span><span class="new" style="color:${RCOL[GRANKS[to]]}">${GRANKS[to]}</span></div><h2 style="margin:4px 0">${GRANKS[to]}-Rank ${RTITLE[GRANKS[to]]}</h2><p class="mut">${GRANKS[from]}-Rank → ${GRANKS[to]}-Rank</p><button class="btn" id="go">Accept the guild card</button></div>`);
    $('#go').onclick = res;
  });
}
async function guildScene(i, l, boss) {
  await enterGuild();
  const who = S.npc || 'Grandmaster', rk = `${rank()}-Rank ${rankName()}`, rv = `${GRANKS[rivalIdx()]}-Rank`;
  await say(who, i === 0 ? `So. Another one comes to climb the Tower. ${rk}. Hm. Come closer.` : [`You return alive. The Tower has taken note of you, ${rk}.`, 'Back so soon? Good. The Guild keeps count of those who come back.', 'Sit. Breathe. The next contract will not be kind.'][i % 3]);
  const tgt = targetRank();
  if (i > 0 && tgt > G.rank) {
    await say(who, 'You cleared the last contract. The Guild does not forget that. Step forward. Your rank review is complete.');
    await promote(tgt);
    await say(who, `${RTITLE[GRANKS[tgt]]}. Wear it well. Now, to the next contract.`);
  } else if (i > 0) {
    const ls = G.stats[i - 1];
    if (ls && ls.right / (ls.right + ls.wrong) < .7) await say(who, 'You won. But sloppily. The Guild promotes the precise, not the lucky. No promotion this time.');
  }
  if (G.down && boss) await say(who, `${PARTY[G.down].name} is resting on the bench by the fire. Do not let that sacrifice be wasted.`);
  await playLines(i === 0 ? [['Kael', "Tch. Another F-rank rookie. Don't expect me to carry you."], ['You', 'I never asked you to.']]
    : boss ? [['Kael', "The Warden's contract...? Tch. You'd better not fail. If you do, I'm taking it."]]
    : [['Kael', [`${rank()}-Rank already? Hmph. I'm ${rv}. Try to keep up.`, "You're still alive? ...Interesting.", `A party, huh? Heh. Don't get cocky. I'm still ${rv}.`][(i - 1) % 3]]]);
  const lines = [];
  if (boss) lines.push('This is the contract no one wants. The Warden waits at the summit. Take your time. Then do not waste it.');
  lines.push(l.quest || autoQuest(l));
  lines.push(`Target: ${l.enemy || l.title}. It strikes the moment you hesitate. Read the question twice, then trust yourself.`);
  for (const t of lines) await say(who, t);
  await contract(l, i, boss);
  scene.noteTaken = true; burst(66, 54, '#ffc857', 22, 2.5); sfx.lvl(); heroCheer();
  await wait(800); await tween(fx, { fade: 1 }, 450);
}
async function epilogue() {
  const acc = overallAcc(), who = S.npc || 'Grandmaster';
  await enterGuild();
  await say(who, 'The Warden is down. For the first time in years, the Tower is quiet.');
  const tgt = acc >= 85 ? 6 : 5;
  if (tgt > G.rank) {
    await say(who, acc >= 85 ? `${acc}%. That is not luck. That is understanding. Step forward. By the authority of the Guild...` : `You reached the summit, and that counts. ${acc}%... close. Step forward.`);
    await promote(tgt);
    await say(who, tgt === 6 ? 'S-Rank. Only a handful have ever worn it. Wear it well.' : 'A-Rank. S is for those who do not stumble. Study what you missed, then come back and take it.');
  }
  await say('Kael', G.rank >= 6 ? "S-Rank...? You overtook me. Tch. Next time, I won't lose." : "A-Rank. Same as me. We'll settle this next time.");
  for (const a of allies.slice(0, 3)) await say(PARTY[a.id].name, FINAL[a.id]);
}

/* ---------- story scenes: rescues, rivals, party ---------- */
function stageGuest(sc) {
  const g = makeAlly(sc.ally);
  if (sc.kind === 'rival') { g.x = 165; g.y = GY + 8; g.front = true; } else { g.x = 292; g.y = GY; g.captive = true; g.rope = sc.kind === 'rope'; g.cage = sc.kind === 'cage'; g.kneel = sc.kind === 'rope'; }
  guest = g; guestCry = performance.now() + 2500;
}
async function playLines(lines) { for (const [n, t, tag] of lines) { if (tag === 'x') { speedLines(45); shake = 5; } await say(n, t); } }
async function storyPre(sc) { speedLines(35); banner('!!', 'Something is wrong...', 1200); await wait(500); await playLines(sc.pre()); }
async function storyPost(sc) {
  const g = guest; if (!g) return;
  if (g.captive) { g.rope = false; g.cage = false; g.kneel = false; g.captive = false; burst(g.x, g.y - 20, '#ffe29a', 22, 3); sfx.lvl(); await tween(g, { x: HEROX + 40, y: GY + 4 }, 800, easeOut); }
  else await tween(g, { x: HEROX + 40 }, 500, easeOut);
  await playLines(sc.post());
  await joinParty(g);
}
function joinParty(g) {
  const d = PARTY[g.id]; G.party.push(g.id); save(); allies.push(g); guest = null; g.front = false; g.captive = false;
  hudDom(); sfx.lvl(); banner('Party joined!', d.name + ' the ' + d.role, 1600); burst(g.x, g.y - 24, d.trim, 24, 3);
  return new Promise(res => { ui(`<div class="card pop" style="text-align:center"><span class="badge">New party member</span><h1>${d.icon} ${d.name}</h1><p><b>${d.role}</b></p><p>${d.perk}</p><button class="btn" id="go">Welcome to the party</button></div>`); $('#go').onclick = res; });
}
async function fallScene() {
  const v = allyById('brock') || live()[0], d = PARTY[v.id];
  speedLines(40); flashC = '#ff2d55'; flashA = .5; shake = 9; sfx.hit();
  banner('Ambush!', 'Something strikes from the dark...', 1400); await wait(700);
  v.down = true; G.down = v.id; save(); burst(v.x, v.y - 20, '#ff5c7a', 20, 3);
  const L = [[d.name, d.fall[0], 'x'], ['You', d.name + '!', 'x'], [d.name, d.fall[1]], ['You', "I'm not leaving anyone behind!"], [d.name, '...Idiot. Then win. Win for all of us.']];
  const o = live()[0]; if (o) L.push([PARTY[o.id].name, `We'll finish this for ${d.name}. Come on.`]);
  await playLines(L);
}
async function bossRally() {
  if (!live().length) return;
  const L = [];
  if (hasA('mira')) L.push(['Mira', 'So this is it... the top of the Tower.']);
  if (hasA('brock')) L.push(['Brock', 'Tch. Scared? Good. It keeps you sharp.']);
  if (hasA('lyra')) L.push(['Lyra', "I'll heal whatever I can. Just don't give up."]);
  L.push(['You', "We didn't come this far to lose. Let's finish this together!", 'x'], ['Party', 'Right! Together!', 'x']);
  speedLines(30); await playLines(L);
}
const autoQuest = l => `A ${l.enemy || 'monster'} blocks the stairs to the next floor. Prove you understand ${l.title} and it falls. Get it wrong and it strikes back.`;
async function floor(i, intro) {
  const l = LV[i], boss = l.game === 'boss';
  G.lvl = i; save(); scene.theme = boss ? 6 : i % 6; scene.tower = false; inFight = false; mon = null; titleText = null; hudDom();
  hero.max = hero.hp = boss ? 3 : 4; hero.shown = hero.hp; hero.x = HEROX; hero.y = GY; hero.ox = 0; hero.dead = 0; hero.sword = -.6; hero.hop = 0; scene.guild = false; if (intro) guest = null;
  if (intro) {
    await guildScene(i, l, boss);
    scene.guild = false; scene.theme = boss ? 6 : i % 6; hero.y = GY; hero.x = HEROX; hero.state = 'run'; scene.speed = 2.4; hudDom();
    ui(`<div class="card dlg pop"><b>Climbing…</b><p class="mut">${boss ? 'The summit' : 'Floor ' + (i + 1) + ' of ' + LV.length}</p></div>`);
    tween(fx, { fade: 0 }, 500);
    banner(boss ? 'Boss floor' : 'Floor ' + (i + 1), l.title, 1700); await wait(1700);
    scene.speed = 0; hero.state = 'idle';
  } else { hero.state = 'idle'; scene.speed = 0; fx.fade = 0; }
  const sc = l.story && !G.party.includes(l.story.ally) ? l.story : null;
  if (intro && sc) stageGuest(sc);
  await spawn(l);
  if (intro && sc) await storyPre(sc);
  if (intro && boss) await bossRally();
  inFight = true; banner(boss ? 'Boss' : 'Encounter', mon.name, 1200); await wait(900);
  const r = await fight(l, i, boss);
  if (r !== 'dead' && sc) await storyPost(sc);
  if (r !== 'dead' && !boss && i === LV.length - 2 && LV[LV.length - 1].game === 'boss' && live().length && !G.down) await fallScene();
  return r;
}
function cleared(i, r) {
  const acc = r.right / (r.right + r.wrong), stars = acc >= .85 ? 3 : acc >= .6 ? 2 : 1, bonus = stars * 25;
  G.xp += bonus; G.stats[i] = { title: LV[i].title, right: r.right, wrong: r.wrong }; G.lvl = i + 1; G.streak = G.streak; save(); hudDom();
  const last = G.lvl >= LV.length;
  return new Promise(res => {
    ui(`<div class="card pop"><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div><h1 style="text-align:center">${LV[i].game === 'boss' ? 'Boss defeated!' : 'Floor cleared!'}</h1><p style="text-align:center">${Math.round(acc * 100)}% accuracy · +${bonus} XP · Codex ${Object.keys(G.codex).length}</p><div class="dots">${LV.map((_, k) => `<i class="${k <= i ? 'd' : ''}"></i>`).join('')}</div><button class="btn" id="go">${last ? 'Report to the Grandmaster' : 'Return to the guild'}</button></div>`);
    $('#go').onclick = () => res();
  });
}
async function run(from) {
  for (let i = from; i < LV.length; i++) { let r, first = true; do { r = await floor(i, first); first = false; } while (r === 'dead'); await cleared(i, r); }
  await epilogue();
  report();
}
function report() {
  inFight = false; mon = null; scene.theme = 6; scene.speed = 0; hero.state = 'idle'; hudDom(); heroCheer(); sfx.win();
  for (let k = 0; k < 6; k++) setTimeout(() => burst(rnd(40, 280), rnd(30, 90), ['#ffc857', '#59c8ff', '#ff6bd6', '#2fd38a'][k % 4], 18, 3), k * 220 * TS);
  const st = G.stats.filter(Boolean), R = st.reduce((a, s) => a + s.right, 0), Wr = st.reduce((a, s) => a + s.wrong, 0), acc = Math.round(100 * R / Math.max(1, R + Wr));
  const weak = Object.values(G.missed).sort((a, b) => b.n - a.n);
  const sheet = `${S.title}: review sheet\n\n` + (weak.length ? weak.map((m, k) => `${k + 1}. ${m.text}\n   → ${m.explain || ''}${m.slide ? ` (Slide ${m.slide})` : ''}`).join('\n\n') : 'Nothing missed. Flawless.');
  ui(`<div class="card pop"><span class="badge">Tower cleared</span><h1>${acc >= 85 ? '🏆 Mastered' : acc >= 60 ? '👍 Solid' : '📚 Keep climbing'}</h1><p>${rank()}-Rank ${rankName()} · Lv ${heroLv()} · ⚡ ${G.xp} XP · ${acc}% accuracy · Codex ${Object.keys(G.codex).length} · ${weak.length} to review</p>${st.map(s => { const p = Math.round(100 * s.right / (s.right + s.wrong)); return `<div class="lv"><span>${esc(s.title)}</span><span>${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div>`; }).join('')}</div>
  <div class="card"><h2>Review these</h2>${weak.length ? weak.map(m => `<div class="entry weak"><b>${esc(m.text)}</b><br>${esc(m.explain)} ${slideBtn(m.slide)}<br><span class="mut">missed ${m.n}×</span></div>`).join('') : '<p>Nothing missed. Flawless.</p>'}<button class="btn ghost" id="cp">Copy review sheet</button></div><button class="btn" id="re">Play again</button>`);
  $('#cp').onclick = () => { try { navigator.clipboard.writeText(sheet); $('#cp').textContent = 'Copied ✓'; } catch (e) { $('#cp').textContent = 'Copy failed'; } };
  $('#re').onclick = () => { G = fresh(); save(); title(); };
}
function title() {
  inFight = false; mon = null; scene.theme = 0; scene.tower = true; scene.guild = false; hero.y = GY; fx.fade = 0; scene.speed = .4; syncAllies(); hero.state = 'idle'; hero.x = HEROX; hero.dead = 0; hero.ox = 0; hero.sword = -.6; hero.hop = 0; titleText = S.title;
  const saved = G.lvl > 0 && G.lvl < LV.length; hudDom();
  ui(`<div class="card pop"><div class="mut" style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ffc857">THE CARPE DIEM GAMING EXPERIENCE · <i>The Beauty in the Gnarly</i></div><span class="badge">Learning RPG</span><h1>${esc(S.title)}</h1><p>${esc(S.story || 'Climb the tower. Every floor is guarded by monsters that only fall to real knowledge.')}</p><p class="mut">${LV.length} floors · ${LV.reduce((a, l) => a + l.items.length, 0)} challenges</p>${saved ? `<button class="btn" id="go">Continue (Floor ${G.lvl + 1})</button><button class="btn ghost" id="new">Start over</button>` : `<button class="btn" id="go">Enter the tower</button>`}<p class="mut" style="font-size:11px;margin-top:10px">Powered by Kingfahd Pappoe</p></div>`);
  const begin = from => { titleText = null; scene.tower = false; scene.speed = 0; run(from); };
  $('#go').onclick = () => begin(saved ? G.lvl : 0);
  if ($('#new')) $('#new').onclick = () => { G = fresh(); save(); syncAllies(); begin(0); };
}
if (/debug/.test(location.hash)) window.__dbg = { hero, scene, LV, G: () => G, get mon() { return mon; }, monAttack, spawn, enrage, set inFight(v) { inFight = v; } };
title();
})();
