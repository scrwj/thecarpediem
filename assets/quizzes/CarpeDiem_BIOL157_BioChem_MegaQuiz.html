    "#cdCoachCard button.main{background:#d4af37;color:#12161d}" +
    "#cdCoachCard .cArr{position:absolute;width:0;height:0;border:10px solid transparent;pointer-events:none}";
  document.head.appendChild(st);
  var hole = document.createElement("div"); hole.id = "cdCoachHole"; document.body.appendChild(hole);
  var card = document.createElement("div"); card.id = "cdCoachCard"; document.body.appendChild(card);
  var steps = [], i = 0, key = null, onEnd = null;
  function measure(s) {
    var el = s && s.sel ? document.querySelector(s.sel) : null;
    if (!el) return null;
    var r = el.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return null;
    if (r.bottom < 0 || r.top > innerHeight || r.right < 0 || r.left > innerWidth) return null;
    return r;
  }
  function draw() {
    var s = steps[i];
    if (!s) return end();
    if (s.if && !s.if()) { i++; draw(); return; }
    if (s.onEnter) { try { s.onEnter(); } catch (e) {} }
    var r = measure(s);
    card.style.display = "block";
    var last = i === steps.length - 1;
    var dots = steps.map(function (_, k) { return '<span style="opacity:' + (k === i ? 1 : .28) + '">●</span>'; }).join(" ");
    card.innerHTML =
      '<div class="cdots">' + dots + '</div>' +
      '<h4>' + esc(s.t) + '</h4>' +
      '<p>' + s.h + '</p>' +
      '<div class="cbtns"><span class="ct">' + (i + 1) + ' / ' + steps.length + '</span>' +
      (i > 0 ? '<button id="cdPrev">Back</button>' : '<button id="cdSkip">Skip tour</button>') +
      '<button class="main" id="cdNext">' + (last ? "Done" : "Next") + '</button></div>';
    var old = card.querySelector(".cArr"); if (old) old.remove();
    var cw = Math.min(430, innerWidth - 24);
    card.style.width = cw + "px";
    if (!r) {
      hole.classList.add("dim"); hole.style.display = "block";
      card.style.top = "12px"; card.style.transform = "translateX(-50%)";
      return;
    }
    var cw2 = Math.min(430, innerWidth - 24);
    card.style.width = cw2 + "px";
    hole.classList.remove("dim"); hole.style.display = "block";
    hole.style.left = (r.left - 6) + "px"; hole.style.top = (r.top - 6) + "px";
    hole.style.width = (r.width + 12) + "px"; hole.style.height = (r.height + 12) + "px";
    var ch = card.offsetHeight;
    var preferAbove = r.top + r.height / 2 > innerHeight / 2;
    var top;
    if (preferAbove && r.top - ch - 20 >= 8) { top = r.top - ch - 12; }
    else if (r.bottom + 12 + ch <= innerHeight - 8) { top = r.bottom + 12; }
    else if (preferAbove) { top = Math.max(8, innerHeight - ch - 8); }
    else { top = Math.min(r.bottom + 12, innerHeight - ch - 8); }
    top = Math.min(Math.max(top, 8), Math.max(8, innerHeight - ch - 8));
    card.style.top = top + "px";
    card.style.transform = "translateX(-50%)";
    var arr = document.createElement("div"); arr.className = "cArr"; card.appendChild(arr);
    var cardLeft = (innerWidth - cw2) / 2;
    var ax = Math.min(Math.max(r.left + r.width / 2 - cardLeft - 10, 8), cw2 - 28) + "px";
    if (top >= r.bottom) { arr.style.bottom = "100%"; arr.style.borderBottomColor = "#d4af37"; }
    else { arr.style.top = "100%"; arr.style.borderTopColor = "#d4af37"; }
    arr.style.left = ax;
  }
  function end() {
    try { localStorage.setItem("cdcoach:" + (key || "x"), "1"); } catch (e) {}
    hole.style.display = "none"; card.style.display = "none"; try { window.CDCoachActive = false; } catch (e) {}
    var f = onEnd; onEnd = null; if (f) f();
  }
  card.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    if (b.id === "cdNext") { i++; if (i >= steps.length) end(); else draw(); }
    else if (b.id === "cdPrev") { if (i > 0) { i--; draw(); } }
    else if (b.id === "cdSkip") { end(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && card.style.display === "block") end();
  });
  addEventListener("resize", function () { if (card.style.display === "block") draw(); });
  addEventListener("scroll", function () { if (card.style.display === "block") draw(); }, true);
  window.CDCoach = {
    start: function (k, def, cb) { key = k; steps = def.steps; i = 0; onEnd = cb || null; try { window.CDCoachActive = true; } catch (e) {} draw(); },
    maybe: function (k, def, cb) {
      var seen = null; try { seen = localStorage.getItem("cdcoach:" + k); } catch (e) {}
      if (!seen) this.start(k, def, cb);
    },
    stop: end
  };
})();
