ds with oxygen and triple bonds with nitrogen,\nwhile silicon seldom bonds multiply?", "options": ["Small atoms give the strong sigma bond and sideways overlap that pi bonding needs", "Large atoms offer more electrons for pi overlap", "Pi bonds are stronger than sigma bonds, so large atoms favour them", "Silicon has no valence electrons available for bonding"], "correct_index": 0, "explanations": ["Pi bonding needs close, effective overlap between small atoms.", "Larger atoms overlap poorly; more electrons do not fix the distance problem.", "Pi bonds are weaker than sigma bonds.", "Silicon has four valence electrons."], "_es": 4}, {"tag": "b01·Q65", "mid": "b01", "difficulty": "easy", "section": "Major elements", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Which type of bond within organic compounds provides intramolecular stability?", "options": ["Covalent bonds", "Ionic bonds", "Metallic bonds", "Hydrogen bonds"], "correct_index": 0, "explanations": ["Covalent bonds hold the atoms of a molecule together.", "Ionic bonds dominate in salts, not in organic molecules.", "Metallic bonding occurs in metals.", "Hydrogen bonds are intermolecular, so they are not the intramolecular bonds."], "_es": 4}, {"tag": "b01·Q66", "mid": "b01", "difficulty": "medium", "section": "Major elements", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "To which periodic block do most of the six major elements belong?", "options": ["s-block", "p-block", "d-block", "f-block"], "correct_index": 1, "explanations": ["Only hydrogen among the six is in the s-block.", "C, N, O, P and S are p-block elements (H is the exception).", "d-block metals are mostly trace elements.", "f-block elements are absent from living cells."], "_es": 4}, {"tag": "b01·Q67", "mid": "b01", "difficulty": "hard", "section": "Nitrogen", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "What is the effect of repulsion between lone pairs on bonded nitrogen atoms in\nan N–N bond?", "options": ["It strengthens the bond by sharing extra electrons", "It converts the bond into an ionic one", "It raises the bond energy above that of C–C", "It markedly lowers the N–N bond energy"], "correct_index": 3, "explanations": ["Repulsion destabilises the bond; it does not strengthen it.", "Repulsion does not change the bond type to ionic.", "N–N bond energy is lower than C–C, not higher.", "Lone-pair repulsion weakens the bond, so long N chains are unstable."], "_es": 4}, {"tag": "b01·Q68", "mid": "b01", "difficulty": "devil", "section": "Silicon", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Why are alternating Si and O chains essentially inert despite weak Si–Si bonds?", "options": ["Si–O bonds are weak but kinetically protected", "Oxygen makes the chain radioactive and unreactive", "Si–O bonds are very stable, so the chains resist reaction", "Si–O chains are ionic lattices that dissolve instantly"], "correct_index": 2, "explanations": ["The lecture describes Si–O bonds as stable, not weak.", "Silicon–oxygen chains are not radioactive.", "The strong Si–O link makes the chain stable and unreactive.", "The chains are covalently bonded, not instantly soluble ionic lattices."], "_es": 4}, {"tag": "b01·Q69", "mid": "b01", "difficulty": "easy", "section": "Silicon", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Which element lies directly below carbon in group IVA?", "options": ["Nitrogen", "Boron", "Silicon", "Phosphorus"], "correct_index": 2, "explanations": ["Nitrogen lies to the right of carbon in period 2.", "Boron lies to the left of carbon in period 2.", "Silicon is carbon's congener in group IVA.", "Phosphorus is below nitrogen in group VA."], "_es": 4}, {"tag": "b01·Q70", "mid": "b01", "difficulty": "medium", "section": "Trace elements", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Iron sits at the centre of haem. Which description fits iron?", "options": ["A p-block major element found in all organic compounds", "An f-block element absent from cells", "An s-block major element in lipids", "A d-block trace element essential to oxygen transport"], "correct_index": 3, "explanations": ["Iron is a metal and not a major organic building block.", "The f-block elements are not part of cells.", "Iron is not an s-block element.", "Fe²⁺ in haem is a d-block trace element."], "_es": 4}, {"tag": "b01·Q71", "mid": "b01", "difficulty": "hard", "section": "Trace elements", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "A patient in an inland region has goitre due to iodine deficiency. Which\nstatement about iodine is correct?", "options": ["It is one of the six major elements", "It is a trace element needed in tiny amounts yet essential", "It is toxic and always excluded from cells", "It is an f-block element with no role in cells"], "correct_index": 1, "explanations": ["The six major elements are C, H, O, N, P and S.", "Iodine is needed for thyroid hormones despite trace amounts.", "Iodine is essential, not excluded.", "Iodine is a halogen, not an f-block element."], "_es": 4}, {"tag": "b01·Q72", "mid": "b01", "difficulty": "devil", "section": "Origin of elements", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Which statement is NOT supported by the lecture?", "options": ["Most naturally occurring elements formed in the Big Bang", "Supernovae helped create many elements", "Iron is the largest atom formed by ordinary fusion", "Transuranium elements arise from artificial synthesis"], "correct_index": 0, "explanations": ["This is false; only the lightest elements formed in the Big Bang.", "True; huge stellar explosions made many elements.", "True; heavier ones need neutron capture.", "True; elements above 92 are laboratory-made."], "_es": 4}, {"tag": "b01·Q73", "mid": "b01", "difficulty": "easy", "section": "Origin of elements", "qt": "single b est", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "A student says C–C chains are stable because carbon is highly electropositive.\nWhat is wrong?", "options": ["Carbon is a non-metal; stability comes from strong covalent overlap", "Carbon has no stable chains; only silicon does", "Carbon is electropositive but its C–C bonds are ionic", "C–C stability arises from lone-pair repulsion"], "correct_index": 0, "explanations": ["Carbon's small size gives effective orbital overlap and strong covalent C–C bonds.", "Carbon chains are the basis of organic chemistry.", "C–C bonds are covalent between identical atoms.", "Lone-pair repulsion weakens bonds; carbon has no lone pairs in C–C."], "_es": 4}, {"tag": "b01·Q77", "mid": "b01", "difficulty": "easy", "section": "Stellar fusion", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "How many hydrogen atoms combine in a series of steps to create one helium-4\natom?", "options": ["Two", "Four", "Three", "Eight"], "correct_index": 1, "explanations": ["Two hydrogens would give mass 2, not helium-4.", "Four hydrogen atoms make helium-4.", "Three hydrogens cannot give helium-4.", "Eight hydrogens would give mass 8."], "_es": 4}, {"tag": "b01·Q78", "mid": "b01", "difficulty": "medium", "section": "Major elements", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "In the lecture, where are the six major elements mostly found in cells?", "options": ["In the fluids bathing the cell as free ions", "Only inside the nucleus", "Only within the cell membrane lipids", "In the organic compounds of the cell"], "correct_index": 3, "explanations": ["That describes the trace elements, which are mostly inorganic in fluids.", "They occur throughout the cell, not only in the nucleus.", "They also form proteins and nucleic acids, not only lipids.", "They build carbohydrates, lipids, proteins and nucleic acids."], "_es": 4}, {"tag": "b01·Q79", "mid": "b01", "difficulty": "hard", "section": "Stellar fusion", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Three helium-4 nuclei fuse to form carbon-12. What does the product nucleus\ncontain?", "options": ["12 nucleons, including 6 neutrons", "12 nucleons, including 12 neutrons", "4 nucleons, including 2 neutrons", "12 nucleons, including 3 neutrons"], "correct_index": 0, "explanations": ["Carbon-12 has 6 protons and 6 neutrons.", "With 6 protons, 12 neutrons would give mass 18.", "Mass 4 describes a single helium nucleus.", "Three neutrons would give mass 9, not 12."], "_es": 4}, {"tag": "b01·Q80", "mid": "b01", "difficulty": "devil", "section": "Exclusion factors", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Match each element with its exclusion factor: mercury, argon, technetium.", "options": ["Hg inert, Ar toxic, Tc artificial", "Hg artificial, Ar toxic, Tc inert", "Hg toxic, Ar inert, Tc artificial", "Hg toxic, Ar artificial, Tc inert"], "correct_index": 2, "explanations": ["Mercury is not inert and argon is not toxic.", "Mercury is naturally occurring, not artificial.", "Mercury is toxic, argon is a rare gas, and technetium is synthetic.", "Argon occurs naturally in air, and technetium is not inert."], "_es": 4}, {"tag": "b02·Q1", "mid": "b02", "difficulty": "easy", "section": "Ionic bonding", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "What produces an ionic bond?", "options": ["Electrostatic attraction between oppositely charged ions", "Sharing of electron pairs between two atoms", "Attraction between a metal's delocalised electrons and nuclei", "Overlap of half-filled orbitals end to end"], "correct_index": 0, "explanations": ["Ionic bonding follows complete electron transfer and attraction of the ions.", "Sharing electron pairs describes covalent bonding.", "That describes metallic bonding.", "End-to-end orbital overlap describes a sigma covalent bond."], "_es": 4}, {"tag": "b02·Q2", "mid": "b02", "difficulty": "medium", "section": "Ionic bonding", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Above what electronegativity difference does the lecture say a compound will be\nionic?", "options": ["0.4", "3.0", "0.0", "1.7"], "correct_index": 3, "explanations": ["0.4 would classify most polar bonds as ionic.", "3.0 is higher than almost any real pair can reach.", "A difference of zero indicates a nonpolar covalent bond.", "Above 1.7 is ionic; slightly below it is polar covalent."], "_es": 4}, {"tag": "b02·Q3", "mid": "b02", "difficulty": "hard", "section": "Ionic bonding", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Which combination of atomic properties most favours ionic bond formation?", "options": ["High ionisation energy, low electron affinity, low lattice energy", "Low ionisation energy, low electron affinity, low lattice energy", "Low ionisation energy, high electron affinity, high lattice energy", "High ionisation energy, high electron affinity, low lattice energy"], "correct_index": 2, "explanations": ["This combination makes electron transfer costly and unrewarding.", "Low electron affinity means the anion-forming atom resists gaining electrons.", "These three make ΔHf more negative and the compound more stable.", "High ionisation energy makes cation formation costly, and low lattice energy gives little payback."], "_es": 4}, {"tag": "b02·Q4", "mid": "b02", "difficulty": "devil", "section": "Ionic bonding", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Using Na 1.0, Al 1.5, Cl 2.8, O 3.5, P 2.1 and H 2.2, which classification is correct?", "options": ["Na–O polar covalent, Al–Cl ionic, P–H nonpolar covalent", "Na–O ionic, Al–Cl polar covalent, P–H nonpolar covalent", "Na–O ionic, Al–Cl ionic, P–H polar covalent", "Na–O ionic, Al–Cl nonpolar covalent, P–H ionic"], "correct_index": 1, "explanations": ["Na–O has ΔEN 2.5, which exceeds 1.7, so it is ionic.", "ΔEN values are 2.5, 1.3 and 0.1 respectively.", "Al–Cl has ΔEN 1.3, below 1.7, so it is not ionic; P–H is 0.1, so not polar.", "Al–Cl at 1.3 is polar, not nonpolar, and P–H at 0.1 is not ionic."], "_es": 4}, {"tag": "b02·Q5", "mid": "b02", "difficulty": "easy", "section": "Ionic bonding", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "What happens to the electrons when sodium and chlorine form NaCl?", "options": ["Both atoms share one electron pair equally", "Chlorine donates both bonding electrons to sodium", "Sodium and chlorine pool electrons in a delocalised sea", "Sodium loses an electron and chlorine gains it"], "correct_index": 3, "explanations": ["Equal sharing would give a nonpolar covalent bond.", "Chlorine accepts an electron rather than donating.", "A delocalised sea is the model for metals.", "This complete transfer gives Na⁺ and Cl⁻."], "_es": 4}, {"tag": "b02·Q6", "mid": "b02", "difficulty": "medium", "section": "Ionic bonding", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "In the Born–Haber cycle, what does a more negative enthalpy of formation\nindicate?", "options": ["A more stable, more ionic compound", "A less stable and less ionic compound", "A compound that cannot form from its elements", "A purely covalent compound"], "correct_index": 0, "explanations": ["A more negative ΔHf signals greater stability and ionic character.", "Less negative or positive values signal lower stability.", "Negative ΔHf shows formation from the elements is favourable.", "The sign of ΔHf does not mark a compound as covalent."], "_es": 4}, {"tag": "b02·Q7", "mid": "b02", "difficulty": "hard", "section": "Ionic bonding", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Which pair gives the least polar bond using Al 1.5, Cl 2.8, O 3.5, F 4.0, P 2.1 and H\n2.2?", "options": ["Al and Cl, ΔEN 1.3", "O and F, ΔEN 0.5", "P and H, ΔEN 0.1", "Al and F, ΔEN 2.5"], "correct_index": 2, "explanations": ["A differen ol. If coupled to ATP\nhydrolysis (−7.3), what is ΔG for glucose + ATP → G6P + ADP?", "options": ["−10.6 kcal/mol", "−4.0 kcal/mol", "+10.6 kcal/mol", "+4.0 kcal/mol"], "correct_index": 1, "explanations": ["−10.6 adds the magnitudes instead of the signed values.", "+3.3 + (−7.3) = −4.0.", "+10.6 adds the magnitudes and flips the sign.", "+4.0 has the wrong sign, which would make the coupling unfavourable."], "_es": 4}, {"tag": "b03·Q68", "mid": "b03", "difficulty": "devil", "section": "High-energy compounds", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Why can low-energy phosphates not be formed directly from super high-energy\ncompounds like PEP?", "options": ["No enzyme catalyses the direct transfer, so ATP acts as intermediary", "PEP has no phosphate group to donate", "The transfer would be thermodynamically impossible", "Low-energy phosphates are too unstable to form"], "correct_index": 0, "explanations": ["Transfer passes through ATP.", "PEP does contain a transferable phosphate.", "The transfer is favourable; the lack of an enzyme is the barrier.", "Low-energy phosphates are relatively stable."], "_es": 4}, {"tag": "b03·Q69", "mid": "b03", "difficulty": "easy", "section": "High-energy compounds", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Acetyl-CoA and succinyl-CoA belong to which class of energy-rich compounds?", "options": ["Phosphoric acid anhydrides", "Thiol esters", "Enol phosphates", "Guanidinium phosphates"], "correct_index": 1, "explanations": ["Anhydrides include ATP, ADP and pyrophosphate.", "They are thiol esters of coenzyme A.", "Enol phosphates include PEP.", "Guanidinium phosphates include creatine phosphate."], "_es": 4}, {"tag": "b03·Q70", "mid": "b03", "difficulty": "medium", "section": "High-energy compounds", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Which compound is an enol phosphate?", "options": ["Creatine phosphate", "ATP", "Acetyl phosphate", "Phosphoenolpyruvate"], "correct_index": 3, "explanations": ["Creatine phosphate is a guanidinium phosphate.", "ATP is a phosphoric acid anhydride.", "Acetyl phosphate is a mixed acyl phosphate anhydride.", "PEP contains a phosphate on an enol group."], "_es": 4}, {"tag": "b03·Q71", "mid": "b03", "difficulty": "hard", "section": "ATP", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Why does ATP have a high free energy of hydrolysis?", "options": ["Its phosphate bonds are unusually strong, storing energy", "Its products are less stable than ATP itself", "Repulsion among its negative charges strains it, and its products are stabilised", "Hydrolysis forms a tight ion pair that releases heat"], "correct_index": 2, "explanations": ["The key issue is strain, not unusually strong bonds.", "The products are more stable, which is why hydrolysis is favourable.", "Strain relief plus resonance and ionisation stabilise the products.", "The products have little tendency to recombine."], "_es": 4}, {"tag": "b03·Q72", "mid": "b03", "difficulty": "devil", "section": "High-energy compounds", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Why is glucose-6-phosphate a low-energy compound?", "options": ["Its hydrolysis products, glucose and Pi, have little repulsion and can recombine easily", "Its hydrolysis gives two anions that repel each other strongly", "It has more resonance structures than either of its products", "It forms a super high-energy intermediate on hydrolysis"], "correct_index": 0, "explanations": ["There is little strain relief on hydrolysis.", "Two repelling anions describe ATP hydrolysis, not G6P.", "Greater resonance in the products drives ATP's high-energy character.", "G6P does not form a super high-energy intermediate."], "_es": 4}, {"tag": "b03·Q73", "mid": "b03", "difficulty": "easy", "section": "ATP", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Which triphosphate is l of all compounds", "It has the lowest phosphate transfer potential of all compounds", "It accepts phosphate from higher-energy compounds and donates to lower-energy ones", "It cannot transfer its phosphate group to any other molecule"], "correct_index": 2, "explanations": ["PEP and others sit above ATP.", "Compounds like glucose-6-phosphate sit below ATP.", "This makes it the major link in energy metabolism.", "ATP transfers its terminal phosphate in many reactions."], "_es": 4}, {"tag": "b03·Q80", "mid": "b03", "difficulty": "devil", "section": "High-energy compounds", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "A raised serum creatine kinase signals muscle damage. Which compound does\nthis enzyme act on, per the lecture's examples?", "options": ["Phosphocreatine, passing its phosphate to ADP to make ATP", "PEP, converting it to pyruvate and ATP in glycolysis", "Glucose-6-phosphate, releasing free glucose and Pi", "AMP, producing adenosine and inorganic phosphate"], "correct_index": 0, "explanations": ["Phosphocreatine + ADP ⇌ ATP + creatine.", "PEP conversion is catalysed by pyruvate kinase.", "Glucose-6-phosphate is hydrolysed by a phosphatase.", "AMP hydrolysis is a different reaction."], "_es": 4}, {"tag": "b04·Q1", "mid": "b04", "difficulty": "easy", "section": "Rates", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "What does chemical kinetics study?", "options": ["Only the energy released by reactions", "The rates and mechanisms of chemical reactions", "The position of equilibrium in reversible reactions", "The shapes of molecules in a reaction"], "correct_index": 1, "explanations": ["Energy changes belong to thermodynamics.", "Kinetics covers how fast reactions go and the steps they follow.", "Equilibrium position concerns yield, not speed.", "Molecular shape belongs to bonding theory."], "_es": 4}, {"tag": "b04·Q2", "mid": "b04", "difficulty": "medium", "section": "Measuring rates", "qt": "singl ", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "For 2N₂O₅ → 4NO₂ + O₂, which rate relationship is correct?", "options": ["rate = −Δ[N₂O₅]/Δt = Δ[NO₂]/Δt = Δ[O₂]/Δt", "rate = −2Δ[N₂O₅]/Δt = 4Δ[NO₂]/Δt = Δ[O₂]/Δt", "rate = −½Δ[N₂O₅]/Δt = ½Δ[NO₂]/Δt = Δ[O₂]/Δt", "rate = −½Δ[N₂O₅]/Δt = ¼Δ[NO₂]/Δt = Δ[O₂]/Δt"], "correct_index": 3, "explanations": ["This ignores the coefficients entirely.", "This multiplies by coefficients instead of dividing.", "NO₂ should be divided by 4, not 2.", "Each concentration change is divided by its stoichiometric coefficient."], "_es": 4}, {"tag": "b04·Q9", "mid": "b04", "difficulty": "easy", "section": "Rate and stoichiometry", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Why is a minus sign used when the rate is written from a reactant's\nconcentration change?", "options": ["Because reactants are negatively charged", "Because reactant concentration rises with time", "Because the reaction runs backwards", "So that the rate is a positive quantity"], "correct_index": 3, "explanations": ["Charge is unrelated to the sign convention.", "Reactant concentration falls over time.", "The sign does not indicate reversal.", "Δ[reactant] is negative, so the sign gives a positive rate."], "_es": 4}, {"tag": "b04·Q10", "mid": "b04", "difficulty": "medium", "section": "Rate and stoichiometry", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "In 2A → B, A disappears at 0.20 mol L⁻¹ s⁻¹. How fast does B form?", "options": ["0.20 mol L⁻¹ s⁻¹", "0.40 mol L⁻¹ s⁻¹", "0.10 mol L⁻¹ s⁻¹", "0.05 mol L⁻¹ s⁻¹"], "correct_index": 2, "explanations": ["Equal rates would apply only to a 1:1 stoichiometry.", "That doubles instead of halves the rate.", "Two moles of A are lost for each mole of B formed.", "0.05 divides by four rather than two."], "_es": 4}, {"tag": "b04·Q11", "mid": "b04", "difficulty": "hard", "section": "Rate and stoichiometry", "qt": "single best", "source": "BIOL157_Q ctions between ions in\nsolution?", "options": ["Organic reactants are always gases at room temperature and pressure", "Ionic reactants have the higher activation energies of the two types", "Covalent bonds must break and intermediates form, giving higher activation energies", "Organic molecules are always completely unreactive in any conditions"], "correct_index": 2, "explanations": ["Organic reactants can be solids, liquids or gases.", "Ionic reactions are generally faster, so their Ea is lower.", "Ions in solution are already free to combine quickly.", "Organic molecules do react, only more slowly."], "_es": 4}, {"tag": "b04·Q15", "mid": "b04", "difficulty": "hard", "section": "Factors affecting rate", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Why do aldehydes react faster than ketones in nucleophilic addition?", "options": ["Aldehydes have bulkier groups that speed up attack", "Ketones are ionic and aldehydes are covalent", "Aldehydes are larger molecules with more surface area", "Ketones have bulkier groups that hinder access to the reactive carbon"], "correct_index": 3, "explanations": ["Bulky groups slow reaction; they do not speed it.", "Both are covalent organic compounds.", "Molecular size does not explain the faster aldehyde rate.", "Steric hindrance slows the ketone reaction."], "_es": 4}, {"tag": "b04·Q16", "mid": "b04", "difficulty": "devil", "section": "Factors affecting rate", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Which application–rate pairing is correct?", "options": ["Blood is stored at 0–4 °C to slow decomposition", "Refrigeration speeds up microbial spoilage", "Autoclaving uses low pressure to slow sterilisation", "Surgical cooling raises the metabolic rate"], "correct_index": 0, "explanations": ["Low temperature slows chemical and biological change.", "Refrigeration is used to slow spoilage.", "Autoclaves use high pressure to increase the sterilisation rate.", "Cooling lowers metabolic rate, which is its surgical purpose."], "_es": 4}, {"tag": "b04·Q17", "mid": "b04", "difficulty": "easy", "section": "Rates", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "What is the initial rate of a reaction?", "options": ["The average rate over the whole reaction", "The rate when equilibrium is reached", "The rate when half the reactant is gone", "The instantaneous rate at zero time, t = 0"], "correct_index": 3, "explanations": ["The average rate covers an interval, not an instant.", "At equilibrium net rate is zero.", "That moment relates to half-life, not initial rate.", "It is the gradient of the tangent at t = 0."], "_es": 4}, {"tag": "b04·Q18", "mid": "b04", "difficulty": "medium", "section": "Rates", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "How is an instantaneous rate found from a concentration–time graph?", "options": ["From the area under the curve", "From the gradient of the tangent at that time", "From the average of the first and last points", "From the intercept on the time axis"], "correct_index": 1, "explanations": ["Area under the curve is not the rate.", "The gradient gives the rate at that instant.", "Averaging end points gives an average rate over the interval.", "The intercept does not give a rate."], "_es": 4}, {"tag": "b04·Q19", "mid": "b04", "difficulty": "hard", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "A plot of rate against [Br₂] is a straight line through the origin. What does it\nshow?", "options": ["The reaction is zero order in bromine", "The reaction is second order in bromine", "The reaction is first order in bromine", "The reaction is at equilibrium"], "correct_index": 2, "explanations": ["Zero order would give a horizontal line.", "Second order would give a curve, not a straight line.", "Rate ∝ [Br₂]¹.", "Equilibrium would mean zero net rate."], "_es": 4}, {"tag": "b04·Q20", "mid": "b04", "difficulty": "devil", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Why was formic acid kept at a high, nearly constant concentration in the\nbromine study?", "options": ["So the rate effectively depends on bromine concentration alone", "So bromine turns colourless faster than it otherwise would", "So formic acid can act as the indicator for the reaction", "So that equilibrium is reached very quickly in the vessel"], "correct_index": 0, "explanations": ["The acid's concentration then barely changes.", "The aim is to simplify the rate law, not speed the colour change.", "Formic acid is a reactant, not an indicator.", "The reaction is not driven toward equilibrium in this setup."], "_es": 4}, {"tag": "b04·Q21", "mid": "b04", "difficulty": "easy", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "How is the exponent x in rate = k[A]ˣ determined?", "options": ["From the coefficient in the balanced equation", "Experimentally, from measured rate data", "From the molar mass of A", "From the enthalpy change of the reaction"], "correct_index": 1, "explanations": ["Coefficients do not necessarily equal the order.", "The value of x must be found from experimental data.", "Molar mass has no bearing on the order.", "Enthalpy gives the energy change, not the rate dependence."], "_es": 4}, {"tag": "b04·Q22", "mid": "b04", "difficulty": "medium", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "What is the exponent x in rate = k[A]ˣ called?", "options": ["The order of the reaction with respect to A", "The molecularity of the reaction", "The activation energy of A", "The half-life of A"], "correct_index": 0, "explanations": ["It is the order with respect to that reactant.", "Molecularity is the number of molecules in an elementary step.", "Activation energy is a separate energy quantity.", "Half-life is a time, not an exponent."], "_es": 4}, {"tag": "b04·Q23", "mid": "b04", "difficulty": "hard", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "N₂O₅ has a coefficient of 2 in its decomposition but is first order. What does this\nshow?", "options": ["Order always equals the stoichiometric coefficient", "The equation must have been balanced incorrectly", "N₂O₅ acts as a catalyst in this reaction", "Order is found by experiment and need not equal the coefficient"], "correct_index": 3, "explanations": ["This case is a counter-example to that claim.", "The equation is balanced; order and coefficient are unrelated.", "N₂O₅ is a reactant, not a catalyst.", "The exponent in the rate law is empirical."], "_es": 4}, {"tag": "b04·Q24", "mid": "b04", "difficulty": "devil", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "In the 2NO + 2H₂ → N₂ + 2H₂O data, doubling [H₂] doubles the rate and doubling\n[NO] quadruples it. What is the rate law?", "options": ["rate = k[NO][H₂]²", "rate = k[NO][H₂]", "rate = k[NO]²[H₂]", "rate = k[NO]²[H₂]²"], "correct_index": 2, "explanations": ["The exponents are swapped.", "Doubling [NO] would then only double the rate.", "Second order in NO and first order in H₂.", "Doubling [H₂] would then quadruple the rate."], "_es": 4}, {"tag": "b04·Q25", "mid": "b04", "difficulty": "easy", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "In rate = k[A]ˣ, what is k?", "options": ["The rate constant, a proportionality constant", "The Boltzmann constant from statistical entropy", "The order of the reaction with respect to A", "The molar concentration of reactant A"], "correct_index": 0, "explanations": ["It converts the proportionality into an equation.", "The Boltzmann constant appears in S = k ln W.", "The order is the exponent x.", "[A] is the concentration itself."], "_es": 4}, {"tag": "b04·Q26", "mid": "b04", "difficulty": "medium", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "What is the overall order of a reaction with rate = k[A]²[B]?", "options": ["Second order", "First order", "Fourth order", "Third order"], "correct_index": 3, "explanations": ["Second order would ignore the exponent of B.", "First order would ignore the exponent of A.", "Fourth order would add an extra unit.", "The exponents sum to 2 + 1 = 3."], "_es": 4}, {"tag": "b04·Q27", "mid": "b04", "difficulty": "hard", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "At 600 s and 3600 s, [N₂O₅] differs by a factor of 4.8 and the rates by 4.9. What\norder does this indicate?", "options": ["Zero order", "Second order", "First order", "Third order"], "correct_index": 2, "explanations": ["Zero order would show no rate change.", "Second order would give a rate ratio near 23.", "Rate changes in direct proportion to concentration.", "Third order would give an even larger ratio."], "_es": 4}, {"tag": "b04·Q28", "mid": "b04", "difficulty": "devil", "section": "First-order kinetics", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "[N₂O₅] falls from 1.8 × 10⁻² M to 9.3 × 10⁻³ M in 1200 s (first order). What is k?", "options": ["1.6 × 10⁻³ s⁻¹", "5.5 × 10⁻⁴ s⁻¹", "5.5 × 10⁻³ s⁻¹", "2.4 × 10⁻⁴ s⁻¹"], "correct_index": 1, "explanations": ["1.6 × 10⁻³ divides the ratio by time without taking ln.", "K = ln(1.8×10⁻²/9.3×10⁻³)/1200 = 0.660/1200.", "5.5 × 10⁻³ is off by a factor of ten.", "2.4 × 10⁻⁴ uses log₁₀ instead of the natural logarithm."], "_es": 4}, {"tag": "b04·Q29", "mid": "b04", "difficulty": "easy", "section": "First-order kinetics", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "What are the units of a first-order rate constant?", "options": ["mol L⁻¹ s⁻¹", "L mol⁻¹ s⁻¹", "s⁻¹", "mol s"], "correct_index": 2, "explanations": ["That is the unit of rate, or of a zero-order constant.", "That is the unit of a second-order constant.", "Rate (mol L⁻¹ s⁻¹) divided by concentration gives s⁻¹.", "mol s has no dimensional basis here."], "_es": 4}, {"tag": "b04·Q30", "mid": "b04", "difficulty": "medium", "section": "First-order kinetics", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "For a first-order reaction with k = 5.7 × 10⁻⁴ s⁻¹ and [N₂O₅] = 1.5 × 10⁻³ M, what\nis the rate?", "options": ["8.6 × 10⁻⁷ mol L⁻¹ s⁻¹", "0.38 mol L⁻¹ s⁻¹", "8.6 × 10⁻⁴ mol L⁻¹ s⁻¹", "2.6 mol L⁻¹ s⁻¹"], "correct_index": 0, "explanations": ["5.7 × 10⁻⁴ × 1.5 × 10⁻³ = 8.55 × 10⁻⁷.", "0.38 divides k by the concentration.", "8.6 × 10⁻⁴ is off by a factor of one thousand.", "2.6 divides the concentration by k."], "_es": 4}, {"tag": "b04·Q31", "mid": "b04", "difficulty": "hard", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "For rate = k[A]², what happens to the rate if [A] is tripled?", "options": ["It increases three-fold", "It increases nine-fold", "It increases six-fold", "It increases twenty-seven-fold"], "correct_index": 1, "explanations": ["Three-fold would apply to first order.", "3² = 9.", "Six-fold has no basis in a second-order law.", "Twenty-seven-fold would apply to third order."], "_es": 4}, {"tag": "b04·Q32", "mid": "b04", "difficulty": "devil", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "From experiment 1 (rate 0.0339 mol L⁻¹ s⁻¹, [NO] 0.210 M, [H₂] 0.122 M), what is\nk for rate = k[NO]²[H₂]?", "options": ["1.32 L² mol⁻² s⁻¹", "6.30 s⁻¹", "6.30 L mol⁻¹ s⁻¹", "6.30 L² mol⁻² s⁻¹"], "correct_index": 3, "explanations": ["1.32 forgets to square [NO].", "A third-order law cannot have s⁻¹ units.", "L mol⁻¹ s⁻¹ is the unit for a second-order constant.", "0.0339 ÷ (0.210² × 0.122) = 6.30, with units L² mol⁻² s⁻¹."], "_es": 4}, {"tag": "b04·Q33", "mid": "b04", "difficulty": "easy", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "What happens to the rate constant if a reactant's concentration is increased at\nconstant temperature?", "options": ["It increases in proportion", "It decreases in proportion", "It becomes zero", "It stays the same"], "correct_index": 3, "explanations": ["Rate rises with concentration, but k does not.", "k does not fall with concentration.", "k remains a constant of the reaction.", "K depends on temperature, not concentration."], "_es": 4}, {"tag": "b04·Q34", "mid": "b04", "difficulty": "medium", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "With [H₂] fixed, tripling [NO] in 2NO + 2H₂ → N₂ + 2H₂O raises the rate by what\nfactor?", "options": ["9", "3", "6", "27"], "correct_index": 0, "explanations": ["The reaction is second order in NO.", "A factor of 3 would apply to first order.", "A factor of 6 does not match any simple order.", "A factor of 27 would apply to third order."], "_es": 4}, {"tag": "b04·Q35", "mid": "b04", "difficulty": "hard", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Which statement about reaction orders is correct?", "options": ["Orders must be positive whole numbers", "Orders can be fractional, zero or even negative", "Orders always equal the stoichiometric coefficients", "Only first and second orders exist"], "correct_index": 1, "explanations": ["The lecture states that other types of order are possible.", "Third, fractional, zero and negative orders also occur.", "Coefficients and orders can differ.", "Third-order reactions, though rare, do exist."], "_es": 4}, {"tag": "b04·Q36", "mid": "b04", "difficulty": "devil", "section": "First-order kinetics", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Which plot of first-order data gives a straight line, and what is its slope?", "options": ["[A] against t, slope −k", "1/[A] against t, slope k", "ln[A] against t, slope −k", "ln[A] against 1/t, slope −k"], "correct_index": 2, "explanations": ["[A] against t is curved for first-order decay.", "1/[A] against t is linear for second-order reactions.", "Ln[A] = ln[A]₀ − kt.", "ln[A] against 1/t has no meaning for the integrated rate law."], "_es": 4}, {"tag": "b04·Q37", "mid": "b04", "difficulty": "easy", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "For a first-order reaction, what happens to the rate when [A] is doubled?", "options": ["It stays the same", "It quadruples", "It doubles", "It halves"], "correct_index": 2, "explanations": ["No change would indicate zero order.", "Quadrupling would indicate second order.", "Rate is directly proportional to [A].", "Halving contradicts direct proportionality."], "_es": 4}, {"tag": "b04·Q38", "mid": "b04", "difficulty": "medium", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "If a reaction is zero order in A, how does its rate depend on A?", "options": ["It does not depend on the concentration of A", "It is directly proportional to [A]", "It is proportional to [A]²", "It is inversely proportional to [A]"], "correct_index": 0, "explanations": ["[A]⁰ = 1, so A drops out of the rate law.", "That describes first order.", "That describes second order.", "That would be a negative order."], "_es": 4}, {"tag": "b04·Q39", "mid": "b04", "difficulty": "hard", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "For rate = k[A][B]², what happens to the rate if both [A] and [B] are doubled?", "options": ["It increases four-fold", "It increases eight-fold", "It increases six-fold", "It increases sixteen-fold"], "correct_index": 1, "explanations": ["Four-fold would apply to a second-order total.", "2¹ × 2² = 8.", "Six-fold does not follow from the exponents.", "Sixteen-fold would apply to a fourth-order total."], "_es": 4}, {"tag": "b04·Q40", "mid": "b04", "difficulty": "devil", "section": "Rate laws", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Doubling [X] doubles the rate, doubling [Y] has no effect, and tripling [Z] makes\nthe rate nine times larger. What is the rate law?", "options": ["rate = k[X][Y][Z]²", "rate = k[X][Z]³", "rate = k[Y][Z]²", "rate = k[X][Z]²"], "correct_index": 3, "explanations": ["Y is zero order, so it does not appear.", "Tripling Z with a cube would give 27, not 9.", "X must appear because doubling it doubles the rate.", "First order in X, zero order in Y, second order in Z."], "_es": 4}, {"tag": "b04·Q41", "mid": "b04", "difficulty": "easy", "section": "Half-life", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "What is the half-life of a first-order reaction?", "options": ["The time for the reaction to go fully to completion", "The time for the reactant to fall to half its original concentration", "The time for the rate constant itself to halve", "The time taken for the amount of products to double"], "correct_index": 1, "explanations": ["First-order reactions never strictly reach completion.", "T½ is the time for [A] to drop to ½[A]₀.", "The rate constant stays constant at fixed temperature.", "Product doubling is not the definition of half-life."], "_es": 4}, {"tag": "b04·Q42", "mid": "b04", "difficulty": "medium", "section": "Half-life", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Which relationship links half-life and rate constant for a first-order reaction?", "options": ["t½ = k/0.693", "t½ = 0.693 × k", "t½ = 1/(k[A]₀)", "t½ = 0.693/k"], "correct_index": 3, "explanations": ["This inverts the relationship.", "The half-life falls as k rises, so they are not multiplied.", "1/(k[A]₀) is the second-order half-life.", "From ln 2 = k t½."], "_es": 4}, {"tag": "b04·Q43", "mid": "b04", "difficulty": "hard", "section": "Half-life", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "A first-order reaction has t½ = 2.40 h. What is k?", "options": ["0.289 h⁻¹", "3.46 h⁻¹", "1.66 h⁻¹", "0.601 h⁻¹"], "correct_index": 0, "explanations": ["K = 0.693 ÷ 2.40.", "3.46 divides t½ by 0.693 instead of the reverse.", "1.66 multiplies 0.693 by 2.40.", "0.601 comes from 1 ÷ (0.693 × 2.40)."], "_es": 4}, {"tag": "b04·Q44", "mid": "b04", "difficulty": "devil", "section": "Half-life", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Starting with 2.00 g of N₂O₅ (t½ = 2.40 h), how much remains after 9.60 h?", "options": ["0.250 g", "0.500 g", "0.125 g", "0.0625 g"], "correct_index": 2, "explanations": ["0.250 g corresponds to three half-lives.", "0.500 g corresponds to two half-lives.", "9.60 h is four half-lives: 2.00 ÷ 16.", "0.0625 g corresponds to five half-lives."], "_es": 4}, {"tag": "b04·Q45", "mid": "b04", "difficulty": "easy", "section": "Half-life", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "What fraction of a first-order reactant remains after two half-lives?", "options": ["One half", "One quarter", "One eighth", "None"], "correct_index": 1, "explanations": ["One half remains after a single half-life.", "½ × ½ = ¼.", "One eighth remains after three half-lives.", "First-order decay never reaches exactly zero."], "_es": 4}, {"tag": "b04·Q46", "mid": "b04", "difficulty": "medium", "section": "First-order kinetics", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Which is the integrated first-order rate equation?", "options": ["ln([A]ₜ/[A]₀) = kt", "[A]ₜ = [A]₀ + kt", "ln([A]₀/[A]ₜ) = kt", "1/[A]ₜ = 1/[A]₀ + kt"], "correct_index": 2, "explanations": ["This has the wrong sign for decay.", "A linear drop in [A] describes zero order.", "It applies to first-order reactions only.", "This is the second-order integrated law."], "_es": 4}, {"tag": "b04·Q47", "mid": "b04", "difficulty": "hard", "section": "Half-life", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "How long does 0.0180 M N₂O₅ take to fall to 0.0100 M if t½ = 2.40 h?", "options": ["About 0.170 h", "About 0.884 h", "About 2.40 h", "About 2.04 h"], "correct_index": 3, "explanations": ["0.170 h multiplies by k instead of dividing.", "0.884 h uses log₁₀ instead of ln.", "2.40 h would only halve the concentration to 0.0090 M.", "T = ln(1.80)/0.289 ≈ 2.04 h."], "_es": 4}, {"tag": "b04·Q48", "mid": "b04", "difficulty": "devil", "section": "Half-life", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "About how many half-lives does a first-order reaction need to be roughly 99%\ncomplete?", "options": ["About 6.6", "About 2", "About 10", "About 3.3"], "correct_index": 0, "explanations": ["(½)ⁿ = 0.01 gives n ≈ 6.64.", "Two half-lives give 75% completion.", "Ten half-lives would leave about 0.1%.", "3.3 half-lives give about 90% completion."], "_es": 4}, {"tag": "b04·Q49", "mid": "b04", "difficulty": "easy", "section": "Radiocarbon dating", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Who developed the radiocarbon dating technique?", "options": ["W. F. Libby", "John Dalton", "Svante Arrhenius", "Gilbert Lewis"], "correct_index": 0, "explanations": ["Libby won a Nobel prize for it in 1960.", "Dalton proposed an atomic theory.", "Arrhenius is linked to the temperature-dependence equation.", "Lewis is linked to the octet rule."], "_es": 4}, {"tag": "b04·Q50", "mid": "b04", "difficulty": "medium", "section": "Radiocarbon dating", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "What is the half-life of ¹⁴C?", "options": ["About 573 years", "About 57 300 years", "About 5730 years", "About 5.73 million years"], "correct_index": 2, "explanations": ["That is ten times too short.", "That is ten times too long.", "Roughly 5730 years.", "That is a thousand times too long."], "_es": 4}, {"tag": "b04·Q51", "mid": "b04", "difficulty": "hard", "section": "Radiocarbon dating", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "How is ¹⁴C produced in the atmosphere?", "options": ["¹⁴N emits a β particle to give ¹⁴C", "¹²C captures two neutrons directly from sunlight", "¹⁶O loses two protons by radioactive decay", "¹⁴N captures a neutron, giving ¹⁴C and a proton"], "correct_index": 3, "explanations": ["β emission converts ¹⁴C into ¹⁴N, the reverse direction.", "Sunlight does not supply neutrons for this reaction.", "Oxygen-16 does not lose protons to form ¹⁴C.", "Cosmic-ray neutrons convert nitrogen-14 into carbon-14."], "_es": 4}, {"tag": "b04·Q52", "mid": "b04", "difficulty": "devil", "section": "Radiocarbon dating", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "An artefact has 12.5% of its original ¹⁴C (t½ = 5730 y). About how old is it?", "options": ["About 11 460 years", "About 17 190 years", "About 5730 years", "About 22 920 years"], "correct_index": 1, "explanations": ["11 460 years corresponds to 25% remaining.", "12.5% = ⅛ means three half-lives.", "5730 years corresponds to 50% remaining.", "22 920 years corresponds to four half-lives, 6.25%."], "_es": 4}, {"tag": "b04·Q53", "mid": "b04", "difficulty": "easy", "section": "Radiocarbon dating", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "After a plant or animal dies, what happens to its ¹⁴C:¹²C ratio?", "options": ["It increases", "It stays constant", "It becomes equal to the atmosphere's", "It decreases"], "correct_index": 3, "explanations": ["Nothing adds ¹⁴C after death.", "Decay continues, so the ratio cannot stay constant.", "Living tissues match the atmosphere; dead tissue falls below it.", "¹⁴C decays and is no longer replaced."], "_es": 4}, {"tag": "b04·Q54", "mid": "b04", "difficulty": "medium", "section": "Radiocarbon dating", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Which is an assumption made in ¹⁴C dating?", "options": ["Atmospheric ¹⁴C has risen steadily over thousands of years", "Decay rates are constant regardless of temperature and pressure", "Living organisms never exchange carbon with the air", "¹⁴C is concentrated at the poles"], "correct_index": 1, "explanations": ["The method assumes a roughly steady level, not a rising one.", "Decay rates are treated as constant.", "Living organisms continually take in carbon.", "The method assumes uniform global distribution."], "_es": 4}, {"tag": "b04·Q55", "mid": "b04", "difficulty": "hard", "section": "Radiocarbon dating", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "Why is radiocarbon dating unreliable for objects older than about 25 000 years?", "options": ["β emission becomes so weak that background radiation interferes", "¹⁴C decays too quickly to be detected at all", "Old objects absorb extra ¹⁴C from soil", "The half-life of ¹⁴C changes with sample age"], "correct_index": 0, "explanations": ["The signal is lost among background radiation.", "¹⁴C has a long half-life, not a very short one.", "Dead material does not take up ¹⁴C from soil in this way.", "Half-life is constant and independent of age."], "_es": 4}, {"tag": "b04·Q56", "mid": "b04", "difficulty": "devil", "section": "Radiocarbon dating", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "A sample's ¹⁴C:¹²C ratio is one quarter of the atmospheric ratio. About how old is\nit?", "options": ["About 5730 years", "About 22 920 years", "About 11 460 years", "About 17 190 years"], "correct_index": 2, "explanations": ["5730 years would leave one half of the ratio.", "22 920 years would leave one sixteenth.", "One quarter corresponds to two half-lives.", "17 190 years would leave one eighth."], "_es": 4}, {"tag": "b04·Q57", "mid": "b04", "difficulty": "easy", "section": "Radiocarbon dating", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "By what type of decay does ¹⁴C become ¹⁴N?", "options": ["Alpha emission", "Gamma emission only", "Positron emission", "Beta emission"], "correct_index": 3, "explanations": ["Alpha emission would reduce the mass number by four.", "Gamma emission does not change the element.", "Positron emission would lower the atomic number, not raise it.", "A neutron converts to a proton, emitting a β particle."], "_es": 4}, {"tag": "b04·Q58", "mid": "b04", "difficulty": "medium", "section": "Half-life", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "For a first-order reaction, what is the product k × t½?", "options": ["1", "2.303", "0.693", "k²"], "correct_index": 2, "explanations": ["The product is not unity.", "2.303 is the ln 10 conversion factor.", "Ln 2 = 0.693 is constant for first-order processes.", "k² has no such meaning here."], "_es": 4}, {"tag": "b04·Q59", "mid": "b04", "difficulty": "hard", "section": "Half-life", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "A first-order reaction is 75% complete after 40 minutes. What is its half-life?", "options": ["20 minutes", "40 minutes", "10 minutes", "13.3 minutes"], "correct_index": 0, "explanations": ["75% complete is two half-lives.", "40 minutes would be the half-life only if 50% were complete.", "10 minutes would imply four half-lives in 40 minutes.", "13.3 minutes would imply three half-lives."], "_es": 4}, {"tag": "b04·Q60", "mid": "b04", "difficulty": "devil", "section": "First-order kinetics", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "With k = 5.7 × 10⁻⁴ s⁻¹, how long for 1.8 × 10⁻² M N₂O₅ to fall to 4.5 × 10⁻³ M?", "options": ["About 1.2 × 10³ s", "About 2.4 × 10³ s", "About 4.9 × 10³ s", "About 2.4 × 10⁻³ s"], "correct_index": 1, "explanations": ["1.2 × 10³ s is only one half-life.", "Two half-lives, 2 × 0.693/5.7×10⁻⁴.", "4.9 × 10³ s would be four half-lives.", "2.4 × 10⁻³ s results from inverting the equation."], "_es": 4}, {"tag": "b04·Q61", "mid": "b04", "difficulty": "easy", "section": "Temperature and Arrhenius", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "By what factor does the rate of a reaction roughly change for a 10 °C rise, per\nthe lecture's rule of thumb?", "options": ["It approximately doubles", "It approximately halves", "It increases tenfold", "It is unchanged"], "correct_index": 0, "explanations": ["Rates roughly double per 10 °C rise.", "A temperature rise increases the rate rather than lowering it.", "Tenfold is far greater than the rule of thumb.", "Rates are temperature dependent."], "_es": 4}, {"tag": "b04·Q62", "mid": "b04", "difficulty": "medium", "section": "Temperature and Arrhenius", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "In k = Ae^(−Ea/RT), what does A represent?", "options": ["The activation energy of the reaction", "The frequency factor, related to collision frequency", "The gas constant in energy units", "The absolute temperature in kelvin"], "correct_index": 1, "explanations": ["Activation energy is Ea.", "A reflects how often reactant molecules collide.", "The gas constant is R.", "Absolute temperature is T."], "_es": 4}, {"tag": "b04·Q63", "mid": "b04", "difficulty": "hard", "section": "Temperature and Arrhenius", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "With Ea = 75 kJ/mol, by what factor does k rise from 27 °C to 37 °C?", "options": ["About 10-fold", "About 1.3-fold", "About 2.6-fold", "About 26-fold"], "correct_index": 2, "explanations": ["Tenfold is much larger than a 10 °C rise gives here.", "1.3-fold would underestimate the effect.", "Ln(k₂/k₁) = (75 000/8.314)(1/300 − 1/310) ≈ 0.97.", "26-fold is off by a factor of ten."], "_es": 4}, {"tag": "b04·Q64", "mid": "b04", "difficulty": "devil", "section": "Temperature and Arrhenius", "qt": "single best", "source": "BIOL157_Question_Bank_400_MCQs.pdf", "qc": "A plot of ln k against 1/T has slope −9000 K. What is Ea?", "options": ["About 9.0 kJ/mol", "About 748 kJ/mol", "About 1.08 kJ/mol", ", "qc": "How does transition state theory differ from collision theory in emphasis?", "options": ["It emphasises the kinetic energy of the products only", "It ignores the activated complex altogether", "It stresses the potential energy of the transition state", "It gives an exact numerical value of Ea for each step"], "correct_index": 2, "explanations": ["The emphasis is not on product kinetic energy.", "The activated complex is central to the theory.", "It describes the activated complex in terms of bonding and structure.", "It gives no quantitative measure of Ea."], "_es": 4}, {"tag": "b09·Q36", "mid": "b09", "difficulty": "devil", "section": "Transition state", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "In A + BC → AB + C, at which step are old bonds partly broken and new bonds\npartly formed?", "options": ["Step I, as the reactants approach", "Step II, the transition state", "Step III, as products separate", "None, because bonds break completely first"], "correct_index": 1, "explanations": ["Step I involves approach and repulsion.", "It is the unstable arrangement between reactants and products.", "Step III involves product separation.", "The transition state has bonds partly broken, not fully broken."], "_es": 4}, {"tag": "b09·Q37", "mid": "b09", "difficulty": "easy", "section": "Mechanism", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "How many intermediates and transition states does a two-step reaction profile\nhave?", "options": ["Two intermediates and one transition state", "Two intermediates and two transition states", "One intermediate and two transition states", "One intermediate and one transition state"], "correct_index": 2, "explanations": ["The counts are reversed.", "There is only one minimum between the steps.", "TS1, an intermediate minimum, then TS2.", "Each step has its own transition state."], "_es": 4}, {"tag": "b09·Q38", "mid": "b09", "difficulty": "medium", "sec ", "section": "Reversible reactions", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "Why is the dissociation of HCl in water described as essentially irreversible?", "options": ["It dissociates almost completely in water", "It does not dissociate at all", "It forms an equal mixture of HCl and ions", "It only dissociates when heated"], "correct_index": 0, "explanations": ["HCl is a strong acid.", "HCl does dissociate in water.", "An equal mixture would be a reversible equilibrium.", "It dissociates in water without heating."], "_es": 4}, {"tag": "b10·Q2", "mid": "b10", "difficulty": "medium", "section": "Reversible reactions", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "Which equation shows the equilibrium of ethanoic acid in water?", "options": ["CH₃COOH + H₂O → CH₃COO⁻ + H₃O⁺ (complete)", "CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺", "CH₃COOH ⇌ CH₃ + COOH", "CH₃COOH + H₂O ⇌ CH₃OH + CO₂"], "correct_index": 1, "explanations": ["A complete arrow would suggest strong-acid behaviour.", "A weak acid dissociates only slightly.", "Ethanoic acid does not split into those fragments.", "That is not the dissociation reaction."], "_es": 4}, {"tag": "b10·Q3", "mid": "b10", "difficulty": "hard", "section": "Reversible reactions", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "Starting with only ethanol and ethanoic acid, how does the backward rate change\nwith time?", "options": ["It starts high and then falls steadily to zero", "It stays constant throughout the whole reaction", "It starts at zero and rises until it equals the forward rate", "It always exceeds the forward rate at equilibrium"], "correct_index": 2, "explanations": ["No products exist at the start, so the backward rate begins at zero.", "The backward rate depends on product concentrations, which change.", "Equilibrium is reached when the rates match.", "At equilibrium the rates are equal, not unequal."], "_es": 4}, {"tag": "b10·Q4", "mid": "b10", "difficulty": "devil", "section": "Equilibrium constant", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "At equilibrium, [N₂] = 0.50 M, [H₂] = 0.20 M and [NH₃] = 0.10 M. What is Kc for N₂\n+ 3H₂ ⇌ 2NH₃?", "options": ["0.40", "25", "0.025", "2.5"], "correct_index": 3, "explanations": ["0.40 is the inverse of the correct ratio.", "25 results from an arithmetic slip of a factor of ten.", "0.025 forgets to cube [H₂].", "0.10²/(0.50 × 0.20³) = 0.010/0.0040."], "_es": 4}, {"tag": "b10·Q5", "mid": "b10", "difficulty": "easy", "section": "Equilibrium constant", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "In Kc = [C]ᶜ[D]ᵈ/[A]ᵃ[B]ᵇ, what do a, b, c and d represent?", "options": ["The orders of the reaction", "The molar masses of the species", "The coefficients in the balanced equation", "The numbers of atoms in each molecule"], "correct_index": 2, "explanations": ["Orders are not used in the Kc expression.", "Molar masses do not appear.", "They appear as exponents.", "Coefficients, not atom counts, are used."], "_es": 4}, {"tag": "b10·Q6", "mid": "b10", "difficulty": "medium", "section": "Kp and Kc", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "Which is the correct Kp expression for N₂O₄(g) ⇌ 2NO₂(g)?", "options": ["Kp = P(NO₂)²/P(N₂O₄)", "Kp = P(NO₂)/P(N₂O₄)²", "Kp = P(N₂O₄)/P(NO₂)²", "Kp = 2P(NO₂)/P(N₂O₄)"], "correct_index": 0, "explanations": ["Products over reactants with coefficient exponents.", "The exponent is on the wrong species.", "This is the reciprocal arrangement.", "Coefficients are exponents, not multipliers."], "_es": 4}, {"tag": "b10·Q7", "mid": "b10", "difficulty": "hard", "section": "Kp and Kc", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "Why does substituting P = MRT lead to Kp = Kc(RT)^Δn?", "options": ["Each concentration equals pressure × RT, so RT cancels completely" idpoint corresponds to K near 1.", "Equilibrium is dynamic; the reaction has not stopped."], "_es": 4}, {"tag": "b10·Q11", "mid": "b10", "difficulty": "hard", "section": "Equilibrium constant", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "For A ⇌ B with K = 1 and 2.0 M A initially (no B), what are [A] and [B] at\nequilibrium?", "options": ["1.0 M of A and 1.0 M of B", "2.0 M A and 0 M B", "0.5 M A and 1.5 M B", "1.5 M A and 0.5 M B"], "correct_index": 0, "explanations": ["K = 1 requires equal concentrations of A and B.", "That is the starting state, not equilibrium.", "These values give K = 3.", "These values give K = 0.33."], "_es": 4}, {"tag": "b10·Q12", "mid": "b10", "difficulty": "devil", "section": "Reaction quotient", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "A mixture has 0.50 M ethanol, 0.50 M ethanoic acid, 1.0 M ester and 1.0 M water\nwith Kc = 4.0. What is the situation?", "options": ["Q = 0.25, so the reaction goes forward", "Q = 8, so the reaction goes in reverse", "Q = 4.0, so the mixture is already at equilibrium", "Q = 16, so the reaction goes in reverse"], "correct_index": 2, "explanations": ["Q = 0.25 inverts the ratio.", "Q = 8 is an arithmetic slip.", "(1.0 × 1.0)/(0.50 × 0.50) = 4.0.", "Q = 16 squares the ratio incorrectly."], "_es": 4}, {"tag": "b10·Q13", "mid": "b10", "difficulty": "easy", "section": "Heterogeneous equilibria", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "At what temperature is CaCO₃ decomposed in the lecture's closed-vessel\nexample?", "options": ["25 °C", "100 °C", "800 °C", "4 °C"], "correct_index": 2, "explanations": ["Room temperature gives negligible decomposition.", "100 °C is too low for the decomposition.", "Limestone decomposes at 800 °C.", "4 °C is the temperature of maximum water density."], "_es": 4}, {"tag": "b10·Q14", "mid": "b10", "difficulty": "medium", "section": "Heterogeneous equilibria", , "difficulty": "easy", "section": "Le Chatelier", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "Which five factors does the lecture say influence a chemical equilibrium?", "options": ["Colour, odour, taste, mass and density", "Concentration, temperature, pressure, volume and catalyst", "Entropy, enthalpy, work, heat and time", "Phase, shape, charge, spin and colour"], "correct_index": 1, "explanations": ["Colour and odour are not the factors listed.", "These are the five listed factors.", "These are thermodynamic quantities, not the listed factors.", "These are not the listed factors."], "_es": 4}, {"tag": "b10·Q22", "mid": "b10", "difficulty": "medium", "section": "Le Chatelier", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "What is meant by a 'stress' on a system at equilibrium?", "options": ["Only a change in the colour of the mixture", "Only a catalyst being added", "A change in the name of the reaction", "A change in concentration, pressure or volume, or temperature"], "correct_index": 3, "explanations": ["Colour is an observation, not the stress.", "A catalyst does not shift the equilibrium.", "Names do not affect the equilibrium.", "These changes disturb the equilibrium."], "_es": 4}, {"tag": "b10·Q23", "mid": "b10", "difficulty": "hard", "section": "Le Chatelier", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "Fe₂(SO₄)₃ solution is added to the FeSCN²⁺ ⇌ Fe³⁺ + SCN⁻ system. What is\nobserved?", "options": ["The red deepens as equilibrium shifts left", "The red fades as equilibrium shifts right", "The red deepens as equilibrium shifts right", "The mixture turns colourless"], "correct_index": 0, "explanations": ["Added Fe³⁺ reacts with SCN⁻ to make more FeSCN²⁺.", "Added Fe³⁺ shifts the reaction left, not right.", "A deeper red needs more FeSCN²⁺, which is a leftward shift.", "FeSCN²⁺ is not removed, so the mixture stays coloured."], "_es": 4}, {"tag": "b10·Q24", "mid": "b10", "difficulty": "devil", "section": "Le Chatelier", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "Oxalate is added to the FeSCN²⁺ system and Fe³⁺ is bound. What happens to the\ncolour?", "options": ["The red deepens as equilibrium shifts left", "No change occurs in the red colour", "The red fades towards brown as equilibrium shifts right", "The solution becomes colourless immediately"], "correct_index": 2, "explanations": ["Removing Fe³⁺ shifts the equilibrium right.", "Removing an ion is a stress and causes a shift.", "FeSCN²⁺ dissociates to replace the lost Fe³⁺.", "Free Fe³⁺ is brown, so the mixture does not become colourless."], "_es": 4}, {"tag": "b10·Q25", "mid": "b10", "difficulty": "easy", "section": "Le Chatelier", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "Do pressure changes affect solids and liquids?", "options": ["No, they do not significantly affect them", "Yes, they always do", "Only liquids are affected", "Only solids are affected"], "correct_index": 0, "explanations": ["Pressure matters mainly for gases.", "The lecture says solids and liquids are not affected.", "Liquids are also not significantly affected.", "Solids are also not significantly affected."], "_es": 4}, {"tag": "b10·Q26", "mid": "b10", "difficulty": "medium", "section": "Le Chatelier", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "How can the total pressure be raised without changing the volume?", "options": ["By pulling a piston upward in the cylinder", "By cooling the gas mixture slowly", "By adding a solid catalyst to it", "By adding an inert gas to a constant-volume vessel"], "correct_index": 3, "explanations": ["Pulling a piston up increases volume and lowers pressure.", "Cooling lowers pressure.", "A catalyst does not change pressure.", "The total pressure rises but partial pressures do not."], "_es": 4}, {"tag": "b10·Q27", "mid": "b10", "difficulty": "hard", "section": "Le Chatelier", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "When helium is added at constant volume, what happens to mole fractions and\npartial pressures of NO₂ and N₂O₄?", "options": ["Mole fractions rise and partial pressures rise", "Mole fractions stay the same and partial pressures fall", "Mole fractions fall but partial pressures stay the same", "Both mole fractions and partial pressures double"], "correct_index": 2, "explanations": ["Partial pressures do not rise here.", "Mole fractions fall as helium dilutes the mixture.", "Partial pressure is mole fraction times total pressure.", "Neither quantity doubles."], "_es": 4}, {"tag": "b10·Q28", "mid": "b10", "difficulty": "devil", "section": "Le Chatelier", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "The volume of a vessel holding N₂ + 3H₂ ⇌ 2NH₃ is halved at constant\ntemperature. What happens?", "options": ["Equilibrium shifts left and K is unchanged", "Equilibrium shifts right and K is unchanged", "Equilibrium shifts right and K doubles", "Equilibrium does not shift and K halves"], "correct_index": 1, "explanations": ["Increased pressure favours the side with fewer moles, which is the right.", "Higher pressure favours fewer gas moles, and only temperature changes K.", "Pressure does not change K.", "Gas moles change from four to two, so a shift occurs."], "_es": 4}, {"tag": "b10·Q29", "mid": "b10", "difficulty": "easy", "section": "Le Chatelier", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "What happens to Q when more reactant is added to a system at equilibrium?", "options": ["Q falls below K, so the net reaction goes forward", "Q rises above K, so the net reaction reverses", "Q equals K, so nothing happens", "Q becomes zero"], "correct_index": 0, "explanations": ["A larger denominator lowers Q until it returns to K.", "Added reactant lowers Q, not raises it.", "Q departs from K as soon as the stress is applied.", "Q cannot be zero while products are present."], "_es": 4}, {"tag": "b10·Q30", "mid": "b10", "difficulty": "medium", "section": "Le Chatelier", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "After a temperature change, what is true about the new equilibrium?", "options": ["It has the same equilibrium constant", "It has K equal to zero", "It has no definite constant", "It has a new equilibrium constant"], "correct_index": 3, "explanations": ["K changes with temperature.", "K is not zero.", "K is defined at each temperature.", "K depends on temperature."], "_es": 4}, {"tag": "b10·Q31", "mid": "b10", "difficulty": "hard", "section": "Le Chatelier", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "The brown gas NO₂ is in equilibrium with colourless N₂O₄, and the forward\nreaction N₂O₄ → 2NO₂ is endothermic. What happens when the mixture is cooled?", "options": ["It shifts right to form more NO₂, and the mixture becomes darker", "It shifts left to form more N₂O₄, and the mixture becomes paler", "It does not shift", "It shifts left, and the mixture becomes darker"], "correct_index": 1, "explanations": ["Cooling favours the exothermic direction, which is leftward here.", "Cooling favours the exothermic reverse reaction.", "Temperature changes shift the equilibrium.", "More N₂O₄ means less brown NO₂, so the mixture is not darker."], "_es": 4}, {"tag": "b10·Q32", "mid": "b10", "difficulty": "devil", "section": "Catalysts", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "A catalyst is added to a mixture that is not yet at equilibrium. What is the\noutcome?", "options": ["Only the forward rate rises, giving more product", "The equilibrium constant increases", "Both rates rise and the same equilibrium forms sooner", "The final composition becomes richer in products"], "correct_index": 2, "explanations": ["A catalyst speeds forward and reverse reactions equally.", "K is unchanged by a catalyst.", "The position is unchanged but reached faster.", "The equilibrium composition does not change."], "_es": 4}, {"tag": "b10·Q33", "mid": "b10", "difficulty": "easy", "section": "Steady state", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "In a steady state, how do the rates of input and output of a substance compare?", "options": ["Input is always larger", "They are equal", "Output is always larger", "Both are zero"], "correct_index": 1, "explanations": ["If input were larger, the level would rise.", "The concentration stays constant.", "If output were larger, the level would fall.", "Rates are not zero in a steady state."], "_es": 4}, {"tag": "b10·Q34", "mid": "b10", "difficulty": "medium", "section": "Steady state", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "What is a system in a steady state subject to?", "options": ["Complete isolation from its surroundings", "Maximum entropy", "Zero free energy change", "Regulation"], "correct_index": 3, "explanations": ["Steady-state systems are open.", "Maximum entropy is the equilibrium state.", "A steady state has a negative free energy change.", "Organisms regulate steady-state levels."], "_es": 4}, {"tag": "b10·Q35", "mid": "b10", "difficulty": "hard", "section": "Steady state", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "After a meal, why does blood glucose remain fairly constant?", "options": ["Tissues take up glucose for use or storage as fast as the gut absorbs it", "The gut absorbs no glucose after a meal", "Glycogen is broken down at the same rate", "Gluconeogenesis supplies all the glucose"], "correct_index": 0, "explanations": ["Transfer to tissues matches absorption.", "Absorption is active after a meal.", "Glycogen breakdown supports the fasting state.", "Gluconeogenesis supports the fasting state."], "_es": 4}, {"ta  1 × 10⁻⁴ at 298 K. What can be said about ΔG°?", "options": ["It is negative, about −22.8 kJ/mol", "It is positive, about +2.3 kJ/mol", "It is positive, about +22.8 kJ/mol", "It is zero"], "correct_index": 2, "explanations": ["K < 1 gives a positive ΔG°, not a negative one.", "+2.3 kJ/mol would correspond to K near 0.4.", "ΔG° = −RT ln K = −2.478 × (−9.21) kJ/mol.", "ΔG° = 0 only when K = 1."], "_es": 4}, {"tag": "b10·Q40", "mid": "b10", "difficulty": "devil", "section": "Le Chatelier", "qt": "single best", "source": "BIOL157_Question_Bank_Volume2_188_MCQs.pdf", "qc": "The volume of an N₂O₄ ⇌ 2NO₂ mixture is halved at constant temperature. What\nhappens to [NO₂]?", "options": ["It doubles at once, then falls as equilibrium shifts left", "It halves at once, then rises as equilibrium shifts right", "It stays the same throughout the whole change", "It doubles at once and keeps rising afterwards"], "correct_index": 0, "explanations": ["Compression raises concentrations first, then the shift towards fewer moles partly reverses it.", "Compression increases, not decreases, concentrations.", "Concentration changes immediately when the volume changes.", "The shift left lowers [NO₂] after the initial jump."], "_es": 4}]};

/* ====== SOUND (WebAudio synth — no assets needed) ====== */
let AC=null;
const initAC=()=>{if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(_){AC=null}};
function beep(f,d,type,g,delay=0){
 if(!AC||!set.sound)return;
 try{const t=AC.currentTime+delay,o=AC.createOscillator(),v=AC.createGain();
 o.type=type||"sine";o.frequency.setValueAtTime(f,t);
 v.gain.setValueAtTime(0.0001,t);v.gain.linearRampToValueAtTime((g||.12)*set.vol,t+.012);
 v.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(_){/**/}
}
const sfx={tap:()=>beep(520,.05,"square",.07),
 ok:()=>{beep(660,.09,"sine",.14);beep(880,.16,"sine",.11,.09)},
 no:()=>{beep(150,.26,"sawtooth",.12)},
 streak:()=>{beep(523,.09,"sine",.13);beep(659,.09,"sine",.13,.09);beep(784,.14,"sine",.13,.18)},
 done:()=>{[523,659,784,1046].forEach((f,i)=>beep(f,.16,"sine",.13,i*.13))},

/* ====== EUPHEME voice packs ====== */
const PLAIN={ok:"Correct.",no:"Not quite."};
const stripNote=s=>String(s).replace(/\s*\([^()]*\)\s*$/,"");
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pools=new Map(),lastLine=new Map();
function packDraw(pack,slot,arr){
 const key=pack+":"+slot;let pool=pools.get(key);
 if(!pool||!pool.length){
  pool=shuffle(arr.slice());
  const last=lastLine.get(key);
  if(last&&pool.length>1){pool=pool.filter(l=>l!==last);pool.push(last)}
  pools.set(key,pool)}
 const line=pool.shift();lastLine.set(key,line);return line;
}
const streakSlot=n=>n>=19?"streak19plus":n>=11?"streak11_18":n===10?"streak10":n>=7?"streak7_9":n>=5?"streak5_6":n>=3?"streak3_4":"streak1_2";
const packByNum=n=>PACKS.find(p=>p.num===n);
function ePack(){
 if(set.pack>=1&&set.pack<=PACKS.length)return packByNum(set.pack);
 if(set.pack===999)return packByNum(1+Math.floor(Math.random()*PACKS.length));
 return null}
function eupOk(q,streak){
 const p=ePack();if(!p)return null;
 const sl=p.slots;let slot;
 if(q.easyMiss&&Math.random()<.25)slot="easyMiss";
 else if(q.difficulty==="hard"||q.difficulty==="devil")slot="hardCorrect";
 else slot=streakSlot(streak);
 let line=packDraw(p.num,slot,sl[slot]||[])||PLAIN.ok;line=stripNote(line);
 if(slot==="streak11_18"&&line.includes(", ")){const notes=line.split(/,\s?/);line=notes[(streak-11)%notes.length]}
 return line}
function eupNo(q,attempt,broken,recovering){
 const p=ePack();if(!p)return null;
 const sl=p.slots;let slot;
 if(recovering)slot="recovering";
 else if(broken)slot="streakBroken";
 else slot=attempt===1?"wrong1":attempt===2?"wrong2":attempt===3?"wrong3":"wrong4plus";
 let line=stripNote(packDraw(p.num,slot,sl[slot]||[])||PLAIN.no);
 if(slot==="wrong4plus"&&attempt>3&&/slides again/i.test(line)){
  line="I think you should "()+"really ".repeat(attempt-4)+"read the slides again."}
 return line}
function gradeLine(g){
 const p=ePack();if(!p)return null;
 const gr=p.slots.grades;const v=gr&&gr[g];return v?stripNote(v):null;
}

function delSave(mid){LS.d("save_"+mid)}
const savesAll=()=>[{id:"ALL"},...MODS].map(m=>({mid:m.id,save:loadSave(m.id)})).filter(x=>x.save);
function newRun(mid,sectionIdx){
 ROOM_LOADED="";
 const m=modOf(mid);
 const k=sectionIdx===undefined?-1:sectionIdx;
 const sec=(m.sections||[])[k];
 const list=[];
 if(!sec){for(let i=m.first;i<m.first+m.count;i++)list.push(i)}
 else{for(let i=m.first+sec.from;i<m.first+sec.from+sec.count;i++)list.push(i)}
 R={mid,label:(sec&&sec.name)||"Full "+(mid==="ALL"?"mix":"module"),mode:"",secIdx:k,i:0,far:0,
    a:list.map(()=>null),cs:0,ws:0,msg:"",end:0,rv:null,done:false,list,flags:{},started:Date.now()};
}
function resumeRun(mid){
 const d=loadSave(mid);if(!d)return false;
 const m=modOf(mid);
 const list=[];
 if(Array.isArray(d.order)&&d.order.length&&d.order.every(i=>Number.isInteger(i)&&i>=m.first&&i<m.first+m.count)){
   d.order.forEach(i=>list.push(i))}
  else if(Number.isInteger(d.q0)&&d.q1>d.q0&&d.q0>=m.first&&d.q1<=m.first+m.count){
   for(let i=d.q0;i<d.q1;i++)list.push(i)}
  else{for(let i=m.first;i<m.first+m.count;i++)list.push(i)}
 const a=Array.isArray(d.a)&&d.a.length===list.length?d.a:list.map(()=>null);
 R={mid,label:d.label||"Full module",mode:d.mode||"explain",secIdx:Number.isInteger(d.sec)?d.sec:-1,
    i:Math.min(d.i||0,list.length-1),far:Math.min(d.far||0,list.length-1),a,cs:d.cs||0,ws:d.ws||0,
    msg:d.msg||"",end:d.end||0,rv:null,done:false,list,started:Date.now(),flags:d.flags||{}};
 screen="quiz";
 if(R.end&&R.end<Date.now()){clearInterval(T);screen="results"}
 else if(R.end){clearInterval(T);T=setInterval(tick,1000)}
 draw(1);return true;
}
function finishRun(){
 R.done=true;delSave(R.mid);
 let s=0;R.a.forEach((a,i)=>{if(a===QALL[R.list[i]].correct_index)s++});
 const n=R.list.length,p=Math.round(s/n*100);
 const entries=LS.g("board",[]);
 entries.push({mid:R.mid,sec:R.label,name:set.name||"Guest",score:s,n,pct:p,mode:R.mode==="explain"?"Explain":"Exam",at:Date.now()});
 while(entries.length>400)entries.shift();
 LS.s("board",entries);
 return {s,p};
}

/* ====== FEEDBACK (EUPHEME + sound) ====== */
function judge(q,ok){
 let line=null;
 if(ok){
  const pw=R.ws,n=R.cs+1;
  R.cs=n;R.ws=0;
  if(pw>=RECOVER_MIN){
   line=eupNo(q,n,n<1?1:n,"",true);
   if(set.sound)sfx.streak();
   return line||PLAIN.ok;
  }
  line=eupOk(q,n);
  if(set.sound){sfx.ok();if(n===10||n===19)sfx.streak()}
  return line||PLAIN.ok;
 }
 const attempt=R.ws+1,pc=R.cs,broken=pc>=BREAK_MIN;
 R.ws=attempt;R.cs=0;
 line=eupNo(q,attempt,broken,false);
 if(set.sound)sfx.no();
 return line||PLAIN.no;
}
