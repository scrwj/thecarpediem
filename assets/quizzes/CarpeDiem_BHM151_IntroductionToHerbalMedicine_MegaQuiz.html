alizing in reading the Quran and dream divination", "Circumcisers: providing postnatal check-ups and breastfeeding support"], "correct_index": 0, "explanations": ["Correct. Slide 11 defines bone setters as traditional healers specializing in treating musculoskeletal disorders such as bone fractures, dislocations, and sprains.", "Incorrect. Bokaye are holistic Hausa healers, not circumcisers.", "Incorrect. TBAs provide maternal/child healthcare, whereas divination is a Hausa practice.", "Incorrect. Postnatal check-ups and breastfeeding are handled by TBAs, not circumcisers."], "mid": "bhm10"}, {"tag": "BHM151·Q463", "difficulty": "devil", "section": "Techniques and Methods", "qt": "classification", "source": "BHM 151 — Traditional_Medicine_Africa, slide 14", "qc": "An examiner evaluates the technical methodologies employed across different traditional medical practices. Which classification accurately links a specific technical method to its correct practice category based on the lecture slides?", "options": ["Surgical, device-based, and traditional methods (using string/thread) are utilized by circumcisers", "Manual manipulation and topical herbal preparations are the exclusive diagnostic tools of Traditional Birth Attendants", "Quranic reading and dream interpretation are the primary surgical methods employed by bone setters", "Postnatal check-ups and breastfeeding support are the defining techniques of Hausa bokaye divination"], "correct_index": 0, "explanations": ["Correct. Slide 14 outlines techniques of circumcisers as surgical, device-based, and traditional methods using string or thread.", "Incorrect. Manual manipulation and topical herbs are bone setter and general techniques, not TBAs' diagnostic tools.", "Incorrect. Quranic reading and dream interpretation are divination practices, not bone setter surgical methods.", "Incorrect. Postnatal check-ups and breastfeeding support belong to TBAs, not bokaye divination."], "mid": "bhm10"}, {"tag": "BHM151·Q464", "difficulty": "devil", "section": "Traditional Practices and Techniques", "qt": "single", "source": "BHM 151 — Traditional_Medicine_Africa, slide 17", "qc": "A traditional birth attendant (TBA) administers an herbal decoction to a woman experiencing prolonged labor. According to the provided slides, what is the precise multifaceted scope attributed to herbal remedies in this context?", "options": ["To exclusively facilitate labor and mechanically align the fetus", "To promote labor, relieve pain, and support postnatal recovery", "To protect the mother and infant from spiritual harm during delivery", "To stimulate the body's inherent healing abilities through holistic individualization"], "correct_index": 1, "explanations": ["Incorrect, as mechanical alignment is attributed to massage and manipulation rather than herbal remedies.", "Correct, because the slides explicitly state herbal remedies are used to promote labor, relieve pain, and support postnatal recovery.", "Incorrect, as protecting the mother and infant from harm is specifically ascribed to spiritual rituals.", "Incorrect, because natural healing and individualization are listed as principles of herbalism, not the specific functional scope of TBAs' herbal use."], "mid": "bhm10"}, {"tag": "BHM151·Q465", "difficulty": "hard", "section": "Principles of Herbalism", "qt": "single", "source": "BHM 151 — Traditional_Medicine_Africa, slide 18", "qc": "An herbal practitioner designs a custom therapeutic regimen that accounts for a patient's physical symptoms, emotional state, and spiritual well-being, while avoiding standardized dosing. Which distinct principle of herbalism primarily drives the tailoring of treatment to unique circumstances?", "options": ["Natural healing", "Holism", "Individualized treatment", "Historical longevity"], "correct_index": 2, "explanations": ["Incorrect, as natural healing promotes using natural substances to stimulate inherent body abilities.", "Incorrect, because holism views the individual as encompassing physical, emotional, and spiritual aspects, but tailoring treatment to unique circumstances is a separate principle.", "Correct, as the slides define individualized treatment as emphasizing the importance of tailoring treatment to the individual's unique needs and circumstances.", "Incorrect, as historical longevity refers to its rich history dating back thousands of years, not a core principle of practice."], "mid": "bhm10"}, {"tag": "BHM151·Q466", "difficulty": "devil", "section": "Fetishism in African Cultures", "qt": "single", "source": "BHM 151 — Traditional_Medicine_Africa, slide 19", "qc": "In the analysis of traditional West African spirituality, what fundamental prerequisite or origin must an object fulfill to be accurately classified as a 'fetish' according to the slide?", "options": ["It must be an amulet derived exclusively from natural elements like wood or stone.", "It must be an object believed to possess spiritual powers or energies, typically created and consecrated by spiritual leaders or priests.", "It must serve purely as a physical symbol of spiritual energy without acting as an intermediary.", "It must be an ancestral statue utilized strictly for divination and communicating with ancestors."], "correct_index": 1, "explanations": ["Incorrect, because fetishes can also be man-made objects like statues and masks, not exclusively natural amulets.", "Correct, because the definition specifies that a fetish is an object believed to possess spiritual powers or energies, often created and consecrated by spiritual leaders or priests.", "Incorrect, as fetishes explicitly serve as intermediaries between humans and spirits, alongside being symbols and tools.", "Incorrect, because ancestral fetishes are only one type, and fetishes serve multiple purposes beyond just divination."], "mid": "bhm10"}, {"tag": "BHM151·Q467", "difficulty": "hard", "section": "Purposes of Fetishism", "qt": "single", "source": "BHM 151 — Traditional_Medicine_Af ic patents and corporate mergers are completely irrelevant to herbal monographs.", "Incorrect because agricultural soil metrics are not included in herbal monographs."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q34", "difficulty": "hard", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — Ethnobotany, slide 6", "qc": "Evaluate the inclusion of humanities versus sciences in the scope of ethnobotany. Which fields mentioned explicitly bridge this interdisciplinary boundary?", "options": ["Anthropology and Religious Studies represent humanities aspects within the interdisciplinary science.", "Pharmacology and Chemistry exclusively represent the humanities components.", "Linguistics and Sociology are excluded from the multidisciplinary scope of ethnobotany.", "Systematics and Ecology function strictly as humanities without scientific basis."], "correct_index": 0, "explanations": ["Ethnobotany includes aspects of both sciences and humanities, with anthropology and religious studies falling under humanities.", "Pharmacology and chemistry are core sciences, not humanities.", "Linguistics and sociology are explicitly listed as part of the multidisciplinary scope.", "Systematics and ecology are scientific disciplines, not humanities."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q35", "difficulty": "devil", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — Ethnobotany, slide 5", "qc": "Assertion: Ethnobotany is classified as a branch of ethnobiology and a subset of ethnoecology. Reason: Ethnoecology focuses exclusively on plant-human interactions without considering animals or the broader natural environment.", "options": ["Both the assertion and the reason are true, and the reason is the correct explanation.", "Both the assertion and the reason are true, but the reason is NOT the correct explanation.", "The assertion is true, but the reason is false.", "Both the assertion and the reason are false."], "correct_index": 2, "explanations": ["The reason incorrectly restricts ethnoecology, making it false.", "The reason is false, so they cannot both be true.", "Ethnobotany is indeed a branch of ethnobiology and a subset of ethnoecology; however, ethnoecology studies interactions between people and the natural environment (including animals and organisms), making the reason false.", "The assertion is a direct fact from the slide."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q36", "difficulty": "devil", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — Ethnobotany, slide 6", "qc": "Which combination of disciplines from the slide best demonstrates the integration of plant cultivation science with commercial utilization in ethnobotany?", "options": ["Horticulture and Economic Forestry", "Anthropology and Religious Studies", "Linguistics and Sociology", "Pharmacology and Medicine"], "correct_index": 0, "explanations": ["Horticulture relates to plant cultivation and economic forestry relates to commercial/resource utilization, bridging science and economy.", "Anthropology and religious studies focus on culture and beliefs.", "Linguistics and sociology focus on language and societal structures.", "Pharmacology and medicine focus on health and therapeutic actions rather than plant cultivation and economic forestry directly."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q37", "difficulty": "hard", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — Ethnobotany, slide 7", "qc": "Assertion: Current drug usages are largely derived from ancient traditions. Reason: These traditions were developed from empirical knowledge concerning health benefits and risks of medicinal substances from indigenous societies.", "options": ["Both the assertion and the reason are true, and the reason is the correct explanation.", "Both the assertion and the reason are true, but the reason is ists and chemists working in the field do not replace indigenous practitioners.", "Voucher specimen deposition (slide 15) does not cause the fragility of indigenous skills."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q45", "difficulty": "hard", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — Ethnobotany, slide 19", "qc": "Which of the following correctly represent how ethnobotanical knowledge directs laboratory investigations according to slide 19? I. Prioritizing plant species based on documented local ailments. II. Defining exact chemical structures prior to field collection. III. Indicating potential therapeutic targets such as anti-malarial properties. IV. Mapping entire ecological genomes of indigenous regions.", "options": ["I and II only", "I and III only", "II and IV only", "I, III, and IV only"], "correct_index": 1, "explanations": ["Statement II is incorrect because chemical structures are not defined prior to field collection based on this slide.", "Statement I and III are both explicitly listed as key applications of ethnobotanical knowledge for identifying promising species and therapeutic targets.", "Statement II is false and statement IV is not mentioned in the slide.", "Statement IV is factually incorrect and unsupported by slide 19."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q46", "difficulty": "devil", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — Ethnobotany, slide 20", "qc": "Assertion: Ethnobotanical information directly isolates pure active chemical ingredients without requiring laboratory extraction. Reason: Traditional knowledge is utilized in bioassay-guided fractionation to guide the extraction and isolation of active ingredients.", "options": ["Both the assertion and reason are true, and the reason is the correct explanation.", "Both the assertion and reason are true, but the reason is NOT the correct explanation.", "The assertion is false, but the reason is true.", "Both the assertion and reason are false."], "correct_index": 2, "explanations": ["The assertion is incorrect because ethnobotanical info guides researchers during extraction and fractionation, it does not directly isolate pure compounds without lab work.", "The assertion is false, making this option incorrect.", "The assertion is false since traditional knowledge guides the process rather than directly yielding isolates, but the reason accurately states the role of bioassay-guided fractionation from slide 20.", "The reason is explicitly stated as correct on slide 20."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q47", "difficulty": "hard", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — Ethnobotany, slide 24", "qc": "According to slide 24, which measures are deemed crucial when utilizing ethnobotanical knowledge? I. Securing informed consent and respecting indigenous intellectual property. II. Replacing traditional healers with industrial harvesters. III. Complementing traditional knowledge with rigorous scientific validation for safety and efficacy. IV. Avoiding overharvesting to protect plant populations.", "options": ["I and II only", "I, III, and IV only", "II, III, and IV only", "All of the above"], "correct_index": 1, "explanations": ["Statement II is incorrect because replacing traditional healers is neither mentioned nor aligned with cultural sensitivity.", "Statements I (cultural sensitivity/informed consent), III (scientific validation), and IV (sustainability/avoiding overharvesting) are all explicitly listed on slide 24.", "Statement II renders this option incorrect.", "Statement II is false, making 'all of the above' incorrect."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q48", "difficulty": "devil", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — Ethnobotany, slide 20", "qc": "Assertion: Studying a wide range of plants used OT the correct explanation.", "The assertion is false, but the reason is true.", "Both assertion is and reason are false."], "correct_index": 2, "explanations": ["Incorrect because the assertion falsely claims healthcare was 'completely disorganized and chaotic' whereas the slide states there was 'No organized system of healthcare' in a modern formal institutional sense, but the delivery itself was managed by recognized competent individuals.", "Incorrect because the assertion is factually flawed based on the slide nuance.", "Correct because the slide explicitly states there was no organized system of healthcare, making the assertion false, while the reason accurately quotes slide 3 regarding priest healers being custodians of cultural norms and recognized as competent.", "Incorrect because the reason statement is entirely supported by slide 3."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q56", "difficulty": "hard", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — Herbal_Med_Ghana, slide 7", "qc": "Which of the following institutional milestones occurred following Ghana's attainment of political independence in 1957, as outlined in slide 7? \nI. Formation of the Ghana Psychic and Traditional Healers Association in 1961\nII. Establishment of the Centre for Plant Medicine Research (CPMR) in 1975\nIII. Enactment of Act 575 for the Traditional Medicine Practice Council in 2000\nIV. Promulgation of the Native Customs Regulation Ordinance in 1878", "options": ["I and II only", "III and IV only", "I, II and III only", "I, II, III and IV"], "correct_index": 0, "explanations": ["Correct, statements I and II are specifically cited on slide 7 as post-1957 milestones. Statement III is from slide 8, and statement IV is from slide 6 (colonial era).", "Incorrect because statement IV occurred in 1878 (pre-independence).", "Incorrect because statement III belongs to slide 8, whereas slide 7 only covers up to 1975.", "Incorrect beca tatement III claims restriction to infectious communicable diseases, whereas slide 5 states they manage *both* communicable and non-communicable diseases.", "Incorrect because statement I is omitted, yet 60-70% dependency is explicitly stated on slide 5.", "Correct, statements I (60-70% dependency), II (primary reliance on herbal remedies), and IV (units in 55 government hospitals) are precisely cited in slide 5.", "Incorrect because statement III is false based on slide 5 text."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q59", "difficulty": "hard", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — Herbal_Med_Ghana, slide 6", "qc": "Assertion: Christian missions during the colonial era actively prohibited many traditional and cultural practices in Ghana. Reason: These missions viewed traditional healing practices as advanced scientific integrations that rivaled western biomedicine.", "options": ["Both assertion and reason are true and the reason is the correct explanation.", "Both assertion and reason are true but the reason is NOT the correct explanation.", "The assertion is true, but the reason is false.", "Both assertion and reason are false."], "correct_index": 2, "explanations": ["Incorrect because the reason is entirely false.", "Incorrect because the reason is false.", "Correct, because slide 6 confirms that Christian missions prohibited traditional practices, but the reason is false because they viewed them as primitive and/or demonic, not as 'advanced scientific integrations'.", "Incorrect because the assertion is fully supported by slide 6."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q60", "difficulty": "devil", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — Herbal_Med_Ghana, slide 10", "qc": "Assertion: The Institute of Traditional and Alternative Medicine (ITAM) was established in 2001 alongside the Department of Herbal Medicine at KNUST. Reason: Both entities l accurate statements.", "Correct, slide 11 explicitly links the 1960 formation to Dr. Nkrumah, the 1975 reconstitution, and the 1991 PNDC/CIBA setup of the National Council of Herbal Medicine."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q62", "difficulty": "hard", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — Herbal_Med_Ghana, slide 13", "qc": "Assertion: Ghanaians heavily depend on herbal medicine due to high accessibility, affordability, and trust. Reason: The traditional health practitioner to population ratio stands at 1:20,000 compared to medical doctors at 1:200.", "options": ["Both assertion and reason are true, and the reason is the correct explanation.", "Both assertion and reason are true, but the reason is NOT the correct explanation.", "The assertion is true, but the reason is false.", "Both assertion and reason are false."], "correct_index": 2, "explanations": ["Incorrect, the reason contains inverted ratios.", "Incorrect, the reason is entirely false.", "Correct, the assertion correctly reflects slide 13 drivers of reliance, but the reason inverted the ratios (traditional practitioners are actually 1:200, whereas medical doctors are 1:20,000).", "Incorrect, the assertion is explicitly stated as true on slide 13."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q63", "difficulty": "hard", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — Herbal_Med_Ghana, slide 15", "qc": "Assertion: Herbal medicine can be promoted for purposes of medical tourism. Reason: Herbal medicine forms an integral part of Ghana's national heritage, enabling income generation for the country.", "options": ["Both assertion and reason are true, and the reason is the correct explanation.", "Both assertion and reason are true, but the reason is NOT the correct explanation.", "The assertion is true, but the reason is false.", "Both assertion and reason are false."], "correct_index": 0, "explana ually false based on the slide.", "Correct, slide 20 states that Ghanaian liquid herbal medicines are associated with undesirable traits like bitter taste, short shelf-life, and control of microbial contamination, making them bulky and inconvenient for export.", "Incorrect because the assertion is fully supported by slide 20."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q69", "difficulty": "devil", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — Herbal_Med_Ghana, slide 21", "qc": "Identify the correct governance and surveillance framework statements regarding herbal medicines from slide 21. I. Pharmacovigilance is critically important for developing reliable safety information. II. Ghana exclusively imports herbal medicines from African nations. III. The importation of herbal medicine is governed by PNDC Law 305 (Food and Drug Law, 1992). IV. India, China, UK, and Germany are noted as source countries for imported herbal medicines.", "options": ["I, III and IV only", "I and II only", "II, III and IV only", "I, II, III and IV"], "correct_index": 0, "explanations": ["Correct, statements I, III, and IV are explicitly mentioned on slide 21. Statement II is false because Ghana imports from India, China, UK, and Germany.", "Incorrect because statement II is false and statements III and IV are omitted.", "Incorrect because statement II falsely claims exclusive importation from African nations.", "Incorrect due to the false inclusion of statement II."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q70", "difficulty": "devil", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — Herbal_Med_Ghana, slide 24", "qc": "What outcomes and stakeholder engagements are projected from implementing a national research and development policy on herbal medicine according to slide 24? I. Bringing together researchers, regulators, practitioners, and policymakers. II. Consideration of capacity n  sourced from slide 20."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q72", "difficulty": "devil", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — Herbal_Med_Ghana, slide 23", "qc": "According to slide 23, what fundamental conditions dictate the long-term survival and sustainability of the herbal industry in Ghana? I. Continuous availability and supply of good quality raw plant materials. II. Conservation of rare, endangered, and threatened medicinal plants. III. Total replacement of locally produced medicine with Indian and Chinese imports. IV. Application of biotechnological interventions for plant multiplication.", "options": ["I and II only", "I, II and IV only", "I, III and IV only", "I, II, III and IV"], "correct_index": 1, "explanations": ["Incorrect because it omits statement IV, which is explicitly highlighted on slide 23.", "Correct, slide 23 emphasizes continuous availability of good quality raw materials, global concern for conservation of rare/endangered plants, and biotechnological interventions for multiplication.", "Incorrect because statement III (replacing local medicine with imports) directly contradicts the goal of developing the local industry.", "Incorrect due to the inclusion of statement III."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q73", "difficulty": "hard", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — IKA, slide 3", "qc": "Assertion: The proliferation of herbal medicine schools in Africa and global shifts in healthcare regimes are unrelated to historical paradigms of traditional medicine. Reason: The COVID-19 pandemic served as a catalyst that closed the door on engagement with herbal medicine.", "options": ["Both assertion and reason are true and the reason is the correct explanation.", "Both assertion and reason are true but the reason is NOT the correct explanation.", "The assertion is true, but the reason is false.", "Both assertion and reason are false."], "correct_index": 3, "explanations": ["Incorrect; the assertion falsely claims lack of relation to historical paradigms, and the reason falsely claims COVID closed the door.", "Incorrect; both statements contain factual errors regarding slide content.", "Incorrect; the assertion is false because HM school proliferation is explicitly likened to the history of traditional medicine.", "Correct; slide 3 states the exact opposite: HM growth is 'just like the history of traditional medicine' and COVID 'opened the way for real engagement'."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q74", "difficulty": "devil", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — IKA, slide 8", "qc": "Analyze the operational definitions of Complementary and Alternative medicine. Select the true statement(s): I. Complementary medicine replaces conventional medicine. II. Alternative medicine is used together with conventional medicine. III. Integrative medicine involves offering both conventional and non-mainstream care.", "options": ["I only", "II only", "III only", "I and II only"], "correct_index": 2, "explanations": ["Incorrect; complementary medicine is used *together* with conventional medicine, not instead of it.", "Incorrect; alternative medicine is used *instead* of conventional medicine, not together with it.", "Correct; slide 8 defines integrative medicine as when health care providers offer both conventional and unconventional care.", "Incorrect; both statements I and II invert the definitions provided on slide 8."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q75", "difficulty": "devil", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — IKA, slide 4", "qc": "Assertion: The historical timeline implies a permanent triumph of synthetic pills over natural roots by the mid-20th century. Reason: The timeline culminates in 2000 AD with the realization that microbial mutations forced a return to root-based remedies ('bugs have won').", "options": ["Both assertion and reason are true and the reason is the correct explanation.", "Both assertion and reason are true but the reason is NOT the correct explanation.", "The assertion is false, but the reason is true.", "Both assertion and reason are false."], "correct_index": 2, "explanations": ["Incorrect; the assertion is false because synthetic pills did not permanently triumph, as shown by the subsequent return to roots.", "Incorrect; the assertion is false.", "Correct; the assertion is false (there was no permanent triumph of synthetics), but the reason accurately quotes and reflects the 2000 AD endpoint on slide 4.", "Incorrect; the reason is definitively true based on slide 4 text."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q76", "difficulty": "hard", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — IKA, slide 7", "qc": "Examine the terminology listed for Orthodox versus Unorthodox systems on slide 7. Which descriptors belong exclusively to the Orthodox system? I. Allopathic II. Folk III. Biomedicine IV. Ethnomedicine", "options": ["I and III only", "II and IV only", "I, II, and III only", "II, III, and IV only"], "correct_index": 0, "explanations": ["Correct; Allopathic (I) and Biomedicine (III) are listed under Orthodox, whereas Folk (II) and Ethnomedicine (IV) are listed under Unorthodox.", "Incorrect; Folk and Ethnomedicine belong to the unorthodox system.", "Incorrect; Folk belongs to the unorthodox system.", "Incorrect; Folk and Ethnomedicine belong to the unorthodox system."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q77", "difficulty": "devil", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — IKA, slide 8", "qc": "Assertion: Integrative medicine is synonymous with alternative medicine because both reject conventional healthcare practices entirely. Reason: Integrative medicine ide 13", "qc": "Traditional medicine encompasses a broad scope of application. According to slide 13, which of the following best describes the goals of traditional medicine knowledge and practices?", "options": ["Only the treatment of acute physical illnesses through spiritual rituals.", "Maintenance of health, prevention, diagnosis, improvement, or treatment of physical and mental illness.", "Exclusively the maintenance of spiritual balance without physical health interventions.", "Standardized clinical trials and pharmaceutical drug development."], "correct_index": 1, "explanations": ["Incorrect, it is not restricted to only acute physical illnesses or solely spiritual rituals.", "Correct, slide 13 states TM is used in the maintenance of health and in the prevention, diagnosis, improvement or treatment of physical and mental illness.", "Incorrect, TM addresses physical and mental illness as well as health maintenance.", "Incorrect, TM is based on indigenous theories, beliefs, and experiences, not clinical pharmaceutical trials."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q80", "difficulty": "hard", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — IKA, slide 14", "qc": "According to slide 14, what is the composition base of TM medicines and what types of imbalances do they address?", "options": ["Plant, animal, and mineral-based; physical illnesses, mental, social, and spiritual imbalances", "Synthetic chemicals and minerals; physical and psychological illnesses only", "Plant extracts and lab-synthesized compounds; physical and economic imbalances", "Animal and synthetic products; spiritual imbalances exclusively"], "correct_index": 0, "explanations": ["Correct, slide 14 refers to plant, animal, and mineral-based medicines treating physical illnesses, mental, social, and spiritual imbalances.", "Incorrect, TM does not rely on synthetic chemicals per slide 14 definition.", "Incorrect, lab-synthesized compounds are not part of the traditional material base on slide 14.", "Incorrect, TM addresses physical illnesses alongside mental, social, and spiritual imbalances."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q81", "difficulty": "hard", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — IKA, slide 15", "qc": "Why, according to slide 15, might a practitioner be chosen for training in healing by deities/spirits or elders?", "options": ["To amass personal wealth and community political power.", "To become the 'medicine man' for the community to fight diseases threatening individuals, families, and the community.", "To replace modern hospitals with commercial pharmaceutical industries.", "To conduct randomized control trials on medicinal plants."], "correct_index": 1, "explanations": ["Incorrect, political power and wealth accumulation are not mentioned in slide 15.", "Correct, slide 15 states the practitioner may be chosen to become the 'medicine man' to fight diseases threatening the well-being of the individual, family, or community.", "Incorrect, replacing modern hospitals is not stated on slide 15.", "Incorrect, clinical research trials are anachronistic to traditional origins on slide 15."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q82", "difficulty": "hard", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — IKA, slide 16", "qc": "According to slide 16, what formed the basis of a sophisticated traditional medical system around the world?", "options": ["The postulates on the origin of TM from divine gifts, spirits, and revelations through dreams/visions/extrasensory perception", "Mandatory governmental licensing and international patent laws", "The invention of automated high-performance liquid chromatography", "The eradication of all pluralistic healthcare options in local communities"], "correct_index": 0, "explanations": ["Correct, slide 16 explicitly states that the postulates on the origin of TM formed the basis of a sophisticated traditional medical system around the world.", "Incorrect, governmental licensing and patents are modern legal frameworks, not the basis described in slide 16.", "Incorrect, analytical instruments are modern technological advances.", "Incorrect, eradication of pluralistic care is neither stated nor logical based on slide 16."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q83", "difficulty": "hard", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — IKA, slide 9 & 13", "qc": "Consider the terms 'Traditional Medicine', 'Complementary Medicine', and 'Alternative Medicine'. Based on the lecture slides, how are these terms related geographically or jurisdictionally?", "options": ["They are strictly separated by law in every country globally without exception.", "They are used interchangeably with Traditional Medicine in some countries, and TM is often termed alternative or complementary medicine in many countries.", "Complementary medicine always precedes Traditional Medicine historically in all cultures.", "Traditional medicine can never be considered alternative under any circumstance."], "correct_index": 1, "explanations": ["Incorrect, slide 9 states they are used *interchangeably* in some countries.", "Correct, slide 9 notes 'Complementary' or 'Alternative Medicine' are used interchangeably with Traditional Medicine in some countries, and slide 13 notes TM is often termed alternative or complementary in many countries.", "Incorrect, no historical hierarchy between CM and TM is stated in the slides.", "Incorrect, slide 13 directly states TM is often termed alternative or complementary medicine in many countries."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q84", "difficulty": "devil", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — IKA, slide 17", "qc": "Assertion: A TMP's competence to provide healthcare is strictly bounded by the scientific consensus of biomedical disease causation. Reason: Slide 17 explicitly bases the TMP's methodology on the social, cultural, and religious background as well as community beliefs regarding disease causation.", "options": ["Both assertion and reason are true and the reason is the correct explanation.", "Both assertion and reason are true, but the reason is NOT the correct explanation.", "The assertion is false, but the reason is true.", "Both assertion and reason are false."], "correct_index": 2, "explanations": ["Incorrect because the assertion claims biomedical consensus is the basis, which contradicts slide 17.", "Incorrect because the assertion is clearly false.", "Correct, the assertion is false because TMPs operate based on community social, cultural, and religious beliefs, not scientific biomedical consensus, making the reason true.", "Incorrect because the reason correctly reflects the text on slide 17."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q85", "difficulty": "hard", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — IKA, slide 22", "qc": "According to slide 22, which of the following duties are explicitly attributed to traditional midwives? I. Taking care of the new-born child. II. Carrying out postnatal care. III. Undertaking counseling and treatment for couples with difficulty having children. IV. Performing major surgical interventions during labour.", "options": ["I and II only", "I, II, and III only", "II, III, and IV only", "I, II, III, and IV"], "correct_index": 1, "explanations": ["Incorrect because III is also explicitly mentioned on slide 22.", "Correct, slide 22 lists taking care of the new-born child, carrying out postnatal care, looking after paediatric cases, family planning, and counselling/treatment for couples with difficulty having children (I, II, and III), but does not mention major surgical interventions (IV).", "Incorrect because I is also explicitly mentioned on slide 22.", "Incorrect because IV is not mentioned on slide 22."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q86", "difficulty": "hard", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — IKA, slide 23", "qc": "Assertion: Herbal medicine represents both the oldest form of healthcare and the most commonly used type of medicine globally today. Reason: Slide 23 defines herbal medicine exclusively as the use of synthetic chemical isolates mimicking plant structures.", "options": ["Both assertion and reason are true and the reason is the correct explanation.", "Both assertion and reason are true, but the reason is NOT the correct explanation.", "The assertion is true, but the reason is false.", "Both assertion and reason are false."], "correct_index": 2, "explanations": ["Incorrect because the reason is false.", "Incorrect because the reason is false.", "Correct, the assertion is a direct quote from slide 23, while the reason is false because slide 23 states herbal medicine uses plants and plant products as therapeutic agents, not synthetic chemical isolates.", "Incorrect because the assertion is true."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q87", "difficulty": "hard", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — IKA, slide 20", "qc": "Based on slide 20, which of the following demographic descriptions apply to the diverse classes of TMPs? I. They include both males and females, adults and children. II. They comprise both professionals and amateurs. III. They range from educated individuals to illiterates, and urban to rural dwellers. IV. They are exclusively wealthy urban specialists.", "options": ["I and II only", "I, II, and III only", "II, III, and IV only", "I, II, III, and IV"], "correct_index": 1, "explanations": ["Incorrect because III is also explicitly supported by slide 20.", "Correct, slide 20 lists male, female, adult, children, professionals and amateurs, educated, illiterates, urban or rural dwellers, rich and poor, specialists and generalists, making I, II, and III correct while IV is false because they are not exclusively urban or wealthy.", "Incorrect because I is also supported by slide 20.", "Incorrect because IV contradicts slide 20 ('urban or rural dwellers, rich and poor')."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q88", "difficulty": "devil", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — IKA, slide 25", "qc": "Assertion: Herbalism is universally regarded in contemporary global health systems as an unscientific healthcare practice. Reason: Herbalism shares the exact same operational paradigm as conventional medicine and its products can be investigated using similar parameters as allopathic drugs.", "options": ["Both assertion and reason are true, and the reason is the correct explanation.", "Both assertion and reason are true, but the reason is not the correct explanation.", "The assertion is false, but the reason is true.", "Both assertion and reason are false."], "correct_index": 2, "explanations": ["Incorrect because the assertion claims herbalism is universally regarded as unscientific, which contradicts the slide pointing out it has merely been represented in a poor light.", "Incorrect because the assertion is false based on the slide's qualification of how it has been represented.", "Correct because the slide states it has only been *represented* in a poor light (making the assertion false), while explicitly confirming it has the same paradigm as conventional medicine (making the reason true).", "Incorrect because the reason statement is directly supported by the slide."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q89", "difficulty": "hard", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — IKA, slide 26", "qc": "Which combination of factors directly drives the modern return and popularity of herbal medicines according to the slides? I. Disaffection with conventional medicines. II. Strict governmental mandates under Alma-Ata. III. Interest in natural products. IV. Environmental awareness of biodegradability.", "options": ["I, II and III only", "I, III and IV only", "II, III and IV only", "All of the above"], "correct_index": 1, "explanations": ["Incorrect because item II is not listed on slide 26 as a driver for populace popularity.", "Correct because slide 26 explicitly lists disaffection with conventional medicines, interest in natural products, and environmental awareness of their being biodegradable items.", "Incorrect because item I is explicitly mentioned in slide 26, leaving this combination incomplete.", "Incorrect because item II (governmental mandates) does not appear on slide 26."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q90", "difficulty": "hard", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — IKA, slide 30", "qc": "In the standard 'hierarchy of resort' framework when people approach health, which behavioral steps are sequentially outlined? I. Seeking expert assistance. II. Consulting family and friends. III. Seeking simple home remedy or folk medicine. IV. Mandating primary healthcare integration.", "options": ["I, II and III", "III, II and I", "II, I and III", "IV, I and II"], "correct_index": 1, "explanations": ["Incorrect due to incorrect sequencing order against the slide.", "Correct because slide 30 lists the hierarchy of resort steps as (a) seeking simple home remedy/folk medicine, (b) consulting family and friends, and (c) seeking expert assistance.", "Incorrect because it places consulting family and friends before seeking simple home remedies.", "Incorrect because mandate of primary healthcare integration is not part of the individual hierarchy of resort."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q91", "difficulty": "hard", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — IKA, slide 31", "qc": "Assertion: The ultimate goal of all well-meaning health care systems is the provision of safe, effective therapy. Reason: Hippocrates, known as the Father of modern medicine, pronounced the foundational maxim 'First do no harm'.", "options": ["Both assertion and reason are true, and the reason explains the goal.", "Both assertion and reason are true, but the reason is a distinct supporting tenet rather than the direct causal explanation.", "The assertion is false, but the reason is true.", "Both assertion and reason are false."], "correct_index": 1, "explanations": ["Incorrect; while both statements are facts verbatim from slide 31, the Hippocratic maxim adds context to the goal of safety rather than being the logical derivation of the general goal statement.", "Correct because both statements are explicitly affirmed on slide 31, but the quote 'First do no harm' complements the safety aspect of the goal rather than serving as its strict functional cause.", "Incorrect because the assertion matches slide 31's exact text.", "Incorrect because both statements are verbatim extracts from slide 31."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q92", "difficulty": "hard", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — IKA, slide 32", "qc": "An appropriate healthcare delivery system must deliver services that satisfy which core dimensions according to slide 32? I. Safe. II. Effective. III. Affordable. IV. Available.", "options": ["I and II only", "I, II and III only", "III and IV only", "All of the above"], "correct_index": 3, "explanations": ["Incorrect; it misses affordability and availability.", "Incorrect; it omits availability.", "Incorrect; it omits safety and effectiveness.", "Correct because slide 32 explicitly specifies all four traits (safe, effective, affordable, and available) as requirements for all appropriate healthcare delivery systems."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q93", "difficulty": "hard", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — IKA, slide 26", "qc": "Assertion: Herbal medicines are making a return partly due to environmental awareness. Reason: Herbal items are recognized as biodegradable materials that do not persist as synthetic pollutants.", "options": ["Both assertion and reason are true, and the reason correctly clarifies the assertion.", "Both assertion and reason are true, but the reason is unrelated.", "The assertion is true, but the reason is false.", "Both assertion and reason are false."], "correct_index": 0, "explanations": ["Correct because slide 26 explicitly links the populace's popularity and return to herbal medicine with environmental awareness of their being biodegradable items.", "Incorrect because the reason directly expands upon the exact mechanism of the environmental awareness cited in the assertion.", "Incorrect because the reason is also verbatim text found on slide 26.", "Incorrect because both statements accurately reflect slide 26."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q94", "difficulty": "devil", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — IKA, slide 31", "qc": "What does 'validity' of a healthcare system comprehensively measure according to the slides? I. Diagnostic methods. II. Treatment. III. Therapy practiced. IV. Affordability metrics.", "options": ["I, II and III only", "II, III and IV only", "I, III and IV only", "All of the above"], "correct_index": 0, "explanations": ["Correct because slide 31 explicitly defines validity as referring to the measure of the Diagnostic methods, Treatment, and Therapy practiced.", "Incorrect because affordability metrics are part of the healthcare delivery goals on slide 32, not the definition of system validity on slide 31.", "Incorrect because affordability metrics belong to slide 32.", "Incorrect because ternative Medicine Unit was established within the MOH in 1991, headed by a Deputy Director. III. The Ghana Herbal Pharmacopoeia was launched in 1992. IV. The Centre for Plant Medicine Research was relocated from Mampong-Akwapim to Nsawam in 1990. Which of these are explicitly stated in slide 40?", "options": ["I, II, and III only", "I and IV only", "II, III, and IV only", "I, II, III, and IV"], "correct_index": 0, "explanations": ["Slide 40 explicitly lists the 1985 pharmaceutical sector survey, the 1991 setup of the Traditional and Alternative Medicine Unit headed by a Deputy Director, and the 1992 launch of the Ghana Herbal Pharmacopoeia.", "Statement IV is a fabrication not found anywhere in slide 40.", "Statement IV is false and unmentioned in the slide text.", "Statement IV invalidates the all-inclusive option because relocation to Nsawam is absent from slide 40."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q100", "difficulty": "devil", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — IKA, slide 41", "qc": "Assertion: The Food & Drugs Law (P.N.D.C.L. 305B) of 1992 continues to regulate herbal medicine in Ghana today. Reason: Part II of P.N.D.C.L. 305B contained the specific laws regulating herbal medicine which remain unamended.", "options": ["Both assertion and reason are true, and the reason is the correct explanation.", "Both assertion and reason are true, but the reason is NOT the correct explanation.", "The assertion is true, but the reason is false.", "Both assertion and reason are false."], "correct_index": 3, "explanations": ["Incorrect, as the assertion is false.", "Incorrect, both statements are false.", "Incorrect, the assertion is false because the law has been replaced.", "Correct, the 1992 Act has been replaced by the Public Health Act, 2012, Act 851, making both the assertion and reason false."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q101", "difficulty": "hard", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — IKA, slide 42", "qc": "Which of the following institutional developments in Traditional Medicine occurred chronologically AFTER the establishment of the B.Sc. Herbal Medicine programme at KNUST? I. Elevation of the Traditional and Alternative Medicines Directorate to a full Directorate II. Establishment of Herbal Units in some GHS health facilities III. Formation of the Federation of the 6 major THP Associations (GHAFTRAM)", "options": ["I only", "I and II only", "II and III only", "I, II and III"], "correct_index": 1, "explanations": ["Incorrect, because II also occurred after 2001.", "Correct, Directorate elevation occurred in 2003 and GHS Herbal Units in 2011, both after KNUST's programme in 2001. GHAFTRAM was formed in 1999.", "Incorrect, because GHAFTRAM was formed in 1999 which is before 2001.", "Incorrect, GHAFTRAM was formed in 1999."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q102", "difficulty": "hard", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — IKA, slide 44", "qc": "Which of the following bodies or entities are explicitly cited as being engaged in clinical research, collaborative research, or managing clinics for herbal medicines in Ghana? I. Noguchi Memorial Institute of Medical Research (NMIMR-LEGON) II. CPMR's Clinic manned by medical herbalists III. University researchers collaborating with CPMR", "options": ["I only", "I and II only", "II and III only", "I, II and III"], "correct_index": 3, "explanations": ["Incorrect, II and III are also mentioned on slide 44.", "Incorrect, III is also explicitly mentioned.", "Incorrect, I is also explicitly mentioned.", "Correct, all three entities (NMIMR, CPMR clinic with medical herbalists, and university researchers collaborating with CPMR) are directly cited on slide 44."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q103", "difficulty": "devil", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — Principles_Methods_TM, slide 3", "qc": "According to the provided definition of Traditional Medicine (TM) by Fokunang et al. (2011) and WHO (2023), which of the following elements are explicitly integrated into its framework? I. Knowledge and skills based on indigenous theories II. Explicability of all practices to modern scientific laws III. Experiences indigenous to local cultures IV. Application in diagnosis, prevention, and treatment", "options": ["I, II, and III only", "I, III, and IV only", "II, III, and IV only", "All of the above"], "correct_index": 1, "explanations": ["Incorrect because the definition explicitly states 'whether explicable or not', invalidating the requirement for scientific explicability.", "Correct because the definition includes knowledge, skills, indigenous theories, experiences, and use in diagnosis, prevention, improvement or treatment, while explicitly noting practices can be explicable or not.", "Incorrect because element II contradicts the 'whether explicable or not' clause in the official slide definition.", "Incorrect because element II is false based on the text."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q104", "difficulty": "hard", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — Principles_Methods_TM, slide 7", "qc": "Assertion: Archaeological and pre-historic records have successfully determined the exact point in time when mankind started using traditional medicine. Reason: Biblical references such as Genesis 1:29 and Ezekiel 47:12 provide console regarding when man started using plants.", "options": ["Both Assertion and Reason are true and the Reason is the correct explanation of the Assertion.", "Both Assertion and Reason are true, but the Reason is not the correct explanation of the Assertion.", "The Assertion is false, but the Reason is true.", "Both Assertion and Reason are false."], "correct_index": 2, "explanations": ["Incorrect because the Assertion is entirely false.", "Incorrect because the Assertion is false, making a joint truth-relation invalid.", "Correct because slide 7 explicitly states that archaeological and pre-historic records have *failed* to determine when man started TM, making the assertion false, while confirming we take consolation from the Bible (Genesis 1:29; Ezekiel 47:12), making the reason true.", "Incorrect because the Reason is supported by the slide."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q105", "difficulty": "devil", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — Principles_Methods_TM, slide 4", "qc": "Which of the following environmental and cultural factors shape the philosophy and practices of traditional medicine according to the general principles? I. Geographic area where it originated II. Prevailing conditions of the local environment III. Universal standardized global pharmaceutical protocols IV. Indigenous beliefs passed down through generations", "options": ["I and II only", "I, II, and IV only", "II, III, and IV only", "All of the above"], "correct_index": 1, "explanations": ["Incorrect because it omits element IV (indigenous beliefs), which is explicitly listed in slide 4.", "Correct because slide 4 specifies that philosophy and practices are influenced by geographic area, environment, and prevailing conditions, and are based on indigenous beliefs, experiences, and skills passed down through generations. Universal pharmaceutical protocols are not a TM environmental influence.", "Incorrect because element III refers to modern standardized pharmacy, which contradicts the locally-grounded nature of TM.", "Incorrect because element III is incorrect."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q106", "difficulty": "hard", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — Principles_Methods_TM, slide 5", "qc": "Assertion: Traditional me ibutes 20th-century experimental findings to it.", "Incorrect. The assertion is fully supported by slide 8."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q167", "difficulty": "devil", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — Taxonomy, slide 8", "qc": "According to slide 8, which scientific disciplines appreciably influenced experimental taxonomy in the 20th century alongside morphological distinctness and affinity?", "options": ["Cytology, genetics, anatomy, physiology, and embryology.", "Molecular phylogenetics, biogeography, nomenclature, and systematic inventory.", "Gross morphology only, completely excluding cytology and genetics.", "Systematic classification, classical nomenclature, and historical taxonomy."], "correct_index": 0, "explanations": ["Correct. Slide 8 explicitly states that experimental taxonomy was influenced by the findings of cytologists, geneticists, anatomists, physiologists, and embryologists.", "Incorrect. These fields are not the specific disciplines listed as influencing 20th-century experimental taxonomy on slide 8.", "Incorrect. Gross morphology alone defines descriptive taxonomy, whereas experimental taxonomy integrated multiple biological sciences.", "Incorrect. These are taxonomic components and principles, not the specific influencing disciplines listed for experimental taxonomy."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q168", "difficulty": "devil", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — Taxonomy, slide 8", "qc": "Assertion: The transition from descriptive taxonomy to experimental taxonomy marked a shift from 19th-century gross morphological observation to 20th-century multi-disciplinary biological integration. Reason: Morphological distinctness and affinity were completely discarded and rendered irrelevant during the formulation of experimental taxonomy in the 20th century.", "options": ["Both assertion and reason a ly", "II, III, and IV only", "I, II, III, and IV"], "correct_index": 0, "explanations": ["Correct because slide 17 lists massage/manipulation for labor, herbal remedies for labor/pain/postnatal recovery, and spiritual rituals for protection.", "Incorrect because herbal remedies are used for labor and pain, not solely postnatal recovery.", "Incorrect because statement II incorrectly restricts herbal remedies solely to postnatal recovery.", "Incorrect because statement II is false based on the slide."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q204", "difficulty": "hard", "section": "Just in case 😆 — assertion-reason", "qt": "assertion-reason", "source": "BHM 151 — Traditional_Medicine_Africa, slide 19", "qc": "Assertion: Any random natural object found in the forest can immediately function as a fetish in West African traditional spirituality. \nReason: A fetish is defined strictly as an object believed to possess spiritual powers or energies that are often created and consecrated by spiritual leaders or priests.", "options": ["Both assertion and reason are true, and the reason is the correct explanation of the assertion.", "Both assertion and reason are true, but the reason is not the correct explanation of the assertion.", "The assertion is true, but the reason is false.", "The assertion is false, but the reason is true."], "correct_index": 3, "explanations": ["Incorrect because the assertion is false.", "Incorrect because the assertion is false.", "Incorrect because random objects without consecration or belief do not fit the formal definition provided.", "Correct because slide 19 states fetishes are objects often created and consecrated by spiritual leaders or priests, making the bare assertion false while the reason is true."], "mid": "bhmBonus"}, {"tag": "BHM151-BONUS·Q205", "difficulty": "devil", "section": "Just in case 😆 — multiple completion", "qt": "multiple completion", "source": "BHM 151 — Traditional_Medicine_Africa, slide 18", "qc": "Examine the found /* ====== SOUND (WebAudio synth — no assets needed) ====== */
let AC=null;
const initAC=()=>{if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(_){AC=null}};
function beep(f,d,type,g,delay=0){
 if(!AC||!set.sound)return;
 try{const t=AC.currentTime+delay,o=AC.createOscillator(),v=AC.createGain();
 o.type=type||"sine";o.frequency.setValueAtTime(f,t);
 v.gain.setValueAtTime(0.0001,t);v.gain.linearRampToValueAtTime((g||.12)*set.vol,t+.012);
 v.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(_){/**/}
}
const sfx={tap:()=>beep(520,.05,"square",.07),
 ok:()=>{beep(660,.09,"sine",.14);beep(880,.16,"sine",.11,.09)},
 no:()=>{beep(150,.26,"sawtooth",.12)},
 streak:()=>{beep(523,.09,"sine",.13);beep(659,.09,"sine",.13,.09);beep(784,.14,"sine",.13,.18)},
 done:()=>{[523,659,784,1046].forEach((f,i)=>beep(f,.16,"sine",.13,i*.13))},
 exit:()=>{beep(392,.2,"sine",.1);beep(262,.3,"sine",.1,.18)}};

/* ====== EUPHEME voice packs ====== */
const PLAIN={ok:"Correct.",no:"Not quite."};
const stripNote=s=>String(s).replace(/\s*\([^()]*\)\s*$/,"");
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pools=new Map(),lastLine=new Map();
function packDraw(pack,slot,arr){
 const key=pack+":"+slot;let pool=pools.get(key);
 if(!pool||!pool.length){
  pool=shuffle(arr.slice());
  const last=lastLine.get(key);
  if(last&&pool.length>1){pool=pool.filter(l=>l!==last);pool.push(last)}
  pools.set(key,pool)}
 const line=pool.shift();lastLine.set(key,line);return line;
}
const streakSlot=n=>n>=19?"streak19plus":n>=11?"streak11_18":n===10?"streak10":n>=7?"streak7_9":n>=5?"streak5_6":n>=3?"streak3_4":"streak1_2";
const packByNum=n=>PACKS.find(p=>p.num===n);
function ePack(){
 if(set.pack>=1&&set.pack<=PACKS.length)return packByNum(set.pack);
 if(set.pack===999)return packByNum(1+Math.floor(Math.random()*PACKS.length));
 return null}
function eupOk(q,streak){
 const p=ePack();if(!p)return null;
 const sl=p.slots;let slot;
 if(q.easyMiss&&Math.random()<.25)slot="easyMiss";
 else if(q.difficulty==="hard"||q.difficulty==="devil")slot="hardCorrect";
 else slot=streakSlot(streak);
 let line=packDraw(p.num,slot,sl[slot]||[])||PLAIN.ok;line=stripNote(line);
 if(slot==="streak11_18"&&line.includes(", ")){const notes=line.split(/,\s?/);line=notes[(streak-11)%notes.length]}
 return line}
function eupNo(q,attempt,broken,recovering){
 const p=ePack();if(!p)return null;
 const sl=p.slots;let slot;
 if(recovering)slot="recovering";
 else if(broken)slot="streakBroken";
 else slot=attempt===1?"wrong1":attempt===2?"wrong2":attempt===3?"wrong3":"wrong4plus";
 let line=stripNote(packDraw(p.num,slot,sl[slot]||[])||PLAIN.no);
 if(slot==="wrong4plus"&&attempt>3&&/slides again/i.test(line)){
  line="I think you should "()+"really ".repeat(attempt-4)+"read the slides again."}
 return line}
function gradeLine(g){
 const p=ePack();if(!p)return null;
 const gr=p.slots.grades;const v=gr&&gr[g];return v?stripNote(v):null;
}

function loadSave(mid){return LS.g("save_"+mid,null)}
function delSave(mid){LS.d("save_"+mid)}
const savesAll=()=>[{id:"ALL"},...MODS].map(m=>({mid:m.id,save:loadSave(m.id)})).filter(x=>x.save);
function newRun(mid,sectionIdx){
 ROOM_LOADED="";
 const m=modOf(mid);
 const k=sectionIdx===undefined?-1:sectionIdx;
 const sec=(m.sections||[])[k];
 const list=[];
 if(!sec){for(let i=m.first;i<m.first+m.count;i++)list.push(i)}
 else{for(let i=m.first+sec.from;i<m.first+sec.from+sec.count;i++)list.push(i)}
 R={mid,label:(sec&&sec.name)||"Full "+(mid==="ALL"?"mix":"module"),mode:"",secIdx:k,i:0,far:0,
    a:list.map(()=>null),cs:0,ws:0,msg:"",end:0,rv:null,done:false,list,flags:{},started:Date.now()};
}
function resumeRun(mid){
 const d=loadSave(mid);if(!d)return false;
 const m=modOf(mid);
 const list=[];
 if(Array.isArray(d.order)&&d.order.length&&d.order.every(i=>Number.isInteger(i)&&i>=m.first&&i<m.first+m.count)){
   d.order.forEach(i=>list.push(i))}
  else if(Number.isInteger(d.q0)&&d.q1>d.q0&&d.q0>=m.first&&d.q1<=m.first+m.count){
   for(let i=d.q0;i<d.q1;i++)list.push(i)}
  else{for(let i=m.first;i<m.first+m.count;i++)list.push(i)}
 const a=Array.isArray(d.a)&&d.a.length===list.length?d.a:list.map(()=>null);
 R={mid,label:d.label||"Full module",mode:d.mode||"explain",secIdx:Number.isInteger(d.sec)?d.sec:-1,
    i:Math.min(d.i||0,list.length-1),far:Math.min(d.far||0,list.length-1),a,cs:d.cs||0,ws:d.ws||0,
    msg:d.msg||"",end:d.end||0,rv:null,done:false,list,started:Date.now(),flags:d.flags||{}};
 screen="quiz";
 if(R.end&&R.end<Date.now()){clearInterval(T);screen="results"}
 else if(R.end){clearInterval(T);T=setInterval(tick,1000)}
 draw(1);return true;
}
function finishRun(){
 R.done=true;delSave(R.mid);
 let s=0;R.a.forEach((a,i)=>{if(a===QALL[R.list[i]].correct_index)s++});
 const n=R.list.length,p=Math.round(s/n*100);
 const entries=LS.g("board",[]);
 entries.push({mid:R.mid,sec:R.label,name:set.name||"Guest",score:s,n,pct:p,mode:R.mode==="explain"?"Explain":"Exam",at:Date.now()});
 while(entries.length>400)entries.shift();
 LS.s("board",entries);
 return {s,p};
}

/* ====== FEEDBACK (EUPHEME + sound) ====== */
function judge(q,ok){
 let line=null;
 if(ok){
  const pw=R.ws,n=R.cs+1;
  R.cs=n;R.ws=0;
  if(pw>=RECOVER_MIN){
   line=eupNo(q,n,n<1?1:n,"",true);
   if(set.sound)sfx.streak();
   return line||PLAIN.ok;
  }
  line=eupOk(q,n);
  if(set.sound){sfx.ok();if(n===10||n===19)sfx.streak()}
  return line||PLAIN.ok;
 }
 const attempt=R.ws+1,pc=R.cs,broken=pc>=BREAK_MIN;
 R.ws=attempt;R.cs=0;
 line=eupNo(q,attempt,broken,false);
 if(set.sound)sfx.no();
 return line||PLAIN.no;
}

    "#cdCoachCard button{cursor:pointer;border-radius:8px;border:1px solid #d4af37;background:transparent;color:#d4af37;font-weight:700;padding:6px 12px;font-size:12px}" +
    "#cdCoachCard button.main{background:#d4af37;color:#12161d}" +
    "#cdCoachCard .cArr{position:absolute;width:0;height:0;border:10px solid transparent;pointer-events:none}";
  document.head.appendChild(st);
  var hole = document.createElement("div"); hole.id = "cdCoachHole"; document.body.appendChild(hole);
  var card = document.createElement("div"); card.id = "cdCoachCard"; document.body.appendChild(card);
  var steps = [], i = 0, key = null, onEnd = null;
  function measure(s) {
    var el = s && s.sel ? document.querySelector(s.sel) : null;
    if (!el) return null;
    var r = el.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return null;
    if (r.bottom < 0 || r.top > innerHeight || r.right < 0 || r.left > innerWidth) return null;
    return r;
  }
  function draw() {
    var s = steps[i];
    if (!s) return end();
    if (s.if && !s.if()) { i++; draw(); return; }
    if (s.onEnter) { try { s.onEnter(); } catch (e) {} }
    var r = measure(s);
    card.style.display = "block";
    var last = i === steps.length - 1;
    var dots = steps.map(function (_, k) { return '<span style="opacity:' + (k === i ? 1 : .28) + '">●</span>'; }).join(" ");
    card.innerHTML =
      '<div class="cdots">' + dots + '</div>' +
      '<h4>' + esc(s.t) + '</h4>' +
      '<p>' + s.h + '</p>' +
      '<div class="cbtns"><span class="ct">' + (i + 1) + ' / ' + steps.length + '</span>' +
      (i > 0 ? '<button id="cdPrev">Back</button>' : '<button id="cdSkip">Skip tour</button>') +
      '<button class="main" id="cdNext">' + (last ? "Done" : "Next") + '</button></div>';
    var old = card.querySelector(".cArr"); if (old) old.remove();
    var cw = Math.min(430, innerWidth - 24);
    card.style.width = cw + "px";
    if (!r) {
      hole.classList.add("dim"); hole.style.display = "block";
      card.style.top = "12px"; card.style.transform = "translateX(-50%)";
      return;
    }
    var cw2 = Math.min(430, innerWidth - 24);
    card.style.width = cw2 + "px";
    hole.classList.remove("dim"); hole.style.display = "block";
    hole.style.left = (r.left - 6) + "px"; hole.style.top = (r.top - 6) + "px";
    hole.style.width = (r.width + 12) + "px"; hole.style.height = (r.height + 12) + "px";
    var ch = card.offsetHeight;
    var preferAbove = r.top + r.height / 2 > innerHeight / 2;
    var top;
    if (preferAbove && r.top - ch - 20 >= 8) { top = r.top - ch - 12; }
    else if (r.bottom + 12 + ch <= innerHeight - 8) { top = r.bottom + 12; }
    else if (preferAbove) { top = Math.max(8, innerHeight - ch - 8); }
    else { top = Math.min(r.bottom + 12, innerHeight - ch - 8); }
    top = Math.min(Math.max(top, 8), Math.max(8, innerHeight - ch - 8));
    card.style.top = top + "px";
    card.style.transform = "translateX(-50%)";
    var arr = document.createElement("div"); arr.className = "cArr"; card.appendChild(arr);
    var cardLeft = (innerWidth - cw2) / 2;
    var ax = Math.min(Math.max(r.left + r.width / 2 - cardLeft - 10, 8), cw2 - 28) + "px";
    if (top >= r.bottom) { arr.style.bottom = "100%"; arr.style.borderBottomColor = "#d4af37"; }
    else { arr.style.top = "100%"; arr.style.borderTopColor = "#d4af37"; }
    arr.style.left = ax;
  }
  function end() {
    try { localStorage.setItem("cdcoach:" + (key || "x"), "1"); } catch (e) {}
    hole.style.display = "none"; card.style.display = "none"; try { window.CDCoachActive = false; } catch (e) {}
    var f = onEnd; onEnd = null; if (f) f();
  }
  card.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    if (b.id === "cdNext") { i++; if (i >= steps.length) end(); else draw(); }
    else if (b.id === "cdPrev") { if (i > 0) { i--; draw(); } }
    else if (b.id === "cdSkip") { end(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && card.style.display === "block") end();
  });
  addEventListener("resize", function () { if (card.style.display === "block") draw(); });
  addEventListener("scroll", function () { if (card.style.display === "block") draw(); }, true);
  window.CDCoach = {
    start: function (k, def, cb) { key = k; steps = def.steps; i = 0; onEnd = cb || null; try { window.CDCoachActive = true; } catch (e) {} draw(); },
    maybe: function (k, def, cb) {
      var seen = null; try { seen = localStorage.getItem("cdcoach:" + k); } catch (e) {}
      if (!seen) this.start(k, def, cb);
    },
    stop: end
  };
})();
