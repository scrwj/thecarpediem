estern healing methods", "A 48-bed facility dedicated entirely to faith-based charismatic healing", "A university teaching hospital exclusively focused on training cosmologists", "A traditional herbal production factory regulated by international laws"], "correct_index": 0, "explanations": ["Slide 31 explicitly states Kwa-Mhlanga features a 48-bed hospital combining TAM with Western healing methods.", "It combines TAM with Western methods, not dedicated solely to charismatic healing.", "It is a hospital combining healing methods, not an exclusive cosmology training facility.", "It is described as a hospital combining healing methods, not a production factory."], "mid": "bhm06"}, {"tag": "BHM151·Q280", "difficulty": "devil", "section": "Traditional European Medicine", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 33", "qc": "A researcher analyzing Traditional European Medicine (TEM) notes its extensive historical timeline. Which specific deduction can be made regarding the structural scope and foundational texts of TEM based on the historical trajectory provided?", "options": ["TEM is strictly limited to the healing practices documented exclusively during the active life of Saint Hildegard von Bingen.", "TEM encompasses a continuous historical evolution starting with Hippocrates and extending into the current era, featuring regionally popular branches like Hildegard medicine.", "Hildegard medicine represents the foundational root from which Hippocrates derived the core concepts of ancient Greek medicine.", "The texts Physica and Causae et curae exclusively document the healing practices of ancient Greece prior to the medieval era."], "correct_index": 1, "explanations": ["Incorrect, as TEM spans from Hippocrates in ancient Greece to the current era, not limited to Hildegard.", "Correct, because slide 33 states TEM consists of various approaches beginning with Hippocrates and ending in the current era, including German Hildegard medicine.", "Incorrect, because Hippocrates lived long before Saint Hildegard von Bingen (1098–1179).", "Incorrect, because Physica and Causae et curae are medical writings of Saint Hildegard von Bingen, who lived in the medieval period, not ancient Greece."], "mid": "bhm06"}, {"tag": "BHM151·Q281", "difficulty": "hard", "section": "Traditional European Medicine", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 33", "qc": "An ethnobotanist is studying Saint Hildegard von Bingen's contributions to Traditional European Medicine. Based on her documented works, what specific materia medica scope is attributed to her medical writings?", "options": ["She documented the medicinal properties of approximately 300 herbs across her texts Physica and Causae et curae.", "She focused exclusively on synthetic drug alternatives derived from European flora.", "She cataloged exactly 300 mineral compounds in her treatise Causae et curae.", "She relied solely on the oral traditions of ancient Greece without producing written records of herbs."], "correct_index": 0, "explanations": ["Correct, as slide 33 notes she documented the medicinal properties of some 300 herbs in her medical writings including Physica and Causae et curae.", "Incorrect, because synthetic drugs are a modern alternative, whereas Hildegard utilized herbs.", "Incorrect, because her writings focused on the medicinal properties of approximately 300 herbs, not mineral compounds.", "Incorrect, because she explicitly documented her findings in medical writings like Physica and Causae et curae."], "mid": "bhm06"}, {"tag": "BHM151·Q282", "difficulty": "devil", "section": "Traditional Medicine in the Americas", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 34", "qc": "In an ethnobotanical evaluation of Native American and Alaska Native healing practices, specific tribal preparations are linked to particular ailments. Which of the following accurately pairs a tribe with its specific botanical preparation and target indication?", "options": ["The Comanche people used a berry root decoction to treat tired or infected eyes.", "The Prairie Potawatomi tribe used a berry tea to soothe sore throats.", "The Comanche people used a berry tea to soothe sore throats.", "Alaska Native healers utilized synthetic eye drops derived from indigenous plant shapes."], "correct_index": 2, "explanations": ["Incorrect, because the Comanche used a berry tea, whereas the root decoction was used by the Prairie Potawatomi.", "Incorrect, because the Prairie Potawatomi used a berry root decoction for eyes, while the Comanche used berry tea for sore throats.", "Correct, as slide 34 explicitly states that the Comanche people used a berry tea to soothe sore throats.", "Incorrect, because synthetic eye drops are not mentioned and contradict indigenous practices."], "mid": "bhm06"}, {"tag": "BHM151·Q283", "difficulty": "hard", "section": "Traditional Medicine in the Americas", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 34", "qc": "When examining the diagnostic and selection criteria employed by indigenous healers in North America, how did they ascertain the potential medicinal utility of a plant?", "options": ["By isolating active chemical compounds using modern chromatographic techniques.", "By evaluating physical characteristics such as a plant's shape, smell, colour, and taste.", "By conducting randomized clinical trials within spiritual community circles.", "By relying exclusively on written texts inherited from ancient Greek physicians."], "correct_index": 1, "explanations": ["Incorrect, as chromatographic isolation is a modern scientific method, not an indigenous diagnostic practice.", "Correct, because slide 34 states that healers in indigenous communities would consider a plant's shape, smell, colour, and taste to determine its use.", "Incorrect, because randomized clinical trials are part of modern evidence-based medicine, not traditional indigenous selection.", "Incorrect, because indigenous American healers relied on their own traditional empirical methods, not ancient Greek texts."], "mid": "bhm06"}, {"tag": "BHM151·Q284", "difficulty": "hard", "section": "Current Situation Worldwide", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 35", "qc": "Considering the global transition and interaction between traditional systems and modern pharmacology, what status do plants hold in contemporary drug development according to current trends?", "options": ["Plants have become completely obsolete due to the dominance of lucrative synthetic alternatives.", "Plants remain an indispensable resource from which even synthetic drug alternatives are derived.", "Plants are now only used as flavoring agents while all active drugs are purely synthetic.", "Plants are no longer studied because modern science has exhausted all possibilities for drug discovery."], "correct_index": 1, "explanations": ["Incorrect, because slide 35 explicitly states that plants remain an indispensable resource despite synthetic alternatives.", "Correct, as slide 35 notes that plants remain the indispensable resource from which even synthetic alternatives are derived.", "Incorrect, because synthetic alternatives are frequently derived from plant resources.", "Incorrect, because slide 35 states that by combining traditional knowledge with modern science, possibilities for drug discovery seem endless."], "mid": "bhm06"}, {"tag": "BHM151·Q285", "difficulty": "devil", "section": "Traditional Medicine in the Americas", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 34", "qc": "Which sociological and functional attribute characterized the primary medical practitioners within traditional Native American and Alaska Native communities?", "options": ["They operated strictly as secular pharmacologists separated from any spiritual or religious hierarchy.", "They were frequently regarded as spiritual or religious leaders within their communities.", "They functioned exclusively as commercial traders of imported European herbal remedies.", "They were appointed by colonial authorities to manage public health outbreaks."], "correct_index": 1, "explanations": ["Incorrect, because they were not secular pharmacologists; they held spiritual roles.", "Correct, as slide 34 states that healers in indigenous communities were often considered spiritual or religious leaders.", "Incorrect, because their practice was rooted in indigenous healing traditions, not commercial trade of European remedies.", "Incorrect, because their status arose from indigenous community structures, not colonial appointments."], "mid": "bhm06"}, {"tag": "BHM151·Q286", "difficulty": "hard", "section": "Current Situation Worldwide", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 35", "qc": "Why have plants historically served as such a critical foundational resource for both traditional and modern medical systems since the dawn of mankind?", "options": ["Due to their natural abundance and widespread availability across diverse environments.", "Because early human civilizations possessed advanced laboratory equipment to synthesize complex molecules.", "Because traditional healers refused to use any non-plant materials under strict religious edicts.", "Because synthetic drugs were invented first and plants were subsequently discovered as cheaper substitutes."], "correct_index": 0, "explanations": ["Correct, because slide 35 attributes the crucial resource status of plants to their abundance since the dawn of mankind.", "Incorrect, because early human civilizations did not possess advanced laboratory equipment for synthesis.", "Incorrect, because traditional practices utilized various resources; the slide highlights plant abundance as the key factor.", "Incorrect, because synthetic drugs emerged long after plants were utilized as primary medical resources."], "mid": "bhm06"}, {"tag": "BHM151·Q287", "difficulty": "hard", "section": "Current Situation Worldwide", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 35", "qc": "According to current global perspectives on healthcare integration, what synergistic outcome is projected when traditional medicinal practices merge with modern science?", "options": ["A complete eradication of traditional practices in favor of standardized industrial synthesis.", "Endless possibilities for novel drug discovery and the expanded therapeutic use of plants for diverse conditions.", "A reduction in the efficacy of natural medicines due to scientific interference.", "The restriction of plant-based treatments to experimental laboratories only."], "correct_index": 1, "explanations": ["Incorrect, because the integration aims to combine knowledge rather than eradicate traditional practices.", "Correct, as slide 35 states that combining traditional knowledge with modern science creates endless possibilities for drug discovery and plant use.", "Incorrect, because science is shown to enhance and validate therapeutic potential rather than reduce efficacy.", "Incorrect, because the text indicates broader therapeutic application across a wide array of conditions."], "mid": "bhm06"}, {"tag": "BHM151·Q288", "difficulty": "devil", "section": "References and Literature", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 36", "qc": "Slide 36 compiles various scholarly references and contributors to traditional medicine discourse (such as Addy, Fokunang et al., and the WHO). What is the primary academic function of presenting this specific array of citations within the context of a lecture on traditional medicine principles?", "options": ["To provide empirical proof that traditional medicine has no historical overlap with modern scientific literature.", "To substantiate the academic, institutional, and global literature base supporting traditional medicine research and documentation.", "To restrict the definition of traditional medicine strictly to African research frameworks.", "To list patent holders for synthetic drugs derived from indigenous plant species."], "correct_index": 1, "explanations": ["Incorrect, because these citations link traditional medicine to robust academic and institutional literature, not isolation from it.", "Correct, because slide 36 lists foundational authors, journals (like Afr J Tradit Complement Altern Med), and organizations (WHO) that validate the academic study of traditional medicine.", "Incorrect, because the slide includes international sources alongside African authors like Marian Ewurama Addy and Fokunang.", "Incorrect, because these are academic researchers and organizational bodies, not commercial patent holders."], "mid": "bhm06"}, {"tag": "BHM151·Q289", "difficulty": "hard", "section": "Historical Use of Materials as Drugs", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 4", "qc": "What historical limitation currently hinders the precise determination of when humans initiated the use of plants as medicine?", "options": ["Archaeological records and pre-historic findings lack definitive evidence to pinpoint the exact starting period.", "Early human civilizations systematically destroyed all written records of herbal usage.", "The neolithic revolution completely erased all botanical artifacts preserved in primitive communities.", "Accidental human responses were never documented prior to the invention of writing."], "correct_index": 0, "explanations": ["Slide 4 states that pre-historic and archaeological records have not been able to determine when man started using plants as medicine.", "There is no mention in the slides that early civilizations systematically destroyed their written records.", "The neolithic revolution is assumed as a potential starting point, not something that erased botanical artifacts.", "Oral transmission preceded writing in primitive societies, and accidental responses did lead to identification."], "mid": "bhm07"}, {"tag": "BHM151·Q290", "difficulty": "devil", "section": "Historical Use of Materials as Drugs", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 4", "qc": "Which specific cultural or societal transition is logically assumed to mark the potential beginning of human plant medicine use alongside domestication?", "options": ["The industrial revolution and the mass production of synthetic drugs", "The neolithic revolution involving the domestication of plants and animals in primitive communities", "The invention of cuneiform writing on clay tablets in Mesopotamian city-states", "The compilation of the Pen Tsao during the Han Dynasty by Emperor Shen Nung"], "correct_index": 1, "explanations": ["The industrial revolution is far too modern and concerns synthetic drugs, not the historical origin.", "Slide 4 explicitly assumes plant medicine use might have begun with the neolithic revolution when domestication was initiated.", "Cuneiform writing came much later during early civilizations, long after initial plant use may have started.", "The Pen Tsao dates to the Han Dynasty, well after the assumed pre-historic neolithic beginnings."], "mid": "bhm07"}, {"tag": "BHM151·Q291", "difficulty": "hard", "section": "Historical Use of Materials as Drugs", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 4", "qc": "How were materials with pharmacological action initially identified by early humans according to the historical overview?", "options": ["Through systematic clinical trials conducted on animal models in primitive laboratories", "Through careful observations and sometimes accidental human responses to earth, plant, and animal parts", "Through direct chemical extraction and isolation techniques developed during the neolithic period", "Through divine revelation recorded exclusively in cuneiform clay tablets"], "correct_index": 1, "explanations": ["Clinical trials and laboratories are modern scientific constructs not present in primitive societies.", "Slide 4 attributes the identification of pharmacological action to careful observations and sometimes accidental human responses.", "Chemical extraction and isolation are modern scientific developments, not neolithic practices.", "Divine revelation is not mentioned in the slides as the method of identification."], "mid": "bhm07"}, {"tag": "BHM151·Q292", "difficulty": "devil", "section": "Historical Use of Materials as Drugs", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 5", "qc": "What distinct behavioral evidence from early civilizations confirms that plants held significance beyond mere nutritional value?", "options": ["Plants were utilized in burials and other rituals without forming part of the usual diet.", "Plants were exclusively cultivated as staple crops to sustain expanding populations.", "Minerals and animal parts were strictly prohibited from being used alongside plants.", "Plants were chemically analyzed to isolate active principles before consumption."], "correct_index": 0, "explanations": ["Slide 5 notes that early civilizations used plants in burials and rituals, and that they did not form part of their usual diet.", "The slide explicitly states these materials did not form part of their usual diet, refuting staple crop cultivation.", "Slide 5 mentions minerals, plants, and animal parts were all used to treat illness.", "Chemical analysis to isolate active principles is a modern scientific process, not an early civilization behavior."], "mid": "bhm07"}, {"tag": "BHM151·Q293", "difficulty": "hard", "section": "Knowledge Base of Cultures", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 6", "qc": "In the evolution of cultural knowledge bases as described in the slides, how did the introduction of 'writing' alter information preservation?", "options": ["It completely replaced oral transmission, rendering previous practices obsolete.", "It served as a supplement to orally transmitted knowledge rather than an immediate replacement.", "It marked the exact moment primitive societies began collecting information methodically.", "It restricted the collection of data strictly to academic institutions."], "correct_index": 1, "explanations": ["Writing did not completely replace oral transmission immediately; the slide states it supplemented it.", "Slide 6 explicitly notes that with time, writing was invented and orally transmitted knowledge became supplemented with reading.", "Information was already carefully and methodically collected even in primitive societies before writing.", "Academic institutions are not referenced in the slide regarding the invention of writing."], "mid": "bhm07"}, {"tag": "BHM151·Q294", "difficulty": "devil", "section": "Knowledge Base of Cultures", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 6", "qc": "When did methodical and careful collection of information regarding therapies first manifest according to cultural history?", "options": ["Only after the invention of reading and writing systems", "Even in primitive societies, built upon practices and experiences", "Exclusively during the Tang Dynasty in ancient China", "Following the modern style of drug discovery processes"], "correct_index": 1, "explanations": ["Writing came later to supplement knowledge; information was already collected prior to its invention.", "Slide 6 explicitly states that 'even in primitive societies information was carefully and methodically collected' from practices and experiences.", "The Tang Dynasty occurred much later in history relative to the origin of primitive knowledge bases.", "Modern drug discovery is a contemporary framework, whereas primitive societies gathered foundational knowledge long before."], "mid": "bhm07"}, {"tag": "BHM151·Q295", "difficulty": "hard", "section": "Plant Medicine Through Cultures", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 7", "qc": "What distinguishes the contribution of Yaoxing Lun from that of the Pen Tsao in Chinese medical history?", "options": ["Yaoxing Lun was written during the Tang Dynasty in the 7th century as a succeeding addition, whereas Pen Tsao was the first herbal written earlier.", "Yaoxing Lun was the original text containing three hundred and sixty-five medicinal plants, while Pen Tsao was a modern revision.", "Yaoxing Lun was authored by Emperor Shen Nung, whereas Pen Tsao was written by Charaka and Sushruta.", "Yaoxing Lun replaced the Pen Tsao by completely refuting its list of medicinal plants."], "correct_index": 0, "explanations": ["Slide 7 notes that Emperor Shen Nung wrote the Pen Tsao, and succeeding generations added to this list until Yaoxing Lun ('Treatise on the Nature of Medicinal Herbs') was produced in the 7th century during the Tang Dynasty.", "The Pen Tsao contains the list of 365 medicinal plants, not the Yaoxing Lun.", "Emperor Shen Nung wrote the Pen Tsao, while Charaka and Sushruta were ancient Indian herbalists.", "Succeeding generations added to the list, rather than Yaoxing Lun refuting it."], "mid": "bhm07"}, {"tag": "BHM151·Q296", "difficulty": "devil", "section": "Plant Medicine Through Cultures", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 7", "qc": "During which specific historical dynasty and period was the Pen Tsao authored by Chinese Emperor Shen Nung?", "options": ["The Tang Dynasty in the 7th century AD", "The Han Dynasty (206 BC - 220 AD)", "The ancient Vedic period around 1000 BC", "The Mesopotamian period circa 3000 BC"], "correct_index": 1, "explanations": ["The Tang Dynasty is associated with the production of Yaoxing Lun in the 7th century, not the Pen Tsao.", "Slide 7 explicitly states that the Chinese Emperor Shen Nung of the Han Dynasty (206BC - 220AD) wrote the first Chinese herbal, the Pen Tsao.", "The Vedic period and 1000 BC relate to ancient Indian herbalists like Charaka and Sushruta.", "Mesopotamian city-states date to ca. 3000 BC, unrelated to Emperor Shen Nung."], "mid": "bhm07"}, {"tag": "BHM151·Q297", "difficulty": "hard", "section": "Plant Medicine Through Cultures", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 7", "qc": "Who were the ancient Indian herbalists credited with describing many herbs used in Ayurveda and 'Riveda' around 1000 BC?", "options": ["Shen Nung and Yaoxing Lun", "Charaka and Sushruta", "Sumerians and Stolz", "Akkad and Assyria"], "correct_index": 1, "explanations": ["Shen Nung and Yaoxing Lun are figures from Chinese medical history.", "Slide 7 explicitly states that herbs used in Ayurveda and 'Riveda' were described by ancient Indian herbalists Charaka and Sushruta in 1000 BC.", "Sumerians and Stolz are associated with Mesopotamian history and ephedrine synthesis.", "Akkad and Assyria are Mesopotamian city-states, not Indian herbalists."], "mid": "bhm07"}, {"tag": "BHM151·Q298", "difficulty": "hard", "section": "Plant Medicine in the Middle East", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 8", "qc": "Which ancient Mesopotamian civilizations documented diseases and treatments in cuneiform writing on clay around 3000 BC?", "options": ["Han and Tang Dynasties", "Akkad, Babylon, and Assyria", "Charaka and Sushruta's dynasties", "Neolithic primitive communities"], "correct_index": 1, "explanations": ["Han and Tang Dynasties belong to ancient Chinese history.", "Slide 8 states that the city states, Akkad, Babylon and Assyria (ca.3000 BC) wrote records of diseases and their treatments in cuneiform writing on clay.", "Charaka and Sushruta are ancient Indian herbalists, not Mesopotamian city-states.", "Neolithic communities pre-date the written cuneiform records of these city-states."], "mid": "bhm07"}, {"tag": "BHM151·Q299", "difficulty": "devil", "section": "Plant Medicine in the Middle East", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 8", "qc": "What is the chronological relationship between the traditional use of 'Ma Huang' and the isolation of its active principle, ephedrine?", "options": ["Ephedrine was synthesized in 1904, thousands of years after 'Ma Huang' was already being used as a crude extract in ancient cultures.", "Ma Huang was discovered as a crude extract in 1904 by Stolz, long after ephedrine was used by the Sumerians.", "Ma Huang and ephedrine were simultaneously discovered and synthesized during the Sumerian period circa 5,000 years ago.", "Ephedrine was isolated in 2800 BC, preceding the first recorded therapeutic use of Ma Huang by centuries."], "correct_index": 0, "explanations": ["Slide 8 notes Ma Huang was used as far back as 2800 BC, whereas Stolz synthesized ephedrine as late as 1904, confirming a massive chronological gap.", "Ma Huang was used far back in ancient cultures, not discovered in 1904 by Stolz (Stolz synthesized the active principle then).", "They were not simultaneous; synthesis occurred in 1904 while crude extract use dates back thousands of years prior.", "Ephedrine isolation in 1904 post-dates the ancient use of Ma Huang, not pre-dates it."], "mid": "bhm07"}, {"tag": "BHM151·Q300", "difficulty": "hard", "section": "Plant Medicine in the Middle East", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 8", "qc": "What specific botanical entity and scientific investigator are linked to the historical timeline of the active principle 'ephedrine'?", "options": ["Pen Tsao investigated by Emperor Shen Nung", "Ephedra vulgaris Rich [Ephedraceae] synthesized by Stolz", "Yaoxing Lun analyzed by Charaka and Sushruta", "Cuneiform clay records inscribed by Sumerians"], "correct_index": 1, "explanations": ["Pen Tsao and Emperor Shen Nung pertain to early Chinese herbalism, not ephedrine.", "Slide 8 specifies 'Ma Huang' as a crude extract prepared from Ephedra vulgaris Rich [Ephedraceae], and states Stolz synthesized the active principle, ephedrine, from it in 1904.", "Yaoxing Lun and the Indian herbalists are completely separate cultural traditions.", "Cuneiform clay records relate to general disease treatments in Mesopotamia, not the specific chemical synthesis of ephedrine."], "mid": "bhm07"}, {"tag": "BHM151·Q301", "difficulty": "devil", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 9", "qc": "Which specific botanicals and their respective families are directly cited in the Arabic medical treatise 'The Canon of Medicine' authored by Ibn-Sina?", "options": ["Henbane (Hyoscyamus niger L., Solanaceae) and Indian hemp (Cannabis sativa L., Cannabaceae)", "Willow bark (Salix alba L., Salicaceae) and liquorice (Glycyrrhiza spp., Fabaceae)", "Cinchona bark (Cinchona officinalis L., Rubiaceae) and mint (Mentha spp. L., Lamiaceae)", "Henbane (Hyoscyamus niger L., Solanaceae) and mint (Mentha spp. L., Lamiaceae)"], "correct_index": 0, "explanations": ["The slide explicitly states the drugs prescribed included henbane, Hyoscyamus niger L. (Solanaceae) and Indian hemp, Cannabis sativa L. (Cannabaceae).", "Willow bark is associated with Hippocrates in slide 11, not Ibn-Sina's Canon.", "Cinchona bark is noted in South America (slide 12) and mint in the Code of Hammurabi (slide 11).", "Mint is associated with the Code of Hammurabi in slide 11, not Ibn-Sina."], "mid": "bhm07"}, {"tag": "BHM151·Q302", "difficulty": "hard", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 10", "qc": "What is the primary quantitative significance of the Ebers Papyrus among preserved Egyptian manuscripts as presented in the lecture?", "options": ["It contains exactly 500 prescriptions composed solely of animal-derived products.", "It dates back to 1770 B.C. and outlines the laws governing medical practice.", "It contains 876 prescriptions made up of more than 500 different substances, including herbs.", "It was compiled by Dioscorides to document over 600 plant extracts used in European medicine."], "correct_index": 2, "explanations": ["The slide notes it contains many herbs and substances, not solely animal products, and specifies 876 prescriptions.", "The date 1770 B.C. and laws refer to the Code of Hammurabi on slide 11.", "The slide explicitly states it contains 876 prescriptions made up of more than 500 different substances, including many herbs.", "Dioscorides and 600 plants refer to De Materia Medica on slide 11."], "mid": "bhm07"}, {"tag": "BHM151·Q303", "difficulty": "devil", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 11", "qc": "According to the historical timeline of plant medicine in Europe, which text or code chronologically predates the Greek Herbal of Dioscorides and specifically mentions Glycyrrhiza spp. (Fabaceae)?", "options": ["The Canon of Medicine by Ibn-Sina", "The Corpus Hippocraticum by Hippocrates", "The Code of Hammurabi", "De Materia Medica"], "correct_index": 2, "explanations": ["The Canon of Medicine is an Arabic treatise from the 11th century AD (slide 9).", "Corpus Hippocraticum dates to 460 B.C. but mentions willow bark, not Glycyrrhiza spp. (slide 11).", "The Code of Hammurabi (1770 B.C.) explicitly mentions liquorice, Glycyrrhiza spp., (Fabaceae) alongside henbane and mint.", "De Materia Medica is by Dioscorides (ca. 77 AD), which this text predates."], "mid": "bhm07"}, {"tag": "BHM151·Q304", "difficulty": "hard", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 12", "qc": "Whose historical expedition and documentation efforts in Aztec ethnomedicine contributed plant species that were subsequently incorporated into modern pharmacopoeia?", "options": ["Dioscorides", "Francisco Hernández", "Paracelsus", "Hippocrates"], "correct_index": 1, "explanations": ["Dioscorides wrote De Materia Medica describing Greek/Mediterranean plants (slide 11).", "Francisco Hernández, physician to King Philip II of Spain, spent 1571–1577 compiling Aztec ethnomedicine in Mexico (slide 12).", "Paracelsus propounded the Doctrine of Signatures (slide 13).", "Hippocrates is the Greek doctor who prescribed willow bark (slide 11)."], "mid": "bhm07"}, {"tag": "BHM151·Q305", "difficulty": "devil", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 13", "qc": "How do contemporary scientific viewpoints contrast with traditional acceptance regarding the Doctrine of Signatures propounded by Paracelsus?", "options": ["Scientists validate the doctrine through rigorous clinical trials, whereas traditional healers reject it.", "Scientists have largely disregarded the idea, while many traditional healers continue to accept it.", "Both scientists and traditional healers universally accept the doctrine as a primary pharmacological mechanism.", "Both groups completely disregard the doctrine as an obsolete and unhelpful historical myth."], "correct_index": 1, "explanations": ["The slide explicitly notes the idea was disregarded by scientists, contradicting validation.", "The slide directly states: 'Idea disregarded by scientists' and 'Many traditional healers still accept it'.", "Scientists do not accept the doctrine, making universal acceptance false.", "Traditional healers still accept it according to the slide, so it is not completely disregarded by all groups."], "mid": "bhm07"}, {"tag": "BHM151·Q306", "difficulty": "devil", "section": "History of Herbal Medicine", "qt": "classification", "source": "BHM 151 — Role_of_Science_Herbalism, slide 14", "qc": "In the context of the Doctrine of Signatures associating plant or food morphology with human body parts, which pairing correctly matches the anatomical target specified on slide 14?", "options": ["Carrot and eye diseases", "Tomatoes and the pancreas", "Sweet potato and heart diseases", "Figs and the vascular system"], "correct_index": 0, "explanations": ["Slide 14 explicitly lists 'Carrot and eye diseases' as part of the visual signature correspondences.", "Slide 14 lists 'Tomatoes and Heart diseases', not the pancreas.", "Slide 14 lists 'Sweet potato and the pancreas', not heart diseases.", "Slide 14 lists 'Figs and the testes', while yarrow is matched to the vascular system."], "mid": "bhm07"}, {"tag": "BHM151·Q307", "difficulty": "hard", "section": "Originators of Therapies", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 15", "qc": "Which historical figure is specifically credited with establishing a classification system for illnesses and remedies, leading to the use of the term 'Galenical preparations'?", "options": ["Theophrastus", "Pliny", "Dioscorides", "Galen"], "correct_index": 3, "explanations": ["Theophrastus is cited as the founder of botany and ecology (slide 15).", "Pliny authored a major compendium of natural history (slide 15).", "Dioscorides authored De Materia Medica (slide 15).", "Galen (134-200 A.C.) is identified as an herbal practitioner who created a system for classifying illnesses/remedies and to whom 'Galenical preparations' is ascribed (slide 15)."], "mid": "bhm07"}, {"tag": "BHM151·Q308", "difficulty": "devil", "section": "Originators of Therapies", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 15", "qc": "Differentiate between the primary contributions of Theophrastus and Pliny as outlined in the origins of therapies.", "options": ["Theophrastus founded botany and ecology and described many plants, whereas Pliny compiled a major natural history compendium.", "Theophrastus wrote De Materia Medica, whereas Pliny served as the Father of medicine.", "Theophrastus created Galenical preparations, whereas Pliny founded ecology.", "Theophrastus authored the Ebers Papyrus, whereas Pliny discovered Cinchona bark."], "correct_index": 0, "explanations": ["Slide 15 assigns 'Founder of botany and ecology, described many plants' to Theophrastus and 'major compendium of natural history' to Pliny.", "De Materia Medica is ascribed to Dioscorides, and the Father of medicine is Hippocrates (slide 15, 11).", "Galenical preparations are ascribed to Galen, not Theophrastus (slide 15).", "The Ebers Papyrus is an Egyptian manuscript (slide 10) and Cinchona is from South America (slide 12)."], "mid": "bhm07"}, {"tag": "BHM151·Q309", "difficulty": "hard", "section": "Origins of Therapies", "qt": "classification", "source": "BHM 151 — Role_of_Science_Herbalism, slide 16", "qc": "According to the breakdown of animal sources used in therapy origins, which group correctly contains items categorized strictly as animal parts rather than whole animals or metabolic products?", "options": ["Birds, reptiles, and insects", "Shells, cowries, and claws", "Eggs, blood, and fat", "Honey, blood, and shells"], "correct_index": 1, "explanations": ["Birds, reptiles, and insects are listed under whole animal categories, not isolated anatomical parts.", "Slide 16 explicitly classifies shells, cowries, and claws under 'Animal parts'.", "Eggs, blood, and fat are classified under 'Animal products', not structural parts.", "Honey and blood are animal products, mixing categories with shells."], "mid": "bhm07"}, {"tag": "BHM151·Q310", "difficulty": "hard", "section": "Origins of Therapies", "qt": "classification", "source": "BHM 151 — Role_of_Science_Herbalism, slide 16", "qc": "Which specific geological and environmental materials are explicitly categorized under Earth/Mineral sources in the origins of therapies?", "options": ["Brown clay, white clay, and wasp nets", "Cowries, claws, and brown clay", "White clay, honey, and reptile parts", "Wasp nets, bird feathers, and white clay"], "correct_index": 0, "explanations": ["Slide 16 explicitly lists 'Brown clay', 'White clay', and 'Wasp nets' under Earth/Mineral sources.", "Cowries and claws are classified under animal parts, not earth/mineral sources.", "Honey and reptile parts belong to animal products and animal sources respectively.", "Bird feathers belong to animal sources, misclassifying the material group."], "mid": "bhm07"}, {"tag": "BHM151·Q311", "difficulty": "devil", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 11", "qc": "Comparing the historical records of Hippocrates and Dioscorides, what distinguishes their documented herbal contributions in Europe?", "options": ["Hippocrates described over 600 plants in De Materia Medica, while Dioscorides prescribed willow bark.", "Hippocrates prescribed willow bark for pain and wrote the Corpus Hippocraticum, while Dioscorides described over 600 plants in De Materia Medica.", "Hippocrates compiled Aztec ethnomedicine in Mexico, while Dioscorides authored the Code of Hammurabi.", "Hippocrates codified Arabic medical knowledge, while Dioscorides discovered Cinchona bark."], "correct_index": 1, "explanations": ["The attributes are swapped; Dioscorides wrote De Materia Medica and Hippocrates prescribed willow bark.", "Slide 11 accurately attributes willow bark extraction and the Corpus Hippocraticum to Hippocrates, and De Materia Medica (over 600 plants) to Dioscorides.", "Aztec ethnomedicine was compiled by Francisco Hernández (slide 12) and the Code of Hammurabi is ancient Mesopotamian law (slide 11).", "Ibn-Sina codified Arabic medical knowledge (slide 9) and Cinchona is South American (slide 12)."], "mid": "bhm07"}, {"tag": "BHM151·Q312", "difficulty": "devil", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 13, 15", "qc": "Contrast the foundational concepts introduced by Paracelsus versus Galen as outlined in the lecture slides.", "options": ["Paracelsus created a system for classifying illnesses and remedies, whereas Galen propounded the Doctrine of Signatures.", "Paracelsus propounded the Doctrine of Signatures based on plant appearances, whereas Galen created a system for classifying illnesses and remedies and inspired 'Galenical preparations'.", "Paracelsus compiled Aztec ethnomedicine, whereas Galen authored The Canon of Medicine.", "Paracelsus wrote the Ebers Papyrus, whereas Galen founded botany and ecology."], "correct_index": 1, "explanations": ["The contributions are reversed; Galen created the classification system and Paracelsus propounded the Doctrine of Signatures.", "Slide 13 links Paracelsus to the Doctrine of Signatures, and slide 15 links Galen to classifying illnesses/remedies and Galenical preparations.", "Francisco Hernández compiled Aztec medicine (slide 12) and Ibn-Sina authored The Canon (slide 9).", "The Ebers Papyrus is Egyptian (slide 10) and Theophrastus founded botany/ecology (slide 15)."], "mid": "bhm07"}, {"tag": "BHM151·Q313", "difficulty": "hard", "section": "Historical Therapies", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 17", "qc": "An indigenous community administers an extremely bitter, unpalatable concoction to a patient under the firm conviction that their illness stems from a moral transgression or external malevolent force. According to the historical therapy classification, which discovery framework does this practice exemplify?", "options": ["Trial and error discovery", "Accidental or serendipitous discovery", "Belief systems and superstition-based therapy", "Divination via spirit possession"], "correct_index": 2, "explanations": ["Incorrect; trial and error involves random plant experimentation rather than moral disease etiologies.", "Incorrect; serendipitous discovery refers to unexpected findings like penicillin or sildenafil.", "Correct; the slide explicitly attributes using something 'bad' or bitter to the belief that disease results from doing something bad or someone doing bad to you.", "Incorrect; divination specifically involves spirits, dwarfs, or dreams rather than administering bitter substances based on moral wrongdoings."], "mid": "bhm07"}, {"tag": "BHM151·Q314", "difficulty": "devil", "section": "Modern Drug Development", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 18", "qc": "A pharmaceutical candidate compound successfully passes initial chemical profiling but is ultimately abandoned during clinical progression. Based on the fundamental barriers outlined for modern drug development, what are the two primary reasons for this failure?", "options": ["Lack of demonstrated efficacy and unacceptable toxicity", "Prohibitive development costs exceeding $1 billion and timelines over 15 years", "Inadequate target identification and failure to generate high throughput hits", "Strict FDA review rejection and lack of a Biologic License Application"], "correct_index": 0, "explanations": ["Correct; the slide explicitly states that drugs fail in the clinic for two main reasons: they do not work (efficacy) and they are not safe (toxicity).", "Incorrect; while costs and timelines are development challenges, the slide specifies efficacy and toxicity as the two main reasons clinical drugs fail.", "Incorrect; target identification is a crucial step, but the slide lists efficacy and toxicity as the two main reasons clinical drugs fail.", "Incorrect; FDA review is a regulatory phase, whereas the slide cites intrinsic clinical failure factors as efficacy and toxicity."], "mid": "bhm07"}, {"tag": "BHM151·Q315", "difficulty": "hard", "section": "Drug Discovery Process", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 19", "qc": "A newly synthesized chemical entity has successfully completed animal model studies and is ready to be administered to human subjects for the very first time. In which specific clinical trial tier will this occur, and what is the typical demographic composition?", "options": ["Phase 1 Clinical trial, involving 1000 to 3000 patients", "Phase 2 Clinical trial, involving 100 to 300 patients", "Phase 1 Clinical trial, involving 20 to 80 healthy individuals", "Phase 3 Clinical trial, involving 20 to 80 healthy individuals"], "correct_index": 2, "explanations": ["Incorrect; Phase 1 involves 20-80 healthy individuals, not 1000-3000 patients.", "Incorrect; Phase 2 involves patients, not healthy individuals, and occurs after Phase 1.", "Correct; Phase 1 clinical trials use 20-80 healthy individuals for initial safety and pharmacological assessment.", "Incorrect; Phase 3 involves large patient cohorts (1000-3000), not healthy individuals."], "mid": "bhm07"}, {"tag": "BHM151·Q316", "difficulty": "devil", "section": "Drug Discovery Process", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 19", "qc": "A research consortium is preparing to evaluate the therapeutic efficacy of a candidate drug in a cohort of 250 diagnosed patients following successful preliminary safety profiling. This investigative phase corresponds to which exact milestone in the pipeline?", "options": ["Phase 1 Clinical trial", "Phase 2 Clinical trial", "Phase 3 Clinical trial", "Preclinical studies"], "correct_index": 1, "explanations": ["Incorrect; Phase 1 involves 20-80 healthy individuals.", "Correct; Phase 2 clinical trials specifically involve 100-300 patients to assess preliminary efficacy and dosing.", "Incorrect; Phase 3 involves a much larger patient population ranging from 1000 to 3000 individuals.", "Preclinical studies involve animal models, not human patients."], "mid": "bhm07"}, {"tag": "BHM151·Q317", "difficulty": "devil", "section": "Acronyms and Abbreviations", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 21", "qc": "During the regulatory submission process for a novel therapeutic agent, a researcher references 'IND'. Based on the standard definitions provided in the curriculum, what does this specific acronym represent?", "options": ["Investigational new drug", "New drug application", "Biologic license application", "Absorption, Distribution, Metabolism, Excretion"], "correct_index": 0, "explanations": ["Correct; IND explicitly stands for Investigational new drug as defined in the slide.", "Incorrect; New drug application corresponds to the NDA acronym.", "Incorrect; Biologic license application corresponds to the BLA acronym.", "Incorrect; ADME represents absorption, distribution, metabolism, and excretion."], "mid": "bhm07"}, {"tag": "BHM151·Q318", "difficulty": "hard", "section": "Acronyms and Abbreviations", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 21", "qc": "When evaluating the pharmacokinetic profile of a drug candidate prior to formal regulatory submission, a scientist analyzes ADME parameters. What do the letters 'ADME' stand for in this pharmacological context?", "options": ["Accelerated Drug Medical Evaluation", "Absorption, Distribution, Metabolism, Excretion", "Active Drug Molecule Efficacy", "Assay Design and Metabolic Extraction"], "correct_index": 1, "explanations": ["Incorrect; this is a distractor not supported by the lecture slides.", "Correct; slide 21 explicitly defines ADME as Absorption, Distribution, Metabolism, Excretion.", "Incorrect; this does not match the standard pharmacokinetic definition given in the slides.", "Incorrect; this is an incorrect expansion of the acronym."], "mid": "bhm07"}, {"tag": "BHM151·Q319", "difficulty": "hard", "section": "Plant Drug Discovery", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 24", "qc": "Ethnobotanical investigation leads researchers to focus on a particular plant species because indigenous cultures have historically utilized it for medicinal purposes. Which specific plant selection basis does this approach exemplify?", "options": ["Random Approach", "Phylogeny", "Cultural based (ethnobotany)", "Targeted Search"], "correct_index": 2, "explanations": ["Incorrect; the random approach selects plants more-or-less at random without prior cultural knowledge.", "Incorrect; phylogeny focuses on studying plants related to those with known medicinal activity.", "Correct; cultural based (ethnobotany) relies explicitly on plants known to be used by indigenous cultures, such as Rauwolfia serpentina or Cinchona sp.", "Incorrect; a targeted search involves screening plants found to be of potential activity through specific exploratory screens."], "mid": "bhm07"}, {"tag": "BHM151·Q320", "difficulty": "devil", "section": "Plant Drug Discovery", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 24", "qc": "Investigators decide to study an uninvestigated plant species solely because it shares a close taxonomic relationship with another species already proven to possess significant medicinal properties. Which selection principle governs this strategy?", "options": ["Phylogeny", "Cultural based (ethnobotany)", "Random Approach", "Hit generation via high throughput screening"], "correct_index": 0, "explanations": ["Correct; phylogeny is defined as studying plants related to those with known medicinal activity.", "Incorrect; ethnobotany relies on indigenous cultural use rather than taxonomic relatedness.", "Incorrect; the random approach selects plants more-or-less at random, exemplified by Taxol.", "Incorrect; high throughput screening is a hit generation step, not a plant selection basis described on slide 24."], "mid": "bhm07"}, {"tag": "BHM151·Q321", "difficulty": "devil", "section": "Drug Discovery Pipeline", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 19", "qc": "In the structured sequence of modern drug discovery, which exact operational stage immediately follows 'Hit generation: High throughput Screening' before advancing to preclinical animal models?", "options": ["Target identification and validation", "Lead compounds Leads Optimization", "Phase 1 Clinical trial", "FDA review and approval"], "correct_index": 1, "explanations": ["Incorrect; target identification and validation precedes hit generation.", "Correct; the sequence on slide 19 flows from target identification to hit generation, followed by lead compounds / leads optimization, and then preclinical studies.", "Incorrect; clinical trials occur much later, following preclinical animal studies.", "Incorrect; FDA review occurs after clinical trial phases 1, 2, and 3."], "mid": "bhm07"}, {"tag": "BHM151·Q322", "difficulty": "devil", "section": "Historical Therapies", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 17", "qc": "A healer claims to have acquired specialized knowledge of a medicinal plant extract by entering a trance state induced by spirits and dwarfs during sleep. According to the categorization of historical therapies, how must scientists classify this method of acquisition?", "options": ["Trial and error", "Accidental or serendipitous discovery", "Divination", "Belief systems and superstition-based"], "correct_index": 2, "explanations": ["Incorrect; trial and error involves physical experimentation and random plant trial.", "Incorrect; serendipitous discovery refers to unexpected physical observations like penicillin or sildenafil.", "Correct; the slide explicitly defines divination as being possessed by spirits or dwarfs or obtaining knowledge through dreams, noting it is not accepted by scientists.", "Incorrect; while related to belief systems, the slide explicitly categorizes spirit/dwarf possession and dreams under 'Divination'."], "mid": "bhm07"}, {"tag": "BHM151·Q323", "difficulty": "hard", "section": "Plant Drug Discovery", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 24", "qc": "Taxol, an important agent used in breast cancer treatment, was originally discovered through a specific foundational strategy in plant selection. Which approach does this represent?", "options": ["Random Approach", "Cultural based (ethnobotany)", "Phylogeny", "Targeted Search"], "correct_index": 0, "explanations": ["Correct; the slide explicitly lists Taxol for breast cancer as an example of the random approach where plants are selected more-or-less at random.", "Incorrect; ethnobotany utilizes plants known to be used by indigenous cultures, such as Rauwolfia serpentina.", "Incorrect; phylogeny selects plants based on relatedness to known active species.", "Incorrect; targeted search screens plants found to be of potential activity."], "mid": "bhm07"}, {"tag": "BHM151·Q324", "difficulty": "hard", "section": "Acronyms and Abbreviations", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 21", "qc": "A pharmaceutical firm submits a formal request seeking full approval to market a novel synthetic pharmaceutical drug after clinical trials. Which specific acronym denotes this application type according to slide 21?", "options": ["IND", "NDA", "BLA", "PK"], "correct_index": 1, "explanations": ["Incorrect; IND stands for Investigational New Drug, which is filed before clinical trials begin.", "Correct; NDA stands for New Drug Application, used for conventional pharmaceutical drug approvals.", "Incorrect; BLA stands for Biologic License Application, used for biological products.", "Incorrect; PK stands for Pharmacokinetic."], "mid": "bhm07"}, {"tag": "BHM151·Q325", "difficulty": "hard", "section": "Steps in Drug Discovery", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 25", "qc": "Following the isolation of bioactive constituents and structure elucidation from plants, what is the immediate subsequent operational step emphasized in modern drug discovery before achieving regulatory approval?", "options": ["Clinical trial Phase III execution", "Optimization of compounds", "Immediate mass synthetic production", "Direct FDA semi-synthetic filing"], "correct_index": 1, "explanations": ["Clinical trials are subsequent clinical phases, not the immediate chemical step listed.", "Correct. Slide 25 explicitly lists 'Optimization of compounds' immediately following isolation and structure elucidation.", "Mass production occurs much later after optimization and clinical validation.", "FDA approval is the final endpoint of the continuous discovery process, not the immediate next step."], "mid": "bhm07"}, {"tag": "BHM151·Q326", "difficulty": "devil", "section": "Drugs From Plant Sources", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 26", "qc": "Which historical alkaloid isolation milestone chronologically preceded the isolation of Nicotine according to the timeline implied in the slide data?", "options": ["Cocaine from Erythroxylon coca", "Atropine from Atropa belladona", "Strychnine from Strychnos nux-vomica", "Morphine from Papaver somniferum"], "correct_index": 2, "explanations": ["Cocaine was isolated in 1855, which is later than Nicotine (1828).", "Atropine was isolated in 1833, which is later than Nicotine (1828).", "Correct. Strychnine was isolated in 1817, whereas Nicotine was isolated in 1828.", "Morphine's exact isolation year is not numerically specified in slide 26 to make it definitively prior in a strict comparative timeline sense compared to Strychnine (1817)."], "mid": "bhm07"}, {"tag": "BHM151·Q327", "difficulty": "hard", "section": "Drugs From Plant Sources", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 27", "qc": "Metformin and its related synthetic biguanides trace their structural and pharmacological ancestry back to which botanical source listed in the curriculum?", "options": ["Galega officinalis", "Digitalis purpurea", "Cinchona succirubra", "Atropa belladona"], "correct_index": 0, "explanations": ["Correct. Slide 27 pairs Guanidine/Bioformin/Tenoformin/Metformin directly with Galega officinalis.", "Digitalis purpurea is the source for Digoxin and Digitoxin.", "Cinchona succirubra is associated with Quinine.", "Atropa belladona is associated with Atropine."], "mid": "bhm07"}, {"tag": "BHM151·Q328", "difficulty": "devil", "section": "Drugs From Plant Sources", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 27", "qc": "A patient presenting with severe gout experiences relief through an alkaloid derived from Colchicum autumnale. What is this specific compound?", "options": ["Curcumin", "Colchicine", "Hyoscine", "Salicin"], "correct_index": 1, "explanations": ["Curcumin is derived from Curcuma longa.", "Correct. Slide 27 pairs Colchicine directly with Colchicum autumnale.", "Hyoscine is derived from Hyoscyamus niger.", "Salicin is derived from Salix alba."], "mid": "bhm07"}, {"tag": "BHM151·Q329", "difficulty": "hard", "section": "Drugs From Plant Sources", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 28", "qc": "Irinotecan and topotecan are semi-synthetic derivatives originating from a parent bioactive constituent found in which plant species?", "options": ["Periwinkle plant", "Taxus brevifolia", "Camptotecan acuminata", "Digitalis lanata"], "correct_index": 2, "explanations": ["The periwinkle plant yields Vincristine and Vinblastine.", "Taxus brevifolia yields Taxol/Paclitaxel.", "Correct. Slide 28 explicitly links Camptothecin/Irinotecan/topotecan to Camptotecan acuminata.", "Digitalis lanata yields cardiac glycosides like digoxin/digitoxin."], "mid": "bhm07"}, {"tag": "BHM151·Q330", "difficulty": "hard", "section": "Drugs From Plant Sources", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 26", "qc": "Which of the following pairings of alkaloid and botanical source is explicitly documented as a shared origin for two distinct compounds in the same timeline entry on slide 26?", "options": ["Quinine and caffeine from Cinchona succirubra, Coffea arabica and Camellia sinensis", "Morphine from Papaver somniferum", "Strychnine from Strychnos nux-vomica", "Atropine from Atropa belladona"], "correct_index": 0, "explanations": ["Correct. Slide 26 groups Quinine and caffeine (1820) together across multiple sources (Cinchona succirubra, Coffea arabica and Camellia sinensis).", "Morphine lists only Papaver somniferum without a paired alkaloid in that specific entry.", "Strychnine lists only a single source.", "Atropine lists only a single source."], "mid": "bhm07"}, {"tag": "BHM151·Q331", "difficulty": "devil", "section": "Drugs From Plant Sources", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 27", "qc": "Phystostigmine is a bioactive compound isolated from which specific botanical organism?", "options": ["Physostigma venenosum", "Theobroma cacao", "Salix alba", "Artemisia annua"], "correct_index": 0, "explanations": ["Correct. Slide 27 lists Phystostigmine from Phystostigma venenosum (noting the spelling matches slide 27).", "Theobroma cacao yields Theobromine/Theophylline.", "Salix alba yields Salicin/Aspirin.", "Artemisia annua yields Artemisinin derivatives."], "mid": "bhm07"}, {"tag": "BHM151·Q332", "difficulty": "hard", "section": "Drugs From Plant Sources", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 27", "qc": "Artemisinin, Artesunate, and Artemether share a botanical origin that has revolutionized malaria therapy. What is the source plant?", "options": ["Digitalis purpurea", "Artemisia annua", "Taxus brevifolia", "Curcuma longa"], "correct_index": 1, "explanations": ["Digitalis purpurea is a source of cardiac glycosides.", "Correct. Slide 27 explicitly links Artemisinin/Artesunate/Artemether to Artemisia annua.", "Taxus brevifolia yields Taxol/Paclitaxel.", "Curcuma longa yields Curcumin."], "mid": "bhm07"}, {"tag": "BHM151·Q333", "difficulty": "devil", "section": "Structures of Compounds", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 29", "qc": "Slide 29 provides comparative structural representations to illustrate the chemical modification leading from a natural plant extract to a widely used pharmaceutical. Which pair is depicted?", "options": ["MORPHINE and CODEINE", "SALICIN and ASPIRIN", "VINCRISTINE and VINBLASTINE", "QUININE and CAFFEINE"], "correct_index": 1, "explanations": ["Morphine and Codeine structures are featured on slide 31.", "Correct. Slide 29 explicitly contrasts the structures of SALICIN and ASPIRIN.", "Vincristine and Vinblastine structures are featured on slide 30.", "Quinine and Caffeine structures are featured on slide 32."], "mid": "bhm07"}, {"tag": "BHM151·Q334", "difficulty": "hard", "section": "Structures of Compounds", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 30", "qc": "The complex dimeric indole alkaloid structures of two potent anti-cancer agents are illustrated side by side on which specific slide?", "options": ["Slide 29", "Slide 30", "Slide 31", "Slide 32"], "correct_index": 1, "explanations": ["Slide 29 displays Salicin and Aspirin.", "Correct. Slide 30 displays the structures for VINCRISTINE and VINBLASTINE.", "Slide 31 displays Morphine and Codeine.", "Slide 32 displays Quinine, Caffeine, and Colchicine."], "mid": "bhm07"}, {"tag": "BHM151·Q335", "difficulty": "devil", "section": "Structures of Compounds", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 32", "qc": "Examine the structural layout of slide 32. Which trio of prominent plant-derived compounds has their chemical structures grouped together?", "options": ["Morphine, Codeine, and Caffeine", "Quinine, Caffeine, and Colchicine", "Salicin, Aspirin, and Taxol", "Vincristine, Vinblastine, and Morphine"], "correct_index": 1, "explanations": ["Morphine and Codeine are on slide 31, not slide 32.", "Correct. Slide 32 groups QUININE, CAFFEINE, and COLCHICINE.", "Salicin and Aspirin are on slide 29.", "Vincristine and Vinblastine are on slide 30."], "mid": "bhm07"}, {"tag": "BHM151·Q336", "difficulty": "hard", "section": "Drugs From Plant Sources", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 27", "qc": "The xanthine alkaloids Theobromine and Theophylline are naturally occurring constituents isolated from which botanical species?", "options": ["Theobroma cacao", "Coffea arabica", "Camellia sinensis", "Salix alba"], "correct_index": 0, "explanations": ["Correct. Slide 27 associates Theobromine/Theophylline directly with Theobroma cacao.", "Coffea arabica is paired with caffeine on slide 26 alongside Cinchona.", "Camellia sinensis is paired with caffeine on slide 26.", "Salix alba is the source of Salicin/Aspirin."], "mid": "bhm07"}, {"tag": "BHM151·Q337", "difficulty": "devil", "section": "Role of Science in Herbalism", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 33", "qc": "Which scientific process specifically bridges historical traditional knowledge with modern empirical acceptance in herbal medicine according to the summary framework?", "options": ["Standardization to maintain batch consistency", "Validation of ethnomedicine", "Identification and quantification of active compounds", "Elucidation of mechanisms of action"], "correct_index": 1, "explanations": ["Standardization ensures manufacturing consistency rather than direct validation of traditional knowledge.", "Validation of traditional knowledge (Ethnomedicine) directly addresses the empirical claims of historical practices.", "Identification and quantification focus on phytochemical profiling rather than historical validation.", "Understanding mechanisms explains how a remedy works rather than validating its initial traditional premise."], "mid": "bhm07"}, {"tag": "BHM151·Q338", "difficulty": "hard", "section": "Role of Science in Herbalism", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 33", "qc": "When a researcher isolates a chemical constituent from a medicinal plant and determines its precise concentration within the crude extract, which dual scientific role are they fulfilling?", "options": ["Validation and safety testing", "Identification and quantification of active compounds", "Standardization and mechanism analysis", "Ethnomedicine and safety assurance"], "correct_index": 1, "explanations": ["Validation and safety testing do not encompass the specific act of determining exact chemical concentrations.", "Identification and quantification of active compounds directly covers finding what the compound is and measuring how much is present.", "Standardization relies on quantification, but identification is a separate dual action listed on the slide.", "Ethnomedicine refers to traditional knowledge, not laboratory isolation and measurement."], "mid": "bhm07"}, {"tag": "BHM151·Q339", "difficulty": "devil", "section": "Role of Science in Herbalism", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 33", "qc": "Elucidating the exact biochemical pathway through which a plant secondary metabolite exerts its therapeutic effect corresponds to which specific scientific objective?", "options": ["Validation of traditional knowledge", "Ensure safety", "Understand mechanisms of action of herbal remedies", "Identification of active compounds"], "correct_index": 2, "explanations": ["Validation confirms that a remedy works, whereas understanding the pathway explains how it works.", "Safety focuses on toxicity and adverse effects, not necessarily the therapeutic biochemical pathway.", "Understand mechanisms of action of herbal remedies precisely describes tracking the biochemical pathway of the remedy.", "Identification names the compound, but tracking its pathway goes beyond mere identification."], "mid": "bhm07"}, {"tag": "BHM151·Q340", "difficulty": "hard", "section": "Role of Science in Herbalism", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 33", "qc": "Why must scientific validation efforts in herbalism incorporate both safety assessments and quality consistency protocols rather than relying solely on active compound identification?", "options": ["To completely replace traditional ethnomedicine practices with synthetic drugs", "To ensure safety and achieve proper standardization across herbal products", "To map out the historical origins of ethnomedicine", "To exclusively quantify the highest concentration of toxic metabolites"], "correct_index": 1, "explanations": ["Science in herbalism validates and standardizes rather than replaces traditional practices with synthetics.", "Ensure safety and standardization are distinct, mandatory endpoints listed alongside compound identification.", "Mapping historical origins belongs to ethnomedicine validation, not safety protocols.", "Quantifying toxic metabolites is a safety measure, but the overall goal includes standardization, not just tracking toxins."], "mid": "bhm07"}, {"tag": "BHM151·Q341", "difficulty": "devil", "section": "Role of Science in Herbalism", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 33", "qc": "A regulatory agency rejects a herbal product because its therapeutic claims are proven, but its active constituent levels fluctuate wildly between batches. Which specific domain from the summary of science's role has the manufacturer failed?", "options": ["Validation of traditional knowledge (Ethnomedicine)", "Understand mechanisms of action", "Standardization", "Identification of active compounds"], "correct_index": 2, "explanations": ["Therapeutic claims being proven means the ethnomedicine has been validated.", "Mechanism of action explains how the drug works, which is separate from batch-to-batch consistency.", "Standardization is the scientific process required to eliminate batch-to-batch fluctuation in herbal products.", "The active compounds were already identified if claims were proven, but they failed to maintain consistent levels."], "mid": "bhm07"}, {"tag": "BHM151·Q342", "difficulty": "hard", "section": "Role of Science in Herbalism", "qt": "single", "source": "BHM 151 — Role_of_Science_Herbalism, slide 33", "qc": "When modern clinical trials investigate an indigenous plant decoction used for centuries by local healers, which component of the scientific framework is primarily being initiated?", "options": ["Standardization", "Validation of traditional knowledge (Ethnomedicine)", "Ensure safety prior to any identification", "Understand mechanisms of action before testing efficacy"], "correct_index": 1, "explanations": ["Standardization is a manufacturing and quality control step, not the primary clinical investigation of an indigenous use.", "Validation of traditional knowledge (Ethnomedicine) is the direct translation and testing of indigenous claims through scientific methods.", "Safety is evaluated concurrently or later, but investigating an indigenous healing practice starts with validating ethnomedicine.", "Mechanisms of action are usually investigated after or alongside validation, not necessarily prior to clinical trials."], "mid": "bhm07"}, {"tag": "BHM151·Q343", "difficulty": "devil", "section": "Sociological Considerations", "qt": "single", "source": "BHM 151 — Sociological_Considerations, slide 5", "qc": "Which specific dimension of traditional healing does the Interactionist Perspective emphasize beyond the purely physical treatment of an illness?", "options": ["The institutional struggle and competition for resources between traditional and modern medical systems.", "The symbolic meanings, shared understanding, and trust developed through interpersonal communication.", "The preservation of overall societal stability, cultural continuity, and community cohesion.", "The structural inequality and power dynamics inherent in healthcare delivery systems."], "correct_index": 1, "explanations": ["This describes the Conflict Perspective, which focuses on power struggles rather than interpersonal interaction.", "Correct. The Interactionist Perspective focuses on individual interactions, symbolic meanings, shared understanding, and trust between healers and patients.", "This describes the Functionalist Perspective, which examines social stability and cohesion.", "This describes the Conflict Perspective, focusing on power dynamics and inequalities."], "mid": "bhm08"}, {"tag": "BHM151·Q344", "difficulty": "hard", "section": "Sociological Considerations", "qt": "single", "source": "BHM 151 — Sociological_Considerations, slide 6", "qc": "From a Functionalist standpoint, how are health and illness primarily categorized within the framework of societal maintenance?", "options": ["As individual psychological conditions driven exclusively by biological pathogen exposure.", "As social conditions that possess the potential to either disrupt or support societal order.", "As sites of continuous political struggle and resource competition between rival healing groups.", "As purely symbolic interactions devoid of any structural impact on community cohesion."], "correct_index": 1, "explanations": ["This ignores the structural social focus of the Functionalist perspective.", "Correct. Functionalism views health and illness as social conditions that can either disrupt or support social order and societal stability.", "This aligns with the Conflict Perspective, not the Functionalist view.", "This misinterprets Interactionist symbolic meanings as being structurally irrelevant to society."], "mid": "bhm08"}, {"tag": "BHM151·Q345", "difficulty": "devil", "section": "Sociological Considerations", "qt": "single", "source": "BHM 151 — Sociological_Considerations, slide 7", "qc": "According to the Functionalist perspective, traditional healers act as stabilizing figures by fulfilling which comprehensive set of community requirements?", "options": ["Addressing physical, emotional, spiritual, and social needs to strengthen communal ties.", "Challenging the dominant resource distribution of modern healthcare infrastructure.", "Negotiating the symbolic micro-interactions and trust-building processes during consultations.", "Exposing the systemic inequalities and power imbalances between rural and urban populations."], "correct_index": 0, "explanations": ["Correct. Traditional healers act as stabilizing figures by addressing physical, emotional, spiritual, and social needs, strengthening communal ties.", "This refers to the Conflict Perspective, not Functionalism.", "This relates to the Interactionist Perspective.", "This describes the critical focus of the Conflict Perspective."], "mid": "bhm08"}, {"tag": "BHM151·Q346", "difficulty": "hard", "section": "Sociological Considerations", "qt": "single", "source": "BHM 151 — Sociological_Considerations, slide 8", "qc": "What is the primary analytical focus of the Conflict Perspective when examining the coexistence of traditional and modern medicine?", "options": ["The shared symbolic meanings and trust developed during individual healer-patient interactions.", "The mechanisms through which traditional medicine fosters cross-generational cultural continuity.", "Power dynamics, inequality, and institutional tensions arising from differences in accessibility and resources.", "The role of culturally accepted practices in maintaining overall societal order and health."], "correct_index": 2, "explanations": ["This is the focus of the Interactionist Perspective.", "This is a key point of the Functionalist Perspective regarding cultural heritage.", "Correct. The Conflict Perspective investigates power dynamics, inequality, and tensions between traditional and modern medicine due to accessibility and resources.", "This describes the Functionalist emphasis on social stability and cohesion."], "mid": "bhm08"}, {"tag": "BHM151·Q347", "difficulty": "hard", "section": "Sociological Considerations", "qt": "single", "source": "BHM 151 — Sociological_Considerations, slide 3", "qc": "How do local customs and rituals function within the cultural context of traditional healing practices?", "options": ["They serve as competitive mechanisms to displace modern medical practitioners in urban centers.", "They act as symbolic expressions deeply rooted in the community's culture and beliefs.", "They function strictly as biological interventions aimed at correcting physiological imbalances.", "They represent structural inequalities that perpetuate conflict between diverse social classes."], "correct_index": 1, "explanations": ["Displacement and competition relate to the Conflict Perspective, not the cultural roots described here.", "Correct. Healing practices reflect local customs, rituals, and symbolic meanings deeply rooted in community culture and beliefs.", "Traditional medicine integrates spiritual therapies and symbolic meanings, not just biological interventions.", "Structural inequalities are analyzed by the Conflict Perspective, not the cultural context slide."], "mid": "bhm08"}, {"tag": "BHM151·Q348", "difficulty": "devil", "section": "Sociological Considerations", "qt": "single", "source": "BHM 151 — Sociological_Considerations, slide 2", "qc": "Based on the comprehensive definition of traditional medicine provided, which combination of modalities is explicitly encompassed within its scope?", "options": ["Plant, animal, and mineral-based medicines, spiritual therapies, manual techniques, and exercises.", "Synthetic pharmaceutical derivatives, surgical interventions, and advanced radiological therapies.", " exclusivamente herbal decoctions combined with contemporary psychotherapeutic counseling.", "Isolate active chemical constituents administered strictly through modern clinical trials."], "correct_index": 0, "explanations": ["Correct. Traditional medicine encompasses practices, knowledge, and beliefs integrating plant, animal, and mineral-based medicines, spiritual therapies, manual techniques, and exercises.", "Synthetic pharmaceuticals and advanced radiological therapies belong to modern, not traditional, medicine.", "Psychotherapeutic counseling and exclusive herbal decoctions omit animal/mineral components and manual techniques.", "Isolated chemical constituents and clinical trials define modern pharmacology rather than traditional medicine scope."], "mid": "bhm08"}, {"tag": "BHM151·Q349", "difficulty": "hard", "section": "Sociological Considerations", "qt": "single", "source": "BHM 151 — Sociological_Considerations, slide 7", "qc": "In what specific way does traditional medicine contribute to community identity across generational lines, according to the Functionalist perspective?", "options": ["By generating systemic tensions and resource competition between rival medical factions.", "By preserving cultural heritage and fostering unity and continuity across generations.", "By standardizing individual symbolic interactions and patient trust during consultations.", "By bridging the technological gap in advanced surgical facilities within urban hospitals."], "correct_index": 1, "explanations": ["Generating tensions describes the Conflict Perspective.", "Correct. Traditional medicine preserves cultural heritage and promotes a sense of identity, fostering unity and continuity across generations.", "Standardizing micro-interactions refers to the Interactionist Perspective.", "Bridging advanced surgical gaps is not cited; traditional medicine addresses gaps in underserved primary healthcare."], "mid": "bhm08"}, {"tag": "BHM151·Q350", "difficulty": "devil", "section": "Sociological Considerations", "qt": "single", "source": "BHM 151 — Sociological_Considerations, slide 4", "qc": "When sociologists analyze how individuals perceive illness and how traditional healing interacts with modern healthcare, what is the collective utility of these sociological perspectives?", "options": ["To establish a single dominant medical monopoly that eliminates all alternative healing modalities.", "To understand the complex roles traditional medicine plays across different societies through social and structural lenses.", "To exclusively measure the pharmacological potency and active phytochemical yields of medicinal plants.", "To resolve micro-economic disparities by commercializing indigenous remedies for global export."], "correct_index": 1, "explanations": ["Establishing a monopoly contradicts sociological analysis of pluralistic healthcare systems.", "Correct. These perspectives help in understanding the role traditional medicine plays in different societies, how people perceive illness, and how it interacts with modern healthcare.", "Measuring pharmacological potency is a pharmacognosy/chemistry task, not sociological analysis.", "Commercialization and micro-economic export are beyond the sociological scope outlined in the slide."], "mid": "bhm08"}, {"tag": "BHM151·Q351", "difficulty": "hard", "section": "Sociological Considerations", "qt": "single", "source": "BHM 151 — Sociological_Considerations, slide 7", "qc": "What structural deficiency in modern healthcare delivery does traditional medicine help mitigate, particularly in specific geographical settings?", "options": ["A lack of legal frameworks for patenting traditional medicinal formulations.", "Gaps in access to modern medical facilities in rural or underserved areas.", "Shortages of capital investment for pharmaceutical manufacturing plants in urban hubs.", "Deficits in molecular research methodologies for isolating active plant compounds."], "correct_index": 1, "explanations": ["Legal patent frameworks are not mentioned in the Functionalist healthcare access point.", "Correct. In rural or underserved areas, traditional medicine serves as a primary healthcare system, addressing gaps in access to modern medical facilities.", "Capital investment for urban manufacturing is unrelated to underserved primary healthcare gaps.", "Molecular research methodologies pertain to laboratory science rather than primary healthcare access."], "mid": "bhm08"}, {"tag": "BHM151·Q352", "difficulty": "devil", "section": "Sociological Considerations", "qt": "single", "source": "BHM 151 — Sociological_Considerations, slide 8", "qc": "What underlying assumption about societal structure does the Conflict Perspective rely on when analyzing healthcare systems?", "options": ["Society is maintained through harmonious consensus and the smooth functional integration of all institutions.", "Society is characterized by a constant state of struggle driven by competing interests among different groups.", "Society is defined strictly by the accumulation of shared symbolic meanings in interpersonal encounters.", "Society operates as a static cultural artifact preserved unchanged across successive generations."], "correct_index": 1, "explanations": ["This describes the Functionalist perspective of consensus and integration.", "Correct. The Conflict Perspective views society as being in a constant state of struggle due to competing interests, especially between groups like modern and traditional proponents.", "This represents the Interactionist focus on symbolic meanings.", "Static cultural preservation aligns with Functionalist cultural continuity rather than conflict."], "mid": "bhm08"}, {"tag": "BHM151·Q353", "difficulty": "hard", "section": "Sociological Considerations", "qt": "single", "source": "BHM 151 — Sociological_Considerations, slide 2", "qc": "In which socio-economic context does traditional medicine typically play a particularly significant role in primary healthcare delivery?", "options": ["Post-industrialized economies with universal high-tech clinical coverage.", "Developing countries where traditional medicine forms a crucial part of primary healthcare.", "Strictly urban academic medical centers specializing in specialized surgical procedures.", "Controlled clinical trial environments utilizing synthetic placebo controls."], "correct_index": 1, "explanations": ["Post-industrialized economies rely primarily on modern high-tech clinical care.", "Correct. Traditional medicine often reflects cultural heritage and plays a significant role in primary healthcare, especially in developing countries.", "Urban academic medical centers represent modern healthcare infrastructure.", "Controlled clinical trials evaluate modern pharmaceuticals rather than general primary healthcare contexts in developing nations."], "mid": "bhm08"}, {"tag": "BHM151·Q354", "difficulty": "hard", "section": "Sociological Considerations", "qt": "single", "source": "BHM 151 — Sociol
