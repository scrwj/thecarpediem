eaflets that assist prescription.", "Local practitioners are legally mandated by PNDC Law 305 to prioritize foreign medical products."], "correct_index": 2, "explanations": ["Incorrect; the text does not attribute the preference to superior active ingredients or biotechnology extraction.", "Incorrect; taxation tariffs are not mentioned anywhere in the provided slides.", "Correct; the slide contrasts well-packaged imported products with patient leaflets (making them essential for prescription) against poorly packaged local medicines.", "Incorrect; PNDC Law 305 governs importation, but does not legally mandate doctors to prioritize foreign herbal products over local ones."], "mid": "bhm04"}, {"tag": "BHM151·Q156", "difficulty": "devil", "section": "Way Forward", "qt": "single", "source": "BHM 151 — Herbal_Med_Ghana, slide 23", "qc": "In the context of ensuring the long-term sustainability of Ghana's herbal industry, what role do biotechnological interventions play?", "options": ["They are applied directly to the conservation and multiplication of threatened medicinal plants.", "They replace the need for a national research and development policy by automating regulation.", "They eliminate the microbial contamination inherent in the processing of liquid herbal formulations.", "They streamline the annual FDA product registration renewal process for small-scale manufacturers."], "correct_index": 0, "explanations": ["Correct; the slide highlights an urgent need for the application of biotechnological interventions specifically to conservation and multiplication of threatened medicinal plants.", "Incorrect; biotechnological interventions complement conservation rather than replacing a national R&D policy.", "Incorrect; microbial contamination is a manufacturing and formulation challenge, not solved directly by biotechnology multiplication techniques.", "Incorrect; FDA registration burdens are administrative issues unrelated to plant biotechnology applications."], "mid": "bhm04"}, {"tag": "BHM151·Q157", "difficulty": "hard", "section": "Way Forward", "qt": "single", "source": "BHM 151 — Herbal_Med_Ghana, slide 24", "qc": "What is anticipated as the ultimate outcome of establishing a national research and development policy that unites relevant stakeholders in the herbal industry?", "options": ["Immediate exemption of all locally produced herbal products from microbial testing standards.", "The formulation of a medium- to long-term strategy for the structured development of Ghana's herbal industry.", "A complete ban on the importation of foreign herbal medicines from the United Kingdom and China.", "The immediate resolution of conflicting nomenclature guidelines regulated by the FDA."], "correct_index": 1, "explanations": ["Incorrect; microbial testing standards are quality control parameters, not items exempted by stakeholder policies.", "Correct; the slide states that such steps will ultimately lead to a medium-to long-term strategy for development of the herbal industry in Ghana.", "Incorrect; importation is governed by law, and the policy focuses on domestic capacity, networks, and databases rather than banning imports.", "Incorrect; nomenclature guidelines are regulatory hurdles, whereas the policy targets capacity needs, funding, and industry development strategies."], "mid": "bhm04"}, {"tag": "BHM151·Q158", "difficulty": "devil", "section": "Challenges", "qt": "single", "source": "BHM 151 — Herbal_Med_Ghana, slide 17", "qc": "Based on the 2021 CPMR analysis data, which inference can be drawn regarding the state of herbal products in Ghana?", "options": ["Over half of the analyzed products failed to meet established quality control benchmarks.", "Microbial contamination was successfully prevented in exactly 50% of all registered liquid formulations.", "The lack of stability data was fully resolved through annual FDA licensing renewals.", "Manufacturers completely eliminated microbial contamination challenges by adopting modern technology."], "correct_index": 0, "explanations": ["Correct; about 50% of herbal products out of 615 analyzed in 2021 at the CPMR were below quality control standards.", "Incorrect; microbial contamination is explicitly described as common and always difficult for manufacturers to prevent or control.", "Incorrect; the interim measure of 1-year licensing is a burden precisely because stability data remains lacking, not resolved.", "Incorrect; manufacturers still face control issues with microbial contamination as stated in the text."], "mid": "bhm04"}, {"tag": "BHM151·Q159", "difficulty": "hard", "section": "Challenges", "qt": "single", "source": "BHM 151 — Herbal_Med_Ghana, slide 18", "qc": "Which of the following regulatory and quality control hurdles specifically plagues the standard evaluation of herbal products according to slide 18?", "options": ["An absolute prohibition on clinical trials for traditional medicines.", "A total absence of standardized procedures to assess product safety and efficacy.", "Mandatory international export protocols that block domestic sales.", "Excessive governmental subsidies that distort practitioner certification costs."], "correct_index": 1, "explanations": ["Incorrect; the slides do not mention a prohibition on clinical trials, but rather insufficient research undermining claims.", "Correct; the slide explicitly points out under Quality Control that there is a lack of standardized procedures for assessing the safety and efficacy of herbal products.", "Incorrect; export challenges relate to bulky liquid dosage forms, not regulatory prohibitions on domestic sales.", "Incorrect; certification is described as complicated and costly, leading to exploitation, not excessive governmental subsidies."], "mid": "bhm04"}, {"tag": "BHM151·Q160", "difficulty": "devil", "section": "Way Forward", "qt": "single", "source": "BHM 151 — Herbal_Med_Ghana, slide 20", "qc": "How does the predominant scale of production in Ghana's herbal industry influence the physical characteristics of the final marketed products?", "options": ["Small-scale production exclusively yields solid dosage forms that lack patient compliance features.", "Large-scale biotechnology plants exclusively generate high-concentration dry powders for export.", "Small-scale production predominantly results in liquid formulations burdened by bitter tastes and short shelf-lives.", "Industrial-scale manufacturing completely resolves the bulky nature of exported herbal products."], "correct_index": 2, "explanations": ["Incorrect; the text states most herbal medicines in Ghana are produced on a small scale, and as liquids.", "Incorrect; large-scale biotechnology is proposed as a future conservation intervention, not current manufacturing output.", "Correct; the slide notes that most herbal medicines in Ghana are produced on a small scale, and as liquids that are associated with bitter taste, short shelf-life, and dosing challenges.", "Incorrect; the slide notes that bulky liquid dosage forms are inconvenient for export precisely because small-scale liquid production remains dominant."], "mid": "bhm04"}, {"tag": "BHM151·Q161", "difficulty": "hard", "section": "Way Forward", "qt": "single", "source": "BHM 151 — Herbal_Med_Ghana, slide 24", "qc": "What structural outcome is expected from bringing together researchers, regulators, practitioners, and policymakers under a national agenda?", "options": ["The enforcement of mandatory pricing controls for imported drugs governed by PNDC Law 305.", "The establishment and strengthening of essential research networks, partnerships, and databases.", "The immediate transfer of regulatory enforcement powers entirely to traditional practitioners.", "The complete abolition of annual product registration renewals for all herbal liquids."], "correct_index": 1, "explanations": ["Incorrect; pricing controls are not discussed in relation to the national research and development agenda.", "Correct; the slide states that such steps will lead to the establishment and strengthening of research networks, partnerships and databases needed in the industry.", "Incorrect; regulatory powers remain with bodies like the FDA, not transferred entirely to practitioners.", "Incorrect; annual renewals are an interim regulatory measure tied to stability data, not automatically abolished by stakeholder meetings."], "mid": "bhm04"}, {"tag": "BHM151·Q162", "difficulty": "devil", "section": "Way Forward", "qt": "single", "source": "BHM 151 — Herbal_Med_Ghana, slide 25", "qc": "Which of the following strategic interventions is explicitly highlighted as a necessary future direction to advance the practice of herbal medicine according to the policy recommendations?", "options": ["Increase government support", "Privatize all herbal clinics immediately", "Abolish traditional medicine councils", "Import foreign medicinal plants exclusively"], "correct_index": 0, "explanations": ["The slide explicitly states 'Increase government support' as a primary way forward.", "Privatization of clinics is neither stated nor implied on the slide.", "Abolishing councils contradicts the goal of advancing structured practice shown on the slide.", "Importing foreign plants is not mentioned as a forward strategy on this slide."], "mid": "bhm04"}, {"tag": "BHM151·Q163", "difficulty": "hard", "section": "Way Forward", "qt": "single", "source": "BHM 151 — Herbal_Med_Ghana, slide 25", "qc": "In the context of the developmental trajectory of herbal medicine in Ghana, what specific institutional action is categorized under the 'Way forward'?", "options": ["Increase government support", "Decrease regulatory oversight", "Eliminate research funding", "Restrict herbal education"], "correct_index": 0, "explanations": ["The slide explicitly lists 'Increase government support' as the way forward.", "Decreasing oversight would compromise safety, which opposes advancement.", "Eliminating research funding contradicts the progression of herbal medicine.", "Restricting education would hinder capacity building required for the sector."], "mid": "bhm04"}, {"tag": "BHM151·Q164", "difficulty": "devil", "section": "Way Forward", "qt": "single", "source": "BHM 151 — Herbal_Med_Ghana, slide 25", "qc": "Based on the concluding framework for developing herbal medicine, which of the following represents a macro-level intervention required for sector growth?", "options": ["Increase government support", "Solely rely on individual practitioner funding", "Decentralize without state backing", "Discontinue policy frameworks"], "correct_index": 0, "explanations": ["Government support is specifically identified on the slide as the necessary way forward.", "Solely relying on individual funding lacks the macro-level backing needed for national integration.", "Decentralization without state backing contradicts the need for increased government involvement.", "Discontinuing policy frameworks would destabilize the regulatory environment."], "mid": "bhm04"}, {"tag": "BHM151·Q165", "difficulty": "hard", "section": "Way Forward", "qt": "single", "source": "BHM 151 — Herbal_Med_Ghana, slide 25", "qc": "When evaluating the prerequisites for successfully scaling up herbal medicine practice as outlined in the course materials, what is identified as the critical catalyst?", "options": ["Increase government support", "Complete commercialization by foreign entities", "Total reliance on out-of-pocket patient spending", "Complete removal of institutional structures"], "correct_index": 0, "explanations": ["The slide points directly to 'Increase government support' as the essential catalyst.", "Commercialization by foreign entities is not supported by the slide content.", "Out-of-pocket spending alone is insufficient for sustainable sector development.", "Removal of institutional structures would dismantle governance of the practice."], "mid": "bhm04"}, {"tag": "BHM151·Q166", "difficulty": "devil", "section": "Introduction and Global Trends", "qt": "single", "source": "BHM 151 — IKA, slide 3", "qc": "Based on the global trends in herbal medicine highlighted in the curriculum, what historical parallel is drawn regarding the current resurgence of herbal medicine?", "options": ["It mirrors the sudden emergence of synthetic antibiotics in the mid-20th century.", "It follows a cyclical trajectory resembling the historical development of traditional medicine.", "It represents a total replacement of orthodox health care frameworks in Western nations.", "It is driven primarily by the commercial collapse of the pharmaceutical penicillin industry."], "correct_index": 1, "explanations": ["Incorrect; the text contrasts antibiotics with roots.", "Correct; the text explicitly states 'This is just like the history of traditional medicine'.", "Incorrect; countries are rethinking healthcare to include, not totally replace.", "Incorrect; penicillin is cited in a historical timeline of antibiotic mutations, not as the driver of herbal trends."], "mid": "bhm05"}, {"tag": "BHM151·Q167", "difficulty": "hard", "section": "History of alternative medicine", "qt": "single", "source": "BHM 151 — IKA, slide 4", "qc": "What socio-medical phenomenon is critically illustrated by the chronological progression from the 1000 AD to the 2000 AD milestones in alternative medicine history?", "options": ["The linear progression and ultimate perfection of synthetic chemical interventions over herbal roots.", "The cyclical rejection and eventual return to plant-based remedies due to the limitations of synthetic antibiotics.", "The immediate global acceptance of prayer-based healing over medical potions across all centuries.", "The consistent pharmacological stability of microbial strains against tetracycline and penicillin."], "correct_index": 1, "explanations": ["Incorrect; synthetic interventions faced continuous failures ('bugs mutated', 'pills ineffective').", "Correct; the timeline moves from rejecting roots to swallowing pills, facing antibiotic resistance ('bugs have won'), and returning to the root.", "Incorrect; prayer was mocked as superstition in subsequent eras.", "Incorrect; bugs mutated, demonstrating instability and resistance against antibiotics."], "mid": "bhm05"}, {"tag": "BHM151·Q168", "difficulty": "devil", "section": "Introduction to Healthcare Systems", "qt": "single", "source": "BHM 151 — IKA, slide 6", "qc": "How does the introductory framework fundamentally categorize the diverse healing systems created in response to human afflictions?", "options": ["Into conventional and unconventional (traditional) medicine.", "Into scientific biomedicine and holistic phytotherapy.", "Into allopathic western systems and complementary ethnobotanical practices.", "Into orthodox integrative care and unscientific folk medicine."], "correct_index": 0, "explanations": ["Correct; slide 6 explicitly states healing systems are 'Classified into two main groups: conventional and unconventional (Traditional) Medicine'.", "Incorrect; phytotherapy and holistic are terms listed under synonyms, not the primary classification groups.", "Incorrect; these represent specific synonyms within the broader categories.", "Incorrect; integrative care is a combined practice, and unscientific is a subjective synonym."], "mid": "bhm05"}, {"tag": "BHM151·Q169", "difficulty": "hard", "section": "Healthcare systems and synonyms", "qt": "single", "source": "BHM 151 — IKA, slide 7", "qc": "Which of the following designations is NOT explicitly categorized as a synonym for the orthodox healthcare system in the provided terminology?", "options": ["Biomedicine", "Allopathic", "Ethnomedicine", "Scientific"], "correct_index": 2, "explanations": ["Incorrect; biomedicine is explicitly listed as an orthodox synonym on slide 7.", "Incorrect; allopathic is listed under the orthodox system synonyms.", "Correct; ethnomedicine is categorized under the unorthodox system synonyms on slide 7.", "Scientific is listed as an orthodox system synonym."], "mid": "bhm05"}, {"tag": "BHM151·Q170", "difficulty": "devil", "section": "Healthcare systems and synonyms", "qt": "single", "source": "BHM 151 — IKA, slide 7", "qc": "A researcher refers to a practice using the term 'Phytotherapy'. Based on the slide classifications, how does this relate to broader healthcare categories?", "options": ["It is classified strictly as an orthodox allopathic intervention.", "It is listed as a related term under the unorthodox system.", "It represents a standalone tertiary healthcare system distinct from conventional and traditional care.", "It is categorized as a mainstream biomedical specialty."], "correct_index": 1, "explanations": ["Incorrect; allopathic is an orthodox term, whereas phytotherapy is grouped with unorthodox related terms.", "Correct; slide 7 lists phytotherapy under 'Related terms:' alongside unorthodox designations.", "Incorrect; only two main systems are classified in the introductory slides.", "Incorrect; biomedicine is mainstream/orthodox, while phytotherapy is grouped with herbalism and botanic medicine."], "mid": "bhm05"}, {"tag": "BHM151·Q171", "difficulty": "hard", "section": "Healthcare systems definitions", "qt": "single", "source": "BHM 151 — IKA, slide 8", "qc": "What defining criterion separates conventional medicine from unconventional medicine according to the foundational definitions?", "options": ["Its reliance exclusively on plant-derived raw extracts rather than synthesized chemical molecules.", "Its status as mainstream healthcare widely accepted and used by health professionals.", "Its complete exclusion of holistic practices and focus solely on surgical interventions.", "Its validation through historical traditional folklore rather than modern clinical trials."], "correct_index": 1, "explanations": ["Incorrect; conventional medicine utilizes many synthetic drugs.", "Correct; conventional medicine is defined on slide 8 as 'mainstream healthcare widely accepted and used by health professionals'.", "Incorrect; conventional medicine encompasses many non-surgical specialties.", "Incorrect; conventional medicine is scientifically validated, not based on folklore."], "mid": "bhm05"}, {"tag": "BHM151·Q172", "difficulty": "devil", "section": "Healthcare systems definitions", "qt": "single", "source": "BHM 151 — IKA, slide 8", "qc": "A patient chooses to use herbal remedies in conjunction with their prescribed chemotherapy at a hospital. How is this specific practice classified?", "options": ["Alternative medicine", "Integrative medicine", "Complementary medicine", "Biomedical folk practice"], "correct_index": 2, "explanations": ["Incorrect; alternative medicine is used instead of, not together with, conventional medicine.", "Incorrect; integrative medicine refers to when health care providers and facilities offer both types of care, whereas the question describes patient-side usage.", "Correct; complementary medicine refers to non-mainstream practices used together with conventional medicine.", "Incorrect; this is not a term used in the lecture slides."], "mid": "bhm05"}, {"tag": "BHM151·Q173", "difficulty": "hard", "section": "Healthcare systems definitions", "qt": "single", "source": "BHM 151 — IKA, slide 8", "qc": "Under what precise operational condition does unconventional healthcare transition to being classified as 'integrative medicine'?", "options": ["When patients autonomously combine traditional roots with orthodox pharmaceutical prescriptions.", "When health care providers and facilities officially offer both conventional and unconventional types of care.", "When traditional medicine completely replaces biomedicine in rural healthcare settings.", "When unorthodox practices are proven scientifically and reclassified as pure allopathic medicine."], "correct_index": 1, "explanations": ["Incorrect; autonomous patient combination is complementary or alternative, not institutional integrative medicine.", "Correct; slide 8 states 'When health care providers and facilities offer both types of care, it is called integrative medicine'.", "Incorrect; this describes replacement (alternative), not integration.", "Incorrect; integration involves offering both types of care, not necessarily reclassifying them into allopathy."], "mid": "bhm05"}, {"tag": "BHM151·Q174", "difficulty": "devil", "section": "History of alternative medicine", "qt": "single", "source": "BHM 151 — IKA, slide 4", "qc": "In the historical timeline of alternative medicine, what specific medical advancement was met with the critique that 'bugs mutated'?", "options": ["Penicillin", "Tetracycline", "Synthetic herbal potions", "The 1920 AD pills"], "correct_index": 1, "explanations": ["Incorrect; penicillin was introduced in 1945 ('take this penicillin').", "Correct; the timeline explicitly states '1955 AD Oops... bugs mutated. Here, take this tetracycline.'", "Incorrect; potions are associated with the 1850 AD milestone.", "Incorrect; pills are associated with the 1920 AD milestone ('swallow this pill')."], "mid": "bhm05"}, {"tag": "BHM151·Q175", "difficulty": "hard", "section": "Why are you in the best program", "qt": "single", "source": "BHM 151 — IKA, slide 3", "qc": "Which recent global event is explicitly credited in the lectures with paving the way for real, serious engagement with herbal medicine?", "options": ["The global economic recession of 2008", "The COVID-19 pandemic", "The proliferation of herbal schools in Europe", "The complete failure of the penicillin class of antibiotics"], "correct_index": 1, "explanations": ["Incorrect; economic recessions are not mentioned in relation to engagement with herbal medicine.", "Correct; slide 3 states 'COVID has opened the way for real engagement with Herbal medicine'.", "Incorrect; herbal schools are proliferating in Africa, while Europe is described as rethinking healthcare.", "Incorrect; penicillin failure is part of the historical alternative medicine timeline, not the direct COVID engagement factor."], "mid": "bhm05"}, {"tag": "BHM151·Q176", "difficulty": "hard", "section": "Healthcare systems and synonyms", "qt": "single", "source": "BHM 151 — IKA, slide 7", "qc": "Which collection of terms is exclusively associated with the unorthodox healthcare system in the lecture nomenclature?", "options": ["Allopathic, Western, Biomedicine", "Folk, Holistic, Ethnomedicine", "Modern, Scientific, Conventional", "Phytotherapy, Botanic medicine, Orthodox"], "correct_index": 1, "explanations": ["Incorrect; these are orthodox terms.", "Correct; folk, holistic, and ethnomedicine are all listed under the unorthodox system synonyms on slide 7.", "Incorrect; these are orthodox terms.", "Incorrect; orthodox is an alternative name for the conventional system, making the group mixed."], "mid": "bhm05"}, {"tag": "BHM151·Q177", "difficulty": "devil", "section": "Healthcare systems definitions", "qt": "single", "source": "BHM 151 — IKA, slide 8", "qc": "What is the fundamental distinction between complementary medicine and alternative medicine based on how they are practiced alongside conventional care?", "options": ["Complementary medicine uses non-mainstream practices instead of conventional care, while alternative uses them together.", "Complementary medicine is unscientific, whereas alternative medicine is recognized as orthodox biomedicine.", "Complementary medicine uses non-mainstream practices together with conventional medicine, while alternative uses them instead of conventional medicine.", "Complementary medicine is practiced exclusively by formal health facilities, while alternative is folk-based."], "correct_index": 2, "explanations": ["Incorrect; this reverses the definitions provided on slide 8.", "Incorrect; both are non-mainstream practices falling under unconventional medicine.", "Correct; slide 8 defines complementary as 'used together with conventional medicine' and alternative as 'used instead of conventional medicine'.", "Incorrect; facility involvement defines integrative medicine, not complementary versus alternative."], "mid": "bhm05"}, {"tag": "BHM151·Q178", "difficulty": "devil", "section": "Terminologies", "qt": "single", "source": "BHM 151 — IKA, slide 9", "qc": "According to the WHO (2002) definition provided in the slides, what specifically categorizes a healthcare practice as 'Complementary' or 'Alternative Medicine' (CAM) within a specific country?", "options": ["It must be completely derived from indigenous cultural knowledge and historical plant-based traditions.", "It is not part of that country's own tradition and is not integrated into the dominant health care system.", "It must be exclusively practiced by officially recognized traditional medicine practitioners chosen by deities.", "It refers strictly to plant, animal, and mineral-based medicines combined with spiritual healing."], "correct_index": 1, "explanations": ["Incorrect; indigenous origin defines traditional medicine rather than the defining criteria for CAM in this context.", "Correct; the slide defines CAM as a broad set of healthcare practices not part of that country's own tradition and not integrated into the dominant health care system.", "Incorrect; selection by deities relates to the origin of traditional medicine practitioners, not the WHO definition of CAM.", "Incorrect; this describes the material scope of traditional medicine rather than the institutional criteria for CAM."], "mid": "bhm05"}, {"tag": "BHM151·Q179", "difficulty": "hard", "section": "CAM Practices", "qt": "single", "source": "BHM 151 — IKA, slide 10", "qc": "Which of the following sets of healthcare modalities are explicitly classified together under general CAM practices rather than body techniques or diet/herbs in the provided lectures?", "options": ["Chiropractic, osteopathic medicine, and massage", "Dietary supplements, herbal medicine, and nutrition", "Acupuncture, Ayurveda, Homeopathy, and Naturopathy", "Electromagnetic therapy, Reiki, Tai chi, and Yoga"], "correct_index": 2, "explanations": ["Incorrect; these are classified under body techniques on slide 11.", "Incorrect; these are classified under diet and herbs on slide 12.", "Correct; these are explicitly listed together under CAM practices on slide 10.", "Incorrect; Tai chi and yoga are body techniques, while electromagnetic therapy and Reiki are energy-based."], "mid": "bhm05"}, {"tag": "BHM151·Q180", "difficulty": "devil", "section": "CAM Practices", "qt": "single", "source": "BHM 151 — IKA, slide 11", "qc": "A clinical researcher is categorizing intervention modalities for a study based strictly on the BHM 151 slides. Which group of therapies should be placed under body techniques?", "options": ["Acupuncture, Ayurveda, and Homeopathy", "Chiropractic, osteopathic medicine, massage, body movement therapies, Tai chi, and Yoga", "Dietary supplements, herbal medicine, nutrition/diet, electromagnetic therapy, and Reiki", "Chinese or Oriental medicine (TCM), Naturopathy, and Reiki"], "correct_index": 1, "explanations": ["Incorrect; these belong to the general CAM practices list on slide 10.", "Correct; this exact grouping matches the body techniques slide 11.", "Incorrect; these belong to diet, herbs, and energy-based therapies on slide 12.", "Incorrect; TCM and Naturopathy are general CAM practices, and Reiki is energy-based."], "mid": "bhm05"}, {"tag": "BHM151·Q181", "difficulty": "devil", "section": "CAM Practices", "qt": "single", "source": "BHM 151 — IKA, slide 12", "qc": "When analyzing the classifications on slide 12, how are electromagnetic therapy and Reiki categorized in relation to dietary and herbal modalities?", "options": ["They are listed as sub-categories under dietary supplements and nutrition.", "They are classified separately as energy-based therapies following the diet and herbs list.", "They are grouped under body movement therapies alongside Tai chi and Yoga.", "They are integrated directly into traditional medicine material definitions."], "correct_index": 1, "explanations": ["Incorrect; dietary supplements and nutrition are separate from electromagnetic therapy and Reiki.", "Correct; slide 12 lists dietary and herbal items and explicitly concludes with 'Energy based therapies' encompassing electromagnetic therapy and Reiki.", "Incorrect; Tai chi and yoga are body techniques from slide 11.", "Incorrect; they are presented within the context of CAM/therapy categorizations on slide 12."], "mid": "bhm05"}, {"tag": "BHM151·Q182", "difficulty": "hard", "section": "Traditional Medicine", "qt": "single", "source": "BHM 151 — IKA, slide 13", "qc": "Based on the theoretical framework of Traditional Medicine defined on slide 13, which foundational elements primarily constitute its practices?", "options": ["Empirically validated laboratory trials and randomized controlled pharmacological testing", "Knowledge, skills, and practices based on theories, beliefs, and experiences indigenous to different cultures", "Globalized biomedical standards integrated universally across dominant health systems", "Exclusively botanical extracts derived through extrasensory perception and dreams"], "correct_index": 1, "explanations": ["Incorrect; TM is based on traditional knowledge, beliefs, and cultural experiences, not modern clinical trials.", "Correct; slide 13 defines TM as knowledge, skills, and practices based on theories, beliefs, and experiences indigenous to different cultures.", "Incorrect; TM often stands outside or parallel to dominant biomedical healthcare systems.", "Incorrect; while extrasensory perception is an origin source, the general definition relies on indigenous theories, beliefs, and experiences."], "mid": "bhm05"}, {"tag": "BHM151·Q183", "difficulty": "devil", "section": "Traditional Medicine", "qt": "single", "source": "BHM 151 — IKA, slide 14", "qc": "According to slide 14, what is the comprehensive scope of material sources and therapeutic targets encompassed by Traditional Medicine?", "options": ["Plant-based materials used exclusively to treat acute physical illnesses in individuals", "Plant, animal, and mineral-based medicines and other artefacts used to treat physical, mental, social, and spiritual imbalances", "Mineral and animal products utilized strictly for spiritual purification and religious ceremonies", "Synthetic analogues derived from traditional knowledge used to prevent mental and social illnesses"], "correct_index": 1, "explanations": ["Incorrect; TM includes animal and mineral-based medicines and addresses mental, social, and spiritual imbalances, not just physical.", "Correct; slide 14 states it refers to plant, animal, and mineral based medicines and artefacts used to treat physical illnesses or mental, social, and spiritual imbalances.", "Incorrect; they are used to treat physical, mental, social, and spiritual conditions and maintain overall well-being, not just spiritual ceremonies.", "Incorrect; TM uses natural plant, animal, and mineral materials/artefacts, not synthetic analogues."], "mid": "bhm05"}, {"tag": "BHM151·Q184", "difficulty": "hard", "section": "Origins of TM", "qt": "single", "source": "BHM 151 — IKA, slide 15", "qc": "According to the cosmological perspective of the origin of Traditional Medicine on slide 15, how does a practitioner typically attain their role within the community?", "options": ["Through rigorous formal enrollment in a university-affiliated school of pharmacology", "By being chosen for training in healing by the deities, spirits, or community elders", "Through self-directed clinical experimentation using local flora and fauna", "By inheriting patent rights to synthetic drug manufacturing from ancestors"], "correct_index": 1, "explanations": ["Incorrect; formal university pharmacology is a modern biomedical construct.", "Correct; slide 15 states that the practitioner may be chosen for training in healing by the deities/spirits or elders to become the 'medicine man'.", "Incorrect; the origin attributes the role to a divine gift and selection rather than self-directed experimentation.", "Incorrect; TM relies on traditional knowledge and divine selection, not patent rights or synthetic manufacturing."], "mid": "bhm05"}, {"tag": "BHM151·Q185", "difficulty": "devil", "section": "Origins of TM", "qt": "single", "source": "BHM 151 — IKA, slide 16", "qc": "In addition to divine or godly origins, what alternative epistemological sources of medicinal knowledge are explicitly recognized in the formation of traditional medical systems on slide 16?", "options": ["Peer-reviewed clinical journals and international ethnobotanical databases", "Revelation through dreams, visions, and extrasensory perception", "Direct genetic inheritance of biochemical synthesis pathways", "Industrial manufacturing accidents leading to accidental discovery"], "correct_index": 1, "explanations": ["Incorrect; peer-reviewed journals belong to modern science, not traditional epistemologies listed on slide 16.", "Correct; slide 16 notes that some knowledge of medicines is claimed to have come by revelation through dreams, visions, and extrasensory perception.", "Incorrect; genetic inheritance of biochemical pathways is biologically impossible in this context.", "Incorrect; industrial accidents are irrelevant to the historical and cultural origins of TM."], "mid": "bhm05"}, {"tag": "BHM151·Q186", "difficulty": "devil", "section": "Origins of TM", "qt": "single", "source": "BHM 151 — IKA, slide 16", "qc": "How did the postulates regarding the divine and mystical origins of Traditional Medicine translate into structured healthcare systems globally, according to slide 16?", "options": ["They resulted in a fragmented, unorganized set of superstitions with no empirical value.", "They formed the basis of a sophisticated, time-tested traditional medical system where plant use information was methodically collected over years.", "They were immediately replaced by standardized biomedical practices during early colonization.", "They functioned solely as religious dogma without any practical application to disease management."], "correct_index": 1, "explanations": ["Incorrect; slide 16 explicitly describes it as a sophisticated, time-tested system, not fragmented superstitions.", "Correct; slide 16 states these postulates formed the basis of a sophisticated traditional medical system worldwide; a time-tested system where information on medicinal plants use was methodically collected over several years.", "Incorrect; the slide emphasizes the development and persistence of a sophisticated traditional system, not immediate replacement.", "Incorrect; they were used in the fight against diseases that threatened individual and community well-being, possessing practical application."], "mid": "bhm05"}, {"tag": "BHM151·Q187", "difficulty": "hard", "section": "Origins of TM", "qt": "single", "source": "BHM 151 — IKA, slide 15", "qc": "Why was the origin of Traditional Medicine, as a gift from deities or spirits on slide 15, considered vital to early human societies?", "options": ["To provide a commercial commodity for international trade and economic enrichment", "To enable man to fight diseases threatening the well-being of the individual, family, and entire community", "To establish a political hierarchy and class division within indigenous populations", "To replace agricultural practices with spiritual meditation techniques"], "correct_index": 1, "explanations": ["Incorrect; TM originated as a gift to fight diseases, not as a commercial trade commodity.", "Correct; slide 15 states it was a gift to enable man to fight the diseases that threaten not only the well-being of the individual sufferer but that of the entire family or community.", "Incorrect; the purpose was disease mitigation and survival, not political stratification.", "Incorrect; it was aimed at disease management and well-being, not replacing agriculture."], "mid": "bhm05"}, {"tag": "BHM151·Q188", "difficulty": "devil", "section": "Terminologies", "qt": "single", "source": "BHM 151 — IKA, slide 9", "qc": "Reflecting on slide 9, what contextual nuance is highlighted regarding the terminology 'Complementary or Alternative Medicine' (CAM)?", "options": ["It is universally defined and legally standardized across all member states by the WHO.", "The terms 'Complementary' or 'Alternative Medicine' are used interchangeably with Traditional Medicine in some countries.", "It is strictly prohibited from being used in conjunction with Western biomedicine.", "It refers exclusively to practices originating from Western European folk medicine."], "correct_index": 1, "explanations": ["Incorrect; definitions and integration vary by country, and the slide notes specific interchangeable usage 'in some countries'.", "Correct; slide 9 explicitly states: 'Complementary' or 'Alternative Medicine' are used inter-changeably with Traditional Medicine in some countries.", "Incorrect; complementary practices by definition often work alongside dominant systems.", "Incorrect; CAM encompasses diverse non-dominant practices globally, not just Western folk medicine."], "mid": "bhm05"}, {"tag": "BHM151·Q189", "difficulty": "hard", "section": "Traditional Medicine", "qt": "single", "source": "BHM 151 — IKA, slide 14", "qc": "Based on slide 14, which dimensions of human health does Traditional Medicine actively aim to address and maintain beyond simple physical pathology?", "options": ["Economic stability and political compliance", "Mental, social, and spiritual imbalances, as well as overall individual or group well-being", "Genetic enhancement and physical endurance optimization", "Agricultural productivity and livestock health maintenance"], "correct_index": 1, "explanations": ["Incorrect; economic and political factors are outside the clinical scope defined in slide 14.", "Correct; slide 14 lists treating physical illnesses or mental, social, and spiritual imbalances and maintaining the well-being of an individual or group.", "Incorrect; genetic enhancement is a modern biotechnological concept not found in TM definitions.", "Incorrect; agricultural productivity is not part of the human health and well-being scope outlined on slide 14."], "mid": "bhm05"}, {"tag": "BHM151·Q190", "difficulty": "hard", "section": "Traditional Medicine Practitioners", "qt": "single", "source": "BHM 151 — IKA, slide 17", "qc": "According to the slide definition of a Traditional Medicine Practitioner (TMP), which underlying determinant explicitly guides the selection of methods and substances used for healthcare?", "options": ["The official pharmaceutical guidelines endorsed by the national ministry of health", "The social, cultural, and religious background prevalent in the community", "Rigorous double-blind clinical trials conducted on vegetable, animal, and mineral substances", "Standardized international pharmacopeia protocols for disease causation"], "correct_index": 1, "explanations": ["Incorrect; national pharmaceutical guidelines are not mentioned in the slide.", "Correct; the definition states methods are based on the social, cultural and religious background, knowledge, attitude, and beliefs prevalent in the community.", "Incorrect; clinical trials are absent from the community-based cultural definition provided.", "Incorrect; international pharmacopeia protocols are not referenced in the slide."], "mid": "bhm05"}, {"tag": "BHM151·Q191", "difficulty": "devil", "section": "Traditional Medicine Practitioners", "qt": "single", "source": "BHM 151 — IKA, slide 18", "qc": "How does the extended description of a Traditional Medicine Practitioner differentiate the inclusion of non-material methods in their practice?", "options": ["It requires all practitioners to strictly exclude psychic processes and rely solely on mineral substances.", "It allows for the practice of indigenous or folk medicine with or without the use of psychic or spiritual processes.", "It dictates that psychic or spiritual processes must be the primary diagnostic tool used by herbalists.", "It restricts psychic processes exclusively to bone setters and circumcisers."], "correct_index": 1, "explanations": ["Incorrect; the slide explicitly states substances are used with or without psychic or spiritual processes.", "Correct; slide 18 notes they use plants, animal and other natural substances with or without the use of psychic or spiritual processes.", "Incorrect; psychic processes are optional, not designated as the primary diagnostic tool for all.", "Incorrect; the slide does not restrict psychic processes to specific subgroups like bone setters."], "mid": "bhm05"}, {"tag": "BHM151·Q192", "difficulty": "hard", "section": "Categories of TMPs", "qt": "classification", "source": "BHM 151 — IKA, slide 19", "qc": "Which of the following groups is explicitly classified as a distinct category of Traditional Medicine Practitioners alongside herbalists and traditional birth attendants?", "options": ["Modern pharmaceutical technologists", "Shrine devotees and Cult adherents", "University-trained clinical pharmacologists", "Licensed municipal health inspectors"], "correct_index": 1, "explanations": ["Incorrect; modern pharmaceutical technologists are not listed among TMPs.", "Correct; shrine devotees and cult adherents are explicitly listed as a category of TMPs in slide 19.", "Incorrect; university-trained clinical pharmacologists are modern biomedical professionals.", "Incorrect; licensed municipal health inspectors fall under conventional public administration."], "mid": "bhm05"}, {"tag": "BHM151·Q193", "difficulty": "devil", "section": "Role of the TMP", "qt": "single", "source": "BHM 151 — IKA, slide 20", "qc": "In the context of the traditional practitioner's multifaceted duties, which combination of modern healthcare roles does the slide explicitly state they combine?", "options": ["Physician, pharmacist, nurse, and technologist", "Surgeon, general practitioner, laboratory scientist, and dietician", "Pediatrician, obstetrician, psychiatrist, and physiotherapist", "Administrator, epidemiologist, researcher, and dispenser"], "correct_index": 0, "explanations": ["Correct; slide 20 states that traditional practitioners combine the modern role of physician, pharmacist, nurse and technologist.", "Incorrect; surgeon, general practitioner, laboratory scientist, and dietician are not the specific combination listed.", "Incorrect; this combination is broader than the four specific modern roles cited in the slide.", "Incorrect; administrator, epidemiologist, researcher, and dispenser are not mentioned in slide 20."], "mid": "bhm05"}, {"tag": "BHM151·Q194", "difficulty": "hard", "section": "Role of the TMP", "qt": "single", "source": "BHM 151 — IKA, slide 20", "qc": "Which characteristic regarding the educational and demographic profile of TMPs is highlighted in slide 20?", "options": ["They are exclusively urban dwellers with advanced postgraduate degrees.", "Many are illiterate or semi-illiterate and elderly.", "They are restricted entirely to young, highly literate male professionals.", "All practitioners operate strictly as paid professionals within formal institutions."], "correct_index": 1, "explanations": ["Incorrect; the slide mentions diverse backgrounds including rural/urban, rich/poor, and educated/illiterate.", "Correct; slide 20 explicitly notes that many are illiterate or semi-illiterate and elderly.", "Incorrect; the slide lists diverse classes including male, female, adults, children, and both educated and illiterates.", "Incorrect; the slide notes they often manage diseases without charge and span amateurs and professionals."], "mid": "bhm05"}, {"tag": "BHM151·Q195", "difficulty": "hard", "section": "Concepts and definitions", "qt": "single", "source": "BHM 151 — IKA, slide 21", "qc": "How is a Traditional Birth Attendant (TBA) specifically recognized and validated within her community according to slide 21?", "options": ["Through formal certification issued by the national medical council", "By virtue of skills and experience recognized by the community in which she lives", "Through mandatory completion of a university nursing degree", "By appointment from international global health organizations"], "correct_index": 1, "explanations": ["Incorrect; formal certification by a national medical council is a biomedical standard, not community recognition.", "Correct; slide 21 defines a TBA as a traditional midwife who, by virtue of skills and experience is recognized by the community.", "Incorrect; university nursing degrees do not define a TBA in this traditional context.", "Incorrect; international health organizations do not appoint TBAs according to the slide."], "mid": "bhm05"}, {"tag": "BHM151·Q196", "difficulty": "devil", "section": "Concepts and definitions", "qt": "single", "source": "BHM 151 — IKA, slide 21", "qc": "Which of the following expanded responsibilities is attributed to a traditional midwife beyond assisting mothers during pregnancy and labour on slide 21?", "options": ["Performing major surgical interventions for obstetric emergencies", "Providing family planning to couples in need of child spacing", "Conducting industrial drug safety trials and pharmacokinetic assays", "Managing chronic cardiovascular diseases in elderly populations"], "correct_index": 1, "explanations": ["Incorrect; major surgical interventions are outside the scope described in the slide.", "Correct; slide 21 states she provides family planning to couples in need of child spacing and undertakes counselling and treatment for fertility difficulties.", "Incorrect; industrial drug trials are not part of a traditional midwife's duties.", "Incorrect; chronic cardiovascular management is not listed among her specific maternal and paediatric duties."], "mid": "bhm05"}, {"tag": "BHM151·Q197", "difficulty": "devil", "section": "Concepts and definitions", "qt": "single", "source": "BHM 151 — IKA, slide 22", "qc": "Reviewing slide 22, what nuance is emphasized regarding traditional midwives and their understanding of maternal care?", "options": ["They are qualified experienced people in understanding and assisting mothers during pregnancy and labour.", "They rely purely on theoretical textbook knowledge without practical experience.", "They operate exclusively in urban clinical facilities away from the community.", "They focus only on postnatal care while excluding labour assistance."], "correct_index": 0, "explanations": ["Correct; slide 22 explicitly states traditional midwives are qualified experienced people in understanding and assisting mothers during pregnancy and labour.", "Incorrect; the slide highlights their qualified experience, not purely theoretical knowledge.", "Incorrect; traditional midwives operate within community settings as established by their role definition.", "Incorrect; the slide states they assist mothers during pregnancy and labour in addition to postnatal care."], "mid": "bhm05"}, {"tag": "BHM151·Q198", "difficulty": "hard", "section": "Herbal Medicine", "qt": "single", "source": "BHM 151 — IKA, slide 23", "qc": "According to slide 23, what distinguishes herbal medicine in terms of its historical position and global usage?", "options": ["It is the newest form of healthcare and the least commonly used globally.", "It is the oldest form of healthcare and globally, the most commonly used type of medicine.", "It is a modern synthetic practice derived entirely from petroleum by-products.", "It is restricted exclusively to developing nations with no global footprint."], "correct_index": 1, "explanations": ["Incorrect; this contradicts the slide which states it is the oldest and most commonly used.", "Correct; slide 23 explicitly states it is the oldest form of healthcare and globally, it is the most commonly used type of medicine.", "Incorrect; herbal medicine uses plants, not petroleum-derived synthetics.", "Incorrect; the slide notes its global usage, not a restriction to developing nations."], "mid": "bhm05"}, {"tag": "BHM151·Q199", "difficulty": "hard", "section": "Herbal Medicine", "qt": "single", "source": "BHM 151 — IKA, slide 23", "qc": "What is the primary therapeutic scope of herbal medicine as defined in the second part of slide 23?", "options": ["To exclusively palliate terminal symptoms without promoting overall health", "To treat and prevent diseases and promote optimum health using plants", "To replace all surgical procedures with topical plant extracts", "To induce targeted genetic mutations for therapeutic enhancement"], "correct_index": 1, "explanations": ["Incorrect; herbal medicine aims to promote optimum health, not just palliate symptoms.", "Correct; slide 23 states that herbal medicine uses plants to treat and prevent diseases and promote optimum health.", "Incorrect; the slide does not claim it replaces all surgical procedures.", "Incorrect; genetic mutation induction is not mentioned in the slide."], "mid": "bhm05"}, {"tag": "BHM151·Q200", "difficulty": "hard", "section": "Herbal Medicine", "qt": "classification", "source": "BHM 151 — IKA, slide 24", "qc": "Which specific components are formally included under the umbrella definition of herbal medicines according to slide 24?", "options": ["Synthetic chemical isolates and laboratory-designed analogs", "Herbs, herbal materials, herbal preparations, and finished herbal products", "Pure mineral crystals and animal organ extracts devoid of plant material", "Genetically modified synthetic nucleotides"], "correct_index": 1, "explanations": ["Incorrect; synthetic chemical isolates are distinct from herbal medicines.", "Correct; slide 24 lists herbs, herbal materials, herbal preparations and finished herbal products.", "Incorrect; these do not match the plant-based ingredient focus specified in slide 24.", "Incorrect; synthetic nucleotides are not part of traditional herbal medicine definitions."], "mid": "bhm05"}, {"tag": "BHM151·Q201", "difficulty": "devil", "section": "Herbal Medicine", "qt": "single", "source": "BHM 151 — IKA, slide 24", "qc": "What must herbal medicines contain as active ingredients according to the structural definition provided in slide 24?", "options": ["Exclusively isolated single chemical compounds synthesized in a laboratory", "Parts of plants, or other plant materials, or combinations thereof", "Purified animal proteins and synthetic binding agents", "Inorganic mineral salts without any organic plant matter"], "correct_index": 1, "explanations": ["Incorrect; isolated single chemical compounds refer to modern pharmaceuticals, not the herbal mixture defined.", "Correct; slide 24 specifies that herbal medicines contain as active ingredients parts of plants, or other plant materials, or combinations.", "Incorrect; animal proteins are not the defining active ingredient specified for herbal medicines in slide 24.", "Incorrect; inorganic mineral salts alone do not constitute herbal medicine active ingredients under this slide."], "mid": "bhm05"}, {"tag": "BHM151·Q202", "difficulty": "hard", "section": "Herbal Medicine Classification", "qt": "single", "source": "BHM 151 — IKA, slide 25", "qc": "Despite being categorized under complementary and alternative medicine (CAM) and often facing a poor reputation, what foundational argument supports the scientific exploration of herbal medicine?", "options": ["It operates on a completely distinct supernatural paradigm compared to conventional medicine.", "It shares the same paradigm as conventional medicine and utilizes comparable investigative parameters.", "It is exempt from the rigorous parameters used for allopathic drugs due to its natural biodegradability.", "It has been fully proven to be superior to conventional medicine in clinical trials."], "correct_index": 1, "explanations": ["Incorrect because herbal medicine shares the same paradigm as conventional medicine, not a supernatural one.", "Correct because the slide explicitly states that herbal medicine has the same paradigm as conventional medicine and its products can be investigated using similar parameters.", "Incorrect because the slide states its products can be investigated using similar parameters as allopathic drugs.", "Incorrect because the slide does not claim superiority over conventional medicine."], "mid": "bhm05"}, {"tag": "BHM151·Q203", "difficulty": "devil", "section": "Justification for Herbal Medicine", "qt": "single", "source": "BHM 151 — IKA, slide 26", "qc": "A pharmaceutical analyst evaluating consumer shifts notes an increased preference for herbal products. According to the slide, which combination of factors directly drives this resurgence?", "options": ["Mandatory conventional drug shortages, economic collapse, and strict regulatory enforcement", "Disaffection with conventional medicines, interest in natural products, and environmental awareness of biodegradability", "Absolute clinical proof of herbal superiority, zero side effects, and endorsement by the Alma-Ata declaration", "Complete rejection of allopathic science, universal affordability, and government subsidies"], "correct_index": 1, "explanations": ["Incorrect because mandatory shortages and economic collapse are not listed as reasons.", "Correct because the slide lists disaffection with conventional medicines, interest in natural products, and environmental awareness of their being biodegradable items.", "Incorrect because absolute clinical proof and zero side effects are not mentioned in this context.", "Incorrect because complete rejection of science and government subsidies are not stated drivers."], "mid": "bhm05"}, {"tag": "BHM151·Q204", "difficulty": "hard", "section": "Justification for HM", "qt": "single", "source": "BHM 151 — IKA, slide 27", "qc": "What direct global administrative impetus catalyzed the widespread resurgence of interest in traditional medicine and traditional medicine practitioners (TMPs) in developing nations?", "options": ["The 1948 WHO definition of health as a state of complete well-being", "The 1978 WHA-UNICEF joint declaration of Alma-Ata giving recognition for developing TM and TMPs", "The establishment of Hippocrates' maxim 'First do no harm' in modern pharmacology", "The strict classification of herbalism as a non-conventional complementary system"], "correct_index": 1, "explanations": ["Incorrect because the 1948 WHO definition defines health, not the specific impetus for TM/TMP recognition.", "Correct because the slide states the 1978 WHA-UNICEF joint declaration of Alma-Ata gave recognition for developing TM and TMPs which spurred much interest.", "Incorrect because Hippocrates' maxim relates to the validity and goals of healthcare, not the Alma-Ata TM resolution.", "Incorrect because classification as CAM represents the poor light or general grouping, not the catalyst for development."], "mid": "bhm05"}, {"tag": "BHM151·Q205", "difficulty": "devil", "section": "Alma-Ata and Primary Health Care", "qt": "single", "source": "BHM 151 — IKA, slide 28", "qc": "In the context of the International Conference on Primary Health Care held in Alma-Ata in 1978, what specific structural objective was tied to the use of traditional medicine?", "options": ["Achieving total global eradication of infectious diseases through herbal isolation", "Achieving equity of access to healthcare services", "Replacing allopathic hospital infrastructure with traditional healing huts", "Eliminating the financial costs of primary healthcare globally"], "correct_index": 1, "explanations": ["Incorrect because eradication of infectious diseases is not mentioned in the slide.", "Correct because the slide explicitly states the goal was 'to achieve equity of access through the use of traditional medicine'.", "Incorrect because replacing allopathic infrastructure is neither stated nor implied.", "Incorrect because while affordability is a goal, the specific Alma-Ata text linked TM to equity of access."], "mid": "bhm05"}, {"tag": "BHM151·Q206", "difficulty": "devil", "section": "Health Definition", "qt": "single", "source": "BHM 151 — IKA, slide 29", "qc": "When critically analyzing the WHO (1948) definition of health, which condition is designated as insufficient on its own to constitute true health?", "options": ["Complete physical well-being without any mental or social components", "The mere absence of disease or infirmity", "A state of balanced physical and mental capacity", "Complete social adaptation without physiological metrics"], "correct_index": 1, "explanations": ["Incorrect because physical well-being is part of the positive state, but the text explicitly targets the negative condition.", "Correct because the slide defines health as complete physical, mental and social well-being 'and not merely the absence of disease or infirmity'.", "Incorrect because balanced capacity is a partial interpretation, not the specific contrast emphasized.", "Incorrect because social adaptation alone is not the phrase used in the exclusion clause."], "mid": "bhm05"}, {"tag": "BHM151·Q207", "difficulty": "hard", "section": "Approach to Health", "qt": "single", "source": "BHM 151 — IKA, slide 30", "qc": "A patient suffering from a mild cough first prepares a remedy using honey and lemon before consulting anyone else. According to behavioral healthcare approaches, which tier of the hierarchy of resort does this initial action represent?", "options": ["Seeking expert assistance", "Consulting family and friends", "Seeking simple home remedy, folk medicine", "Engaging in allopathic clinical trials"], "correct_index": 2, "explanations": ["Incorrect because seeking expert assistance is the final tier in the resort hierarchy.", "Incorrect because consulting family and friends is the second tier.", "Correct because using honey and lemon for a cough is explicitly categorized under 'seeking simple home remedy, folk medicine'.", "Incorrect because clinical trials are not part of the patient's resort hierarchy."], "mid": "bhm05"}, {"tag": "BHM151·Q208", "difficulty": "devil", "section": "Approach to Health", "qt": "single", "source": "BHM 151 — IKA, slide 30", "qc": "When individuals navigate health challenges through a 'hierarchy of resort', what is the standard behavioral progression sequence outlined in the slides?", "options": ["Expert assistance -> Family and friends -> Simple home remedy", "Simple home remedy -> Consulting family and friends -> Seeking expert assistance", "Family and friends -> Simple home remedy -> Expert assistance", "Seeking expert assistance -> Simple home remedy -> Family and friends"], "correct_index": 1, "explanations": ["Incorrect because this reverses the logical escalation of resort.", "Correct because the slide lists the resort hierarchy sequentially as seeking simple home remedies/folk medicine, then consulting family and friends, then seeking expert assistance.", "Incorrect because family and friends precede expert assistance, but home remedies precede consulting others.", "Incorrect because expert assistance is the terminal step in the provided hierarchy, not the first."], "mid": "bhm05"}, {"tag": "BHM151·Q209", "difficulty": "hard", "section": "Validity of Healthcare", "qt": "single", "source": "BHM 151 — IKA, slide 31", "qc": "An institutional auditor is assessing the structural validity of an unorthodox medical practice. Which operational parameters must the auditor evaluate to determine the system's validity?", "options": ["Diagnostic methods, Treatment, and Therapy practiced", "Affordability, Availability, and Safety indices", "Biodegradability, Environmental awareness, and Natural product yield", "Patient population size, Economic output, and Administrative cost"], "correct_index": 0, "explanations": ["Correct because the slide explicitly states that the validity of the system refers to the measure of the Diagnostic methods, Treatment, and Therapy practiced.", "Incorrect because affordability and availability are goals of appropriate healthcare delivery, not the direct definition of validity itself.", "Incorrect because biodegradability relates to reasons for using herbal medicine, not the validity of a healthcare system.", "Incorrect because economic and administrative metrics are irrelevant to the slide's definition of validity."], "mid": "bhm05"}, {"tag": "BHM151·Q210", "difficulty": "devil", "section": "Validity of Healthcare", "qt": "single", "source": "BHM 151 — IKA, slide 31", "qc": "Hippocrates, recognized as the Father of modern medicine, introduced a fundamental clinical maxim that aligns with the overarching goal of well-meaning healthcare systems. What is this principle?", "options": ["Heal quickly, diagnose thoroughly", "First do no harm", "Natural remedies are invariably safe", "Equity of access supersedes therapeutic efficacy"], "correct_index": 1, "explanations": ["Incorrect because 'Heal quickly, diagnose thoroughly' is a fabricated medical maxim.", "Correct because the slide notes that Hippocrates pronounced 'First do no harm', known as the Father of modern medicine.", "Incorrect because natural remedies being invariably safe is a misconception, not Hippocrates' maxim.", "Incorrect because equity of access comes from Alma-Ata, not Hippocrates."], "mid": "bhm05"}, {"tag": "BHM151·Q211", "difficulty": "hard", "section": "Goals of Healthcare", "qt": "classification", "source": "BHM 151 — IKA, slide 32", "qc": "An international health agency is drafting benchmarks for a newly integrated traditional healthcare framework. According to the slides, what are the four core requirements an appropriate healthcare delivery system must satisfy?", "options": ["Safe, effective, affordable, and available", "Scientific, statutory, subsidized, and systematic", "Natural, biodegradable, accessible, and alternative", "Preventative, diagnostic, therapeutic, and palliative"], "correct_index": 0, "explanations": ["Correct because the slide explicitly lists the four goals of all appropriate healthcare delivery systems as safe, effective, affordable, and available service.", "Incorrect because scientific, statutory, subsidized, and systematic are not the four listed goals.", "Incorrect because natural and biodegradable refer to herbal medicine popularity/properties, not the four healthcare delivery goals.", "Incorrect because preventative or palliative are clinical classifications, not the four overarching service delivery goals."], "mid": "bhm05"}, {"tag": "BHM151·Q212", "difficulty": "devil", "section": "Validity & Goals of Healthcare", "qt": "single", "source": "BHM 151 — IKA, slide 31", "qc": "How do the fundamental requirements of a well-meaning healthcare system connect the concepts attributed to Hippocrates with broader treatment delivery goals?", "options": ["Hippocrates' principle of 'First do no harm' underpins the requirement for safe and effective therapy.", "Hippocrates' focus on natural products dictates the requirement for environmental biodegradability.", "Hippocrates' diagnostic methods define the economic affordability of healthcare systems.", "Hippocrates' promotion of primary health care enforces equity of access in Alma-Ata."], "correct_index": 0, "explanations": ["Correct because 'First do no harm' directly establishes the foundational requirement for safety and therapeutic efficacy in healthcare systems.", "Incorrect because Hippocrates' maxim is about harm prevention, not environmental biodegradability.", "Incorrect because Hippocrates did not address economic affordability.", "Incorrect because Hippocrates predated the Alma-Ata declaration by millennia."], "mid": "bhm05"}, {"tag": "BHM151·Q213", "difficulty": "devil", "section": "Herbal Medicine Classification", "qt": "single", "source": "BHM 151 — IKA, slide 25", "qc": "A critic argues that herbal medicine should be dismissed because it is grouped under complementary and alternative medicine (CAM) and viewed as unscientific. How does the slide counter this specific critique?", "options": ["By asserting that CAM systems completely replace the need for allopathic parameters.", "By noting that despite poor representation, it operates on the same paradigm as conventional medicine and can be investigated similarly.", "By proving that all conventional medicines are actually derived from unscientific herbal roots.", "By establishing that CAM systems are exempt from scientific validation due to their natural status."], "correct_index": 1, "explanations": ["Incorrect because the slide does not claim CAM replaces conventional medicine.", "Correct because the slide acknowledges it is represented in a poor light as unscientific, but counters that it has the same paradigm as conventional medicine and can be investigated using similar parameters.", "Incorrect because the slide does not make this historical claim about conventional medicines.", "Incorrect because the slide states its products *can* be investigated using similar parameters, meaning they are not exempt from scientific scrutiny."], "mid": "bhm05"}, {"tag": "BHM151·Q214", "difficulty": "devil", "section": "Global Trends in HM", "qt": "single", "source": "BHM 151 — IKA, slide 33", "qc": "According to epidemiological data regarding regional usage patterns, what distinguishes the utilization of herbal medicines in developing African nations like Ghana and Nigeria compared to industrialized regions like Europe?", "options": ["African nations exclusively use herbal medicines for pediatric care, whereas Europe uses them only for chronic illnesses.", "In specified African nations, herbal medicine serves as the primary home treatment for 60% of pediatric high fevers from malaria, whereas industrialized regions report over 50% overall CAM usage.", "Industrialized regions consume 30%-50% of their total medicinal products as herbal preparations, matching the malaria treatment statistics in West Africa.", "African countries rely solely on institutionalized clinical trials for herbal malaria treatments, unlike the unregulated home usage in Europe."], "correct_index": 1, "explanations": ["Incorrect, slide 33 does not state exclusivity to pediatric care or restrict European usage solely to chronic illnesses.", "Correct, slide 33 explicitly contrasts the 60% first-line home treatment for childhood malarial fever in Ghana, Mali, Nigeria, and Zambia with the >50% general CAM use in industrialized regions.", "Incorrect, the 30%-50% medicinal consumption statistic is attributed specifically to China on slide 33, not industrialized regions.", "Incorrect, slide 33 mentions home use for children in Africa, not institutionalized clinical trials."], "mid": "bhm05"}, {"tag": "BHM151·Q215", "difficulty": "hard", "section": "Global Trends in HM", "qt": "single", "source": "BHM 151 — IKA, slide 34", "qc": "When evaluating the statistical data collected on Alternative Therapy utilization in Western countries during the late 20th and early 21st centuries, which of the following comparative inferences is most accurate?", "options": ["A 2002 US survey reported that 36% of Americans used alternative therapy over a 12-month period, which Ernst noted aligns with the general observation that about half of the developed world's population uses CAM.", "The BBC 1998 survey indicated a significantly higher prevalence of alternative medicine use in Britain (50%) than the US survey in 2002 (36%).", "Ernst's publication in the Medical Journal of Australia contradicted both the US and British surveys by claiming zero prevalence of alternative medicine in developed countries.", "The 36% usage in the US exclusively measured herbal treatments, omitting practices like yoga and meditation."], "correct_index": 0, "explanations": ["Correct, slide 34 notes 36% of Americans used alternative therapy in the past 12 months (including yoga, meditation, herbal treatments) and Ernst wrote that about half the general population in developed countries use CAM.", "Incorrect, the BBC 1998 survey showed around 20% of adults in Britain had used alternative ulation", "qt": "single", "source": "BHM 151 — IKA, slide 36", "qc": "Under the current European Union directive affecting traditional herbal medicinal products, what specific historical proof of use timeline must a product satisfy to secure a license?", "options": ["30 years of continuous use exclusively within member states of the European Union.", "15 years of use within the EU combined with 15 years of use elsewhere, or 30 years of use within the EU.", "30 years of use within colonized countries like Ghana or South Africa, independent of EU documentation.", "20 years in the EU and 10 years in North America."], "correct_index": 1, "explanations": ["Incorrect, the rule permits alternative geographic distributions as long as the total duration is met.", "Correct, slide 36 states a traditional herbal medicinal product must show use for 30 years in the EU, or at least 15 years in the EU and 15 years elsewhere.", "Incorrect, the 30-year threshold must involve the EU (either entirely or split 15/15 with elsewhere), not solely colonized countries.", "Incorrect, the split is 15 years in the EU and 15 years elsewhere, not 20 and 10."], "mid": "bhm05"}, {"tag": "BHM151·Q218", "difficulty": "devil", "section": "Historical Context", "qt": "single", "source": "BHM 151 — IKA, slide 36", "qc": "While traditional practices in Europe thrived due to an initial lack of restrictive laws, what distinct fate did they experience in colonized territories such as Ghana, South Africa, and Thailand according to the historical records?", "options": ["They were immediately integrated into official European pharmacopoeias and granted statutory protection.", "Efforts were actively made to ban traditional practices by categorizing them as fetish.", "They were subjected to the exact same EU Directive 2001/83/EC 30-year licensing requirement from the pre-colonial era.", "They received massive financial subsidies from colonial governments to build complex research hospitals."], "correct_index": 1,  astrology is tied to Arabic indigenous medicine foundations, not ATM temporal rhythms.", "Incorrect; lunar calendars for TCM are not mentioned in the ATM slide text."], "mid": "bhm06"}, {"tag": "BHM151·Q267", "difficulty": "hard", "section": "Philosophy of ATM", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 24", "qc": "When an African traditional practitioner utilizes many forms of diagnosis, what is the ultimate functional objective of this diagnostic process?", "options": ["To isolate a single microbial pathogen for targeted pharmaceutical destruction", "To re-align the patient with the origin of the influences in order to re-balance", "To document historical infection rates akin to ancient variolation records", "To classify the patient strictly into physical and anatomical symptom clusters"], "correct_index": 1, "explanations": ["Incorrect; ATM does not focus on isolating single microbial pathogens.", "Correct; using many forms of diagnosis, practitioner re-aligns the patient with the origin of the influences to re-balance.", "Incorrect; variolation recording is a Middle Eastern historical practice, not an ATM diagnostic objective.", "Incorrect; diagnosis encompasses moral, social, physical, and spiritual levels, not just physical symptoms."], "mid": "bhm06"}, {"tag": "BHM151·Q268", "difficulty": "devil", "section": "Diagnostic Techniques in TAM", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 25", "qc": "Which of the following diagnostic techniques in Traditional African Medicine utilizes ritual music, sacrifice, spells, and hymns?", "options": ["Tug pulling", "Throwing of split cola nuts", "Incantation/chanting", "Throwing of cowries"], "correct_index": 2, "explanations": ["Tug pulling is listed as a distinct diagnostic technique separate from musical rituals.", "Throwing of split cola nuts is a separate physical divination method.", "Incantation/chanting explicitly takes the form of ritual music, sacrifice spells, hymns on of Practitioners", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 28", "qc": "What fundamental methodological difference separates Diviner-herbalists/masters from Faith herbalist/prophets?", "options": ["Diviner-herbalists use trans-rational reasoning (intuition, divination) rather than Christian faith-based spirit mediums.", "Diviner-herbalists completely avoid the use of any physical herbs or natural preparations.", "Diviner-herbalists rely exclusively on angels within African charismatic churches.", "Diviner-herbalists exclusively manipulate cosmic bodies like the sun and tides."], "correct_index": 0, "explanations": ["Diviner-herbalists use trans-rational reasoning not of Christian faith, unlike faith herbalists.", "Diviner-herbalists use herbs alongside brown/white clay.", "Angels are associated with Christian-based faith herbalists/prophets.", "Cosmologists manipulate cosmic bodies, not diviner-herbalists."], "mid": "bhm06"}, {"tag": "BHM151·Q272", "difficulty": "devil", "section": "Classification of Practitioners", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 29", "qc": "Which category of traditional practitioner is explicitly noted to perform diagnoses via trans-rational reasoning yet uses NO herbs during treatment?", "options": ["Diviner-herbalists/ masters", "Faith herbalist/ prophets", "Diviners (Divinists)", "Cosmologists"], "correct_index": 2, "explanations": ["Diviner-herbalists use herbs along with other natural preparations.", "Faith herbalists administer herbal preparations.", "Diviners (Divinists) use trans-rational reasoning but explicitly do not use herbs.", "Cosmologists diagnose by manipulating bodies in the universe."], "mid": "bhm06"}, {"tag": "BHM151·Q273", "difficulty": "hard", "section": "Classification of Practitioners", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 30", "qc": "A practitioner diagnoses disease by correlating ailments with the tides, moon, and stars, and treats clients by prohibiting certain activities and advising re-alignments. How is this practitioner classified?", "options": ["Cosmologist", "Diviner (Divinist)", "Faith healer/prophet", "Diviner-herbalist"], "correct_index": 0, "explanations": ["Cosmologists manipulate bodies in the universe like the moon, sun, stars, tides, and clouds.", "Diviners use inner knowing/intuition without manipulating celestial bodies.", "Faith healers rely on angels and Christian-based spirit mediums.", "Diviner-herbalists use trans-rational reasoning and herbs/clay."], "mid": "bhm06"}, {"tag": "BHM151·Q274", "difficulty": "hard", "section": "Current Experiences of TM", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 31", "qc": "Regarding the current integration experiences of Traditional African Medicine (TAM) across the continent, which of the following statements is historically accurate according to the lecture?", "options": ["TAM is currently a highly regulated medical sector across all African nations.", "A school of TAM opened in Zimbabwe in October 1999, admitting traditional healers and university graduates.", "Kwa-Mhlanga, South Africa, houses a 100-bed hospital exclusively practicing Western medicine.", "Integration efforts have been entirely rejected by all national medical systems."], "correct_index": 1, "explanations": ["TAM is noted as largely unregulated, not highly regulated.", "Slide 31 explicitly states a school of TAM opened in Zimbabwe in October 1999 for healers and graduates.", "The hospital in Kwa-Mhlanga is a 48-bed hospital combining TAM with Western methods, not 100-bed nor exclusive.", "There is considerable interest in integrating TAM, not total rejection."], "mid": "bhm06"}, {"tag": "BHM151·Q275", "difficulty": "devil", "section": "Current Experiences of TM", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 31", "qc": "Analyze the regulatory and structural status of Traditional African Medicine (TAM) as presented in contemporary experiences. Which statement holds true?", "options": ["TAM is largely unregulated, yet shows considerable institutional interest in national integration.", "TAM is strictly governed by a unified continental regulatory body.", "Institutional integration is restricted solely to university graduates, excluding traditional healers.", "South Africa and Zimbabwe have completely banned TAM in favor of Western systems."], "correct_index": 0, "explanations": ["Slide 31 explicitly notes TAM is largely unregulated and shows considerable interest in national medical system integration.", "No unified continental regulatory body is mentioned.", "The Zimbabwe school explicitly includes both traditional healers and university graduates.", "South Africa and Zimbabwe are cited as examples of integration and institutionalization, not bans."], "mid": "bhm06"}, {"tag": "BHM151·Q276", "difficulty": "devil", "section": "Classification of Practitioners", "qt": "classification", "source": "BHM 151 — Principles_Methods_TM, slide 28", "qc": "Which diagnostic mechanism uniquely sets apart the 'Diviner-herbalists/masters' from other practitioners?", "options": ["Trans-rational reasoning (intuition, divination, manipulating the spirit world not of Christian faith)", "Resort to spirit mediums based strictly on African charismatic Christian churches", "Direct observation and manipulation of celestial bodies such as tides and stars", "Purely scientific and empirical clinical laboratory testing"], "correct_index": 0, "explanations": ["Diviner-herbalists use trans-rational reasoning not of Christian faith.", "Christian-based spirit mediums are used by faith herbalists/prophets, not diviner-herbalists.", "Celestial manipulation is performed by cosmologists.", "Scientific clinical laboratory testing is a feature of Western medicine, not mentioned here."], "mid": "bhm06"}, {"tag": "BHM151·Q277", "difficulty": "hard", "section": "Diagnostic Techniques in TAM", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 25", "qc": "Apart from incantations, chanting, and 'tug pulling', what specific physical divination objects are explicitly enumerated as diagnostic techniques in TAM?", "options": ["Throwing of cowries and split cola nuts", "Microscopes and stethoscope examination", "Reading of star constellations and cloud formations", "Analysis of white and brown clay formations"], "correct_index": 0, "explanations": ["Cowries and split cola nuts are explicitly listed alongside tug pulling and incantations on slide 25.", "Microscopes and stethoscopes belong to Western medical practice.", "Star/cloud observation relates to cosmologists, not the cowries/cola nut diagnostic list.", "White and brown clay are used in treatment by diviner-herbalists, not listed as diagnostic objects on slide 25."], "mid": "bhm06"}, {"tag": "BHM151·Q278", "difficulty": "devil", "section": "Classification of Practitioners", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 29", "qc": "If a practitioner utilizes trans-rational reasoning (intuition and inner knowing) and manipulates a spirit world of uncertain source without ever using herbs, how are they categorized?", "options": ["Diviners (Divinists)", "Diviner-herbalists/masters", "Faith herbalist/prophets", "Cosmologists"], "correct_index": 0, "explanations": ["Diviners (Divinists) use trans-rational reasoning, do not use herbs, and manipulate a spirit world of uncertain source.", "Diviner-herbalists use herbs and natural preparations.", "Faith herbalists use Christian-based angelic revelations and herbal preparations.", "Cosmologists manipulate universal/celestial bodies."], "mid": "bhm06"}, {"tag": "BHM151·Q279", "difficulty": "hard", "section": "Current Experiences of TM", "qt": "single", "source": "BHM 151 — Principles_Methods_TM, slide 31", "qc": "What structural healthcare model is demonstrated by the facility established in Kwa-Mhlanga, South Africa?", "options": ["A 48-bed hospital combining TAM with W
