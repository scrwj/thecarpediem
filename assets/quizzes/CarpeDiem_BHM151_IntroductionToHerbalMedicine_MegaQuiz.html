": "hard", "section": "Definition", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 4", "qc": "Slide 4 defines herbal medicine as a scientific study. What are the dual focal points of this scientific study?", "options": ["Agricultural cultivation techniques and economic market distribution.", "Plant medicines themselves and their therapeutic application to relieve illness and promote health.", "Synthetic drug formulation and allopathic clinical trial design.", "Historical artifacts and ancient anthropological traditions of indigenous tribes."], "correct_index": 1, "explanations": ["Incorrect, economics and agriculture are not the scientific focal points mentioned in slide 4.", "Correct, slide 4 defines it as the scientific study of plant medicines and of their therapeutic application to relieve illness and promote health.", "Incorrect, synthetic drug formulation belongs to conventional allopathic medicine.", "Incorrect, while traditions matter, the scientific study focuses on plant medicines and therapeutic applications."], "mid": "bhm01"}, {"tag": "BHM151·Q10", "difficulty": "devil", "section": "History", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 8", "qc": "What inference can be drawn from slide 8 regarding the evolution of natural product utilization in healthcare?", "options": ["Natural products were completely abandoned during the industrial revolution and only recently reintroduced.", "The therapeutic use of natural products initiated by ancestors has experienced an unbroken continuity of practice down to the present day.", "Ancestral formulation of concoctions has been outlawed in favor of pure synthetic molecules.", "Natural product utilization shifted strictly from animal and mineral sources to exclusively plant-based sources over time."], "correct_index": 1, "explanations": ["Incorrect, slide 8 states the use of natural products as therapeutic agents has continued to date without interruption.", "Correct, slide 8 states the use of at Shanidar would find which of the following pairs explicitly listed together?", "options": ["Achillea millefolium and Equisetum arvense", "Centareau cyanus and Papaver somniferum", "Alcea rosea and Camphor officinalis", "Senecio vulgaris and Aloe barbadensis"], "correct_index": 0, "explanations": ["Correct. Both Achillea millefolium (Yarrow) and Equisetum arvense (Joint Pine or Woody Horsetail) are explicitly listed in slide 10.", "Incorrect. Papaver somniferum is not listed among the Shanidar grave plants on slide 10.", "Incorrect. Camphor officinalis is not mentioned on slide 10.", "Incorrect. Aloe barbadensis is not listed among the Shanidar grave plants."], "mid": "bhm01"}, {"tag": "BHM151·Q15", "difficulty": "devil", "section": "History of Herbalism", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 11", "qc": "Based on the documented history of written plant usage around 3000 BC, which medical document specifically focused on internal injuries and recipes involving numerous drugs?", "options": ["The Ebers papyrus", "The Edwin Smith papyrus", "The Pen ts’ao ching", "De Historia Plantarium"], "correct_index": 0, "explanations": ["Correct. Slide 11 states that the Ebers document (1550 BC) dealt with internal injuries and recipes including hundreds of drugs.", "Incorrect. The Edwin Smith papyrus is mentioned as being from the same period (1600 BC) but is not described here as dealing with internal injuries and hundreds of drug recipes.", "Incorrect. The Pen ts’ao ching is a Chinese pharmacopoeia, not an Egyptian papyrus.", "Incorrect. De Historia Plantarium is a botanical work by Theophrastus, not an Egyptian medical papyrus."], "mid": "bhm01"}, {"tag": "BHM151·Q16", "difficulty": "hard", "section": "History of Herbalism", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 12", "qc": "While the Sumerians were recording medicinal plants on clay tablets over 5000 years ago in ancient Mesopotamia, what concurrent developmental milestone was occurring in India?", "options": ["Ayurveda was being practiced and shared orally", "The roots of TCM were beginning to be written down", "Hakim Ibn Sina was developing the Unani-Tibb system", "The Ebers papyrus was being authored by Egyptian scribes"], "correct_index": 0, "explanations": ["Correct. Slide 12 notes that around when Sumerians recorded plants on clay tablets, Ayurveda was being practiced and shared orally in India.", "Incorrect. Writing down the roots of TCM occurred in China at that time, not India.", "Incorrect. Unani-Tibb was developed around 1000 CE by Hakim Ibn Sina, long after this period.", "Incorrect. The Ebers papyrus dates to around 1550 BC, which is a later timeline."], "mid": "bhm01"}, {"tag": "BHM151·Q17", "difficulty": "devil", "section": "Medical Theories of Ancient Egypt", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 13", "qc": "What foundational significance is attributed to Shen (Chi’en) Nung in the evolution of traditional medical literature?", "options": ["He is assumed to have greatly influenced the Pen ts’ao ching, the earliest existing Chinese pharmacopoeia", "He authored the Ebers Papyrus over the course of 1500 years to describe 850 herbs", "He established the foundational Four Humors System for Western herbalism", "He wrote the first dated clay tablet records of medicinal plants in Mesopotamia"], "correct_index": 0, "explanations": ["Correct. Slide 13 states Shen Nung is assumed to have greatly influenced the Pen ts’ao ching, known as the Divine Husbandman’s Materia Medica, the earliest existing Chinese pharmacopoeia with 365 remedies.", "Incorrect. The Ebers Papyrus is an Ancient Egyptian document, not authored by Shen Nung.", "Incorrect. The Four Humors System was developed by Hippocrates, not Shen Nung.", "Incorrect. Clay tablets in Mesopotamia were created by Sumerians, not Shen Nung."], "mid": "bhm01"}, {"tag": "BHM151·Q18", "difficulty": "hard", "section": "Medical Theories of Ancient Egypt", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 14", "qc": "Trace the chronological refinement of medical philosophy from Empedocles to Hippocrates as presented in the slides. Which sequence accurately reflects this historical development?", "options": ["Four Roots -> Four Elements -> Four Humors", "Four Elements -> Four Roots -> Four Humors", "Four Humors -> Four Roots -> Four Elements", "Four Roots -> Four Humors -> Four Elements"], "correct_index": 0, "explanations": ["Correct. Slide 14 shows Empedocles developed \"The Four Roots\", Plato developed these into \"The Four Elements\", and Hippocrates developed those into \"The Four Humors\".", "Incorrect. Elements followed Roots, not vice versa.", "Incorrect. Humors came last in this specific lineage.", "Incorrect. Elements were placed between Roots and Humors."], "mid": "bhm01"}, {"tag": "BHM151·Q19", "difficulty": "devil", "section": "Medical Theories of Ancient Egypt", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 14", "qc": "The Unani-Tibb medical system was established by which historical figure, and built upon which preceding theoretical framework?", "options": ["Hakim Ibn Sina; built upon the four humors", "Hippocrates; built upon the four roots of Empedocles", "Theophrastus; built upon the plant etiologies of Plato", "Shen Nung; built upon the Ebers papyrus recipes"], "correct_index": 0, "explanations": ["Correct. Slide 14 states that Unani-Tibb was developed by the Persian physician Hakim Ibn Sina around 1000 CE, building upon the four humors framework.", "Incorrect. Hippocrates developed the four humors, but Unani-Tibb was developed much later by Hakim Ibn Sina.", "Incorrect. Theophrastus founded botanical science, not Unani-Tibb.", "Incorrect. Shen Nung is associated with Chinese medicine."], "mid": "bhm01"}, {"tag": "BHM151·Q20", "difficulty": "hard", "section": "Hippocrates", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 15", "qc": "Which of the following best characterizes the diagnostic and etiological perspective practiced by Hippocrates as outlined in the slide?", "options": ["Rational assessment viewing the body as an integrated whole, attributing disease to humor imbalances", "Spiritual incantations and supernatural rituals aimed at expelling demonic possessions", "Exclusive focus on surgical intervention for internal injuries without regard for environmental factors", "Empirical cataloging of plant toxic actions through forced escalating doses in humans"], "correct_index": 0, "explanations": ["Correct. Slide 15 emphasizes his methods were rational—taking case histories, observing physical/mental/emotional states, viewing the body as an integrated whole, and attributing disease to humor imbalance.", "Incorrect. Hippocrates' methods were explicitly rational, rejecting purely supernatural causes.", "Incorrect. He took comprehensive case histories and observed environmental influences, not just surgery.", "Incorrect. Gradual dose increases for plant toxins were observed by Theophrastus, not Hippocrates."], "mid": "bhm01"}, {"tag": "BHM151·Q21", "difficulty": "devil", "section": "Hippocrates", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 15", "qc": "According to Hippocrates' foundational system, what specific physiological circumstance is directly cited as the underlying cause of disease?", "options": ["An imbalance of the four humors", "A deficiency in the four elemental plant roots", "The accumulation of soot, gum, and water toxins", "An inadequate gradual increase of herbal doses"], "correct_index": 0, "explanations": ["Correct. Slide 15 states that disease is caused by an imbalance of the four humors (blood, phlegm, yellow bile, and black bile).", "Incorrect. Plant roots belong to Empedocles' earlier philosophical roots theory.", "Incorrect. Soot, gum, and water were used to make ink for papyri.", "Incorrect. Gradual dose increase relates to Theophrastus's observations on plant toxicity."], "mid": "bhm01"}, {"tag": "BHM151·Q22", "difficulty": "devil", "section": "Theophrastus", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 16", "qc": "Theophrastus earned the title 'the father of botany' primarily through which monumental contributions?", "options": ["Writing 'De Causis Plantarium' and 'De Historia Plantarium' while classifying over 500 medicinal plants", "Developing the Hippocratic oath and documenting the foundational Four Humors System", "Writing the Ebers Papyrus and introducing acupuncture to ancient Greece", "Establishing the Unani-Tibb medical system and the Pen ts’ao ching pharmacopoeia"], "correct_index": 0, "explanations": ["Correct. Slide 16 notes he founded botanical science with his books 'De Causis Plantarium' and 'De Historia Plantarium', classifying over 500 medicinal plants.", "Incorrect. The Hippocratic oath and Four Humors are attributed to Hippocrates.", "Incorrect. The Ebers Papyrus is Egyptian, and acupuncture is associated with Shen Nung.", "Incorrect. Unani-Tibb and Pen ts’ao ching belong to Islamic/Persian and Chinese histories respectively."], "mid": "bhm01"}, {"tag": "BHM151·Q23", "difficulty": "hard", "section": "Theophrastus", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 16", "qc": "What crucial pharmacological and toxicological observation was made by Theophrastus in the description of plant toxic actions?", "options": ["Humans can become accustomed to plant toxins through a gradual increase of the doses", "Disease results exclusively from an imbalance of blood, phlegm, and bile", "Plant microfossils entrapped in dental calculus reveal ancestral ingestion habits", "Hieroglyphic inks made from soot and gum neutralize systemic plant poisons"], "correct_index": 0, "explanations": ["Correct. Slide 16 states that in describing plant toxic action, Theophrastus made the important observation for humans to become accustomed to them by a gradual increase of the doses.", "Incorrect. Humor imbalance is attributed to Hippocrates.", "Incorrect. Dental calculus microfossils relate to Neanderthal studies on slide 9.", "Incorrect. Soot and gum ink relates to Egyptian papyri on slide 11."], "mid": "bhm01"}, {"tag": "BHM151·Q24", "difficulty": "devil", "section": "History of Herbalism", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 13", "qc": "Comparing early pharmacological texts from the slides, which text is specifically noted as the earliest existing Chinese pharmacopoeia containing 365 different remedies?", "options": ["Pen ts’ao ching", "Ebers Papyrus", "De Historia Plantarium", "Edwin Smith Papyrus"], "correct_index": 0, "explanations": ["Correct. Slide 13 identifies the Pen ts’ao ching (Divine Husbandman’s Materia Medica) as the earliest existing Chinese pharmacopoeia with 365 different remedies.", "Incorrect. The Ebers Papyrus is an Egyptian document describing over 850 herbs.", "Incorrect. De Historia Plantarium is a botanical text by Theophrastus.", "Incorrect. The Edwin Smith papyrus is an ancient Egyptian medical document."], "mid": "bhm01"}, {"tag": "BHM151·Q25", "difficulty": "devil", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 17", "qc": "What is the primary significance of the Huang Di Nei Jing in the context of herbal medicine development, according to the text?", "options": ["It serves exclusively as a comprehensive pharmacopeia containing hundreds of classical Chinese herbal formulas.", "It establishes the theoretical and philosophical foundation of Chinese Medicine while listing only twelve herbal formulas.", "It represents the oldest known Chinese medical manuscript translated into Latin in medieval Spain.", "It documents the integration of Greek humoral pathology with traditional Chinese herbalism during the Han dynasty."], "correct_index": 1, "explanations": ["Incorrect; the text explicitly notes it lists only twelve herbal formulas, not hundreds.", "Correct; the slide states it includes both the theoretical and philosophical foundation of Chinese Medicine only lists twelve herbal formulas.", "Incorrect; Latin translation in Spain applies to Dioscorides' De Materia Medica, not the Huang Di Nei Jing.", "Incorrect; there is no mention of Greek humoral pathology integration in this text."], "mid": "bhm01"}, {"tag": "BHM151·Q26", "difficulty": "hard", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 18", "qc": "Tracing the textual lineage of Pedanius Dioscorides' work, which sequence of linguistic translations and manuscripts correctly reflects its historical dissemination?", "options": ["Written in Greek -> Oldest manuscript Juliana Anicia Codex (512) -> Translated to Arabic in the 9th century -> Translated into Latin in Spain as De Materia Medica", "Written in Latin -> Translated to Greek -> Oldest manuscript Juliana Anicia Codex -> Translated to Arabic and then Spanish", "Written in Arabic -> Translated to Greek -> Oldest manuscript Juliana Anicia Codex -> Translated to Latin as De Materia Medica", "Written in Greek -> Translated directly to Latin in Spain -> Oldest manuscript Juliana Anicia Codex -> Translated to Arabic in the 9th century"], "correct_index": 0, "explanations": ["Correct; the slide states it was written in Greek, the oldest manuscript is the Juliana Anicia Codex from 512, translated into Arabic in the 9th century, and later translated in Spain into Latin as De Materia Medica.", "Incorrect; it was originally written in Greek, not Latin.", "Incorrect; it was not originally written in Arabic.", "Incorrect; the Arabic translation preceded the Spanish translation into Latin, and the Juliana Anicia Codex dates to 512."], "mid": "bhm01"}, {"tag": "BHM151·Q27", "difficulty": "devil", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 19", "qc": "How did the general paradigm of Roman medicine shift following the Roman conquest of Greece in 146 BC and prior to Galen's interventions?", "options": ["Classical Greek sciences immediately flourished and became the dominant framework for Roman clinical practice.", "Roman medicine transitioned smoothly from Hippocratic humoralism directly into standardized plant-based galenicals.", "Classical Greek sciences and medicinal practices fell into disrepute, leaving Roman medicine largely magic- and deity-based.", "Roman physicians rejected both Greek science and magic, establishing independent anatomical sciences before Galen's arrival."], "correct_index": 2, "explanations": ["Incorrect; the slide states that classical Greek sciences fell into disrepute after the conquest.", "Incorrect; Roman medicine was magic- and deity-based until Galen established anatomy.", "Correct; the slide explicitly notes that after the conquest, classical Greek sciences fell into disrepute and Roman medicine was largely magic- and deity-based until Galen.", "Incorrect; anatomy was established by Galen himself, not prior to him."], "mid": "bhm01"}, {"tag": "BHM151·Q28", "difficulty": "hard", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 20", "qc": "Which specific conceptual additions did Galen make to advance Hippocrates' pre-existing medical framework?", "options": ["He introduced the concepts of Physis and Pneuma to the Four Humors System, representing life force, spirit, and breath.", "He replaced the Four Humors entirely with standardized plant-based remedies known as galenicals.", "He banned older Greek texts and established the theological foundations of the Holy Roman Empire's medical views.", "He integrated Arabic scholarship and holistic lifestyle regimens into the Hippocratic humoral framework."], "correct_index": 0, "explanations": ["Correct; the slide states Galen further developed the Four Humors System by adding the ideas of Physis and Pneuma, which encompass life force, spirit, and breath.", "Incorrect; he developed standard plant remedies alongside the humors, but did not replace the humors.", "Incorrect; the banning of texts occurred during the Dark Ages, not by Galen.", "Incorrect; Arabic scholarship preserved texts later, but Galen was a Greek physician preceding the Arabic translation movement."], "mid": "bhm01"}, {"tag": "BHM151·Q29", "difficulty": "devil", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 21", "qc": "During the period designated as the \"Dark Ages\" (200-1100 CE), how was the survival of classical Greek and Roman medical knowledge primarily ensured despite official imperial prohibitions?", "options": ["The Holy Roman Empire relaxed its bans to allow monastic preservation of original Latin manuscripts.", "Arabic and Jewish scholars kept the knowledge alive by translating the Greek texts into their own languages.", "Galen's direct followers, the \"Galenicals,\" clandestinely established medical schools throughout Western Europe.", "Pedanius Dioscorides' De Materia Medica was openly taught in Spanish and Italian universities."], "correct_index": 1, "explanations": ["Incorrect; the Holy Roman Empire banned the reading of older texts without mentioning a relaxation of bans.", "Correct; the slide states that the old knowledge was kept alive by Arabic and Jewish scholars who translated the Greek texts into their languages during the imperial ban.", "Incorrect; \"Galenicals\" refers to followers or standard remedies, not clandestine medieval European teaching networks.", "Incorrect; the slide notes the text was translated in Spain later, but the preservation across the Dark Ages is attributed to Arabic and Jewish scholars translating Greek texts."], "mid": "bhm01"}, {"tag": "BHM151·Q30", "difficulty": "hard", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 22", "qc": "Hakim Ibn Sina (Avicenna) achieved monumental status in medical history primarily through which of the following contributions documented in the slides?", "options": ["Writing Cause and Cure and Physica, which wove spiritual realms into German natural history.", "Compiling The Canon of Medicine, a summary of Egyptian, Greek, and Roman medical thought that contributed to Unani-Tibb.", "Translating the Juliana Anicia Codex from Greek into Arabic during the 9th-century Dark Ages.", "Establishing the foundational anatomy of the Holy Roman Empire through the rejection of Galenism."], "correct_index": 1, "explanations": ["Incorrect; Cause and Cure and Physica were written by Hildegard von Bingen.", "Correct; the slide states he is quoted as the \"most famous physician in human history\" due to The Canon of Medicine, which summarizes medical thought of Egyptians, Greeks, and Romans and contributed to Unani-Tibb.", "Incorrect; Dioscorides' work was translated into Arabic, but Ibn Sina is famous for The Canon of Medicine.", "Incorrect; Ibn Sina contributed to Unani-Tibb and synthesized prior medical thought, not Holy Roman Empire anatomy."], "mid": "bhm01"}, {"tag": "BHM151·Q31", "difficulty": "devil", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 23", "qc": "According to Hakim Ibn Sina's diagnostic and therapeutic philosophy, what constitutes the fundamental basis of bodily health?", "options": ["Strict adherence to the Four Humors combined with the physiological maintenance of Physis and Pneuma.", "The administration of twelve standardized herbal formulas as outlined in the Huang Di Nei Jing.", "Developing a balanced regimen incorporating activity, rest, food, water, and air after assessing all aspects of a person's life.", "The complete separation of spiritual thought from natural sciences and philosophical assessments."], "correct_index": 2, "explanations": ["Incorrect; Physis and Pneuma are Galen's additions, not Ibn Sina's specific foundational health regimen.", "Incorrect; the Huang Di Nei Jing is a Chinese text, unrelated to Ibn Sina's regimen.", "Correct; the slide states that his view, developing a \"regimen\" balancing activity, rest, food, water, and air, is the foundation of bodily health after considering all aspects of a person's life.", "Incorrect; Avicenna explicitly combined his spiritual thought with philosophy and natural sciences."], "mid": "bhm01"}, {"tag": "BHM151·Q32", "difficulty": "hard", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 24", "qc": "Which enduring legacy in the evolution of science and medicine is directly attributed to the German saint Hildegard von Bingen in the slide record?", "options": ["She established the science of anatomy to replace magic- and deity-based Roman medicine.", "She compiled the foundational text of Unani-Tibb by synthesizing Egyptian and Greek medical practices.", "She paved the way for today by weaving the spiritual realm into her work and fostering scientific study of natural history in Germany.", "She translated Dioscorides' De Materia Medica from Arabic into Latin in medieval Spain."], "correct_index": 2, "explanations": ["Incorrect; anatomy was established by Galen.", "Incorrect; Unani-Tibb was contributed to by Hakim Ibn Sina.", "Correct; the slide notes she wrote Cause and Cure and Physica, and paved the way for today through weaving the spiritual realm into her work and fostering scientific study of natural history in Germany.", "Incorrect; Dioscorides' work was translated in Spain, not by Hildegard von Bingen."], "mid": "bhm01"}, {"tag": "BHM151·Q33", "difficulty": "devil", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 17", "qc": "Comparing the historical epochs detailed in the curriculum, which text was compiled earliest among the foundational works listed?", "options": ["The Huang Di Nei Jing (Yellow Emperor's Inner Classic)", "De Materia Medica", "The Canon of Medicine", "Cause and Cure"], "correct_index": 0, "explanations": ["Correct; the Huang Di Nei Jing is dated 200 BCE-100 CE, making it the earliest compiled text among those listed in the options (Dioscorides is 40-90 CE, Ibn Sina later, Hildegard 1098-1179 CE).", "Incorrect; Dioscorides lived from 40-90 CE, which is later than the start range of the Huang Di Nei Jing (200 BCE).", "Incorrect; Ibn Sina's Canon of Medicine postdates the classical and dark ages periods.", "Incorrect; Hildegard von Bingen lived from 1098-1179 CE."], "mid": "bhm01"}, {"tag": "BHM151·Q34", "difficulty": "devil", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 18", "qc": "Regarding the linguistic journey of Pedanius Dioscorides' authoritative botanical text, which linguistic transfer occurred immediately prior to its Latin translation in Spain?", "options": ["Translation directly from Latin back into original Greek dialects.", "Translation from Greek into Arabic in the 9th century.", "Translation from German natural history texts into Arabic.", "Translation from Hebrew scholarly commentaries into Greek manuscripts."], "correct_index": 1, "explanations": ["Incorrect; it was not translated from Latin back to Greek.", "Correct; the slide outlines that it was written in Greek, translated into Arabic in the 9th century, and later translated in Spain into Latin as De Materia Medica.", "Incorrect; German natural history is associated with Hildegard von Bingen, not Dioscorides' transmission path.", "Incorrect; Hebrew scholars kept Greek texts alive during the Dark Ages, but the specific textual lineage for Dioscorides states Greek -> Arabic -> Latin in Spain."], "mid": "bhm01"}, {"tag": "BHM151·Q35", "difficulty": "hard", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 22", "qc": "How did Hakim Ibn Sina's The Canon of Medicine structurally relate to the accumulated medical knowledge of preceding Mediterranean civilizations?", "options": ["It completely invalidated and discarded Egyptian and Roman medical thoughts in favor of pure Islamic philosophy.", "It focused exclusively on the twelve herbal formulas established in the Huang Di Nei Jing.", "It summarized the medical thought and practice of the Egyptians, Greeks, and Romans up to his era.", "It served solely as a commentary on Galen's anatomical discoveries during the Holy Roman Empire's bans."], "correct_index": 2, "explanations": ["Incorrect; his text summarized rather than discarded prior medical thought.", "Incorrect; the Huang Di Nei Jing is a Chinese text, whereas Ibn Sina synthesized Egyptian, Greek, and Roman thoughts.", "Correct; the slide explicitly states that The Canon of Medicine summarizes medical thought and practice of the Egyptians, Greeks, and Romans up to Ibn Sina's era.", "Incorrect; it spanned multiple civilizations' medical thoughts up to his era and contributed to Unani-Tibb, rather than focusing solely on Galen during imperial bans."], "mid": "bhm01"}, {"tag": "BHM151·Q36", "difficulty": "devil", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 21", "qc": "What political or administrative action precipitated the necessity for Arabic and Jewish scholars to preserve classical Greek and Roman medical texts during the Dark Ages?", "options": ["The conquest of Greece by Rome in 146 BC, which caused classical sciences to fall into disrepute.", "The creation of the Juliana Anicia Codex in 512 CE as the oldest known botanical manuscript.", "The Holy Roman Empire banning the reading of older Greek and Roman medical texts.", "The formulation of standard plant-based remedies known as galenicals by Galen's followers."], "correct_index": 2, "explanations": ["Incorrect; the Roman conquest occurred long before the Dark Ages (200-1100 CE).", "Incorrect; the Juliana Anicia Codex is a manuscript of Dioscorides, not a political action forcing scholarly preservation.", "Correct; the slide specifies that following Galen's work during the \"dark ages,\" the Holy Roman Empire banned the reading of older Greek and Roman medical texts, prompting Arabic and Jewish scholars to keep the knowledge alive through translations.", "Incorrect; galenicals and Galen's work preceded the Dark Ages and the imperial bans."], "mid": "bhm01"}, {"tag": "BHM151·Q37", "difficulty": "devil", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 25", "qc": "Which foundational clinical philosophy did Moses Maimonides explicitly advocate for in his medical texts, setting a precedent for holistic management?", "options": ["Treating the specific disease entity using standardized chemical doses derived from Avicenna", "Treating the sick person as a unique individual rather than focusing solely on a particular disease", "Prioritizing the spiritual alignment of elemental matter over physical symptoms", "Strictly adhering to the original Greek commentaries of Hippocrates and Galen without expansion"], "correct_index": 1, "explanations": ["Incorrect, as Maimonides rejected treating just the disease, focusing instead on the individual.", "Correct, Maimonides suggested that a physician should treat the sick person as a unique individual rather than a particular disease.", "Incorrect, this aligns more closely with Paracelsus's integration of spiritual and physical matter.", "Incorrect, while he commented on them, his novel clinical suggestion was individual-centered care."], "mid": "bhm01"}, {"tag": "BHM151·Q38", "difficulty": "hard", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 26", "qc": "What core conceptual bridge did Paracelsus introduce that fundamentally shaped the trajectory of the alchemical movement in medicine?", "options": ["The translation of New World botanical texts into traditional European herbals", "The connection between physical and spiritual matter within medical practice", "The legal deregulation of botanical practitioners via royal charters", "The correlation between astrological signs and pharmaceutical preparations"], "correct_index": 1, "explanations": ["Incorrect, botanical translation is attributed to John Gerard and Rembert Dodoens.", "Correct, Paracelsus expanded physics to incorporate the connection between physical and spiritual matter.", "Incorrect, royal charters for practitioners relate to Henry VIII.", "Incorrect, astrological integration is a hallmark of Nicholas Culpeper's work."], "mid": "bhm01"}, {"tag": "BHM151·Q39", "difficulty": "devil", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 27", "qc": "How did Paracelsus fundamentally redefine the toxicological status of chemical substances in his foundational writings?", "options": ["He asserted that all known chemicals are inherently poisons, and only the correct dosage differentiates a poison from a remedy", "He maintained that purely organic plant extracts are remedies, while all synthesized chemical compounds are poisons", "He claimed that poisons and remedies belong to entirely separate elemental realms that can never overlap", "He argued that spiritual purity completely neutralizes the chemical toxicity of any medicinal substance"], "correct_index": 0, "explanations": ["Correct, Paracelsus stated that all known chemicals are poisons as there is none which is not; the right dose differentiates a poison from a remedy.", "Incorrect, his statement applies universally to all known chemicals.", "Incorrect, he integrated elemental and chemical realms rather than separating them into non-overlapping categories.", "Incorrect, spiritual integration did not negate the physical reality of dosage and toxicity."], "mid": "bhm01"}, {"tag": "BHM151·Q40", "difficulty": "hard", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 28", "qc": "What significant bibliographical distinction defines John Gerard’s 1597 publication 'Herball (Generall Historie of Plants)'?", "options": ["It was the first European text to integrate astrological predictions with botanical descriptions", "It was an original compilation entirely derived from North American indigenous medicinal practices", "It was largely an English translation of a Dutch herbal by Rembert Dodoens, notable for including New World plants", "It served as the primary legal charter granting British herbalists the freedom to practice"], "correct_index": 2, "explanations": ["Incorrect, astrological integration is specific to Nicholas Culpeper.", "Incorrect, it was largely a translation of a Dutch text, though it incorporated New World plants.", "Correct, Gerard's Herball was largely an English translation of Rembert Dodoens' 1554 Dutch herbal and was the first to include New World plants.", "Incorrect, the right to practice was granted by Henry VIII's charter, not Gerard's text."], "mid": "bhm01"}, {"tag": "BHM151·Q41", "difficulty": "devil", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 29", "qc": "Which unique methodological combination characterizes the surviving monumental work of Nicholas Culpeper?", "options": ["Astrological medicine, herbalism, and pharmaceuticals presented together", "Strictly empirical physics combined with New World botanical translations", "Alchemical spiritual principles combined with modern Flexner-style medical reforms", "Exclusively clinical case studies of individual patients modeled after Maimonides"], "correct_index": 0, "explanations": ["Correct, Culpeper presented information on astrological medicine, herbalism, and pharmaceuticals together.", "Incorrect, New World translations belong to John Gerard.", "Incorrect, Flexner reforms occurred centuries later in the United States.", "Incorrect, individualized clinical treatment was championed by Maimonides."], "mid": "bhm01"}, {"tag": "BHM151·Q42", "difficulty": "hard", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 30", "qc": "How has the regulatory landscape for British herbalists evolved from the initial decree by Henry VIII in 1543 to the modern era?", "options": ["Practitioners remain entirely unrestricted by any laws or professional standards since the 1543 charter", "The initial unrestricted right to practice has transitioned into professional self-regulation via the British Herbalist Association and European directives", "The British Herbalist Association was established in 1543 to enforce strict compliance with Directive 2001/83/EC", "Traditional herbal medicinal products were completely banned in the UK following Henry VIII's repeal of his own charter"], "correct_index": 1, "explanations": ["Incorrect, current laws and directives have significantly changed the landscape.", "Correct, Henry VIII granted unrestricted practice in 1543, but currently, the British Herbalist Association exercises self-regulation, alongside EU Directive 2001/83/EC.", "Incorrect, the association and directive did not exist in 1543.", "Incorrect, traditional herbal products are regulated rather than banned, and Henry VIII did not repeal the charter."], "mid": "bhm01"}, {"tag": "BHM151·Q43", "difficulty": "devil", "section": "Complementary and Alternative Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 31", "qc": "What direct structural consequence did the implementation of the Flexner Commission's 1910 recommendations have on American medical education?", "options": ["An exponential increase in proprietary medical schools modeled after European alchemical traditions", "The closure of the vast majority of medical schools and the standardization of remaining ones after Johns Hopkins", "The immediate integration of diverse complementary and alternative medicine therapies into all medical curricula", "The establishment of federal laws protecting non-physician health care providers from market competition"], "correct_index": 1, "explanations": ["Incorrect, proprietary schools actually experienced a significant decline.", "Correct, the AMA implemented recommendations that the great majority of medical schools should be closed and the remainder modeled after Johns Hopkins, leading to a decline in proprietary schools.", "Incorrect, integration into medical schools happened much later, whereas non-physician specialties were initially wiped out.", "Incorrect, non-physician providers were severely negatively impacted, not protected."], "mid": "bhm01"}, {"tag": "BHM151·Q44", "difficulty": "hard", "section": "Complementary and Alternative Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 32", "qc": "What secondary demographic and institutional shift occurred in the United States within ten years following the release of the Flexner Report?", "options": ["A massive surge in the popularity of proprietary medical schools among the general population", "The near-total elimination of several nontraditional health care provider specialties", "A 40% decline in the overall population utilization of complementary medicines", "The complete abandonment of Johns Hopkins as the model for mainstream medical education"], "correct_index": 1, "explanations": ["Incorrect, proprietary schools declined rapidly following the report.", "Correct, within 10 years after the Flexner report, some nontraditional specialties were virtually wiped out.", "Incorrect, the slides note that 40% of the US population currently uses complementary medicines, not that utilization dropped by 40% then.", "Incorrect, Johns Hopkins remained the gold standard model."], "mid": "bhm01"}, {"tag": "BHM151·Q45", "difficulty": "hard", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 25", "qc": "Considering Maimonides' background and medical writings in Egypt, what was his relationship to preceding classical medical authorities?", "options": ["He completely rejected their works as obs us characterizes the integration of Complementary and Alternative Medicine (CAM) within American medical institutions, contrasting with its post-Flexner suppression?", "options": ["CAM therapies are now taught in a large number of medical schools", "Non-physician specialties remain entirely wiped out with zero population usage", "The AMA continues to enforce the complete closure of any medical school teaching CAM", "Proprietary schools have re-emerged to monopolize CAM education"], "correct_index": 0, "explanations": ["Correct, currently, a large number of medical schools teach CAM therapies, alongside a 40% population use.", "Incorrect, nontraditional specialties were wiped out within 10 years after the report, but CAM usage and education have since rebounded.", "Incorrect, modern medical schools actively teach CAM therapies.", "Incorrect, proprietary schools declined after the Flexner report and did not re-emerge in that role."], "mid": "bhm01"}, {"tag": "BHM151·Q48", "difficulty": "devil", "section": "History of Herbal Medicine", "qt": "single", "source": "BHM 151 — Herbalism_New, slide 28", "qc": "In analyzing the lineage of early modern herbals, what is the direct textual link between John Gerard's 1597 publication and continental scholarship?", "options": ["It is an English adaptation and translation of Rembert Dodoens' Dutch herbal published in 1554", "It is an expansion of Maimonides' 'Regimen of Health' adapted for North American flora", "It is a direct transcription of Paracelsus's meteorological and alchemical writings", "It is a compilation of Nicholas Culpeper's astrological and pharmaceutical treatises"], "correct_index": 0, "explanations": ["Correct, Gerard's Herball published in 1597 is largely an English translation of an herbal that the Dutch scholar Rembert Dodoens wrote in 1554.", "Incorrect, it has no direct textual link to Maimonides.", "Incorrect, it is distinct from Paracelsus's alchemical works.", "Incorrect, Gerard predates Culpeper."], "mi s": ["Providing standardized information to ensure quality, safety, and efficacy", "Listing exhaustive historical narratives of cultural applications", "Providing proprietary manufacturing pathways for commercial patenting", "Documenting raw anthropological accounts of indigenous harvesters"], "correct_index": 0, "explanations": ["Correct. A monograph provides standardized information specifically ensuring quality, safety, and efficacy.", "Incorrect. Historical narratives are secondary to establishing standardized parameters.", "Incorrect. Proprietary manufacturing details align with manufacturer monographs, not the general purpose of standard monographs.", "Incorrect. Monographs focus on standardized scientific and regulatory data, not raw anthropological accounts."], "mid": "bhm02"}, {"tag": "BHM151·Q70", "difficulty": "devil", "section": "Types of Monographs", "qt": "single", "source": "BHM 151 — Introduction_to_Herbal_Monographs, slide 3", "qc": "An investigator seeking proprietary product details directly generated by a pharmaceutical company would consult which category of monograph?", "options": ["Pharmacopoeial Monographs", "Herbal Monographs", "Scientific Monographs", "Manufacturer Monographs"], "correct_index": 3, "explanations": ["Incorrect. Pharmacopoeial monographs are found in official pharmacopoeias, not proprietary company details.", "Incorrect. Herbal monographs provide data on medicinal plants and traditional uses, not necessarily proprietary commercial product details.", "Incorrect. Scientific monographs are published in academic journals with in-depth analysis.", "Correct. Manufacturer monographs contain proprietary product details directly from pharmaceutical companies."], "mid": "bhm02"}, {"tag": "BHM151·Q71", "difficulty": "hard", "section": "Types of Monographs", "qt": "classification", "source": "BHM 151 — Introduction_to_Herbal_Monographs, slide 3", "qc": "How are monographs categorized based on their publishing origins and primary institut guistic training, whereas slide 16 specifically highlights disease concepts.", "Slide 16 explicitly notes that researchers may work with indigenous people including traditional practitioners 'considering the culture and concepts of disease'.", "Patent laws are associated with CBD and commercialisation from slide 12, not the field site disease concepts in slide 16.", "Papyrus manufacturing is a historical note from slide 9, completely unrelated to field researcher site interactions."], "mid": "bhm03"}, {"tag": "BHM151·Q101", "difficulty": "devil", "section": "Knowledge Loss", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 13", "qc": "Why does the traditional medicinal plant knowledge held by indigenous groups often fail to achieve widespread usage despite its potential?", "options": ["Because the knowledge is held by a handful of people as a secret and the skills are fragile and unwritten", "Because modern ethnobotanists refuse to deposit voucher specimens in local herbaria", "Because the extraction and preparation methods mandated by the ethnic groups are toxic", "Because botanical and anthropological training are prohibited in vulnerable tribal areas"], "correct_index": 0, "explanations": ["The slide explicitly states most knowledge is in the hands of a handful, kept as a secret, and not widely used because the skills are fragile and not written down.", "Herbarium deposition is standard practice and does not prevent local knowledge usage.", "Following ethnic methods is highlighted as the key to safe usage, not toxicity.", "Training disciplines are practiced by ethnobotanists, not prohibited in tribal areas."], "mid": "bhm03"}, {"tag": "BHM151·Q102", "difficulty": "devil", "section": "Interdisciplinary Nature", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 10", "qc": "According to Richard Evans Schultes' identification of ethnobotany, which structural definition best captures the field's academic scope?", "options": ["A strictly botanical sub-discipline focused solely on plant taxonomy and herbarium press techniques", "An interdisciplinary field combining botany, anthropology, economics, ethics, history, chemistry, and other areas", "An anthropological subset dedicated exclusively to transcribing native morphology and syntax", "A historical discipline focused purely on ancient papyrus and slavery records"], "correct_index": 1, "explanations": ["Slide 10 explicitly rejects a single-discipline scope by defining it as interdisciplinary.", "The slide defines ethnobotany as an interdisciplinary field, combining botany, anthropology, economics, ethics, history, chemistry, and many other areas of study.", "Anthropology and linguistics are components, but ethnobotany is not exclusively an anthropological subset.", "History and ancient plants are mentioned elsewhere, but Schultes' definition explicitly lists a broad interdisciplinary combination."], "mid": "bhm03"}, {"tag": "BHM151·Q103", "difficulty": "hard", "section": "Threats to Ethnobotany", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 13", "qc": "What primary combined factors drive the alarming loss of language and traditional knowledge, particularly among smaller and vulnerable indigenous groups?", "options": ["Commercialisation of public domain data and mandatory CBD benefit-sharing agreements", "Acculturation and plant habitat destruction", "The failure of botanists and chemists to deposit voucher specimens in arboretums", "The rigid application of linguistic syntax and native semantics during field interviews"], "correct_index": 1, "explanations": ["Commercialisation and CBD relate to policy and commercial drivers from slide 12, not the direct cultural/environmental loss factors.", "Slide 13 explicitly states: 'The loss of language and traditional knowledge due to acculturation and plant habitat destruction is a major concern...'", "Voucher specimen deposition is a preservation technique, not a cause of knowledge loss.", "Linguistic syntax is a required training skill for study, not a driver of knowledge loss."], "mid": "bhm03"}, {"tag": "BHM151·Q104", "difficulty": "devil", "section": "Fieldwork Realities", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 12", "qc": "In the context of uncovering ethnobotanical information, what operational demand is placed on field experts regarding their working environment and duration?", "options": ["They must rely exclusively on published public domain data without undertaking physical site surveys.", "They must be willing to explore sites like rain forests and desert climates, spending long, challenging times in the field.", "They must limit their surveys strictly to established botanical gardens and herbaria.", "They must prioritize linguistic transcribing over physical survival and long-term field observation."], "correct_index": 1, "explanations": ["The slide states sites have to be explored or surveyed directly, not just relying on public domain data.", "Slide 12 explicitly notes that to uncover information, sites like rain forests, deserts, or harsh climatic environments must be explored, requiring experts willing to spend long, challenging times in the field.", "Herbaria are for depositing pressed specimens after field collection, not the primary exploration sites.", "Long-term survival, observing, interviewing, and collecting specimens in harsh environments are explicitly demanded core field tasks."], "mid": "bhm03"}, {"tag": "BHM151·Q105", "difficulty": "hard", "section": "Application of Ethnobotanical Knowledge", "qt": "single", "source": "BHM 151 — Ethnobotan性, slide 18", "qc": "What is the primary role of indigenous traditional knowledge when it is applied to contemporary drug discovery according to the provided framework?", "options": ["It serves as a direct substitute for rigorous clinical trials and safety profiling.", "It acts as an empirical guide for researchers to identify potential plant-based drug candidates.", "It dictates the precise chemical structure of active pharmaceutical ingredients.", "It replaces the need for bioassay-guided fractionation in laboratory settings."], "correct_index": 1, "explanations": ["Incorrect, traditional knowledge does not replace clinical trials, which are part of scientific validation.", "Correct, indigenous knowledge acts as a guide for researchers to identify potential plant-based drug candidates.", "Incorrect, traditional knowledge indicates uses rather than dictating molecular chemical structures directly.", "Incorrect, fractionation is a distinct laboratory process guided by, but not replaced by, traditional knowledge."], "mid": "bhm03"}, {"tag": "BHM151·Q106", "difficulty": "devil", "section": "Key applications", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 19", "qc": "In the context of target identification through ethnobotanical knowledge, which of the following best explains how traditional uses assist researchers?", "options": ["They pinpoint the exact genetic sequence of the pathogenic organism.", "They indicate potential therapeutic properties, allowing focus on specific biochemical pathways.", "They isolate the pure active chemical constituents prior to laboratory extraction.", "They eliminate the requirement for chemical diversity exploration."], "correct_index": 1, "explanations": ["Incorrect, target identification relates to therapeutic properties and pathways, not genetic sequencing.", "Correct, traditional uses indicate therapeutic properties like anti-inflammatory or anti-malarial, focusing research on specific biochemical pathways.", "Incorrect, pure constituents are isolated via fractionation, not indicated by target identification alone.", "Incorrect, chemical diversity exploration remains a separate key application."], "mid": "bhm03"}, {"tag": "BHM151·Q107", "difficulty": "hard", "section": "Bioassay-guided fractionation", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 20", "qc": "How does bioassay-guided fractionation utilize ethnobotanical information during the processing of plant materials?", "options": ["To bypass the identification of promising plant species entirely", "To guide the extraction and isolation of active ingredients responsible for observed medicinal effects", "To establish cultural sensitivity and secure informed consent from indigenous groups", "To predict the ecological sustainability of overharvesting wild plant populations"], "correct_index": 1, "explanations": ["Incorrect, fractionation depends on prior identification of promising plant species.", "Correct, ethnobotanical information guides extraction and fractionation to isolate active ingredients responsible for medicinal effects.", "Incorrect, cultural sensitivity is a separate ethical consideration, not a laboratory fractionation technique.", "Incorrect, sustainability relates to conservation, not laboratory chemical isolation."], "mid": "bhm03"}, {"tag": "BHM151·Q108", "difficulty": "devil", "section": "Exploration", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 20", "qc": "What is the primary pharmacological outcome associated with studying a wide range of plants used in traditional medicine regarding chemical diversity?", "options": ["The mandatory replication of known synthetic drug structures", "The discovery of novel chemical structures possessing potential therapeutic value", "The immediate commercialization of crude plant extracts without modification", "The standardization of indigenous intellectual property rights"], "correct_index": 1, "explanations": ["Incorrect, the focus is on discovering novel structures, not replicating known synthetics.", "Correct, studying a wide range of traditional plants leads to the discovery of novel chemical structures with therapeutic potential.", "Incorrect, crude extracts require further development and fractionation rather than immediate commercialization.", "Incorrect, intellectual property rights pertain to cultural sensitivity and ethics, not chemical diversity."], "mid": "bhm03"}, {"tag": "BHM151·Q109", "difficulty": "hard", "section": "Examples of successful drug discovery", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 22", "qc": "Comparing the historical origins of Quinine and Artemisinin, which shared therapeutic category do they belong to based on their traditional uses?", "options": ["Anti-cancer treatments derived from bark tissues", "Anti-malarial treatments derived from traditional systems", "Cardiac stimulants originating from European folklore", "Analgesics derived from indigenous American practices"], "correct_index": 1, "explanations": ["Incorrect, only Paclitaxel is categorized as an anti-cancer drug among the primary examples.", "Correct, Quinine treats fevers/malaria (South America) and Artemisinin is an anti-malarial from traditional Chinese medicine.", "Incorrect, cardiac agents like Digoxin belong to other entries (Foxglove).", "Incorrect, Artemisinin comes from traditional Chinese medicine, not indigenous American practices."], "mid": "bhm03"}, {"tag": "BHM151·Q110", "difficulty": "devil", "section": "Examples of successful drug discovery", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 22", "qc": "Which plant source and traditional context pair correctly matches the derivation of Paclitaxel (Taxol)?", "options": ["Cinchona tree used by South American indigenous people for fevers", "Pacific yew tree traditionally used by Native Americans", "Artemisia annua used in traditional Chinese medicine for centuries", "Willow tree used traditionally for its pain-relieving properties"], "correct_index": 1, "explanations": ["Incorrect, the Cinchona tree yielded Quinine.", "Correct, Paclitaxel (Taxol) was derived from the bark of the Pacific yew tree used traditionally by Native Americans.", "Incorrect, Artemisia annua yielded Artemisinin.", "Incorrect, the willow tree yielded Salicin/Aspirin."], "mid": "bhm03"}, {"tag": "BHM151·Q111", "difficulty": "hard", "section": "Other Drugs", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 23", "qc": "Which geographical or traditional origin is incorrectly mismatched with its respective drug entry on the slide?", "options": ["Digoxin/digitoxin linked to Shropshire via Foxglove", "Salicin/Aspirin linked to willow tree bark pain relief", "Reserpine explored through Ayurvedic medicine", "Prostratin derived from the Cinchona tree in South America"], "correct_index": 3, "explanations": ["Incorrect match because Foxglove and Shropshire are correctly associated with Digoxin/digitoxin.", "Incorrect match because willow tree and pain-relieving properties are correctly associated with Salicin/Aspirin.", "Incorrect match because Reserpine is correctly associated with Ayurvedic medicine exploration.", "Correct, Prostratin is associated with Samoa on the slide, not the Cinchona tree."], "mid": "bhm03"}, {"tag": "BHM151·Q112", "difficulty": "devil", "section": "Other Drugs", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 23", "qc": "If a researcher is investigating the botanical source associated with Shropshire in the context of historical drug derivation, which compound are they primarily targeting?", "options": ["Reserpine", "Prostratin", "Digoxin/digitoxin", "Salicin"], "correct_index": 2, "explanations": ["Incorrect, Reserpine is linked to Ayurvedic medicine exploration.", "Incorrect, Prostratin is linked to Samoa.", "Correct, Digoxin/digitoxin is associated with Foxglove from Shropshire.", "Incorrect, Salicin is derived from the willow tree."], "mid": "bhm03"}, {"tag": "BHM151·Q113", "difficulty": "hard", "section": "Important considerations", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 24", "qc": "Why is cultural sensitivity highlighted as an essential consideration when utilizing ethnobotanical knowledge?", "options": ["Because it ensures the chemical purity of isolated plant constituents", "Because it respects the intellectual property rights of indigenous communities and secures proper informed consent", "Because it prevents the immediate overharvesting of vulnerable plant populations", "Because it substitutes for rigorous scientific validation of pharmacological efficacy"], "correct_index": 1, "explanations": ["Incorrect, chemical purity is managed through laboratory bioassay-guided fractionation.", "Correct, cultural sensitivity specifically involves respecting intellectual property rights and securing informed consent.", "Incorrect, preventing overharvesting falls under the separate consideration of sustainability.", "Incorrect, cultural sensitivity does not replace scientific validation of safety and efficacy."], "mid": "bhm03"}, {"tag": "BHM151·Q114", "difficulty": "devil", "section": "Important considerations", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 24", "qc": "How do scientific validation and cultural sensitivity interact according to the parameters for using ethnobotanical knowledge?", "options": ["Scientific validation replaces the need for cultural informed consent.", "Cultural sensitivity ensures plant sustainability, rendering scientific validation optional.", "Traditional knowledge must be complemented with rigorous scientific research to confirm efficacy and safety, alongside respecting cultural rights.", "Scientific validation dictates the intellectual property ownership of indigenous communities."], "correct_index": 2, "explanations": ["Incorrect, scientific validation does not replace cultural consent; both are required.", "Incorrect, sustainability is a separate pillar and does not render scientific validation optional.", "Correct, traditional knowledge must be complemented by rigorous scientific research for efficacy/safety, while cultural sensitivity addresses IP and consent independently.", "Incorrect, scientific validation confirms pharmacological profiles, not legal/cultural intellectual property ownership."], "mid": "bhm03"}, {"tag": "BHM151·Q115", "difficulty": "hard", "section": "Important considerations", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 24", "qc": "What specific ecological consequence is explicitly warned against under the sustainability consideration for medicinal plants?", "options": ["The total cessation of traditional medical practices in local communities", "The overharvesting of medicinal plants, which threatens plant populations and local ecosystems", "The genetic mutation of active compounds due to bioassay-guided fractionation", "The legal forfeiture of indigenous intellectual property rights"], "correct_index": 1, "explanations": ["Incorrect, the cessation of practices is not the ecological focus.", "Correct, the slide explicitly warns against the overharvesting of medicinal plants to protect populations and ecosystems.", "Incorrect, fractionation is a lab process unrelated to plant population genetics.", "Incorrect, property rights fall under cultural sensitivity, not ecological sustainability."], "mid": "bhm03"}, {"tag": "BHM151·Q116", "difficulty": "devil", "section": "Integration", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 19", "qc": "When researchers prioritize plant species based on local community documentation, which subsequent phase of drug discovery directly follows this prioritization step?", "options": ["Target identification and linking uses to biochemical pathways", "Immediate commercial distribution of crude extracts", "Drafting intellectual property agreements for indigenous groups", "Enforcing ecological sustainability quotas for harvesters"], "correct_index": 0, "explanations": ["Correct, identifying promising species by documenting community uses leads directly into target identification to focus on specific biochemical pathways.", "Incorrect, commercial distribution occurs long after discovery, testing, and trials.", "Incorrect, intellectual property agreements are part of cultural sensitivity protocols, not the sequential drug discovery pipeline steps.", "Incorrect, sustainability is a parallel consideration during harvesting, not the immediate next step in laboratory prioritization."], "mid": "bhm03"}, {"tag": "BHM151·Q117", "difficulty": "devil", "section": "International Legal Instruments", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 25", "qc": "An international biotechnology firm is planning to import experimental living modified organisms (LMOs) across international borders for field trials. Which specific legal instrument under the CBD framework directly governs the biosafety issues associated with this cross-border mobility?", "options": ["The Nagoya Protocol, because it regulates the fair sharing of genetic resources", "The Cartagena Protocol, because it specifically addresses biosafety issues involving LMO mobility across borders", "The Convention on Biological Diversity base framework, which handles all multilateral biosafety mandates directly", "None, as the CBD only governs conservation and sustainable use without handling living modified organisms"], "correct_index": 1, "explanations": ["Incorrect, as the Nagoya Protocol focuses on fair and equitable benefit-sharing, not LMO mobility.", "Correct, because the Cartagena Protocol explicitly deals with biosafety issues regarding the mobility of living modified organisms (LMOs) between countries.", "Incorrect, while part of the CBD framework, the specific biosafety issues regarding LMO mobility are designated to the Cartagena Protocol.", "Incorrect, because the CBD and its protocols explicitly address these biological and biosafety concerns."], "mid": "bhm03"}, {"tag": "BHM151·Q118", "difficulty": "hard", "section": "International Legal Instruments", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 25", "qc": "A developing nation is formulating a national policy on genetic resource utilization. According to the foundational text of the CBD, which three core pillars must be harmoniously integrated into their legislative framework?", "options": ["Conservation of biological diversity, sustainable use of its components, and fair and equitable benefit-sharing", "Biosafety governance of LMOs, cultural preservation, and knowledge erosion prevention", "Acculturation rescue, interdisciplinary university training, and sustainable agriculture development", "Plant-derived energy source exploration, biodiversity conservation, and public policy formulation"], "correct_index": 0, "explanations": ["Correct, as the slide explicitly defines the CBD as an instrument for conservation, sustainable use of its components, and fair and equitable benefit-sharing arising from genetic resource utilization.", "Incorrect, because biosafety and cultural preservation are handled by protocols and secondary roles, not the three primary pillars.", "Incorrect, these are practical roles of ethnobotany rather than the explicit tripartite pillars of the CBD.", "Incorrect, energy exploration is a corporate outcome, not one of the foundational pillars of the CBD itself."], "mid": "bhm03"}, {"tag": "BHM151·Q119", "difficulty": "devil", "section": "Role of Ethnobotany", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 26", "qc": "An indigenous community's traditional pharmacopeia is rapidly disappearing due to rapid modernization and westernization. Based on the functional roles of ethnobotany, what specific direct impact does studying this local knowledge have regarding this crisis?", "options": ["It completely eliminates the commercial interest of biotechnology firms in the region", "It prevents knowledge erosion and rescues knowledge from acculturation", "It directly enforces the Cartagena Protocol on cross-border LMO movements", "It replaces the need for interdisciplinary academic departmental positions"], "correct_index": 1, "explanations": ["Incorrect, ethnobotany actually encourages corporate interest by discovering new medicines, not eliminating it.", "Correct, because the slide explicitly states that studying indigenous knowledge prevents 'knowledge erosion' and rescues knowledge from acculturation.", "Incorrect, LMO mobility is governed by a distinct protocol, not the direct cultural rescue function of ethnobotany.", "Incorrect, university departments are opening positions to support, not replace, these initiatives."], "mid": "bhm03"}, {"tag": "BHM151·Q120", "difficulty": "hard", "section": "Role of Ethnobotany", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 26", "qc": "When analyzing human-plant interactions, an ethnobotanist concludes that a local farming practice both enriches soil biodiversity and leads to deforestation in adjacent sectors. Which conceptual understanding promoted by ethnobotany best captures this dual observation?", "options": ["The strict separation of cultural diversity from biological evolution", "A sophisticated understanding of the mutual influence (both beneficial and destructive) of plants and humans", "The complete prevention of knowledge erosion through sustainable agriculture", "The mandatory fulfillment of the Nagoya Protocol obligations"], "correct_index": 1, "explanations": ["Incorrect, because ethnobotany explicitly encourages an awareness of the link between biodiversity and cultural diversity, not their separation.", "Correct, as the slide notes that ethnobotany fosters a sophisticated understanding of the mutual influence—both beneficial and destructive—of plants and humans.", "Incorrect, while sustainable agriculture is related, the dual beneficial and destructive impact is the direct description here.", "Incorrect, Nagoya protocol fulfillment is an institutional outcome, not the theoretical descriptor of human-plant mutual influence."], "mid": "bhm03"}, {"tag": "BHM151·Q121", "difficulty": "devil", "section": "Role of Ethnobotany", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 26", "qc": "How does documenting indigenous medicinal knowledge scientifically contribute to a nation's international legal standing regarding biological resources?", "options": ["It helps countries to fulfill the Nagoya Protocol by establishing baseline data for genetic resource utilization", "It automatically grants patent ownership of all discovered wild plants to local traditional healers", "It enforces the biosafety standards outlined under the Cartagena Protocol for LMOs", "It eliminates the economic incentives for companies to look to plants for new medicines"], "correct_index": 0, "explanations": ["Correct, because documenting local medicinal knowledge aids countries in fulfilling the Nagoya Protocol's requirements on genetic resource utilization and benefit sharing.", "Incorrect, ethnobotany documentation does not automatically confer patent ownership to traditional healers.", "Incorrect, Cartagena governs LMO biosafety, whereas Nagoya and ethnobotanical documentation tie into genetic resource utilization.", "Incorrect, companies are actually encouraged to look to plants for new approaches due to public interest and ethnobotanical findings."], "mid": "bhm03"}, {"tag": "BHM151·Q122", "difficulty": "hard", "section": "Ethnobotany into the Future", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 27", "qc": "In response to contemporary public policy making in conservation and shifting commercial demands, which combined sectors are increasingly driving the search for new plant-based applications?", "options": ["Agricultural cartels seeking exclusive land rights for monoculture farming", "Companies looking to plants for new approaches to medicines and energy sources alongside public policy", "Traditional healers establishing independent pharmaceutical multinational corporations", "University departments restricting interdisciplinary research to purely botanical taxonomies"], "correct_index": 1, "explanations": ["Incorrect, monoculture farming is not cited as the target driver in the slide.", "Correct, as the slide states that due to increased public interest and conservation policy-making, companies are looking to plants for new approaches to medicines, energy sources, and general applications.", "Incorrect, traditional healers do not form these corporate entities based on the text.", "Incorrect, universities are opening positions for interdisciplinary-trained ethnobotanists, not restricting them."], "mid": "bhm03"}, {"tag": "BHM151·Q123", "difficulty": "devil", "section": "Ethnobotany into the Future", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 27", "qc": "Why are academic institutions altering their recruitment profiles by opening specific faculty positions for ethnobotanists?", "options": ["Because ethnobotany is a declining field focused solely on historical literature reviews", "Because ethnobotany issues are the focus of much public attention and require interdisciplinary-trained scientists", "Because traditional pharmacognosy departments are being entirely replaced by agricultural engineering", "Because international law mandates that every university must employ a Cartagena Protocol officer"], "correct_index": 1, "explanations": ["Incorrect, the slide notes that ethnobotany as a field is actually 'on the rise', not declining.", "Correct, because ethnobotany issues command public attention, prompting university departments to open positions for interdisciplinary-trained ethnobotanists.", "Incorrect, the text does not state pharmacognosy is being replaced by agricultural engineering.", "Incorrect, the Nagoya and Cartagena protocols do not mandate university faculty hiring quotas for legal officers."], "mid": "bhm03"}, {"tag": "BHM151·Q124", "difficulty": "hard", "section": "References Analysis", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 28", "qc": "Examining the scholarly references provided for the course, which of the following pairs of authors contributed literature specifically evaluating ethnobotany and ethnopharmacy regarding anti-cancer drug development?", "options": ["Heinrich, M., & Bremner, P.", "Cox, P. A., & Balick, M. J.", "Abbiw, D. K., & Irvine, F. R.", "Cox, P. A., & Abbiw, D. K."], "correct_index": 0, "explanations": ["Correct, as the reference list explicitly cites Heinrich, M., & Bremner, P. (2006) regarding ethnobotany and ethnopharmacy and their role for anti-cancer drug development.", "Incorrect, Cox & Balick focus on the general ethnobotanical approach to drug discovery.", "Incorrect, Abbiw and Irvine authored regional works on useful and woody plants of Ghana.", "Incorrect, this is a mismatched author pair not reflecting the anti-cancer citation."], "mid": "bhm03"}, {"tag": "BHM151·Q125", "difficulty": "devil", "section": "References Analysis", "qt": "single", "source": "BHM 151 — Ethnobotany, slide 28", "qc": "A researcher is investigating the West African utilization profiles of specific wild and cultivated flora to supplement local ethnobotanical databases. Which reference from the syllabus should they primarily consult for this regional data?", "options": ["Heinrich & Bremner (2006)", "Cox & Balick (1994)", "Abbiw, D. K. (1990) or Irvine, F. R. (1961)", "Ciba Foundation Symposium 185"], "correct_index": 2, "explanations": ["Incorrect, Heinrich & Bremner focus on anti-cancer drug development globally.", "Incorrect, Cox & Balick focus on general drug discovery methodologies.", "Correct, because Abbiw (1990) ('Useful plants of Ghana: West African uses of wild and cultivated plants') and Irvine (1961) ('Woody plants of Ghana') provide the relevant West African baseline data.", "Incorrect, the Ciba Foundation Symposium focuses on general strengths and limitations of ethnobotanical drug discovery, not West African plant inventories."], "mid": "bhm03"}, {"tag": "BHM151·Q126", "difficulty": "devil", "section": "Historical Development", "qt": "single", "source": "BHM 151 — Herbal_Med_Ghana, slide 3", "qc": "Which of the following best characterizes the healthcare delivery system in Ghana during the pre-colonial period as outlined in the historical context?", "options": ["It operated through a highly centralized state medical board.", "It was entirely managed by ordained Christian missionaries.", "It relied on society-recognized competent individuals who were cultural custodians.", "It was strictly prohibited by the Native Customs Regulation Ordinance."], "correct_index": 2, "explanations": ["Incorrect, as the slide explicitly states there was no organized system of healthcare during this period.", "Incorrect, because Christianity and its missions were only introduced later during the colonial era.", "Correct, since healthcare was delivered by men and women recognized as competent, usually custodians of cultural norms and artefacts such as priest healers.", "Incorrect, as the Native Customs Regulation Ordinance was enacted in 1878 during the colonial era, not the pre-colonial period."], "mid": "bhm04"}, {"tag": "BHM151·Q127", "difficulty": "hard", "section": "Current Status", "qt": "single", "source": "BHM 151 — Herbal_Med_Ghana, slide 5", "qc": "What distinct clinical scope is highlighted regarding the population's reliance on traditional medicine in Ghana today?", "options": ["It is restricted strictly to emergency trauma management.", "It is utilized primarily for managing both communicable and non-communicable diseases.", "It is exclusively used for rural populations with no access to clinics.", "It is limited only to spiritual and psychological ailments."], "correct_index": 1, "explanations": ["Incorrect, trauma management is not mentioned in relation to traditional herbal remedies on this slide.", "Correct, the slide states that 60% to 70% of Ghanaians depend on traditional medicine primarily for managing both communicable and non-communicable diseases.", "Incorrect, the slide mentions a broad national dependence of 60% to 70% without limiting it solely to rural areas.", "Incorrect, it addresses physical illnesses like communicable and non-communicable diseases, not just spiritual ones."], "mid": "bhm04"}, {"tag": "BHM151·Q128", "difficulty": "devil", "section": "Historical Development", "qt": "single", "source": "BHM 151 — Herbal_Med_Ghana, slide 6", "qc": "How did the introduction of Christianity during the colonial era fundamentally impact indigenous healthcare practices in Ghana?", "options": ["It led to the immediate financial subsidization of herbal clinics by church missions.", "It resulted in many traditional and cultural practices being prohibited because they were deemed primitive or demonic.", "It integrated herbal medicine directly into western biomedical curricula.", "It collaborated with native kings to establish the Traditional Medicine Practice Council."], "correct_index": 1, "explanations": ["Incorrect, church missions prohibited traditional practices rather than subsidizing them.", "Correct, the slide notes that colonialism brought Christianity, through whose missions many traditional and cultural practices were prohibited as primitive and/or demonic.", "Incorrect, biomedicine brought western notions, but Christian missions prohibited traditional practices rather than integrating them.", "Incorrect, the TMPC was enacted much later in the year 2000 (Act 575), long after the colonial church missions."], "mid": "bhm04"}, {"tag": "BHM151·Q129", "difficulty": "hard", "section": "Historical Development", "qt": "single", "source": "BHM 151 — Herbal_Med_Ghana, slide 6", "qc": "What was the specific legislative instrument passed in 1878 that directly targeted traditional healing practices in the Gold Coast Colony?", "options": ["The Food and Drugs Law (PNDC 3058)", "The Traditional Medicine Practice Act (Act 575)", "The Native Customs Regulation Ordinance", "The Ghana Psychic and Traditional Healers Association Charter"], "correct_index": 2, "explanations": ["Incorrect, PNDC 3058 established the Food and Drugs Authority in 1992.", "Incorrect, Act 575 was enacted in the year 2000 for the TMPC.", "Correct, traditional healing practices were banned outright under the Native Customs Regulation Ordinance of 1878.", "Incorrect, lant materials to pharmaceutical firms in China", "By promoting national heritage assets through medical tourism to generate foreign income", "By replacing all conventional hospital infrastructure with tourist-centred herbal spas", "Through direct taxation of FDA regulatory compliance and clinical trial data fees"], "correct_index": 1, "explanations": ["Incorrect; exportation of raw materials is part of the supply chain, but medical tourism is specifically cited for income generation.", "Correct; herbal medicine is part of Ghana's national heritage and could be promoted for medical tourism to generate income.", "Incorrect; conventional hospitals are not replaced by spas.", "Incorrect; FDA data requirements are regulatory hurdles, not tourism income sources."], "mid": "bhm04"}, {"tag": "BHM151·Q145", "difficulty": "devil", "section": "Challenges", "qt": "single", "source": "BHM 151 — Herbal_Med_Ghana, slide 16", "qc": "Despite many herbal products satisfying the scientific data requirements for FDA registration, what is cited as the primary reason a substantial number of products still fail to secure registration?", "options": ["Lack of adequate clinical trial data on chronic disease management", "Failure to meet pharmacological efficacy thresholds in laboratory tests", "The presence of microbial contaminants rendering products non-compliant", "Inability to prove economic prospects for youth employment and poverty reduction"], "correct_index": 2, "explanations": ["Incorrect; clinical data is required, but the slide explicitly attributes the failure of registered products to microbial contaminants.", "Incorrect; pharmacological efficacy data is submitted, but contamination is the specific bottleneck mentioned.", "Correct; a substantial number of products fail registration mostly due to microbial contaminants despite meeting other requirements.", "Incorrect; economic prospects are unrelated to FDA product registration criteria."], "mid": "bhm04"}, {"tag": "BHM151·Q146"
