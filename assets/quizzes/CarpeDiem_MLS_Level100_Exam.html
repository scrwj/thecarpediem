loacetate to malate, which enters the matrix\nB: That uses DHAP and FAD\nC: That transports acetyl units\nD: That transports fatty acids","source":"Electron Transport Chain-Nathaniel Yebuah.pdf | SLIDE 25","difficulty":"Hard"},{"id":"mls-v2-076","module":"v2","type":"mcq","q":"Which transporter brings fructose into intestinal cells?","options":["GLUT2","GLUT5","GLUT4","SGLT1"],"answer":"GLUT5","solution":"A: That is involved in glucose exit\nB: The lecture states fructose is transported by facilitated diffusion via GLUT5\nC: That is insulin-sensitive in muscle and fat\nD: That transports glucose with sodium","source":"Fructose and Galactose Metabolism-Nathaniel Yebuah .pdf | SLIDE 7","difficulty":"Devil Mode"},{"id":"mls-v2-077","module":"v2","type":"mcq","q":"Which enzyme phosphorylates fructose to fructose-1-phosphate in the liver?","options":["Hexokinase","Phosphofructokinase","Aldolase B","Fructokinase"],"answer":"Fructokinase","solution":"A: Hexokinase acts mainly on glucose\nB: That acts on fructose-6-phosphate\nC: Aldolase B cleaves fructose-1-phosphate\nD: The lecture states fructose is mostly phosphorylated by fructokinase","source":"Fructose and Galactose Metabolism-Nathaniel Yebuah .pdf | SLIDE 10","difficulty":"Medium"},{"id":"mls-v2-078","module":"v2","type":"mcq","q":"Which enzyme cleaves fructose-1-phosphate into glyceraldehyde and DHAP?","options":["Aldolase B (fructose-1-phosphate aldolase)","Aldolase A","Fructokinase","Triokinase"],"answer":"Aldolase B (fructose-1-phosphate aldolase)","solution":"A: The lecture states fructose-1-phosphate undergoes hydrolysis by aldolase B\nB: Aldolase A acts in glycolysis on fructose-1,6-bisphosphate\nC: That phosphorylates fructose\nD: That phosphorylates glyceraldehyde","source":"Fructose and Galactose Metabolism-Nathaniel Yebuah .pdf | SLIDE 12","difficulty":"Medium"},{"id":"mls-v2-079","module":"v2","type":"mcq","q":"What is the defect in essential fructosuria?","options":["Deficiency of aldolase B","Deficiency of hepatic fructokinase","Deficiency of galactokinase","Deficiency of aldose reductase"],"answer":"Deficiency of hepatic fructokinase","solution":"A: That causes hereditary fructose intolerance\nB: The lecture states essential fructosuria is caused by hepatic fructokinase deficiency\nC: That causes galactosemia type 2\nD: That would affect the polyol pathway","source":"Fructose and Galactose Metabolism-Nathaniel Yebuah .pdf | SLIDE 25","difficulty":"Hard"},{"id":"mls-v2-080","module":"v2","type":"mcq","q":"Which disorder results from aldolase B deficiency?","options":["Essential fructosuria","Galactosemia","Hereditary fructose intolerance","Phenylketonuria"],"answer":"Hereditary fructose intolerance","solution":"A: That is fructokinase deficiency\nB: That involves galactose metabolism\nC: The lecture states HFI is caused by deficiency of the liver enzyme metabolising fructose-1-phosphate\nD: That involves phenylalanine","source":"Fructose and Galactose Metabolism-Nathaniel Yebuah .pdf | SLIDE 29","difficulty":"Hard"},{"id":"mls-v2-081","module":"v2","type":"mcq","q":"Which enzyme reduces glucose to sorbitol in the polyol pathway?","options":["Aldose reductase","Sorbitol dehydrogenase","Glucose oxidase","Fructokinase"],"answer":"Aldose reductase","solution":"A: The lecture states aldose reductase reduces glucose to sorbitol\nB: That oxidizes sorbitol to fructose\nC: That is not the polyol pathway enzyme\nD: That phosphorylates fructose","source":"Fructose and Galactose Metabolism-Nathaniel Yebuah .pdf | SLIDE 19","difficulty":"Devil Mode"},{"id":"mls-v2-082","module":"v2","type":"mcq","q":"Which sugar alcohol accumulates in the lens in galactosemia?","options":["Sorbitol","Galactitol","Mannitol","Xylitol"],"answer":"Galactitol","solution":"A: Sorbitol accumulates in diabetes\nB: The lecture states accumulated galactose is diverted to galactitol by aldose reductase\nC: That is not the galactosemia product\nD: That is not the galactosemia product","source":"fructose-metabolism-and-fructosuria.pdf | SLIDE 53","difficulty":"Medium"},{"id":"mls-v2-083","module":"v2","type":"mcq","q":"What is the main clinical symptom of galactokinase deficiency?","options":["Hepatomegaly alone","Renal failure only","Cataracts in the first weeks or months of life","Hypoglycaemia"],"answer":"Cataracts in the first weeks or months of life","solution":"A: That is more typical of classical galactosemia\nB: That is not the main symptom\nC: The lecture states cataracts are the major symptom\nD: That is not the stated symptom","source":"Fructose and Galactose Metabolism-Nathaniel Yebuah .pdf | SLIDE 47","difficulty":"Medium"},{"id":"mls-v2-084","module":"v2","type":"mcq","q":"Which enzyme is deficient in classical galactosemia?","options":["Galactokinase","UDP-glucose epimerase","Aldose reductase","Galactose-1-phosphate uridyltransferase (GALT)"],"answer":"Galactose-1-phosphate uridyltransferase (GALT)","solution":"A: That deficiency causes type 2 galactosemia\nB: That is a rarer form\nC: That produces galactitol\nD: The lecture states classical galactosemia is due to GALT deficiency","source":"Fructose and Galactose Metabolism-Nathaniel Yebuah .pdf | SLIDE 48","difficulty":"Hard"},{"id":"mls-v2-085","module":"v2","type":"mcq","q":"Which enzyme catalyses glycogen breakdown?","options":["Glycogen synthase","Glycogen phosphorylase","Branching enzyme","Debranching enzyme"],"answer":"Glycogen phosphorylase","solution":"A: That synthesizes glycogen\nB: The lecture states glycogen phosphorylase catalyses glycogen breakdown to glucose-1-phosphate\nC: That forms α-1,6 linkages\nD: That handles branch points","source":"Glycogen Metabolism-Nathaniel Yebuah.pdf | SLIDE 8","difficulty":"Hard"},{"id":"mls-v2-086","module":"v2","type":"mcq","q":"What coenzyme does glycogen phosphorylase require?","options":["Thiamine pyrophosphate","Flavin adenine dinucleotide","Pyridoxal phosphate (PLP)","Biotin"],"answer":"Pyridoxal phosphate (PLP)","solution":"A: That is used by pyruvate dehydrogenase\nB: That is used by oxidases\nC: The lecture states PLP, a derivative of pyridoxine, is the coenzyme for phosphorylase\nD: That is used by carboxylases","source":"Glycogen Metabolism-Nathaniel Yebuah.pdf | SLIDE 14","difficulty":"Devil Mode"},{"id":"mls-v2-087","module":"v2","type":"mcq","q":"Which enzyme forms the α-1,6 branch linkages in glycogen?","options":["Glycogen synthase","Phosphorylase","UDP-glucose pyrophosphorylase","The branching enzyme"],"answer":"The branching enzyme","solution":"A: That forms α-1,4 linkages\nB: That cleaves α-1,4 linkages\nC: That activates glucose\nD: The lecture states branching enzyme forms α-1,6 linkages","source":"Glycogen Metabolism-Nathaniel Yebuah.pdf | SLIDE 34","difficulty":"Medium"},{"id":"mls-v2-088","module":"v2","type":"mcq","q":"What is the activated form of glucose used in glycogen synthesis?","options":["UDP-glucose","Glucose-6-phosphate","Glucose-1-phosphate","ATP-glucose"],"answer":"UDP-glucose","solution":"A: The lecture states UDP-glucose is the activated form of glucose\nB: That is an intermediate but not the activated donor\nC: That reacts with UTP to form UDP-glucose\nD: That is not a real intermediate","source":"Glycogen Metabolism-Nathaniel Yebuah.pdf | SLIDE 31","difficulty":"Medium"},{"id":"mls-v2-089","module":"v2","type":"mcq","q":"What effect does phosphorylation have on glycogen synthase?","options":["It activates the enzyme","It has no effect","It inactivates the enzyme","It causes degradation"],"answer":"It inactivates the enzyme","solution":"A: Phosphorylation activates phosphorylase, not synthase\nB: Phosphorylation is the key regulatory mechanism\nC: The lecture states phosphorylated glycogen synthase is inactive\nD: It changes activity, not abundance","source":"Glycogen Metabolism-Nathaniel Yebuah.pdf | SLIDE 36","difficulty":"Hard"},{"id":"mls-v2-090","module":"v2","type":"mcq","q":"Which hormone is associated with the starved state and stimulates glycogen breakdown?","options":["Insulin","Cortisol","Thyroxine","Glucagon"],"answer":"Glucagon","solution":"A: Insulin is the fed-state hormone\nB: That is a glucocorticoid\nC: That regulates basal metabolism\nD: The take-home lesson states glucagon is the starved-state hormone","source":"Glycogen Metabolism-Nathaniel Yebuah.pdf | SLIDE 45","difficulty":"Hard"},{"id":"mls-v2-091","module":"v2","type":"mcq","q":"Why can the liver release free glucose from glycogen but muscle cannot?","options":["The liver has glucose-6-phosphatase, which muscle lacks","Muscle has no glycogen","Liver lacks phosphorylase","Muscle glycogen is structurally different"],"answer":"The liver has glucose-6-phosphatase, which muscle lacks","solution":"A: The lecture states liver contains glucose-6-phosphatase while muscle does not\nB: Muscle stores glycogen\nC: Liver has phosphorylase\nD: The enzymes differ, not the glycogen","source":"Glycogen Metabolism-Nathaniel Yebuah.pdf | SLIDE 13","difficulty":"Devil Mode"},{"id":"mls-v2-092","module":"v2","type":"mcq","q":"What does protein phosphatase 1 (PP1) do in glycogen metabolism?","options":["Phosphorylates glycogen synthase","Dephosphorylates phosphorylase kinase and phosphorylase a, promoting synthesis","Synthesizes UDP-glucose","Breaks down glycogen"],"answer":"Dephosphorylates phosphorylase kinase and phosphorylase a, promoting synthesis","solution":"A: That would inactivate synthase\nB: The lecture states PP1 dephosphorylates these targets and insulin activates it\nC: That is UDP-glucose pyrophosphorylase\nD: That is phosphorylase","source":"Glycogen Metabolism-Nathaniel Yebuah.pdf | SLIDE 39","difficulty":"Medium"},{"id":"mls-v2-093","module":"v2","type":"mcq","q":"How is biochemistry defined in the introductory lecture?","options":["The study of anatomy only","The study of physical forces only","The study of disease symptoms only","The study of the chemical processes of living matter"],"answer":"The study of the chemical processes of living matter","solution":"A: That is anatomy\nB: That is biophysics\nC: That is clinical medicine\nD: The slides describe biochemistry as dealing with the chemical nature of living matter","source":"Intro to Biochem- Nathaniel Yebuah.pdf | SLIDE 6","difficulty":"Medium"},{"id":"mls-v2-094","module":"v2","type":"mcq","q":"Which metabolic pathway is described as a divergent, anabolic process?","options":["Anabolism","Catabolism","Glycolysis","Citric acid cycle"],"answer":"Anabolism","solution":"A: The intro slides describe anabolism as divergent and biosynthetic\nB: Catabolism is convergent and degradative\nC: Glycolysis is catabolic\nD: That is amphibolic","source":"Intro to Biochem- Nathaniel Yebuah.pdf | SLIDE 50","difficulty":"Hard"},{"id":"mls-v2-095","module":"v2","type":"mcq","q":"What is the central structural feature of a typical amino acid?","options":["A linear carbon chain with no functional groups","A tetrahedral carbon with amino, carboxyl, H and an R group","Aromatic ring only","A phosphate group attached to glycerol"],"answer":"A tetrahedral carbon with amino, carboxyl, H and an R group","solution":"A: Amino acids have specific functional groups\nB: The lecture states amino acids contain a central tetrahedral carbon and identity depends on the R group\nC: Only some amino acids are aromatic\nD: That describes a phospholipid","source":"AMINO ACIDS- Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Hard"},{"id":"mls-v2-096","module":"v2","type":"mcq","q":"How are the 20 common amino acids classified in the amino acid lecture?","options":["By molecular weight only","By the number of amino groups","By the polarity of their side chains","By their colour"],"answer":"By the polarity of their side chains","solution":"A: Polarity is the stated basis\nB: That is not the stated classification\nC: The lecture states classification is based on side-chain polarity into four categories\nD: Colour is not the criterion","source":"AMINO ACIDS- Nathaniel Yebuah.pdf | SLIDE 6","difficulty":"Devil Mode"},{"id":"mls-v2-097","module":"v2","type":"mcq","q":"Which amino acid is a classic nonpolar (hydrophobic) amino acid?","options":["Leucine","Serine","Aspartic acid","Histidine"],"answer":"Leucine","solution":"A: The lecture lists leucine among nonpolar amino acids\nB: Serine is neutral polar\nC: Aspartic acid is acidic\nD: Histidine is basic","source":"AMINO ACIDS- Nathaniel Yebuah.pdf | SLIDE 7","difficulty":"Medium"},{"id":"mls-v2-098","module":"v2","type":"mcq","q":"Which reaction is characteristic of amino acids and produces a coloured product?","options":["The Biuret reaction alone","The ninhydrin reaction","The iodine test","The DCPIP test"],"answer":"The ninhydrin reaction","solution":"A: Biuret detects peptide bonds\nB: The lecture states ninhydrin is a strong oxidising agent causing oxidative deamination giving a characteristic colour\nC: That detects starch\nD: That detects vitamin C","source":"AMINO ACIDS- Nathaniel Yebuah.pdf | SLIDE 18","difficulty":"Medium"},{"id":"mls-v2-099","module":"v2","type":"mcq","q":"Which amino acid is optically active because of an asymmetric carbon?","options":["Glycine","All amino acids equally","Most amino acids with four different groups on the alpha carbon","Alanine only"],"answer":"Most amino acids with four different groups on the alpha carbon","solution":"A: Glycine has two hydrogens on the alpha carbon and is achiral\nB: Glycine is an exception\nC: The lecture states optical activity arises from a chiral centre\nD: Several amino acids are chiral","source":"AMINO ACIDS- Nathaniel Yebuah.pdf | SLIDE 20","difficulty":"Hard"},{"id":"mls-v2-100","module":"v2","type":"mcq","q":"What is the absorption wavelength used for PTH-amino acids in HPLC?","options":["280 nm","260 nm","540 nm","269 nm"],"answer":"269 nm","solution":"A: That is typical for protein aromatic absorbance\nB: That is typical for nucleic acids\nC: That is used for ninhydrin\nD: The lecture states PTH derivatives are detected at 269 nm","source":"AMINO ACIDS- Nathaniel Yebuah.pdf | SLIDE 25","difficulty":"Hard"},{"id":"mls-v2-101","module":"v2","type":"mcq","q":"How are carbohydrates chemically defined in the lecture?","options":["Amino acids linked by peptide bonds","Polyhydroxy carbonyl compounds and their derivatives","Esters of fatty acids","Inorganic salts"],"answer":"Polyhydroxy carbonyl compounds and their derivatives","solution":"A: That describes proteins\nB: The slides give this definition\nC: That describes lipids\nD: Carbohydrates are organic","source":"CARBOHYDRATES- Nathaniel Yebuah.pdf | SLIDE 3","difficulty":"Devil Mode"},{"id":"mls-v2-102","module":"v2","type":"mcq","q":"Which monosaccharide class has a ketone carbonyl group?","options":["Aldose","Deoxy sugar","A ketose","Sugar alcohol"],"answer":"A ketose","solution":"A: Aldoses have an aldehyde group\nB: That is a derivative\nC: The lecture states monosaccharides are classified as aldoses and ketoses\nD: That is a reduced derivative","source":"CARBOHYDRATES- Nathaniel Yebuah.pdf | SLIDE 6","difficulty":"Medium"},{"id":"mls-v2-103","module":"v2","type":"mcq","q":"Which cyclic form is more stable for an aldohexose such as glucose?","options":["Furanose","Open chain","Linear polymer","The pyranose form"],"answer":"The pyranose form","solution":"A: Furanose is more stable for ketohexoses\nB: Cyclization is favoured\nC: That is not a monosaccharide form\nD: The lecture states aldohexoses favour pyranose rings while ketohexoses favour furanose","source":"CARBOHYDRATES- Nathaniel Yebuah.pdf | SLIDE 12","difficulty":"Medium"},{"id":"mls-v2-104","module":"v2","type":"mcq","q":"Which disaccharide has a β-1,4 galactose-glucose linkage?","options":["Lactose","Maltose","Sucrose","Cellobiose"],"answer":"Lactose","solution":"A: The lecture states lactose is galactose-β-1,4-glucose\nB: Maltose is glucose-α-1,4-glucose\nC: Sucrose is glucose-α-1,2-fructose\nD: Cellobiose has β-1,4 glucose-glucose","source":"CARBOHYDRATES- Nathaniel Yebuah.pdf | SLIDE 21","difficulty":"Hard"},{"id":"mls-v2-105","module":"v2","type":"mcq","q":"What is the principal carbohydrate in milk?","options":["Sucrose","Maltose","Lactose","Glycogen"],"answer":"Lactose","solution":"A: Sucrose is table sugar\nB: Maltose is from malt\nC: The lecture states β-D-lactose is the principal carbohydrate in milk\nD: Glycogen is the animal storage polysaccharide","source":"CARBOHYDRATES- Nathaniel Yebuah.pdf | SLIDE 23","difficulty":"Hard"},{"id":"mls-v2-106","module":"v2","type":"mcq","q":"Which storage polysaccharide is found in animal liver and skeletal muscle?","options":["Starch","Cellulose","Chitin","Glycogen"],"answer":"Glycogen","solution":"A: Starch is the plant storage polysaccharide\nB: Cellulose is structural in plants\nC: Chitin is in fungal and insect exoskeletons\nD: The lecture states glycogen is stored mainly in liver and muscle","source":"CARBOHYDRATES- Nathaniel Yebuah.pdf | SLIDE 37","difficulty":"Devil Mode"},{"id":"mls-v2-107","module":"v2","type":"mcq","q":"In glycogen, where are glucose units removed from during energy provision?","options":["One at a time from non-reducing ends","From the reducing end only","From the middle of chains","All at once"],"answer":"One at a time from non-reducing ends","solution":"A: The lecture states each branch ends with a non-reducing unit and glucose is removed one at a time\nB: Glycogen phosphorylase acts at non-reducing ends\nC: That is not the mechanism\nD: Removal is sequential","source":"CARBOHYDRATES- Nathaniel Yebuah.pdf | SLIDE 39","difficulty":"Medium"},{"id":"mls-v2-108","module":"v2","type":"mcq","q":"Which polysaccharide is the main constituent of plant cell walls?","options":["Starch","Cellulose","Glycogen","Agar"],"answer":"Cellulose","solution":"A: Starch is storage\nB: The lecture states cellulose is the main constituent of plant cell walls\nC: Glycogen is animal storage\nD: Agar comes from red algae","source":"CARBOHYDRATES- Nathaniel Yebuah.pdf | SLIDE 46","difficulty":"Medium"},{"id":"mls-v2-109","module":"v2","type":"mcq","q":"Which glycosaminoglycan consists of alternating D-glucuronic acid and N-acetylglucosamine?","options":["Chondroitin sulfate","Keratan sulfate","Heparin","Hyaluronic acid"],"answer":"Hyaluronic acid","solution":"A: That contains galactosamine\nB: That contains galactose and galactosamine\nC: That is rich in iduronic acid\nD: The lecture states hyaluronic acid has these alternating residues","source":"CARBOHYDRATES- Nathaniel Yebuah.pdf | SLIDE 62","difficulty":"Hard"},{"id":"mls-v2-110","module":"v2","type":"mcq","q":"How does heparin exert its anticoagulant effect?","options":["By binding antithrombin and inhibiting thrombin","By dissolving fibrin directly","By activating platelets","By increasing calcium"],"answer":"By binding antithrombin and inhibiting thrombin","solution":"A: The lecture states heparin binding causes antithrombin to inhibit thrombin\nB: That is not the mechanism\nC: Platelets promote clotting\nD: Calcium promotes clotting","source":"CARBOHYDRATES- Nathaniel Yebuah.pdf | SLIDE 67","difficulty":"Hard"},{"id":"mls-v2-111","module":"v2","type":"mcq","q":"Which type of enzyme inhibitor forms a permanent covalent bond with the enzyme?","options":["Competitive inhibitor","An irreversible inhibitor","Non-competitive inhibitor","Uncompetitive inhibitor"],"answer":"An irreversible inhibitor","solution":"A: Competitive inhibition is reversible\nB: The lecture states irreversible inhibitors form covalent bonds with functional groups\nC: That is reversible\nD: That is reversible","source":"Enzymes inhibitor- Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Devil Mode"},{"id":"mls-v2-112","module":"v2","type":"mcq","q":"Which inhibitors structurally resemble the natural substrate of an enzyme?","options":["Non-competitive inhibitors","Irreversible inhibitors","Competitive inhibitors","Uncompetitive inhibitors"],"answer":"Competitive inhibitors","solution":"A: These do not affect substrate binding\nB: These react covalently with enzyme groups\nC: The lecture states competitive inhibitors resemble natural substrates\nD: These bind to the enzyme-substrate complex","source":"Enzymes inhibitor- Nathaniel Yebuah.pdf | SLIDE 11","difficulty":"Medium"},{"id":"mls-v2-113","module":"v2","type":"mcq","q":"Which ion inhibits enolase as an example of non-competitive inhibition?","options":["Fluoride","Cyanide","Iodide","Fluorine gas"],"answer":"Fluoride","solution":"A: The lecture gives fluoride inhibition of enolase as an example\nB: Cyanide inhibits cytochrome oxidase\nC: That is not the example\nD: The ion, not the gas, is the inhibitor","source":"Enzymes inhibitor- Nathaniel Yebuah.pdf | SLIDE 13","difficulty":"Medium"},{"id":"mls-v2-114","module":"v2","type":"mcq","q":"How does competitive inhibition help in methanol poisoning?","options":["Ethanol neutralizes methanol chemically","Ethanol competes with methanol for alcohol dehydrogenase","Ethanol increases methanol absorption","Ethanol acts as an antidote by precipitation"],"answer":"Ethanol competes with methanol for alcohol dehydrogenase","solution":"A: That is not the mechanism\nB: The lecture states ethanol competes with methanol as substrate\nC: That would worsen poisoning\nD: That is not correct","source":"Enzymes inhibitor- Nathaniel Yebuah.pdf | SLIDE 20","difficulty":"Hard"},{"id":"mls-v2-115","module":"v2","type":"mcq","q":"Which pH optimum is given for pepsin?","options":["6.4","9–10","1.5","4.5–5.0"],"answer":"1.5","solution":"A: That is urease\nB: That is alkaline phosphatase\nC: The lecture lists pepsin optimum at 1.5\nD: That is acid phosphatase","source":"Enzymes inhibitor- Nathaniel Yebuah.pdf | SLIDE 39","difficulty":"Hard"},{"id":"mls-v2-116","module":"v2","type":"mcq","q":"What shape of substrate-saturation curve is typical of allosteric enzymes?","options":["Hyperbolic","Linear","Exponential decrease","Sigmoidal"],"answer":"Sigmoidal","solution":"A: That is typical of non-regulatory enzymes\nB: That would indicate first-order behaviour at all concentrations\nC: That is not the stated shape\nD: The lecture states allosteric enzymes give a sigmoidal curve","source":"Enzymes inhibitor- Nathaniel Yebuah.pdf | SLIDE 46","difficulty":"Devil Mode"},{"id":"mls-v2-117","module":"v2","type":"mcq","q":"Which enzyme was the first to be crystallized?","options":["Ribonuclease","Urease from jack bean","Hexokinase","Pepsin"],"answer":"Urease from jack bean","solution":"A: That was crystallized later\nB: The lecture states urease from jackbean was the first enzyme crystallized\nC: Not the first crystallized\nD: Not the first crystallized","source":"Enzymes-Nathaniel Yebuah.pdf | SLIDE 3","difficulty":"Medium"},{"id":"mls-v2-118","module":"v2","type":"mcq","q":"What is the non-protein part of a conjugated enzyme called?","options":["The apoenzyme","The zymogen","The cofactor (prosthetic group)","The active site"],"answer":"The cofactor (prosthetic group)","solution":"A: That is the protein part\nB: That is an inactive precursor\nC: The lecture states the protein part is the apoprotein and the non-protein portion completes the holoenzyme\nD: That is a region of the protein","source":"Enzymes-Nathaniel Yebuah.pdf | SLIDE 10","difficulty":"Medium"},{"id":"mls-v2-119","module":"v2","type":"mcq","q":"Which hypothesis explains enzyme specificity by a rigid complementary active site?","options":["Induced fit theory","Michaelis-Menten theory","Arrhenius theory","Lock and key hypothesis"],"answer":"Lock and key hypothesis","solution":"A: Koshland's induced fit allows conformational change\nB: That concerns kinetics\nC: That concerns temperature dependence\nD: The lecture states the lock-and-key hypothesis explains specificity but cannot explain all observations","source":"Enzymes-Nathaniel Yebuah.pdf | SLIDE 21","difficulty":"Hard"},{"id":"mls-v2-120","module":"v2","type":"mcq","q":"What is the 'boiled enzyme test' used to demonstrate?","options":["The protein nature of enzymes","That enzymes are carbohydrates","That enzymes are vitamins","That enzymes are inorganic catalysts"],"answer":"The protein nature of enzymes","solution":"A: The lecture states boiling denatures enzymes, supporting their protein nature\nB: Boiling does not show this\nC: That is not demonstrated\nD: Inorganic catalysts are not denatured by boiling","source":"Enzymes-Nathaniel Yebuah.pdf | SLIDE 27","difficulty":"Hard"},{"id":"mls-v2-121","module":"v2","type":"mcq","q":"What is a ribozyme?","options":["A protein enzyme with ribose attached","A vitamin derivative","An RNA molecule with catalytic activity","A synthetic enzyme mimic"],"answer":"An RNA molecule with catalytic activity","solution":"A: That is not the definition\nB: That is a coenzyme\nC: The lecture notes the discovery of catalytic RNA changed the view that all enzymes are proteins\nD: That is a synzyme","source":"Enzymes-Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Devil Mode"},{"id":"mls-v2-122","module":"v2","type":"mcq","q":"In a hemiacetal, what structural feature defines the carbon atom?","options":["It has two carbonyl groups","It is bonded to nitrogen","It carries only hydrogen atoms","It bears both an OH group and an OR group"],"answer":"It bears both an OH group and an OR group","solution":"A: That is a diketone\nB: That would be an aminal\nC: That is methane\nD: The slide states a hemiacetal carbon holds both an OH and an ether group","source":"Hemi Acetals and Ketals.pdf | SLIDE 16","difficulty":"Medium"},{"id":"mls-v2-123","module":"v2","type":"mcq","q":"Why are hemiacetals generally unstable?","options":["They revert to the original aldehyde and alcohol","They are oxidised by air immediately","They polymerise spontaneously","They are ionic salts"],"answer":"They revert to the original aldehyde and alcohol","solution":"A: The lecture states isolation attempts lead to breakdown\nB: Oxidation is not the stated reason\nC: That is not the stated reason\nD: They are covalent","source":"Hemi Acetals and Ketals.pdf | SLIDE 17","difficulty":"Medium"},{"id":"mls-v2-124","module":"v2","type":"mcq","q":"What is formed when a hemiacetal reacts with another alcohol with loss of water?","options":["A ketal only","An acetal","An ester","An ether alone"],"answer":"An acetal","solution":"A: Ketals derive from ketones\nB: The lecture states hemiacetals can be converted to 1,1-diethers called acetals\nC: Esters derive from acids\nD: A 1,1-diether is specifically an acetal","source":"Hemi Acetals and Ketals.pdf | SLIDE 18","difficulty":"Hard"},{"id":"mls-v2-125","module":"v2","type":"mcq","q":"What type of isomerism arises from hindered rotation about a double bond?","options":["Positional isomerism","Optical isomerism","Functional group isomerism","Geometric isomerism"],"answer":"Geometric isomerism","solution":"A: That concerns functional-group position\nB: That concerns chirality\nC: That concerns different functional groups\nD: The lecture states geometric isomerism results from restricted rotation about a double bond","source":"Isomerism-Nathaniel Yebuah.pdf | SLIDE 12","difficulty":"Hard"},{"id":"mls-v2-126","module":"v2","type":"mcq","q":"Why is the trans isomer of but-2-ene more stable than the cis isomer?","options":["Bulky groups are farther apart, reducing repulsion","Trans has more hydrogen atoms","Trans forms hydrogen bonds","Cis has a double bond, trans does not"],"answer":"Bulky groups are farther apart, reducing repulsion","solution":"A: The lecture states cis isomers have bulky groups close together causing instability\nB: Both have the same formula\nC: Alkenes do not hydrogen bond\nD: Both have double bonds","source":"Isomerism-Nathaniel Yebuah.pdf | SLIDE 15","difficulty":"Devil Mode"},{"id":"mls-v2-127","module":"v2","type":"mcq","q":"In the Cahn-Ingold-Prelog sequence rules, how is priority assigned among F, Cl, Br and I?","options":["By atomic mass only for isotopes","By increasing atomic number, F < Cl < Br < I","By alphabetical order","By bond length"],"answer":"By increasing atomic number, F < Cl < Br < I","solution":"A: Isotope mass is a sub-rule\nB: The lecture gives this increasing order of priority\nC: That is not the CIP rule\nD: That is not the rule","source":"Isomerism-Nathaniel Yebuah.pdf | SLIDE 24","difficulty":"Medium"},{"id":"mls-v2-128","module":"v2","type":"mcq","q":"What makes a molecule optically active?","options":["It contains a double bond","It is soluble in water","It contains a chiral centre with four different groups","It absorbs ultraviolet light"],"answer":"It contains a chiral centre with four different groups","solution":"A: That gives geometric isomerism\nB: Solubility does not cause optical activity\nC: The lecture states tetrahedral structures with four different substituents are optically active\nD: That is spectroscopy","source":"Isomerism-Nathaniel Yebuah.pdf | SLIDE 35","difficulty":"Medium"},{"id":"mls-v2-129","module":"v2","type":"mcq","q":"What is a racemic mixture?","options":["An equimolar mixture of two enantiomers","A mixture of diastereomers only","A pure enantiomer","A mixture of polymers"],"answer":"An equimolar mixture of two enantiomers","solution":"A: The lecture defines a racemic mixture as equimolar enantiomers and its separation as resolution\nB: That is not racemic\nC: That is not a mixture\nD: That is not the definition","source":"Isomerism-Nathaniel Yebuah.pdf | SLIDE 41","difficulty":"Hard"},{"id":"mls-v2-130","module":"v2","type":"mcq","q":"Which light source is commonly used in polarimetry?","options":["An infrared laser","A sodium lamp at 589.3 nm","A mercury lamp at 254 nm","Sunlight directly"],"answer":"A sodium lamp at 589.3 nm","solution":"A: That is not the standard source\nB: The lecture states the sodium D-line at 589.3 nm is used\nC: That is not the stated source\nD: A monochromatic source is used","source":"Isomerism-Nathaniel Yebuah.pdf | SLIDE 49","difficulty":"Hard"},{"id":"mls-v2-131","module":"v2","type":"mcq","q":"How are lipids defined in the lecture?","options":["Soluble in water only","Always solid at room temperature","Insoluble in water but soluble in nonpolar solvents","Composed only of amino acids"],"answer":"Insoluble in water but soluble in nonpolar solvents","solution":"A: That is the opposite\nB: Oils are liquid\nC: The lecture gives this solubility-based definition\nD: That describes proteins","source":"LIPIDS- Nathaniel Yebuah.pdf | SLIDE 2","difficulty":"Devil Mode"},{"id":"mls-v2-132","module":"v2","type":"mcq","q":"Which fatty acids are essential fatty acids?","options":["Palmitic and stearic acids","Oleic acid only","All saturated fatty acids","Linoleic and arachidonic acids (ω-6) and ω-3 types"],"answer":"Linoleic and arachidonic acids (ω-6) and ω-3 types","solution":"A: These are saturated non-essential acids\nB: That is not essential\nC: Saturated fats are not essential\nD: The lecture states ω-3 and ω-6 fatty acids are essential","source":"LIPIDS- Nathaniel Yebuah.pdf | SLIDE 15","difficulty":"Medium"},{"id":"mls-v2-133","module":"v2","type":"mcq","q":"What causes rancidity in fats and oils?","options":["Bacterial fermentation only","Oxidative chain reactions initiated by free radicals","Addition of antioxidants","Exposure to light alone"],"answer":"Oxidative chain reactions initiated by free radicals","solution":"A: Oxidation is the main cause\nB: The lecture describes free-radical chain reactions leading to breakdown\nC: Antioxidants prevent rancidity\nD: Light may accelerate but oxidation is the cause","source":"LIPIDS- Nathaniel Yebuah.pdf | SLIDE 19","difficulty":"Medium"},{"id":"mls-v2-134","module":"v2","type":"mcq","q":"Which phospholipid is commonly called lecithin?","options":["Phosphatidylethanolamine","Sphingomyelin","Phosphatidylcholine","Cardiolipin"],"answer":"Phosphatidylcholine","solution":"A: That is a cephalin\nB: That is a sphingolipid\nC: The lecture states the commercial term lecithin refers mostly to phosphatidylcholine\nD: That is a mitochondrial phospholipid","source":"LIPIDS- Nathaniel Yebuah.pdf | SLIDE 31","difficulty":"Hard"},{"id":"mls-v2-135","module":"v2","type":"mcq","q":"Where are gangliosides especially important?","options":["In bone matrix","In the liver only","In red blood cells only","In nerve endings for nerve impulse transmission"],"answer":"In nerve endings for nerve impulse transmission","solution":"A: That is collagen\nB: They are widely distributed\nC: Not confined there\nD: The lecture states gangliosides occur in nerve endings","source":"LIPIDS- Nathaniel Yebuah.pdf | SLIDE 40","difficulty":"Hard"},{"id":"mls-v2-136","module":"v2","type":"mcq","q":"Which nitrogenous bases are purines?","options":["Adenine and guanine","Cytosine and thymine","Uracil and thymine","Cytosine and uracil"],"answer":"Adenine and guanine","solution":"A: The lecture states three pyrimidines and two purines occur in cells\nB: These are pyrimidines\nC: These are pyrimidines\nD: These are pyrimidines","source":"NUCLEIC ACID- Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Devil Mode"},{"id":"mls-v2-137","module":"v2","type":"mcq","q":"What bond links a sugar to a base in a nucleoside?","options":["A phosphodiester bond","A peptide bond","A β-N-glycosidic bond","A hydrogen bond"],"answer":"A β-N-glycosidic bond","solution":"A: That links nucleotides\nB: That links amino acids\nC: The lecture states nucleosides form through a β-N-glycosidic bond\nD: That links bases in duplex DNA","source":"NUCLEIC ACID- Nathaniel Yebuah.pdf | SLIDE 6","difficulty":"Medium"},{"id":"mls-v2-138","module":"v2","type":"mcq","q":"What rule states that in DNA the amount of adenine equals thymine and guanine equals cytosine?","options":["The central dogma","The wobble hypothesis","The Hardy-Weinberg rule","Chargaff's rules"],"answer":"Chargaff's rules","solution":"A: That describes information flow\nB: That concerns codon pairing\nC: That concerns populations\nD: The lecture cites Chargaff's rules for base amounts","source":"NUCLEIC ACID- Nathaniel Yebuah.pdf | SLIDE 16","difficulty":"Medium"},{"id":"mls-v2-139","module":"v2","type":"mcq","q":"Which RNA species carries amino acids to ribosomes?","options":["Transfer RNA","Messenger RNA","Ribosomal RNA","Small nuclear RNA"],"answer":"Transfer RNA","solution":"A: The lecture states tRNAs carry amino acids for protein synthesis\nB: mRNA carries the code\nC: rRNA forms the ribosome\nD: snRNA mediates splicing","source":"NUCLEIC ACID- Nathaniel Yebuah.pdf | SLIDE 24","difficulty":"Hard"},{"id":"mls-v2-140","module":"v2","type":"mcq","q":"Which level of protein structure is the amino acid sequence?","options":["Secondary structure","Primary structure","Tertiary structure","Quaternary structure"],"answer":"Primary structure","solution":"A: That is local folding such as alpha helices\nB: The lecture states primary structure is the amino acid sequence\nC: That is the full 3-D fold of one chain\nD: That is the arrangement of subunits","source":"PROTEINS-Nathaniel Yebuah.pdf | SLIDE 12","difficulty":"Hard"},{"id":"mls-v2-141","module":"v2","type":"mcq","q":"Which protein shape class includes collagen?","options":["Globular proteins","Membrane proteins","Enzyme proteins","Fibrous proteins"],"answer":"Fibrous proteins","solution":"A: Globular proteins are compact and soluble\nB: These are embedded in membranes\nC: That is a functional class\nD: The lecture lists fibrous, globular and membrane proteins and cites collagen","source":"PROTEINS-Nathaniel Yebuah.pdf | SLIDE 11","difficulty":"Devil Mode"},{"id":"mls-v2-142","module":"v2","type":"mcq","q":"What is the desired outcome or goal of any communication process?","options":["Understanding","Winning an argument","Producing a written document","Using technology"],"answer":"Understanding","solution":"A: The communication lecture states the goal is understanding between participants\nB: That is not the stated goal\nC: Writing is only one channel\nD: Technology is a channel, not the goal","source":"LECTURE 1 - COMMUNICATION-Nathaniel Yebuah.pdf | SLIDE 5","difficulty":"Medium"},{"id":"mls-v2-143","module":"v2","type":"mcq","q":"In the communication process, what does the sender do?","options":["Decodes the message","Encodes the message","Blocks the channel","Provides feedback"],"answer":"Encodes the message","solution":"A: That is the receiver's role\nB: The lecture states the sender encodes the message\nC: That is a barrier\nD: That is the receiver's response","source":"LECTURE 1 - COMMUNICATION-Nathaniel Yebuah.pdf | SLIDE 5","difficulty":"Medium"},{"id":"mls-v2-144","module":"v2","type":"mcq","q":"Which model of communication was developed by engineers and assumes individual differences are fixed?","options":["Human behaviour models","Process models","Technological models","Transactional models"],"answer":"Technological models","solution":"A: These emphasize sender and receiver characteristics\nB: These view communication as interpersonal systems\nC: The lecture states technological models were developed by engineers\nD: These are not the categorized model in the lecture","source":"Week 10- Communication in Healthcare Delivery– Nathaniel Yebuah.pdf | SLIDE 11","difficulty":"Hard"},{"id":"mls-v2-145","module":"v2","type":"mcq","q":"Which of the following is NOT a usual element of interpersonal communication?","options":["The laboratory result","A message","Feedback","Context"],"answer":"The laboratory result","solution":"A: The lecture lists communicators, message, feedback, context and channel\nB: This is a listed element\nC: This is a listed element\nD: This is a listed element","source":"Week 10- Communication in Healthcare Delivery– Nathaniel Yebuah.pdf | SLIDE 8","difficulty":"Hard"},{"id":"mls-v2-146","module":"v2","type":"mcq","q":"According to Patterson (1983), which function of non-verbal behaviour provides information beyond the verbal message?","options":["Contradicting the message","Providing information","Replacing speech entirely","Creating noise"],"answer":"Providing information","solution":"A: That is a different function\nB: The lecture lists this as the first function\nC: That is not the stated function\nD: That is a barrier","source":"Week 10- Communication in Healthcare Delivery– Nathaniel Yebuah.pdf | SLIDE 20","difficulty":"Devil Mode"},{"id":"mls-v2-147","module":"v2","type":"mcq","q":"What does proxemics refer to in non-verbal communication?","options":["Facial expression","Eye contact","The use of personal space and territoriality","Tone of voice"],"answer":"The use of personal space and territoriality","solution":"A: That is a separate category\nB: That is gaze\nC: The lecture defines proxemics as spatial distance\nD: That is vocalics","source":"Week 10- Communication in Healthcare Delivery– Nathaniel Yebuah.pdf | SLIDE 21","difficulty":"Medium"},{"id":"mls-v2-148","module":"v2","type":"mcq","q":"Which barrier to communication relates to differences in language or vocabulary?","options":["A physical barrier","A psychological barrier","A physiological barrier","A language barrier"],"answer":"A language barrier","solution":"A: That concerns the environment\nB: That concerns attitudes\nC: That concerns sensory or bodily limitations\nD: The lecture lists language, psychological, physiological and physical barriers","source":"Week 10- Communication in Healthcare Delivery– Nathaniel Yebuah.pdf | SLIDE 23","difficulty":"Medium"},{"id":"mls-v2-149","module":"v2","type":"mcq","q":"What is a therapeutic conversation in healthcare delivery?","options":["A casual chat with no purpose","A skilled, empathic conversation focused on feelings and the here-and-now","A lecture by the clinician only","A written report"],"answer":"A skilled, empathic conversation focused on feelings and the here-and-now","solution":"A: That is not therapeutic\nB: The lecture lists five components including here-and-now, feelings and empathic understanding\nC: That is one-way communication\nD: That is not a conversation","source":"Week 10- Communication in Healthcare Delivery– Nathaniel Yebuah.pdf | SLIDE 27","difficulty":"Hard"},{"id":"mls-v2-150","module":"v2","type":"mcq","q":"What is the 'third force' in psychology mentioned in the approaches lecture?","options":["Behaviourism","Psychoanalysis","The humanistic approach","Biological psychology"],"answer":"The humanistic approach","solution":"A: That is the first force\nB: That is the first tradition\nC: The lecture states humanistic psychology emerged after psychodynamic and behaviourist approaches\nD: That is not called the third force","source":"week 2- Nathaniel Yebuah.pdf | SLIDE 30","difficulty":"Hard"},{"id":"mls-v2-151","module":"v2","type":"mcq","q":"Which writing approach is described as non-linear, messy and recursive?","options":["The product approach","The grammar-translation approach","Thelecture approach","The process approach"],"answer":"The process approach","solution":"A: That focuses on the final text\nB: That is not discussed in this lecture\nC: That is not a writing approach\nD: The lecture states writing is messy, recursive and uneven in the process approach","source":"LECTURE 3-Writing As A Process-Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Devil Mode"},{"id":"mls-v2-152","module":"v2","type":"mcq","q":"Which pre-writing technique involves gathering ideas spontaneously without judging them?","options":["Brainstorming","Outlining","Proofreading","Editing"],"answer":"Brainstorming","solution":"A: The lecture defines brainstorming as spontaneous idea gathering\nB: Outlining organizes ideas\nC: Proofreading is post-writing\nD: Editing is post-writing","source":"LECTURE 3-Writing As A Process-Nathaniel Yebuah.pdf | SLIDE 18","difficulty":"Medium"},{"id":"mls-v2-153","module":"v2","type":"mcq","q":"What is an outline in the writing-process lecture?","options":["A finished essay","A bibliography","The skeleton of main points in logical order","A proofreading checklist"],"answer":"The skeleton of main points in logical order","solution":"A: It is a planning tool\nB: That is a list of sources\nC: The lecture defines an outline as a way of organizing key ideas\nD: That is a different tool","source":"LECTURE 3-Writing As A Process-Nathaniel Yebuah.pdf | SLIDE 23","difficulty":"Medium"},{"id":"mls-v2-154","module":"v2","type":"mcq","q":"Which focus of editing deals with relevance, adequacy, consistency and accuracy?","options":["Structure","Clarity","Formatting","Content"],"answer":"Content","solution":"A: Structure concerns organization\nB: Clarity concerns meaning at word and sentence level\nC: Formatting concerns spacing and fonts\nD: The lecture lists these under content editing","source":"LECTURE 3-Writing As A Process-Nathaniel Yebuah.pdf | SLIDE 31","difficulty":"Hard"},{"id":"mls-v2-155","module":"v2","type":"mcq","q":"What does proofreading mainly concentrate on?","options":["Surface mechanics such as grammar, spelling and punctuation","The argument's logic","The research design","The audience analysis"],"answer":"Surface mechanics such as grammar, spelling and punctuation","solution":"A: The lecture calls proofreading surface revision\nB: That is editing for content\nC: That is not proofreading\nD: That is pre-writing","source":"LECTURE 3-Writing As A Process-Nathaniel Yebuah.pdf | SLIDE 39","difficulty":"Hard"},{"id":"mls-v2-156","module":"v2","type":"mcq","q":"Which element of a formal letter captures its purpose and is not punctuated as a sentence?","options":["The writer's address","The heading","The subscription","The salutation"],"answer":"The heading","solution":"A: That gives the sender's location\nB: The lecture states the heading must not be in sentence form or punctuated\nC: That closes the letter\nD: That greets the recipient","source":"LECTURE 4-FORMAL LETTER-Nathaniel Yebuah.pdf | SLIDE 30","difficulty":"Devil Mode"},{"id":"mls-v2-157","module":"v2","type":"mcq","q":"What does the subscription of a formal letter include?","options":["Only the signature","The recipient's address","The heading","Complimentary close, signature, designation and identification"],"answer":"Complimentary close, signature, designation and identification","solution":"A: That is one part only\nB: That is part of the recipient block\nC: That is a separate element\nD: The lecture states the subscription has four parts","source":"LECTURE 4-FORMAL LETTER-Nathaniel Yebuah.pdf | SLIDE 34","difficulty":"Medium"},{"id":"mls-v2-158","module":"v2","type":"mcq","q":"Which type of address is used when the writer has no address of their own?","options":["A 'care of' (C/o) address","An email address","A residential address","A religious address"],"answer":"A 'care of' (C/o) address","solution":"A: The lecture states a C/o address can be used\nB: That is a different type\nC: That is the writer's own home\nD: That is a specific institution type","source":"LECTURE 4-FORMAL LETTER-Nathaniel Yebuah.pdf | SLIDE 13","difficulty":"Medium"},{"id":"mls-v2-159","module":"v2","type":"mcq","q":"What is glossophobia?","options":["Fear of heights","Stage fright or performance anxiety","Fear of spiders","Fear of closed spaces"],"answer":"Stage fright or performance anxiety","solution":"A: That is acrophobia\nB: The lecture defines stage fright as glossophobia\nC: That is arachnophobia\nD: That is claustrophobia","source":"LECTURE 5-PRESENTATION SKILLS-Nathaniel Yebuah.pdf | SLIDE 23","difficulty":"Hard"},{"id":"mls-v2-160","module":"v2","type":"mcq","q":"Which of the following is a recommended 'don't' in public speaking?","options":["Don't rehearse","Don't use notes","Don't read the slides","Don't face the audience"],"answer":"Don't read the slides","solution":"A: Rehearsal is encouraged\nB: Notes are encouraged\nC: The lecture lists this among the don'ts\nD: Facing the audience is expected","source":"LECTURE 5-PRESENTATION SKILLS-Nathaniel Yebuah.pdf | SLIDE 9","difficulty":"Hard"},{"id":"mls-v2-161","module":"v2","type":"mcq","q":"Which characteristic of effective oral communication means the receiver gets all the information?","options":["Completeness","Conciseness","Concreteness","Correctness"],"answer":"Completeness","solution":"A: The lecture defines completeness in these terms\nB: That means keeping to the point\nC: That means being specific and vivid\nD: That means correct grammar","source":"LECTURE 5-PRESENTATION SKILLS-Nathaniel Yebuah.pdf | SLIDE 11","difficulty":"Devil Mode"},{"id":"mls-v2-162","module":"v2","type":"mcq","q":"What is an unstructured (nondirective) interview?","options":["An interview with predetermined questions","An interview using probing open-ended questions","A panel interview","A stress interview"],"answer":"An interview using probing open-ended questions","solution":"A: That is structured\nB: The lecture defines unstructured interviews this way\nC: That involves several interviewers\nD: That deliberately creates discomfort","source":"LECTURE 5-PRESENTATION SKILLS-Nathaniel Yebuah.pdf | SLIDE 43","difficulty":"Medium"},{"id":"mls-v2-163","module":"v2","type":"mcq","q":"What is a vote of thanks?","options":["A proposal of a toast","A chairperson's opening remark","A designated expression of gratitude at an organized programme","A formal letter"],"answer":"A designated expression of gratitude at an organized programme","solution":"A: That wishes future health\nB: That introduces the programme\nC: The lecture defines vote of thanks in these terms\nD: That is written communication","source":"LECTURE 5-PRESENTATION SKILLS-Nathaniel Yebuah.pdf | SLIDE 30","difficulty":"Medium"},{"id":"mls-v2-164","module":"v2","type":"mcq","q":"What does a curriculum vitae mean in Latin?","options":["Life story","Written life","Professional summary","Course of life"],"answer":"Course of life","solution":"A: That is a rough translation but not the one given\nB: That is not the stated meaning\nC: That describes content\nD: The lecture states CV is Latin for 'course of life'","source":"LECTURE 6-CV WRITING-Nathaniel Yebuah.pdf | SLIDE 2","difficulty":"Hard"},{"id":"mls-v2-165","module":"v2","type":"mcq","q":"Which CV type highlights skills and achievements rather than chronology?","options":["Traditional chronological CV","Functional (skills-based) CV","Combined chrono-functional CV","General purpose CV"],"answer":"Functional (skills-based) CV","solution":"A: That lists education and work in order\nB: The lecture defines the functional CV this way\nC: That mixes both\nD: That includes all significant details","source":"LECTURE 6-CV WRITING-Nathaniel Yebuah.pdf | SLIDE 8","difficulty":"Hard"},{"id":"mls-v2-166","module":"v2","type":"mcq","q":"In which order should education be presented on a CV?","options":["Alphabetical order","Random order","Reverse chronological order","Ascending chronological order"],"answer":"Reverse chronological order","solution":"A: That is not recommended\nB: That would confuse readers\nC: The lecture states the most recent qualification comes first\nD: The oldest should not come first","source":"LECTURE 6-CV WRITING-Nathaniel Yebuah.pdf | SLIDE 23","difficulty":"Devil Mode"},{"id":"mls-v2-167","module":"v2","type":"mcq","q":"Which consideration is NOT appropriate when selecting a referee?","options":["Consent","Availability","Competence","Physical appearance"],"answer":"Physical appearance","solution":"A: Consent is listed\nB: Availability is listed\nC: Competence is listed\nD: The lecture lists consent, availability, competence, qualification, rank and character","source":"LECTURE 6-CV WRITING-Nathaniel Yebuah.pdf | SLIDE 41","difficulty":"Medium"},{"id":"mls-v2-168","module":"v2","type":"mcq","q":"What is a quorum in the context of formal meetings?","options":["The number of people required to validate the meeting","The person chairing the meeting","The agenda","The minutes"],"answer":"The number of people required to validate the meeting","solution":"A: The lecture defines quorum in these terms\nB: That is the chairperson\nC: That is the list of items\nD: That is the record","source":"LECTURE 7-MEETING AND MINUTES-Nathaniel Yebuah.pdf | SLIDE 3","difficulty":"Medium"},{"id":"mls-v2-169","module":"v2","type":"mcq","q":"What is an agenda?","options":["The record of decisions","A formal motion","The list of items to be considered at a meeting","A notice of meeting"],"answer":"The list of items to be considered at a meeting","solution":"A: That is the minutes\nB: That is a proposed action\nC: The lecture defines an agenda this way\nD: That informs members of the meeting","source":"LECTURE 7-MEETING AND MINUTES-Nathaniel Yebuah.pdf | SLIDE 11","difficulty":"Hard"},{"id":"mls-v2-170","module":"v2","type":"mcq","q":"What is adjournment?","options":["Ending the meeting permanently","A point of order","A motion","Suspending the proceedings temporarily"],"answer":"Suspending the proceedings temporarily","solution":"A: That is dissolution\nB: That concerns procedure\nC: That is a proposed action\nD: The lecture defines adjournment as temporary suspension","source":"LECTURE 7-MEETING AND MINUTES-Nathaniel Yebuah.pdf | SLIDE 15","difficulty":"Hard"},{"id":"mls-v2-171","module":"v2","type":"mcq","q":"Which type of minutes records what was said, including contributions?","options":["Narrative minutes","Resolution minutes","Action minutes","Block minutes"],"answer":"Narrative minutes","solution":"A: The lecture defines narrative minutes as recounting contributions\nB: These record decisions\nC: These record tasks and time frames\nD: That is a format, not a content type","source":"LECTURE 7-MEETING AND MINUTES-Nathaniel Yebuah.pdf | SLIDE 25","difficulty":"Devil Mode"},{"id":"mls-v2-172","module":"v2","type":"mcq","q":"Which tense is generally used in writing minutes?","options":["Present tense","Simple past tense","Future tense","Present perfect only"],"answer":"Simple past tense","solution":"A: Minutes record what happened\nB: The lecture states simple past is generally used\nC: That is not used\nD: That is not the stated convention","source":"LECTURE 7-MEETING AND MINUTES-Nathaniel Yebuah.pdf | SLIDE 46","difficulty":"Medium"},{"id":"mls-v2-173","module":"v2","type":"mcq","q":"What is the abstract or executive summary of a report?","options":["A list of references","A detailed methodology","A letter of transmittal","A brief summary usually a paragraph or page, written in past tense"],"answer":"A brief summary usually a paragraph or page, written in past tense","solution":"A: That comes at the end\nB: That is a later section\nC: That is a separate document\nD: The lecture describes the abstract this way","source":"LECTURE 8-REPORT WRITING-Nathaniel Yebuah.pdf | SLIDE 15","difficulty":"Medium"},{"id":"mls-v2-174","module":"v2","type":"mcq","q":"What is the purpose of a letter of transmittal?","options":["To send the report to the recipient and refer to the problem and authorization","To replace the report","To record meeting decisions","To acknowledge funding"],"answer":"To send the report to the recipient and refer to the problem and authorization","solution":"A: The lecture defines a transmittal letter this way\nB: It accompanies the report\nC: That is minutes\nD: That is not the stated purpose","source":"LECTURE 8-REPORT WRITING-Nathaniel Yebuah.pdf | SLIDE 31","difficulty":"Hard"},{"id":"mls-v2-175","module":"v2","type":"mcq","q":"Which report characteristic means based on facts rather than opinions?","options":["Ambiguous","Factual","Subjective","Vague"],"answer":"Factual","solution":"A: Reports should avoid ambiguity\nB: The lecture lists factual among report characteristics\nC: Reports should be objective\nD: Reports should be precise","source":"LECTURE 8-REPORT WRITING-Nathaniel Yebuah.pdf | SLIDE 12","difficulty":"Hard"},{"id":"mls-v2-176","module":"v2","type":"mcq","q":"Which feature distinguishes a memorandum from a formal letter?","options":["Memos are always longer","Memos use formal headings only","Memos have no salutation and no signature area","Memos are sent outside the organization"],"answer":"Memos have no salutation and no signature area","solution":"A: No such rule exists\nB: Memos have To/From/Date/Subject headings\nC: The lecture states memos are inside correspondence without these elements\nD: They are intra-organizational","source":"LECTURE 9-MEMORANDUM-Nathaniel Yebuah.pdf | SLIDE 3","difficulty":"Devil Mode"},{"id":"mls-v2-177","module":"v2","type":"mcq","q":"What are the four standard parts of a memo?","options":["Heading, opening, body and closing","Address, date, signature and enclosure","Title, abstract, methodology and conclusion","Greeting, subject, body and subscription"],"answer":"Heading, opening, body and closing","solution":"A: The lecture lists these four parts\nB: Those belong to letters\nC: Those belong to reports\nD: Those belong to letters","source":"LECTURE 9-MEMORANDUM-Nathaniel Yebuah.pdf | SLIDE 6","difficulty":"Medium"},{"id":"mls-v2-178","module":"v2","type":"mcq","q":"On what principle does a centrifuge separate substances?","options":["Different boiling points","Different densities in a liquid medium under centrifugal force","Different colours","Different electrical charges only"],"answer":"Different densities in a liquid medium under centrifugal force","solution":"A: That is distillation\nB: The lecture states a centrifuge uses centrifugal force to separate substances of different densities\nC: That is chromatography\nD: Electrophoresis separates by charge","source":"Centrifuge-Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Medium"},{"id":"mls-v2-179","module":"v2","type":"mcq","q":"Why should centrifuge speed be reported in × g rather than rpm?","options":["Because rpm is not measurable","Because × g is always larger","Because RCF depends on rotor radius as well as rotational speed","Because rotors have no radius"],"answer":"Because RCF depends on rotor radius as well as rotational speed","solution":"A: rpm is easily measured\nB: That is not the reason\nC: The review question asks why speeds are reported in × g rather than rpm\nD: Radius is critical to RCF","source":"Centrifuge-Nathaniel Yebuah.pdf | SLIDE 28","difficulty":"Hard"},{"id":"mls-v2-180","module":"v2","type":"mcq","q":"Which rotor type holds tubes at a fixed angle of 25–45 degrees?","options":["Swinging-bucket rotor","Vertical rotor","Microtitre rotor","Fixed-angle rotor"],"answer":"Fixed-angle rotor","solution":"A: That swings to horizontal during rotation\nB: That holds tubes parallel to the axis\nC: That is for plates\nD: The lecture states fixed-angle rotors hold tubes at 25–45° and give a short sedimentation path","source":"Centrifuge-Nathaniel Yebuah.pdf | SLIDE 8","difficulty":"Hard"},{"id":"mls-v2-181","module":"v2","type":"mcq","q":"What is a common cause of excessive vibration in a centrifuge?","options":["Overfilling with water","Imbalance or a loose rotor","Running at low speed","Using a lid interlock"],"answer":"Imbalance or a loose rotor","solution":"A: That is not the listed cause\nB: The troubleshooting table lists imbalance and loose rotor as causes\nC: Low speed does not cause vibration\nD: That is a safety feature","source":"Centrifuge-Nathaniel Yebuah.pdf | SLIDE 13","difficulty":"Devil Mode"},{"id":"mls-v2-182","module":"v2","type":"mcq","q":"What device destroys all microbial life including bacterial endospores using pressurised steam?","options":["An incubator","A centrifuge","An autoclave","A pH meter"],"answer":"An autoclave","solution":"A: Incubators grow organisms\nB: Centrifuges separate by density\nC: The lecture defines an autoclave as a pressurised steam sterilisation device\nD: pH meters measure acidity","source":"Centrifuge-Nathaniel Yebuah.pdf | SLIDE 16","difficulty":"Medium"},{"id":"mls-v2-183","module":"v2","type":"mcq","q":"What temperature range is typical for autoclave sterilisation cycles?","options":["37–42 °C","60–80 °C","160–180 °C","121–134 °C"],"answer":"121–134 °C","solution":"A: That is incubation range\nB: That is pasteurisation range\nC: That is dry heat range\nD: The comparison table lists autoclave temperatures of 121–134 °C","source":"Centrifuge-Nathaniel Yebuah.pdf | SLIDE 26","difficulty":"Medium"},{"id":"mls-v2-184","module":"v2","type":"mcq","q":"In gravity-displacement autoclaves, how is air removed?","options":["Steam displaces air downward and out the drain","By a vacuum pump before heating","By filtration","By centrifugation"],"answer":"Steam displaces air downward and out the drain","solution":"A: The lecture states gravity displacement removes air downward through the drain\nB: That is a pre-vacuum autoclave\nC: That is not the mechanism\nD: That is not the mechanism","source":"Centrifuge-Nathaniel Yebuah.pdf | SLIDE 17","difficulty":"Hard"},{"id":"mls-v2-185","module":"v2","type":"mcq","q":"Which indicators confirm that autoclave cycle parameters were achieved?","options":["Only chemical indicators","Only biological spore tests","Physical gauges and chart recorders","Colour of the door"],"answer":"Physical gauges and chart recorders","solution":"A: Chemical indicators are also used but not exclusively\nB: Biological indicators are used for validation but not alone\nC: The lecture lists physical indicators such as gauges and chart recorders\nD: That is not an indicator","source":"Centrifuge-Nathaniel Yebuah.pdf | SLIDE 20","difficulty":"Hard"},{"id":"mls-v2-186","module":"v2","type":"mcq","q":"What does OQ stand for in autoclave validation?","options":["Operational quality","Over-quality","Operating quota","Operational qualification"],"answer":"Operational qualification","solution":"A: That is not the stated term\nB: That is not a validation term\nC: That is not a validation term\nD: The lecture lists IQ, OQ and PQ for validation","source":"Centrifuge-Nathaniel Yebuah.pdf | SLIDE 25","difficulty":"Devil Mode"},{"id":"mls-v2-187","module":"v2","type":"mcq","q":"Which item can be autoclaved according to the lecture?","options":["Borosilicate glassware","Paper documents","Oils and powders","Electronic instruments"],"answer":"Borosilicate glassware","solution":"A: The lecture lists Pyrex/Duran borosilicate glass as autoclavable\nB: Paper is not suitable\nC: These are not autoclavable\nD: Electronics are damaged","source":"Centrifuge-Nathaniel Yebuah.pdf | SLIDE 21","difficulty":"Medium"},{"id":"mls-v2-188","module":"v2","type":"mcq","q":"What is the main purpose of a laboratory incubator?","options":["To sterilise instruments","To provide controlled temperature and humidity for growing organisms","To separate cells by density","To measure light absorption"],"answer":"To provide controlled temperature and humidity for growing organisms","solution":"A: That is an autoclave\nB: The lecture states incubators maintain specific environmental conditions\nC: That is a centrifuge\nD: That is a spectrophotometer","source":"Incubator-Nathaniel Yebuah.pdf | SLIDE 2","difficulty":"Medium"},{"id":"mls-v2-189","module":"v2","type":"mcq","q":"Which incubator type combines a motor/shaker with temperature control?","options":["A refrigerated incubator","A Peltier incubator","A benchtop incubator","A shaking incubator"],"answer":"A shaking incubator","solution":"A: That adds cooling\nB: That uses thermoelectric control\nC: That is a standard static type\nD: The lecture defines a shaking incubator as a combined shaker and incubator","source":"Incubator-Nathaniel Yebuah.pdf | SLIDE 13","difficulty":"Hard"},{"id":"mls-v2-190","module":"v2","type":"mcq","q":"How does a simple incubator thermostat control temperature?","options":["Using a sensor and pressure can","Using a computer only","Using a fan alone","Using a pH electrode"],"answer":"Using a sensor and pressure can","solution":"A: The lecture states simple incubators use a thermostat consisting of a sensor and pressure can\nB: Computers may control advanced models but not the simple one\nC: A fan alone cannot control temperature\nD: That is not temperature control","source":"Incubator-Nathaniel Yebuah.pdf | SLIDE 15","difficulty":"Hard"},{"id":"mls-v2-191","module":"v2","type":"mcq","q":"What is the main function of a fume hood in the laboratory?","options":["HEPA filtration of biological agents","Negative-pressure containment of chemical vapours","Sterilising instruments","Separating proteins by charge"],"answer":"Negative-pressure containment of chemical vapours","solution":"A: That is the role of a biosafety cabinet\nB: The equipment summary lists fume hoods as negative-pressure containment for chemicals\nC: That is an autoclave\nD: That is electrophoresis","source":"Operation and Design of Laboratory Equipment II-Nathaniel Yebuah.pdf | SLIDE 38","difficulty":"Devil Mode"},{"id":"mls-v2-192","module":"v2","type":"mcq","q":"What is the logarithmic pH scale centred on?","options":["A value of zero as neutral","A value of fourteen as neutral","Seven as neutrality","One as neutral"],"answer":"Seven as neutrality","solution":"A: Zero is strongly acidic\nB: Fourteen is strongly alkaline\nC: The pH meter lecture states pH uses a logarithmic scale with seven as neutral\nD: One is acidic","source":"pH Meter-Nathaniel Yebuah.pdf | SLIDE 2","difficulty":"Medium"},{"id":"mls-v2-193","module":"v2","type":"mcq","q":"What does a pH meter measure?","options":["Hydrogen-ion activity in water-based solutions","Oxygen concentration","Light absorption","Centrifugal force"],"answer":"Hydrogen-ion activity in water-based solutions","solution":"A: The lecture states a pH meter monitors hydrogen-ion activity\nB: That is an oxygen electrode\nC: That is a spectrophotometer\nD: That is a centrifuge","source":"pH Meter-Nathaniel Yebuah.pdf | SLIDE 3","difficulty":"Medium"},{"id":"mls-v2-194","module":"v2","type":"mcq","q":"Which electrode in a pH meter provides a fixed reference potential?","options":["The glass measuring electrode","The reference electrode","The temperature probe","The salt bridge alone"],"answer":"The reference electrode","solution":"A: That responds to H⁺\nB: The lecture lists reference and measuring electrodes and states the reference electrode does not lose ions\nC: That compensates temperature\nD: That is part of the reference system","source":"pH Meter-Nathaniel Yebuah.pdf | SLIDE 10","difficulty":"Hard"},{"id":"mls-v2-195","module":"v2","type":"mcq","q":"Why must a pH meter be calibrated before use?","options":["To make the electrode glow","To sterilize the probe","To guarantee the quality and accuracy of readings","To increase the sample volume"],"answer":"To guarantee the quality and accuracy of readings","solution":"A: That is not calibration\nB: Calibration is not sterilization\nC: The lecture states calibration ensures quality and accuracy\nD: Calibration does not change volume","source":"pH Meter-Nathaniel Yebuah.pdf | SLIDE 13","difficulty":"Hard"},{"id":"mls-v2-196","module":"v2","type":"mcq","q":"Which solution is commonly held inside a combined pH electrode body?","options":["Sodium hydroxide","Glucose solution","Distilled water alone","Saturated potassium chloride (KCl)"],"answer":"Saturated potassium chloride (KCl)","solution":"A: That would be highly alkaline\nB: That is not used\nC: That would not provide a reference\nD: The lecture states the electrode body contains saturated KCl","source":"pH Meter-Nathaniel Yebuah.pdf | SLIDE 9","difficulty":"Devil Mode"},{"id":"mls-v2-197","module":"v2","type":"mcq","q":"What is a common cause of unstable pH readings?","options":["Too much sample volume","Air bubbles in the electrode","A new electrode","Using distilled water to rinse"],"answer":"Air bubbles in the electrode","solution":"A: That is not the listed cause\nB: The troubleshooting table lists air bubbles as a cause\nC: A new electrode should work\nD: Rinsing with distilled water is recommended","source":"pH Meter-Nathaniel Yebuah.pdf | SLIDE 18","difficulty":"Medium"},{"id":"mls-v2-198","module":"v2","type":"mcq","q":"Which type of equipment provides protection by HEPA filtration in the laboratory?","options":["A fume hood","A centrifuge","A biosafety cabinet","A spectrophotometer"],"answer":"A biosafety cabinet","solution":"A: Fume hoods use negative pressure for chemicals\nB: Centrifuges do not filter air\nC: The instrumentation summary contrasts BSC with fume hoods and notes HEPA filtration\nD: That measures light","source":"Operation and Design of Laboratory Equipment II-Nathaniel Yebuah.pdf | SLIDE 38","difficulty":"Medium"},{"id":"mls-v2-199","module":"v2","type":"mcq","q":"What is resolution in microscopy?","options":["A measure of image brightness","The ratio of image size to object size","The thickness of the coverslip","The minimum distance between two points that can still be distinguished as separate"],"answer":"The minimum distance between two points that can still be distinguished as separate","solution":"A: That is illumination\nB: That is magnification\nC: That is a sample-preparation parameter\nD: The lecture defines resolution as the ability to distinguish fine detail","source":"Principle of microscopy- Nathaniel Yebuah.pdf | SLIDE 54","difficulty":"Hard"},{"id":"mls-v2-200","module":"v2","type":"mcq","q":"How is total magnification of a compound microscope calculated?","options":["Objective magnification multiplied by eyepiece magnification","Objective magnification divided by eyepiece magnification","The sum of the two magnifications","The objective magnification alone"],"answer":"Objective magnification multiplied by eyepiece magnification","solution":"A: The lecture states total magnification is the product of ocular and objective powers\nB: That is not the formula\nC: Magnifications multiply, not add\nD: The eyepiece also magnifies","source":"Principle of microscopy- Nathaniel Yebuah.pdf | SLIDE 30","difficulty":"Hard"},{"id":"mls-v2-201","module":"v2","type":"mcq","q":"Why is immersion oil used with the 100× objective?","options":["To cool the objective lens","To make the specimen stick to the slide","Its refractive index matches glass and preserves resolution","To increase the working distance"],"answer":"Its refractive index matches glass and preserves resolution","solution":"A: Oil is not a coolant\nB: That is not its purpose\nC: The lecture states oil immersion is a cornerstone of high-resolution microscopy\nD: Oil reduces light loss, not working distance","source":"Principle of microscopy- Nathaniel Yebuah.pdf | SLIDE 19","difficulty":"Devil Mode"},{"id":"mls-v2-202","module":"v2","type":"mcq","q":"What is the standard cover-glass thickness assumed by most objectives?","options":["0.017 mm","1.7 mm","0.5 mm","0.17 mm"],"answer":"0.17 mm","solution":"A: That is far too thin\nB: That is far too thick\nC: That is not the standard\nD: The lecture states the standard coverslip thickness is 0.17 mm","source":"Principle of microscopy- Nathaniel Yebuah.pdf | SLIDE 27","difficulty":"Medium"},{"id":"mls-v2-203","module":"v2","type":"mcq","q":"Which microscope specification means a specimen stays approximately in focus when objectives are changed?","options":["Parfocal objectives","The objective has the highest numerical aperture","The lens is made of optical glass","The stage will not move"],"answer":"Parfocal objectives","solution":"A: The lecture defines parfocal as maintaining approximate focus\nB: That is not the definition\nC: That is not the definition\nD: Stage movement is independent","source":"Principle of microscopy- Nathaniel Yebuah.pdf | SLIDE 52","difficulty":"Medium"},{"id":"mls-v2-204","module":"v2","type":"mcq","q":"What is the definition of numerical aperture?","options":["A measure of magnification power","A measure of an objective's ability to gather light and resolve fine detail","The ratio of lamp power to lens size","The distance from lens to specimen"],"answer":"A measure of an objective's ability to gather light and resolve fine detail","solution":"A: NA is not magnification\nB: The lecture defines NA in these terms\nC: That is not NA\nD: That is working distance","source":"Principle of microscopy- Nathaniel Yebuah.pdf | SLIDE 55","difficulty":"Hard"},{"id":"mls-v2-205","module":"v2","type":"mcq","q":"Which illumination method provides optimum contrast and even lighting?","options":["Critical illumination","Dark-field illumination","Phase-contrast illumination","Köhler illumination"],"answer":"Köhler illumination","solution":"A: That is a different method\nB: That is for unstained specimens\nC: That is for live cells\nD: The lecture describes Köhler illumination as a critical alignment process","source":"Principle of microscopy- Nathaniel Yebuah.pdf | SLIDE 42","difficulty":"Hard"},{"id":"mls-v2-206","module":"v2","type":"mcq","q":"Which microscope component concentrates light onto the specimen from below the stage?","options":["The condenser lens","The eyepiece","The objective","The illuminator bulb"],"answer":"The condenser lens","solution":"A: The lecture states the condenser is under the stage and fills the back of the objective\nB: That is the viewing lens\nC: That forms the primary image\nD: That is the light source, not the condenser","source":"Principle of microscopy- Nathaniel Yebuah.pdf | SLIDE 33","difficulty":"Devil Mode"},{"id":"mls-v2-207","module":"v2","type":"mcq","q":"Which part of a compound microscope supports the instrument and houses the illuminator?","options":["The arm","The base","The nosepiece","The stage"],"answer":"The base","solution":"A: The arm supports the optical components\nB: The lecture states the base supports and stabilizes the microscope\nC: That holds objectives\nD: That holds the specimen","source":"Principle of microscopy- Nathaniel Yebuah.pdf | SLIDE 37","difficulty":"Medium"},{"id":"mls-v2-208","module":"v2","type":"mcq","q":"What should be done first when troubleshooting a microscope whose light fails to turn on?","options":["Replace the objective lens","Clean the condenser","Check the AC power cord and outlet","Adjust the diopter"],"answer":"Check the AC power cord and outlet","solution":"A: That is unrelated\nB: That affects image quality\nC: The troubleshooting table lists these as first causes\nD: That affects focus for one eye","source":"The Light Microscopes-Nathaniel Yebuah.pdf | SLIDE 17","difficulty":"Medium"},{"id":"mls-v2-209","module":"v2","type":"mcq","q":"On which law is spectrophotometry based?","options":["The Beer-Lambert law","Ohm's law","Poiseuille's law","Snell's law"],"answer":"The Beer-Lambert law","solution":"A: The lecture states the principle of operation is based on Beer-Lambert law\nB: That concerns electricity\nC: That concerns fluid flow\nD: That concerns refraction","source":"Spectrophotometer-Nathaniel Yebuah.pdf | SLIDE 7","difficulty":"Hard"},{"id":"mls-v2-210","module":"v2","type":"mcq","q":"Which device in a spectrophotometer selects a particular wavelength of light?","options":["The detector","The monochromator","The cuvette","The lamp alone"],"answer":"The monochromator","solution":"A: That measures transmitted light\nB: The lecture states the optical system includes a monochromator\nC: That holds the sample\nD: The lamp produces broad light","source":"Spectrophotometer-Nathaniel Yebuah.pdf | SLIDE 16","difficulty":"Hard"},{"id":"mls-v2-211","module":"v2","type":"mcq","q":"Where is the sample solution placed in a spectrophotometer?","options":["In the monochromator","In the lamp housing","In a cuvette","In the detector"],"answer":"In a cuvette","solution":"A: That selects wavelengths\nB: That holds the source\nC: The lecture states the sample is placed in a cuvette before the detector\nD: That measures light","source":"Spectrophotometer-Nathaniel Yebuah.pdf | SLIDE 17","difficulty":"Devil Mode"},{"id":"mls-v2-212","module":"v2","type":"mcq","q":"What is the difference between single-beam and double-beam spectrophotometers?","options":["Single-beam instruments cannot measure absorbance","Double-beam instruments have two lamps only","Single-beam instruments are always more accurate","A double-beam instrument splits light into sample and reference paths"],"answer":"A double-beam instrument splits light into sample and reference paths","solution":"A: They can, with calibration\nB: The distinction is beam paths, not lamp count\nC: That is not stated\nD: The lecture distinguishes these two major classes","source":"Spectrophotometer-Nathaniel Yebuah.pdf | SLIDE 11","difficulty":"Medium"},{"id":"mls-v2-213","module":"v2","type":"mcq","q":"For how long should a spectrophotometer be turned on before use?","options":["1 minute","10 to 15 minutes","2 hours","No warm-up is needed"],"answer":"10 to 15 minutes","solution":"A: That is too short for stable lamps\nB: The preventive maintenance slide states warm-up of 10–15 minutes\nC: That is unnecessarily long\nD: Lamps need stabilization","source":"Spectrophotometer-Nathaniel Yebuah.pdf | SLIDE 24","difficulty":"Medium"},{"id":"mls-v2-214","module":"v2","type":"mcq","q":"Which instrument separates DNA fragments by size using an electric field?","options":["PCR machine","Centrifuge","Gel electrophoresis apparatus","Spectrophotometer"],"answer":"Gel electrophoresis apparatus","solution":"A: PCR amplifies DNA\nB: Centrifuge separates by density\nC: The instrumentation slides describe gel electrophoresis\nD: That measures absorbance","source":"Intro to lab instrumentation-Nathaniel Yebuah.pdf | SLIDE 14","difficulty":"Hard"},{"id":"mls-v2-215","module":"v2","type":"mcq","q":"What is ethidium bromide in gel electrophoresis?","options":["A DNA polymerase","A buffer salt","A DNA ladder","An intercalating dye that binds DNA and is a potent mutagen"],"answer":"An intercalating dye that binds DNA and is a potent mutagen","solution":"A: That is an enzyme\nB: That maintains pH\nC: That is a size marker\nD: The lecture lists EtBr as an intercalating agent and mutagen","source":"Intro to lab instrumentation-Nathaniel Yebuah.pdf | SLIDE 14","difficulty":"Hard"},{"id":"mls-v2-216","module":"v2","type":"mcq","q":"Which component of a PCR machine provides rapid heating and cooling?","options":["The Peltier element in the thermal block","The heated lid alone","A UV lamp","A centrifuge rotor"],"answer":"The Peltier element in the thermal block","solution":"A: The lecture states Peltier elements heat and cool the block\nB: The lid prevents evaporation\nC: That is for visualization\nD: That is not part of PCR","source":"Intro to lab instrumentation-Nathaniel Yebuah.pdf | SLIDE 17","difficulty":"Devil Mode"},{"id":"mls-v2-217","module":"v2","type":"mcq","q":"What temperature is used for the initial denaturation step in PCR?","options":["37 °C","72 °C","94–98 °C","4 °C"],"answer":"94–98 °C","solution":"A: That is an annealing temperature for some reactions\nB: That is extension\nC: The thermal cycling table lists 94–98 °C for initial denaturation\nD: That is storage","source":"Intro to lab instrumentation-Nathaniel Yebuah.pdf | SLIDE 19","difficulty":"Medium"},{"id":"mls-v2-218","module":"v2","type":"mcq","q":"Which laboratory storage area should be kept at 2–8 °C?","options":["A freezer at −20 °C","An incubator at 37 °C","An autoclave chamber","A laboratory refrigerator"],"answer":"A laboratory refrigerator","solution":"A: That is a different range\nB: That is for growth\nC: That is for sterilization\nD: The cold-storage table lists 2–8 °C for reagents","source":"Intro to lab instrumentation-Nathaniel Yebuah.pdf | SLIDE 25","difficulty":"Medium"},{"id":"mls-v2-219","module":"v2","type":"mcq","q":"What is the purpose of the DOIT troubleshooting framework?","options":["To systematically describe, observe, investigate and test instrument problems","A calibration protocol","A sterilization cycle","A statistical test"],"answer":"To systematically describe, observe, investigate and test instrument problems","solution":"A: The lecture lists DOIT as a troubleshooting framework\nB: That is different\nC: That is autoclave\nD: That is different","source":"Intro to lab instrumentation-Nathaniel Yebuah.pdf | SLIDE 37","difficulty":"Hard"},{"id":"mls-v2-220","module":"v2","type":"mcq","q":"Which practice reduces the risk of aerosol generation in the laboratory?","options":["Centrifuging with sealed rotors","Avoiding vortexing of open tubes","Working slowly","Using larger tubes"],"answer":"Avoiding vortexing of open tubes","solution":"A: That is safer but the listed high-risk item is vortexing\nB: The lecture lists vortexing of open tubes among highest-risk aerosol procedures\nC: Speed alone does not eliminate aerosols\nD: Tube size is not the key factor","source":"Intro to lab instrumentation-Nathaniel Yebuah.pdf | SLIDE 34","difficulty":"Hard"},{"id":"mls-v2-221","module":"v2","type":"mcq","q":"Which two major systems regulate all physiological activities of the body?","options":["Digestive and respiratory systems","Muscular and skeletal systems","Cardiovascular and renal systems","Nervous and endocrine systems"],"answer":"Nervous and endocrine systems","solution":"A: Those are organ systems but not the two control systems\nB: These are effectors\nC: These are target systems\nD: The endocrine lecture states these are the two major control systems","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 3","difficulty":"Devil Mode"},{"id":"mls-v2-222","module":"v2","type":"mcq","q":"What distinguishes a hormone acting autocrinely from one acting paracrinely?","options":["Autocrine acts on the same cell; paracrine acts on nearby cells","Autocrine acts on distant cells","Paracrine acts only in the blood","Both act only on glands"],"answer":"Autocrine acts on the same cell; paracrine acts on nearby cells","solution":"A: The lecture classifies messengers by the distance and relationship to target cells\nB: That is endocrine\nC: That is endocrine\nD: That is not the distinction","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 8","difficulty":"Medium"},{"id":"mls-v2-223","module":"v2","type":"mcq","q":"Which chemical messenger class is released into the bloodstream to reach distant target cells?","options":["Autocrine","Endocrine","Paracrine","Neurotransmitter"],"answer":"Endocrine","solution":"A: Autocrine messengers act on the same
