glucose and blood pressure\nC: Glucose concentration is a key internal variable\nD: Osmoregulation maintains water balance","source":"Lecture 9-Homeostasis-Nathaniel Yebuah.pdf | SLIDE 6","difficulty":"Medium"},{"id":"mls-v1-112","module":"v1","type":"mcq","q":"What is the smallest unit capable of life according to the cell lecture?","options":["An atom","A molecule","A cell","A tissue"],"answer":"A cell","solution":"A: Atoms are Chemical building blocks but are not alive\nB: Molecules are not independently living\nC: The slide defines a cell as the smallest unit capable of carrying out life processes\nD: Tissues are made of cells and are higher in organization","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 25","difficulty":"Medium"},{"id":"mls-v1-113","module":"v1","type":"mcq","q":"Who discovered and named the cell in 1665?","options":["Robert Hooke","Antony van Leeuwenhoek","Matthias Schleiden","Rudolf Virchow"],"answer":"Robert Hooke","solution":"A: The lecture states Hooke discovered and named cells after observing cork\nB: Leeuwenhoek observed living cells later with improved lenses\nC: Schleiden contributed to cell theory in plants\nD: Virchow concluded that cells arise from pre-existing cells","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 26","difficulty":"Hard"},{"id":"mls-v1-114","module":"v1","type":"mcq","q":"Which scientist is credited with constructing the first compound microscope in 1595?","options":["Robert Hooke","Zacharias Janssen","Antony van Leeuwenhoek","Kary Mullis"],"answer":"Zacharias Janssen","solution":"A: Hooke used a compound microscope but did not build the first\nB: The milestone slide credits Janssen with the first compound microscope\nC: Leeuwenhoek made high-quality single-lens microscopes\nD: Mullis developed PCR in 1983","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 32","difficulty":"Hard"},{"id":"mls-v1-115","module":"v1","type":"mcq","q":"Who isolated 'nuclein' (DNA) from cell nuclei in 1869?","options":["Camillo Golgi","James Watson","Friedrich Miescher","Kary Mullis"],"answer":"Friedrich Miescher","solution":"A: Golgi identified the Golgi apparatus in 1898\nB: Watson described the DNA double helix in 1953\nC: The milestones slide credits Miescher with isolating nuclein in 1869\nD: Mullis developed PCR in 1983","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 33","difficulty":"Devil Mode"},{"id":"mls-v1-116","module":"v1","type":"mcq","q":"Which three scientists are usually credited with developing cell theory?","options":["Hooke, Leeuwenhoek and Janssen","Watson, Crick and Franklin","Miescher, Golgi and Mullis","Schleiden, Schwann and Virchow"],"answer":"Schleiden, Schwann and Virchow","solution":"A: These pioneers built early microscopes and observed cells but did not formulate cell theory\nB: These scientists worked on DNA structure\nC: These made other cell-biology contributions\nD: The lecture names these three as the founders of classical cell theory","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 36","difficulty":"Medium"},{"id":"mls-v1-117","module":"v1","type":"mcq","q":"What key conclusion did Rudolf Virchow add to cell theory in 1855?","options":["All living things are made of cells","All cells come from pre-existing cells","Cells are the smallest working units","Cells contain nuclei"],"answer":"All cells come from pre-existing cells","solution":"A: That was established by Schleiden and Schwann\nB: The slide states Virchow concluded cells arise from pre-existing cells, completing classical cell theory\nC: That was part of the earlier cell theory\nD: That is not Virchow's contribution","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 37","difficulty":"Medium"},{"id":"mls-v1-118","module":"v1","type":"mcq","q":"Which organelle is described as the control centre of the cell and contains DNA?","options":["The ribosome","The lysosome","The nucleus","The peroxisome"],"answer":"The nucleus","solution":"A: Ribosomes synthesize proteins\nB: Lysosomes digest macromolecules\nC: The lecture lists the nucleus as the control centre containing DNA and mRNA\nD: Peroxisomes oxidize fatty acids and detoxify alcohol","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 59","difficulty":"Hard"},{"id":"mls-v1-119","module":"v1","type":"mcq","q":"What is the region of the nucleus where ribosomal subunits are assembled?","options":["The nuclear pore","The chromatin","The perinuclear space","The nucleolus"],"answer":"The nucleolus","solution":"A: Pores regulate traffic across the nuclear envelope\nB: Chromatin is DNA plus protein\nC: That is the space between the two nuclear membranes\nD: The lecture states the nucleolus makes ribosomal subunits from proteins and rRNA","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 58","difficulty":"Hard"},{"id":"mls-v1-120","module":"v1","type":"mcq","q":"What is the approximate composition of eukaryotic chromosomes by mass?","options":["About one-third DNA and two-thirds protein","Half DNA and half RNA","All DNA with no protein","Mostly lipid with some DNA"],"answer":"About one-third DNA and two-thirds protein","solution":"A: The lecture states chromosomes consist of roughly one third DNA and two thirds protein\nB: RNA is not the main chromosomal component\nC: Chromosomes are DNA-protein complexes\nD: Lipids are not a major chromosome constituent","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 69","difficulty":"Devil Mode"},{"id":"mls-v1-121","module":"v1","type":"mcq","q":"Which structure is a double membrane perforated by pores that regulate movement in and out of the nucleus?","options":["The plasma membrane","The endomembrane system","The nuclear envelope","The cell wall"],"answer":"The nuclear envelope","solution":"A: That surrounds the whole cell, not the nucleus\nB: That is a wider network of membranes\nC: The lecture describes a double membrane with nuclear pores surrounded by an octagonal annulus\nD: That is an external rigid layer in plants","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 71","difficulty":"Medium"},{"id":"mls-v1-122","module":"v1","type":"mcq","q":"What is the function of ribosomes?","options":["Photosynthesis","DNA replication","Lipid storage","Protein synthesis"],"answer":"Protein synthesis","solution":"A: That occurs in chloroplasts\nB: Replication occurs in the nucleus\nC: That is a function of adipose tissue\nD: Ribosomes are composed of rRNA and protein and carry out translation","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 79","difficulty":"Medium"},{"id":"mls-v1-123","module":"v1","type":"mcq","q":"Which set of organelles constitutes the endomembrane system?","options":["Membranes and organelles that modify, package and transport materials","Mitochondria and chloroplasts only","Nucleus, ribosomes and centrioles only","Only the plasma membrane"],"answer":"Membranes and organelles that modify, package and transport materials","solution":"A: The lecture defines the endomembrane system as a group of membranes working together in protein traffic\nB: These are not part of the endomembrane system\nC: Ribosomes lack membranes and are not included\nD: The system includes internalmembranes as well","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 85","difficulty":"Hard"},{"id":"mls-v1-124","module":"v1","type":"mcq","q":"Which organelle is studded with ribosomes and involved in protein synthesis?","options":["Smooth endoplasmic reticulum","Rough endoplasmic reticulum","Golgi apparatus","Lysosome"],"answer":"Rough endoplasmic reticulum","solution":"A: Smooth ER lacks ribosomes\nB: The ER is a network of membranes; the rough type bears ribosomes\nC: The Golgi modifies and packages proteins\nD: Lysosomes digest material","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 86","difficulty":"Hard"},{"id":"mls-v1-125","module":"v1","type":"mcq","q":"Which organelle packages materials into vesicles and produces lysosomes?","options":["The mitochondrion","The ribosome","The centriole","The Golgi apparatus"],"answer":"The Golgi apparatus","solution":"A: Mitochondria generate ATP\nB: Ribosomes make proteins\nC: Centrioles organize microtubules\nD: The lecture states the Golgi synthesizes and packages materials for transport and produces lysosomes","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 88","difficulty":"Devil Mode"},{"id":"mls-v1-126","module":"v1","type":"mcq","q":"How many hydrolytic enzymes do lysosomes contain according to the lecture?","options":["About 60","About 6","About 600","About 16"],"answer":"About 60","solution":"A: The slide states lysosomes contain about 60 hydrolytic enzymes\nB: Lysosomes contain many more than six enzymes\nC: That is far higher than the stated number\nD: That is too few","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 110","difficulty":"Medium"},{"id":"mls-v1-127","module":"v1","type":"mcq","q":"What internal pH do lysosomes maintain to activate their enzymes?","options":["About 7.0","About 5.0","About 9.0","About 2.0"],"answer":"About 5.0","solution":"A: Neutral pH would not activate the acid hydrolases\nB: A proton pump (H⁺-ATPase) acidifies the lysosome to about pH 5\nC: That is alkaline and would inactivate lysosomal enzymes\nD: That is more acidic than the stated value","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 111","difficulty":"Medium"},{"id":"mls-v1-128","module":"v1","type":"mcq","q":"Which disease is associated with a heterozygous deficiency in the short arm of chromosome 5?","options":["Tay-Sachs disease","Silicosis","Cri-du-cat syndrome","Marfan syndrome"],"answer":"Cri-du-cat syndrome","solution":"A: Tay-Sachs involves hexosaminidase A deficiency\nB: Silicosis results from inhaling silica dust\nC: The lecture links cri-du-cat to a deletion in the short arm of chromosome 5\nD: Marfan involves connective tissue defects","source":"Module 6-VARIATIONS IN CHROMOSOME NUMBER-Nathaniel Yebuah.pdf | SLIDE 34","difficulty":"Hard"},{"id":"mls-v1-129","module":"v1","type":"mcq","q":"Which enzyme set is characteristic of peroxisomes?","options":["Urate oxidase, D-amino acid oxidase and catalase","DNA polymerase, ligase and helicase","Hexokinase, phosphofructokinase and pyruvate kinase","Amylase, lipase and protease"],"answer":"Urate oxidase, D-amino acid oxidase and catalase","solution":"A: The lecture lists these enzymes in peroxisomes\nB: Those are nuclear replication enzymes\nC: Those are glycolytic enzymes\nD: Those are digestive enzymes","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 105","difficulty":"Hard"},{"id":"mls-v1-130","module":"v1","type":"mcq","q":"What is a glyoxysome?","options":["A plant mitochondrion","A specialized peroxisome in plant cells containing glyoxylate cycle enzymes","A bacterial cell wall layer","A storage vacuole"],"answer":"A specialized peroxisome in plant cells containing glyoxylate cycle enzymes","solution":"A: Mitochondria carry out respiration, not the glyoxylate cycle\nB: The lecture describes glyoxysomes as plant microbodies where the glyoxylate cycle is prominent\nC: Glyoxysomes are eukaryotic organelles\nD: Vacuoles store materials","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 106","difficulty":"Devil Mode"},{"id":"mls-v1-131","module":"v1","type":"mcq","q":"Which cellular organelle is found in some anaerobic eukaryotic cells and is membrane-enclosed?","options":["Peroxisome","Chloroplast","Hydrogenosome","Nucleolus"],"answer":"Hydrogenosome","solution":"A: Peroxisomes occur broadly in aerobic cells\nB: Chloroplasts carry out photosynthesis\nC: The lecture defines the hydrogenosome in anaerobic ciliates and other eukaryotes\nD: The nucleolus is a nuclear region, not a separate organelle","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 108","difficulty":"Medium"},{"id":"mls-v1-132","module":"v1","type":"mcq","q":"What is the endosymbiont theory as presented in the cell lecture?","options":["A theory that all cells arise from pre-existing cells","A theory that DNA is double helical","A theory of enzyme induction","Mitochondria and chloroplasts share a similar evolutionary origin"],"answer":"Mitochondria and chloroplasts share a similar evolutionary origin","solution":"A: That is Virchow's contribution\nB: That is Watson and Crick's model\nC: That relates to gene regulation\nD: The lecture states mitochondria and chloroplasts share a similar origin","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 100","difficulty":"Medium"},{"id":"mls-v1-133","module":"v1","type":"mcq","q":"Which structure is found in plant cells but not animal cells?","options":["Mitochondrion","Central vacuole","Nucleus","Ribosome"],"answer":"Central vacuole","solution":"A: Mitochondria are present in both plant and animal cells\nB: The plant-versus-animal comparison lists central vacuoles as plant-only\nC: Both plant and animal cells have nuclei\nD: Both cell types have ribosomes","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 94","difficulty":"Hard"},{"id":"mls-v1-134","module":"v1","type":"mcq","q":"What is the bacterial chromosome?","options":["Several linear chromosomes enclosed in a nucleus","RNA enclosed in a protein coat","A single circular strand of DNA","A plasmid-only genome"],"answer":"A single circular strand of DNA","solution":"A: That describes eukaryotes\nB: That describes a virus\nC: The lecture states bacteria have a single circular DNA chromosome\nD: Plasmids are additional small DNA molecules","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 133","difficulty":"Hard"},{"id":"mls-v1-135","module":"v1","type":"mcq","q":"What is the glycocalyx of a bacterium?","options":["A layer of peptidoglycan only","The bacterial DNA","The flagellar motor","A polysaccharide or protein coating that protects the cell"],"answer":"A polysaccharide or protein coating that protects the cell","solution":"A: Peptidoglycan is the cell wall, not the glycocalyx\nB: That is the chromosome\nC: That is involved in motility\nD: The lecture defines the glycocalyx as a protective coating","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 136","difficulty":"Devil Mode"},{"id":"mls-v1-136","module":"v1","type":"mcq","q":"How do many pathogenic bacteria use their glycocalyx?","options":["To protect themselves against phagocytes","To increase their rate of mutation","To synthesize ATP","To perform photosynthesis"],"answer":"To protect themselves against phagocytes","solution":"A: The lecture notes pathogenic bacteria use glycocalyces to resist phagocytosis\nB: Glycocalyx does not affect mutation rate\nC: That is the role of membranes\nD: That is not a glycocalyx function","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 137","difficulty":"Medium"},{"id":"mls-v1-137","module":"v1","type":"mcq","q":"What is a bacterial endospore?","options":["A reproductive spore that increases cell numbers","A viral particle","A dormant, tough, non-reproductive resistant stage","A type of plasmid"],"answer":"A dormant, tough, non-reproductive resistant stage","solution":"A: One cell forms one endospore, so it is not reproductive\nB: Endospores are bacterial structures\nC: The lecture describes endospores as extremely resistant dormant structures\nD: Plasmids are DNA molecules","source":"BIOL 151--The Cell as a BasiC Unit and Bacterial cell-Nathaniel Yebuahpdf | SLIDE 139","difficulty":"Medium"},{"id":"mls-v1-138","module":"v1","type":"mcq","q":"What is the smallest object the unaided human eye can distinguish according to the microscopy lecture?","options":["1 nm","10 µm","1 mm","0.1 mm (100 µm)"],"answer":"0.1 mm (100 µm)","solution":"A: That requires electron microscopy\nB: That requires a light microscope\nC: The unaided eye can resolve much smaller than 1 mm\nD: The slide states the unaided eye resolves objects as small as 0.1 mm","source":"BIOL 151-Microscopy and Staining Techniques-Nathaniel Yebuah.pdf | SLIDE 2","difficulty":"Hard"},{"id":"mls-v1-139","module":"v1","type":"mcq","q":"Which microscope uses only a single lens to magnify an object?","options":["A simple microscope","A compound microscope","An electron microscope","A stereo microscope"],"answer":"A simple microscope","solution":"A: The lecture defines a simple microscope as having one lens and gives loupes as examples\nB: Compound microscopes use a series of lenses\nC: Electron microscopes use electromagnetic lenses\nD: Stereo microscopes use paired optical paths","source":"BIOL 151-Microscopy and Staining Techniques-Nathaniel Yebuah.pdf | SLIDE 14","difficulty":"Hard"},{"id":"mls-v1-140","module":"v1","type":"mcq","q":"Which optical defect arises because light rays through a lens fail to converge at a single point?","options":["Chromatic aberration","Spherical aberration","Astigmatism in the eye","Diffraction of light"],"answer":"Spherical aberration","solution":"A: Chromatic aberration arises from wavelength-dependent focal length\nB: The lecture describes spherical aberration as rays failing to converge\nC: That is an ocular refractive error\nD: Diffraction sets the resolution limit, not a lens aberration","source":"BIOL 151-Microscopy and Staining Techniques-Nathaniel Yebuah.pdf | SLIDE 19","difficulty":"Devil Mode"},{"id":"mls-v1-141","module":"v1","type":"mcq","q":"What causes chromatic aberration in a simple lens?","options":["The spherical shape of the lens","Insufficient illumination","The numerical aperture of the objective","Dispersion of glass, so focal length varies with wavelength"],"answer":"Dispersion of glass, so focal length varies with wavelength","solution":"A: That causes spherical aberration\nB: That affects brightness, not colour fringing\nC: NA affects resolution, not chromatic aberration\nD: The lecture states chromatic aberration results from dispersion of the lens material","source":"BIOL 151-Microscopy and Staining Techniques-Nathaniel Yebuah.pdf | SLIDE 25","difficulty":"Medium"},{"id":"mls-v1-142","module":"v1","type":"mcq","q":"How is chromatic aberration partially corrected in an achromatic doublet?","options":["By bonding two materials with differing dispersion","By coating the lens periphery with opaque material","By increasing the magnification","By using a higher numerical aperture"],"answer":"By bonding two materials with differing dispersion","solution":"A: The slides describe an achromatic doublet made from two glasses with different dispersion\nB: That reduces spherical aberration\nC: Magnification does not correct dispersion\nD: NA cannot remove chromatic aberration","source":"BIOL 151-Microscopy and Staining Techniques-Nathaniel Yebuah.pdf | SLIDE 44","difficulty":"Medium"},{"id":"mls-v1-143","module":"v1","type":"mcq","q":"What are the two independent functions of microscopy stated in the lecture?","options":["Magnification and illumination","Magnification and improved resolution","Resolution and staining","Contrast and colour"],"answer":"Magnification and improved resolution","solution":"A: Illumination supports imaging but is not listed as the independent function\nB: The slides state microscopy serves enlargement and improved detail\nC: Staining is a preparation technique\nD: Colour is not the primary function","source":"BIOL 151-Microscopy and Staining Techniques-Nathaniel Yebuah.pdf | SLIDE 68","difficulty":"Hard"},{"id":"mls-v1-144","module":"v1","type":"mcq","q":"Why do microbiologists depend more on resolution than on magnification?","options":["Magnification has no effect on image size","Resolution is the same as magnification","Resolution allows distinction between different microbes or their parts","Higher magnification always improves resolution"],"answer":"Resolution allows distinction between different microbes or their parts","solution":"A: Magnification does enlarge the image\nB: They are distinct optical properties\nC: The lecture states microbiologists depend on resolution to see fine differences\nD: Empty magnification can occur without more detail","source":"BIOL 151-Microscopy and Staining Techniques-Nathaniel Yebuah.pdf | SLIDE 80","difficulty":"Hard"},{"id":"mls-v1-145","module":"v1","type":"mcq","q":"What does 'parfocal' mean for microscope objectives?","options":["Objectives remain in focus when changed","The objective has the highest magnification","The lens is corrected for colour","The objective has a longer working distance"],"answer":"Objectives remain in focus when changed","solution":"A: The lecture defines parfocal objectives as needing minimal or no refocusing\nB: Parfocal does not refer to power\nC: That is achromatic\nD: That is a separate property","source":"BIOL 151-Microscopy and Staining Techniques-Nathaniel Yebuah.pdf | SLIDE 75","difficulty":"Devil Mode"},{"id":"mls-v1-146","module":"v1","type":"mcq","q":"What is the working distance of a microscope objective?","options":["The distance between eyepiece and eye","The distance between the objective lens and the specimen","The distance between condenser and lamp","The thickness of the coverslip"],"answer":"The distance between the objective lens and the specimen","solution":"A: That is eye relief\nB: The slide defines working distance in exactly this way\nC: That is illumination geometry\nD: Coverslip thickness is a separate specification","source":"BIOL 151-Microscopy and Staining Techniques-Nathaniel Yebuah.pdf | SLIDE 73","difficulty":"Medium"},{"id":"mls-v1-147","module":"v1","type":"mcq","q":"Write the resolution formula given in the microscopy lecture.","options":["r = NA / (0.61 λ)","r = 0.61 NA / λ","r = 0.61 λ / NA","r = 2 λ NA"],"answer":"r = 0.61 λ / NA","solution":"A: This inverts the formula\nB: This would give larger resolution for larger NA, which is wrong\nC: The slide gives this limit of resolution formula using wavelength and numerical aperture\nD: This is not the Abbe/Rayleigh resolution expression","source":"BIOL 151-Microscopy and Staining Techniques-Nathaniel Yebuah.pdf | SLIDE 107","difficulty":"Medium"},{"id":"mls-v1-148","module":"v1","type":"mcq","q":"How does increasing numerical aperture affect resolution?","options":["It increases r, worsening resolution","It has no effect on resolution","It only affects brightness","It lowers r, improving resolution"],"answer":"It lowers r, improving resolution","solution":"A: The formula r = 0.61λ/NA shows the opposite\nB: NA is a key determinant of resolving power\nC: NA affects both brightness and resolution\nD: A larger NA gathers more light and resolves finer detail, as stated in the NA slides","source":"BIOL 151-Microscopy and Staining Techniques-Nathaniel Yebuah.pdf | SLIDE 100","difficulty":"Hard"},{"id":"mls-v1-149","module":"v1","type":"mcq","q":"In bright-field microscopy, what is required to see a specimen well?","options":["The specimen must be fluorescent","Light passing through the specimen must be changed sufficiently to create contrast","The specimen must be opaque","The objective must have the lowest possible NA"],"answer":"Light passing through the specimen must be changed sufficiently to create contrast","solution":"A: Fluorescence is required in fluorescence microscopy\nB: The lecture states specimens must alter the light enough to be visualized\nC: Opaque specimens block light rather than transmit it\nD: Higher NA generally improves detail","source":"BIOL 151-Microscopy and Staining Techniques-Nathaniel Yebuah.pdf | SLIDE 114","difficulty":"Hard"},{"id":"mls-v1-150","module":"v1","type":"mcq","q":"Which type of ambiguity results from how words are arranged or structured in a sentence?","options":["Phonological ambiguity","Semantic or lexical ambiguity","Syntactic ambiguity","Intentional ambiguity"],"answer":"Syntactic ambiguity","solution":"A: Phonological ambiguity concerns sound patterns\nB: Lexical ambiguity concerns words with multiple meanings\nC: The lecture defines syntactic ambiguity as arising from word arrangement\nD: Intentional ambiguity concerns the speaker's strategic purpose","source":"Ambiguity and Dangling Modifiers -Nathaniel Yebuah.pdf | SLIDE 8","difficulty":"Devil Mode"},{"id":"mls-v1-151","module":"v1","type":"mcq","q":"Which level of language is concerned with sound patterns in ambiguity?","options":["Syntax","Semantics","Pragmatics","Phonology"],"answer":"Phonology","solution":"A: Syntax concerns word arrangement\nB: Semantics concerns word meaning\nC: Pragmatics concerns context in use\nD: The slides state phonology deals with sound patterns","source":"Ambiguity and Dangling Modifiers -Nathaniel Yebuah.pdf | SLIDE 6","difficulty":"Medium"},{"id":"mls-v1-152","module":"v1","type":"mcq","q":"What is a misplaced modifier?","options":["A modifier separated from the word it is meant to describe","A modifier with nothing to modify","A modifier placed at the start of a sentence","A sentence with two subjects"],"answer":"A modifier separated from the word it is meant to describe","solution":"A: The lecture defines a misplaced modifier as a separation of space between modifier and modified word\nB: That defines a dangling modifier\nC: Fronting a modifier is not inherently misplaced\nD: That concerns concord, not modification","source":"Ambiguity and Dangling Modifiers -Nathaniel Yebuah.pdf | SLIDE 20","difficulty":"Medium"},{"id":"mls-v1-153","module":"v1","type":"mcq","q":"What distinguishes a dangling modifier from a misplaced modifier?","options":["It is always placed at the end","It modifies two words at once","It fails to refer logically to any word in the sentence","It contains a grammatical error in tense"],"answer":"It fails to refer logically to any word in the sentence","solution":"A: Dangling modifiers commonly occur at the start\nB: That is ambiguity, not dangling\nC: The lecture states a dangling modifier has nothing it can sensibly modify\nD: Tense is not the defining problem","source":"Ambiguity and Dangling Modifiers -Nathaniel Yebuah.pdf | SLIDE 23","difficulty":"Hard"},{"id":"mls-v1-154","module":"v1","type":"mcq","q":"In 'Having finished the exam, the script was submitted to the invigilator', what is the error?","options":["A misplaced modifier only","Faulty parallelism","A comma splice","A dangling modifier"],"answer":"A dangling modifier","solution":"A: The modifier has no logical subject at all\nB: The sentence has no list requiring parallel structure\nC: There is only one independent clause\nD: The opening clause seems to modify 'the script', which cannot finish an exam","source":"Ambiguity and Dangling Modifiers -Nathaniel Yebuah.pdf | SLIDE 25","difficulty":"Hard"},{"id":"mls-v1-155","module":"v1","type":"mcq","q":"What does concord refer to in grammar?","options":["Agreement between two grammatical units","The order of words in a sentence","The punctuation of a sentence","The length of a paragraph"],"answer":"Agreement between two grammatical units","solution":"A: The lecture defines concord as agreement such that one unit's feature is matched by the other\nB: That is syntax\nC: That is mechanics\nD: That is composition","source":"CONCORD -Nathaniel Yebuah.pdf | SLIDE 2","difficulty":"Devil Mode"},{"id":"mls-v1-156","module":"v1","type":"mcq","q":"Under Rule 1 of concord, how are two singular subjects joined by 'and' treated?","options":["They take a singular verb","They take a plural verb","They take no verb","They require a modal verb"],"answer":"They take a plural verb","solution":"A: That applies only under stated exceptions\nB: The lecture gives 'The student and the lecturer are friends' as the example\nC: Every clause needs a verb\nD: Modals are not required","source":"CONCORD -Nathaniel Yebuah.pdf | SLIDE 3","difficulty":"Medium"},{"id":"mls-v1-157","module":"v1","type":"mcq","q":"Which sentence illustrates the exception that a coordinated subject referring to one thing takes a singular verb?","options":["'The student and the lecturer are friends.'","'Each student and worker has a copy.'","'Romeo and Juliet is an interesting play.'","'Prayer and fasting is a good tool to fight the devil.'"],"answer":"'Prayer and fasting is a good tool to fight the devil.'","solution":"A: This is the general plural rule\nB: This is the 'each' exception\nC: This is the title exception\nD: The slide gives this as an example where two nouns refer to a single practice","source":"CONCORD -Nathaniel Yebuah.pdf | SLIDE 10","difficulty":"Medium"},{"id":"mls-v1-158","module":"v1","type":"mcq","q":"According to the principle of proximity, which verb form is correct in 'Neither Naa nor her friends ___ present'?","options":["were","was","is","are"],"answer":"were","solution":"A: The verb agrees with the nearer subject 'friends', as in the slide's example\nB: The nearer subject is plural, so 'was' violates proximity\nC: This is present tense and the sentence is past\nD: The sentence requires a past tense verb","source":"CONCORD -Nathaniel Yebuah.pdf | SLIDE 15","difficulty":"Hard"},{"id":"mls-v1-159","module":"v1","type":"mcq","q":"In 'The man as well as his wife ___ here', which verb is correct?","options":["are","is","were","be"],"answer":"is","solution":"A: The parenthetical phrase does not make the subject plural\nB: A singular subject followed by 'as well as' takes a singular verb, per Rule 4\nC: Tense and concord both fail\nD: The finite verb must agree in number","source":"CONCORD -Nathaniel Yebuah.pdf | SLIDE 17","difficulty":"Hard"},{"id":"mls-v1-160","module":"v1","type":"mcq","q":"Which pronoun class usually takes singular verbs according to the concord rules?","options":["All plural nouns","Collective nouns always","Indefinite pronouns such as nobody and each","Words ending in s always"],"answer":"Indefinite pronouns such as nobody and each","solution":"A: Plural nouns take plural verbs\nB: Collective nouns may take either\nC: Rule 5 states these indefinite pronouns take singular verbs\nD: An s-ending may be singular, as in 'Linguistics'","source":"CONCORD -Nathaniel Yebuah.pdf | SLIDE 21","difficulty":"Devil Mode"},{"id":"mls-v1-161","module":"v1","type":"mcq","q":"Which qualities must a good paragraph have according to the UCC model?","options":["Unity, coherence and completeness","Unity, clarity and correctness","Order, coherence and conciseness","Unity, complexity and correctness"],"answer":"Unity, coherence and completeness","solution":"A: The lecture says a good paragraph is a UCC paragraph\nB: These are sentence-level qualities\nC: Order is not one of the three named\nD: Complexity is not required","source":"PARAGRAPH LECTURE SLIDES -Nathaniel Yebuah.pdf | SLIDE 14","difficulty":"Medium"},{"id":"mls-v1-162","module":"v1","type":"mcq","q":"What does unity in a paragraph require?","options":["Several unrelated ideas","One main or central idea with every sentence supporting it","Only short sentences","A concluding sentence always"],"answer":"One main or central idea with every sentence supporting it","solution":"A: That breaks unity\nB: The slides define unity as containing one controlling idea\nC: Sentence length does not determine unity\nD: A conclusion is optional","source":"PARAGRAPH LECTURE SLIDES -Nathaniel Yebuah.pdf | SLIDE 9","difficulty":"Medium"},{"id":"mls-v1-163","module":"v1","type":"mcq","q":"Which paragraph type tells a story with a sequence of action?","options":["Descriptive","Expository","Narrative","Argumentative"],"answer":"Narrative","solution":"A: Descriptive paragraphs show what a thing or person is like\nB: Expository paragraphs explain or instruct\nC: The lecture defines the narrative paragraph as telling a story\nD: Argumentative paragraphs seek acceptance of a viewpoint","source":"PARAGRAPH LECTURE SLIDES -Nathaniel Yebuah.pdf | SLIDE 18","difficulty":"Hard"},{"id":"mls-v1-164","module":"v1","type":"mcq","q":"Which paragraph type tries to get the reader to accept a particular point of view?","options":["Narrative","Descriptive","Expository","Argumentative"],"answer":"Argumentative","solution":"A: Narrative paragraphs tell stories\nB: Descriptive paragraphs portray a subject\nC: Expository paragraphs explain\nD: The lecture defines argumentative paragraphs in these terms","source":"PARAGRAPH LECTURE SLIDES -Nathaniel Yebuah.pdf | SLIDE 21","difficulty":"Hard"},{"id":"mls-v1-165","module":"v1","type":"mcq","q":"What is the function of a topic sentence?","options":["It always comes last","It contains the main or controlling idea developed in the paragraph","It lists references","It corrects grammar in the paragraph"],"answer":"It contains the main or controlling idea developed in the paragraph","solution":"A: Topic sentences may be initial, medial or final\nB: The slides define the topic sentence as carrying the central idea\nC: References are separate\nD: That is editing","source":"PARAGRAPH LECTURE SLIDES -Nathaniel Yebuah.pdf | SLIDE 26","difficulty":"Devil Mode"},{"id":"mls-v1-166","module":"v1","type":"mcq","q":"Which functional sentence type announces the coming of a subsequent paragraph?","options":["A topic sentence","A major supporting sentence","A transitional sentence","A concluding sentence"],"answer":"A transitional sentence","solution":"A: A topic sentence states the main idea\nB: That develops the topic\nC: The lecture states transitional sentences announce the next paragraph\nD: That closes the paragraph","source":"PARAGRAPH LECTURE SLIDES -Nathaniel Yebuah.pdf | SLIDE 42","difficulty":"Medium"},{"id":"mls-v1-167","module":"v1","type":"mcq","q":"Which mark of punctuation is used at the end of a direct question?","options":["A period","A colon","A semicolon","A question mark"],"answer":"A question mark","solution":"A: A period ends statements\nB: A colon introduces explanation\nC: A semicolon links related clauses\nD: The punctuation slides state the question mark follows a direct question","source":"PUNCTUATION LECTURE SLIDES -Nathaniel Yebuahpdf | SLIDE 15","difficulty":"Medium"},{"id":"mls-v1-168","module":"v1","type":"mcq","q":"What is the main function of an apostrophe as described in the punctuation lecture?","options":["Marking contractions and possession","Ending a sentence","Separating items in a series","Indicating an omission of a whole paragraph"],"answer":"Marking contractions and possession","solution":"A: The slides give contractions such as can't as an apostrophe function\nB: That is an end mark\nC: That is a comma\nD: That is an ellipsis","source":"PUNCTUATION LECTURE SLIDES -Nathaniel Yebuahpdf | SLIDE 31","difficulty":"Hard"},{"id":"mls-v1-169","module":"v1","type":"mcq","q":"Which punctuation mark indicates an omission in quoted text?","options":["A dash","A colon","An ellipsis","Quotation marks"],"answer":"An ellipsis","solution":"A: A dash marks a sudden break\nB: A colon introduces a list\nC: The lecture states three spaced periods indicate omission\nD: These enclose direct speech","source":"PUNCTUATION LECTURE SLIDES -Nathaniel Yebuahpdf | SLIDE 34","difficulty":"Hard"},{"id":"mls-v1-170","module":"v1","type":"mcq","q":"In academic writing, which word class is generally preferred over heavy use of prepositional phrases?","options":["More prepositional phrases","Passive constructions only","Interjections","Brief noun strings, adverbs and verbs"],"answer":"Brief noun strings, adverbs and verbs","solution":"A: That is the opposite of the convention\nB: The lecture recommends replacing passive with active\nC: Interjections are informal\nD: The slides recommend replacing prepositional phrases with these","source":"PUNCTUATION LECTURE SLIDES -Nathaniel Yebuahpdf | SLIDE 41","difficulty":"Devil Mode"},{"id":"mls-v1-171","module":"v1","type":"mcq","q":"How are major (open) word classes characterized in the Parts of Speech lecture?","options":["They readily accept new members","They never change","They occur only in speech","They are all academic"],"answer":"They readily accept new members","solution":"A: Open classes such as noun and verb admit new words\nB: Closed classes are more fixed\nC: Word classes occur in speech and writing\nD: Some are considered more academic than others","source":"Part of Speech-Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Medium"},{"id":"mls-v1-172","module":"v1","type":"mcq","q":"Which principle identifies word class by the idea that comes to mind?","options":["The functional principle","The notional principle","The distributional principle","The phonetic principle"],"answer":"The notional principle","solution":"A: Function concerns syntactic role\nB: The lecture lists the notional principle as based on the concept in mind\nC: Distribution concerns position in sentences\nD: Phonetics concerns sounds","source":"Part of Speech-Nathaniel Yebuah.pdf | SLIDE 6","difficulty":"Medium"},{"id":"mls-v1-173","module":"v1","type":"mcq","q":"Which structure is incorrect according to the verb-mistakes slides?","options":["'She can speak Ewe fluently.'","'She is able to speak Ewe.'","'She speaks Ewe fluently.'","'She can be able to speak Ewe fluently.'"],"answer":"'She can be able to speak Ewe fluently.'","solution":"A: This is the correct form\nB: This is acceptable English\nC: This is a simple correct sentence\nD: The lecture flags this as incorrect use of modal verbs","source":"Part of Speech-Nathaniel Yebuah.pdf | SLIDE 39","difficulty":"Hard"},{"id":"mls-v1-174","module":"v1","type":"mcq","q":"Which sentence is in the active voice?","options":["'Dzifa ate the food.'","'The food was eaten by Dzifa.'","'The boarders have been sent home by the school.'","'The keys have been handed to the new tenant.'"],"answer":"'Dzifa ate the food.'","solution":"A: The subject performs the action, which is the definition of active voice\nB: This is passive because the subject receives the action\nC: This is passive with a by-agent\nD: This is agentless passive","source":"Part of Speech-Nathaniel Yebuah.pdf | SLIDE 46","difficulty":"Hard"},{"id":"mls-v1-175","module":"v1","type":"mcq","q":"Why can intransitive verbs not be changed into passive voice?","options":["They have no subject","They have no direct object to become the passive subject","They are always in past tense","They lack modifiers"],"answer":"They have no direct object to become the passive subject","solution":"A: Intransitive verbs do have subjects\nB: The lecture states only transitive verbs with direct objects can be passivized\nC: Tense is not the issue\nD: Modifiers are irrelevant","source":"Part of Speech-Nathaniel Yebuah.pdf | SLIDE 51","difficulty":"Devil Mode"},{"id":"mls-v1-176","module":"v1","type":"mcq","q":"Which pair of words is correctly distinguished in the commonly confused words slides?","options":["Elicit means illegal; illicit means to draw out","Farther means figurative distance; further means physical distance","Compliment means praise; complement means to complete","Stationary means writing paper; stationery means still"],"answer":"Compliment means praise; complement means to complete","solution":"A: The meanings are reversed\nB: The lecture states the opposite\nC: The lecture defines these two precisely\nD: The meanings are reversed","source":"Part of Speech-Nathaniel Yebuah.pdf | SLIDE 89","difficulty":"Medium"},{"id":"mls-v1-177","module":"v1","type":"mcq","q":"What is a sentence fragment?","options":["An incomplete sentence lacking a main verb or complete thought","A sentence with two independent clauses","A sentence ending with a question mark","A very long sentence"],"answer":"An incomplete sentence lacking a main verb or complete thought","solution":"A: The lecture defines fragments as incomplete sentences that miss a requirement\nB: That is a compound sentence\nC: That is an interrogative\nD: Length alone does not make a fragment","source":"SENTENCE -Nathaniel Yebuah.pdf | SLIDE 49","difficulty":"Medium"},{"id":"mls-v1-178","module":"v1","type":"mcq","q":"What is a comma splice?","options":["Using a comma between items in a list","Incorrect use of a comma to join two independent clauses","Ending a sentence with a comma","Joining a dependent clause to an independent clause"],"answer":"Incorrect use of a comma to join two independent clauses","solution":"A: That is correct comma use\nB: The slides define a comma splice in exactly these terms\nC: That is incorrect punctuation but not a splice\nD: That is not a splice","source":"SENTENCE -Nathaniel Yebuah.pdf | SLIDE 61","difficulty":"Hard"},{"id":"mls-v1-179","module":"v1","type":"mcq","q":"How many independent clauses does a compound sentence contain?","options":["One","At least three","Two","None"],"answer":"Two","solution":"A: That is a simple sentence\nB: That is not the definition\nC: The lecture defines a compound sentence as two independent clauses joined by a coordinating conjunction\nD: Every sentence has at least one clause","source":"SENTENCE -Nathaniel Yebuah.pdf | SLIDE 16","difficulty":"Hard"},{"id":"mls-v1-180","module":"v1","type":"mcq","q":"What does the acronym FANBOYS stand for in the sentence lecture?","options":["The subordinating conjunctions","The functional sentence types","The qualities of a good sentence","The coordinating conjunctions"],"answer":"The coordinating conjunctions","solution":"A: Those are introduced separately\nB: Those are declarative, interrogative, imperative and exclamatory\nC: Those are clarity and correctness\nD: The lecture uses FANBOYS to remember coordinating conjunctions","source":"SENTENCE -Nathaniel Yebuah.pdf | SLIDE 17","difficulty":"Devil Mode"},{"id":"mls-v1-181","module":"v1","type":"mcq","q":"Which sentence has faulty parallel structure?","options":["'Great minds discuss ideas.'","'Sarah has intelligence, honesty, and she is funny.'","'She likes reading, writing and painting.'","'He came, he saw, he conquered.'"],"answer":"'Sarah has intelligence, honesty, and she is funny.'","solution":"A: This is a correct quotation\nB: The lecture cites this as poor because a clause is mixed with nouns\nC: This is parallel\nD: This is parallel","source":"SENTENCE -Nathaniel Yebuah.pdf | SLIDE 77","difficulty":"Medium"},{"id":"mls-v1-182","module":"v1","type":"mcq","q":"Which sentence type normally gives an order or direction?","options":["Declarative","Interrogative","Imperative","Exclamatory"],"answer":"Imperative","solution":"A: Declarative sentences state ideas\nB: Interrogative sentences ask questions\nC: The lecture states an imperative sentence gives an order\nD: Exclamatory sentences express strong feeling","source":"SENTENCE -Nathaniel Yebuah.pdf | SLIDE 39","difficulty":"Medium"},{"id":"mls-v1-183","module":"v1","type":"mcq","q":"What is a rhetorical question?","options":["A question expecting yes or no","A reported question","A statement with rising intonation","A question that normally requires no answer"],"answer":"A question that normally requires no answer","solution":"A: That is a yes-no question\nB: That is an indirect question\nC: That is a declarative question\nD: The lecture defines rhetorical questions in this way","source":"SENTENCE -Nathaniel Yebuah.pdf | SLIDE 38","difficulty":"Hard"},{"id":"mls-v1-184","module":"v1","type":"mcq","q":"What is a spreadsheet primarily used for according to the Computer Appreciation slides?","options":["Storing, manipulating and comparing data and planning","Writing formal letters","Drawing molecular structures","Sending electronic mail"],"answer":"Storing, manipulating and comparing data and planning","solution":"A: The lecture lists research, business and scientific uses of spreadsheets for data handling\nB: That is a word-processing task\nC: That requires specialist chemical drawing software\nD: That is the role of Outlook","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 6","difficulty":"Hard"},{"id":"mls-v1-185","module":"v1","type":"mcq","q":"Which application in the Microsoft Office suite is presentation software?","options":["Microsoft Excel","Microsoft Outlook","Microsoft PowerPoint","Microsoft Word"],"answer":"Microsoft PowerPoint","solution":"A: Excel is a spreadsheet package\nB: Outlook is for email\nC: The slides identify PowerPoint as presentation software\nD: Word is a word processor","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Devil Mode"},{"id":"mls-v1-186","module":"v1","type":"mcq","q":"How many characters can be typed into a single Excel cell?","options":["Up to 25","Up to 1024","Unlimited","Up to 255"],"answer":"Up to 255","solution":"A: That is far below the stated limit\nB: That exceeds the stated cell limit\nC: Cells have a fixed character limit\nD: The slide states a cell can hold as many as 255 characters","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 23","difficulty":"Medium"},{"id":"mls-v1-187","module":"v1","type":"mcq","q":"How can you force Excel to accept a number such as 25,000 as text?","options":["Type an apostrophe before the number","Type a comma before the number","Prefix the number with a plus sign","Format the cell as currency"],"answer":"Type an apostrophe before the number","solution":"A: The lecture gives the example of a leading apostrophe to store numbers as text\nB: A comma does not force text format\nC: A plus sign begins a formula\nD: Currency format keeps the value numeric","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 24","difficulty":"Medium"},{"id":"mls-v1-188","module":"v1","type":"mcq","q":"Which shortcut formats a date in the default date format in Excel?","options":["Ctrl + @","Ctrl + #","Ctrl + D","Ctrl + A"],"answer":"Ctrl + #","solution":"A: This applies the default time format\nB: The slides state Ctrl + # applies the default date format\nC: This fills down from the cell above\nD: This selects all cells","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 30","difficulty":"Hard"},{"id":"mls-v1-189","module":"v1","type":"mcq","q":"Which shortcut fills a cell with the contents of the cell above it?","options":["Ctrl + #","Ctrl + C","Ctrl + V","Ctrl + D"],"answer":"Ctrl + D","solution":"A: That formats a date\nB: That copies a cell\nC: That pastes a cell\nD: The lecture states Ctrl + D fills down","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 56","difficulty":"Hard"},{"id":"mls-v1-190","module":"v1","type":"mcq","q":"What does AutoComplete do in Excel?","options":["Repeats text entries already present in the same column","Automatically sums a column","Creates a chart automatically","Sorts the column alphabetically"],"answer":"Repeats text entries already present in the same column","solution":"A: The slides describe AutoComplete as completing repeated text items from a column\nB: That is AutoSum\nC: That is the chart wizard\nD: That is the sort command","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 35","difficulty":"Devil Mode"},{"id":"mls-v1-191","module":"v1","type":"mcq","q":"What happens when you hold Ctrl while dragging the fill handle over multiple cells?","options":["The series is duplicated twice","AutoFill is suppressed","The fill direction is reversed","The cells are deleted"],"answer":"AutoFill is suppressed","solution":"A: That is not the stated effect\nB: The lecture states holding Ctrl suppresses AutoFill\nC: Ctrl does not reverse direction\nD: Ctrl does not delete during fill","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 66","difficulty":"Medium"},{"id":"mls-v1-192","module":"v1","type":"mcq","q":"Which characters may start a formula in Excel?","options":["Only =","@ or #","=, + or −","A letter"],"answer":"=, + or −","solution":"A: The slides allow three starting symbols\nB: These are not formula starters\nC: The lecture states a formula must start with one of these symbols\nD: Formulas do not begin with arbitrary letters","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 79","difficulty":"Medium"},{"id":"mls-v1-193","module":"v1","type":"mcq","q":"What is a relative cell reference in Excel?","options":["An address that adjusts when the formula is copied","An address fixed with dollar signs","A reference to another worksheet","An address that cannot be used in formulas"],"answer":"An address that adjusts when the formula is copied","solution":"A: The slides state relative references change after filling a range with a formula\nB: That is an absolute reference\nC: That is a 3-D or sheet reference\nD: Every cell address can be referenced","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 90","difficulty":"Hard"},{"id":"mls-v1-194","module":"v1","type":"mcq","q":"Which notation represents an absolute reference to cell A5?","options":["A5","$A$5","A$5","$A5"],"answer":"$A$5","solution":"A: This is a relative reference\nB: The lecture states dollar signs create a permanent link to the cell\nC: This fixes only the row, a mixed reference\nD: This fixes only the column, a mixed reference","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 97","difficulty":"Hard"},{"id":"mls-v1-195","module":"v1","type":"mcq","q":"What is a circular reference in Excel?","options":["A reference spanning two sheets","A reference with one fixed coordinate","A formula that uses its own cell address","A reference to an empty cell"],"answer":"A formula that uses its own cell address","solution":"A: That is a 3-D reference\nB: That is a mixed reference\nC: The lecture defines circular addressing as including the current cell's address\nD: That is simply a blank reference","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 101","difficulty":"Devil Mode"},{"id":"mls-v1-196","module":"v1","type":"mcq","q":"What is the maximum length allowed for a defined range name?","options":["25 characters","1,024 characters","8 characters","255 characters"],"answer":"255 characters","solution":"A: That is shorter than the allowed maximum\nB: That exceeds the stated maximum\nC: Older systems limited names but Excel allows more\nD: The naming slides state a maximum of 255 characters","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 120","difficulty":"Medium"},{"id":"mls-v1-197","module":"v1","type":"mcq","q":"What does the NOW function return?","options":["Only the current date","The serial number of the current date and time from the system clock","The day of the week","A loan payment"],"answer":"The serial number of the current date and time from the system clock","solution":"A: That is the TODAY function\nB: The lecture states NOW uses the computer clock and takes no arguments\nC: That is WEEKDAY\nD: That is PMT","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 153","difficulty":"Medium"},{"id":"mls-v1-198","module":"v1","type":"mcq","q":"How would you write a formula for the date 28 September 2010 in Excel?","options":["DATE(28, 9, 2010)","=TODAY(2010,9,28)","=DATE(2010, 9, 28)","=NOW(2010,9,28)"],"answer":"=DATE(2010, 9, 28)","solution":"A: The year must come first in the DATE function\nB: TODAY takes no arguments\nC: The slide gives this exact example\nD: NOW takes no arguments","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 157","difficulty":"Hard"},{"id":"mls-v1-199","module":"v1","type":"mcq","q":"Which Excel function returns the number of combinations for a given number of objects?","options":["GCD","ROUNDDOWN","SUMIFS","COMBIN"],"answer":"COMBIN","solution":"A: GCD returns the greatest common divisor\nB: ROUNDDOWN rounds toward zero\nC: SUMIFS sums cells meeting criteria\nD: The math and trig function table lists COMBIN for this purpose","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 163","difficulty":"Hard"},{"id":"mls-v1-200","module":"v1","type":"mcq","q":"Which statistical function counts cells that meet a given criterion?","options":["COUNTIF","AVERAGE","QUARTILE","INTERCEPT"],"answer":"COUNTIF","solution":"A: The statistical functions table lists COUNTIF\nB: AVERAGE returns the mean\nC: QUARTILE returns a quartile value\nD: INTERCEPT is a regression function","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 171","difficulty":"Devil Mode"},{"id":"mls-v1-201","module":"v1","type":"mcq","q":"Which logical function returns TRUE only when all its arguments are TRUE?","options":["OR","NOT","AND","FALSE"],"answer":"AND","solution":"A: OR returns TRUE if at least one argument is TRUE\nB: NOT reverses a single argument\nC: The lecture states AND returns TRUE if all logical arguments are TRUE\nD: FALSE always returns FALSE","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 190","difficulty":"Medium"},{"id":"mls-v1-202","module":"v1","type":"mcq","q":"What does the IF function do in Excel?","options":["Always returns TRUE","Sums a range","Looks up a value in a table","Tests a condition and returns one value if true and another if false"],"answer":"Tests a condition and returns one value if true and another if false","solution":"A: That is the TRUE function\nB: That is SUM\nC: That is a lookup function\nD: The lecture defines IF as testing a logical condition to determine a cell value","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 192","difficulty":"Medium"},{"id":"mls-v1-203","module":"v1","type":"mcq","q":"Which function is most frequently used and totals numeric values in referenced ranges?","options":["SUM","PMT","AVERAGE","COUNTIF"],"answer":"SUM","solution":"A: The lecture states SUM is the most frequently used function\nB: PMT computes loan payments\nC: AVERAGE computes the mean\nD: COUNTIF counts with criteria","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 147","difficulty":"Hard"},{"id":"mls-v1-204","module":"v1","type":"mcq","q":"Which financial function calculates the periodic payment for a loan?","options":["FV","PMT","PV","ACCRINT"],"answer":"PMT","solution":"A: FV returns future value\nB: The lecture gives PMT for amortized loan payments\nC: PV returns present value\nD: ACCRINT returns accrued interest","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 132","difficulty":"Hard"},{"id":"mls-v1-205","module":"v1","type":"mcq","q":"What operator is used to join text strings in Excel formulas?","options":["The plus sign (+)","The caret (^)","The colon (:)","The ampersand (&)"],"answer":"The ampersand (&)","solution":"A: Plus performs arithmetic addition\nB: Caret performs exponentiation\nC: Colon is a range operator\nD: The lecture states concatenation uses & and quotes indicate text","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 223","difficulty":"Devil Mode"},{"id":"mls-v1-206","module":"v1","type":"mcq","q":"What does the Percentage number format do to a cell value?","options":["Multiplies the value by 100 and displays a percent sign","Divides the value by 100","Leaves the value unchanged","Converts the value to text"],"answer":"Multiplies the value by 100 and displays a percent sign","solution":"A: The slides state percentage format multiplies by 100\nB: That is not the Excel percentage format\nC: Formatting changes display\nD: Percentage format keeps a numeric value","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 235","difficulty":"Medium"},{"id":"mls-v1-207","module":"v1","type":"mcq","q":"When a column is too narrow to display a number, what appears in the cell?","options":["A blank cell","A series of # characters","An error message about division","The number in scientific notation"],"answer":"A series of # characters","solution":"A: Excel does not silently blank the value\nB: The slides state that hashes appear when a column is too narrow\nC: That is a different error\nD: Scientific notation is a chosen format","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 240","difficulty":"Medium"},{"id":"mls-v1-208","module":"v1","type":"mcq","q":"How many standard chart types does Excel provide according to the slides?","options":["4","40","14","10"],"answer":"14","solution":"A: There are far more than four\nB: That is above the stated number\nC: The chart slides state Excel has 14 standard chart types\nD: Ten is not the stated count","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 322","difficulty":"Hard"},{"id":"mls-v1-209","module":"v1","type":"mcq","q":"Which chart type is best suited to showing the contribution of each category to a whole?","options":["A pie chart","A line chart","A scatter chart","A column chart"],"answer":"A pie chart","solution":"A: The lecture states pie charts display the contribution of each value to a total\nB: Line charts show trends over evenly spaced categories\nC: Scatter charts compare pairs of values\nD: Column charts compare categories with values","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 342","difficulty":"Hard"},{"id":"mls-v1-210","module":"v1","type":"mcq","q":"What is a legend in an Excel chart?","options":["The horizontal axis","A guide that explains the symbols used in the chart","The plot area","A data point"],"answer":"A guide that explains the symbols used in the chart","solution":"A: That is the category axis\nB: The chart-terms slide defines the legend in this way\nC: That is the bounded rectangle of the chart\nD: That is a single value","source":"csm183 Xcel and Powerpoint-Nathaniel Yebuah.pdf | SLIDE 316","difficulty":"Devil Mode"},{"id":"mls-v1-211","module":"v1","type":"mcq","q":"What is genetics defined as in the introductory genetics lecture?","options":["The study of cell structure only","The study of chemical reactions in cells","The branch of biology dealing with heredity and variation","The study of population dynamics"],"answer":"The branch of biology dealing with heredity and variation","solution":"A: That is cell biology\nB: That is biochemistry\nC: The lecture defines genetics in these terms\nD: That is ecology","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 12","difficulty":"Medium"},{"id":"mls-v1-212","module":"v1","type":"mcq","q":"Which theory of heredity was proposed by Charles Darwin?","options":["Germplasm theory","Preformation","Epigenesis","Pangenesis"],"answer":"Pangenesis","solution":"A: That was proposed by Weismann\nB: That was the homunculus idea\nC: That was proposed by Wolff and von Baer\nD: The lecture states Darwin proposed pangenesis, in which each structure contributes characteristics","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 15","difficulty":"Medium"},{"id":"mls-v1-213","module":"v1","type":"mcq","q":"Which theory held that a fully formed little man (homunculus) existed in the sperm?","options":["Pangenesis","Preformation","Germplasm theory","Epigenesis"],"answer":"Preformation","solution":"A: Darwin's theory of gemmules\nB: The lecture describes preformationists and the homunculus in sperm\nC: Weismann's theory\nD: The theory that organs gradually form from the zygote","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 22","difficulty":"Hard"},{"id":"mls-v1-214","module":"v1","type":"mcq","q":"Who proposed epigenesis in the 18th and 19th centuries?","options":["Darwin and Wallace","Schleiden and Schwann","Kasper Wolff and Karl Ernst von Baer","Mendel and Morgan"],"answer":"Kasper Wolff and Karl Ernst von Baer","solution":"A: They proposed natural selection\nB: They proposed cell theory\nC: The lecture credits these two scientists with epigenesis\nD: They founded genetics","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 24","difficulty":"Hard"},{"id":"mls-v1-215","module":"v1","type":"mcq","q":"What conclusion does the lecture draw about what parents transmit to offspring?","options":["The acquired characteristics of the parents","The exact body structures of the parents","Only environmental conditions","A set of instructions, the genetic information in DNA"],"answer":"A set of instructions, the genetic information in DNA","solution":"A: That was Lamarck's discredited view\nB: That was preformation\nC: Environment alone is not inherited\nD: The conclusions slide states this explicitly","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 26","difficulty":"Devil Mode"},{"id":"mls-v1-216","module":"v1","type":"mcq","q":"Why did Mendel choose the pea plant for his experiments?","options":["It was easy to cultivate with a short annual life cycle","It had no visible traits","It could only self-fertilize","It had a very long lifespan"],"answer":"It was easy to cultivate with a short annual life cycle","solution":"A: The lecture lists ease of cultivation and a short life cycle among the reasons\nB: Mendel chose clear cut traits\nC: Mendel controlled cross-fertilization\nD: Peas are annual plants with a short cycle","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 31","difficulty":"Medium"},{"id":"mls-v1-217","module":"v1","type":"mcq","q":"What is an allele?","options":["The physical location of a gene on a chromosome","The visible appearance of an organism","A variant form of a gene that determines an alternative trait","A section of DNA coding for a protein"],"answer":"A variant form of a gene that determines an alternative trait","solution":"A: That is a locus\nB: That is the phenotype\nC: The lecture defines an allele as a variation of a gene\nD: That is the definition of a gene","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 37","difficulty":"Medium"},{"id":"mls-v1-218","module":"v1","type":"mcq","q":"What does phenotype refer to?","options":["The genetic makeup of an organism","The number of chromosomes","The anatomical position of a gene","The visible expression of a trait or measurable characteristic"],"answer":"The visible expression of a trait or measurable characteristic","solution":"A: That is genotype\nB: That is the karyotype\nC: That is the locus\nD: The lecture defines phenotype as the visible expression resulting from gene products in an environment","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 45","difficulty":"Hard"},{"id":"mls-v1-219","module":"v1","type":"mcq","q":"What does Mendel's principle of segregation state?","options":["The two alleles of a pair separate into different gametes during reproduction","Alleles remain together in every gamete","Only dominant alleles are transmitted","Homologous chromosomes never separate"],"answer":"The two alleles of a pair separate into different gametes during reproduction","solution":"A: The lecture states members of each allelic pair segregate, giving purity of gametes\nB: That contradicts segregation\nC: Recessive alleles are also transmitted\nD: They do separate in meiosis","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 48","difficulty":"Hard"},{"id":"mls-v1-220","module":"v1","type":"mcq","q":"What is a testcross?","options":["A cross between two identical homozygotes","A cross of an individual of unknown genotype with a homozygous recessive","A cross of F1 to one of its parents","A cross between two heterozygotes"],"answer":"A cross of an individual of unknown genotype with a homozygous recessive","solution":"A: That is not a testcross\nB: The lecture defines a testcross in exactly this way\nC: That is a backcross\nD: That is a monohybrid cross","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 58","difficulty":"Devil Mode"},{"id":"mls-v1-221","module":"v1","type":"mcq","q":"How does a backcross differ from a testcross?","options":["They are identical in every case","A backcross always uses a recessive parent","A testcross always uses the exact original parents","Backcross uses a parent; testcross uses a homozygous recessive"],"answer":"Backcross uses a parent; testcross uses a homozygous recessive","solution":"A: The lecture distinguishes them\nB: That is the testcross\nC: That is not correct\nD: The lecture states the key difference is the use of a recessive homozygote in a testcross","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 61","difficulty":"Medium"},{"id":"mls-v1-222","module":"v1","type":"mcq","q":"State Mendel's law of independent assortment.","options":["Genes for different characters assort independently during gamete formation","Only linked genes assort independently","All genes are inherited as one unit","Alleles of one gene never separate"],"answer":"Genes for different characters assort independently during gamete formation","solution":"A: The lecture states this law was derived from dihybrid crosses\nB: Linked genes do not assort independently\nC: That contradicts independent assortment\nD: That contradicts segregation","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 65","difficulty":"Medium"},{"id":"mls-v1-223","module":"v1","type":"mcq","q":"What phenotypic ratio results from crossing two heterozygous parents for two independently assorting genes with complete dominance?","options":["3:1","9:3:3:1","1:1:1:1","9:7"],"answer":"9:3:3:1","solution":"A: That is a monohybrid ratio\nB: The lecture gives this classic dihybrid F2 ratio\nC: That is a dihybrid testcross ratio\nD: That is duplicate recessive epistasis","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 75","difficulty":"Hard"},{"id":"mls-v1-224","module":"v1","type":"mcq","q":"What ratio is expected from a dihybrid backcross to the fully recessive parent?","options":["9:3:3:1","3:1","1:1:1:1","1:1"],"answer":"1:1:1:1","solution":"A: That is an F1 × F1 dihybrid ratio\nB: That is monohybrid\nC: The lecture states a 1:1:1:1 ratio from a dihybrid testcross\nD: That is a monohybrid testcross","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 76","difficulty":"Hard"},{"id":"mls-v1-225","module":"v1","type":"mcq","q":"If a trihybrid heterozygote is testcrossed, how many kinds of gametes does it produce?","options":["8","3","64","27"],"answer":"8","solution":"A: With 3 heterozygous gene pairs, gametes number 2³ = 8, as the lecture states\nB: That is the number of gene pairs\nC: That is the number of cells in a trihybrid Punnett square\nD: That is the number of genotypes in an F2 trihybrid","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 82","difficulty":"Devil Mode"},{"id":"mls-v1-226","module":"v1","type":"mcq","q":"What is the forked-line method used for in genetics?","options":["Calculating chi-square values","Representing trihybrid crosses as combined monohybrid ratios","Drawing pedigrees","Determining blood groups"],"answer":"Representing trihybrid crosses as combined monohybrid ratios","solution":"A: That is a statistical goodness-of-fit test\nB: The lecture presents the forked-line method to avoid a 64-square Punnett grid\nC: That is pedigree analysis\nD: That is multiple allelism","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 84","difficulty":"Medium"},{"id":"mls-v1-227","module":"v1","type":"mcq","q":"How many different F2 genotypes arise from n independently assorting gene pairs with complete dominance?","options":["2ⁿ","4ⁿ","3ⁿ","n²"],"answer":"3ⁿ","solution":"A: That is the number of gamete types\nB: That is not the stated relationship\nC: The lecture states the number of F2 genotypes is a multiple of 3^n\nD: That is not the stated relationship","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 93","difficulty":"Medium"},{"id":"mls-v1-228","module":"v1","type":"mcq","q":"In chi-square analysis, what does the chi-square statistic measure?","options":["The number of genes involved","The speed of inheritance","The dominance relationship between alleles","How well observed data fit expected ratios"],"answer":"How well observed data fit expected ratios","solution":"A: That is not what chi-square measures\nB: That is not a statistical quantity\nC: That is inferred from ratios, not chi-square itself\nD: The lecture describes chi-square as a goodness-of-fit test comparing observed and expected","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 105","difficulty":"Hard"},{"id":"mls-v1-229","module":"v1","type":"mcq","q":"How are degrees of freedom calculated in the chi-square example for a 3:1 ratio?","options":["Number of categories plus one","Number of categories minus one (2 − 1 = 1)","The total sample size","The expected ratio numerator"],"answer":"Number of categories minus one (2 − 1 = 1)","solution":"A: That would give 3 for a 3:1 ratio\nB: The lecture states degrees of freedom equal n − 1, giving 1 for two categories\nC: Sample size is not used to compute degrees of freedom\nD: That is not the definition","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 113","difficulty":"Hard"},{"id":"mls-v1-230","module":"v1","type":"mcq","q":"Which P-value range is considered acceptable in chi-square analysis according to the lecture?","options":["Below 0.05","Exactly 0.05 only","0.05 to 1.0","Any value including zero"],"answer":"0.05 to 1.0","solution":"A: Those values are unacceptable\nB: The whole range from 0.05 upward is acceptable\nC: The slides state all P values between 0.05 and 1.0 are acceptable\nD: Values below 0.05 lead to rejection","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 120","difficulty":"Devil Mode"},{"id":"mls-v1-231","module":"v1","type":"mcq","q":"What is epistasis?","options":["The masking of one allele by another at the same locus","The exchange of genetic material","The expression of a lethal gene","The masking of expression of one non-allelic gene by another"],"answer":"The masking of expression of one non-allelic gene by another","solution":"A: That is dominance\nB: That is recombination\nC: That is lethality\nD: The lecture defines epistasis as one gene masking a different gene","source":"Module 4- GENE INTERACTIONS-Nathaniel Yebuah.pdf | SLIDE 13","difficulty":"Medium"},{"id":"mls-v1-232","module":"v1","type":"mcq","q":"Which phenotypic ratio is characteristic of dominant epistasis?","options":["12:3:1","9:3:4","9:7","9:3:3:1"],"answer":"12:3:1","solution":"A: The lecture labels dominant epistasis as the 12:3:1 ratio\nB: That is recessive epistasis\nC: That is duplicate recessive gene action\nD: That is independent assortment without epistasis","source":"Module 4- GENE INTERACTIONS-Nathaniel Yebuah.pdf | SLIDE 18","difficulty":"Medium"},{"id":"mls-v1-233","module":"v1","type":"mcq","q":"In Labrador retriever coat colour, which two genes control pigment production and incorporation?","options":["R and S","C and D","B and E","A and B"],"answer":"B and E","solution":"A: These are not the genes in the example\nB: These are not the genes in the example\nC: The lecture states pigment production (B) and incorporation into the hair shaft (E) are controlled separately\nD: Only B is involved in the example","source":"Module 4- GENE INTERACTIONS-Nathaniel Yebuah.pdf | SLIDE 26","difficulty":"Hard"},{"id":"mls-v1-234","module":"v1","type":"mcq","q":"Which ratio indicates duplicative recessive gene action in the sweet pea example?","options":["12:3:1","9:3:4","3:1","9:7"],"answer":"9:7","solution":"A: That is dominant epistasis\nB: That is recessive epistasis\nC: That is monohybrid inheritance\nD: The lecture states a 9:7 ratio is characteristic of duplicative recessive genes","source":"Module 4- GENE INTERACTIONS-Nathaniel Yebuah.pdf | SLIDE 27","difficulty":"Hard"},{"id":"mls-v1-235","module":"v1","type":"mcq","q":"How many pairs of autosomes do humans have?","options":["22","23","46","44"],"answer":"22","solution":"A: The lecture states humans have 22 pairs of autosomes plus one pair of sex chromosomes\nB: That is the total number of chromosome pairs including sex chromosomes\nC: That is the total number of chromosomes\nD: That is the number of autosomal chromosomes, not pairs","source":"Module 5-CELLULAR BASIS OF INHERITANCE-MITOSIS AND MEIOSIS-Nathaniel Yebuah.pdf | SLIDE 8","difficulty":"Devil Mode"},{"id":"mls-v1-236","module":"v1","type":"mcq","q":"Which arm of a chromosome is the shorter one?","options":["The q arm","The p arm","The centromere","The telomere"],"answer":"The p arm","solution":"A: The q arm is longer\nB: The lecture states the shorter arm is p and the longer arm is q\nC: That is the constriction, not an arm\nD: That is the end of a chromosome","source":"Module 5-CELLULAR BASIS OF INHERITANCE-MITOSIS AND MEIOSIS-Nathaniel Yebuah.pdf | SLIDE 14","difficulty":"Medium"},{"id":"mls-v1-237","module":"v1","type":"mcq","q":"During which phase of interphase is DNA replicated?","options":["G1","G2","M phase","The S phase"],"answer":"The S phase","solution":"A: G1 is preparation for DNA synthesis\nB: G2 is preparation for mitosis\nC: Mitosis separates already replicated chromatids\nD: The lecture states DNA molecules are replicated during S phase","source":"Module 5-CELLULAR BASIS OF INHERITANCE-MITOSIS AND MEIOSIS-Nathaniel Yebuah.pdf | SLIDE 22","difficulty":"Medium"},{"id":"mls-v1-238","module":"v1","type":"mcq","q":"Which stage of mitosis is best for counting chromosomes because they are highly condensed?","options":["Late prophase","Interphase","Anaphase","Telophase"],"answer":"Late prophase","solution":"A: The lecture states late prophase is best for studying and counting chromosomes\nB: Chromosomes are not condensed and visible\nC: Chromatids are separating\nD: Nuclear membranes are reforming","source":"Module 5-CELLULAR BASIS OF INHERITANCE-MITOSIS AND MEIOSIS-Nathaniel Yebuah.pdf | SLIDE 30","difficulty":"Hard"},{"id":"mls-v1-239","module":"v1","type":"mcq","q":"What happens to sister chromatids during mitotic anaphase?","options":["They remain joined at the centromere","They separate and move to opposite poles","They are replicated","They fuse with homologous chromosomes"],"answer":"They separate and move to opposite poles","solution":"A: That is the case in meiotic anaphase I\nB: The lecture states anaphase is characterized by physical separation of sister chromatids\nC: Replication occurred in S phase\nD: That does not occur","source":"Module 5-CELLULAR BASIS OF INHERITANCE-MITOSIS AND MEIOSIS-Nathaniel Yebuah.pdf | SLIDE 35","difficulty":"Hard"},{"id":"mls-v1-240","module":"v1","type":"mcq","q":"Which type of cell division is described as reductional?","options":["Mitosis","Meiosis II","Meiosis I","Cytokinesis"],"answer":"Meiosis I","solution":"A: Mitosis is non-reductional\nB: Meiosis II is equational, like mitosis\nC: The lecture states the first meiotic division is reductional, reducing chromosome number by half\nD: That divides cytoplasm, not chromosomes","source":"Module 5-CELLULAR BASIS OF INHERITANCE-MITOSIS AND MEIOSIS-Nathaniel Yebuah.pdf | SLIDE 43","difficulty":"Devil Mode"},{"id":"mls-v1-241","module":"v1","type":"mcq","q":"What is crossing over?","options":["Exchange of segments between non-sister homologous chromatids","The random separation of whole chromosomes","The duplication of DNA before division","The fusion of two gametes"],"answer":"Exchange of segments between non-sister homologous chromatids","solution":"A: The lecture defines crossing over as exchange of genetic material producing recombination\nB: That is independent assortment\nC: That occurs in S phase\nD: That is fertilization","source":"Module 5-CELLULAR BASIS OF INHERITANCE-MITOSIS AND MEIOSIS-Nathaniel Yebuah.pdf | SLIDE 46","difficulty":"Medium"},{"id":"mls-v1-242","module":"v1","type":"mcq","q":"Into how many stages is prophase I subdivided?","options":["Two","Five","Three","Four"],"answer":"Five","solution":"A: That is not the stated number\nB: The lecture states prophase I events are complex and subdivided into five stages\nC: That is not the stated number\nD: That is not the stated number","source":"Module 5-CELLULAR BASIS OF INHERITANCE-MITOSIS AND MEIOSIS-Nathaniel Yebuah.pdf | SLIDE 48","difficulty":"Medium"},{"id":"mls-v1-243","module":"v1","type":"mcq","q":"What distinguishes anaphase I of meiosis from mitotic anaphase?","options":["Centromeres divide immediately","Homologous chromosomes do not move","Centromeres do not separate and sister chromatids stay together","No spindle is formed"],"answer":"Centromeres do not separate and sister chromatids stay together","solution":"A: That happens in mitotic anaphase and meiosis II\nB: They do move to opposite poles\nC: The lecture states centromeres remain intact in meiotic anaphase I\nD: A spindle is present","source":"Module 5-CELLULAR BASIS OF INHERITANCE-MITOSIS AND MEIOSIS-Nathaniel Yebuah.pdf | SLIDE 51","difficulty":"Hard"},{"id":"mls-v1-244","module":"v1","type":"mcq","q":"What is the period between meiosis I and meiosis II called?","options":["Interphase","S phase","Cytokinesis II","Interkinesis"],"answer":"Interkinesis","solution":"A: Interphase precedes meiosis I\nB: DNA replication does not occur between the divisions\nC: That follows meiosis II\nD: The lecture states the interval between the two divisions is interkinesis","source":"Module 5-CELLULAR BASIS OF INHERITANCE-MITOSIS AND MEIOSIS-Nathaniel Yebuah.pdf | SLIDE 55","difficulty":"Hard"},{"id":"mls-v1-245","module":"v1","type":"mcq","q":"Which meiotic event contributes to conservation of chromosome number across generations?","options":["Crossing over","The reduction of chromosome number by half in meiosis","DNA replication in S phase","Cytokinesis"],"answer":"The reduction of chromosome number by half in meiosis","solution":"A: That contributes variation, not number conservation\nB: The lecture lists conservation of chromosome number as a significance of meiosis\nC: Replication doubles, rather than conserves, across generations\nD: That divides cytoplasm","source":"Module 5-CELLULAR BASIS OF INHERITANCE-MITOSIS AND MEIOSIS-Nathaniel Yebuah.pdf | SLIDE 61","difficulty":"Devil Mode"},{"id":"mls-v1-246","module":"v1","type":"mcq","q":"What is euploidy?","options":["Gaining or losing single chromosomes","Having extra genes on a chromosome","Possessing one or more complete haploid sets of chromosomes","Having no chromosomes"],"answer":"Possessing one or more complete haploid sets of chromosomes","solution":"A: That is aneuploidy\nB: That is a duplication\nC: The lecture defines euploidy as involving complete sets\nD: That is not viable","source":"Module 6-VARIATIONS IN CHROMOSOME NUMBER-Nathaniel Yebuah.pdf | SLIDE 6","difficulty":"Medium"},{"id":"mls-v1-247","module":"v1","type":"mcq","q":"How can a triploid organism arise?","options":["By union of two haploid gametes","By somatic doubling of a diploid","By loss of one chromosome","By union of a haploid gamete (n) with a diploid gamete (2n)"],"answer":"By union of a haploid gamete (n) with a diploid gamete (2n)","solution":"A: That gives a diploid\nB: That gives a tetraploid\nC: That gives monosomy\nD: The lecture states triploids (3n) arise from n + 2n gametes","source":"Module 6-VARIATIONS IN CHROMOSOME NUMBER-Nathaniel Yebuah.pdf | SLIDE 8","difficulty":"Medium"},{"id":"mls-v1-248","module":"v1","type":"mcq","q":"Which chemical can induce tetraploidy by doubling chromosome number?","options":["Colchicine","Penicillin","Insulin","Ethanol"],"answer":"Colchicine","solution":"A: The lecture states tetraploids can be induced by chemicals such as colchicine\nB: That is an antibiotic\nC: That is a hormone\nD: That is not used for chromosome doubling","source":"Module 6-VARIATIONS IN CHROMOSOME NUMBER-Nathaniel Yebuah.pdf | SLIDE 9","difficulty":"Hard"},{"id":"mls-v1-249","module":"v1","type":"mcq","q":"Which mechanism produces aneuploidy through delayed chromosome movement at anaphase?","options":["Nondisjunctio
