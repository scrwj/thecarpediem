 cell\nB: The lecture states hormones are secreted into blood by endocrine cells\nC: Paracrine messengers act locally\nD: Neurotransmitters act across synapses","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 9","difficulty":"Medium"},{"id":"mls-v2-224","module":"v2","type":"mcq","q":"Which part of the pituitary accounts for about 75% of the gland?","options":["The posterior pituitary","The pars intermedia","The anterior pituitary","The infundibulum"],"answer":"The anterior pituitary","solution":"A: That is the smaller portion\nB: That is a small intermediate region\nC: The lecture states the anterior pituitary accounts for 75%\nD: That is the stalk","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 30","difficulty":"Hard"},{"id":"mls-v2-225","module":"v2","type":"mcq","q":"Which two hormones are released by the posterior pituitary?","options":["ADH and oxytocin","GH and prolactin","TSH and ACTH","Insulin and glucagon"],"answer":"ADH and oxytocin","solution":"A: The lecture lists antidiuretic hormone and oxytocin as the two posterior hormones\nB: These are anterior hormones\nC: These are anterior hormones\nD: These are pancreatic hormones","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 43","difficulty":"Hard"},{"id":"mls-v2-226","module":"v2","type":"mcq","q":"Where is ADH mainly synthesized?","options":["The posterior pituitary itself","The supraoptic nucleus of the hypothalamus","The thyroid gland","The adrenal medulla"],"answer":"The supraoptic nucleus of the hypothalamus","solution":"A: The posterior lobe stores and releases, not synthesizes\nB: The lecture states ADH is synthesized mainly by the supraoptic nucleus\nC: That produces T3/T4\nD: That produces catecholamines","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 48","difficulty":"Devil Mode"},{"id":"mls-v2-227","module":"v2","type":"mcq","q":"What is the major function of antidiuretic hormone?","options":["Increasing heart rate directly","Stimulating milk ejection","Retention of water by the kidneys","Lowering blood calcium"],"answer":"Retention of water by the kidneys","solution":"A: That is not its major action\nB: That is oxytocin\nC: The lecture lists water retention as the major function\nD: That is calcitonin","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 49","difficulty":"Medium"},{"id":"mls-v2-228","module":"v2","type":"mcq","q":"Which hormone is responsible for the milk-ejection reflex?","options":["Prolactin","ADH","Oestrogen","Oxytocin"],"answer":"Oxytocin","solution":"A: Prolactin stimulates milk production, not ejection\nB: ADH promotes water retention\nC: That is a steroid hormone\nD: The lecture describes oxytocin's action in the milk-ejection reflex","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 52","difficulty":"Medium"},{"id":"mls-v2-229","module":"v2","type":"mcq","q":"Which cells of the thyroid synthesize calcitonin?","options":["Follicular cells","Parafollicular (C) cells","Chief cells","Oncocytes"],"answer":"Parafollicular (C) cells","solution":"A: Follicular cells produce T3 and T4\nB: The lecture states C cells synthesize and secrete calcitonin\nC: Those are parathyroid cells\nD: Not the calcitonin source","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 65","difficulty":"Hard"},{"id":"mls-v2-230","module":"v2","type":"mcq","q":"What effect does parathyroid hormone have on blood calcium?","options":["It lowers blood calcium","It has no effect on calcium","It increases blood Ca²⁺ by stimulating bone resorption","It increases blood phosphate excretion only"],"answer":"It increases blood Ca²⁺ by stimulating bone resorption","solution":"A: That is calcitonin\nB: PTH is central to calcium homeostasis\nC: The lecture states PTH secretion is stimulated by hypocalcaemia and raises calcium\nD: That is only part of its action","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 70","difficulty":"Hard"},{"id":"mls-v2-231","module":"v2","type":"mcq","q":"Which part of the adrenal gland constitutes about 80% of its weight in adults?","options":["The adrenal medulla","The capsule","The hilum","The adrenal cortex"],"answer":"The adrenal cortex","solution":"A: The medulla forms about 20%\nB: That is a thin covering\nC: That is a vascular entry\nD: The lecture states the cortex is the outer region forming 80%","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 78","difficulty":"Devil Mode"},{"id":"mls-v2-232","module":"v2","type":"mcq","q":"Which adrenal cortex zone produces glucocorticoids such as cortisol?","options":["The zona fasciculata","Zona glomerulosa","Zona reticularis","The medulla"],"answer":"The zona fasciculata","solution":"A: The cortex has three zones, with glucocorticoids from the middle zone\nB: That produces mineralocorticoids\nC: That produces androgens\nD: That produces catecholamines","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 80","difficulty":"Medium"},{"id":"mls-v2-233","module":"v2","type":"mcq","q":"What proportion of adrenomedullary catecholamine output is epinephrine?","options":["About 20%","About 50%","About 80%","About 5%"],"answer":"About 80%","solution":"A: That is approximately the norepinephrine share\nB: That is not the stated proportion\nC: The lecture states epinephrine accounts for 80%\nD: That is too low","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 90","difficulty":"Medium"},{"id":"mls-v2-234","module":"v2","type":"mcq","q":"Which gland is often called the 'third eye' and secretes melatonin?","options":["The thyroid","The thymus","The pancreas","The pineal gland"],"answer":"The pineal gland","solution":"A: That secretes T3/T4\nB: That is involved in immune maturation\nC: That secretes insulin\nD: The lecture notes the pineal is mystically called the third eye and secretes melatonin","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 96","difficulty":"Hard"},{"id":"mls-v2-235","module":"v2","type":"mcq","q":"Which pancreatic cells secrete insulin?","options":["Beta cells","Alpha cells","Gamma cells","Delta cells"],"answer":"Beta cells","solution":"A: The lecture's islet table lists beta cells as insulin source\nB: Alpha cells secrete glucagon\nC: Gamma cells secrete pancreatic polypeptide\nD: Delta cells secrete somatostatin","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 104","difficulty":"Hard"},{"id":"mls-v2-236","module":"v2","type":"mcq","q":"Approximately what proportion of pancreatic mass is endocrine?","options":["About 85%","About 15%","About 50%","About 5%"],"answer":"About 15%","solution":"A: That is the exocrine portion\nB: The lecture states the endocrine portion is about 15%\nC: That is not the stated figure\nD: That is too low","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 102","difficulty":"Devil Mode"},{"id":"mls-v2-237","module":"v2","type":"mcq","q":"Which hormone class is derived from cholesterol?","options":["Peptide hormones","Amine hormones","Catecholamines","Steroid hormones"],"answer":"Steroid hormones","solution":"A: These are amino acid chains\nB: These derive from tyrosine or tryptophan\nC: These are amine hormones\nD: The lecture states steroid hormones are derived from cholesterol","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 112","difficulty":"Medium"},{"id":"mls-v2-238","module":"v2","type":"mcq","q":"Who coined the term homeostasis and in what year?","options":["Claude Bernard in 1865","Walter Cannon in 1932","Darwin in 1859","Galien in 100 AD"],"answer":"Claude Bernard in 1865","solution":"A: The lecture states Claude Bernard created the concept and wrote about it in 1865\nB: Cannon introduced the term 'homeostasis' in some texts but the lecture credits Bernard\nC: That is evolution\nD: That is not credited","source":"Homeostasis-Nathaniel Yebuah.pdf | SLIDE 3","difficulty":"Medium"},{"id":"mls-v2-239","module":"v2","type":"mcq","q":"Which homeostatic mechanism amplifies a change rather than reversing it?","options":["Negative feedback","Positive feedback","Feedforward","Homeostatic equilibrium"],"answer":"Positive feedback","solution":"A: Negative feedback reverses deviations\nB: The lecture states positive feedback increases the change\nC: Feedforward anticipates change\nD: That is a state, not a mechanism","source":"Homeostasis-Nathaniel Yebuah.pdf | SLIDE 22","difficulty":"Hard"},{"id":"mls-v2-240","module":"v2","type":"mcq","q":"Which is an example of feedforward control?","options":["Correcting a rise in blood pressure after it occurs","Clotting amplification","Anticipatory response before a change occurs","Uterine contractions"],"answer":"Anticipatory response before a change occurs","solution":"A: That is negative feedback\nB: That is positive feedback\nC: The lecture states feedforward responds in anticipation of a change\nD: That is positive feedback","source":"Homeostasis-Nathaniel Yebuah.pdf | SLIDE 27","difficulty":"Hard"},{"id":"mls-v2-241","module":"v2","type":"mcq","q":"Which three components form a homeostatic control system?","options":["Receptor, control centre and effector","Neuron, synapse and muscle","Sensory, motor and autonomic","Hormone, gland and target"],"answer":"Receptor, control centre and effector","solution":"A: The lecture describes these as the functional network of a control system\nB: That is a reflex arc\nC: Those are nervous divisions\nD: That is an endocrine axis","source":"Homeostasis-Nathaniel Yebuah.pdf | SLIDE 8","difficulty":"Devil Mode"},{"id":"mls-v2-242","module":"v2","type":"mcq","q":"Which epidermal layer is the deepest and also called stratum basale?","options":["Stratum corneum","Stratum germinativum","Stratum lucidum","Stratum spinosum"],"answer":"Stratum germinativum","solution":"A: That is the most superficial\nB: The lecture states stratum germinativum is the deepest layer\nC: That is found in thick skin\nD: That is above the basale","source":"INTEGUMENTARY SYSTEM-Nathaniel Yebuah.pdf | SLIDE 13","difficulty":"Medium"},{"id":"mls-v2-243","module":"v2","type":"mcq","q":"How many layers does thin skin have?","options":["Five","Three","Four","Six"],"answer":"Four","solution":"A: That is thick skin\nB: That is not the stated number\nC: The lecture states thin skin has four epidermal layers\nD: That is not the stated number","source":"INTEGUMENTARY SYSTEM-Nathaniel Yebuah.pdf | SLIDE 8","difficulty":"Medium"},{"id":"mls-v2-244","module":"v2","type":"mcq","q":"Which layer of the dermis is made of loose areolar connective tissue?","options":["The reticular layer","The hypodermis","The epidermis","The papillary layer"],"answer":"The papillary layer","solution":"A: That is dense irregular connective tissue\nB: That is subcutaneous fat\nC: That is epithelial\nD: The lecture describes the papillary layer as loose areolar tissue","source":"INTEGUMENTARY SYSTEM-Nathaniel Yebuah.pdf | SLIDE 24","difficulty":"Hard"},{"id":"mls-v2-245","module":"v2","type":"mcq","q":"What is another name for the hypodermis?","options":["The dermis","The superficial fascia","The stratum corneum","The peritoneum"],"answer":"The superficial fascia","solution":"A: That is above the hypodermis\nB: The lecture states the hypodermis is also called the subcutaneous layer or superficial fascia\nC: That is epidermal\nD: That is an abdominal membrane","source":"INTEGUMENTARY SYSTEM-Nathaniel Yebuah.pdf | SLIDE 28","difficulty":"Hard"},{"id":"mls-v2-246","module":"v2","type":"mcq","q":"How many fundamental levels of organization does the physiology lecture list?","options":["Four","Five","Six","Seven"],"answer":"Six","solution":"A: That is not the stated number\nB: That is not the stated number\nC: The lecture states the human body is organized into six levels\nD: That is not the stated number","source":"Intro to General physiology-Nathaniel Yebuah.pdf | SLIDE 11","difficulty":"Devil Mode"},{"id":"mls-v2-247","module":"v2","type":"mcq","q":"What percentage of body weight is total body water in a 70 kg adult man?","options":["About 40%","About 20%","About 73%","About 60%"],"answer":"About 60%","solution":"A: That is intracellular fluid as a percentage of weight\nB: That is extracellular fluid\nC: That is the water fraction of fat-free tissue\nD: The lecture states total body water is about 60% of body weight, roughly 42 L","source":"Intro to General physiology-Nathaniel Yebuah.pdf | SLIDE 22","difficulty":"Medium"},{"id":"mls-v2-248","module":"v2","type":"mcq","q":"Which marker substance is used to measure total body water?","options":["Deuterium oxide","Radioiodinated human serum albumin","Inulin","Evans blue dye"],"answer":"Deuterium oxide","solution":"A: The lecture lists deuterium oxide among markers for total body water\nB: That is used for plasma volume\nC: That measures extracellular fluid\nD: That measures plasma volume","source":"Intro to General physiology-Nathaniel Yebuah.pdf | SLIDE 33","difficulty":"Medium"},{"id":"mls-v2-249","module":"v2","type":"mcq","q":"What is the approximate concentration of sodium in the extracellular fluid?","options":["10–15 mmol/L","140–150 mmol/L","135–145 mmol/L","3.5–5 mmol/L"],"answer":"135–145 mmol/L","solution":"A: That is intracellular sodium\nB: That is intracellular potassium\nC: The composition table gives ECF sodium as 135–145\nD: That is extracellular potassium","source":"Intro to General physiology-Nathaniel Yebuah.pdf | SLIDE 27","difficulty":"Hard"},{"id":"mls-v2-250","module":"v2","type":"mcq","q":"Which characteristic should a marker substance NOT have when measuring fluid compartments?","options":["Water soluble","Nontoxic","Not rapidly metabolised","It should be toxic"],"answer":"It should be toxic","solution":"A: Markers should be water soluble\nB: That is required\nC: Markers should remain stable\nD: The lecture states markers must be nontoxic","source":"Intro to General physiology-Nathaniel Yebuah.pdf | SLIDE 32","difficulty":"Hard"},{"id":"mls-v2-251","module":"v2","type":"mcq","q":"What is the fluid mosaic model of the cell membrane?","options":["A lipid bilayer with embedded proteins","A single layer of protein","A solid sheet of lipid only","A carbohydrate bilayer"],"answer":"A lipid bilayer with embedded proteins","solution":"A: The lecture describes the membrane as a lipid bilayer embedded with proteins\nB: That is not the model\nC: Proteins are embedded\nD: Carbohydrates are a minor component","source":"Intro to General physiology-Nathaniel Yebuah.pdf | SLIDE 63","difficulty":"Devil Mode"},{"id":"mls-v2-252","module":"v2","type":"mcq","q":"Which molecules form the main lipid component of the cell membrane?","options":["Triglycerides","Phospholipids","Cholesterol alone","Steroid hormones"],"answer":"Phospholipids","solution":"A: These are storage lipids\nB: The lecture states phospholipids are the main membrane lipids\nC: Cholesterol is interdigitated but not the main bilayer\nD: These are signalling molecules","source":"Intro to General physiology-Nathaniel Yebuah.pdf | SLIDE 43","difficulty":"Medium"},{"id":"mls-v2-253","module":"v2","type":"mcq","q":"What is facilitated diffusion?","options":["Active transport using ATP","Transport against a gradient","Vesicular transport","Carrier-mediated passive transport down a gradient without ATP"],"answer":"Carrier-mediated passive transport down a gradient without ATP","solution":"A: That is different\nB: That is active transport\nC: That is bulk transport\nD: The lecture states facilitated diffusion needs no ATP and moves substances downhill","source":"Intro to General physiology-Nathaniel Yebuah.pdf | SLIDE 78","difficulty":"Medium"},{"id":"mls-v2-254","module":"v2","type":"mcq","q":"How many sodium ions does the Na⁺/K⁺ ATPase pump out per cycle?","options":["3","2","1","4"],"answer":"3","solution":"A: The lecture states the pump moves 3 Na⁺ out and 2 K⁺ in\nB: That is the number of potassium ions moved in\nC: That is not the stoichiometry\nD: That is not the stated stoichiometry","source":"Intro to General physiology-Nathaniel Yebuah.pdf | SLIDE 101","difficulty":"Hard"},{"id":"mls-v2-255","module":"v2","type":"mcq","q":"Which transport mechanism moves water across a semipermeable membrane toward higher solute concentration?","options":["Filtration","Osmosis","Diffusion of ions","Active transport"],"answer":"Osmosis","solution":"A: Filtration is driven by hydrostatic pressure\nB: The lecture describes osmosis as water movement until concentrations equilibrate\nC: That is ionic diffusion\nD: That requires ATP","source":"Intro to General physiology-Nathaniel Yebuah.pdf | SLIDE 88","difficulty":"Hard"},{"id":"mls-v2-256","module":"v2","type":"mcq","q":"A red cell placed in a hypotonic solution will do what?","options":["Shrink","Remain unchanged","Swell and possibly lyse","Become crenated"],"answer":"Swell and possibly lyse","solution":"A: That happens in hypertonic solution\nB: That happens in isotonic solution\nC: Water enters the cell when ECF non-penetrating solute is lower\nD: That is shrinkage","source":"Intro to General physiology-Nathaniel Yebuah.pdf | SLIDE 92","difficulty":"Devil Mode"},{"id":"mls-v2-257","module":"v2","type":"mcq","q":"What is the functional contractile unit of skeletal muscle?","options":["The sarcomere","The fascicle","The myofibril","The myofilament"],"answer":"The sarcomere","solution":"A: The review test asks this and the answer is sarcomere\nB: That is a bundle of fibres\nC: That contains many sarcomeres\nD: That is a protein filament","source":"Muscle Tissue-Nathaniel Yebuah.pdf | SLIDE 29","difficulty":"Medium"},{"id":"mls-v2-258","module":"v2","type":"mcq","q":"Which protein makes up the thick myofilaments?","options":["Actin","Myosin","Troponin","Tropomyosin"],"answer":"Myosin","solution":"A: Actin forms thin filaments\nB: The lecture states thick filaments are composed of myosin\nC: That is a regulatory thin-filament protein\nD: That is a thin-filament protein","source":"Muscular System-Nathaniel Yebuah.pdf | SLIDE 34","difficulty":"Medium"},{"id":"mls-v2-259","module":"v2","type":"mcq","q":"Which band of the sarcomere contains only thin filaments at its outer regions?","options":["The A band","The Z disc","The I band","The H zone"],"answer":"The I band","solution":"A: The A band contains thick filaments\nB: That is a boundary\nC: The lecture states the I band contains thin actin filaments\nD: That is within the A band","source":"Muscle Tissue-Nathaniel Yebuah.pdf | SLIDE 40","difficulty":"Hard"},{"id":"mls-v2-260","module":"v2","type":"mcq","q":"What triggers cross-bridge formation in muscle contraction?","options":["ATP binding to myosin alone","Potassium influx","Sodium efflux","Exposure of myosin-binding sites on actin after Ca²⁺ binds troponin"],"answer":"Exposure of myosin-binding sites on actin after Ca²⁺ binds troponin","solution":"A: ATP binding causes detachment\nB: That is not the trigger\nC: That is not the trigger\nD: The lecture states Ca²⁺ release allows myosin heads to bind actin","source":"Muscular System-Nathaniel Yebuah.pdf | SLIDE 61","difficulty":"Hard"},{"id":"mls-v2-261","module":"v2","type":"mcq","q":"What is required for cross-bridge detachment?","options":["Calcium removal alone","Binding of a new ATP molecule","ADP release only","Potassium binding"],"answer":"Binding of a new ATP molecule","solution":"A: Calcium removal leads to relaxation after detachment\nB: The lecture states another ATP is required for detachment\nC: ADP release is part of the power stroke\nD: That is not involved","source":"Muscular System-Nathaniel Yebuah.pdf | SLIDE 63","difficulty":"Devil Mode"},{"id":"mls-v2-262","module":"v2","type":"mcq","q":"Which type of contraction develops tension without changing muscle length?","options":["Isotonic contraction","Concentric contraction","Isometric contraction","Eccentric contraction"],"answer":"Isometric contraction","solution":"A: That moves a load\nB: That shortens the muscle\nC: The lecture defines isometric contraction this way\nD: That lengthens under load","source":"Muscular System-Nathaniel Yebuah.pdf | SLIDE 73","difficulty":"Medium"},{"id":"mls-v2-263","module":"v2","type":"mcq","q":"What are neuroglia?","options":["Neurons that transmit impulses","Only found in the PNS","Cells that produce hormones","Support cells that outnumber neurons about 10 to 1"],"answer":"Support cells that outnumber neurons about 10 to 1","solution":"A: That is the neuron\nB: Glia occur in CNS and PNS\nC: That is endocrine cells\nD: The lecture states neuroglia outnumber neurons roughly 10:1","source":"Nervous System-Nathaniel Yebuah.pdf | SLIDE 11","difficulty":"Medium"},{"id":"mls-v2-264","module":"v2","type":"mcq","q":"Which glial cells produce myelin in the CNS?","options":["Oligodendrocytes","Schwann cells","Astrocytes","Microglia"],"answer":"Oligodendrocytes","solution":"A: The lecture states oligodendrocytes produce myelin in the CNS\nB: These produce myelin in the PNS\nC: These buffer ions and support neurons\nD: These are immune cells","source":"Nervous System-Nathaniel Yebuah.pdf | SLIDE 20","difficulty":"Hard"},{"id":"mls-v2-265","module":"v2","type":"mcq","q":"Which equation calculates the equilibrium potential for a single ion?","options":["Goldman-Hodgkin-Katz equation","Ohm's law","The Nernst equation","Beer-Lambert law"],"answer":"The Nernst equation","solution":"A: That combines multiple ions\nB: That relates V, I and R\nC: The lecture states the Nernst equation gives the exact voltage for a specific ion\nD: That relates absorbance to concentration","source":"Nervous System-Nathaniel Yebuah.pdf | SLIDE 44","difficulty":"Hard"},{"id":"mls-v2-266","module":"v2","type":"mcq","q":"What is saltatory conduction?","options":["Continuous conduction along every point","Passive decay of a graded potential","Synaptic transmission","Action potentials jumping between nodes of Ranvier"],"answer":"Action potentials jumping between nodes of Ranvier","solution":"A: That is unmyelinated conduction\nB: That is not saltatory\nC: That is between neurons\nD: The lecture states depolarization occurs only at nodes in myelinated fibres","source":"Nervous System-Nathaniel Yebuah.pdf | SLIDE 74","difficulty":"Devil Mode"},{"id":"mls-v2-267","module":"v2","type":"mcq","q":"During which period can a second action potential be produced only by a stronger stimulus?","options":["The relative refractory period","Absolute refractory period","Resting period","Latent period"],"answer":"The relative refractory period","solution":"A: The lecture states another AP can be produced with a stronger stimulus\nB: No stimulus can produce an AP\nC: That is not a refractory phase\nD: That is the delay before contraction","source":"Nervous System-Nathaniel Yebuah.pdf | SLIDE 79","difficulty":"Medium"},{"id":"mls-v2-268","module":"v2","type":"mcq","q":"Which neurotransmitter is described as excitatory and acting on AMPA, kainate and NMDA receptors?","options":["GABA","Glutamate","Acetylcholine","Dopamine"],"answer":"Glutamate","solution":"A: GABA is generally inhibitory\nB: The lecture states glutamate acts on three ionotropic receptor subtypes\nC: Acts on nicotinic and muscarinic receptors\nD: Acts on five receptor types","source":"Nervous System-Nathaniel Yebuah.pdf | SLIDE 89","difficulty":"Medium"},{"id":"mls-v2-269","module":"v2","type":"mcq","q":"Which receptor type mediates fast synaptic transmission by directly opening ion channels?","options":["Metabotropic receptors","Nuclear receptors","Enzyme-linked receptors","Ionotropic receptors"],"answer":"Ionotropic receptors","solution":"A: These use second messengers\nB: These act on gene transcription\nC: These use enzyme cascades\nD: The lecture describes direct activation of ion channels as ionotropic","source":"Sensory Physiology-Nathaniel Yebuah .pdf | SLIDE 28","difficulty":"Hard"},{"id":"mls-v2-270","module":"v2","type":"mcq","q":"Which sensory receptors detect pressure?","options":["Baroreceptors","Thermoreceptors","Photoreceptors","Nociceptors"],"answer":"Baroreceptors","solution":"A: The lecture states baroreceptors detect pressure\nB: These detect temperature\nC: These detect light\nD: These detect pain","source":"Sensory Physiology-Nathaniel Yebuah .pdf | SLIDE 15","difficulty":"Hard"},{"id":"mls-v2-271","module":"v2","type":"mcq","q":"What is sensory adaptation?","options":["Increased sensitivity with repeated stimulation","Reduced responsiveness during prolonged stimulation","Complete loss of receptor function","Conversion of stimulus energy"],"answer":"Reduced responsiveness during prolonged stimulation","solution":"A: That is sensitization\nB: The lecture states receptors may stop responding over time\nC: Adaptation is reversible\nD: That is transduction","source":"Sensory Physiology-Nathaniel Yebuah .pdf | SLIDE 17","difficulty":"Devil Mode"},{"id":"mls-v2-272","module":"v2","type":"mcq","q":"Where does spermatogenesis occur?","options":["In the epididymis","In the seminal vesicles","In the seminiferous tubules of the testes","In the vas deferens"],"answer":"In the seminiferous tubules of the testes","solution":"A: The epididymis matures sperm\nB: These produce fluid\nC: The lecture states seminiferous tubules produce sperm\nD: That transports sperm","source":"Male reproductive system-Nathaniel Yebuah.pdf | SLIDE 18","difficulty":"Medium"},{"id":"mls-v2-273","module":"v2","type":"mcq","q":"What is capacitation?","options":["Physiological changes that give sperm the ability to fertilize","The release of sperm from the testis","The acrosome reaction itself","The maturation of sperm in the epididymis"],"answer":"Physiological changes that give sperm the ability to fertilize","solution":"A: The lecture defines capacitation as modifications enabling fertilization\nB: That is spermiation\nC: That follows capacitation\nD: That is epididymal maturation","source":"Male reproductive system-Nathaniel Yebuah.pdf | SLIDE 61","difficulty":"Medium"},{"id":"mls-v2-274","module":"v2","type":"mcq","q":"How is psychology defined in the overview lecture?","options":["The study of body structures only","The scientific study of behaviour and mental processes","The treatment of physical disease only","The study of animal classification"],"answer":"The scientific study of behaviour and mental processes","solution":"A: That is anatomy\nB: The lecture presents psychology as the study of behaviour and the mind\nC: That is medicine\nD: That is taxonomy","source":"Week 1- Overview of Psychology – Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Hard"},{"id":"mls-v2-275","module":"v2","type":"mcq","q":"Which research method involves studying one individual in depth over an extended period?","options":["Naturalistic observation","Survey research","A case study","Correlational study"],"answer":"A case study","solution":"A: That observes behaviour in natural settings\nB: That uses questionnaires and interviews\nC: The lecture defines case studies this way\nD: That examines relationships between variables","source":"Week 1- Overview of Psychology – Nathaniel Yebuah.pdf | SLIDE 62","difficulty":"Hard"},{"id":"mls-v2-276","module":"v2","type":"mcq","q":"What is the observer effect in naturalistic observation?","options":["The researcher's bias in recording data","The sample being too small","The use of questionnaires","Changes in behaviour caused by awareness of being observed"],"answer":"Changes in behaviour caused by awareness of being observed","solution":"A: That is observer bias\nB: That is a sampling issue\nC: That is survey research\nD: The lecture defines the observer effect in these terms","source":"Week 1- Overview of Psychology – Nathaniel Yebuah.pdf | SLIDE 61","difficulty":"Devil Mode"},{"id":"mls-v2-277","module":"v2","type":"mcq","q":"Which sampling technique ensures each individual has an equal chance of selection?","options":["Convenience sampling","Random sampling","Stratified sampling","Purposive sampling"],"answer":"Random sampling","solution":"A: That selects readily available participants\nB: The lecture defines random sampling as giving each individual an equal chance\nC: That divides the population into strata\nD: That selects for a purpose","source":"Week 1- Overview of Psychology – Nathaniel Yebuah.pdf | SLIDE 66","difficulty":"Medium"},{"id":"mls-v2-278","module":"v2","type":"mcq","q":"In a correlation, what does a negative coefficient indicate?","options":["A causal relationship","A direct relationship","An inverse relationship between variables","No relationship"],"answer":"An inverse relationship between variables","solution":"A: Correlation does not imply causation\nB: That is a positive correlation\nC: The lecture states low scores on one variable pair with high scores on the other\nD: That is a coefficient near zero","source":"Week 1- Overview of Psychology – Nathaniel Yebuah.pdf | SLIDE 70","difficulty":"Medium"},{"id":"mls-v2-279","module":"v2","type":"mcq","q":"What is a key limitation of correlational studies?","options":["They cannot use large samples","They are always unethical","They cannot measure variables","Causality cannot be inferred"],"answer":"Causality cannot be inferred","solution":"A: They can\nB: They are not inherently unethical\nC: They can\nD: The lecture states confounding variables prevent causal conclusions","source":"Week 1- Overview of Psychology – Nathaniel Yebuah.pdf | SLIDE 73","difficulty":"Hard"},{"id":"mls-v2-280","module":"v2","type":"mcq","q":"Which ethical requirement involves explaining a study to participants before they agree?","options":["Informed consent","Debriefing only","Anonymity alone","Assent only for adults"],"answer":"Informed consent","solution":"A: The lecture lists informed consent among ethical considerations\nB: Debriefing follows participation\nC: That is a different requirement\nD: Assent is for vulnerable groups","source":"Week 1- Overview of Psychology – Nathaniel Yebuah.pdf | SLIDE 74","difficulty":"Hard"},{"id":"mls-v2-281","module":"v2","type":"mcq","q":"What is psychic determinism in the psychodynamic approach?","options":["The belief that behaviour is random","The idea that all behaviour is learned","The belief that behaviour originates from childhood experiences in the unconscious","The idea that biology alone determines behaviour"],"answer":"The belief that behaviour originates from childhood experiences in the unconscious","solution":"A: That is not psychic determinism\nB: That is behaviourism\nC: The lecture defines psychic determinism in these terms\nD: That is biological determinism","source":"week 2- Nathaniel Yebuah.pdf | SLIDE 8","difficulty":"Devil Mode"},{"id":"mls-v2-282","module":"v2","type":"mcq","q":"According to Freud, which structure operates on the reality principle?","options":["The id","The superego","The unconscious","The ego"],"answer":"The ego","solution":"A: The id operates on the pleasure principle\nB: The superego is the moral judge\nC: That is a level of awareness\nD: The lecture states the ego mediates between id desires and superego standards","source":"week 2- Nathaniel Yebuah.pdf | SLIDE 13","difficulty":"Medium"},{"id":"mls-v2-283","module":"v2","type":"mcq","q":"Which defence mechanism involves expressing an impulse against a substitute target?","options":["Displacement","Projection","Denial","Rationalisation"],"answer":"Displacement","solution":"A: The lecture defines displacement in these terms\nB: That attributes one's feelings to others\nC: That refuses to acknowledge reality\nD: That makes excuses","source":"week 2- Nathaniel Yebuah.pdf | SLIDE 15","difficulty":"Medium"},{"id":"mls-v2-284","module":"v2","type":"mcq","q":"Which approach is called the 'third force' in psychology?","options":["Cognitive psychology","Humanistic psychology","Biological psychology","Behaviourism"],"answer":"Humanistic psychology","solution":"A: That is not called the third force\nB: The lecture states humanism emerged after psychodynamic and behaviourist approaches\nC: That is not called the third force\nD: That preceded humanism","source":"week 2- Nathaniel Yebuah.pdf | SLIDE 30","difficulty":"Hard"},{"id":"mls-v2-285","module":"v2","type":"mcq","q":"What does Maslow's hierarchy place at the highest level?","options":["Physiological needs","Safety needs","Love and belonging","Self-actualisation"],"answer":"Self-actualisation","solution":"A: That is the base\nB: That is the second level\nC: That is a middle level\nD: The lecture places self-actualisation at the top of the hierarchy","source":"week 2- Nathaniel Yebuah.pdf | SLIDE 35","difficulty":"Hard"},{"id":"mls-v2-286","module":"v2","type":"mcq","q":"What is a schema in cognitive psychology?","options":["A cognitive structure holding knowledge about a thing","A type of memory test","A nerve cell","A social rule"],"answer":"A cognitive structure holding knowledge about a thing","solution":"A: The lecture defines schemas this way\nB: That is different\nC: That is a neuron\nD: That is a norm","source":"week 2- Nathaniel Yebuah.pdf | SLIDE 47","difficulty":"Devil Mode"},{"id":"mls-v2-287","module":"v2","type":"mcq","q":"Which division of the nervous system controls voluntary muscles?","options":["The autonomic nervous system","The somatic nervous system","The sympathetic division","The parasympathetic division"],"answer":"The somatic nervous system","solution":"A: That controls involuntary muscles\nB: The lecture states the SNS controls voluntary muscles\nC: That prepares for action\nD: That conserves energy","source":"week 3-Nathaniel Yebuah.pdf | SLIDE 9","difficulty":"Medium"},{"id":"mls-v2-288","module":"v2","type":"mcq","q":"What is the function of the sympathetic nervous system?","options":["Conserving energy","Digesting food","Preparing the body for action in emergencies","Promoting sleep"],"answer":"Preparing the body for action in emergencies","solution":"A: That is parasympathetic\nB: That is parasympathetic\nC: The lecture states the sympathetic system prepares the body\nD: That is parasympathetic","source":"week 3-Nathaniel Yebuah.pdf | SLIDE 11","difficulty":"Medium"},{"id":"mls-v2-289","module":"v2","type":"mcq","q":"In Piaget's theory, what is assimilation?","options":["Interpreting new experiences using existing schemas","Changing schemas to fit new experiences","Forgetting experiences","Rejecting new information"],"answer":"Interpreting new experiences using existing schemas","solution":"A: The lecture states we assimilate new experiences into existing schemas\nB: That is accommodation\nC: That is not assimilation\nD: That is not assimilation","source":"Week 4- Developmental Psychology – Nathaniel Yebuah.pdf | SLIDE 20","difficulty":"Hard"},{"id":"mls-v2-290","module":"v2","type":"mcq","q":"Which attachment style describes infants who seek contact but angrily resist it on return?","options":["Secure attachment","Insecure-ambivalent attachment","Insecure-avoidant attachment","Disorganised attachment"],"answer":"Insecure-ambivalent attachment","solution":"A: These infants use the caregiver as a base\nB: The lecture defines this style\nC: These avoid contact\nD: That is a different pattern","source":"Week 4- Developmental Psychology – Nathaniel Yebuah.pdf | SLIDE 25","difficulty":"Hard"},{"id":"mls-v2-291","module":"v2","type":"mcq","q":"Which parenting style is both demanding and responsive?","options":["Authoritarian","Permissive","Authoritative","Neglectful"],"answer":"Authoritative","solution":"A: These impose rules and expect obedience\nB: These are undemanding and responsive\nC: The lecture describes authoritative parents as demanding and responsive\nD: These are undemanding and unresponsive","source":"Week 4- Developmental Psychology – Nathaniel Yebuah.pdf | SLIDE 27","difficulty":"Devil Mode"},{"id":"mls-v2-292","module":"v2","type":"mcq","q":"According to the lecture, which moral theorist posed dilemmas such as stealing medicine?","options":["Piaget","Erikson","Freud","Kohlberg"],"answer":"Kohlberg","solution":"A: Piaget studied moral judgement but the dilemma example is Kohlberg\nB: Erikson studied psychosocial development\nC: Freud studied psychosexual development\nD: The lecture states Kohlberg posed moral dilemmas","source":"Week 4- Developmental Psychology – Nathaniel Yebuah.pdf | SLIDE 36","difficulty":"Medium"},{"id":"mls-v2-293","module":"v2","type":"mcq","q":"Which theorist proposed psychosocial stages with a crisis at each stage?","options":["Jean Piaget","Erik Erikson","Sigmund Freud","Lawrence Kohlberg"],"answer":"Erik Erikson","solution":"A: Piaget proposed cognitive stages\nB: The lecture states Erikson contended each life stage has a psychosocial task\nC: Freud proposed psychosexual stages\nD: Kohlberg proposed moral stages","source":"Week 4- Developmental Psychology – Nathaniel Yebuah.pdf | SLIDE 38","difficulty":"Medium"},{"id":"mls-v2-294","module":"v2","type":"mcq","q":"What is crystallized intelligence?","options":["The ability to reason novel problems","Memory span only","Accumulated knowledge and verbal skills","Speed of processing"],"answer":"Accumulated knowledge and verbal skills","solution":"A: That is fluid intelligence\nB: That is not the definition\nC: The lecture defines crystallized intelligence in these terms\nD: That is not the definition","source":"Week 4- Developmental Psychology – Nathaniel Yebuah.pdf | SLIDE 49","difficulty":"Hard"},{"id":"mls-v2-295","module":"v2","type":"mcq","q":"How is learning defined in the learning lecture?","options":["A temporary change in mood","A change caused only by maturation","The inheritance of behaviour","A relatively permanent change in behaviour due to experience"],"answer":"A relatively permanent change in behaviour due to experience","solution":"A: That is not learning\nB: Maturation is distinguished from learning\nC: That is instinct\nD: The lecture defines learning in exactly these terms","source":"Week 5- Learning –Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Hard"},{"id":"mls-v2-296","module":"v2","type":"mcq","q":"In classical conditioning, what is an unconditioned stimulus?","options":["A stimulus that elicits a reflexive response without learning","A stimulus that elicits a response only after pairing","A learned response","A neutral stimulus after conditioning"],"answer":"A stimulus that elicits a reflexive response without learning","solution":"A: The lecture defines the US this way\nB: That is a conditioned stimulus\nC: That is a conditioned response\nD: That becomes a CS","source":"Week 5- Learning –Nathaniel Yebuah.pdf | SLIDE 7","difficulty":"Devil Mode"},{"id":"mls-v2-297","module":"v2","type":"mcq","q":"What is spontaneous recovery?","options":["The disappearance of a response","The first pairing of stimuli","The reappearance of a learned response after apparent extinction","A response to a similar stimulus"],"answer":"The reappearance of a learned response after apparent extinction","solution":"A: That is extinction\nB: That is acquisition\nC: The lecture defines spontaneous recovery this way\nD: That is generalisation","source":"Week 5- Learning –Nathaniel Yebuah.pdf | SLIDE 11","difficulty":"Medium"},{"id":"mls-v2-298","module":"v2","type":"mcq","q":"Which schedule of reinforcement rewards a response after a specified number of responses?","options":["Fixed-interval","Variable-ratio","Continuous","Fixed-ratio"],"answer":"Fixed-ratio","solution":"A: That reinforces after a time period\nB: That reinforces after an unpredictable number\nC: That reinforces every response\nD: The lecture defines fixed-ratio schedules this way","source":"Week 5- Learning –Nathaniel Yebuah.pdf | SLIDE 23","difficulty":"Medium"},{"id":"mls-v2-299","module":"v2","type":"mcq","q":"What is negative reinforcement?","options":["Increasing behaviour by removing an unpleasant stimulus","Punishment with an aversive stimulus","Decreasing behaviour by removing a reward","Giving a reward after a response"],"answer":"Increasing behaviour by removing an unpleasant stimulus","solution":"A: The lecture defines negative reinforcement this way\nB: That is positive punishment\nC: That is negative punishment\nD: That is positive reinforcement","source":"Week 5- Learning –Nathaniel Yebuah.pdf | SLIDE 19","difficulty":"Hard"},{"id":"mls-v2-300","module":"v2","type":"mcq","q":"How does classical conditioning differ from operant conditioning regarding reinforcement timing?","options":["In both, reinforcement follows the response","Classical pairs before the response; operant rewards after it","In classical conditioning there is no reinforcement at all","In operant conditioning reinforcement precedes the response"],"answer":"Classical pairs before the response; operant rewards after it","solution":"A: That is not the stated contrast\nB: The lecture states this contrast explicitly\nC: The CS-US pairing is reinforcing\nD: That is reversed","source":"Week 5- Learning –Nathaniel Yebuah.pdf | SLIDE 37","difficulty":"Hard"},{"id":"mls-v2-301","module":"v2","type":"mcq","q":"What is learned helplessness?","options":["Increased motivation after success","An instinctive behaviour","Memory loss after trauma","A belief that control is impossible after repeated failures"],"answer":"A belief that control is impossible after repeated failures","solution":"A: That is the opposite\nB: That is not learned\nC: That is different\nD: The lecture defines learned helplessness this way","source":"Week 5- Learning –Nathaniel Yebuah.pdf | SLIDE 42","difficulty":"Devil Mode"},{"id":"mls-v2-302","module":"v2","type":"mcq","q":"What is modelling in observational learning?","options":["Observing and imitating a specific behaviour","Reinforcing a response directly","Forgetting an observed action","Developing a phobia"],"answer":"Observing and imitating a specific behaviour","solution":"A: The lecture defines modelling this way\nB: That is operant conditioning\nC: That is not modelling\nD: That is not modelling","source":"Week 5- Learning –Nathaniel Yebuah.pdf | SLIDE 43","difficulty":"Medium"},{"id":"mls-v2-303","module":"v2","type":"mcq","q":"How is motivation defined in the motivation lecture?","options":["A purely external reward","An internal state that activates and directs behaviour","An emotional reaction only","A reflex"],"answer":"An internal state that activates and directs behaviour","solution":"A: That is an incentive\nB: The lecture gives this definition\nC: That is emotion\nD: That is not motivation","source":"week 7-Motivation-Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Medium"},{"id":"mls-v2-304","module":"v2","type":"mcq","q":"Which motivation theory emphasizes internal tension from unmet biological needs?","options":["Incentive theory","Instinct theory","Drive-reduction theory","Arousal theory"],"answer":"Drive-reduction theory","solution":"A: That emphasizes external goals\nB: That emphasizes inherited tendencies\nC: The lecture states drive-reduction theory emerged from this idea\nD: That emphasizes optimal activation","source":"week 7-Motivation-Nathaniel Yebuah.pdf | SLIDE 10","difficulty":"Hard"},{"id":"mls-v2-305","module":"v2","type":"mcq","q":"What is an incentive according to the motivation lecture?","options":["The pull of an external goal or reward","An internal drive only","A physiological need","A reflex arc"],"answer":"The pull of an external goal or reward","solution":"A: The lecture states incentive value is the goal's appeal\nB: That is drive-reduction\nC: That creates a drive\nD: That is not an incentive","source":"week 7-Motivation-Nathaniel Yebuah.pdf | SLIDE 18","difficulty":"Hard"},{"id":"mls-v2-306","module":"v2","type":"mcq","q":"Which type of motivation involves engaging in an activity because it is personally rewarding?","options":["Extrinsic motivation","Intrinsic motivation","Primary motivation","Social motivation"],"answer":"Intrinsic motivation","solution":"A: That involves external rewards\nB: The lecture defines intrinsic motivation this way\nC: That is based on biological needs\nD: That is learned socially","source":"week 7-Motivation-Nathaniel Yebuah.pdf | SLIDE 21","difficulty":"Devil Mode"},{"id":"mls-v2-307","module":"v2","type":"mcq","q":"What is emotional intelligence?","options":["A measure of intelligence quotient only","The ability to suppress all emotion","The ability to understand and use emotions in decisions","A physical reflex"],"answer":"The ability to understand and use emotions in decisions","solution":"A: That is IQ\nB: That is not emotional intelligence\nC: The lecture defines emotional intelligence this way\nD: That is not emotional intelligence","source":"week 7-Motivation-Nathaniel Yebuah.pdf | SLIDE 48","difficulty":"Medium"},{"id":"mls-v2-308","module":"v2","type":"mcq","q":"What is personality according to the personality lecture?","options":["A temporary mood","A single behaviour","An inherited disease","An individual's characteristic pattern of thinking, feeling and acting"],"answer":"An individual's characteristic pattern of thinking, feeling and acting","solution":"A: Personality is enduring\nB: Personality is a pattern\nC: That is not personality\nD: The lecture gives this definition","source":"Week 8 - Personality-Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Medium"},{"id":"mls-v2-309","module":"v2","type":"mcq","q":"In Freud's model, which structure is totally unconscious and impulsive?","options":["The ego","The id","The superego","The persona"],"answer":"The id","solution":"A: The ego is the mediator\nB: The lecture states the id is made of innate instincts, impulsive and unconscious\nC: The superego is the moral censor\nD: That is Jung's concept","source":"Week 8 - Personality-Nathaniel Yebuah.pdf | SLIDE 15","difficulty":"Hard"},{"id":"mls-v2-310","module":"v2","type":"mcq","q":"Which psychosexual stage occurs from ages 3 to 6?","options":["Oral stage","Anal stage","The phallic stage","Genital stage"],"answer":"The phallic stage","solution":"A: That is 0–1 year\nB: That is 1–3 years\nC: The lecture lists the phallic stage for ages 3–6\nD: That begins at puberty","source":"Week 8 - Personality-Nathaniel Yebuah.pdf | SLIDE 32","difficulty":"Hard"},{"id":"mls-v2-311","module":"v2","type":"mcq","q":"Which theory proposes three trait dimensions including extraversion and neuroticism?","options":["Freud's psychoanalytic theory","Maslow's humanistic theory","Bandura's social-cognitive theory","Eysenck's three-factor theory"],"answer":"Eysenck's three-factor theory","solution":"A: That is not a trait theory\nB: That concerns needs\nC: That concerns observation and modelling\nD: The lecture lists extraversion-introversion, neuroticism-emotional stability and psychoticism-impulse control","source":"Week 8 - Personality-Nathaniel Yebuah.pdf | SLIDE 53","difficulty":"Devil Mode"},{"id":"mls-v2-312","module":"v2","type":"mcq","q":"Which projective test uses ambiguous inkblots?","options":["The Rorschach test","The MMPI","Cattell's 16PF","The Thematic Apperception Test"],"answer":"The Rorschach test","solution":"A: The lecture states the Rorschach uses ambiguous inkblots\nB: That is an objective test\nC: That is an objective test\nD: That uses pictures, not inkblots","source":"Week 8 - Personality-Nathaniel Yebuah.pdf | SLIDE 64","difficulty":"Medium"},{"id":"mls-v2-313","module":"v2","type":"mcq","q":"Which psychological factor is listed among influences on stress?","options":["Blood group","Height","Personality (Type A and Type B)","Eye colour"],"answer":"Personality (Type A and Type B)","solution":"A: That is not listed\nB: That is not listed\nC: The lecture lists personality, social support, gender and sociocultural factors\nD: That is not listed","source":"stress.pdf | SLIDE 41","difficulty":"Medium"},{"id":"mls-v2-314","module":"v2","type":"mcq","q":"What is eustress?","options":["Severe chronic stress","Stress from illness","Negative stress","Positive stress from motivating challenges"],"answer":"Positive stress from motivating challenges","solution":"A: That is distress\nB: That is a stressor\nC: That is distress\nD: The lecture defines eustress as positive stress","source":"stress.pdf | SLIDE 8","difficulty":"Hard"},{"id":"mls-v2-315","module":"v2","type":"mcq","q":"Which stage of Selye's General Adaptation Syndrome mobilizes body resources at the perception of stress?","options":["Alarm reaction","Stage of resistance","Stage of exhaustion","Recovery stage"],"answer":"Alarm reaction","solution":"A: The lecture describes the alarm reaction as mobilising resources\nB: That follows alarm\nC: That follows resistance\nD: That is not a named stage","source":"stress.pdf | SLIDE 34","difficulty":"Hard"},{"id":"mls-v2-316","module":"v2","type":"mcq","q":"What is the diathesis-stress model?","options":["A model where stress alone is sufficient","A model where an innate predisposition plus stress produces disorder","A model where genes alone determine behaviour","A model of physical illness only"],"answer":"A model where an innate predisposition plus stress produces disorder","solution":"A: Both factors are required\nB: The lecture states disorder requires a diathesis and stressful experience\nC: That is biological determinism\nD: It applies to psychological disorders","source":"stress.pdf | SLIDE 54","difficulty":"Devil Mode"},{"id":"mls-v2-317","module":"v2","type":"mcq","q":"What is problem-focused coping?","options":["Controlling emotional responses","Avoiding all problems","Seeking medical advice only","Efforts to manage or alter the stressful situation"],"answer":"Efforts to manage or alter the stressful situation","solution":"A: That is emotion-focused coping\nB: That is avoidance\nC: That is not the definition\nD: The lecture defines problem-focused coping this way","source":"stress.pdf | SLIDE 63","difficulty":"Medium"},{"id":"mls-v2-318","module":"v2","type":"mcq","q":"Which condition arises following traumatic stressful events such as assault or rape?","options":["Post-traumatic stress disorder","Generalised anxiety disorder","Major depression","Obsessive-compulsive disorder"],"answer":"Post-traumatic stress disorder","solution":"A: The lecture defines PTSD this way\nB: That is not specifically trauma-triggered\nC: That is a different disorder\nD: That is different","source":"stress.pdf | SLIDE 58","difficulty":"Medium"},{"id":"mls-v2-319","module":"v2","type":"fill","q":"A compound microscope uses a 40× objective and a 10× eyepiece. What is the total magnification?","answer":"400","solution":"Total magnification is the product of objective and eyepiece powers: 40 × 10 = 400.","source":"Principle of microscopy- Nathaniel Yebuah.pdf | SLIDE 30","difficulty":"Hard"},{"id":"mls-v2-320","module":"v2","type":"fill","q":"How many named bones are in the adult human skeleton?","answer":"206","solution":"The osteology lecture states the adult skeleton is composed of 206 named bones.","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 6","difficulty":"Hard"},{"id":"mls-v2-321","module":"v2","type":"fill","q":"How many intervertebral discs are present in the adult spinal column?","answer":"23","solution":"There are 24 presacral vertebrae, and a disc lies between each consecutive pair, giving 23 discs.","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 107","difficulty":"Devil Mode"},{"id":"mls-v2-322","module":"v2","type":"fill","q":"Using the lecture convention of 2.5 ATP per NADH, how many ATP are yielded per mole of NADH oxidised?","answer":"2.5","solution":"The lecture states the convention 1 NADH = 2.5/3 ATP, so under the modern convention the answer is 2.5 ATP.","source":"Electron Transport Chain-Nathaniel Yebuah.pdf | SLIDE 21","difficulty":"Medium"},{"id":"mls-v2-323","module":"v2","type":"fill","q":"Approximately what percentage of total adrenomedullary catecholamine output is epinephrine?","answer":"80","solution":"The lecture states epinephrine accounts for 80% of catecholamine output, with norepinephrine making up most of the remainder.","source":"Endocrine-Nathaniel Yebuah.pdf | SLIDE 90","difficulty":"Medium"},{"id":"mls-v2-324","module":"v2","type":"fill","q":"How many tarsal bones form the ankle and foot?","answer":"7","solution":"The lecture lists seven tarsal bones: calcaneus, talus, cuboid, navicular and three cuneiforms.","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 385","difficulty":"Hard"},{"id":"mls-v2-325","module":"v2","type":"mcq","q":"Which documentary section of a report normally states the research problem and its context?","options":["The abstract","The introduction","The methodology","The glossary"],"answer":"The introduction","solution":"A: The abstract is a brief summary\nB: The report-writing lecture states the introduction includes the problem and its context\nC: Methodology describes procedures\nD: The glossary defines terms","source":"LECTURE 8-REPORT WRITING-Nathaniel Yebuah.pdf | SLIDE 16","difficulty":"Hard"},{"id":"mls-v2-326","module":"v2","type":"mcq","q":"Which instrument provides a temperature-controlled, humidity-controlled environment for culturing microorganisms?","options":["A centrifuge","An autoclave","An incubator","A spectrophotometer"],"answer":"An incubator","solution":"A: A centrifuge separates by density\nB: An autoclave sterilises\nC: The incubator lecture defines it as temperature and humidity controlled equipment\nD: A spectrophotometer measures absorbance","source":"Incubator-Nathaniel Yebuah.pdf | SLIDE 2","difficulty":"Devil Mode"},{"id":"mls-v2-327","module":"v2","type":"mcq","q":"Which of the following statements characterizes osteoclasts? (Literal review test)","options":["They occupy Howship lacunae","They are enucleated cells","They produce collagen","They secrete osteoid"],"answer":"They occupy Howship lacunae","solution":"A: Osteoclasts resorb bone and lie in resorption lacunae called Howship lacunae\nB: Osteoclasts are nucleated, multinucleated cells\nC: Collagen is produced by osteoblasts\nD: Osteoid is secreted by osteoblasts","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 129","difficulty":"Medium"},{"id":"mls-v2-328","module":"v2","type":"mcq","q":"Which of the following cells is responsible for the resorption of bones? (Literal review test)","options":["Osteoprogenitor","Osteoclast","Osteocyte","Osteoblast"],"answer":"Osteoclast","solution":"A: These are stem cells that become osteoblasts\nB: The review test answer is osteoclast, the bone-resorbing cell\nC: Osteocytes are mature osteoblasts maintaining bone\nD: Osteoblasts form bone","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 157","difficulty":"Medium"},{"id":"mls-v2-329","module":"v2","type":"mcq","q":"Which one of the following statements is correct concerning the periosteum? (Literal review test)","options":["It is devoid of a blood supply","It produces osteoclasts","Its inner layer contains osteoprogenitor cells","It is responsible for interstitial bone growth"],"answer":"Its inner layer contains osteoprogenitor cells","solution":"A: The periosteum is vascular\nB: Osteoclasts derive from monocytes\nC: The review test answer notes the osteogenic inner layer of the periosteum\nD: Interstitial growth concerns cartilage","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 130","difficulty":"Hard"},{"id":"mls-v2-330","module":"v2","type":"mcq","q":"Which if the following joints is synarthrosis joint? (Literal review test)","options":["Symphysis","Diarthrosis","Amphiarthrosis","Gomphosis"],"answer":"Gomphosis","solution":"A: A symphysis is a slightly movable cartilaginous joint\nB: A diarthrosis is freely movable\nC: An amphiarthrosis permits slight movement\nD: A gomphosis is a fibrous joint allowing no movement, hence a synarthrosis","source":"Joints of the body-Nathaniel Yebuah.pdf | SLIDE 13","difficulty":"Hard"}]};
let mod = BANK.modules[0].id;
let list = [];
let idx = 0;
let ans = {};
let secs = 0;
let tick = null;
let done = false;
const PER_Q = 90;
const EXAM_N = 40;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function drawMods(){
  document.getElementById('mods').innerHTML = BANK.modules.map(function(m){
    return '<button class="modbtn'+(m.id===mod?' sel':'')+'" onclick="pick(\''+m.id+'\')">'+
      '<b>'+esc(m.name)+'</b><span>'+esc(m.desc)+' - '+m.count+' questions</span></button>';
  }).join('');
  var m=BANK.modules.filter(function(x){return x.id===mod})[0];
  var all=BANK.questions.filter(function(q){return q.module===mod});
  var n=Math.min(EXAM_N, all.length);
  var mins=Math.round(n*PER_Q/60);
  document.getElementById('td').textContent=fmt(n*PER_Q);
  var el=document.getElementById('startBtns');
  if(el){
    el.innerHTML='<button class="bigbtn" onclick="begin(\'exam\')">Start exam - '+n+' questions / '+mins+' min</button>'+
      '<button class="bigbtn" style="background:#1d3557;margin-top:10px" onclick="begin(\'practice\')">Practice all '+all.length+' questions - no timer</button>';
  }
}
function pick(id){ mod=id; drawMods(); }

function fmt(s){var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;
  return (h>0?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function begin(mode){
  var all=BANK.questions.filter(function(q){return q.module===mod});
  if(!all.length){alert('No questions in this set');return}
  if(mode==='exam'){ list=shuffle(all.slice()).slice(0,Math.min(EXAM_N,all.length)); secs=list.length*PER_Q; }
  else { list=all.slice(); secs=0; }
  idx=0; ans={}; done=false;
  document.getElementById('start').style.display='none';
  document.getElementById('exam').style.display='block';
  document.getElementById('results').style.display='none';
  clearInterval(tick);
  if(mode==='exam'){
    document.getElementById('timerbar').style.display='flex';
    document.getElementById('td').textContent=fmt(secs);
    tick=setInterval(function(){
      secs--;
      if(secs<=0){clearInterval(tick);finish();return}
      document.getElementById('td').textContent=fmt(secs);
      var bar=document.getElementById('timerbar');
      bar.className='timerbar'+(secs<=300?' danger':secs<=900?' warn':'');
    },1000);
  } else {
    document.getElementById('timerbar').style.display='none';
  }
  document.getElementById('quizSub').textContent=BANK.modules.filter(function(m){return m.id===mod})[0].name+' - '+list.length+' questions'+(mode==='exam'?' - '+Math.round(secs/60)+' min':'');
  render();
}
function toggleTimer(){
  var b=document.getElementById('timerbar'), td=document.getElementById('td');
  if(b.dataset.hidden==='1'){b.style.display='flex';b.dataset.hidden='0';document.getElementById('hideBtn').textContent='Hide'}
  else{b.style.display='none';b.dataset.hidden='1'}
}
function setAnsIdx(i){
  ans[idx]=list[idx].options[i];
  var btns=document.querySelectorAll('.opt');
  btns.forEach(function(b,j){ b.className='opt'+(j===i?' sel':''); });
  renderNav();
}
function setAns(v){ ans[idx]=v; renderNav(); }

function render(){
  var q=list[idx];
  var opts='';
  if(q.type==='mcq'){
    opts='<div class="opts">'+q.options.map(function(o,i){
      var k=String.fromCharCode(65+i);
      return '<button class="opt'+(ans[idx]===o?' sel':'')+'" onclick="setAnsIdx('+i+')">'+
        '<span class="key">'+k+'</span><span>'+esc(o)+'</span></button>';
    }).join('')+'</div>';
  }else{
    opts='<div class="fillrow"><label>Answer:</label><input type="text" id="fill" placeholder="type your answer" value="'+esc(ans[idx]||'')+'" oninput="ans['+idx+']=this.value;renderNav()"><span class="hint">numeric or short answer</span></div>';
  }
  document.getElementById('exam').innerHTML=
    '<div class="card"><div class="qhead"><span class="qnum">Question '+(idx+1)+' of '+list.length+'</span>'+
    '<span class="qtag">'+esc(q.difficulty||'Medium')+' - '+esc(q.source||'')+'</span></div>'+
    '<div class="qtext">'+esc(q.q)+'</div>'+opts+'</div>'+
    '<div class="navrow"><button class="btn prev" onclick="go(-1)" '+(idx===0?'disabled':'')+'>Previous page</button>'+
    (idx===list.length-1?'<button class="btn finish" onclick="finish()">Submit exam</button>':'<button class="btn next" onclick="go(1)">Next page</button>')+'</div>'+
    '<div class="qgrid" id="qgrid"></div>';
  renderNav();
  window.scrollTo(0,0);
}
function renderNav(){
  var g=document.getElementById('qgrid'); if(!g)return;
  g.innerHTML=list.map(function(_,i){
    var c=(ans[i]!==undefined&&ans[i]!=='')?' done':'';
    if(i===idx)c+=' cur';
    return '<button class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</button>';
  }).join('');
}
function go(d){ var n=idx+d; if(n<0||n>=list.length)return; idx=n; render(); }
function jump(i){ idx=i; render(); }

function finish(){
  if(done)return; done=true; clearInterval(tick);
  var correct=0,wrong=0,skip=0,html='';
  list.forEach(function(q,i){
    var u=ans[i], ok=false;
    if(u===undefined||u===''){skip++}
    else if(q.type==='mcq'){ok=(u===q.answer)}
    else{
      var a=String(q.answer).trim().toLowerCase(), b=String(u).trim().toLowerCase();
      ok=(a===b);
      if(!ok){var na=parseFloat(a),nb=parseFloat(b); if(!isNaN(na)&&!isNaN(nb))ok=Math.abs(na-nb)<=0.005}
    }
    if(ok)correct++;else if(u!==undefined&&u!=='')wrong++;
    html+='<div class="item '+(ok?'':'wrong')+'"><div class="qq">Q'+(i+1)+'. '+esc(q.q)+'</div>'+
      '<div class="aa '+(ok?'ok':'no')+'">Your answer: '+esc(u===undefined||u===''?'-':u)+'</div>'+
      (ok?'':'<div class="aa ok">Correct: '+esc(q.answer)+'</div>')+
      (q.solution?'<div class="sol"><b>Solution:</b> '+esc(q.solution)+'</div>':'')+'</div>';
  });
  var pct=Math.round(correct/list.length*100);
  document.getElementById('exam').style.display='none';
  document.getElementById('timerbar').style.display='none';
  document.getElementById('results').style.display='block';
  document.getElementById('results').innerHTML=
    '<div class="res"><h2>Examination complete</h2><div class="score">'+pct+'%</div>'+
    '<div class="rstat"><div><b>'+correct+'</b>Correct</div><div><b>'+wrong+'</b>Wrong</div><div><b>'+skip+'</b>Skipped</div></div>'+
    '<p style="color:var(--muted);font-size:13px">Review — wrong and skipped answers shown with worked solutions.</p></div>'+html+
    '<button class="bigbtn" onclick="location.reload()">New attempt</button>';
  window.scrollTo(0,0);
}
drawMods();
</script>
</body>
</html>
