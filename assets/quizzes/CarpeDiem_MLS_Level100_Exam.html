<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Carpe Diem MLS - Level 100 — The Carpe Diem</title>
<style>
:root{
  --navy:#0b1b33; --navy2:#12294a; --gold:#f5b301;
  --red:#b3261e; --red2:#8e1b16; --card:#dceaf0; --card2:#e8f1f5;
  --ink:#1c2733; --muted:#5d6b7a; --line:#c8d4de;
  --green:#2e7d32; --good:#e6f4ea; --bad:#fdecea;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f3f5f7;color:var(--ink);font-family:Arial,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer}

/* top bar */
.cdbar{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold)}
.cdmark{width:30px;height:30px;border:2px solid var(--gold);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:bold;font-size:12px;letter-spacing:.5px;flex:none}
.cdbar .brand{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:bold}
.cdbar .crumb{font-size:12px;color:#c8d6e5;margin-left:auto;text-align:right}

/* moodle quiz header */
.quizhead{background:#fff;border-bottom:1px solid var(--line);padding:18px 22px}
.quizhead .path{font-size:11px;color:var(--muted);letter-spacing:.4px}
.quizhead h1{font-size:24px;font-weight:600;margin:4px 0 2px;color:var(--navy)}
.quizhead .sub{font-size:12px;color:var(--muted)}

/* timer banner */
.timerbar{background:linear-gradient(90deg,var(--red2),var(--red));color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:center;position:relative;font-weight:bold;letter-spacing:.5px}
.timerbar .tt{font-size:20px}
.timerbar .td{font-size:20px;font-variant-numeric:tabular-nums;margin-left:12px}
.timerbar.warn{background:linear-gradient(90deg,#a35b00,#d97706)}
.timerbar.danger{background:linear-gradient(90deg,#7f1d1d,#b3261e)}
.timerbar .hide{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);border:0;color:#fff;padding:6px 12px;border-radius:4px;font-size:12px}

.wrap{max-width:860px;margin:0 auto;padding:24px 18px 120px}
.card{background:var(--card);border:1px solid #c2d3de;border-radius:12px;padding:26px;margin-bottom:18px;box-shadow:0 1px 2px rgba(11,27,51,.05)}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}
.qnum{font-size:13px;font-weight:bold;color:var(--navy)}
.qtag{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--muted);white-space:nowrap}
.qtext{font-size:17px;line-height:1.65;margin-bottom:18px;white-space:pre-wrap}
.qtext b{color:var(--navy)}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;width:100%;font-size:15px;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--gold)}
.opt.sel{border:2px solid var(--gold);background:#fff9e6}
.opt .key{width:22px;height:22px;border-radius:50%;border:1px solid #9aa9b8;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.opt.sel .key{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:bold}

.fillrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fillrow label{font-weight:bold;color:var(--navy)}
.fillrow input{background:#fff;border:1px solid #9aa9b8;border-radius:8px;padding:11px 14px;font-size:16px;width:240px;outline:none}
.fillrow input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,179,1,.2)}
.fillrow .hint{font-size:12px;color:var(--muted)}

.navrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.btn{border:0;border-radius:6px;padding:12px 24px;font-size:14px;font-weight:bold}
.btn.prev{background:#e4e9ee;color:var(--navy)}
.btn.next{background:var(--green);color:#fff}
.btn.finish{background:var(--navy);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.qgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.qgrid button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:4px;color:var(--muted);font-size:12px}
.qgrid button.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.qgrid button.cur{outline:2px solid var(--gold)}

/* start screen */
.start{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:18px}
.start h2{color:var(--navy);margin-bottom:6px}
.start p{color:var(--muted);margin-bottom:18px}
.mods{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.modbtn{border:1px solid var(--line);background:#f8fafb;border-radius:8px;padding:12px 16px;text-align:left;min-width:150px}
.modbtn.sel{border:2px solid var(--gold);background:#fff9e6}
.modbtn b{display:block;color:var(--navy);font-size:14px}
.modbtn span{font-size:12px;color:var(--muted)}
.bigbtn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:14px 30px;font-size:15px;font-weight:bold}

/* results */
.res{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:18px}
.score{font-size:52px;font-weight:bold;color:var(--navy);line-height:1}
.rstat{display:flex;gap:28px;margin:16px 0;flex-wrap:wrap}
.rstat div{font-size:13px;color:var(--muted)}
.rstat b{display:block;font-size:22px;color:var(--navy)}
.item{border:1px solid var(--line);border-left:4px solid var(--good);border-radius:8px;padding:16px;margin-bottom:12px;background:#fafcfb}
.item.wrong{border-left-color:#c62828;background:#fffafa}
.item .qq{font-weight:bold;margin-bottom:8px}
.item .aa{font-size:13px;margin:3px 0}
.item .ok{color:var(--green)}
.item .no{color:#c62828}
.sol{font-size:13px;background:#f1f5f9;border-radius:6px;padding:10px 12px;margin-top:8px;color:#37474f;white-space:pre-wrap}

@media(max-width:600px){
  .cdbar .crumb{display:none}
  .quizhead h1{font-size:20px}
  .timerbar .tt,.timerbar .td{font-size:16px}
  .card{padding:18px}
  .qtext{font-size:15px}
  .fillrow input{width:100%}
}
</style>
</head>
<body>

<div class="cdbar">
  <div class="cdmark">CD</div>

</div>

<div class="quizhead">

</div>

  <span class="tt">Time left</span><span class="td" id="td">2:00:00</span>

</div>

    <div class="mods" id="mods"></div>

<script>
const BANK = {"config":{"title":"The Carpe Diem MLS - Level 100","course":"MLS 100","guide":"Nathaniel Yebuah slides"},"modules":[{"id":"v1","name":"Version 1 - Semester 1","desc":"Algebra, Biol-Chemistry, Biophysics, Cell Structure, Communication Skills, Computer Appreciation, Medical Genetics and Statistical Methods (Level 100, Semester 1).","count":324,"source":"Nathaniel Yebuah slides - 1ST SEMESTER corpus (36 source files)"},{"id":"v2","name":"Version 2 - Semester 2","desc":"Anatomy, Biochemistry, Biological Chemistry, Communication Skills, Lab Skills, Physiology and Psychology (Level 100, Semester 2).","count":330,"source":"Nathaniel Yebuah slides - 2ND SEMESTER corpus (82 source files)"}],"questions":[{"id":"mls-v1-001","module":"v1","type":"mcq","q":"In the expression for the sum of five baby weights written with capital sigma, what is the quantity called the summand?","options":["xk, the weight of the kth baby","The upper limit 5","The index k","The total 14.4 kg"],"answer":"xk, the weight of the kth baby","solution":"A: The summand is the term being added as the index runs from the lower to the upper limit\nB: The upper limit only states where the summation stops; it is not the term added\nC: The index is the dummy counting variable, not the quantity being summed\nD: The total is the result of the summation, not the summand","source":"ALGEBRA 1- Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Medium"},{"id":"mls-v1-002","module":"v1","type":"mcq","q":"State the standard formula for the sum of the squares of the first n positive integers.","options":["n(n + 1)/2","n(n + 1)(2n + 1)/6","n²(n + 1)²/4","n(n − 1)(2n − 1)/6"],"answer":"n(n + 1)(2n + 1)/6","solution":"A: This is the formula for the sum of the first n integers, not their squares\nB: This is the closed-form identity for the sum of k squared from k = 1 to n, as given in the Remark slide\nC: This is the formula for the sum of cubes, not squares\nD: This is a shifted variant and does not match the stated identity","source":"ALGEBRA 1- Nathaniel Yebuah.pdf | SLIDE 5","difficulty":"Medium"},{"id":"mls-v1-003","module":"v1","type":"mcq","q":"A set A has n elements. How many elements does its power set P(A) contain?","options":["n²","n","2ⁿ","n + 1"],"answer":"2ⁿ","solution":"A: Squaring counts ordered pairs of elements, not all possible subsets\nB: This counts the elements of A itself, not its subsets\nC: Each of the n elements is either in or out of a subset, giving two choices per element and therefore 2 to the power n subsets\nD: This counts A together with only the empty set, ignoring all other subsets","source":"ALGEBRA 1- Nathaniel Yebuah.pdf | SLIDE 16","difficulty":"Hard"},{"id":"mls-v1-004","module":"v1","type":"mcq","q":"Which of the following correctly states one of De Morgan's laws for two sets A and B?","options":["(A ∩ B)ᶜ = Aᶜ ∩ Bᶜ","(A ∪ B)ᶜ = Aᶜ ∪ Bᶜ","Aᶜ ∪ Bᶜ = (A ∪ B)ᶜ","(A ∩ B)ᶜ = Aᶜ ∪ Bᶜ"],"answer":"(A ∩ B)ᶜ = Aᶜ ∪ Bᶜ","solution":"A: This duplicates the complement of the intersection and is not De Morgan's law\nB: The complement of a union requires intersection of the complements, not union\nC: This reverses the correct law and is generally false\nD: De Morgan's law says the complement of an intersection equals the union of the complements","source":"ALGEBRA 1- Nathaniel Yebuah.pdf | SLIDE 28","difficulty":"Hard"},{"id":"mls-v1-005","module":"v1","type":"mcq","q":"Which property of set algebra is expressed by A ∩ B = B ∩ A and A ∪ B = B ∪ A?","options":["Associative property","Commutative property","Distributive property","Principle of duality"],"answer":"Commutative property","solution":"A: Associativity concerns grouping of three or more sets, not order of two\nB: Both intersection and union give the same result when the operands are interchanged\nC: Distributivity relates union over intersection, not interchange of two sets\nD: Duality interchanges operations and identities, rather than swapping operands","source":"ALGEBRA 1- Nathaniel Yebuah.pdf | SLIDE 25","difficulty":"Devil Mode"},{"id":"mls-v1-006","module":"v1","type":"mcq","q":"How is the logarithm of b to the base a defined in the Algebra 2 lecture?","options":["The product of a and b","The number of times a divides b","The power to which a must be raised to obtain b","The difference a − b"],"answer":"The power to which a must be raised to obtain b","solution":"A: Multiplication does not describe the inverse of exponentiation\nB: That describes a divisibility count, not a logarithm\nC: The logarithm log_a b is the exponent x such that aˣ = b, matching the slide's definition\nD: A difference of the base and argument is unrelated to logarithmic definition","source":"ALGEBRA 2- Nathaniel Yebuah.pdf | SLIDE 2","difficulty":"Medium"},{"id":"mls-v1-007","module":"v1","type":"mcq","q":"Which law of logarithms states that logₐ x + logₐ y = logₐ(xy)?","options":["The quotient law","The power law","The change-of-base law","The product law"],"answer":"The product law","solution":"A: The quotient law gives logₐ x − logₐ y = logₐ(x/y)\nB: The power law gives n logₐ x = logₐ(xⁿ)\nC: Change of base rewrites logₐ x as log_b x / log_b a\nD: Adding two logarithms with the same base corresponds to multiplying their arguments","source":"ALGEBRA 2- Nathaniel Yebuah.pdf | SLIDE 3","difficulty":"Medium"},{"id":"mls-v1-008","module":"v1","type":"mcq","q":"What distinguishes an exponential equation from other equations in the Algebra 2 slides?","options":["The variable appears as an exponent","The variable is squared only","The equation contains no constants","The variable appears only in a denominator"],"answer":"The variable appears as an exponent","solution":"A: An exponential equation has the unknown in the exponent, such as 125^(x²+5)\nB: A squared variable alone describes a quadratic, not necessarily exponential\nC: Exponential equations routinely contain constants such as bases\nD: That describes a rational equation, not an exponential one","source":"ALGEBRA 2- Nathaniel Yebuah.pdf | SLIDE 10","difficulty":"Hard"},{"id":"mls-v1-009","module":"v1","type":"mcq","q":"For a quadratic equation ax² + bx + c = 0, write the quadratic formula for its roots.","options":["x = (b ± √(b² − 4ac)) / 2a","x = (−b ± √(b² + 4ac)) / 2a","x = (−b ± √(b² − 4ac)) / 2a","x = (−b ± √(b² − 4ac)) / a"],"answer":"x = (−b ± √(b² − 4ac)) / 2a","solution":"A: The sign of b must be negative in the numerator for the general formula\nB: The discriminant is b² − 4ac, not b² + 4ac\nC: This is the standard result obtained by completing the square on the general quadratic\nD: The denominator must be 2a after completing the square","source":"ALGEBRA 2- Nathaniel Yebuah.pdf | SLIDE 20","difficulty":"Hard"},{"id":"mls-v1-010","module":"v1","type":"mcq","q":"In completing the square for x² + 6x + 8 = 0, what constant is added to form a perfect square?","options":["6","3","8","9"],"answer":"9","solution":"A: The coefficient of x is added directly, which does not produce a perfect square\nB: Half the coefficient is needed but it must be squared before adding\nC: The original constant term is not the completing-square constant\nD: Half of 6 is 3, and 3 squared is 9, giving (x + 3)²","source":"ALGEBRA 2- Nathaniel Yebuah.pdf | SLIDE 18","difficulty":"Devil Mode"},{"id":"mls-v1-011","module":"v1","type":"mcq","q":"What is the general term uₙ of an arithmetic progression with first term a and common difference d?","options":["uₙ = a + (n − 1)d","uₙ = a + nd","uₙ = a d^(n−1)","uₙ = a + (n + 1)d"],"answer":"uₙ = a + (n − 1)d","solution":"A: Each successive term adds the constant difference d, so the nth term is a plus (n−1) steps\nB: This overshoots by one difference because the first term corresponds to n = 1\nC: That is the nth term of a geometric progression, not an arithmetic one\nD: This gives the (n+2)th term rather than the nth","source":"ALGEBRA 3-Nathaniel Yebuah.pdf | SLIDE 5","difficulty":"Medium"},{"id":"mls-v1-012","module":"v1","type":"mcq","q":"Which formula gives the sum Sₙ of the first n terms of a linear sequence (arithmetic progression)?","options":["Sₙ = n[2a + (n − 1)d]","Sₙ = (n/2)[2a + (n − 1)d]","Sₙ = (n/2)[2a + nd]","Sₙ = a(1 − rⁿ)/(1 − r)"],"answer":"Sₙ = (n/2)[2a + (n − 1)d]","solution":"A: The factor of one half is missing, so the sum is double the correct value\nB: Averaging the first and nth terms and multiplying by n gives this standard formula\nC: The last term uses (n−1)d, not nd\nD: That is the geometric series sum formula","source":"ALGEBRA 3-Nathaniel Yebuah.pdf | SLIDE 9","difficulty":"Medium"},{"id":"mls-v1-013","module":"v1","type":"mcq","q":"In a geometric progression, how is each term obtained from the preceding term?","options":["By adding a constant difference","By squaring the preceding term","By dividing by the term number","By multiplying by a constant ratio"],"answer":"By multiplying by a constant ratio","solution":"A: That defines an arithmetic progression\nB: Squaring does not give a constant ratio in general\nC: That is neither an AP nor a GP rule\nD: A GP is defined by a fixed multiplier r between consecutive terms","source":"ALGEBRA 3-Nathaniel Yebuah.pdf | SLIDE 14","difficulty":"Hard"},{"id":"mls-v1-014","module":"v1","type":"mcq","q":"Under what condition does the sum to infinity of a geometric progression exist?","options":["When the absolute value of r is below 1","When r > 1","When r = 1","When a = 0"],"answer":"When the absolute value of r is below 1","solution":"A: The terms must shrink so that rⁿ tends to zero, which requires the common ratio's magnitude be less than one\nB: The terms grow and the series diverges\nC: Every term equals a, so the sum grows without bound\nD: Making the first term zero gives a trivial zero series but is not the stated convergence condition","source":"ALGEBRA 3-Nathaniel Yebuah.pdf | SLIDE 22","difficulty":"Hard"},{"id":"mls-v1-015","module":"v1","type":"mcq","q":"Define n factorial (n!) as presented in the permutations lecture.","options":["n + (n − 1) + ... + 1","n(n − 1)(n − 2) ... 1","n²","2ⁿ"],"answer":"n(n − 1)(n − 2) ... 1","solution":"A: That is the sum of the first n integers, not the factorial\nB: Factorial is the product of all positive integers from n down to 1\nC: That is the square of n\nD: That counts subsets of an n-element set","source":"ALGEBRA-5..Nathaniel Yebuah.pdf | SLIDE 3","difficulty":"Devil Mode"},{"id":"mls-v1-016","module":"v1","type":"mcq","q":"How many circular permutations are there of n distinct objects?","options":["(n)!","n! / 2","(n − 1)!","2(n − 1)!"],"answer":"(n − 1)!","solution":"A: That counts linear arrangements, where rotations are counted separately\nB: Halving accounts for reflections, which are not identified in basic circular permutations\nC: Rotations of the circle are considered the same, so one object is fixed and the rest arranged\nD: This doubles the correct count by treating mirror images as distinct when they are not","source":"ALGEBRA-5..Nathaniel Yebuah.pdf | SLIDE 6","difficulty":"Medium"},{"id":"mls-v1-017","module":"v1","type":"mcq","q":"Which relation connects combinations and permutations of n objects taken k at a time?","options":["nCk = nPk / k!","nCk = nPk × k!","nCk = nPk − k!","nCk = n! / (n − k)!"],"answer":"nCk = nPk / k!","solution":"A: Order matters in permutations but not in combinations, so the k! orderings of each selection are divided out\nB: This would multiply by orderings instead of removing them\nC: Subtraction has no combinatorial meaning here\nD: That expression equals nPk, not nCk","source":"ALGEBRA-5..Nathaniel Yebuah.pdf | SLIDE 10","difficulty":"Medium"},{"id":"mls-v1-018","module":"v1","type":"mcq","q":"In the binomial theorem, what does the coefficient of the term xⁿ⁻ᵏ yᵏ in (x + y)ⁿ equal?","options":["n divided by k","n choose k","n plus k","k factorial alone"],"answer":"n choose k","solution":"A: This is not the combinatorial coefficient of the binomial expansion\nB: The binomial coefficient C(n,k) counts the ways of choosing k factors of y from n factors\nC: Addition does not arise in the coefficient formula\nD: The coefficient requires n!/(k!(n−k)!), not k! alone","source":"ALGEBRA-5..Nathaniel Yebuah.pdf | SLIDE 14","difficulty":"Hard"},{"id":"mls-v1-019","module":"v1","type":"mcq","q":"What is the distance between two points A(x₁, y₁) and B(x₂, y₂)?","options":["√[(x₂ − x₁) + (y₂ − y₁)]","(x₂ − x₁)² + (y₂ − y₁)²","√[(x₂ − x₁)² + (y₂ − y₁)²]","√[(x₂ + x₁)² + (y₂ + y₁)²]"],"answer":"√[(x₂ − x₁)² + (y₂ − y₁)²]","solution":"A: Squares and the final square root are required by Pythagoras\nB: This is the squared distance, not the distance\nC: This is the Pythagorean distance formula for the segment joining the points\nD: Coordinates must be subtracted, not added","source":"ALGEBRA-6...Nathaniel Yebuah.pdf | SLIDE 3","difficulty":"Hard"},{"id":"mls-v1-020","module":"v1","type":"mcq","q":"What are the coordinates of the midpoint of the line joining A(x₁, y₁) and B(x₂, y₂)?","options":["(x₁ + x₂, y₁ + y₂)","((x₂ − x₁)/2, (y₂ − y₁)/2)","(x₁ − x₂, y₁ − y₂)","((x₁ + x₂)/2, (y₁ + y₂)/2)"],"answer":"((x₁ + x₂)/2, (y₁ + y₂)/2)","solution":"A: This sums coordinates without averaging, giving a translation instead\nB: This is half the displacement vector, not the midpoint position\nC: This is a difference vector, not a point of the segment\nD: The midpoint averages the two x-coordinates and the two y-coordinates","source":"ALGEBRA-6...Nathaniel Yebuah.pdf | SLIDE 6","difficulty":"Devil Mode"},{"id":"mls-v1-021","module":"v1","type":"mcq","q":"A line has a positive gradient. What does this mean geometrically?","options":["The line falls as x increases","The line rises as one moves from left to right","The line is horizontal","The line is vertical"],"answer":"The line rises as one moves from left to right","solution":"A: That describes a negative gradient\nB: A positive slope means y increases when x increases, as noted in the Remark slide\nC: A horizontal line has gradient zero\nD: A vertical line has undefined gradient","source":"ALGEBRA-6...Nathaniel Yebuah.pdf | SLIDE 11","difficulty":"Medium"},{"id":"mls-v1-022","module":"v1","type":"mcq","q":"What is the condition for two non-vertical lines with gradients m₁ and m₂ to be parallel?","options":["m₁ m₂ = −1","m₁ + m₂ = 0","m₁ = m₂","m₁ = 1/m₂"],"answer":"m₁ = m₂","solution":"A: That is the condition for perpendicular lines\nB: Equal and opposite gradients are not generally parallel\nC: Parallel lines have equal gradients and never meet\nD: That is the perpendicular condition written reciprocally","source":"ALGEBRA-6...Nathaniel Yebuah.pdf | SLIDE 19","difficulty":"Medium"},{"id":"mls-v1-023","module":"v1","type":"mcq","q":"Which trigonometric ratio is defined as opposite divided by adjacent in a right-angled triangle?","options":["Sine","Cosine","Secant","Tangent"],"answer":"Tangent","solution":"A: Sine is opposite divided by hypotenuse\nB: Cosine is adjacent divided by hypotenuse\nC: Secant is the reciprocal of cosine, hypotenuse over adjacent\nD: tan θ is opposite over adjacent, while sine uses the hypotenuse and cosine uses adjacent over hypotenuse","source":"ALGEBRA-7..Nathaniel Yebuah.pdf | SLIDE 7","difficulty":"Hard"},{"id":"mls-v1-024","module":"v1","type":"mcq","q":"What is the exact value of tan 30° from the special angles table?","options":["1/√3","√3","1","1/2"],"answer":"1/√3","solution":"A: The 30-60-90 triangle gives tan 30° = 1/√3\nB: This is the value of tan 60°, not tan 30°\nC: This is tan 45°, the angle of an isosceles right triangle\nD: This is sin 30°, not tan 30°","source":"ALGEBRA-7..Nathaniel Yebuah.pdf | SLIDE 14","difficulty":"Hard"},{"id":"mls-v1-025","module":"v1","type":"mcq","q":"State the Pythagorean trigonometric identity given in the Algebra 7 slides.","options":["sin²θ − cos²θ = 1","sin θ + cos θ = 1","sin²θ + cos²θ = 1","sin²θ + cos²θ = 2"],"answer":"sin²θ + cos²θ = 1","solution":"A: The identity involves addition, not subtraction\nB: This fails for most angles, for example θ = 45°\nC: This identity follows from the unit circle and holds for every angle θ\nD: The sum of squares is 1, not 2","source":"ALGEBRA-7..Nathaniel Yebuah.pdf | SLIDE 17","difficulty":"Devil Mode"},{"id":"mls-v1-026","module":"v1","type":"mcq","q":"How do you convert an angle in degrees to radians using the reference π = 180°?","options":["Multiply by 180/π","Divide by 360","Add π to the angle","Multiply the angle by π/180"],"answer":"Multiply the angle by π/180","solution":"A: That converts radians to degrees, the reverse operation\nB: This gives a fraction of a turn, not radians\nC: Adding π does not convert units\nD: Since 180° equals π radians, each degree is π/180 radians","source":"ALGEBRA-7..Nathaniel Yebuah.pdf | SLIDE 8","difficulty":"Medium"},{"id":"mls-v1-027","module":"v1","type":"mcq","q":"What is a matrix as defined at the start of the Matrices lecture?","options":["A rectangular array of numbers","A single number","A sum of terms","A set of equations"],"answer":"A rectangular array of numbers","solution":"A: A matrix is an ordered rectangular arrangement of entries in rows and columns\nB: A single number is a scalar, not a matrix\nC: A sum is an expression, not the array itself\nD: Equations may be represented by a matrix but are not the matrix definition","source":"ALGEBRA-8..Nathaniel Yebuah.pdf | SLIDE 2","difficulty":"Medium"},{"id":"mls-v1-028","module":"v1","type":"mcq","q":"Which property defines the identity matrix I?","options":["All entries equal to one","Ones on the leading diagonal and zeros elsewhere","Zeros on the diagonal and ones elsewhere","Equal number of rows and columns only"],"answer":"Ones on the leading diagonal and zeros elsewhere","solution":"A: That is not an identity matrix and does not preserve matrices\nB: Multiplying any conformable matrix by I leaves it unchanged\nC: That is not the multiplicative identity\nD: That defines a square matrix, not specifically the identity","source":"ALGEBRA-8..Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Hard"},{"id":"mls-v1-029","module":"v1","type":"mcq","q":"A square matrix A is singular when which condition holds?","options":["det(A) = 1","A has equal rows","A is symmetric","det(A) = 0"],"answer":"det(A) = 0","solution":"A: A determinant of one is non-singular; the identity has this property\nB: Equal rows imply a zero determinant, which is the actual singularity condition\nC: Symmetry AT = A does not imply singularity\nD: A zero determinant means A has no inverse and is called singular","source":"ALGEBRA-8..Nathaniel Yebuah.pdf | SLIDE 5","difficulty":"Hard"},{"id":"mls-v1-030","module":"v1","type":"mcq","q":"What condition must hold for two matrices A and B to be multiplied as AB?","options":["Columns of A equal rows of B","Rows of A equal rows of B","A and B are both square","A and B have the same determinant"],"answer":"Columns of A equal rows of B","solution":"A: Conformability for multiplication requires the inner dimensions to match\nB: That condition relates to addition or subtraction, not multiplication\nC: Non-square conformable matrices can also be multiplied\nD: Determinants do not govern conformability","source":"ALGEBRA-8..Nathaniel Yebuah.pdf | SLIDE 8","difficulty":"Devil Mode"},{"id":"mls-v1-031","module":"v1","type":"mcq","q":"What operation produces the transpose Aᵀ of a matrix A?","options":["Multiplying A by itself","Interchanging rows and columns","Changing the sign of each entry","Taking the determinant"],"answer":"Interchanging rows and columns","solution":"A: That gives a power of the matrix\nB: Transposition swaps the row and column indices of every entry\nC: That gives the negative of a matrix\nD: That produces a scalar, not a matrix","source":"ALGEBRA-8..Nathaniel Yebuah.pdf | SLIDE 12","difficulty":"Medium"},{"id":"mls-v1-032","module":"v1","type":"mcq","q":"What is the determinant of the identity matrix?","options":["0","−1","1","Equal to its order"],"answer":"1","solution":"A: A zero determinant would make the identity singular\nB: The determinant is positive one for any order identity matrix\nC: The identity matrix has determinant one, as stated among determinant properties\nD: The determinant of I is independent of dimension","source":"ALGEBRA-8..Nathaniel Yebuah.pdf | SLIDE 19","difficulty":"Medium"},{"id":"mls-v1-033","module":"v1","type":"mcq","q":"In Cramer's rule, how is the unknown x obtained from the coefficient matrix A and matrix A₁?","options":["x = det(A₁) / det(A)","y = det(A₁) / det(A)","x = det(A) / det(A₁)","x = det(A₁) × det(A)"],"answer":"x = det(A₁) / det(A)","solution":"A: Cramer's rule replaces the column of coefficients of x by the constants and divides determinants\nB: A₁ corresponds to the first unknown x, not y\nC: The ratio is inverted and would be wrong except in special cases\nD: Multiplication of determinants is not the Cramer's rule formula","source":"ALGEBRA-8..Nathaniel Yebuah.pdf | SLIDE 33","difficulty":"Hard"},{"id":"mls-v1-034","module":"v1","type":"mcq","q":"According to the Functions lecture, what is a function from a set X to a set Y?","options":["A rule assigning many images to each element of X","A rule assigning to each element of X exactly one element of Y","A subset of Y only","A relation that is always one-to-one"],"answer":"A rule assigning to each element of X exactly one element of Y","solution":"A: That describes a relation, not a function\nB: The defining property is uniqueness of the image for each domain element\nC: A function must be defined on a domain X\nD: Functions need not be injective","source":"ALGEBRA 9-Nathaniel Yebuah.pdf | SLIDE 2","difficulty":"Hard"},{"id":"mls-v1-035","module":"v1","type":"mcq","q":"How is the largest possible domain of a function found in the Algebra 9 slides?","options":["Include every real number","Take only positive x","Exclude all x that make the function undefined","Set the function equal to zero"],"answer":"Exclude all x that make the function undefined","solution":"A: Functions with denominators or radicals exclude some values\nB: Positivity is not required unless the expression demands it\nC: The domain consists of all real x except values causing division by zero or even roots of negatives\nD: Solving f(x) = 0 finds zeros, not the domain","source":"ALGEBRA 9-Nathaniel Yebuah.pdf | SLIDE 5","difficulty":"Devil Mode"},{"id":"mls-v1-036","module":"v1","type":"mcq","q":"What must be true for the limit of f(x) as x approaches a to exist?","options":["The function must be defined at a","The function must be continuous everywhere","f(a) must equal zero","The left-hand and right-hand limits must be equal"],"answer":"The left-hand and right-hand limits must be equal","solution":"A: A limit may exist even when f(a) is undefined\nB: Continuity at a is stronger than existence of the limit\nC: The value at a does not determine the limiting behaviour\nD: If the two one-sided limits differ, the two-sided limit does not exist","source":"ALGEBRA 9-Nathaniel Yebuah.pdf | SLIDE 12","difficulty":"Medium"},{"id":"mls-v1-037","module":"v1","type":"mcq","q":"Which condition is NOT part of continuity of f at x = a?","options":["f(a) must be defined","f′(a) must exist","The limit as x tends to a must exist","The limit must equal f(a)"],"answer":"f′(a) must exist","solution":"A: Continuity requires the function to have a value at a\nB: Differentiability is stronger than continuity and is not required\nC: A two-sided limit is required for continuity\nD: Continuity requires the limiting value to match the function value","source":"ALGEBRA 9-Nathaniel Yebuah.pdf | SLIDE 26","difficulty":"Medium"},{"id":"mls-v1-038","module":"v1","type":"mcq","q":"What does the derivative f′(a) represent geometrically on the curve y = f(x)?","options":["The area under the curve","The y-intercept of the curve","The slope of the tangent at the point with x = a","The length of the chord AB"],"answer":"The slope of the tangent at the point with x = a","solution":"A: Area under a curve is found by integration\nB: The intercept is f(0), not the derivative\nC: The derivative is the limiting slope of chords as the second point approaches a\nD: Chord length is a distance, not a slope","source":"ALGEBRA 10-Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Hard"},{"id":"mls-v1-039","module":"v1","type":"mcq","q":"State the product rule for differentiating h(x) = f(x)g(x).","options":["h′(x) = f′(x)g′(x)","h′(x) = f′(x)g(x) − f(x)g′(x)","h′(x) = f(x)g′(x) only","h′(x) = f′(x)g(x) + f(x)g′(x)"],"answer":"h′(x) = f′(x)g(x) + f(x)g′(x)","solution":"A: This incorrectly differentiates the factors independently and multiplies\nB: That is not the product rule\nC: The derivative of the first factor must also contribute\nD: The derivative of a product differentiates each factor in turn and adds","source":"ALGEBRA 10-Nathaniel Yebuah.pdf | SLIDE 9","difficulty":"Hard"},{"id":"mls-v1-040","module":"v1","type":"mcq","q":"Which rule is used to differentiate composite functions of the form h(x) = f(g(x))?","options":["The chain rule","The product rule","The quotient rule","The constant rule"],"answer":"The chain rule","solution":"A: With y = f(u) and u = g(x), dy/dx = f′(u)g′(x)\nB: The product rule applies to a product of functions, not a composition\nC: The quotient rule applies to a ratio of functions\nD: A constant has derivative zero and does not handle composition","source":"ALGEBRA 10-Nathaniel Yebuah.pdf | SLIDE 15","difficulty":"Devil Mode"},{"id":"mls-v1-041","module":"v1","type":"mcq","q":"What is the indefinite integral of f(x) when F′(x) = f(x)?","options":["F(x) only","f′(x) + c","F(x) + c","F(x) − c"],"answer":"F(x) + c","solution":"A: The arbitrary constant must be included for an indefinite integral\nB: That differentiates instead of integrating\nC: Integration reverses differentiation and includes an arbitrary constant c\nD: A minus sign on the constant is not the standard form","source":"ALGEBRA 11-Nathaniel Yebuah.pdf | SLIDE 3","difficulty":"Medium"},{"id":"mls-v1-042","module":"v1","type":"mcq","q":"When is integration by substitution most useful?","options":["Only for polynomial functions","When the integral is improper","Only for definite integrals","When the integrand contains a function and its derivative"],"answer":"When the integrand contains a function and its derivative","solution":"A: Polynomials are usually integrated directly by the power rule\nB: Improper integrals require limits, not substitution\nC: Substitution applies to both definite and indefinite integrals\nD: Substitution replaces a composite expression by a single variable to reduce the integral to standard form","source":"ALGEBRA 11-Nathaniel Yebuah.pdf | SLIDE 10","difficulty":"Medium"},{"id":"mls-v1-043","module":"v1","type":"mcq","q":"How is the average value of a function f on the interval [a, b] computed?","options":["(1/(b − a)) ∫ₐᵇ f(x) dx","∫ₐᵇ f(x) dx","f((a + b)/2)","f(b) − f(a)"],"answer":"(1/(b − a)) ∫ₐᵇ f(x) dx","solution":"A: Dividing the integral by the interval length gives the mean value\nB: This gives the area under the curve, not the average\nC: The midpoint value is not generally the average of a function\nD: That is a difference of endpoint values, not an average","source":"ALGEBRA 11-Nathaniel Yebuah.pdf | SLIDE 26","difficulty":"Hard"},{"id":"mls-v1-044","module":"v1","type":"mcq","q":"According to the elemental composition lecture, which theory explains the origin of the universe and the formation of elements?","options":["The germplasm theory","The Big Bang theory","Pangenesis","The steady state theory"],"answer":"The Big Bang theory","solution":"A: Germplasm theory concerns inheritance, not cosmic element formation\nB: The lecture states that the Big Bang theory explains the origin of the universe and is linked to subsequent element formation\nC: Pangenesis is a hereditary theory proposed by Darwin\nD: Steady state was discussed for biochemical systems, not the origin of elements","source":"Lecture 1_Elemental composition of a cell_ Nathaniel Yebuah.pdf | SLIDE 11","difficulty":"Hard"},{"id":"mls-v1-045","module":"v1","type":"mcq","q":"Which element is the largest atom that can form from nuclear fusion in stars?","options":["Hydrogen","Helium","Uranium","Iron"],"answer":"Iron","solution":"A: Hydrogen is the fuel that burns to form helium in stars\nB: Helium is produced by hydrogen fusion but is far from the largest product\nC: Uranium is formed by neutron capture processes, not ordinary stellar fusion\nD: The lecture notes that iron is the largest atom produced by stellar fusion, with larger atoms requiring neutron capture","source":"Lecture 1_Elemental composition of a cell_ Nathaniel Yebuah.pdf | SLIDE 20","difficulty":"Devil Mode"},{"id":"mls-v1-046","module":"v1","type":"mcq","q":"What two properties of carbon make it the ubiquitous element in organic compounds?","options":["Tetravalency and catenation","High atomic mass and radioactivity","Metallic character and conductivity","High electronegativity and ionic bonding"],"answer":"Tetravalency and catenation","solution":"A: Carbon forms four covalent bonds and bonds to itself in chains and rings, as highlighted in the carbon slides\nB: Carbon is light and its common isotopes are stable\nC: Carbon is a non-metal and is not generally conductive in organic molecules\nD: Carbon forms covalent, not ionic, bonds in organic compounds","source":"Lecture 1_Elemental composition of a cell_ Nathaniel Yebuah.pdf | SLIDE 36","difficulty":"Medium"},{"id":"mls-v1-047","module":"v1","type":"mcq","q":"Why is carbon preferentially incorporated into living cells rather than silicon, though silicon is more abundant in the Earth's crust?","options":["Silicon is toxic to all living cells","Carbon forms stronger and more versatile covalent bonds, including multiple bonds","Silicon cannot form four covalent bonds","Carbon is more abundant in the biosphere than silicon"],"answer":"Carbon forms stronger and more versatile covalent bonds, including multiple bonds","solution":"A: Silicon is not inherently toxic; the issue is bonding suitability\nB: The lecture notes carbon's ability to form strong sigma bonds and multiple bonds, which silicon cannot match\nC: Silicon is tetravalent like carbon, being a congener below it\nD: The slide states silicon is more abundant in the crust, so abundance does not explain the preference","source":"Lecture 1_Elemental composition of a cell_ Nathaniel Yebuah.pdf | SLIDE 39","difficulty":"Medium"},{"id":"mls-v1-048","module":"v1","type":"mcq","q":"Who proposed the plum-pudding model of the atom?","options":["John Dalton","Ernest Rutherford","J. J. Thomson","Niels Bohr"],"answer":"J. J. Thomson","solution":"A: Dalton proposed the atomic theory of indivisible atoms\nB: Rutherford proposed the nuclear model after alpha scattering\nC: The lecture attributes the plum-pudding model to Thomson, who discovered the electron\nD: Bohr proposed electrons in quantized energy levels","source":"Lecture 2-Structure of the Atom-Nathaniel Yebuah.pdf | SLIDE 11","difficulty":"Hard"},{"id":"mls-v1-049","module":"v1","type":"mcq","q":"What conclusion did Rutherford draw from the alpha-particle scattering experiment?","options":["Most of the atom is empty space with a small dense positively charged nucleus","Atoms are indivisible solid spheres","Electrons are embedded in a positive sphere","Electrons occupy fixed energy levels"],"answer":"Most of the atom is empty space with a small dense positively charged nucleus","solution":"A: Most alpha particles passed through, while a few were strongly deflected back, implying a tiny dense nucleus\nB: That was Dalton's view, contradicted by the scattering results\nC: That is Thomson's plum-pudding model\nD: That is Bohr's model, developed later","source":"Lecture 2-Structure of the Atom-Nathaniel Yebuah.pdf | SLIDE 17","difficulty":"Hard"},{"id":"mls-v1-050","module":"v1","type":"mcq","q":"Which quantum number describes the orientation of an orbital in space?","options":["The principal quantum number","The magnetic quantum number","The azimuthal quantum number","The spin quantum number"],"answer":"The magnetic quantum number","solution":"A: The principal number n gives the main energy level and size\nB: It takes whole-number values from −l to +l and defines spatial orientation\nC: The angular momentum number l defines the subshell shape\nD: Spin describes the intrinsic rotation of the electron","source":"Lecture 2-Structure of the Atom-Nathaniel Yebuah.pdf | SLIDE 43","difficulty":"Devil Mode"},{"id":"mls-v1-051","module":"v1","type":"mcq","q":"What does Hund's rule state about filling degenerate orbitals?","options":["Electrons pair up before occupying empty orbitals","All electrons occupy the lowest orbital only","Electrons fill degenerate orbitals singly before pairing","Orbitals fill in order of increasingenergy only"],"answer":"Electrons fill degenerate orbitals singly before pairing","solution":"A: That is the opposite of Hund's rule\nB: That would violate the Pauli exclusion principle\nC: The slide notes degenerate orbitals are filled singly with parallel spins first\nD: That is the Aufbau principle, not Hund's rule","source":"Lecture 2-Structure of the Atom-Nathaniel Yebuah.pdf | SLIDE 50","difficulty":"Medium"},{"id":"mls-v1-052","module":"v1","type":"mcq","q":"Which periodic property is defined as the net attraction of the nucleus for the outermost electrons?","options":["Electron affinity","Ionization energy","Shielding effect","Effective nuclear charge"],"answer":"Effective nuclear charge","solution":"A: Electron affinity is the energy change on adding an electron\nB: Ionization energy is the energy needed to remove an electron\nC: Shielding is the reduction of nuclear attraction by core electrons\nD: The slides define effective nuclear charge as the net pull felt by valence electrons","source":"Lecture 2-Structure of the Atom-Nathaniel Yebuah.pdf | SLIDE 72","difficulty":"Medium"},{"id":"mls-v1-053","module":"v1","type":"mcq","q":"How does atomic radius change across a period from left to right?","options":["It increases","It decreases","It remains constant","It first increases then decreases"],"answer":"It decreases","solution":"A: An increase occurs down a group, not across a period\nB: Effective nuclear charge increases while shielding stays roughly constant, pulling electrons closer\nC: Atomic radius varies systematically across a period\nD: The trend across a period is a steady decrease","source":"Lecture 2-Structure of the Atom-Nathaniel Yebuah.pdf | SLIDE 77","difficulty":"Hard"},{"id":"mls-v1-054","module":"v1","type":"mcq","q":"What is ionization energy as defined in the atomic structure lecture?","options":["The energy released when an electron is added","The energy needed to break a covalent bond","The energy required to remove the most loosely bound electron from a gaseous atom","The energy stored in the nucleus"],"answer":"The energy required to remove the most loosely bound electron from a gaseous atom","solution":"A: That is electron affinity\nB: That is bond energy\nC: This matches the definition on the ionization energy slide\nD: That is nuclear binding energy","source":"Lecture 2-Structure of the Atom-Nathaniel Yebuah.pdf | SLIDE 86","difficulty":"Hard"},{"id":"mls-v1-055","module":"v1","type":"mcq","q":"Why do halogens have highly negative electron affinities?","options":["Halogens have completely filled shells already","Halogens have very large atomic radii","Halogens repel all incoming electrons","Adding an electron completes a stable valence shell and releases energy"],"answer":"Adding an electron completes a stable valence shell and releases energy","solution":"A: Halogens have seven valence electrons and need one more\nB: Halogens are relatively small within their periods\nC: Electron repulsion exists but is outweighed by nuclear attraction\nD: The lecture notes halogens have strongly negative electron affinities because addition gives a noble-gas configuration","source":"Lecture 2-Structure of the Atom-Nathaniel Yebuah.pdf | SLIDE 94","difficulty":"Devil Mode"},{"id":"mls-v1-056","module":"v1","type":"mcq","q":"What is the electrostatic attraction between ions of opposite charge called?","options":["An ionic bond","Hydrogen bond","Covalent bond","London dispersion force"],"answer":"An ionic bond","solution":"A: Ionic bonding results from electron transfer and subsequent electrostatic attraction\nB: Hydrogen bonding is a dipole interaction involving H bonded to F, O or N\nC: Covalent bonding involves sharing electron pairs\nD: This is a weak induced-dipole interaction","source":"Lecture 3_Bonding_Part 1- Nathaniel Yebuah.pdf | SLIDE 5","difficulty":"Medium"},{"id":"mls-v1-057","module":"v1","type":"mcq","q":"Which type of overlap forms a sigma covalent bond?","options":["Sideways overlap of p orbitals","Overlap of two lone pairs","End-to-end overlap of atomic orbitals","Overlap of nuclei"],"answer":"End-to-end overlap of atomic orbitals","solution":"A: That forms a pi bond\nB: Lone pairs do not form sigma bonds by themselves\nC: The slide states sigma bonds arise from end-to-end overlap, while pi bonds arise from sideways overlap\nD: Nuclei do not overlap in bond formation","source":"Lecture 3_Bonding_Part 1- Nathaniel Yebuah.pdf | SLIDE 23","difficulty":"Medium"},{"id":"mls-v1-058","module":"v1","type":"mcq","q":"Why does carbon in methane require hybridisation?","options":["Carbon has six unpaired electrons in its ground state","Hydrogen has no electrons to share","Methane contains ionic bonds","Ground-state carbon has only two unpaired electrons but must form four C–H bonds"],"answer":"Ground-state carbon has only two unpaired electrons but must form four C–H bonds","solution":"A: Ground-state carbon has configuration 1s²2s²2p² with two unpaired electrons\nB: Each hydrogen contributes one electron\nC: Methane contains four covalent C–H bonds\nD: Promotion and mixing of the 2s and 2p orbitals produce four equivalent sp³ orbitals","source":"Lecture 3_Bonding_Part 1- Nathaniel Yebuah.pdf | SLIDE 29","difficulty":"Hard"},{"id":"mls-v1-059","module":"v1","type":"mcq","q":"What is the shape of a BCl₃ molecule according to the bonding lecture?","options":["Trigonal planar","Tetrahedral","Linear","Pyramidal"],"answer":"Trigonal planar","solution":"A: The lecture describes BCl₃ as trigonal planar with three similar B–Cl bonds\nB: Tetrahedral geometry applies to methane and carbon tetrachloride\nC: Linear geometry applies to species such as BeH₂\nD: Pyramidal geometry applies to NH₃ with a lone pair","source":"Lecture 3_Bonding_Part 1- Nathaniel Yebuah.pdf | SLIDE 33","difficulty":"Hard"},{"id":"mls-v1-060","module":"v1","type":"mcq","q":"In a coordinate (dative) covalent bond, how are the shared electrons supplied?","options":["Each atom contributes one electron","Both electrons are donated by one of the bonded atoms","Electrons are transferred completely","Electrons are shared unequally due to electronegativity"],"answer":"Both electrons are donated by one of the bonded atoms","solution":"A: That describes an ordinary covalent bond\nB: A dative bond forms when a lone pair from one atom is donated to an electron-deficient atom\nC: That describes ionic bonding\nD: That describes a polar covalent bond","source":"Lecture 3_Bonding_Part 2 -Nathaniel Yebuah.pdf | SLIDE 3","difficulty":"Devil Mode"},{"id":"mls-v1-061","module":"v1","type":"mcq","q":"Which biological molecule highlighted in the lecture contains porphyrin rings essential for oxygen transport?","options":["Insulin","Ribonuclease","Glucose","Haemoglobin"],"answer":"Haemoglobin","solution":"A: Insulin is a peptide hormone without porphyrin\nB: Ribonuclease is an enzyme without porphyrin\nC: Glucose is a carbohydrate and contains no porphyrin\nD: The slide notes porphyrins form an integral part of haemoglobin and chlorophyll","source":"Lecture 3_Bonding_Part 2 -Nathaniel Yebuah.pdf | SLIDE 12","difficulty":"Medium"},{"id":"mls-v1-062","module":"v1","type":"mcq","q":"State the octet rule as presented by Gilbert Lewis.","options":["Atoms transfer or share electrons to attain a noble-gas configuration","Atoms always lose electrons to form cations","Atoms must have exactly eight protons","Atoms form only ionic bonds"],"answer":"Atoms transfer or share electrons to attain a noble-gas configuration","solution":"A: The lecture states atoms react to achieve the stable eight-electron arrangement of noble gases\nB: Sharing also occurs, as in covalent bonding\nC: The rule concerns valence electrons, not protons\nD: Covalent sharing also satisfies the octet rule","source":"Lecture 3_Bonding_Part 2 -Nathaniel Yebuah.pdf | SLIDE 16","difficulty":"Medium"},{"id":"mls-v1-063","module":"v1","type":"mcq","q":"Why is CO₂ non-polar despite having polar C=O bonds?","options":["Carbon and oxygen have equal electronegativity","Its linear shape causes the two bond dipoles to cancel","CO₂ contains only ionic bonds","The molecule has a net dipole moment"],"answer":"Its linear shape causes the two bond dipoles to cancel","solution":"A: Oxygen is more electronegative than carbon, so the bonds are polar\nB: The lecture notes that the linear nature of CO₂ makes the polarity cancel\nC: The bonds are covalent and polar\nD: Experimentally CO₂ has zero dipole moment","source":"Lecture 3_Bonding_Part 3 -Nathaniel Yebuah.pdf | SLIDE 13","difficulty":"Hard"},{"id":"mls-v1-064","module":"v1","type":"mcq","q":"Which intermolecular force is generally the strongest among London forces, dipole-dipole interactions and hydrogen bonds?","options":["London dispersion forces","Induced dipole interactions","Hydrogen bonding","Dipole-dipole attraction"],"answer":"Hydrogen bonding","solution":"A: These are the weakest of the three\nB: These are another name for dispersion forces\nC: The lecture ranks hydrogen bonds as strongest and London forces as weakest\nD: This is intermediate in strength","source":"Lecture 3_Bonding_Part 3 -Nathaniel Yebuah.pdf | SLIDE 33","difficulty":"Hard"},{"id":"mls-v1-065","module":"v1","type":"mcq","q":"Which statement best explains why water is liquid at room temperature while many similar-sized molecules are gases?","options":["Strong intermolecular hydrogen bonding raises its boiling point","Water has a very high molecular weight","Water forms ionic bonds between molecules","Water has no intermolecular forces"],"answer":"Strong intermolecular hydrogen bonding raises its boiling point","solution":"A: The lecture links water's liquid state to the strength of hydrogen bonds between its molecules\nB: Water's molar mass is only 18 g/mol\nC: Water molecules are held by hydrogen bonds, not ionic bonds\nD: Without forces it would be a gas","source":"Lecture 3_Bonding_Part 3 -Nathaniel Yebuah.pdf | SLIDE 31","difficulty":"Devil Mode"},{"id":"mls-v1-066","module":"v1","type":"mcq","q":"What is the SI unit of energy and its relationship to the calorie?","options":["Watt, with 1 calorie = 1 J","Joule, with 1 calorie = 4.184 J","Joule, with 1 calorie = 0.184 J","Calorie, with 1 J = 4.184 calories"],"answer":"Joule, with 1 calorie = 4.184 J","solution":"A: Watt is power, not energy\nB: The thermodynamics lecture gives the joule as the SI unit and the conversion factor\nC: The conversion factor is 4.184 J per calorie\nD: The calorie is not the SI unit and the ratio is inverted","source":"Lecture 4_Thermodynamics_Part 1.pdf | SLIDE 6","difficulty":"Medium"},{"id":"mls-v1-067","module":"v1","type":"mcq","q":"Which type of system allows neither matter nor energy to cross its boundary?","options":["An open system","A closed system","An isolated system","An adiabatic system"],"answer":"An isolated system","solution":"A: An open system exchanges both matter and energy\nB: A closed system exchanges energy but not matter\nC: The lecture defines isolated systems as exchanging neither matter nor energy with surroundings\nD: Adiabatic refers to no heat transfer, not necessarily no matter exchange","source":"Lecture 4_Thermodynamics_Part 1.pdf | SLIDE 17","difficulty":"Medium"},{"id":"mls-v1-068","module":"v1","type":"mcq","q":"State the first law of thermodynamics in terms of internal energy change.","options":["ΔE = q − w","ΔE = q only","ΔE = w only","ΔE = q + w"],"answer":"ΔE = q + w","solution":"A: The sign convention used in the slides adds work done on the system\nB: Work also changes internal energy\nC: Heat also changes internal energy\nD: The change in internal energy equals heat added to the system plus work done on it","source":"Lecture 4_Thermodynamics_Part 1.pdf | SLIDE 27","difficulty":"Hard"},{"id":"mls-v1-069","module":"v1","type":"mcq","q":"Which property depends on the amount of matter present in a system?","options":["An intensive property","An extensive property","A state function","A path function"],"answer":"An extensive property","solution":"A: Intensive properties are independent of amount\nB: Volume, enthalpy and entropy are given as examples of extensive properties\nC: State functions may be intensive or extensive\nD: Path functions such as heat and work depend on the path","source":"Lecture 4_Thermodynamics_Part 1.pdf | SLIDE 22","difficulty":"Hard"},{"id":"mls-v1-070","module":"v1","type":"mcq","q":"What is enthalpy change ΔH measured as for reactions at constant pressure?","options":["The work done at constant volume","The entropy change of the surroundings","The heat exchanged at constant pressure (qp)","The internal energy at absolute zero"],"answer":"The heat exchanged at constant pressure (qp)","solution":"A: Constant-pressure heat is enthalpy, not work\nB: Entropy is a separate state function\nC: The slides state ΔH equals qp, also called the heat of reaction\nD: That is not enthalpy","source":"Lecture 4_Thermodynamics_Part 2.pdf | SLIDE 6","difficulty":"Devil Mode"},{"id":"mls-v1-071","module":"v1","type":"mcq","q":"Define entropy S of a system in the thermodynamics lecture.","options":["A measure of total heat content","A measure of molecular speed","The energy available to do work","The degree of randomness or disorder of the system"],"answer":"The degree of randomness or disorder of the system","solution":"A: That is enthalpy\nB: That relates to temperature and kinetic energy\nC: That is Gibbs free energy\nD: The slide defines entropy as randomness or disorder","source":"Lecture 4_Thermodynamics_Part 2.pdf | SLIDE 13","difficulty":"Medium"},{"id":"mls-v1-072","module":"v1","type":"mcq","q":"What is the sign of ΔG for a spontaneous process at constant temperature and pressure?","options":["Negative","Positive","Zero","Always equal to ΔH"],"answer":"Negative","solution":"A: A spontaneous process has a negative Gibbs free energy change\nB: A positive ΔG corresponds to a non-spontaneous process\nC: Zero ΔG indicates equilibrium\nD: ΔG = ΔH − TΔS, so it is not generally equal to ΔH","source":"Lecture 4_Thermodynamics_Part 2.pdf | SLIDE 27","difficulty":"Medium"},{"id":"mls-v1-073","module":"v1","type":"mcq","q":"Why is ATP described as the universal energy currency of the cell?","options":["It stores energy permanently without being hydrolysed","It is the only high-energy compound in cells","It links exergonic and endergonic reactions by donating phosphate","It is produced only in the absence of oxygen"],"answer":"It links exergonic and endergonic reactions by donating phosphate","solution":"A: ATP is continually hydrolysed and regenerated\nB: PEP and thiol esters are also high-energy compounds\nC: The lecture describes ATP as the major link between energy-releasing and energy-requiring reactions\nD: ATP is made aerobically and anaerobically","source":"Lecture 4_Thermodynamics_Part 2.pdf | SLIDE 36","difficulty":"Hard"},{"id":"mls-v1-074","module":"v1","type":"mcq","q":"What branch of chemistry deals with the rates and mechanisms of chemical reactions?","options":["Thermodynamics","Electrochemistry","Stereochemistry","Chemical kinetics"],"answer":"Chemical kinetics","solution":"A: Thermodynamics deals with energy and spontaneity, not rates\nB: Electrochemistry deals with electron transfer and cells\nC: Stereochemistry deals with three-dimensional molecular arrangements\nD: The lecture defines kinetics as the study of rates, velocities and pathways of reactions","source":"Lecture 5_Chemical kinetics_Part 1.pdf | SLIDE 3","difficulty":"Hard"},{"id":"mls-v1-075","module":"v1","type":"mcq","q":"Which experimental method monitors a reaction by measuring ions in solution?","options":["Conductivity measurement","Polarimetry","Viscometry","Colorimetry"],"answer":"Conductivity measurement","solution":"A: The lecture states conductivity measures ion concentration and can follow reactions producing or consuming ions\nB: Polarimetry follows optical rotation, as in sucrose hydrolysis\nC: Viscometry follows changes in viscosity\nD: Colorimetry follows colour intensity changes","source":"Lecture 5_Chemical kinetics_Part 1.pdf | SLIDE 17","difficulty":"Devil Mode"},{"id":"mls-v1-076","module":"v1","type":"mcq","q":"What is the rate law of a reaction?","options":["An equation relating rate to temperature only","An equation relating rate to reactant concentrations","A balanced stoichiometric equation","A statement of equilibrium concentrations"],"answer":"An equation relating rate to reactant concentrations","solution":"A: Temperature effects are described by Arrhenius, not the rate law\nB: The lecture defines the rate law as an expression of rate in terms of concentrations\nC: Stoichiometry alone does not give the rate law\nD: That describes the equilibrium constant","source":"Lecture 5_Chemical Kinetics_Part 2- Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Medium"},{"id":"mls-v1-077","module":"v1","type":"mcq","q":"For a first-order reaction, how is the half-life related to the rate constant k?","options":["t½ = k / ln 2","t½ = 1/(k[A]₀)","t½ = [A]₀ / (2k)","t½ = ln 2 / k"],"answer":"t½ = ln 2 / k","solution":"A: This inverts the correct relationship\nB: That is the half-life form for a second-order reaction\nC: That is not the first-order half-life expression\nD: The lecture gives the first-order half-life as 0.693/k, independent of initial concentration","source":"Lecture 5_Chemical Kinetics_Part 2- Nathaniel Yebuah.pdf | SLIDE 19","difficulty":"Medium"},{"id":"mls-v1-078","module":"v1","type":"mcq","q":"What does the Arrhenius equation explain about reaction rates?","options":["How increasing temperature raises the rate by increasing molecular kinetic energy","How catalysts change equilibrium position","How concentration affects equilibrium constant","How pressure changes the activation energy"],"answer":"How increasing temperature raises the rate by increasing molecular kinetic energy","solution":"A: The lecture states temperature increases average kinetic energy and hence rate\nB: Catalysts do not change equilibrium position\nC: K depends on temperature, not concentration\nD: Activation energy is not changed by pressure","source":"Lecture 5_Chemical Kinetics_Part 2- Nathaniel Yebuah.pdf | SLIDE 28","difficulty":"Hard"},{"id":"mls-v1-079","module":"v1","type":"mcq","q":"What is a catalyst as defined in the kinetics lecture?","options":["A reactant consumed during the reaction","A substance that speeds up a reaction without permanent chemical change","A product that accelerates the reaction","A substance that changes the equilibrium constant"],"answer":"A substance that speeds up a reaction without permanent chemical change","solution":"A: A catalyst is regenerated and not consumed\nB: The lecture defines a catalyst in exactly these terms\nC: That would be autocatalysis, not the general definition\nD: Catalysts do not change K","source":"Lecture 5_Chemical Kinetics_Part 2- Nathaniel Yebuah.pdf | SLIDE 40","difficulty":"Hard"},{"id":"mls-v1-080","module":"v1","type":"mcq","q":"At chemical equilibrium, what is true of the forward and reverse reaction rates?","options":["Both are zero","The forward rate exceeds the reverse rate","They are equal","The equilibrium constant becomes zero"],"answer":"They are equal","solution":"A: Reactions continue dynamically at equilibrium\nB: That describes a system not yet at equilibrium\nC: The lecture states equilibrium is attained when the forward and backward rates are equal\nD: K is nonzero at equilibrium","source":"Lecture 6_Chemical equilibrium_Part 1 - Benjamin Abbam.pdf | SLIDE 4","difficulty":"Devil Mode"},{"id":"mls-v1-081","module":"v1","type":"mcq","q":"What is the reaction quotient Q when the system is at equilibrium?","options":["Q = K","Q > K","Q < K","Q = 0"],"answer":"Q = K","solution":"A: The slides state that when Q equals K no net change occurs\nB: This indicates net reverse reaction\nC: This indicates net forward reaction\nD: That would mean no products present","source":"Lecture 6_Chemical equilibrium_Part 1 - Benjamin Abbam.pdf | SLIDE 14","difficulty":"Medium"},{"id":"mls-v1-082","module":"v1","type":"mcq","q":"State Le Chatelier's principle.","options":["A system always shifts toward products","A system at equilibrium shifts to counteract an applied stress","A catalyst changes the equilibrium position","Increasing pressure always favours more moles of gas"],"answer":"A system at equilibrium shifts to counteract an applied stress","solution":"A: The direction depends on the nature of the stress\nB: The equilibrium slides define the principle as the system responding to offset a disturbance\nC: A catalyst only speeds attainment of equilibrium\nD: It favours fewer moles of gas","source":"Lecture 6_Chemical equilibrium_Part 2 - Benjamin Abbam.pdf | SLIDE 4","difficulty":"Medium"},{"id":"mls-v1-083","module":"v1","type":"mcq","q":"Effect of increasing pressure (by reducing volume) on a gaseous equilibrium?","options":["It shifts toward the side with more moles of gas","It has no effect on gaseous equilibria","It shifts toward the side with fewer moles of gas","It changes the equilibrium constant"],"answer":"It shifts toward the side with fewer moles of gas","solution":"A: That would increase pressure further\nB: Pressure changes can shift gaseous equilibria\nC: The lecture uses N₂O₄ ⇌ 2NO₂ to illustrate this effect\nD: K changes only with temperature","source":"Lecture 6_Chemical equilibrium_Part 2 - Benjamin Abbam.pdf | SLIDE 13","difficulty":"Hard"},{"id":"mls-v1-084","module":"v1","type":"mcq","q":"What happens to blood glucose in the fed state according to the steady-state discussion?","options":["It rises indefinitely after a meal","It falls to zero between meals","It is independent of insulin","It remains constant because glucose transfer to tissues balances input"],"answer":"It remains constant because glucose transfer to tissues balances input","solution":"A: Regulation prevents unbounded rise\nB: Gluconeogenesis and glycogenolysis maintain glucose\nC: Insulin is central to glucose regulation\nD: The slide describes blood glucose as a steady state in the fed state","source":"Lecture 6_Chemical equilibrium_Part 2 - Benjamin Abbam.pdf | SLIDE 23","difficulty":"Hard"},{"id":"mls-v1-085","module":"v1","type":"mcq","q":"What does the field of biophysics apply to the study of biological systems?","options":["Only chemical reaction pathways","The principles and methods of physics","Statistical methods alone","Only microscopic anatomy"],"answer":"The principles and methods of physics","solution":"A: That is the domain of chemistry, not biophysics\nB: Biophysics uses concepts such as mechanics, electricity and waves to explain biological function\nC: Statistics supports research but is not the defining tool of biophysics\nD: That is histology, a different discipline","source":"Lecture 1-Intro to Biophysics-Nathaniel Yebuah.pdf | SLIDE 5","difficulty":"Devil Mode"},{"id":"mls-v1-086","module":"v1","type":"mcq","q":"Which branch of mechanics deals with forces acting on the human body and its structures?","options":["Electrodynamics","Thermodynamics","Human mechanics","Quantum mechanics"],"answer":"Human mechanics","solution":"A: That deals with moving charges and electromagnetic fields\nB: That deals with heat and energy transfer\nC: The course includes a lecture titled Human Mechanics, covering forces and motion in the body\nD: That deals with atomic-scale phenomena","source":"Lecture 2_Human Mechanics - Nathaniel Yebuahpdf | SLIDE 3","difficulty":"Medium"},{"id":"mls-v1-087","module":"v1","type":"mcq","q":"Medical ultrasound waves have frequencies that are how large compared with audible sound?","options":["Slightly lower","Exactly equal","Only marginally higher at 20–30 Hz","Several orders of magnitude higher"],"answer":"Several orders of magnitude higher","solution":"A: Ultrasound is above, not below, the audible range\nB: Ultrasound is defined by being beyond human hearing\nC: That range is audible or infrasound, not ultrasound\nD: The lecture states medical ultrasound frequencies are several magnitudes higher than audible sound","source":"Lecture 3-Physics of hearing - Nathaniel Yebuah.pdf | SLIDE 14","difficulty":"Medium"},{"id":"mls-v1-088","module":"v1","type":"mcq","q":"What is the threshold of hearing on the decibel scale as shown in the hearing lecture?","options":["0 dB","10 dB","60 dB","120 dB"],"answer":"0 dB","solution":"A: The slide labels 0 dB as the threshold of hearing and 120 dB as the threshold of pain\nB: This is a quiet sound but not the defined threshold\nC: This is conversational speech level\nD: This is the threshold of pain","source":"Lecture 3-Physics of hearing - Nathaniel Yebuah.pdf | SLIDE 46","difficulty":"Hard"},{"id":"mls-v1-089","module":"v1","type":"mcq","q":"What is the threshold of pain in the decibel scale presented in the physics of hearing lecture?","options":["0 dB","80 dB","120 dB","140 dB"],"answer":"120 dB","solution":"A: This is the threshold of hearing\nB: This is loud but below the pain threshold\nC: The slide explicitly labels 120 dB as the threshold of pain\nD: This is above the stated threshold of pain","source":"Lecture 3-Physics of hearing - Nathaniel Yebuah.pdf | SLIDE 46","difficulty":"Hard"},{"id":"mls-v1-090","module":"v1","type":"mcq","q":"In diagnostic ultrasound, what fraction of the time does the transducer transmit ultrasound pulses?","options":["50% of the time","100% of the time","10% of the time","About 1% of the time"],"answer":"About 1% of the time","solution":"A: Continuous transmission would not allow echo detection\nB: The transducer must also listen for returning echoes\nC: That is higher than the value given in the slides\nD: The lecture states the transducer produces pulses and transmits only about 1% of the time","source":"Lecture 3-Physics of hearing - Nathaniel Yebuah.pdf | SLIDE 75","difficulty":"Devil Mode"},{"id":"mls-v1-091","module":"v1","type":"mcq","q":"What is the Doppler effect?","options":["A change in observed frequency due to relative motion of source and observer","A change in wave amplitude with distance","The bending of a wave at an interface","The reflection of a wave from a surface"],"answer":"A change in observed frequency due to relative motion of source and observer","solution":"A: The lecture defines the Doppler effect exactly as a frequency change from relative motion\nB: Amplitude attenuation is not the Doppler effect\nC: That is refraction\nD: That is echo formation, not frequency shift","source":"Lecture 3-Physics of hearing - Nathaniel Yebuah.pdf | SLIDE 99","difficulty":"Medium"},{"id":"mls-v1-092","module":"v1","type":"mcq","q":"A common everyday example of Doppler shift given in the lecture is what?","options":["The echo of a shout in a valley","The change in pitch of a vehicle horn as it approaches and passes","The colour of the sky at sunset","The loudness of a whisper"],"answer":"The change in pitch of a vehicle horn as it approaches and passes","solution":"A: An echo involves reflection, not frequency shift due to motion\nB: The slide cites the changing pitch of a horn as a classic Doppler shift example\nC: That is scattering of light\nD: Loudness is amplitude, not frequency shift","source":"Lecture 3-Physics of hearing - Nathaniel Yebuah.pdf | SLIDE 100","difficulty":"Medium"},{"id":"mls-v1-093","module":"v1","type":"mcq","q":"What is a transducer as defined in the ultrasound lecture?","options":["A device that only amplifies sound","A device that stores electrical energy","A device that measures temperature","A device that converts one form of energy into another"],"answer":"A device that converts one form of energy into another","solution":"A: Amplification alone is not energy conversion\nB: That is a capacitor\nC: That is a thermometer\nD: The lecture gives this general definition of a transducer","source":"Lecture 3-Physics of hearing - Nathaniel Yebuah.pdf | SLIDE 104","difficulty":"Hard"},{"id":"mls-v1-094","module":"v1","type":"mcq","q":"What is the piezoelectric effect?","options":["Generation of an electrical signal when mechanical stress is applied to a crystal","Generation of sound from an applied magnetic field","Conversion of heat into light","Flow of current through a conductor without a field"],"answer":"Generation of an electrical signal when mechanical stress is applied to a crystal","solution":"A: The lecture describes sound waves striking a piezoelectric crystal producing an electrical response\nB: That is not the piezoelectric effect\nC: That is thermoluminescence\nD: That is not a physical effect","source":"Lecture 3-Physics of hearing - Nathaniel Yebuah.pdf | SLIDE 105","difficulty":"Hard"},{"id":"mls-v1-095","module":"v1","type":"mcq","q":"What is the reverse piezoelectric effect?","options":["Production of electricity from pressure alone","Production of mechanical vibration when an electrical signal is applied to a crystal","Conversion of light into electricity","Amplification of a sound wave by a lens"],"answer":"Production of mechanical vibration when an electrical signal is applied to a crystal","solution":"A: That is the direct piezoelectric effect\nB: The lecture notes applying an electrical signal causes deformation, generating ultrasound\nC: That is the photoelectric effect\nD: That is acoustic focusing","source":"Lecture 3-Physics of hearing - Nathaniel Yebuah.pdf | SLIDE 107","difficulty":"Devil Mode"},{"id":"mls-v1-096","module":"v1","type":"mcq","q":"Which naturally occurring crystal was first used as a stable resonator in ultrasound work?","options":["Lead zirconate titanate","Topaz","Quartz","Feldspar"],"answer":"Quartz","solution":"A: PZT is synthetic and now the most common diagnostic material\nB: Topaz is not a standard transducer material\nC: The lecture states quartz is naturally piezoelectric and was first used as a stable resonator\nD: Feldspar is not used as a piezoelectric resonator","source":"Lecture 3-Physics of hearing - Nathaniel Yebuah.pdf | SLIDE 109","difficulty":"Medium"},{"id":"mls-v1-097","module":"v1","type":"mcq","q":"What is the Curie point of a piezoelectric crystal?","options":["The temperature to which crystals are heated in a strong electric field to align domains","The temperature at which a crystal melts","The temperature at which sound travels fastest","The point where the crystal becomes conductive"],"answer":"The temperature to which crystals are heated in a strong electric field to align domains","solution":"A: The lecture defines the Curie point in terms of heating in the presence of a strong electrical field\nB: Melting point is different from the Curie point\nC: That is not the Curie point\nD: That is not the stated definition","source":"Lecture 3-Physics of hearing - Nathaniel Yebuah.pdf | SLIDE 110","difficulty":"Medium"},{"id":"mls-v1-098","module":"v1","type":"mcq","q":"Which material is the most common piezoelectric material in diagnostic ultrasound transducers?","options":["Quartz","Lead zirconate titanate (PZT)","Barium titanate alone","Silicon"],"answer":"Lead zirconate titanate (PZT)","solution":"A: Quartz is natural but no longer the most common diagnostic material\nB: The lecture states PZT is the most common piezoelectric material in diagnostic ultrasound\nC: It is a piezoelectric ceramic but not identified as the most common\nD: Silicon is not piezoelectric in the relevant sense","source":"Lecture 3-Physics of hearing - Nathaniel Yebuah.pdf | SLIDE 112","difficulty":"Hard"},{"id":"mls-v1-099","module":"v1","type":"mcq","q":"Which part of a basic ultrasound machine sends and receives the sound waves?","options":["A display monitor","A keyboard","The transducer probe","A printer"],"answer":"The transducer probe","solution":"A: The monitor displays images, it does not send sound\nB: The keyboard controls settings only\nC: The lecture lists the transducer probe as the component that sends and receives sound\nD: The printer records images","source":"Lecture 3-Physics of hearing - Nathaniel Yebuah.pdf | SLIDE 103","difficulty":"Hard"},{"id":"mls-v1-100","module":"v1","type":"mcq","q":"In optics, which condition describes a converging (convex) lens correcting hypermetropia?","options":["A concave lens is used","The lens reduces the eye's focusing power","The lens is placed only in the ear","It adds converging power to focus images onto the retina"],"answer":"It adds converging power to focus images onto the retina","solution":"A: Concave lenses correct myopia\nB: Hypermetropia needs increased convergence\nC: That would not correct vision\nD: Hypermetropia is long-sightedness corrected by a convex lens","source":"Lecture 4-Physics Of Eyes-Part 2-Nathaniel Yebuah.pdf | SLIDE 6","difficulty":"Devil Mode"},{"id":"mls-v1-101","module":"v1","type":"mcq","q":"Myopia (short-sightedness) is corrected by which type of lens?","options":["A convex lens","A concave (diverging) lens","A plane lens","A cylindrical lens alone"],"answer":"A concave (diverging) lens","solution":"A: Convex lenses are used for hypermetropia\nB: A diverging lens moves the focal point back onto the retina in myopia\nC: A plane glass has no focusing power\nD: Cylindrical lenses correct astigmatism, not simple myopia","source":"Lecture 5-Physics Of Eyes Part 2-Nathaniel Yebuah.pdf | SLIDE 6","difficulty":"Medium"},{"id":"mls-v1-102","module":"v1","type":"mcq","q":"The power of a lens in dioptres is defined as what?","options":["The product of focal length and refractive index","The ratio of image size to object size","The reciprocal of focal length in metres","The distance between the lens and retina"],"answer":"The reciprocal of focal length in metres","solution":"A: That is not lens power\nB: That is magnification\nC: Lens power P = 1/f, with f in metres, so unit is dioptre\nD: That is an anatomical distance","source":"Lecture 5-Physics Of Eyes Part 2-Nathaniel Yebuah.pdf | SLIDE 10","difficulty":"Medium"},{"id":"mls-v1-103","module":"v1","type":"mcq","q":"Which optical defect results from an irregularly shaped cornea or lens?","options":["Myopia","Hypermetropia","Presbyopia","Astigmatism"],"answer":"Astigmatism","solution":"A: Myopia is short-sightedness from an elongated eyeball\nB: Hypermetropia is long-sightedness\nC: Presbyopia is age-related loss of accommodation\nD: Astigmatism arises from unequal curvature in different meridians of the eye","source":"Lecture 5-Physics Of Eyes Part 2-Nathaniel Yebuah.pdf | SLIDE 12","difficulty":"Hard"},{"id":"mls-v1-104","module":"v1","type":"mcq","q":"According to Poiseuille's law, the flow rate of a liquid through a tube is directly proportional to which quantity?","options":["The fourth power of the tube radius","The first power of the radius","The square of the tube length","The viscosity of the liquid"],"answer":"The fourth power of the tube radius","solution":"A: Flow increases steeply with radius, proportional to r⁴\nB: The radius enters to the fourth power, not linearly\nC: Flow is inversely proportional to length\nD: Flow is inversely proportional to viscosity","source":"Lecture 6_Hemodynamics -Nathaniel Yebuah.pdf | SLIDE 20","difficulty":"Hard"},{"id":"mls-v1-105","module":"v1","type":"mcq","q":"In hemodynamics, what quantity is the product of blood flow and total peripheral resistance analogous to?","options":["The heart rate alone","The blood viscosity only","The pressure difference across the vascular bed","The stroke volume only"],"answer":"The pressure difference across the vascular bed","solution":"A: Heart rate contributes to flow but is not the product\nB: Viscosity is one determinant of resistance\nC: Ohm's law analogy gives ΔP = Q × R for the circulation\nD: Stroke volume contributes to flow","source":"Lecture 6_Hemodynamics -Nathaniel Yebuah.pdf | SLIDE 25","difficulty":"Devil Mode"},{"id":"mls-v1-106","module":"v1","type":"mcq","q":"Which law relates the voltage, current and resistance in bioelectric circuits?","options":["Poiseuille's law","Snell's law","Charles' law","Ohm's law"],"answer":"Ohm's law","solution":"A: That applies to fluid flow in tubes\nB: That applies to refraction of light\nC: That relates gas volume and temperature\nD: V = IR is used to model current flow through biological conductors","source":"Lecture 8-Bioelectricity-Nathaniel Yebuah.pdf | SLIDE 8","difficulty":"Medium"},{"id":"mls-v1-107","module":"v1","type":"mcq","q":"What is the resting membrane potential of a typical neuron approximately?","options":["−70 mV","+70 mV","0 mV","−120 mV"],"answer":"−70 mV","solution":"A: The inside of the neuron is negative relative to outside at rest\nB: That is closer to the peak of an action potential\nC: No potential difference would mean no resting polarization\nD: This is more negative than typical resting potential","source":"Lecture 8-Bioelectricity-Nathaniel Yebuah.pdf | SLIDE 20","difficulty":"Medium"},{"id":"mls-v1-108","module":"v1","type":"mcq","q":"Which ions are primarily responsible for the rising phase of the action potential?","options":["Potassium ions leaving the cell","Sodium ions entering the cell","Calcium ions leaving the cell","Chloride ions entering the cell"],"answer":"Sodium ions entering the cell","solution":"A: K⁺ efflux causes repolarization\nB: Voltage-gated Na⁺ channels open, causing rapid depolarization\nC: Ca²⁺ is not the main mechanism of the neuronal action potential\nD: Cl⁻ influx is generally inhibitory","source":"Lecture 8-Bioelectricity-Nathaniel Yebuah.pdf | SLIDE 25","difficulty":"Hard"},{"id":"mls-v1-109","module":"v1","type":"mcq","q":"Which mechanism maintains homeostasis in the body most commonly?","options":["Positive feedback","Feedforward only","No feedback control","Negative feedback"],"answer":"Negative feedback","solution":"A: Positive feedback amplifies changes and is used in special cases such as childbirth\nB: Feedforward anticipates change but is not the main homeostatic mechanism\nC: Homeostasis depends on feedback systems\nD: A deviation triggers a response that reverses the deviation","source":"Lecture 9-Homeostasis-Nathaniel Yebuah.pdf | SLIDE 7","difficulty":"Hard"},{"id":"mls-v1-110","module":"v1","type":"mcq","q":"Which of the following is an example of positive feedback in physiology?","options":["Amplification of uterine contractions during childbirth","Regulation of blood glucose by insulin","Thermoregulation through sweating","Blood pressure baroreflex"],"answer":"Amplification of uterine contractions during childbirth","solution":"A: The homeostasis slides cite uterine contractions and blood clotting as positive feedback\nB: That is negative feedback\nC: That is negative feedback\nD: That is negative feedback","source":"Lecture 9-Homeostasis-Nathaniel Yebuah.pdf | SLIDE 12","difficulty":"Devil Mode"},{"id":"mls-v1-111","module":"v1","type":"mcq","q":"Which variable is NOT typically listed as a major essential variable of the internal environment?","options":["Body temperature","The colour of the skin","Blood glucose","Blood water content"],"answer":"The colour of the skin","solution":"A: Temperature is tightly regulated\nB: The slides list variables such as body temperature, blood
