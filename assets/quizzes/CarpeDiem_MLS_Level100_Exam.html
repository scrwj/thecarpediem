n","Crossing over","Anaphase lag","Translocation"],"answer":"Anaphase lag","solution":"A: That is failure to disjoin\nB: That is exchange of segments\nC: The lecture states aneuploidy can arise from a chromosome trapped in one cell due to delayed movement\nD: That is movement of a segment to another chromosome","source":"Module 6-VARIATIONS IN CHROMOSOME NUMBER-Nathaniel Yebuah.pdf | SLIDE 14","difficulty":"Hard"},{"id":"mls-v1-250","module":"v1","type":"mcq","q":"What is monosomy?","options":["The gain of one chromosome (2n + 1)","The loss of both chromosomes of a pair","The gain of a whole haploid set","The loss of one chromosome from a diploid pair (2n − 1)"],"answer":"The loss of one chromosome from a diploid pair (2n − 1)","solution":"A: That is trisomy\nB: That is nullisomy\nC: That is polyploidy\nD: The lecture defines monosomics as diploid organisms missing one chromosome of a pair","source":"Module 6-VARIATIONS IN CHROMOSOME NUMBER-Nathaniel Yebuah.pdf | SLIDE 16","difficulty":"Devil Mode"},{"id":"mls-v1-251","module":"v1","type":"mcq","q":"Which syndrome is associated with monosomy of the X chromosome?","options":["Turner syndrome (45,X)","Down syndrome","Klinefelter syndrome","Patau syndrome"],"answer":"Turner syndrome (45,X)","solution":"A: The lecture lists Turner syndrome as XO females\nB: That is trisomy 21\nC: That is XXY\nD: That is trisomy 13","source":"Module 6-VARIATIONS IN CHROMOSOME NUMBER-Nathaniel Yebuah.pdf | SLIDE 17","difficulty":"Medium"},{"id":"mls-v1-252","module":"v1","type":"mcq","q":"What is the karyotype of Down syndrome?","options":["45,X","47, +21","47,XXY","46,XY"],"answer":"47, +21","solution":"A: That is Turner syndrome\nB: The lecture states Down syndrome is trisomy 21 with 47 chromosomes\nC: That is Klinefelter syndrome\nD: That is a normal male","source":"Module 6-VARIATIONS IN CHROMOSOME NUMBER-Nathaniel Yebuah.pdf | SLIDE 49","difficulty":"Medium"},{"id":"mls-v1-253","module":"v1","type":"mcq","q":"Which clinical feature is associated with Down syndrome in the lecture?","options":["Webbed neck","Very tall stature with long limbs","Extreme obesity","Short stature"],"answer":"Short stature","solution":"A: That is characteristic of Turner syndrome\nB: That is associated with Marfan syndrome\nC: That is not listed\nD: The lecture lists short stature among easily recognized features","source":"Module 6-VARIATIONS IN CHROMOSOME NUMBER-Nathaniel Yebuah.pdf | SLIDE 20","difficulty":"Hard"},{"id":"mls-v1-254","module":"v1","type":"mcq","q":"What is a deletion in chromosome terminology?","options":["The loss of a chromosomal segment","The addition of a repeated segment","A 180-degree reversal of a segment","Exchange between non-homologous chromosomes"],"answer":"The loss of a chromosomal segment","solution":"A: The lecture defines deletion as loss of a segment, often lethal when homozygous\nB: That is duplication\nC: That is inversion\nD: That is translocation","source":"Module 6-VARIATIONS IN CHROMOSOME NUMBER-Nathaniel Yebuah.pdf | SLIDE 32","difficulty":"Hard"},{"id":"mls-v1-255","module":"v1","type":"mcq","q":"What is an inversion?","options":["The loss of a segment","A 180-degree reversal of a chromosomal segment","The transfer of a segment to a non-homologous chromosome","The doubling of a segment"],"answer":"A 180-degree reversal of a chromosomal segment","solution":"A: That is deletion\nB: The lecture defines inversions as 180° reversals of segments\nC: That is translocation\nD: That is duplication","source":"Module 6-VARIATIONS IN CHROMOSOME NUMBER-Nathaniel Yebuah.pdf | SLIDE 40","difficulty":"Devil Mode"},{"id":"mls-v1-256","module":"v1","type":"mcq","q":"Which syndrome results from trisomy 13?","options":["Edward syndrome","Down syndrome","Patau syndrome","Turner syndrome"],"answer":"Patau syndrome","solution":"A: That is trisomy 18\nB: That is trisomy 21\nC: The lecture states Patau syndrome is 47,+13\nD: That is 45,X","source":"Module 6-VARIATIONS IN CHROMOSOME NUMBER-Nathaniel Yebuah.pdf | SLIDE 53","difficulty":"Medium"},{"id":"mls-v1-257","module":"v1","type":"mcq","q":"What is Klinefelter syndrome?","options":["A male with two X chromosomes and one Y (47,XXY)","45,X female","47,XYY male","Trisomy 21"],"answer":"A male with two X chromosomes and one Y (47,XXY)","solution":"A: The lecture defines Klinefelter as XXY with 44 autosomes\nB: That is Turner syndrome\nC: That is the XYY condition\nD: That is Down syndrome","source":"Module 6-VARIATIONS IN CHROMOSOME NUMBER-Nathaniel Yebuah.pdf | SLIDE 66","difficulty":"Medium"},{"id":"mls-v1-258","module":"v1","type":"mcq","q":"How can XYY males arise?","options":["Nondisjunction of X chromosomes in meiosis I","Nondisjunction of Y chromatids during meiosis II","Failure of cytokinesis","A translocation of the Y to an autosome"],"answer":"Nondisjunction of Y chromatids during meiosis II","solution":"A: That would produce XX gametes\nB: The lecture states XYY males result from nondisjunction of Y chromatids in the second meiotic division\nC: That is not the stated mechanism\nD: That is not the stated mechanism","source":"Module 6-VARIATIONS IN CHROMOSOME NUMBER-Nathaniel Yebuah.pdf | SLIDE 71","difficulty":"Hard"},{"id":"mls-v1-259","module":"v1","type":"mcq","q":"What is amniocentesis used for in the chromosome lecture?","options":["Measuring maternal blood pressure","Determining blood group","Karyotyping fetal cells to detect aneuploidy","Assessing lung function"],"answer":"Karyotyping fetal cells to detect aneuploidy","solution":"A: That is not amniocentesis\nB: That is not amniocentesis\nC: The lecture states a sample of amniotic fluid is drawn and fetal cells karyotyped\nD: That is not amniocentesis","source":"Module 6-VARIATIONS IN CHROMOSOME NUMBER-Nathaniel Yebuah.pdf | SLIDE 51","difficulty":"Hard"},{"id":"mls-v1-260","module":"v1","type":"mcq","q":"Which gene triggers male sex determination in humans?","options":["SRG","H-Y antigen alone","The Xist gene","SRY (sex-determining region Y)"],"answer":"SRY (sex-determining region Y)","solution":"A: That is not the gene named\nB: That is not the primary trigger\nC: That is involved in X inactivation\nD: The lecture identifies the SRY gene on the Y chromosome","source":"Module 7-SEX DETERMINATION AND SEX LINKAGE-Nathaniel Yebuah.pdf | SLIDE 12","difficulty":"Devil Mode"},{"id":"mls-v1-261","module":"v1","type":"mcq","q":"Which sex-determination system has heterogametic females (ZW)?","options":["XY system","The ZZ-ZW system","Haplodiploidy","Environmental determination"],"answer":"The ZZ-ZW system","solution":"A: In the XY system males are heterogametic\nB: The lecture states heterogametic females occur in birds and butterflies\nC: That involves fertilized and unfertilized eggs\nD: That depends on incubation temperature","source":"Module 7-SEX DETERMINATION AND SEX LINKAGE-Nathaniel Yebuah.pdf | SLIDE 14","difficulty":"Medium"},{"id":"mls-v1-262","module":"v1","type":"mcq","q":"In Drosophila, what X-to-autosome ratio produces a normal male?","options":["Two X with two sets (2X:2A)","Three X with two sets (3X:2A)","One X with two haploid sets of autosomes (1X:2A)","One X with one set (1X:1A)"],"answer":"One X with two haploid sets of autosomes (1X:2A)","solution":"A: That gives a normal female\nB: That gives a metafemale\nC: The lecture states this ratio gives a normal male\nD: That is not the normal male ratio","source":"Module 7-SEX DETERMINATION AND SEX LINKAGE-Nathaniel Yebuah.pdf | SLIDE 17","difficulty":"Medium"},{"id":"mls-v1-263","module":"v1","type":"mcq","q":"In the haplodiploidy system of Hymenoptera, how do males arise?","options":["From fertilized eggs only","By budding","By parthenogenesis of females only","From unfertilized eggs"],"answer":"From unfertilized eggs","solution":"A: That gives females\nB: That is not the mechanism\nC: Males arise from unfertilized eggs, which is parthenogenesis, but the precise contrast with fertilized eggs is the point\nD: The lecture states females come from fertilized eggs and males from unfertilized eggs","source":"Module 7-SEX DETERMINATION AND SEX LINKAGE-Nathaniel Yebuah.pdf | SLIDE 24","difficulty":"Hard"},{"id":"mls-v1-264","module":"v1","type":"mcq","q":"What did Morgan's white-eye Drosophila experiment demonstrate?","options":["Sex-linked inheritance of a recessive trait on the X chromosome","That all traits are dominant","That eye colour is environmental","That males have two X chromosomes"],"answer":"Sex-linked inheritance of a recessive trait on the X chromosome","solution":"A: The lecture states all white-eyed flies in F2 were males, showing X linkage\nB: White eye is recessive\nC: The pattern was genetic\nD: Male Drosophila are XY","source":"Module 7-SEX DETERMINATION AND SEX LINKAGE-Nathaniel Yebuah.pdf | SLIDE 34","difficulty":"Hard"},{"id":"mls-v1-265","module":"v1","type":"mcq","q":"What is codominance as illustrated by the MN blood group?","options":["One allele completely masks the other","The heterozygote shows an intermediate phenotype","Both alleles are fully expressed in the heterozygote","Both alleles are silent"],"answer":"Both alleles are fully expressed in the heterozygote","solution":"A: That is complete dominance\nB: That is incomplete dominance\nC: The lecture gives MN antigens as an example of codominance\nD: That is not codominance","source":"Module 8-MULTIPLE ALLELES-Nathaniel Yebuah.pdf | SLIDE 5","difficulty":"Devil Mode"},{"id":"mls-v1-266","module":"v1","type":"mcq","q":"What dominance hierarchy is given for rabbit coat colour?","options":["c > cʰ > cᶜʰ > C","C = cᶜʰ = cʰ = c","Only C and c exist","C > cᶜʰ > cʰ > c"],"answer":"C > cᶜʰ > cʰ > c","solution":"A: This reverses the stated hierarchy\nB: All alleles are not equivalent\nC: There are four alleles in the series\nD: The lecture lists this gradation for the rabbit allele series","source":"Module 8-MULTIPLE ALLELES-Nathaniel Yebuah.pdf | SLIDE 16","difficulty":"Medium"},{"id":"mls-v1-267","module":"v1","type":"mcq","q":"With five alleles at a locus, how many possible genotypes exist?","options":["15","5","10","25"],"answer":"15","solution":"A: The lecture states 5 alleles give 15 possible genotypes\nB: That counts alleles only\nC: That is the genotype count for 4 alleles\nD: That is the square of the allele number","source":"Module 8-MULTIPLE ALLELES-Nathaniel Yebuah.pdf | SLIDE 22","difficulty":"Medium"},{"id":"mls-v1-268","module":"v1","type":"mcq","q":"Which antibodies are present in the blood of a person with type O blood?","options":["No antibodies","Anti-A and anti-B","Only anti-A","Only anti-B"],"answer":"Anti-A and anti-B","solution":"A: That would leave them defenceless against A and B antigens\nB: The lecture states type O individuals lack both antigens but carry both antibodies\nC: Type A individuals have anti-B\nD: Type B individuals have anti-A","source":"Module 8-MULTIPLE ALLELES-Nathaniel Yebuah.pdf | SLIDE 34","difficulty":"Hard"},{"id":"mls-v1-269","module":"v1","type":"mcq","q":"In pedigree analysis, what is the propositus?","options":["The oldest family member","The family physician","The first child born","The individual whose phenotype drew the geneticist's attention"],"answer":"The individual whose phenotype drew the geneticist's attention","solution":"A: That is not the definition\nB: That is not the definition\nC: That is not the definition\nD: The lecture defines the propositus in these terms","source":"Module 9-PROBABILITY IN PEDIGREE ANALYSIS-Nathaniel Yebuah.pdf | SLIDE 8","difficulty":"Hard"},{"id":"mls-v1-270","module":"v1","type":"mcq","q":"What does an unaffected second generation with affected first-generation parents suggest about a trait?","options":["The trait is recessive","The trait is dominant","The trait is sex-linked dominant","The trait is mitochondrial"],"answer":"The trait is recessive","solution":"A: The lecture notes unaffected offspring of affected parents is characteristic of recessive inheritance\nB: That would generally affect each generation\nC: That does not fit the pattern\nD: Mitochondrial traits follow maternal inheritance","source":"Module 9-PROBABILITY IN PEDIGREE ANALYSIS-Nathaniel Yebuah.pdf | SLIDE 13","difficulty":"Devil Mode"},{"id":"mls-v1-271","module":"v1","type":"mcq","q":"In a monohybrid cross Aa × Aa, what is the probability that an unaffected child is a carrier?","options":["1/2","2/3","1/4","3/4"],"answer":"2/3","solution":"A: That is the probability among all offspring\nB: The lecture states among unaffected offspring the chance of Aa is two thirds\nC: That is the probability of aa\nD: That is the probability of being unaffected","source":"Module 9-PROBABILITY IN PEDIGREE ANALYSIS-Nathaniel Yebuah.pdf | SLIDE 25","difficulty":"Medium"},{"id":"mls-v1-272","module":"v1","type":"mcq","q":"How is statistics defined in the first Statistical Methods lecture?","options":["A method of guessing without data","The study of numbers only","A scientific method of collecting and analysing numerical data","The art of writing reports"],"answer":"A scientific method of collecting and analysing numerical data","solution":"A: Statistics is evidence-based\nB: Statistics is a method applied to data\nC: The slide gives this full definition of statistics\nD: That is communication","source":"Statistical-Methods 1- Nathaniel Yebuah.pdf | SLIDE 3","difficulty":"Medium"},{"id":"mls-v1-273","module":"v1","type":"mcq","q":"Which branch of statistics summarizes and describes data features?","options":["Descriptive statistics","Inferential statistics","Analytical chemistry","Clinical pathology"],"answer":"Descriptive statistics","solution":"A: The slides define descriptive statistics as describing and summarizing data\nB: Inferential statistics draws conclusions about populations\nC: That is a different discipline\nD: That is a medical specialty","source":"Statistical-Methods 1- Nathaniel Yebuah.pdf | SLIDE 12","difficulty":"Hard"},{"id":"mls-v1-274","module":"v1","type":"mcq","q":"What is the difference between a population and a sample?","options":["A population is always larger than 1000","A population is the entire group of interest; a sample is a subset of it","A sample must contain the whole population","A sample is always randomly chosen"],"answer":"A population is the entire group of interest; a sample is a subset of it","solution":"A: Size does not define a population\nB: The slides define population as the whole group and sample as the observed part\nC: That would be a census\nD: Sampling may be random or non-random","source":"Statistical-Methods 1- Nathaniel Yebuah.pdf | SLIDE 17","difficulty":"Hard"},{"id":"mls-v1-275","module":"v1","type":"mcq","q":"Which type of variable takes measurable numerical values such as height or volume?","options":["A qualitative variable","A discrete variable only","A quantitative variable","A nominal variable"],"answer":"A quantitative variable","solution":"A: Qualitative variables are categorical\nB: Discrete is a subtype of quantitative\nC: The slides give volume and height as quantitative examples\nD: Nominal variables are categorical","source":"Statistical-Methods 1- Nathaniel Yebuah.pdf | SLIDE 20","difficulty":"Devil Mode"},{"id":"mls-v1-276","module":"v1","type":"mcq","q":"Which measurement scale has categories with no inherent order?","options":["The ordinal scale","The interval scale","The ratio scale","The nominal scale"],"answer":"The nominal scale","solution":"A: Ordinal data have a meaningful order\nB: Interval data have order and equal differences\nC: Ratio data have a true zero\nD: The slides define nominal data as categories or names with no ordering","source":"Statistical-Methods 1- Nathaniel Yebuah.pdf | SLIDE 27","difficulty":"Medium"},{"id":"mls-v1-277","module":"v1","type":"mcq","q":"Which measurement scale possesses all properties of interval data plus a true zero?","options":["Nominal scale","The ratio scale","Ordinal scale","Interval scale"],"answer":"The ratio scale","solution":"A: Nominal data are categories only\nB: The slides state the ratio scale has all interval characteristics and a meaningful zero\nC: Ordinal data lack equal intervals\nD: Interval scales lack a true zero","source":"Statistical-Methods 1- Nathaniel Yebuah.pdf | SLIDE 30","difficulty":"Medium"},{"id":"mls-v1-278","module":"v1","type":"mcq","q":"Which data source is collected directly by the investigator for the study at hand?","options":["Secondary data","Published data only","Primary data","Routine records"],"answer":"Primary data","solution":"A: Secondary data were collected by others\nB: Published data are secondary\nC: The slides contrast primary and secondary sources in the medical field\nD: Records are secondary unless collected for the study","source":"Statistical Method-2- Nathaniel Yebuah.pdf | SLIDE 7","difficulty":"Hard"},{"id":"mls-v1-279","module":"v1","type":"mcq","q":"What is a questionnaire according to the data collection lecture?","options":["A list of medications","A statistical software package","A hospital referral form","A structured research tool of questions designed to gather information"],"answer":"A structured research tool of questions designed to gather information","solution":"A: That is a prescription\nB: That is a tool for analysis\nC: That is an administrative document\nD: The lecture gives this definition of a questionnaire","source":"Statistical Method-2- Nathaniel Yebuah.pdf | SLIDE 13","difficulty":"Hard"},{"id":"mls-v1-280","module":"v1","type":"mcq","q":"Why is pretesting a questionnaire in a pilot survey important?","options":["It reveals practical problems before the main survey","A pilot survey replaces the main survey","It guarantees a larger sample","It removes the need for ethics review"],"answer":"It reveals practical problems before the main survey","solution":"A: The lecture states pretesting with a small group is important\nB: A pilot precedes, not replaces, the main study\nC: Piloting does not determine sample size\nD: Ethical review is still required","source":"Statistical Method-2- Nathaniel Yebuah.pdf | SLIDE 15","difficulty":"Devil Mode"},{"id":"mls-v1-281","module":"v1","type":"mcq","q":"Which of these is a listed disadvantage of questionnaire methods?","options":["They are always expensive","They cannot reach many people","They can be used only when respondents are educated and cooperating","They require laboratory equipment"],"answer":"They can be used only when respondents are educated and cooperating","solution":"A: Questionnaires are generally cost-effective\nB: Questionnaires can reach large numbers\nC: The slides list this among questionnaire disadvantages\nD: No equipment is required","source":"Statistical Method-2- Nathaniel Yebuah.pdf | SLIDE 17","difficulty":"Medium"},{"id":"mls-v1-282","module":"v1","type":"mcq","q":"What is the first stage of a statistical investigation?","options":["Conducting a pilot survey","Data analysis","Publishing results","Statement of the problem and objectives"],"answer":"Statement of the problem and objectives","solution":"A: That is a later stage\nB: Analysis comes after collection\nC: Publication is the final stage\nD: The slides list this as stage 1","source":"Statistical Method-2- Nathaniel Yebuah.pdf | SLIDE 21","difficulty":"Medium"},{"id":"mls-v1-283","module":"v1","type":"mcq","q":"What is a double-barrelled question in questionnaire design?","options":["A question asking two things but allowing one answer","A question with two possible answers","A question with no options","A question asked twice"],"answer":"A question asking two things but allowing one answer","solution":"A: The study notes identify this as a structural error\nB: That is a normal closed question\nC: That is an open question\nD: That tests reliability","source":"Study Notes on Questionnaire-Nathaniel Yebuah.pdf | SLIDE 2","difficulty":"Hard"},{"id":"mls-v1-284","module":"v1","type":"mcq","q":"Which measure of central tendency is most affected by extreme values?","options":["The median","The mean","The mode","The range"],"answer":"The mean","solution":"A: The median is resistant to extremes\nB: The mean uses every value and is pulled by outliers\nC: The mode is the most frequent value\nD: The range is a dispersion measure","source":"Statistical Method-2- Nathaniel Yebuah.pdf | SLIDE 30","difficulty":"Hard"},{"id":"mls-v1-285","module":"v1","type":"mcq","q":"Which measure of dispersion describes the spread of values around the centre?","options":["The mean","The median","The mode","Standard deviation (and variance)"],"answer":"Standard deviation (and variance)","solution":"A: That is a measure of central tendency\nB: That is central tendency\nC: That is central tendency\nD: The slides define dispersion measures as showing spread about the centre","source":"Statistical Method-2- Nathaniel Yebuah.pdf | SLIDE 32","difficulty":"Devil Mode"},{"id":"mls-v1-286","module":"v1","type":"mcq","q":"How many equal parts do quartiles divide an ordered data set into?","options":["Four","Two","Ten","One hundred"],"answer":"Four","solution":"A: Quartiles divide data into four equal parts\nB: That is the median split\nC: That is deciles\nD: That is percentiles","source":"Statistical Method-2- Nathaniel Yebuah.pdf | SLIDE 34","difficulty":"Medium"},{"id":"mls-v1-287","module":"v1","type":"mcq","q":"Which five values make up the five-number summary for a box plot?","options":["Mean, median, mode, range and SD","Minimum, Q1, median, Q3 and maximum","Q1, Q2, Q3, D5 and P50","Sample size, mean, variance, min and max"],"answer":"Minimum, Q1, median, Q3 and maximum","solution":"A: That is a different summary\nB: The slides list these as the five-number summary\nC: That is not the five-number summary\nD: That is not the stated summary","source":"Statistical Method-2- Nathaniel Yebuah.pdf | SLIDE 36","difficulty":"Medium"},{"id":"mls-v1-288","module":"v1","type":"mcq","q":"What does the kth decile represent?","options":["The value below which k% lie","The kth quartile","The value below which k × 10% of the data lie","The mean of the kth group"],"answer":"The value below which k × 10% of the data lie","solution":"A: That defines percentiles\nB: Quartiles are a separate division\nC: The lecture defines deciles this way for k = 1 to 9\nD: That is not a decile","source":"Statistical Method-2- Nathaniel Yebuah.pdf | SLIDE 39","difficulty":"Hard"},{"id":"mls-v1-289","module":"v1","type":"mcq","q":"What is an experiment in probability theory?","options":["A process with well-defined possible outcomes whose result is uncertain","A guaranteed outcome","A single observation only","A mathematical proof"],"answer":"A process with well-defined possible outcomes whose result is uncertain","solution":"A: The lecture introduces experiments such as coin tosses\nB: Probability requires uncertainty\nC: An experiment may be repeated\nD: That is not an experiment","source":"Statistical Methods-3-Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Hard"},{"id":"mls-v1-290","module":"v1","type":"mcq","q":"What is a trial in probability?","options":["A single possible outcome","Each repetition of an experiment","The entire sample space","A certain event"],"answer":"Each repetition of an experiment","solution":"A: That is an outcome\nB: The lecture defines a trial as a repetition\nC: That is the set of all outcomes\nD: That has probability one","source":"Statistical Methods-3-Nathaniel Yebuah.pdf | SLIDE 5","difficulty":"Devil Mode"},{"id":"mls-v1-291","module":"v1","type":"mcq","q":"What is the sample space for rolling two fair dice?","options":["The 11 possible sums only","The numbers 1 through 6","The 36 ordered pairs (i, j) with i and j from 1 to 6","The 21 unordered pairs"],"answer":"The 36 ordered pairs (i, j) with i and j from 1 to 6","solution":"A: Sums alone lose equally likely outcomes\nB: That is the sample space for one die\nC: The lecture asks students to find this sample space\nD: Order matters for equally likely outcomes","source":"Statistical Methods-3-Nathaniel Yebuah.pdf | SLIDE 7","difficulty":"Medium"},{"id":"mls-v1-292","module":"v1","type":"mcq","q":"What is classical probability based on?","options":["Past observed frequencies","Personal belief","The number of trials performed","The assumption that all outcomes are equally likely"],"answer":"The assumption that all outcomes are equally likely","solution":"A: That is the empirical concept\nB: That is subjective probability\nC: That relates to empirical estimation\nD: The lecture states classical probability assumes equally likely outcomes","source":"Statistical Methods-3-Nathaniel Yebuah.pdf | SLIDE 12","difficulty":"Medium"},{"id":"mls-v1-293","module":"v1","type":"mcq","q":"Two events A and B are independent when:","options":["P(A ∩ B) = 0","P(A ∩ B) = P(A)P(B)","P(A ∪ B) = P(A) + P(B)","P(A given B) = 0"],"answer":"P(A ∩ B) = P(A)P(B)","solution":"A: That defines mutually exclusive events\nB: The lecture defines independence in terms of the product of probabilities\nC: That is the addition rule for mutually exclusive events\nD: That is not independence","source":"Statistical Methods-3-Nathaniel Yebuah.pdf | SLIDE 17","difficulty":"Hard"},{"id":"mls-v1-294","module":"v1","type":"mcq","q":"State the general addition rule for two events A and B.","options":["Adding without subtracting the intersection","Adding the intersection instead of subtracting","P(A ∪ B) = P(A) + P(B) − P(A ∩ B)","Multiplying P(A) by P(B)"],"answer":"P(A ∪ B) = P(A) + P(B) − P(A ∩ B)","solution":"A: That double counts overlap\nB: That would overcount\nC: The lecture gives this general addition rule\nD: That is the multiplication rule","source":"Statistical Methods-3-Nathaniel Yebuah.pdf | SLIDE 20","difficulty":"Hard"},{"id":"mls-v1-295","module":"v1","type":"mcq","q":"What does the multiplication law of probability give?","options":["P(A ∪ B) = P(A) + P(B)","P(A given B) = P(B given A) always","P(A ∩ B) = P(A) + P(B)","P(A ∩ B) = P(A) × P(B given A)"],"answer":"P(A ∩ B) = P(A) × P(B given A)","solution":"A: That is the addition rule\nB: That is not generally true\nC: That is not a probability of intersection\nD: The lecture derives this from conditional probability","source":"Statistical Methods-3-Nathaniel Yebuah.pdf | SLIDE 29","difficulty":"Devil Mode"},{"id":"mls-v1-296","module":"v1","type":"mcq","q":"How is conditional probability P(A given B) defined?","options":["P(A ∩ B) / P(B), provided P(B) > 0","P(A ∩ B) / P(A)","P(A) + P(B)","P(A)P(B)"],"answer":"P(A ∩ B) / P(B), provided P(B) > 0","solution":"A: The lecture defines conditional probability with this ratio\nB: That gives P(B given A), not P(A given B)\nC: That is not a conditional probability\nD: That is the independence product","source":"Statistical Methods-3-Nathaniel Yebuah.pdf | SLIDE 24","difficulty":"Medium"},{"id":"mls-v1-297","module":"v1","type":"mcq","q":"What does Bayes' theorem compute?","options":["The probability of an impossible event","The sum of all sample-space probabilities","A revised probability of an event given new evidence","The variance of a random variable"],"answer":"A revised probability of an event given new evidence","solution":"A: That is always zero\nB: That is always one\nC: The lecture uses Bayes for diagnostic testing, updating disease probability after a test result\nD: That is a different concept","source":"Statistical Methods-3-Nathaniel Yebuah.pdf | SLIDE 21","difficulty":"Medium"},{"id":"mls-v1-298","module":"v1","type":"mcq","q":"In screening tests, what is sensitivity?","options":["The probability of a negative test given no disease","The probability that a positive test means disease","The proportion of the population with disease","The probability of a positive test given that the disease is present"],"answer":"The probability of a positive test given that the disease is present","solution":"A: That is specificity\nB: That is predictive value positive\nC: That is prevalence\nD: The lecture defines sensitivity in these terms","source":"Statistical Methods-3-Nathaniel Yebuah.pdf | SLIDE 39","difficulty":"Hard"},{"id":"mls-v1-299","module":"v1","type":"mcq","q":"What is specificity of a diagnostic test?","options":["The probability of a negative test result given the disease is absent","The probability of a positive test in a diseased person","The probability of disease given a positive test","The proportion of false positives"],"answer":"The probability of a negative test result given the disease is absent","solution":"A: The slides define specificity this way\nB: That is sensitivity\nC: That is PPV\nD: That is 1 minus specificity","source":"Statistical Methods-3-Nathaniel Yebuah.pdf | SLIDE 42","difficulty":"Hard"},{"id":"mls-v1-300","module":"v1","type":"mcq","q":"What is a false positive result?","options":["A negative test in a diseased person","A positive test in a person who does not have the disease","A true negative result","An inconclusive test"],"answer":"A positive test in a person who does not have the disease","solution":"A: That is a false negative\nB: The lecture defines false positives among the two false-result types\nC: That is correct rejection\nD: That is not a false positive","source":"Statistical Methods-3-Nathaniel Yebuah.pdf | SLIDE 41","difficulty":"Devil Mode"},{"id":"mls-v1-301","module":"v1","type":"mcq","q":"What is a permutation as defined in the counting techniques slides?","options":["A selection where order is irrelevant","A random sample","The product of all integers","An ordered arrangement of objects"],"answer":"An ordered arrangement of objects","solution":"A: That is a combination\nB: Sampling is a different concept\nC: That is a factorial\nD: The lecture defines permutation as an ordered arrangement","source":"Statistical Methods-3-Nathaniel Yebuah.pdf | SLIDE 43","difficulty":"Medium"},{"id":"mls-v1-302","module":"v1","type":"mcq","q":"From a group of 5 surgeons, in how many ways can 3 be selected if order does not matter?","options":["10","60","15","125"],"answer":"10","solution":"A: This is 5C3 = 10, as illustrated in the combination example\nB: That is 5P3, which counts order\nC: That is 5C2\nD: That is 5 cubed","source":"Statistical Methods-3-Nathaniel Yebuah.pdf | SLIDE 47","difficulty":"Medium"},{"id":"mls-v1-303","module":"v1","type":"mcq","q":"What is a random variable?","options":["A variable chosen at random from a list","A function that assigns a real number to each outcome of an experiment","A constant with random notation","The average of all outcomes"],"answer":"A function that assigns a real number to each outcome of an experiment","solution":"A: That is not the formal definition\nB: The lecture gives this definition of a random variable\nC: A random variable is not a constant\nD: That is expectation","source":"Statistical Methods-3-Nathaniel Yebuah.pdf | SLIDE 48","difficulty":"Hard"},{"id":"mls-v1-304","module":"v1","type":"mcq","q":"Which random variable can take only a countable number of values?","options":["A continuous random variable","A constant","A discrete random variable","A normal variable"],"answer":"A discrete random variable","solution":"A: Continuous variables take infinitely many values in an interval\nB: Constants do not vary\nC: The slides define discrete variables as taking countable values\nD: Normal variables are continuous","source":"Statistical Methods-3-Nathaniel Yebuah.pdf | SLIDE 49","difficulty":"Hard"},{"id":"mls-v1-305","module":"v1","type":"mcq","q":"What does a probability mass function (PMF) give?","options":["The probability that a discrete variable equals each value x","The probability that a continuous variable is exactly x","The cumulative probability up to x","The mean of the distribution"],"answer":"The probability that a discrete variable equals each value x","solution":"A: The lecture defines the PMF for discrete variables\nB: Continuous variables have zero probability at points\nC: That is the CDF\nD: That is expectation","source":"Statistical Methods-3-Nathaniel Yebuah.pdf | SLIDE 50","difficulty":"Devil Mode"},{"id":"mls-v1-306","module":"v1","type":"mcq","q":"Which property must a probability density function satisfy?","options":["f(x) may be negative sometimes","f(x) ≥ 0 for all x and total area under the curve equals 1","The total area equals 0","f(x) is always increasing"],"answer":"f(x) ≥ 0 for all x and total area under the curve equals 1","solution":"A: Probabilities cannot be negative\nB: The continuous distributions slide lists these PDF properties\nC: The total area must be one\nD: PDFs need not be monotonic","source":"Statistical Methods-4-Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Medium"},{"id":"mls-v1-307","module":"v1","type":"mcq","q":"In a Bernoulli trial, what values can the random variable take?","options":["Any integer","Only positive numbers","0 and 1","All real numbers"],"answer":"0 and 1","solution":"A: That is not Bernoulli\nB: Zero is allowed\nC: The lecture states a Bernoulli variable takes values 0 and 1 for failure and success\nD: That is continuous","source":"Statistical Methods-4-Nathaniel Yebuah.pdf | SLIDE 19","difficulty":"Medium"},{"id":"mls-v1-308","module":"v1","type":"mcq","q":"What is the variance of a Bernoulli distribution with success probability p?","options":["p","1 − p","p²","p(1 − p)"],"answer":"p(1 − p)","solution":"A: That is the mean\nB: That is failure probability\nC: That is not the Bernoulli variance\nD: The lecture lists Var(X) = p(1−p) for Bernoulli","source":"Statistical Methods-4-Nathaniel Yebuah.pdf | SLIDE 20","difficulty":"Hard"},{"id":"mls-v1-309","module":"v1","type":"mcq","q":"Which conditions must hold for a binomial distribution?","options":["Trials must be dependent","Fixed number of independent identical trials with two outcomes and constant p","Each trial has more than two outcomes","p changes each trial"],"answer":"Fixed number of independent identical trials with two outcomes and constant p","solution":"A: Binomial trials are independent\nB: The lecture lists these binomial conditions\nC: That leads to multinomial\nD: p must be constant","source":"Statistical Methods-4-Nathaniel Yebuah.pdf | SLIDE 23","difficulty":"Hard"},{"id":"mls-v1-310","module":"v1","type":"mcq","q":"What is the mean of a binomial distribution with n trials and success probability p?","options":["n(1 − p)","p only","np","√(np)"],"answer":"np","solution":"A: That is the expected number of failures\nB: The mean scales with n\nC: The lecture gives µ = np for the binomial\nD: That relates to the standard deviation approximation","source":"Statistical Methods-4-Nathaniel Yebuah.pdf | SLIDE 25","difficulty":"Devil Mode"},{"id":"mls-v1-311","module":"v1","type":"mcq","q":"Which distribution models counts of independent rare events over a fixed interval?","options":["The binomial distribution","The normal distribution","The uniform distribution","The Poisson distribution"],"answer":"The Poisson distribution","solution":"A: Binomial counts successes in fixed trials\nB: Normal is continuous\nC: Uniform assigns equal probability\nD: The lecture describes Poisson experiments as counts of events in time or space","source":"Statistical Methods-4-Nathaniel Yebuah.pdf | SLIDE 40","difficulty":"Medium"},{"id":"mls-v1-312","module":"v1","type":"mcq","q":"In the emergency desk example, what is the mean number of arrivals per minute?","options":["4","2","8","1"],"answer":"4","solution":"A: The solution states λ = 4 for one minute\nB: That is the rate for two minutes in a different part\nC: That is the rate for two minutes\nD: That is not the stated rate","source":"Statistical Methods-4-Nathaniel Yebuah.pdf | SLIDE 49","difficulty":"Medium"},{"id":"mls-v1-313","module":"v1","type":"mcq","q":"What is the mean of a continuous uniform distribution over (a, b)?","options":["b − a","a only","(a + b)/2","(a + b)"],"answer":"(a + b)/2","solution":"A: That is the interval width\nB: The mean depends on both endpoints\nC: The lecture gives the mean of the uniform as the midpoint of the interval\nD: This is twice the mean","source":"Statiscal Method-5- Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Hard"},{"id":"mls-v1-314","module":"v1","type":"mcq","q":"Which distribution is characterized by the memoryless property?","options":["The gamma distribution","The normal distribution","The uniform distribution","The exponential distribution"],"answer":"The exponential distribution","solution":"A: Gamma generalizes exponential but is not memoryless\nB: Normal has no memoryless property\nC: Uniform has no memoryless property\nD: The lecture lists memorylessness as a property of the exponential","source":"Statiscal Method-5- Nathaniel Yebuah.pdf | SLIDE 11","difficulty":"Hard"},{"id":"mls-v1-315","module":"v1","type":"mcq","q":"What does the exponential distribution model in medical applications?","options":["The time between events in a medical process","The number of successes in n trials","A fixed set of categories","A constant outcome"],"answer":"The time between events in a medical process","solution":"A: The lecture gives survival time and time between events as examples\nB: That is binomial\nC: That is multinomial\nD: That is degenerate","source":"Statiscal Method-5- Nathaniel Yebuah.pdf | SLIDE 8","difficulty":"Devil Mode"},{"id":"mls-v1-316","module":"v1","type":"mcq","q":"What is the relationship between the gamma and exponential distributions?","options":["Gamma is the same as normal","Gamma generalizes exponential by modelling waiting times for multiple events","Gamma only applies to discrete data","Gamma cannot model waiting times"],"answer":"Gamma generalizes exponential by modelling waiting times for multiple events","solution":"A: They are distinct\nB: The lecture introduces gamma for waiting times for multiple events\nC: Gamma is continuous\nD: The lecture states it does","source":"Statiscal Method-5- Nathaniel Yebuah.pdf | SLIDE 15","difficulty":"Medium"},{"id":"mls-v1-317","module":"v1","type":"mcq","q":"What is a standard normal distribution?","options":["Mean 1 and variance 0","Mean 100 and SD 15","Any normal distribution","A normal distribution with mean 0 and variance 1"],"answer":"A normal distribution with mean 0 and variance 1","solution":"A: That is not a normal distribution\nB: That is an example of a non-standard normal\nC: Only the standardized one is standard normal\nD: The lecture defines the standard normal this way","source":"Statiscal Method-5- Nathaniel Yebuah.pdf | SLIDE 24","difficulty":"Medium"},{"id":"mls-v1-318","module":"v1","type":"mcq","q":"If systolic blood pressure is N(120, 20²), what is the z-score for a reading of 140 mmHg?","options":["1","2","20","0.5"],"answer":"1","solution":"A: z = (140 − 120)/20 = 1\nB: That would require a difference of 40\nC: That is the standard deviation, not the z-score\nD: That would require a difference of 10","source":"Statiscal Method-5- Nathaniel Yebuah.pdf | SLIDE 29","difficulty":"Hard"},{"id":"mls-v1-319","module":"v1","type":"mcq","q":"Approximately what percentage of a normal population lies within ±1 standard deviation of the mean?","options":["50%","68%","95%","99.7%"],"answer":"68%","solution":"A: That is the proportion within about 0.67 SD\nB: The slides give the 68% rule for ±1 SD\nC: That is the ±2 SD rule\nD: That is the ±3 SD rule","source":"Statiscal Method-5- Nathaniel Yebuah.pdf | SLIDE 25","difficulty":"Hard"},{"id":"mls-v1-320","module":"v1","type":"mcq","q":"What does the normal approximation to the binomial require?","options":["Small n only","p exactly 0.5 only","Large n with both np and n(1−p) sufficiently large","No conditions at all"],"answer":"Large n with both np and n(1−p) sufficiently large","solution":"A: Small samples are poorly approximated by normal\nB: p near 0.5 helps but is not required\nC: The lecture states the approximation works under these conditions\nD: Conditions are needed","source":"Statiscal Method-5- Nathaniel Yebuah.pdf | SLIDE 32","difficulty":"Devil Mode"},{"id":"mls-v1-321","module":"v1","type":"fill","q":"Evaluate Σₖ₌₁⁵ xₖ for the five baby weights x₁ = 3.2 kg, x₂ = 3.7 kg, x₃ = 1.4 kg, x₄ = 2.8 kg and x₅ = 3.3 kg. Give your answer in kg.","answer":"14.4","solution":"Adding the five values gives 3.2 + 3.7 = 6.9, plus 1.4 = 8.3, plus 2.8 = 11.1, plus 3.3 = 14.4 kg, matching the worked example on the slide.","source":"ALGEBRA 1- Nathaniel Yebuah.pdf | SLIDE 3","difficulty":"Medium"},{"id":"mls-v1-322","module":"v1","type":"fill","q":"Find the 11th term of the arithmetic progression 4, 9, 14, 19, ... .","answer":"54","solution":"Here a = 4 and d = 5, so u₁₁ = 4 + (11 − 1) × 5 = 4 + 50 = 54.","source":"ALGEBRA 3-Nathaniel Yebuah.pdf | SLIDE 6","difficulty":"Medium"},{"id":"mls-v1-323","module":"v1","type":"fill","q":"How many degrees of freedom are used in a chi-square test of a 9:3:3:1 dihybrid ratio?","answer":"3","solution":"Degrees of freedom equal the number of categories minus one. Four phenotypic categories give 4 − 1 = 3.","source":"Module 1 to 3 compiled-Nathaniel Yebuah.pdf | SLIDE 113","difficulty":"Hard"},{"id":"mls-v1-324","module":"v1","type":"fill","q":"A first-order reaction has a half-life of 2.40 hours. Calculate the rate constant k in h⁻¹ to three significant figures.","answer":"0.289","solution":"For a first-order reaction t½ = ln2/k, so k = 0.693/2.40 = 0.28875 h⁻¹, which rounds to 0.289 h⁻¹.","source":"Lecture 5_Chemical Kinetics_Part 2- Nathaniel Yebuah.pdf | SLIDE 21","difficulty":"Hard"},{"id":"mls-v2-001","module":"v2","type":"mcq","q":"Which of the following best describes connective tissue?","options":["Cells surrounded by an extracellular matrix they synthesize","Cells tightly packed with no matrix","Only fibres with no cells","Only fluid with no fibres"],"answer":"Cells surrounded by an extracellular matrix they synthesize","solution":"A: The lecture states connective tissue contains cells surrounded by ECM that the cells produce\nB: That describes epithelial tissue\nC: Connective tissue always has cells\nD: That describes blood plasma alone","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 5","difficulty":"Devil Mode"},{"id":"mls-v2-002","module":"v2","type":"mcq","q":"Which fibre type is the most abundant in connective tissue and has high tensile strength?","options":["Reticular fibres","Collagen fibres","Elastic fibres","Oxytalan fibres"],"answer":"Collagen fibres","solution":"A: Reticular fibres form a meshwork and are argyrophilic\nB: The lecture states collagen fibres are the most abundant and have high tensile strength\nC: Elastic fibres contain elastin and allow stretch\nD: These are not listed among the three main fibre types","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 11","difficulty":"Medium"},{"id":"mls-v2-003","module":"v2","type":"mcq","q":"Which cells are the most abundant in connective tissue and secrete the extracellular matrix?","options":["Macrophages","Mast cells","Fibroblasts","Chondrocytes"],"answer":"Fibroblasts","solution":"A: Macrophages are phagocytic\nB: Mast cells release histamine\nC: The lecture states fibroblasts are the most abundant cell type and secrete ECM\nD: Chondrocytes are cartilage cells","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 23","difficulty":"Medium"},{"id":"mls-v2-004","module":"v2","type":"mcq","q":"Which connective tissue cells arise from myeloid stem cells and contain numerous cytoplasmic granules?","options":["Fibroblasts","Macrophages","Osteocytes","Mast cells"],"answer":"Mast cells","solution":"A: Fibroblasts secrete matrix\nB: Macrophages develop from monocytes\nC: Osteocytes are bone cells\nD: The lecture states mast cells arise from myeloid stem cells and have many granules","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 24","difficulty":"Hard"},{"id":"mls-v2-005","module":"v2","type":"mcq","q":"Which disease results from vitamin C deficiency affecting collagen synthesis?","options":["Marfan syndrome","Scurvy","Keloid","Osteopetrosis"],"answer":"Scurvy","solution":"A: Marfan involves defective fibrillin\nB: The lecture lists scurvy among connective tissue pathologies\nC: Keloid is excessive scar tissue\nD: That is excessive bone density","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 17","difficulty":"Hard"},{"id":"mls-v2-006","module":"v2","type":"mcq","q":"Loose connective tissue is characterized by which relationship?","options":["Fibres exceed cells plus ground substance","Only fibres are present","Cells plus ground substance exceed fibres","Only ground substance is present"],"answer":"Cells plus ground substance exceed fibres","solution":"A: That describes dense connective tissue\nB: That is not loose CT\nC: The slide states loose CT is about 80% cells and ground substance with 20% fibres\nD: That is not the definition","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 42","difficulty":"Devil Mode"},{"id":"mls-v2-007","module":"v2","type":"mcq","q":"Which cartilage type is the most common in the body and contains abundant type II collagen?","options":["Elastic cartilage","Fibrocartilage","Bone","Hyaline cartilage"],"answer":"Hyaline cartilage","solution":"A: Elastic cartilage has abundant elastic fibres\nB: Fibrocartilage has thick collagen bundles\nC: Bone is mineralized tissue\nD: The lecture states hyaline cartilage is the most common and contains type II collagen","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 71","difficulty":"Medium"},{"id":"mls-v2-008","module":"v2","type":"mcq","q":"Which cartilage type is found in the intervertebral discs and pubic symphysis?","options":["Fibrocartilage","Hyaline cartilage","Elastic cartilage","Articular cartilage"],"answer":"Fibrocartilage","solution":"A: The lecture lists fibrocartilage in these locations\nB: Hyaline covers joint surfaces\nC: Elastic cartilage is in the ear and epiglottis\nD: Articular cartilage is hyaline","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 79","difficulty":"Medium"},{"id":"mls-v2-009","module":"v2","type":"mcq","q":"What is the perichondrium?","options":["A layer of bone","A type of cartilage","Dense irregular tissue surrounding cartilage","A synovial membrane"],"answer":"Dense irregular tissue surrounding cartilage","solution":"A: That is the periosteum\nB: It is a covering, not cartilage\nC: The lecture defines perichondrium this way, excluding articular cartilage\nD: That lines joint capsules","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 82","difficulty":"Hard"},{"id":"mls-v2-010","module":"v2","type":"mcq","q":"Which cartilage growth mechanism adds new matrix to the external surface?","options":["Interstitial growth","Endochondral growth","Intramembranous growth","Appositional growth"],"answer":"Appositional growth","solution":"A: Interstitial growth expands from within\nB: That is a bone formation process\nC: That is a bone formation process\nD: The lecture describes appositional growth as surface growth from chondrogenic cells","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 83","difficulty":"Hard"},{"id":"mls-v2-011","module":"v2","type":"mcq","q":"Which cells resorb bone?","options":["Osteoclasts","Osteoblasts","Osteocytes","Osteoprogenitor cells"],"answer":"Osteoclasts","solution":"A: The lecture states osteoclasts are large multinucleated cells derived from monocytes that resorb bone\nB: Osteoblasts form bone\nC: Osteocytes are mature bone cells\nD: These are stem cells","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 88","difficulty":"Devil Mode"},{"id":"mls-v2-012","module":"v2","type":"mcq","q":"Where are osteocytes housed?","options":["Volkmann's canals","Lacunae","Haversian canals","Trabeculae"],"answer":"Lacunae","solution":"A: These carry vessels across osteons\nB: The review test asks this and the answer is lacunae\nC: These run through the core of osteons\nD: These are spicules of spongy bone","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 155","difficulty":"Medium"},{"id":"mls-v2-013","module":"v2","type":"mcq","q":"Which canals connect Haversian systems in compact bone?","options":["Haversian canals","Central canals","Howship's lacunae","Volkmann's (perforating) canals"],"answer":"Volkmann's (perforating) canals","solution":"A: These run longitudinally within osteons\nB: Another name for Haversian canals\nC: These are resorption lacunae\nD: The review test asks which canals interconnect Haversian systems","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 146","difficulty":"Medium"},{"id":"mls-v2-014","module":"v2","type":"mcq","q":"Spongy bone is made up of a framework called what?","options":["Trabeculae","Osteons","Lamellar bone","Osteocytes"],"answer":"Trabeculae","solution":"A: The review test answer is trabeculae\nB: These are the units of compact bone\nC: That is mature bone tissue\nD: These are cells","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 147","difficulty":"Hard"},{"id":"mls-v2-015","module":"v2","type":"mcq","q":"Which bone type forms the outer layer of bones and constitutes about 80% of bone?","options":["Spongy bone","Compact bone","Woven bone","Cartilage"],"answer":"Compact bone","solution":"A: Spongy bone forms the interior\nB: The osteology lecture states compact bone forms the outside and makes up 80%\nC: Woven bone is immature\nD: Cartilage is not bone","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 23","difficulty":"Hard"},{"id":"mls-v2-016","module":"v2","type":"mcq","q":"During intramembranous ossification, bone first forms in which tissue?","options":["Cartilage","Dense irregular connective tissue","Mesenchyme","Bone"],"answer":"Mesenchyme","solution":"A: That is the model for endochondral ossification\nB: That is not the starting tissue\nC: The review test answer is mesenchyme, not cartilage\nD: Bone is the product, not the starting tissue","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 31","difficulty":"Devil Mode"},{"id":"mls-v2-017","module":"v2","type":"mcq","q":"Which hormone increases blood calcium by stimulating bone resorption?","options":["Parathyroid hormone","Calcitonin","Thyroxine","Insulin"],"answer":"Parathyroid hormone","solution":"A: The lecture states PTH raises blood Ca²⁺ by stimulating resorption\nB: Calcitonin lowers blood calcium\nC: That regulates metabolism\nD: That regulates glucose","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 41","difficulty":"Medium"},{"id":"mls-v2-018","module":"v2","type":"mcq","q":"Which condition results from inadequate mineralization of bone in children?","options":["Osteomalacia","Rickets","Osteoporosis","Paget's disease"],"answer":"Rickets","solution":"A: That is the adult equivalent\nB: The lecture states rickets results from insufficient vitamin D in children\nC: That is loss of bone mass\nD: That is excessive remodeling","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 135","difficulty":"Medium"},{"id":"mls-v2-019","module":"v2","type":"mcq","q":"What is osteoporosis?","options":["Excessive bone formation","Inflammation of bone","Abnormal loss of bony tissue producing fragile porous bones","Softening of bone due to vitamin C deficiency"],"answer":"Abnormal loss of bony tissue producing fragile porous bones","solution":"A: That is osteopetrosis\nB: That is osteitis\nC: The lecture defines osteoporosis in these terms\nD: That is scurvy","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 136","difficulty":"Hard"},{"id":"mls-v2-020","module":"v2","type":"mcq","q":"What is osteomyelitis?","options":["Soft bones due to vitamin D deficiency","Inflammation of a bursa","A bone tumour","Inflammation of bone caused by pus-forming bacteria"],"answer":"Inflammation of bone caused by pus-forming bacteria","solution":"A: That is osteomalacia\nB: That is bursitis\nC: That is different\nD: The osteology lecture defines osteomyelitis this way","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 399","difficulty":"Hard"},{"id":"mls-v2-021","module":"v2","type":"mcq","q":"What is the fluid connective tissue that circulates in the cardiovascular system?","options":["Lymph","Blood","Cartilage","Bone"],"answer":"Blood","solution":"A: Lymph is a fluid but the lecture focuses on blood\nB: The lecture defines blood as a fluid connective tissue\nC: Cartilage is solid\nD: Bone is solid","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 181","difficulty":"Devil Mode"},{"id":"mls-v2-022","module":"v2","type":"mcq","q":"What is the approximate ratio of cells to plasma in whole blood?","options":["55% cells and 45% plasma","50% each","45% cells and 55% plasma","70% cells and 30% plasma"],"answer":"45% cells and 55% plasma","solution":"A: That reverses the stated proportions\nB: That is not the stated ratio\nC: The lecture states cells are about 45% and plasma about 55%\nD: That is not the stated ratio","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 183","difficulty":"Medium"},{"id":"mls-v2-023","module":"v2","type":"mcq","q":"Which blood cells are anucleate biconcave discs about 7.8 µm in diameter?","options":["Neutrophils","Lymphocytes","Platelets","Erythrocytes"],"answer":"Erythrocytes","solution":"A: These are nucleated granulocytes\nB: These are agranulocytes\nC: These are cell fragments\nD: The lecture describes red blood cells this way","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 186","difficulty":"Medium"},{"id":"mls-v2-024","module":"v2","type":"mcq","q":"Which leukocytes are the most common, making up 40–60% of white cells?","options":["Neutrophils","Eosinophils","Basophils","Monocytes"],"answer":"Neutrophils","solution":"A: The granulocyte table lists neutrophils at 40–60%\nB: These are about 1–4%\nC: These are rare\nD: These are agranulocytes","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 195","difficulty":"Hard"},{"id":"mls-v2-025","module":"v2","type":"mcq","q":"What is the main protein constituent of plasma, made in the liver?","options":["Fibrinogen","Globulin","Albumin","Haemoglobin"],"answer":"Albumin","solution":"A: That is a clotting protein in smaller amount\nB: That includes immunoglobulins\nC: The lecture states albumin is the main plasma protein made by the liver\nD: That is inside erythrocytes","source":"Connective Tissue-Nathaniel Yebuah.pdf | SLIDE 197","difficulty":"Hard"},{"id":"mls-v2-026","module":"v2","type":"mcq","q":"Which anatomical approach studies structures by regions such as the thorax or abdomen?","options":["Systemic anatomy","Surface anatomy","Comparative anatomy","Regional anatomy"],"answer":"Regional anatomy","solution":"A: Systemic anatomy studies body systems\nB: Surface anatomy studies external landmarks\nC: Comparative anatomy compares species\nD: The lecture lists regional and systemic approaches","source":"Intro to Anatomy-Nathaniel Yebuah .pdf | SLIDE 4","difficulty":"Devil Mode"},{"id":"mls-v2-027","module":"v2","type":"mcq","q":"Which term describes a structure farther from the trunk than another?","options":["Distal","Proximal","Medial","Superficial"],"answer":"Distal","solution":"A: Directional terms define distal as farther from the point of attachment\nB: Proximal means closer to the trunk\nC: Medial means toward the midline\nD: Superficial means toward the surface","source":"Intro to Anatomy-Nathaniel Yebuah .pdf | SLIDE 25","difficulty":"Medium"},{"id":"mls-v2-028","module":"v2","type":"mcq","q":"How many abdominopelvic regions are in the nine-region scheme?","options":["Four","Nine","Three","Twelve"],"answer":"Nine","solution":"A: That is the quadrants scheme\nB: The lecture lists the nine abdominal regions including right hypochondrium and epigastrium\nC: That is not a standard scheme\nD: That is not the listed scheme","source":"Intro to Anatomy-Nathaniel Yebuah .pdf | SLIDE 41","difficulty":"Medium"},{"id":"mls-v2-029","module":"v2","type":"mcq","q":"Which imaging modality uses high-frequency sound waves and the pulse-echo effect?","options":["Conventional radiography","CT","MRI","Ultrasonography"],"answer":"Ultrasonography","solution":"A: That uses ionising radiation\nB: That uses X-rays with computer reconstruction\nC: That uses magnetic fields and radiofrequency pulses\nD: The lecture states ultrasonography uses high-frequency sound and pulse echo","source":"Intro to Anatomy-Nathaniel Yebuah .pdf | SLIDE 54","difficulty":"Hard"},{"id":"mls-v2-030","module":"v2","type":"mcq","q":"How are joints classified functionally?","options":["By the amount of movement allowed","By the shape of the bones only","By the number of muscles attached","By the presence of cartilage only"],"answer":"By the amount of movement allowed","solution":"A: The joints lecture states functional classification is based on the amount of movement\nB: Shape is used in structural classification of synovial joints\nC: That is not a functional classification\nD: That is part of structural classification","source":"Joints of the body-Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Hard"},{"id":"mls-v2-031","module":"v2","type":"mcq","q":"Which functional joint class permits no movement?","options":["Diarthrosis","Synarthrosis","Amphiarthrosis","Symphysis"],"answer":"Synarthrosis","solution":"A: Diarthrosis is freely movable\nB: The review test asks which joint is synarthrosis and lists symphysis, gomphosis, diarthrosis, amphiarthrosis; gomphosis is a synarthrosis\nC: Amphiarthrosis allows slight movement\nD: A symphysis is a slightly movable cartilaginous joint","source":"Joints of the body-Nathaniel Yebuah.pdf | SLIDE 13","difficulty":"Devil Mode"},{"id":"mls-v2-032","module":"v2","type":"mcq","q":"What separates the articulating bones in a synovial joint?","options":["Fibrous connective tissue only","Hyaline cartilage only","A joint cavity containing synovial fluid","Bone fusion"],"answer":"A joint cavity containing synovial fluid","solution":"A: That characterises fibrous joints\nB: Articular cartilage covers the ends but a cavity exists\nC: The lecture lists a joint cavity with synovial fluid among the general features\nD: That is a synostosis","source":"Joints of the body-Nathaniel Yebuah.pdf | SLIDE 12","difficulty":"Medium"},{"id":"mls-v2-033","module":"v2","type":"mcq","q":"What is the function of synovial fluid?","options":["It nourishes joint structures and reduces friction","Dissolving bone","Producing blood cells","Forming ligaments"],"answer":"It nourishes joint structures and reduces friction","solution":"A: The lecture states synovial fluid provides nutrients and lubrication\nB: That is resorption\nC: That is marrow function\nD: Ligaments are fibrous tissue","source":"Joints of the body-Nathaniel Yebuah.pdf | SLIDE 11","difficulty":"Medium"},{"id":"mls-v2-034","module":"v2","type":"mcq","q":"Which type of synovial joint is the carpometacarpal joint of the thumb?","options":["A hinge joint","A saddle joint","A plane joint","A ball-and-socket joint"],"answer":"A saddle joint","solution":"A: Hinge joints allow flexion and extension only\nB: The review test asks this and the answer is saddle joint\nC: Plane joints allow gliding\nD: That is the shoulder and hip","source":"Joints of the body-Nathaniel Yebuah.pdf | SLIDE 25","difficulty":"Hard"},{"id":"mls-v2-035","module":"v2","type":"mcq","q":"Which joint is a classic ball-and-socket joint?","options":["The elbow joint","The interphalangeal joint","The shoulder (glenohumeral) joint","The ankle joint"],"answer":"The shoulder (glenohumeral) joint","solution":"A: The elbow is a hinge\nB: These are hinge joints\nC: The lecture describes the shoulder as a ball-and-socket synovial joint\nD: The ankle is a hinge-type joint","source":"Joints of the body-Nathaniel Yebuah.pdf | SLIDE 38","difficulty":"Hard"},{"id":"mls-v2-036","module":"v2","type":"mcq","q":"Which structure is mainly responsible for shoulder joint stability?","options":["The acromion alone","The joint capsule alone","The clavicle","The rotator cuff muscles"],"answer":"The rotator cuff muscles","solution":"A: That is a bony part but not the main stabilizer\nB: The capsule is loose\nC: That is part of the girdle\nD: The lecture states stability is mainly by muscles, especially the rotator cuff","source":"Joints of the body-Nathaniel Yebuah.pdf | SLIDE 43","difficulty":"Devil Mode"},{"id":"mls-v2-037","module":"v2","type":"mcq","q":"In which direction is the shoulder joint most commonly dislocated?","options":["Superiorly","Inferiorly (downward)","Anteriorly only","Posteriorly"],"answer":"Inferiorly (downward)","solution":"A: The acromion prevents upward dislocation\nB: The lecture states dislocation is commonly downward\nC: Anterior dislocation occurs but the slide emphasizes downward\nD: Posterior dislocation is uncommon","source":"Joints of the body-Nathaniel Yebuah.pdf | SLIDE 46","difficulty":"Medium"},{"id":"mls-v2-038","module":"v2","type":"mcq","q":"Which ligament is the strongest ligament of the hip joint?","options":["Pubofemoral ligament","Ischiofemoral ligament","Iliofemoral ligament (of Bigelow)","Ligament of the head of the femur"],"answer":"Iliofemoral ligament (of Bigelow)","solution":"A: This supports but is not the strongest\nB: This reinforces posteriorly\nC: The review test asks this and the answer is iliofemoral\nD: That is intracapsular","source":"Joints of the body-Nathaniel Yebuah.pdf | SLIDE 63","difficulty":"Medium"},{"id":"mls-v2-039","module":"v2","type":"mcq","q":"What type of joint is the knee?","options":["Ball and socket","Saddle","Plane","A modified hinge joint"],"answer":"A modified hinge joint","solution":"A: That is hip or shoulder\nB: That is thumb carpometacarpal\nC: That is intercarpal\nD: The lecture describes the knee as a modified hinge and the largest joint","source":"Joints of the body-Nathaniel Yebuah.pdf | SLIDE 71","difficulty":"Hard"},{"id":"mls-v2-040","module":"v2","type":"mcq","q":"Which knee structure is a C-shaped fibrocartilage attached to the medial collateral ligament?","options":["The medial meniscus","The lateral meniscus","The ACL","The patellar ligament"],"answer":"The medial meniscus","solution":"A: The lecture describes the medial meniscus as C-shaped and attached to the MCL\nB: That is more circular and more mobile\nC: That is a ligament, not fibrocartilage\nD: That is a tendon continuation","source":"Joints of the body-Nathaniel Yebuah.pdf | SLIDE 76","difficulty":"Hard"},{"id":"mls-v2-041","module":"v2","type":"mcq","q":"What injuries make up the 'unhappy triad' of the knee?","options":["ACL, lateral meniscus and LCL","PCL, medial meniscus and MCL","ACL, medial meniscus and medial collateral ligament","Patellar tendon, ACL and MCL"],"answer":"ACL, medial meniscus and medial collateral ligament","solution":"A: That is not the described triad\nB: The PCL is not in the triad\nC: The lecture defines the unhappy triad as these three structures\nD: The patellar tendon is not included","source":"Joints of the body-Nathaniel Yebuah.pdf | SLIDE 87","difficulty":"Devil Mode"},{"id":"mls-v2-042","module":"v2","type":"mcq","q":"Which bursa is inflamed in 'housemaid's knee'?","options":["The infrapatellar bursa","The subacromial bursa","The olecranon bursa","The prepatellar bursa"],"answer":"The prepatellar bursa","solution":"A: That is clergyman's knee\nB: That is associated with the shoulder\nC: That is student's elbow\nD: The lecture defines prepatellar bursitis as housemaid's knee","source":"Joints of the body-Nathaniel Yebuah.pdf | SLIDE 81","difficulty":"Medium"},{"id":"mls-v2-043","module":"v2","type":"mcq","q":"Where do inversion and eversion of the foot occur?","options":["At the tarsal joints","At the talocrural joint","At the knee","At the subtalar joint only"],"answer":"At the tarsal joints","solution":"A: The lecture states these movements occur at tarsal joints, not at the ankle\nB: That joint permits dorsiflexion and plantarflexion\nC: That is a hinge joint\nD: That is part of the tarsal complex but not the stated answer","source":"Joints of the body-Nathaniel Yebuah.pdf | SLIDE 90","difficulty":"Medium"},{"id":"mls-v2-044","module":"v2","type":"mcq","q":"What is the total number of bones in the adult human skeleton?","options":["186","206","206 pairs","306"],"answer":"206","solution":"A: That is not the stated number\nB: The osteology lecture states the adult skeleton has 206 bones\nC: 206 is the total, not pairs\nD: That is not the stated number","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 6","difficulty":"Hard"},{"id":"mls-v2-045","module":"v2","type":"mcq","q":"How many bones are in the axial skeleton?","options":["126","206","64","80"],"answer":"80","solution":"A: That is the appendicular skeleton\nB: That is the total skeleton\nC: That is not the stated number\nD: The lecture states the axial skeleton has 80 bones","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 56","difficulty":"Hard"},{"id":"mls-v2-046","module":"v2","type":"mcq","q":"Which bone does not articulate with any other bone?","options":["The hyoid bone","The mandible","The atlas","The sternum"],"answer":"The hyoid bone","solution":"A: The lecture states the hyoid does not articulate with another bone\nB: That articulates with the temporal bone\nC: That articulates with the skull and axis\nD: That articulates with clavicles and ribs","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 99","difficulty":"Devil Mode"},{"id":"mls-v2-047","module":"v2","type":"mcq","q":"Which canal and foramina pass through the sphenoid bone according to the review test?","options":["Carotid canal, jugular foramen and foramen magnum","Optic canal, foramen rotundum and foramen ovale","Foramen spinosum, stylomastoid foramen and incisive canal","Mental foramen, mandibular foramen and infraorbital foramen"],"answer":"Optic canal, foramen rotundum and foramen ovale","solution":"A: Those are in temporal and occipital bones\nB: The review test lists these as passing through the sphenoid\nC: Those belong to other bones\nD: Those are facial foramina","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 73","difficulty":"Medium"},{"id":"mls-v2-048","module":"v2","type":"mcq","q":"What are fontanelles?","options":["Sutures","Ethmoid air cells","Membranous gaps between cranial bones of the fetal skull","Sutural (Wormian) bones"],"answer":"Membranous gaps between cranial bones of the fetal skull","solution":"A: Sutures are fibrous joints between bones\nB: These are paranasal sinuses\nC: The review test defines fontanelles as membranous gaps\nD: These are extra bones in sutures","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 97","difficulty":"Medium"},{"id":"mls-v2-049","module":"v2","type":"mcq","q":"How many intervertebral discs are in the adult spinal column?","options":["23","24","21","26"],"answer":"23","solution":"A: The review test asks this; with 24 presacral vertebrae there are 23 discs\nB: That is the number of presacral vertebrae\nC: That is not the stated count\nD: That is the number of vertebrae in the adult column","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 107","difficulty":"Hard"},{"id":"mls-v2-050","module":"v2","type":"mcq","q":"What is a herniated disc?","options":["A fracture of the vertebral body","Rupture of the anulus fibrosus with protrusion of the nucleus pulposus","Inflammation of the spinal meninges","A tumour of the cord"],"answer":"Rupture of the anulus fibrosus with protrusion of the nucleus pulposus","solution":"A: That is a different injury\nB: The lecture defines a prolapsed disc in these terms\nC: That is meningitis\nD: That is not a disc problem","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 118","difficulty":"Hard"},{"id":"mls-v2-051","module":"v2","type":"mcq","q":"Which abnormal spinal curvature is a lateral curvature mostly in the thoracic region?","options":["Kyphosis","Lordosis","Scoliosis","Ankylosis"],"answer":"Scoliosis","solution":"A: That is exaggerated thoracic curvature\nB: That is exaggerated lumbar curvature\nC: The lecture defines scoliosis as abnormal lateral curvature\nD: That is joint fusion","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 110","difficulty":"Devil Mode"},{"id":"mls-v2-052","module":"v2","type":"mcq","q":"Which vertebra lacks a body and spinous process?","options":["The axis (C2)","A typical thoracic vertebra","L5","The atlas (C1)"],"answer":"The atlas (C1)","solution":"A: The axis has a dens and body\nB: These have heart-shaped bodies\nC: L5 has a large kidney-shaped body\nD: The lecture states the atlas lacks a body and spinous process","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 126","difficulty":"Medium"},{"id":"mls-v2-053","module":"v2","type":"mcq","q":"How many pairs of ribs are there?","options":["10","12","14","7"],"answer":"12","solution":"A: That is not the stated number\nB: The lecture states there are 12 pairs\nC: That is not the stated number\nD: That is the number of cervical vertebrae","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 152","difficulty":"Medium"},{"id":"mls-v2-054","module":"v2","type":"mcq","q":"Which ribs are true (vertebrosternal) ribs?","options":["Ribs 8 to 10","Ribs 11 and 12","Ribs 1 to 7","All 12 pairs"],"answer":"Ribs 1 to 7","solution":"A: These are false ribs\nB: These are floating ribs\nC: True ribs attach directly to the sternum via their costal cartilage\nD: Only the first seven are true","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 152","difficulty":"Hard"},{"id":"mls-v2-055","module":"v2","type":"mcq","q":"Which bone is the longest and heaviest in the body?","options":["Tibia","Humerus","Fibula","The femur"],"answer":"The femur","solution":"A: The tibia is second longest\nB: The humerus is shorter than femur\nC: The fibula is slender\nD: The lecture states the femur is the longest and heaviest bone","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 309","difficulty":"Hard"},{"id":"mls-v2-056","module":"v2","type":"mcq","q":"Which bone is a triangular sesamoid bone within the quadriceps tendon?","options":["The patella","The calcaneus","The pisiform","The talus"],"answer":"The patella","solution":"A: The lecture describes the patella as a sesamoid bone in the quadriceps tendon\nB: That is the heel bone\nC: That is a carpal sesamoid but not in quadriceps\nD: That transmits weight from tibia","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 339","difficulty":"Devil Mode"},{"id":"mls-v2-057","module":"v2","type":"mcq","q":"Which bone does NOT contribute to the knee joint?","options":["The femur","The tibia","The fibula","The patella"],"answer":"The fibula","solution":"A: The femoral condyles form the knee\nB: The tibial condyles form the knee\nC: The lecture states the fibula does not contribute to the knee but stabilizes the ankle\nD: The patella articulates with the femur","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 405","difficulty":"Medium"},{"id":"mls-v2-058","module":"v2","type":"mcq","q":"A fracture affecting one or both malleoli is called what?","options":["Colles' fracture","Smith's fracture","Greenstick fracture","Pott's fracture"],"answer":"Pott's fracture","solution":"A: That is a distal radius fracture\nB: That is a reversed Colles'\nC: That is an incomplete fracture\nD: The lecture defines Pott's fracture as affecting the malleoli","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 381","difficulty":"Medium"},{"id":"mls-v2-059","module":"v2","type":"mcq","q":"How many tarsal bones are there?","options":["7","8","5","14"],"answer":"7","solution":"A: The lecture lists seven tarsal bones\nB: That is the number of carpal bones\nC: That is the number of metatarsals\nD: That is the number of phalanges in a foot","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 385","difficulty":"Hard"},{"id":"mls-v2-060","module":"v2","type":"mcq","q":"What is talipes equinovarus?","options":["Flat foot","Club foot, with the foot inverted, adducted and plantarflexed","A bunion","A hammer toe"],"answer":"Club foot, with the foot inverted, adducted and plantarflexed","solution":"A: That is pes planus\nB: The lecture defines club foot in these terms\nC: That is hallux valgus\nD: That is a different deformity","source":"Osteology- Nathaniel Yebuah.pdf | SLIDE 393","difficulty":"Hard"},{"id":"mls-v2-061","module":"v2","type":"mcq","q":"Which organelle houses the electron transport chain?","options":["The nucleus","The Golgi apparatus","The lysosome","The mitochondrion"],"answer":"The mitochondrion","solution":"A: The nucleus contains DNA\nB: The Golgi packages proteins\nC: Lysosomes digest material\nD: The lecture states the ETC is a sequence of molecules built into the inner mitochondrial membrane","source":"Electron Transport Chain-Nathaniel Yebuah.pdf | SLIDE 4","difficulty":"Devil Mode"},{"id":"mls-v2-062","module":"v2","type":"mcq","q":"What determines the direction of electron flow in the respiratory chain?","options":["Electrons pass from negative to positive reduction potential","Electrons flow from positive to negative potential","Flow depends only on concentration","Flow is random"],"answer":"Electrons pass from negative to positive reduction potential","solution":"A: The lecture states electrons flow downhill to oxygen, the most positive carrier\nB: That would be uphill and non-spontaneous\nC: Redox potential, not concentration alone, governs flow\nD: The chain is highly ordered","source":"Electron Transport Chain-Nathaniel Yebuah.pdf | SLIDE 11","difficulty":"Medium"},{"id":"mls-v2-063","module":"v2","type":"mcq","q":"Which complex is also called NADH-CoQ reductase?","options":["Complex II","Complex I","Complex III","Complex IV"],"answer":"Complex I","solution":"A: Complex II is succinate-CoQ reductase\nB: The lecture names Complex I as NADH-CoQ reductase\nC: Complex III is CoQ-cytochrome c reductase\nD: Complex IV is cytochrome c oxidase","source":"Electron Transport Chain-Nathaniel Yebuah.pdf | SLIDE 39","difficulty":"Medium"},{"id":"mls-v2-064","module":"v2","type":"mcq","q":"Which complex is also known as succinate dehydrogenase?","options":["Complex I","Complex III","Complex II","Complex IV"],"answer":"Complex II","solution":"A: Complex I oxidizes NADH\nB: Complex III passes electrons to cytochrome c\nC: The lecture states Complex II is succinate-CoQ reductase, also called succinate dehydrogenase\nD: Complex IV reduces oxygen","source":"Electron Transport Chain-Nathaniel Yebuah.pdf | SLIDE 40","difficulty":"Hard"},{"id":"mls-v2-065","module":"v2","type":"mcq","q":"What is the final electron acceptor in the electron transport chain?","options":["Oxygen","NADH","FADH₂","Cytochrome c"],"answer":"Oxygen","solution":"A: The lecture asks this question and identifies oxygen as the terminal acceptor\nB: NADH is an electron donor\nC: FADH₂ is an electron donor\nD: Cytochrome c is an intermediate carrier","source":"Electron Transport Chain-Nathaniel Yebuah.pdf | SLIDE 55","difficulty":"Hard"},{"id":"mls-v2-066","module":"v2","type":"mcq","q":"How many protons does Complex I pump out of the matrix per electron pair?","options":["2 H⁺","4 H⁺","6 H⁺","8 H⁺"],"answer":"4 H⁺","solution":"A: That is not the stated number for Complex I\nB: The lecture states Complex I passes electrons to ubiquinone and pumps 4 H⁺\nC: That is not the stated number\nD: That is not the stated number","source":"Electron Transport Chain-Nathaniel Yebuah.pdf | SLIDE 47","difficulty":"Devil Mode"},{"id":"mls-v2-067","module":"v2","type":"mcq","q":"What is chemiosmosis in oxidative phosphorylation?","options":["The direct transfer of electrons to ATP","The diffusion of oxygen into the matrix","The flow of protons down their gradient through ATP synthase to make ATP","The breakdown of glucose to pyruvate"],"answer":"The flow of protons down their gradient through ATP synthase to make ATP","solution":"A: Electrons do not attach to ATP\nB: Oxygen is reduced, not diffused for ATP\nC: The lecture states chemiosmosis couples the ETC to ATP synthesis via a proton gradient\nD: That is glycolysis","source":"Electron Transport Chain-Nathaniel Yebuah.pdf | SLIDE 49","difficulty":"Medium"},{"id":"mls-v2-068","module":"v2","type":"mcq","q":"Who proposed the chemiosmotic theory?","options":["Watson","Krebs","Michaelis","Mitchell"],"answer":"Mitchell","solution":"A: Watson worked on DNA structure\nB: Krebs described the citric acid cycle\nC: Michaelis worked on enzyme kinetics\nD: The lecture refers to Mitchell's chemiosmotic theory","source":"Electron Transport Chain-Nathaniel Yebuah.pdf | SLIDE 50","difficulty":"Medium"},{"id":"mls-v2-069","module":"v2","type":"mcq","q":"According to the lecture's convention, how many ATP are produced per NADH?","options":["1.5 ATP","2.5 ATP","3 ATP only","1 ATP"],"answer":"2.5 ATP","solution":"A: That is the convention for FADH₂\nB: The lecture states the convention 1 NADH = 2.5/3 ATP\nC: Older convention gives 3 but the lecture presents 2.5/3\nD: That is substrate-level yield","source":"Electron Transport Chain-Nathaniel Yebuah.pdf | SLIDE 21","difficulty":"Hard"},{"id":"mls-v2-070","module":"v2","type":"mcq","q":"Which poison blocks cytochrome c oxidase (Complex IV)?","options":["Rotenone","Dinitrophenol","Cyanide","Oligomycin"],"answer":"Cyanide","solution":"A: Rotenone inhibits Complex I\nB: DNP is an uncoupler\nC: The lecture notes respiration inhibitors such as cyanide ions block oxidative phosphorylation\nD: That inhibits ATP synthase","source":"Electron Transport Chain-Nathaniel Yebuah.pdf | SLIDE 57","difficulty":"Hard"},{"id":"mls-v2-071","module":"v2","type":"mcq","q":"Which inhibitor acts on Complex I and is used as an insecticide?","options":["Cyanide","DNP","Thermogenin","Rotenone"],"answer":"Rotenone","solution":"A: Cyanide acts at Complex IV\nB: DNP is an uncoupler\nC: Thermogenin is a natural uncoupler\nD: The lecture states rotenone inhibits Complex I and is an insecticide","source":"Electron Transport Chain-Nathaniel Yebuah.pdf | SLIDE 58","difficulty":"Devil Mode"},{"id":"mls-v2-072","module":"v2","type":"mcq","q":"How do uncouplers such as DNP work?","options":["They carry protons across the inner membrane, dissipating the gradient","They block electron flow at Complex I","They inhibit ATP synthase directly","They increase oxygen binding to haemoglobin"],"answer":"They carry protons across the inner membrane, dissipating the gradient","solution":"A: The lecture states uncouplers shuttle H⁺ across the inner membrane down their gradient\nB: That is rotenone\nC: That is oligomycin\nD: That is not their action","source":"Electron Transport Chain-Nathaniel Yebuah.pdf | SLIDE 60","difficulty":"Medium"},{"id":"mls-v2-073","module":"v2","type":"mcq","q":"What is thermogenin?","options":["A mitochondrial ATP synthase","A cytochrome","An uncoupling protein in brown adipose tissue that generates heat","A glycolytic enzyme"],"answer":"An uncoupling protein in brown adipose tissue that generates heat","solution":"A: It is an uncoupler, not ATP synthase\nB: It is not an electron carrier\nC: The lecture states thermogenin occurs in brown fat of newborn and hibernating mammals\nD: It is not in glycolysis","source":"Electron Transport Chain-Nathaniel Yebuah.pdf | SLIDE 63","difficulty":"Medium"},{"id":"mls-v2-074","module":"v2","type":"mcq","q":"Why is the inner mitochondrial membrane impermeable to NADH?","options":["NADH is too large to cross any membrane","NADH is destroyed in the cytosol","NADH cannot donate electrons","Cytosolic NADH reducing equivalents must be shuttled in indirectly"],"answer":"Cytosolic NADH reducing equivalents must be shuttled in indirectly","solution":"A: Size alone is not the reason\nB: It is not destroyed\nC: NADH is an electron donor\nD: The lecture states the inner membrane is impermeable to NADH and electrons are carried by shuttle systems","source":"Electron Transport Chain-Nathaniel Yebuah.pdf | SLIDE 24","difficulty":"Hard"},{"id":"mls-v2-075","module":"v2","type":"mcq","q":"Which shuttle transfers NADH equivalents into the matrix via malate?","options":["The malate/aspartate shuttle","The glycerol phosphate shuttle","The citrate shuttle","The carnitine shuttle"],"answer":"The malate/aspartate shuttle","solution":"A: The lecture describes NADH reducing oxa
