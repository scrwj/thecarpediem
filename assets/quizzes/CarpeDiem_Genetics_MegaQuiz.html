etaphase II. How many chromosomes and chromatids does each cell carry?", "options": ["20 chromosomes and 20 chromatids", "10 chromosomes and 20 chromatids", "10 chromosomes and 10 chromatids", "20 chromosomes and 40 chromatids"], "correct_index": 1, "explanations": ["Not this: 20 chromosomes would be the diploid number.", "Correct. After meiosis I each cell has 10 chromosomes, each with two chromatids.", "Not this: chromatids are still paired at metaphase II.", "Not this: 40 chromatids would be a mitotic count."]}, {"tag": "M5·Q94", "mid": "m05", "difficulty": "devil", "section": "Meiosis II and comparison with mitosis", "qt": "single", "source": "Genetics 4-6, slide 91", "qc": "Counting separated chromatids as chromosomes, how many chromosomes does one human cell have in anaphase II?", "options": ["23", "92", "11", "46"], "correct_index": 3, "explanations": ["Not this: 23 is the number before separation.", "Not this: 92 would be a diploid anaphase count.", "Not this: 11 is not a human number.", "Correct. A secondary cell has 23 chromosomes of two chromatids each, giving 46 once separated."]}, {"tag": "M5·Q95", "mid": "m05", "difficulty": "devil", "section": "Meiosis II and comparison with mitosis", "qt": "classification", "source": "slides 75-93", "qc": "Match each division with its description.\n(i) Meiosis I\n(ii) Meiosis II\n(iii) Mitosis", "options": ["(i) Equational; (ii) reductional; (iii) non-reductional", "(i) Reductional; (ii) equational; (iii) non-reductional", "(i) Reductional; (ii) non-reductional; (iii) equational", "(i) Non-reductional; (ii) reductional; (iii) equational"], "correct_index": 1, "explanations": ["Not this: it swaps meiosis I and meiosis II.", "Correct. Meiosis I reduces the chromosome number, meiosis II separates sister chromatids, and mitosis keeps the number.", "Not this: meiosis II is equational, not non-reductional only.", "Not this: meiosis I is reductional, not non-reductional."]}, {"tag": "M5·Q96", "mid": "m05", "difficulty": "devil", "section": "Meiosis II and comparison with mitosis", "qt": "single", "source": "Genetics 4-6, slide 75", "qc": "Across the whole of meiosis, when does DNA replication occur?", "options": ["Once, before meiosis I, and not before meiosis II", "Before both the first and the second meiotic divisions", "Only before meiosis II and not before meiosis I", "In prophase I, together with crossing over"], "correct_index": 0, "explanations": ["Correct. A single replication supports two divisions.", "Not this: there is no second replication.", "Not this: replication precedes meiosis I.", "Not this: prophase I handles pairing and crossing over."]}, {"tag": "M5·Q97", "mid": "m05", "difficulty": "easy", "section": "Genetic variation and the significance of meiosis", "qt": "single", "source": "Genetics 4-6, slide 79", "qc": "Which two events in meiosis create genetic variation?", "options": ["DNA replication in S phase and cytokinesis at the end", "Spindle formation in prophase and nuclear division in telophase II", "Crossing over in prophase I, independent assortment in metaphase I", "Chromosome condensation in prophase and cell growth in G1"], "correct_index": 2, "explanations": ["Not this: replication copies DNA and does not shuffle it.", "Not this: spindle and nuclear division are structures and events, not shuffling.", "Correct. These are the two events named for variation.", "Not this: condensation and growth do not recombine genes."]}, {"tag": "M5·Q98", "mid": "m05", "difficulty": "medium", "section": "Genetic variation and the significance of meiosis", "qt": "single", "source": "Genetics 4-6, slide 94", "qc": "What does meiosis conserve from generation to generation?", "options": ["The total number of cells in every organism across the generations", "The size and the shape of each gamete produced by a parent", "The number of chromosomes in sexually reproducing organisms", "The sex of every offspring produced in the next generation"], "correct_index": 2, "explanations": ["Not this: cell number varies.", "Not this: gamete size is not the point.", "Correct. Meiosis keeps the chromosome number constant across generations.", "Not this: sex is decided by the sex chromosomes."]}, {"tag": "M5·Q99", "mid": "m05", "difficulty": "medium", "section": "Genetic variation and the significance of meiosis", "qt": "single", "source": "Genetics 4-6, slide 95", "qc": "What does crossing over contribute to gametes?", "options": ["A doubling of the chromosome number in each of the gametes produced", "The loss of the sex chromosomes from every gamete", "A copy of every stage of the mitotic cell cycle", "Recombination of paternal and maternal hereditary traits"], "correct_index": 3, "explanations": ["Not this: chromosome number is not doubled by crossing over.", "Not this: sex chromosomes are not lost.", "Not this: mitotic stages are not copied.", "Correct. Crossing over recombines maternal and paternal alleles."]}, {"tag": "M5·Q100", "mid": "m05", "difficulty": "medium", "section": "Genetic variation and the significance of meiosis", "qt": "single", "source": "Genetics 4-6, slide 74", "qc": "What is syngamy?", "options": ["The pairing of homologous chromosomes at the start of meiosis I", "The union of a male and a female gamete, or fertilization", "The division of the centromere in anaphase II", "The condensation of chromatin into chromosomes"], "correct_index": 1, "explanations": ["Not this: pairing is synapsis.", "Correct. Syngamy is fertilization to form a zygote.", "Not this: centromere division is anaphase.", "Not this: condensation is prophase."]}, {"tag": "M5·Q101", "mid": "m05", "difficulty": "hard", "section": "Genetic variation and the significance of meiosis", "qt": "single", "source": "Genetics 4-6, slide 95", "qc": "Why is the number of different kinds of gametes said to be virtually infinite?", "options": ["Crossing over between non-sister chromatids reshuffles the genes", "Gametes are replicated indefinitely after they form", "Mutations occur in every single gamete that is made", "Each gamete belongs to a completely different species of organism"], "correct_index": 0, "explanations": ["Correct. Exchange between chromatids multiplies the possible gametes.", "Not this: replication does not produce variety.", "Not this: mutation is not claimed for every gamete.", "Not this: gametes are from one species."]}, {"tag": "M5·Q102", "mid": "m05", "difficulty": "hard", "section": "Genetic variation and the significance of meiosis", "qt": "single", "source": "Genetics 4-6, slide 94", "qc": "What would happen to the chromosome number across generations if fertilization occurred without meiosis?", "options": ["It would halve each generation", "It would double each generation", "It would stay the same", "It would vary at random with no limit"], "correct_index": 1, "explanations": ["Not this: halving is what meiosis does.", "Correct. Fusing two diploid gametes would double the number every generation.", "Not this: the number is kept stable only because of meiosis.", "Not this: the number would double predictably."]}, {"tag": "M5·Q103", "mid": "m05", "difficulty": "hard", "section": "Genetic variation and the significance of meiosis", "qt": "single", "source": "Genetics 4-6, slide 79", "qc": "In which stage of meiosis does independent assortment occur?", "options": ["Metaphase I", "Prophase II", "Telophase II", "Interkinesis"], "correct_index": 0, "explanations": ["Correct. Bivalents orient at random at metaphase I.", "Not this: prophase II has no pairing.", "Not this: telophase II reforms nuclei.", "Not this: interkinesis has no assortment."]}, {"tag": "M5·Q104", "mid": "m05", "difficulty": "hard", "section": "Genetic variation and the significance of meiosis", "qt": "single", "source": "Genetics 4-6, slide 95", "qc": "How does crossing over differ in effect from independent assortment?", "options": ["Crossing over shuffles whole chromosomes; independent assortment swaps segments between homologues", "They are one and the same process, occurring at two different stages", "Neither process changes the genetic make-up of the gametes", "Crossing over swaps segments between homologues; assortment shuffles whole chromosomes"], "correct_index": 3, "explanations": ["Not this: this reverses the two processes.", "Not this: they occur at different stages.", "Not this: both generate variation.", "Correct. One reshuffles within chromosomes, the other between whole chromosomes."]}, {"tag": "M5·Q105", "mid": "m05", "difficulty": "hard", "section": "Genetic variation and the significance of meiosis", "qt": "single", "source": "Genetics 4-6, slide 94", "qc": "What does fertilization restore in the zygote?", "options": ["The haploid chromosome number", "A tetraploid number", "The diploid chromosome number", "No chromosomes"], "correct_index": 2, "explanations": ["Not this: gametes are haploid.", "Not this: the zygote is diploid, not tetraploid.", "Correct. Two haploid gametes fuse to make a diploid zygote.", "Not this: the zygote has a full chromosome set."]}, {"tag": "M5·Q106", "mid": "m05", "difficulty": "hard", "section": "Genetic variation and the significance of meiosis", "qt": "single", "source": "Genetics 4-6, slide 95", "qc": "What do the gametes from one individual show about genetic variation?", "options": ["They differ because of crossing over and independent assortment", "They are all genetically identical to one another and to the parent cell", "They carry only maternal chromosomes and no paternal ones", "They carry only paternal chromosomes and no maternal ones"], "correct_index": 0, "explanations": ["Correct. Meiosis makes genetically different gametes.", "Not this: meiosis does not make clones.", "Not this: gametes contain both parental contributions.", "Not this: maternal and paternal chromosomes are shuffled."]}, {"tag": "M5·Q107", "mid": "m05", "difficulty": "devil", "section": "Genetic variation and the significance of meiosis", "qt": "single", "source": "Genetics 4-6, slide 79; general", "qc": "A pea plant has 2n = 14. Considering independent assortment alone, how many different gamete combinations can it make?", "options": ["14", "128", "49", "7"], "correct_index": 1, "explanations": ["Not this: 14 is the diploid number.", "Correct. Each of the 7 bivalents orients in two ways, giving 2⁷ = 128.", "Not this: 49 is 7 squared.", "Not this: 7 is the haploid number."]}, {"tag": "M5·Q108", "mid": "m05", "difficulty": "devil", "section": "Genetic variation and the significance of meiosis", "qt": "single", "source": "Genetics 4-6, slide 94", "qc": "Why does sexual reproduction require meiosis?", "options": ["Meiosis makes the gametes genetically identical to each other and to the parent", "Mitosis is the division that makes haploid gametes in animals", "Fertilization halves the chromosome number of the zygote", "Fertilization joins two gametes, so meiosis must halve the number first"], "correct_index": 3, "explanations": ["Not this: meiosis creates variety, not identical gametes.", "Not this: mitosis keeps the diploid number.", "Not this: fertilization doubles the number.", "Correct. Halving before fertilization keeps the number constant."]}, {"tag": "M5·Q109", "mid": "m05", "difficulty": "devil", "section": "Genetic variation and the significance of meiosis", "qt": "single", "source": "Genetics 4-6, slide 95", "qc": "A student says crossing over happens between sister chromatids and gives variation. What is wrong?", "options": ["Crossing over occurs only between sister chromatids of one chromosome", "Sister chromatids carry different alleles of every gene they contain", "Crossing over is between non-sister chromatids, since sisters are identical", "Crossing over occurs only in mitosis and never in meiosis"], "correct_index": 2, "explanations": ["Not this: the lecture says non-sister chromatids.", "Not this: sister chromatids are identical copies.", "Correct. Exchange must be between non-sister chromatids to recombine alleles.", "Not this: crossing over occurs in prophase I of meiosis."]}, {"tag": "M5·Q110", "mid": "m05", "difficulty": "devil", "section": "Genetic variation and the significance of meiosis", "qt": "single", "source": "Genetics 4-6, slide 79; general", "qc": "Considering independent assortment alone, about how many different gametes can a human produce?", "options": ["About 8.4 million (2²³)", "About 46", "About 529 (23²)", "About 23"], "correct_index": 0, "explanations": ["Correct. 23 bivalents each orient in two ways, giving 2²³ ≈ 8.4 million.", "Not this: 46 is the diploid number.", "Not this: 529 is 23 squared.", "Not this: 23 is the haploid number."]}, {"tag": "M6·Q1", "mid": "m06", "difficulty": "easy", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 106", "qc": "What condition is described as euploidy?", "options": ["The gain or loss of a single whole chromosome from the set", "The loss of a part of one chromosome of a pair", "The breakage of a chromosome arm near the centromere", "One or more complete haploid sets of chromosomes"], "correct_index": 3, "explanations": ["Not this: gain or loss of one chromosome is aneuploidy.", "Not this: loss of a segment is a deletion.", "Not this: breakage is a structural change.", "Correct. Euploidy involves complete sets of chromosomes."]}, {"tag": "M6·Q2", "mid": "m06", "difficulty": "easy", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 108", "qc": "How many sets of chromosomes does a triploid have?", "options": ["Two", "Three", "Four", "One"], "correct_index": 1, "explanations": ["Not this: two sets is diploid.", "Correct. Triploid means three sets (3n).", "Not this: four sets is tetraploid.", "Not this: one set is monoploid."]}, {"tag": "M6·Q3", "mid": "m06", "difficulty": "easy", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 104", "qc": "About what fraction of flowering plants (angiosperms) are polyploid?", "options": ["About one tenth", "About one half", "About one third", "Almost none"], "correct_index": 2, "explanations": ["Not this: one tenth is too small.", "Not this: one half is too large.", "Correct. The lecture estimates one third.", "Not this: polyploidy is common in plants."]}, {"tag": "M6·Q4", "mid": "m06", "difficulty": "medium", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 107", "qc": "What is a monoploid?", "options": ["An organism that is missing one chromosome of a pair", "An organism with three complete sets of chromosomes", "An organism with a single extra chromosome in its set", "An organism with only one set of chromosomes (n)"], "correct_index": 3, "explanations": ["Not this: missing one chromosome is monosomy.", "Not this: three sets is triploid.", "Not this: an extra chromosome is trisomy.", "Correct. Monoploids have one set, as in nuclei of some fungi."]}, {"tag": "M6·Q5", "mid": "m06", "difficulty": "medium", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 107", "qc": "How are monoploids in higher organisms usually described?", "options": ["Larger and more vigorous than normal diploids; plants are usually fertile", "Always fertile and more vigorous in both plants and animals", "Smaller and less vigorous than diploids; plants are usually sterile", "Common in most animal populations and often seen in humans"], "correct_index": 2, "explanations": ["Not this: they are less vigorous.", "Not this: monoploid plants are usually sterile.", "Correct. Monoploid animals rarely survive and monoploid plants are usually sterile.", "Not this: few monoploid animals survive."]}, {"tag": "M6·Q6", "mid": "m06", "difficulty": "medium", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 108", "qc": "How can a triploid arise?", "options": ["From the union of a monoploid gamete (n) with a diploid gamete (2n)", "From the union of two monoploid gametes (n + n) in a normal fertilization", "From the loss of one chromosome during division", "From the breakage of one chromosome during division"], "correct_index": 0, "explanations": ["Correct. n + 2n gives 3n.", "Not this: n + n gives a diploid.", "Not this: losing a chromosome gives monosomy.", "Not this: breakage is a structural change."]}, {"tag": "M6·Q7", "mid": "m06", "difficulty": "medium", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 108", "qc": "Why are triploids sterile and rare in natural populations?", "options": ["They have no chromosomes at all in any of their body cells or gametes", "The extra set divides unevenly, making unbalanced gametes", "They cannot undergo mitosis in their somatic cells", "They have only one sex and cannot find a mate"], "correct_index": 1, "explanations": ["Not this: triploids have three sets of chromosomes.", "Correct. Unbalanced gametes make triploids sterile.", "Not this: triploids can divide by mitosis.", "Not this: sex is not the cause."]}, {"tag": "M6·Q8", "mid": "m06", "difficulty": "medium", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 109", "qc": "How can tetraploids (4n) arise in body cells?", "options": ["By losing a whole chromosome pair during cell division", "By one sperm fertilizing two eggs at the same time", "By deletion of a segment from one chromosome arm in the cell", "By somatic doubling, spontaneously or induced by colchicine"], "correct_index": 3, "explanations": ["Not this: losing a pair is nullisomy.", "Not this: polyspermy is not the lecture's mechanism.", "Not this: deletion is a structural change.", "Correct. Doubling can be spontaneous or chemical."]}, {"tag": "M6·Q9", "mid": "m06", "difficulty": "medium", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 109", "qc": "What substance is used to induce chromosome doubling at high frequency?", "options": ["Penicillin", "Insulin", "Colchicine", "Glucose"], "correct_index": 2, "explanations": ["Not this: penicillin is an antibiotic.", "Not this: insulin is a hormone.", "Correct. The lecture names colchicine as the inducer.", "Not this: glucose is a sugar."]}, {"tag": "M6·Q10", "mid": "m06", "difficulty": "hard", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 108", "qc": "The garden pea has 2n = 14. How many chromosomes does a triploid pea have?", "options": ["14", "21", "28", "7"], "correct_index": 1, "explanations": ["Not this: 14 is diploid.", "Correct. Three sets of 7 gives 21.", "Not this: 28 is tetraploid.", "Not this: 7 is monoploid."]}, {"tag": "M6·Q11", "mid": "m06", "difficulty": "hard", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 109", "qc": "The garden pea has 2n = 14. How many chromosomes does a tetraploid pea have?", "options": ["28", "21", "14", "7"], "correct_index": 0, "explanations": ["Correct. Four sets of 7 gives 28.", "Not this: 21 is triploid.", "Not this: 14 is diploid.", "Not this: 7 is monoploid."]}, {"tag": "M6·Q12", "mid": "m06", "difficulty": "hard", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 108", "qc": "A species has 2n = 24. How many chromosomes does a triploid cell contain?", "options": ["24", "48", "12", "36"], "correct_index": 3, "explanations": ["Not this: 24 is diploid.", "Not this: 48 is tetraploid.", "Not this: 12 is monoploid.", "Correct. n = 12, so 3n = 36."]}, {"tag": "M6·Q13", "mid": "m06", "difficulty": "hard", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 109", "qc": "Cattle have 2n = 60. How many chromosomes would a tetraploid cattle cell contain?", "options": ["90", "60", "120", "30"], "correct_index": 2, "explanations": ["Not this: 90 is triploid.", "Not this: 60 is diploid.", "Correct. n = 30, so 4n = 120.", "Not this: 30 is monoploid."]}, {"tag": "M6·Q14", "mid": "m06", "difficulty": "hard", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 108", "qc": "How many chromosomes would a triploid human cell contain?", "options": ["46", "69", "92", "23"], "correct_index": 1, "explanations": ["Not this: 46 is diploid.", "Correct. n = 23, so 3n = 69.", "Not this: 92 is tetraploid.", "Not this: 23 is monoploid."]}, {"tag": "M6·Q15", "mid": "m06", "difficulty": "hard", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 109", "qc": "How many chromosomes would a tetraploid human cell contain?", "options": ["92", "69", "46", "184"], "correct_index": 0, "explanations": ["Correct. n = 23, so 4n = 92.", "Not this: 69 is triploid.", "Not this: 46 is diploid.", "Not this: 184 is eight sets."]}, {"tag": "M6·Q16", "mid": "m06", "difficulty": "hard", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 109", "qc": "Besides somatic doubling, how else can tetraploids arise?", "options": ["By the union of two normal monoploid (n) gametes", "By the loss of a single chromosome in meiosis", "By crossing over between two non-sister chromatids", "By the union of unreduced diploid (2n) gametes"], "correct_index": 3, "explanations": ["Not this: two n gametes give 2n.", "Not this: loss gives aneuploidy.", "Not this: crossing over is exchange, not doubling.", "Correct. Two 2n gametes give 4n."]}, {"tag": "M6·Q17", "mid": "m06", "difficulty": "hard", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 105", "qc": "What range does variation in chromosome number cover?", "options": ["Only the loss of a single chromosome from the diploid set of cells", "From gain or loss of one chromosome to whole haploid sets", "Only the doubling of a single chromosome within the set", "Only the addition of whole sets of chromosomes to a cell"], "correct_index": 1, "explanations": ["Not this: single losses are only part of the range.", "Correct. Variation includes both single chromosomes and whole sets.", "Not this: doubling a single chromosome is only part.", "Not this: whole sets are only part."]}, {"tag": "M6·Q18", "mid": "m06", "difficulty": "devil", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 108", "qc": "A pea plant (n = 7) forms a triploid from a monoploid gamete and a diploid gamete. How many chromosomes come from each gamete?", "options": ["14 from each of the two gametes, giving a total of 28 chromosomes", "7 from each of the two gametes, giving 14 in total", "7 from the monoploid gamete and 14 from the diploid gamete", "21 from the diploid gamete and none from the monoploid"], "correct_index": 2, "explanations": ["Not this: that would give 28.", "Not this: that would give 14.", "Correct. n + 2n = 7 + 14 = 21.", "Not this: the diploid gamete has 14, not 21."]}, {"tag": "M6·Q19", "mid": "m06", "difficulty": "devil", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 106", "qc": "A plant of a species with 2n = 20 has cells with 30 chromosomes. Which description fits?", "options": ["Triploid, an example of euploidy", "Trisomic, an example of aneuploidy", "Tetraploid, an example of euploidy", "Monosomic, an example of aneuploidy"], "correct_index": 0, "explanations": ["Correct. 30 is three sets of 10, which is euploid.", "Not this: trisomic would be 21.", "Not this: tetraploid would be 40.", "Not this: monosomic would be 19."]}, {"tag": "M6·Q20", "mid": "m06", "difficulty": "devil", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 106", "qc": "A plant species with 2n = 40 has an individual with 41 chromosomes. Which term fits?", "options": ["Triploid (3n)", "Aneuploid (trisomic, 2n + 1)", "Euploid (4n)", "Monoploid (n)"], "correct_index": 1, "explanations": ["Not this: triploid would be 60.", "Correct. One extra chromosome gives 2n + 1.", "Not this: tetraploid would be 80.", "Not this: monoploid would be 20."]}, {"tag": "M6·Q21", "mid": "m06", "difficulty": "devil", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 107", "qc": "Why are few monoploid animals able to survive?", "options": ["They have too many sets of chromosomes, which makes them unstable", "They cannot undergo any form of cell division at all", "They contain only sex chromosomes and no autosomes", "Having one set unmasks recessive alleles, reducing viability"], "correct_index": 3, "explanations": ["Not this: monoploids have only one set.", "Not this: they can divide by mitosis.", "Not this: monoploids carry a full haploid set.", "Correct. The lecture says monoploids are usually less viable."]}, {"tag": "M6·Q22", "mid": "m06", "difficulty": "devil", "section": "Euploidy and polyploidy", "qt": "single", "source": "Genetics 4-6, slide 108", "qc": "Which statement distinguishes euploidy from aneuploidy?", "options": ["Euploidy changes whole sets; aneuploidy changes parts of a set", "Euploidy changes single chromosomes, while aneuploidy changes whole sets of them", "Both change only single chromosomes, never whole sets", "Neither of them changes the chromosome number at all"], "correct_index": 0, "explanations": ["Correct. Euploidy involves whole sets and aneuploidy involves single chromosomes.", "Not this: this reverses them.", "Not this: euploidy changes whole sets.", "Not this: both change chromosome number."]}, {"tag": "M6·Q23", "mid": "m06", "difficulty": "easy", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 111", "qc": "Which suffix is part of the nomenclature of aneuploid conditions?", "options": ["-ploid", "-genic", "-somic", "-static"], "correct_index": 2, "explanations": ["Not this: -ploid is used for euploid sets.", "Not this: -genic is not used here.", "Correct. Names such as monosomic and trisomic use -somic.", "Not this: -static is not used here."]}, {"tag": "M6·Q24", "mid": "m06", "difficulty": "easy", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 116", "qc": "What is the chromosomal formula of a monosomic?", "options": ["2n + 1", "2n − 2", "3n", "2n − 1"], "correct_index": 3, "explanations": ["Not this: 2n + 1 is trisomic.", "Not this: 2n − 2 is nullisomic.", "Not this: 3n is triploid.", "Correct. A monosomic lacks one chromosome of a pair."]}, {"tag": "M6·Q25", "mid": "m06", "difficulty": "medium", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 119", "qc": "What is the chromosomal formula of a trisomic?", "options": ["2n − 1", "2n + 1", "2n − 2", "4n"], "correct_index": 1, "explanations": ["Not this: 2n − 1 is monosomic.", "Correct. A trisomic has one extra chromosome.", "Not this: 2n − 2 is nullisomic.", "Not this: 4n is tetraploid."]}, {"tag": "M6·Q26", "mid": "m06", "difficulty": "medium", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 121", "qc": "What is a nullisomic?", "options": ["An organism that has lost a chromosome pair (2n − 2)", "An organism with a single extra chromosome (2n + 1)", "An organism with a missing sex chromosome only", "An organism with four complete sets of chromosomes (4n)"], "correct_index": 0, "explanations": ["Correct. A nullisomic lacks both members of a pair.", "Not this: an extra chromosome is trisomic.", "Not this: nullisomy involves a pair, not a sex chromosome only.", "Not this: four sets is tetraploid."]}, {"tag": "M6·Q27", "mid": "m06", "difficulty": "medium", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 118", "qc": "Which two kinds of gametes can a monosomic form?", "options": ["n and n + 1", "2n and n", "n and n − 1", "n − 1 and n − 2"], "correct_index": 2, "explanations": ["Not this: n + 1 belongs to a trisomic.", "Not this: 2n is a diploid gamete.", "Correct. Monosomics make n and n − 1 gametes.", "Not this: n − 2 does not arise from a monosomic."]}, {"tag": "M6·Q28", "mid": "m06", "difficulty": "medium", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 119", "qc": "Which two kinds of gametes can a trisomic form?", "options": ["n and n − 1", "n + 1 and n", "2n and n", "n − 1 and n + 2"], "correct_index": 1, "explanations": ["Not this: n − 1 belongs to a monosomic.", "Correct. Trisomics make n + 1 and n gametes.", "Not this: 2n is a diploid gamete.", "Not this: n + 2 does not arise."]}, {"tag": "M6·Q29", "mid": "m06", "difficulty": "medium", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 112", "qc": "Aneuploidy can arise through which two events?", "options": ["Unequal crossing over between chromatids only", "Spindle formation in normal dividing cells only", "Primary or secondary nondisjunction", "DNA replication during S phase of interphase only"], "correct_index": 2, "explanations": ["Not this: unequal crossing over makes duplications and deletions.", "Not this: spindle formation is normal.", "Correct. Nondisjunction produces gametes with too many or too few chromosomes.", "Not this: replication is normal."]}, {"tag": "M6·Q30", "mid": "m06", "difficulty": "hard", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 116", "qc": "A species has 2n = 46. How many chromosomes does a monosomic cell contain?", "options": ["47", "44", "46", "45"], "correct_index": 3, "explanations": ["Not this: 47 is trisomic.", "Not this: 44 is nullisomic.", "Not this: 46 is normal.", "Correct. 2n − 1 = 45."]}, {"tag": "M6·Q31", "mid": "m06", "difficulty": "hard", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 119", "qc": "A species has 2n = 14. How many chromosomes does a trisomic cell contain?", "options": ["15", "13", "16", "12"], "correct_index": 0, "explanations": ["Correct. 2n + 1 = 15.", "Not this: 13 is monosomic.", "Not this: 16 does not match 2n + 1.", "Not this: 12 is nullisomic."]}, {"tag": "M6·Q32", "mid": "m06", "difficulty": "hard", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 121", "qc": "A species has 2n = 14. How many chromosomes does a nullisomic cell contain?", "options": ["12", "13", "15", "7"], "correct_index": 0, "explanations": ["Correct. 2n − 2 = 12.", "Not this: 13 is monosomic.", "Not this: 15 is trisomic.", "Not this: 7 is haploid."]}, {"tag": "M6·Q33", "mid": "m06", "difficulty": "hard", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 118", "qc": "A species has n = 10. What chromosome numbers can the gametes of a monosomic have?", "options": ["10 and 11", "10 and 9", "20 and 19", "9 and 8"], "correct_index": 1, "explanations": ["Not this: 10 and 11 belong to a trisomic.", "Correct. n = 10 and n − 1 = 9.", "Not this: 20 and 19 are diploid numbers.", "Not this: 8 does not arise."]}, {"tag": "M6·Q34", "mid": "m06", "difficulty": "hard", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 119", "qc": "A species has n = 10. What chromosome numbers can the gametes of a trisomic have?", "options": ["10 and 9", "22 and 21", "11 and 10", "12 and 11"], "correct_index": 2, "explanations": ["Not this: 10 and 9 belong to a monosomic.", "Not this: 22 and 21 are diploid-range numbers.", "Correct. n + 1 = 11 and n = 10.", "Not this: 12 does not arise."]}, {"tag": "M6·Q35", "mid": "m06", "difficulty": "hard", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 114", "qc": "What is anaphase lag?", "options": ["Failure of the DNA in the chromosomes to replicate during interphase", "The loss of the whole spindle apparatus before anaphase", "The doubling of every chromosome in the dividing cell", "Delayed chromosome movement, so it is left out of a daughter nucleus"], "correct_index": 3, "explanations": ["Not this: replication is separate.", "Not this: the spindle is still present.", "Not this: doubling is not anaphase lag.", "Correct. A lagging chromosome may be lost or captured in one cell."]}, {"tag": "M6·Q36", "mid": "m06", "difficulty": "hard", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 114", "qc": "In humans, how does aneuploidy arise at anaphase?", "options": ["The nuclear envelope fails to form around the chromosomes", "The cell makes extra centrioles that disturb the spindle", "The cell cycle skips interphase and goes straight to mitosis", "Paired chromosomes or sister chromatids fail to disjoin"], "correct_index": 3, "explanations": ["Not this: the envelope forms in telophase.", "Not this: centrioles are not the cause.", "Not this: skipping interphase is not the cause.", "Correct. Failure to disjoin (nondisjunction) is the cause."]}, {"tag": "M6·Q37", "mid": "m06", "difficulty": "hard", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 118", "qc": "What is the usual effect in animals of losing one whole chromosome?", "options": ["Larger size and extra vigour from the added genetic material in cells", "No effect at all on the development of the animal", "High mortality or reduced fertility from genetic imbalance", "Immediate sex change in the developing embryo"], "correct_index": 2, "explanations": ["Not this: vigour is usually reduced.", "Not this: it has effects.", "Correct. Genetic imbalance is usually harmful.", "Not this: sex change is not stated."]}, {"tag": "M6·Q38", "mid": "m06", "difficulty": "hard", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 114", "qc": "A cell of a species with 2n = 20 loses one chromosome by anaphase lag. How many chromosomes does the affected daughter cell have, and what is the condition?", "options": ["19 chromosomes, monosomic", "21 chromosomes, trisomic", "18 chromosomes, nullisomic", "20 chromosomes, normal"], "correct_index": 0, "explanations": ["Correct. 2n − 1 = 19, which is monosomy.", "Not this: 21 would mean a gained chromosome.", "Not this: 18 would mean two chromosomes lost.", "Not this: 20 is the normal number."]}, {"tag": "M6·Q39", "mid": "m06", "difficulty": "devil", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 113", "qc": "If homologues fail to separate at meiosis I, what gametes do the four products carry?", "options": ["Four normal gametes, each with n chromosomes", "Two gametes with n + 1 and two gametes with n − 1", "Two normal gametes, one n + 1 and one n − 1 chromosomes", "Four gametes, all of which carry n + 1 chromosomes"], "correct_index": 1, "explanations": ["Not this: no gamete is normal.", "Correct. A meiosis I failure affects all four products.", "Not this: that pattern is for failure at meiosis II.", "Not this: not all products gain a chromosome."]}, {"tag": "M6·Q40", "mid": "m06", "difficulty": "devil", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 113", "qc": "If sister chromatids fail to separate at meiosis II in one cell, what gametes result from that cell line?", "options": ["Four gametes, all of which carry n + 1 chromosomes", "Four normal gametes, each with n chromosomes", "Two normal gametes, one n + 1 and one n − 1", "Two gametes with n + 1 and two gametes with n − 1"], "correct_index": 2, "explanations": ["Not this: not all four gain a chromosome.", "Not this: four normal gametes would mean no error.", "Correct. Only the affected secondary cell produces abnormal gametes.", "Not this: that pattern is for failure at meiosis I."]}, {"tag": "M6·Q41", "mid": "m06", "difficulty": "devil", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 113", "qc": "A gamete with n − 1 fertilizes a normal gamete. What condition results?", "options": ["Monosomy (2n − 1)", "Trisomy (2n + 1)", "Nullisomy (2n − 2)", "Triploidy (3n)"], "correct_index": 0, "explanations": ["Correct. n − 1 + n = 2n − 1.", "Not this: trisomy needs an n + 1 gamete.", "Not this: nullisomy needs two n − 1 gametes.", "Not this: triploidy needs a 2n gamete."]}, {"tag": "M6·Q42", "mid": "m06", "difficulty": "devil", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 113", "qc": "A gamete with n + 1 fertilizes a normal gamete. What condition results?", "options": ["Monosomy (2n − 1)", "Nullisomy (2n − 2)", "Tetraploidy (4n)", "Trisomy (2n + 1)"], "correct_index": 3, "explanations": ["Not this: monosomy needs an n − 1 gamete.", "Not this: nullisomy needs two n − 1 gametes.", "Not this: tetraploidy needs two 2n gametes.", "Correct. n + 1 + n = 2n + 1."]}, {"tag": "M6·Q43", "mid": "m06", "difficulty": "devil", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 122", "qc": "Why can some polyploids, such as hexaploid wheat, survive the loss of two homologues of a set?", "options": ["They have no genes at all on those chromosomes that are missing", "Genetic redundancy: other sets carry copies of the lost genes", "They have no chromosomes at all in their somatic cells", "They repair the loss of a pair by mitosis within the cell"], "correct_index": 1, "explanations": ["Not this: the lost chromosomes do carry genes.", "Correct. Extra sets provide backup copies.", "Not this: wheat still has chromosomes.", "Not this: mitosis does not restore lost chromosomes."]}, {"tag": "M6·Q44", "mid": "m06", "difficulty": "devil", "section": "Aneuploidy and nondisjunction", "qt": "single", "source": "Genetics 4-6, slide 121", "qc": "Why is nullisomy usually lethal in diploids?", "options": ["The cell has too many chromosomes to divide normally and survive", "The extra pair of chromosomes blocks every mitosis", "The sex of the cell is lost when the pair disappears", "Both copies of the pair's genes are absent, with no backup"], "correct_index": 3, "explanations": ["Not this: nullisomics have fewer, not more, chromosomes.", "Not this: there is no extra pair.", "Not this: sex is not the main cause.", "Correct. A diploid has no redundant copies of the lost pair."]}, {"tag": "M6·Q45", "mid": "m06", "difficulty": "easy", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 132", "qc": "What is a deletion (deficiency)?", "options": ["The addition of an extra chromosome", "The reversal of a segment", "The loss of a chromosomal segment", "The exchange of segments between two chromosomes"], "correct_index": 2, "explanations": ["Not this: an extra chromosome is trisomy.", "Not this: reversal is inversion.", "Correct. A deletion is the loss of a segment.", "Not this: exchange is translocation."]}, {"tag": "M6·Q46", "mid": "m06", "difficulty": "easy", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 140", "qc": "Which structural change is a 180° reversal of a chromosomal segment?", "options": ["Deletion", "Inversion", "Duplication", "Translocation"], "correct_index": 1, "explanations": ["Not this: A deletion removes a segment.", "Correct. An inversion reverses a segment 180°.", "Not this: A duplication repeats a segment.", "Not this: A translocation moves segments between chromosomes."]}, {"tag": "M6·Q47", "mid": "m06", "difficulty": "medium", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 135", "qc": "What is a duplication (repeat)?", "options": ["A segment present more than once in the same or another chromosome", "A segment that is missing from one arm of a chromosome", "A segment that is reversed in orientation by 180° in place", "A chromosome that has two functional centromeres and cannot divide"], "correct_index": 0, "explanations": ["Correct. A duplication is a repeated segment.", "Not this: A missing segment is a deletion.", "Not this: A reversed segment is an inversion.", "Not this: two centromeres is not the definition."]}, {"tag": "M6·Q48", "mid": "m06", "difficulty": "medium", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 134", "qc": "Cri-du-chat syndrome is associated with a heterozygous deficiency of which region?", "options": ["The long arm of chromosome 5", "The short arm of chromosome 21", "The short arm of chromosome 5", "The X chromosome"], "correct_index": 2, "explanations": ["Not this: it involves the short arm, not the long arm.", "Not this: chromosome 21 is linked to Down syndrome.", "Correct. It is a deficiency in the short arm of chromosome 5.", "Not this: it is not an X-linked deletion."]}, {"tag": "M6·Q49", "mid": "m06", "difficulty": "medium", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 143", "qc": "What is a reciprocal translocation?", "options": ["The loss of a segment from one chromosome arm and its genes", "The 180° reversal of a segment within a single chromosome arm", "The doubling of the whole chromosome set in every cell of the body", "An exchange of blocks of genes between nonhomologous chromosomes"], "correct_index": 3, "explanations": ["Not this: that is a deletion.", "Not this: that is an inversion.", "Not this: that is euploid doubling.", "Correct. Blocks are exchanged between nonhomologues."]}, {"tag": "M6·Q50", "mid": "m06", "difficulty": "medium", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 146", "qc": "What is a centric fusion (Robertsonian change)?", "options": ["Two nonhomologous chromosomes joining at the centromere to make one", "One metacentric chromosome splitting into two telocentric chromosomes", "Two homologous chromosomes pairing side by side in prophase I", "A segment that is reversed within a single chromosome arm"], "correct_index": 0, "explanations": ["Correct. Fusion joins two chromosomes into one metacentric.", "Not this: that is fission.", "Not this: pairing is synapsis.", "Not this: reversal is inversion."]}, {"tag": "M6·Q51", "mid": "m06", "difficulty": "medium", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 147", "qc": "What is a centric fission?", "options": ["Two telocentric chromosomes joining together at the centromere to form one", "One metacentric chromosome splitting into two telocentric chromosomes", "The loss of a segment from the end of one chromosome arm", "The addition of one complete haploid set to the genome"], "correct_index": 1, "explanations": ["Not this: that is fusion.", "Correct. Fission is the reciprocal of fusion.", "Not this: loss of a segment is a deletion.", "Not this: adding a set is polyploidy."]}, {"tag": "M6·Q52", "mid": "m06", "difficulty": "medium", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 141", "qc": "A chromosome has the gene order ABCDEFGH. After inversion of the segment DEF, what is the new order?", "options": ["ABCDEFGH", "HGFEDCBA", "ABCFEDGH", "ABCEDFGH"], "correct_index": 2, "explanations": ["Not this: that is the original order.", "Not this: that reverses the whole chromosome.", "Correct. The segment DEF is reversed to FED.", "Not this: that reverses only DE."]}, {"tag": "M6·Q53", "mid": "m06", "difficulty": "medium", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 141", "qc": "A chromosome has the gene order ABCDEFGH. What order remains after deletion of the segment DE?", "options": ["ABCEFGH", "ABCFGH", "ABCEDFGH", "ABCDEFGH"], "correct_index": 1, "explanations": ["Not this: that removes only D.", "Correct. D and E are lost.", "Not this: that inverts DE instead of deleting it.", "Not this: that is unchanged."]}, {"tag": "M6·Q54", "mid": "m06", "difficulty": "hard", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 132", "qc": "Why are deletions usually lethal in the homozygous condition?", "options": ["Both homologues lack the genes in the missing segment", "Both homologues carry an extra copy of the same segment", "The segment is reversed in both of the homologues", "The centromere is lost in both of the homologues"], "correct_index": 0, "explanations": ["Correct. No functional copy of the missing genes remains.", "Not this: an extra copy would be a duplication.", "Not this: reversal is inversion.", "Not this: the centromere is not the issue."]}, {"tag": "M6·Q55", "mid": "m06", "difficulty": "hard", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 141", "qc": "What is the difference between pericentric and paracentric inversions?", "options": ["Paracentric inversions include the centromere, while pericentric ones do not", "Pericentric inversions change the gene number, whereas paracentric ones do not", "Paracentric inversions delete genes, whereas pericentric ones do not", "Pericentric inversions include the centromere; paracentric ones do not"], "correct_index": 3, "explanations": ["Not this: this reverses the two terms.", "Not this: inversions do not change gene number.", "Not this: inversions do not delete genes.", "Correct. Pericentric includes the centromere."]}, {"tag": "M6·Q56", "mid": "m06", "difficulty": "hard", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 140", "qc": "How does an inversion affect the number of chromosomes and genes?", "options": ["It increases the number of genes on the inverted chromosome segment", "It decreases the number of chromosomes in the cell", "It changes neither chromosome number nor gene number", "It changes both of the numbers, genes and chromosomes"], "correct_index": 2, "explanations": ["Not this: gene number is unchanged.", "Not this: chromosome number is unchanged.", "Correct. Only gene order changes.", "Not this: neither number changes."]}, {"tag": "M6·Q57", "mid": "m06", "difficulty": "hard", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 131", "qc": "Which pair of structural changes alter the number of genes on a chromosome?", "options": ["Inversions and translocations", "Inversions and deletions", "Translocations and duplications", "Deletions and duplications"], "correct_index": 3, "explanations": ["Not this: inversions and translocations alter location.", "Not this: inversion does not change number.", "Not this: translocation does not change number.", "Correct. Deletions lose genes and duplications add them."]}, {"tag": "M6·Q58", "mid": "m06", "difficulty": "hard", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 131", "qc": "Which pair of structural changes alter the location of genes?", "options": ["Inversions and translocations", "Deletions and duplications", "Deletions and inversions", "Duplications and translocations"], "correct_index": 0, "explanations": ["Correct. They change where genes sit.", "Not this: those change gene number.", "Not this: deletion changes number.", "Not this: duplication changes number."]}, {"tag": "M6·Q59", "mid": "m06", "difficulty": "hard", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 139", "qc": "Which agents can cause chromosome breakage leading to duplications and deletions?", "options": ["Only visible light and heat from the sun", "Radiation, chemicals and viruses", "Only changes in temperature of the cell", "Only a high concentration of oxygen in the cell"], "correct_index": 1, "explanations": ["Not this: light alone is not listed.", "Correct. The lecture lists radiation, chemicals and viruses, and unequal crossing over.", "Not this: temperature alone is not listed.", "Not this: oxygen is not listed."]}, {"tag": "M6·Q60", "mid": "m06", "difficulty": "hard", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 137", "qc": "What is a terminal duplication?", "options": ["A duplicated segment located at the end of the chromosome", "A duplicated segment located right next to the centromere", "A deleted segment lost from the end of the chromosome", "A segment that is reversed in the middle of the chromosome"], "correct_index": 0, "explanations": ["Correct. A terminal duplication is at the chromosome end.", "Not this: location next to the centromere is not terminal.", "Not this: deletion is a loss.", "Not this: reversal is inversion."]}, {"tag": "M6·Q61", "mid": "m06", "difficulty": "hard", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 141", "qc": "A chromosome has the gene order ABCDEFGH. After inversion of the segment CDE, what is the new order?", "options": ["ABDCEFGH", "AEDCBFGH", "ABEDCFGH", "HGFEDCBA"], "correct_index": 2, "explanations": ["Not this: that reverses only CD.", "Not this: that reverses BCDE.", "Correct. The inverted segment CDE is reversed to read EDC.", "Not this: that reverses the whole chromosome."]}, {"tag": "M6·Q62", "mid": "m06", "difficulty": "hard", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 141", "qc": "A chromosome has the gene order ABCDEFGH. After inversion of the segment FG, what is the new order?", "options": ["ABCDEHGF", "ABCDGFEH", "ABCDEFGH", "ABCDEGFH"], "correct_index": 3, "explanations": ["Not this: that reverses FGH.", "Not this: that reverses EFG.", "Not this: that is unchanged.", "Correct. The inverted segment FG is reversed to read GF."]}, {"tag": "M6·Q63", "mid": "m06", "difficulty": "hard", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 141", "qc": "A chromosome has the gene order ABCDEFGH. What order results from deletion of the segment BCD?", "options": ["ADEFGH", "AEFGH", "ABFGH", "ADCBEFGH"], "correct_index": 1, "explanations": ["Not this: that removes only BC.", "Correct. B, C and D are lost.", "Not this: that removes CDE.", "Not this: that inverts BCD instead."]}, {"tag": "M6·Q64", "mid": "m06", "difficulty": "hard", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 141", "qc": "A chromosome has the gene order ABCDEFGH. What order results from a tandem duplication of the segment BC?", "options": ["ABCCBDEFGH", "ABCBCDEFGH", "ADEFGH", "ABCDEFGH"], "correct_index": 1, "explanations": ["Not this: that is a reverse tandem duplication.", "Correct. BC appears twice, side by side in the same direction.", "Not this: that is a deletion.", "Not this: that is unchanged."]}, {"tag": "M6·Q65", "mid": "m06", "difficulty": "hard", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 141", "qc": "A chromosome has the gene order ABCDEFGH. What order results from a tandem duplication of the segment FG?", "options": ["ABCDEFGGFH", "ABCDEFEFGH", "ABCDEFGFGH", "ABCDEFGH"], "correct_index": 2, "explanations": ["Not this: that is a reverse tandem duplication.", "Not this: that duplicates EF.", "Correct. FG is repeated directly after itself.", "Not this: that is unchanged."]}, {"tag": "M6·Q66", "mid": "m06", "difficulty": "hard", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 141", "qc": "A chromosome has the gene order ABCDEFGH. What order results from a terminal duplication of the segment GH?", "options": ["ABCDEFGHGH", "ABCDEFGFGH", "ABCDEFGHHG", "ABCDEFGH"], "correct_index": 0, "explanations": ["Correct. GH is repeated at the end of the chromosome.", "Not this: that duplicates FG inside the chromosome instead.", "Not this: that is a reverse duplication of GH.", "Not this: that is unchanged."]}, {"tag": "M6·Q67", "mid": "m06", "difficulty": "hard", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 141", "qc": "A cell with 2n = 24 undergoes one centric fusion of two nonhomologous chromosomes. How many chromosomes does it now have?", "options": ["24", "25", "12", "23"], "correct_index": 3, "explanations": ["Not this: 24 is the original count.", "Not this: 25 would mean a gain.", "Not this: 12 is the haploid number.", "Correct. Two chromosomes join into one, leaving 23."]}, {"tag": "M6·Q68", "mid": "m06", "difficulty": "devil", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 138", "qc": "A recessive homozygote fails to show the recessive phenotype. Which structural change might explain this?", "options": ["A deletion of the dominant allele", "A duplication carrying a dominant allele", "An inversion with no change in genes", "A fission of the chromosome"], "correct_index": 1, "explanations": ["Not this: A deletion would remove a copy, not add a dominant one.", "Correct. The duplicated dominant allele masks the recessive.", "Not this: an inversion does not add copies.", "Not this: fission does not add a dominant allele."]}, {"tag": "M6·Q69", "mid": "m06", "difficulty": "devil", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 131", "qc": "A chromosome change moves genes without changing the number of genes. Which two changes could this be?", "options": ["Deletion or duplication", "Deletion or inversion", "Inversion or translocation", "Duplication or fission"], "correct_index": 2, "explanations": ["Not this: those change gene number.", "Not this: deletion changes number.", "Correct. Both rearrange gene location only.", "Not this: duplication changes number."]}, {"tag": "M6·Q70", "mid": "m06", "difficulty": "devil", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 141", "qc": "A chromosome has the gene order ABCDEFGH. What order results from a reverse tandem duplication of the segment CD?", "options": ["ABCDDCEFGH", "ABCDCDEFGH", "ABEFGH", "ABDCEFGH"], "correct_index": 0, "explanations": ["Correct. CD is followed by a reversed copy DC.", "Not this: that is a tandem duplication in the same order.", "Not this: that is a deletion.", "Not this: that is an inversion, with no extra copy."]}, {"tag": "M6·Q71", "mid": "m06", "difficulty": "devil", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 141", "qc": "Two nonhomologous chromosomes are ABCDEF and GHIJKL. After a reciprocal translocation that exchanges DEF with IJKL, what are the two new chromosomes?", "options": ["ABCDEF and GHIJKL (no change)", "ABCIJKL and GHIJKL", "ABCDEF and GHDEF", "ABCIJKL and GHDEF"], "correct_index": 3, "explanations": ["Not this: that shows no exchange.", "Not this: only one chromosome changed here.", "Not this: only one chromosome changed here.", "Correct. Each chromosome receives the other's tail segment."]}, {"tag": "M6·Q72", "mid": "m06", "difficulty": "devil", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 141", "qc": "Two nonhomologous chromosomes are ABCDEF and GHIJKL. After a reciprocal translocation that exchanges EF with L, what are the two new chromosomes?", "options": ["ABCDL and GHIJKEF", "ABCDEF and GHIJKL (no change)", "ABCDL and GHIJKL", "ABCDEF and GHIJKEF"], "correct_index": 0, "explanations": ["Correct. EF and L swap places.", "Not this: that shows no exchange.", "Not this: only one chromosome changed here.", "Not this: only one chromosome changed here."]}, {"tag": "M6·Q73", "mid": "m06", "difficulty": "devil", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 141", "qc": "The centromere of ABCDEFGH lies between C and D (ABC•DEFGH). Inversion of which segment is pericentric?", "options": ["BC (it excludes the centromere)", "CD (it includes the centromere)", "FG (it excludes the centromere)", "GH (it excludes the centromere)"], "correct_index": 1, "explanations": ["Not this: BC lies in one arm, so it is paracentric.", "Correct. A pericentric inversion includes the centromere.", "Not this: FG lies in one arm, so it is paracentric.", "Not this: GH lies in one arm, so it is paracentric."]}, {"tag": "M6·Q74", "mid": "m06", "difficulty": "devil", "section": "Structural chromosome aberrations", "qt": "single", "source": "Genetics 4-6, slide 141", "qc": "The centromere of ABCDEFGH lies between C and D (ABC•DEFGH). Inversion of which segment is paracentric?", "options": ["CD (it includes the centromere)", "BE (it includes the centromere)", "EF (it lies in one arm)", "AH (it includes the centromere)"], "correct_index": 2, "explanations": ["Not this: CD spans the centromere.", "Not this: BE spans the centromere.", "Correct. Paracentric inversions do not include the centromere.", "Not this: AH spans the centromere."]}, {"tag": "M6·Q75", "mid": "m06", "difficulty": "easy", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 149", "qc": "What is the karyotype notation of Down syndrome?", "options": ["47, +13", "47, +18", "45, X", "47, +21"], "correct_index": 3, "explanations": ["Not this: 47, +13 is Patau syndrome.", "Not this: 47, +18 is Edwards syndrome.", "Not this: 45, X is Turner syndrome.", "Correct. Down syndrome is trisomy 21."]}, {"tag": "M6·Q76", "mid": "m06", "difficulty": "easy", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 150", "qc": "Down syndrome is also known as:", "options": ["Trisomy 21", "Trisomy 13", "Trisomy 18", "Monosomy 21"], "correct_index": 0, "explanations": ["Correct. Three copies of chromosome 21 cause it.", "Not this: trisomy 13 is Patau syndrome.", "Not this: trisomy 18 is Edwards syndrome.", "Not this: it is a trisomy, not a monosomy."]}, {"tag": "M6·Q77", "mid": "m06", "difficulty": "medium", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 150", "qc": "What is the overall incidence of Down syndrome among Europeans?", "options": ["About 1 in 70", "About 1 in 20,000", "About 1 in 700 live births", "About 1 in 10,000"], "correct_index": 2, "explanations": ["Not this: 1 in 70 is far too high.", "Not this: 1 in 20,000 is the Patau incidence.", "Correct. The lecture gives 1 in 700.", "Not this: 1 in 10,000 is the Edwards incidence."]}, {"tag": "M6·Q78", "mid": "m06", "difficulty": "medium", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 149", "qc": "Most cases of Down syndrome result from nondisjunction at which division?", "options": ["The second mitotic division", "The second meiotic division only", "Fertilization", "The first meiotic division"], "correct_index": 3, "explanations": ["Not this: mitotic nondisjunction is not the typical cause.", "Not this: most cases are first division.", "Not this: fertilization is not a division.", "Correct. The lecture gives the first meiotic division."]}, {"tag": "M6·Q79", "mid": "m06", "difficulty": "medium", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 153", "qc": "Patau syndrome is due to trisomy of which chromosome?", "options": ["Chromosome 18", "Chromosome 13", "Chromosome 21", "Chromosome 5"], "correct_index": 1, "explanations": ["Not this: chromosome 18 is Edwards.", "Correct. 47, +13 is trisomy 13.", "Not this: chromosome 21 is Down.", "Not this: chromosome 5 is cri-du-chat."]}, {"tag": "M6·Q80", "mid": "m06", "difficulty": "medium", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 156", "qc": "Edwards syndrome is due to trisomy of which chromosome?", "options": ["Chromosome 18", "Chromosome 13", "Chromosome 21", "Chromosome 5"], "correct_index": 0, "explanations": ["Correct. 47, +18 is trisomy 18.", "Not this: chromosome 13 is Patau.", "Not this: chromosome 21 is Down.", "Not this: chromosome 5 is cri-du-chat."]}, {"tag": "M6·Q81", "mid": "m06", "difficulty": "medium", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 153", "qc": "About how common is Patau syndrome among newborns?", "options": ["About 1 in 700", "About 1 in 10,000", "About 1 in 100", "About 1 in 20,000"], "correct_index": 3, "explanations": ["Not this: 1 in 700 is Down syndrome.", "Not this: 1 in 10,000 is Edwards.", "Not this: 1 in 100 is far too high.", "Correct. The lecture gives 1 in 20,000."]}, {"tag": "M6·Q82", "mid": "m06", "difficulty": "hard", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 154", "qc": "What is the survival pattern of children with Patau syndrome?", "options": ["Most live on to adulthood and have an almost normal lifespan", "About 50% die within a month; about 10% survive a year", "All of the children survive to at least age five years", "Only 1% die in infancy and the rest live long"], "correct_index": 1, "explanations": ["Not this: few children with Patau syndrome survive to adulthood.", "Correct. Survival is poor, with most dying in the first year.", "Not this: most do not reach five.", "Not this: mortality is high."]}, {"tag": "M6·Q83", "mid": "m06", "difficulty": "hard", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 157", "qc": "What proportion of Edwards syndrome cases are spontaneously aborted?", "options": ["About 5%", "About 50%", "About 95%", "About 20%"], "correct_index": 2, "explanations": ["Not this: 5% is too low.", "Not this: 50% is too low.", "Correct. The lecture says 95%.", "Not this: 20% is too low."]}, {"tag": "M6·Q84", "mid": "m06", "difficulty": "hard", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 157", "qc": "What is the mortality of Edwards syndrome by two years of age?", "options": ["10 to 20%", "About 50%", "80 to 90%", "Under 5%"], "correct_index": 2, "explanations": ["Not this: 10 to 20% is too low.", "Not this: 50% is too low.", "Correct. Mortality is 80 to 90%.", "Not this: under 5% is far too low."]}, {"tag": "M6·Q85", "mid": "m06", "difficulty": "hard", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 155", "qc": "Which feature is listed among Patau syndrome symptoms?", "options": ["Webbed neck and shield chest", "Eyelid fold and flat face only", "Taller than average", "Cleft lip and polydactyly"], "correct_index": 3, "explanations": ["Not this: webbed neck is Turner syndrome.", "Not this: those are Down features.", "Not this: taller height is XYY.", "Correct. Patau symptoms include cleft lip and polydactyly."]}, {"tag": "M6·Q86", "mid": "m06", "difficulty": "hard", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 158", "qc": "Which diagnostic feature is listed for Edwards syndrome?", "options": ["Malformed ears and a receding mandible", "Cleft lip and extra fingers (polydactyly)", "A high-pitched, cat-like cry in newborn infants", "A webbed neck and a shield-shaped chest"], "correct_index": 0, "explanations": ["Correct. Malformed ears and a receding mandible are listed.", "Not this: cleft lip and polydactyly belong to Patau.", "Not this: the cat-like cry is cri-du-chat.", "Not this: A webbed neck is Turner."]}, {"tag": "M6·Q87", "mid": "m06", "difficulty": "hard", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 120", "qc": "Which features are listed for Down syndrome?", "options": ["Cleft lip, polydactyly, heart defects and unusually small eyes", "Short stature, eyelid fold, flat face and stubby fingers", "Webbed neck, shield-shaped chest and short stature", "Low birth weight, a small head and a high cat-like cry"], "correct_index": 1, "explanations": ["Not this: those are Patau.", "Correct. These are the listed Down syndrome features.", "Not this: those are Turner.", "Not this: those are Edwards and cri-du-chat."]}, {"tag": "M6·Q88", "mid": "m06", "difficulty": "hard", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 149", "qc": "How many chromosomes does a person with Down syndrome (47, +21) have, and how many copies of chromosome 21?", "options": ["46 chromosomes, with three copies of chromosome 21", "47 chromosomes, with three copies of chromosome 21", "47 chromosomes, with two copies of chromosome 21", "45 chromosomes, with one copy of chromosome 21"], "correct_index": 1, "explanations": ["Not this: 46 would not include the extra chromosome.", "Correct. 46 plus one extra 21 gives 47 with three copies.", "Not this: two copies of 21 is normal.", "Not this: 45 is Turner syndrome."]}, {"tag": "M6·Q89", "mid": "m06", "difficulty": "devil", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 153", "qc": "Which pairing of syndrome, karyotype and chromosome is correct?", "options": ["Edwards: 47, +13; trisomy 13", "Down: 47, +18; trisomy 18", "Patau: 47, +13; trisomy 13", "Patau: 47, +21; trisomy 21"], "correct_index": 2, "explanations": ["Not this: edwards is 47, +18.", "Not this: down is 47, +21.", "Correct. Patau syndrome is 47, +13.", "Not this: down, not Patau, is +21."]}, {"tag": "M6·Q90", "mid": "m06", "difficulty": "devil", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 149", "qc": "Which statement correctly contrasts Down syndrome and cri-du-chat syndrome?", "options": ["Both are trisomies, each affecting chromosome number 5", "Down is a deletion of part of 21; cri-du-chat is a trisomy of chromosome 5", "Both are deletions affecting part of chromosome number 21", "Down is a trisomy of 21; cri-du-chat is a deletion on chromosome 5"], "correct_index": 3, "explanations": ["Not this: cri-du-chat is a deletion.", "Not this: down is a trisomy.", "Not this: down is not a deletion.", "Correct. One is numerical and the other is structural."]}, {"tag": "M6·Q91", "mid": "m06", "difficulty": "devil", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 153", "qc": "The incidence of Down, Edwards and Patau syndromes is 1 in 700, 1 in 10,000 and 1 in 20,000. Which order matches (most common first)?", "options": ["Down, Edwards, Patau", "Patau, Edwards, Down", "Edwards, Down, Patau", "Down, Patau, Edwards"], "correct_index": 0, "explanations": ["Correct. Smaller denominators mean higher frequency.", "Not this: that reverses the order.", "Not this: down is the most common.", "Not this: edwards is more common than Patau."]}, {"tag": "M6·Q92", "mid": "m06", "difficulty": "devil", "section": "Autosomal syndromes (Down, Patau, Edwards, cri-du-chat)", "qt": "single", "source": "Genetics 4-6, slide 134", "qc": "Cri-du-chat syndrome is caused by a heterozygous deficiency of the short arm of chromosome 5. What does this imply?", "options": ["One homologue has the deletion and the other is normal", "Both homologues carry the deletion of the same segment", "Chromosome 5 is entirely absent from every cell of the body", "An extra copy of chromosome 5 is present in the cell"], "correct_index": 0, "explanations": ["Correct. Heterozygous means one normal and one deleted homologue.", "Not this: that would be homozygous deficiency, usually lethal.", "Not this: only part of the arm is missing.", "Not this: that would be trisomy."]}, {"tag": "M6·Q93", "mid": "m06", "difficulty": "easy", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 161", "qc": "What is the karyotype of Turner syndrome?", "options": ["47, XXY", "45, X", "47, XYY", "47, XXX"], "correct_index": 1, "explanations": ["Not this: 47, XXY is Klinefelter.", "Correct. Turner syndrome has one X and no Y.", "Not this: 47, XYY is Jacobs.", "Not this: 47, XXX is poly-X."]}, {"tag": "M6·Q94", "mid": "m06", "difficulty": "easy", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 166", "qc": "What is the karyotype of Klinefelter syndrome?", "options": ["45, X", "47, XYY", "47, +21", "47, XXY"], "correct_index": 3, "explanations": ["Not this: 45, X is Turner.", "Not this: 47, XYY is Jacobs.", "Not this: 47, +21 is Down.", "Correct. Klinefelter syndrome is XXY."]}, {"tag": "M6·Q95", "mid": "m06", "difficulty": "medium", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 161", "qc": "Turner syndrome is the only known viable form of which condition in humans?", "options": ["Trisomy", "Triploidy", "Monosomy", "Tetraploidy"], "correct_index": 2, "explanations": ["Not this: many trisomies exist.", "Not this: triploidy is not the point here.", "Correct. 45, X is the only viable human monosomy.", "Not this: tetraploidy is not the point here."]}, {"tag": "M6·Q96", "mid": "m06", "difficulty": "medium", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 161", "qc": "About how common is Turner syndrome among live female births?", "options": ["About 1 in 100", "About 1 in 10,000", "About 1 in 700", "About 1 in 20"], "correct_index": 1, "explanations": ["Not this: 1 in 100 is too high.", "Correct. The lecture gives 1 in 10,000.", "Not this: 1 in 700 is Down.", "Not this: 1 in 20 is far too high."]}, {"tag": "M6·Q97", "mid": "m06", "difficulty": "medium", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 165", "qc": "Which features are listed for Turner syndrome?", "options": ["Cleft lip, polydactyly and severe heart defects", "Taller than average, fertile and sexually mature early", "A webbed or broad neck and a shield-like chest", "Eyelid fold, a flat face and short stubby fingers"], "correct_index": 2, "explanations": ["Not this: those are Patau.", "Not this: those are XYY features.", "Correct. Webbed neck and broad chest are listed.", "Not this: those are Down features."]}, {"tag": "M6·Q98", "mid": "m06", "difficulty": "medium", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 166", "qc": "At what frequency are Klinefelter (XXY) males born?", "options": ["About 1.3%", "About 13%", "About 0.0013%", "About 0.13%"], "correct_index": 3, "explanations": ["Not this: 1.3% is ten times too high.", "Not this: 13% is far too high.", "Not this: 0.0013% is far too low.", "Correct. The lecture gives 0.13%."]}, {"tag": "M6·Q99", "mid": "m06", "difficulty": "medium", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 171", "qc": "At what frequency are XYY males born?", "options": ["About 0.15%", "About 1.5%", "About 15%", "About 0.015%"], "correct_index": 0, "explanations": ["Correct. The lecture gives 0.15%.", "Not this: 1.5% is ten times too high.", "Not this: 15% is far too high.", "Not this: 0.015% is ten times too low."]}, {"tag": "M6·Q100", "mid": "m06", "difficulty": "hard", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 162", "qc": "In what proportion of Turner syndrome cases is the X chromosome maternal?", "options": ["About 25%", "About 50%", "About 75%", "About 100%"], "correct_index": 2, "explanations": ["Not this: 25% is the paternal share.", "Not this: 50% is not the value.", "Correct. In 75% of cases the maternal X is present.", "Not this: it is not all cases."]}, {"tag": "M6·Q101", "mid": "m06", "difficulty": "hard", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 162", "qc": "What proportion of 45, X conceptions abort spontaneously?", "options": ["About 10%", "About 50%", "Almost none", "More than 90%"], "correct_index": 3, "explanations": ["Not this: 10% is too low.", "Not this: 50% is too low.", "Not this: most 45, X conceptions abort, so almost none is wrong.", "Correct. The lecture says more than 90%."]}, {"tag": "M6·Q102", "mid": "m06", "difficulty": "hard", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 164", "qc": "Which features describe adults with Turner syndrome?", "options": ["Fertility, taller height and normal secondary sexual development", "Normal life expectancy, sterility and limited sexual development", "Early death in infancy in almost every affected child", "Male external genitalia and a normal male fertility"], "correct_index": 1, "explanations": ["Not this: they are sterile.", "Correct. These features are listed.", "Not this: life expectancy is normal.", "Not this: they are female."]}, {"tag": "M6·Q103", "mid": "m06", "difficulty": "hard", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 167", "qc": "How can nondisjunction in the male produce an XXY zygote?", "options": ["Meiosis I nondisjunction gives an XY sperm that fertilizes an X egg", "An X sperm fertilizes an egg that carries an X and a Y chromosome", "A Y sperm fertilizes an egg that carries only a Y chromosome", "An XX sperm fertilizes an egg that carries a single Y chromosome"], "correct_index": 0, "explanations": ["Correct. An XY sperm plus an X ovum gives XXY.", "Not this: eggs do not carry Y.", "Not this: eggs do not carry Y chromosomes.", "Not this: males do not make XX sperm in this path."]}, {"tag": "M6·Q104", "mid": "m06", "difficulty": "hard", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 168", "qc": "How can nondisjunction in the female produce an XXY zygote?", "options": ["A Y ovum is fertilized by an X sperm", "An XX ovum is fertilized by a normal Y sperm", "An XY ovum is fertilized by an X sperm", "An O ovum is fertilized by an XY sperm"], "correct_index": 1, "explanations": ["Not this: eggs do not carry Y.", "Correct. XX plus Y gives XXY.", "Not this: eggs do not carry XY.", "Not this: that cross would give XY, not XXY."]}, {"tag": "M6·Q105", "mid": "m06", "difficulty": "hard", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 171", "qc": "How can XYY males arise?", "options": ["From nondisjunction of the Y chromatids at meiosis II", "From nondisjunction of the X chromatids in meiosis I", "From nondisjunction of the Y chromosome in mitosis only", "From the loss of one autosome from the early zygote"], "correct_index": 0, "explanations": ["Correct. Y chromatids fail to separate at meiosis II.", "Not this: X chromatids do not produce XYY.", "Not this: the lecture gives meiosis II.", "Not this: autosome loss does not give XYY."]}, {"tag": "M6·Q106", "mid": "m06", "difficulty": "hard", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 171", "qc": "Which features describe XYY males in the lecture?", "options": ["Sterile males with enlarged breasts and reduced testes in adulthood", "Short stature with a webbed neck and a shield-like chest", "Female with no ovaries and little sexual development", "Taller than average, sexually mature early and completely fertile"], "correct_index": 3, "explanations": ["Not this: that describes XXY.", "Not this: that describes Turner.", "Not this: XYY individuals are male.", "Correct. XYY males are tall and fertile."]}, {"tag": "M6·Q107", "mid": "m06", "difficulty": "devil", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 159", "qc": "How does the effect of sex chromosome aneuploidy generally compare with autosomal aneuploidy?", "options": ["It is always more deleterious", "It is always lethal", "It is less deleterious", "It never occurs"], "correct_index": 2, "explanations": ["Not this: it is milder than autosomal aneuploidy.", "Not this: it is not always lethal.", "Correct. Sex chromosome aneuploidy is less harmful.", "Not this: it does occur."]}, {"tag": "M6·Q108", "mid": "m06", "difficulty": "devil", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 170", "qc": "Which statement about Klinefelter males is correct?", "options": ["Males with male genitalia who are sterile and may show feminine traits", "They are fully fertile males and develop no female traits of any kind", "They are females who have ovaries and normal fertility", "They almost always die in infancy or early childhood"], "correct_index": 0, "explanations": ["Correct. The lecture notes male development with sterility and some feminine traits.", "Not this: they are sterile.", "Not this: they are male.", "Not this: they have normal life expectancy."]}, {"tag": "M6·Q109", "mid": "m06", "difficulty": "devil", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 162", "qc": "A Turner syndrome individual may arise if an X sperm fertilizes an ovum with no X. Which parent shows nondisjunction?", "options": ["The father", "Both parents necessarily", "Neither parent", "The mother"], "correct_index": 3, "explanations": ["Not this: the sperm carries a normal X here.", "Not this: only one parent is involved in this case.", "Not this: nondisjunction occurs in one parent.", "Correct. The ovum lacks an X because of maternal nondisjunction."]}, {"tag": "M6·Q110", "mid": "m06", "difficulty": "devil", "section": "Sex chromosome syndromes", "qt": "single", "source": "Genetics 4-6, slide 160", "qc": "Which three sex chromosome conditions are described as comparatively common?", "options": ["XXXX females, XO males and YY males", "XXY females, XYY females and XO males", "XO females, XXY males and XYY males", "XX males, XY females and XXX males"], "correct_index": 2, "explanations": ["Not this: XXXX is very rare.", "Not this: XXY and XYY are male karyotypes.", "Correct. These three are the common ones.", "Not this: these pairings do not match the lecture."]}, {"tag": "M6·Q111", "mid": "m06", "difficulty": "easy", "section": "Amniocentesis and viability of aneuploids", "qt": "single", "source": "Genetics 4-6, slide 151", "qc": "What procedure is used to obtain fetal cells for karyotyping?", "options": ["Mitosis", "Amniocentesis", "Fertilization", "Colchicine therapy"], "correct_index": 1, "explanations": ["Not this: mitosis is cell division.", "Correct. Amniocentesis draws fluid from the amniotic sac.", "Not this: fertilization is not a test.", "Not this: colchicine arrests mitosis in the lab."]}, {"tag": "M6·Q112", "mid": "m06", "difficulty": "medium", "section": "Amniocentesis and viability of aneuploids", "qt": "single", "source": "Genetics 4-6, slide 152", "qc": "From where is the sample drawn in amniocentesis?", "options": ["The placenta only", "The mother's blood only", "The fetal bone", "The amniotic sac"], "correct_index": 3, "explanations": ["Not this: the lecture says amniotic fluid.", "Not this: maternal blood is not the sample.", "Not this: bone is not sampled.", "Correct. A needle draws fluid from the amniotic sac."]}, {"tag": "M6·Q113", "mid": "m06", "difficulty": "medium", "section": "Amniocentesis and viability of aneuploids", "qt": "single", "source": "Genetics 4-6, slide 152", "qc": "About how long are fetal cells cultured before chromosomes are stained and observed?", "options": ["About three hours", "About three days", "About three weeks", "About three months"], "correct_index": 2, "explanations": ["Not this: three hours is too short.", "Not this: three days is too short.", "Correct. The lecture gives about three weeks.", "Not this: three months is too long."]}, {"tag": "M6·Q114", "mid": "m06", "difficulty": "hard", "section": "Amniocentesis and viability of aneuploids", "qt": "single", "source": "Genetics 4-6, slide 152", "qc": "What finding on a karyotype confirms Down syndrome?", "options": ["Two number 21 chromosomes", "Three number 21 chromosomes", "One X chromosome only", "Two number 13 chromosomes"], "correct_index": 1, "explanations": ["Not this: two is normal.", "Correct. Three copies of chromosome 21 confirm Down syndrome.", "Not this: one X is Turner synd
