e (1/2)³, which is the chance of being heterozygous at all three.", "1/16 is the dihybrid chance of two recessive traits.", "1/4 is the chance of one recessive trait only.", "Correct. (1/4) × (1/4) × (1/4) = 1/64."]}, {"tag": "M2·Q38", "mid": "m02", "difficulty": "hard", "section": "Trihybrid cross and forked-line", "qt": "single", "source": "Codex, slide 88", "qc": "What fraction of DdGgWw × DdGgWw offspring have the genotype DdGgWw?", "options": ["1/64", "1/4", "1/8", "27/64"], "correct_index": 2, "explanations": ["1/64 would be the chance of a fully homozygous recessive class.", "1/4 would be the chance for only two heterozygous pairs.", "Correct. Each pair gives 1/2 Dd-type heterozygotes, so (1/2)³ = 1/8.", "27/64 is the share showing all three dominant phenotypes."]}, {"tag": "M2·Q39", "mid": "m02", "difficulty": "hard", "section": "Trihybrid cross and forked-line", "qt": "single", "source": "Codex, slide 82", "qc": "In the testcross DdGgWw × ddggww, how many kinds of gametes does each parent produce?", "options": ["Eight from the F1, one from the recessive", "Four kinds from each of the two parents", "Eight kinds from each of the two parents", "One from the F1 and eight from the recessive parent"], "correct_index": 0, "explanations": ["Correct. The triple heterozygote gives 2³ = 8 gamete types and the full recessive gives only dgw.", "Four would apply to a dihybrid, not a trihybrid.", "The recessive parent is homozygous, so it makes only one kind.", "This reverses the two parents: the F1 makes eight and the recessive makes one."]}, {"tag": "M2·Q40", "mid": "m02", "difficulty": "hard", "section": "Trihybrid cross and forked-line", "qt": "single", "source": "Codex, slide 85-86", "qc": "In DdGgWw × DdGgWw, what fraction of offspring are recessive for D and G but dominant for W?", "options": ["9/64", "1/64", "27/64", "3/64"], "correct_index": 3, "explanations": ["9/64 would be one recessive trait and two dominant.", "1/64 is the all-three-recessive class, not this one.", "27/64 is the share with all three traits dominant.", "Correct. (1/4) × (1/4) × (3/4) = 3/64."]}, {"tag": "M2·Q41", "mid": "m02", "difficulty": "hard", "section": "Trihybrid cross and forked-line", "qt": "single", "source": "Codex, slide 88", "qc": "In DdGgWw × DdGgWw, what fraction of offspring have the genotype DDGgww?", "options": ["1/32", "1/64", "1/16", "3/32"], "correct_index": 0, "explanations": ["Correct. (1/4) × (1/2) × (1/4) = 1/32.", "1/64 would need all three pairs to be homozygous.", "1/16 uses (1/4)² and leaves out the Gg factor.", "3/32 does not follow from the genotype probabilities."]}, {"tag": "M2·Q42", "mid": "m02", "difficulty": "hard", "section": "Trihybrid cross and forked-line", "qt": "single", "source": "Codex, slide 88", "qc": "In DdGgWw × DdGgWw, what fraction of offspring are homozygous at all three loci?", "options": ["1/64", "1/8", "1/4", "3/8"], "correct_index": 1, "explanations": ["1/64 is the chance of one specific homozygous genotype.", "Correct. (1/2) × (1/2) × (1/2) = 1/8, since half of each pair's offspring are homozygous.", "1/4 would apply to only two loci, not all three.", "3/8 is the chance of being heterozygous at exactly one locus."]}, {"tag": "M2·Q43", "mid": "m02", "difficulty": "hard", "section": "Trihybrid cross and forked-line", "qt": "single", "source": "Codex, slide 88", "qc": "Crossing two DdGgWw plants, what proportion of the progeny are heterozygous at exactly one locus?", "options": ["1/8", "1/2", "3/8", "27/64"], "correct_index": 2, "explanations": ["1/8 is one specific locus only.", "1/2 does not follow from the genotype fractions.", "Correct. Three choices of locus × (1/2)³ = 3/8.", "27/64 is the share showing all three dominant traits."]}, {"tag": "M2·Q44", "mid": "m02", "difficulty": "hard", "section": "Trihybrid cross and forked-line", "qt": "single", "source": "Codex, slide 84-86", "qc": "A trihybrid F1 × F1 cross produces 640 F2 plants. How many are expected to be dominant for all three traits?", "options": ["360", "90", "540", "270"], "correct_index": 3, "explanations": ["360 does not match any class fraction here.", "90 is 9/64 of 640, a class with two dominant traits.", "540 would be 27/32 of the plants.", "Correct. 27/64 of 640 is 270."]}, {"tag": "M2·Q45", "mid": "m02", "difficulty": "hard", "section": "Trihybrid cross and forked-line", "qt": "single", "source": "Codex, slide 84-86", "qc": "A trihybrid F1 × F1 cross produces 640 F2 plants. How many are expected to be recessive for all three traits?", "options": ["20", "40", "10", "80"], "correct_index": 2, "explanations": ["20 would be 1/32 of the plants.", "40 would be 1/16 of the plants.", "Correct. 1/64 of 640 is 10.", "80 would be 1/8 of the plants."]}, {"tag": "M2·Q46", "mid": "m02", "difficulty": "hard", "section": "Trihybrid cross and forked-line", "qt": "single", "source": "Codex, slide 84-86", "qc": "In DdGgWw × DdGgWw, what fraction of offspring show exactly two dominant traits?", "options": ["9/64", "27/64", "1/4", "3/8"], "correct_index": 1, "explanations": ["9/64 is just one of the three combinations.", "Correct. Three combinations × (3/4)² × (1/4) = 27/64.", "1/4 does not follow from the trait fractions.", "3/8 is the share heterozygous at exactly one locus."]}, {"tag": "M2·Q47", "mid": "m02", "difficulty": "hard", "section": "Trihybrid cross and forked-line", "qt": "single", "source": "Codex, slide 84", "qc": "Which F2 phenotype class forms the \"27\" part of the 27:9:9:9:3:3:3:1 ratio?", "options": ["Dominant for all three traits", "Recessive for all three traits", "Dominant for exactly one trait", "Dominant for exactly two traits"], "correct_index": 0, "explanations": ["Correct. The largest class shows all three dominant phenotypes.", "The all-recessive class is the single \"1\".", "The one-dominant classes are the \"3\" classes.", "The two-dominant classes are the \"9\" classes."]}, {"tag": "M2·Q48", "mid": "m02", "difficulty": "hard", "section": "Trihybrid cross and forked-line", "qt": "single", "source": "Codex, slide 84", "qc": "In the 27:9:9:9:3:3:3:1 ratio, what are the three \"9\" classes?", "options": ["Dominant for two traits and recessive for one", "Dominant for all three traits, with none recessive", "Dominant for only one trait and recessive for two", "Recessive for all three traits, with none dominant"], "correct_index": 0, "explanations": ["Correct. Each \"9\" class is recessive for one of the three traits only.", "The all-dominant class is the \"27\".", "The classes with one dominant trait are the \"3\" classes.", "The all-recessive class is the \"1\"."]}, {"tag": "M2·Q49", "mid": "m02", "difficulty": "hard", "section": "Trihybrid cross and forked-line", "qt": "single", "source": "Codex, slide 71, 84", "qc": "The F2 ratio 27:9:9:9:3:3:3:1 equals (3:1) raised to which power?", "options": ["2", "6", "3", "8"], "correct_index": 2, "explanations": ["The power 2 gives the dihybrid 9:3:3:1.", "The power 6 does not match the number of independent pairs.", "Correct. Three independent gene pairs each give 3:1, so the combined ratio is (3:1)³.", "8 is the number of classes, not the exponent."]}, {"tag": "M2·Q50", "mid": "m02", "difficulty": "devil", "section": "Trihybrid cross and forked-line", "qt": "single", "source": "Codex, slide 82", "qc": "In the testcross DdGgWw × ddggww, how many phenotypic classes are expected and in what proportions?", "options": ["Eight classes in a 27:9:9:9:3:3:3:1 ratio", "Four classes, each 1/4 of the offspring", "Two classes in a 3:1 ratio of offspring", "Eight classes, each 1/8 of the offspring"], "correct_index": 3, "explanations": ["27:9:9:9:3:3:3:1 is the F1 × F1 ratio.", "Four classes would come from a dihybrid testcross.", "3:1 is a monohybrid F2 ratio.", "Correct. The F1 makes eight gamete types equally and the tester makes one, giving eight equal classes."]}, {"tag": "M2·Q51", "mid": "m02", "difficulty": "devil", "section": "Trihybrid cross and forked-line", "qt": "single", "source": "Codex, slide 82, 84", "qc": "How many gamete types does each DdGgWw parent make, and how many squares does the Punnett square need?", "options": ["4 gamete types; 16 squares", "8 gamete types; 64 squares", "4 gamete types; 64 squares", "8 gamete types; 16 squares"], "correct_index": 1, "explanations": ["Four and 16 would describe a dihybrid cross.", "Correct. Eight gamete types per parent give 8 × 8 = 64 squares.", "Four gamete types would give only 16 squares.", "Eight gamete types per parent give 64 squares, not 16."]}, {"tag": "M2·Q52", "mid": "m02", "difficulty": "devil", "section": "Trihybrid cross and forked-line", "qt": "single", "source": "Codex, slide 85-86", "qc": "In a DdGgWw × DdGgWw cross, what is the probability that an offspring shows the dominant phenotype for traits D and G but the recessive phenotype for trait W?", "options": ["27/64", "3/64", "9/64", "1/64"], "correct_index": 2, "explanations": ["27/64 is the share with all three dominant.", "3/64 is the share with one dominant and two recessive traits.", "Correct. (3/4) × (3/4) × (1/4) = 9/64.", "1/64 is the share with all three recessive."]}, {"tag": "M2·Q53", "mid": "m02", "difficulty": "devil", "section": "Trihybrid cross and forked-line", "qt": "single", "source": "Codex, slide 84-86", "qc": "Among F2 plants that are dominant for all three traits in a DdGgWw × DdGgWw cross, what fraction is DdGgWw?", "options": ["1/8", "27/64", "1/27", "8/27"], "correct_index": 3, "explanations": ["1/8 is the share among all offspring, not only dominant ones.", "27/64 is the share showing all three dominant traits.", "1/27 would be the share that is DDGGWW.", "Correct. Among dominant-trait plants, each pair is Dd with probability 2/3, so (2/3)³ = 8/27."]}, {"tag": "M2·Q54", "mid": "m02", "difficulty": "easy", "section": "Gametes, genotypes and phenotypes", "qt": "single", "source": "Codex, slide 93", "qc": "An individual is heterozygous for n independent gene pairs. How many kinds of gametes can it produce?", "options": ["3ⁿ", "2ⁿ", "2n", "n²"], "correct_index": 1, "explanations": ["3ⁿ is the number of F2 genotypes, not gamete types.", "Correct. Each heterozygous pair doubles the number of gamete types, giving 2ⁿ.", "2n would grow only by steps of two, not by doubling.", "n² does not match the doubling pattern of the lecture's table."]}, {"tag": "M2·Q55", "mid": "m02", "difficulty": "easy", "section": "Gametes, genotypes and phenotypes", "qt": "single", "source": "Codex, slide 93", "qc": "How many different gametes can a plant with the genotype AaBbCc produce?", "options": ["8", "6", "9", "3"], "correct_index": 0, "explanations": ["Correct. Three heterozygous pairs give 2³ = 8 gamete types.", "6 comes from adding 2 + 2 + 2 instead of multiplying.", "9 is not a power of two and does not fit 2ⁿ.", "3 counts the heterozygous pairs, not the gamete types."]}, {"tag": "M2·Q56", "mid": "m02", "difficulty": "easy", "section": "Gametes, genotypes and phenotypes", "qt": "single", "source": "Codex, slide 94", "qc": "With dominance at both genes, how many F2 phenotypes appear in a dihybrid cross?", "options": ["2", "4", "9", "16"], "correct_index": 1, "explanations": ["2 would be the number of phenotypes in a monohybrid cross.", "Correct. The F2 shows four phenotypes in a 9:3:3:1 ratio.", "9 is the number of F2 genotypes, not phenotypes.", "16 is the number of squares in the Punnett square."]}, {"tag": "M2·Q57", "mid": "m02", "difficulty": "medium", "section": "Gametes, genotypes and phenotypes", "qt": "single", "source": "Codex, slide 82", "qc": "How many kinds of gametes can a DdGgWw plant produce?", "options": ["8", "6", "9", "27"], "correct_index": 0, "explanations": ["Correct. Three heterozygous pairs give 2³ = 8 gamete types.", "6 comes from adding 2 + 2 + 2 instead of multiplying.", "9 is not a power of two and does not fit 2ⁿ.", "27 is the number of F2 genotypes (3³), not gamete types."]}, {"tag": "M2·Q58", "mid": "m02", "difficulty": "medium", "section": "Gametes, genotypes and phenotypes", "qt": "single", "source": "Codex, slide 93", "qc": "A plant has the genotype AaBBCCDd. How many different gamete types can it form?", "options": ["8", "16", "2", "4"], "correct_index": 3, "explanations": ["8 would need three heterozygous pairs.", "16 would need four heterozygous pairs.", "2 would need only one heterozygous pair.", "Correct. Only Aa and Dd are heterozygous, so 2² = 4."]}, {"tag": "M2·Q59", "mid": "m02", "difficulty": "medium", "section": "Gametes, genotypes and phenotypes", "qt": "single", "source": "Codex, slide 93-94", "qc": "A plant with genotype AaBbCc is self-fertilized. How many different F2 genotypes are possible?", "options": ["9", "8", "27", "64"], "correct_index": 2, "explanations": ["9 is the number for two heterozygous pairs.", "8 is the number of F2 phenotypes with dominance, not genotypes.", "Correct. Each of three heterozygous pairs gives three genotypes, so 3³ = 27.", "64 is the number of Punnett squares, not genotype classes."]}, {"tag": "M2·Q60", "mid": "m02", "difficulty": "medium", "section": "Gametes, genotypes and phenotypes", "qt": "single", "source": "Codex, slide 93-94", "qc": "A plant with genotype AaBbCc is self-fertilized, with dominance at every gene. How many different F2 phenotypes appear?", "options": ["27", "8", "6", "16"], "correct_index": 1, "explanations": ["27 is the number of genotypes, not phenotypes.", "Correct. Phenotypes number 2ⁿ with dominance, so 2³ = 8.", "6 comes from adding 2 + 2 + 2.", "16 would need four heterozygous pairs."]}, {"tag": "M2·Q61", "mid": "m02", "difficulty": "medium", "section": "Gametes, genotypes and phenotypes", "qt": "single", "source": "Codex, slide 93-94", "qc": "A plant with genotype AaBbCcDd is testcrossed to aabbccdd. How many offspring classes appear, and how are they distributed?", "options": ["16 classes in equal proportions", "8 classes in equal proportions", "16 classes in a 9:3:3:1-based ratio", "81 classes in equal proportions"], "correct_index": 0, "explanations": ["Correct. Four heterozygous pairs give 2⁴ = 16 gamete types, each equally frequent.", "8 classes would arise from three heterozygous pairs.", "A testcross gives equal classes, not a 9:3:3:1-based ratio.", "81 is the number of F2 genotypes, not testcross classes."]}, {"tag": "M2·Q62", "mid": "m02", "difficulty": "hard", "section": "Gametes, genotypes and phenotypes", "qt": "single", "source": "Codex, slide 94", "qc": "A plant heterozygous for four independent gene pairs is self-fertilized. How many F2 genotypes and phenotypes are expected, with dominance at each?", "options": ["16 genotypes and 81 phenotypes", "64 genotypes and 16 phenotypes", "81 genotypes and 81 phenotypes", "81 genotypes and 16 phenotypes"], "correct_index": 3, "explanations": ["This reverses the two values; genotypes are 81 and phenotypes are 16.", "64 is 4³, but genotypes follow 3⁴, which is 81.", "Phenotypes are 2ⁿ with dominance, not 3ⁿ.", "Correct. For n = 4, genotypes are 3⁴ = 81 and phenotypes are 2⁴ = 16."]}, {"tag": "M2·Q63", "mid": "m02", "difficulty": "hard", "section": "Gametes, genotypes and phenotypes", "qt": "single", "source": "Codex, slide 92-94", "qc": "Why does the number of F2 genotypes follow 3ⁿ for n heterozygous gene pairs?", "options": ["Each pair gives two genotypes, and pairs multiply", "Each pair gives three genotypes (1:2:1), and pairs add", "Each pair gives three genotypes (1:2:1), and pairs multiply", "The number of genotypes equals the number of Punnett squares"], "correct_index": 2, "explanations": ["Each pair gives DD, Dd and dd, which is three.", "Independent pairs multiply; adding would not give 3ⁿ.", "Correct. Three genotypes per pair, multiplied across n pairs, gives 3ⁿ.", "The number of squares is 4ⁿ, not the number of genotypes."]}, {"tag": "M2·Q64", "mid": "m02", "difficulty": "hard", "section": "Gametes, genotypes and phenotypes", "qt": "multiple completion", "source": "Codex, slide 93-94", "qc": "For n independent heterozygous gene pairs with dominance, which statements are correct?\n1. The number of gamete types is 2ⁿ.\n2. The number of F2 genotypes is 3ⁿ.\n3. The number of F2 phenotypes is 3ⁿ.", "options": ["1 and 3 only", "2 and 3 only", "1, 2 and 3", "1 and 2 only"], "correct_index": 3, "explanations": ["Not this: statement 3 is false and statement 2 is correct.", "Not this: statement 1 is correct and statement 3 is false.", "Not this: statement 3 is false, because phenotypes are 2ⁿ with dominance.", "Correct. Gametes are 2ⁿ and genotypes are 3ⁿ; phenotypes are 2ⁿ with dominance, not 3ⁿ."]}, {"tag": "M2·Q65", "mid": "m02", "difficulty": "hard", "section": "Gametes, genotypes and phenotypes", "qt": "single", "source": "Codex, slide 94", "qc": "How many genotypes appear in the F2 of a dihybrid cross, and how many of them are homozygous for both genes?", "options": ["9 genotypes; 2 are homozygous for both genes", "9 genotypes; 4 are homozygous for both genes", "4 genotypes; 4 are homozygous for both genes", "16 genotypes; 4 are homozygous for both genes"], "correct_index": 1, "explanations": ["Four, not two, genotypes are homozygous at both genes.", "Correct. The nine genotypes include GGWW, GGww, ggWW and ggww.", "Nine genotypes occur in the F2, not four.", "Sixteen is the number of squares, not genotypes."]}, {"tag": "M2·Q66", "mid": "m02", "difficulty": "hard", "section": "Gametes, genotypes and phenotypes", "qt": "single", "source": "Codex, slide 82, 93", "qc": "A plant of genotype AaBbCc is testcrossed and produces 400 offspring. How many are expected in each phenotypic class?", "options": ["100", "25", "50", "200"], "correct_index": 2, "explanations": ["100 would assume only four classes, but there are eight.", "25 would assume sixteen classes, which needs four pairs.", "Correct. Eight equally frequent classes give 400/8 = 50 each.", "200 would assume only two classes, but there are eight."]}, {"tag": "M2·Q67", "mid": "m02", "difficulty": "devil", "section": "Gametes, genotypes and phenotypes", "qt": "single", "source": "Codex, slide 93-94", "qc": "How many gamete types and F2 genotypes can come from selfing an AaBbCCDd plant, with all gene pairs independent?", "options": ["16 gamete types and 81 F2 genotypes", "8 gamete types and 81 F2 genotypes", "4 gamete types and 27 F2 genotypes", "8 gamete types and 27 F2 genotypes"], "correct_index": 3, "explanations": ["This counts all four pairs as heterozygous, but CC is homozygous.", "8 gametes is right, but 81 genotypes would need four heterozygous pairs.", "27 genotypes is right, but three heterozygous pairs give 8 gametes, not 4.", "Correct. Only three pairs are heterozygous, so gametes are 2³ = 8 and genotypes are 3 × 3 × 1 × 3 = 27."]}, {"tag": "M2·Q68", "mid": "m02", "difficulty": "devil", "section": "Gametes, genotypes and phenotypes", "qt": "single", "source": "Codex, slide 93", "qc": "A plant heterozygous for five independent gene pairs is testcrossed. How many phenotypic classes appear, and how are they distributed?", "options": ["32 classes in equal proportions", "25 classes in equal proportions", "32 classes in a 9:3:3:1-based ratio", "10 classes in equal proportions"], "correct_index": 0, "explanations": ["Correct. 2⁵ gamete types give 32 equally frequent testcross classes.", "25 is 5², which is not the doubling pattern.", "The testcross gives equal classes, not a 9:3:3:1-based ratio.", "10 comes from 2 × 5, not from 2⁵."]}, {"tag": "M2·Q69", "mid": "m02", "difficulty": "devil", "section": "Gametes, genotypes and phenotypes", "qt": "single", "source": "Codex, slide 94", "qc": "A dihybrid F2 has nine genotypes but only four phenotypes with dominance. Why the difference?", "options": ["Five of the genotypes are lost before the plants are counted", "Several genotypes look alike because dominant alleles mask recessives", "Recessive alleles change the phenotype of heterozygotes", "Phenotypes are counted per gamete instead of per plant"], "correct_index": 1, "explanations": ["No genotypes are lost in the F2.", "Correct. For example GGWW, GgWW, GGWw and GgWw all look round and yellow.", "Dominant alleles hide the recessive ones in heterozygotes.", "Phenotypes are counted per plant, not per gamete."]}, {"tag": "M2·Q70", "mid": "m02", "difficulty": "devil", "section": "Gametes, genotypes and phenotypes", "qt": "single", "source": "Codex, slide 93-94", "qc": "A plant of genotype AaBbCcDdEe is self-fertilized. How many gamete types and F2 genotypes are possible?", "options": ["32 gamete types and 81 F2 genotypes", "16 gamete types and 243 F2 genotypes", "32 gamete types and 125 F2 genotypes", "32 gamete types and 243 F2 genotypes"], "correct_index": 3, "explanations": ["81 is 3⁴, which would need four heterozygous pairs.", "16 is 2⁴, which would need four heterozygous pairs.", "125 is 5³, which swaps the base and the exponent.", "Correct. Five heterozygous pairs give 2⁵ = 32 gamete types and 3⁵ = 243 genotypes."]}, {"tag": "M3·Q1", "mid": "m03", "difficulty": "medium", "section": "Chance deviation and assumptions", "qt": "single", "source": "Codex, slide 99-100", "qc": "Which of the following is NOT one of the four assumptions behind Mendel's 3:1 and 9:3:3:1 ratios as listed in the lecture?", "options": ["Dominance and recessiveness of alleles", "Segregation of the paired alleles", "Linkage between the two genes", "Random fertilization of the gametes"], "correct_index": 2, "explanations": ["Dominance and recessiveness is one of the four listed assumptions.", "Segregation is one of the four listed assumptions.", "Correct. The four listed assumptions are dominance, segregation, independent assortment and random fertilization; linkage is not among them.", "Random fertilization is one of the four listed assumptions."]}, {"tag": "M3·Q2", "mid": "m03", "difficulty": "medium", "section": "Chance deviation and assumptions", "qt": "single", "source": "Codex, slide 99-100", "qc": "Which of Mendel's four assumptions is NOT described as influenced by chance events?", "options": ["Dominance and recessiveness", "Segregation", "Independent assortment", "Random fertilization"], "correct_index": 0, "explanations": ["Correct. The lecture says the last three are subject to chance deviation.", "Segregation is influenced by chance, so it is not the answer.", "Independent assortment is influenced by chance.", "Random fertilization is influenced by chance."]}, {"tag": "M3·Q3", "mid": "m03", "difficulty": "medium", "section": "Chance deviation and assumptions", "qt": "single", "source": "Codex, slide 101-103", "qc": "Why does chance deviation matter more when fewer offspring are counted?", "options": ["A small sample changes the genotypes of the parent plants", "A small sample is pulled off the expected ratio more easily by chance", "Small samples cannot show dominance or recessiveness at all", "Chance acts only in large samples, never in small ones"], "correct_index": 1, "explanations": ["Sample size does not change the parents' genotypes.", "Correct. The smaller the sample, the greater the impact of chance deviation.", "Dominance is shown in any sample size.", "Chance acts in all samples, but matters less in large ones."]}, {"tag": "M3·Q4", "mid": "m03", "difficulty": "hard", "section": "Chance deviation and assumptions", "qt": "single", "source": "Codex, slide 101", "qc": "Why can four coin tosses give all heads when 1000 tosses practically cannot?", "options": ["Coins are fair only when they are tossed in large samples", "Large samples remove every chance effect from the results", "Heads become less likely after each earlier heads toss", "The smaller the sample, the greater the impact of chance"], "correct_index": 3, "explanations": ["Coins are fair at any sample size.", "Large samples reduce, but do not remove, chance effects.", "Each toss is independent of earlier tosses.", "Correct. Chance deviation matters far more in small samples."]}, {"tag": "M3·Q5", "mid": "m03", "difficulty": "hard", "section": "Chance deviation and assumptions", "qt": "single", "source": "Codex, slide 101-103", "qc": "Which sample is expected to show the smallest chance deviation from a 3:1 ratio?", "options": ["40 offspring", "400 offspring", "4000 offspring", "4 offspring"], "correct_index": 2, "explanations": ["A sample of 40 is much more affected by chance.", "A sample of 400 is more affected than 4000.", "Correct. The larger the sample, the smaller the impact of chance deviation.", "A sample of 4 is most affected by chance."]}, {"tag": "M3·Q6", "mid": "m03", "difficulty": "devil", "section": "Chance deviation and assumptions", "qt": "single", "source": "Codex, slide 101-103", "qc": "Two experiments are tested against a 3:1 hypothesis. In A, 20 progeny give 12 dominant and 8 recessive. In B, 2000 progeny give 1200 dominant and 800 recessive. Which statement is correct?", "options": ["B has a far larger chi-square: the same split is less likely by chance in a large sample", "Both give the same chi-square, because the percentage split is the same in each", "A has the larger chi-square, because it has fewer offspring in total", "Neither can be tested, because a 3:1 test needs exact counts of offspring"], "correct_index": 0, "explanations": ["Correct. A gives χ² ≈ 2.4 and B gives ≈ 240, because the impact of chance deviation shrinks as the sample grows.", "Chi-square depends on counts, not just proportions, so the values differ.", "A smaller sample tolerates larger deviations, so its chi-square is smaller here.", "Chi-square exists to test observed counts that do not match exactly."]}, {"tag": "M3·Q7", "mid": "m03", "difficulty": "devil", "section": "Chance deviation and assumptions", "qt": "single", "source": "Codex, slide 104-108", "qc": "What question is a chi-square genetic test asking?", "options": ["Whether the difference between observed and expected counts is due to chance", "Whether the offspring were all produced by heterozygous parents", "Whether the parents of the cross were true-breeding pure lines", "Whether the expected counts are correct for every possible sample"], "correct_index": 0, "explanations": ["Correct. The test estimates how often the deviation would occur strictly due to chance.", "Heterozygosity is not what the test examines.", "Parental purity is assumed, not tested.", "The test judges observed counts against a chosen ratio."]}, {"tag": "M3·Q8", "mid": "m03", "difficulty": "easy", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 109", "qc": "In the formula χ² = Σ(o − e)²/e, what does \"o\" stand for?", "options": ["The odds ratio of the two classes", "The observed count for a category", "The original sample size of the cross", "The overall probability of the outcome"], "correct_index": 1, "explanations": ["The odds ratio is not part of this formula.", "Correct. \"o\" is the observed count in each category and \"e\" is the expected count.", "The original sample size is not what o represents.", "The overall probability is not what o represents."]}, {"tag": "M3·Q9", "mid": "m03", "difficulty": "easy", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 104-106", "qc": "Which statistical test is used to judge how well observed genetic data fit an expected ratio?", "options": ["A t-test of two means", "Correlation analysis", "Chi-square analysis", "A Punnett square"], "correct_index": 2, "explanations": ["A t-test compares means, not counts against a ratio.", "Correlation measures association, not fit to a ratio.", "Correct. Chi-square tests goodness of fit between observed and expected counts.", "A Punnett square predicts ratios but is not a statistical test."]}, {"tag": "M3·Q10", "mid": "m03", "difficulty": "medium", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108", "qc": "Which formula is used in chi-square analysis?", "options": ["χ² = Σ(o − e)/e", "χ² = Σ(o + e)²/e", "χ² = Σ(o − e)² × e", "χ² = Σ(o − e)²/e"], "correct_index": 3, "explanations": ["Without squaring, positive and negative deviations would cancel.", "Adding o and e does not measure deviation.", "Multiplying by e instead of dividing reverses the scaling.", "Correct. Each deviation is squared and divided by the expected value, then summed."]}, {"tag": "M3·Q11", "mid": "m03", "difficulty": "medium", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 104-105", "qc": "What does a chi-square goodness-of-fit test tell a geneticist?", "options": ["Which allele of a gene is dominant over the other alleles", "How well observed results fit an expected ratio, allowing for chance", "How many separate genes control the trait being studied", "The exact genotype of each individual offspring in the cross"], "correct_index": 1, "explanations": ["Dominance is found from crosses, not from the chi-square test.", "Correct. Goodness of fit compares observed and expected results to judge whether the difference is acceptable.", "The test does not count genes.", "The test works on counts of classes, not individual genotypes."]}, {"tag": "M3·Q12", "mid": "m03", "difficulty": "medium", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-110", "qc": "In a cross of round and wrinkled pea seeds expected to give 3:1, 400 seeds are counted: 290 round and 110 wrinkled. What is the χ² value?", "options": ["About 200", "About 1.25", "About 0.13", "About 1.33"], "correct_index": 3, "explanations": ["This sums the squared deviations but does not divide by the expected values.", "This divides by the observed values instead of the expected values.", "This leaves out the squaring of each deviation.", "Correct. Expected counts are 300, 100; χ² = 0.33 + 1.00 = 1.33."]}, {"tag": "M3·Q13", "mid": "m03", "difficulty": "medium", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-110", "qc": "A 3:1 ratio is expected for inflated and constricted pods. Among 160 plants, 118 have inflated pods and 42 constricted pods. What is the χ² value?", "options": ["About 0.13", "About 8.00", "About 0.07", "About 0.10"], "correct_index": 0, "explanations": ["Correct. Expected counts are 120, 40; χ² = 0.03 + 0.10 = 0.13.", "This sums the squared deviations but does not divide by the expected values.", "This leaves out the squaring of each deviation.", "This uses equal expected counts instead of the hypothesised ratio."]}, {"tag": "M3·Q14", "mid": "m03", "difficulty": "medium", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-110; general", "qc": "A heterozygote is testcrossed and expected to give 1:1. Among 200 offspring, 112 are of one class and 88 of the other. What is the χ² value?", "options": ["About 288", "About 2.92", "About 2.88", "About 0.24"], "correct_index": 2, "explanations": ["This sums the squared deviations but does not divide by the expected values.", "This divides by the observed values instead of the expected values.", "Correct. Expected counts are 100, 100; χ² = 1.44 + 1.44 = 2.88.", "This leaves out the squaring of each deviation."]}, {"tag": "M3·Q15", "mid": "m03", "difficulty": "medium", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-110; general", "qc": "A testcross is expected to give 1:1. Among 60 offspring, 36 show one phenotype and 24 the other. What is the χ² value?", "options": ["About 72.00", "About 2.40", "About 2.50", "About 0.40"], "correct_index": 1, "explanations": ["This sums the squared deviations but does not divide by the expected values.", "Correct. Expected counts are 30, 30; χ² = 1.20 + 1.20 = 2.40.", "This divides by the observed values instead of the expected values.", "This leaves out the squaring of each deviation."]}, {"tag": "M3·Q16", "mid": "m03", "difficulty": "medium", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 110", "qc": "A 3:1 cross yields 520 offspring. How many recessive offspring are expected?", "options": ["390", "260", "173", "130"], "correct_index": 3, "explanations": ["390 is the expected number of dominant offspring.", "260 would be half of the offspring.", "173 is one third, not one quarter.", "Correct. One quarter of 520 is 130."]}, {"tag": "M3·Q17", "mid": "m03", "difficulty": "medium", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 111", "qc": "An F2 of 800 seeds is tested against 9:3:3:1. How many round, yellow seeds are expected?", "options": ["450", "150", "50", "600"], "correct_index": 0, "explanations": ["Correct. Nine sixteenths of 800 is 450.", "150 is the expected number of a 3/16 class.", "50 is the expected number of the 1/16 class.", "600 is three quarters, not nine sixteenths."]}, {"tag": "M3·Q18", "mid": "m03", "difficulty": "medium", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 110-113; general", "qc": "A cross is expected to give a 1:2:1 ratio and produces 400 offspring. How many heterozygous offspring are expected?", "options": ["100", "300", "200", "133"], "correct_index": 2, "explanations": ["100 is the expected size of each homozygous class.", "300 would combine the heterozygous class with one homozygous class.", "Correct. The middle class is two quarters of 400, or 200.", "133 divides 400 by 3 and ignores the 1:2:1 ratio."]}, {"tag": "M3·Q19", "mid": "m03", "difficulty": "medium", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 76, 108; general", "qc": "A dihybrid testcross is expected to give 1:1:1:1 among 360 offspring. How many are expected in each class?", "options": ["120", "60", "180", "90"], "correct_index": 3, "explanations": ["120 would assume only three classes, but there are four.", "60 would assume six classes, but there are four.", "180 would assume only two classes, but there are four.", "Correct. Four equal classes give 360/4 = 90 each."]}, {"tag": "M3·Q20", "mid": "m03", "difficulty": "medium", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 107-109", "qc": "As observed numbers move further from the expected numbers, what happens to χ²?", "options": ["It increases", "It decreases", "It stays at zero", "It becomes negative"], "correct_index": 0, "explanations": ["Correct. Larger deviations give larger squared deviations and a larger χ².", "Bigger deviations raise χ², they do not lower it.", "χ² is zero only when observed equals expected.", "Squared terms cannot make χ² negative."]}, {"tag": "M3·Q21", "mid": "m03", "difficulty": "medium", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-109", "qc": "What is χ² if every observed count equals its expected count?", "options": ["1", "0", "The total number of offspring", "It cannot be calculated"], "correct_index": 1, "explanations": ["A value of 1 does not arise from zero deviations.", "Correct. Every deviation is zero, so the sum is zero.", "The total number of offspring is not the χ² value.", "It can be calculated and equals zero."]}, {"tag": "M3·Q22", "mid": "m03", "difficulty": "hard", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 110", "qc": "In a 3:1 test with 1000 offspring, the observed counts are 740 dominant and 260 recessive. What is the chi-square contribution of the dominant class?", "options": ["About 0.40", "About 0.53", "About 0.13", "About 1.33"], "correct_index": 2, "explanations": ["0.40 is the contribution of the recessive class.", "0.53 is the total of both classes.", "Correct. Expected is 750, so (740 − 750)²/750 = 100/750 ≈ 0.13.", "1.33 would come from dividing by the wrong expected value."]}, {"tag": "M3·Q23", "mid": "m03", "difficulty": "hard", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 110", "qc": "For the same data (740 dominant, 260 recessive; expected 750 and 250), what is the total chi-square value?", "options": ["About 0.53", "About 0.26", "About 1.06", "About 0.13"], "correct_index": 0, "explanations": ["Correct. 0.13 + 0.40 gives about 0.53.", "0.26 doubles the first class only.", "1.06 doubles the total and does not match the calculated sum.", "0.13 is only the dominant-class contribution."]}, {"tag": "M3·Q24", "mid": "m03", "difficulty": "hard", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-110", "qc": "A cross is expected to give a 3:1 ratio. Among 200 offspring, 152 are dominant and 48 are recessive. What is the chi-square value?", "options": ["About 0.04", "About 1.07", "About 0.11", "About 4.00"], "correct_index": 2, "explanations": ["0.04 uses the expected counts incorrectly.", "1.07 belongs to a different data set.", "Correct. Expected are 150 and 50: 4/150 + 4/50 ≈ 0.03 + 0.08 ≈ 0.11.", "4.00 is the sum of the squared deviations only, without dividing by the expected values."]}, {"tag": "M3·Q25", "mid": "m03", "difficulty": "hard", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 111", "qc": "In the dihybrid example, the four class contributions are 0.71, 0.34, 2.36 and 0.77. What is the total chi-square value?", "options": ["4.81", "3.41", "1.05", "4.18"], "correct_index": 3, "explanations": ["4.81 transposes the digits of the total.", "3.41 leaves out the last class (0.77).", "1.05 includes only the first two classes.", "Correct. 0.71 + 0.34 + 2.36 + 0.77 = 4.18."]}, {"tag": "M3·Q26", "mid": "m03", "difficulty": "hard", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-109; general", "qc": "Why is each deviation (o − e) squared in the chi-square formula?", "options": ["To convert each deviation directly into a probability value", "So positive and negative deviations cannot cancel and big ones weigh more", "Because squaring is needed only when the sample is below 100", "To make the degrees of freedom equal to one in every case"], "correct_index": 1, "explanations": ["Chi-square is converted to P later using a table or graph, not by squaring.", "Correct. Squaring keeps every deviation positive and gives large deviations more weight.", "Squaring is part of the formula for all sample sizes.", "Squaring has no effect on degrees of freedom."]}, {"tag": "M3·Q27", "mid": "m03", "difficulty": "hard", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 111", "qc": "In the dihybrid example (expected 563, 187, 187, 63; observed 583, 195, 166, 56), which class contributes most to the chi-square value?", "options": ["The 9/16 class with 583 observed", "The 3/16 class with 166 observed", "The 3/16 class with 195 observed", "The 1/16 class with 56 observed"], "correct_index": 1, "explanations": ["The 9/16 class contributes only 0.71.", "Correct. That class contributes 2.36, much more than any other.", "The 3/16 class with 195 contributes only 0.34.", "The 1/16 class contributes only 0.77."]}, {"tag": "M3·Q28", "mid": "m03", "difficulty": "hard", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-110", "qc": "A cross of purple- and white-flowered peas is expected to give 3:1. Among 600 offspring, 460 are purple and 140 are white. What is the χ² value?", "options": ["About 200", "About 0.93", "About 0.89", "About 0.09"], "correct_index": 2, "explanations": ["This sums the squared deviations but does not divide by the expected values.", "This divides by the observed values instead of the expected values.", "Correct. Expected counts are 450, 150; χ² = 0.22 + 0.67 = 0.89.", "This leaves out the squaring of each deviation."]}, {"tag": "M3·Q29", "mid": "m03", "difficulty": "hard", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-110", "qc": "A cross of yellow- and green-seeded peas is expected to give 3:1. Of 120 seeds, 87 are yellow and 33 are green. What is the χ² value?", "options": ["About 18.00", "About 0.38", "About 0.13", "About 0.40"], "correct_index": 3, "explanations": ["This sums the squared deviations but does not divide by the expected values.", "This divides by the observed values instead of the expected values.", "This leaves out the squaring of each deviation.", "Correct. Expected counts are 90, 30; χ² = 0.10 + 0.30 = 0.40."]}, {"tag": "M3·Q30", "mid": "m03", "difficulty": "hard", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-110", "qc": "A cross of tall and dwarf peas is expected to give 3:1. Of 800 plants, 640 are tall and 160 are dwarf. What is the χ² value?", "options": ["About 10.67", "About 3200", "About 12.50", "About 0.27"], "correct_index": 0, "explanations": ["Correct. Expected counts are 600, 200; χ² = 2.67 + 8.00 = 10.67.", "This sums the squared deviations but does not divide by the expected values.", "This divides by the observed values instead of the expected values.", "This leaves out the squaring of each deviation."]}, {"tag": "M3·Q31", "mid": "m03", "difficulty": "hard", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-110", "qc": "Axial and terminal flower positions are expected to appear 3:1. Among 500 plants, 366 are axial and 134 are terminal. What is the χ² value?", "options": ["About 162", "About 0.83", "About 0.10", "About 0.86"], "correct_index": 3, "explanations": ["This sums the squared deviations but does not divide by the expected values.", "This divides by the observed values instead of the expected values.", "This leaves out the squaring of each deviation.", "Correct. Expected counts are 375, 125; χ² = 0.22 + 0.65 = 0.86."]}, {"tag": "M3·Q32", "mid": "m03", "difficulty": "hard", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-110", "qc": "A 3:1 ratio is expected for green and yellow pods. Among 300 plants, 208 have green pods and 92 yellow pods. What is the χ² value?", "options": ["About 578", "About 5.14", "About 4.53", "About 0.30"], "correct_index": 1, "explanations": ["This sums the squared deviations but does not divide by the expected values.", "Correct. Expected counts are 225, 75; χ² = 1.28 + 3.85 = 5.14.", "This divides by the observed values instead of the expected values.", "This leaves out the squaring of each deviation."]}, {"tag": "M3·Q33", "mid": "m03", "difficulty": "hard", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 76, 108-110; general", "qc": "A dihybrid testcross is expected to give 1:1:1:1. Among 200 offspring the four classes number 58, 45, 52 and 45. What is the χ² value?", "options": ["About 2.36", "About 118", "About 2.29", "About 0.40"], "correct_index": 0, "explanations": ["Correct. Expected counts are 50, 50, 50, 50; χ² = 1.28 + 0.50 + 0.08 + 0.50 = 2.36.", "This sums the squared deviations but does not divide by the expected values.", "This divides by the observed values instead of the expected values.", "This leaves out the squaring of each deviation."]}, {"tag": "M3·Q34", "mid": "m03", "difficulty": "hard", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 76, 108-110; general", "qc": "A second dihybrid testcross, again expected to give 1:1:1:1, produced 400 offspring in classes of 92, 110, 104 and 94. Calculate χ².", "options": ["About 216", "About 2.14", "About 2.16", "About 0.28"], "correct_index": 2, "explanations": ["This sums the squared deviations but does not divide by the expected values.", "This divides by the observed values instead of the expected values.", "Correct. Expected counts are 100, 100, 100, 100; χ² = 0.64 + 1.00 + 0.16 + 0.36 = 2.16.", "This leaves out the squaring of each deviation."]}, {"tag": "M3·Q35", "mid": "m03", "difficulty": "hard", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 111", "qc": "A dihybrid F2 of 320 plants is tested against 9:3:3:1 (expected 180, 60, 60, 20). The observed numbers are 176, 70, 51 and 23. Which class contributes most to χ²?", "options": ["The 9/16 class (176 observed)", "The first 3/16 class (70 observed)", "The second 3/16 class (51 observed)", "The 1/16 class (23 observed)"], "correct_index": 1, "explanations": ["The 9/16 class contributes only about 0.09.", "Correct. It contributes 100/60 ≈ 1.67, more than any other class.", "The second 3/16 class contributes about 1.35, which is smaller.", "The 1/16 class contributes about 0.45."]}, {"tag": "M3·Q36", "mid": "m03", "difficulty": "hard", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-109; general", "qc": "A student calculates χ² = −2.3 for a 3:1 test. What should the student conclude?", "options": ["The data fit the 3:1 ratio especially well, with a small χ²", "The 3:1 hypothesis must be rejected because χ² is so small", "The degrees of freedom for the test must also be negative", "A mistake was made, since squared deviations cannot give a negative χ²"], "correct_index": 3, "explanations": ["A negative value is not possible, so it says nothing about fit.", "A negative value cannot be used to decide.", "Degrees of freedom do not make χ² negative.", "Correct. Every term is a squared deviation divided by a positive expected value."]}, {"tag": "M3·Q37", "mid": "m03", "difficulty": "hard", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-109", "qc": "Why is each squared deviation divided by its expected value in the formula?", "options": ["To convert each deviation into the degrees of freedom", "To make the total of the terms equal to the sample size", "To scale the deviation to the expected count's size", "To remove the effect of dominance from the deviation"], "correct_index": 2, "explanations": ["Degrees of freedom come from the number of categories.", "The χ² total is not forced to equal the sample size.", "Correct. A deviation of 10 matters more against an expected 50 than against an expected 5000.", "Dominance is not involved in this scaling."]}, {"tag": "M3·Q38", "mid": "m03", "difficulty": "hard", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 112-114", "qc": "According to the lecture, what comes right after calculating the χ² value?", "options": ["Determine the degrees of freedom", "Calculate the expected values again", "Reject the hypothesis", "Count the offspring again"], "correct_index": 0, "explanations": ["Correct. The lecture says first to determine the degrees of freedom, then convert χ² to P.", "Expected values are needed before calculating χ², not after.", "Rejection depends on P, which comes later.", "Counting again is not a step in the analysis."]}, {"tag": "M3·Q39", "mid": "m03", "difficulty": "devil", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 100, 110-113", "qc": "A dihybrid cross of 160 offspring gives 96 : 28 : 26 : 10 for the four phenotypes. Tested against 9:3:3:1, what are the chi-square value and degrees of freedom?", "options": ["About 1.07 with 1 degree of freedom", "About 1.07 with 3 degrees of freedom", "About 56 with 3 degrees of freedom", "About 0.27 with 4 degrees of freedom"], "correct_index": 1, "explanations": ["The value is right, but four categories give 3 degrees of freedom, not 1.", "Correct. Expected counts are 90, 30, 30 and 10, so χ² ≈ 0.40 + 0.13 + 0.53 + 0 ≈ 1.07 with 4 − 1 = 3 degrees of freedom.", "56 is the sum of squared deviations, not divided by the expected values.", "The degrees of freedom would be 3, not 4, and 0.27 is not the value."]}, {"tag": "M3·Q40", "mid": "m03", "difficulty": "devil", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-111", "qc": "Round yellow, round green, wrinkled yellow and wrinkled green seeds number 265, 100, 82 and 33 in an F2 of 480. Tested against 9:3:3:1, what is χ²?", "options": ["About 2.21", "About 198", "About 2.15", "About 0.32"], "correct_index": 0, "explanations": ["Correct. Expected counts are 270, 90, 90, 30; χ² = 0.09 + 1.11 + 0.71 + 0.30 = 2.21.", "This sums the squared deviations but does not divide by the expected values.", "This divides by the observed values instead of the expected values.", "This leaves out the squaring of each deviation."]}, {"tag": "M3·Q41", "mid": "m03", "difficulty": "devil", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-111", "qc": "A pea F2 of 640 plants splits into 350, 135, 115 and 40 across the four phenotype classes. What χ² results against 9:3:3:1?", "options": ["About 350", "About 2.17", "About 2.36", "About 0.19"], "correct_index": 2, "explanations": ["This sums the squared deviations but does not divide by the expected values.", "This divides by the observed values instead of the expected values.", "Correct. Expected counts are 360, 120, 120, 40; χ² = 0.28 + 1.88 + 0.21 + 0.00 = 2.36.", "This leaves out the squaring of each deviation."]}, {"tag": "M3·Q42", "mid": "m03", "difficulty": "devil", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-111", "qc": "In an F2 of 320 plants, the four classes are 186, 55, 58 and 21. Compute χ² for the hypothesis 9:3:3:1.", "options": ["About 66.00", "About 0.76", "About 0.20", "About 0.73"], "correct_index": 3, "explanations": ["This sums the squared deviations but does not divide by the expected values.", "This divides by the observed values instead of the expected values.", "This leaves out the squaring of each deviation.", "Correct. Expected counts are 180, 60, 60, 20; χ² = 0.20 + 0.42 + 0.07 + 0.05 = 0.73."]}, {"tag": "M3·Q43", "mid": "m03", "difficulty": "devil", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 111", "qc": "In a 640-plant F2 tested against 9:3:3:1, the expected classes are 360, 120, 120 and 40, and the observed are 371, 110, 127 and 32. Which class adds most to χ²?", "options": ["The 1/16 class (32 observed)", "The 9/16 class (371 observed)", "The first 3/16 class (110 observed)", "The second 3/16 class (127 observed)"], "correct_index": 0, "explanations": ["Correct. It contributes 64/40 = 1.60, because a small expected count magnifies the deviation.", "The 9/16 class has the largest deviation but contributes only about 0.34.", "The first 3/16 class contributes about 0.83.", "The second 3/16 class contributes about 0.41."]}, {"tag": "M3·Q44", "mid": "m03", "difficulty": "devil", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 108-109; general", "qc": "Every observed and expected count in a test is doubled, keeping the same proportions. What happens to χ²?", "options": ["It stays the same", "It doubles", "It halves", "It becomes zero"], "correct_index": 1, "explanations": ["χ² depends on counts, not only on proportions.", "Correct. Each term (2d)²/(2e) equals twice d²/e.", "The deviations grow, so χ² does not fall.", "The deviations are not zero, so χ² is not zero."]}, {"tag": "M3·Q45", "mid": "m03", "difficulty": "devil", "section": "Chi-square formula and calculation", "qt": "single", "source": "Codex, slide 104-114", "qc": "Which sequence of steps for a chi-square test is correct?", "options": ["Compute χ², state the ratio, find df, find P, find expected counts, decide", "Decide, compute χ², state the ratio, find df, find expected counts, find P", "State the ratio, find expected counts, compute χ², find df, convert to P, decide", "Find P, find expected counts, state the ratio, compute χ², find df, decide"], "correct_index": 2, "explanations": ["χ² cannot be computed before the ratio and expected counts are set.", "The decision cannot come before P is found.", "Correct. Expected counts come from the hypothesised ratio, and the decision comes last.", "P cannot be found before χ² is computed."]}, {"tag": "M3·Q46", "mid": "m03", "difficulty": "easy", "section": "Degrees of freedom", "qt": "single", "source": "Codex, slide 112-113", "qc": "How many degrees of freedom apply to a test of a 3:1 ratio?", "options": ["2", "3", "4", "1"], "correct_index": 3, "explanations": ["2 is the number of categories, not the degrees of freedom.", "3 is the degrees of freedom for 9:3:3:1.", "4 is the number of categories in 9:3:3:1.", "Correct. There are two categories, so df = 2 − 1 = 1."]}, {"tag": "M3·Q47", "mid": "m03", "difficulty": "easy", "section": "Degrees of freedom", "qt": "single", "source": "Codex, slide 112-113; general", "qc": "How many degrees of freedom apply to a test of a 1:2:1 ratio?", "options": ["3", "1", "2", "4"], "correct_index": 2, "explanations": ["3 is the number of categories, not the degrees of freedom.", "1 applies to a two-category ratio such as 3:1.", "Correct. There are three categories, so df = 3 − 1 = 2.", "4 is the sum of the ratio parts, not the degrees of freedom."]}, {"tag": "M3·Q48", "mid": "m03", "difficulty": "medium", "section": "Degrees of freedom", "qt": "single", "source": "Codex, slide 112-113", "qc": "Why is the degrees of freedom 1 for a 3:1 ratio but 3 for a 9:3:3:1 ratio?", "options": ["Degrees of freedom equal the number of offspring minus one", "Degrees of freedom equal the largest number in the ratio", "Degrees of freedom equal the number of genes in the cross", "Degrees of freedom equal the categories minus one: 2 − 1 and 4 − 1"], "correct_index": 3, "explanations": ["Sample size is not used to find degrees of freedom here.", "The largest number in the ratio is 3 for 3:1, which would not give 1.", "A dihybrid has two genes but 3 degrees of freedom, so gene count is not the rule.", "Correct. A 3:1 ratio has two categories and 9:3:3:1 has four."]}, {"tag": "M3·Q49", "mid": "m03", "difficulty": "medium", "section": "Degrees of freedom", "qt": "single", "source": "Codex, slide 112-113; general", "qc": "How many degrees of freedom apply to a test of a 1:1:1:1 ratio?", "options": ["4", "3", "2", "1"], "correct_index": 1, "explanations": ["4 is the number of categories.", "Correct. There are four categories, so df = 4 − 1 = 3.", "2 would apply to three categories.", "1 applies to two categories, but this ratio has four."]}, {"tag": "M3·Q50", "mid": "m03", "difficulty": "hard", "section": "Degrees of freedom", "qt": "single", "source": "Codex, slide 112-113; general", "qc": "A trihybrid F2 is tested against 27:9:9:9:3:3:3:1. How many degrees of freedom apply?", "options": ["7", "8", "6", "63"], "correct_index": 0, "explanations": ["Correct. There are eight categories, so df = 8 − 1 = 7.", "8 is the number of categories.", "6 subtracts one too many from the eight categories.", "63 is one less than the number of Punnett squares, not the categories."]}, {"tag": "M3·Q51", "mid": "m03", "difficulty": "hard", "section": "Degrees of freedom", "qt": "single", "source": "Codex, slide 114", "qc": "Why must degrees of freedom be considered when interpreting χ²?", "options": ["Degrees of freedom change the observed counts in the data", "More categories mean more deviation is expected by chance", "More categories make the test stricter in every case", "Degrees of freedom replace the sample size in the formula"], "correct_index": 1, "explanations": ["Degrees of freedom do not change the data.", "Correct. The lecture says df must always be considered for this reason.", "More categories allow more chance deviation, which is the opposite of stricter.", "Degrees of freedom are separate from sample size."]}, {"tag": "M3·Q52", "mid": "m03", "difficulty": "hard", "section": "Degrees of freedom", "qt": "single", "source": "Codex, slide 112-114; general", "qc": "A 3:1 test and a 9:3:3:1 test both give χ² = 2.4. What is true about their P values?", "options": ["They are identical because χ² is identical", "The 3:1 test has the larger P, since it has fewer categories", "Both are below 0.05", "They differ, because the degrees of freedom differ"], "correct_index": 3, "explanations": ["P depends on both χ² and the degrees of freedom.", "With fewer categories the same χ² gives a smaller P, not a larger one.", "Neither test is below 0.05 at χ² = 2.4.", "Correct. The same χ² corresponds to different P values at 1 and 3 degrees of freedom."]}, {"tag": "M3·Q53", "mid": "m03", "difficulty": "devil", "section": "Degrees of freedom", "qt": "single", "source": "Codex, slide 112-114; general", "qc": "A student tests a 9:3:3:1 hypothesis but uses 1 degree of freedom instead of 3. For the same χ², how does the P value compare with the correct one?", "options": ["It is smaller, risking rejection of a hypothesis that actually fits", "It is larger, so a poorly fitting hypothesis might be accepted", "It is identical, because degrees of freedom do not affect P", "It is exactly zero, whatever the chi-square value is"], "correct_index": 0, "explanations": ["Correct. More categories allow more deviation by chance, so using too few degrees of freedom makes a given χ² look less likely than it is.", "Fewer degrees of freedom make P smaller, not larger.", "The lecture stresses that degrees of freedom must always be considered.", "P is not zero for finite χ²."]}, {"tag": "M3·Q54", "mid": "m03", "difficulty": "easy", "section": "Interpreting the P value", "qt": "single", "source": "Codex, slide 119", "qc": "By convention, what P value is the standard cutoff for acceptable goodness of fit?", "options": ["0.50", "0.10", "0.05", "0.01"], "correct_index": 2, "explanations": ["0.50 is far higher than the convention.", "0.10 is not the conventional cutoff in the lecture.", "Correct. By convention 0.05 is the arbitrary standard.", "0.01 is stricter than the lecture's standard."]}, {"tag": "M3·Q55", "mid": "m03", "difficulty": "easy", "section": "Interpreting the P value", "qt": "single", "source": "Codex, slide 119-122", "qc": "A geneticist tests a 3:1 hypothesis and obtains P = 0.31. What should be decided?", "options": ["Reject: the data do not fit the hypothesised ratio", "Accept: the data are consistent with the ratio", "Reject: a P this high is too large to be acceptable", "Accept: the hypothesis is therefore proven to be true"], "correct_index": 1, "explanations": ["Rejection needs a P below 0.05.", "Correct. A P above 0.05 is acceptable.", "A high P does not make the data unacceptable.", "Acceptance means consistency with the ratio, not proof."]}, {"tag": "M3·Q56", "mid": "m03", "difficulty": "easy", "section": "Interpreting the P value", "qt": "single", "source": "Codex, slide 119-122", "qc": "A 9:3:3:1 test returns P = 0.012. What is the right decision?", "options": ["Accept: the data fit the ratio well", "Accept: P is below 0.05, which is good", "Reject: the data do not fit the ratio", "Reject: P is above 0.05, which is poor"], "correct_index": 2, "explanations": ["A low P signals a poor fit.", "Being below 0.05 is the reason to reject, not accept.", "Correct. A P below 0.05 is unacceptable for goodness of fit.", "0.012 is below 0.05, not above it."]}, {"tag": "M3·Q57", "mid": "m03", "difficulty": "medium", "section": "Interpreting the P value", "qt": "single", "source": "Codex, slide 119-122", "qc": "A 1:1 testcross test yields P = 0.07. What decision follows?", "options": ["Accept: P is above 0.05", "Reject: it is close to the cutoff", "Accept: P is below 0.05", "Reject: the sample was too large"], "correct_index": 0, "explanations": ["Correct. All P values between 0.05 and 1.0 are acceptable.", "Closeness to the cutoff does not change the rule.", "0.07 is above, not below, 0.05.", "Sample size is not the rule for rejection."]}, {"tag": "M3·Q58", "mid": "m03", "difficulty": "hard", "section": "Interpreting the P value", "qt": "single", "source": "Codex, slide 117-118", "qc": "A dihybrid cross test gives P = 0.26. Which interpretation is correct?", "options": ["There is a 74% probability that the hypothesis is true", "26% of the offspring deviated from the expected ratio", "The data are unacceptable because 0.26 is far from 1", "About a 26% chance that a deviation this large arose by chance"], "correct_index": 3, "explanations": ["P does not give the probability that the hypothesis is true.", "P is not the share of offspring that deviated.", "Any P above 0.05 is acceptable, so 0.26 is acceptable.", "Correct. A P of 0.26 means about one chance in four that the deviation is due to chance."]}, {"tag": "M3·Q59", "mid": "m03", "difficulty": "hard", "section": "Interpreting the P value", "qt": "single", "source": "Codex, slide 119-122", "qc": "A chi-square test of a 9:3:3:1 hypothesis gives P = 0.04. What is the correct decision?", "options": ["Reject the hypothesised ratio, because P is below 0.05", "Accept the ratio, because P is close to zero", "Accept the ratio, because the sample is large", "Reject the ratio, because P is above 0.05"], "correct_index": 0, "explanations": ["Correct. A P below 0.05 means the data do not fit the hypothesised ratio.", "A P near zero means the deviation is unlikely to be chance, so the ratio is rejected.", "Sample size does not override the P value rule.", "A P above 0.05 would be acceptable, but this P is below 0.05."]}, {"tag": "M3·Q60", "mid": "m03", "difficulty": "hard", "section": "Interpreting the P value", "qt": "multiple completion", "source": "Codex, slides 119-122", "qc": "Which statements about P values in chi-square analysis are correct?\n1. By convention, 0.05 is the cutoff.\n2. A P value below 0.05 means the data do not fit the hypothesised ratio.\n3. A P value above 0.05 proves the hypothesis is true.", "options": ["1, 2 and 3", "1 and 3 only", "1 and 2 only", "2 and 3 only"], "correct_index": 2, "explanations": ["Not this: statement 3 is false, because an acceptable P means consistency, not proof.", "Not this: statement 2 is correct and statement 3 is false.", "Correct. Statements 1 and 2 match the lecture; an acceptable P shows consistency, not proof.", "Not this: statement 1 is correct and statement 3 is false."]}, {"tag": "M3·Q61", "mid": "m03", "difficulty": "hard", "section": "Interpreting the P value", "qt": "single", "source": "Codex, slide 119-122", "qc": "A chi-square test of a 1:2:1 ratio gives P = 0.049. What is the correct decision?", "options": ["Accept: P is practically 0.05", "Accept: 0.049 rounds to 0.05", "Reject: P must exceed 0.5", "Reject: P is just below 0.05"], "correct_index": 3, "explanations": ["The lecture's rule uses 0.05 as a cutoff, not 'practically' equal.", "Rounding is not used to change the decision.", "The cutoff is 0.05, not 0.5.", "Correct. Any value below 0.05 is unacceptable, even by a small margin."]}, {"tag": "M3·Q62", "mid": "m03", "difficulty": "hard", "section": "Interpreting the P value", "qt": "single", "source": "Codex, slide 119", "qc": "Why does the lecture describe 0.05 as an arbitrary standard?", "options": ["It is derived from the genotype ratio being tested", "It equals the 5% of offspring that always deviate", "It is a convention chosen by investigators, not a natural law", "It is fixed by the number of categories in the test"], "correct_index": 2, "explanations": ["The 0.05 value does not come from the ratio being tested.", "No fixed 5% of offspring always deviates.", "Correct. The decision depends on the investigator's certainty, and 0.05 is a convention.", "It does not change with the number of categories."]}, {"tag": "M3·Q63", "mid": "m03", "difficulty": "hard", "section": "Interpreting the P value", "qt": "single", "source": "Codex, slide 119-120", "qc": "By convention, which range of P values is acceptable for goodness of fit?", "options": ["0 to 0.05", "0.05 to 1.0", "0.5 to 1.0 only", "Exactly 0.05 only"], "correct_index": 1, "explanations": ["Values below 0.05 are unacceptable, not acceptable.", "Correct. All values between 0.05 and 1.0 are considered acceptable.", "The acceptable range begins at 0.05, not 0.5.", "The acceptable range is not a single value."]}, {"tag": "M3·Q64", "mid": "m03", "difficulty": "devil", "section": "Interpreting the P value", "qt": "single", "source": "Codex, slide 119-122", "qc": "What does P = 0.26 allow the geneticist to conclude about a 9:3:3:1 hypothesis?", "options": ["The data are consistent with it but not proven", "The hypothesis is thereby proven to be true", "The hypothesis must therefore be rejected outright", "The sample was too small to carry out the test"], "correct_index": 0, "explanations": ["Correct. A P above 0.05 means consistency, not proof.", "Acceptable P values do not prove a hypothesis.", "0.26 is above 0.05, so it is acceptable.", "Sample size is not the rule for acceptance."]}, {"tag": "M3·Q65", "mid": "m03", "difficulty": "devil", "section": "Interpreting the P value", "qt": "single", "source": "Codex, slide 110, 115; general", "qc": "Experiment 1 gives 740 dominant : 260 recessive against a 3:1 hypothesis (χ² ≈ 0.53). Experiment 2 has ten times the offspring with the same percentage split (7400 : 2600). What happens?", "options": ["χ² stays at about 0.53, so the 3:1 hypothesis is accepted", "χ² falls to about 0.05, so the 3:1 hypothesis is accepted", "χ² rises to about 5.3, yet the 3:1 hypothesis is still accepted", "χ² rises to about 5.3, P falls below 0.05, and the 3:1 ratio is rejected"], "correct_index": 3, "explanations": ["Chi-square depends on counts, so it changes with sample size.", "A larger sample with the same split increases χ², it does not reduce it.", "For one degree of freedom, a χ² of about 5.3 corresponds to P below 0.05.", "Correct. Counts scale by ten, so χ² scales by ten to about 5.3, which is below P = 0.05 for one degree of freedom."]}, {"tag": "M3·Q66", "mid": "m03", "difficulty": "devil", "section": "Interpreting the P value", "qt": "classification", "source": "Codex, slides 119-122", "qc": "Decide whether each result is acceptable for goodness of fit.\n(i) P = 0.60\n(ii) P = 0.03\n(iii) P = 0.12", "options": ["(i) unacceptable; (ii) acceptable; (iii) unacceptable", "(i) acceptable; (ii) acceptable; (iii) unacceptable", "(i) unacceptable; (ii) unacceptable; (iii) acceptable", "(i) acceptable; (ii) unacceptable; (iii) acceptable"], "correct_index": 3, "explanations": ["Not this: it reverses all three decisions.", "Not this: (ii) is below 0.05, so it is unacceptable, and (iii) is above 0.05, so it is acceptable.", "Not this: (i) is above 0.05, so it is acceptable.", "Correct. P = 0.60 and 0.12 are above 0.05 and acceptable; P = 0.03 is below 0.05 and unacceptable."]}, {"tag": "M3·Q67", "mid": "m03", "difficulty": "devil", "section": "Interpreting the P value", "qt": "single", "source": "Codex, slide 119-121", "qc": "A student finds P = 0.48 and says Mendel's ratio is proven. What is wrong with this?", "options": ["P = 0.48 is below the standard, so the ratio must be rejected", "A P that high means the sample was too small to test", "A P above 0.05 shows consistency with the ratio, not proof", "Only P = 1.0 would show that the data are consistent"], "correct_index": 2, "explanations": ["0.48 is above 0.05, so it is acceptable.", "A high P does not mean the sample was too small.", "Correct. The lecture says the data are consistent with the hypothesis, not proven.", "All values from 0.05 to 1.0 are acceptable."]}, {"tag": "M3·Q68", "mid": "m03", "difficulty": "devil", "section": "Interpreting the P value", "qt": "single", "source": "Codex, slide 118", "qc": "Which statement is the lecture's second interpretation of P = 0.26?", "options": ["26% of the offspring are expected to show the dominant trait", "About 26% of repeated trials would show chance deviation this large", "The hypothesis is about 26% likely to be the true one", "The data are only about 26% accurate as measurements"], "correct_index": 1, "explanations": ["P is not the fraction of offspring with a trait.", "Correct. The second interpretation is about repeated experiments showing chance deviation.", "P is not the probability that the hypothesis is true.", "P is not a measure of accuracy."]}, {"tag": "M3·Q69", "mid": "m03", "difficulty": "devil", "section": "Interpreting the P value", "qt": "single", "source": "Codex, slide 121", "qc": "A 9:3:3:1 test gives P = 0.26. What genetic model does the lecture say the data are consistent with?", "options": ["A one-locus model with incomplete dominance", "A three-locus model with no dominance", "A two-locus model with dominance at both", "A model in which the two genes are linked"], "correct_index": 2, "explanations": ["One locus cannot give a four-class 9:3:3:1 ratio.", "Three loci would give a different ratio.", "Correct. The lecture links acceptable 9:3:3:1 data to two loci with dominance at each.", "Linkage would depart from 9:3:3:1, not produce it."]}, {"tag": "M3·Q70", "mid": "m03", "difficulty": "devil", "section": "Interpreting the P value", "qt": "single", "source": "Codex, slide 119-122", "qc": "A researcher gets P = 0.03 and says, \"only a 3% deviation, so the data fit well.\" What is wrong with this?", "options": ["P is not a percentage deviation; below 0.05 is a poor fit", "A P below 0.05 means the data fit especially well", "P = 0.03 would be acceptable when there are many categories", "A 3% deviation always counts as mere chance deviation"], "correct_index": 0, "explanations": ["Correct. P is a probability, and values below 0.05 are unacceptable.", "Values below 0.05 signal a poor fit.", "The cutoff does not change with the number of categories.", "The size of a deviation depends on sample size and expected counts."]}, {"tag": "M4·Q1", "mid": "m04", "difficulty": "easy", "section": "Assumptions and conventions", "qt": "single", "source": "Genetics 4-6, slide 5", "qc": "In the lecture's study of gene interactions, what is assumed about the genes in each cross?", "options": ["They are unlinked and assort independently during gamete formation", "They lie on the same chromosome and are always inherited together as one", "They are all codominant with each other in the heterozygote", "Each one controls a separate and unrelated trait in the cross"], "correct_index": 0, "explanations": ["Correct. The first assumption is that the genes are unlinked and assort independently.", "Not this: linked genes would break the independent assortment assumption.", "Not this: codominance is not the assumption made about the genes.", "Not this: the study is about genes that jointly affect one phenotype."]}, {"tag": "M4·Q2", "mid": "m04", "difficulty": "easy", "section": "Assumptions and conventions", "qt": "single", "source": "Genetics 4-6, slide 6", "qc": "What does the symbol A- mean in a genotype?", "options": ["Only the dominant allele, present in a single copy", "Only the recessive allele, in the homozygous state", "Either allele may be present, so it stands for AA or Aa", "A deleted or missing allele at that particular gene locus"], "correct_index": 2, "explanations": ["Not this: A- includes AA as well as Aa.", "Not this: the recessive allele is written a, not A-.", "Correct. The dash means either allele may be present without consequence.", "Not this: A- does not mean a missing allele."]}, {"tag": "M4·Q3", "mid": "m04", "difficulty": "medium", "section": "Assumptions and conventions", "qt": "single", "source": "Genetics 4-6, slide 7", "qc": "Which crosses are used for the P1 generation in the lecture's examples?", "options": ["Crosses between two double heterozygotes such as AaBb × AaBb", "Crosses between an AABB plant and a heterozygous AaBb plant", "Crosses in which every parent is heterozygous for just one of the two genes", "Crosses between homozygous individuals, such as AABB × aabb or AAbb × aaBB"], "correct_index": 3, "explanations": ["Not this: heterozygote crosses describe the F1 × F1 step, not P1.", "Not this: P1 parents in the lecture are homozygous, not AaBb.", "Not this: the parents are homozygous at both genes.", "Correct. The P1 crosses involve homozygous individuals."]}, {"tag": "M4·Q4", "mid": "m04", "difficulty": "medium", "section": "Assumptions and conventions", "qt": "single", "source": "Genetics 4-6, slide 7", "qc": "What is the F1 genotype when AABB is crossed with aabb?", "options": ["AaBb", "AABB", "aabb", "AaBB"], "correct_index": 0, "explanations": ["Correct. Each parent supplies one allele of each gene, so the F1 is AaBb.", "Not this: AABB is one of the parents.", "Not this: aabb is the other parent.", "Not this: aaBB would need two B alleles in the F1."]}, {"tag": "M4·Q5", "mid": "m04", "difficulty": "hard", "section": "Assumptions and conventions", "qt": "single", "source": "Genetics 4-6, slide 6", "qc": "Why can AA and Aa both be written as A- in these problems?", "options": ["Both genotypes always occur in exactly equal numbers among the progeny", "The recessive allele is completely absent from both genotypes", "Complete dominance makes the two genotypes equivalent in their effect", "Incomplete dominance makes the two genotypes look identical"], "correct_index": 2, "explanations": ["Not this: their frequencies are not what justifies the notation.", "Not this: aa still carries the recessive allele.", "Correct. With complete dominance the two genotypes have the same effect.", "Not this: incomplete dominance would make Aa differ from AA."]}, {"tag": "M4·Q6", "mid": "m04", "difficulty": "hard", "section": "Assumptions and conventions", "qt": "single", "source": "Genetics 4-6, slide 7", "qc": "What are the F1 plants of the cross AAbb × aaBB?", "options": ["Half AAbb and half aaBB", "All AABb", "A 1:1 mixture of Aabb and aaBb", "All AaBb heterozygotes"], "correct_index": 3, "explanations": ["Not this: parental genotypes do not persist in the F1.", "Not this: AABb would need two A alleles.", "Not this: the F1 is uniform, not a 1:1 mixture.", "Correct. Each parent contributes one allele of each gene, giving AaBb."]}, {"tag": "M4·Q7", "mid": "m04", "difficulty": "hard", "section": "Assumptions and conventions", "qt": "single", "source": "Genetics 4-6, slide 8", "qc": "In the lecture's examples, which generation is the main focus of analysis?", "options": ["The P1 generation of homozygous parents", "The F1 generation of heterozygous hybrids", "The F2 produced from the heterozygous F1 parents", "The testcross generation derived from a recessive parent"], "correct_index": 2, "explanations": ["Not this: P1 is only the starting cross.", "Not this: the F1 is uniform, so it shows no ratio.", "Correct. The F2 shows the modified ratios the lecture analyses.", "Not this: the lecture analyses the F2, not a testcross generation."]}, {"tag": "M4·Q8", "mid": "m04", "difficulty": "devil", "section": "Assumptions and conventions", "qt": "single", "source": "Genetics 4-6, slide 10", "qc": "Why do the F2 genotypes of a two-gene cross fall into just four categories in these problems?", "options": ["Dominance groups AA/Aa and BB/Bb as A- and B-, leaving four classes", "Only four gamete types exist in the F1 parent plants", "The two genes are linked on the same chromosome pair", "Epistasis removes five of the nine possible genotypes before the plants are counted"], "correct_index": 0, "explanations": ["Correct. Grouping by dominance gives 9/16, 3/16, 3/16 and 1/16.", "Not this: four gamete types give nine genotypes, not four categories.", "Not this: linkage is excluded by the assumptions.", "Not this: epistasis changes phenotype grouping, not which genotypes exist."]}, {"tag": "M4·Q9", "mid": "m04", "difficulty": "easy", "section": "Epistasis: the basic idea", "qt": "single", "source": "Genetics 4-6, slide 12", "qc": "What is epistasis?", "options": ["Two alleles of one gene both being fully expressed in the heterozygote", "One allele of a gene dominating the other allele at the same locus", "Two genes lying close together on the same chromosome", "A gene masking the expression of a non-allelic gene at another locus"], "correct_index": 3, "explanations": ["Not this: that describes codominance.", "Not this: that describes dominance between alleles.", "Not this: that describes linkage.", "Correct. Epistasis is an interaction between different genes."]}, {"tag": "M4·Q10", "mid": "m04", "difficulty": "medium", "section": "Epistasis: the basic idea", "qt": "single", "source": "Genetics 4-6, slide 13", "qc": "In epistasis, what is the gene that is masked called?", "options": ["The hypostatic gene", "The epistatic gene", "The dominant gene", "The recessive gene"], "correct_index": 0, "explanations": ["Correct. The suppressed gene is hypostatic.", "Not this: the epistatic gene does the masking.", "Not this: dominance concerns alleles of one gene.", "Not this: recessiveness concerns alleles, not the masked gene."]}, {"tag": "M4·Q11", "mid": "m04", "difficulty": "medium", "section": "Epistasis: the basic idea", "qt": "single", "source": "Genetics 4-6, slide 14", "qc": "Which statement correctly separates epistasis from dominance?", "options": ["Epistasis acts between alleles of one gene, while dominance acts between different genes", "They are the same process under two different names", "Dominance needs two loci, whereas epistasis needs only one locus", "Epistasis acts between different genes, dominance between alleles of one gene"], "correct_index": 3, "explanations": ["Not this: this reverses the two definitions.", "Not this: the lecture explicitly warns against confusing them.", "Not this: epistasis needs two loci, dominance needs one.", "Correct. The lecture says epistasis involves non-alleles and dominance involves alleles."]}, {"tag": "M4·Q12", "mid": "m04", "difficulty": "hard", "section": "Epistasis: the basic idea", "qt": "single", "source": "Genetics 4-6, slide 16", "qc": "When epistasis operates between two loci, how many phenotypes appear among offspring of dihybrid parents?", "options": ["Exactly four", "Fewer than four", "More than four", "Exactly nine"], "correct_index": 1, "explanations": ["Not this: four phenotypes is the unmodified 9:3:3:1 case.", "Correct. Epistasis reduces the number of phenotypes below four.", "Not this: epistasis merges classes, so there are not more than four.", "Not this: nine is the number of genotypes."]}, {"tag": "M4·Q13", "mid": "m04", "difficulty": "hard", "section": "Epistasis: the basic idea", "qt": "single", "source": "Genetics 4-6, slide 16", "qc": "How many types of epistatic ratio does the lecture recognise, and how are they divided?", "options": ["Four: two with three phenotypes and two with only two phenotypes", "Six: all of them with three distinct phenotypes each", "Six: three with three phenotypes and three with two phenotypes", "Three: all of them with only two phenotypes each"], "correct_index": 2, "explanations": ["Not this: the lecture names six, not four.", "Not this: not all six have three phenotypes.", "Correct. Six types, half with three phenotypes and half with two.", "Not this: there are six, not three."]}, {"tag": "M4·Q14", "mid": "m04", "difficulty": "hard", "section": "Epistasis: the basic idea", "qt": "single", "source": "Genetics 4-6, slide 15", "qc": "Which is a way epistasis can show up, according to the lecture?", "options": ["Two alleles of one gene blending in the heterozygote", "A whole gene moving to another chromosome in the cell", "The homozygous recessive state of one gene blocking a different gene", "A recessive allele masking its own dominant allele at the same locus"], "correct_index": 2, "explanations": ["Not this: blending of alleles at one gene is not epistasis.", "Not this: movement of a gene is a translocation.", "Correct. A homozygous recessive genotype can block a different gene.", "Not this: masking within one gene is dominance."]}, {"tag": "M4·Q15", "mid": "m04", "difficulty": "hard", "section": "Epistasis: the basic idea", "qt": "single", "source": "Genetics 4-6, slide 13", "qc": "Gene X masks the expression of gene Y. Which statement is correct?", "options": ["Y is epistatic to X, and X is hypostatic to Y", "Both genes are epistatic to each other", "Both genes are hypostatic", "X is epistatic to Y, and Y is hypostatic to X"],
