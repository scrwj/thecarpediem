is completely dominant?", "options": ["w (white)", "we (eosin)", "wa (apricot)", "W (wild type, red)"], "correct_index": 3, "explanations": ["Not this: w is completely recessive.", "Not this: we is intermediate in the series.", "Not this: wa is intermediate in the series.", "Correct. The wild-type allele is completely dominant."]}, {"tag": "M8·Q55", "mid": "m08", "difficulty": "hard", "section": "Allele symbols and dominance hierarchies", "qt": "single", "source": "Module 4-10, slide 63", "qc": "In the Drosophila eye colour series, which allele is completely recessive to all the others?", "options": ["W (wild type)", "w (white)", "wch (cherry)", "wh (honey)"], "correct_index": 1, "explanations": ["Not this: W is dominant.", "Correct. White is recessive to all other alleles in the series.", "Not this: wch is intermediate.", "Not this: wh is intermediate."]}, {"tag": "M8·Q56", "mid": "m08", "difficulty": "hard", "section": "Allele symbols and dominance hierarchies", "qt": "single", "source": "Module 4-10, slide 63", "qc": "What happens to pigment production as you move down the Drosophila eye colour hierarchy toward w?", "options": ["Successively more pigment is produced", "Pigment production stays the same", "Successively less pigment is produced", "Pigment production stops at the first allele"], "correct_index": 2, "explanations": ["Not this: pigment decreases down the series rather than increasing.", "Not this: pigment does not stay the same along the series.", "Correct. Each allele in the series except w produces some pigment, with less down the series.", "Not this: only w produces no pigment."]}, {"tag": "M8·Q57", "mid": "m08", "difficulty": "devil", "section": "Allele symbols and dominance hierarchies", "qt": "single", "source": "Module 4-10, slide 59; general", "qc": "A chinchilla rabbit (cch c) is mated with a chinchilla rabbit (cch c). What phenotypic ratio is expected among the offspring?", "options": ["1 full colour : 1 albino", "1 chinchilla : 1 himalayan", "3 chinchilla : 1 albino", "3 himalayan : 1 albino"], "correct_index": 2, "explanations": ["Not this: this ratio belongs to a different cross.", "Not this: this ratio belongs to a different cross.", "Correct. The four equally likely offspring genotypes give 3 chinchilla : 1 albino.", "Not this: this ratio belongs to a different cross."]}, {"tag": "M8·Q58", "mid": "m08", "difficulty": "devil", "section": "Allele symbols and dominance hierarchies", "qt": "single", "source": "Module 4-10, slide 59; general", "qc": "A full-colour rabbit (c ch) is mated with a himalayan rabbit (ch ch). What phenotypic ratio is expected among the offspring?", "options": ["1 full colour : 1 albino", "1 chinchilla : 1 himalayan", "3 himalayan : 1 albino", "1 full colour : 1 himalayan"], "correct_index": 3, "explanations": ["Not this: this ratio belongs to a different cross.", "Not this: this ratio belongs to a different cross.", "Not this: this ratio belongs to a different cross.", "Correct. The four equally likely offspring genotypes give 1 full colour : 1 himalayan."]}, {"tag": "M8·Q59", "mid": "m08", "difficulty": "devil", "section": "Allele symbols and dominance hierarchies", "qt": "single", "source": "Module 4-10, slide 59; general", "qc": "A chinchilla rabbit (cch ch) is mated with a chinchilla rabbit (cch ch). What phenotypic ratio is expected among the offspring?", "options": ["3 chinchilla : 1 himalayan", "1 full colour : 1 albino", "1 chinchilla : 1 himalayan", "3 himalayan : 1 albino"], "correct_index": 0, "explanations": ["Correct. The four equally likely offspring genotypes give 3 chinchilla : 1 himalayan.", "Not this: this ratio belongs to a different cross.", "Not this: this ratio belongs to a different cross.", "Not this: this ratio belongs to a different cross."]}, {"tag": "M8·Q60", "mid": "m08", "difficulty": "devil", "section": "Allele symbols and dominance hierarchies", "qt": "single", "source": "Module 4-10, slide 56", "qc": "How should symbols be assigned for multiple alleles, according to the lecture?", "options": ["A lower case letter for every allele, whatever its place in the dominance series", "Capital for the top allele, lower case for the bottom, superscripts in between", "The same symbol with no superscripts for all of the alleles", "Numbers only, with no letters in any of the allele symbols"], "correct_index": 1, "explanations": ["Not this: capitals mark the top of the hierarchy.", "Correct. Intermediate alleles take lower case letters with suitable superscripts.", "Not this: different alleles need different symbols.", "Not this: letters are used."]}, {"tag": "M8·Q61", "mid": "m08", "difficulty": "easy", "section": "ABO system: genotypes, antigens and antibodies", "qt": "single", "source": "Module 4-10, slide 66", "qc": "Which three alleles are common at the ABO locus?", "options": ["IA, IB and IO", "A, B and AB", "IA, IB and IAB", "IO, IA and AB"], "correct_index": 0, "explanations": ["Correct. The common ABO alleles are IA, IB and IO.", "Not this: A, B and AB are phenotypes.", "Not this: IAB is not an allele.", "Not this: AB is a phenotype."]}, {"tag": "M8·Q62", "mid": "m08", "difficulty": "easy", "section": "ABO system: genotypes, antigens and antibodies", "qt": "single", "source": "Module 4-10, slide 67", "qc": "Which ABO allele is recessive?", "options": ["IA", "IB", "None of them", "IO"], "correct_index": 3, "explanations": ["Not this: IA is codominant with IB.", "Not this: IB is codominant with IA.", "Not this: IO is recessive.", "Correct. IO is the recessive allele in the ABO system."]}, {"tag": "M8·Q63", "mid": "m08", "difficulty": "medium", "section": "ABO system: genotypes, antigens and antibodies", "qt": "single", "source": "Module 4-10, slide 67", "qc": "What antigens are on the red blood cells of an IAIB individual?", "options": ["Only A antigen", "Both A and B antigens", "Only B antigen", "No ABO antigens"], "correct_index": 1, "explanations": ["Not this: B is also expressed.", "Correct. IA and IB are codominant.", "Not this: A is also expressed.", "Not this: they carry both."]}, {"tag": "M8·Q64", "mid": "m08", "difficulty": "medium", "section": "ABO system: genotypes, antigens and antibodies", "qt": "single", "source": "Module 4-10, slide 67", "qc": "What do the red blood cells of an IOIO individual carry?", "options": ["Both A and B antigens", "Only A antigen", "No ABO antigens", "Only B antigen"], "correct_index": 2, "explanations": ["Not this: both are absent.", "Not this: A is absent.", "Correct. IOIO homozygotes have no ABO antigens.", "Not this: B is absent."]}, {"tag": "M8·Q65", "mid": "m08", "difficulty": "medium", "section": "ABO system: genotypes, antigens and antibodies", "qt": "single", "source": "Module 4-10, slide 72", "qc": "What antibodies are present in the serum of a person of blood group B?", "options": ["Anti-A", "Anti-B", "Anti-A and anti-B", "None"], "correct_index": 0, "explanations": ["Correct. Group B has anti-A.", "Not this: anti-B would attack its own cells.", "Not this: anti-A and anti-B belong to group O.", "Not this: none belongs to group AB."]}, {"tag": "M8·Q66", "mid": "m08", "difficulty": "hard", "section": "ABO system: genotypes, antigens and antibodies", "qt": "single", "source": "Module 4-10, slide 66", "qc": "How many genotypes and how many phenotypes does the ABO system with three alleles have?", "options": ["3 genotypes and 3 phenotypes", "6 genotypes and 4 phenotypes", "4 genotypes and 6 phenotypes", "6 genotypes and 6 phenotypes"], "correct_index": 1, "explanations": ["Not this: three alleles give six genotypes.", "Correct. Three alleles give 6 genotypes and the phenotypes are A, B, AB and O.", "Not this: there are six genotypes and four phenotypes.", "Not this: four phenotypes, not six."]}, {"tag": "M8·Q67", "mid": "m08", "difficulty": "hard", "section": "ABO system: genotypes, antigens and antibodies", "qt": "single", "source": "Module 4-10, slide 68", "qc": "How does the lecture define an antigen?", "options": ["A protein that is made by lymphocytes in response to a foreign substance", "A sugar that is found only on the surface of red cells", "A foreign substance that stimulates cells to make specific antibodies", "A chromosome segment that carries the ABO gene locus"], "correct_index": 2, "explanations": ["Not this: that describes an antibody.", "Not this: antigens may be proteins or polysaccharides.", "Correct. An antigen triggers antibody production.", "Not this: the ABO locus is a gene region."]}, {"tag": "M8·Q68", "mid": "m08", "difficulty": "hard", "section": "ABO system: genotypes, antigens and antibodies", "qt": "single", "source": "Module 4-10, slide 68", "qc": "How does the lecture define an antibody?", "options": ["A sugar found on the surface of the red blood cell", "A foreign substance that stimulates cells to make specific antibodies", "A gene on chromosome 9 that controls the ABO antigens", "An immunoglobulin made by lymphocytes in response to an antigen"], "correct_index": 3, "explanations": ["Not this: sugars are antigens.", "Not this: A foreign substance is an antigen.", "Not this: an antibody is a protein.", "Correct. Antibodies are immunoglobulin proteins made by lymphocytes."]}, {"tag": "M8·Q69", "mid": "m08", "difficulty": "hard", "section": "ABO system: genotypes, antigens and antibodies", "qt": "single", "source": "Module 4-10, slide 69", "qc": "What does the ABO locus control on the surface of red blood cells?", "options": ["The number of chromosomes present in the red blood cell", "The overall shape and size of the red blood cell itself", "The type of glycolipid, through the glycosyltransferases", "The colour of the haemoglobin inside the red blood cell"], "correct_index": 2, "explanations": ["Not this: chromosome number is not controlled.", "Not this: shape is not described.", "Correct. The glycolipids provide antigenic determinants.", "Not this: haemoglobin colour is not described."]}, {"tag": "M8·Q70", "mid": "m08", "difficulty": "hard", "section": "ABO system: genotypes, antigens and antibodies", "qt": "single", "source": "Module 4-10, slide 70", "qc": "Why do normal individuals not make antibodies against their own ABO antigens?", "options": ["They have no antigens on any of their own red blood cells whatsoever", "They have no lymphocytes that could make antibodies at all", "Their antibodies are destroyed in the liver as they form", "No antibodies are made that react with the individual's own cells"], "correct_index": 3, "explanations": ["Not this: they do have antigens unless group O.", "Not this: lymphocytes are present.", "Not this: the lecture states they are not synthesized.", "Correct. Self-reactive antibodies are not made."]}, {"tag": "M8·Q71", "mid": "m08", "difficulty": "devil", "section": "ABO system: genotypes, antigens and antibodies", "qt": "single", "source": "Module 4-10, slide 72", "qc": "Which blood group has no anti-A or anti-B antibodies in its serum?", "options": ["AB", "O", "A", "B"], "correct_index": 0, "explanations": ["Correct. Group AB lacks both antibodies.", "Not this: group O has both antibodies.", "Not this: group A has anti-B.", "Not this: group B has anti-A."]}, {"tag": "M8·Q72", "mid": "m08", "difficulty": "devil", "section": "ABO system: genotypes, antigens and antibodies", "qt": "single", "source": "Module 4-10, slide 72", "qc": "Which blood group carries both anti-A and anti-B antibodies?", "options": ["AB", "O", "A", "B"], "correct_index": 1, "explanations": ["Not this: group AB has none.", "Correct. Group O has both antibodies.", "Not this: group A has anti-B only.", "Not this: group B has anti-A only."]}, {"tag": "M8·Q73", "mid": "m08", "difficulty": "devil", "section": "ABO system: genotypes, antigens and antibodies", "qt": "single", "source": "Module 4-10, slide 72", "qc": "What are the terminal sugars of blood groups A and B?", "options": ["A has galactose; B has galactosamine", "A: galactosamine; B: galactose", "Both: galactose", "Both: galactosamine"], "correct_index": 1, "explanations": ["Not this: this reverses them.", "Correct. A has galactosamine and B has galactose.", "Not this: A differs from B.", "Not this: A differs from B."]}, {"tag": "M8·Q74", "mid": "m08", "difficulty": "devil", "section": "ABO system: genotypes, antigens and antibodies", "qt": "single", "source": "Module 4-10, slide 67", "qc": "A person has the genotype IAIO. What are the phenotype and antigen?", "options": ["Group O, with no antigen", "Group AB, with both antigens", "Group B, with B antigen", "Group A, with A antigen"], "correct_index": 3, "explanations": ["Not this: group O requires IOIO.", "Not this: group AB requires IAIB.", "Not this: group B requires an IB allele.", "Correct. IA is expressed and IO is recessive."]}, {"tag": "M8·Q75", "mid": "m08", "difficulty": "easy", "section": "Blood transfusion and compatibility", "qt": "single", "source": "Module 4-10, slide 77", "qc": "Which ABO blood group is called the universal donor?", "options": ["A", "B", "O", "AB"], "correct_index": 2, "explanations": ["Not this: A cells carry A.", "Not this: B cells carry B.", "Correct. Group O cells have no A or B antigens.", "Not this: AB cells carry both."]}, {"tag": "M8·Q76", "mid": "m08", "difficulty": "medium", "section": "Blood transfusion and compatibility", "qt": "single", "source": "Module 4-10, slide 72", "qc": "Which red cell groups can a person of blood group A accept?", "options": ["A or O", "B or O", "A or B", "AB only"], "correct_index": 0, "explanations": ["Correct. Group A can receive A or O.", "Not this: group B can accept B or O.", "Not this: B cells would be attacked by anti-B.", "Not this: AB cells would be attacked."]}, {"tag": "M8·Q77", "mid": "m08", "difficulty": "medium", "section": "Blood transfusion and compatibility", "qt": "single", "source": "Module 4-10, slide 72", "qc": "Which red cell groups can a person of blood group B accept?", "options": ["A or O", "B or O", "A or B", "AB only"], "correct_index": 1, "explanations": ["Not this: that is for group A.", "Correct. Group B can receive B or O.", "Not this: A cells would be attacked by anti-A.", "Not this: AB cells would be attacked."]}, {"tag": "M8·Q78", "mid": "m08", "difficulty": "medium", "section": "Blood transfusion and compatibility", "qt": "single", "source": "Module 4-10, slide 72", "qc": "Which red cell groups can a person of blood group AB accept?", "options": ["A, B, AB and O", "AB only", "O only", "A and B only"], "correct_index": 0, "explanations": ["Correct. Group AB has no antibodies.", "Not this: AB can receive more than AB.", "Not this: AB can receive more than O.", "Not this: AB can also receive AB and O."]}, {"tag": "M8·Q79", "mid": "m08", "difficulty": "hard", "section": "Blood transfusion and compatibility", "qt": "single", "source": "Module 4-10, slide 77", "qc": "Why can type O blood be used for any recipient only if introduced slowly?", "options": ["So that the antigens on the donor red cells are fully destroyed", "So that the recipient can make enough new blood in time", "So that anti-A and anti-B in the donor serum are diluted", "So that the donor blood can cool to body temperature"], "correct_index": 2, "explanations": ["Not this: O has no antigens to destroy.", "Not this: recipients do not make blood in that way.", "Correct. Slow introduction dilutes the donor's antibodies.", "Not this: temperature is not the issue."]}, {"tag": "M8·Q80", "mid": "m08", "difficulty": "hard", "section": "Blood transfusion and compatibility", "qt": "single", "source": "Module 4-10, slide 72", "qc": "Which red cell group can a person of blood group O accept?", "options": ["A or O", "B or O", "A, B and O", "O only"], "correct_index": 3, "explanations": ["Not this: A cells would be attacked.", "Not this: B cells would be attacked.", "Not this: A and B cells would be attacked.", "Correct. Group O has anti-A and anti-B."]}, {"tag": "M8·Q81", "mid": "m08", "difficulty": "hard", "section": "Blood transfusion and compatibility", "qt": "single", "source": "Module 4-10, slide 73", "qc": "What happens when blood of types A and B are mixed?", "options": ["The cells burst at once, releasing their haemoglobin", "Nothing happens at all, because the two blood groups are compatible", "The red cells fuse together to make new AB cells", "Antibodies in each serum attack the other's cells, causing clumping"], "correct_index": 3, "explanations": ["Not this: clumping, not bursting.", "Not this: A reaction does occur when the bloods mix.", "Not this: they do not fuse.", "Correct. Anti-A and anti-B cause clumping."]}, {"tag": "M8·Q82", "mid": "m08", "difficulty": "hard", "section": "Blood transfusion and compatibility", "qt": "single", "source": "Module 4-10, slide 76", "qc": "Why can group AB persons accept blood of any ABO group?", "options": ["They have no anti-A or anti-B antibodies in their serum", "They have all of the possible antibodies in their serum plasma", "They have no antigens on any of their red blood cells", "They have no red cells in their circulating blood"], "correct_index": 0, "explanations": ["Correct. AB serum lacks both antibodies.", "Not this: they have none.", "Not this: AB carries both antigens.", "Not this: they have red cells."]}, {"tag": "M8·Q83", "mid": "m08", "difficulty": "devil", "section": "Blood transfusion and compatibility", "qt": "single", "source": "Module 4-10, slide 73", "qc": "Why is it harmful to give group B blood to a group A recipient?", "options": ["The donor's anti-A antibodies would attack nothing in the recipient's blood", "The recipient has no antibodies in the serum at all", "The recipient's anti-B antibodies agglutinate the donor's B cells", "The donor's cells become group O after the transfusion"], "correct_index": 2, "explanations": ["Not this: donor serum is diluted anyway.", "Not this: group A has anti-B.", "Correct. Anti-B in group A serum attacks B cells.", "Not this: cells do not change type."]}, {"tag": "M8·Q84", "mid": "m08", "difficulty": "devil", "section": "Blood transfusion and compatibility", "qt": "single", "source": "Module 4-10, slide 77", "qc": "Why is group AB not the universal donor?", "options": ["It has no red cells that could safely be transfused", "Its cells carry A and B antigens that many recipients would attack", "It carries both the anti-A and the anti-B antibodies in its serum plasma", "It is simply the rarest blood group in every population"], "correct_index": 1, "explanations": ["Not this: it has red cells.", "Correct. A and B antigens can be targeted.", "Not this: AB has no antibodies.", "Not this: rarity is not the reason."]}, {"tag": "M8·Q85", "mid": "m08", "difficulty": "easy", "section": "ABO inheritance and paternity", "qt": "single", "source": "Module 4-10, slide 66", "qc": "Which genotypes can a person of blood group A have?", "options": ["IBIB or IBIO", "IAIB only", "IAIA or IAIO", "IOIO only"], "correct_index": 2, "explanations": ["Not this: those are group B.", "Not this: IAIB is group AB.", "Correct. A is IAIA or IAIO.", "Not this: IOIO is group O."]}, {"tag": "M8·Q86", "mid": "m08", "difficulty": "medium", "section": "ABO inheritance and paternity", "qt": "single", "source": "Module 4-10, slide 79", "qc": "A parent of group AB (heterozygous where possible) mates with a parent of group O. Which phenotypes can appear among their children?", "options": ["A and O", "B and O", "A, B, AB and O", "A and B only"], "correct_index": 3, "explanations": ["Not this: this set belongs to a different mating.", "Not this: this set belongs to a different mating.", "Not this: this set belongs to a different mating.", "Correct. The possible children are A and B only."]}, {"tag": "M8·Q87", "mid": "m08", "difficulty": "medium", "section": "ABO inheritance and paternity", "qt": "single", "source": "Module 4-10, slide 79", "qc": "A parent of group A (heterozygous where possible) mates with a parent of group O. Which phenotypes can appear among their children?", "options": ["A and O", "B and O", "A, B, AB and O", "A, B and AB"], "correct_index": 0, "explanations": ["Correct. The possible children are A and O.", "Not this: this set belongs to a different mating.", "Not this: this set belongs to a different mating.", "Not this: this set belongs to a different mating."]}, {"tag": "M8·Q88", "mid": "m08", "difficulty": "medium", "section": "ABO inheritance and paternity", "qt": "single", "source": "Module 4-10, slide 79", "qc": "A parent of group B (heterozygous where possible) mates with a parent of group B. Which phenotypes can appear among their children?", "options": ["A and O", "B and O", "A, B, AB and O", "A, B and AB"], "correct_index": 1, "explanations": ["Not this: this set belongs to a different mating.", "Correct. The possible children are B and O.", "Not this: this set belongs to a different mating.", "Not this: this set belongs to a different mating."]}, {"tag": "M8·Q89", "mid": "m08", "difficulty": "medium", "section": "ABO inheritance and paternity", "qt": "single", "source": "Module 4-10, slide 79", "qc": "A parent of group O (heterozygous where possible) mates with a parent of group O. Which phenotypes can appear among their children?", "options": ["A and O", "O only", "B and O", "A, B, AB and O"], "correct_index": 1, "explanations": ["Not this: this set belongs to a different mating.", "Correct. The possible children are O only.", "Not this: this set belongs to a different mating.", "Not this: this set belongs to a different mating."]}, {"tag": "M8·Q90", "mid": "m08", "difficulty": "hard", "section": "ABO inheritance and paternity", "qt": "single", "source": "Module 4-10, slide 81", "qc": "Which mating can produce children of all four ABO phenotypes?", "options": ["Two heterozygous parents, one group A and one group B", "Two parents who are both of blood group AB", "One group O parent and one group AB parent together", "Two parents who are both heterozygous and both of blood group A"], "correct_index": 0, "explanations": ["Correct. IAIO × IBIO can give A, B, AB and O.", "Not this: AB × AB cannot give O.", "Not this: AB × O gives only A and B.", "Not this: A × A gives only A and O."]}, {"tag": "M8·Q91", "mid": "m08", "difficulty": "hard", "section": "ABO inheritance and paternity", "qt": "single", "source": "Module 4-10, slide 79", "qc": "What fraction of the children of IAIO × IBIO are group AB?", "options": ["One half", "Three quarters", "One quarter", "None"], "correct_index": 2, "explanations": ["Not this: that would be a larger share.", "Not this: that would be too large.", "Correct. IAIB is one of four equally likely genotypes.", "Not this: AB is possible."]}, {"tag": "M8·Q92", "mid": "m08", "difficulty": "hard", "section": "ABO inheritance and paternity", "qt": "single", "source": "Module 4-10, slide 83", "qc": "A woman of group A has a child of group O. The alleged father is group AB. Can ABO typing exclude him?", "options": ["No, because group A mothers can have group O children with any man", "No, because ABO typing cannot exclude anyone", "Yes, because AB men cannot have children", "Yes, because an AB man has no IO allele to give an O child"], "correct_index": 3, "explanations": ["Not this: the mother is IAIO, but the father still lacks IO.", "Not this: typing can exclude a man.", "Not this: AB men can father children with other genotypes.", "Correct. An O child needs IO from each parent."]}, {"tag": "M8·Q93", "mid": "m08", "difficulty": "hard", "section": "ABO inheritance and paternity", "qt": "single", "source": "Module 4-10, slide 80", "qc": "A woman of group B has a child of group AB. The alleged father is group O. Can ABO typing exclude him?", "options": ["No, because a group B mother can also supply the IA allele to the child", "Yes, because AB children can never have group B mothers", "Yes: an AB child needs IA from the father, and an O man lacks it", "No, because O men are universal fathers of every child"], "correct_index": 2, "explanations": ["Not this: group B mothers cannot supply IA.", "Not this: AB children can have group B mothers.", "Correct. The IA allele must come from the father.", "Not this: O men lack IA and IB."]}, {"tag": "M8·Q94", "mid": "m08", "difficulty": "hard", "section": "ABO inheritance and paternity", "qt": "single", "source": "Module 4-10, slide 80", "qc": "What can blood typing tell us about disputed parentage?", "options": ["It can exclude a man as the father but cannot prove he is the father", "It can always prove exactly which man is the real father of a given child", "It can never help in any case of disputed parentage", "It can tell only the age of the mother and the child"], "correct_index": 0, "explanations": ["Correct. A matching type fits many men.", "Not this: many men share a group.", "Not this: it can exclude some men.", "Not this: age is not determined."]}, {"tag": "M8·Q95", "mid": "m08", "difficulty": "devil", "section": "ABO inheritance and paternity", "qt": "single", "source": "Module 4-10, slide 81", "qc": "Two group A parents have a group O child. What are the genotypes of the parents?", "options": ["Both IAIA", "One IAIA and one IAIO", "One IAIO and one IOIO", "Both IAIO"], "correct_index": 3, "explanations": ["Not this: IAIA cannot give IO.", "Not this: IAIA cannot give IO.", "Not this: IOIO is group O, not A.", "Correct. Each parent must give an IO allele."]}, {"tag": "M8·Q96", "mid": "m08", "difficulty": "devil", "section": "ABO inheritance and paternity", "qt": "single", "source": "Module 4-10, slide 78", "qc": "Two group O parents have a child. Which blood group can the child have?", "options": ["A", "Only O", "B", "AB"], "correct_index": 1, "explanations": ["Not this: no parent carries IA.", "Correct. Both parents give IO.", "Not this: no parent carries IB.", "Not this: no parent carries IA or IB."]}, {"tag": "M8·Q97", "mid": "m08", "difficulty": "devil", "section": "ABO inheritance and paternity", "qt": "single", "source": "Module 4-10, slide 79", "qc": "A group A parent and a group B parent have a group O child. What are their genotypes?", "options": ["IAIA and IBIB", "IAIO and IBIO", "IAIO and IBIB", "IAIA and IBIO"], "correct_index": 1, "explanations": ["Not this: neither carries IO.", "Correct. Both parents must carry IO.", "Not this: the B parent lacks IO.", "Not this: the A parent lacks IO."]}, {"tag": "M9·Q1", "mid": "m09", "difficulty": "easy", "section": "Pedigree conventions and symbols", "qt": "single", "source": "Module 4-10, slide 88", "qc": "What is a pedigree?", "options": ["A diagram of the phases of the cell cycle in a single dividing cell", "A chart listing only the blood groups of a family", "A map of the positions of genes on the chromosomes", "A diagram of family relationships and the passing of a trait"], "correct_index": 3, "explanations": ["Not this: the cell cycle is a different diagram.", "Not this: pedigrees cover many traits, not only blood groups.", "Not this: A chromosome map shows genes on a chromosome.", "Correct. A pedigree traces a trait through family generations."]}, {"tag": "M9·Q2", "mid": "m09", "difficulty": "easy", "section": "Pedigree conventions and symbols", "qt": "single", "source": "Module 4-10, slide 91", "qc": "In a pedigree, what do circles and squares represent?", "options": ["Circles are females and squares are males", "Circles are males and squares are females", "Both of the symbols represent female individuals", "Both of the symbols represent individuals of unknown sex"], "correct_index": 0, "explanations": ["Correct. Circles are females and squares are males.", "Not this: this reverses them.", "Not this: squares represent males.", "Not this: unknown sex uses a diamond."]}, {"tag": "M9·Q3", "mid": "m09", "difficulty": "medium", "section": "Pedigree conventions and symbols", "qt": "single", "source": "Module 4-10, slide 91", "qc": "Which symbol is used for an individual whose sex is unknown?", "options": ["A triangle", "A filled circle", "A diamond", "A double line"], "correct_index": 2, "explanations": ["Not this: A triangle is not the convention here.", "Not this: A filled circle is an affected female.", "Correct. A diamond marks unknown sex.", "Not this: A double line is not a person symbol."]}, {"tag": "M9·Q4", "mid": "m09", "difficulty": "medium", "section": "Pedigree conventions and symbols", "qt": "single", "source": "Module 4-10, slide 92", "qc": "How are the generations of a pedigree labelled?", "options": ["With Roman numerals, one row per generation", "With Arabic numerals, one column per generation", "With letters of the alphabet along a single row", "With colours only, using one colour per generation"], "correct_index": 0, "explanations": ["Correct. Each generation is on its own row with a Roman numeral.", "Not this: arabic numerals label siblings.", "Not this: generations are rows.", "Not this: colours show phenotypes."]}, {"tag": "M9·Q5", "mid": "m09", "difficulty": "medium", "section": "Pedigree conventions and symbols", "qt": "single", "source": "Module 4-10, slide 91", "qc": "How are siblings labelled and arranged in a pedigree?", "options": ["From right to left by age, using capital letters for each sibling", "From left to right by birth order, with Arabic numerals", "In random order, using Roman numerals for each sibling", "In a single vertical line, with no labels at all"], "correct_index": 1, "explanations": ["Not this: the order is left to right.", "Correct. Siblings are numbered 1, 2, 3 and so on, left to right.", "Not this: the order follows birth.", "Not this: siblings are labelled."]}, {"tag": "M9·Q6", "mid": "m09", "difficulty": "hard", "section": "Pedigree conventions and symbols", "qt": "single", "source": "Module 4-10, slide 93", "qc": "What is the individual whose phenotype first attracted attention called?", "options": ["The founder, the first known ancestor in the family line", "The twin sibling of the affected family member", "The proband (propositus if male, proposita if female)", "The carrier who passes the allele to the child"], "correct_index": 2, "explanations": ["Not this: A founder starts the family record.", "Not this: twins are shown by diagonal lines.", "Correct. An arrow points to the proband.", "Not this: A carrier is a heterozygote."]}, {"tag": "M9·Q7", "mid": "m09", "difficulty": "hard", "section": "Pedigree conventions and symbols", "qt": "single", "source": "Module 4-10, slide 92", "qc": "How are twins shown in a pedigree?", "options": ["By two squares joined together by a short horizontal line", "By a double circle drawn around the one symbol", "By shading both of the symbols with a dark colour", "By connected diagonal lines from the parents' line"], "correct_index": 3, "explanations": ["Not this: squares are males.", "Not this: A double circle is not the convention.", "Not this: shading shows phenotype.", "Correct. Twins are indicated by connected diagonal lines."]}, {"tag": "M9·Q8", "mid": "m09", "difficulty": "hard", "section": "Pedigree conventions and symbols", "qt": "single", "source": "Module 4-10, slide 91", "qc": "How are the two parents joined in a pedigree?", "options": ["By a diagonal line, with a vertical line leading down to the offspring", "By a dotted circle drawn around the two parents together", "They are not joined by any line in the diagram at all", "By a horizontal line, with a vertical line leading to their offspring"], "correct_index": 3, "explanations": ["Not this: diagonal lines are for twins.", "Not this: A dotted circle is not the convention.", "Not this: parents are joined.", "Correct. A horizontal line joins the parents."]}, {"tag": "M9·Q9", "mid": "m09", "difficulty": "devil", "section": "Pedigree conventions and symbols", "qt": "single", "source": "Module 4-10, slide 92", "qc": "What do the different shades or colours added to pedigree symbols represent?", "options": ["Different generations", "Different sexes", "Different phenotypes", "Different ages"], "correct_index": 2, "explanations": ["Not this: generations are rows.", "Not this: sex is shown by the symbol shape.", "Correct. Shading marks affected and unaffected phenotypes.", "Not this: age is not shown."]}, {"tag": "M9·Q10", "mid": "m09", "difficulty": "devil", "section": "Pedigree conventions and symbols", "qt": "single", "source": "Module 4-10, slide 89", "qc": "Why is pedigree analysis used in human genetics?", "options": ["Humans have no genes that could be traced in families", "Experimental matings are not possible in humans", "Humans have only one generation that can be studied", "Humans cannot inherit traits from either of their parents"], "correct_index": 1, "explanations": ["Not this: humans have genes.", "Correct. Pedigrees substitute for breeding studies.", "Not this: humans have many generations.", "Not this: humans do inherit traits."]}, {"tag": "M9·Q11", "mid": "m09", "difficulty": "easy", "section": "Patterns of inheritance in pedigrees", "qt": "single", "source": "Module 4-10, slide 87", "qc": "Which of these is an example of an autosomal dominant disease in the lecture's table?", "options": ["Huntington's disease", "Cystic fibrosis", "Albinism", "Sickle cell disease"], "correct_index": 0, "explanations": ["Correct. Huntington's disease is autosomal dominant.", "Not this: cystic fibrosis is autosomal recessive.", "Not this: albinism is autosomal recessive.", "Not this: sickle cell disease is autosomal recessive."]}, {"tag": "M9·Q12", "mid": "m09", "difficulty": "medium", "section": "Patterns of inheritance in pedigrees", "qt": "single", "source": "Module 4-10, slide 87", "qc": "Which pattern is typical of an autosomal recessive disease?", "options": ["It never skips a generation in the family tree of affected people", "All of the daughters of an affected father are always affected", "It can skip generations, and unaffected parents can have affected children", "It never occurs in females and appears only in the males"], "correct_index": 2, "explanations": ["Not this: that describes dominant inheritance.", "Not this: that describes X-linked dominant inheritance.", "Correct. Carriers hide the trait.", "Not this: it occurs in both sexes."]}, {"tag": "M9·Q13", "mid": "m09", "difficulty": "medium", "section": "Patterns of inheritance in pedigrees", "qt": "single", "source": "Module 4-10, slide 87", "qc": "Which of these is an example of an autosomal recessive disease in the lecture's table?", "options": ["Cystic fibrosis", "Huntington's disease", "Marfan syndrome", "Achondroplasia"], "correct_index": 0, "explanations": ["Correct. Cystic fibrosis is autosomal recessive.", "Not this: huntington's disease is dominant.", "Not this: marfan syndrome is dominant.", "Not this: achondroplasia is dominant."]}, {"tag": "M9·Q14", "mid": "m09", "difficulty": "medium", "section": "Patterns of inheritance in pedigrees", "qt": "single", "source": "Module 4-10, slide 87", "qc": "Which of these is an example of an X-linked dominant disease in the lecture's table?", "options": ["Sickle cell disease", "Cystic fibrosis", "Albinism", "Rett syndrome"], "correct_index": 3, "explanations": ["Not this: sickle cell disease is autosomal recessive.", "Not this: cystic fibrosis is autosomal recessive.", "Not this: albinism is autosomal recessive.", "Correct. Rett syndrome is listed under X-linked dominant disease."]}, {"tag": "M9·Q15", "mid": "m09", "difficulty": "hard", "section": "Patterns of inheritance in pedigrees", "qt": "single", "source": "Module 4-10, slide 87", "qc": "What happens to daughters of an affected father in X-linked dominant inheritance?", "options": ["None of the daughters will be affected", "All of the daughters will be affected", "Half of the daughters will be affected", "Only the sons will be affected"], "correct_index": 1, "explanations": ["Not this: they inherit his X.", "Correct. The father passes his X to every daughter.", "Not this: they inherit his X, so all are affected.", "Not this: sons get the Y."]}, {"tag": "M9·Q16", "mid": "m09", "difficulty": "hard", "section": "Patterns of inheritance in pedigrees", "qt": "single", "source": "Module 4-10, slide 87", "qc": "Which statement is true of X-linked dominant disease?", "options": ["It always passes from father to son", "The disease regularly skips whole generations", "The disease occurs only in male individuals", "The disease never passes from father to son"], "correct_index": 3, "explanations": ["Not this: sons get the Y.", "Not this: X-linked dominant disease does not skip generations.", "Not this: it occurs in both sexes.", "Correct. Sons receive the Y from their father."]}, {"tag": "M9·Q17", "mid": "m09", "difficulty": "hard", "section": "Patterns of inheritance in pedigrees", "qt": "single", "source": "Module 4-10, slide 87", "qc": "Why can unaffected parents have an affected child in an autosomal recessive disease?", "options": ["The child inherits the disease from the environment alone, not genes", "The parents are both homozygous dominant at that gene locus", "Both parents can be carriers who each pass on the recessive allele", "The disease is always caused by a brand new mutation in the child"], "correct_index": 2, "explanations": ["Not this: genotype, not only environment, matters.", "Not this: homozygous dominant parents cannot.", "Correct. Carrier parents can have an aa child.", "Not this: mutation is not required."]}, {"tag": "M9·Q18", "mid": "m09", "difficulty": "hard", "section": "Patterns of inheritance in pedigrees", "qt": "single", "source": "Module 4-10, slide 87", "qc": "Why does an autosomal dominant disease not skip generations?", "options": ["The allele is carried only on the Y chromosome of male individuals", "Any individual carrying the dominant allele shows the disease", "Carriers stay hidden and unaffected in every generation", "Only the mother ever passes it on to her own children"], "correct_index": 1, "explanations": ["Not this: it is autosomal.", "Correct. A single dominant allele is expressed.", "Not this: hidden carriers describe recessive disease.", "Not this: either parent can pass it on."]}, {"tag": "M9·Q19", "mid": "m09", "difficulty": "hard", "section": "Patterns of inheritance in pedigrees", "qt": "single", "source": "Module 4-10, slide 87", "qc": "In which pattern can males not pass the disease to their sons?", "options": ["X-linked inheritance", "Autosomal dominant inheritance", "Autosomal recessive inheritance", "Codominant inheritance"], "correct_index": 0, "explanations": ["Correct. A father gives his Y to sons.", "Not this: autosomal traits can pass father to son.", "Not this: autosomal traits can pass father to son.", "Not this: codominance is not an inheritance pattern of this kind."]}, {"tag": "M9·Q20", "mid": "m09", "difficulty": "devil", "section": "Patterns of inheritance in pedigrees", "qt": "single", "source": "Module 4-10, slide 87", "qc": "A trait passes from an affected father to all of his daughters and to none of his sons. Which pattern fits?", "options": ["X-linked dominant", "Autosomal recessive", "Y-linked", "Autosomal dominant"], "correct_index": 0, "explanations": ["Correct. The father's X goes to all daughters and his Y to sons.", "Not this: autosomal recessive does not need this pattern.", "Not this: Y-linked traits pass to sons.", "Not this: autosomal traits pass to both sexes."]}, {"tag": "M9·Q21", "mid": "m09", "difficulty": "devil", "section": "Patterns of inheritance in pedigrees", "qt": "single", "source": "Module 4-10, slide 87", "qc": "Two unaffected parents have an affected child. Which two patterns are consistent with this?", "options": ["Both autosomal dominant and X-linked dominant", "Only the X-linked dominant pattern of inheritance", "Only the autosomal dominant pattern of inheritance", "Autosomal recessive and X-linked recessive"], "correct_index": 3, "explanations": ["Not this: dominant traits are expressed in carriers.", "Not this: A dominant trait would show in a parent.", "Not this: A dominant trait would show in a parent.", "Correct. Carrier parents can have affected children."]}, {"tag": "M9·Q22", "mid": "m09", "difficulty": "devil", "section": "Patterns of inheritance in pedigrees", "qt": "single", "source": "Module 4-10, slide 87", "qc": "Which feature most strongly suggests an autosomal recessive pattern in a pedigree?", "options": ["Every single generation has some affected individuals in the family", "All of the daughters of affected men are also affected", "Affected individuals appear to be children of unaffected parents", "No daughters are ever affected in any of the families"], "correct_index": 2, "explanations": ["Not this: that fits dominant inheritance.", "Not this: that fits X-linked dominant inheritance.", "Correct. Unaffected carriers can have affected children.", "Not this: that fits an X-linked recessive or Y-linked pattern."]}, {"tag": "M9·Q23", "mid": "m09", "difficulty": "easy", "section": "Analyzing the albinism pedigree", "qt": "single", "source": "Module 4-10, slide 95", "qc": "How is albinism inherited, according to the lecture's pedigree?", "options": ["As a dominant trait", "As a recessive trait", "As an X-linked dominant trait", "As a Y-linked trait"], "correct_index": 1, "explanations": ["Not this: A dominant trait would show differently.", "Correct. The pedigree shows a recessive pattern.", "Not this: the lecture treats it as autosomal recessive.", "Not this: it is not Y-linked."]}, {"tag": "M9·Q24", "mid": "m09", "difficulty": "medium", "section": "Analyzing the albinism pedigree", "qt": "single", "source": "Module 4-10, slide 96", "qc": "Parents I-2 and I-4 are affected, but none of their offspring is affected. What does this suggest about parents I-1 and I-3?", "options": ["They were probably homozygous normal", "They were probably heterozygous carriers", "They were probably affected like their partners", "They were carriers of two recessive alleles"], "correct_index": 0, "explanations": ["Correct. If they were heterozygous, half the offspring would be affected.", "Not this: heterozygous parents would give affected children.", "Not this: they are unaffected.", "Not this: two alleles would make them affected."]}, {"tag": "M9·Q25", "mid": "m09", "difficulty": "medium", "section": "Analyzing the albinism pedigree", "qt": "single", "source": "Module 4-10, slide 98", "qc": "What is characteristic of a recessive trait in the second generation of this pedigree?", "options": ["Half are affected", "It is unaffected", "All are affected", "Only males are affected"], "correct_index": 1, "explanations": ["Not this: half affected would suggest dominance.", "Correct. An unaffected second generation is characteristic of a recessive trait.", "Not this: all affected would suggest dominance.", "Not this: sex is not the point."]}, {"tag": "M9·Q26", "mid": "m09", "difficulty": "hard", "section": "Analyzing the albinism pedigree", "qt": "single", "source": "Module 4-10, slide 98", "qc": "If albinism were dominant, what would be expected among the second-generation offspring of the affected I-2 and I-4?", "options": ["None would be affected", "All would be affected", "Only males would be affected", "About half would be affected"], "correct_index": 3, "explanations": ["Not this: none are affected in the recessive case.", "Not this: all would require homozygous parents.", "Not this: sex is not the point.", "Correct. A dominant allele in the affected parent would be passed to half."]}, {"tag": "M9·Q27", "mid": "m09", "difficulty": "hard", "section": "Analyzing the albinism pedigree", "qt": "single", "source": "Module 4-10, slide 99", "qc": "Parents II-3 and II-4 are heterozygous. About what fraction of their offspring should be affected?", "options": ["One half", "Three quarters", "One quarter", "None"], "correct_index": 2, "explanations": ["Not this: one half would be a testcross.", "Not this: three quarters are unaffected.", "Correct. Aa × Aa gives 1/4 aa.", "Not this: some are affected."]}, {"tag": "M9·Q28", "mid": "m09", "difficulty": "hard", "section": "Analyzing the albinism pedigree", "qt": "single", "source": "Module 4-10, slide 99", "qc": "II-3 and II-4 are both heterozygous, and two of their six offspring are affected. How does this compare with the expected fraction?", "options": ["It is exactly 1/2, which is exactly double the expected value of 1/4", "It is near the 1/4 expected, since two of six is about one third", "It is zero, so no child is expected to be affected", "It disproves the whole recessive pattern of inheritance"], "correct_index": 1, "explanations": ["Not this: two of six is not one half.", "Correct. Two of six is close to the expected quarter given a small sample.", "Not this: two are affected.", "Not this: small samples vary by chance."]}, {"tag": "M9·Q29", "mid": "m09", "difficulty": "hard", "section": "Analyzing the albinism pedigree", "qt": "single", "source": "Module 4-10, slide 100", "qc": "II-7 is heterozygous and II-8 is homozygous normal. What is expected among their offspring?", "options": ["Half will be affected", "All will be affected", "One quarter will be affected", "None will be affected"], "correct_index": 3, "explanations": ["Not this: half would need two carriers.", "Not this: all would need two affected parents.", "Not this: A quarter needs two carriers.", "Correct. A homozygous normal parent gives only A alleles."]}, {"tag": "M9·Q30", "mid": "m09", "difficulty": "devil", "section": "Analyzing the albinism pedigree", "qt": "single", "source": "Module 4-10, slide 101", "qc": "Why can a normal-looking child of two carriers not be given a definite genotype?", "options": ["The child has no genes at all for the trait in question", "All such children are definitely carriers, so no probabilities are needed", "Aa and AA children look identical, so only probabilities can be given", "All such children are definitely homozygous recessive"], "correct_index": 2, "explanations": ["Not this: the child has the genes; they simply are not expressed.", "Not this: some are AA, so not all are carriers.", "Correct. Normal phenotype does not distinguish AA from Aa.", "Not this: homozygous recessive children would be affected."]}, {"tag": "M9·Q31", "mid": "m09", "difficulty": "devil", "section": "Analyzing the albinism pedigree", "qt": "single", "source": "Module 4-10, slide 96", "qc": "In the albinism pedigree, why can individuals I-1 and I-3 be assigned the genotype AA only as an assumption?", "options": ["Normal phenotype fits Aa, but no affected children suggest AA", "Because they are affected by the trait themselves in the pedigree", "Because they carry two recessive alleles for the trait", "Because they are the proband of the whole family pedigree"], "correct_index": 0, "explanations": ["Correct. Phenotype alone cannot prove AA, but the evidence points to it.", "Not this: they are normal, not affected.", "Not this: two recessive alleles would make them affected.", "Not this: the proband is a different individual."]}, {"tag": "M9·Q32", "mid": "m09", "difficulty": "easy", "section": "Inferring genotypes and the marrying-in assumption", "qt": "single", "source": "Module 4-10, slide 106", "qc": "What is assumed about individuals who marry into the family unless there is evidence otherwise?", "options": ["They are all heterozygous carriers of the recessive gene of the family", "They are homozygous dominant and carry no recessive gene", "They are all affected by the trait in the same way", "They are all closely related to the family they marry into"], "correct_index": 1, "explanations": ["Not this: no evidence of carrying is the default.", "Correct. This is the marrying-in assumption.", "Not this: they are not assumed affected.", "Not this: they are unrelated."]}, {"tag": "M9·Q33", "mid": "m09", "difficulty": "medium", "section": "Inferring genotypes and the marrying-in assumption", "qt": "single", "source": "Module 4-10, slide 107", "qc": "A woman (II-3) shows the recessive trait. What is her genotype?", "options": ["aa", "AA", "Aa", "aA only"], "correct_index": 0, "explanations": ["Correct. A recessive trait appears only in the homozygous recessive.", "Not this: AA would not show it.", "Not this: aa would not show it.", "Not this: aA is Aa."]}, {"tag": "M9·Q34", "mid": "m09", "difficulty": "hard", "section": "Inferring genotypes and the marrying-in assumption", "qt": "single", "source": "Module 4-10, slide 107", "qc": "II-3 is aa and her parents I-1 and I-2 are unaffected. What are their genotypes?", "options": ["Both AA", "One AA and one aa", "Both heterozygous, Aa", "Both aa"], "correct_index": 2, "explanations": ["Not this: AA could not give a.", "Not this: an aa parent would be affected.", "Correct. Each parent gave an a allele but is unaffected.", "Not this: aa parents would be affected."]}, {"tag": "M9·Q35", "mid": "m09", "difficulty": "hard", "section": "Inferring genotypes and the marrying-in assumption", "qt": "single", "source": "Module 4-10, slide 109", "qc": "Siblings II-1 and II-6 are unaffected children of two heterozygous parents. What can be said about their genotypes?", "options": ["Each is aa, since both of the parents are known carriers of the gene", "Each is definitely AA, since the parents are normal", "Each is definitely Aa, since the parents are carriers", "Each is AA or Aa, and the carrier probability must be estimated"], "correct_index": 3, "explanations": ["Not this: aa individuals would be affected.", "Not this: AA is only one possibility.", "Not this: aa is only one possibility.", "Correct. They cannot be aa, but AA and Aa cannot be told apart."]}, {"tag": "M9·Q36", "mid": "m09", "difficulty": "devil", "section": "Inferring genotypes and the marrying-in assumption", "qt": "single", "source": "Module 4-10, slide 106", "qc": "Why does the marrying-in assumption simplify pedigree probability?", "options": ["Spouses are treated as AA, so only the family carries the allele", "It makes every unrelated spouse a carrier of the allele", "It removes the need for any calculation of the probabilities at all", "It makes the trait dominant in every family generation"], "correct_index": 0, "explanations": ["Correct. Spouses are taken as non-carriers unless shown otherwise.", "Not this: the assumption is that they are not carriers.", "Not this: calculation is still needed.", "Not this: dominance is unchanged."]}, {"tag": "M9·Q37", "mid": "m09", "difficulty": "devil", "section": "Inferring genotypes and the marrying-in assumption", "qt": "single", "source": "Module 4-10, slide 103", "qc": "If no expression has occurred in the history of a family, what is used as the basis of probability?", "options": ["The age of the proband when the trait was first seen by a doctor", "An estimate of the gene's frequency in the general population", "The number of children born to the affected couple", "The month of birth of the proband and the siblings"], "correct_index": 1, "explanations": ["Not this: age is irrelevant.", "Correct. The population frequency of the allele is used.", "Not this: child number is irrelevant.", "Not this: birth month is irrelevant."]}, {"tag": "M9·Q38", "mid": "m09", "difficulty": "medium", "section": "The three steps and the product rule", "qt": "single", "source": "Module 4-10, slide 105", "qc": "How many basic steps does the lecture list for pedigree probability?", "options": ["Two", "Four", "Three", "Five"], "correct_index": 2, "explanations": ["Not this: two steps would omit the child.", "Not this: the lecture lists three.", "Correct. There are three basic steps.", "Not this: the lecture lists three."]}, {"tag": "M9·Q39", "mid": "m09", "difficulty": "medium", "section": "The three steps and the product rule", "qt": "single", "source": "Module 4-10, slide 105", "qc": "What do you do with the separate probabilities in pedigree analysis?", "options": ["Add them together to get the chance a child is affected", "Subtract them one from the other to get the chance a child is affected", "Ignore them and rely on the sex of the child instead", "Multiply them to get the chance a child expresses the trait"], "correct_index": 3, "explanations": ["Not this: independent events multiply.", "Not this: independent events multiply.", "Not this: the separate probabilities do matter and are used.", "Correct. The product of the probabilities is the chance."]}, {"tag": "M9·Q40", "mid": "m09", "difficulty": "hard", "section": "The three steps and the product rule", "qt": "single", "source": "Module 4-10, slide 105", "qc": "Each parent is a carrier (Aa) of a recessive trait. What is the chance a child will express it?", "options": ["1/2", "3/4", "1/8", "1/4"], "correct_index": 3, "explanations": ["Not this: 1/2 would be a testcross.", "Not this: 3/4 is the unaffected share.", "Not this: 1/8 is too small.", "Correct. 1 × 1 × 1/4 = 1/4."]}, {"tag": "M9·Q41", "mid": "m09", "difficulty": "hard", "section": "The three steps and the product rule", "qt": "single", "source": "Module 4-10, slide 110", "qc": "A parent has a 2/3 chance of being a carrier and the other parent is a known carrier. What is the chance a child is affected?", "options": ["1/4", "1/3", "1/6", "1/12"], "correct_index": 2, "explanations": ["Not this: 1/4 would assume both are carriers for certain.", "Not this: 1/3 would be the carrier chance for a child of a 2/3 carrier and an AA parent.", "Correct. 2/3 × 1 × 1/4 = 1/6.", "Not this: 1/12 is not the product."]}, {"tag": "M9·Q42", "mid": "m09", "difficulty": "hard", "section": "The three steps and the product rule", "qt": "single", "source": "Module 4-10, slide 110; general", "qc": "Both parents each have a 2/3 chance of being carriers of a recessive allele. What is the chance their child is affected?", "options": ["1/9", "1/4", "1/6", "4/9"], "correct_index": 0, "explanations": ["Correct. 2/3 × 2/3 × 1/4 = 1/9.", "Not this: 1/4 assumes both are carriers for certain.", "Not this: 1/6 assumes only one is uncertain.", "Not this: 4/9 omits the 1/4 step."]}, {"tag": "M9·Q43", "mid": "m09", "difficulty": "devil", "section": "The three steps and the product rule", "qt": "single", "source": "Module 4-10, slide 105; general", "qc": "Two carriers (Aa × Aa) have three children. What is the chance that all three are unaffected?", "options": ["1/64", "27/64", "3/4", "9/16"], "correct_index": 1, "explanations": ["Not this: 1/64 is the chance all three are affected.", "Correct. Each child is unaffected with probability 3/4, so (3/4)³ = 27/64.", "Not this: 3/4 is the chance for one child.", "Not this: 9/16 is the chance for two children."]}, {"tag": "M9·Q44", "mid": "m09", "difficulty": "devil", "section": "The three steps and the product rule", "qt": "single", "source": "Module 4-10, slide 105; general", "qc": "Two carriers (Aa × Aa) have two children. What is the chance that both are affected?", "options": ["1/4", "1/8", "1/2", "1/16"], "correct_index": 3, "explanations": ["Not this: 1/4 is the chance for one child.", "Not this: 1/8 does not follow from the product.", "Not this: 1/2 is too large.", "Correct. Each child is affected with probability 1/4, so (1/4)² = 1/16."]}, {"tag": "M9·Q45", "mid": "m09", "difficulty": "devil", "section": "The three steps and the product rule", "qt": "single", "source": "Module 4-10, slide 105", "qc": "Two carriers have an affected first child. What is the chance their second child is also affected?", "options": ["1/4", "1/16", "1/2", "0"], "correct_index": 0, "explanations": ["Correct. Each child is an independent event with chance 1/4.", "Not this: 1/16 would apply to both children together.", "Not this: 1/2 is not the chance.", "Not this: the chance is not zero."]}, {"tag": "M9·Q46", "mid": "m09", "difficulty": "medium", "section": "Solved problem: free earlobes", "qt": "single", "source": "Module 4-10, slide 110", "qc": "Two heterozygous (Aa) parents have a child with free earlobes. What is the probability that this child is a carrier (Aa)?", "options": ["1/2", "2/3", "1/3", "3/4"], "correct_index": 1, "explanations": ["Not this: 1/2 does not include the dominant phenotype condition.", "Correct. The child is AA or Aa in ratio 1:2, so Aa is 2/3.", "Not this: 1/3 is the chance of AA.", "Not this: 3/4 is the share with the dominant phenotype."]}, {"tag": "M9·Q47", "mid": "m09", "difficulty": "medium", "section": "Solved problem: free earlobes", "qt": "single", "source": "Module 4-10, slide 110", "qc": "Two Aa parents have a child with free earlobes. What is the probability that this child is AA?", "options": ["2/3", "1/4", "1/3", "3/4"], "correct_index": 2, "explanations": ["Not this: 2/3 is the chance of Aa.", "Not this: 1/4 is the share among all children.", "Correct. Among unaffected children, AA is 1/3.", "Not this: 3/4 is the share unaffected."]}, {"tag": "M9·Q48", "mid": "m09", "difficulty": "hard", "section": "Solved problem: free earlobes", "qt": "single", "source": "Module 4-10, slide 111", "qc": "An Aa (probability 2/3) individual marries a homozygous AA individual. What is the probability that a child is a carrier?", "options": ["1/2", "2/3", "1/6", "1/3"], "correct_index": 3, "explanations": ["Not this: 1/2 ignores the 2/3 chance.", "Not this: 2/3 is the chance the parent is Aa.", "Not this: 1/6 is too small.", "Correct. 2/3 × 1/2 = 1/3."]}, {"tag": "M9·Q49", "mid": "m09", "difficulty": "hard", "section": "Solved problem: free earlobes", "qt": "single", "source": "Module 4-10, slide 111", "qc": "A woman with the recessive trait (aa) has children with a homozygous normal man (AA). What is the probability that each child is a carrier?", "options": ["1/2", "1 (certain)", "1/4", "0"], "correct_index": 1, "explanations": ["Not this: every child gets an a from her, so one half is wrong.", "Correct. Every child receives an a from her and an A from him.", "Not this: every child gets an a from her, so one half is wrong.", "Not this: they are carriers."]}, {"tag": "M9·Q50", "mid": "m09", "difficulty": "hard", "section": "Solved problem: free earlobes", "qt": "single", "source": "Module 4-10, slide 111", "qc": "Why is the probability 2/3 × 1/2 = 1/3 used for a grandchild being a carrier?", " function beep(f,d,type,g,delay=0){
 if(!AC||!set.sound)return;
 try{const t=AC.currentTime+delay,o=AC.createOscillator(),v=AC.createGain();

 v.gain.setValueAtTime(0.0001,t);v.gain.linearRampToValueAtTime((g||.12)*set.vol,t+.012);

}

/* ====== EUPHEME voice packs ====== */
const PLAIN={ok:"Correct.",no:"Not quite."};
const stripNote=s=>String(s).replace(/\s*\([^()]*\)\s*$/,"");
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pools=new Map(),lastLine=new Map();
function packDraw(pack,slot,arr){
 const key=pack+":"+slot;let pool=pools.get(key);
 if(!pool||!pool.length){
  pool=shuffle(arr.slice());
  const last=lastLine.get(key);
  if(last&&pool.length>1){pool=pool.filter(l=>l!==last);pool.push(last)}
  pools.set(key,pool)}
 const line=pool.shift();lastLine.set(key,line);return line;
}
const streakSlot=n=>n>=19?"streak19plus":n>=11?"streak11_18":n===10?"streak10":n>=7?"streak7_9":n>=5?"streak5_6":n>=3?"streak3_4":"streak1_2";
const packByNum=n=>PACKS.find(p=>p.num===n);
function ePack(){
 if(set.pack>=1&&set.pack<=PACKS.length)return packByNum(set.pack);
 if(set.pack===999)return packByNum(1+Math.floor(Math.random()*PACKS.length));
 return null}
function eupOk(q,streak){
 const p=ePack();if(!p)return null;
 const sl=p.slots;let slot;
 if(q.easyMiss&&Math.random()<.25)slot="easyMiss";
 else if(q.difficulty==="hard"||q.difficulty==="devil")slot="hardCorrect";
 else slot=streakSlot(streak);
 let line=packDraw(p.num,slot,sl[slot]||[])||PLAIN.ok;line=stripNote(line);
 if(slot==="streak11_18"&&line.includes(", ")){const notes=line.split(/,\s?/);line=notes[(streak-11)%notes.length]}
 return line}
function eupNo(q,attempt,broken,recovering){
 const p=ePack();if(!p)return null;
 const sl=p.slots;let slot;
 if(recovering)slot="recovering";
 else if(broken)slot="streakBroken";
 else slot=attempt===1?"wrong1":attempt===2?"wrong2":attempt===3?"wrong3":"wrong4plus";
 let line=stripNote(packDraw(p.num,slot,sl[slot]||[])||PLAIN.no);
 if(slot==="wrong4plus"&&attempt>3&&/slides again/i.test(line)){
  line="I think you should "()+"really ".repeat(attempt-4)+"read the slides again."}
 return line}
function gradeLine(g){
 const p=ePack();if(!p)return null;
 const gr=p.slots.grades;const v=gr&&gr[g];return v?stripNote(v):null;
}

function newRun(mid,sectionIdx){
 ROOM_LOADED="";
 const m=modOf(mid);
 const k=sectionIdx===undefined?-1:sectionIdx;
 const sec=(m.sections||[])[k];
 const list=[];
 if(!sec){for(let i=m.first;i<m.first+m.count;i++)list.push(i)}
 else{for(let i=m.first+sec.from;i<m.first+sec.from+sec.count;i++)list.push(i)}

    a:list.map(()=>null),cs:0,ws:0,msg:"",end:0,rv:null,done:false,list,flags:{},started:Date.now()};

function resumeRun(mid){

 if(Array.isArray(d.order)&&d.order.length&&d.order.every(i=>Number.isInteger(i)&&i>=m.first&&i<m.first+m.count)){
   d.order.forEach(i=>list.push(i))}
  else if(Number.isInteger(d.q0)&&d.q1>d.q0&&d.q0>=m.first&&d.q1<=m.first+m.count){
   for(let i=d.q0;i<d.q1;i++)list.push(i)}
  else{for(let i=m.first;i<m.first+m.count;i++)list.push(i)}
 const a=Array.isArray(d.a)&&d.a.length===list.length?d.a:list.map(()=>null);
 R={mid,label:d.label||"Full module",mode:d.mode||"explain",secIdx:Number.isInteger(d.sec)?d.sec:-1,
    i:Math.min(d.i||0,list.length-1),far:Math.min(d.far||0,list.length-1),a,cs:d.cs||0,ws:d.ws||0,
    msg:d.msg||"",end:d.end||0,rv:null,done:false,list,started:Date.now(),flags:d.flags||{}};
 screen="quiz";
 if(R.end&&R.end<Date.now()){clearInterval(T);screen="results"}
 else if(R.end){clearInterval(T);T=setInterval(tick,1000)}
 draw(1);return true;
}
function finishRun(){
 R.done=true;delSave(R.mid);
 let s=0;R.a.forEach((a,i)=>{if(a===QALL[R.list[i]].correct_index)s++});
 const n=R.list.length,p=Math.round(s/n*100);
 const entries=LS.g("board",[]);
 entries.push({mid:R.mid,sec:R.label,name:set.name||"Guest",score:s,n,pct:p,mode:R.mode==="explain"?"Explain":"Exam",at:Date.now()});
 while(entries.length>400)entries.shift();
 LS.s("board",entries);
 return {s,p};
}

function judge(q,ok){
 let line=null;
 if(ok){
  const pw=R.ws,n=R.cs+1;
  R.cs=n;R.ws=0;
  if(pw>=RECOVER_MIN){
   line=eupNo(q,n,n<1?1:n,"",true);
   if(set.sound)sfx.streak();
   return line||PLAIN.ok;
  }
  line=eupOk(q,n);
  if(set.sound){sfx.ok();if(n===10||n===19)sfx.streak()}
  return line||PLAIN.ok;
 }
 const attempt=R.ws+1,pc=R.cs,broken=pc>=BREAK_MIN;
 R.ws=attempt;R.cs=0;
 line=eupNo(q,attempt,broken,false);
 if(set.sound)sfx.no();
 return line||PLAIN.no;
}

    start: function (k, def, cb) { key = k; steps = def.steps; i = 0; onEnd = cb || null; try { window.CDCoachActive = true; } catch (e) {} draw(); },

    stop: end
  };
