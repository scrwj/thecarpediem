rome.", "Not this: two number 13 is normal."]}, {"tag": "M6·Q115", "mid": "m06", "difficulty": "hard", "section": "Amniocentesis and viability of aneuploids", "qt": "single", "source": "Genetics 4-6, slide 125", "qc": "About what percentage of spontaneous abortuses with chromosomal abnormalities are aneuploid?", "options": ["About 65%", "About 5%", "About 25%", "About 95%"], "correct_index": 0, "explanations": ["Correct. The lecture says 65%.", "Not this: 5% is too low.", "Not this: 25% is too low.", "Not this: 95% is too high."]}, {"tag": "M6·Q116", "mid": "m06", "difficulty": "hard", "section": "Amniocentesis and viability of aneuploids", "qt": "single", "source": "Genetics 4-6, slide 126", "qc": "Which aneuploid condition has the highest incidence among abortuses?", "options": ["47, +21", "47, +13", "45, X", "47, XYY"], "correct_index": 2, "explanations": ["Not this: 47, +21 is common but not highest.", "Not this: 47, +13 is rarer.", "Correct. 45, X is the most frequent.", "Not this: 47, XYY is not highest."]}, {"tag": "M6·Q117", "mid": "m06", "difficulty": "devil", "section": "Amniocentesis and viability of aneuploids", "qt": "single", "source": "Genetics 4-6, slide 124", "qc": "What do reduced viability and karyotypes of aborted fetuses suggest?", "options": ["Aneuploid conditions never arise in any human pregnancy at all", "Many aneuploid conditions arise but do not survive to term", "All aneuploid fetuses survive through to a normal birth", "Aneuploidy only ever affects the placenta, never the fetus"], "correct_index": 1, "explanations": ["Not this: aneuploidy does arise.", "Correct. Many aneuploid fetuses are lost before birth.", "Not this: most aneuploids do not survive.", "Not this: the embryo, not the placenta, is affected."]}, {"tag": "M6·Q118", "mid": "m06", "difficulty": "devil", "section": "Amniocentesis and viability of aneuploids", "qt": "single", "source": "Genetics 4-6, slide 152", "qc": "A culture of fetal cells shows 47 chromosomes with three number 21 chromosomes. Which karyotype notation fits?", "options": ["47, +21", "47, +18", "46, +21", "45, X"], "correct_index": 0, "explanations": ["Correct. 46 plus an extra 21 gives 47, +21.", "Not this: +18 is Edwards.", "Not this: 46 would be normal.", "Not this: 45, X is Turner."]}, {"tag": "M7·Q1", "mid": "m07", "difficulty": "easy", "section": "Chromosomal mechanisms (XY, ZW, XO)", "qt": "single", "source": "Module 4-10, slide 6", "qc": "Which four chromosomal sex-determining mechanisms does the lecture name?", "options": ["XY, XX, YY and ZZ", "Haploid, diploid, triploid and tetraploid", "Autosomal, mitochondrial, plastid and nuclear", "XY, ZW, XO and compound mechanisms"], "correct_index": 3, "explanations": ["Not this: XX, YY and ZZ are genotypes, not mechanisms.", "Not this: ploidy levels are not sex mechanisms.", "Not this: the mechanisms are chromosomal, not organelle based.", "Correct. The lecture lists XY, ZW, XO and compound mechanisms."]}, {"tag": "M7·Q2", "mid": "m07", "difficulty": "easy", "section": "Chromosomal mechanisms (XY, ZW, XO)", "qt": "single", "source": "Module 4-10, slide 8", "qc": "In humans, which sex is heterogametic?", "options": ["Females (XX)", "Males (XY)", "Both sexes", "Neither sex"], "correct_index": 1, "explanations": ["Not this: females make only X gametes.", "Correct. Males make X and Y gametes.", "Not this: only males are heterogametic.", "Not this: one sex is heterogametic."]}, {"tag": "M7·Q3", "mid": "m07", "difficulty": "medium", "section": "Chromosomal mechanisms (XY, ZW, XO)", "qt": "single", "source": "Module 4-10, slide 9", "qc": "What does a normal human female carry?", "options": ["22 pairs of autosomes plus two X chromosomes", "22 pairs of autosomes plus an X and a Y chromosome", "23 pairs of autosomes plus a single X chromosome", "44 pairs of autosomes plus two X chromosomes"], "correct_index": 0, "explanations": ["Correct. Females have 22 pairs of autosomes and XX.", "Not this: X and Y describes a male.", "Not this: one X would be monosomy.", "Not this: the autosome count is 44 chromosomes, not 44 pairs."]}, {"tag": "M7·Q4", "mid": "m07", "difficulty": "medium", "section": "Chromosomal mechanisms (XY, ZW, XO)", "qt": "single", "source": "Module 4-10, slide 9", "qc": "Why are human females called the homogametic sex?", "options": ["They have no sex chromosomes in any of their body cells", "They have two clearly different sex chromosomes, X and Y", "They produce only one kind of gamete for sex chromosomes", "They produce no gametes of any kind in their ovaries"], "correct_index": 2, "explanations": ["Not this: females have XX.", "Not this: XX is two identical chromosomes.", "Correct. Every egg carries an X.", "Not this: females do produce gametes."]}, {"tag": "M7·Q5", "mid": "m07", "difficulty": "medium", "section": "Chromosomal mechanisms (XY, ZW, XO)", "qt": "single", "source": "Module 4-10, slide 7", "qc": "What term describes the unequal pair of sex chromosomes (X and Y) in humans and most mammals?", "options": ["Homologous", "Haploid", "Acentric", "Heteromorphic"], "correct_index": 3, "explanations": ["Not this: homologous pairs match in form.", "Not this: haploid refers to chromosome number.", "Not this: acentric means without a centromere.", "Correct. X and Y differ in form, so they are heteromorphic."]}, {"tag": "M7·Q6", "mid": "m07", "difficulty": "medium", "section": "Chromosomal mechanisms (XY, ZW, XO)", "qt": "single", "source": "Module 4-10, slide 14", "qc": "In the ZW system, which sex is heterogametic?", "options": ["Males (ZZ)", "Both sexes", "Neither sex", "Females (ZW)"], "correct_index": 3, "explanations": ["Not this: males are homogametic (ZZ).", "Not this: only females are heterogametic.", "Not this: one sex is heterogametic.", "Correct. In ZW systems females are ZW."]}, {"tag": "M7·Q7", "mid": "m07", "difficulty": "hard", "section": "Chromosomal mechanisms (XY, ZW, XO)", "qt": "single", "source": "Module 4-10, slide 14", "qc": "Which groups use the ZW sex-determining mechanism?", "options": ["Humans and most other mammals, including cattle", "Honeybees and wasps, which have haplodiploid males", "Most birds, butterflies, moths and some fish", "Turtles and lizards, which can use temperature"], "correct_index": 2, "explanations": ["Not this: humans use XY.", "Not this: bees and wasps use haplodiploidy.", "Correct. These groups have heterogametic females.", "Not this: turtles and lizards may use temperature."]}, {"tag": "M7·Q8", "mid": "m07", "difficulty": "hard", "section": "Chromosomal mechanisms (XY, ZW, XO)", "qt": "single", "source": "Module 4-10, slide 8", "qc": "In the XY system, which parent determines the sex of the offspring?", "options": ["The mother, through an egg that carries a Y chromosome", "The father, through an X-bearing or Y-bearing sperm", "Neither parent, since only chance alone decides sex", "Both parents equally through their acquired traits"], "correct_index": 1, "explanations": ["Not this: eggs carry only X.", "Correct. The sperm supplies X or Y.", "Not this: the parents' gametes decide it.", "Not this: sex is not due to acquired traits."]}, {"tag": "M7·Q9", "mid": "m07", "difficulty": "hard", "section": "Chromosomal mechanisms (XY, ZW, XO)", "qt": "single", "source": "Module 4-10, slide 14", "qc": "In the ZZ-ZW system, which parent determines the sex of the offspring?", "options": ["The mother, through a Z-bearing or W-bearing egg", "The father, through a sperm that carries a W chromosome", "Neither parent, since only chance alone decides the sex", "The environment alone, with no role for chromosomes"], "correct_index": 0, "explanations": ["Correct. The heterogametic female supplies Z or W.", "Not this: males are ZZ and supply only Z.", "Not this: the gametes decide it.", "Not this: the chromosomes decide it."]}, {"tag": "M7·Q10", "mid": "m07", "difficulty": "hard", "section": "Chromosomal mechanisms (XY, ZW, XO)", "qt": "single", "source": "Module 4-10, slide 10", "qc": "A human female (XX) mates with a human male (XY). What offspring sex ratio is expected?", "options": ["1 female : 1 male", "All females", "All males", "3 females : 1 male"], "correct_index": 0, "explanations": ["Correct. The father gives X or Y with equal chance.", "Not this: half will be XY.", "Not this: half will be XX.", "Not this: equal X and Y sperm give equal numbers."]}, {"tag": "M7·Q11", "mid": "m07", "difficulty": "hard", "section": "Chromosomal mechanisms (XY, ZW, XO)", "qt": "single", "source": "Module 4-10, slide 11", "qc": "What does the Y chromosome mainly contain in Drosophila?", "options": ["The main female-determining genes", "The male-determining genes for sex determination", "Genes active in forming sperm in adults", "The genes for white eyes"], "correct_index": 2, "explanations": ["Not this: female determinants are on X.", "Not this: male determiners are on the autosomes.", "Correct. The Y has no significant role in sex determination in Drosophila.", "Not this: the Y does not carry the white-eye gene."]}, {"tag": "M7·Q12", "mid": "m07", "difficulty": "hard", "section": "Chromosomal mechanisms (XY, ZW, XO)", "qt": "single", "source": "Module 4-10, slide 8", "qc": "Which statement about the heterogametic sex is correct?", "options": ["It produces only one kind of gamete for the sex chromosomes", "It produces two kinds of gametes for the sex chromosomes", "It has two identical sex chromosomes in its body cells", "It has no sex chromosomes in any cell of its body or gametes"], "correct_index": 1, "explanations": ["Not this: that describes the homogametic sex.", "Correct. In humans the male makes X and Y gametes.", "Not this: two identical sex chromosomes describe XX.", "Not this: both sexes have sex chromosomes."]}, {"tag": "M7·Q13", "mid": "m07", "difficulty": "devil", "section": "Chromosomal mechanisms (XY, ZW, XO)", "qt": "single", "source": "Module 4-10, slide 8", "qc": "How many autosomes does a normal human male carry?", "options": ["22", "46", "23", "44"], "correct_index": 3, "explanations": ["Not this: 22 is the number of pairs.", "Not this: 46 includes the sex chromosomes.", "Not this: 23 is the haploid number.", "Correct. 22 pairs of autosomes give 44."]}, {"tag": "M7·Q14", "mid": "m07", "difficulty": "devil", "section": "Chromosomal mechanisms (XY, ZW, XO)", "qt": "single", "source": "Module 4-10, slide 14", "qc": "A bird egg carrying W is fertilized by a sperm carrying Z. What is the sex of the chick?", "options": ["Male (ZZ)", "Female (WW)", "Female (ZW)", "Male (ZW)"], "correct_index": 2, "explanations": ["Not this: ZZ is male and needs a Z egg.", "Not this: WW does not form here.", "Correct. ZW is female in birds.", "Not this: ZW is female."]}, {"tag": "M7·Q15", "mid": "m07", "difficulty": "devil", "section": "Chromosomal mechanisms (XY, ZW, XO)", "qt": "single", "source": "Module 4-10, slide 8", "qc": "A male mammal makes X- and Y-bearing sperm in equal numbers. What fraction of zygotes are XY?", "options": ["One half", "One quarter", "All of them", "None of them"], "correct_index": 0, "explanations": ["Correct. Half the sperm carry Y.", "Not this: XY arises from a Y sperm, which is half.", "Not this: half the sperm carry X.", "Not this: some zygotes are XY."]}, {"tag": "M7·Q16", "mid": "m07", "difficulty": "devil", "section": "Chromosomal mechanisms (XY, ZW, XO)", "qt": "single", "source": "Module 4-10, slide 14", "qc": "How do mammals and birds differ in which sex is heterogametic?", "options": ["Mammals have heterogametic females (XX); birds have heterogametic males (ZZ)", "Mammals: heterogametic males (XY); birds: heterogametic females (ZW)", "Both mammals and birds have heterogametic males, with XY sex chromosomes", "Both mammals and birds have heterogametic females, with ZW sex chromosomes"], "correct_index": 1, "explanations": ["Not this: this reverses the two groups.", "Correct. XY males and ZW females are the two systems.", "Not this: birds use ZW.", "Not this: mammals use XY."]}, {"tag": "M7·Q17", "mid": "m07", "difficulty": "easy", "section": "The Y chromosome, SRY and TDF", "qt": "single", "source": "Module 4-10, slide 12", "qc": "Which gene on the Y chromosome is linked to testis development in mammals?", "options": ["TDF-X", "Sxl", "tra", "SRY"], "correct_index": 3, "explanations": ["Not this: TDF is the product, not the gene on X.", "Not this: sxl is a Drosophila sex gene.", "Not this: tra is a Drosophila sex gene.", "Correct. The SRY gene is on the short arm of the Y chromosome."]}, {"tag": "M7·Q18", "mid": "m07", "difficulty": "medium", "section": "The Y chromosome, SRY and TDF", "qt": "single", "source": "Module 4-10, slide 12", "qc": "What does SRY stand for?", "options": ["Sperm Region Y", "Sex Reversal Yeast", "Single Region Y", "Sex-determining Region Y"], "correct_index": 3, "explanations": ["Not this: it is not a sperm region.", "Not this: it has nothing to do with yeast.", "Not this: single is not the term.", "Correct. SRY is the Sex-determining Region Y gene."]}, {"tag": "M7·Q19", "mid": "m07", "difficulty": "medium", "section": "The Y chromosome, SRY and TDF", "qt": "single", "source": "Module 4-10, slide 12", "qc": "What gene product does SRY encode?", "options": ["Testis-determining factor (TDF)", "The sex-lethal protein of Drosophila", "The doublesex protein of Drosophila", "The transformer protein of Drosophila"], "correct_index": 0, "explanations": ["Correct. The SRY gene encodes the testis-determining factor, TDF.", "Not this: sex-lethal is a Drosophila gene product.", "Not this: doublesex is a Drosophila gene.", "Not this: transformer is a Drosophila gene."]}, {"tag": "M7·Q20", "mid": "m07", "difficulty": "hard", "section": "The Y chromosome, SRY and TDF", "qt": "single", "source": "Module 4-10, slide 12", "qc": "On which part of the Y chromosome is SRY located?", "options": ["The long arm", "The short arm", "The centromere", "The X-homologous region"], "correct_index": 1, "explanations": ["Not this: it is on the short arm, not the long arm.", "Correct. SRY is on the short arm of the Y.", "Not this: SRY is on an arm, not the centromere.", "Not this: SRY is Y-specific."]}, {"tag": "M7·Q21", "mid": "m07", "difficulty": "hard", "section": "The Y chromosome, SRY and TDF", "qt": "single", "source": "Module 4-10, slide 13", "qc": "What does it mean that SRY is highly conserved in mammals?", "options": ["It has been lost from most of the mammal species", "It differs completely from one mammal species to another", "It is very similar in different mammal species", "It is only ever found in humans and no other mammal"], "correct_index": 2, "explanations": ["Not this: it is found in mammals.", "Not this: conserved means similar.", "Correct. Highly conserved means little change across species.", "Not this: it occurs in many mammals."]}, {"tag": "M7·Q22", "mid": "m07", "difficulty": "hard", "section": "The Y chromosome, SRY and TDF", "qt": "single", "source": "Module 4-10, slide 13", "qc": "What does SRY, with other genes, encode to promote testicular development?", "options": ["A hormone made in the ovary that promotes female development", "A DNA-binding protein activating testicular development genes", "A cell wall protein found only in the cells of plants", "A spindle fibre protein that moves the chromosomes in mitosis"], "correct_index": 1, "explanations": ["Not this: it promotes male development.", "Correct. The protein switches on genes for testicular development.", "Not this: cell walls are not involved.", "Not this: spindle fibres are not involved."]}, {"tag": "M7·Q23", "mid": "m07", "difficulty": "devil", "section": "The Y chromosome, SRY and TDF", "qt": "single", "source": "Module 4-10, slide 7", "qc": "What determines maleness in humans according to the lecture?", "options": ["The absence of an X chromosome", "The number of autosomes", "The temperature during development", "The presence of the Y chromosome"], "correct_index": 3, "explanations": ["Not this: maleness depends on Y, not absence of X.", "Not this: autosome number is not the factor.", "Not this: temperature determines sex in some reptiles.", "Correct. In humans the Y determines maleness."]}, {"tag": "M7·Q24", "mid": "m07", "difficulty": "devil", "section": "The Y chromosome, SRY and TDF", "qt": "single", "source": "Module 4-10, slide 11", "qc": "In which animal does the Y chromosome play no significant role in sex determination despite being present in males?", "options": ["Drosophila", "Humans", "All mammals", "Birds"], "correct_index": 0, "explanations": ["Correct. In Drosophila the X:A ratio decides sex.", "Not this: in humans the Y determines maleness.", "Not this: mammals use the Y.", "Not this: birds use ZW, not XY."]}, {"tag": "M7·Q25", "mid": "m07", "difficulty": "easy", "section": "Genic balance in Drosophila", "qt": "single", "source": "Module 4-10, slide 18", "qc": "What X:A ratio produces a normal diploid female Drosophila (2X:2A)?", "options": ["0.5", "0.67", "1.0", "1.5"], "correct_index": 2, "explanations": ["Not this: 0.5 is a normal male.", "Not this: 0.67 is an intersex.", "Correct. 2X:2A gives a ratio of 1.0.", "Not this: 1.5 is a metafemale."]}, {"tag": "M7·Q26", "mid": "m07", "difficulty": "medium", "section": "Genic balance in Drosophila", "qt": "single", "source": "Module 4-10, slide 17", "qc": "What X:A ratio produces a normal diploid male Drosophila?", "options": ["1.0", "0.67", "0.5", "2.0"], "correct_index": 2, "explanations": ["Not this: 1.0 is a normal female.", "Not this: 0.67 is an intersex.", "Correct. One X over two autosome sets gives a ratio of 0.5.", "Not this: 2.0 is a metafemale."]}, {"tag": "M7·Q27", "mid": "m07", "difficulty": "medium", "section": "Genic balance in Drosophila", "qt": "single", "source": "Module 4-10, slide 15", "qc": "According to Bridges, where are the female and male determinants in Drosophila?", "options": ["Female determiners on the autosomes; male determiners on the X chromosomes", "Both sets of determiners lie on the X chromosomes alone", "Both sets of determiners lie on the Y chromosome alone", "Female determiners on X chromosomes; male determiners on autosomes"], "correct_index": 3, "explanations": ["Not this: this reverses the two locations.", "Not this: male determiners are on the autosomes.", "Not this: the Y has no such role in Drosophila.", "Correct. The balance of X and autosomes determines sex."]}, {"tag": "M7·Q28", "mid": "m07", "difficulty": "medium", "section": "Genic balance in Drosophila", "qt": "single", "source": "Module 4-10, slide 18", "qc": "What is the sex of a fly with 2X and 3 sets of autosomes (2X:3A, ratio 0.67)?", "options": ["Normal female", "Intersex", "Normal male", "Metafemale"], "correct_index": 1, "explanations": ["Not this: A normal female has 1.0.", "Correct. A ratio of 0.67 gives an intersex.", "Not this: A normal male has 0.5.", "Not this: A metafemale has a ratio above 1.0."]}, {"tag": "M7·Q29", "mid": "m07", "difficulty": "hard", "section": "Genic balance in Drosophila", "qt": "single", "source": "Module 4-10, slide 19", "qc": "A Drosophila has 3X and 2 sets of autosomes. What is its X:A ratio and sex?", "options": ["1.50; metafemale", "0.67; normal female", "2.00; normal male", "1.00; metamale"], "correct_index": 0, "explanations": ["Correct. 3/2 = 1.50, which gives a metafemale (superfemale).", "Not this: A ratio of 1.0 would give a normal female. This does not match the calculated ratio.", "Not this: A ratio of 0.5 would give a normal male. This does not match the calculated ratio.", "Not this: A ratio below 0.5 would give a sterile metamale. This does not match the calculated ratio."]}, {"tag": "M7·Q30", "mid": "m07", "difficulty": "hard", "section": "Genic balance in Drosophila", "qt": "single", "source": "Module 4-10, slide 19", "qc": "A Drosophila has 1X and 3 sets of autosomes. What is its X:A ratio and sex?", "options": ["3.00; normal female", "0.33; metamale", "0.67; normal male", "0.25; metafemale (superfemale)"], "correct_index": 1, "explanations": ["Not this: A ratio of 1.0 would give a normal female. This does not match the calculated ratio.", "Correct. 1/3 = 0.33, which gives a metamale.", "Not this: A ratio of 0.5 would give a normal male. This does not match the calculated ratio.", "Not this: A ratio above 1.0 would give a sterile metafemale. This does not match the calculated ratio."]}, {"tag": "M7·Q31", "mid": "m07", "difficulty": "hard", "section": "Genic balance in Drosophila", "qt": "single", "source": "Module 4-10, slide 19", "qc": "A Drosophila has 4X and 2 sets of autosomes. What is its X:A ratio and sex?", "options": ["0.50; normal female", "2.50; normal male", "2.00; metafemale", "1.33; metamale"], "correct_index": 2, "explanations": ["Not this: A ratio of 1.0 would give a normal female. This does not match the calculated ratio.", "Not this: A ratio of 0.5 would give a normal male. This does not match the calculated ratio.", "Correct. 4/2 = 2.00, which gives a metafemale (superfemale).", "Not this: A ratio below 0.5 would give a sterile metamale. This does not match the calculated ratio."]}, {"tag": "M7·Q32", "mid": "m07", "difficulty": "hard", "section": "Genic balance in Drosophila", "qt": "single", "source": "Module 4-10, slide 19", "qc": "A Drosophila has 3X and 3 sets of autosomes. What is its X:A ratio and sex?", "options": ["1.17; normal male", "1.33; metafemale (superfemale)", "0.75; metamale", "1.00; normal female"], "correct_index": 3, "explanations": ["Not this: A ratio of 0.5 would give a normal male. This does not match the calculated ratio.", "Not this: A ratio above 1.0 would give a sterile metafemale. This does not match the calculated ratio.", "Not this: A ratio below 0.5 would give a sterile metamale. This does not match the calculated ratio.", "Correct. 3/3 = 1.00, which gives a normal female."]}, {"tag": "M7·Q33", "mid": "m07", "difficulty": "hard", "section": "Genic balance in Drosophila", "qt": "single", "source": "Module 4-10, slide 19", "qc": "A Drosophila has 2X and 4 sets of autosomes. What is its X:A ratio and sex?", "options": ["0.50; normal male", "2.00; normal female", "0.75; metafemale (superfemale)", "0.40; metamale"], "correct_index": 0, "explanations": ["Correct. 2/4 = 0.50, which gives a normal male.", "Not this: A ratio of 1.0 would give a normal female. This does not match the calculated ratio.", "Not this: A ratio above 1.0 would give a sterile metafemale. This does not match the calculated ratio.", "Not this: A ratio below 0.5 would give a sterile metamale. This does not match the calculated ratio."]}, {"tag": "M7·Q34", "mid": "m07", "difficulty": "hard", "section": "Genic balance in Drosophila", "qt": "single", "source": "Module 4-10, slide 19", "qc": "A Drosophila has 1X and 4 sets of autosomes. What is its X:A ratio and sex?", "options": ["4.00; normal female", "0.50; normal male", "0.20; metafemale (superfemale)", "0.25; metamale"], "correct_index": 3, "explanations": ["Not this: A ratio of 1.0 would give a normal female. This does not match the calculated ratio.", "Not this: A ratio of 0.5 would give a normal male. This does not match the calculated ratio.", "Not this: A ratio above 1.0 would give a sterile metafemale. This does not match the calculated ratio.", "Correct. 1/4 = 0.25, which gives a metamale."]}, {"tag": "M7·Q35", "mid": "m07", "difficulty": "hard", "section": "Genic balance in Drosophila", "qt": "single", "source": "Module 4-10, slide 19; general", "qc": "A Drosophila has 3X and 4 sets of autosomes. What is its X:A ratio and sex?", "options": ["1.33; normal female", "1.00; normal male", "0.75; intersex", "0.60; metafemale (superfemale)"], "correct_index": 2, "explanations": ["Not this: A ratio of 1.0 would give a normal female. This does not match the calculated ratio.", "Not this: A ratio of 0.5 would give a normal male. This does not match the calculated ratio.", "Correct. 3/4 = 0.75, which gives a intersex.", "Not this: A ratio above 1.0 would give a sterile metafemale. This does not match the calculated ratio."]}, {"tag": "M7·Q36", "mid": "m07", "difficulty": "devil", "section": "Genic balance in Drosophila", "qt": "single", "source": "Module 4-10, slide 18", "qc": "A fly has two X chromosomes, one Y and two sets of autosomes (XXY;2A). What is its sex, and why?", "options": ["Normal female, since X:A is 1.0 and the Y does not decide sex", "Male, since it carries a Y chromosome in all of its cells", "Intersex, since it has three sex chromosomes in each cell", "Metafemale, since it carries an extra sex chromosome of any kind"], "correct_index": 0, "explanations": ["Correct. In Drosophila the ratio, not the Y, determines sex.", "Not this: the Y does not determine maleness here.", "Not this: the ratio is 1.0, not between 0.5 and 1.0.", "Not this: the ratio is 1.0, not above 1.0."]}, {"tag": "M7·Q37", "mid": "m07", "difficulty": "devil", "section": "Genic balance in Drosophila", "qt": "single", "source": "Module 4-10, slide 18", "qc": "What does the metamale (XY;3A) example show?", "options": ["A ratio of about 1.0 produces a metamale", "A ratio of about 0.33 produces a sterile metamale", "A ratio of about 2.0 produces a metamale", "The Y chromosome alone makes a metamale"], "correct_index": 1, "explanations": ["Not this: A ratio of 1.0 is female.", "Correct. 1X:3A gives a ratio below 0.5.", "Not this: A ratio above 1.0 is metafemale.", "Not this: the ratio, not the Y alone, decides."]}, {"tag": "M7·Q38", "mid": "m07", "difficulty": "devil", "section": "Genic balance in Drosophila", "qt": "single", "source": "Module 4-10, slide 19", "qc": "Why does the genic balance theory predict sterility in intersexes, metafemales and metamales?", "options": ["Abnormal X:A balance disrupts sex-specific gene expression", "They have no sex chromosomes in any of their body cells or gametes", "They have no autosomes in any of their body cells", "They are always haploid in every cell of the body"], "correct_index": 0, "explanations": ["Correct. The abnormal balance disturbs gene expression.", "Not this: they have sex chromosomes.", "Not this: they have autosomes.", "Not this: they are not haploid."]}, {"tag": "M7·Q39", "mid": "m07", "difficulty": "devil", "section": "Genic balance in Drosophila", "qt": "single", "source": "Module 4-10, slide 21", "qc": "How does the X:A ratio determine sex at the molecular level, according to the lecture?", "options": ["By changing the chromosome number during each mitotic division", "By cutting the Y chromosome into smaller pieces in embryos", "By switching on sex-lethal, transformer and doublesex genes", "By deleting the autosomes from the cells of the early embryo"], "correct_index": 2, "explanations": ["Not this: mitosis is not the mechanism.", "Not this: the Y is not cut.", "Correct. The ratio activates sex-specific gene expression.", "Not this: autosomes are not deleted."]}, {"tag": "M7·Q40", "mid": "m07", "difficulty": "devil", "section": "Genic balance in Drosophila", "qt": "single", "source": "Module 4-10, slide 17", "qc": "Why is a fly with X:A = 0.5 a normal male even if its autosome and X number is doubled (2X:4A)?", "options": ["Because tetraploid flies are always male, whatever the X:A ratio happens to be", "Because the Y chromosome is present in the male fly", "Because two X chromosomes always make males in Drosophila", "Because it is the ratio, not the absolute number, that decides sex"], "correct_index": 3, "explanations": ["Not this: ploidy alone does not decide sex.", "Not this: Y is not required here.", "Not this: two X chromosomes make females only at ratio 1.0.", "Correct. 2/4 = 0.5, the male ratio."]}, {"tag": "M7·Q41", "mid": "m07", "difficulty": "easy", "section": "Haplodiploidy and environmental sex determination", "qt": "single", "source": "Module 4-10, slide 22", "qc": "What is the chromosome number of a drone honeybee?", "options": ["32 (diploid)", "16 (haploid)", "8 (quarter set)", "64 (tetraploid)"], "correct_index": 1, "explanations": ["Not this: 32 is the queen and worker number.", "Correct. Drones are haploid with 16 chromosomes.", "Not this: 8 does not match the lecture.", "Not this: 64 does not match the lecture."]}, {"tag": "M7·Q42", "mid": "m07", "difficulty": "medium", "section": "Haplodiploidy and environmental sex determination", "qt": "single", "source": "Module 4-10, slide 22", "qc": "From what kind of egg does a male honeybee develop?", "options": ["A fertilized egg", "A diploid egg only", "An egg fertilized by two sperm", "An unfertilized egg"], "correct_index": 3, "explanations": ["Not this: queens and workers come from fertilized eggs.", "Not this: drones are haploid.", "Not this: two sperm are not involved.", "Correct. Males develop parthenogenetically from unfertilized eggs."]}, {"tag": "M7·Q43", "mid": "m07", "difficulty": "medium", "section": "Haplodiploidy and environmental sex determination", "qt": "single", "source": "Module 4-10, slide 23", "qc": "What is the chromosome number of the queen and workers of the honeybee?", "options": ["32 (diploid)", "16 (haploid)", "8", "64"], "correct_index": 0, "explanations": ["Correct. They arise from fertilized eggs.", "Not this: 16 is the drone number.", "Not this: 8 does not match.", "Not this: 64 does not match."]}, {"tag": "M7·Q44", "mid": "m07", "difficulty": "medium", "section": "Haplodiploidy and environmental sex determination", "qt": "single", "source": "Module 4-10, slide 23", "qc": "In the wasp Bracon hebetor, how many chromosomes do females and males have?", "options": ["Females 10 (haploid); males 20 (diploid)", "Females 20 (diploid); males 10 (haploid)", "Females 20 (diploid); males 20 (also diploid)", "Females 10 (haploid); males 10 (haploid)"], "correct_index": 1, "explanations": ["Not this: this reverses the sexes.", "Correct. Females are diploid and males haploid.", "Not this: males are haploid.", "Not this: females are diploid."]}, {"tag": "M7·Q45", "mid": "m07", "difficulty": "hard", "section": "Haplodiploidy and environmental sex determination", "qt": "single", "source": "Module 4-10, slide 24", "qc": "What is the term for sex determination in which males are haploid and females diploid?", "options": ["Heterogamety", "Genic balance", "Haplodiploidy", "Mosaicism"], "correct_index": 2, "explanations": ["Not this: heterogamety refers to unlike sex chromosomes.", "Not this: genic balance is in Drosophila.", "Correct. Haplodiploidy describes this mechanism.", "Not this: mosaicism is mixed tissue."]}, {"tag": "M7·Q46", "mid": "m07", "difficulty": "hard", "section": "Haplodiploidy and environmental sex determination", "qt": "single", "source": "Module 4-10, slide 27", "qc": "What happens to the sex of turtle (Chrysemys picta) offspring at high incubation temperature?", "options": ["Mostly males result", "All offspring die", "Sex is unchanged", "Mostly females result"], "correct_index": 3, "explanations": ["Not this: that describes the lizard.", "Not this: the offspring survive.", "Not this: temperature changes the sex ratio.", "Correct. High temperature gives mostly female turtles."]}, {"tag": "M7·Q47", "mid": "m07", "difficulty": "hard", "section": "Haplodiploidy and environmental sex determination", "qt": "single", "source": "Module 4-10, slide 27", "qc": "What happens to the sex of lizard (Agama agama) offspring at high incubation temperature?", "options": ["Mostly females result", "Mostly males result", "All offspring are intersex", "Sex is unchanged"], "correct_index": 1, "explanations": ["Not this: that describes the turtle.", "Correct. High temperature gives mostly male lizards.", "Not this: intersex is not stated.", "Not this: temperature changes the ratio."]}, {"tag": "M7·Q48", "mid": "m07", "difficulty": "devil", "section": "Haplodiploidy and environmental sex determination", "qt": "single", "source": "Module 4-10, slide 25", "qc": "What is a gynandromorph?", "options": ["An insect whose body has both female and male parts", "A haploid male insect such as a drone honeybee", "A fully sterile female insect found in a honeybee colony", "A fly with an X:A ratio of 1.0 and two X chromosomes"], "correct_index": 0, "explanations": ["Correct. Abnormal chromosome behaviour can produce sexual mosaics.", "Not this: haploid males are normal in some insects.", "Not this: sterility is not the definition.", "Not this: A ratio of 1.0 gives a female."]}, {"tag": "M7·Q49", "mid": "m07", "difficulty": "devil", "section": "Haplodiploidy and environmental sex determination", "qt": "single", "source": "Module 4-10, slide 26", "qc": "Why can males and females of some lower animals have similar genotypes?", "options": ["They have identical sex chromosomes in both males and females, so sex cannot differ", "They have no genes at all that could affect their sex", "Their sex is set by environmental stimuli rather than by genes", "They are always haploid in both of the sexes at all times"], "correct_index": 2, "explanations": ["Not this: sex chromosomes are not the factor.", "Not this: they have genes.", "Correct. In non-genetic sex determination the environment initiates the sex.", "Not this: they need not be haploid."]}, {"tag": "M7·Q50", "mid": "m07", "difficulty": "devil", "section": "Haplodiploidy and environmental sex determination", "qt": "single", "source": "Module 4-10, slide 23", "qc": "A Bracon hebetor egg is fertilized. What is the sex of the offspring and its chromosome number?", "options": ["Male, with 10 chromosomes", "Female, with 20 chromosomes", "Female, with 10 chromosomes", "Male, with 20 chromosomes"], "correct_index": 1, "explanations": ["Not this: males arise from unfertilized eggs.", "Correct. Females arise from fertilized eggs and are diploid.", "Not this: diploid females have 20.", "Not this: males are haploid."]}, {"tag": "M7·Q51", "mid": "m07", "difficulty": "easy", "section": "Sex linkage: Morgan's discovery", "qt": "single", "source": "Module 4-10, slide 31", "qc": "Who discovered sex linkage in Drosophila using a white-eyed mutant?", "options": ["T. H. Morgan", "G. Mendel", "C. B. Bridges", "H. Henking"], "correct_index": 0, "explanations": ["Correct. Morgan found a white-eyed mutant in a culture of red-eyed flies.", "Not this: mendel worked with peas.", "Not this: bridges studied genic balance.", "Not this: henking contributed to sex chromosome studies."]}, {"tag": "M7·Q52", "mid": "m07", "difficulty": "medium", "section": "Sex linkage: Morgan's discovery", "qt": "single", "source": "Module 4-10, slide 32", "qc": "In Morgan's cross of a white-eyed male with a red-eyed female, what did the F1 look like?", "options": ["All white-eyed", "Half red and half white", "White-eyed males only", "All red-eyed"], "correct_index": 3, "explanations": ["Not this: white is recessive.", "Not this: the F1 was uniform.", "Not this: the F1 was uniform.", "Correct. All F1 flies had red eyes."]}, {"tag": "M7·Q53", "mid": "m07", "difficulty": "medium", "section": "Sex linkage: Morgan's discovery", "qt": "single", "source": "Module 4-10, slide 32", "qc": "What F2 ratio of red to white eyes did Morgan find?", "options": ["1 red : 1 white", "All white", "About 3 red : 1 white", "All red"], "correct_index": 2, "explanations": ["Not this: 1:1 is not the F2 ratio.", "Not this: white eyes appear in the F2.", "Correct. The F2 included red and white flies in about 3:1.", "Not this: white eyes appear in the F2."]}, {"tag": "M7·Q54", "mid": "m07", "difficulty": "medium", "section": "Sex linkage: Morgan's discovery", "qt": "single", "source": "Module 4-10, slide 34", "qc": "What was unusual about the white-eyed flies in Morgan's F2 generation?", "options": ["All of them were females", "They were all sterile", "They had no X chromosome", "All of them were males"], "correct_index": 3, "explanations": ["Not this: no females had white eyes.", "Not this: sterility was not stated.", "Not this: they had an X.", "Correct. Only males had white eyes."]}, {"tag": "M7·Q55", "mid": "m07", "difficulty": "hard", "section": "Sex linkage: Morgan's discovery", "qt": "single", "source": "Module 4-10, slide 34", "qc": "In Morgan's F2 generation, what were the eye colours of the females and the males?", "options": ["All females white-eyed; all of the males red-eyed", "Half the females white-eyed; every one of the males white-eyed", "All females red; about half the males red and half white", "All of the flies red-eyed, both males and females"], "correct_index": 2, "explanations": ["Not this: females were red.", "Not this: females were red and males split.", "Correct. The recessive allele showed only in males.", "Not this: white flies appeared."]}, {"tag": "M7·Q56", "mid": "m07", "difficulty": "hard", "section": "Sex linkage: Morgan's discovery", "qt": "single", "source": "Module 4-10, slide 35", "qc": "How did Morgan explain that the recessive white allele showed up only in males?", "options": ["He associated the gene with the X chromosome", "He associated it with the Y chromosome", "He associated it with the mitochondria", "He associated it with the autosomes"], "correct_index": 0, "explanations": ["Correct. He linked the allele to the X chromosome.", "Not this: the gene is on X, not Y.", "Not this: mitochondria were not involved.", "Not this: autosomal genes would not give this pattern."]}, {"tag": "M7·Q57", "mid": "m07", "difficulty": "hard", "section": "Sex linkage: Morgan's discovery", "qt": "single", "source": "Module 4-10, slide 36", "qc": "How does the lecture describe the sex chromosomes of female and male Drosophila?", "options": ["Females: an X and a J-shaped Y; males: two rod-shaped chromosomes", "Females: two rod-shaped Xs; males: one X and a J-shaped Y", "Both sexes have two rod-shaped X chromosomes in each cell", "Both sexes have a J-shaped Y chromosome in each cell"], "correct_index": 1, "explanations": ["Not this: this reverses the sexes.", "Correct. XX females and XY males, with the Y J-shaped.", "Not this: males have only one X.", "Not this: only males have a Y."]}, {"tag": "M7·Q58", "mid": "m07", "difficulty": "devil", "section": "Sex linkage: Morgan's discovery", "qt": "single", "source": "Module 4-10, slide 37", "qc": "Which statement best explains why Morgan's result was a natural consequence of Mendelian assortment of chromosomes?", "options": ["The white allele is on an autosome and segregates independently of sex", "The white allele is in the mitochondria and inherited from the mother", "The white allele moves back and forth between the X and Y", "The white allele lies on the X, which segregates with the sexes"], "correct_index": 3, "explanations": ["Not this: an autosomal gene would affect both sexes equally.", "Not this: mitochondrial inheritance is not the lecture's explanation.", "Not this: the allele does not move.", "Correct. Assortment of X and Y explains the sex-limited pattern."]}, {"tag": "M7·Q59", "mid": "m07", "difficulty": "devil", "section": "Sex linkage: Morgan's discovery", "qt": "single", "source": "Module 4-10, slide 35", "qc": "In Morgan's experiment, what does it mean that the recessive allele \"was expressed only in males\"?", "options": ["Males carry two X chromosomes and no Y chromosome at all", "Females have no X chromosomes in their body cells", "Males carry one X, so one recessive allele shows the trait", "Males are heterozygous for the white allele on their X chromosome"], "correct_index": 2, "explanations": ["Not this: males have one X and one Y.", "Not this: females have two X chromosomes.", "Correct. Males are hemizygous for X-linked genes.", "Not this: males have only one copy."]}, {"tag": "M7·Q60", "mid": "m07", "difficulty": "easy", "section": "Sex-linked inheritance and crosses", "qt": "single", "source": "Module 4-10, slide 38", "qc": "A white-eyed female (X^w X^w) is crossed with a white-eyed male (X^w Y). What eye colour do the offspring have?", "options": ["All red-eyed", "All white-eyed", "Daughters red, sons white", "Half red and half white"], "correct_index": 1, "explanations": ["Not this: no W allele is present.", "Correct. Every offspring inherits only w alleles.", "Not this: the mother has no W.", "Not this: the father has no W."]}, {"tag": "M7·Q61", "mid": "m07", "difficulty": "medium", "section": "Sex-linked inheritance and crosses", "qt": "single", "source": "Module 4-10, slide 38", "qc": "A red-eyed female (X^W X^W) is crossed with a white-eyed male (X^w Y). What are the offspring?", "options": ["All red-eyed; the daughters are carriers", "All of the offspring are white-eyed, sons and daughters", "Daughters are white-eyed and the sons are red-eyed", "Half red-eyed and half white-eyed in both sexes"], "correct_index": 0, "explanations": ["Correct. Daughters are X^W X^w and sons X^W Y.", "Not this: the mother gives only W.", "Not this: daughters are not white.", "Not this: all are red."]}, {"tag": "M7·Q62", "mid": "m07", "difficulty": "medium", "section": "Sex-linked inheritance and crosses", "qt": "single", "source": "Module 4-10, slide 38", "qc": "A white-eyed female (X^w X^w) is crossed with a red-eyed male (X^W Y). What are the offspring?", "options": ["All of the offspring red-eyed, sons and daughters", "Daughters red-eyed (carriers), sons white-eyed", "All of the offspring white-eyed, sons and daughters", "Daughters are white-eyed and the sons are red-eyed"], "correct_index": 1, "explanations": ["Not this: sons are white.", "Correct. Sons get the mother's X^w and daughters get X^W from the father.", "Not this: daughters get a W.", "Not this: daughters are not white."]}, {"tag": "M7·Q63", "mid": "m07", "difficulty": "medium", "section": "Sex-linked inheritance and crosses", "qt": "single", "source": "Module 4-10, slide 38", "qc": "How does a sex-linked recessive trait usually appear in a population?", "options": ["More often in females than in males, in most families", "Equally often in both males and females in every family", "More often in males than in females", "Only in females, and never in any of the males"], "correct_index": 2, "explanations": ["Not this: that describes dominant sex-linked traits.", "Not this: males are affected more often.", "Correct. Males need only one recessive allele.", "Not this: males can express it."]}, {"tag": "M7·Q64", "mid": "m07", "difficulty": "hard", "section": "Sex-linked inheritance and crosses", "qt": "single", "source": "Module 4-10, slide 34", "qc": "A carrier red-eyed female (X^W X^w) is crossed with a red-eyed male (X^W Y). What are the offspring?", "options": ["All daughters red-eyed; half the sons white-eyed", "All daughters white-eyed and all of the sons red-eyed", "All sons red-eyed and half of the daughters white-eyed", "Half of the daughters white-eyed and no sons"], "correct_index": 0, "explanations": ["Correct. Sons receive either X^W or X^w from the mother.", "Not this: daughters get X^W from the father.", "Not this: half the sons are white.", "Not this: daughters are red."]}, {"tag": "M7·Q65", "mid": "m07", "difficulty": "hard", "section": "Sex-linked inheritance and crosses", "qt": "single", "source": "Module 4-10, slide 34", "qc": "A carrier red-eyed female (X^W X^w) is crossed with a white-eyed male (X^w Y). What are the offspring?", "options": ["All daughters red-eyed and half the sons white-eyed", "All sons red-eyed and all daughters white-eyed", "All of the offspring white-eyed, in both sexes", "Half the daughters and half the sons white-eyed"], "correct_index": 3, "explanations": ["Not this: half the daughters are X^w X^w.", "Not this: half the sons are X^w Y.", "Not this: not all are white.", "Correct. Daughters are X^W X^w or X^w X^w; sons are X^W Y or X^w Y."]}, {"tag": "M7·Q66", "mid": "m07", "difficulty": "hard", "section": "Sex-linked inheritance and crosses", "qt": "single", "source": "Module 4-10, slide 34", "qc": "A carrier female (X^W X^w) is crossed with a red-eyed male (X^W Y) and produces 80 offspring. How many are expected to be white-eyed?", "options": ["40", "10", "60", "20"], "correct_index": 3, "explanations": ["Not this: 40 would be all sons.", "Not this: 10 is too few.", "Not this: 60 is too many.", "Correct. Half the sons are white; sons are half of 80, so 20."]}, {"tag": "M7·Q67", "mid": "m07", "difficulty": "hard", "section": "Sex-linked inheritance and crosses", "qt": "single", "source": "Module 4-10, slide 34", "qc": "From the same cross (X^W X^w × X^W Y, 80 offspring), how many carrier daughters are expected?", "options": ["40", "20", "10", "60"], "correct_index": 1, "explanations": ["Not this: 40 is all daughters.", "Correct. Daughters are 40; half are X^W X^w.", "Not this: 10 is too few.", "Not this: 60 is too many."]}, {"tag": "M7·Q68", "mid": "m07", "difficulty": "hard", "section": "Sex-linked inheritance and crosses", "qt": "single", "source": "Module 4-10, slide 34", "qc": "A white-eyed female (X^w X^w) is crossed with a red-eyed male (X^W Y). What fraction of all offspring are white-eyed?", "options": ["One half", "All", "None", "One quarter"], "correct_index": 0, "explanations": ["Correct. All sons are white and sons are half of the offspring.", "Not this: daughters are not white.", "Not this: sons are white.", "Not this: one half, not one quarter."]}, {"tag": "M7·Q69", "mid": "m07", "difficulty": "hard", "section": "Sex-linked inheritance and crosses", "qt": "single", "source": "Module 4-10, slide 38", "qc": "According to the lecture, when does a sex-linked recessive trait appear in a female?", "options": ["Only if her mother is unaffected and her father is a carrier", "Whenever her mother is a carrier of the allele", "Only if the trait also appeared in her father", "Never, since only males can ever show such a trait"], "correct_index": 2, "explanations": ["Not this: the mother does not decide this.", "Not this: A carrier mother alone gives one allele.", "Correct. A female needs a recessive allele from her father too.", "Not this: it can appear in females."]}, {"tag": "M7·Q70", "mid": "m07", "difficulty": "hard", "section": "Sex-linked inheritance and crosses", "qt": "single", "source": "Module 4-10, slide 40", "qc": "An affected father (X^A Y) with a sex-linked dominant trait mates with an unaffected mother (X^a X^a). What is expected in the children?", "options": ["All sons affected and no daughters affected", "All daughters affected and no sons affected", "Half the sons and half the daughters affected", "No children affected"], "correct_index": 1, "explanations": ["Not this: sons get the Y and not the X^A.", "Correct. Daughters get the father's X^A; sons get his Y.", "Not this: every daughter inherits X^A.", "Not this: all daughters inherit X^A."]}, {"tag": "M7·Q71", "mid": "m07", "difficulty": "devil", "section": "Sex-linked inheritance and crosses", "qt": "single", "source": "Module 4-10, slide 39", "qc": "Which pattern is typical of a sex-linked dominant gene?", "options": ["It is found in all daughters of an affected father", "It is found in all of the sons of an affected father", "It never occurs in females, but only in males of the species", "It is passed from father to son only, never to daughters"], "correct_index": 0, "explanations": ["Correct. An affected father passes his X to all daughters.", "Not this: sons get the Y from their father.", "Not this: dominant sex-linked traits are more frequent in females.", "Not this: father-to-son would be Y-linked."]}, {"tag": "M7·Q72", "mid": "m07", "difficulty": "devil", "section": "Sex-linked inheritance and crosses", "qt": "single", "source": "Module 4-10, slide 40", "qc": "An unaffected mother has a son who does not show a sex-linked dominant trait. What does this tell you?", "options": ["All of the sons of this mother will also show the dominant trait", "The father of the child must be the affected parent here", "The mother must be a carrier of the dominant allele", "A mother not showing the trait does not pass it to her sons"], "correct_index": 3, "explanations": ["Not this: sons need an allele from the mother.", "Not this: the father passes the Y to sons.", "Not this: an unaffected mother lacks the dominant allele.", "Correct. Mothers who do not show a dominant sex-linked trait do not transmit it to sons."]}, {"tag": "M7·Q73", "mid": "m07", "difficulty": "devil", "section": "Sex-linked inheritance and crosses", "qt": "single", "source": "Module 4-10, slide 38", "qc": "A woman with a sex-linked recessive trait has a son. What does the lecture predict about the son?", "options": ["The son will be a carrier", "The son will be unaffected", "The son will show the trait", "The son has a 50% chance"], "correct_index": 2, "explanations": ["Not this: males cannot be carriers of an X-linked allele.", "Not this: he gets her X^w.", "Correct. A woman who shows a recessive sex-linked trait is X^w X^w and gives X^w to every son.", "Not this: the chance is 100%."]}, {"tag": "M8·Q1", "mid": "m08", "difficulty": "easy", "section": "Multiple alleles and genotype counts", "qt": "single", "source": "Module 4-10, slide 45", "qc": "What is the maximum number of alleles of one gene that a single diploid individual can carry?", "options": ["Two", "One", "Three", "As many as exist in the population"], "correct_index": 0, "explanations": ["Correct. One allele sits on each homologous chromosome.", "Not this: A diploid carries two alleles, not one.", "Not this: three would need three homologues.", "Not this: the population may have many, but an individual has two."]}, {"tag": "M8·Q2", "mid": "m08", "difficulty": "easy", "section": "Multiple alleles and genotype counts", "qt": "single", "source": "Module 4-10, slide 65", "qc": "How many different genotypes are possible with 3 alleles of a gene?", "options": ["3", "9", "8", "6"], "correct_index": 3, "explanations": ["Not this: 3 counts only the homozygotes.", "Not this: 9 would be 3 × 3.", "Not this: 8 does not fit the formula.", "Correct. n(n + 1)/2 = 3 × 4/2 = 6."]}, {"tag": "M8·Q3", "mid": "m08", "difficulty": "medium", "section": "Multiple alleles and genotype counts", "qt": "single", "source": "Module 4-10, slide 46", "qc": "What are more than two alleles at a gene locus in a population called?", "options": ["Codominant alleles", "Multiple alleles", "Lethal alleles", "Linked alleles"], "correct_index": 1, "explanations": ["Not this: codominance is a type of expression.", "Correct. More than two alleles at a locus are multiple alleles.", "Not this: lethal alleles kill the carrier.", "Not this: linkage concerns genes on one chromosome."]}, {"tag": "M8·Q4", "mid": "m08", "difficulty": "medium", "section": "Multiple alleles and genotype counts", "qt": "single", "source": "Module 4-10, slide 46", "qc": "How do large numbers of alleles arise at a locus?", "options": ["By the loss of whole chromosomes during division", "By the fertilization of two eggs by a single sperm", "Genes change to alternative forms by mutation", "By the replication of the centrioles in the cell"], "correct_index": 2, "explanations": ["Not this: chromosome loss is aneuploidy.", "Not this: fertilization of two eggs does not create alleles.", "Correct. Mutation creates alternative alleles.", "Not this: centrioles are not involved."]}, {"tag": "M8·Q5", "mid": "m08", "difficulty": "medium", "section": "Multiple alleles and genotype counts", "qt": "single", "source": "Module 4-10, slide 65", "qc": "How many different genotypes are possible with 4 alleles of a gene?", "options": ["10", "8", "12", "16"], "correct_index": 0, "explanations": ["Correct. 4 × 5/2 = 10.", "Not this: 8 does not fit the formula.", "Not this: 12 does not fit the formula.", "Not this: 16 is 4 squared."]}, {"tag": "M8·Q6", "mid": "m08", "difficulty": "hard", "section": "Multiple alleles and genotype counts", "qt": "single", "source": "Module 4-10, slide 65", "qc": "How many different genotypes are possible with 5 alleles of a gene?", "options": ["10", "15", "20", "25"], "correct_index": 1, "explanations": ["Not this: 10 is the count for 4 alleles.", "Correct. 5 × 6/2 = 15.", "Not this: 20 does not fit the formula.", "Not this: 25 is 5 squared."]}, {"tag": "M8·Q7", "mid": "m08", "difficulty": "hard", "section": "Multiple alleles and genotype counts", "qt": "single", "source": "Module 4-10, slide 65; general", "qc": "A locus has 6 alleles in a population. How many different diploid genotypes are possible?", "options": ["12", "15", "21", "36"], "correct_index": 2, "explanations": ["Not this: 12 is 6 × 2.", "Not this: 15 is the count for 5 alleles.", "Correct. 6 × 7/2 = 21.", "Not this: 36 is 6 squared."]}, {"tag": "M8·Q8", "mid": "m08", "difficulty": "hard", "section": "Multiple alleles and genotype counts", "qt": "single", "source": "Module 4-10, slide 65; general", "qc": "A locus has 8 alleles in a population. How many different diploid genotypes are possible?", "options": ["28", "64", "16", "36"], "correct_index": 3, "explanations": ["Not this: 28 is the count for 7 alleles.", "Not this: 64 is 8 squared.", "Not this: 16 is 8 × 2.", "Correct. 8 × 9/2 = 36."]}, {"tag": "M8·Q9", "mid": "m08", "difficulty": "hard", "section": "Multiple alleles and genotype counts", "qt": "single", "source": "Module 4-10, slide 65; general", "qc": "A locus has 10 alleles in a population. How many different diploid genotypes are possible?", "options": ["55", "45", "100", "20"], "correct_index": 0, "explanations": ["Correct. 10 × 11/2 = 55.", "Not this: 45 is the count for 9 alleles.", "Not this: 100 is 10 squared.", "Not this: 20 is 10 × 2."]}, {"tag": "M8·Q10", "mid": "m08", "difficulty": "hard", "section": "Multiple alleles and genotype counts", "qt": "single", "source": "Module 4-10, slide 65; general", "qc": "In a system with 4 alleles, how many of the possible genotypes are heterozygous?", "options": ["4", "10", "12", "6"], "correct_index": 3, "explanations": ["Not this: 4 is the number of homozygous genotypes.", "Not this: 10 is the total number.", "Not this: 12 is not a genotype count here.", "Correct. 10 genotypes in total minus 4 homozygous leaves 6."]}, {"tag": "M8·Q11", "mid": "m08", "difficulty": "hard", "section": "Multiple alleles and genotype counts", "qt": "single", "source": "Module 4-10, slide 65; general", "qc": "In a system with 5 alleles, how many of the possible genotypes are homozygous?", "options": ["10", "15", "5", "25"], "correct_index": 2, "explanations": ["Not this: 10 is the number of heterozygous genotypes.", "Not this: 15 is the total number.", "Correct. There is one homozygous genotype for each allele.", "Not this: 25 is not a genotype count."]}, {"tag": "M8·Q12", "mid": "m08", "difficulty": "hard", "section": "Multiple alleles and genotype counts", "qt": "single", "source": "Module 4-10, slide 65", "qc": "A population has 6 alleles at a locus. Which statement about one diploid individual is correct?", "options": ["It carries all six of the alleles in its cells", "It carries at most two of the six alleles", "It carries only one allele of the six at all times", "It carries four of the six alleles at a time"], "correct_index": 1, "explanations": ["Not this: six would need six homologues.", "Correct. Only two alleles can be present in any one diploid organism.", "Not this: A diploid carries two, not one.", "Not this: four exceeds the diploid limit."]}, {"tag": "M8·Q13", "mid": "m08", "difficulty": "devil", "section": "Multiple alleles and genotype counts", "qt": "single", "source": "Module 4-10, slide 65; general", "qc": "A locus has 12 alleles in a population. How many different diploid genotypes are possible?", "options": ["78", "66", "144", "24"], "correct_index": 0, "explanations": ["Correct. 12 × 13/2 = 78.", "Not this: 66 is the count for 11 alleles.", "Not this: 144 is 12 squared.", "Not this: 24 is 12 × 2."]}, {"tag": "M8·Q14", "mid": "m08", "difficulty": "devil", "section": "Multiple alleles and genotype counts", "qt": "single", "source": "Module 4-10, slide 65; general", "qc": "In a system with 7 alleles, how many genotypes are heterozygous?", "options": ["7", "28", "21", "49"], "correct_index": 2, "explanations": ["Not this: 7 is the number of homozygous genotypes.", "Not this: 28 is the total.", "Correct. Total 28 genotypes minus 7 homozygous leaves 21.", "Not this: 49 is 7 squared."]}, {"tag": "M8·Q15", "mid": "m08", "difficulty": "devil", "section": "Multiple alleles and genotype counts", "qt": "single", "source": "Module 4-10, slide 65; general", "qc": "How many alleles of a gene give a total of 45 possible genotypes?", "options": ["8", "9", "10", "15"], "correct_index": 1, "explanations": ["Not this: 8 gives 36.", "Correct. 9 × 10/2 = 45.", "Not this: 10 gives 55.", "Not this: 15 gives 120."]}, {"tag": "M8·Q16", "mid": "m08", "difficulty": "devil", "section": "Multiple alleles and genotype counts", "qt": "single", "source": "Module 4-10, slide 65; general", "qc": "How many alleles of a gene give a total of 66 possible genotypes?", "options": ["10", "12", "33", "11"], "correct_index": 3, "explanations": ["Not this: 10 gives 55.", "Not this: 12 gives 78.", "Not this: 33 is half of 66, not the allele count.", "Correct. 11 × 12/2 = 66."]}, {"tag": "M8·Q17", "mid": "m08", "difficulty": "easy", "section": "Codominance and the MN blood group", "qt": "single", "source": "Module 4-10, slide 47", "qc": "What does codominance mean?", "options": ["One allele hides the other completely in the heterozygote", "The heterozygote is intermediate between the two homozygotes", "Both alleles are fully expressed in the heterozygote", "One allele kills the carrier before it can reproduce"], "correct_index": 2, "explanations": ["Not this: that describes complete dominance.", "Not this: that describes incomplete dominance.", "Correct. Both alleles are fully expressed.", "Not this: that describes a dominant lethal allele."]}, {"tag": "M8·Q18", "mid": "m08", "difficulty": "medium", "section": "Codominance and the MN blood group", "qt": "single", "source": "Module 4-10, slide 48", "qc": "What antigens does an LMLN heterozygote carry on its red blood cells?", "options": ["Both M and N antigens", "Only M antigen", "Only N antigen", "Neither antigen"], "correct_index": 0, "explanations": ["Correct. M and N are codominant.", "Not this: N is also expressed.", "Not this: M is also expressed.", "Not this: both are expressed."]}, {"tag": "M8·Q19", "mid": "m08", "difficulty": "medium", "section": "Codominance and the MN blood group", "qt": "single", "source": "Module 4-10, slide 49", "qc": "What phenotypic ratio is expected from LMLN × LMLN?", "options": ["3 M : 1 N", "1 M : 2 MN : 1 N", "1 M : 1 N", "All MN"], "correct_index": 1, "explanations": ["Not this: 3:1 applies to complete dominance.", "Correct. The ratio is 1:2:1.", "Not this: 1:1 is a testcross ratio.", "Not this: heterozygotes cross to give all three types."]}, {"tag": "M8·Q20", "mid": "m08", "difficulty": "medium", "section": "Codominance and the MN blood group", "qt": "single", "source": "Module 4-10, slide 48", "qc": "What are the two alleles of the MN blood group locus?", "options": ["IA and IB", "C and c", "W and w", "LM and LN"], "correct_index": 3, "explanations": ["Not this: IA and IB are ABO alleles.", "Not this: C and c are rabbit coat alleles.", "Not this: W and w are Drosophila eye alleles.", "Correct. The alleles are LM and LN."]}, {"tag": "M8·Q21", "mid": "m08", "difficulty": "hard", "section": "Codominance and the MN blood group", "qt": "single", "source": "Module 4-10, slide 49", "qc": "Why does a 1:2:1 phenotypic ratio replace the 3:1 ratio in the MN cross?", "options": ["The heterozygote shows both alleles, so three phenotypes appear", "One of the alleles is lethal in the homozygous state and kills the embryo", "The two genes are tightly linked on the same chromosome", "The two alleles blend permanently into one new allele"], "correct_index": 0, "explanations": ["Correct. Heterozygotes are distinguishable from both homozygotes.", "Not this: no lethal allele is involved.", "Not this: linkage is not the cause.", "Not this: alleles stay distinct."]}, {"tag": "M8·Q22", "mid": "m08", "difficulty": "hard", "section": "Codominance and the MN blood group", "qt": "single", "source": "Module 4-10, slide 49", "qc": "Two LMLN parents have 400 children. How many are expected to be group MN?", "options": ["100", "200", "300", "400"], "correct_index": 1, "explanations": ["Not this: 100 is the M or N class.", "Correct. Half the children are heterozygous.", "Not this: 300 is not a class share.", "Not this: 400 would be all children."]}, {"tag": "M8·Q23", "mid": "m08", "difficulty": "hard", "section": "Codominance and the MN blood group", "qt": "single", "source": "Module 4-10, slide 49", "qc": "What offspring are expected from LMLM × LMLN?", "options": ["All group M", "1 group M : 1 group N", "3 group M : 1 group N", "1 group M : 1 group MN"], "correct_index": 3, "explanations": ["Not this: half carry LN.", "Not this: N needs LN LN.", "Not this: 3:1 is not this cross.", "Correct. LMLM gives LM; LMLN gives LM or LN."]}, {"tag": "M8·Q24", "mid": "m08", "difficulty": "hard", "section": "Codominance and the MN blood group", "qt": "single", "source": "Module 4-10, slide 49", "qc": "What offspring are expected from LNLN × LMLN?", "options": ["All group N", "1 group M : 1 group MN", "1 group MN : 1 group N", "All group MN"], "correct_index": 2, "explanations": ["Not this: half carry LM.", "Not this: M needs LM LM.", "Correct. LNLN gives LN; LMLN gives LM or LN.", "Not this: some are LN LN."]}, {"tag": "M8·Q25", "mid": "m08", "difficulty": "hard", "section": "Codominance and the MN blood group", "qt": "single", "source": "Module 4-10, slide 49", "qc": "What offspring are expected from LMLM × LNLN?", "options": ["All group M", "All group N", "All group MN", "1 group M : 1 group N"], "correct_index": 2, "explanations": ["Not this: every child receives LN.", "Not this: every child receives LM.", "Correct. Every child receives one LM and one LN.", "Not this: every child is heterozygous."]}, {"tag": "M8·Q26", "mid": "m08", "difficulty": "devil", "section": "Codominance and the MN blood group", "qt": "single", "source": "Module 4-10, slide 49", "qc": "A child is group N. Which parental pairing is impossible?", "options": ["Both parents are of group MN (LMLN × LMLN)", "One parent of group MN and one of group N", "Both parents are of group N (LNLN × LNLN)", "Both parents group M (LMLM × LMLM)"], "correct_index": 3, "explanations": ["Not this: MN parents can give LN LN.", "Not this: an MN and an N parent can give LN LN.", "Not this: N parents give N.", "Correct. Two LM LM parents cannot give an LN allele."]}, {"tag": "M8·Q27", "mid": "m08", "difficulty": "devil", "section": "Codominance and the MN blood group", "qt": "single", "source": "Module 4-10, slide 49", "qc": "A child is group MN. Which parental pairing is impossible?", "options": ["Both parents are of group MN (LMLN × LMLN)", "Both parents group N (LNLN × LNLN)", "One parent of group M and one of group N", "One parent of group MN and one of group M"], "correct_index": 1, "explanations": ["Not this: MN parents can give MN.", "Correct. Two LN LN parents cannot give an LM allele.", "Not this: M × N always gives MN.", "Not this: an MN and M parent can give MN."]}, {"tag": "M8·Q28", "mid": "m08", "difficulty": "devil", "section": "Codominance and the MN blood group", "qt": "single", "source": "Module 4-10, slide 48", "qc": "Why can MN individuals be identified directly from their red cells?", "options": ["Both M and N antigens show, unlike either homozygote", "They have neither the M antigen nor the N antigen at all", "They have an extra chromosome in each of their cells", "They show only one antigen, chosen at random in each cell"], "correct_index": 0, "explanations": ["Correct. Codominance makes heterozygotes distinguishable.", "Not this: they have both.", "Not this: chromosome number is normal.", "Not this: both are always present."]}, {"tag": "M8·Q29", "mid": "m08", "difficulty": "easy", "section": "Incomplete dominance", "qt": "single", "source": "Module 4-10, slide 51", "qc": "What monohybrid phenotypic ratio results from incomplete dominance?", "options": ["3:1", "1:2:1", "1:1", "9:3:3:1"], "correct_index": 1, "explanations": ["Not this: 3:1 is complete dominance.", "Correct. Every genotype has a distinguishable phenotype.", "Not this: 1:1 is a testcross ratio.", "Not this: 9:3:3:1 is a dihybrid ratio."]}, {"tag": "M8·Q30", "mid": "m08", "difficulty": "medium", "section": "Incomplete dominance", "qt": "single", "source": "Module 4-10, slide 51", "qc": "What is the heterozygote like under incomplete dominance?", "options": ["Identical to the dominant homozygote in every respect", "Identical to the recessive homozygote in every respect", "Lethal, so that the heterozygote dies before maturity", "Intermediate between the two homozygous phenotypes"], "correct_index": 3, "explanations": ["Not this: complete dominance would give that.", "Not this: neither parent type is copied.", "Not this: the heterozygote survives and is not lethal.", "Correct. The heterozygote shows an intermediate phenotype."]}, {"tag": "M8·Q31", "mid": "m08", "difficulty": "medium", "section": "Incomplete dominance", "qt": "single", "source": "Module 4-10, slide 51", "qc": "What does the lecture say about genotype and phenotype in the absence of complete dominance?", "options": ["Only homozygotes can be recognised by their phenotype", "Only heterozygotes can be recognised by their phenotype", "Every genotype has a distinguishable phenotype", "No phenotype can be seen for any of the genotypes"], "correct_index": 2, "explanations": ["Not this: heterozygotes are also distinguishable.", "Not this: homozygotes are also distinguishable.", "Correct. Three genotypes give three phenotypes.", "Not this: phenotypes are visible."]}, {"tag": "M8·Q32", "mid": "m08", "difficulty": "hard", "section": "Incomplete dominance", "qt": "single", "source": "Module 4-10, slide 51", "qc": "Of 200 F2 offspring showing incomplete dominance, how many are expected to be intermediate?", "options": ["100", "50", "150", "200"], "correct_index": 0, "explanations": ["Correct. The middle class is half of a 1:2:1 ratio.", "Not this: 50 is a homozygous class.", "Not this: 150 is not a class share.", "Not this: 200 would be all."]}, {"tag": "M8·Q33", "mid": "m08", "difficulty": "hard", "section": "Incomplete dominance", "qt": "single", "source": "Module 4-10, slide 51", "qc": "What cross of an intermediate individual with a homozygous parent gives?", "options": ["All of the offspring intermediate in phenotype", "1 intermediate : 1 homozygous like the parent", "All of the offspring like the homozygous parent", "1 : 2 : 1 across the three possible phenotypes"], "correct_index": 1, "explanations": ["Not this: half are the homozygous type.", "Correct. The heterozygote makes two kinds of gametes equally.", "Not this: half are intermediate.", "Not this: 1:2:1 needs two heterozygous parents."]}, {"tag": "M8·Q34", "mid": "m08", "difficulty": "hard", "section": "Incomplete dominance", "qt": "single", "source": "Module 4-10, slide 47", "qc": "How do codominance and incomplete dominance differ?", "options": ["Codominance shows both alleles; incomplete dominance gives a blend", "They are identical processes with two different names", "In codominance only one allele shows and the other is hidden", "In incomplete dominance both alleles show fully and unchanged"], "correct_index": 0, "explanations": ["Correct. Codominant alleles are both expressed; incomplete dominance gives an intermediate product.", "Not this: they are different.", "Not this: both alleles show in codominance.", "Not this: intermediate means a blend."]}, {"tag": "M8·Q35", "mid": "m08", "difficulty": "devil", "section": "Incomplete dominance", "qt": "single", "source": "Module 4-10, slide 51", "qc": "A cross gives 25 red, 52 intermediate and 23 white offspring. What is the best interpretation?", "options": ["Complete dominance, close to a 3:1 ratio", "A dihybrid cross giving a 9:3:3:1 ratio", "Incomplete dominance, close to 1:2:1", "Dominant epistasis, giving a 12:3:1 ratio"], "correct_index": 2, "explanations": ["Not this: three classes do not match 3:1.", "Not this: three classes do not match four.", "Correct. 25:52:23 is near 25:50:25.", "Not this: dominant epistasis gives 12:3:1."]}, {"tag": "M8·Q36", "mid": "m08", "difficulty": "devil", "section": "Incomplete dominance", "qt": "single", "source": "Module 4-10, slide 51", "qc": "Why does a 3:1 expectation fail under incomplete dominance?", "options": ["The alleles are lost in the heterozygous offspring entirely", "The two genes are linked on one chromosome pair here", "All of the offspring are identical in phenotype and genotype", "Heterozygotes differ from both homozygotes, giving three classes"], "correct_index": 3, "explanations": ["Not this: no allele is lost.", "Not this: linkage is not the reason.", "Not this: the offspring clearly differ in phenotype.", "Correct. Intermediate heterozygotes split the dominant class."]}, {"tag": "M8·Q37", "mid": "m08", "difficulty": "easy", "section": "Lethal genes", "qt": "single", "source": "Module 4-10, slide 53", "qc": "What are lethal genes?", "options": ["Genes that make the individual grow taller than normal", "Genes that create new alleles in each generation", "Genes whose effect is the death of the individual before maturity", "Genes that are found only on the Y chromosome in all male animals"], "correct_index": 2, "explanations": ["Not this: height is not the point.", "Not this: mutation creates alleles.", "Correct. Lethal genes cause death before maturity.", "Not this: they occur on any chromosome."]}, {"tag": "M8·Q38", "mid": "m08", "difficulty": "medium", "section": "Lethal genes", "qt": "single", "source": "Module 4-10, slide 53", "qc": "What is a fully dominant lethal allele?", "options": ["One that kills only homozygotes while sparing every heterozygote carrier", "One that kills only the female offspring of a cross", "One that has no effect on the survival of the carrier", "One that kills in both the homozygous and heterozygous conditions"], "correct_index": 3, "explanations": ["Not this: that describes a recessive lethal.", "Not this: sex is not stated.", "Not this: it does have an effect.", "Correct. A single copy is enough to kill."]}, {"tag": "M8·Q39", "mid": "m08", "difficulty": "medium", "section": "Lethal genes", "qt": "single", "source": "Module 4-10, slide 54", "qc": "What is the effect of a recessive lethal gene in the heterozygous condition?", "options": ["No effect, but it may show when two carriers mate", "Death of the heterozygote before it can mature", "Sterility of the carrier in both the male and female", "A change of sex in the carrier's own offspring"], "correct_index": 0, "explanations": ["Correct. Carriers survive but can produce affected offspring.", "Not this: heterozygous carriers survive and show no effect.", "Not this: fertility is not stated.", "Not this: sex is not changed."]}, {"tag": "M8·Q40", "mid": "m08", "difficulty": "medium", "section": "Lethal genes", "qt": "single", "source": "Module 4-10, slide 55", "qc": "What happens to a mutant dominant lethal allele in the population?", "options": ["It accumulates steadily over many successive generations", "It is removed in the same generation in which it arose", "It is passed on to every one of the offspring", "It becomes recessive after a single generation"], "correct_index": 1, "explanations": ["Not this: it does not accumulate.", "Correct. Carriers die before reproducing.", "Not this: carriers do not reproduce.", "Not this: it does not change dominance."]}, {"tag": "M8·Q41", "mid": "m08", "difficulty": "hard", "section": "Lethal genes", "qt": "single", "source": "Module 4-10, slide 54", "qc": "Why does a dominant lethal allele rarely pass to the next generation?", "options": ["Individuals with it die before they can leave progeny", "It cannot be inherited by any of the offspring", "It changes into a recessive allele in the zygote", "It affects only the gametes and not the rest of the body"], "correct_index": 0, "explanations": ["Correct. Carriers die before reproduction, so the allele is rarely passed on.", "Not this: it is heritable in principle.", "Not this: alleles do not change dominance.", "Not this: it affects the individual."]}, {"tag": "M8·Q42", "mid": "m08", "difficulty": "hard", "section": "Lethal genes", "qt": "single", "source": "Module 4-10, slide 54", "qc": "How can a dominant lethal allele be passed on at all?", "options": ["If it is carried only on the Y chromosome of males", "If its effect is delayed until after reproduction", "If it is also recessive in the heterozygote", "If it is linked to two genes"], "correct_index": 1, "explanations": ["Not this: the chromosome is not the reason.", "Correct. Some dominant lethals have a delayed effect.", "Not this: A recessive allele is a different class.", "Not this: linkage is not the reason."]}, {"tag": "M8·Q43", "mid": "m08", "difficulty": "hard", "section": "Lethal genes", "qt": "single", "source": "Module 4-10, slide 54; general", "qc": "Two carriers of a recessive lethal allele mate. What fraction of their zygotes are expected to be homozygous for it?", "options": ["One half", "Three quarters", "One quarter", "None"], "correct_index": 2, "explanations": ["Not this: one half would be carriers.", "Not this: three quarters carry at least one copy of the normal allele.", "Correct. A carrier × carrier cross gives 1/4 homozygotes.", "Not this: some will be homozygous."]}, {"tag": "M8·Q44", "mid": "m08", "difficulty": "hard", "section": "Lethal genes", "qt": "single", "source": "Module 4-10, slide 54", "qc": "A recessive lethal gene is carried in the heterozygous condition. Why is it hard to eliminate from a population?", "options": ["It is a dominant allele that kills every carrier", "It mutates back to normal in every single generation", "It affects only males and never any of the females", "Carriers show no effect, so selection does not remove them"], "correct_index": 3, "explanations": ["Not this: it is recessive.", "Not this: mutation is not the reason.", "Not this: it affects both sexes.", "Correct. Heterozygous carriers survive and reproduce."]}, {"tag": "M8·Q45", "mid": "m08", "difficulty": "devil", "section": "Lethal genes", "qt": "single", "source": "Module 4-10, slide 55", "qc": "Why is a dominant lethal mutation lost in the same generation while a recessive lethal can persist?", "options": ["The dominant lethal is always linked to a sex chromosome in humans", "The recessive lethal kills only the heterozygous carriers", "A dominant kills every carrier; a recessive hides in survivors", "Both of them persist equally well in the population"], "correct_index": 2, "explanations": ["Not this: sex linkage is not the explanation.", "Not this: A recessive lethal does not kill heterozygotes.", "Correct. Hidden alleles in carriers persist.", "Not this: they do not persist equally."]}, {"tag": "M8·Q46", "mid": "m08", "difficulty": "devil", "section": "Lethal genes", "qt": "single", "source": "Module 4-10, slide 54; general", "qc": "Two carriers of a recessive lethal allele mate and the homozygotes die before birth. What ratio of carriers to normal homozygotes is expected among the survivors?", "options": ["1 carrier : 1 normal", "3 carriers : 1 normal", "All carriers", "2 carriers : 1 normal"], "correct_index": 3, "explanations": ["Not this: 1:1 is not the result of this cross.", "Not this: 3:1 counts the dead class.", "Not this: some survivors are normal.", "Correct. Of the surviving three quarters, two thirds are carriers."]}, {"tag": "M8·Q47", "mid": "m08", "difficulty": "easy", "section": "Allele symbols and dominance hierarchies", "qt": "single", "source": "Module 4-10, slide 58", "qc": "Which rabbit coat colour allele is dominant to all the others in the series?", "options": ["C (full colour)", "cch (chinchilla)", "ch (himalayan)", "c (albino)"], "correct_index": 0, "explanations": ["Correct. C is dominant to the three mutant alleles.", "Not this: cch is recessive to C.", "Not this: ch is recessive to C.", "Not this: c is recessive to all."]}, {"tag": "M8·Q48", "mid": "m08", "difficulty": "medium", "section": "Allele symbols and dominance hierarchies", "qt": "single", "source": "Module 4-10, slide 59", "qc": "What is the order of dominance of the rabbit coat colour alleles?", "options": ["c > ch > cch > C", "C > cch > ch > c", "cch > C > ch > c", "C > ch > cch > c"], "correct_index": 1, "explanations": ["Not this: that reverses the series.", "Correct. The gradation is C > cch > ch > c.", "Not this: C is the top allele.", "Not this: cch is dominant to ch."]}, {"tag": "M8·Q49", "mid": "m08", "difficulty": "medium", "section": "Allele symbols and dominance hierarchies", "qt": "single", "source": "Module 4-10, slide 58", "qc": "What genotype does an albino rabbit have?", "options": ["C C", "cch c", "ch c", "cc"], "correct_index": 3, "explanations": ["Not this: CC is full colour.", "Not this: cch c is chinchilla.", "Not this: ch c is himalayan.", "Correct. Albino is homozygous for the recessive allele."]}, {"tag": "M8·Q50", "mid": "m08", "difficulty": "medium", "section": "Allele symbols and dominance hierarchies", "qt": "single", "source": "Module 4-10, slide 58", "qc": "What does the himalayan (ch) rabbit phenotype look like?", "options": ["Fully pigmented over the whole of the body", "Mixed coloured with grey and brown patches", "White with black tips on the extremities", "Without any pigment in either the coat or the eyes"], "correct_index": 2, "explanations": ["Not this: that is full colour.", "Not this: that is chinchilla.", "Correct. Himalayan rabbits are white with dark extremities.", "Not this: that is albino."]}, {"tag": "M8·Q51", "mid": "m08", "difficulty": "hard", "section": "Allele symbols and dominance hierarchies", "qt": "single", "source": "Module 4-10, slide 59; general", "qc": "A full-colour rabbit (c c) is mated with an albino rabbit (c c). What phenotypic ratio is expected among the offspring?", "options": ["1 full colour : 1 albino", "1 chinchilla :
