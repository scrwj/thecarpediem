"correct_index": 3, "explanations": ["Not this: this reverses the two terms.", "Not this: only the masking gene is epistatic here.", "Not this: only the masked gene is hypostatic here.", "Correct. The masking gene is epistatic and the masked gene is hypostatic."]}, {"tag": "M4·Q16", "mid": "m04", "difficulty": "devil", "section": "Epistasis: the basic idea", "qt": "single", "source": "Genetics 4-6, slide 14", "qc": "A student says epistasis is just very strong dominance. What is the best correction?", "options": ["Dominance is between alleles of one gene; epistasis is between different genes", "Epistasis is simply dominance that occurs only in homozygous individuals", "Dominance requires two different genes to interact with each other", "Epistasis acts only on recessive alleles of a single gene"], "correct_index": 0, "explanations": ["Correct. The lecture says epistasis should not be confused with dominance.", "Not this: epistasis is not limited to homozygotes or defined by dominance.", "Not this: dominance involves one gene with two alleles.", "Not this: epistasis can involve a dominant allele masking another gene."]}, {"tag": "M4·Q17", "mid": "m04", "difficulty": "devil", "section": "Epistasis: the basic idea", "qt": "single", "source": "Genetics 4-6, slide 4", "qc": "Does gene interaction require the products of different genes to interact directly with each other?", "options": ["Yes; the gene products must bind directly to each other in the cell", "No; the combined function of many gene products contributes to one phenotype", "Yes; the genes must lie on the same chromosome of the pair", "No; gene interaction simply means the genes are physically linked"], "correct_index": 1, "explanations": ["Not this: direct binding is not required.", "Correct. The lecture says interaction does not necessarily mean direct contact.", "Not this: interacting genes are assumed unlinked, not on one chromosome.", "Not this: linkage is excluded by the assumptions."]}, {"tag": "M4·Q18", "mid": "m04", "difficulty": "devil", "section": "Epistasis: the basic idea", "qt": "single", "source": "Genetics 4-6, slide 16", "qc": "Which observation would point to epistasis rather than ordinary independent assortment in a dihybrid F2?", "options": ["Fewer than four phenotypic classes, with ratio parts summing to 16", "Exactly nine genotypes among the F2 plants", "Four phenotypic classes in a 9:3:3:1 ratio of the F2", "All of the offspring resembling the dominant parent in the F1 and F2"], "correct_index": 0, "explanations": ["Correct. Modified ratios such as 12:3:1, 9:3:4 and 9:7 still sum to 16.", "Not this: nine genotypes occur in any dihybrid F2.", "Not this: four phenotypes in 9:3:3:1 is the unmodified ratio.", "Not this: all offspring resembling one parent would not give a ratio of this kind."]}, {"tag": "M4·Q19", "mid": "m04", "difficulty": "easy", "section": "Dominant epistasis (12:3:1)", "qt": "single", "source": "Genetics 4-6, slide 20", "qc": "What F2 ratio is produced by dominant epistasis?", "options": ["9:3:4", "9:7", "12:3:1", "9:3:3:1"], "correct_index": 2, "explanations": ["Not this: 9:3:4 is recessive epistasis.", "Not this: 9:7 is duplicative recessive genes.", "Correct. Dominant epistasis modifies 9:3:3:1 into 12:3:1.", "Not this: 9:3:3:1 is the unmodified ratio."]}, {"tag": "M4·Q20", "mid": "m04", "difficulty": "medium", "section": "Dominant epistasis (12:3:1)", "qt": "single", "source": "Genetics 4-6, slide 19", "qc": "Under dominant epistasis by the A locus, which genotype at the epistatic locus lets the alleles of the B locus be expressed?", "options": ["AA", "Aa", "A-", "aa"], "correct_index": 3, "explanations": ["Not this: AA lets A express itself and hides B.", "Not this: aa also lets A express itself.", "Not this: A- covers AA and Aa, both epistatic.", "Correct. Only the homozygous recessive aa lets B or b show."]}, {"tag": "M4·Q21", "mid": "m04", "difficulty": "medium", "section": "Dominant epistasis (12:3:1)", "qt": "single", "source": "Genetics 4-6, slide 20", "qc": "Under dominant epistasis by the A locus, which genotypes give the same phenotype?", "options": ["aaB- and aabb", "A-B- and A-bb", "A-B- and aabb", "A-bb and aaB-"], "correct_index": 1, "explanations": ["Not this: aaB- and aabb give different phenotypes.", "Correct. The dominant A allele gives one phenotype whatever the B locus carries.", "Not this: aabb differs from A-B-.", "Not this: A-bb and aaB- are not grouped together."]}, {"tag": "M4·Q22", "mid": "m04", "difficulty": "hard", "section": "Dominant epistasis (12:3:1)", "qt": "single", "source": "Genetics 4-6, slide 20", "qc": "How many phenotypes appear under dominant epistasis, and in what proportions?", "options": ["Three phenotypes in a 12:3:1 ratio", "Two phenotypes in a 13:3 ratio", "Three phenotypes in a 9:3:4 ratio", "Four phenotypes in a 9:3:3:1 ratio"], "correct_index": 0, "explanations": ["Correct. A-B- and A-bb combine to 12, leaving 3 and 1.", "Not this: the 12:3:1 ratio has three classes, not two.", "Not this: 9:3:4 is recessive epistasis.", "Not this: four classes would mean no epistasis."]}, {"tag": "M4·Q23", "mid": "m04", "difficulty": "hard", "section": "Dominant epistasis (12:3:1)", "qt": "single", "source": "Genetics 4-6, slide 20", "qc": "Of 320 F2 offspring showing dominant epistasis (12:3:1), how many are expected in the largest class?", "options": ["180", "60", "80", "240"], "correct_index": 3, "explanations": ["Not this: 180 is 9/16 of 320, the unmodified largest class.", "Not this: 60 is the 3/16 class.", "Not this: 80 is 1/4 of 320.", "Correct. 12/16 of 320 is 240."]}, {"tag": "M4·Q24", "mid": "m04", "difficulty": "hard", "section": "Dominant epistasis (12:3:1)", "qt": "single", "source": "Genetics 4-6, slide 20", "qc": "In the 12:3:1 ratio from dominant epistasis by A, which genotypes form the \"3\" class and which the \"1\" class?", "options": ["\"3\": A-bb; \"1\": aaB-", "\"3\": aabb; \"1\": A-B-", "\"3\": aaB-; \"1\": aabb", "\"3\": A-bb; \"1\": aabb"], "correct_index": 2, "explanations": ["Not this: A-bb belongs to the \"12\" class.", "Not this: aabb is the \"1\" class and A-B- is part of the \"12\".", "Correct. A- masks the B locus, so aaB- and aabb are the two remaining classes.", "Not this: A-bb is in the \"12\" class, not the \"3\"."]}, {"tag": "M4·Q25", "mid": "m04", "difficulty": "devil", "section": "Dominant epistasis (12:3:1)", "qt": "single", "source": "Genetics 4-6, slide 19", "qc": "A plant of genotype Aabb is produced in a cross with dominant epistasis of A. To which phenotype class does it belong?", "options": ["The class containing the aaB- plants", "The same class as A-B-, the largest class", "The class containing the aabb plants", "A fourth class that is separate from the rest"], "correct_index": 1, "explanations": ["Not this: aaB- plants are aa, not Aa.", "Correct. Any A- plant shows the epistatic phenotype regardless of B.", "Not this: aabb plants are aa, not Aa.", "Not this: only three classes exist."]}, {"tag": "M4·Q26", "mid": "m04", "difficulty": "devil", "section": "Dominant epistasis (12:3:1)", "qt": "single", "source": "Genetics 4-6, slide 19", "qc": "Under dominant epistasis by A, what fraction of the F2 is aa, and how does it divide?", "options": ["One quarter are aa, and all of them show the same phenotype", "Three quarters are aa: half of them aaB- and half aabb", "One sixteenth are aa, and all of those plants are aabb", "One quarter are aa: three quarters aaB-, one quarter aabb"], "correct_index": 3, "explanations": ["Not this: aaB- and aabb differ in phenotype under dominant epistasis.", "Not this: only 1/4 of the F2 is aa.", "Not this: aa includes aaB- as well as aabb.", "Correct. aa is 4/16, made of 3/16 aaB- and 1/16 aabb."]}, {"tag": "M4·Q27", "mid": "m04", "difficulty": "devil", "section": "Dominant epistasis (12:3:1)", "qt": "single", "source": "Genetics 4-6, slide 20", "qc": "Which two classes of a 9:3:3:1 data set would you merge to obtain a 12:3:1 ratio with A as the epistatic locus?", "options": ["aaB- and aabb", "A-B- and aaB-", "A-B- and A-bb", "A-bb and aabb"], "correct_index": 2, "explanations": ["Not this: merging aaB- and aabb gives 9:3:4 with A-B- and A-bb separate.", "Not this: merging A-B- and aaB- would make B, not A, the epistatic locus.", "Correct. 9 + 3 = 12, merging A-B- and A-bb.", "Not this: merging A-bb and aabb leaves 9:3:4, not 12:3:1."]}, {"tag": "M4·Q28", "mid": "m04", "difficulty": "medium", "section": "Recessive epistasis (9:3:4)", "qt": "single", "source": "Genetics 4-6, slide 21", "qc": "What F2 ratio results from recessive epistasis?", "options": ["9:3:4", "12:3:1", "9:7", "15:1"], "correct_index": 0, "explanations": ["Correct. Recessive epistasis modifies 9:3:3:1 into 9:3:4.", "Not this: 12:3:1 is dominant epistasis.", "Not this: 9:7 is duplicative recessive genes.", "Not this: 15:1 is a different two-phenotype ratio."]}, {"tag": "M4·Q29", "mid": "m04", "difficulty": "medium", "section": "Recessive epistasis (9:3:4)", "qt": "single", "source": "Genetics 4-6, slide 21", "qc": "Under recessive epistasis by aa, when can the alleles of the B locus be expressed?", "options": ["Only when the plant's genotype is homozygous aa", "Only when at least one dominant A allele is present", "Only when the plant's genotype is homozygous AA", "Only when the plant's genotype is the double recessive aabb"], "correct_index": 1, "explanations": ["Not this: aa suppresses the B locus.", "Correct. A dominant allele at the A locus is needed for B or b to show.", "Not this: aa also allows expression, not just AA.", "Not this: aabb is suppressed."]}, {"tag": "M4·Q30", "mid": "m04", "difficulty": "medium", "section": "Recessive epistasis (9:3:4)", "qt": "single", "source": "Genetics 4-6, slide 22", "qc": "In the 9:3:4 ratio from recessive epistasis by aa, which genotypes share the \"4\" class?", "options": ["A-bb and aabb", "A-B- and aaB-", "aaB- and aabb", "A-B- and A-bb"], "correct_index": 2, "explanations": ["Not this: A-bb is the \"3\" class.", "Not this: A-B- is the \"9\" class.", "Correct. aa masks the B locus, so aaB- and aabb look alike.", "Not this: these are the \"9\" and \"3\" classes."]}, {"tag": "M4·Q31", "mid": "m04", "difficulty": "hard", "section": "Recessive epistasis (9:3:4)", "qt": "single", "source": "Genetics 4-6, slide 22", "qc": "Of 480 F2 offspring showing recessive epistasis (9:3:4), how many are expected in the largest class?", "options": ["270", "90", "120", "360"], "correct_index": 0, "explanations": ["Correct. 9/16 of 480 is 270.", "Not this: 90 is the 3/16 class.", "Not this: 120 is the 4/16 class.", "Not this: 360 is 12/16, the dominant-epistasis class."]}, {"tag": "M4·Q32", "mid": "m04", "difficulty": "hard", "section": "Recessive epistasis (9:3:4)", "qt": "single", "source": "Genetics 4-6, slide 22", "qc": "Of 320 F2 offspring showing 9:3:4, how many are expected in the combined \"4\" class?", "options": ["20", "60", "180", "80"], "correct_index": 3, "explanations": ["Not this: 20 is 1/16 of 320.", "Not this: 60 is the 3/16 class.", "Not this: 180 is the 9/16 class.", "Correct. 4/16 of 320 is 80."]}, {"tag": "M4·Q33", "mid": "m04", "difficulty": "hard", "section": "Recessive epistasis (9:3:4)", "qt": "single", "source": "Genetics 4-6, slide 22", "qc": "Under recessive epistasis by aa, which genotype classes give the \"9\" and \"3\" phenotypes?", "options": ["A-B- gives the 3 and A-bb gives the 9", "A-B- gives the 9 and A-bb gives the 3", "aaB- gives the 9 and aabb gives the 3", "A-B- and A-bb both give the 9"], "correct_index": 1, "explanations": ["Not this: A-B- is the larger class.", "Correct. These two classes keep their own phenotypes.", "Not this: aaB- and aabb are merged in the \"4\" class.", "Not this: the 9 and 3 are different phenotypes."]}, {"tag": "M4·Q34", "mid": "m04", "difficulty": "devil", "section": "Recessive epistasis (9:3:4)", "qt": "single", "source": "Genetics 4-6, slide 21", "qc": "A plant of genotype aaBb is in a cross with recessive epistasis by aa. What is its phenotype class?", "options": ["The \"9\" class, with A-B- plants", "The \"4\" class, together with aaBB and aabb", "The \"3\" class, with A-bb plants", "A fifth class that is separate from all the others"], "correct_index": 1, "explanations": ["Not this: the \"9\" class needs A-B-.", "Correct. Any aa plant has the masked phenotype.", "Not this: the \"3\" class needs A-bb.", "Not this: only three phenotype classes exist."]}, {"tag": "M4·Q35", "mid": "m04", "difficulty": "devil", "section": "Recessive epistasis (9:3:4)", "qt": "single", "source": "Genetics 4-6, slide 21", "qc": "How does a 9:3:4 ratio differ in cause from a 12:3:1 ratio?", "options": ["In 9:3:4 a dominant allele masks B, but in 12:3:1 aa masks B", "They differ only because 9:3:4 requires the genes to be linked", "They differ because 12:3:1 involves no epistasis at all, whereas 9:3:4 involves strong linkage", "In 9:3:4 the recessive genotype aa masks B; in 12:3:1 a dominant allele A masks B"], "correct_index": 3, "explanations": ["Not this: in recessive epistasis it is the recessive genotype that masks.", "Not this: both assume independent assortment.", "Not this: both are epistatic ratios.", "Correct. Recessive versus dominant epistasis is the difference."]}, {"tag": "M4·Q36", "mid": "m04", "difficulty": "devil", "section": "Recessive epistasis (9:3:4)", "qt": "single", "source": "Genetics 4-6, slide 22", "qc": "An F2 of 160 plants gives 90 : 30 : 40. Which interpretation fits best?", "options": ["Recessive epistasis, with expected 90:30:40", "Dominant epistasis, with expected 120:30:10", "Duplicative recessive genes, with expected 90:70", "Independent assortment, with expected 90:30:30:10"], "correct_index": 0, "explanations": ["Correct. 160 × 9/16, 3/16 and 4/16 gives exactly 90, 30 and 40.", "Not this: 12:3:1 would give 120:30:10.", "Not this: 9:7 would give two classes.", "Not this: 9:3:3:1 would give four classes."]}, {"tag": "M4·Q37", "mid": "m04", "difficulty": "easy", "section": "Duplicative recessive genes (9:7)", "qt": "single", "source": "Genetics 4-6, slide 27", "qc": "What F2 ratio is produced by duplicative recessive genes?", "options": ["12:3:1", "9:3:4", "9:7", "3:1"], "correct_index": 2, "explanations": ["Not this: 12:3:1 is dominant epistasis.", "Not this: 9:3:4 is recessive epistasis.", "Correct. Both homozygous recessive genotypes give the same phenotype, giving 9:7.", "Not this: 3:1 is the monohybrid ratio."]}, {"tag": "M4·Q38", "mid": "m04", "difficulty": "medium", "section": "Duplicative recessive genes (9:7)", "qt": "single", "source": "Genetics 4-6, slide 27", "qc": "Under duplicative recessive genes, which genotypes give the same phenotype?", "options": ["A-B-, A-bb and aabb", "A-B- and aaB-", "aaB-, A-bb and aabb", "aaB- only"], "correct_index": 2, "explanations": ["Not this: A-B- is the \"9\" class.", "Not this: A-B- is the different phenotype.", "Correct. These three classes form the \"7\".", "Not this: aaB- is one of three classes in the \"7\"."]}, {"tag": "M4·Q39", "mid": "m04", "difficulty": "medium", "section": "Duplicative recessive genes (9:7)", "qt": "single", "source": "Genetics 4-6, slide 27", "qc": "How many phenotypes appear in a 9:7 ratio?", "options": ["Two", "Three", "Four", "One"], "correct_index": 0, "explanations": ["Correct. A-B- is one phenotype and the other classes form the second.", "Not this: three classes would be a 12:3:1 or 9:3:4 ratio.", "Not this: four classes would be 9:3:3:1.", "Not this: one class would mean no ratio."]}, {"tag": "M4·Q40", "mid": "m04", "difficulty": "hard", "section": "Duplicative recessive genes (9:7)", "qt": "single", "source": "Genetics 4-6, slide 27", "qc": "Why do all genotypes lacking a dominant allele at either locus give one phenotype in a 9:7 ratio?", "options": ["Both loci are linked, so recessive alleles are lost from the gametes", "Only aabb gives the recessive phenotype; the rest give the dominant one", "A single dominant allele at either locus alone is enough to give the other phenotype", "A recessive genotype at either locus gives one phenotype; only A-B- gives the other"], "correct_index": 3, "explanations": ["Not this: the genes are unlinked here.", "Not this: aaB- and A-bb give the recessive phenotype too.", "Not this: one dominant allele alone is not enough.", "Correct. Both dominant alleles must be present together for the different phenotype."]}, {"tag": "M4·Q41", "mid": "m04", "difficulty": "hard", "section": "Duplicative recessive genes (9:7)", "qt": "single", "source": "Genetics 4-6, slide 27", "qc": "Of 320 F2 plants showing duplicative recessive genes (9:7), how many are expected to show the \"7\" phenotype?", "options": ["80", "140", "180", "100"], "correct_index": 1, "explanations": ["Not this: 80 is 4/16 of 320.", "Correct. 7/16 of 320 is 140.", "Not this: 180 is 9/16 of 320.", "Not this: 100 does not match a class fraction."]}, {"tag": "M4·Q42", "mid": "m04", "difficulty": "hard", "section": "Duplicative recessive genes (9:7)", "qt": "single", "source": "Genetics 4-6, slide 27", "qc": "Which single genotype class forms the \"9\" in a 9:7 ratio?", "options": ["A-B-", "A-bb", "aaB-", "aabb"], "correct_index": 0, "explanations": ["Correct. Only plants with both dominant alleles show the \"9\" phenotype.", "Not this: A-bb belongs to the \"7\".", "Not this: aaB- belongs to the \"7\".", "Not this: aabb belongs to the \"7\"."]}, {"tag": "M4·Q43", "mid": "m04", "difficulty": "devil", "section": "Duplicative recessive genes (9:7)", "qt": "single", "source": "Genetics 4-6, slide 32", "qc": "Two pure lines share the same phenotype but their cross gives an F1 with a new phenotype. Which gene interaction fits best?", "options": ["Dominant epistasis, with a dominant allele in one parent masking the other gene", "Duplicative recessive genes, the parents being recessive at different loci", "Recessive epistasis, with both parents carrying A- alleles", "Independent assortment, giving a 9:3:3:1 ratio in the F2"], "correct_index": 1, "explanations": ["Not this: dominant epistasis would not give a new F1 phenotype this way.", "Correct. Complementing dominant alleles in the F1 give the new phenotype.", "Not this: recessive epistasis needs a masking aa.", "Not this: independent assortment would not explain the F1 colour change."]}, {"tag": "M4·Q44", "mid": "m04", "difficulty": "devil", "section": "Duplicative recessive genes (9:7)", "qt": "single", "source": "Genetics 4-6, slide 27", "qc": "How many genotype categories form the \"7\" class in a 9:7 ratio, and what is their total probability?", "options": ["Two categories (A-bb, aabb), totalling 7/16", "Three categories (aaB-, A-bb, aabb), totalling 9/16 of the F2", "Four categories (A-B-, aaB-, A-bb, aabb), totalling 7/16", "Three categories (aaB-, A-bb, aabb), totalling 7/16"], "correct_index": 3, "explanations": ["Not this: two categories would total 6/16 or fewer.", "Not this: 9/16 is the A-B- class alone.", "Not this: only three categories remain once A-B- is removed.", "Correct. 3/16 + 3/16 + 1/16 = 7/16."]}, {"tag": "M4·Q45", "mid": "m04", "difficulty": "medium", "section": "Solved problem: sweet pea flowers", "qt": "single", "source": "Genetics 4-6, slide 28", "qc": "Two white-flowered sweet pea strains give an F1 with only purple flowers. What does this show?", "options": ["Purple is recessive to white in the sweet pea, so the F1 looks purple", "Both of the white parents were heterozygous (AaBb)", "The two white strains carry different recessive genes that complement", "The F1 plants inherited only the white alleles from both parents"], "correct_index": 2, "explanations": ["Not this: purple appears in the F1, so white is not dominant.", "Not this: the parents were pure lines, not heterozygous.", "Correct. Each white strain is recessive at a different locus.", "Not this: the F1 has dominant alleles at both loci."]}, {"tag": "M4·Q46", "mid": "m04", "difficulty": "medium", "section": "Solved problem: sweet pea flowers", "qt": "single", "source": "Genetics 4-6, slide 30", "qc": "In the sweet pea problem the F2 had 53 purple and 43 white plants among 96. Which ratio is closest?", "options": ["9:7", "3:1", "1:1", "12:3:1"], "correct_index": 0, "explanations": ["Correct. About 8.8 : 7.2 sixteenths, which is near 9:7.", "Not this: 3:1 would give about 72 purple and 24 white.", "Not this: 1:1 would give 48 each.", "Not this: 12:3:1 has three classes."]}, {"tag": "M4·Q47", "mid": "m04", "difficulty": "hard", "section": "Solved problem: sweet pea flowers", "qt": "single", "source": "Genetics 4-6, slide 30", "qc": "Using 43/96 = x/16, what is x for the white flowers?", "options": ["About 8.8", "About 3.0", "About 12.0", "About 7.2"], "correct_index": 3, "explanations": ["Not this: 8.8 is the value for purple.", "Not this: 3.0 does not follow from the proportion.", "Not this: 12.0 does not follow from the proportion.", "Correct. 43/96 × 16 ≈ 7.2."]}, {"tag": "M4·Q48", "mid": "m04", "difficulty": "hard", "section": "Solved problem: sweet pea flowers", "qt": "single", "source": "Genetics 4-6, slide 30", "qc": "Using 53/96 = x/16, what is x for the purple flowers?", "options": ["About 7.2", "About 8.8", "About 9.6", "About 4.8"], "correct_index": 1, "explanations": ["Not this: 7.2 is the value for white.", "Correct. 53/96 × 16 ≈ 8.8.", "Not this: 9.6 is not the calculated value.", "Not this: 4.8 is not the calculated value."]}, {"tag": "M4·Q49", "mid": "m04", "difficulty": "hard", "section": "Solved problem: sweet pea flowers", "qt": "single", "source": "Genetics 4-6, slide 32", "qc": "What were the probable genotypes of the two white parental sweet pea strains?", "options": ["AABB × aabb", "AaBb × AaBb", "aaBB × AAbb", "aabb × aabb"], "correct_index": 2, "explanations": ["Not this: AABB would be purple.", "Not this: heterozygotes would not be pure white lines.", "Correct. Different homozygous recessive combinations give an all-purple F1.", "Not this: two aabb parents would give only white offspring."]}, {"tag": "M4·Q50", "mid": "m04", "difficulty": "hard", "section": "Solved problem: sweet pea flowers", "qt": "single", "source": "Genetics 4-6, slide 32", "qc": "In the sweet pea cross, which F2 genotypes give white flowers?", "options": ["aaB-, A-bb and aabb", "A-B- only", "aaBB only", "A-B- and aabb"], "correct_index": 0, "explanations": ["Correct. Any plant lacking a dominant allele at either locus is white.", "Not this: A-B- is purple.", "Not this: aaBB is only one of the white genotypes.", "Not this: A-B- is purple."]}, {"tag": "M4·Q51", "mid": "m04", "difficulty": "devil", "section": "Solved problem: sweet pea flowers", "qt": "single", "source": "Genetics 4-6, slide 32", "qc": "If one white parent in the sweet pea cross had been aabb, what would the F1 colour be?", "options": ["Purple, because every F1 plant is heterozygous at both loci and so dominant", "Purple, because the aabb genotype is dominant over all", "A mixture of purple and white, in a 1:1 ratio", "White, because the cross cannot supply dominant alleles at both loci"], "correct_index": 3, "explanations": ["Not this: A purple F1 needs A and B alleles together.", "Not this: aabb is the double recessive.", "Not this: the F1 from a homozygous cross is uniform.", "Correct. An F1 from aabb × AAbb is Aabb and lacks a B allele, so it is white."]}, {"tag": "M5·Q1", "mid": "m05", "difficulty": "easy", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 36", "qc": "How does the lecture describe a chromosome?", "options": ["A round organelle found in the cytoplasm that makes proteins for the cell", "A double membrane that surrounds and encloses the nucleus", "A thread-like entity of nucleic acid that carries genetic information", "A pair of centrioles in the cytoplasm near the nucleus"], "correct_index": 2, "explanations": ["Not this: making proteins is the job of ribosomes.", "Not this: the nuclear envelope is the membrane around the nucleus.", "Correct. A chromosome is a thread-like entity composed of nucleic acid.", "Not this: centrioles are separate cell structures."]}, {"tag": "M5·Q2", "mid": "m05", "difficulty": "easy", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 41", "qc": "How many chromosomes does a normal human somatic cell contain?", "options": ["23", "46", "44", "92"], "correct_index": 1, "explanations": ["Not this: 23 is the haploid number found in gametes.", "Correct. Human somatic cells are diploid with 46 chromosomes.", "Not this: 44 counts the autosomes only.", "Not this: 92 would be a tetraploid number."]}, {"tag": "M5·Q3", "mid": "m05", "difficulty": "easy", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 39", "qc": "What name is given to cells with half the number of chromosome sets found in somatic cells?", "options": ["Diploid (2n)", "Haploid (n)", "Triploid (3n)", "Polyploid"], "correct_index": 1, "explanations": ["Not this: diploid cells have two sets, as somatic cells do.", "Correct. Gametes are haploid cells.", "Not this: triploid cells have three sets.", "Not this: polyploid cells have more than two sets."]}, {"tag": "M5·Q4", "mid": "m05", "difficulty": "medium", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 41", "qc": "How are human chromosomes divided into autosomes and sex chromosomes?", "options": ["23 pairs of autosomes and no sex chromosomes", "21 pairs of autosomes and two pairs of sex chromosomes", "22 pairs of autosomes and one pair of sex chromosomes", "44 pairs of autosomes and one sex chromosome"], "correct_index": 2, "explanations": ["Not this: that leaves no room for sex chromosomes.", "Not this: humans have only one pair of sex chromosomes.", "Correct. 22 autosome pairs plus the sex chromosome pair give 46.", "Not this: there are 44 autosomes in total, not 44 pairs."]}, {"tag": "M5·Q5", "mid": "m05", "difficulty": "medium", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 42", "qc": "What is chromatin?", "options": ["The complex of DNA and protein that forms chromosomes", "The double membrane that surrounds the nucleus", "A spindle fibre made of microtubules and motor proteins", "The constricted region of a chromosome that holds chromatids"], "correct_index": 0, "explanations": ["Correct. Chromatin is the nucleoprotein material of the chromosome.", "Not this: the nuclear envelope is the membrane.", "Not this: spindle fibres are microtubules.", "Not this: the constriction is the centromere."]}, {"tag": "M5·Q6", "mid": "m05", "difficulty": "medium", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 43", "qc": "What do histones do in a chromosome?", "options": ["They copy the DNA of each chromosome during S phase", "They move the chromosomes along the spindle fibres", "They cut the sister chromatids apart at the start of anaphase", "They help organise the long DNA strands into nucleosomes"], "correct_index": 3, "explanations": ["Not this: copying DNA is done by replication enzymes.", "Not this: movement is by spindle microtubules.", "Not this: chromatid separation follows centromere division.", "Correct. Histones organise DNA into nucleosome structures."]}, {"tag": "M5·Q7", "mid": "m05", "difficulty": "medium", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 47", "qc": "Which arm of a chromosome is called the p arm?", "options": ["The longer arm", "The shorter arm", "The arm closest to the telomere only", "The arm that carries the centromere"], "correct_index": 1, "explanations": ["Not this: the longer arm is the q arm.", "Correct. The shorter arm is p and the longer is q.", "Not this: both arms end at telomeres, so this is not a distinction.", "Not this: the centromere lies between the arms."]}, {"tag": "M5·Q8", "mid": "m05", "difficulty": "medium", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 40", "qc": "A garden pea has 14 somatic chromosomes. How many chromosomes does one of its gametes carry?", "options": ["14", "28", "3", "7"], "correct_index": 3, "explanations": ["Not this: 14 is the somatic (diploid) number.", "Not this: 28 would be a tetraploid number.", "Not this: 3 is not half of 14.", "Correct. A gamete is haploid, so 14/2 = 7."]}, {"tag": "M5·Q9", "mid": "m05", "difficulty": "hard", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 37", "qc": "A human somatic cell has 46 chromosomes. How many came from each parent?", "options": ["23 from each parent", "46 from the mother", "23 from the mother and 23 from nobody", "44 from the mother and 2 from the father"], "correct_index": 0, "explanations": ["Correct. One set comes from each parent, so 23 each.", "Not this: both parents each contribute a set.", "Not this: A diploid cell needs both sets.", "Not this: each parent contributes equally, 23 chromosomes."]}, {"tag": "M5·Q10", "mid": "m05", "difficulty": "hard", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 45", "qc": "Which two criteria are listed for distinguishing chromosomes from one another?", "options": ["The colour and the shape of the cell nucleus", "The number of mitochondria and ribosomes in the cell", "Relative length and the position of the centromere", "The number of cell divisions the cell has completed"], "correct_index": 2, "explanations": ["Not this: nuclear colour does not distinguish chromosomes.", "Not this: organelle counts are unrelated.", "Correct. Length and centromere position are the criteria.", "Not this: division count does not identify chromosomes."]}, {"tag": "M5·Q11", "mid": "m05", "difficulty": "hard", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 46", "qc": "Which of these is NOT a chromosome type named by centromere position in the lecture?", "options": ["Metacentric", "Polycentric", "Acrocentric", "Telocentric"], "correct_index": 1, "explanations": ["Not this: metacentric is listed.", "Correct. The lecture names metacentric, submetacentric, acrocentric, telocentric and subtelocentric.", "Not this: acrocentric is listed.", "Not this: telocentric is listed."]}, {"tag": "M5·Q12", "mid": "m05", "difficulty": "hard", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 40", "qc": "Why do all somatic cells of a species have the same chromosome number?", "options": ["The somatic chromosome number is characteristic of the species", "Chromosome number depends on the age and the sex of the individual", "Each tissue of the body keeps a different number", "Gametes keep the full somatic number of the species"], "correct_index": 0, "explanations": ["Correct. The number in each somatic cell is the same for all members of a species.", "Not this: age does not change the number.", "Not this: tissues share the same number.", "Not this: gametes have half the somatic number."]}, {"tag": "M5·Q13", "mid": "m05", "difficulty": "hard", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 40", "qc": "Cattle have 60 somatic chromosomes. How many does a sperm cell carry?", "options": ["60", "15", "30", "120"], "correct_index": 2, "explanations": ["Not this: 60 is the somatic number.", "Not this: 15 would be a quarter.", "Correct. A gamete carries half the somatic number.", "Not this: 120 would be double."]}, {"tag": "M5·Q14", "mid": "m05", "difficulty": "hard", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 40", "qc": "Which species and somatic chromosome number pair is correct, according to the lecture?", "options": ["Human: 48", "Garden pea: 24", "Cattle: 46", "Cattle: 60"], "correct_index": 3, "explanations": ["Not this: humans have 46 chromosomes, not 48.", "Not this: the garden pea has 14, not 24.", "Not this: cattle have 60, not 46.", "Correct. The lecture gives human 46, garden pea 14 and cattle 60."]}, {"tag": "M5·Q15", "mid": "m05", "difficulty": "devil", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 39", "qc": "A cell has 14 chromosomes and is described as 2n. What are n and the number carried by each gamete?", "options": ["n = 14; each gamete carries 14 chromosomes", "n = 7; each gamete carries 7 chromosomes", "n = 28; each gamete carries 14 chromosomes", "n = 7; each gamete carries 14 chromosomes"], "correct_index": 1, "explanations": ["Not this: n is half of 2n, not equal to it.", "Correct. 2n = 14 gives n = 7, and gametes carry n.", "Not this: 2n = 14 means n = 7, not 28.", "Not this: gametes carry n, not 2n."]}, {"tag": "M5·Q16", "mid": "m05", "difficulty": "devil", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 47", "qc": "How does the lecture define autosomes?", "options": ["All chromosomes except the sex chromosomes", "The chromosomes that determine sex", "Only the shortest chromosomes", "The chromosomes found only in gametes"], "correct_index": 0, "explanations": ["Correct. Autosomes exclude the sex chromosomes.", "Not this: those are the sex chromosomes.", "Not this: length does not define autosomes.", "Not this: autosomes are in somatic cells and gametes alike."]}, {"tag": "M5·Q17", "mid": "m05", "difficulty": "devil", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 40", "qc": "An organism has 2n = 60, including one pair of sex chromosomes. How many autosomes does a somatic cell contain?", "options": ["59", "60", "58", "30"], "correct_index": 2, "explanations": ["Not this: 59 subtracts only one chromosome.", "Not this: 60 counts the sex chromosomes too.", "Correct. 60 minus the two sex chromosomes leaves 58 autosomes.", "Not this: 30 is the gamete number."]}, {"tag": "M5·Q18", "mid": "m05", "difficulty": "devil", "section": "Chromosomes and chromatin", "qt": "single", "source": "Genetics 4-6, slide 37", "qc": "Why are the two chromosomes of a homologous pair called homologues?", "options": ["Both of the chromosomes came from the very same single parent of the cell", "They are identical sister chromatids of one chromosome", "They are non-comparable chromosomes from different species", "One came from the maternal parent and one from the paternal parent"], "correct_index": 3, "explanations": ["Not this: homologues come from different parents.", "Not this: sister chromatids are copies of one chromosome.", "Not this: homologues carry comparable genes.", "Correct. A homologous pair is one maternal and one paternal chromosome."]}, {"tag": "M5·Q19", "mid": "m05", "difficulty": "easy", "section": "Cell cycle and interphase", "qt": "single", "source": "Genetics 4-6, slide 52", "qc": "What are the three phases of interphase?", "options": ["G1, S and G2", "G1, M and G2", "Prophase, metaphase and anaphase", "S, M and cytokinesis"], "correct_index": 0, "explanations": ["Correct. Interphase consists of G1, S and G2.", "Not this: M is mitosis, which is not part of interphase.", "Not this: those are stages of mitosis.", "Not this: M and cytokinesis are not in interphase."]}, {"tag": "M5·Q20", "mid": "m05", "difficulty": "easy", "section": "Cell cycle and interphase", "qt": "single", "source": "Genetics 4-6, slide 53", "qc": "In which phase of interphase are chromosomes replicated?", "options": ["G1 phase", "G2 phase", "M phase", "S phase"], "correct_index": 3, "explanations": ["Not this: G1 prepares for DNA synthesis.", "Not this: G2 prepares for mitosis.", "Not this: M phase is mitosis.", "Correct. Chromosomes are copied only during S phase."]}, {"tag": "M5·Q21", "mid": "m05", "difficulty": "medium", "section": "Cell cycle and interphase", "qt": "single", "source": "Genetics 4-6, slide 55", "qc": "What are \"sister chromatids\"?", "options": ["The two homologous chromosomes inherited from the mother and the father", "The identical DNA molecules produced when a chromosome is replicated", "Two different chromosomes that came from different parents", "Two centrioles found together in an animal cell"], "correct_index": 1, "explanations": ["Not this: homologues are maternal and paternal chromosomes.", "Correct. Replication gives an identical pair of chromatids.", "Not this: different parents give homologues, not sisters.", "Not this: centrioles are cell organelles."]}, {"tag": "M5·Q22", "mid": "m05", "difficulty": "medium", "section": "Cell cycle and interphase", "qt": "single", "source": "Genetics 4-6, slide 56", "qc": "What is the cell doing in G1?", "options": ["Dividing its cytoplasm", "Separating sister chromatids", "Preparing for DNA synthesis", "Forming the cell plate"], "correct_index": 2, "explanations": ["Not this: cytoplasm division is cytokinesis.", "Not this: chromatid separation is anaphase.", "Correct. G1 prepares the cell for DNA synthesis.", "Not this: the cell plate forms in plant cytokinesis."]}, {"tag": "M5·Q23", "mid": "m05", "difficulty": "medium", "section": "Cell cycle and interphase", "qt": "single", "source": "Genetics 4-6, slide 56", "qc": "What begins to happen to chromosomes during G2?", "options": ["They are replicated for the first time", "They begin to condense into compact bodies", "They move to the spindle poles", "They are separated into daughter cells"], "correct_index": 1, "explanations": ["Not this: replication occurs in S.", "Correct. Condensation begins in G2.", "Not this: pole movement is in anaphase.", "Not this: daughter cells form after telophase."]}, {"tag": "M5·Q24", "mid": "m05", "difficulty": "medium", "section": "Cell cycle and interphase", "qt": "single", "source": "Genetics 4-6, slide 58", "qc": "Which phase of the cell cycle is the shortest?", "options": ["Mitosis", "G1", "S", "G2"], "correct_index": 0, "explanations": ["Correct. Mitosis takes about one hour of an 18 to 24 hour cycle.", "Not this: G1 is 6 to 12 hours.", "Not this: S is 6 to 8 hours.", "Not this: G2 is 3 to 4 hours."]}, {"tag": "M5·Q25", "mid": "m05", "difficulty": "hard", "section": "Cell cycle and interphase", "qt": "single", "source": "Genetics 4-6, slide 58", "qc": "In an ideal animal cell with an 18 to 24 hour cycle, about how long does mitosis take?", "options": ["About 6 hours", "About 12 hours", "About 1 hour", "About 18 hours"], "correct_index": 2, "explanations": ["Not this: 6 hours is closer to a G1 length.", "Not this: 12 hours is the upper G1 length.", "Correct. The lecture gives about one hour.", "Not this: 18 hours is the lower cycle length."]}, {"tag": "M5·Q26", "mid": "m05", "difficulty": "hard", "section": "Cell cycle and interphase", "qt": "single", "source": "Genetics 4-6, slide 58", "qc": "With G1 at 6 to 12 h, S at 6 to 8 h and G2 at 3 to 4 h, what is the shortest total interphase?", "options": ["12 hours", "24 hours", "18 hours", "15 hours"], "correct_index": 3, "explanations": ["Not this: 12 hours uses only G1 maximum.", "Not this: 24 hours is the longest total.", "Not this: 18 hours is not 6 + 6 + 3.", "Correct. 6 + 6 + 3 = 15 hours."]}, {"tag": "M5·Q27", "mid": "m05", "difficulty": "hard", "section": "Cell cycle and interphase", "qt": "single", "source": "Genetics 4-6, slide 58", "qc": "With G1 at 6 to 12 h, S at 6 to 8 h and G2 at 3 to 4 h, what is the longest total interphase?", "options": ["24 hours", "15 hours", "18 hours", "21 hours"], "correct_index": 0, "explanations": ["Correct. 12 + 8 + 4 = 24 hours.", "Not this: 15 hours is the shortest total.", "Not this: 18 hours is not 12 + 8 + 4.", "Not this: 21 hours is not 12 + 8 + 4."]}, {"tag": "M5·Q28", "mid": "m05", "difficulty": "hard", "section": "Cell cycle and interphase", "qt": "single", "source": "Genetics 4-6, slide 58", "qc": "In a 24 hour cell cycle with a 1 hour mitosis, what share of the cycle is interphase?", "options": ["About 4%", "About 50%", "About 96%", "About 75%"], "correct_index": 2, "explanations": ["Not this: 4% is roughly the share for mitosis.", "Not this: 50% would mean 12 hours of mitosis.", "Correct. 23/24 is about 96%.", "Not this: 75% would mean 6 hours of mitosis."]}, {"tag": "M5·Q29", "mid": "m05", "difficulty": "hard", "section": "Cell cycle and interphase", "qt": "single", "source": "Genetics 4-6, slide 57", "qc": "Why are interphase chromosomes not visible under the light microscope?", "options": ["They are absent from the nucleus", "They are replaced by spindle fibres", "They are hidden inside the centrioles", "They are not yet condensed"], "correct_index": 3, "explanations": ["Not this: chromosomes are present, just uncondensed.", "Not this: spindle fibres form later.", "Not this: centrioles do not hide chromosomes.", "Correct. Interphase is the part of the cell cycle in which condensed chromosomes are not visible."]}, {"tag": "M5·Q30", "mid": "m05", "difficulty": "hard", "section": "Cell cycle and interphase", "qt": "single", "source": "Genetics 4-6, slide 56", "qc": "Once a cell enters G1 of the cell cycle, what is it committed to?", "options": ["Dying", "Completing the cycle", "Becoming haploid", "Skipping S phase"], "correct_index": 1, "explanations": ["Not this: cell death is not stated.", "Correct. The lecture says it is committed to completing the cycle.", "Not this: the cell stays diploid.", "Not this: S phase follows G1."]}, {"tag": "M5·Q31", "mid": "m05", "difficulty": "hard", "section": "Cell cycle and interphase", "qt": "single", "source": "Genetics 4-6, slide 55", "qc": "How many DNA molecules does a replicated chromosome carry as it enters mitosis?", "options": ["One DNA molecule", "Four DNA molecules", "Two identical DNA molecules", "Three DNA molecules"], "correct_index": 2, "explanations": ["Not this: A single molecule is a pre-S chromosome.", "Not this: four would be a tetrad in meiosis.", "Correct. Each replicated chromosome has two identical sister chromatids.", "Not this: three does not arise from one replication."]}, {"tag": "M5·Q32", "mid": "m05", "difficulty": "hard", "section": "Cell cycle and interphase", "qt": "single", "source": "Genetics 4-6, slide 56", "qc": "What happens in the G2 phase?", "options": ["The chromosomes are replicated for the very first time in the cell cycle", "The chromosomes begin to condense as the cell prepares for mitosis", "Sister chromatids separate and move to the poles", "Homologous chromosomes pair up and exchange segments"], "correct_index": 1, "explanations": ["Not this: replication takes place in S phase.", "Correct. G2 prepares the cell for mitosis.", "Not this: separation happens in anaphase.", "Not this: pairing occurs in meiotic prophase I."]}, {"tag": "M5·Q33", "mid": "m05", "difficulty": "devil", "section": "Cell cycle and interphase", "qt": "single", "source": "Genetics 4-6, slide 55", "qc": "A human cell has 46 chromosomes in G1. How many chromatids does it contain just after S phase?", "options": ["92", "46", "23", "184"], "correct_index": 0, "explanations": ["Correct. Each of 46 chromosomes now has two sister chromatids, giving 92.", "Not this: 46 is the chromosome number, which is unchanged.", "Not this: 23 is the haploid number.", "Not this: 184 doubles the correct chromatid count."]}, {"tag": "M5·Q34", "mid": "m05", "difficulty": "devil", "section": "Cell cycle and interphase", "qt": "single", "source": "Genetics 4-6, slide 55", "qc": "A student says the chromosome number doubles in S phase. What is the correct statement?", "options": ["The chromosome number doubles and the DNA stays the same", "Both the chromosome number and the DNA are halved", "Chromosome number doubles because the nucleus divides", "The DNA content doubles, but the chromosome number stays the same"], "correct_index": 3, "explanations": ["Not this: it is the DNA that doubles.", "Not this: neither is halved in S phase.", "Not this: the nucleus does not divide in S.", "Correct. Replication gives sister chromatids, but each is still part of one chromosome."]}, {"tag": "M5·Q35", "mid": "m05", "difficulty": "devil", "section": "Cell cycle and interphase", "qt": "single", "source": "Genetics 4-6, slide 54", "qc": "Why does a cell spend most of its life in interphase?", "options": ["Interphase is the only phase of the cycle in which cells divide", "Cells cannot enter mitosis more than once in their life", "Mitosis is short, about an hour of an 18 to 24 hour cycle", "The cell cycle consists only of the G1 phase and nothing else"], "correct_index": 2, "explanations": ["Not this: division happens in mitosis, not interphase.", "Not this: cells can divide repeatedly.", "Correct. Mitosis is the shortest phase.", "Not this: the cycle has several phases."]}, {"tag": "M5·Q36", "mid": "m05", "difficulty": "devil", "section": "Cell cycle and interphase", "qt": "multiple completion", "source": "slides 53-58", "qc": "Which statements about interphase are correct?\n1. Chromosomes are replicated only in S phase.\n2. Condensed chromosomes are clearly visible under the light microscope.\n3. A cell spends most of its life in interphase.", "options": ["1, 2 and 3", "1 and 3 only", "2 and 3 only", "1 and 2 only"], "correct_index": 1, "explanations": ["Not this: statement 2 is false, because interphase chromosomes are not condensed.", "Correct. Replication is limited to S phase and most of the cell's life is interphase.", "Not this: statement 2 is false and statement 1 is true.", "Not this: statement 2 is false and statement 3 is true."]}, {"tag": "M5·Q37", "mid": "m05", "difficulty": "easy", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 48", "qc": "One cell divides by mitosis. How many daughter cells result?", "options": ["One", "Three", "Four", "Two"], "correct_index": 3, "explanations": ["Not this: one cell would mean no division.", "Not this: three is not produced.", "Not this: four is the product of meiosis.", "Correct. Mitosis gives two daughter cells with identical chromosome sets."]}, {"tag": "M5·Q38", "mid": "m05", "difficulty": "easy", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 51", "qc": "What is the correct order of the four stages of mitosis?", "options": ["Metaphase, prophase, anaphase, telophase", "Prophase, metaphase, anaphase, telophase", "Prophase, anaphase, metaphase, telophase", "Telophase, prophase, metaphase, anaphase"], "correct_index": 1, "explanations": ["Not this: prophase comes before metaphase.", "Correct. The four stages run P, M, A, T.", "Not this: metaphase comes before anaphase.", "Not this: telophase is the last stage."]}, {"tag": "M5·Q39", "mid": "m05", "difficulty": "medium", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 64", "qc": "Which stage of mitosis is marked by chromosome condensation and the breakdown of the nuclear envelope?", "options": ["Prophase", "Metaphase", "Anaphase", "Telophase"], "correct_index": 0, "explanations": ["Correct. Prophase condenses chromosomes and breaks down the envelope.", "Not this: metaphase aligns chromosomes.", "Not this: anaphase separates chromatids.", "Not this: telophase reforms nuclei."]}, {"tag": "M5·Q40", "mid": "m05", "difficulty": "medium", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 65", "qc": "At which stage do sister chromatids align at the spindle equator?", "options": ["Metaphase", "Prophase", "Anaphase", "Telophase"], "correct_index": 0, "explanations": ["Correct. Metaphase begins when sister chromatids align at the equator.", "Not this: prophase condenses chromosomes.", "Not this: anaphase pulls chromatids apart.", "Not this: telophase reforms nuclei."]}, {"tag": "M5·Q41", "mid": "m05", "difficulty": "medium", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 66", "qc": "At which stage do sister chromatids separate at the centromere?", "options": ["Prophase", "Anaphase", "Metaphase", "Telophase"], "correct_index": 1, "explanations": ["Not this: prophase condenses chromosomes.", "Correct. Sister chromatids separate during anaphase.", "Not this: metaphase aligns them.", "Not this: telophase reforms nuclei."]}, {"tag": "M5·Q42", "mid": "m05", "difficulty": "medium", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 69", "qc": "What happens in telophase?", "options": ["Chromosomes condense and the nucleolus disappears", "Chromosomes align at the equator of the spindle", "Nuclear membranes reform and the nucleolus reappears", "Sister chromatids separate and move to opposite poles"], "correct_index": 2, "explanations": ["Not this: condensation and nucleolus loss are prophase.", "Not this: alignment is metaphase.", "Correct. Telophase reverses prophase events.", "Not this: separation is anaphase."]}, {"tag": "M5·Q43", "mid": "m05", "difficulty": "medium", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 71", "qc": "What is cytokinesis?", "options": ["The replication of the DNA of every chromosome in the cell", "The pairing of homologous chromosomes in prophase I", "The condensation of chromosomes into compact bodies", "The physical division of the cytoplasm into two cells"], "correct_index": 3, "explanations": ["Not this: DNA replication occurs in S phase.", "Not this: pairing is synapsis in meiosis.", "Not this: condensation is prophase.", "Correct. Cytokinesis divides the cytoplasm."]}, {"tag": "M5·Q44", "mid": "m05", "difficulty": "medium", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 71", "qc": "How does cytokinesis in plant cells differ from that in animal cells?", "options": ["Plant cells pinch in two, while animal cells form a cell plate", "Neither plant nor animal cells actually divide their cytoplasm", "Plant cells need centrioles to divide, while animal cells do not", "Plant cells form a cell plate, while animal cells pinch in two"], "correct_index": 3, "explanations": ["Not this: this reverses the two cell types.", "Not this: cytoplasm divides in both.", "Not this: plant cells have no centrioles.", "Correct. Rigid cell walls mean plants form a partition between daughter cells."]}, {"tag": "M5·Q45", "mid": "m05", "difficulty": "hard", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 59", "qc": "Which cells do not contain centrioles?", "options": ["Plant cells", "Animal cells", "Cells in prophase", "Cells in telophase"], "correct_index": 0, "explanations": ["Correct. The lecture notes that plant cells do not contain centrioles.", "Not this: animal cells contain centrioles.", "Not this: prophase is a stage, not a cell type.", "Not this: telophase is a stage, not a cell type."]}, {"tag": "M5·Q46", "mid": "m05", "difficulty": "hard", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 63", "qc": "Why is late prophase the best time to study and count chromosomes?", "options": ["Chromosomes have already separated and formed two daughter nuclei", "The spindle has already disappeared from the cell", "Chromosomes are highly condensed and free of the nuclear membrane", "The chromosomes are not yet replicated at that point"], "correct_index": 2, "explanations": ["Not this: separation happens later in anaphase.", "Not this: the spindle is present in late prophase.", "Correct. Condensed chromosomes outside a nuclear membrane are easiest to count.", "Not this: replication is complete by then."]}, {"tag": "M5·Q47", "mid": "m05", "difficulty": "hard", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 63", "qc": "What does colchicine do to a dividing cell?", "options": ["It prevents the DNA from replicating during S phase of interphase", "It blocks spindle fibre assembly, so mitosis stops before metaphase", "It dissolves the cell wall that surrounds each plant cell", "It makes the sister chromatids separate earlier than normal"], "correct_index": 1, "explanations": ["Not this: replication occurs before mitosis.", "Correct. Blocking the spindle arrests mitosis before metaphase.", "Not this: the cell wall is not targeted.", "Not this: chromatids cannot separate without a spindle."]}, {"tag": "M5·Q48", "mid": "m05", "difficulty": "hard", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 67", "qc": "What shape do metacentric chromosomes appear to have when moving in anaphase?", "options": ["J-shaped", "V-shaped", "Rod-shaped", "Ring-shaped"], "correct_index": 1, "explanations": ["Not this: J-shaped chromosomes are submetacentric.", "Correct. Metacentric chromosomes appear V-shaped.", "Not this: rod-shaped chromosomes are telocentric.", "Not this: ring shapes are not named in the lecture."]}, {"tag": "M5·Q49", "mid": "m05", "difficulty": "hard", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 67", "qc": "What shape do submetacentric chromosomes appear to have in anaphase?", "options": ["V-shaped", "Rod-shaped", "Straight and unbent", "J-shaped"], "correct_index": 3, "explanations": ["Not this: V-shaped ones are metacentric.", "Not this: rod-shaped ones are telocentric.", "Not this: the centromere position bends them.", "Correct. Submetacentric chromosomes appear J-shaped."]}, {"tag": "M5·Q50", "mid": "m05", "difficulty": "hard", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 65", "qc": "What holds sister chromatids together until the beginning of anaphase?", "options": ["The centromere", "The cell plate", "The nucleolus", "The centrioles"], "correct_index": 0, "explanations": ["Correct. The centromere holds the chromatids together.", "Not this: the cell plate forms after division.", "Not this: the nucleolus is not a chromatid link.", "Not this: centrioles organise the spindle."]}, {"tag": "M5·Q51", "mid": "m05", "difficulty": "hard", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 50", "qc": "What are the two end results of mitosis, according to the lecture?", "options": ["Halving of the chromosome number, and the formation of four haploid cells", "Pairing of homologues, and the exchange of chromosome segments", "An exact copy of each chromosome, and an identical set for each daughter cell", "Fusion of two cells into one, and a doubled chromosome number"], "correct_index": 2, "explanations": ["Not this: that describes meiosis.", "Not this: that describes prophase I of meiosis.", "Correct. Mitosis copies and then distributes identical chromosome sets.", "Not this: that describes fertilization."]}, {"tag": "M5·Q52", "mid": "m05", "difficulty": "hard", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 48", "qc": "What does it mean that mitosis is a \"non-reductional\" division?", "options": ["The cell loses half of its chromosomes and makes four daughter cells", "The cell makes four genetically different daughter cells", "The daughter cells keep the same chromosome number as the parent cell", "The chromosome number triples in each daughter cell"], "correct_index": 2, "explanations": ["Not this: halving is reductional division.", "Not this: mitosis gives two cells.", "Correct. Mitosis does not reduce the chromosome number.", "Not this: tripling does not occur."]}, {"tag": "M5·Q53", "mid": "m05", "difficulty": "hard", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 59", "qc": "In animal cells, which organelles initiate and organise the mitotic apparatus?", "options": ["Centrioles", "Ribosomes", "Mitochondria", "Lysosomes"], "correct_index": 0, "explanations": ["Correct. Centrioles form asters and spindle fibres.", "Not this: ribosomes make proteins.", "Not this: mitochondria provide energy.", "Not this: lysosomes digest materials."]}, {"tag": "M5·Q54", "mid": "m05", "difficulty": "hard", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 62", "qc": "What happens to the nuclear membrane and nucleolus by late prophase?", "options": ["Both double in size", "Both disappear", "Both move to the poles intact", "Both form around each chromosome"], "correct_index": 1, "explanations": ["Not this: they do not enlarge.", "Correct. The nuclear membrane and nucleolus disappear by late prophase.", "Not this: they do not survive as units.", "Not this: they reform in telophase, not around each chromosome."]}, {"tag": "M5·Q55", "mid": "m05", "difficulty": "devil", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 63", "qc": "A culture is treated with colchicine and examined. At which point do the cells accumulate?", "options": ["After telophase, with two daughter nuclei and divided cytoplasm in each", "In S phase, with DNA actively replicating in the cell", "In anaphase, with sister chromatids at the opposite poles", "Before metaphase, with condensed chromosomes and no functioning spindle"], "correct_index": 3, "explanations": ["Not this: telophase needs a working spindle first.", "Not this: S phase is not blocked.", "Not this: anaphase cannot occur without a spindle.", "Correct. Mitosis is arrested at the stage before metaphase."]}, {"tag": "M5·Q56", "mid": "m05", "difficulty": "devil", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 68", "qc": "At anaphase of mitosis in a human cell, how many separated chromosomes are present in the whole cell?", "options": ["92", "46", "23", "184"], "correct_index": 0, "explanations": ["Correct. 46 chromosomes had two chromatids; once separated, 92 chromosomes are counted.", "Not this: 46 is the number before separation.", "Not this: 23 is the haploid number.", "Not this: 184 doubles the count."]}, {"tag": "M5·Q57", "mid": "m05", "difficulty": "devil", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 70", "qc": "A pea cell has 14 chromosomes. How many chromosomes does each daughter nucleus receive after mitosis?", "options": ["7", "14", "28", "21"], "correct_index": 1, "explanations": ["Not this: 7 would be a haploid number.", "Correct. Mitosis gives each daughter cell the full chromosome number.", "Not this: 28 is double.", "Not this: 21 is not a mitotic number."]}, {"tag": "M5·Q58", "mid": "m05", "difficulty": "devil", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 63", "qc": "A drug stops spindle assembly in cells that are in prophase. What is the immediate result?", "options": ["Chromosomes separate early, before they have lined up at the equator", "The cell skips cytokinesis and moves directly into S phase", "The nucleolus reappears and the nuclear membrane reforms", "Chromosomes cannot align at the equator, so mitosis stalls"], "correct_index": 3, "explanations": ["Not this: separation needs a spindle.", "Not this: skipping to S phase is not the immediate effect.", "Not this: the nucleolus reappears in telophase.", "Correct. Without a spindle, alignment cannot occur."]}, {"tag": "M5·Q59", "mid": "m05", "difficulty": "devil", "section": "Mitosis", "qt": "classification", "source": "slides 64-70", "qc": "Match each stage of mitosis with its key event.\n(i) Prophase\n(ii) Metaphase\n(iii) Anaphase", "options": ["(i) Sister chromatids align; (ii) chromosomes condense; (iii) nuclei reform", "(i) Chromosomes condense; (ii) sister chromatids align at the equator; (iii) sister chromatids separate", "(i) Sister chromatids separate; (ii) chromosomes condense; (iii) chromosomes align", "(i) Nuclei reform; (ii) sister chromatids separate; (iii) chromosomes condense"], "correct_index": 1, "explanations": ["Not this: it swaps the events of prophase and metaphase.", "Correct. Prophase condenses chromosomes, metaphase aligns them, and anaphase separates the chromatids.", "Not this: it places separation under prophase and alignment under anaphase.", "Not this: nuclei reform in telophase, not prophase."]}, {"tag": "M5·Q60", "mid": "m05", "difficulty": "devil", "section": "Mitosis", "qt": "single", "source": "Genetics 4-6, slide 67", "qc": "A student sees V-shaped chromosomes moving to opposite poles. Which stage and chromosome type does this indicate?", "options": ["Metaphase, with telocentric chromosomes", "Anaphase, with telocentric chromosomes", "Anaphase, with metacentric chromosomes", "Telophase, with submetacentric chromosomes"], "correct_index": 2, "explanations": ["Not this: telocentric chromosomes are rod-shaped.", "Not this: telocentric chromosomes appear rod-shaped.", "Correct. Metacentric chromosomes appear V-shaped as they move in anaphase.", "Not this: telophase is after movement, and submetacentric ones are J-shaped."]}, {"tag": "M5·Q61", "mid": "m05", "difficulty": "easy", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 75", "qc": "How many cells does one diploid cell produce by meiosis, and with what chromosome number?", "options": ["Two cells, each diploid", "Four cells, each haploid", "Two cells, each haploid", "Four cells, each diploid"], "correct_index": 1, "explanations": ["Not this: two diploid cells describe mitosis.", "Correct. Meiosis gives four haploid cells.", "Not this: two haploid cells describe the end of meiosis I.", "Not this: meiosis halves the number, so cells are not diploid."]}, {"tag": "M5·Q62", "mid": "m05", "difficulty": "easy", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 75", "qc": "How many DNA replications occur in meiosis?", "options": ["Two", "Three", "None", "One"], "correct_index": 3, "explanations": ["Not this: two replications would double DNA again.", "Not this: there is no third replication.", "Not this: replication does occur before meiosis I.", "Correct. Meiosis involves a single DNA replication and two divisions."]}, {"tag": "M5·Q63", "mid": "m05", "difficulty": "medium", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 77", "qc": "What is synapsis?", "options": ["The side-by-side pairing of homologous chromosomes", "The separation of the sister chromatids at the start of anaphase II", "The exchange of cytoplasm between two adjacent cells", "The condensation of a single chromosome into a rod"], "correct_index": 0, "explanations": ["Correct. Synapsis is the pairing of homologues.", "Not this: separation of sister chromatids is anaphase II.", "Not this: cytoplasm division is cytokinesis.", "Not this: condensation is a separate event."]}, {"tag": "M5·Q64", "mid": "m05", "difficulty": "medium", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 77", "qc": "What is a bivalent?", "options": ["A single chromosome made of one chromatid only", "A pair of sister chromatids that are still joined at one centromere", "A pair of synapsed homologous chromosomes, also called a tetrad", "A single chromosome that has two centromeres"], "correct_index": 2, "explanations": ["Not this: A single chromosome is not a bivalent.", "Not this: daughter cells are not bivalents.", "Correct. Two chromosomes (four chromatids) make a bivalent or tetrad.", "Not this: A bivalent is a pair of chromosomes."]}, {"tag": "M5·Q65", "mid": "m05", "difficulty": "medium", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 79", "qc": "During which stage does crossing over occur?", "options": ["Metaphase I", "Anaphase II", "Telophase II", "Prophase I of meiosis"], "correct_index": 3, "explanations": ["Not this: metaphase I aligns bivalents.", "Not this: anaphase II separates sister chromatids.", "Not this: telophase II reforms nuclei.", "Correct. Crossing over takes place in prophase I."]}, {"tag": "M5·Q66", "mid": "m05", "difficulty": "medium", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 99", "qc": "What is the function of the synaptonemal complex?", "options": ["To make the spindle fibres that pull the chromosomes to the poles", "To copy DNA before the first meiotic division", "To let interacting chromatids complete their crossing over", "To divide the cytoplasm after the nuclear division"], "correct_index": 2, "explanations": ["Not this: spindle fibres are microtubules.", "Not this: DNA copying is replication.", "Correct. It supports crossing over.", "Not this: cytoplasm division is cytokinesis."]}, {"tag": "M5·Q67", "mid": "m05", "difficulty": "medium", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 100", "qc": "What is a chiasma?", "options": ["The point where homologous non-sister chromatids exchange segments", "The point where spindle fibres attach to the centromere of each chromosome", "The pinch that divides the cytoplasm of animal cells", "The gap that separates two neighbouring daughter cells"], "correct_index": 0, "explanations": ["Correct. Chiasmata mark crossing over.", "Not this: spindle attachment is at the centromere.", "Not this: the cleavage furrow divides animal cells.", "Not this: A chiasma is within a bivalent."]}, {"tag": "M5·Q68", "mid": "m05", "difficulty": "hard", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 81", "qc": "Which is the correct order of the five stages of prophase I?", "options": ["Zygonema, leptonema, pachynema, diplonema, diakinesis", "Leptonema, zygonema, pachynema, diplonema, diakinesis", "Leptonema, pachynema, zygonema, diplonema, diakinesis", "Diakinesis, diplonema, pachynema, zygonema, leptonema"], "correct_index": 1, "explanations": ["Not this: leptonema comes first.", "Correct. The order is thin thread, joined thread, thick thread, double thread, then diakinesis.", "Not this: zygonema comes before pachynema.", "Not this: the sequence is not reversed."]}, {"tag": "M5·Q69", "mid": "m05", "difficulty": "hard", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 84", "qc": "What separates in anaphase I of meiosis?", "options": ["Sister chromatids of each chromosome at the centromere", "Centrioles at the two poles of the cell", "Homologous chromosomes, each still two chromatids", "Nucleoli inside the nucleus of the cell"], "correct_index": 2, "explanations": ["Not this: sister chromatids separate in anaphase II.", "Not this: centrioles are not the chromosomes.", "Correct. Homologues move to opposite poles with centromeres intact.", "Not this: nucleoli do not separate."]}, {"tag": "M5·Q70", "mid": "m05", "difficulty": "hard", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 85", "qc": "What is an important difference between mitotic anaphase and meiotic anaphase I?", "options": ["In anaphase I the nucleus divides first", "In mitosis the centromeres never divide", "Anaphase I has no spindle fibres", "In anaphase I the centromeres do not divide"], "correct_index": 3, "explanations": ["Not this: the nucleus has not divided yet.", "Not this: mitotic centromeres do divide.", "Not this: the spindle moves the homologues.", "Correct. The centromeres stay intact in anaphase I."]}, {"tag": "M5·Q71", "mid": "m05", "difficulty": "hard", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 86", "qc": "What does telophase I produce?", "options": ["Four haploid cells", "Two haploid daughter cells", "Two diploid cells", "One tetraploid cell"], "correct_index": 1, "explanations": ["Not this: four cells come after meiosis II.", "Correct. Cytokinesis divides the cell into two haploid daughter cells.", "Not this: haploid cells result, not diploid.", "Not this: tetraploid cells do not arise."]}, {"tag": "M5·Q72", "mid": "m05", "difficulty": "hard", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 83", "qc": "What makes metaphase I different from mitotic metaphase?", "options": ["Homologous pairs line up as bivalents, not as single chromosomes", "Chromosomes have not yet replicated their DNA before metaphase I begins", "Chromosomes line up in single file as separate individuals", "There is no spindle to move the chromosomes in metaphase I"], "correct_index": 0, "explanations": ["Correct. Pairing makes metaphase I distinct.", "Not this: replication has occurred.", "Not this: that describes mitotic metaphase.", "Not this: the spindle is present."]}, {"tag": "M5·Q73", "mid": "m05", "difficulty": "hard", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 95", "qc": "Between which chromatids does crossing over occur?", "options": ["Sister chromatids of one chromosome", "Non-sister chromatids of homologous chromosomes", "Chromatids of non-homologous chromosomes only", "Chromatids of different species"], "correct_index": 1, "explanations": ["Not this: sister chromatids are identical.", "Correct. Exchange is between non-sister chromatids.", "Not this: exchange involves homologues.", "Not this: chromosomes from different species do not pair."]}, {"tag": "M5·Q74", "mid": "m05", "difficulty": "hard", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 75", "qc": "Why is meiosis I called a reductional division?", "options": ["It reduces the chromosome number from diploid to haploid", "It reduces the number of cell divisions in meiosis to just one", "It reduces DNA replication to zero before the first division", "It reduces the whole cell cycle to a single mitosis"], "correct_index": 0, "explanations": ["Correct. Meiosis I halves the chromosome number.", "Not this: meiosis has two divisions.", "Not this: DNA replication still occurs once.", "Not this: meiosis is not mitosis."]}, {"tag": "M5·Q75", "mid": "m05", "difficulty": "hard", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 83", "qc": "In which stage of meiosis I do the bivalents orient at random on the equatorial plane?", "options": ["Prophase I", "Anaphase I", "Telophase I", "Metaphase I"], "correct_index": 3, "explanations": ["Not this: prophase I involves pairing and crossing over.", "Not this: anaphase I separates homologues.", "Not this: telophase I reforms nuclei.", "Correct. Bivalents orient at random at metaphase I."]}, {"tag": "M5·Q76", "mid": "m05", "difficulty": "devil", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 77", "qc": "How many bivalents form at metaphase I in a human cell?", "options": ["46", "92", "23", "11"], "correct_index": 2, "explanations": ["Not this: 46 is the chromosome count, not the bivalent count.", "Not this: 92 is the chromatid count.", "Correct. 46 chromosomes pair into 23 bivalents.", "Not this: 11 is not half of 46."]}, {"tag": "M5·Q77", "mid": "m05", "difficulty": "devil", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 77", "qc": "How many chromatids does one tetrad contain?", "options": ["Two", "Eight", "One", "Four"], "correct_index": 3, "explanations": ["Not this: two is one chromosome.", "Not this: eight would be two tetrads.", "Not this: one is a single chromatid.", "Correct. A tetrad is two homologues, each with two sister chromatids."]}, {"tag": "M5·Q78", "mid": "m05", "difficulty": "devil", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 77", "qc": "A pea cell (2n = 14) enters meiosis. How many bivalents appear at metaphase I?", "options": ["14", "7", "28", "3"], "correct_index": 1, "explanations": ["Not this: 14 is the chromosome count.", "Correct. 14 chromosomes form 7 bivalents.", "Not this: 28 is the chromatid count.", "Not this: 3 is not half of 7 chromosome pairs."]}, {"tag": "M5·Q79", "mid": "m05", "difficulty": "devil", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 87", "qc": "If homologues fail to disjoin at anaphase I, what do the resulting gametes contain?", "options": ["A normal single copy of each chromosome in every one of the gametes made", "Double the normal number of every chromosome in all gametes", "Two copies of those chromosomes in some gametes and none in others", "No chromosomes at all in any of the gametes made"], "correct_index": 2, "explanations": ["Not this: that is the normal outcome without nondisjunction.", "Not this: only the affected chromosome is doubled, not all.", "Correct. Nondisjunction gives gametes with two of those chromosomes, or none.", "Not this: not all chromosomes are lost."]}, {"tag": "M5·Q80", "mid": "m05", "difficulty": "devil", "section": "Meiosis I", "qt": "single", "source": "Genetics 4-6, slide 84", "qc": "Why do sister chromatids stay together in anaphase I?", "options": ["The centromeres do not divide, so each homologue moves whole", "Each chromatid has already separated from its sister chromatid at the centromere", "The spindle fibres are broken before anaphase begins", "The nucleus has not yet formed around the chromosomes"], "correct_index": 0, "explanations": ["Correct. Undivided centromeres hold the chromatids together.", "Not this: separation occurs in anaphase II.", "Not this: the spindle drives the movement.", "Not this: nuclei form in telophase."]}, {"tag": "M5·Q81", "mid": "m05", "difficulty": "easy", "section": "Meiosis II and comparison with mitosis", "qt": "single", "source": "Genetics 4-6, slide 88", "qc": "What is the period between the first and second meiotic divisions called?", "options": ["Interphase", "Cytokinesis", "Interkinesis", "Synapsis"], "correct_index": 2, "explanations": ["Not this: interphase precedes mitosis or meiosis I.", "Not this: cytokinesis divides the cytoplasm.", "Correct. The lecture names the gap interkinesis.", "Not this: synapsis is homologue pairing."]}, {"tag": "M5·Q82", "mid": "m05", "difficulty": "medium", "section": "Meiosis II and comparison with mitosis", "qt": "single", "source": "Genetics 4-6, slide 88", "qc": "Does new DNA synthesis occur during interkinesis?", "options": ["No, there is no synthesis of new DNA", "Yes, all the DNA is replicated again", "Yes, but only the sex chromosomes replicate", "Yes, but only mitochondrial DNA replicates"], "correct_index": 0, "explanations": ["Correct. Interkinesis differs from interphase because there is no DNA synthesis.", "Not this: that would double the DNA again.", "Not this: sex chromosomes are not copied here.", "Not this: the lecture says no synthesis occurs."]}, {"tag": "M5·Q83", "mid": "m05", "difficulty": "medium", "section": "Meiosis II and comparison with mitosis", "qt": "single", "source": "Genetics 4-6, slide 76", "qc": "Which meiotic division is described as equational?", "options": ["Meiosis I", "Meiosis II", "Prophase I", "Interkinesis"], "correct_index": 1, "explanations": ["Not this: meiosis I is reductional.", "Correct. Meiosis II separates sister chromatids like mitosis.", "Not this: prophase I is a stage.", "Not this: interkinesis is the gap."]}, {"tag": "M5·Q84", "mid": "m05", "difficulty": "medium", "section": "Meiosis II and comparison with mitosis", "qt": "single", "source": "Genetics 4-6, slide 91", "qc": "What happens in anaphase II?", "options": ["Homologues move to opposite poles while their centromeres stay undivided", "Chromosomes pair as bivalents on the spindle equator", "Crossing over takes place between non-sister chromatids", "Each centromere divides and sister chromatids move to opposite poles"], "correct_index": 3, "explanations": ["Not this: homologues separate in anaphase I.", "Not this: pairing is in prophase I.", "Not this: crossing over is in prophase I.", "Correct. Anaphase II separates sister chromatids."]}, {"tag": "M5·Q85", "mid": "m05", "difficulty": "medium", "section": "Meiosis II and comparison with mitosis", "qt": "single", "source": "Genetics 4-6, slide 92", "qc": "What are the end products of meiosis II in a diploid mother cell?", "options": ["Four haploid progeny cells", "Two diploid cells", "Four diploid cells", "Two haploid cells"], "correct_index": 0, "explanations": ["Correct. A diploid mother cell becomes four haploid cells.", "Not this: two diploid cells describe mitosis.", "Not this: diploid cells do not result.", "Not this: two haploid cells are made after meiosis I."]}, {"tag": "M5·Q86", "mid": "m05", "difficulty": "hard", "section": "Meiosis II and comparison with mitosis", "qt": "single", "source": "Genetics 4-6, slide 91", "qc": "In which meiotic stage do the centromeres divide?", "options": ["Anaphase I", "Anaphase II", "Prophase I", "Metaphase I"], "correct_index": 1, "explanations": ["Not this: they stay intact in anaphase I.", "Correct. Centromeres divide in anaphase II.", "Not this: prophase I is for pairing and crossing over.", "Not this: metaphase I aligns bivalents."]}, {"tag": "M5·Q87", "mid": "m05", "difficulty": "hard", "section": "Meiosis II and comparison with mitosis", "qt": "single", "source": "Genetics 4-6, slide 93", "qc": "Which event distinguishes prophase I of meiosis from mitotic prophase?", "options": ["The nuclear envelope breaks down and the spindle begins to form", "The chromosomes condense and become visible as rods", "The cell has already replicated all of its DNA", "Homologues synapse into tetrads and crossing over occurs"], "correct_index": 3, "explanations": ["Not this: mitotic prophase also breaks down the envelope.", "Not this: both condense chromosomes.", "Not this: both follow replication.", "Correct. Synapsis and crossing over are unique to prophase I."]}, {"tag": "M5·Q88", "mid": "m05", "difficulty": "hard", "section": "Meiosis II and comparison with mitosis", "qt": "single", "source": "Genetics 4-6, slide 93", "qc": "How many cells are produced by mitosis and by meiosis from one diploid parent cell?", "options": ["Four and two", "Two and two", "Two and four", "Four and four"], "correct_index": 2, "explanations": ["Not this: this reverses them.", "Not this: meiosis gives four.", "Correct. Mitosis gives two cells and meiosis gives four.", "Not this: mitosis gives two."]}, {"tag": "M5·Q89", "mid": "m05", "difficulty": "hard", "section": "Meiosis II and comparison with mitosis", "qt": "single", "source": "Genetics 4-6, slide 90", "qc": "At metaphase II, how are the chromosomes arranged?", "options": ["Paired as bivalents and attached to the spindle by their centromeres", "Scattered through the cell with no alignment of any kind", "Already moved to the opposite poles of the cell before metaphase", "Attached to spindle fibres at their centromeres on the equatorial plane"], "correct_index": 3, "explanations": ["Not this: bivalents are in metaphase I.", "Not this: they do align.", "Not this: movement to poles is anaphase.", "Correct. Metaphase II chromosomes align on the plate."]}, {"tag": "M5·Q90", "mid": "m05", "difficulty": "hard", "section": "Meiosis II and comparison with mitosis", "qt": "single", "source": "Genetics 4-6, slide 76", "qc": "Why is meiosis II described as an equational division?", "options": ["It halves the chromosome number, as meiosis I does, from diploid to haploid", "It is like a mitotic division, separating sister chromatids", "It pairs homologous chromosomes at the metaphase plate", "It replicates the DNA just before the division begins"], "correct_index": 1, "explanations": ["Not this: halving happens in meiosis I.", "Correct. Meiosis II separates sister chromatids as in mitosis.", "Not this: pairing is in prophase I.", "Not this: replication is before meiosis I."]}, {"tag": "M5·Q91", "mid": "m05", "difficulty": "hard", "section": "Meiosis II and comparison with mitosis", "qt": "single", "source": "Genetics 4-6, slide 89", "qc": "Which stage of meiosis II is described as very brief, with chromosomes recondensing and spindle fibres reforming?", "options": ["Prophase II", "Metaphase II", "Anaphase II", "Telophase II"], "correct_index": 0, "explanations": ["Correct. Prophase II is brief.", "Not this: metaphase II aligns chromosomes.", "Not this: anaphase II separates sister chromatids.", "Not this: telophase II reforms nuclei."]}, {"tag": "M5·Q92", "mid": "m05", "difficulty": "devil", "section": "Meiosis II and comparison with mitosis", "qt": "single", "source": "Genetics 4-6, slide 92", "qc": "A cell with 2n = 8 undergoes meiosis. How many chromosomes does each cell have after meiosis II?", "options": ["8", "2", "4", "16"], "correct_index": 2, "explanations": ["Not this: 8 is the diploid number.", "Not this: 2 is not half of the haploid number.", "Correct. Each of the four haploid cells has n = 4 chromosomes.", "Not this: 16 is double."]}, {"tag": "M5·Q93", "mid": "m05", "difficulty": "devil", "section": "Meiosis II and comparison with mitosis", "qt": "single", "source": "Genetics 4-6, slide 90", "qc": "A cell with 2n = 20 reaches m
