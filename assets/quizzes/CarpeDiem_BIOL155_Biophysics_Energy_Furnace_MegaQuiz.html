n": "Myopia optics", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In an uncorrected myopic eye viewing a distant object, the image forms:"}, {"difficulty": "devil", "options": ["A red-green deficiency (dichromacy or anomalous trichromacy) is likely", "Monochromacy is confirmed, since nothing was seen", "Tritanomaly is confirmed, being the commonest blue-light defect", "The result indicates an early cataract"], "correct_index": 0, "explanations": ["The lecture says such viewers may read 21, indicating a red-green colour deficiency.", "Monochromacy would give no number at all.", "Tritanomaly is a blue-light defect, extremely rare, and not what the red-green plate tests.", "Cataract affects clarity and contrast and does not produce this number swap."], "tag": "b05·Q18", "mid": "b05", "section": "Ishihara interpretation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A patient reads 21 on the plate where normal viewers see 74. What is the most appropriate conclusion?"}, {"difficulty": "easy", "options": ["Raised fluid pressure inside the eye", "Inability to tell red from green", "Clouding of the normally clear lens", "Loss of lens power with age only"], "correct_index": 2, "explanations": ["Raised intraocular fluid pressure is checked by tonometry and may indicate glaucoma.", "Red-green confusion is colour blindness.", "Cataract is clouding of the normally clear lens, like looking through a cloudy window.", "Loss of accommodation with age is presbyopia; cataract is opacity, not loss of focusing range."], "tag": "b05·Q19", "mid": "b05", "section": "Cataract", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A cataract is best described as:"}, {"difficulty": "easy", "options": ["Virtual, erect and enlarged at F1", "Real, inverted and highly diminished at F2", "Real, inverted and enlarged at 2F2", "Virtual, erect and diminished at O"], "correct_index": 1, "explanations": ["A virtual, erect, enlarged image occurs only when the object lies between F1 and the optical centre.", "For an object at infinity the image is at the second focus F2, real, inverted and point-like.", "A real, enlarged image beyond 2F2 requires the object between F1 and 2F1.", "Virtual, erect, diminished images are typical of concave lenses, not convex lenses."], "tag": "b05·Q20", "mid": "b05", "section": "Convex lens images", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "When an object is at infinity, a convex lens forms an image that is:"}, {"difficulty": "medium", "options": ["Cataract", "Glaucoma", "Astigmatism", "Deuteranomaly"], "correct_index": 1, "explanations": ["Cataract is lens clouding, assessed with acuity, contrast and potential acuity tests.", "Tonometry measures fluid pressure in the eye, and increased pressure may be a sign of glaucoma.", "Astigmatism is found by refraction and is unrelated to eye pressure.", "Deuteranomaly is a cone defect found with colour plates."], "tag": "b05·Q21", "mid": "b05", "section": "Eye tests", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A raised reading on tonometry may indicate:"}, {"difficulty": "medium", "options": ["Smaller eyeball, or longer focal length of relaxed lens", "Larger eyeball, or shorter focal length of relaxed lens", "Weak ciliary muscles, or cloudy lens proteins", "Uneven corneal curvature, or retinal detachment"], "correct_index": 1, "explanations": ["A smaller eyeball and longer focal length are the causes of hypermetropia.", "Retina too far from the lens, or an over-powerful (short focal length) relaxed lens, both put the focus in front of the retina.", "Weak ciliary muscles relate to presbyopia and cloudy proteins to cataract.", "Uneven corneal curvature is astigmatism; retinal detachment is not a cause of myopia in the lecture. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 104"], "tag": "b05·Q22", "mid": "b05", "section": "Myopia causes", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which pair lists the two possible causes of myopia given in the lecture?"}, {"difficulty": "easy", "options": ["Real, inverted and magnified", "Real, inverted and diminished", "Virtual, inverted and diminished", "Virtual, erect and magnified"], "correct_index": 3, "explanations": ["A real inverted magnified image is produced by a convex lens with the object between F1 and 2F1, not by a magnifier.", "Real, inverted, diminished images occur when the object is beyond 2F1.", "A virtual image from a convex lens is always erect, not inverted.", "With the object between C and F, the image is virtual, erect and magnified at distance d."], "tag": "b05·Q23", "mid": "b05", "section": "Simple microscope", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The image formed by a simple microscope is:"}, {"difficulty": "medium", "options": ["Diffraction effects from the wave nature of electrons", "Optical aberrations, chiefly spherical aberration of the lens", "Loss of the raster pattern across the viewed image", "Excess vacuum pressure within the specimen chamber Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 94"], "correct_index": 1, "explanations": ["Electrons are not used in a magnifier.", "The lecture says aberrations, especially spherical aberration, degrade high-power single lenses.", "A raster pattern belongs to SEM imaging.", "A vacuum chamber is an electron microscope feature."], "tag": "b05·Q24", "mid": "b05", "section": "Magnifier limits", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Why does the image quality of a simple magnifier become poor at higher magnification?"}, {"difficulty": "hard", "options": ["Real, inverted, 6 cm beyond the lens, 0.4 times the object size", "Real, inverted, 30 cm beyond the lens, twice the object size", "Virtual, erect, 30 cm on the object side, twice the object size", "Real, inverted, 20 cm beyond the lens, same size as the object"], "correct_index": 1, "explanations": ["6 cm arises from adding the reciprocals (wrong sign) and contradicts the lecture's enlarged image for this region.", "1/v = 1/10 − 1/15 gives v = 30 cm and m = 2; the object is between F1 and 2F1, so the image is real, inverted, enlarged and beyond 2F2 (20 cm).", "A virtual image on the object side needs the object inside the focal length, which is 10 cm here.", "Same size at 2F2 occurs only when the object is exactly at 2F1 = 20 cm."], "tag": "b05·Q25", "mid": "b05", "section": "Convex lens calculation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "An object is 15 cm from a convex lens of f = 10 cm. The image formed is:"}, {"difficulty": "easy", "options": ["Long sightedness", "Short sightedness", "Old sight", "Colour deficiency"], "correct_index": 1, "explanations": ["Long sightedness is hypermetropia, the opposite defect to myopia.", "Myopia is short sightedness: near objects are clear but far objects are blurred.", "Old sight is presbyopia, an age-related loss of accommodation.", "Colour deficiency is colour blindness, which concerns cones and not focusing."], "tag": "b05·Q26", "mid": "b05", "section": "Myopia", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Myopia is also known as which of the following?"}, {"difficulty": "hard", "options": ["+5.0 D", "+1.0 D", "+3.0 D", "+4.0 D"], "correct_index": 2, "explanations": ["+5.0 D wrongly adds the two reciprocals instead of subtracting the eye's own near-point power.", "+1.0 D is only the power of the eye's near-point distance and ignores the 25 cm target.", "1/f = 1/0.25 − 1/1.0 = 4 − 1 = +3.0 D; the lens puts a virtual image of the 25 cm object at 100 cm.", "+4.0 D is 1/0.25 alone, which would be correct only if the eye could focus nothing nearer than infinity."], "tag": "b05·Q27", "mid": "b05", "section": "Hypermetropia power", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A hypermetropic eye has its near point at 100 cm. Which lens power brings reading material to 25 cm into clear focus?"}, {"difficulty": "hard", "options": ["3.5", "2.5", "0.4", "250"], "correct_index": 1, "explanations": ["3.5 is 1 + d/f, which applies when the image is formed at 25 cm instead.", "With the image at infinity, m = d/f = 25/10 = 2.5.", "0.4 is f/d, the inverse ratio, which would imply diminution.", "250 multiplies d and f instead of dividing; a magnifier cannot give this."], "tag": "b05·Q28", "mid": "b05", "section": "Magnifying power", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A hand lens of focal length 10 cm is used with the eye relaxed (image at infinity). Taking d = 25 cm, the magnifying power is:"}, {"difficulty": "medium", "options": ["Decreased focal length of the relaxed eye lens", "Loss of cone pigment sensitivity", "Increased focal length of the fully relaxed eye lens", "Increase in the distance of retina from the lens"], "correct_index": 2, "explanations": ["A decreased focal length over-converges rays and causes myopia.", "Cone pigment problems cause colour deficiency, not a refractive error.", "A longer focal length means rays are not bent enough, so they would focus behind the retina.", "A greater lens-retina distance is a cause of myopia, not hypermetropia."], "tag": "b05·Q29", "mid": "b05", "section": "Hypermetropia cause", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The lecture attributes hypermetropia to:"}, {"difficulty": "easy", "options": ["4×", "10×", "40×", "100×"], "correct_index": 1, "explanations": ["4× is a standard objective (scanning power), not the standard eyepiece.", "Standard oculars are 10×, with optional 5×–30×.", "40× is a standard objective (high dry).", "100× is the oil-immersion objective. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 105"], "tag": "b05·Q30", "mid": "b05", "section": "Compound microscope", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Standard eyepieces of a compound microscope typically have a magnifying power of:"}, {"difficulty": "hard", "options": ["118 cm", "240 cm", "60 cm", "122 cm"], "correct_index": 3, "explanations": ["118 cm is fo − fe, the separation of a Galilean design with a diverging eyepiece.", "240 cm is twice fo, which has no meaning for this telescope.", "60 is the angular magnification fo/fe, not a length.", "In normal adjustment the final image is at infinity, so the lenses are separated by fo + fe = 122 cm."], "tag": "b05·Q31", "mid": "b05", "section": "Astronomical telescope", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "An astronomical telescope has an objective of focal length 120 cm and an eyepiece of 2 cm. In normal adjustment, the lens separation is:"}, {"difficulty": "medium", "options": ["Light always focuses in front of the retina", "Light is absorbed by clouded lens proteins", "The ciliary muscles cannot relax at all", "Light focuses at more than one point on the retina Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 95"], "correct_index": 3, "explanations": ["A single focus in front of the retina would be myopia, and would be clear for near objects.", "Absorption by clouded proteins describes cataract.", "Ciliary muscle failure affects accommodation (presbyopia), not meridional focusing.", "Different corneal curvatures bring different meridians to different foci, so no single sharp image forms at any distance."], "tag": "b05·Q32", "mid": "b05", "section": "Astigmatism", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Why does an astigmatic eye give blurry, distorted vision at all distances?"}, {"difficulty": "devil", "options": ["A single strong convex lens for all viewing distances", "Bifocal: concave upper segment, weaker or converging lower one", "A single strong concave lens used for every distance", "A cylindrical lens with its axis set vertically"], "correct_index": 1, "explanations": ["A convex lens would worsen the distance myopia.", "Distance needs diverging power for myopia, while reading needs added converging power for presbyopia, hence a bifocal.", "A strong concave lens alone would help distance but make reading harder because accommodation is lost.", "A cylindrical lens corrects astigmatism, which is not the problem described."], "tag": "b05·Q33", "mid": "b05", "section": "Combined defects", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A 62-year-old myope needs spectacles for both distance and reading. Which design is most suitable?"}, {"difficulty": "devil", "options": ["The law of reflection does not depend on wavelength", "The paraboloid shape sends all colours to the eyepiece", "The mirror absorbs all but one wavelength", "Reflection occurs inside the glass at a fixed depth"], "correct_index": 0, "explanations": ["Reflection angles equal incidence angles for every wavelength, unlike refraction, where the index varies with colour.", "The paraboloid shape addresses spherical aberration, not chromatic aberration.", "A mirror reflects a broad spectrum; absorption of colours would dim and tint the image.", "Chromatic aberration arises from dispersion in glass; the reflecting surface does not rely on the glass depth."], "tag": "b05·Q34", "mid": "b05", "section": "Chromatic aberration", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Why does a mirror objective eliminate chromatic aberration?"}, {"difficulty": "devil", "options": ["An object at F1 gives an image at infinity", "An object beyond 2F1 gives a diminished real image between F2 and 2F2", "An object between F1 and O gives a virtual, erect, enlarged image", "An object at 2F1 gives a real, inverted, enlarged image at 2F2"], "correct_index": 3, "explanations": ["True: the lecture states the image is at infinity and highly enlarged.", "True: the image is real, inverted and diminished.", "True: this is the magnifying-glass arrangement.", "False: an object at 2F1 gives an image of the same size as the object at 2F2."], "tag": "b05·Q35", "mid": "b05", "section": "FALSE statement: convex lens images", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about image formation by a convex lens is FALSE?"}, {"difficulty": "hard", "options": ["6", "5", "30", "4"], "correct_index": 0, "explanations": ["m = 1 + d/f = 1 + 25/5 = 6, since the object sits at about 4.2 cm from the lens.", "d/f = 5 is the value when the image is at infinity (relaxed eye), not at 25 cm.", "30 comes from adding the two lengths instead of using the ratio.", "4 results from subtracting 1 (d/f − 1), the wrong sign in the formula."], "tag": "b05·Q36", "mid": "b05", "section": "Magnifying power", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A simple microscope has f = 5 cm and forms its image at the least distance of distinct vision, 25 cm. Its magnifying power is:"}, {"difficulty": "devil", "options": ["+7.0 D", "−3.3 D", "+3.0 D", "−3.0 D"], "correct_index": 2, "explanations": ["+7.0 D adds the magnitudes, ignoring that the concave lens diverges.", "−3.3 D comes from adding focal lengths (20 − 50 = −30 cm), which is not how thin lenses in contact combine.", "P = 1/0.20 + 1/(−0.50) = 5 − 2 = +3.0 D.", "−3.0 D has the correct size but the wrong sign, as the stronger converging lens dominates. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 106"], "tag": "b05·Q37", "mid": "b05", "section": "Lens combination", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A convex lens of f = 20 cm is in contact with a concave lens of f = −50 cm. The net power is:"}, {"difficulty": "devil", "options": ["39 pm", "3.9 pm", "0.39 pm", "390 pm"], "correct_index": 1, "explanations": ["39 pm is a slip of one power of ten.", "λ = 1.226/√(10⁵) nm = 1.226/316 nm = 0.0039 nm = 3.9 pm, about 140,000 times shorter than 550 nm light.", "0.39 pm is a slip of one power of ten in the other direction.", "390 pm = 0.39 nm would be wrong by two powers of ten."], "tag": "b05·Q38", "mid": "b05", "section": "De Broglie wavelength", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "An electron accelerated through 100 kV has a non-relativistic de Broglie wavelength λ ≈ 1.226/√V nm (V in volts). The value is about:"}, {"difficulty": "hard", "options": ["+1.5 D", "+6.5 D", "+2.5 D", "+4.0 D"], "correct_index": 0, "explanations": ["1/f = 1/0.25 − 1/0.40 = 4.0 − 2.5 = +1.5 D.", "+6.5 D adds the two reciprocals instead of subtracting them.", "+2.5 D is the vergence of the near point alone, not the deficit.", "+4.0 D is 1/0.25 and ignores that the eye can still focus at 40 cm unaided."], "tag": "b05·Q39", "mid": "b05", "section": "Hypermetropia power", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A hypermetropic patient's near point is 40 cm. What converging lens lets her read at 25 cm?"}, {"difficulty": "medium", "options": ["Higher magnification makes stains look like cavities", "Loupes above 2× do not exist", "Higher magnification narrows the field of view and makes diagnosis difficult", "Higher magnification removes the need for illumination Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 96"], "correct_index": 2, "explanations": ["The point is that magnification helps separate a stain from a cavity; it does not blur them together.", "Loupes of 10× and above exist, for instance in jewellery work.", "Too much magnification shrinks the field of view, so the lecture sets about 2× as ideal.", "Illumination is still required at any magnification."], "tag": "b05·Q40", "mid": "b05", "section": "Loupe applications", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Why is dental loupe magnification ideally limited to about 2× for diagnosis?"}, {"difficulty": "devil", "options": ["7.25 and 6.25", "6.25 and 5.25", "25 and 26", "6.25 and 7.25"], "correct_index": 3, "explanations": ["This reverses the two formulas; the 25 cm image gives the larger value.", "5.25 uses d/f − 1, the wrong sign in the second formula.", "25 and 26 use d alone, ignoring the division by f = 4 cm.", "Image at infinity gives d/f = 6.25; image at 25 cm gives 1 + d/f = 7.25."], "tag": "b05·Q41", "mid": "b05", "section": "Magnifier calculation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A lens has f = 4 cm and d = 25 cm. Its magnifying power is respectively (relaxed eye, image at infinity) and (image at 25 cm):"}, {"difficulty": "medium", "options": ["Reduced sensitivity to red light, very common", "Reduced sensitivity to green light, most common", "Reduced sensitivity to blue light, extremely rare", "Complete absence of all colour perception"], "correct_index": 2, "explanations": ["Reduced red sensitivity is protanomaly, and not described as very common.", "Reduced green sensitivity is deuteranomaly, the most common form.", "The prefix trit- refers to blue; the condition is extremely rare.", "Total absence of colour is monochromacy."], "tag": "b05·Q42", "mid": "b05", "section": "Colour blindness", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Tritanomaly is characterised by:"}, {"difficulty": "easy", "options": ["Passing a broad electron beam through an ultrathin slice", "Focusing visible light with an objective lens", "Scanning the sample surface with a focused electron beam", "Bouncing X-rays off a concave mirror"], "correct_index": 2, "explanations": ["Transmission through a thin section describes TEM.", "Visible light with objectives is a light microscope.", "SEM scans a focused beam in a raster pattern and builds the image from detected signals.", "SEM uses electrons, not X-ray mirror optics."], "tag": "b05·Q43", "mid": "b05", "section": "SEM", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A scanning electron microscope forms an image by:"}, {"difficulty": "devil", "options": ["3,000× then 300×", "300× then 3,000×", "3,000× then 30,000×", "30,000× then 300,000×"], "correct_index": 2, "explanations": ["A smaller raster increases magnification, so it cannot fall to 300×.", "300× is a power-of-ten slip for the first value, and the pair is shifted down.", "0.15 m / 50 µm = 3,000×; reducing the raster tenfold raises it to 30,000×.", "30,000× is a power-of-ten slip for the first value, and the pair is shifted up."], "tag": "b05·Q44", "mid": "b05", "section": "SEM magnification calculation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A 15 cm wide SEM display shows a 50 µm wide scanned region. The raster is then reduced to 5 µm. The magnifications are:"}, {"difficulty": "devil", "options": ["Far objects are seen clearly", "The near point shifts closer to the eye than 25 cm", "Spectacles use a convex lens", "The relaxed lens has an increased focal length"], "correct_index": 1, "explanations": ["True: far objects are seen clearly, near ones are not.", "False: the near point shifts away from the eye, so it is no longer at 25 cm.", "True: a convex lens of suitable focal length corrects it.", "True: increased focal length of the relaxed lens is the stated cause. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 107"], "tag": "b05·Q45", "mid": "b05", "section": "FALSE statement: hypermetropia", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about hypermetropia is FALSE?"}, {"difficulty": "easy", "options": ["Those at infinity only", "Those at every distance", "Those lying near the eye", "Those beyond 25 cm only"], "correct_index": 2, "explanations": ["Objects at infinity are exactly what a myopic eye cannot focus; that is the hypermetropic or normal case.", "Seeing every distance clearly describes a normal accommodating eye, not a myopic one.", "A myopic eye sees near objects distinctly while far objects are blurred.", "Objects beyond 25 cm, particularly distant ones, are the ones a myopic eye sees poorly."], "tag": "b05·Q46", "mid": "b05", "section": "Myopia", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A person with myopia can see clearly which objects?"}, {"difficulty": "devil", "options": ["Standard eyepieces are usually 10×", "The condenser sits under the stage", "The objective has a large aperture and moderate focal length", "Binocular heads often have a diopter adjustment ring"], "correct_index": 2, "explanations": ["True: standard oculars are 10×, with optional 5× to 30×.", "True: the condenser collects light onto the specimen from beneath the stage.", "False: the objective has a very small focal length and short aperture; moderate focal length with large aperture describes the eyepiece.", "True: the ring compensates for differences between the two eyes."], "tag": "b05·Q47", "mid": "b05", "section": "FALSE statement: compound microscope", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about the compound microscope is FALSE?"}, {"difficulty": "hard", "options": ["4 nm", "400 nm", "4 µm", "40 nm Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 97"], "correct_index": 3, "explanations": ["4 nm is a slip of one power of ten; it would need 30,000,000×.", "400 nm would correspond to only 300,000× on a 12 cm screen.", "4 µm corresponds to 30,000×, far below the quoted magnification.", "Raster width = screen width / magnification = 0.12 m / 3×10⁶ = 4×10⁻⁸ m = 40 nm."], "tag": "b05·Q48", "mid": "b05", "section": "SEM magnification", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "An SEM operator displays a raster on a 12 cm wide screen at 3,000,000× (the top of the lecture's range). What width of specimen is being scanned?"}, {"difficulty": "medium", "options": ["Rods only working in bright light", "All three types of cone working correctly", "Two cone types plus rods", "A single cone type of broad sensitivity"], "correct_index": 1, "explanations": ["Rods do not carry colour information.", "Trichromats use all three cone types correctly; the lecture names them trichromats.", "Two cone types would be dichromacy, a colour deficiency.", "One cone type is monochromacy, where little or no colour is perceived."], "tag": "b05·Q49", "mid": "b05", "section": "Colour blindness", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Normal colour vision, called trichromacy, depends on:"}, {"difficulty": "hard", "options": ["40", "800", "1,600", "40,000"], "correct_index": 2, "explanations": ["40 is only the ratio of diameters, forgetting that collecting area goes with the square.", "800 results from halving the squared ratio, a wrong arithmetic step.", "Ratio = (200/5)² = 40² = 1,600, explaining the brighter image of the large mirror.", "40,000 is a slip of 25× by squaring 200 against 1."], "tag": "b05·Q50", "mid": "b05", "section": "Reflecting telescope", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A reflecting telescope has a mirror about 200 inch in diameter; a refracting telescope has a 5 inch objective. Light-gathering power scales with aperture area. The ratio is about:"}, {"difficulty": "hard", "options": ["It converges parallel rays to bring the focus onto the retina", "It diverges parallel rays so they appear to come from the eye's far point", "It shortens the eyeball by pressing on the cornea", "It strengthens the ciliary muscles for accommodation"], "correct_index": 1, "explanations": ["Converging rays would pull the focus further in front of the retina and worsen myopia.", "The diverging lens forms a virtual image of the distant object at the far point, which the myopic eye can focus on the retina.", "Spectacles cannot change the eyeball length; the correction is optical only.", "Ciliary strength is a presbyopia issue, and accommodation cannot fix a focus formed in front of the retina."], "tag": "b05·Q51", "mid": "b05", "section": "Myopia mechanism", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "How does a concave spectacle lens let a myopic eye see distant objects?"}, {"difficulty": "hard", "options": ["50", "5,000", "0.002", "500"], "correct_index": 3, "explanations": ["50 is a slip of one power of ten.", "5,000 is another slip, ten times too large.", "0.002 is the inverse ratio, which would mean the SEM resolves worse.", "200 nm / 0.4 nm = 500."], "tag": "b05·Q52", "mid": "b05", "section": "Electron vs light resolution", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A light microscope resolves about 200 nm, while the best conventional SEM in the lecture reaches 0.4 nm. The SEM improvement factor is about:"}, {"difficulty": "medium", "options": ["The focal length of the objective lens", "Current to the x,y scanning coils changing the raster size", "The thickness of the specimen section", "The wavelength of the illuminator bulb"], "correct_index": 1, "explanations": ["Unlike optical microscopes and TEM, SEM magnification is not a function of objective lens power.", "Smaller raster on the specimen over a fixed screen gives higher magnification, set by scan coil current or deflector voltage.", "Section thickness matters for TEM, not for SEM magnification.", "SEM does not use a bulb for imaging; it uses an electron beam. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 108"], "tag": "b05·Q53", "mid": "b05", "section": "SEM magnification", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In an SEM, image magnification is controlled mainly by:"}, {"difficulty": "hard", "options": ["6.3 cm", "12.5 cm", "8.3 cm", "100 cm"], "correct_index": 2, "explanations": ["6.3 cm results from using m = d/f (image at infinity) instead of 1 + d/f.", "12.5 cm would give m = 3 (1 + 2), not 4.", "4 = 1 + 25/f gives 25/f = 3, so f = 8.3 cm.", "100 cm is d multiplied by the rating, a meaningless product; such a lens would hardly magnify."], "tag": "b05·Q54", "mid": "b05", "section": "Magnifying power", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A magnifier is rated 4× when the image is at 25 cm (m = 1 + d/f). Its focal length is about:"}, {"difficulty": "hard", "options": ["Concave, power −2.0 D (f = −50 cm)", "Convex, power +2.0 D (f = +50 cm)", "Concave, power −0.5 D (f = −200 cm)", "Concave, power −5.0 D (f = −20 cm)"], "correct_index": 0, "explanations": ["The lens must put a virtual image of infinity at 50 cm, so f = −0.5 m and P = 1/f = −2.0 D.", "A convex lens converges light further and would worsen myopia; the sign is wrong.", "−0.5 D comes from using the far point in metres as if it were already a power; P is the reciprocal of f in metres.", "−5.0 D would suit a far point of 20 cm; it over-corrects this patient and blurs distant objects."], "tag": "b05·Q55", "mid": "b05", "section": "Myopia correction power", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A myopic patient has a far point of 50 cm. Ignoring the spectacle-eye gap, which lens lets her see distant objects clearly?"}, {"difficulty": "easy", "options": ["Two converging lenses in a tube", "A concave mirror and a plane mirror", "A single converging lens of small focal length", "A diverging lens of large focal length Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 98"], "correct_index": 2, "explanations": ["Two co-axial converging lenses describe the compound microscope.", "A pair of mirrors describes a reflecting telescope.", "A magnifying glass is one converging lens of short focal length.", "A diverging lens always gives diminished virtual images and cannot magnify."], "tag": "b05·Q56", "mid": "b05", "section": "Simple microscope", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A simple microscope consists of:"}, {"difficulty": "devil", "options": ["Contrast sensitivity and pupil dilation", "Glare testing and refraction", "Visual acuity chart and Ishihara plates", "Potential acuity testing and tonometry"], "correct_index": 3, "explanations": ["Contrast sensitivity checks shades of gray and dilation lets the lens and retina be examined; neither predicts outcome nor measures pressure.", "Glare testing assesses lighting-dependent symptoms and refraction decides on glasses; neither measures pressure.", "The chart measures reading and distance vision and Ishihara plates screen colour vision; neither fits these questions.", "Potential acuity estimates vision without the cataract; tonometry measures fluid pressure inside the eye."], "tag": "b05·Q57", "mid": "b05", "section": "Eye tests", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which pair of tests answers: what vision can be expected after cataract removal, and is the eye pressure raised (possible glaucoma)?"}, {"difficulty": "medium", "options": ["400×", "50×", "30×", "4000×"], "correct_index": 0, "explanations": ["Total magnification is the product: 10 × 40 = 400×.", "50× would come from adding the two magnifications, which is wrong.", "30× is the difference, which is not how magnifications combine.", "4000× is off by a factor of ten."], "tag": "b05·Q58", "mid": "b05", "section": "Compound microscope", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Total magnification of a compound microscope with a 10× eyepiece and a 40× objective is:"}, {"difficulty": "hard", "options": ["Virtual, erect, about 6.7 cm from the lens, one-third the object size", "Virtual, erect, 20 cm from the lens, same size as the object", "Real, inverted, about 6.7 cm behind the lens, one-third the size", "Virtual, erect, 30 cm from the lens, 1.5 times the object size"], "correct_index": 0, "explanations": ["With f = −10 cm and u = −20 cm, 1/v = −1/10 − 1/20 = −3/20, so v = −6.7 cm and m = v/u = 1/3; it lies between F1 and O as the lecture states.", "A same-size virtual image at 20 cm would need a lens of infinite power; concave lenses always shrink the image.", "A concave lens cannot form a real image of a real object; the image is always virtual.", "30 cm comes from subtracting reciprocals with the wrong sign, and would wrongly give an enlarged image."], "tag": "b05·Q59", "mid": "b05", "section": "Concave lens calculation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "An object is 20 cm in front of a concave lens of focal length 10 cm. The image formed is:"}, {"difficulty": "easy", "options": ["Convex lens", "Cylindrical lens", "Bifocal converging lens", "Concave lens"], "correct_index": 3, "explanations": ["A convex lens is used for hypermetropia; it would worsen myopia by converging rays even more.", "A cylindrical lens corrects astigmatism, which is a curvature problem of the cornea.", "Bifocal converging lenses are for presbyopia, which needs added convergence.", "A concave (diverging) lens of suitable focal length corrects myopia. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 109"], "tag": "b05·Q60", "mid": "b05", "section": "Myopia correction", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which type of spectacle lens is used to correct myopia?"}, {"difficulty": "devil", "options": ["+5.25 D; near vision blurs, so bifocals are used", "+2.75 D; distant vision blurs, so bifocals are used", "+1.25 D; no drawback arises", "+2.75 D; distant vision is improved as well"], "correct_index": 1, "explanations": ["+5.25 D adds the reciprocals instead of subtracting them.", "1/0.25 − 1/0.80 = 4.00 − 1.25 = +2.75 D, but a converging lens blurs distant objects, hence bifocals.", "+1.25 D is the near-point vergence alone and leaves reading at 25 cm unsolved.", "The power is right, but a converging lens in front of an eye with normal distance vision would blur distant objects, not improve them."], "tag": "b05·Q61", "mid": "b05", "section": "Presbyopia power", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "An otherwise normal 60-year-old has a near point of 80 cm. What lens power allows reading at 25 cm, and what drawback follows?"}, {"difficulty": "medium", "options": ["Large focal length and large aperture", "Moderate focal length and large aperture", "Infinite focal length and no aperture", "Very small focal length and small aperture"], "correct_index": 3, "explanations": ["Large focal length and large aperture describes the objective of a telescope.", "Moderate focal length and large aperture describes the eyepiece.", "A lens with infinite focal length is a flat plate with no focusing.", "The objective is a short focal length lens with a small aperture; the eyepiece has moderate focal length and large aperture."], "tag": "b05·Q62", "mid": "b05", "section": "Compound microscope", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In a compound microscope the objective lens has:"}, {"difficulty": "easy", "options": ["Shifted closer to the eye than 25 cm", "Shifted away from the eye beyond 25 cm", "Exactly at 25 cm as in a normal eye", "Located at infinity for every person"], "correct_index": 1, "explanations": ["A near point closer than 25 cm would mean better near vision, as in a myopic eye.", "In hypermetropia the near point moves away and is no longer at the 25 cm least distance of distinct vision.", "A near point at exactly 25 cm is the normal value; the lecture stresses that it is no longer there.", "The near point is a finite distance even in severe cases; infinity describes the far point of a normal eye."], "tag": "b05·Q63", "mid": "b05", "section": "Hypermetropia", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "For a hypermetropic eye, the near point is:"}, {"difficulty": "medium", "options": ["To measure the visual acuity chart distance", "To reduce glare symptoms during testing", "To examine the lens and retina for other conditions limiting vision", "To lower the fluid pressure in the eye Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 99"], "correct_index": 2, "explanations": ["Acuity is read from a chart; dilation is not needed for it.", "Glare testing uses different lighting sources; dilation would increase glare sensitivity.", "Dilation lets the ophthalmologist look at lens and retina to find other causes of poor vision.", "Dilating drops are not used to lower eye pressure in this context."], "tag": "b05·Q64", "mid": "b05", "section": "Eye tests", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Why is the pupil dilated with drops during a cataract assessment?"}, {"difficulty": "easy", "options": ["Cornea has different curvature in different directions", "Eyeball is too long", "Lens loses elasticity with age", "Cones fail to detect red light"], "correct_index": 0, "explanations": ["Different corneal curvatures in different directions make light focus at more than one point.", "An overlong eyeball causes myopia.", "Loss of lens elasticity with age is presbyopia.", "Failure of red cones is protan colour deficiency, unrelated to corneal shape."], "tag": "b05·Q65", "mid": "b05", "section": "Astigmatism", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Astigmatism arises when the:"}, {"difficulty": "hard", "options": ["Real, inverted, 10 cm beyond the lens, magnified 2×", "Virtual, erect, 10 cm on the object side, magnified 2×", "Virtual, erect, 3.3 cm on the object side, diminished", "Real, inverted, 3.3 cm beyond the lens, diminished"], "correct_index": 1, "explanations": ["A real inverted image needs the object beyond the focal length; at 5 cm the rays diverge after the lens.", "The object lies between O and F1, so 1/v = 1/10 − 1/5 gives v = −10 cm and m = 2, the magnifier condition.", "3.3 cm comes from adding the reciprocals incorrectly, and a magnifier cannot diminish the image.", "This combines the wrong sign with a real image, impossible for an object inside the focal length."], "tag": "b05·Q66", "mid": "b05", "section": "Simple microscope calculation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "An object is held 5 cm from a convex lens of focal length 10 cm. What is the image?"}, {"difficulty": "hard", "options": ["0.3 mm", "30 mm", "0.03 mm", "3 mm"], "correct_index": 3, "explanations": ["0.3 mm would come from only 100× magnification.", "30 mm would need 10,000× magnification.", "0.03 mm would need only 10× magnification, the eyepiece alone.", "Total magnification is 10 × 100 = 1000×, and 3 µm × 1000 = 3000 µm = 3 mm."], "tag": "b05·Q67", "mid": "b05", "section": "Compound microscope", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A 3 µm long bacillus is viewed with a 10× eyepiece and a 100× oil immersion objective. Its apparent length is:"}, {"difficulty": "easy", "options": ["Protanomaly", "Tritanomaly", "Monochromacy", "Deuteranomaly"], "correct_index": 3, "explanations": ["Protanomaly (reduced red sensitivity) is less common than deuteranomaly.", "Tritanomaly (reduced blue sensitivity) is extremely rare.", "Monochromacy, seeing no colour, is not the most common form.", "Deuteranomaly, reduced sensitivity to green light, is the most common form. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 110"], "tag": "b05·Q68", "mid": "b05", "section": "Colour blindness", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which form of colour deficiency is the most common?"}, {"difficulty": "easy", "options": ["Convex lens of suitable focal length", "Concave lens of suitable focal length", "Cylindrical lens with suitable axis", "Plane glass of uniform thickness"], "correct_index": 0, "explanations": ["A convex (converging) lens supplies the extra converging power the hypermetropic eye lacks.", "A concave lens is for myopia and would push the image even further behind the retina.", "A cylindrical lens with a suitable axis corrects astigmatism, not hypermetropia.", "Plane glass has no focusing power and cannot change where the image forms."], "tag": "b05·Q69", "mid": "b05", "section": "Hypermetropia correction", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which spectacle lens corrects hypermetropia?"}, {"difficulty": "medium", "options": ["74, where normal viewers see 21", "12, where normal viewers see 21", "Nothing, where normal viewers see 74", "21, where normal viewers see 74"], "correct_index": 3, "explanations": ["This reverses the roles of the normal and deficient readings.", "12 is not the number given in the lecture.", "Seeing nothing is the monochromacy result, not the dichromacy or anomalous trichromacy result.", "The plate shows 74 to normal viewers; red-green deficient viewers may read 21."], "tag": "b05·Q70", "mid": "b05", "section": "Ishihara plate", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "On the lecture's Ishihara plate, a viewer with dichromacy or anomalous trichromacy may read the number as:"}, {"difficulty": "devil", "options": ["Specimens are usually bulk blocks several millimetres thick", "The electron beam may damage biological samples", "The field of view is relatively small", "Sample preparation is time-consuming with low throughput"], "correct_index": 0, "explanations": ["False: the specimen is usually an ultrathin section less than 100 nm thick, or a suspension on a grid.", "True: beam damage is a listed limitation, especially for biological materials.", "True: the small field of view means the region analysed may not represent the sample.", "True: producing electron-transparent samples takes extensive preparation."], "tag": "b05·Q71", "mid": "b05", "section": "FALSE statement: TEM", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about transmission electron microscopy is FALSE?"}, {"difficulty": "easy", "options": ["Concave lenses only", "Cylindrical lenses only", "Plano lenses with a tint", "Bifocal lenses with converging power Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 100"], "correct_index": 3, "explanations": ["Concave lenses diverge light and are for myopia.", "Cylindrical lenses are for astigmatism.", "Tinted plano lenses have no power and do not restore accommodation.", "Converging (bifocal) lenses are employed, as in hypermetropia."], "tag": "b05·Q72", "mid": "b05", "section": "Presbyopia correction", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which lenses are used to remove presbyopia?"}, {"difficulty": "hard", "options": ["100×", "10×", "40×", "4×"], "correct_index": 2, "explanations": ["100× with 15× gives 1500×, the oil-immersion product, far above 600×.", "10× with 15× gives only 150×.", "Total magnification is the product, so the objective = 600/15 = 40×, the standard high-dry objective.", "4× with 15× gives only 60×."], "tag": "b05·Q73", "mid": "b05", "section": "Compound microscope", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A haematology scientist needs a total magnification of 600× with a 15× eyepiece. Which objective is required?"}, {"difficulty": "easy", "options": ["Red-green colour deficiencies", "Raised eye pressure", "Cataract density", "Corneal curvature errors"], "correct_index": 0, "explanations": ["It uses pseudo-isochromatic plates to screen for red-green deficiencies.", "Raised eye pressure is measured by tonometry.", "Cataract effects are assessed by contrast sensitivity and potential acuity tests.", "Corneal curvature errors are found by refraction, not colour plates."], "tag": "b05·Q74", "mid": "b05", "section": "Ishihara test", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The Ishihara test is used mainly to detect:"}, {"difficulty": "devil", "options": ["About 13.3 cm", "About 10 cm", "About 8 cm", "About 30 cm"], "correct_index": 0, "explanations": ["The lens must give a virtual image at 10 cm: 1/u = 1/v − 1/f = −1/10 + 1/40 = −3/40, so u = 13.3 cm.", "10 cm is the unaided near point; the diverging lens pushes the new near point outward, so it cannot stay the same.", "8 cm results from adding the reciprocals with the wrong sign, which would wrongly extend near vision.", "30 cm results from subtracting the distances 40 − 10 instead of using the lens equation."], "tag": "b05·Q75", "mid": "b05", "section": "Near point with spectacles", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A myopic person has a far point of 40 cm and a near point of 10 cm. She wears a −2.5 D lens to see distant objects. With the lens, how close can an object be and still be seen clearly (thin lens at the eye)?"}, {"difficulty": "easy", "options": ["Spherical concave lens", "Cylindrical lens of suitable radius and axis", "Spherical convex lens", "Bifocal lens"], "correct_index": 1, "explanations": ["A spherical concave lens corrects myopia and cannot fix direction-dependent curvature.", "A cylindrical lens with suitable radius of curvature and axis corrects the unequal curvature.", "A spherical convex lens corrects hypermetropia and treats all meridians equally.", "A bifocal lens corrects presbyopia by adding near power in one segment. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 111"], "tag": "b05·Q76", "mid": "b05", "section": "Astigmatism correction", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Astigmatism can be corrected using a:"}, {"difficulty": "easy", "options": ["Increase in the size of the eyeball", "Different corneal curvature in different directions", "Weakening of ciliary muscles and loss of lens elasticity", "Clouding of the eye lens proteins"], "correct_index": 2, "explanations": ["An enlarged eyeball is a cause of myopia.", "Unequal corneal curvature causes astigmatism.", "With age the ciliary muscles weaken and the lens loses elasticity, so accommodation falls.", "Protein breakdown and lens clouding is cataract."], "tag": "b05·Q77", "mid": "b05", "section": "Presbyopia", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Presbyopia results mainly from:"}, {"difficulty": "hard", "options": ["153", "450", "50", "0.02"], "correct_index": 2, "explanations": ["153 comes from adding the focal lengths, which gives the tube length, not the magnification.", "450 results from multiplying the two focal lengths instead of dividing.", "Angular magnification in normal adjustment is fo/fe = 150/3 = 50.", "0.02 is fe/fo, the inverse ratio, which would mean the image is smaller than the object."], "tag": "b05·Q78", "mid": "b05", "section": "Astronomical telescope", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "An astronomical telescope in normal adjustment has an objective of focal length 150 cm and an eyepiece of focal length 3 cm. Its angular magnifying power is:"}, {"difficulty": "easy", "options": ["A convex lens of small aperture", "A plane mirror at 45°", "A diverging lens of long focal length", "A concave parabolic mirror of large aperture"], "correct_index": 3, "explanations": ["A small convex lens would collect less light and not be a mirror.", "A plane mirror at 45° is the secondary mirror of the Newtonian design.", "A diverging lens cannot form a real image to be viewed by an eyepiece.", "A large concave parabolic mirror is the objective, free from chromatic and spherical aberrations."], "tag": "b05·Q79", "mid": "b05", "section": "Reflecting telescope", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In a Cassegrain reflecting telescope the objective lens is replaced by:"}, {"difficulty": "hard", "options": ["−0.80 D", "−1.25 D", "+1.25 D", "−12.5 D"], "correct_index": 1, "explanations": ["−0.80 is the focal length in metres, not the power in dioptres; the reciprocal was forgotten.", "f = −0.80 m, so P = 1/(−0.80) = −1.25 D.", "The magnitude is right but a positive lens converges light and cannot correct myopia.", "−12.5 D is a power-of-ten slip from dividing by 8 cm instead of 0.80 m."], "tag": "b05·Q80", "mid": "b05", "section": "Myopia correction power", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A myopic student can see clearly only up to 80 cm. What is the power of the spectacle lens needed for distant vision?"}, {"difficulty": "devil", "options": ["About 6 dB", "About 12 dB", "About 24 dB", "About 16 dB"], "correct_index": 1, "explanations": ["Wrong: a 6 dB fall is a four-fold intensity drop, which would follow if intensity were proportional to 1/r.", "Correct: intensity falls by 4² = 16, and 10 log 16 ≈ 12 dB.", "Wrong: 24 dB is a 250-fold drop, as if intensity followed 1/r⁴.", "Wrong: 16 is the intensity ratio, not the decibel change."], "tag": "b06·Q1", "mid": "b06", "section": "Inverse square law", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A listener moves from 1 m to 4 m from a small source radiating uniformly in open space. By how much does the sound level fall?"}, {"difficulty": "easy", "options": ["A hearing healthcare professional who identifies, diagnoses and treats auditory and vestibular problems of the ear", "A surgeon who treats diseases of the ear, nose and throat and completes five years of ENT residency", "A laboratory scientist who measures the frequency of ultrasound pulses in imaging departments", "A physicist who designs piezoelectric transducers for diagnostic imaging machines"], "correct_index": 0, "explanations": ["Correct: the lecture defines an audiologist as a hearing healthcare professional dealing with the auditory and vestibular areas of the ear.", "Wrong: this describes an otolaryngologist (ENT doctor), not an audiologist.", "Wrong: measuring ultrasound pulse frequency is a medical physics or sonography task and has nothing to do with the audiologist's role.", "Wrong: designing transducers is an engineering and physics task, not the clinical role of an audiologist."], "tag": "b06·Q2", "mid": "b06", "section": "Audiology", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which description best fits an audiologist?"}, {"difficulty": "hard", "options": ["0.58 cm", "5.3 cm", "6.0 cm", "1.7 cm"], "correct_index": 3, "explanations": ["Wrong: this divides the coefficient by 3 instead of dividing 3 dB by the coefficient.", "Wrong: this multiplies 3 by 1.75, which inverts the relationship.", "Wrong: this is 3 ÷ 0.5 and ignores the frequency scaling of the coefficient.", "Correct: coefficient = 0.5 × 3.5 = 1.75 dB/cm, so HVL = 3 dB ÷ 1.75 dB/cm ≈ 1.7 cm."], "tag": "b06·Q3", "mid": "b06", "section": "HVL", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A 3.5 MHz transducer is used in soft tissue with an attenuation coefficient of 0.5 dB/cm per MHz. What is the half value layer thickness?"}, {"difficulty": "medium", "options": ["It is the thickness that reduces beam intensity to zero", "It is the thickness that reduces beam intensity by 10 dB", "It is the thickness that doubles the beam intensity", "It is the thickness that re orresponds to what change in sound energy?"}, {"difficulty": "devil", "options": ["A source and receiver moving at the same velocity in the same direction still show a shift", "A source moving toward a stationary receiver raises the received frequency", "A stationary source with a moving receiver can produce a frequency shift", "At the instant a passing source is level with the observer the pitch equals the emitted pitch"], "correct_index": 0, "explanations": ["Correct (the false statement): with no relative motion between them the received frequency equals the emitted frequency, so no shift occurs.", "True, so not the answer: approach compresses the successive crests and raises the received frequency.", "True, so not the answer: it is relative motion that matters, so a moving receiver alone is enough for a shift.", "True, so not the answer: the lecture states the received frequency is identical to the emitted one at the instant of passing."], "tag": "b06·Q12", "mid": "b06", "section": "Doppler effect", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about the Doppler effect is FALSE?"}, {"difficulty": "medium", "options": ["1.5 µs", "0.17 µs", "3.5 µs", "6 µs"], "correct_index": 0, "explanations": ["Correct: pulse duration = period × cycles per pulse = 0.5 × 3 = 1.5 µs, within the 0.5 to 3 µs clinical range.", "Wrong: this divides the period by the number of cycles instead of multiplying.", "Wrong: this adds the two numbers, which have different units.", "Wrong: 6 µs would come from dividing 3 by 0.5, which inverts the equation."], "tag": "b06·Q13", "mid": "b06", "section": "Pulse duration", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A pulse contains 3 cycles and each cycle has a period of 0.5 µs. What is the pulse duration?"}, {"difficulty": "devil", "options": ["Intensity about 18-fold and amplitude about 4.2-fold", "Intensity about 63-fold and amplitude about 63-fold", "Intensity about 7.9-fold and amplitude about 63-fold", "Intensity about 63-fold and amplitude about 7.9-fold"], "correct_index": 3, "explanations": ["Wrong: this treats decibels as a linear factor of 18 and takes its square root.", "Wrong: power scales with amplitude squared, so amplitude cannot fall by the same factor as intensity.", "Wrong: this reverses the roles; intensity changes by the larger factor, amplitude by its square root.", "Correct: intensity factor = 10^(18/10) ≈ 63, and amplitude falls by its square root, √63 ≈ 7.9."], "tag": "b06·Q14", "mid": "b06", "section": "Decibels", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "An echo has been attenuated by 18 dB. By what factors have its intensity and its amplitude fallen?"}, {"difficulty": "devil", "options": ["0.8 µs", "198.0 µs", "199.2 µs", "192.0 µs Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 114"], "correct_index": 2, "explanations": ["Wrong: 0.8 µs is the transmit time (pulse duration), not the listening time.", "Wrong: this uses a duty factor of 1% instead of 0.4%.", "Correct: PRP = 200 µs, PD = 0.004 × 200 = 0.8 µs, and the listening time is 200 − 0.8 = 199.2 µs.", "Wrong: this uses a duty factor of 4% instead of 0.4%. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 125"], "tag": "b06·Q15", "mid": "b06", "section": "Pulsed sound", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A scanner has a PRF of 5 kHz and transmits for 0.4% of the time. How long does the transducer listen in each pulse repetition period?"}, {"difficulty": "medium", "options": ["It increases because the beam travels faster", "It stays the same because PRF is set by the tissue", "It increases to keep the image bright", "It decreases because the receiving time gets longer"], "correct_index": 3, "explanations": ["Wrong: speed is fixed by the tissue and does not rise with depth.", "Wrong: PRF is set by the source and system
