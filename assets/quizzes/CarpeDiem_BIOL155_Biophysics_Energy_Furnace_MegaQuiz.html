ts nearer the more heavily loaded foot.", "0.20 m would put the CG midway, with equal loads on each foot.", "0.15 m does not satisfy the moment balance."], "tag": "b03·Q33", "mid": "b03", "section": "Stability and CG", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A person weighing 800 N stands with feet 0.40 m apart. The left foot carries 600 N and the right foot 200 N. The CG lies on the line between the feet, at what distance from the left foot?"}, {"difficulty": "devil", "options": ["Shear force acts perpendicular to a surface, squeezing it", "Tension pulls and is the opposite of compression", "Torsion twists a structure about its longitudinal axis", "Bending creates compression on one side and tension on the other"], "correct_index": 0, "explanations": ["This is false: shear acts parallel or tangent to a surface and makes one portion slide relative to another.", "True: tension is the opposite of compressive force.", "True: torsion occurs about the longitudinal axis, typically with one end fixed.", "True: an eccentric force produces compressive stress on one side and tensile stress on the other."], "tag": "b03·Q34", "mid": "b03", "section": "Mechanical loads", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about mechanical loads is FALSE?"}, {"difficulty": "devil", "options": ["A discus in flight is a projectile", "Rockets and aeroplanes do not qualify as projectiles", "Angle, speed and relative height of projection set the path", "Trajectory depends only on the mass and the shape of the body"], "correct_index": 3, "explanations": ["True: a discus moving through the air unassisted qualifies.", "True: engine forces mean they are not subject only to gravity and air resistance.", "True: these are exactly the three factors named.", "This is false: the lecture lists angle of projection, projection speed and relative height of projection as the three trajectory factors."], " ematic even though ground reaction force is kinetic."], "tag": "b03·Q38", "mid": "b03", "section": "Kinetics vs kinematics", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which pair of measured quantities is entirely kinetic?"}, {"difficulty": "hard", "options": ["A longer flight time and a greater horizontal range", "A shorter flight time and a smaller horizontal range", "The same range, since speed and angle are equal", "A smaller range because the weight acts for longer"], "correct_index": 0, "explanations": ["A greater relative height of projection lets the shot fall for longer before landing, increasing horizontal displacement.", "Higher release lengthens the fall, it does not shorten it.", "Relative height is the third trajectory factor and changes the range even when speed and angle match.", "Gravity acts the same way throughout; extra time in flight adds horizontal travel. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 63"], "tag": "b03·Q39", "mid": "b03", "section": "Projectile", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Two shot putters release the shot at the same speed and angle, but one releases it from a higher point. Neglecting air resistance, the higher release gives:"}, {"difficulty": "medium", "options": ["At which the tissue first begins to be loaded", "At which the tissue ruptures completely", "Beyond which deformation becomes permanent", "Where deformation is greatest and always reversible Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 52"], "correct_index": 2, "explanations": ["Loading begins at the origin of the curve, well before yield.", "Complete rupture is failure, which occurs after yield.", "Past the yield point the tissue does not fully recover; deformation is permanent.", "Deformation before yield is reversible, but after yield it is not."], "tag": "b03·Q40", "mid": "b03", "section": "Yield point", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The yield point (elastic limit) on a load-deformation curve is the point:"}, {"difficulty": "devil", "options": ["410 N and 1128 N", "1128 N and 764 N", "1200 N and 410 N", "1128 N and 410 N"], "correct_index": 3, "explanations": ["Sine and cosine are swapped, as the angle is from the vertical.", "764 N is 1200 − 436, which is not a valid component.", "The vertical component is smaller than the resultant when the force is tilted.", "From the vertical, vertical = 1200 cos20° ≈ 1128 N and horizontal = 1200 sin20° ≈ 410 N."], "tag": "b03·Q41", "mid": "b03", "section": "Vector resolution", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A ground reaction force of 1200 N acts 20° from the vertical. Its vertical and horizontal components are about:"}, {"difficulty": "medium", "options": ["1.25 m/s", "0.8 m/s", "1.8 m/s", "2.7 m/s"], "correct_index": 2, "explanations": ["1.25 m/s comes from dividing length by frequency.", "0.8 m/s comes from dividing frequency by length.", "Gait speed = stride length × stride frequency = 1.5 × 1.2 = 1.8 m/s.", "2.7 m/s adds the two numbers instead of multiplying."], "tag": "b03·Q42", "mid": "b03", "section": "Gait", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A walker has a stride length of 1.5 m and a stride frequency of 1.2 strides per second. The walking speed is:"}, {"difficulty": "easy", "options": ["Velocity", "Displacement", "Speed", "Acceleration"], "correct_index": 2, "explanations": ["Velocity has both magnitude and direction.", "Displacement is a directed distance, a vector.", "Speed has magnitude only (distance divided by time), so it is scalar.", "Acceleration, the rate of change of velocity, is a vector."], "tag": "b03·Q43", "mid": "b03", "section": "Vectors", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which of the following is a scalar quantity?"}, gs and their effects, not mechanics."], "tag": "b03·Q46", "mid": "b03", "section": "Definition", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Biomechanics of human movement is a subdiscipline of which field?"}, {"difficulty": "devil", "options": ["1.8 m/s", "0.45 m/s", "0.9 m/s", "0.6 m/s Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 53"], "correct_index": 2, "explanations": ["1.8 m/s treats the 90 steps as strides, doubling the frequency.", "0.45 m/s halves the speed a second time without reason.", "90 steps/min = 45 strides/min = 0.75 strides/s, so speed = 1.2 × 0.75 = 0.9 m/s.", "0.6 m/s halves the stride length instead of converting steps to strides. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 64"], "tag": "b03·Q47", "mid": "b03", "section": "Gait", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A patient has a stride length of 1.2 m and a cadence of 90 steps per minute (one stride equals two steps). Using speed = stride length × stride frequency, the walking speed is:"}, {"difficulty": "hard", "options": ["X produces the greater torque because its force is larger", "Both produce equal torques since the distances sum to 0.8 m", "X produces 1500 N·m and Y produces 200 N·m", "Y produces the greater torque, 72 N·m against 60 N·m"], "correct_index": 3, "explanations": ["A larger force does not guarantee a larger torque; the perpendicular distance matters equally.", "Torque depends on each product F × d, not on the sum of distances.", "1500 and 200 come from dividing the force by distance and distance by force, which are not torques.", "T = F × d gives 60 N·m for X and 72 N·m for Y, so the longer lever arm outweighs the smaller force."], "tag": "b03·Q48", "mid": "b03", "section": "Torque", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Force X of 300 N acts with a perpendicular distance of 0.2 m from a joint axis, and force Y of 120 N acts with a perpendicular distance of 0.6 m. Which statement is correct?"}, {"difficulty": "medium", "options": ["Speed 0 m/s; velocity 8 m/s", "Speed 8 m/s; velocity 0 m/s", "Speed 8 m/s; velocity 8 m/s", "Speed 0 m/s; velocity 0 m/s"], "correct_index": 1, "explanations": ["Speed cannot be zero when distance was covered, and velocity cannot exceed speed here.", "Speed uses distance (400 m ÷ 50 s = 8 m/s) while velocity uses displacement, which is zero for a closed lap.", "Velocity uses displacement, which is zero, so it cannot equal 8 m/s.", "Speed is distance over time and is 8 m/s, not zero."], "tag": "b03·Q49", "mid": "b03", "section": "Speed vs velocity", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A skater travels 400 m round a circular track in 50 s and finishes at the start point. Her average speed and average velocity are:"}, {"difficulty": "hard", "options": ["25%, from 1.8 m/s to 2.25 m/s", "8%, from 1.8 m/s to 1.95 m/s", "33%, from 1.8 m/s to 2.4 m/s", "67%, from 1.8 m/s to 3.0 m/s"], "correct_index": 2, "explanations": ["25% is the rise in stride length alone, ignoring the change in frequency.", "8% is the rise in frequency alone, ignoring the longer stride.", "Speed = length × frequency: 1.2 × 1.5 = 1.8 m/s and 1.5 × 1.6 = 2.4 m/s, a rise of 0.6/1.8 ≈ 33%.", "67% is a miscalculation; 3.0 m/s does not follow from these values."], "tag": "b03·Q50", "mid": "b03", "section": "Gait", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A walker increases from stride length 1.2 m at 1.5 strides/s to stride length 1.5 m at 1.6 strides/s. The speed rises by about:"}, {"difficulty": "hard", "options": ["5.3 kg and about 5.3 N", "5.3 kg and about 52 N", "212 kg and about 2078 N", "0.53 kg and about 5.2 N"], "correct_index": 1, "explanations": ["5.3 N forgets to multiply the mass by g.", "Mass = ρ × V = 1060 × 0.005 = 5.3 kg, and weight = m g = 5.3 × 9.8 ≈ 52 N.", "212 kg arises from dividing density by volume, and 2078 N follows from that error.", "0.53 kg is a power-of-ten slip and gives a wrong weight as well."], "tag": "b03·Q51", "mid": "b03", "section": "Density and weight", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Blood has a density of about 1060 kg/m³. For a 5 litre (0.005 m³) volume, the mass and weight (g = 9.8 m/s²) are:"}, {"difficulty": "hard", "options": ["800 N directed downward", "600 N directed upward", "700 N directed downward", "600 N directed downward"], "correct_index": 3, "explanations": ["800 N adds the weight to the floor force, which does not give a zero sum.", "The net of F1 and F3 is upward, so F2 must oppose it, i.e. act downward.", "700 N ignores the leg's own weight, which already supplies 100 N of the downward force.", "For equilibrium the vector sum is zero: 700 N up balanced by 100 N down plus F2, so F2 = 600 N down."], "tag": "b03·Q52", "mid": "b03", "section": "Free body diagram", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A leg is in equilibrium. The floor pushes up on the foot with F1 = 700 N, gravity pulls the leg down with F3 = 100 N, and the rest of the body acts at the hip with force F2 along the same vertical line. The force F2 must be:"}, {"difficulty": "medium", "options": ["50 N and 86.6 N", "86.6 N and 50 N", "70.7 N and 70.7 N", "100 N and 30 N"], "correct_index": 1, "explanations": ["These are swapped; the larger component lies along the nearer axis at 30°.", "Horizontal = 100 cos30° ≈ 86.6 N and vertical = 100 sin30° = 50 N; they recombine to the original vector.", "70.7 N each applies at 45°, not 30°.", "The angle is not a force component, and the components must recombine to 100 N."], "tag": "b03·Q53", "mid": "b03", "section": "Vector resolution", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A 100 N force acts at 30° above the horizontal. Its horizontal and vertical components are about:"}, {"difficulty": "hard", "options": ["Compressive on the lateral and tensile on the medial", "Compressive on both lateral and medial surfaces", "Tensile on the lateral and compressive on the medial", "Tensile on both lateral and medial surfaces Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 54"], "correct_index": 2, "explanations": ["This reverses the pattern; the convex side is stretched, not squeezed.", "Bending produces opposite stress types on the two sides, not pure compression.", "In bending, the convex (stretched) side carries tensile stress and the concave side carries compressive stress.", "Bending produces opposite stress types on the two sides, not pure tension. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 65"], "tag": "b03·Q54", "mid": "b03", "section": "Bending", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A long bone is loaded eccentrically and bows so that its lateral surface becomes convex. The stresses on its lateral and medial surfaces are respectively:"}, {"difficulty": "hard", "options": ["343 N", "49 N", "245 N", "3430 N"], "correct_index": 0, "explanations": ["Torque balance gives F × 0.05 = 49 × 0.35, so F = 17.15 ÷ 0.05 = 343 N; the short moment arm forces a large muscle force.", "49 N would only hold if both forces had equal moment arms.", "245 N results from multiplying 49 by 5 (the mass) rather than by the distance ratio of 7.", "3430 N is a power-of-ten slip in 17.15 ÷ 0.05."], "tag": "b03·Q55", "mid": "b03", "section": "Torque balance", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A 5 kg mass (weight 49 N, g = 9.8 m/s²) is held in the hand 0.35 m from the elbow axis. The biceps inserts 0.05 m from the axis. Ignoring the forearm's own weight, the biceps force needed is:"}, {"difficulty": "easy", "options": ["Force multiplied by the time of application", "Force multiplied by perpendicular distance",  whole 0.4 m as perpendicular.", "2 N·m is a power-of-ten slip."], "tag": "b03·Q61", "mid": "b03", "section": "Torque", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A 100 N force acts on a 0.4 m lever at 30° to the lever's length. The torque about the pivot is:"}, {"difficulty": "medium", "options": ["Acute loading by a single large force", "A purely tensile load on the skin", "A vector composition error in gait", "Repetitive (chronic) loading of subacute magnitude Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 55"], "correct_index": 3, "explanations": ["Acute loading is a single force big enough to injure at once, not the case here.", "Skin tension does not explain a bone stress fracture.", "Vector composition is a mathematical operation, not a cause of injury.", "Repeated subacute loads over a period can produce a chronic or stress injury. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 66"], "tag": "b03·Q62", "mid": "b03", "section": "Loading types", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A runner develops a stress fracture after weeks of repeated low-magnitude impacts. This injury arose from:"}, {"difficulty": "easy", "options": ["Curvilinear motion", "Rectilinear motion", "Angular motion", "General motion"], "correct_index": 1, "explanations": ["Curvilinear motion is translation along a curved line.", "If the line of translation is straight, the motion is rectilinear.", "Angular motion is rotation about an axis, not motion along a line.", "General motion combines translation and rotation."], "tag": "b03·Q63", "mid": "b03", "section": "Linear motion", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Linear motion along a straight line is called:"}, {"difficulty": "medium", "options": ["Angle of projection, mass and air temperature", "Speed, body volume and surface friction", "Angle, speed and relative height of projection", "Relative height, density and time of day"], "correct_index": 2, "explanations": ["Mass and air temperature are not among the listed trajectory factors.", "Volume and surface friction are not listed factors.", "The lecture names angle of projection, projection speed and relative height of projection.", "Density and time of day have no role in the lecture's trajectory factors."], "tag": "b03·Q64", "mid": "b03", "section": "Projectile", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which set lists the three factors that influence a projectile's trajectory?"}, {"difficulty": "easy", "options": ["Sagittal plane", "Frontal plane", "Transverse plane", "Coronal-transverse plane"], "correct_index": 0, "explanations": ["The three primary sagittal plane movements from anatomical position are flexion, extension and hyperextension.", "The frontal plane houses abduction and adduction.", "The transverse plane houses rotations such as supination and pronation.", "No such combined plane is used; these movements are sagittal."], "tag": "b03·Q65", "mid": "b03", "section": "Joint movements", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Flexion, extension and hyperextension occur mainly in which plane?"}, {"difficulty": "hard", "options": ["75 N in the direction of the muscle pull", "55 N in the direction of the muscle pull", "15 N in the direction of the muscle pull", "55 N in the direction of the load"], "correct_index": 1, "explanations": ["75 N would result only if the opposing load were wrongly added as well.", "Same-direction vectors add (40 + 25 = 65 N) and the opposing 10 N is subtracted, leaving 55 N along the muscle pull.", "15 N subtracts the two muscle forces from each other instead of adding them.", "The pulls outweigh the load, so the resultant points along the pull, not along the load."], "tag": "b03·Q66", "mid": "b03", "section": "Vector composition", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Two muscles pull on a bone in the same direction with forces of 40 N and 25 N, while an opposing load of 10 N acts in the opposite direction along the same line. The resultant is:"}, {"difficulty": "hard", "options": ["Restored fully to its original length and shape", "Ruptured, because passing yield equals failure", "Unchanged, because deformation only starts at failure", "Permanently lengthened but with mechanical continuity retained"], "correct_index": 3, "explanations": ["Full recovery occurs only below the yield point (the elastic region).", "Failure is a separate, later point on the curve where continuity is lost.", "Deformation begins at the start of loading; the yield point only marks where it becomes permanent.", "Past the yield point deformation is permanent, but failure (loss of continuity) needs further loading."], "tag": "b03·Q67", "mid": "b03", "section": "Yield point", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A ligament is loaded just past its yield point and the load is then removed. Its state is best described as:"}, {"difficulty": "easy", "options": ["Plantar flexion", "Eversion", "Inversion", "Dorsiflexion"], "correct_index": 3, "explanations": ["Plantar flexion is the opposite, 'planting' the ball of the foot.", "Eversion is outward rotation of the sole in the frontal plane.", "Inversion is inward rotation of the sole in the frontal plane.", "Dorsiflexion moves the top of the foot toward the lower leg, in the sagittal plane."], "tag": "b03·Q68", "mid": "b03", "section": "Joint movements", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Bringing the top of the foot toward the lower leg is termed:"}, {"difficulty": "easy", "options": ["Translatory motion, or translation", "Rotatory motion, or rotation", "General motion, or combined motion", "Circumduction, or circular motion"], "correct_index": 0, "explanations": ["In linear motion all parts of the system move in the same direction at the same speed, which is called translation.", "Rotation is angular motion about an axis.", "General motion is the combination of translation and rotation.", "Circumduction is a special circular movement of a body segment, not linear motion."], "tag": "b03·Q69", "mid": "b03", "section": "Linear motion", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Linear motion is also referred to as:"}, {"difficulty": "medium", "options": ["6 m/s²", "3.3 m/s²", "0.5 m/s²", "2 m/s² Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 56"], "correct_index": 3, "explanations": ["6 m/s² is the velocity change alone, not divided by time.", "3.3 m/s² adds the velocities before dividing.", "0.5 m/s² divides time by velocity change, inverted.", "a = change in velocity ÷ change in time = (8 − 2) ÷ 3 = 2 m/s². Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 67"], "tag": "b03·Q70", "mid": "b03", "section": "Acceleration", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A sprinter's velocity increases from 2 m/s to 8 m/s in 3 s. The average acceleration is:"}, {"difficulty": "devil", "options": ["About 618 N, down and against the friction force", "600 N, pointing straight down", "About 750 N, down and along the friction force", "About 716 N, down and against the friction force"], "correct_index": 0, "explanations": ["Vertical: 700 − 100 = 600 N down. Horizontal: 150 N opposing the friction force. Magnitude √(600² + 150²) ≈ 618 N.", "600 N is only the vertical part; the horizontal 150 N must also be balanced.", "750 N adds the components arithmetically, and the horizontal part points the wrong way.", "716 N comes from using 700 N instead of the net vertical 600 N."], "tag": "b03·Q71", "mid": "b03", "section": "Free body diagram", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A leg is in equilibrium. The floor pushes up with 700 N and pushes forward with a 150 N friction force. The leg's weight is 100 N. The hip force F2 has magnitude and direction:"}, {"difficulty": "easy", "options": ["Rectilinear motion", "Pure angular motion", "Projectile motion", "General motion"], "correct_index": 3, "explanations": ["Rectilinear motion is straight-line translation only.", "Pure angular motion has no translation component.", "Projectile motion refers to a body in free fall under gravity and air resistance.", "Combined translation and rotation is general motion, which is how most human movement occurs."], "tag": "b03·Q72", "mid": "b03", "section": "General motion", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "When translation and rotation are combined, the resulting movement is called:"}, {"difficulty": "hard", "options": ["Speed 6 km/h; velocity 12 km/h east", "Speed 12 km/h; velocity 12 km/h east", "Speed 12 km/h; velocity 6 km/h east", "Speed 8 km/h; velocity 4 km/h east"], "correct_index": 2, "explanations": ["Swapped: speed uses total distance and cannot be less than the velocity magnitude.", "Velocity uses net displacement (2 km), not total distance, so it cannot equal 12 km/h.", "Speed = total distance 4 km ÷ (1/3 h) = 12 km/h; velocity = net displacement 2 km east ÷ (1/3 h) = 6 km/h east.", "8 and 4 km/h arise from dividing by 30 min rather than 20 min."], "tag": "b03·Q73", "mid": "b03", "section": "Speed vs velocity", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A jogger runs 3 km east in 15 min, then 1 km west in 5 min. For the whole 20 min, average speed and average velocity are:"}, {"difficulty": "easy", "options": ["Hyperextension", "Extension", "Abduction", "Circumduction"], "correct_index": 0, "explanations": ["Hyperextension is rotation past anatomical position opposite to the direction of flexion.", "Extension only returns a segment from flexion to anatomical position.", "Abduction is a frontal plane movement away from the midline.", "Circumduction is circular movement of a segment, a special case of general motion."], "tag": "b03·Q74", "mid": "b03", "section": "Joint movements", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Rotation of a body segment beyond anatomical position, in the direction opposite flexion, is called:"}, {"difficulty": "devil", "options": ["Torsion, then bending", "Bending, then torsion", "Pure shear, then torsion", "Compression, then tension"], "correct_index": 0, "explanations": ["A fixed foot with a rotating body twists the tibia about its long axis (torsion), while a lateral blow is an eccentric force that bends it.", "This reverses the pairing; twisting with a fixed end is torsion.", "Shear slides parallel surfaces, and the twisting fracture is explained by torsion instead.", "An axial squeeze and pull do not explain a twisting injury or a sideways blow."], "tag": "b03·Q75", "mid": "b03", "section": "Fracture mechanism", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A skier's boot stays fixed in the binding while the body rotates, producing a spiral tibial fracture. A pedestrian struck on the side of the leg gets a transverse fracture. The loads are respectively:"}, {"difficulty": "easy", "options": ["Toward the midline of the body", "Away from the midline of the body", "Backward beyond anatomical position", "Outward about the longitudinal axis"], "correct_index": 1, "explanations": ["Toward the midline is adduction, meaning 'to bring back'.", "Abduct means 'to take away', so abduction moves a segment away from the midline.", "Rotation beyond anatomical position opposite to flexion is hyperextension.", "Rotation about the longitudinal axis occurs in the transverse plane."], "tag": "b03·Q76", "mid": "b03", "section": "Joint movements", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Abduction is the movement of a body segment:"}, {"difficulty": "easy", "options": ["Parallel to the plane in which the rotation occurs", "Along the midline of the body in every case", "Perpendicular to the plane in which the rotation occurs", "Within the plane, passing through the centre of gravity"], "correct_index": 2, "explanations": ["An axis lying parallel to the plane would not give rotation within that plane.", "The axis depends on the movement and plane, not always the body midline.", "The lecture defines the axis as an imaginary line perpendicular to the plane of rotation.", "The axis is perpendicular to, not within, the plane of rotation."], "tag": "b03·Q77", "mid": "b03", "section": "Angular motion", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The axis of rotation in angular motion is oriented:"}, {"difficulty": "hard", "options": ["1470 N", "75 N", "1545 N", "1395 N Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 57"], "correct_index": 2, "explanations": ["1470 N is only the weight and would give constant velocity, not acceleration.", "75 N is only the extra force for acceleration; the lifter must also support the weight.", "The net force is m a = 75 N upward over and above the weight of 1470 N, so the lifter supplies 1470 + 75 = 1545 N.", "1395 N subtracts the acceleration term, which would produce downward acceleration. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 68"], "tag": "b03·Q78", "mid": "b03", "section": "Weight and force", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A 150 kg weight bar is lifted vertically with an upward acceleration of 0.5 m/s² (g = 9.8 m/s²). The upward force the lifter must apply is:"}, {"difficulty": "easy", "options": ["A graph of displacement plotted against time", "A photograph of the body taken during movement", "A diagram of internal muscle fibre arrangement only", "A simplified drawing of an isolated body showing all external forces and moments"], "correct_index": 3, "explanations": ["A displacement-time graph is a kinematic plot, not an FBD.", "An FBD is a schematic, not a photograph.", "FBDs show forces and moments, not fibre architecture.", "An FBD isolates a body or segment from its surroundings and shows the external forces and moments acting on it."], "tag": "b03·Q79", "mid": "b03", "section": "Free body diagram", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A free body diagram is best defined as:"}, {"difficulty": "hard", "options": ["147 kPa", "1.47 MPa", "14.7 MPa", "2.35 kPa"], "correct_index": 1, "explanations": ["147 kPa comes from treating 4 cm² as 4 × 10⁻³ m².", "P = F/A = 588 N ÷ 4 × 10⁻⁴ m² = 1.47 × 10⁶ Pa = 1.47 MPa; converting cm² to m² is the key step.", "14.7 MPa is a factor of ten too large.", "2.35 kPa comes from 588 ÷ 0.25 m², not 4 cm²."], "tag": "b03·Q80", "mid": "b03", "section": "Pressure", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A 60 kg woman (weight 588 N) momentarily balances on one stiletto heel of area 4 cm² (4 × 10⁻⁴ m²). The pressure under the heel is:"}, {"difficulty": "devil", "options": ["0.68 mm", "6.8 mm", "68 mm", "13.6 mm"], "correct_index": 1, "explanations": ["This is ten times too small.", "I = (0.02 / 5.0) × 1.7 m = 0.0068 m = 6.8 mm.", "This is ten times too large; it is also bigger than a real eyeball.", "This doubles the correct image size."], "tag": "b04·Q1", "mid": "b04", "section": "Image size", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Using image = (0.02 m ÷ object distance) × object height, what is the retinal image of a 1.7 m tall person standing 5.0 m away?"}, {"difficulty": "easy", "options": ["energy moving from one place to another as waves or particles", "a substance that is stored permanently inside living tissue", "a chemical reaction that releases heat inside the cell", "the s", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Cones have higher acuity than rods mainly because:"}, {"difficulty": "devil", "options": ["sharper and brighter, as the receptors keep a steady signal", "unchanged, as the visual cortex fills in the missing signal", "flipped in colour, since cones adapt to opposite hues", "fading away, as stationary retinal images are essentially invisible"], "correct_index": 3, "explanations": ["A steady image gives less stimulation, not more.", "The lecture states stationary retinal images are essentially invisible.", "The effect concerns loss of visibility, not reversal of colour.", "Eye movements keep shifting the image on the retina; a stabilised image is stationary there and fades from perception."], "tag": "b04·Q5", "mid": "b04", "section": "Visual perception", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A researcher uses a contact-lens device that holds a test image perfectly fixed on the retina despite eye movements. According to the lecture, the viewer will find the image:"}, {"difficulty": "devil", "options": ["0.8 D, falling from 1.0 D to 0.2 D", "12 D, falling from 12 D to 0 D", "8 D, falling from 10 D to 2 D", "40 cm, falling from 50 cm to 10 cm"], "correct_index": 2, "explanations": ["This is a power-of-ten slip from using centimetres in place of metres.", "This sums the two values instead of finding the reduction, and 50 cm is not zero power.", "Child: 1/0.10 = 10 D; at 50 cm: 1/0.50 = 2 D; the loss is 8 D, consistent with weaker ciliary muscles and a stiffer lens.", "This is a change in distance, not in dioptres of accommodation."], "tag": "b04·Q6", "mid": "b04", "section": "Accommodation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Extra power over the relaxed eye is 1/(near point in metres). A child has a near point of 10 cm and the same person at 60 years has 50 cm. How much accommodation is  the product of the two speeds", "n = 1/f, the reciprocal of focal length"], "correct_index": 0, "explanations": ["n = c/v, where c is the speed of light in vacuum and v is the phase velocity in the medium.", "This inverts the ratio and would give values below 1 for ordinary media.", "n is a ratio and is dimensionless, so a product is wrong.", "1/f is optical power in dioptres, not refractive index."], "tag": "b04·Q9", "mid": "b04", "section": "Refractive index", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The refractive index n of a material is defined as:"}, {"difficulty": "hard", "options": ["−2.0 D, a diverging lens of f = −50 cm", "+2.0 D, a converging lens of f = +50 cm", "−0.5 D, a diverging lens of f = −2.0 m", "−20 D, a diverging lens of f = −5 cm"], "correct_index": 0, "explanations": ["The lens must form a virtual image of infinity at 50 cm, so f = −0.50 m and P = 1/f = −2.0 D.", "A converging lens would increase the over-convergence of a myopic eye.", "This inverts the calculation: P = 1/0.5 m = 2 D, not 0.5 D.", "This is ten times too strong; f must be −50 cm, not −5 cm."], "tag": "b04·Q10", "mid": "b04", "section": "Eye defects", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A short-sighted student has a far point of 50 cm. A thin lens that makes distant objects appear at 50 cm must have a power of:"}, {"difficulty": "medium", "options": ["objects at infinity are in sharp focus on the retina", "objects at 25 cm are in sharp focus on the retina", "objects at all distances are in focus without any effort", "the cornea has taken over all of the focusing duty"], "correct_index": 0, "explanations": ["With relaxed muscles the lens is at its weakest; its roughly 2.5 cm focal length puts distant objects in focus on the retina.", "Focusing at 25 cm needs the lens to be more convex, which means a shorter focal length.", "Nearer objects need a change in lens curvature, so accommodation is required.", "The cornea is fixed in power; the lens simply sits in its flattest state here."], "tag": "b04·Q11", "mid": "b04", "section": "Accommodation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "When the ciliary muscles are relaxed, a normal eye has a lens focal length of about 2.5 cm. This means:"}, {"difficulty": "devil", "options": ["−0.5 D, a diverging lens with f = −2.0 m", "+0.5 D, a converging lens with f = +2.0 m", "−2.0 D, a diverging lens with f = −0.5 m", "−5.0 D, a diverging lens with f = −0.2 m"], "correct_index": 0, "explanations": ["The lens must place infinity at the far point as a virtual image 2.0 m away, so f = −2.0 m and P = 1/f = −0.5 D.", "A converging lens adds to the already excessive convergence of a myopic eye.", "This takes the 2.0 m number as the power; power is the reciprocal of f in metres.", "This corresponds to a far point of 20 cm, ten times too short."], "tag": "b04·Q12", "mid": "b04", "section": "Eye defects", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A myopic patient has a far point of 2.0 m. Treating the spectacle as a thin lens, the power needed to see distant objects clearly is:"}, {"difficulty": "medium", "options": ["20 males and 2 females", "2 males and 20 females", "20 males and 20 females", "200 males and 2 females"], "correct_index": 0, "explanations": ["8% of 250 = 20 males and 0.4% of 500 = 2 females.", "This swaps the male and female prevalences.", "0.4% of 500 gives 2, not 20.", "8% of 250 is 20, not 200; that is a power-of-ten slip."], "tag": "b04·Q13", "mid": "b04", "section": "Colour vision", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In an exam hall of 250 male students and 500 female students, how many colour-defective individuals are expected using the lecture's figures (8% males, 0.4% females)?"}, {"difficulty": "devil", "options": ["about 13 ps", "about 190 ps", "about 27 ps", "about 19 ps Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 71"], "correct_index": 3, "explanations": ["This uses the vacuum speed and ignores that light is slowed by a factor of 1.43.", "This is a power-of-ten slip in the thickness or the time unit.", "This multiplies by the index twice, effectively applying n² to the transit time.", "t = d/v = n d/c = 1.43 × 4.0 × 10⁻³ / 3.0 × 10⁸ ≈ 1.9 × 10⁻¹¹ s = 19 ps."], "tag": "b04·Q14", "mid": "b04", "section": "Refractive index", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Take c = 3.0 × 10⁸ m/s. How long does light take to cross a crystalline lens 4.0 mm thick (n = 1.43)?"}, {"difficulty": "devil", "options": ["1800", "600", "1200", "3600"], "correct_index": 2, "explanations": ["This gives each rod and each cone its own bipolar cell, ignoring rod pooling.", "This halves the total, which matches neither wiring rule.", "Rods: 900 ÷ 3 = 300 bipolar cells; cones: 900 × 1 = 900; the total is 1200.", "This multiplies the rods by three instead of dividing by three. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 82"], "tag": "b04·Q15", "mid": "b04", "section": "Bipolar cells", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A retinal patch holds 900 rods and 900 cones. Using the lecture's wiring, how many bipolar cells carry its signals?"}, {"difficulty": "medium", "options": ["the rods have been permanently destroyed by the red light", "the cornea has become more curved after prolonged staring", "the optic nerve has reversed the direction of its signals", "the red iodopsin has been bleached and is temporarily out of order"], "correct_index": 3, "explanations": ["Bleaching is temporary and concerns cone pigment, not permanent rod destruction.", "Corneal curvature does not change with staring; this is a pigment effect.", "The optic nerve does not reverse signals; the effect arises in the receptors.", "The lecture explains bleaching: prolonged red stimulation exhausts the red iodopsin, which then cannot respond properly to white light for a while."], "tag": "b04·Q16", "mid": "b04", "section": "Bleaching", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "After staring at a red picture and then looking at white paper, you briefly see a pale blue-green patch because:"}, {"difficulty": "medium", "options": ["the curvature of its surfaces and the speed of light in it versus the surroundings", "the thickness of the sclera and the size of the pupil opening", "the tension in the ciliary muscles holding the corneal edge", "the colour of the iris and the amount of pigment in the choroid"], "correct_index": 0, "explanations": ["Refraction at the cornea is set by surface curvature and by the speed of light in the corneal material compared with the surrounding medium.", "The sclera and pupil do not set how strongly the cornea refracts; they are separate structures.", "Ciliary muscles alter the lens, not the fixed-focus cornea.", "Pigment and iris colour affect light absorption, not refraction at the cornea."], "tag": "b04·Q17", "mid": "b04", "section": "Cornea", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "According to the lecture, the amount of bending of light by the cornea depends on:"}, {"difficulty": "devil", "options": ["about 95%", "about 50%", "about 20%", "about 8%"], "correct_index": 0, "explanations": ["Males: 48; females: 2.4; total 50.4, so males make 48/50.4 ≈ 95%.", "This assumes equal counts of defective males and females, ignoring the 20-fold rate difference.", "This takes the 20:1 rate ratio as a percentage.", "This is the male defect rate, not the male share of defective people."], "tag": "b04·Q18", "mid": "b04", "section": "Colour vision", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A first-year group has 600 males and 600 females. Using 8% and 0.4% colour defect rates, what share of the colour-defective students would be male?"}, {"difficulty": "easy", "options": ["gelatinous vitreous humour", "blood-rich pigmented tissue", "clear, watery aqueous humour", "a mucous film of tear secretion"], "correct_index": 2, "explanations": ["Vitreous humour fills the posterior chamber, not the anterior chamber.", "That describes the choroid, which is a coat of the eye and not a chamber fluid.", "The anterior chamber holds aqueous humour, which is clear and watery and leaks out when the eye is injured.", "Tears and mucous sit on the surface; the anterior chamber contains aqueous humour."], "tag": "b04·Q19", "mid": "b04", "section": "Eye structure", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The anterior chamber of the eye contains:"}, {"difficulty": "easy", "options": ["cerebellum", "corpus callosum", "optic chiasm", "fovea centralis"], "correct_index": 1, "explanations": ["The cerebellum is a layered part of the brain, not the link between the hemispheres.", "The lecture states the hemispheres are split into right and left and joined only by the corpus callosum.", "The optic chiasm is where optic nerve fibres partially cross; it is not the hemisphere-joining structure.", "The fovea is a retinal area of sharpest vision, nothing to do with joining hemispheres."], "tag": "b04·Q20", "mid": "b04", "section": "Brain organization", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The right and left cerebral hemispheres are joined only by the:"}, {"difficulty": "medium", "options": ["the cornea has a higher index than the lens, at 1.43", "light meets its largest index step there, from air (1) to cornea (1.37)", "the cornea can change its shape by ciliary muscle action", "the cornea absorbs most light and re-emits it inward"], "correct_index": 1, "explanations": ["The lens, not the cornea, has the higher index (1.43 versus 1.37).", "Bending depends on the index change at an interface, and the air-cornea boundary has the largest step (1 to 1.37) in the whole eye.", "The cornea is the fixed-focus element; the lens is the variable one.", "Focusing is by refraction, not by absorption and re-emission."], "tag": "b04·Q21", "mid": "b04", "section": "Refractive focusing", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Why is the cornea the main focusing element of the eye?"}, {"difficulty": "medium", "options": ["far sightedness, because light is focused behind the retina", "near sightedness, because light is focused in front of the retina", "astigmatism, because the retina is unevenly illuminated", "colour blindness, because cones receive too much light Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 72"], "correct_index": 1, "explanations": ["Far sightedness comes from too little curvature, not too much.", "Excess corneal curvature gives too much bending, so the focus falls in front of the retina: near sightedness (myopia).", "Astigmatism is caused by uneven curvature, not by uniformly excessive curvature.", "Colour blindness is a receptor defect and is unrelated to corneal curvature."], "tag": "b04·Q22", "mid": "b04", "section": "Eye defects", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A student's cornea is curved more than normal. What defect does the lecture say results?"}, {"difficulty": "easy", "options": ["25 cm", "2.5 cm", "1 m", "infinity"], "correct_index": 3, "explanations": ["25 cm is the normal near point, not the far point.", "2.5 cm is the approximate focal length of the relaxed lens, not a far point.", "A far point of about 1 m would be abnormal and reflects short-sightedness.", "The far point is the most distant point seen clearly; for a normal eye it is at infinity. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 83"], "tag": "b04·Q23", "mid": "b04", "section": "Accommodation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "For a normal eye, the far point lies at:"}, {"difficulty": "medium", "options": ["most to blue, least to green/yellow", "most to green/yellow, least to blue", "most to red, least to green/yellow", "most to blue/violet, least to red"], "correct_index": 1, "explanations": ["This reverses the lecture's statement.", "The lecture states the eye is most sensitive to green/yellow and least sensitive to blue.", "Red is not the peak of sensitivity; green/yellow is.", "The eye is least sensitive to blue, not red."], "tag": "b04·Q24", "mid": "b04", "section": "Colour vision", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The eye is most sensitive to which colours and least sensitive to which?"}, {"difficulty": "hard", "options": ["−3.0 D, a diverging lens", "+3.0 D, a converging lens", "+5.0 D, a converging lens", "+1.0 D, a converging lens"], "correct_index": 1, "explanations": ["A diverging lens would push the focus further back; hyperopia needs added convergence.", "The lens must place an object at 25 cm as a virtual image at 100 cm: 1/f = 1/0.25 − 1/1.0 = 4 − 1 = +3.0 D.", "This adds the two reciprocals instead of subtracting for a virtual image.", "This uses only the near point 1/1.0 m and ignores the 4 D at 25 cm."], "tag": "b04·Q25", "mid": "b04", "section": "Eye defects", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A far-sighted person has a near point at 100 cm and wants to read at 25 cm. The required thin-lens power is:"}, {"difficulty": "easy", "options": ["solar sources and nuclear sources", "natural sources and artificial sources", "medical sources and industrial sources", "visible sources and invisible sources"], "correct_index": 1, "explanations": ["These are examples within the two main categories, not the two main sources themselves.", "The lecture splits radiation sources into natural (e.g. cosmic, terrestrial) and artificial (man-made, e.g. X-ray machines).", "Both are artificial sources, so they are not the two top-level categories.", "Visibility is not how the lecture classifies sources of radiation."], "tag": "b04·Q26", "mid": "b04", "section": "Radiation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The two main sources of radiation named in the lecture are:"}, {"difficulty": "hard", "options": ["it halves, from 20 µm to 10 µm", "it quadruples, from 20 µm to 80 µm", "it doubles, from 20 µm to 40 µm", "it stays at 20 µm because the lens adjusts"], "correct_index": 2, "explanations": ["Image size grows, not shrinks, as the object approaches.", "Size varies as 1/distance, not 1/distance², so the factor is two.", "Image size is inversely proportional to object distance, so halving the distance doubles the image: 0.02/1.5 × 0.003 m = 40 µm.", "Accommodation fixes focus, but angular size still changes the image size."], "tag": "b04·Q27", "mid": "b04", "section": "Image size", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The fly of 3 mm moves from 3.0 m to 1.5 m from the eye. How does its retinal image change (lens-to-retina distance fixed)?"}, {"difficulty": "hard", "options": ["4.3 × 10⁸ m/s", "2.1 × 10⁸ m/s", "2.1 × 10⁷ m/s", "3.0 × 10⁸ m/s"], "correct_index": 1, "explanations": ["This multiplies c by n, giving a speed above c, which is not allowed for a medium.", "v = c/n = 3.0 × 10⁸ / 1.43 ≈ 2.1 × 10⁸ m/s.", "This is ten times too small, a power-of-ten slip.", "This is the vacuum value; the lens slows light by the factor 1.43."], "tag": "b04·Q28", "mid": "b04", "section": "Refractive index", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Taking c = 3.0 × 10⁸ m/s, the speed of light in the crystalline lens (n = 1.43) is closest to:"}, {"difficulty": "medium", "options": ["near sightedness, with focus falling ahead of the retina", "astigmatism, with focus split across different planes", "far sightedness, with focus falling behind the retina", "presbyopia, with a lens that cannot change shape"], "correct_index": 2, "explanations": ["Near sightedness comes from too much curvature, the opposite situation.", "Astigmatism is caused by uneven, not weak, curvature.", "Insufficient curvature under-bends light, so the focal point lies behind the retina; the lecture calls this far sightedness.", "Presbyopia is an ageing change in the lens, not a corneal curvature problem."], "tag": "b04·Q29", "mid": "b04", "section": "Eye defects", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A cornea with not enough curvature will cause:"}, {"difficulty": "easy", "options": ["the metre, called the focal unit", "the inverse metre, called the dioptre", "the candela, a unit of light intensity", "the watt, a unit of energy rate Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 73"], "correct_index": 1, "explanations": ["Focal length is in metres, but power is its reciprocal and is not in metres.", "Optical power is the reciprocal of focal length (m⁻¹), commonly called the dioptre.", "The candela measures luminous intensity and is not used for lens power.", "The watt measures power as energy per second, a different meaning of power."], "tag": "b04·Q30", "mid": "b04", "section": "Optical power", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Optical power of a lens is given by P = 1/f. Its SI unit is:"}, {"difficulty": "hard", "options": ["4.7 D", "210 D", "0.37 D", "47 D"], "correct_index": 3, "explanations": ["This is a power-of-ten slip; 0.37/0.0078 is about 47, not 4.7.", "This is 1.37/0.0078 less the wrong factor; the index step is 0.37, not 1.37 × something larger.", "This forgets to divide by R in metres.", "P = (1.37 − 1)/0.0078 m = 0.37/0.0078 ≈ 47 D, which shows why the cornea supplies most of the eye's power. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 84"], "tag": "b04·Q31", "mid": "b04", "section": "Refractive focusing", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A single refracting surface has power (n₂ − n₁)/R. For the cornea, n₁ = 1 (air), n₂ = 1.37 and R = 7.8 mm. The power is about:"}, {"difficulty": "medium", "options": ["near sightedness, where distant objects look blurred", "far sightedness, where near objects look blurred", "bleaching, where the cones go temporarily blind", "astigmatism, where one plane focuses differently from another"], "correct_index": 3, "explanations": ["Myopia is caused by too much, but still even, curvature.", "Hyperopia is caused by too little curvature.", "Bleaching is a photopigment effect in the retina, not a corneal curvature defect.", "The lecture states uneven curvature produces astigmatism, so rays in different planes focus at different points."], "tag": "b04·Q32", "mid": "b04", "section": "Eye defects", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Uneven curvature of the cornea produces:"}, {"difficulty": "devil", "options": ["four times smaller, matching the line read at 5 ft", "four times larger, matching the line normal vision reads at 80 ft", "two times larger, matching the line normal vision reads at 40 ft", "the same size, but they must stand 80 ft away"], "correct_index": 1, "explanations": ["Smaller detail would mean better than normal acuity, not worse.", "20/80 means they can just read at 20 ft what normal eyes read at 80 ft, so detail four times larger than the 20/20 line.", "That would be 20/40, not 20/80.", "Acuity is tied to the size of detail they resolve at a fixed distance, not to standing farther away."], "tag": "b04·Q33", "mid": "b04", "section": "Visual acuity", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A patient tests at 20/80 on a Snellen chart. Compared with the 20/20 line, the smallest line they can just read at 20 ft is:"}, {"difficulty": "devil", "options": ["2.27 cm, as 1/f = 4 + 40 = 44 D", "2.50 cm, as the lens stays unchanged", "2.78 cm, as the power falls to 36 D", "22.7 cm, as f scales with the object distance"], "correct_index": 0, "explanations": ["1/f = 1/0.25 + 1/0.025 = 44 D, so f = 1/44 m ≈ 2.27 cm.", "Near objects need the lens to bulge, shortening f.", "Near focusing adds power, 4 D more, not less.", "This is a power-of-ten slip; f = 1/44 m is 2.27 cm."], "tag": "b04·Q34", "mid": "b04", "section": "Accommodation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Model the eye with the retina 2.5 cm behind a thin lens. To focus on an object at 25 cm, the lens focal length must shorten from 2.5 cm to about:"}, {"difficulty": "devil", "options": ["it is dimensionless, as it is a ratio of two speeds", "water has n = 1.333, so light is 1.333 times slower in it", "corneal index is nearly constant between people, while curvature varies", "a higher index means light moves faster in the material"], "correct_index": 3, "explanations": ["This is true; c/v has no unit.", "This is true and is the lecture example.", "This is true and is why curvature causes most defective vision.", "This is false: since n = c/v, a higher index means a lower speed of light in the medium."], "tag": "b04·Q35", "mid": "b04", "section": "Refractive index", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about refractive index is FALSE?"}, {"difficulty": "hard", "options": ["4 D, since 1/0.25 m adds to the relaxed 40 D", "40 D, since the full lens power must be added again", "0.4 D, since 25 cm is ten times the focal length", "11 D, since 25 ÷ 2.5 is added to 1"], "correct_index": 0, "explanations": ["1/f = 1/u + 1/v = 4 + 40 = 44 D, so the extra accommodation over the relaxed 40 D is 4 D.", "The lens already supplies 40 D when relaxed; only the 1/u term of 4 D is extra.", "1/0.25 m = 4 D, not 0.4 D.", "This is not the lens-formula result; powers come from reciprocals in metres."], "tag": "b04·Q36", "mid": "b04", "section": "Accommodation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Treat the eye as a thin lens with the retina fixed 2.5 cm behind it. How much extra power must it add to see an object at the 25 cm near point instead of infinity?"}, {"difficulty": "devil", "options": ["X-rays are non-ionizing, whereas radio waves are ionizing", "visible light and X-rays are both non-ionizing", "X-rays are ionizing, whereas radio waves are non-ionizing", "gamma rays and radio waves are both ionizing"], "correct_index": 2, "explanations": ["This swaps the two classes.", "X-rays are ionizing, so a lead apron is needed.", "X-rays can ionize matter and are treated as harmful; radio waves lack the energy to ionize and are classed as non-ionizing.", "Radio waves are non-ionizing."], "tag": "b04·Q37", "mid": "b04", "section": "Radiation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In a laboratory safety briefing, which pairing of radiation type with its class is correct?"}, {"difficulty": "devil", "options": ["the choroid is the middle coat, rich in vessels and pigment", "the sclera is the middle coat, rich in blood vessels and pigment", "the retina is the innermost coat and carries rods and cones", "the conjunctiva lines the eyelid and covers the eyeball surface Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 74"], "correct_index": 1, "explanations": ["This is true per the lecture.", "This is false: the sclera is the tough white outer coat; the choroid is the middle, vascular and pigmented coat.", "This is true.", "This is true; it is a transparent mucous membrane."], "tag": "b04·Q38", "mid": "b04", "section": "Eye structure", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about the coats of the eye is FALSE?"}, {"difficulty istances?"}, {"difficulty": "hard", "options": ["cornea (1.37) is faster than the vitreous (1.337)", "lens (1.43) is faster than the cornea (1.37)", "cornea (1.37) is slower than vitreous (1.337) but faster than lens (1.43)", "all three media transmit light at the same speed"], "correct_index": 2, "explanations": ["A higher index means slower light, so the cornea is slower than the vitreous.", "The lens has the higher index, so light is slower in it than in the cornea.", "Speed = c/n: lens 2.10 × 10⁸, cornea 2.19 × 10⁸, vitreous 2.24 × 10⁸ m/s, so the cornea sits between them.", "Their indices differ, so the speeds differ."], "tag": "b04·Q73", "mid": "b04", "section": "Refractive index", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Using c = 3.0 × 10⁸ m/s, which ordering of speeds of light in the eye media is correct?"}, {"difficulty": "easy", "options": ["orbits", "sinuses", "fossae", "foramina"], "correct_index": 0, "explanations": ["The lecture says the eyeballs are surrounded by the orbits, which are covered with fatty and fibrous tissue for protection.", "Sinuses are air-filled cavities in the skull, not the sockets that house the eyeballs.", "Fossa is a general term for a skull depression; the eye socket is called the orbit.", "Foramina are openings for nerves and vessels; they are not the eye sockets."], "tag": "b04·Q74", "mid": "b04", "section": "General structure", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The eyeballs sit in bony sockets of the skull called the:"}, {"difficulty": "devil", "options": ["the near point moves closer to the eye as a person ages", "tension in the ciliary muscles changes the lens curvature", "with relaxed muscles the lens focal length is about 2.5 cm", "range of vision is the span between the near and far points"], "correct_index": 0, "explanations": ["This is false: the near point moves farther away with age because the ciliary muscles weaken and the lens stiffens.", "This is true; it changes the lens focal length.", "This is true; distant objects are then focused on the retina.", "This is true as the lecture defines it."], "tag": "b04·Q75", "mid": "b04", "section": "Accommodation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about accommodation is FALSE?"}, {"difficulty": "easy", "options": ["the sclera, the outermost coat", "the retina, the innermost coat", "the choroid, the middle coat", "the conjunctiva, the surface membrane"], "correct_index": 1, "explanations": ["The sclera is tough white fibrous tissue and contains no photoreceptors.", "The retina is the innermost coat and contains the colour and light receptors, cones and rods.", "The choroid contains blood vessels and pigment, not rods and cones.", "The conjunctiva is a mucous membrane lining the eyelid and eyeball surface."], "tag": "b04·Q76", "mid": "b04", "section": "Eye structure", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which layer of the eye holds the rods and cones?"}, {"difficulty": "easy", "options": ["the crystalline lens", "the iris", "the cornea", "the vitreous humour Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 79"], "correct_index": 2, "explanations": ["The lens is the variable-shape element that adjusts focus for different distances.", "The iris regulates the amount of light entering; it is not a focusing element.", "The lecture lists the cornea as the fixed-focus element, doing most of the bending of light.", "The vitreous humour keeps the eye's shape; it is not the fixed-focus element. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 90"], "tag": "b04·Q77", "mid": "b04", "section": "Focusing elements", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which part of the eye is the fixed-focus element?"}, {"difficulty": "hard", "options": ["about 100", "about 10 000", " ced sensitivity to red light and is the most common form", "The Ishihara test uses pseudo-isochromatic plates"], "correct_index": 2, "explanations": ["True: trit- refers to blue and the condition is extremely rare.", "True: normal colour vision is trichromacy, and such people are trichromats.", "False: deuteranomaly is reduced sensitivity to green light; reduced red sensitivity is protanomaly.", "True: Ishihara plates are the first class of PIP tests."], "tag": "b05·Q6", "mid": "b05", "section": "FALSE statement: colour blindness", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about colour deficiency is FALSE?"}, {"difficulty": "medium", "options": ["Tests discrimination of grey shades, which cataract impairs", "Measures the fluid pressure inside the eye in mmHg", "Dilates the pupil so the retina can be examined fully", "Predicts how well a patient will see after lens removal"], "correct_index": 0, "explanations": ["Cataracts commonly reduce the ability to separate similar shades of gray.", "Fluid pressure is measured by tonometry.", "Dilation is done with eye drops in the pupil dilation exam.", "Predicting post-removal vision is the purpose of potential acuity testing. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 102"], "tag": "b05·Q7", "mid": "b05", "section": "Eye tests", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Contrast sensitivity testing is particularly useful in cataract because it:"}, {"difficulty": "medium", "options": ["Electrons are heavier than photons so they are slower to deflect", "The specimen is thicker than 100 nm", "Electrons have a smaller de Broglie wavelength than visible light", "A fluorescent screen magnifies the image optically Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 92"], "correct_index": 2, "explanations": ["Mass alone is not the stated reason; it is the resulting short wavelength that matters.", "TEM needs ultrathin specimens, less than 100 nm, not thicker ones.", "Resolution is limited by wavelength, and the electron de Broglie wavelength is far smaller than visible light wavelengths.", "The screen merely displays the image; it does not set the resolution."], "tag": "b05·Q8", "mid": "b05", "section": "TEM resolution", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "TEM resolves finer detail than a light microscope mainly because:"}, {"difficulty": "easy", "options": ["2× to 6×", "20× to 60×", "100× to 200×", "1000× to 3000×"], "correct_index": 0, "explanations": ["Magnifying glasses typically have low power, about 2×–6×.", "20×–60× is off by a factor of ten; aberrations would ruin the image.", "100×–200× is typical of compound microscope objectives, not hand lenses.", "1000×–3000× is far beyond any simple lens."], "tag": "b05·Q9", "mid": "b05", "section": "Magnifying glass", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Typical magnifying power of a hand magnifying glass is:"}, {"difficulty": "hard", "options": ["Real, inverted, 15 cm from the lens, half the object size", "Real, inverted, 30 cm from the lens, same size as the object", "Virtual, erect, 15 cm from the lens, half the object size", "Real, inverted, 7.5 cm from the lens, a quarter the object size"], "correct_index": 0, "explanations": ["1/v = 1/10 − 1/30 gives v = 15 cm and m = v/u = 0.5; the object is beyond 2F1, so the image is real, inverted and diminished between F2 and 2F2.", "Same size and 2F2 positions occur only when the object is exactly at 2F1 (20 cm here).", "A convex lens gives a virtual, erect image only for objects inside the focal length.", "7.5 cm lies inside F2 (10 cm), which cannot happen for a real image from an object beyond F1."], "tag": "b05·Q10", "mid": "b05", "section": "Convex lens calculation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "An object stands 30 cm
