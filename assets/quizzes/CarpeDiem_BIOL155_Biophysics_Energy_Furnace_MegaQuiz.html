0 × 10⁻² W/m²", "0.125 W/m²", "9.9 × 10⁻³ W/m²", "4.0 × 10⁻² W/m²"], "correct_index": 2, "explanations": ["Wrong: this uses 4πr (not squared) in the denominator: 0.5 ÷ 25.1.", "Wrong: this uses r² = 4 only and leaves out the 4π of the sphere's area.", "Correct: I = P/4πr² = 0.5 ÷ (4π × 4) = 0.5 ÷ 50.27 ≈ 9.9 × 10⁻³ W/m².", "Wrong: this uses πr² = 12.6, the area of a circle rather than the sphere 4πr²."], "tag": "b06·Q27", "mid": "b06", "section": "Inverse square law", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A source of net power 0.5 W radiates uniformly in all directions. What is the intensity at 2 m?"}, {"difficulty": "hard", "options": ["60 times", "1,000,000 times", "600 times", "1,000 times"], "correct_index": 1, "explanations": ["Wrong: this subtracts the dB values and treats the result as a linear factor.", "Correct: the difference is 60 dB, six steps of 10 dB, so 10⁶ times the energy.", "Wrong: this multiplies the 10 dB steps incorrectly; the scale is logarithmic, not linear.", "Wrong: 1000 corresponds to 30 dB, only half of the actual 60 dB difference."], "tag": "b06·Q28", "mid": "b06", "section": "Decibels", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Heavy traffic is 80 dB and a whisper is 20 dB. By what factor is the traffic sound more intense?"}, {"difficulty": "medium", "options": ["Liquids and gases are too dense to allow any particle displacement at all", "Liquid and gas particles are bound too tightly to move perpendicular to the wave", "Adjacent particles slide past each other, so one particle cannot drag its neighbours sideways", "Transverse waves always need a vacuum, which a fluid does not provide"], "correct_index": 2, "explanations": ["Wrong: gases are low in density and particles do move; the problem is weak coupling in shear, not high density.", "Wrong: this reverses the idea; fluids have weak bonding forces, which is exactly why shear fails.", "Correct: shear motion needs tightly bound particles; in fluids neighbours easily slide past each other.", "Wrong: mechanical waves, transverse or not, need a medium; only electromagnetic waves travel in vacuum."], "tag": "b06·Q29", "mid": "b06", "section": "Wave types", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Why can a transverse wave NOT propagate through a liquid or gas?"}, {"difficulty": "easy", "options": ["Heat electricity", "Pressure electricity", "Sound light", "Magnetic vibration"], "correct_index": 1, "explanations": ["Wrong: heat electricity is thermoelectric or pyroelectric, not piezoelectric.", "Correct: piezoelectric literally means pressure electricity; the effect was reported by Pierre Curie in 1880.", "Wrong: sound becoming light is sonoluminescence.", "Wrong: magnetism is not involved in the piezoelectric effect."], "tag": "b06·Q30", "mid": "b06", "section": "Piezoelectricity", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "What does the word piezoelectric mean?"}, {"difficulty": "hard", "options": ["2 µs", "8 µs", "0.5 ms", "0.5 µs Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 116"], "correct_index": 3, "explanations": ["Wrong: this divides frequency by cycles and gives 2, which uses the wrong ratio.", "Wrong: this multiplies cycles by the frequency in MHz.", "Wrong: this is a factor of 1000 too large from a µs versus ms confusion.", "Correct: PD = cycles ÷ frequency = 2 ÷ 4×10⁶ Hz = 0.5 µs. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 127"], "tag": "b06·Q31", "mid": "b06", "section": "Pulse duration", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A pulse has 2 cycles at 4 MHz. What is its duration?"}, {"difficulty": "medium", "options": ["3.08 mm", "0.0308 mm", "1.54 mm", "0.308 mm"], "correct_index": 3, "explanations": ["Wrong: this is ten times too large, a power-of-ten slip when dividing.", "Wrong: this is ten times too small and would imply a speed of 0.154 mm/µs.", "Wrong: 1.54 is the speed in mm/µs; the frequency has not been divided out.", "Correct: λ = v/f = 1.54 mm/µs ÷ 5 MHz = 0.308 mm."], "tag": "b06·Q32", "mid": "b06", "section": "Wavelength", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A 5 MHz ultrasound beam travels in soft tissue at 1.54 mm/µs. What is its wavelength?"}, {"difficulty": "devil", "options": ["About 2.6 times", "About 4.9 times", "About 1.9 times", "About 24 times"], "correct_index": 1, "explanations": ["Wrong: this is only the speed ratio (4000/1540) and ignores density.", "Correct: Z bone = 7.6 × 10⁶ and Z soft tissue = 1.54 × 10⁶, a ratio of about 4.9.", "Wrong: this is only the density ratio and ignores speed.", "Wrong: this squares the correct ratio, as if impedance were ρv² rather than ρv."], "tag": "b06·Q33", "mid": "b06", "section": "Acoustic impedance", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Bone has density 1900 kg/m³ and sound speed 4000 m/s, while soft tissue has density 1000 kg/m³ and speed 1540 m/s. How many times larger is the impedance of bone?"}, {"difficulty": "devil", "options": ["Each successive crest is emitted closer to the observer, so crests arrive at shorter intervals", "The source moving faster makes the sound travel faster through the medium", "The observer's ear amplifies waves coming from a moving source", "The medium compresses the waves as the source pushes air forward at the speed of sound"], "correct_index": 0, "explanations": ["Correct: each crest has a shorter trip than the last, so the arrival interval shrinks and the pitch rises.", "Wrong: speed is set by the medium, not by the source's motion.", "Wrong: the effect is a property of the wave timing, not an amplification by the ear.", "Wrong: the medium does not set the shift; it depends on the relative motion of source and observer."], "tag": "b06·Q34", "mid": "b06", "section": "Doppler effect", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Why is the frequency received higher when a sound source approaches a stationary observer?"}, {"difficulty": "devil", "options": ["64.9 µs", "33.3 µs", "133.1 µs", "66.5 µs"], "correct_index": 3, "explanations": ["Wrong: this assumes 1.54 mm/µs along the entire 5 cm, ignoring the slower fat layer.", "Wrong: this is the one-way time only.", "Wrong: this counts the round trip twice.", "Correct: one way = 20/1.45 + 30/1.54 ≈ 13.79 + 19.48 = 33.27 µs, and doubling gives 66.5 µs."], "tag": "b06·Q35", "mid": "b06", "section": "Echo timing", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Pulses cross 2 cm of fat (1.45 mm/µs) then 3 cm of soft tissue (1.54 mm/µs) to reach a reflector. What is the true round-trip time?"}, {"difficulty": "hard", "options": ["25 dB", "12.5 dB", "2.5 dB", "50 dB"], "correct_index": 0, "explanations": ["Correct: coefficient 2.5 dB/cm × (5 cm there + 5 cm back) = 25 dB.", "Wrong: this counts only the one-way path of 5 cm.", "Wrong: this is the coefficient itself (dB/cm), with no distance included.", "Wrong: this doubles the round trip again."], "tag": "b06·Q36", "mid": "b06", "section": "Attenuation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "An echo comes from a reflector 5 cm deep. The beam is 5 MHz and soft tissue attenuates at 0.5 dB/cm per MHz. How much attenuation does the echo suffer on the round trip?"}, {"difficulty": "devil", "options": ["12.5 µs", "0.125 µs", "1.25 µs", "125 µs"], "correct_index": 2, "explanations": ["Wrong: this is ten times too long, equal to a 10% duty factor.", "Wrong: this is ten times too short, equal to a 0.1% duty factor.", "Correct: PRP = 1/8000 = 125 µs and PD = 0.01 × 125 = 1.25 µs.", "Wrong: 125 µs is the whole repetition period, not the transmit part."], "tag": "b06·Q37", "mid": "b06", "section": "Pulse duration", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A scanner transmits 1% of the time at a PRF of 8 kHz. What is the pulse duration?"}, {"difficulty": "devil", "options": ["24 cm", "12 cm", "6 cm", "4.8 cm"], "correct_index": 1, "explanations": ["Wrong: this counts one-way attenuation only (60 ÷ 2.5).", "Correct: 2.5 dB/cm one way means 5 dB per cm of depth for the round trip, and 60 ÷ 5 = 12 cm.", "Wrong: this uses 10 dB per cm of depth, doubling the round-trip loss twice.", "Wrong: this divides 60 by 5 MHz × 2.5 dB/cm, wrongly multiplying frequency in twice."], "tag": "b06·Q38", "mid": "b06", "section": "Imaging depth", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The tolerable round-trip attenuation is 60 dB. For a 5 MHz beam in soft tissue (0.5 dB/cm per MHz), what is the maximum imaging depth?"}, {"difficulty": "hard", "options": ["Lower frequency means less attenuation and deeper penetration, but poorer image quality", "Lower frequency means more attenuation and deeper penetration, with better image quality", "Lower frequency raises the speed of sound and improves resolution at depth", "Lower frequency shortens the wavelength, improving resolution but reducing depth Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 117"], "correct_index": 0, "explanations": ["Correct: attenuation rises with frequency, so 3.5 MHz penetrates deeper but with longer wavelength and SPL, giving lower resolution.", "Wrong: lower frequency reduces attenuation, and the image quality worsens, not improves.", "Wrong: speed is set by the tissue, not by frequency.", "Wrong: lowering the frequency lengthens the wavelength, not shortens it. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 128"], "tag": "b06·Q39", "mid": "b06", "section": "Imaging trade-off", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A deep abdominal structure is poorly visualised with a 10 MHz probe. Why does switching to 3.5 MHz help, and what is the cost?"}, {"difficulty": "medium", "options": ["0.1 (10%)", "0.001 (0.1%)", "0.01 (1%)", "10"], "correct_index": 2, "explanations": ["Wrong: this is ten times too large; check the power of ten in the µs conversion.", "Wrong: this is ten times too small.", "Correct: duty factor = PD × PRF = 2×10⁻⁶ s × 5000 Hz = 0.01, i.e. 1%.", "Wrong: duty factor is dimensionless and cannot exceed 1.0."], "tag": "b06·Q40", "mid": "b06", "section": "Duty factor", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A pulse lasts 2 µs and the pulse repetition frequency is 5 kHz. What is the duty factor?"}, {"difficulty": "devil", "options": ["The quartz loses its piezoelectric properties while the PZT keeps them", "Both lose their piezoelectric properties at once", "Both keep their piezoelectric properties until 573 °C", "The PZT loses its piezoelectric properties while the quartz keeps them"], "correct_index": 3, "explanations": ["Wrong: this reverses the temperatures; quartz has the higher Curie point.", "Wrong: 400 °C is below the quartz value, so quartz is unaffected.", "Wrong: PZT is already above its own Curie point at 400 °C.", "Correct: 400 °C is above 328 °C but below 573 °C, so only PZT passes its Curie point."], "tag": "b06·Q41", "mid": "b06", "section": "Curie point", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Using the lecture's Curie temperatures (328 °C for PZT and 573 °C for quartz), what happens to elements heated to 400 °C?"}, {"difficulty": "medium", "options": ["It becomes twice as large", "It stays the same", "It becomes four times larger", "It becomes eight times larger"], "correct_index": 2, "explanations": ["Wrong: this assumes a linear relation, but the lecture gives a squared relation.", "Wrong: the lecture notes the operator can change power by changing amplitude.", "Correct: power is proportional to (amplitude)², so doubling amplitude gives 2² = 4 times the power.", "Wrong: eight would need a cubic relation, which is not the one given."], "tag": "b06·Q42", "mid": "b06", "section": "Power and amplitude", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The operator doubles the amplitude of the transmitted wave. What happens to the power?"}, {"difficulty": "easy", "options": ["Quartz", "Barium sulphate", "Lead zirconate titanate (PZT)", "Silicon dioxide gel"], "correct_index": 2, "explanations": ["Wrong: quartz is naturally piezoelectric but is used in some laboratory applications and timing devices.", "Wrong: barium sulphate is a radiographic contrast agent, not a piezoelectric material (barium titanate is).", "Correct: PZT is the most common piezoelectric ceramic in diagnostic imaging transducers.", "Wrong: this is not a piezoelectric transducer material."], "tag": "b06·Q43", "mid": "b06", "section": "Transducer materials", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which material is the most common piezoelectric material in diagnostic imaging transducers?"}, {"difficulty": "devil", "options": ["Absorption, which converts sound energy to heat, is the dominant mechanism", "Higher frequencies suffer greater attenuation and therefore less imaging depth", "The attenuation coefficient in dB/cm is independent of frequency", "The total loss depends on both the frequency and the distance travelled"], "correct_index": 2, "explanations": ["True, so not the answer: the lecture lists absorption as the dominant influence in soft tissue.", "True, so not the answer: higher frequency raises attenuation and so reduces imaging depth.", "Correct (the false statement): the lecture states the attenuation coefficient is directly related to frequency, roughly 0.5 to 1.1 dB/cm per MHz.", "True, so not the answer: overall attenuation is set by both frequency and path length."], "tag": "b06·Q44", "mid": "b06", "section": "Attenuation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about attenuation in soft tissue is FALSE?"}, {"difficulty": "devil", "options": ["Transmission uses the direct piezoelectric effect and reception uses the reverse piezoelectric effect", "Transmission uses the reverse piezoelectric effect and reception uses the direct piezoelectric effect", "Both transmission and reception use the reverse piezoelectric effect at different times", "Transmission uses the Curie effect and reception uses the reverse piezoelectric effect"], "correct_index": 1, "explanations": ["Wrong: this swaps them; pressure producing electricity is the direct effect and is what happens on reception.", "Correct: an applied voltage makes the element vibrate (reverse effect) and sound striking it generates a voltage (direct effect).", "Wrong: the reverse effect turns electricity into pressure, so it cannot be how echoes are detected.", "Wrong: the Curie point is a temperature limit above which piezoelectricity is lost, not a transmission mechanism."], "tag": "b06·Q45", "mid": "b06", "section": "Transducer physics", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A transducer element is driven by a voltage pulse and then senses the returning echo. Which pairing of effects is correct?"}, {"difficulty": "easy", "options": ["Two years of medical school followed by three years of ENT residency", "Five years of medical school followed by four years of ENT residency", "Four years of medical school followed by five years of ENT residency", "Four years of medical school followed by one year of ENT residency"], "correct_index": 2, "explanations": ["Wrong: this shortens both stages and does not match the slide.", "Wrong: the numbers are swapped; medical school is four years and residency is five.", "Correct: the slide states four years of medical school then five years of ENT residency.", "Wrong: residency is five years, not one; one year is closer to an internship. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 129"], "tag": "b06·Q46", "mid": "b06", "section": "ENT training", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "According to the lecture, how long is the training path to become an ENT doctor?"}, {"difficulty": "devil", "options": ["About 0.031, above the typical 0.001 to 0.01 range", "About 0.0077, within the typical 0.001 to 0.01 range", "About 0.015, above the typical 0.001 to 0.01 range", "About 0.15, far above the typical range Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 118"], "correct_index": 2, "explanations": ["Wrong: this uses a one-way 10 cm path (64.9 µs), forgetting that the echo must return.", "Wrong: this uses a 20 cm depth, double what was stated.", "Correct: round trip 20 cm takes ≈ 129.9 µs, so DF = 2 ÷ 129.9 ≈ 0.015, a little above the typical range.", "Wrong: this is a power-of-ten slip; 2 µs over about 130 µs is not 15%."], "tag": "b06·Q47", "mid": "b06", "section": "Duty factor", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A scanner images to 10 cm depth using 2 µs pulses and the fastest possible PRF (v = 1540 m/s). What is the duty factor?"}, {"difficulty": "hard", "options": ["50 µs", "200 µs", "10 µs", "100 µs"], "correct_index": 3, "explanations": ["Wrong: this is the one-way travel time only.", "Wrong: this counts the round trip twice.", "Wrong: this is a power-of-ten error in the conversion.", "Correct: round trip is 154 mm, and 154 mm ÷ 1.54 mm/µs = 100 µs."], "tag": "b06·Q48", "mid": "b06", "section": "Echo timing", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "An echo is received from an interface 7.7 cm deep in soft tissue (1.54 mm/µs). How long after transmission does it arrive?"}, {"difficulty": "medium", "options": ["About 1 dB", "About 3 dB", "About 10 dB", "About 6 dB"], "correct_index": 1, "explanations": ["Wrong: 1 dB is a much smaller change, roughly a 26% energy increase.", "Correct: each doubling of energy corresponds to roughly 3 dB, since 10 log 2 ≈ 3.01.", "Wrong: 10 dB represents a tenfold increase, not a doubling.", "Wrong: 6 dB is a quadrupling of energy (two doublings)."], "tag": "b06·Q49", "mid": "b06", "section": "Decibels", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "By how many decibels does the sound energy change when it doubles?"}, {"difficulty": "hard", "options": ["It is three times as thick (9 cm versus 3 cm)", "It is the same (3 cm in both)", "It is one third as thick (1 cm versus 3 cm)", "It is one sixth as thick (0.5 cm versus 3 cm)"], "correct_index": 2, "explanations": ["Wrong: this assumes HVL grows with frequency, but it is inversely related.", "Wrong: the coefficient scales with frequency, so the HVL changes.", "Correct: coefficients are 3 dB/cm and 1 dB/cm, giving HVLs of 1 cm and 3 cm.", "Wrong: this uses a factor of 6 where the frequency ratio is only 3."], "tag": "b06·Q50", "mid": "b06", "section": "Penetration", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Using HVL = 3 dB ÷ coefficient and a coefficient of 0.5 dB/cm per MHz, how does the HVL at 6 MHz compare with that at 2 MHz?"}, {"difficulty": "hard", "options": ["It increases, because compressible tissue passes pressure faster", "It decreases, because speed rises with stiffness", "It stays the same, because speed depends only on frequency", "It increases, because compressibility and stiffness are the same"], "correct_index": 1, "explanations": ["Wrong: this reverses the effect of compressibility.", "Correct: the lecture ties velocity to density and stiffness; compressibility is the opposite of stiffness, so more compressible means slower.", "Wrong: speed depends on the medium and not on the frequency.", "Wrong: the lecture states compressibility and elasticity are the opposite of stiffness."], "tag": "b06·Q51", "mid": "b06", "section": "Acoustic velocity", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In a tissue that is more compressible (less stiff) but otherwise has similar density, what happens to the speed of sound?"}, {"difficulty": "hard", "options": ["0.8%, since it listens only briefly", "98%, since it transmits 2% of the time", "92%, since it transmits 8% of the time", "99.2%, since it transmits only 0.8% of the time"], "correct_index": 3, "explanations": ["Wrong: 0.8% is the transmit fraction, not the listening fraction.", "Wrong: this has the power of ten wrong; DF is 0.008 and not 0.02.", "Wrong: this has the power of ten wrong; DF is 0.008 and not 0.08.", "Correct: DF = 2×10⁻⁶ × 4000 = 0.008, so transmitting is 0.8% and listening is 99.2%."], "tag": "b06·Q52", "mid": "b06", "section": "Duty factor", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A scanner uses a 4 kHz PRF with 2 µs pulses. What fraction of time does it listen?"}, {"difficulty": "medium", "options": ["It transmits the next sound pulse", "It listens and receives the returning echoes", "It cools down to prevent loss of piezoelectricity", "It converts electrical energy to sound continuously"], "correct_index": 1, "explanations": ["Wrong: transmission occurs during the on cycle, which is short.", "Correct: the on cycle speaks briefly and the long off cycle is used to listen for echoes with the same transducer.", "Wrong: cooling is not the purpose; the off cycle is for receiving echoes.", "Wrong: continuous transmission would leave no time to receive echoes."], "tag": "b06·Q53", "mid": "b06", "section": "Pulsed sound", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In pulsed ultrasound imaging, what does the transducer do during the long off cycle?"}, {"difficulty": "hard", "options": ["About 0.19 MHz to 1.5 MHz", "About 19 MHz to 150 MHz", "About 1.9 MHz to 15 MHz", "About 0.8 MHz to 5 MHz"], "correct_index": 2, "explanations": ["Wrong: this is ten times too low at both ends.", "Wrong: this is ten times too high at both ends.", "Correct: f = v/λ gives 1.54 ÷ 0.8 ≈ 1.9 MHz and 1.54 ÷ 0.1 = 15.4 MHz.", "Wrong: this simply reuses the wavelength numbers as frequencies. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 130"], "tag": "b06·Q54", "mid": "b06", "section": "Wavelength range", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Clinical wavelengths in soft tissue range from 0.1 to 0.8 mm. Using 1.54 mm/µs, what frequency range does this imply?"}, {"difficulty": "hard", "options": ["1.54 × 10⁶ kg/(m²·s)", "1.54 × 10³ kg/(m²·s)", "2.37 × 10⁹ kg/(m²·s)", "6.5 × 10⁻¹ kg/(m²·s) Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 119"], "correct_index": 0, "explanations": ["Correct: Z = ρv = 1000 × 1540 = 1.54 × 10⁶ kg/(m²·s), about 1.54 MRayl.", "Wrong: this is only the speed multiplied by 1; the density of 1000 kg/m³ was dropped.", "Wrong: this is ρv² (1000 × 1540²), a stiffness-type quantity, not impedance.", "Wrong: this is ρ/v, an inverted relationship."], "tag": "b06·Q55", "mid": "b06", "section": "Acoustic impedance", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Soft tissue has density 1000 kg/m³ and sound speed 1540 m/s. What is its acoustic impedance?"}, {"difficulty": "easy", "options": ["20 dB and 100 dB", "0 dB and 60 dB", "0 dB and 120 dB", "10 dB and 140 dB"], "correct_index": 2, "explanations": ["Wrong: 20 dB is a quiet whisper level and 100 dB is below the pain threshold.", "Wrong: 60 dB is ordinary conversation, far below pain.", "Correct: threshold of hearing is 0 dB and threshold of pain is 120 dB.", "Wrong: the hearing threshold is 0 dB, not 10 dB, and pain is not 140 dB on the slide."], "tag": "b06·Q56", "mid": "b06", "section": "Loudness", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "On the decibel scale shown in the lecture, what are the thresholds of hearing and pain?"}, {"difficulty": "devil", "options": ["10 dB", "40 dB", "30 dB", "20 dB"], "correct_index": 3, "explanations": ["Wrong: this treats the tenfold amplitude fall as a tenfold power fall.", "Wrong: 40 dB would be a 10,000-fold power fall, squaring the ratio twice.", "Wrong: 30 dB is a 1000-fold power fall, which would need an amplitude fall of about 32.", "Correct: power ∝ amplitude², so the power falls 100-fold, and 10 log 100 = 20 dB."], "tag": "b06·Q57", "mid": "b06", "section": "Decibels", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The amplitude of an echo falls from 1.0 to 0.1 units. How much attenuation is this?"}, {"difficulty": "medium", "options": ["Source and receiver move at the same velocity in the same direction", "The source moves while the receiver is stationary", "The receiver moves while the source is stationary", "The source moves toward the receiver"], "correct_index": 0, "explanations": ["Correct: with no relative motion between source and receiver the received frequency equals the emitted frequency.", "Wrong: a moving source with a stationary receiver produces a shift.", "Wrong: a moving receiver with a stationary source also gives a shift.", "Wrong: approach raises the received frequency, so there is a shift."], "tag": "b06·Q58", "mid": "b06", "section": "Doppler effect", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In which situation is NO Doppler frequency shift produced?"}, {"difficulty": "hard", "options": ["It falls to one ninth", "It falls to one third", "It falls to one sixth", "It falls to one half"], "correct_index": 0, "explanations": ["Correct: power ∝ amplitude², so (1/3)² = 1/9.", "Wrong: this treats power as linear in amplitude.", "Wrong: this is not given by any relation in the lecture; it comes from 2 × 3.", "Wrong: one half is ry", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A 4 MHz beam passes from soft tissue (1.54 mm/µs) into lung (0.5 mm/µs). What happens to its frequency and wavelength?"}, {"difficulty": "medium", "options": ["0.1 mm", "3.3 mm", "0.09 mm", "0.9 mm"], "correct_index": 3, "explanations": ["Wrong: this divides wavelength by cycles instead of multiplying.", "Wrong: this adds a count to a length.", "Wrong: this is ten times too small.", "Correct: SPL = cycles per pulse × wavelength = 3 × 0.3 = 0.9 mm. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 131"], "tag": "b06·Q62", "mid": "b06", "section": "Spatial pulse length", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A pulse has 3 cycles and each wavelength is 0.3 mm. What is the spatial pulse length?"}, {"difficulty": "easy", "options": ["Transverse, with disturbance perpendicular to the direction of wave motion", "Longitudinal, with disturbance parallel to the direction of wave motion", "Electromagnetic, with electric and magnetic fields at right angles", "Shear, with particles dragging tightly bound neighbours sideways Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 120"], "correct_index": 1, "explanations": ["Wrong: a plucked guitar string and earthquake S waves are transverse, not sound in air.", "Correct: sound is a longitudinal wave; particles oscillate parallel to the direction of propagation.", "Wrong: electromagnetic waves need no medium, whereas sound requires a material medium.", "Wrong: shear motion needs tightly bound particles, which air does not have."], "tag": "b06·Q63", "mid": "b06", "section": "Wave types", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Sound waves in air are best described as which type of wave?"}, {"difficulty": "medium", "options": ["Bone is a great scatterer and lung is a great absorber", "Both are great reflectors with zero absorption", "Bone is a great absorber and lung is a great scatterer", "Both have lower density, so energy leaks away"], "correct_index": 2, "explanations": ["Wrong: the roles are swapped.", "Wrong: absorption in bone is substantial, so it is not zero.", "Correct: the lecture states bone absorbs strongly while lung scatters strongly (air-filled alveoli).", "Wrong: bone is dense, not low density, and the cause is absorption or scattering rather than density."], "tag": "b06·Q64", "mid": "b06", "section": "Attenuation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Why is the attenuation coefficient higher in bone and in lung than in soft tissue?"}, {"difficulty": "easy", "options": ["The photoacoustic effect", "Sonoluminescence", "The Doppler effect", "Mode conversion"], "correct_index": 0, "explanations": ["Correct: photoacoustic phenomena convert light into sound.", "Wrong: sonoluminescence is the reverse process, in which sound becomes light.", "Wrong: the Doppler effect is a frequency change from relative motion and has no energy conversion.", "Wrong: mode conversion changes longitudinal waves to shear waves within a medium."], "tag": "b06·Q65", "mid": "b06", "section": "Energy transformation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which phenomenon turns light into sound?"}, {"difficulty": "hard", "options": ["0.31 mm", "0.29 mm", "0.10 mm", "2.9 mm"], "correct_index": 1, "explanations": ["Wrong: this is the soft tissue value (1.54 ÷ 5) and ignores that fat is slower.", "Correct: λ = 1.45 mm/µs ÷ 5 MHz = 0.29 mm, slightly shorter than in soft tissue (0.308 mm).", "Wrong: this is the lung value (0.5 ÷ 5), using the wrong tissue speed.", "Wrong: this is ten times too large."], "tag": "b06·Q66", "mid": "b06", "section": "Wavelength", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The speed of sound in fat is 1.45 mm/µs. What is the wavelength of 5 MHz ultrasound in fat?"}, {"difficulty": "hard", "options": ["Particles travel along with the wave at the wave speed", "Particle speed always equals the product of frequency and wavelength", "Particles move at the speed of sound in the direction of propagation", "Particle motion is not the same as wave speed, and particles need not move in the wave's direction"], "correct_index": 3, "explanations": ["Wrong: the wave carries energy, not net particle transport along its path.", "Wrong: fλ is the wave speed, not the particle speed.", "Wrong: particles oscillate about fixed positions and do not travel at the sound speed.", "Correct: the lecture notes particles oscillate and in general do not move with the wave or in its direction (transverse waves move them sideways)."], "tag": "b06·Q67", "mid": "b06", "section": "Wave speed", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about particles and wave speed in a sound wave is correct?"}, {"difficulty": "easy", "options": ["Wavelength", "Propagation speed", "Spatial pulse length", "Frequency"], "correct_index": 3, "explanations": ["Wrong: wavelength depends on both source and medium because it equals speed divided by frequency.", "Wrong: propagation speed is a property of the medium alone.", "Wrong: spatial pulse length depends on both source and medium.", "Correct: frequency (and period) is set by the source and is unchanged by the medium."], "tag": "b06·Q68", "mid": "b06", "section": "Source dependence", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which acoustic parameter is determined only by the sound source and not by the medium?"}, {"difficulty": "easy", "options": ["Sound wave, vibration of the eardrum, amplification by the ear bones, conversion to nerve impulses in the cochlea", "Sound wave, amplification by the cochlea, vibration of the ear bones, conversion to nerve impulses in the eardrum", "Sound wave, conversion to nerve impulses in the ear bones, vibration of the cochlea, amplification by the eardrum", "Sound wave, nerve impulses in the eardrum, amplification by the cochlea, vibration of the ear bones"], "correct_index": 0, "explanations": ["Correct: the eardrum vibrates, the bones amplify the vibration and the cochlea converts it to nerve impulses.", "Wrong: the cochlea is the transducer to nerve impulses, not an amplifier, and the eardrum does not make the nerve impulses.", "Wrong: the roles are scrambled; the ear bones amplify, they do not generate nerve impulses.", "Wrong: the eardrum only vibrates and the cochlea only converts; the order and roles here are wrong."], "tag": "b06·Q69", "mid": "b06", "section": "Hearing chain", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which sequence correctly describes the first steps of human hearing in the lecture?"}, {"difficulty": "medium", "options": ["It falls to one half", "It falls to one eighth", "It stays the same", "It falls to one quarter"], "correct_index": 3, "explanations": ["Wrong: a half would be a 1/r dependence, but intensity follows 1/r².", "Wrong: one eighth would need a 1/r³ dependence.", "Wrong: the same power spreads over a larger sphere, so intensity falls.", "Correct: I = P/4πr², so doubling r divides intensity by 2² = 4. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 132"], "tag": "b06·Q70", "mid": "b06", "section": "Inverse square law", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A point source radiates sound uniformly. If you move from 2 m to 4 m away, what happens to the intensity?"}, {"difficulty": "devil", "options": ["10¹² times", "120 times", "10¹⁰ times", "10²⁴ times Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 121"], "correct_index": 0, "explanations": ["Correct: 120 dB is twelve steps of 10 dB, each a tenfold energy change, so 10¹² times.", "Wrong: this reads the decibel number as a linear ratio.", "Wrong: 10¹⁰ would be only 100 dB, ten steps and not twelve.", "Wrong: this squares the true factor, confusing intensity with an amplitude-style relation."], "tag": "b06·Q71", "mid": "b06", "section": "Decibels", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The loudness scale runs from 0 dB at the threshold of hearing to 120 dB at the threshold of pain. How many times more intense is the pain level?"}, {"difficulty": "easy", "options": ["2 Hz to 2,000 Hz", "200 Hz to 200,000 Hz", "20 kHz to 30 MHz", "20 Hz to 20,000 Hz"], "correct_index": 3, "explanations": ["Wrong: this is lower by a factor of ten at both ends.", "Wrong: this is higher by a factor of ten and would include ultrasound.", "Wrong: this spans ultrasound up to diagnostic frequencies, not audible sound.", "Correct: audible sound lies between 20 Hz and 20 kHz."], "tag": "b06·Q72", "mid": "b06", "section": "Acoustic ranges", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "What is the approximate range of audible sound frequencies shown in the lecture?"}, {"difficulty": "hard", "options": ["0.166 m", "1.72 m", "0.172 m", "0.0172 m"], "correct_index": 2, "explanations": ["Wrong: this uses the 0 °C speed (332 m/s) and ignores the temperature correction.", "Wrong: this is ten times too large.", "Correct: v = 332 + 0.6 × 20 = 344 m/s, then λ = 344 ÷ 2000 = 0.172 m.", "Wrong: this is ten times too small."], "tag": "b06·Q73", "mid": "b06", "section": "Propagation speed", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "At 20 °C, use 332 m/s at 0 °C and 0.6 m/s per degree Celsius. What is the wavelength of a 2 kHz sound in air?"}, {"difficulty": "easy", "options": ["v = fλ", "v = f/λ", "v = λ/f²", "v = f + λ"], "correct_index": 0, "explanations": ["Correct: speed equals frequency multiplied by wavelength (also v = λ/T).", "Wrong: dividing frequency by wavelength does not give a speed.", "Wrong: this has the wrong form and wrong dimensions.", "Wrong: quantities with different units cannot be added to give a speed."], "tag": "b06·Q74", "mid": "b06", "section": "Wave formula", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which equation links wave speed v, frequency f and wavelength λ?"}, {"difficulty": "devil", "options": ["2.05 mm", "1.03 mm", "0.51 mm", "6.16 mm"], "correct_index": 0, "explanations": ["Correct: λ = 1.54 ÷ 3 = 0.513 mm and SPL = 4 × 0.513 ≈ 2.05 mm.", "Wrong: this is half the SPL, which is the figure often quoted for axial resolution, not the SPL itself.", "Wrong: this is a single wavelength; the number of cycles was not multiplied in.", "Wrong: this multiplies cycles by speed (4 × 1.54) and never divides by frequency."], "tag": "b06·Q75", "mid": "b06", "section": "Spatial pulse length", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A 3 MHz pulse of 4 cycles travels in soft tissue (1.54 mm/µs). What is its spatial pulse length?"}, {"difficulty": "easy", "options": ["Z = ρ/v, the density divided by the speed of sound in the tissue", "Z = ρv, the density multiplied by the speed of sound in the tissue", "Z = v/ρ, the speed of sound divided by the density of the tissue", "Z = ρv², the density multiplied by the square of the sound speed"], "correct_index": 1, "explanations": ["Wrong: dividing density by speed is not the definition used in the lecture.", "Correct: acoustic impedance is the product of density and speed of sound.", "Wrong: this inverts the relationship; impedance rises when either density or speed rises.", "Wrong: squaring the speed gives a different quantity (related to stiffness) and not impedance."], "tag": "b06·Q76", "mid": "b06", "section": "Acoustic impedance", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "How is acoustic impedance Z calculated?"}, {"difficulty": "easy", "options": ["In solids, liquids and gases", "Only in liquids and gases", "Only in solids", "Only in gases"], "correct_index": 2, "explanations": ["Wrong: that is true for longitudinal waves, which travel in solids, fluids and gases.", "Wrong: fluids cannot support shear because adjacent particles slide past each other.", "Correct: transverse (shear) waves need tightly bound particles, so they occur only in solids.", "Wrong: gases have the weakest bonding forces and cannot support transverse waves."], "tag": "b06·Q77", "mid": "b06", "section": "Wave types", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In which media can transverse waves occur according to the lecture?"}, {"difficulty": "hard", "options": ["It is doubled, worsening axial resolution", "It is unchanged because it depends only on the source", "It is halved, improving axial resolution", "It is quadrupled because wavelength follows frequency squared"], "correct_index": 2, "explanations": ["Wrong: this reverses the relationship between frequency and wavelength.", "Wrong: SPL depends on both source and medium, and the wavelength changes with frequency.", "Correct: λ = v/f halves, so SPL = cycles × λ halves; shorter SPL gives better axial resolution.", "Wrong: wavelength is inversely proportional to frequency, not squared, and it decreases. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 133"], "tag": "b06·Q78", "mid": "b06", "section": "Spatial pulse length", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A transducer's frequency is doubled while the number of cycles per pulse and the tissue stay the same. What happens to the spatial pulse length?"}, {"difficulty": "easy", "options": ["Acoustic waves travel in a vacuum, whereas electromagnetic waves need a medium", "Acoustic waves consist of oscillating electric and magnetic fields", "Acoustic waves are transverse in every medium they travel through", "Acoustic waves require a material medium, whereas electromagnetic waves do not Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 122"], "correct_index": 3, "explanations": ["Wrong: this reverses the facts.", "Wrong: oscillating electric and magnetic components describe EM waves only.", "Wrong: acoustic waves in fluids are longitudinal, and in tissue they are mainly longitudinal.", "Correct: sound needs a material medium; EM waves are self-propagating and need none."], "tag": "b06·Q79", "mid": "b06", "section": "EM vs acoustic", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement distinguishes acoustic waves from electromagnetic waves?"}, {"difficulty": "hard", "options": ["0.5 mm", "2.0 mm", "8.0 mm", "0.2 mm"], "correct_index": 1, "explanations": ["Wrong: this is f/v, the inverted ratio.", "Correct: λ = v/f = 4.0 mm/µs ÷ 2 MHz = 2.0 mm (4000 m/s ÷ 2×10⁶ Hz = 0.002 m).", "Wrong: this multiplies speed by frequency instead of dividing.", "Wrong: this is ten times too small from a unit conversion slip."], "tag": "b06·Q80", "mid": "b06", "section": "Wavelength", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A 2 MHz beam travels in bone, where the speed is 4.0 mm/µs. What is the wavelength?"}, {"difficulty": "devil", "options": ["About 80%", "About 94%", "About 89%", "About 67%"], "correct_index": 1, "explanations": ["Wrong. This corresponds to a ratio of 4 : 1, which would follow from an r² law.", "Correct. The flow ratio is 2⁴ = 16 : 1, so the wider vessel takes 16/17 ≈ 0.94 of the total.", "Wrong. This corresponds to a ratio of 8 : 1, which would follow from an r³ law.", "Wrong. This corresponds to a ratio of 2 : 1, a purely linear dependence on radius."], "tag": "b07·Q1", "mid": "b07", "section": "Parallel flow division", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Two parallel vessels have equal length and viscosity. One has radius r and the other has radius 2r. What fraction of the total flow passes through the wider vessel?"}, {"difficulty": "easy", "options": ["The physical study of flowing blood and of the solid structures, such as arteries, through which it flows", "The chemical study of blood composition and the plasma proteins it carries in circulation", "The study of how oxygen and carbon dioxide are exchanged across the alveolar membrane", "The study of how blood cells are produced in the bone marrow and released into plasma"], "correct_index": 0, "explanations": ["Correct. The slide defines hemodynamics as the physical study of flowing blood and the vessels that carry it, which includes arterial pressure and cardiac output.", "Wrong. Blood chemistry belongs to clinical biochemistry; hemodynamics is about the physics of flow and the vessels.", "Wrong. That describes gas exchange in respiratory physiology, not blood flow mechanics.", "Wrong. That is haematopoiesis, which is a cell biology topic and not hemodynamics."], "tag": "b07·Q2", "mid": "b07", "section": "Definition", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement best defines hemodynamics as presented in the lecture?"}, {"difficulty": "hard", "options": ["2", "3.6", "9", "3"], "correct_index": 3, "explanations": ["Wrong. This adds all four resistors as if in series (20 + 10 + 10 + 5 = 45).", "Wrong. This leaves out the parallel block altogether (R = 25) and gets 90/25.", "Wrong. This uses only a single 10 unit branch as if it were the entire resistance.", "Correct. The parallel pair gives 5, so total R = 20 + 5 + 5 = 30 and Q = 90/30 = 3."], "tag": "b07·Q3", "mid": "b07", "section": "Series-parallel network", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A circuit has a 20 unit resistor in series with two parallel 10 unit branches, which are in series with a 5 unit resistor. With a total ΔP of 90 mmHg, what is the flow in the same units?"}, {"difficulty": "medium", "options": ["It is doubled", "It is quadrupled", "It is unchanged", "It is halved"], "correct_index": 3, "explanations": ["Wrong. Re rises with velocity, density and diameter, but falls with viscosity.", "Wrong. Viscosity appears to the first power and in the denominator.", "Wrong. Viscosity is one of the four variables in the Reynolds number.", "Correct. Re = vdρ/η, so Re is inversely proportional to viscosity."], "tag": "b07·Q4", "mid": "b07", "section": "Reynolds dependence", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "If the viscosity of blood doubles while velocity, diameter and density stay the same, what happens to the Reynolds number?"}, {"difficulty": "devil", "options": ["It assumes steady laminar flow in a long rigid cylindrical tube", "It assumes the fluid has a constant viscosity, which blood does not strictly show", "It fails above the critical Reynolds number as flow becomes turbulent", "It holds exactly for pulsatile turbulent flow in elastic arteries"], "correct_index": 3, "explanations": ["True. These are the conditions used in its derivation.", "True. Blood's non-Newtonian behaviour limits the accuracy of the equation.", "True. Eddy losses make flow fall below the value that the equation predicts.", "Correct choice, since this is the false statement. The equation is derived for steady laminar flow in a rigid straight tube, so it only approximates arteries."], "tag": "b07·Q5", "mid": "b07", "section": "False statement: Poiseuille", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about the validity of Poiseuille's equation in real circulation is FALSE?"}, {"difficulty": "devil", "options": ["3000, which is exactly at the turbulence threshold", "3333, which is just above the turbulence threshold", "5000, which is above the turbulence threshold", "1200, which is well within the laminar range"], "correct_index": 2, "explanations": ["Wrong. This accounts for the higher velocity but
