d consist of endothelium only, which favours exchange.", "Wrong. Fibrous tissue is found in larger vessels and not in the capillary wall."], "tag": "b07·Q8", "mid": "b07", "section": "Capillary wall", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In the blood vessel anatomy slide, which wall layer is the only one present in capillaries?"}, {"difficulty": "easy", "options": ["KE is proportional to the square of velocity", "KE is directly proportional to velocity", "KE is inversely proportional to velocity", "KE is independent of velocity and depends only on mass"], "correct_index": 0, "explanations": ["Correct. Doubling velocity makes the kinetic energy four times greater.", "Wrong. The dependence is quadratic, not linear.", "Wrong. Kinetic energy increases as the fluid moves faster.", "Wrong. Velocity is the main determinant of KE for a given mass."], "tag": "b07·Q9", "mid": "b07", "section": "Kinetic energy", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The lecture gives the kinetic energy of flowing blood as KE = ½ × mass × velocity². How does KE depend on velocity?"}, {"difficulty": "hard", "options": ["About 12 mmHg", "About 4 mmHg", "About 16 mmHg", "About 24 mmHg"], "correct_index": 0, "explanations": ["Correct. ΔP = ½ρ(v₂² − v₁²) = 0.5 × 1060 × (4 − 1) = 1590 Pa ≈ 11.9 mmHg.", "Wrong. This squares the velocity difference, (2 − 1)², rather than taking the difference of the squares.", "Wrong. This uses only the kinetic term at the narrow section, ½ρv₂², and ignores the initial kinetic term.", "Wrong. This is double the correct answer, from omitting the factor of ½ in the kinetic term."], "tag": "b07·Q10", "mid": "b07", "section": "Bernoulli numeric", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Blood (ρ = 1060 kg/m³) speeds up from 1 m/s in a wide section to 2 m/s in a narrow section. Ignoring height changes, by how much does static pressure fall? (1 mmHg = 133.3 Pa)"}, {"difficulty": "medium", "options": ["Their combined cross-sectional area is far greater than that of the aorta", "Capillary walls have the highest resistance of all vessels in the body", "Cardiac output is much lower at the capillaries than at the aorta", "Red cells stick to the endothelium and stop moving through the lumen"], "correct_index": 0, "explanations": ["Correct. Because v = Q/A and the total capillary area is huge, velocity falls, which gives time for exchange.", "Wrong. Resistance affects pressure drop; velocity at a given flow is set by total area.", "Wrong. The same cardiac output passes each level of the circulation in series.", "Wrong. Cells keep flowing; there is no general adhesion that slows capillary flow."], "tag": "b07·Q11", "mid": "b07", "section": "Capillary velocity", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Why is blood velocity lowest in the capillaries even though each capillary is extremely narrow?"}, {"difficulty": "devil", "options": ["Because the flow is continuous, the pressure at the narrowing must rise as velocity rises", "Continuity requires velocity to rise where the cross-sectional area falls at constant flow", "Total energy per unit volume is conserved in the ideal case along a streamline", "Real viscous losses mean the pressure does not fully recover after the narrowing"], "correct_index": 0, "explanations": ["Correct choice, since this is the false statement. In the ideal case, static pressure falls when velocity rises, because kinetic energy is gained at the expense of pressure.", "True. Q = A × v is constant, so a smaller A requires a larger v.", "True. Pressure, kinetic and potential energy terms sum to a constant for ideal flow.", "True. Friction and eddies dissipate energy, so downstream pressure remains lower than upstream."], "tag": "b07·Q12", "mid": "b07", "section": "False statement: Bernoulli", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about Bernoulli's principle and continuity in a narrowed artery is FALSE?"}, {"difficulty": "medium", "options": ["At the narrow section, where the velocity is highest", "At the wide inlet section, where the velocity is lowest", "At the outlet, because the blood has travelled furthest", "At all three sections, because the flow rate is constant"], "correct_index": 0, "explanations": ["Correct. The kinetic term (15 mmHg) is largest at B, so the static pressure term is smallest there.", "Wrong. At the inlet the kinetic term is small, so the static pressure is higher.", "Wrong. In the ideal case the pressure recovers to the inlet value at the same velocity.", "Wrong. Flow rate is constant but the pressure shifts with velocity."], "tag": "b07·Q13", "mid": "b07", "section": "Bernoulli in a constriction", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In the tube with narrow section B, velocity is 100, 200 and 100 cm/s at A, B and C. Where is the static pressure lowest in the ideal case?"}, {"difficulty": "devil", "options": ["About 9 mmHg", "About 30 mmHg", "About 1 mmHg", "About 15 mmHg"], "correct_index": 3, "explanations": ["Wrong. This squares the velocity difference, (2.0 − 0.5)², instead of using the difference of the squares.", "Wrong. This drops the factor ½ in the kinetic-energy term and doubles the answer.", "Wrong. This uses only the small kinetic term of the upstream velocity.", "Correct. ΔP = ½ρ(v₂² − v₁²) = 0.5 × 1060 × (4 − 0.25) ≈ 1988 Pa ≈ 14.9 mmHg."], "tag": "b07·Q14", "mid": "b07", "section": "Bernoulli at a stenosis", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Blood (ρ = 1060 kg/m³) passes a stenosis, with velocity rising from 0.5 m/s to 2.0 m/s. Ignoring losses and height, what is the fall in static pressure? (1 mmHg = 133.3 Pa)"}, {"difficulty": "devil", "options": ["About 17 s", "About 0.6 s", "About 1.7 s", "About 0.017 s Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 136"], "correct_index": 2, "explanations": ["Wrong. This treats the capillary as 5 mm long, an error of ten in the unit conversion.", "Wrong. This inverts the ratio and divides velocity by length.", "Correct. Length is 0.05 cm, so t = 0.05/0.03 ≈ 1.7 s, which allows time for gas and nutrient exchange.", "Wrong. This is a hundredfold too short, from converting mm to cm incorrectly. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 147"], "tag": "b07·Q15", "mid": "b07", "section": "Capillary transit time", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Mean capillary velocity is 0.03 cm/s. How long does an erythrocyte take to traverse a capillary 0.5 mm long?"}, {"difficulty": "medium", "options": ["Anaemic hypoxia", "Hypoxic hypoxia", "Histotoxic hypoxia", "Stagnant hypoxia"], "correct_index": 3, "explanations": ["Wrong. That occurs when haemoglobin is reduced or unable to carry oxygen.", "Wrong. That results from low arterial oxygen tension, as at altitude.", "Wrong. That occurs when tissues cannot use oxygen, as in cyanide poisoning.", "Correct. Slow flow leaves tissue short of oxygen delivery even when arterial oxygen content is normal."], "tag": "b07·Q16", "mid": "b07", "section": "Stagnant hypoxia", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "According to the lecture, what condition results if blood flow velocity is too slow?"}, {"difficulty": "medium", "options": ["5 L/min", "0.2 L/min", "7 L/min", "6 L/min"], "correct_index": 0, "explanations": ["Correct. ΔP = 120 − 20 = 100 mmHg and Q = ΔP/R = 100/20 = 5 L/min.", "Wrong. This inverts the ratio and gives R/ΔP instead of ΔP/R.", "Wrong. This uses the inlet pressure minus 100, which is not the pressure gradient.", "Wrong. This comes from dividing 120 by 20 and ignoring the outlet pressure."], "tag": "b07·Q17", "mid": "b07", "section": "Flow calculation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A vessel segment has an inlet pressure of 120 mmHg, an outlet pressure of 20 mmHg and a resistance of 20 mmHg·min/L. What is the flow?"}, {"difficulty": "devil", "options": ["About 160 N/m", "About 320 N/m", "About 80 N/m", "About 1.6 N/m"], "correct_index": 0, "explanations": ["Correct. T = 0.5 × 120 × 133.3 × 0.02 ≈ 160 N/m, which is half the tension of a cylinder of the same radius.", "Wrong. This uses the cylinder formula T = PR, which does not suit a sphere.", "Wrong. This applies the sphere factor of ½ twice.", "Wrong. This is a hundredfold too small, from using cm and Pa together without conversion."], "tag": "b07·Q18", "mid": "b07", "section": "Spherical aneurysm", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A saccular aneurysm of radius 2 cm is modelled as a sphere at 120 mmHg (1 mmHg = 133.3 Pa). Using T = PR/2, what is the wall tension?"}, {"difficulty": "easy", "options": ["Flow corresponds to voltage V and pressure corresponds to current I", "Flow corresponds to charge q and pressure corresponds to resistance R", "Flow corresponds to current I and pressure corresponds to voltage V", "Flow corresponds to resistance R and pressure corresponds to charge q"], "correct_index": 2, "explanations": ["Wrong. The pairing is reversed; voltage drives current just as pressure drives flow.", "Wrong. Charge pairs with volume, and resistance pairs with vascular resistance, not pressure.", "Correct. The table pairs pressure with voltage, flow with current, volume with charge and resistance with resistance.", "Wrong. Neither pairing matches the lecture's analogy table."], "tag": "b07·Q19", "mid": "b07", "section": "Ohm's law analogy", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The lecture compares blood flow to Ohm's law with Q = ΔP / R. Which electrical variable corresponds to flow Q and which to pressure P?"}, {"difficulty": "easy", "options": ["Movement in only the axial direction along parallel layers", "Irregular movement in axial, radial and circumferential directions", "Movement in a perfectly parabolic profile with zero velocity at the centre", "A total absence of any pressure gradient between the two ends"], "correct_index": 1, "explanations": ["Wrong. This is laminar flow, where velocity vectors are parallel to the vessel axis.", "Correct. In turbulence the fluid moves in all three directions, creating eddies.", "Wrong. The parabolic profile belongs to laminar flow and has maximum velocity at the centre.", "Wrong. Flow of any kind requires a pressure gradient."], "tag": "b07·Q20", "mid": "b07", "section": "Turbulent flow", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "According to the lecture, turbulent blood flow is characterised by:"}, {"difficulty": "medium", "options": ["35", "About 2.86", "About 11.7", "5"], "correct_index": 1, "explanations": ["Wrong. This is the series sum, not the parallel combination.", "Correct. 1/Rx = 1/5 + 1/10 + 1/20 = 0.35, so Rx = 2.86.", "Wrong. This is the arithmetic average (35/3), which is not how parallel resistances combine.", "Wrong. This is the smallest single resistance; the parallel total is even smaller than that."], "tag": "b07·Q21", "mid": "b07", "section": "Parallel resistance", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Three vessels with R = 5, 10 and 20 are arranged in parallel. What is their combined resistance?"}, {"difficulty": "medium", "options": ["It doubles because resistance drives flow", "It falls to half its original value", "It falls to a quarter of its original value", "It stays the same because pressure is unchanged"], "correct_index": 1, "explanations": ["Wrong. Resistance opposes flow; flow is inversely proportional to R.", "Correct. Since Q = ΔP/R, doubling R at constant ΔP halves Q.", "Wrong. Q depends on 1/R to the first power, not on 1/R².", "Wrong. Flow depends on both ΔP and R, so a change in R alters Q."], "tag": "b07·Q22", "mid": "b07", "section": "Resistance and flow", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "If the pressure gradient across a vascular bed stays constant while its resistance doubles, what happens to blood flow?"}, {"difficulty": "easy", "options": ["v = Q × A", "v = A / Q", "v = Q / A²", "v = Q / A Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 137"], "correct_index": 3, "explanations": ["Wrong. Multiplying would make velocity rise with area, the opposite of what is observed.", "Wrong. This inverts the relationship and has the wrong units.", "Wrong. Area enters to the first power, not squared.", "Correct. Velocity is directly proportional to flow and inversely proportional to cross-sectional area. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 148"], "tag": "b07·Q23", "mid": "b07", "section": "Velocity", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "How is the mean velocity of blood in a vessel related to flow (Q) and cross-sectional area (A)?"}, {"difficulty": "medium", "options": ["Turbulence increases the flow obtained for that pressure", "Turbulence reduces the flow obtained for that pressure", "Turbulence has no effect on the flow obtained for that pressure", "Turbulence removes the need for any pressure gradient"], "correct_index": 1, "explanations": ["Wrong. Eddies dissipate energy and lower the flow.", "Correct. Once the critical Reynolds number is exceeded, energy is wasted in eddies and flow falls below the laminar line.", "Wrong. The graph shows the turbulent curve bending below the laminar line.", "Wrong. Every flow requires a pressure gradient."], "tag": "b07·Q24", "mid": "b07", "section": "Turbulence and flow", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "For a given perfusion pressure, how does turbulent flow compare with laminar flow?"}, {"difficulty": "hard", "options": ["0.3 cm/s", "0.03 cm/s", "0.003 cm/s", "30 cm/s"], "correct_index": 1, "explanations": ["Wrong. This corresponds to an area ratio of 100, not 1000.", "Correct. Q = 90 cm³/s, and v = Q/A = 90/3000 = 0.03 cm/s, so velocity falls a thousandfold.", "Wrong. This is ten times too slow and corresponds to an area ratio of 10 000.", "Wrong. This assumes velocity stays constant, ignoring the thousandfold increase in total area."], "tag": "b07·Q25", "mid": "b07", "section": "Continuity in capillaries", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Mean aortic velocity is 30 cm/s with a cross-sectional area of 3 cm², and the total capillary cross-section is 3000 cm². What is the mean capillary velocity?"}, {"difficulty": "easy", "options": ["The heart stores blood and the blood vessels pump it through the tissues around the body", "The heart pumps blood and the blood vessels transport it throughout the body", "The heart filters blood and the vessels digest nutrients that are absorbed into the plasma", "The heart transports blood and the vessels produce the pressure that drives circulation"], "correct_index": 1, "explanations": ["Wrong. The roles are reversed; vessels are conduits and do not generate the main pumping action.", "Correct. The slide states the heart pumps blood while the vessels transport it to all body regions.", "Wrong. Filtering is a kidney function and digestion belongs to the gut; neither is a role of the heart or vessels.", "Wrong. Pressure is generated by the heart, so the roles of pump and conduit are swapped here."], "tag": "b07·Q26", "mid": "b07", "section": "Cardiovascular system", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In the organ-systems slide, what are the functions of the two components of the cardiovascular system?"}, {"difficulty": "hard", "options": ["2 L/min", "10 L/min", "12.5 L/min", "4 L/min"], "correct_index": 2, "explanations": ["Wrong. This applies the series sum, 25, giving 50/25; parallel beds have a smaller total resistance.", "Wrong. This counts only the flow through the 5 mmHg·min/L bed and omits the second branch.", "Correct. 1/Rx = 1/20 + 1/5 = 0.25, so Rx = 4 and Q = 50/4 = 12.5 L/min (10 through the low-resistance bed and 2.5 through the other).", "Wrong. This is the combined resistance, not the flow produced by that resistance."], "tag": "b07·Q27", "mid": "b07", "section": "Parallel flow", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Two vascular beds with resistances 20 and 5 mmHg·min/L are in parallel across a pressure gradient of 50 mmHg. What is the total flow?"}, {"difficulty": "hard", "options": ["About 0.79 m/s", "About 0.40 m/s", "About 4.0 m/s", "About 0.040 m/s"], "correct_index": 1, "explanations": ["Wrong. This results from inserting the radius (1.25 cm) as though it were the diameter.", "Correct. v = Re·η/(ρd) = 3000 × 0.0035 / (1060 × 0.025) ≈ 0.396 m/s.", "Wrong. This is ten times too high, from a power-of-ten error with the viscosity.", "Wrong. This is ten times too low and would make even resting flow turbulent."], "tag": "b07·Q28", "mid": "b07", "section": "Critical velocity", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Taking critical Re = 3000, η = 3.5 mPa·s and ρ = 1060 kg/m³, what is the velocity at which turbulence begins in an aorta of diameter 2.5 cm?"}, {"difficulty": "medium", "options": ["The low-resistance line is flatter, giving less flow for each mmHg of ΔP", "Both lines have the same slope but start from different intercepts", "The low-resistance line is steeper, giving more flow for each mmHg of ΔP", "The high-resistance line is steeper because friction increases the flow"], "correct_index": 2, "explanations": ["Wrong. This reverses the relationship; a flatter line belongs to the high-resistance vessel.", "Wrong. Both start at the origin and resistance determines the slope.", "Correct. The slope of the Q-versus-ΔP line is 1/R, so lower resistance means a steeper line.", "Wrong. Friction opposes flow and so lowers the slope."], "tag": "b07·Q29", "mid": "b07", "section": "Pressure-flow graph", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "On the lecture graph of flow against perfusion pressure, how do the low-resistance and high-resistance lines differ?"}, {"difficulty": "easy", "options": ["Exerted only in the direction of flow", "Exerted equally in all directions", "Exerted only on the vessel wall nearest to the heart", "Greatest at the centre of the lumen and zero at the wall"], "correct_index": 1, "explanations": ["Wrong. Pressure acts against the wall as well as along the stream.", "Correct. The pressure pushes equally on the wall in every direction, not only along the flow.", "Wrong. The principle makes no distinction of position in this way.", "Wrong. This describes the velocity profile of laminar flow, not pressure. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 149"], "tag": "b07·Q30", "mid": "b07", "section": "Pascal's principle", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In the slide on pressure in a vessel, Pascal's principle says that pressure in a fluid is:"}, {"difficulty": "hard", "options": ["A larger radius lowers wall tension, which lets the wall relax and balloon", "A larger radius raises blood viscosity, which pushes on the wall more", "A larger radius makes the flow laminar, which weakens the endothelium", "A larger radius raises wall tension at the same pressure, which stretches the wall further Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 138"], "correct_index": 3, "explanations": ["Wrong. Tension increases with radius in the Laplace law; it does not fall.", "Wrong. Radius does not change viscosity, and viscosity is not part of the Laplace law.", "Wrong. Flow pattern is not the driver of tension here, and laminar flow is not harmful to the endothelium.", "Correct. T = P × R, so as R rises the tension rises, causing more stretch and a positive feedback loop."], "tag": "b07·Q31", "mid": "b07", "section": "Aneurysm mechanism", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Using the Laplace law, why does an aneurysm tend to keep enlarging once it forms?"}, {"difficulty": "medium", "options": ["0.2 cm/s, 1 cm/s and 0.1 cm/s", "20 cm/s, 100 cm/s and 10 cm/s", "5 cm/s, 10 cm/s and 1 cm/s", "5 cm/s, 1 cm/s and 10 cm/s"], "correct_index": 3, "explanations": ["Wrong. These are A/Q values, which invert the formula.", "Wrong. These are Q × A products, which wrongly make velocity rise with area.", "Wrong. The widest segment is given the highest velocity, but velocity is lowest where area is largest.", "Correct. v = Q/A gives 10/2 = 5, 10/10 = 1 and 10/1 = 10 cm/s."], "tag": "b07·Q32", "mid": "b07", "section": "Velocity and area", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In the tube drawing, flow Q = 10 mL/s passes through segments with cross-sectional areas of 2, 10 and 1 cm². What are the velocities in these segments?"}, {"difficulty": "devil", "options": ["10.8 L/min", "5.4 L/min", "2.7 L/min", "21.6 L/min"], "correct_index": 1, "explanations": ["Wrong. This uses the peak velocity of 60 cm/s as though it were the mean over the cross-section.", "Correct. Mean v = 30 cm/s, Q = 3 × 30 = 90 mL/s, which equals 5.4 L/min.", "Wrong. This halves the mean velocity again, applying the parabolic factor twice.", "Wrong. This doubles the peak velocity, the opposite of the correct relation."], "tag": "b07·Q33", "mid": "b07", "section": "Mean laminar velocity", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In laminar flow with a parabolic profile, the mean velocity is half the axial maximum. If the axial velocity in an aorta of area 3 cm² is 60 cm/s, what is the flow?"}, {"difficulty": "devil", "options": ["Blood is a Newtonian fluid, so its viscosity is the same at every shear rate", "Viscosity rises steeply as haematocrit increases", "Apparent viscosity falls in tubes of about 6 to 8 µm diameter", "Viscosity is measured in poise or in Pa·s"], "correct_index": 0, "explanations": ["Correct choice, since this is the false statement. Blood is non-Newtonian: red cell aggregation at low shear raises its viscosity, and the viscosity falls as shear rises.", "True. More cells per volume means more internal friction, which is the basis for the hazards of polycythaemia.", "True. This is the Fahraeus-Lindqvist effect, giving a minimum near that diameter.", "True. Both are units of dynamic viscosity, as the lecture describes under shear stress over shear rate."], "tag": "b07·Q34", "mid": "b07", "section": "False statement: viscosity", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about blood viscosity is FALSE?"}, {"difficulty": "devil", "options": ["About 5.6 Pa", "About 0.35 Pa", "About 28 Pa", "About 2.8 Pa"], "correct_index": 3, "explanations": ["Wrong. This uses 8ηQ/(πr³), which is twice the correct expression for wall shear stress.", "Wrong. This uses the diameter in place of the radius, so the r³ term is eight times too big.", "Wrong. This is ten times too large, from a power-of-ten slip when converting mL/s or mm.", "Correct. τ = 4 × 0.0035 × 5×10⁻⁶ / (π × (2×10⁻³)³) ≈ 2.79 Pa."], "tag": "b07·Q35", "mid": "b07", "section": "Wall shear stress", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Blood of viscosity 3.5 mPa·s flows at 5 mL/s in a vessel of radius 2 mm. Using wall shear stress = 4ηQ/(πr³), what is the value?"}, {"difficulty": "hard", "options": ["About 3030, just above the turbulence threshold", "About 1510, which keeps the flow laminar", "About 303, which keeps the flow laminar", "About 30 300, which means gross turbulence"], "correct_index": 0, "explanations": ["Correct. Re = ρvd/η = 1060 × 0.5 × 0.02 / 0.0035 ≈ 3029, which exceeds 3000.", "Wrong. This results from using the radius (1 cm) instead of the diameter in the formula.", "Wrong. This is off by a factor of ten, usually from a unit slip when converting cm to m.", "Wrong. This is ten times too large, which usually comes from mistaking mPa·s for 10⁻² Pa·s."], "tag": "b07·Q36", "mid": "b07", "section": "Reynolds calculation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "For blood with ρ = 1060 kg/m³ and η = 3.5 mPa·s flowing at 0.5 m/s in a vessel of internal diameter 2 cm, what is the Reynolds number and what does it imply?"}, {"difficulty": "devil", "options": ["16 200, which is gross turbulence due to the ninefold velocity", "600, which keeps the flow silent and laminar", "5400, turbulence that may be heard as a bruit", "1800, which stays laminar and has no effect"], "correct_index": 2, "explanations": ["Wrong. This applies the velocity rise but forgets that the smaller diameter lowers Re.", "Wrong. This divides by three for the diameter but ignores the ninefold rise in velocity.", "Correct. Area falls ninefold, so v rises ×9, and d falls to 1/3, so Re = 1800 × 9 / 3 = 5400, above 3000.", "Wrong. This assumes the velocity and diameter changes cancel, but they do not."], "tag": "b07·Q37", "mid": "b07", "section": "Stenosis and bruit", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Flow in a carotid artery has Re = 1800. At constant flow, plaque narrows the lumen diameter to one third. What is Re at the stenosis and what is the clinical consequence?"}, {"difficulty": "devil", "options": ["A rise in the mean velocity of flow", "A rise in haematocrit that increases blood viscosity", "A widening of the internal diameter of the vessel", "A rise in the density of the blood Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 139"], "correct_index": 1, "explanations": ["Wrong. Velocity is in the numerator of Re, so a faster flow raises it.", "Correct. Re = ρvd/η, so a rise in viscosity lowers Re while all other factors are held constant.", "Wrong. Diameter is in the numerator, so a larger tube raises Re at the same velocity.", "Wrong. Density is also in the numerator, so a denser fluid has a higher Re. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 150"], "tag": "b07·Q38", "mid": "b07", "section": "Lowering Reynolds number", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which single change would LOWER the Reynolds number in a blood vessel, making turbulence less likely?"}, {"difficulty": "hard", "options": ["5 mL/mmHg", "0.2 mL/mmHg", "3.75 mL/mmHg", "15 mL/mmHg"], "correct_index": 0, "explanations": ["Correct. ΔP = 30 mmHg, so C = 150/30 = 5 mL/mmHg.", "Wrong. This is the reciprocal ΔP/ΔV, which describes elastance.", "Wrong. This divides by the final pressure (40) and not the pressure change.", "Wrong. This divides by the starting pressure (10) rather than the change."], "tag": "b07·Q39", "mid": "b07", "section": "Compliance calculation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A vein segment takes up 150 mL as pressure rises from 10 to 40 mmHg. Using C = ΔV/ΔP, what is its compliance?"}, {"difficulty": "medium", "options": ["Highest at the vessel wall and zero at the centre of the lumen", "Equal across the whole lumen, like a plug moving as one", "Highest at the centre of the lumen and zero at the vessel wall", "Highest just inside the wall and lowest at the centre"], "correct_index": 2, "explanations": ["Wrong. Friction with the endothelium holds the outer layer almost still.", "Wrong. That is a flat profile, not the parabolic one in the lecture.", "Correct. The concentric layers move fastest in the middle (Vmax) and the layer at the wall has V = 0.", "Wrong. The maximum is at the axis of the vessel."], "tag": "b07·Q40", "mid": "b07", "section": "Velocity profile", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In the parabolic velocity profile of laminar blood flow, where is the velocity highest and lowest?"}, {"difficulty": "devil", "options": ["About 3.4 times", "About 2.25 times", "About 1.5 times", "About 5.1 times"], "correct_index": 3, "explanations": ["Wrong. This is 1.5³, which comes from a cubic radius dependence.", "Wrong. This is 1.5², from a square dependence that is not Poiseuille's law.", "Wrong. This is the ratio of radii only, as though flow were directly proportional to r.", "Correct. Q ∝ r⁴, so (0.6/0.4)⁴ = 1.5⁴ ≈ 5.06."], "tag": "b07·Q41", "mid": "b07", "section": "Cannula gauge", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A phlebotomist replaces a 21G cannula (internal radius 0.4 mm) with an 18G cannula (internal radius 0.6 mm), of the same length, using the same pressure and fluid. By what factor does the flow rise?"}, {"difficulty": "medium", "options": ["Anaemia raises viscosity and resistance, while polycythaemia lowers both", "Both conditions lower viscosity because plasma volume is altered", "Anaemia lowers viscosity and resistance, while polycythaemia raises both", "Neither condition affects viscosity because plasma viscosity is fixed"], "correct_index": 2, "explanations": ["Wrong. This reverses the effect of red cell mass on viscosity.", "Wrong. Polycythaemia means more cells per volume and therefore thicker blood.", "Correct. Viscosity rises steeply with haematocrit and resistance is proportional to viscosity.", "Wrong. Whole blood viscosity depends strongly on haematocrit, not only on plasma."], "tag": "b07·Q42", "mid": "b07", "section": "Hematocrit", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "How do anaemia and polycythaemia change blood viscosity and therefore resistance to flow?"}, {"difficulty": "easy", "options": ["R = πr⁴ / 8ηl, and the length has the most powerful effect", "R = 8ηr / πl⁴, and the viscosity has the most powerful effect", "R = 8ηl / πr⁴, and the radius has the most powerful effect", "R = 8πηl / r², and the radius has a squared effect"], "correct_index": 2, "explanations": ["Wrong. This is the inverse expression, and length only acts linearly.", "Wrong. The fourth power belongs to the radius, not to length, and viscosity acts linearly.", "Correct. Because r is raised to the fourth power, small changes in radius dominate the resistance.", "Wrong. The resistance depends on r⁴, which is far stronger than a squared effect."], "tag": "b07·Q43", "mid": "b07", "section": "Resistance equation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which expression gives the resistance to blood flow from Poiseuille's equation, and which variable has the most powerful effect?"}, {"difficulty": "devil", "options": ["64 mmHg", "130 mmHg", "126 mmHg", "144 mmHg"], "correct_index": 2, "explanations": ["Wrong. This divides by 1.4, which wrongly suggests that thicker blood lowers the pressure needed.", "Wrong. This adds 40 mmHg instead of multiplying by 1.4.", "Correct. ΔP = Q × R, and R ∝ η, so ΔP = 90 × 1.4 = 126 mmHg.", "Wrong. This multiplies by 1.6, which does not match a 40% rise."], "tag": "b07·Q44", "mid": "b07", "section": "Polycythaemia and pressure", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Cardiac output stays constant at 5 L/min and vessel dimensions are unchanged. Polycythaemia raises blood viscosity by 40%. If the pressure gradient was 90 mmHg, what is it now?"}, {"difficulty": "devil", "options": ["The velocity profile is parabolic with the maximum velocity on the axis", "Layers at the wall move fastest because the endothelium drags them along", "Fluid moves in parallel concentric layers sliding over each other", "It is favoured when the Reynolds number is low, below about 2000 Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 140"], "correct_index": 1, "explanations": ["True. This is the classical profile of laminar flow in a cylindrical tube.", "Correct choice, since this is the false statement. The wall layer is held almost stationary by friction, and the fastest layer is on the axis.", "True. This lamellar pattern is the definition of laminar flow.", "True. Low Re means viscous forces dominate over inertial forces, which maintains orderly layers."], "tag": "b07·Q45", "mid": "b07", "section": "False statement: laminar flow", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about laminar flow is FALSE?"}, {"difficulty": "easy", "options": ["Inversely proportional to the voltage across the two points", "Proportional to the square of the length of the conductor between them", "Directly proportional to the voltage across the two points", "Independent of voltage and determined only by the conductor temperature"], "correct_index": 2, "explanations": ["Wrong. Current rises as voltage rises; it is inversely related to resistance, not to voltage.", "Wrong. Ohm's law has no squared-length term; resistance depends on length only linearly.", "Correct. I is proportional to V, and its fluid analogue is flow being proportional to the pressure difference.", "Wrong. Temperature can alter resistance, but current still depends on the applied voltage. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 151"], "tag": "b07·Q46", "mid": "b07", "section": "Ohm's law", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Ohm's law, as stated in the lecture, says that the current through a conductor between two points is:"}, {"difficulty": "devil", "options": ["0.75 s", "1.33 s", "3.0 s", "6.0 s"], "correct_index": 2, "explanations": ["Wrong. This divides R by C, which does not give a time constant.", "Wrong. This divides C by R, which has the wrong units for a time.", "Correct. τ = R × C = 1.5 × 2 = 3.0 s, and the units cancel to seconds.", "Wrong. This doubles the product, perhaps by confusing it with the time taken to settle."], "tag": "b07·Q47", "mid": "b07", "section": "Fluid RC time constant", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A compliant vessel has resistance 1.5 mmHg·s/mL and capacitance (compliance) 2 mL/mmHg. By analogy with an electrical RC circuit, what is its time constant?"}, {"difficulty": "hard", "options": ["About 41% larger", "About 100% larger", "About 50% larger", "About 19% larger"], "correct_index": 3, "explanations": ["Wrong. This is 2^(1/2), the factor that would apply if flow depended on r².", "Wrong. This assumes a linear dependence of flow on radius, which ignores the fourth power.", "Wrong. This is an arbitrary guess that does not follow from the r⁴ relationship.", "Correct. Flow ∝ r⁴/η, so r⁴ must double, giving r × 2^(1/4) = 1.19."], "tag": "b07·Q48", "mid": "b07", "section": "Compensating for viscosity", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "If blood viscosity doubles, by what factor must the vessel radius increase to restore the original flow at the same ΔP and length?"}, {"difficulty": "medium", "options": ["It increases steadily as the tube becomes narrower", "It decreases, reaching a minimum at roughly 6 to 8 µm", "It stays constant because blood is a Newtonian fluid", "It decreases until it reaches zero in the smallest capillaries"], "correct_index": 1, "explanations": ["Wrong. In the effect described, viscosity falls with narrowing tubes over the relevant range.", "Correct. The slide states apparent viscosity falls as the tube narrows and reaches a minimum around 6 to 8 µm.", "Wrong. Blood is not Newtonian and its apparent viscosity depends on tube size.", "Wrong. The viscosity reaches a minimum value and never falls to zero."], "tag": "b07·Q49", "mid": "b07", "section": "Fahraeus-Lindqvist", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "According to the Fahraeus-Lindqvist effect, what happens to the apparent viscosity of blood as the tube diameter shrinks toward the capillary range?"}, {"difficulty": "hard", "options": ["About 112 µL/s", "About 0.44 µL/s", "About 7 µL/s", "About 7 mL/s"], "correct_index": 2, "explanations": ["Wrong. This uses the diameter (1 mm) in place of the radius, inflating Q by 2⁴ = 16.", "Wrong. This is 16 times too small, from dividing by 2⁴ when it was not needed.", "Correct. Q = π × 100 × (5×10⁻⁴)⁴ / (8 × 0.0035 × 0.1) ≈ 7.0×10⁻⁹ m³/s = 7 µL/s.", "Wrong. This is a thousand times too large, from a mistake in converting m³ to mL."], "tag": "b07·Q50", "mid": "b07", "section": "Poiseuille numeric", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Using Q = πΔP r⁴ / (8ηl), what is the flow in a tube of radius 0.5 mm and length 10 cm with ΔP = 100 Pa and η = 3.5 mPa·s?"}, {"difficulty": "hard", "options": ["25% of the original value", "75% of the original value", "67% of the original value", "50% of the original value"], "correct_index": 1, "explanations": ["Wrong. This would leave only one vessel open, not three.", "Correct. Conductance is proportional to the number of open vessels, so 3 of 4 gives 3/4.", "Wrong. This gives 2/3, which has no basis in the conductance of three of four vessels.", "Wrong. This assumes two of the four were blocked rather than one."], "tag": "b07·Q51", "mid": "b07", "section": "Parallel occlusion", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Four identical vessels supply a tissue in parallel at constant ΔP. If one vessel is totally blocked, total flow becomes:"}, {"difficulty": "hard", "options": ["Their walls are thicker than the aorta so they absorb pressure as elastic energy", "Their blood has the highest viscosity of any vessel in the circulation", "Their total cross-section is the largest so the pressure spreads out", "Their small radius gives a very high resistance because R ∝ 1/r⁴ Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 141"], "correct_index": 3, "explanations": ["Wrong. Elastic recoil stores energy but does not account for the large pressure drop.", "Wrong. Viscosity is not highest there; radius is the dominating factor.", "Wrong. Capillaries have the largest total area, and a large area lowers velocity, not pressure.", "Correct. Arterioles are the main resistance vessels, so most of the pressure is dissipated across them."], "tag": "b07·Q52", "mid": "b07", "section": "Pressure drop site", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Why does the largest fall in mean arterial pressure occur across the arterioles?"}, {"difficulty": "medium", "options": ["It rises as red cells clump together at higher shear", "It falls toward a plateau as red cell aggregates break up and cells align", "It stays constant, as blood behaves as a Newtonian fluid", "It falls to zero as plasma separates from the cells"], "correct_index": 1, "explanations": ["Wrong. Aggregation is a low-shear phenomenon.", "Correct. At low shear, red cells aggregate and viscosity is high; at high shear they disperse, deform and align, reaching about 3.5 mPa·s.", "Wrong. The curve is not flat, so blood is non-Newtonian.", "Wrong. The curve flattens at a finite plateau rather than reaching zero."], "tag": "b07·Q53", "mid": "b07", "section": "Shear thinning", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "On the viscosity versus shear-rate curve, what happens to blood viscosity as shear rate rises, and why?"}, {"difficulty": "hard", "options": ["4 times", "8 times", "16 times", "2 times"], "correct_index": 2, "explanations": ["Wrong. This is the rise in velocity only; KE depends on its square.", "Wrong. This would follow from a cubic relation, which has no basis here.", "Correct. Area falls to a quarter, so v rises fourfold, and KE ∝ v² gives 4² = 16.", "Wrong. This is the factor by which the radius changed, not the energy. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 152"], "tag": "b07·Q54", "mid": "b07", "section": "Kinetic energy in stenosis", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "At constant flow, a segment of artery narrows to half its radius. By what factor does the kinetic energy per unit volume of blood rise in the narrowing?"}, {"difficulty": "hard", "options": ["41% of the original value", "64% of the original value", "51% of the original value", "80% of the original value"], "correct_index": 0, "explanations": ["Correct. Q ∝ r⁴, so (0.8)⁴ = 0.41, which is a fall of roughly 59%.", "Wrong. 0.64 is (0.8)², a squared dependence; flow actually depends on r⁴.", "Wrong. 0.51 is (0.8)³, a cubic dependence, which does not match Poiseuille's law.", "Wrong. A linear dependence on radius would give 0.8, but the fourth power is far stronger."], "tag": "b07·Q55", "mid": "b07", "section": "Poiseuille radius", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A vessel is constricted so that its radius falls by 20% while length, viscosity and pressure gradient are unchanged. Flow becomes about:"}, {"difficulty": "easy", "options": ["Greater than 30", "Greater than 300", "Greater than 3000", "Greater than 30 000"], "correct_index": 2, "explanations": ["Wrong. Re values from 30 to 100 appear in the dye-stream pictures only as early wavy flow, not as the turbulence threshold.", "Wrong. This is ten times too low compared with the threshold taught.", "Correct. The slide says that Re greater than 3000 means turbulence will occur.", "Wrong. This is ten times too high compared with the threshold taught."], "tag": "b07·Q56", "mid": "b07", "section": "Reynolds number", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Above what Reynolds number does the lecture say turbulence will occur?"}, {"difficulty": "devil", "options": ["50%", "12.5%", "100%", "25%"], "correct_index": 3, "explanations": ["Wrong. This would follow if total resistance fell from 2 to 1.33, which is not the case.", "Wrong. This halves the real effect, which is the effect of the dilation on one bed only.", "Wrong. This assumes the whole system's resistance halves, but only one of four beds changed.", "Correct. Conductance goes from 4/8 = 0.5 to 3/8 + 1/4 = 0.625, so total R falls from 2 to 1.6 and flow rises by 2/1.6 = 1.25."], "tag": "b07·Q57", "mid": "b07", "section": "Selective dilation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Four identical parallel beds each have R = 8 units. One bed dilates so that its resistance falls to 4 units, with the same ΔP. By how much does total flow rise?"}, {"difficulty": "medium", "options": ["Viscosity is the internal friction that slows a fluid's flow, measured in poise", "Viscosity is the pressure needed to open a vessel, measured in mmHg", "Viscosity is the speed of the fastest layer, measured in cm/s", "Viscosity is the volume of fluid per second, measured in L/min"], "correct_index": 0, "explanations": ["Correct. It is the mechanical property resisting flow, expressed as force per area divided by velocity gradient.", "Wrong. That mixes up viscosity with a vessel opening pressure.", "Wrong. Velocity is displacement over time, not viscosity.", "Wrong. That is flow rate, not viscosity."], "tag": "b07·Q58", "mid": "b07", "section": "Viscosity definition", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Newton's definition of viscosity in the lecture is η = shear stress / shear rate. What does this tell us?"}, {"difficulty": "hard", "options": ["Red cells migrate to the axis, leaving a low-viscosity plasma layer by the wall", "Red cells lyse in narrow tubes, so that haemoglobin lowers the viscosity", "The plasma proteins are filtered out at the wall and thin the blood", "Shear forces at the wall freeze the outer layer, leaving a thin lumen Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 142"], "correct_index": 0, "explanations": ["Correct. Axial accumulation of red cells creates a cell-poor plasma sleeve, which lowers the effective viscosity in the tube.", "Wrong. Haemolysis is not part of the effect and would not occur normally.", "Wrong. Filtration of proteins is not the mechanism; it is a cell distribution effect.", "Wrong. This would raise the resistance, and no freezing occurs at the wall."], "tag": "b07·Q59", "mid": "b07", "section": "Fahraeus-Lindqvist mechanism", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which mechanism best explains the fall in apparent viscosity in narrow tubes (Fahraeus-Lindqvist effect)?"}, {"difficulty": "easy", "options": ["The viscosity of the contents and the length of the container only", "The velocity of the contents and the density of the container wall", "The temperature of the contents and the colour of the wall material", "Both the pressure of the container's contents and its radius"], "correct_index": 3, "explanations": ["Wrong. Viscosity and length appear in Poiseuille's law, not in the Laplace law.", "Wrong. Velocity features in Bernoulli's principle; Laplace's law does not use wall density.", "Wrong. Neither temperature nor colour appears in the law; only P and R matter.", "Correct. Wall tension T = P × R for a cylinder, so it depends on internal pressure and radius."], "tag": "b07·Q60", "mid": "b07", "section": "Laplace law", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "According to the lecture, the Laplace law states that the tension in the walls of a container depends on:"}, {"difficulty": "devil", "options": ["Pressure difference is analogous to voltage and flow is analogous to current", "Fluid capacitance is analogous to electrical resistance because both oppose steady flow", "Volume is analogous to electrical charge", "Vessels in series add their resistances, as resistors in series do"], "correct_index": 1, "explanations": ["True. This is the central pairing that gives Q = ΔP/R from Ohm's law.", "Correct choice, since this is the false statement. Capacitance stores volume, as electrical capacitance stores charge, whereas resistance corresponds to vascular resistance.", "True. Flow is the rate of volume movement, as current is the rate of charge movement.", "True. R_total = R₁ + R₂ + R₃ and so on, exactly as in the electrical case. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 153"], "tag": "b07·Q61", "mid": "b07", "section": "False statement: analogies", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about the hydraulic-electrical analogy is FALSE?"}, {"difficulty": "medium", "options": ["Velocity falls and static pressure rises at the narrowing", "Velocity and static pressure both rise at the narrowing", "Velocity and static pressure are unchanged at the narrowing", "Velocity rises and static pressure falls at the narrowing"], "correct_index": 3, "explanations": ["Wrong. Both trends are the opposite of what the principles predict.", "Wrong. Both cannot rise without extra energy input.", "Wrong. Flow is conserved, so a smaller area means higher velocity.", "Correct. The same flow through a smaller area needs a higher velocity, and the extra kinetic energy comes at the expense of pressure."], "tag": "b07·Q62", "mid": "b07", "section": "Atherosclerosis", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which change at a plaque-narrowed artery section follows from continuity and Bernoulli's principle?"}, {"difficulty": "easy", "options": ["The density of the fluid and the cross-sectional area of the tube", "The length of the tube and the coefficient of viscosity", "The wall thickness of the tube and the temperature of the fluid", "The tension in the wall and the pressure outside the tube"], "correct_index": 1, "explanations": ["Wrong. Density appears in the Reynolds number and Bernoulli equation, not in Poiseuille's law.", "Correct. Q = πΔP r⁴ / (8ηl), so flow falls with longer tubes and more viscous fluid.", "Wrong. Neither wall thickness nor temperature is a variable of the equation.", "Wrong. Wall tension is a Laplace-law quantity and is not in Poiseuille's equation."], "tag": "b07·Q63", "mid": "b07", "section": "Poiseuille law", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Poiseuille's law says the steady flow through a narrow tube varies directly as the pressure and the fourth power of the radius, and inversely as:"}, {"difficulty": "medium", "options": ["It is twice as great, T = 2PR against T = PR", "It is the same, because both have the same P and R", "It is half as great, T = PR/2 against T = PR", "It is four times smaller, T = PR/4 against T = PR"], "correct_index": 2, "explanations": ["Wrong. A sphere shares the load over two curvature directions, which reduces its tension.", "Wrong. The geometry changes the formula by a factor of two.", "Correct. The lecture gives T = PR for a cylinder and T = PR/2 for a sphere.", "Wrong. The factor is 2, not 4."], "tag": "b07·Q64", "mid": "b07", "section": "Laplace sphere", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "For the same internal pressure P and radius R, how does wall tension in a spherical vessel compare with a cylindrical vessel?"}, {"difficulty": "easy", "options": ["ΔP = P₁ − P₂, expressed in mmHg", "ΔP = P₁ + P₂, expressed in mmHg", "ΔP = P₁ × P₂, expressed in mmHg²", "ΔP = P₁ ÷ P₂, expressed in mmHg"], "correct_index": 0, "explanations": ["Correct. It is the difference between pressure at the beginning and at the end of the vessel.", "Wrong. The gradient is a difference, not a sum.", "Wrong. A product is not a gradient and the units would be wrong.", "Wrong. A ratio is dimensionless and would not carry mmHg as its unit."], "tag": "b07·Q65", "mid": "b07", "section": "Pressure gradient", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The pressure gradient (ΔP) along a vessel is correctly written as:"}, {"difficulty": "hard", "options": ["Roughly quadruples", "Roughly doubles", "Rises by about 40%", "Rises about eightfold Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 143"], "correct_index": 1, "explanations": ["Wrong. A fourfold rise would be seen with laminar flow, where Q ∝ ΔP.", "Correct. Q ∝ √ΔP, and √4 = 2, which is why turbulence is so inefficient compared with laminar flow.", "Wrong. This is the effect of doubling ΔP (√2 = 1.41), not quadrupling it.", "Wrong. This is not given by any simple pressure-flow relation of either regime."], "tag": "b07·Q66", "mid": "b07", "section": "Turbulent flow law", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In the turbulent regime, flow rises roughly with the square root of the pressure gradient. If ΔP is quadrupled, flow in that regime:"}, {"difficulty": "hard", "options": ["18.6 mmHg·min/L", "0.056 mmHg·min/L", "450 mmHg·min/L", "18 mmHg·min/L"], "correct_index": 3, "explanations": ["Wrong. This divides the arterial pressure alone by the flow, not the pressure gradient.", "Wrong. This is the reciprocal, Q/ΔP, which is conductance and not resistance.", "Wrong. This multiplies ΔP and Q instead of dividing them.", "Correct. R = ΔP/Q = (93 − 3)/5 = 18 mmHg·min/L."], "tag": "b07·Q67", "mid": "b07", "section": "Total peripheral resistance", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Mean arterial pressure is 93 mmHg, right atrial pressure is 3 mmHg and cardiac output is 5 L/min. What is the total peripheral resistance?"}, {"difficulty": "easy", "options": ["C = ΔP/Q, the pressure change per unit flow", "C = ΔP/ΔV, the pressure change per unit volume change", "C = Q × ΔP, the flow multiplied by the pressure change", "C = ΔV/ΔP, the volume change per unit pressure change"], "correct_index": 3, "explanations": ["Wrong. That is the expression for resistance, R = ΔP/Q.", "Wrong. This is the reciprocal of capacitance (elastance), not capacitance itself.", "Wrong. This product has no capacitance meaning; capacitance relates volume to pressure.", "Correct. Compliance or capacitance of a vessel tells how much volume it stores for a given pressure rise."], "tag": "b07·Q68", "mid": "b07", "section": "Fluid capacitance", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In the fluid-electrical analogy table, fluid capacitance is defined as:"}, {"difficulty": "easy", "options": ["A decrease in static pressure or a decrease in the fluid's potential energy", "An increase in static pressure and an increase in the fluid's potential energy", "An increase in the tube length and a decrease in the viscosity of the fluid", "A decrease in the fluid's kinetic energy while its static pressure is unchanged"], "correct_index": 0, "explanations": ["Correct. This is the energy-conservation trade-off between kinetic energy and pressure/potential energy.", "Wrong. Both would rise together only if energy were created, which violates conservation.", "Wrong. Length and viscosity belong to Poiseuille's law and are not part of Bernoulli's statement.", "Wrong. Faster flow means more kinetic energy, not less. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 154"], "tag": "b07·Q69", "mid": "b07", "section": "Bernoulli principle", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Bernoulli's principle states that an increase in the speed of a fluid occurs simultaneously with:"}, {"difficulty": "medium", "options": ["Flow rises in direct proportion to the radius at constant pressure", "Flow rises with the square of the radius at constant pressure", "Flow rises with the cube of the radius at constant pressure", "Flow rises with the fourth power of the radius at constant pressure"], "correct_index": 3, "explanations": ["Wrong. Direct proportion would give 1, 2 and 4 mL/min.", "Wrong. A square law would give 1, 4 and 16 mL/min.", "Wrong. A cube law would give 1, 8 and 64 mL/min.", "Correct. Doubling the diameter multiplies the flow by 2⁴ = 16, and the next doubling gives 256."], "tag": "b07·Q70", "mid": "b07", "section": "Radius and flow", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In the lecture example at the same pressure of 100 mmHg, tubes of diameter 1, 2 and 4 carry 1, 16 and 256 mL/min. What does this show?"}, {"difficulty": "devil", "options": ["6 times", "16 times", "5.3 times", "2 times"], "correct_index": 0, "explanations": ["Correct. The narrowed third has 16 times its old resistance, so the total is 2/3 + (1/3 × 16) = 6 times the original.", "Wrong. This applies the 16-fold rise to the whole artery, although only one third is narrowed.", "Wrong. This counts only the narrowed section, (1/3) × 16, and omits the normal two-thirds.", "Wrong. This uses r² for the narrowed part, (1/3 × 4) + 2/3, instead of r⁴."], "tag": "b07·Q71", "mid": "b07", "section": "Focal stenosis resistance", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The middle third of a uniform artery is narrowed to half its radius, with length, viscosity and the rest of the artery unchanged. By what factor does the total resistance of the artery rise?"}, {"difficulty": "easy", "options": ["Stroke volume ÷ heart rate", "Stroke volume + heart rate", "Mean arterial pressure × heart rate", "Stroke volume × heart rate"], "correct_index": 3, "explanations": ["Wrong. Dividing would give a quantity in mL per beat squared, not a flow.", "Wrong. Adding quantities with different units is meaningless.", "Wrong. Pressure times rate is not a flow; cardiac output relates to pressure through resistance instead.", "Correct. Each beat ejects a stroke volume and the product with beats per minute gives L/min."], "tag": "b07·Q72", "mid": "b07", "section": "Cardiac output", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In the lecture, blood flow in the whole circulation is equated to the cardiac output. Cardiac output equals:"}, {"difficulty": "hard", "options": ["About 1250 times", "About 125 000 times", "About 12 500 times", "About 500 times"], "correct_index": 2, "explanations": ["Wrong. This is ten times too small, from mis-converting 1.25 cm to µm (it is 12 500 µm).", "Wrong. This is ten times too large, from a power-of-ten error in the radius conversion.", "Correct. (100 × 12 500 µm) / (25 × 4 µm) = 1 250 000 / 100 = 12 500, which explains why capillaries survive with a wall of endothelium only.", "Wrong. This compares only the pressure and radius ratios loosely and omits the full unit conversion."], "tag": "b07·Q73", "mid": "b07", "section": "Laplace comparison", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "An aorta (radius 1.25 cm, pressure 100 mmHg) and a capillary (radius 4 µm, pressure 25 mmHg) are compared using T = P × R. How many times greater is the aortic wall tension?"}, {"difficulty": "easy", "options": ["Smooth, regular patterns of particles moving in parallel layers", "Chaotic swirling motion with eddy currents in every direction", "Flow that reverses direction with each heartbeat in all vessels", "Flow that occurs only when the vessel diameter is exactly 1 mm Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 144"], "correct_index": 0, "explanations": ["Correct. Laminar flow has concentric layers sliding smoothly, and it helps reduce energy losses.", "Wrong. That describes turbulent flow.", "Wrong. Flow reversal is not what defines laminar flow.", "Wrong. Laminar flow depends on Reynolds number, not on one specific diameter."], "tag": "b07·Q74", "mid": "b07", "section": "Laminar flow", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "How does the lecture characterise laminar blood flow?"}, {"difficulty": "devil", "options": ["About 200 mmHg", "About 100 mmHg", "About 130 mmHg", "About 0 mmHg"], "correct_index": 0, "explanations": ["Correct. ρgh = 1060 × 9.81 × 1.3 ≈ 13 520 Pa ≈ 101 mmHg, which adds to 100 mmHg at heart level.", "Wrong. This ignores the extra potential-energy term that Bernoulli's principle includes.", "Wrong. This adds 1.3 m directly as mmHg, which mixes the units.", "Wrong. Pressure rises below the heart in a standing person; it does not collapse to zero."], "tag": "b07·Q75", "mid": "b07", "section": "Hydrostatic pressure", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A standing person has a mean arterial pressure of 100 mmHg at heart level. Using ρ = 1060 kg/m³ and g = 9.81 m/s², what is the pressure in an artery of the foot 1.3 m below the heart, ignoring flow?"}, {"difficulty": "easy", "options": ["Half as great, because flow is inversely proportional to ΔP", "Twice as great, because flow is directly proportional to ΔP", "Four times as great, because flow is proportional to ΔP squared", "The same, because flow depends only on the absolute pressure at the start"], "correct_index": 1, "explanations": ["Wrong. Flow rises with the gradient; it is inversely proportional to resistance, not to ΔP.", "Correct. Q ∝ ΔP, so doubling the gradient from 40 to 80 mmHg doubles the flow.", "Wrong. The relation is linear for laminar flow, not quadratic.", "Wrong. What matters is the difference between inlet and outlet pressures, not the inlet value alone."], "tag": "b07·Q76", "mid": "b07", "section": "Flow and pressure gradient", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "On the slide, vessel 1 has ΔP = 40 mmHg and vessel 2 has ΔP = 80 mmHg (same resistance). What is the flow in vessel 2 compared with vessel 1?"}, {"difficulty": "easy", "options": ["Q = time ÷ volume, commonly in min/L", "Q = pressure × time, commonly in mmHg·s", "Q = volume ÷ time, commonly in L/min", "Q = distance ÷ time, commonly in cm/s"], "correct_index": 2, "explanations": ["Wrong. This inverts the definition; flow is volume divided by time.", "Wrong. Pressure multiplied by time is not a flow quantity.", "Correct. Flow is volume per unit time; at the level of the whole body it is the cardiac output in L/min.", "Wrong. That is velocity (v = d/t), which differs from flow by the cross-sectional area. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 155"], "tag": "b07·Q77", "mid": "b07", "section": "Blood flow", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Blood flow (Q) is defined as the quantity of blood passing a given point in the circulation per unit time. Which expression and unit is correct?"}, {"difficulty": "hard", "options": ["About 46% higher than before", "About 33% lower than before", "Almost unchanged, about 2% lower", "About 10% higher than before"], "correct_index": 2, "explanations": ["Wrong. This counts only the radius effect (1.1⁴ = 1.46) and overlooks the viscosity rise.", "Wrong. This counts only the viscosity effect (1/1.5 = 0.67) and forgets the dilation.", "Correct. Flow ∝ r⁴/η = (1.1)⁴ / 1.5 = 1.464 / 1.5 ≈ 0.976.", "Wrong. This treats flow as linear in radius and ignores the viscosity increase."], "tag": "b07·Q78", "mid": "b07", "section": "Viscosity and radius", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In polycythaemia, viscosity rises by 50%. If compensatory dilation widens the radius by 10% at the same ΔP and length, what happens to flow?"}, {"difficulty": "easy", "options": ["20", "5", "0.2", "100"], "correct_index": 3, "explanations": ["Wrong. This is only the value of the first segment, ignoring the others.", "Wrong. This would be the average-type value and not the series sum.", "Wrong. This is a reciprocal-type value; series resistances do not combine by reciprocals.", "Correct. In series the resistances add: 20 + 50 + 20 + 6 + 4 = 100."], "tag": "b07·Q79", "mid": "b07", "section": "Series resistance", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Using the series-resistance slide, with R = 20, 50, 20, 6 and 4 for the segments in sequence, what is the total resistance?"}, {"difficulty": "hard", "options": ["It rises sixteenfold", "It rises eightfold", "It rises fourfold", "It remains unchanged"], "correct_index": 1, "explanations": ["Wrong. This counts the radius effect only and ignores that longer tubes offer more resistance.", "Correct. The r⁴ term gives ×16 and the doubled length gives ÷2, so the net change is 16/2 = 8.", "Wrong. This treats the radius effect as r² and length as ÷1, which is not Poiseuille's law.", "Wrong. The radius and length effects do not cancel; r⁴ outweighs the single power of length."], "tag": "b07·Q80", "mid": "b07", "section": "Poiseuille combined", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A vessel has both its radius and its length doubled, with the same viscosity and the same pressure gradient. What happens to the flow?"}, {"difficulty": "devil", "options": ["active channels are subdivided into transmitter-gated and voltage-gated", "passive leakage channels open or close in response to various signals", "each channel type is selective for the ions it lets pass", "open gated channels let ions diffuse along their electrochemical gradient"], "correct_index": 1, "explanations": ["This is true as stated in the lecture.", "This is false: passive leakage channels are always open; it is the active (gated) channels that open and close in response to signals.", "This is true; for example sodium and potassium channels.", "This is true and creates electrical currents and voltage changes across the membrane."], "tag": "b08·Q1", "mid": "b08", "section": "Ion channels", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about membrane ion channels is FALSE?"}, {"difficulty": "easy", "options": ["electrical currents and potentials generated by or occurring within living cells, tissues and organisms", "electrical power supplied to hospital equipment from the national grid", "static charge that accumulates on the skin of a patient in dry weather", "electromagnetic radiation emitted by laboratory analysers and monitors"], "correct_index": 0, "explanations": ["This is the lecture definition: currents and potentials arising within living cells, tissues and organisms.", "Mains power is ordinary electricity used to run devices, not a biological phenomenon.", "Static charge on skin is a surface effect, not a signal generated by cell activity.", "Radiation from instruments is a physical emission and has nothing to do with cell-generated potentials."], "tag": "b08·Q2", "mid": "b08", "section": "Definition", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Bioelectricity is best defined as:"}, {"difficulty": "hard", "options": ["-13 mV, from -89 mV to -102 mV, moving cells away from threshold", "+13 mV, from -89 mV to -76 mV, moving cells away from threshold", "+26 mV, from -89 mV to -63 mV, bringing cells closer to threshold", "+13 mV, from -89 mV to -76 mV, bringing cells closer to threshold"], "correct_index": 3, "explanations": ["Raising extracellular K+ makes E(K) less negative, never more; that direction would apply to hypokalemia.", "The numbers are right but the interpretation is wrong: a less negative resting potential is closer to threshold, not farther.", "-63 mV would need a ratio of about 0.094 (13 mM), not 8 mM; the shift is 13 mV, not 26 mV.", "E(K) at 8 mM = 26.7 × ln(8/140) = -76.4 mV; this is about 13 mV less negative, so the resting potential moves toward threshold."], "tag": "b08·Q3", "mid": "b08", "section": "Hyperkalemia", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In a patient whose extracellular K+ rises from 5 mM to 8 mM ([K+]i = 140 mM, RT/F = 26.7 mV), E(K) changes by about:"}, {"difficulty": "medium", "options": ["a stronger stimulus makes the action potential taller", "a weaker stimulus makes the action potential slower", "only electrical stimuli can produce an action potential", "a stronger stimulus does not make a bigger action potential"], "correct_index": 3, "explanations": ["The amplitude does not increase with stimulus strength.", "The shape is the same for weak and strong stimuli that reach threshold.", "Any adequate stimulus type can bring the membrane to threshold.", "The action potential is constant in size once threshold is reached, whatever the stimulus."], "tag": "b08·Q4", "mid": "b08", "section": "Action potential", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The lecture states that the nerve impulse is always the same regardless of the type or source of stimulus. This means that:"}, {"difficulty": "devil", "options": ["a missing P wave is a finding of the EEG", "delayed ventricular repolarization is shown by the P wave", "brain wave patterns are assessed using the EMG", "slowed conduction with scattered signals in neuropathy is seen on EMG"], "correct_index": 3, "explanations": ["P waves belong to the ECG, which records the heart, not the EEG.", "Ventricular repolarization is the T wave; the P wave is atrial depolarization.", "The EEG records brain activity; the EMG records muscle and its motor neurons.", "The lecture says peripheral neuropathy scatters and desynchronizes EMG signals because regenerating fibers conduct slowly."], "tag": "b08·Q5", "mid": "b08", "section": "Lab application", "qt": "single best", s not what drives the upstroke."], "tag": "b08·Q13", "mid": "b08", "section": "Depolarizing phase", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "During the depolarizing phase of an action potential:"}, {"difficulty": "devil", "options": ["+264 mV", "+66 mV", "-132 mV", "+132 mV"], "correct_index": 3, "explanations": ["+264 mV results from ignoring the factor of 1/n (valence 2).", "+66 mV results from halving a second time, an extra n.", "The sign is positive because Ca2+ is far more concentrated outside than inside.", "E(Ca) = (26.7/2) × ln(2/0.0001) = 13.35 × 9.90 ≈ +132 mV."], "tag": "b08·Q14", "mid": "b08", "section": "Nernst equation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Calcium ([Ca2+]o = 2 mM, [Ca2+]i = 0.0001 mM, n = +2) at 37 °C (RT/F = 26.7 mV) has an equilibrium potential of about:"}, {"difficulty": "devil", "options": ["an EEG resolves the activity of single neuron groups with very high resolution", "an EMG records neuron activity of the brain through scalp sensors", "an EEG is a type of ENG that records general brain activity without distinguishing groups of neurons", "an ENG is recorded only from the heart through the skin Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 158"], "correct_index": 2, "explanations": ["The lecture states EEG lacks the resolution to separate groups of neurons.", "EMG visualizes muscular activity, not brain neurons.", "The lecture describes EEG as a particular ENG with several head electrodes and no high resolution of separate neuron groups.", "ENG records neural tissue activity; the heart is recorded by ECG. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 169"], "tag": "b08·Q15", "mid": "b08", "section": "EEG/ENG", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement is TRUE about EEG and related recordings?"}, {"difficulty": "medium", "options": ["regenerating fibers conduct faster than healthy axons", "all motor units fire exactly together", "muscle fibers stop having any membrane potential", "regenerating fibers conduct slowly and affected neurons are harder to excite"], "correct_index": 3, "explanations": ["The lecture says regenerating fibers conduct more slowly.", "Synchronous firing would produce a tidy signal, not scatter.", "Muscle fibers keep their membrane potential; the problem is timing.", "Slow conduction and altered excitability delay and spread arrival of impulses at the muscle."], "tag": "b08·Q16", "mid": "b08", "section": "Neuropathy", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In peripheral neuropathy the EMG signals become scattered and desynchronized because:"}, {"difficulty": "medium", "options": ["an electrical gradient and a chemical (concentration) gradient combined", "a thermal gradient and a pressure gradient combined", "a chemical gradient only, since charge does not matter", "an electrical gradient only, since concentration does not matter"], "correct_index": 0, "explanations": ["Ions move toward opposite charge (electrical) and from high to low concentration (chemical); the net drive is both together.", "Temperature and pressure gradients are not components of the electrochemical gradient in the lecture.", "Charge matters because ions are charged particles attracted to areas of opposite charge.", "Concentration matters because ions also diffuse passively from high to low concentration."], "tag": "b08·Q17", "mid": "b08", "section": "Electrochemical gradient", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The electrochemical gradient that drives ion movement through an open channel is made of:"}, {"difficulty": "devil", "options": ["60 m/s", "6 m/s", "600 m/s", "24 m/s"], "correct_index": 0, "explanations": ["v = 0.18 m ÷ 0.003 s = 60 m/s (equal to 6 cm/ms).", "6 m/s is a unit slip: 6 cm/ms equals 60 m/s.", "600 m/s odium-potassium pump helps maintain the ionic difference by:"}, {"difficulty": "medium", "options": ["-85 to -90 mV", "-55 to -50 mV", "+15 to +20 mV", "-15 to -20 mV"], "correct_index": 1, "explanations": ["These values are more negative than rest and would be hyperpolarization.", "-70 + 15 = -55 mV and -70 + 20 = -50 mV.", "The +15 to +20 mV is a rise above rest, not an absolute potential.", "The offset is added to -70 mV; it is not applied to 0 mV."], "tag": "b08·Q21", "mid": "b08", "section": "Threshold", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "If the resting potential is -70 mV and threshold lies +15 to +20 mV above it, the neuron must depolarize to about:"}, {"difficulty": "medium", "options": ["the resting potential lies close to the Na+ equilibrium potential", "the resting potential lies close to the K+ equilibrium potential", "the resting potential is exactly 0 mV", "the resting potential cannot be negative"], "correct_index": 1, "explanations": ["Na+ permeability is small at rest, so Na+ has little pull on the potential.", "The ion with the higher permeability dominates, so the resting potential sits near E(K), which is negative.", "K+ and Na+ gradients keep the inside negative, so the potential is not zero.", "Net K+ efflux through leak channels leaves the inside negative."], "tag": "b08·Q22", "mid": "b08", "section": "Resting permeability", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "At rest the membrane is about 75 times more permeable to K+ than to Na+. What is the main consequence?"}, {"difficulty": "easy", "options": ["a decrease in membrane potential, making the inside less negative", "a reversal of the potential to positive values", "the opening of all sodium channels", "an increase in membrane potential, making the inside more negative Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 159"], "correct_index": 3, "explanations": ["This is depolarization o reach threshold?"}, {"difficulty": "easy", "options": ["bioelectric current is a flow of electrons, whereas standard electricity is a flow of ions", "bioelectric current is a flow of ions, whereas standard electricity is a movement of electrons", "bioelectric current is carried by protons only, whereas standard electricity uses neutrons", "bioelectric current flows one way only, whereas standard electricity always alternates"], "correct_index": 1, "explanations": ["This reverses the facts: metals conduct with electrons and tissue conducts with ions.", "In living tissue the charge carriers are ions such as Na+ and K+; in wires they are free electrons.", "Neutrons carry no charge and protons are not the carriers across cell membranes; ions are.", "Direction of flow is not the distinguishing feature; the type of charge carrier is."], "tag": "b08·Q26", "mid": "b08", "section": "Ions vs electrons", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "What is the key difference between bioelectric current and the current used to produce light, heat or power?"}, {"difficulty": "hard", "options": ["-89 mV", "-70 mV", "-113 mV", "+113 mV"], "correct_index": 2, "explanations": ["-89 mV is the value at a normal 5 mM extracellular K+.", "-70 mV corresponds to a raised extracellular K+ near 10 mM, the opposite direction.", "E(K) = 26.7 × ln(2/140) = 26.7 × (-4.25) ≈ -113 mV, more negative than the normal value.", "The sign cannot be positive because K+ is more concentrated inside, making the ratio less than 1."], "tag": "b08·Q27", "mid": "b08", "section": "Nernst equation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A patient with a low plasma K+ of 2 mM has [K+]i = 140 mM. Using RT/F = 26.7 mV at 37 °C, E(K) is closest to:"}, {"difficulty": "hard", "options": ["halves, from 4 ms to 2 ms", "doubles, from 4 ms to 8 ms", "stays at 4 ms because distance is unchanged", "rises from 4 ms to 16 ms"], "correct_index": 1, "explanations": ["Latency and velocity are inversely related, so slower conduction lengthens, not shortens, the time.", "Time = distance ÷ velocity: 0.24/60 = 4 ms and 0.24/30 = 8 ms, so slowing velocity by half doubles the conduction time.", "Time depends on velocity as well as distance, so slower fibers need longer.", "16 ms would need a fourfold velocity drop to 15 m/s."], "tag": "b08·Q28", "mid": "b08", "section": "ENG neuropathy", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In a segment 0.24 m long, healthy fibers conduct at 60 m/s. If regenerating fibers conduct at 30 m/s over the same segment and distance, the latency difference between the two points:"}, {"difficulty": "medium", "options": ["they carry the Na+ out of the cell during the pump cycle", "they make the membrane freely permeable to chloride", "they balance the positive charge of intracellular cations, mainly K+", "they open voltage-gated sodium channels at threshold"], "correct_index": 2, "explanations": ["Pumping is done by the Na+/K+ pump, not by A-.", "Chloride permeability is a property of passive channels, not of the cytoplasmic proteins.", "A- are trapped inside because the membrane is impermeable to them, and they offset intracellular K+.", "Voltage-gated channels respond to membrane potential, not to proteins in the cytosol."], "tag": "b08·Q29", "mid": "b08", "section": "Ion balance", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Why are negatively charged proteins (A-) important in the cell cytosol?"}, {"difficulty": "easy", "options": ["resting state, repolarizing phase, depolarizing phase, undershoot", "resting state, depolarizing phase, repolarizing phase, undershoot", "depolarizing phase, resting state, undershoot, repolarizing phase", "undershoot, resting state, depolarizing phase, repolarizing phase"], "correct_index": 1, "explanations": ["Repolarization cannot precede depolarization.", "Th
