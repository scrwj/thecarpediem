, standard concentrations, RT/F = 26.7 mV), the potential changes from about -80 mV to about:"}, {"difficulty": "devil", "options": ["4 ms, shorter than the SMU potential", "12 ms, the transit time of the slowest unit", "16 ms, equal to twice the slowest unit's time", "8 ms, comparable to the 3-15 ms duration of an SMU potential"], "correct_index": 3, "explanations": ["4 ms is the fastest unit's time alone, not the difference.", "12 ms is the slowest unit's time alone, not the difference.", "16 ms is the sum of the two times, not the difference.", "Fast: 0.24/60 = 4 ms; slow: 0.24/20 = 12 ms; difference = 8 ms, enough to scatter and desynchronize the summed signal."], "tag": "b08·Q35", "mid": "b08", "section": "Neuropathy", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Motor units conduct at speeds ranging from 20 to 60 m/s over a 0.24 m segment. The spread in arrival time between fastest and slowest is:"}, {"difficulty": "hard", "options": ["60 m/s", "29 m/s", "30 m/s", "120 m/s"], "correct_index": 0, "explanations": ["v = D/(L1 - L2) = 0.240 m ÷ 0.004 s = 60 m/s.", "29 m/s results from dividing by the longer latency alone (0.24/0.0082), ignoring the subtraction step.", "30 m/s results from dividing by an 8 ms difference, which is a subtraction slip.", "120 m/s would need a latency difference of only 2 ms."], "tag": "b08·Q36", "mid": "b08", "section": "ENG velocity", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A motor nerve is stimulated at two sites 240 mm apart. The longer latency is 8.2 ms and the shorter latency is 4.2 ms. The conduction velocity is:"}, {"difficulty": "devil", "options": ["the membrane is hyperpolarized because the value is now positive", "the membrane is repolarizing because the potential has crossed 0 mV", "the inside is less negative than rest, so depolarization has occurred even though the sign is positive", "depolarization has not occurred because positive values are not allowed"], "correct_index": 2, "explanations": ["Hyperpolarization means more negative than rest, the opposite of this change.", "Repolarization is the return toward rest, which comes after the peak.", "Depolarization is a reduction in membrane potential and includes events where the inside becomes positive.", "The lecture explicitly includes events where the potential becomes positive."], "tag": "b08·Q37", "mid": "b08", "section": "Depolarization", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A neuron at -70 mV is made to reach +10 mV during the upstroke. Which statement is TRUE?"}, {"difficulty": "devil", "options": ["n counts the channels open, so more channels give larger E", "n carries the sign and size of the charge, so Cl- uses n = -1 and Ca2+ uses n = +2", "n is always +1 because the equation is only for K+", "n is the number of action potentials per second"], "correct_index": 1, "explanations": ["Channel count does not appear in the Nernst equation; permeability enters only in Goldman.", "The valence scales and signs the term; for anions n is negative, for divalent cations the value is halved.", "In the lecture n is the valence of the ion; for K+ it is +1, but the equation is general.", "Firing rate is unrelated to an equilibrium potential. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 172"], "tag": "b08·Q38", "mid": "b08", "section": "Nernst equation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement correctly describes the effect of ion valence n in E = (RT/nF) ln([ion]o/[ion]i)?"}, {"difficulty": "hard", "options": ["no depolarizing phase is evoked, yet the resting potential remains", "the resting potential collapses to 0 mV at once", "the repolarizing phase lengthens and the peak grows", "the resting potential rises well above threshold Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 161"], "correct_index": 0, "explanations": ["The upstroke needs Na+ entry through voltage-gated channels; the resting potential depends largely on leak channels and the pump.", "Resting potential depends on K+ leak channels and the pump, which are not blocked.", "Without Na+ entry there is no upstroke and no peak to enlarge.", "Resting Na+ permeability is already very low, so blocking gated channels does not push the cell past threshold."], "tag": "b08·Q39", "mid": "b08", "section": "Voltage-gated channels", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Tetrodotoxin selectively blocks voltage-gated Na+ channels. If applied to a neuron, the expected result is:"}, {"difficulty": "medium", "options": ["sodium permeability stays high after repolarization", "the Na+/K+ pump has been inhibited", "potassium permeability continues to be high after repolarization", "all channels are closed and the membrane is leaky"], "correct_index": 2, "explanations": ["High sodium permeability would depolarize the membrane.", "Pump inhibition would not hyperpolarize the cell.", "Continued K+ efflux makes the inside briefly more negative than rest.", "Closed channels cannot produce a movement of potential."], "tag": "b08·Q40", "mid": "b08", "section": "Undershoot", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The undershoot (after-hyperpolarization) occurs because:"}, {"difficulty": "devil", "options": ["its fibers are packed together in a distinct bundle apart from other units", "it fires only when stimulated through the sensory nerve", "the volume conductor consists only of the fibers of that same unit", "its fibers form a distributed bioelectric source inside a volume conductor of other muscle fibers"], "correct_index": 3, "explanations": ["The fibers are interspersed with those of other motor units in cross-section.", "A motor unit is activated through its motor neuron, for example by volitional effort.", "The volume conductor includes all other active and inactive muscle fibers.", "The lecture notes that SMU fibers are interspersed with fibers of other units and sit in a volume conductor made of all other active and inactive fibers."], "tag": "b08·Q41", "mid": "b08", "section": "Motor unit", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about a single motor unit (SMU) is TRUE?"}, {"difficulty": "medium", "options": ["-89 mV", "-95 mV", "-70 mV", "-100 mV"], "correct_index": 2, "explanations": ["That is the value at 5 mM extracellular K+, before the rise.", "Lowering extracellular K+ (for example to 4 mM) gives about -95 mV, not raising it.", "E(K) = 26.7 × ln(10/140) = 26.7 × (-2.64) ≈ -70.5 mV, so it becomes less negative.", "Raising [K+]o makes E(K) less negative, never more."], "tag": "b08·Q42", "mid": "b08", "section": "Nernst equation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "If extracellular K+ rises from 5 mM to 10 mM with [K+]i = 140 mM, E(K) at 37 °C becomes about:"}, {"difficulty": "easy", "options": ["muscles, while the EMG records neurons", "the heart, while the EMG records the brain", "neurons, while the EMG records muscular activity", "the retina, while the EMG records the cochlea"], "correct_index": 2, "explanations": ["This swaps the two tests.", "The heart is recorded by ECG and the brain by EEG.", "The ENG visualizes neuron activity in the central or peripheral nervous system; the EMG visualizes muscle activity.", "Neither ENG nor EMG records retina or cochlea activity."], "tag": "b08·Q43", "mid": "b08", "section": "ENG", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "An electroneurogram (ENG) differs from an EMG in that the ENG records electrical activity of:"}, {"difficulty": "devil", "options": ["+14 mV, from -89 mV to -75 mV, moving cells closer to threshold", "-27 mV, from -89 mV to -116 mV, moving cells further from threshold", "-14 mV, from -89 mV to -103 mV, moving cells further from threshold", "-14 mV, from -89 mV to -103 mV, moving cells closer to threshold"], "correct_index": 2, "explanations": ["Lowering extracellular K+ makes E(K) more negative; the sign is wrong.", "A 27 mV shift is double the real value; the log ratio only changes by ln(5/3) = 0.51.", "E(K) at 3 mM = 26.7 × ln(3/140) = -102.6 mV, which is 13.6 mV more negative and hyperpolarizes cells away from threshold.", "The magnitude is right but a more negative resting potential is farther from threshold."], "tag": "b08·Q44", "mid": "b08", "section": "Hypokalemia", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "When extracellular K+ falls from 5 mM to 3 mM ([K+]i = 140 mM, RT/F = 26.7 mV), E(K) shifts by about:"}, {"difficulty": "devil", "options": ["about 75 : 1, exactly as stated in the lecture", "about 28 : 1, so the lecture's 75 : 1 gives a more negative value", "about 8 : 1, so the lecture's 75 : 1 gives a less negative value", "about 280 : 1, so the lecture's 75 : 1 gives a less negative value"], "correct_index": 1, "explanations": ["75 : 1 gives about -80 mV, not -70 mV; only about 28 : 1 gives -70 mV when chloride is ignored.", "Solve (5 + 145r)/(140 + 12r) = e^(-70/26.7) = 0.0727 where r = PNa/PK: r ≈ 0.036, so PK/PNa ≈ 28; at 75 : 1 the value is -80 mV.", "With only 8 : 1 the potential would be around -48 mV, less negative than -70 mV.", "A 280 : 1 ratio would give about -87 mV, more negative than -70 mV. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 173"], "tag": "b08·Q45", "mid": "b08", "section": "Goldman equation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "What PK : PNa ratio is needed to give exactly -70 mV with [K+]o 5/[K+]i 140, [Na+]o 145/[Na+]i 12 mM, chloride ignored and RT/F = 26.7 mV?"}, {"difficulty": "easy", "options": ["depolarization of the ventricles", "repolarization of the ventricles", "depolarization of the atria", "repolarization of the atria"], "correct_index": 2, "explanations": ["Ventricular depolarization is shown by the QRS complex, not the P wave.", "Ventricular repolarization is shown by the T wave.", "The P wave is the electrical signal of atrial depolarization.", "Atrial repolarization is not listed as one of the three main ECG components in the lecture; the P wave is depolarization."], "tag": "b08·Q46", "mid": "b08", "section": "ECG", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "On an ECG trace, the P wave represents:"}, {"difficulty": "devil", "options": ["triphasic waveform with duration of 3-15 ms", "amplitude of 20-2000 µV", "biphasic waveform, 3-15 s long, amplitude 20-2000 mV", "discharge frequency of 6-30 per second Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 162"], "correct_index": 2, "explanations": ["This is true as stated in the lecture.", "This is true as stated in the lecture.", "The lecture gives a triphasic waveform of 3-15 ms and 20-2000 µV; the units and phases here are wrong.", "This is true as stated in the lecture."], "tag": "b08·Q47", "mid": "b08", "section": "EMG properties", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which description of the evoked single-motor-unit potential is FALSE?"}, {"difficulty": "hard", "options": ["5 %", "10 %", "50 %", "20 %"], "correct_index": 3, "explanations": ["5 % would need a 2.5 ms waveform or a 200 ms interval.", "10 % would apply to a 5 ms waveform or a 100 ms interval.", "50 % would require the waveform to last 25 ms, beyond the 3-15 ms range.", "Interval = 1/20 s = 50 ms; 10 ms/50 ms = 0.20, or 20 %."], "tag": "b08·Q48", "mid": "b08", "section": "EMG", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A single motor unit discharges at 20 per second and each triphasic potential lasts 10 ms. What fraction of time is occupied by the potential?"}, {"difficulty": "medium", "options": ["+89 mV", "-89 mV", "-70 mV", "-35 mV"], "correct_index": 1, "explanations": ["The sign is wrong: K+ is more concentrated inside, so the ratio is below 1 and the log is negative.", "E(K) = 26.7 × ln(5/140) = 26.7 × (-3.33) ≈ -89 mV.", "-70 mV is the typical resting potential, which is less negative than E(K) because of Na+ leak.", "-35 mV would need a much smaller concentration ratio."], "tag": "b08·Q49", "mid": "b08", "section": "Nernst equation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Using RT/F ≈ 26.7 mV at 37 °C, [K+]o = 5 mM and [K+]i = 140 mM, E(K) is closest to:"}, {"difficulty": "hard", "options": ["it converts milliseconds into seconds", "it removes the stimulus voltage from the measurement", "it cancels the shared delay from the distal nerve and neuromuscular transmission", "it averages the velocities of sensory and motor fibers"], "correct_index": 2, "explanations": ["Unit conversion is a separate step and is not achieved by subtraction.", "Stimulus voltage is not part of the latency calculation.", "Both latencies contain the same terminal conduction and transmission time; only the extra time over the known distance remains.", "Only a motor nerve is stimulated at two points; sensory and motor velocities are not averaged."], "tag": "b08·Q50", "mid": "b08", "section": "ENG latency", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Why does the ENG subtract the shorter latency from the longer one before dividing into the distance?"}, {"difficulty": "hard", "options": ["becomes more negative as K+ builds inside", "runs down as Na+ and K+ gradients dissipate", "stays unchanged forever, since leak channels maintain gradients", "moves exactly to +30 mV as in an action potential"], "correct_index": 1, "explanations": ["Without the pump K+ is lost, not built up.", "The pump restores the gradients that leak currents erode; without it the gradients fall and the potential decays toward zero.", "Leak channels move ions down gradients and cannot rebuild them; that is the pump's work.", "+30 mV is the transient peak of the action potential, not a state reached by pump failure."], "tag": "b08·Q51", "mid": "b08", "section": "Na+/K+ pump", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The pump is inhibited by a drug. Immediately, the resting potential changes little, but over a long period it:"}, {"difficulty": "hard", "options": ["E(Na), because sodium permeability remains high", "E(Cl), because chloride channels open", "0 mV, because all permeabilities fall", "E(K), because potassium permeability remains high"], "correct_index": 3, "explanations": ["Sodium permeability has fallen at this stage, so E(Na) no longer dominates.", "The lecture attributes the undershoot to potassium, not chloride.", "A zero-permeability state would leave the potential unspecified; the undershoot is hyperpolarized.", "Continuing K+ efflux pushes the potential toward E(K) near -89 mV, below the -70 mV rest."], "tag": "b08·Q52", "mid": "b08", "section": "Undershoot", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "During the undershoot of an action potential, the membrane potential is closest to:"}, {"difficulty": "medium", "options": ["excites only the small slow pain fibers of the nerve", "excites large fast fibers while sparing pain fibers and nearby muscle", "drives long muscle contractions that improve the recorded signal", "keeps the limb moving so that artifacts are reduced"], "correct_index": 1, "explanations": ["Pain fibers are what the stimulus is designed not to elicit.", "A brief intense stimulus recruits large fast fibers and avoids pain and muscle activity.", "Contractions produce undesired artifacts and are avoided.", "Limb movement produces artifacts. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 174"], "tag": "b08·Q53", "mid": "b08", "section": "ENG stimulus", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The desirable stimulus for sensory nerve field potentials is brief and intense, about 100 V and 100-300 µs, because it:"}, {"difficulty": "hard", "options": ["+64 mV", "-32 mV", "-64 mV", "-96 mV Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 163"], "correct_index": 2, "explanations": ["The anion valence flips the sign; Cl- is higher outside but the potential is negative.", "-32 mV results from wrongly halving as if n were 2.", "E(Cl) = (26.7/(-1)) × ln(110/10) = -26.7 × 2.40 ≈ -64 mV.", "-96 mV results from using a wrong log ratio and has no basis."], "tag": "b08·Q54", "mid": "b08", "section": "Nernst equation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Chloride is an anion (n = -1) with [Cl-]o = 110 mM and [Cl-]i = 10 mM. At 37 °C with RT/F = 26.7 mV, E(Cl) is closest to:"}, {"difficulty": "hard", "options": ["-80 mV", "-89 mV", "-72 mV", "-0.4 mV"], "correct_index": 0, "explanations": ["Ratio = (5 + 145/75)/(140 + 12/75) = 6.933/140.16 = 0.0495; 26.7 × ln(0.0495) ≈ -80 mV.", "-89 mV is E(K) alone; the small Na+ permeability pulls the potential slightly above it.", "-72 mV needs chloride entering the equation with a high permeability, which was excluded here.", "-0.4 mV is what you get if PK and PNa are wrongly set equal; the 75-fold K+ dominance keeps the cell strongly negative."], "tag": "b08·Q55", "mid": "b08", "section": "Goldman equation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A neuron has [K+]o = 5 mM, [K+]i = 140 mM, [Na+]o = 145 mM, [Na+]i = 12 mM, PK : PNa = 75 : 1, and chloride is ignored. Using RT/F = 26.7 mV, the resting potential from the Goldman equation is closest to:"}, {"difficulty": "easy", "options": ["more negative than the resting potential", "exactly equal to the outside at all times", "less negative than the resting potential", "impermeable to all ions"], "correct_index": 2, "explanations": ["That describes hyperpolarization.", "Equality (0 mV) may be passed through, but depolarization is defined as a reduction from rest, not a fixed value.", "Depolarization is a reduction in membrane potential, and it includes events where the potential becomes positive.", "Depolarization usually involves increased permeability to ions, not impermeability."], "tag": "b08·Q56", "mid": "b08", "section": "Depolarization", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Depolarization of a neuron means that the inside of the membrane becomes:"}, {"difficulty": "devil", "options": ["11 mM", "80 mM", "110 mM", "8 mM"], "correct_index": 3, "explanations": ["11 mM would be a ratio of 10, which gives E(Cl) = -61 mV.", "80 mM would be a ratio of about 1.4, giving E(Cl) only about -9 mV.", "110 mM would make the ratio 1, giving E(Cl) = 0 mV.", "At equilibrium E(Cl) = -70 mV: ln([Cl]o/[Cl]i) = 70/26.7 = 2.62, so the ratio is 13.8 and [Cl]i = 110/13.8 ≈ 8 mM."], "tag": "b08·Q57", "mid": "b08", "section": "Chloride distribution", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "If Cl- is freely permeable and passively distributed at a resting potential of -70 mV with [Cl-]o = 110 mM, the internal [Cl-] at equilibrium is about:"}, {"difficulty": "medium", "options": ["100 m/s", "50 m/s", "200 m/s", "33 m/s"], "correct_index": 0, "explanations": ["v = D/(L1 - L2) = 0.300 m / 0.003 s = 100 m/s.", "That would come from dividing by 6 ms alone.", "That would need a time difference of 1.5 ms.", "That would come from dividing by 9 ms, the sum of the latencies."], "tag": "b08·Q58", "mid": "b08", "section": "ENG conduction velocity", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A motor nerve is stimulated at two points 300 mm apart. Latencies are 6.0 ms and 3.0 ms. The conduction velocity is:"}, {"difficulty": "hard", "options": ["0.3 V", "3 V", "30 mV", "0.03 V"], "correct_index": 0, "explanations": ["150 × 10^-6 V × 2000 = 0.30 V.", "3 V is a tenfold overestimate.", "30 mV would be 150 µV × 200, a gain ten times too small.", "0.03 V is the same tenfold underestimate in volts."], "tag": "b08·Q59", "mid": "b08", "section": "EMG amplitude", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A single-motor-unit potential of 150 µV is amplified 2000 times. The output amplitude is:"}, {"difficulty": "easy", "options": ["the P wave", "the T wave", "the baseline between beats", "the QRS complex"], "correct_index": 3, "explanations": ["The P wave reflects atrial depolarization.", "The T wave reflects ventricular repolarization, the recovery phase.", "The flat baseline is the period with no net electrical activity being recorded, not a depolarization.", "The QRS complex marks ventricular depolarization. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 175"], "tag": "b08·Q60", "mid": "b08", "section": "ECG", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which ECG component represents depolarization of the ventricles?"}, {"difficulty": "devil", "options": ["0.10 nA, giving a 10 mV depolarization to -60 mV", "0.16 nA, giving a 16 mV depolarization to -54 mV", "0.12 nA, giving a 12 mV depolarization to -58 mV", "0.20 nA, giving a 20 mV depolarization to -50 mV"], "correct_index": 1, "explanations": ["10 mV only reaches -60 mV, short of threshold.", "V = IR: 0.16 × 10^-9 × 10^8 = 16 mV, bringing the cell to -54 mV, above the threshold of -55 mV.", "12 mV reaches -58 mV, which still falls short of threshold.", "0.20 nA also reaches threshold but is not the lowest listed current that does so."], "tag": "b08·Q61", "mid": "b08", "section": "Ohm's law", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A neuron has input resistance 100 MΩ and rests at -70 mV with threshold -55 mV. Which listed current is the lowest that reaches threshold?"}, {"difficulty": "medium", "options": ["transmitter-gated and leak", "voltage-gated and passive", "passive and leak", "transmitter-gated and voltage-gated Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 164"], "correct_index": 3, "explanations": ["Leak channels are passive, not active.", "Passive channels are always open and do not form a gated class.", "Passive and leak channels are the same type, not active ones.", "Active channels are subdivided into transmitter-gated and voltage-gated."], "tag": "b08·Q62", "mid": "b08", "section": "Channel classes", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which pair correctly names the two classes of active (gated) channels?"}, {"difficulty": "easy", "options": ["electrical activity of the heart picked up by chest sensors", "electrical activity of the brain picked up by sensors on the scalp", "electrical activity of skeletal muscle picked up by needles", "blood flow in the brain measured by sound waves"], "correct_index": 1, "explanations": ["Heart rhythm is recorded by the ECG, not the EEG.", "EEG uses small scalp sensors to pick up the electrical signals produced by the brain.", "Muscle activity is recorded by EMG.", "EEG records electrical signals, not blood flow, and does not use sound waves."], "tag": "b08·Q63", "mid": "b08", "section": "EEG", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "An electroencephalogram (EEG) is a recording of:"}, {"difficulty": "medium", "options": ["only a change in the temperature of the fluid around the cell", "only a change in the thickness of the myelin sheath around the axon", "altered permeability to any ion, or altered ion concentrations across the membrane", "nothing, because the potential is fixed at -70 mV"], "correct_index": 2, "explanations": ["Temperature is not listed as the cause in the lecture.", "Myelin thickness is not given as a mechanism of changing membrane potential.", "The lecture lists altered permeability and altered ion concentrations as the two ways to change the potential.", "The potential varies from -40 to -90 mV between neurons and shifts during signalling."], "tag": "b08·Q64", "mid": "b08", "section": "Stimulation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which of these can change the membrane potential of a neuron?"}, {"difficulty": "easy", "options": ["a cell body, an axon and dendrites", "a nucleus, a sarcomere and an axon", "a cell body, a myelin disc and a cilium", "dendrites, a flagellum and a Golgi tail"], "correct_index": 0, "explanations": ["The lecture states that most neurons have a cell body, an axon and dendrites.", "A sarcomere is the contractile unit of muscle, not a neuron structure.", "Neurons do not have discs of myelin as a defined part or cilia as a main structure in this context.", "A flagellum is not a neuron structure, and the Golgi apparatus is an organelle, not a 'tail'."], "tag": "b08·Q65", "mid": "b08", "section": "Neuron structure", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Most neurons have which three main structural parts?"}, {"difficulty": "hard", "options": ["a large outward Cl- leak, since Cl- is concentrated inside", "a small inward Na+ leak pulls the potential slightly toward positive", "K+ has no permeability at rest, so E(K) is irrelevant", "the Na+/K+ pump moves K+ outward and Na+ inward"], "correct_index": 1, "explanations": ["Cl- is more concentrated outside the cell, so there is no large outward leak, and it follows the potential passively.", "The membrane is slightly permeable to Na+ (about 1/75 of K+), and Na+ influx depolarizes the cell a little.", "K+ permeability is the highest at rest (75-fold over Na+), which is why the potential sits near E(K).", "The pump moves Na+ out and K+ in, the opposite of what this option states."], "tag": "b08·Q66", "mid" dentical in neurons and skeletal muscle."], "tag": "b08·Q71", "mid": "b08", "section": "Action potential", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about the action potential is FALSE?"}, {"difficulty": "easy", "options": ["nervous, epithelial and connective tissue", "muscular, adipose and glandular tissue", "epithelial, bone and nervous tissue", "nervous, muscular and glandular tissue"], "correct_index": 3, "explanations": ["Epithelial and connective tissues were not listed as classes of excitable cells.", "Adipose tissue is not excitable; the lecture lists nervous, muscular and glandular.", "Epithelial and bone tissue are not listed excitable classes.", "Excitable cells belong to nervous, muscular and glandular tissue; they show a resting potential and fire action potentials when stimulated."], "tag": "b08·Q72", "mid": "b08", "section": "Excitable cells", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which three tissue classes contain excitable cells according to the lecture?"}, {"difficulty": "hard", "options": ["+67 mV", "+30 mV", "+54 mV", "-54 mV"], "correct_index": 2, "explanations": ["+67 mV is E(Na), reached only if PK were negligible; the K+ permeability still pulls the value down.", "+30 mV is the lecture's measured peak, not the result for this idealised permeability ratio.", "Ratio = (5 + 20 × 145)/(140 + 20 × 12) = 2905/380 = 7.64; 26.7 × ln 7.64 ≈ +54 mV.", "The sign is wrong: with Na+ dominating, the potential must be positive."], "tag": "b08·Q73", "mid": "b08", "section": "Goldman equation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "If PNa rises to 20 times PK at the peak of an action potential (chloride ignored, [K+]o = 5, [K+]i = 140, [Na+]o = 145, [Na+]i = 12 mM, RT/F = 26.7 mV), the Goldman potential is closest to:"}, {"difficulty": "easy", "options": ["high K+ and low Na+ concentration", "high Na+ and en times too large and far beyond the physiological -40 to -90 mV range. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 177"], "tag": "b08·Q76", "mid": "b08", "section": "Resting potential", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The resting membrane potential of a typical neuron, measured inside relative to outside, is about:"}, {"difficulty": "easy", "options": ["the rhythm of the heart and its conduction pathway", "the general electrical activity of the whole brain", "the health of muscles and the motor neurons that control them", "the speed of blood flow through peripheral arteries"], "correct_index": 2, "explanations": ["Cardiac rhythm is evaluated with an ECG.", "General brain activity is recorded by EEG.", "EMG evaluates muscles and the nerve cells (motor neurons) that control them.", "EMG records electrical muscle activity and does not measure blood flow."], "tag": "b08·Q77", "mid": "b08", "section": "EMG", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Electromyography (EMG) is mainly used to assess:"}, {"difficulty": "hard", "options": ["atria are depolarizing normally, but ventricular depolarization is absent", "ventricles depolarize but never repolarize in this trace", "ventricles depolarize normally, but atrial depolarization is not visible", "atrial repolarization is simply too large to see here Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 166"], "correct_index": 2, "explanations": ["Atrial depolarization is what the missing P wave represents, and the QRS complexes show the ventricles are firing.", "The T waves are present, so ventricular repolarization occurs.", "P = atrial depolarization, QRS = ventricular depolarization, T = ventricular repolarization; present QRS and T with no P implies an atrial problem.", "Atrial repolarization is not one of the three main components listed; it cannot explain a missing P wave."], "tag": "b08·Q78", "mid": "b08", "section": "ECG", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "An ECG shows normal QRS complexes and T waves but no identifiable P waves. This pattern means:"}, {"difficulty": "easy", "options": ["V = I ÷ R", "V = R ÷ I", "V = I + R", "V = I × R"], "correct_index": 3, "explanations": ["Dividing current by resistance gives a quantity with units of A/Ω, not volts.", "R ÷ I gives a quantity with units of Ω/A, not volts.", "Current and resistance have different units and cannot be added.", "Voltage equals current times resistance (Ohm's law)."], "tag": "b08·Q79", "mid": "b08", "section": "Ohm's law", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "The lecture relates the voltage change across a membrane to current and resistance by:"}, {"difficulty": "hard", "options": ["-67 mV", "+67 mV", "+89 mV", "+6.7 mV"], "correct_index": 1, "explanations": ["The sign is wrong; the ratio outside/inside is greater than 1, so the logarithm is positive.", "E(Na) = 26.7 × ln(145/12) = 26.7 × 2.49 ≈ +66.5 mV; Na+ is more concentrated outside, so the ratio exceeds 1 and the sign is positive.", "+89 mV mixes up the magnitude of E(K) with the sign of E(Na); it is not the result for this ratio.", "+6.7 mV is a power-of-ten slip; ln(12.1) is about 2.5, not 0.25."], "tag": "b08·Q80", "mid": "b08", "section": "Nernst equation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "With [Na+]o = 145 mM, [Na+]i = 12 mM and RT/F = 26.7 mV (n = +1), the sodium equilibrium potential E(Na) is closest to:"}, {"difficulty": "devil", "options": ["0.15 °C", "1.5 °C", "15 °C", "5.1 °C"], "correct_index": 1, "explanations": ["That is a tenfold slip downward.", "Q = 100 × 3600 = 3.6×10⁵ J; ΔT = Q/(mc) = 3.6×10⁵/242900 ≈ 1.5 °C, enough to trigger corrective effectors.", "That is a tenfold slip upward.", "That arises from using the wrong mass or time."], "tag": "b09·Q1", "mid": "b09", "section": "Heat storage", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A person's heat production exceeds heat loss by 100 W for 1 h (mass 70 kg, c = 3470 J/(kg·K)). With no other change, core temperature rises by about:"}, {"difficulty": "easy", "options": ["Maintain a relatively stable internal environment", "Keep every internal variable fixed at one exact value", "Adapt its external environment to suit the body", "Eliminate all fluctuations in body chemistry at once"], "correct_index": 0, "explanations": ["The lecture defines homeostasis as maintaining a relatively stable internal environment, with variables fluctuating only within narrow limits.", "Variables are not frozen at one value; they vary within narrow limits around a set point.", "Homeostasis regulates the internal, not the external, environment.", "Fluctuations are normal and expected; they are limited, not eliminated."], "tag": "b09·Q2", "mid": "b09", "section": "Definition of homeostasis", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Homeostasis is best defined as the ability of the body to:"}, {"difficulty": "hard", "options": ["12 W", "1200 W", "0.12 W", "120 W"], "correct_index": 3, "explanations": ["That divides by 0.1 instead of the thickness in metres.", "That uses the thickness in centimetres, and is too large by ten times.", "That is far too small; thickness must be in metres, 0.01 m.", "P = kAΔT/d = 0.2 × 1.5 × 4 / 0.01 = 120 W."], "tag": "b09·Q3", "mid": "b09", "section": "Conduction", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Heat flows through a 1.0 cm tissue layer (k = 0.2 W/(m·K), area 1.5 m²) with 4 °C temperature difference. What is the rate of heat conduction?"}, {"difficulty": "medium", "options": ["Conduction through bone", "Radiation from the fan blades", "Metabolism in skeletal muscle", "Convection, and evaporation of sweat"], "correct_index": 3, "explanations": ["Conduction through bone is not what a fan changes.", "The fan does not make radiative heat exchange the main effect.", "A fan does not alter metabolic heat production.", "Moving air removes the warm layer next to the skin (convection) and speeds evaporation of sweat."], "tag": "b09·Q4", "mid": "b09", "section": "Heat transfer", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "A fan cools a student's skin mainly by increasing which heat transfer mechanism?"}, {"difficulty": "devil", "options": ["ADH release stops sweating immediately", "The two loops conflict as one is positive", "ADH removes any need for thermoregulation", "Both are negative loops; sweating still cools"], "correct_index": 3, "explanations": ["ADH does not switch off sweat glands.", "Both are negative feedback loops.", "Heat loss is still required to defend temperature.", "Thermoregulation and osmoregulation operate simultaneously, each opposing its own deviation."], "tag": "b09·Q5", "mid": "b09", "section": "Interacting loops", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "An athlete in the heat loses sweat and becomes dehydrated, so ADH rises. Which statement is TRUE?"}, {"difficulty": "devil", "options": ["The control centre determines the set point", "The variable is the factor being regulated", "The effector monitors the environment and detects stimuli", "The afferent pathway carries input to the control centre"], "correct_index": 2, "explanations": ["True: the control centre sets and compares to the set point.", "True: temperature or glucose are examples of variables.", "Monitoring and detecting stimuli is the function of the receptor, not the effector.", "True: afferent signals travel from receptor to control centre."], "tag": "b09·Q6", "mid": "b09", "section": "FALSE statement", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "Which statement about homeostatic control components is FALSE?"}, {"difficulty": "medium", "options": ["Diminishes, because the stimulus has been reduced", "Increases, because glucose is now normal", "Remains high until glycogen is depleted", "Is replaced by oxytocin release Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 179"], "correct_index": 0, "explanations": ["The output turns down the original stimulus, so the stimulus for insulin release diminishes and homeostasis returns.", "Insulin release is driven by high glucose, which has fallen.", "Insulin does not persist until glycogen runs out; the loop switches off.", "Oxytocin has no role in glucose control. Way of Life MLS · Scrwjdom Quiz Engine · MLS 155 Biophysics 190"], "tag": "b09·Q7", "mid": "b09", "section": "Blood glucose", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In the glucose diagram, once blood glucose falls back to the set point, insulin release:"}, {"difficulty": "medium", "options": ["Gonadotropins stop the follicle from producing oestrogen", "Gonadotropins convert oestrogen into insulin", "Gonadotropins promote further follicular growth and more oestrogen", "Gonadotropins remove the dominant follicle at once"], "correct_index": 2, "explanations": ["Halting oestrogen production would be negative feedback.", "Hormones are not interconverted like this.", "More oestrogen drives more LH and FSH, driving further follicular growth, so the change is amplified.", "The follicle persists and grows in this loop until ovulation."], "tag": "b09·Q8", "mid": "b09", "section": "Ovulation", "qt": "single best", "source": "Scrwjdom_Quiz_Pack_MLS155_All_9_Lectures.pdf", "qc": "In the ovulation example, the dominant follicle releases oestrogen which stimulates LH and FSH release. This is positive feedback because:"}, {"difficulty": "easy", "options": ["Feeding stimulates milk production, which promotes further feeding", "Milk production shuts off as soon as feeding begins", "Milk production is unrelated to function beep(f,d,type,g,delay=0){
 if(!AC||!set.sound)return;
 try{const t=AC.currentTime+delay,o=AC.createOscillator(),v=AC.createGain();

 v.gain.setValueAtTime(0.0001,t);v.gain.linearRampToValueAtTime((g||.12)*set.vol,t+.012);

}

/* ====== EUPHEME voice packs ====== */
const PLAIN={ok:"Correct.",no:"Not quite."};
const stripNote=s=>String(s).replace(/\s*\([^()]*\)\s*$/,"");
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pools=new Map(),lastLine=new Map();
function packDraw(pack,slot,arr){
 const key=pack+":"+slot;let pool=pools.get(key);
 if(!pool||!pool.length){
  pool=shuffle(arr.slice());
  const last=lastLine.get(key);
  if(last&&pool.length>1){pool=pool.filter(l=>l!==last);pool.push(last)}
  pools.set(key,pool)}
 const line=pool.shift();lastLine.set(key,line);return line;
}
const streakSlot=n=>n>=19?"streak19plus":n>=11?"streak11_18":n===10?"streak10":n>=7?"streak7_9":n>=5?"streak5_6":n>=3?"streak3_4":"streak1_2";
const packByNum=n=>PACKS.find(p=>p.num===n);
function ePack(){
 if(set.pack>=1&&set.pack<=PACKS.length)return packByNum(set.pack);
 if(set.pack===999)return packByNum(1+Math.floor(Math.random()*PACKS.length));
 return null}
function eupOk(q,streak){
 const p=ePack();if(!p)return null;
 const sl=p.slots;let slot;
 if(q.easyMiss&&Math.random()<.25)slot="easyMiss";
 else if(q.difficulty==="hard"||q.difficulty==="devil")slot="hardCorrect";
 else slot=streakSlot(streak);
 let line=packDraw(p.num,slot,sl[slot]||[])||PLAIN.ok;line=stripNote(line);
 if(slot==="streak11_18"&&line.includes(", ")){const notes=line.split(/,\s?/);line=notes[(streak-11)%notes.length]}
 return line}
function eupNo(q,attempt,broken,recovering){
 const p=ePack();if(!p)return null;
 const sl=p.slots;let slot;
 if(recovering)slot="recovering";
 else if(broken)slot="streakBroken";
 else slot=attempt===1?"wrong1":attempt===2?"wrong2":attempt===3?"wrong3":"wrong4plus";
 let line=stripNote(packDraw(p.num,slot,sl[slot]||[])||PLAIN.no);
 if(slot==="wrong4plus"&&attempt>3&&/slides again/i.test(line)){
  line="I think you should "()+"really ".repeat(attempt-4)+"read the slides again."}
 return line}
function gradeLine(g){
 const p=ePack();if(!p)return null;
 const gr=p.slots.grades;const v=gr&&gr[g];return v?stripNote(v):null;
}

function newRun(mid,sectionIdx){
 ROOM_LOADED="";
 const m=modOf(mid);
 const k=sectionIdx===undefined?-1:sectionIdx;
 const sec=(m.sections||[])[k];
 const list=[];
 if(!sec){for(let i=m.first;i<m.first+m.count;i++)list.push(i)}
 else{for(let i=m.first+sec.from;i<m.first+sec.from+sec.count;i++)list.push(i)}

    a:list.map(()=>null),cs:0,ws:0,msg:"",end:0,rv:null,done:false,list,flags:{},started:Date.now()};

function resumeRun(mid){

 if(Array.isArray(d.order)&&d.order.length&&d.order.every(i=>Number.isInteger(i)&&i>=m.first&&i<m.first+m.count)){
   d.order.forEach(i=>list.push(i))}
  else if(Number.isInteger(d.q0)&&d.q1>d.q0&&d.q0>=m.first&&d.q1<=m.first+m.count){
   for(let i=d.q0;i<d.q1;i++)list.push(i)}
  else{for(let i=m.first;i<m.first+m.count;i++)list.push(i)}
 const a=Array.isArray(d.a)&&d.a.length===list.length?d.a:list.map(()=>null);
 R={mid,label:d.label||"Full module",mode:d.mode||"explain",secIdx:Number.isInteger(d.sec)?d.sec:-1,
    i:Math.min(d.i||0,list.length-1),far:Math.min(d.far||0,list.length-1),a,cs:d.cs||0,ws:d.ws||0,
    msg:d.msg||"",end:d.end||0,rv:null,done:false,list,started:Date.now(),flags:d.flags||{}};
 screen="quiz";
 if(R.end&&R.end<Date.now()){clearInterval(T);screen="results"}
 else if(R.end){clearInterval(T);T=setInterval(tick,1000)}
 draw(1);return true;
}
function finishRun(){
 R.done=true;delSave(R.mid);
 let s=0;R.a.forEach((a,i)=>{if(a===QALL[R.list[i]].correct_index)s++});
 const n=R.list.length,p=Math.round(s/n*100);
 const entries=LS.g("board",[]);
 entries.push({mid:R.mid,sec:R.label,name:set.name||"Guest",score:s,n,pct:p,mode:R.mode==="explain"?"Explain":"Exam",at:Date.now()});
 while(entries.length>400)entries.shift();
 LS.s("board",entries);
 return {s,p};
}

function judge(q,ok){
 let line=null;
 if(ok){
  const pw=R.ws,n=R.cs+1;
  R.cs=n;R.ws=0;
  if(pw>=RECOVER_MIN){
   line=eupNo(q,n,n<1?1:n,"",true);
   if(set.sound)sfx.streak();
   return line||PLAIN.ok;
  }
  line=eupOk(q,n);
  if(set.sound){sfx.ok();if(n===10||n===19)sfx.streak()}
  return line||PLAIN.ok;
 }
 const attempt=R.ws+1,pc=R.cs,broken=pc>=BREAK_MIN;
 R.ws=attempt;R.cs=0;
 line=eupNo(q,attempt,broken,false);
 if(set.sound)sfx.no();
 return line||PLAIN.no;
}

    start: function (k, def, cb) { key = k; steps = def.steps; i = 0; onEnd = cb || null; try { window.CDCoachActive = true; } catch (e) {} draw(); },

    stop: end
  };
