rting.", "Complexity is not the issue; inconsistency is.", "Comparability allows users to identify similarities and differences over time; frequent policy changes destroy this.", "Inventory can still be counted; the policy switch is the problem."], "tag": "f01·Q2", "mid": "f01", "section": "Comparability", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A company changes its method of valuing inventory every year to match its mood. Which enhancing characteristic is most damaged, and why?"}, {"difficulty": "medium", "options": ["faithfully represents what it purports to represent, as independent observers could agree", "is always identical to the previous year's information", "was published before every other entity's information", "is simple enough to need no explanation"], "correct_index": 0, "explanations": ["Verifiability means different knowledgeable and independent observers could reach consensus that the depiction is faithful.", "Being the same as last year relates to consistency and comparability.", "Being first to publish is unrelated to timeliness in this sense.", "Simplicity relates to understandability, not verifiability."], "tag": "f01·Q3", "mid": "f01", "section": "Verifiability", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Verifiability helps users be confident that information:"}, {"difficulty": "devil", "options": ["GH₵20,000 each", "GH₵26,667 each", "GH₵25,000 each", "GH₵80,000 each"], "correct_index": 2, "explanations": ["GH₵20,000 is the equal share only, ignoring A's unpaid balance.", "GH₵26,667 would result from splitting the whole shortfall net of A's 5,000 payment incorrectly.", "Shortfall 200,000 − 120,000 = 80,000; equal share 20,000 each. A pays 5,000, leaving 15,000 shared by B, C and D = 5,000 each; each pays 25,000 (check: 3×25,000 + 5,000 = 80,000).", "GH₵80,000 is the full shortfall, not one partner's share."], "tag": "f01·Q4", "mid": "f01", "section": "Partnership liability", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A partnership of four partners sharing profits equally owes GH₵200,000 but has assets of GH₵120,000. Partner A can pay only GH₵5,000 personally. With personal liability, how much must each of the other three partners pay in total (equal initial share, then A's unpaid balance split among them)?"}, {"difficulty": "hard", "options": ["Choosing policies that show the highest profit every year", "Showing only good news to maintain investors' confidence", "Using the lowest figure to be safe in every estimate", "Selecting and presenting information without bias to gain a favourable or unfavourable reaction"], "correct_index": 3, "explanations": ["Maximising profit is a bias in favour of the preparer.", "Showing only good news is a selective, biased presentation.", "Always using the lowest figure is also bias, not prudence in a balanced sense.", "Neutral information is presented without slant, emphasis or de-emphasis; prudence supports neutrality by cautious judgement."], "tag": "f01·Q5", "mid": "f01", "section": "Neutrality", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Which action best demonstrates neutrality in preparing financial statements?"}, {"difficulty": "medium", "options": ["Leave the transaction out of the financial statements", "Wait until the IASB issues a standard before reporting", "Use whichever treatment gives the highest profit", "Apply the general principles and concepts in the Conceptual Framework"], "correct_index": 3, "explanations": ["Omitting transactions would give incomplete, unfaithful statements.", "Reporting cannot be delayed until a new standard appears.", "Choosing for profit would breach neutrality.", "Where no standard applies, the Conceptual Framework's principles and concepts guide the treatment. KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 14"], "tag": "f01·Q6", "mid": "f01", "section": "Standards gap", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A Ghanaian company enters a transaction not addressed by any specific IFRS. What are preparers expected to do?"}, {"difficulty": "easy", "options": ["identified, measured, recorded and summarised for communication to users", "estimated, forecast, budgeted and reported only to the entity's managers", "collected, taxed, audited and filed with the Registrar-General only", "identified, priced, sold and distributed to the entity's customers KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 4"], "correct_index": 0, "explanations": ["This is the slide definition: information is identified, measured, recorded, summarised and then communicated to users for decision making.", "Financial accounting is aimed mainly at external users and looks at actual transactions, not at budgets or forecasts for managers.", "Filing and tax compliance are by-products; the core purpose is communicating useful information for decisions.", "Pricing and selling are commercial activities, not parts of the accounting process."], "tag": "f01·Q7", "mid": "f01", "section": "Definition", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Financial accounting is best defined as the system by which economic information about an entity's activities is:"}, {"difficulty": "easy", "options": ["relevance and faithful representation", "comparability and timeliness", "verifiability and understandability", "materiality and consistency"], "correct_index": 0, "explanations": ["Relevance and faithful representation are the fundamental characteristics; the rest are enhancing.", "Comparability and timeliness are enhancing characteristics.", "Verifiability and understandability are enhancing characteristics.", "Materiality is an aspect of relevance and consistency supports comparability."], "tag": "f01·Q8", "mid": "f01", "section": "Qualitative characteristics", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "The two fundamental qualitative characteristics of useful financial information are:"}, {"difficulty": "medium", "options": ["To satisfy the public listing rules of an exchange", "For the benefit of the partners themselves", "Because auditing is a legal requirement for partnerships", "To allow the owner to claim limited liability"], "correct_index": 1, "explanations": ["Listing rules apply to public companies.", "Partnership accounts mainly inform the partners about the business and their share of results.", "Legal audit is stated for companies, not partnerships.", "Partners have personal liability, so accounts do not create limited liability."], "tag": "f01·Q9", "mid": "f01", "section": "Partnership", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Why are partnership financial accounts primarily needed, according to the slides?"}, {"difficulty": "medium", "options": ["Helping preparers deal with issues not addressed by a standard", "Replacing every IFRS with a single rule", "Setting the tax rates companies must pay", "Appointing directors for listed companies"], "correct_index": 0, "explanations": ["The framework assists preparers where standards are silent, among other purposes such as helping auditors and users.", "The framework supports standards; it does not replace them.", "Tax rates are set by tax law.", "Director appointments are a matter of company law."], "tag": "f01·Q10", "mid": "f01", "section": "Conceptual Framework", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Which is one of the stated purposes of the Conceptual Framework?"}, {"difficulty": "devil", "options": ["It helps keep standards consistent with each other", "It helps preparers with issues not covered by a standard", "It is used only by auditors and plays no role for preparers", "It helps users interpret financial statements"], "correct_index": 2, "explanations": ["True: it assists standard consistency.", "True: it assists preparers.", "False: it also assists preparers, where standards are silent, as well as auditors and users.", "True: it assists users to interpret."], "tag": "f01·Q11", "mid": "f01", "section": "Conceptual Framework", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Which statement about the Conceptual Framework is FALSE?"}, {"difficulty": "devil", "options": ["Shareholders must personally manage the company's day-to-day operations", "Liability for debts may be limited", "Public companies can raise capital through an exchange", "Large companies are managed by professional managers"], "correct_index": 0, "explanations": ["False: large companies are run by professional managers, so ownership and management are often separate.", "True: limited liability is possible.", "True: public companies can raise capital from the public.", "True: professional managers run large ones."], "tag": "f01·Q12", "mid": "f01", "section": "Company", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Which statement about companies is FALSE?"}, {"difficulty": "hard", "options": ["The statements are unfaithful because every single figure must be exact", "Estimates are forbidden in all financial statements by the framework", "Only estimates that have been audited can be considered faithful", "Free from error is not perfect accuracy; reasonable estimates can be faithful"], "correct_index": 3, "explanations": ["Perfect accuracy is not required for many items, as many are estimates.", "Estimates are widely used, for example in provisions and depreciation.", "Faithfulness depends on the process and description, not audit status.", "Free from error means no errors in the description or process; an estimate disclosed as such can still be a faithful representation."], "tag": "f01·Q13", "mid": "f01", "section": "Faithful representation", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A company reports an inventory estimate that is later found to be GH₵3,000 off due to a reasonable estimation. How does this fit the concept of free from error?"}, {"difficulty": "medium", "options": ["leaving out complex transactions so that everyone follows", "using technical jargon so that experts are impressed", "classifying, characterising and presenting information clearly and concisely", "presenting unrelated items together in a single line"], "correct_index": 2, "explanations": ["Complex but relevant information should not be excluded simply to make it easier.", "Jargon reduces understandability for users.", "Clear and concise classification and presentation makes information understandable to reasonably knowledgeable users.", "Combining unrelated items obscures the picture. KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 15"], "tag": "f01·Q14", "mid": "f01", "section": "Understandability", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Understandable information is achieved by:"}, {"difficulty": "medium", "options": ["reported only at the end of the entity's life", "available to decision-makers in time to influence their decisions", "prepared on the day the entity was formed", "restricted to the first month after year-end KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 5"], "correct_index": 1, "explanations": ["Waiting until the end of life defeats the purpose of decision usefulness.", "Timeliness is about having information in time to be capable of influencing decisions.", "Preparation on formation date has nothing to do with the reporting needs.", "There is no one-month rule; it depends on when decisions are made."], "tag": "f01·Q15", "mid": "f01", "section": "Timeliness", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Timeliness means that information is:"}, {"difficulty": "easy", "options": ["Income Tax Act, 2015 (Act 896)", "Labour Act, 2003 (Act 651)", "Companies Act, 2019 (Act 992)", "Data Protection Act, 2012 (Act 843)"], "correct_index": 2, "explanations": ["Act 896 is a tax law and is not listed as a source of financial reporting regulation in the slides.", "The Labour Act governs employment matters, not financial reporting.", "Act 992, the Companies Act 2019, is listed among the Acts of Parliament regulating financial reporting.", "The Data Protection Act deals with personal data, not accounts."], "tag": "f01·Q16", "mid": "f01", "section": "Ghana law", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Which Ghanaian Act is cited in the slides as a source of regulation for company financial reporting?"}, {"difficulty": "easy", "options": ["approve new International Financial Reporting Standards", "issue interpretations and guidance on accounting standards", "audit the financial statements of listed companies", "collect taxes on behalf of national governments"], "correct_index": 1, "explanations": ["Approving standards is the IASB's job.", "It provides interpretations and guidance when standards are unclear or applied inconsistently.", "The committee does not audit; auditors do.", "Tax collection is a government function."], "tag": "f01·Q17", "mid": "f01", "section": "IFRS IC", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "The role of the IFRS Interpretations Committee is to:"}, {"difficulty": "devil", "options": ["It is primarily for external stakeholders", "It is designed mainly to meet the detailed needs of the entity's managers", "It aims to help investors, lenders and creditors with resource decisions", "Information has value only when it is used"], "correct_index": 1, "explanations": ["True: external stakeholders are the primary audience.", "False: managers get tailored information from management accounting; general-purpose reports target external users.", "True: this is the stated objective.", "True: the slides say information has no value unless used."], "tag": "f01·Q18", "mid": "f01", "section": "Scope", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Which statement about general-purpose financial reporting is FALSE?"}, {"difficulty": "hard", "options": ["GH₵5,000, the full nominal value of the shares", "GH₵2,000, the amount already paid in", "GH₵3,000, being the unpaid amount on the shares", "GH₵0, because shareholders never owe anything more"], "correct_index": 2, "explanations": ["The GH₵2,000 already paid is part of the GH₵5,000; only the unpaid portion remains payable.", "The GH₵2,000 paid is already lost; it is not an extra liability.", "Unpaid = (5 − 2) × 1,000 = GH₵3,000; limited liability caps the shareholder's loss at what is unpaid on the shares.", "If shares are partly paid, the unpaid amount can still be called."], "tag": "f01·Q19", "mid": "f01", "section": "Limited liability", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A shareholder holds 1,000 shares of GH₵5 each, on which GH₵2 per share has been paid. The company is liquidated with large debts. What is the shareholder's maximum further liability?"}, {"difficulty": "easy", "options": ["purchased and stored indefinitely without any further processing", "assembled and processed to provide goods or services to customers", "donated to the public for no consideration or return of any kind", "held only as cash in the bank to earn interest for owners"], "correct_index": 1, "explanations": ["Storing resources without processing produces no outputs for customers, so it is not a business as defined.", "The slide definition: inputs are assembled and processed into outputs (goods or services) that are provided to customers.", "Giving resources away free describes charity, not the input-process-output model in the definition.", "Holding cash is passive investment; the definition requires processing of inputs into outputs."], "tag": "f01·Q20", "mid": "f01", "section": "Business organisations", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A business is an organisation in which basic resources (inputs) are:"}, {"difficulty": "medium", "options": ["To judge whether loans and interest will be repaid when due", "To decide how much dividend each shareholder gets", "To set the selling prices of the borrower's goods", "To confirm the borrower's staff are well trained"], "correct_index": 0, "explanations": ["Lenders want information on solvency and cash generation to assess repayment ability.", "Dividend decisions are made by the directors and shareholders.", "Pricing is a management decision.", "Staff training is not an information need of lenders."], "tag": "f01·Q21", "mid": "f01", "section": "Users", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Why would lenders such as a bank be interested in a borrower's financial statements?"}, {"difficulty": "hard", "options": ["Ignore the transaction until the IFRS IC rules on it", "Copy the treatment used by the largest competitor", "Record it at whatever amount the directors prefer", "Develop an accounting policy based on the Conceptual Framework concepts"], "correct_index": 3, "explanations": ["Silence from standards does not permit omission of a real transaction.", "Copying a competitor does not ensure faithful representation.", "Directors' preference would breach neutrality and faithful representation.", "Preparers must apply the general principles and concepts of the Conceptual Framework when no standard applies. KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 16"], "tag": "f01·Q22", "mid": "f01", "section": "Standards gap", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A Ghanaian company undertakes a novel transaction. No IFRS clearly covers it. Which approach is consistent with the lecture?"}, {"difficulty": "medium", "options": ["To comply with the IASB's mandatory audit rules", "To report to thousands of public shareholders", "Mainly for tax purposes, such as agreeing profit with the revenue authority", "To satisfy the Companies Act requirement for annual returns KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 6"], "correct_index": 2, "explanations": ["There is no mandatory IASB audit rule for sole traders.", "A sole trader has one owner, not public shareholders.", "The slide says that a sole trader needs accounts for tax purposes.", "The Companies Act applies to companies, not sole traders."], "tag": "f01·Q23", "mid": "f01", "section": "Sole trader", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Why does a sole trader typically need financial accounts?"}, {"difficulty": "easy", "options": ["use the same accounting year-end regardless of local law", "apply similar principles so that financial statements are comparable", "report identical profits irrespective of their transactions", "avoid disclosing any information about their performance"], "correct_index": 1, "explanations": ["IFRSs do not force a single year-end for all entities.", "IFRSs promote similar principles, concepts and methods so that statements of companies can be compared.", "Comparable principles do not mean identical profits; results depend on transactions.", "IFRSs require disclosure, not avoidance of it."], "tag": "f01·Q24", "mid": "f01", "section": "Purpose of IFRS", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A key role of IFRSs is to encourage entities in all countries to:"}, {"difficulty": "medium", "options": ["decide whether to subscribe for new shares", "negotiate credit terms for supplies", "assess the taxable profit and tax payable by the entity", "plan the entity's marketing campaigns"], "correct_index": 2, "explanations": ["Share subscription is an investor's decision.", "Credit terms are negotiated by suppliers.", "Tax authorities use the accounts to determine taxable profits and the related tax due.", "Marketing planning is a management function."], "tag": "f01·Q25", "mid": "f01", "section": "Users", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "The Ghana Revenue Authority, as a user of financial statements, primarily needs information to:"}, {"difficulty": "medium", "options": ["Information must be free for all users", "Only the cheapest accounting software is permitted", "Costs of reporting must be borne by the investors", "The benefits of reporting information should justify the cost of providing it"], "correct_index": 3, "explanations": ["Information is not required to be free.", "The framework says nothing on software choice.", "It does not say who pays; it says costs should be weighed against benefits.", "Cost is a pervasive constraint; information should be provided only when its benefits justify the cost."], "tag": "f01·Q26", "mid": "f01", "section": "Cost constraint", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Which statement best describes the cost constraint on useful financial reporting?"}, {"difficulty": "devil", "options": ["It must be favourable enough to encourage investors", "It should be complete, including necessary descriptions", "It should be neutral and without bias", "It should be free from error in the description"], "correct_index": 0, "explanations": ["Favourable slant breaches neutrality; faithful information must be unbiased.", "Completeness is required.", "Neutrality is required.", "Freedom from error is required."], "tag": "f01·Q27", "mid": "f01", "section": "Faithful representation", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", r business.", "Debenture holders are lenders to the company, not owners."], "tag": "f01·Q59", "mid": "f01", "section": "Company", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "The owners of a company are called:"}, {"difficulty": "medium", "options": ["prove that the numbers are free from every error", "show that the entity pays no tax", "help forecast future outcomes", "guarantee future profits to lenders KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 11"], "correct_index": 2, "explanations": ["Freedom from error relates to faithful representation.", "Predictive value has nothing to do with tax payment.", "Predictive value is about helping users form expectations about the future, and it is a component of relevance.", "Information can help forecast outcomes but cannot guarantee them."], "tag": "f01·Q60", "mid": "f01", "section": "Relevance", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Information has predictive value when it can be used by users to:"}, {"difficulty": "devil", "options": ["Lenders: to judge whether loans and interest will be repaid", "Employees: to assess the stability of the employer", "Tax authority: to assess taxable profit", "Competitors: to assess the entity's ability to repay its loans"], "correct_index": 3, "explanations": ["Correct pairing.", "Correct pairing.", "Correct pairing.", "Incorrect: competitors are not lenders; the repayment ability matters to lenders and creditors."], "tag": "f01·Q61", "mid": "f01", "section": "Users", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Match the user to the main information need. Which pairing is INCORRECT?"}, {"difficulty": "easy", "options": ["A sole trader, to satisfy tax officers", "A company, along with regulated financial reporting", "A partnership, to protect the partners", "Every unincorporated business in Ghana"], "correct_index": 1, "explanations": ["Sole trader accounts are needed mainly for tax purposes, not legally audited.", "For companies, financial reporting is regulated and auditing is a legal requirement.", "Partnership accounts are prepared for the partners' benefit, not mandatory audit.", "Unincorporated businesses do not carry a general legal audit requirement. KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 21"], "tag": "f01·Q62", "mid": "f01", "section": "Auditing", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Which business structure has auditing as a legal requirement, according to the slides?"}, {"difficulty": "easy", "options": ["the Registrar-General, who guarantees all small business debts", "only the business assets, because the owner is protected by law", "the owner personally, with no legal separation from the business", "the customers who bought goods from the business on credit"], "correct_index": 2, "explanations": ["No government body guarantees sole trader debts.", "Protection limited to business assets is a feature of a limited company, not a sole trader.", "A sole trader has personal liability: the owner and business are one legal person, so personal assets can be used to pay business debts.", "Customers are creditors' debtors, not guarantors of the business's own obligations."], "tag": "f01·Q63", "mid": "f01", "section": "Sole trader", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "In a sole trader business, liability for the unpaid debts of the business rests on:"}, {"difficulty": "medium", "options": ["short, simple and printed in colour", "fast, cheap and easy to obtain only", "rounded up, favourable and optimistic", "complete, neutral and free from error"], "correct_index": 3, "explanations": ["Brevity and appearance are not attributes of faithful representation.", "Speed and cost relate to timeliness and the cost constraint.", "Favourable or optimistic bias breaches neutrality.", "Complete, neutral and free from error are the three attributes of a faithful depiction."], "tag": "f01·Q64", "mid": "f01", "section": "Faithful representation", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "To be a faithful representation, information should be:"}, {"difficulty": "easy", "options": ["existing shareholders only when they request the accounts", "only the entity's senior management and directors", "competitors who want to benchmark the entity's prices", "existing and potential investors, lenders and other creditors"], "correct_index": 3, "explanations": ["Potential investors are included too, and information is not provided only on request.", "Managers get internal information from management accounting systems.", "Competitors are not target users of general-purpose reports.", "The Conceptual Framework objective is usefulness to existing and potential investors, lenders and creditors in making resource decisions."], "tag": "f01·Q65", "mid": "f01", "section": "Objective", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "The objective of general-purpose financial reporting is to provide information useful to:"}, {"difficulty": "hard", "options": ["Apply timeliness first, then decide relevance afterwards", "Maximise comparability first, then drop faithful representation", "Identify relevant information, check faithful representation, then enhance within cost", "Consider cost first and then identify what is relevant"], "correct_index": 2, "explanations": ["Timeliness is an enhancing characteristic and cannot come before relevance.", "Faithful representation is fundamental and cannot be dropped for comparability.", "Fundamental characteristics come first; enhancing characteristics improve usefulness and cost constrains the whole exercise.", "Cost is a constraint applied at the end, not the starting point."], "tag": "f01·Q66", "mid": "f01", "section": "Applying characteristics", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "In applying the qualitative characteristics, what is the correct sequence?"}, {"difficulty": "easy", "options": ["Three bodies", "Two bodies", "Five bodies", "Seven bodies"], "correct_index": 0, "explanations": ["The IASB, IFRS Advisory Council and IFRS Interpretations Committee are the three bodies under its oversight.", "Two leaves out one of the three named bodies.", "Five is more than the three listed.", "Seven is far more than the three listed."], "tag": "f01·Q67", "mid": "f01", "section": "IFRS Foundation", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "The IFRS Foundation has oversight of how many bodies that directly set or support accounting standards?"}, {"difficulty": "easy", "options": ["The IFRS Advisory Council", "The International Accounting Standards Board (IASB)", "The IFRS Interpretations Committee", "The Institute of Chartered Accountants, Ghana KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 12"], "correct_index": 1, "explanations": ["The Advisory Council only gives advice and opinions to the IASB.", "The IASB is the independent standard-setting board that develops and approves IFRSs.", "The Interpretations Committee issues interpretations, not the standards themselves.", "ICAG regulates the profession locally but does not issue IFRSs."], "tag": "f01·Q68", "mid": "f01", "section": "IASB", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Which body develops and approves International Financial Reporting Standards?"}, {"difficulty": "easy", "options": ["the managers running day-to-day operations", "only the Ghana Revenue Authority", "external stakeholders of the entity", "the auditors appointed by the board"], "correct_index": 2, "explanations": ["Managers use management accounting for better operational information.", "Tax authorities are one of many users, not the sole primary audience.", "The slides state that financial reporting is primarily for 'external' stakeholders such as investors and lenders.", "Auditors examine the statements; they are not the primary users of them."], "tag": "f01·Q69", "mid": "f01", "section": "Scope of reporting", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "According to the Conceptual Framework, general-purpose financial reporting is primarily for the benefit of:"}, {"difficulty": "hard", "options": ["a management accounting report prepared for internal purposes", "a legal requirement for audit under the partnership law", "an economic decision supported by useful information from financial reporting", "an interpretation issued by the IFRS Interpretations Committee"], "correct_index": 2, "explanations": ["Investors are external users; internal reports serve managers.", "Audit law is not what drives the investor's decision.", "The objective of reporting is information useful for decisions about providing resources, such as buying, holding or selling.", "The IFRS IC interprets standards; it does not make investment decisions. KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 22"], "tag": "f01·Q70", "mid": "f01", "section": "Users", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A potential investor reviewing a company's accounts wants to decide whether to buy, hold or sell shares. This is an example of:"}, {"difficulty": "medium", "options": ["Users must pay for information before it counts as accounting", "Information is valuable only if it is printed on paper", "Only audited information may ever be used in decisions", "Reports only matter if users act on them in their decisions"], "correct_index": 3, "explanations": ["Payment is not what gives information value.", "The format (paper or electronic) is irrelevant to value.", "The slide does not link value to audit status; it links it to use.", "The point is that information earns its value through use in decision making by users."], "tag": "f01·Q71", "mid": "f01", "section": "Value of information", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Why do the slides say that information has no value unless it is used?"}, {"difficulty": "hard", "options": ["It has no value because it concerns the past", "It has confirmatory value by confirming or changing prior evaluations", "It has predictive value only if sales rise in future", "It is relevant only because it was audited"], "correct_index": 1, "explanations": ["Past information is useful when it confirms or changes earlier assessments.", "Information that confirms or corrects earlier expectations has confirmatory value, a component of relevance.", "The figure's value does not depend on future sales increasing.", "Audit status relates to credibility, not to the relevance attribute here."], "tag": "f01·Q72", "mid": "f01", "section": "Relevance", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Last year, management predicted sales of GH₵2m. The actual sales were reported as GH₵2.1m. In what way is this actual figure relevant?"}, {"difficulty": "devil", "options": ["Equity is the residual interest after liabilities are deducted", "Equity is sometimes referred to as net assets", "Owner drawings increase equity because cash leaves the business", "Profit for the year is an addition to owner's equity"], "correct_index": 2, "explanations": ["Wrong (true statement): equity is assets less liabilities, the residual interest.", "Wrong (true statement): the lecture notes that equity is sometimes called net assets.", "Correct (false statement): drawings are distributions to the owner and reduce equity.", "Wrong (true statement): profit belongs to the owner and is added to capital."], "tag": "f02·Q1", "mid": "f02", "section": "Equity", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Which of the following statements about equity is FALSE?"}, {"difficulty": "hard", "options": ["GH₵8,000", "GH₵16,000", "GH₵12,000", "GH₵4,000"], "correct_index": 2, "explanations": ["Wrong: GH₵8,000 is the rise in equity, which ignores the drawings that reduced it.", "Wrong: GH₵16,000 adds the drawings twice, 8,000 + 4,000 + 4,000.", "Correct: change in equity 8,000 + drawings 4,000 = GH₵12,000 profit.", "Wrong: GH₵4,000 is just the drawings."], "tag": "f02·Q2", "mid": "f02", "section": "Statement of changes in equity", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A sole trader's net assets rose from GH₵30,000 to GH₵38,000 during the year. The owner drew GH₵4,000 and introduced no new capital. Profit for the year was:"}, {"difficulty": "medium", "options": ["A non-current intangible asset", "A current asset held for sale", "A current liability", "Part of owner's drawings"], "correct_index": 0, "explanations": ["Correct: trademarks are intangibles that produce benefits for more than a year.", "Wrong: it is not expected to be sold or used up within one year.", "Wrong: it gives future benefits to the business and creates no obligation.", "Wrong: drawings relate to owner withdrawals, not purchased assets."], "tag": "f02·Q3", "mid": "f02", "section": "Assets", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A company buys a trademark that will bring benefits for many years. It is classified as:"}, {"difficulty": "devil", "options": ["Any item that meets the definition of an element must always be recognised", "An item is recognised once it has been measured at historical cost", "Meeting the definition of an element is not enough; relevance and faithful representation are also needed", "Recognition applies only to assets and liabilities, not income and expenses"], "correct_index": 2, "explanations": ["Wrong: meeting the definition alone does not guarantee recognition.", "Wrong: measurement follows recognition and is not what triggers it.", "Correct: recognition requires both relevant information and a faithful representation, in addition to meeting the definition.", "Wrong: the lecture applies recognition to assets, liabilities, equity, income and expenses."], "tag": "f02·Q4", "mid": "f02", "section": "Recognition", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Which statement about recognition is correct?"}, {"difficulty": "hard", "options": ["Assets up GH₵6,000; equity up GH₵6,000", "Assets down GH₵6,000; liabilities down GH₵6,000", "Liabilities up GH₵6,000; equity down GH₵6,000", "Liabilities down GH₵6,000; equity up GH₵6,000"], "correct_index": 3, "explanations": ["Wrong: cash was already received earlier, so no new asset arises on delivery.", "Wrong: no asset is paid out when the business performs the service.", "Wrong: this reverses the effect; revenue raises equity and settles the liability.", "Correct: the unearned revenue liability is discharged and revenue increases equity, with total assets unchanged."], "tag": "f02·Q5", "mid": "f02", "section": "Accounting equation", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Services worth GH₵6,000 had been paid for in advance by a client. When the services are delivered, the effect is:"}, {"difficulty": "medium", "options": ["GH₵46,800", "GH₵18,000", "GH₵28,800", "GH₵10,800"], "correct_index": 3, "explanations": ["Wrong: GH₵46,800 adds liabilities to assets instead of deducting them.", "Wrong: GH₵18,000 is the liabilities figure.", "Wrong: GH₵28,800 is total assets, which ignores outside claims.", "Correct: equity = assets − liabilities = 28,800 − 18,000 = GH₵10,800."], "tag": "f02·Q6", "mid": "f02", "section": "Accounting equation", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A business has total assets of GH₵28,800 and total liabilities of GH₵18,000. Its equity (net assets) is:"}, {"difficulty": "easy", "options": ["When they occur, regardless of when cash moves", "Only when cash is received or paid", "When the auditor approves them at year end", "When the invoice is eventually settled in full KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 24"], "correct_index": 0, "explanations": ["Correct: accrual accounting records events in the period they occur, not when cash is received or paid.", "Wrong: that describes the cash basis, which the accrual basis specifically rejects.", "Wrong: recognition depends on the event occurring, not on auditor approval.", "Wrong: waiting for settlement would delay recognition until cash moves, contrary to accrual accounting. KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 34"], "tag": "f02·Q7", "mid": "f02", "section": "Accrual basis", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Under the accrual basis, when are transactions and other events recognised?"}, {"difficulty": "easy", "options": ["Assets = Liabilities + Equity", "Assets = Liabilities − Equity", "Assets + Liabilities = Equity", "Equity = Assets + Liabilities"], "correct_index": 0, "explanations": ["Correct: resources of the business equal claims on them by outsiders and owners.", "Wrong: subtracting equity misstates the relationship.", "Wrong: this places assets and liabilities on the same side incorrectly.", "Wrong: equity is assets less liabilities, not the sum."], "tag": "f02·Q8", "mid": "f02", "section": "Accounting equation", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "The accounting equation is:"}, {"difficulty": "medium", "options": ["January, the period in which cash arrived", "December, the period in which it was earned", "Both December and January, split equally", "The period in which the invoice is filed"], "correct_index": 1, "explanations": ["Wrong: that is the cash basis approach.", "Correct: accrual accounting recognises revenue when earned, regardless of cash timing.", "Wrong: revenue earned once is recognised once, in the period earned.", "Wrong: filing administration does not determine when revenue is earned."], "tag": "f02·Q9", "mid": "f02", "section": "Accrual basis", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A firm performs consultancy work in December and receives the cash in January. Under the accrual basis the revenue belongs to:"}, {"difficulty": "medium", "options": ["GH₵18,000", "GH₵10,800", "GH₵39,600", "GH₵28,800"], "correct_index": 0, "explanations": ["Correct: liabilities = assets − equity = 28,800 − 10,800 = GH₵18,000.", "Wrong: GH₵10,800 is the equity, not the liabilities.", "Wrong: GH₵39,600 adds the two figures instead of subtracting.", "Wrong: GH₵28,800 is total assets, which equals liabilities plus equity."], "tag": "f02·Q10", "mid": "f02", "section": "Accounting equation", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A business has total assets of GH₵28,800 and equity of GH₵10,800. Its total liabilities are:"}, {"difficulty": "devil", "options": ["Right, because only the legal owner may recognise an asset", "Right, because assets must be paid for in cash first", "Wrong, because the economic reality is that it controls an asset", "Wrong, because it should be treated as owner's capital"], "correct_index": 2, "explanations": ["Wrong: legal title is not the test; the slides give this exact case as an asset of the controlling entity.", "Wrong: payment method does not decide whether an asset exists.", "Correct: substance over form requires the equipment to be treated as Kwesi's asset.", "Wrong: control of the equipment does not turn it into owner's capital."], "tag": "f02·Q11", "mid": "f02", "section": "Substance over form", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Kwesi Ltd uses specialised equipment for its whole useful life and controls how it is used, though the supplier keeps legal title. Its accountant leaves it off the statement of financial position, citing legal ownership. This treatment is:"}, {"difficulty": "devil", "options": ["GH₵149,000", "GH₵157,000", "GH₵139,000", "GH₵165,000"], "correct_index": 0, "explanations": ["Correct: closing equity 60,000 + 35,000 − 8,000 + 10,000 = 97,000; plus liabilities 52,000 = GH₵149,000.", "Wrong: GH₵157,000 omits the drawings, which reduce equity.", "Wrong: GH₵139,000 omits the GH₵10,000 of capital introduced.", "Wrong: GH₵165,000 adds the drawings instead of deducting them."], "tag": "f02·Q12", "mid": "f02", "section": "Statement of changes in equity", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A business begins the year with assets GH₵100,000 and liabilities GH₵40,000. For the year: revenue GH₵90,000, expenses GH₵55,000, drawings GH₵8,000, extra capital GH₵10,000. Closing liabilities are GH₵52,000. Closing total assets are:"}, {"difficulty": "hard", "options": ["GH₵48,000", "GH₵20,000", "GH₵58,000", "GH₵38,000"], "correct_index": 3, "explanations": ["Wrong: GH₵48,000 uses equipment at cost and ignores the accumulated depreciation.", "Wrong: GH₵20,000 shows current assets only, leaving out equipment.", "Wrong: GH₵58,000 adds accumulated depreciation instead of deducting it.", "Correct: current assets 20,000 + net equipment 18,000 = GH₵38,000."], "tag": "f02·Q13", "mid": "f02", "section": "Statement of financial position", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A statement of financial position shows cash on hand GH₵4,000, cash in bank GH₵6,800, receivables GH₵3,200, inventory GH₵5,000, prepaid expenses GH₵1,000, equipment GH₵28,000 and accumulated depreciation GH₵10,000. Total assets are:"}, {"difficulty": "medium", "options": ["GH₵14,000", "GH₵6,000", "GH₵26,000", "GH₵20,000 KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 25"], "correct_index": 2, "explanations": ["Wrong: GH₵14,000 subtracts profit instead of adding it.", "Wrong: GH₵6,000 is only the profit, omitting the opening capital.", "Correct: profit is added to owner's capital, 20,000 + 6,000 = GH₵26,000.", "Wrong: GH₵20,000 ignores the profit that belongs to the owner."], "tag": "f02·Q14", "mid": "f02", "section": "Relationship of statements", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A sole trader has opening capital of GH₵20,000, earns profit of GH₵6,000 and takes no drawings. The closing capital is:"}, {"difficulty": "medium", "options": ["Both amounts are shown as one revenue figure", "Revenue and other income are reported as separate items", "The GH₵500 is shown as an owner contribution", "Both amounts are shown in equity directly"], "correct_index": 1, "explanations": ["Wrong: a one-off disposal is not part of normal business operations, so it is not combined.", "Correct: revenue arises from normal operations, while other income such as a disposal gain is reported separately.", "Wrong: owner contributions are not income; a disposal is not one.", "Wrong: income is reported in profit or loss, then flows to equity as profit. KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 35"], "tag": "f02·Q15", "mid": "f02", "section": "Income", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A shop earns GH₵2,000 from selling goods and a one-off GH₵500 from disposing of an old van. In the statement of profit or loss:"}, {"difficulty": "easy", "options": ["Payable within the next year", "Owed only to the owners of the business", "Not payable within the next year", "Payable only in cash on demand"], "correct_index": 2, "explanations": ["Wrong: that describes current liabilities.", "Wrong: non-current liabilities are normally owed to lenders, 40,000 deducts expenses incurred from the full cash received, ignoring the advance receipt.", "Correct: revenue earned 105,000 less expenses incurred 80,000 = GH₵25,000.", "Wrong: GH₵35,000 mixes earned revenue with expenses paid, 105,000 − 70,000."], "tag": "f02·Q19", "mid": "f02", "section": "Accrual vs cash", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "In a year, a firm receives GH₵120,000 in cash, of which GH₵15,000 relates to services to be performed next year. Expenses incurred are GH₵80,000, of which GH₵70,000 has been paid. Profit on the accrual basis is:"}, {"difficulty": "easy", "options": ["Matching cash receipts against cash payments in the period", "Matching revenue earned against expenses incurred in earning it", "Matching assets against liabilities at the year end", "Matching owner's drawings against capital contributed"], "correct_index": 1, "explanations": ["Wrong: matching cash flows gives a cash-basis result, not accrual profit.", "Correct: profit is revenue earned less the expenses incurred to earn it in the same period.", "Wrong: matching assets and liabilities gives equity (net assets), not profit.", "Wrong: drawings and capital are owner transactions, not part of the profit calculation."], "tag": "f02·Q20", "mid": "f02", "section": "Matching convention", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "The matching convention determines profit by:"}, {"difficulty": "medium", "options": ["Dr Wages expense GH₵3,000; Cr Cash GH₵3,000", "Dr Cash GH₵3,000; Cr Wages expense GH₵3,000", "Dr Wages expense GH₵3,000; Cr Capital GH₵3,000", "Dr Cash GH₵3,000; Cr Capital GH₵3,000 KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 26"], "correct_index": 0, "explanations": ["Correct: expenses increase by a debit and the asset cash decreases by a credit.", "Wrong: this swaps the entries and would treat the payment as cash received.", "Wrong: wages paid from cash do not increase owner capital.", "Wrong: this records an owner investment, not a wage payment."], "tag": "f02·Q21", "mid": "f02", "section": "Double entry", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Wages of GH₵3,000 are paid in cash. The correct double entry is:"}, {"difficulty": "hard", "options": ["Interest expense and a liability of GH₵12,000", "A prepayment of GH₵3,000 as an asset", "No entry, because no cash has been paid", "Interest expense and a liability of GH₵3,000"], "correct_index": 3, "explanations": ["Wrong: GH₵12,000 is a full year of interest, but only three months has been incurred.", "Wrong: unpaid interest is owed, which is a liability rather than an asset.", "Wrong: accrual accounting recognises expenses when incurred, not when cash is paid.", "Correct: 100,000 × 12% × 3/12 = GH₵3,000 is incurred, so the expense is recognised with an accrued liability."], "tag": "f02·Q22", "mid": "f02", "section": "Accrued expense", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A business has a GH₵100,000 bank loan at 12% a year. No interest has been paid for the last three months of the year. At the year end the correct treatment is to record:"}, {"difficulty": "medium", "options": ["GH₵46,800", "GH₵18,000", "GH₵10,800", "GH₵28,800"], "correct_index": 2, "explanations": ["Wrong: GH₵46,800 adds expenses to revenue instead of deducting them.", "Wrong: GH₵18,000 is the expense figure, not profit.", "Correct: 28,800 − 18,000 = GH₵10,800.", "Wrong: GH₵28,800 is revenue before matching expenses against it. KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 36"], "tag": "f02·Q23", "mid": "f02", "section": "Matching", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "In a year a business earned revenue of GH₵28,800 and incurred expenses of GH₵18,000 in earning it. Applying the matching convention, profit is:"}, {"difficulty": "easy", "options": ["Debit entry", "Credit entry", "Debit and credit in the same account", "Memorandum entry only"], "correct_index": 1, "explanations": ["Wrong: debits increase assets and expenses.", "Correct: liabilities, equity and revenue increase on the credit side.", "Wrong: each transaction has one debit and one credit in different accounts.", "Wrong: liabilities are recorded in the double entry, not only in memoranda."], "tag": "f02·Q24", "mid": "f02", "section": "Double entry", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Under double entry, an increase in a liability is recorded as a:"}, {"difficulty": "medium", "options": ["Dr Bank GH₵5,000; Cr Bank loan GH₵5,000", "Dr Loan interest GH₵5,000; Cr Bank GH₵5,000", "Dr Bank loan GH₵5,000; Cr Bank GH₵5,000", "Dr Bank loan GH₵5,000; Cr Capital GH₵5,000"], "correct_index": 2, "explanations": ["Wrong: this swaps the sides and would record new borrowing.", "Wrong: a repayment of principal is not an interest expense.", "Correct: a liability decreases by a debit and the asset bank decreases by a credit.", "Wrong: capital is not affected by repaying a loan."], "tag": "f02·Q25", "mid": "f02", "section": "Double entry", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A business repays GH₵5,000 of a long-term bank loan from its bank account. The correct double entry is:"}, {"difficulty": "medium", "options": ["Recognition, capturing the item in the statements", "Classification into current and non-current items", "Substance over form, favouring legal title", "Measurement, putting a monetary amount on the element"], "correct_index": 3, "explanations": ["Wrong: recognition is the earlier step of capturing the item for inclusion.", "Wrong: classification concerns grouping, not the amount.", "Wrong: substance over form relates to economic reality, not choosing the amount.", "Correct: assigning a monetary amount to an element is measurement."], "tag": "f02·Q26", "mid": "f02", "section": "Recognition vs measurement", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A laboratory identifies a new analyser that meets the asset definition and enters it in the books, then decides it is to be shown at its GH₵90,000 purchase price. Choosing GH₵90,000 is an example of:"}, {"difficulty": "devil", "options": ["GH₵9,800", "GH₵10,800", "GH₵11,800", "GH₵9,000"], "correct_index": 0, "explanations": ["Correct: 10,400 + 400 − 1,000 = GH₵9,800.", "Wrong: GH₵10,800 ignores drawings.", "Wrong: GH₵11,800 adds the drawings.", "Wrong: GH₵9,000 deducts the profit instead of adding it."], "tag": "f02·Q27", "mid": "f02", "section": "Statement of changes in equity", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Opening owner's capital is GH₵10,400. The year's profit is GH₵400 and drawings are GH₵1,000. Closing equity is:"}, {"difficulty": "medium", "options": ["A reduction in cash and in equity, not an expense", "A reduction in cash and an increase in expenses", "An increase in cash and a reduction in liabilities", "A reduction in liabilities and in equity KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 27"], "correct_index": 0, "explanations": ["Correct: drawings are a distribution to the owner under the entity concept, so cash and equity fall while profit is unaffected.", "Wrong: drawings are excluded from expenses because they are distributions to holders of equity claims.", "Wrong: cash falls, not rises, when the owner takes money out.", "Wrong: no liability is settled by a private withdrawal."], "tag": "f02·Q28", "mid": "f02", "section": "Business entity", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "The owner of a trading business withdraws GH₵2,000 cash for private use. The business should record this as:"}, {"difficulty": "medium", "options": ["Dr Cash GH₵8,000; Cr ils to balance, and unused reagents remain an asset.", "Correct: remaining inventory is an asset of 4,000, the supplier is owed 10,000 and the 6,000 used is an expense, so 4,000 = 10,000 − 6,000. KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 37"], "tag": "f02·Q31", "mid": "f02", "section": "Accounting equation", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A medical laboratory buys reagents for GH₵10,000 on credit and uses GH₵6,000 of them in the year. At the year end the effect is:"}, {"difficulty": "easy", "options": ["Revenue has been deducted", "Income has been added to them", "Drawings have been added to them", "Liabilities have been deducted"], "correct_index": 3, "explanations": ["Wrong: revenue is not deducted from assets to find equity.", "Wrong: adding income to assets is not how equity is derived.", "Wrong: drawings reduce equity; they are not added to assets.", "Correct: equity equals assets minus liabilities, and is sometimes called net assets."], "tag": "f02·Q32", "mid": "f02", "section": "Equity", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Equity is the residual interest in the assets of the business after:"}, {"difficulty": "devil", "options": ["Paying a supplier from the bank", "Buying equipment for cash", "Paying wages in cash", "Recording wages owed but unpaid"], "correct_index": 2, "explanations": ["Wrong: paying a supplier reduces both assets and liabilities, leaving equity unchanged.", "Wrong: one asset is swapped for another, so total assets are unchanged.", "Correct: cash falls and an expense reduces equity.", "Wrong: liabilities rise and equity falls, while assets are unchanged."], "tag": "f02·Q33", "mid": "f02", "section": "Accounting equation", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Which single transaction decreases total assets and equity but leaves liabilities unchanged?"}, 6", "mid": "f02", "section": "Business entity", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Ama, a sole trader, pays GH₵5,000 of her child's school fees from the business bank account, and pays GH₵1,200 of the business electricity bill from her personal funds. The effect on the business's profit is:"}, {"difficulty": "medium", "options": ["Leave it out, because Adom does not hold legal title", "Recognise it as an expense when the arrangement starts", "Recognise it as an asset, because Adom controls its use", "Recognise it as equity contributed by the supplier"], "correct_index": 2, "explanations": ["Wrong: relying on legal title ignores the economic reality the concept requires.", "Wrong: an item controlled for many years yields future benefits, so it meets the asset definition rather than being an expense.", "Correct: substance over form says economic reality (control of the item) outweighs the legal position, so it is an asset of Adom.", "Wrong: the supplier has not contributed owners' capital; equity arises only from owner contributions and retained profits."], "tag": "f02·Q37", "mid": "f02", "section": "Substance over form", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Adom Ltd controls the use of a laboratory centrifuge for its whole useful life under an arrangement with the supplier, who keeps legal title. How should Adom treat the centrifuge?"}, {"difficulty": "easy", "options": ["A patent held by the business", "Inventory held for resale", "Prepaid expenses", "Trade receivables"], "correct_index": 0, "explanations": ["Correct: patents are intangibles that yield benefits for more than a year.", "Wrong: inventory is expected to be sold within the year.", "Wrong: prepaid expenses are used up within the year.", "Wrong: receivables are collected within the normal period, so they are current."], "tag": "f02·Q38", "mid": "f02", "section": "Assets", "qt": "single best", "source": 000 adds the wages to the revenue instead of deducting them."], "tag": "f02·Q46", "mid": "f02", "section": "Accounting equation", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "The owner invests GH₵20,000 cash, the business buys equipment for GH₵8,000 cash, makes a credit sale of GH₵5,000 and pays wages of GH₵2,000 in cash. Profit for the period is:"}, {"difficulty": "hard", "options": ["GH₵60,000", "GH₵55,000", "GH₵48,000", "GH₵65,000"], "correct_index": 1, "explanations": ["Wrong: GH₵60,000 leaves out drawings, which reduce equity.", "Correct: opening equity 35,000 + profit 18,000 − drawings 5,000 + capital 7,000 = GH₵55,000.", "Wrong: GH₵48,000 omits the GH₵7,000 capital introduced.", "Wrong: GH₵65,000 adds drawings instead of deducting them. KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 39"], "tag": "f02·Q47", "mid": "f02", "section": "Statement of changes in equity", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A business starts the year with assets of GH₵60,000 and liabilities of GH₵25,000. During the year it makes a profit of GH₵18,000, the owner draws GH₵5,000 and introduces GH₵7,000 more capital. Closing equity is:"}, {"difficulty": "hard", "options": ["GH₵6,000", "GH₵20,000", "GH₵14,000", "GH₵24,000"], "correct_index": 0, "explanations": ["Correct: equity = 38,000 − 18,000 = 20,000, so profit is 20,000 − 14,000 = GH₵6,000.", "Wrong: GH₵20,000 is the total equity, including capital.", "Wrong: GH₵14,000 is the capital introduced, not profit.", "Wrong: GH₵24,000 ignores the liabilities, 38,000 − 14,000."], "tag": "f02·Q48", "mid": "f02", "section": "Statement of financial position", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Using total assets of GH₵38,000, total liabilities of GH₵18,000 and capital introduced of GH₵14,000, the profit for the year is:"}, {"difficulty": "hard", "options": ["Collecting GH₵4
