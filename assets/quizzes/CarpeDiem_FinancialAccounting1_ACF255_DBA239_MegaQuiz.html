, "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Goods costing GH₵6,000 are bought on credit from Kofi Boateng. How is the total of the purchases day book posted?"}, {"difficulty": "hard", "options": ["GH₵43,000", "GH₵51,000", "GH₵47,000", "GH₵34,000"], "correct_index": 2, "explanations": ["This leaves out the GH₵4,000 receipt effect on Cash.", "This counts the GH₵4,000 receipt twice on one side.", "Debits: Cash 34,000 + Receivables 5,000 + Purchases 8,000 = 47,000; Credits: Capital 30,000 + Payables 8,000 + Sales 9,000 = 47,000.", "This is only the Cash balance, not a trial balance column total."], "tag": "f04·Q24", "mid": "f04", "section": "Trial balance", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Capital GH₵30,000 is paid into the bank. Goods of GH₵8,000 are bought on credit; goods are sold on credit for GH₵9,000; GH₵4,000 is received from the customer. What is the total of each column of the trial balance (Purchases, Sales, Capital, Payables, Receivables, Cash)?"}, {"difficulty": "devil", "options": ["The trial balance will not agree, with debits short by GH₵3,000", "The trial balance will not agree, with credits short by GH₵3,000", "The trial balance still agrees, but two customer balances are wrong", "The error is detected because the total of the sales day book changes"], "correct_index": 2, "explanations": ["The debit was still made, so debit and credit totals remain equal.", "Sales was credited correctly, so credits are not short.", "The debit of GH₵3,000 is still a debit, so totals agree even though the wrong customer is charged.", "The day book total is unaffected; only the personal account posted differs."], "tag": "f04·Q25", "mid": "f04", "section": "Trial balance limits", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A GH₵3,000 credit sale to Kofi Mensah is debited to Kwesi Mensah's account by mistake, and the Sales account is credited correctly. Which statement is correct?"}, {"difficulty": "devil", "options": ["GH₵38,000", "GH₵40,100", "GH₵39,200", "GH₵51,900"], "correct_index": 2, "explanations": ["This leaves Returns Inwards out of the debit column.", "This wrongly includes Returns Outwards as a debit balance.", "Purchases, Returns Inwards and Receivables are debit balances: 30,000 + 1,200 + 8,000.", "This is the total of the credit balances: Sales, Returns Outwards and Payables."], "tag": "f04·Q26", "mid": "f04", "section": "Trial balance", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Balances: Purchases GH₵30,000; Returns Inwards GH₵1,200; Receivables GH₵8,000; Sales GH₵45,000; Returns Outwards GH₵900; Payables GH₵6,000. What do the debit-balance accounts total in the trial balance?"}, {"difficulty": "devil", "options": ["Debits exceed credits by GH₵6,000", "Debits exceed credits by GH₵3,000", "Credits exceed debits by GH₵6,000", "The trial balance agrees"], "correct_index": 0, "explanations": ["The supplier should have been credited GH₵3,000, so debits are overstated by 3,000 and credits understated by 3,000.", "This counts only the missing credit and not the extra debit.", "Both postings were debits, so debits are higher.", "Two debits with no credit leave debits larger than credits."], "tag": "f04·Q27", "mid": "f04", "section": "Trial balance errors", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A credit purchase of GH₵3,000 from a supplier is posted as a debit to the Purchases account and also as a debit to the supplier's account. What is the effect on the trial balance?"}, {"difficulty": "devil", "options": ["Credit Yaw's account GH₵1,800; debit Returns Outwards with the total", "Debit Yaw's account GH₵1,800 individually; the day book total is credited to Returns Outwards", "Debit Yaw's account and credit Purchases account", "Credit Yaw's account; credit Returns Inwards with the total"], "correct_index": 1, "explanations": ["This reverses both sides.", "The purchases ledger entry is a debit, while the general ledger entry is a credit of the total.", "The credit goes to Returns Outwards, not directly to Purchases.", "Returns Inwards relates to customers and Yaw's account is debited. KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 82"], "tag": "f04·Q28", "mid": "f04", "section": "Posting returns", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "The firm returns goods worth GH₵1,800 to supplier Yaw and receives a debit note. Which statement is correct about the posting?"}, {"difficulty": "medium", "options": ["Debit the expense account", "Credit the expense account concerned", "Credit the expense and debit capital directly", "Debit the expense and credit an asset account KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 73"], "correct_index": 1, "explanations": ["Debit increases an expense; that would add to the cost, not reduce it.", "Expenses increase by debit and decrease by credit.", "The entry is to the expense account as shown; equity is affected only via profit later.", "This reverses the direction for an expense decrease."], "tag": "f04·Q29", "mid": "f04", "section": "Double entry rules", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A refund reduces an expense previously charged. Per the double entry summary, how is a decrease in an expense recorded?"}, {"difficulty": "easy", "options": ["The purchases ledger", "The sales ledger", "The general ledger", "The cash ledger"], "correct_index": 1, "explanations": ["The purchases ledger holds the personal accounts of suppliers (creditors), not customers.", "The sales ledger is a subsidiary ledger for the personal accounts of customers (debtors).", "The main (general) ledger holds all other double entry accounts, not the individual customer accounts.", "The slides do not list a cash ledger as a subsidiary ledger; customers' accounts sit in the sales ledger."], "tag": "f04·Q30", "mid": "f04", "section": "Ledger types", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "According to the slides, which ledger holds the personal accounts of customers?"}, {"difficulty": "hard", "options": ["GH₵5,000 credit", "GH₵2,200 debit", "GH₵2,200 credit", "GH₵8,200 credit"], "correct_index": 2, "explanations": ["This adds the returns instead of deducting them.", "The amount is right, but the firm still owes Boateng, so it is credit.", "Purchases credited 3,600 less debit note 1,400 leaves GH₵2,200 owed.", "This is the combined total owed to all suppliers after the return, not Boateng's individual balance."], "tag": "f04·Q31", "mid": "f04", "section": "Supplier account", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "On credit, the firm buys goods from Asante GH₵4,000, Boateng GH₵3,600 and Owusu GH₵2,000. It later returns goods worth GH₵1,400 to Boateng. With no payments made, what is the balance on Boateng's account?"}, {"difficulty": "hard", "options": ["Totals GH₵18,400 each; GH₵6,750 balance c/d on the debit side", "Totals GH₵18,400 each; GH₵6,750 balance c/d on the credit side", "Totals GH₵11,650 each; GH₵6,750 balance c/d on the debit side", "Totals GH₵30,050 each; GH₵6,750 balance c/d on the credit side"], "correct_index": 1, "explanations": ["The debit side is already the larger one, so the c/d goes on the credit side.", "Debits 18,400 exceed credits 11,650, so GH₵6,750 is inserted on the credit side, making both totals 18,400.", "The larger sum becomes the total of both sides, not the smaller.", "GH₵30,050 adds both sides, which is not the total of either side after balancing."], "tag": "f04·Q32", "mid": "f04", "section": "Balancing accounts", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "An account's debit entries are GH₵10,000, GH₵5,400 and GH₵3,000; its credit entries are GH₵7,650 and GH₵4,000. After balancing, what are the totals and where is the balance c/d?"}, {"difficulty": "devil", "options": ["Credits exceed debits by GH₵400 in total", "Debits exceed credits by GH₵400 in total", "The trial balance agrees as the day book is the source", "Debits exceed credits by GH₵800 in total"], "correct_index": 1, "explanations": ["The Sales credit is too low, so credits are understated.", "The Sales account is credited with a total that is GH₵400 too low, while customers' debits are right.", "The day book total feeds Sales, while individual postings go to customers; the difference shows up.", "The shortfall is GH₵400, not double that."], "tag": "f04·Q33", "mid": "f04", "section": "Credit sales", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "The sales day book total is under-added by GH₵400, but each sale is correctly posted to customers' accounts. What happens in the trial balance?"}, {"difficulty": "hard", "options": ["Debit column exceeds credit column by GH₵5,000", "Credit column exceeds debit column by GH₵5,000", "Debit column exceeds credit column by GH₵10,000", "No difference, since both sides were posted"], "correct_index": 0, "explanations": ["Debits are overstated by one extra posting of GH₵5,000, and credits are unaffected.", "The extra entry is a debit so the debit column is larger.", "The surplus is only one duplicated amount, not double.", "The double posting has no matching credit, so the trial balance would not agree."], "tag": "f04·Q34", "mid": "f04", "section": "Trial balance errors", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A debit of GH₵5,000 to Equipment is posted twice, but the corresponding credit to Bank is posted once. What is the effect on the trial balance?"}, {"difficulty": "easy", "options": ["A statement of profit for the whole year of trading", "A list of only the debit balances of expense accounts", "A list of all debit and credit balances at a point in time", "A book recording transactions in date order with narration"], "correct_index": 2, "explanations": ["That is the income statement, which is prepared from the trial balance later.", "It includes all debit and credit balances, not just expenses.", "It is usually shown in debit and credit columns, and the totals should agree.", "That is a journal; the trial balance lists ledger balances."], "tag": "f04·Q35", "mid": "f04", "section": "Trial balance", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "What is a trial balance according to the slides?"}, {"difficulty": "easy", "options": ["Date, Narration, Rate and Quantity", "Account, Journal, Balance and Total", "Day, Month, Year and Narration", "Date, Detail, Folio and Amount KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 74"], "correct_index": 3, "explanations": ["Rate and quantity columns are not part of the standard ledger account format on the slide.", "These are not the column headings used on either side of the ledger account.", "The Date column holds the date; there is no separate day, month and year layout and no Amount-free format.", "The standard two-sided account has Date, Detail, Folio and Amount on both the debit and credit sides. KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 83"], "tag": "f04·Q36", "mid": "f04", "section": "Account format", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Which four columns appear on each side of the ledger account format shown in the slides?"}, {"difficulty": "devil", "options": ["Credits exceed debits by GH₵200", "Debits exceed credits by GH₵200", "The trial balance agrees", "Credits exceed debits by GH₵700"], "correct_index": 0, "explanations": ["Overcast Sales adds 500 to credits, overcast Purchases adds 500 to debits, and the Salaries slip lowers debits by 200.", "The salaries error reduces debits, so credits end up higher.", "The two overcasts offset each other, but the GH₵200 Salaries error remains.", "This counts the full Salaries amount, not the GH₵200 shortfall."], "tag": "f04·Q37", "mid": "f04", "section": "Trial balance errors", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "The Sales account is overcast by GH₵500 and the Purchases account is also overcast by GH₵500. A Salaries debit of GH₵700 is entered as GH₵500 only. What is the net trial balance difference?"}, {"difficulty": "hard", "options": ["GH₵12,000", "GH₵10,000", "GH₵28,000", "GH₵8,000"], "correct_index": 3, "explanations": ["This adds the returns rather than deducting them.", "This ignores the opening payables or the returns, giving a wrong net figure.", "This adds all four figures with no deductions.", "3,000 + 15,000 − 2,000 − 8,000 = GH₵8,000, a credit balance."], "tag": "f04·Q38", "mid": "f04", "section": "Supplier ledger", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Opening payables GH₵3,000. Purchases day book total GH₵15,000, returns outwards day book total GH₵2,000, payments to suppliers GH₵8,000. What is the closing total owed to suppliers?"}, {"difficulty": "hard", "options": ["GH₵7,950", "GH₵7,500", "GH₵450", "GH₵7,050"], "correct_index": 3, "explanations": ["This adds the returns inwards to sales instead of deducting them.", "This ignores the returns inwards total.", "This is only the returns inwards figure.", "Sales account credit total GH₵7,500 less Returns Inwards debit total GH₵450."], "tag": "f04·Q39", "mid": "f04", "section": "Posting returns", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "The sales day book for July shows sales of GH₵2,400, GH₵3,150 and GH₵1,950. The returns inwards day book shows one credit note of GH₵450. What is the net sales figure from the two account totals?"}, {"difficulty": "hard", "options": ["GH₵52,500 credit", "GH₵52,500 debit", "GH₵67,500 credit", "GH₵57,500 credit"], "correct_index": 0, "explanations": ["Credits GH₵60,000 less debits GH₵7,500 leaves a credit balance of GH₵52,500, which is also owner's equity.", "The credits are larger so the capital balance is on the credit side.", "This adds the drawings to capital instead of deducting them.", "This deducts only GH₵2,500 of drawings, a wrong subtraction."], "tag": "f04·Q40", "mid": "f04", "section": "Balancing accounts", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Capital account: credit entries of GH₵50,000 (opening) and GH₵10,000 (added during the year); debit entry GH₵7,500 for drawings transferred. What is the balance b/d for the next period?"}, {"difficulty": "medium", "options": ["Debit, because the business receives money", "Debit, because liabilities are on the left side", "No entry, because loans are not accounts", "Credit, because an increase in a liability is credited"], "correct_index": 3, "explanations": ["The debit goes to Cash (an asset increase); the liability account itself is credited.", "Liabilities appear on the credit side of the balancing rule; a debit would reduce the loan.", "Loans have their own liability account in the ledger and require a credit.", "Liabilities increase on the credit side, which pairs with a debit to Cash."], "tag": "f04·Q41", "mid": "f04", "section": "Double entry rules", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Aunt Efua's business borrows GH₵10,000 from a bank. How is the increase in the loan liability recorded in the loan account?"}, {"difficulty": "devil", "options": ["An increase in a liability is recorded by a credit", "A decrease in equity is recorded by a debit", "A decrease in an expense is recorded by a debit", "An increase in revenue is recorded by a credit"], "correct_index": 2, "explanations": ["This matches the slide.", "This matches the slide.", "The slide says expenses increase by debit and decrease by credit, so this is false.", "This matches the slide."], "tag": "f04·Q42", "mid": "f04", "section": "Double entry rules", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Which statement about the double entry summary is FALSE?"}, {"difficulty": "medium", "options": ["Balance c/d 1 Jan 2026, then balance b/d 31 Dec 2025", "Both dated 31 December 2025 itself", "Balance c/d 31 Dec 2025, then balance b/d 1 Jan 2026", "Both dated 1 January 2026 itself KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 75"], "correct_index": 2, "explanations": ["This reverses the dates.", "b/d belongs to the new period so it carries the beginning date.", "Balance c/d takes the last day of the period and b/d the first day of the next.", "c/d belongs to the closing period so it carries the last day date."], "tag": "f04·Q43", "mid": "f04", "section": "Balancing accounts", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A business balances its ledger at the end of 31 December 2025. How should the balances be dated?"}, {"difficulty": "medium", "options": ["Liabilities and revenue", "Equity and revenue", "Liabilities and equity", "Assets and expenses"], "correct_index": 3, "explanations": ["These increase by credit, so their balances normally sit on the credit side.", "Both increase by credit, giving normal credit balances.", "Both increase by credit, giving normal credit balances.", "These increase by debit, so their balances are normally on the debit side. KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 84"], "tag": "f04·Q44", "mid": "f04", "section": "Trial balance", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "In a trial balance, which group of accounts normally has debit balances?"}, {"difficulty": "easy", "options": ["Expenses, income and capital of the business", "Possessions of all kinds, such as cash and equipment", "Persons who owe money to the business", "Persons to whom the business owes money"], "correct_index": 1, "explanations": ["That is the definition of nominal accounts on the slide.", "Real accounts record the possessions of the business of all kinds.", "Those are debtors' accounts, which are personal accounts.", "Those are creditors' accounts, which are personal accounts."], "tag": "f04·Q45", "mid": "f04", "section": "Types of accounts", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Real accounts are used for which kind of items?"}, {"difficulty": "easy", "options": ["The sales ledger", "The main ledger", "The purchases ledger", "The returns ledger"], "correct_index": 2, "explanations": ["The sales ledger is for customers' accounts, the opposite party in credit transactions.", "The main ledger covers all other double entry accounts, such as Purchases and Sales, not individual suppliers.", "The purchases ledger is a subsidiary ledger for the personal accounts of suppliers.", "There is no such subsidiary ledger on the slides; supplier accounts are kept in the purchases ledger."], "tag": "f04·Q46", "mid": "f04", "section": "Ledger types", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Which ledger is used for the personal accounts of suppliers?"}, {"difficulty": "easy", "options": ["The last day of the old period", "The first day of the new period", "The date of the first transaction in the account", "The date on which the trial balance is typed"], "correct_index": 1, "explanations": ["That is the date given to balance c/d.", "Balance b/d is dated the day beginning the period, while balance c/d is dated the last day of the period.", "The balance b/d date is fixed by the period start, not the first posting.", "The trial balance date does not determine the date of b/d."], "tag": "f04·Q47", "mid": "f04", "section": "Balancing accounts", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "What date should the balance b/d carry?"}, {"difficulty": "hard", "options": ["GH₵9,300 credit", "GH₵9,300 debit", "GH₵11,100 credit", "GH₵29,700 credit"], "correct_index": 0, "explanations": ["Credits total 12,000 + 7,500 = 19,500 and debits 1,200 + 9,000 = 10,200; the business still owes GH₵9,300.", "The credits are larger, so the balance is credit: the business owes the supplier.", "This adds the returns to the debits twice or mis-subtracts; the correct net is GH₵9,300.", "This adds the returns and payment instead of deducting them."], "tag": "f04·Q48", "mid": "f04", "section": "Supplier account", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Supplier Owusu's account in the purchases ledger: balance b/d GH₵12,000 (Cr); credit purchases GH₵7,500; goods returned (debit note) GH₵1,200; payment made GH₵9,000. What is the closing balance?"}, {"difficulty": "devil", "options": ["GH₵36,000", "GH₵44,000", "GH₵54,000", "GH₵40,000"], "correct_index": 3, "explanations": ["This wrongly treats Drawings as a credit item, reducing the debits.", "This omits the Drawings debit from the debit total.", "This is the other credits, not the figure needed to balance.", "Debits total GH₵94,000 including Drawings; credits excluding Capital total GH₵54,000, leaving GH₵40,000."], "tag": "f04·Q49", "mid": "f04", "section": "Trial balance", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Trial balance debits: Inventory GH₵20,000; Receivables GH₵14,000; Bank GH₵9,000; Rent GH₵6,000; Wages GH₵11,000; Drawings GH₵4,000; Equipment GH₵30,000. Credits: Payables GH₵13,000; Sales GH₵41,000; Capital unknown. What is Capital?"}, {"difficulty": "hard", "options": ["Debit column exceeds credit column by GH₵630", "Credit column exceeds debit column by GH₵630", "Credit column exceeds debit column by GH₵2,070", "The trial balance still agrees KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 76"], "correct_index": 1, "explanations": ["The debit entry was too small, so debits are lower.", "Debits are understated by 2,700 − 2,070 = GH₵630 while credits are correct.", "GH₵2,070 is the wrongly posted amount, not the difference.", "The two entries differ in amount, so debits no longer equal credits."], "tag": "f04·Q50", "mid": "f04", "section": "Trial balance errors", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Rent of GH₵2,700 is paid in cash. Cash is credited GH₵2,700 but Rent is debited with GH₵2,070. What is the trial balance effect?"}, {"difficulty": "medium", "options": ["Personal (debtor), real, nominal", "Nominal, personal, real", "Personal (creditor), nominal, real", "Personal (creditor), real, nominal"], "correct_index": 3, "explanations": ["Kwabena is a supplier, so the business owes him and he is a creditor, not a debtor.", "This swaps all classes; a vehicle is a possession and a supplier is a person.", "This swaps the last two; vehicles are real and salaries are nominal.", "A supplier is a personal creditor account, vehicles are possessions (real), and salaries are expenses (nominal)."], "tag": "f04·Q51", "mid": "f04", "section": "Types of accounts", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Which classification of the following three accounts is correct: Kwabena Mensah (a supplier), Motor Vehicles, Salaries?"}, {"difficulty": "easy", "options": ["Possessions of all kinds", "Customers and suppliers only", "Expenses, income and capital", "Balances brought down only"], "correct_index": 2, "explanations": ["Possessions are recorded in real accounts.", "Customers and suppliers have personal accounts, not nominal accounts.", "The slide states that nominal accounts are for expenses, income and capital.", "Balances b/d are a ledger balancing feature and not a type of account. KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 85"], "tag": "f04·Q52", "mid": "f04", "section": "Types of accounts", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Nominal accounts are kept for which items?"}, {"difficulty": "hard", "options": ["GH₵27,500", "GH₵7,500", "GH₵17,500", "GH₵77,500"], "correct_index": 2, "explanations": ["This subtracts only Capital (50,000) from debits and forgets Payables.", "This adds Payables and Capital and then Salaries wrongly, giving an incorrect plug.", "Debits total GH₵77,500; known credits GH₵60,000; the balancing credit for Sales is GH₵17,500.", "This is the full debit total, ignoring the credits already listed."], "tag": "f04·Q53", "mid": "f04", "section": "Trial balance", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Trial balance debits: Cash GH₵8,500; Receivables GH₵12,000; Inventory GH₵15,000; Equipment GH₵30,000; Rent GH₵3,000; Salaries GH₵9,000. Credits: Payables GH₵10,000; Capital GH₵50,000; Sales unknown. What sales figure makes it balance?"}, {"difficulty": "devil", "options": ["GH₵31,000", "GH₵44,000", "GH₵18,000", "GH₵49,000"], "correct_index": 0, "explanations": ["Debits: Cash 13,000 + Purchases 10,000 + Equipment 8,000 = 31,000; Credits: Capital 25,000 + Sales 6,000 = 31,000.", "This lists Cash before payments, adding GH₵13,000 twice.", "This leaves out the Cash and Purchases balances from one side.", "This adds both columns together instead of giving the total of one."], "tag": "f04·Q54", "mid": "f04", "section": "Trial balance", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Owner invests GH₵25,000 cash. Pays GH₵10,000 cash for goods (Purchases) and GH₵8,000 cash for Equipment, then makes cash sales of GH₵6,000. What is each trial balance column total?"}, {"difficulty": "easy", "options": ["Debtors' accounts and creditors' accounts", "Real accounts and nominal accounts", "Asset accounts and liability accounts", "Revenue accounts and expense accounts"], "correct_index": 0, "explanations": ["Personal accounts relate to people or firms, either those who owe the business (debtors) or those the business owes (creditors).", "Real and nominal accounts are the two kinds of impersonal accounts, not personal ones.", "These are classes by financial statement element, not the subdivisions of personal accounts on the slide.", "These are nominal accounts, which fall under impersonal accounts."], "tag": "f04·Q55", "mid": "f04", "section": "Types of accounts", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Personal accounts are subdivided into which two groups?"}, {"difficulty": "easy", "options": ["Only the personal accounts of customers who buy on credit", "Only the personal accounts of suppliers who sell on credit", "Only the nominal accounts of expenses and income of the firm", "All other double entry accounts apart from personal accounts of customers and suppliers"], "correct_index": 3, "explanations": ["Those are held in the sales ledger, a subsidiary ledger, not in the main ledger.", "Those are held in the purchases ledger, a subsidiary ledger, not in the main ledger.", "The main ledger also holds real accounts such as Cash and Equipment, so it is not limited to nominal accounts.", "The main ledger holds every double entry account not kept in the sales or purchases subsidiary ledgers, such as Cash, Sales and Rent."], "tag": "f04·Q56", "mid": "f04", "section": "Ledger types", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "What is the main (general) ledger used for?"}, {"difficulty": "hard", "options": ["A debit of GH₵2,500 was omitted from the ledger", "A credit of GH₵2,500 was omitted from the ledger", "A GH₵2,500 sale was omitted from both day book and ledger", "A GH₵2,500 expense was debited to the wrong expense account"], "correct_index": 1, "explanations": ["This would reduce the debit total and give credits higher.", "The credit total is GH₵2,500 short when the credit side of an entry is left out.", "Omitting the whole transaction leaves both columns equal and creates no difference.", "The amount would remain in the debit column, so totals would agree."], "tag": "f04·Q57", "mid": "f04", "section": "Trial balance errors", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "A trial balance has debits of GH₵94,300 and credits of GH₵91,800. Which error would fully explain the difference?"}, {"difficulty": "medium", "options": ["Both sides of a transaction were left out of the ledger", "A debit was posted but no corresponding credit was made", "A sale was credited to the wrong revenue account", "A purchase was debited to the wrong supplier KNUST · ACF 255 / DBA 239 Financial Accounting 1 · Practice Question Bank 77"], "correct_index": 1, "explanations": ["Omitting the entire transaction keeps debits equal to credits.", "The slide states a trial balance helps check whether each debit had a corresponding credit.", "Credit still equals debit, so the trial balance would still agree.", "Totals still agree because the amount is on the right side."], "tag": "f04·Q58", "mid": "f04", "section": "Trial balance", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "Which of the following errors would be detected by the trial balance totals not agreeing?"}, {"difficulty": "easy", "options": ["Each sale separately, as a debit", "The total only, as a credit", "Each sale separately, as a credit", "The total only, as a debit"], "correct_index": 1, "explanations": ["Individual sales are posted to customers' accounts; the Sales account receives only the total, and on the credit side.", "Each sale is posted separately to the customer's account, while only the total goes to the Sales account.", "Posting every sale individually to Sales is not done; only the day book total goes to Sales.", "Sales is revenue, so its increase is credited, not debited."], "tag": "f04·Q59", "mid": "f04", "section": "Credit sales", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "In posting credit sales from the sales day book, what is posted to the Sales account in the general ledger?"}, {"difficulty": "medium", "options": ["Credit the Returns Outwards account with GH₵3,400", "Debit the Returns Outwards account with GH₵3,400", "Credit each supplier's account in the general ledger", "Debit the Returns Inwards account with GH₵3,400"], "correct_index": 0, "explanations": ["The slide shows the total only going to the Returns Outwards account, on the credit side.", "Debit would treat returns outwards like an expense; it is a credit-balance account.", "Supplier accounts are in the purchases ledger and are debited for returns.", "Returns Inwards relates to customers' returns, not goods sent back to suppliers."], "tag": "f04·Q60", "mid": "f04", "section": "Posting returns", "qt": "single best", "source": "KNUST_Financial_Accounting_1_Question_Bank.pdf", "qc": "The returns outwards day book totals GH₵3,400 for the month. How is this total posted in the general ledger?"}]};

function beep(f,d,type,g,delay=0){
 if(!AC||!set.sound)return;
 try{const t=AC.currentTime+delay,o=AC.createOscillator(),v=AC.createGain();

 v.gain.setValueAtTime(0.0001,t);v.gain.linearRampToValueAtTime((g||.12)*set.vol,t+.012);

}

/* ====== EUPHEME voice packs ====== */
const PLAIN={ok:"Correct.",no:"Not quite."};
const stripNote=s=>String(s).replace(/\s*\([^()]*\)\s*$/,"");
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pools=new Map(),lastLine=new Map();
function packDraw(pack,slot,arr){
 const key=pack+":"+slot;let pool=pools.get(key);
 if(!pool||!pool.length){
  pool=shuffle(arr.slice());
  const last=lastLine.get(key);
  if(last&&pool.length>1){pool=pool.filter(l=>l!==last);pool.push(last)}
  pools.set(key,pool)}
 const line=pool.shift();lastLine.set(key,line);return line;
}
const streakSlot=n=>n>=19?"streak19plus":n>=11?"streak11_18":n===10?"streak10":n>=7?"streak7_9":n>=5?"streak5_6":n>=3?"streak3_4":"streak1_2";
const packByNum=n=>PACKS.find(p=>p.num===n);
function ePack(){
 if(set.pack>=1&&set.pack<=PACKS.length)return packByNum(set.pack);
 if(set.pack===999)return packByNum(1+Math.floor(Math.random()*PACKS.length));
 return null}
function eupOk(q,streak){
 const p=ePack();if(!p)return null;
 const sl=p.slots;let slot;
 if(q.easyMiss&&Math.random()<.25)slot="easyMiss";
 else if(q.difficulty==="hard"||q.difficulty==="devil")slot="hardCorrect";
 else slot=streakSlot(streak);
 let line=packDraw(p.num,slot,sl[slot]||[])||PLAIN.ok;line=stripNote(line);
 if(slot==="streak11_18"&&line.includes(", ")){const notes=line.split(/,\s?/);line=notes[(streak-11)%notes.length]}
 return line}
function eupNo(q,attempt,broken,recovering){
 const p=ePack();if(!p)return null;
 const sl=p.slots;let slot;
 if(recovering)slot="recovering";
 else if(broken)slot="streakBroken";
 else slot=attempt===1?"wrong1":attempt===2?"wrong2":attempt===3?"wrong3":"wrong4plus";
 let line=stripNote(packDraw(p.num,slot,sl[slot]||[])||PLAIN.no);
 if(slot==="wrong4plus"&&attempt>3&&/slides again/i.test(line)){
  line="I think you should "()+"really ".repeat(attempt-4)+"read the slides again."}
 return line}
function gradeLine(g){
 const p=ePack();if(!p)return null;
 const gr=p.slots.grades;const v=gr&&gr[g];return v?stripNote(v):null;
}

function newRun(mid,sectionIdx){
 ROOM_LOADED="";
 const m=modOf(mid);
 const k=sectionIdx===undefined?-1:sectionIdx;
 const sec=(m.sections||[])[k];
 const list=[];
 if(!sec){for(let i=m.first;i<m.first+m.count;i++)list.push(i)}
 else{for(let i=m.first+sec.from;i<m.first+sec.from+sec.count;i++)list.push(i)}

    a:list.map(()=>null),cs:0,ws:0,msg:"",end:0,rv:null,done:false,list,flags:{},started:Date.now()};

function resumeRun(mid){

 if(Array.isArray(d.order)&&d.order.length&&d.order.every(i=>Number.isInteger(i)&&i>=m.first&&i<m.first+m.count)){
   d.order.forEach(i=>list.push(i))}
  else if(Number.isInteger(d.q0)&&d.q1>d.q0&&d.q0>=m.first&&d.q1<=m.first+m.count){
   for(let i=d.q0;i<d.q1;i++)list.push(i)}
  else{for(let i=m.first;i<m.first+m.count;i++)list.push(i)}
 const a=Array.isArray(d.a)&&d.a.length===list.length?d.a:list.map(()=>null);
 R={mid,label:d.label||"Full module",mode:d.mode||"explain",secIdx:Number.isInteger(d.sec)?d.sec:-1,
    i:Math.min(d.i||0,list.length-1),far:Math.min(d.far||0,list.length-1),a,cs:d.cs||0,ws:d.ws||0,
    msg:d.msg||"",end:d.end||0,rv:null,done:false,list,started:Date.now(),flags:d.flags||{}};
 screen="quiz";
 if(R.end&&R.end<Date.now()){clearInterval(T);screen="results"}
 else if(R.end){clearInterval(T);T=setInterval(tick,1000)}
 draw(1);return true;
}
function finishRun(){
 R.done=true;delSave(R.mid);
 let s=0;R.a.forEach((a,i)=>{if(a===QALL[R.list[i]].correct_index)s++});
 const n=R.list.length,p=Math.round(s/n*100);
 const entries=LS.g("board",[]);
 entries.push({mid:R.mid,sec:R.label,name:set.name||"Guest",score:s,n,pct:p,mode:R.mode==="explain"?"Explain":"Exam",at:Date.now()});
 while(entries.length>400)entries.shift();
 LS.s("board",entries);
 return {s,p};
}

function judge(q,ok){
 let line=null;
 if(ok){
  const pw=R.ws,n=R.cs+1;
  R.cs=n;R.ws=0;
  if(pw>=RECOVER_MIN){
   line=eupNo(q,n,n<1?1:n,"",true);
   if(set.sound)sfx.streak();
   return line||PLAIN.ok;
  }
  line=eupOk(q,n);
  if(set.sound){sfx.ok();if(n===10||n===19)sfx.streak()}
  return line||PLAIN.ok;
 }
 const attempt=R.ws+1,pc=R.cs,broken=pc>=BREAK_MIN;
 R.ws=attempt;R.cs=0;
 line=eupNo(q,attempt,broken,false);
 if(set.sound)sfx.no();
 return line||PLAIN.no;
}

    start: function (k, def, cb) { key = k; steps = def.steps; i = 0; onEnd = cb || null; try { window.CDCoachActive = true; } catch (e) {} draw(); },

    stop: end
  };
