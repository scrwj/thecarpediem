 hearing loss.\nD: Moderate is 41-55 dB."},{"id":"med-v2-034","module":"v2","type":"mcq","q":"Which of the following is the composition of maltose?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["Glucose + Glucose","Galactose + Glucose","Fructose + Galactose","Glucose + Fructose"],"answer":"Glucose + Glucose","solution":"A: Glucose plus glucose forms maltose.\nB: Galactose plus glucose forms lactose.\nC: Fructose plus galactose is not maltose.\nD: Glucose plus fructose forms sucrose."},{"id":"med-v7-005","module":"v7","type":"mcq","q":"A statistic is best defined as:","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/ZANIPOLO stas pasco.PDF | SLIDE 1","difficulty":"Hard","options":["the entire population","a type of sampling frame","a characteristic of a population","a characteristic of a sample"],"answer":"a characteristic of a sample","solution":"A: The population is the whole group, not a characteristic.\nB: A sampling frame is a list, not a characteristic.\nC: A population characteristic is called a parameter.\nD: A statistic describes a sample drawn from the population."},{"id":"med-v3-022","module":"v3","type":"mcq","q":"Which of the following statements concerning common alcohols is correct?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 1","difficulty":"Devil Mode","options":["wood alcohol and grain alcohol are one and the same","absolute alcohol is pure methanol","rubbing alcohol is pure methyl alcohol","absolute ethanol has all water removed from it"],"answer":"absolute ethanol has all water removed from it","solution":"A: Wood and grain alcohol are methanol and ethanol, not the same.\nB: Absolute alcohol is ethanol with water removed, not methanol.\nC: Rubbing alcohol is usually isopropanol, not pure methanol.\nD: Absolute ethanol has all water removed."},{"id":"med-v3-023","module":"v3","type":"mcq","q":"The functional group present in carboxylic acids is called a","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 1","difficulty":"Devil Mode","options":["carbonyl group","carboxylate group","carbohydroxyl group","carboxyl group"],"answer":"carboxyl group","solution":"A: A carbonyl group alone is not the carboxylic acid group.\nB: Carboxylate is the ionised form, not the functional group name.\nC: Carbohydroxyl is not a recognised group name.\nD: The carboxyl group, COOH, defines carboxylic acids."},{"id":"med-v2-035","module":"v2","type":"mcq","q":"Proteins constitute what percentage of the dry weight of cells?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 1","difficulty":"Medium","options":["75%","25%","10%","50%"],"answer":"50%","solution":"A: Seventy-five percent overstates the protein fraction.\nB: Twenty-five percent is too low for dry-weight protein content.\nC: Ten percent is far below the protein content of dry cell mass.\nD: Proteins make up about half of the dry weight of cells."},{"id":"med-v2-036","module":"v2","type":"mcq","q":"Thymine is also referred to as","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 2","difficulty":"Medium","options":["5-methyl uracil","3-methyl uracil","5-phenyl cytosine","5-methyl cytosine"],"answer":"5-methyl uracil","solution":"A: Thymine is 5-methyl uracil.\nB: 3-methyl uracil is not thymine.\nC: 5-phenyl cytosine is not thymine.\nD: 5-methyl cytosine is a different modified base."},{"id":"med-v2-037","module":"v2","type":"mcq","q":"In the lac operon system, what happens when lactose is absent?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 3","difficulty":"Medium","options":["RNA polymerase binds to the promoter","The repressor is inactivated","The active repressor binds to the operator, turning the operon off","Enzymes for lactose processing are synthesized"],"answer":"The active repressor binds to the operator, turning the operon off","solution":"A: RNA polymerase binding alone is not the outcome when lactose is absent.\nB: The repressor is active, not inactivated, without lactose.\nC: Without lactose the active repressor binds the operator and switches the operon off.\nD: Enzymes are not synthesised when lactose is absent."},{"id":"med-v7-006","module":"v7","type":"mcq","q":"”How would you describe the atmosphere of the lecture hall?” (Followed by a blank text box). This is:","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 3","difficulty":"Medium","options":["A closed-ended question","An open-ended question","A semantic differential item","A ranking question"],"answer":"An open-ended question","solution":"A: A closed-ended question supplies fixed options.\nB: An open-ended question with a blank box lets respondents answer freely.\nC: A semantic differential uses bipolar scales.\nD: A ranking question asks for an order."},{"id":"med-v3-024","module":"v3","type":"mcq","q":"Statements: (1) Hydrogen bonding is not possible between carboxylic acid molecules. (2) The alpha-carbon atom in a carboxylic acid is the carbon atom to which the carboxyl group is attached. (3) Sodium butanoate and ethyl butanoate are both examples of esters","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 10","difficulty":"Hard","options":["Two of the three statements are true","All three statements are true","None of the statements is true","Only one of the statements is true"],"answer":"None of the statements is true","solution":"A: Only one statement is true.\nB: Carboxylic acids do hydrogen bond, the alpha-carbon definition is correct, but sodium butanoate is a salt not an ester.\nC: None of the listed combinations is fully correct, so this option is keyed.\nD: Two true overcounts."},{"id":"med-v2-038","module":"v2","type":"mcq","q":"In an enzyme-catalyzed reaction, the specific substance upon which an enzyme acts is known as the:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 1","difficulty":"Hard","options":["Modulator","Effector","Coenzyme","Substrate"],"answer":"Substrate","solution":"A: A modulator regulates enzyme activity rather than being converted.\nB: An effector binds regulatory sites rather than being the acted-upon substrate.\nC: A coenzyme is an organic helper molecule, not the reactant being transformed.\nD: The substrate is the specific substance an enzyme acts upon."},{"id":"med-v1-012","module":"v1","type":"mcq","q":"The difference in lipid and protein composition between the membranes of the endomembrane system is largely determined by","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 5","difficulty":"Hard","options":["the modification of the membrane components once they reach their final destination","the function of the Golgi apparatus in sorting membrane components","the transportation of membrane among the endomembrane system by small membrane vesicles","the physical separation of most membranes from each other"],"answer":"the function of the Golgi apparatus in sorting membrane components","solution":"A: Final modification occurs after sorting and is not the primary determinant.\nB: The Golgi sorts and modifies membrane components, determining their final composition.\nC: Vesicle traffic moves membrane components but is not the main determinant of their composition.\nD: Physical separation alone does not create compositional differences."},{"id":"med-v2-039","module":"v2","type":"mcq","q":"A sequence of three bases in mRNA that specifies a particular amino acid is called a:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 4","difficulty":"Hard","options":["Anticodon","Cistron","Codon","Intron"],"answer":"Codon","solution":"A: An anticodon is the complementary triplet on tRNA.\nB: A cistron is a genetic unit, not a three-base mRNA sequence.\nC: A codon is a three-base mRNA sequence specifying an amino acid.\nD: An intron is a non-coding sequence removed from RNA."},{"id":"med-v7-007","module":"v7","type":"mcq","q":"Which sampling method selects every kth element from a population list?","source":"Medicine/HB1 First Semester/Statistical Methods/Slides/bluman statistics.pdf | SLIDE 60","difficulty":"Devil Mode","options":["simple random sampling","systematic sampling","cluster sampling","stratified sampling"],"answer":"systematic sampling","solution":"A: Random sampling uses chance selection for each element.\nB: Systematic sampling selects every kth element using a fixed interval.\nC: Cluster sampling selects whole groups or clusters.\nD: Stratified sampling divides the population into strata first."},{"id":"med-v7-008","module":"v7","type":"fill","q":"For a Poisson distribution with mean 2, the probability of exactly zero events is e^-2. Give the numerical value rounded to 3 decimal places. (Answer as a decimal.)","source":"Medicine/HB1 First Semester/Statistical Methods/Slides/Random Variables.pdf | SLIDE 1","difficulty":"Devil Mode","answer":"0.135","solution":"For a Poisson distribution P(0) = e^-2, which is approximately 0.135 when rounded to three decimal places."},{"id":"med-v4-021","module":"v4","type":"mcq","q":"What does an ellipsis (...) indicate in the description of a function’s argu- ments?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 2","difficulty":"Medium","options":["That the function requires text instead of numbers","That a space must be included","That the function is currently broken","That more arguments are possible"],"answer":"That more arguments are possible","solution":"A: It does not restrict arguments to text.\nB: It does not require a space.\nC: An ellipsis does not indicate a broken function.\nD: An ellipsis means more arguments can be supplied."},{"id":"med-v7-009","module":"v7","type":"fill","q":"How many permutations are there of 4 distinct objects? (Answer as a number.)","source":"Medicine/HB1 First Semester/Statistical Methods/Slides/PERMUTATIONS AND COMBINATIONS A VERY QUICK REVIEW.pdf | SLIDE 1","difficulty":"Medium","answer":"24","solution":"The number of permutations is 4 factorial, which equals 24."},{"id":"med-v2-040","module":"v2","type":"mcq","q":"Why is DNA more chemically stable than RNA?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 3","difficulty":"Medium","options":["DNA is double-stranded","DNA contains thymine instead of uracil","DNA lacks the 2’-OH group, making it resistant to base-catalyzed hydrolysis","DNA is found in the nucleus"],"answer":"DNA lacks the 2’-OH group, making it resistant to base-catalyzed hydrolysis","solution":"A: Double strandedness is not the chemical reason for stability.\nB: Thymine vs uracil is not the main chemical stability factor.\nC: DNA lacks the 2'-OH group and resists base-catalysed hydrolysis.\nD: Nuclear location is not a chemical reason."},{"id":"med-v3-025","module":"v3","type":"mcq","q":"Statements: (1) Long-chain alcohols are generally more soluble in water than short-chain alcohols. (2) The compound ethyl methyl ether contains two alkoxy groups. (3) Rubbing alcohol is a 50-50 mixture by volume of isopropyl alcohol and water","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 8","difficulty":"Medium","options":["Two of the three statements are true","All three statements are true","None of the statements is true","Only one of the statements is true"],"answer":"Two of the three statements are true","solution":"A: None of the three statements is true.\nB: Long-chain alcohols are less soluble, ethyl methyl ether has one alkoxy group, and rubbing alcohol is about seventy percent isopropanol.\nC: All true is wrong.\nD: One true is wrong."},{"id":"med-v2-041","module":"v2","type":"mcq","q":"Which of the following is not a fibrous protein?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 2","difficulty":"Hard","options":["Fibrinogen","Keratin","Carbonic anhydrase","Collagen"],"answer":"Carbonic anhydrase","solution":"A: Fibrinogen is a fibrous blood-clotting protein.\nB: Keratin is a fibrous protein of hair and skin.\nC: Carbonic anhydrase is a soluble globular enzyme, not a fibrous protein.\nD: Collagen is a classic fibrous structural protein."},{"id":"med-v2-042","module":"v2","type":"mcq","q":"The forms of DNA are I. A, II. B, III. C, IV. D","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 1","difficulty":"Hard","options":["I and II","I only","III and IV","III only"],"answer":"I and II","solution":"A: A and B are recognised forms of DNA.\nB: A form of DNA alone is not the complete set.\nC: D is not a standard DNA form listed here.\nD: C form alone is incomplete."},{"id":"med-v2-043","module":"v2","type":"mcq","q":"Which molecule acts as a common second messenger in the mobilization of glycogen?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 4","difficulty":"Hard","options":["GTP","cAMP","ATP","Calcium"],"answer":"cAMP","solution":"A: GTP is used in signalling and translation, not this pathway.\nB: cAMP is the second messenger that triggers glycogen mobilisation.\nC: ATP is an energy currency, not the glycogen-mobilising messenger here.\nD: Calcium is a messenger in muscle but not the one cited here."},{"id":"med-v4-022","module":"v4","type":"mcq","q":"Where can you find a description of what a specific function does while using the Insert Function tool?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 4","difficulty":"Hard","options":["In the Excel title bar","In the lower part of the Insert Function dialog box","On the status bar at the bottom of the screen","By right-clicking the cell"],"answer":"In the lower part of the Insert Function dialog box","solution":"A: The title bar shows the file name.\nB: The Insert Function dialog shows a description of the selected function in its lower part.\nC: The status bar does not describe functions.\nD: Right-clicking a cell gives a context menu."},{"id":"med-v2-044","module":"v2","type":"mcq","q":"Irreversible inhibitors typically decrease enzyme activity by:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 3","difficulty":"Devil Mode","options":["Competing with the substrate for weak non-covalent binding","Increasing the Km without affecting Vmax","Altering the pH of the reaction environment","Forming stable covalent bonds with functional groups in the active site"],"answer":"Forming stable covalent bonds with functional groups in the active site","solution":"A: Weak non-covalent competition is reversible competitive inhibition.\nB: Increasing Km without changing Vmax describes competitive inhibition.\nC: Changing pH is not the mechanism of irreversible inhibition.\nD: Irreversible inhibitors form stable covalent bonds with active-site groups."},{"id":"med-v3-026","module":"v3","type":"mcq","q":"The ester obtained by reacting benzyl alcohol and benzoic acid is called","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 4","difficulty":"Devil Mode","options":["benzyl benzoate","benzyl benzene","benzyl benzate","phenyl benzoate"],"answer":"benzyl benzoate","solution":"A: The ester formed is benzyl benzoate.\nB: Benzyl benzene is not the ester of benzyl alcohol and benzoic acid.\nC: Benzyl benzate is not a correct name.\nD: Phenyl benzoate comes from phenol, not benzyl alcohol."},{"id":"med-v3-027","module":"v3","type":"mcq","q":"In which of the following pairs of carboxylic acids are both members of the pair dicarboxylic acids?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 6","difficulty":"Medium","options":["oxalic acid and acetic acid","more than one correct response","glutaric acid and butyric acid","malonic acid and succinic acid"],"answer":"malonic acid and succinic acid","solution":"A: Acetic acid is monocarboxylic, so this pair fails.\nB: Only one pair qualifies, so more than one is wrong.\nC: Butyric acid is monocarboxylic, so this pair fails.\nD: Both malonic acid and succinic acid are dicarboxylic acids."},{"id":"med-v5-006","module":"v5","type":"mcq","q":"Which pair illustrates phonological ambiguity through homophones?","source":"Medicine/HB1 First Semester/Communication skills/ambiguity ppt.pdf | SLIDE 5","difficulty":"Medium","options":["bank / bank","fast / slow","table / chair","write / right"],"answer":"write / right","solution":"A: Bank/bank is a homonym, not a homophone example here.\nB: Fast and slow are antonyms.\nC: Table and chair are unrelated words.\nD: Write and right sound the same but differ in meaning, so they are homophones."},{"id":"med-v1-013","module":"v1","type":"mcq","q":"Cells of the pancreas will incorporate radioactively labeled amino acids into proteins. This ʺtaggingʺ of newly synthesized proteins enables a researcher to track their location. In this case, we are tracking an enzyme secreted by pancreatic cells. What is its most likely pathway?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 15","difficulty":"Medium","options":["ER → Golgi → vesicles that fuse with plasma membrane","Golgi → ER → lysosome","nucleus → ER → Golgi","ER → Golgi → nucleus"],"answer":"ER → Golgi → vesicles that fuse with plasma membrane","solution":"A: The enzyme goes ER to Golgi to secretory vesicles that fuse with the plasma membrane.\nB: The Golgi acts after the ER, so this order is reversed.\nC: Protein synthesis occurs on the ER, not by transcription in the nucleus alone.\nD: Secreted proteins are not routed to the nucleus."},{"id":"med-v4-023","module":"v4","type":"mcq","q":"Which function would you use to calculate the number of days between two dates based on a year consisting of twelve 30-day months?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 6","difficulty":"Medium","options":["DAYS360()","DAY()","NETWORKDAYS()","YEARFRAC()"],"answer":"DAYS360()","solution":"A: DAYS360 computes days between dates using twelve 30-day months.\nB: DAY returns the day of a date.\nC: NETWORKDAYS counts working days.\nD: YEARFRAC returns a fraction of a year."},{"id":"med-v4-024","module":"v4","type":"mcq","q":"In financial functions, what does the argument ”nper” represent?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 8","difficulty":"Hard","options":["The monthly payment amount","The total number of payment periods","The annual interest rate","The present value of the loan"],"answer":"The total number of payment periods","solution":"A: The payment amount is the pmt argument.\nB: Nper is the total number of payment periods.\nC: The interest rate is the rate argument.\nD: Present value is the pv argument."},{"id":"med-v2-045","module":"v2","type":"mcq","q":"Enzymes that exist in different quaternary forms but catalyze the same reaction are called:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 4","difficulty":"Hard","options":["Holoenzymes","Isoenzymes (Isozymes)","Modulators","Zymogens"],"answer":"Isoenzymes (Isozymes)","solution":"A: Holoenzymes are active enzyme-cofactor complexes.\nB: Isoenzymes are different molecular forms catalysing the same reaction.\nC: Modulators regulate enzyme activity.\nD: Zymogens are inactive precursors."},{"id":"med-v1-014","module":"v1","type":"mcq","q":"Organelles other than the nucleus that contain DNA include","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 8","difficulty":"Hard","options":["ribosomes","chloroplasts","mitochondria","B and C only"],"answer":"B and C only","solution":"A: Ribosomes contain rRNA but no DNA, so they are excluded.\nB: Chloroplasts do contain DNA but this answer is also incomplete.\nC: Mitochondria do contain DNA but this answer is incomplete.\nD: Both mitochondria and chloroplasts contain their own DNA, while ribosomes do not."},{"id":"med-v3-028","module":"v3","type":"mcq","q":"Which of the following statements concerning the acid strength of carboxylic acids is correct?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 2","difficulty":"Hard","options":["all are weak acids","aromatic acids are strong and nonaromatic acids are weak","their acid strength is equal that of strong mineral acid such as HCl","unbrached acids are strong"],"answer":"all are weak acids","solution":"A: Carboxylic acids are all weak acids rather than strong mineral acids.\nB: Aromatic acids are not generally strong in this class.\nC: They are not as strong as HCl.\nD: Branching does not make them strong acids."},{"id":"med-v4-025","module":"v4","type":"mcq","q":"To delete text to the left of the cursor, use the key; to delete to the right, use the key","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 5","difficulty":"Devil Mode","options":["Backspace; Delete","Delete; Backspace","Shift; Tab","Ctrl; Alt"],"answer":"Backspace; Delete","solution":"A: Backspace deletes to the left and Delete to the right of the cursor.\nB: Backspace deletes left of the cursor and Delete deletes right, so this is reversed.\nC: Shift and Tab are navigation keys, not deletion keys.\nD: Ctrl and Alt are modifier keys, not deletion keys."},{"id":"med-v6-005","module":"v6","type":"mcq","q":"Sounds below the range of human hearing are called:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 7","difficulty":"Devil Mode","options":["hypersound","infrasound","supersound","ultrasound"],"answer":"infrasound","solution":"A: Hypersound is not the standard term used here.\nB: Infrasound refers to frequencies below human hearing.\nC: Supersound is not the standard term.\nD: Ultrasound is above, not below, the range."},{"id":"med-v4-026","module":"v4","type":"mcq","q":"Which formatting tool allows you to copy all formats from one cell and apply them to another?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 9","difficulty":"Medium","options":["Format Painter","Wrap Text","Merge and Center","AutoFormat"],"answer":"Format Painter","solution":"A: Format Painter copies all formatting from one cell to another.\nB: Wrap Text controls line wrapping.\nC: Merge and Center combines cells, not formats.\nD: AutoFormat applies preset table formats, not cell-by-cell copying."},{"id":"med-v2-046","module":"v2","type":"mcq","q":"Approximately how many reactions are catalyzed by distinct enzymes in sequential metabolic steps?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 1","difficulty":"Medium","options":["Over 100","Over 2,000","Over 1,000","Over 500"],"answer":"Over 2,000","solution":"A: Over one hundred is far too low for the number of distinct enzymatic steps.\nB: The source key gives over two thousand distinct enzyme-catalysed reactions.\nC: Over one thousand is below the stated figure.\nD: Over five hundred still understates the count."},{"id":"med-v3-029","module":"v3","type":"mcq","q":"Statements: (1) Hydrolysis of a mixed acid anhydride produces two different carboxylic acids as products. (2) Short-chain unsubstituted monocarboxylic acids are strong acids while their longer-chain counterparts are weak acids. (3) The parent alcohol for the ester methyl acetate is methyl alcohol","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 10","difficulty":"Medium","options":["None of the statements is true","Only one of the statements is true","Two of the three statements are true","All three statements are true"],"answer":"Two of the three statements are true","solution":"A: All true is wrong.\nB: One true undercounts.\nC: Two statements are true.\nD: Mixed anhydrides give two different acids, short-chain acids are weak not strong, and methyl acetate comes from methanol."},{"id":"med-v3-030","module":"v3","type":"mcq","q":"For which of the following alcohol oxidations is the listed oxidation product incorrect?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 6","difficulty":"Medium","options":["primary alcohol; aldehyde","more than one correct response E) no correct response","secondary alcohol; ketone","tertiary alcohol; carboxylic acid"],"answer":"tertiary alcohol; carboxylic acid","solution":"A: A primary alcohol does oxidise to an aldehyde.\nB: Only one product listing is incorrect.\nC: A secondary alcohol does oxidise to a ketone.\nD: A tertiary alcohol resists oxidation and does not give a carboxylic acid."},{"id":"med-v2-047","module":"v2","type":"mcq","q":"Which sugar is the primary monosaccharide found in DNA?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 2","difficulty":"Hard","options":["Deoxyribose","Galactose","Ribose","Fructose"],"answer":"Deoxyribose","solution":"A: Deoxyribose is the monosaccharide in DNA.\nB: Galactose is a milk sugar component.\nC: Ribose is the sugar in RNA.\nD: Fructose is a dietary fruit sugar."},{"id":"med-v5-007","module":"v5","type":"mcq","q":"The best way to avoid structural ambiguity is to:","source":"Medicine/HB1 First Semester/Communication skills/ambiguity ppt.pdf | SLIDE 11","difficulty":"Hard","options":["use only homophones","shorten every sentence to one word","add more adjectives","rephrase so modification and reference are clear"],"answer":"rephrase so modification and reference are clear","solution":"A: Homophones create ambiguity rather than remove it.\nB: One-word sentences cannot convey complex meaning.\nC: More adjectives can increase ambiguity.\nD: Clarifying what each phrase modifies resolves structural ambiguity."},{"id":"med-v4-027","module":"v4","type":"mcq","q":"What is the primary difference between using a calculator and using Excel for computations?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 1","difficulty":"Hard","options":["Calculators can handle more data at once","Calculators are more accurate","Excel requires users to write their own mathematical definitions for every task","Excel allows the use of predefined functions that simplify complex data processing"],"answer":"Excel allows the use of predefined functions that simplify complex data processing","solution":"A: Calculators handle less data at once than spreadsheets.\nB: Calculators are not inherently more accurate than Excel.\nC: Excel users do not need to define every mathematical operation themselves.\nD: Excel provides predefined functions that simplify complex data processing."},{"id":"med-v3-031","module":"v3","type":"mcq","q":"The correct IUPAC name for CH OH CH3 CH3 is","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 1","difficulty":"Hard","options":["2-propanol","2-methyl ethanol","isopropyl alcohol","hydroxypropane"],"answer":"2-propanol","solution":"A: 2-propanol is the correct IUPAC name for this secondary alcohol.\nB: 2-methyl ethanol is not the correct IUPAC form.\nC: Isopropyl alcohol is a common, not IUPAC, name.\nD: Hydroxypropane is not the systematic name."},{"id":"med-v2-048","module":"v2","type":"mcq","q":"Lactose is produced via a/an","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 4","difficulty":"Devil Mode","options":["α(1 →4) glycosidic linkage between β-D- galactose and β-D-glucose","β(1 →4) glycosidic linkage between β-D- galactose and either α-D-glucose or β-D- glucose","α glycosidic linkage between α-D-galactose and β-D-glucose (1 →4)","β(1 →4) glycosidic linkage between α-D- galactose and either α-D-glucose or β-D- glucose"],"answer":"β(1 →4) glycosidic linkage between β-D- galactose and either α-D-glucose or β-D- glucose","solution":"A: Milking the alpha(1 to 4) linkage and beta-galactose is wrong.\nB: Lactose has a beta(1 to 4) linkage between beta-D-galactose and glucose.\nC: An alpha linkage with alpha-galactose is not lactose's structure.\nD: Alpha-D-galactose with a beta linkage is not the described form."},{"id":"med-v2-049","module":"v2","type":"mcq","q":"A fatty acid is considered ”saturated” if:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 2","difficulty":"Devil Mode","options":["All carbon-carbon bonds are single bonds","It has a cyclic structure","It contains at least one double bond","It is soluble in water"],"answer":"All carbon-carbon bonds are single bonds","solution":"A: A saturated fatty acid has only single carbon-carbon bonds.\nB: Saturation does not require a cyclic structure.\nC: Double bonds make a fatty acid unsaturated, not saturated.\nD: Water solubility is not the criterion for saturation."},{"id":"med-v3-032","module":"v3","type":"mcq","q":"The common name for the C5 unbranched dicarboxylic acid is","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 1","difficulty":"Medium","options":["glutaric acid","pimelic acid","adipic acid","succinic acid"],"answer":"glutaric acid","solution":"A: Glutaric acid is the C5 unbranched dicarboxylic acid.\nB: Pimelic acid is the C7 dicarboxylic acid.\nC: Adipic acid is the C6 unbranched dicarboxylic acid.\nD: Succinic acid is the C4 dicarboxylic acid."},{"id":"med-v2-050","module":"v2","type":"mcq","q":"In mammals, the G-C content of DNA typically ranges between:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 3","difficulty":"Medium","options":["75% to 85%","50% to 60%","20% to 30%","39% to 46%"],"answer":"39% to 46%","solution":"A: 75-85% is far too high.\nB: 50-60% is above the usual range.\nC: 20-30% is below the typical mammalian G-C range.\nD: Mammalian DNA typically has 39-46% G-C content."},{"id":"med-v4-028","module":"v4","type":"mcq","q":"Which character is NOT allowed in an Excel file name?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 3","difficulty":"Medium","options":["Underscore ( )","Parenthesis ( )","Question mark (?)","Dash (-)"],"answer":"Question mark (?)","solution":"A: Underscores are allowed in file names.\nB: Parentheses are allowed.\nC: Question marks are not allowed in Windows file names.\nD: Dashes are allowed."},{"id":"med-v3-033","module":"v3","type":"mcq","q":"Statements: (1) The compound ethanoic acid contains two carbon atoms and two oxygen atoms. (2) Unsubstituted short-chain monocarboxylic acids are completely miscible with water. (3) The two reactants in an esterification reaction are a carboxylic acid and an aldehyde","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 9","difficulty":"Medium","options":["All three statements are true","None of the statements is true","Two of the three statements are true","Only one of the statements is true"],"answer":"Two of the three statements are true","solution":"A: Ethanoic acid has two carbons and two oxygens, short-chain acids are miscible with water, but esterification uses an acid and an alcohol, not an aldehyde.\nB: All true is wrong because the esterification statement fails.\nC: Two statements are true.\nD: One true undercounts."},{"id":"med-v7-010","module":"v7","type":"mcq","q":"In a 5-point Likert scale, what does the middle value (3) usually represent?","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 3","difficulty":"Hard","options":["Not Applicable","Strongly Disagree","Strongly Agree","Neutral or Undecided"],"answer":"Neutral or Undecided","solution":"A: Not Applicable is usually a separate option.\nB: Strongly Disagree is an endpoint, not the middle.\nC: Strongly Agree is the opposite endpoint.\nD: The midpoint of a five-point Likert scale is neutral or undecided."},{"id":"med-v2-051","module":"v2","type":"mcq","q":"In the ninhydrin reaction, a positive result for most amino acids is indicated by the formation of a purple product known as:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 2","difficulty":"Hard","options":["Protoporphyrin","Ruhemann’s Purple","Hydrindantin","Ellman’s reagent"],"answer":"Ruhemann’s Purple","solution":"A: Protoporphyrin is a haem precursor, not a ninhydrin product.\nB: Ninhydrin reaction with amino acids yields Ruhemann's Purple.\nC: Hydrindantin is a reagent intermediate, not the purple product.\nD: Ellman's reagent detects sulfhydryl groups, not ninhydrin products."},{"id":"med-v2-052","module":"v2","type":"mcq","q":"By convention, the amino acid sequence of a polypeptide is read from which end to which end?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 4","difficulty":"Hard","options":["C-terminal to N-terminal","R-group to alpha-carbon","N-terminal to C-terminal","Left to right based on weight"],"answer":"N-terminal to C-terminal","solution":"A: Sequences are not conventionally written C-terminal first.\nB: R-group to alpha-carbon is not a sequence direction.\nC: Amino acid sequences are read from N-terminal to C-terminal.\nD: Molecular weight does not set reading direction."},{"id":"med-v7-011","module":"v7","type":"mcq","q":"What is ”Acquiescence Bias”?","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 3","difficulty":"Hard","options":["The tendency to skip sensitive questions","The tendency to provide the same answer for all questions in a grid","The tendency to choose the middle option on a scale","The tendency to agree with all statements regardless of content"],"answer":"The tendency to agree with all statements regardless of content","solution":"A: Skipping sensitive questions is another bias.\nB: Giving identical answers across a grid is a different response style.\nC: Choosing the middle option is central tendency bias.\nD: Acquiescence bias is the tendency to agree with statements regardless of content."},{"id":"med-v4-029","module":"v4","type":"mcq","q":"Which chart subtype compares the percentage each value contributes to a total across categories?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 7","difficulty":"Devil Mode","options":["100% Stacked Column","Stacked Column","3-D Column","Clustered Column"],"answer":"100% Stacked Column","solution":"A: 100% stacked columns show each value's percentage contribution to the total.\nB: Stacked columns show totals with component sizes.\nC: 3-D columns add visual depth only.\nD: Clustered columns compare values side by side."},{"id":"med-v2-053","module":"v2","type":"mcq","q":"The specific site on the enzyme where substrates bind and catalysis occurs is known as the","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 2","difficulty":"Devil Mode","options":["Binding site","Allosteric site","Active site","Catalytic site"],"answer":"Active site","solution":"A: Binding site is a broader term than the specific catalytic location.\nB: Allosteric site is a regulatory site away from the active site.\nC: The active site is where substrate binds and catalysis occurs.\nD: Catalytic site alone omits the binding aspect."},{"id":"med-v3-034","module":"v3","type":"mcq","q":"Intramolecular dehydration of an alcohol produces a(n)","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 2","difficulty":"Medium","options":["thiol","alkene","alkane","ether"],"answer":"alkene","solution":"A: Thiols contain sulfur and are not dehydration products.\nB: Intramolecular dehydration of an alcohol produces an alkene.\nC: Dehydration removes water to form an alkene, not an alkane.\nD: Intermolecular dehydration can give an ether, not intramolecular."},{"id":"med-v1-015","module":"v1","type":"mcq","q":"The advantage of light microscopy over electron microscopy is that","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 1","difficulty":"Medium","options":["light microscopy allows one to view dynamic processes in living cells","light microscopy provides for higher resolving power than electron microscopy","A and B","light microscopy provides for higher magnification than electron microscopy"],"answer":"light microscopy allows one to view dynamic processes in living cells","solution":"A: Light microscopy can image living, dynamic cells, whereas electron microscopy needs vacuum and dead, fixed samples.\nB: Electron beams have far shorter wavelengths, giving much greater resolving power; this statement is false.\nC: Both A and B are false claims, so this combined option cannot be right.\nD: Electron microscopes achieve far higher magnification, so this is not light microscopy's advantage."},{"id":"med-v1-016","module":"v1","type":"mcq","q":"Which of the following contains enzymes that transfer hydrogen from various substrates to oxygen?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 7","difficulty":"Medium","options":["lysosome","peroxisome","mitochondrion","vacuole"],"answer":"peroxisome","solution":"A: Lysosomes contain hydrolases, not hydrogen-transferring oxidases.\nB: Peroxisomes contain enzymes that transfer hydrogen from substrates to oxygen.\nC: Mitochondria use electron transport but the described hydrogen-to-oxygen transfer is peroxisomal.\nD: Vacuoles are storage compartments without these enzymes."},{"id":"med-v7-012","module":"v7","type":"mcq","q":"Which type of bias is most likely when asking respondents about illegal or stigmatized behaviors?","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 2","difficulty":"Medium","options":["Central tendency bias","Recall bias","Social desirability bias","Acquiescence bias"],"answer":"Social desirability bias","solution":"A: Central tendency bias is choosing mid-scale options.\nB: Recall bias concerns memory accuracy.\nC: Social desirability bias leads to under-reporting of stigmatised behaviours.\nD: Acquiescence is agreement tendency, not specific to sensitive acts."},{"id":"med-v3-035","module":"v3","type":"mcq","q":"Ethers may be viewed as derivatives of water in which both hydrogen atoms have been replaced with","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 6","difficulty":"Hard","options":["more than one correct response E) no correct response","alkoxy groups","hydrocarbon groups","hydroxyl groups"],"answer":"hydrocarbon groups","solution":"A: Only one answer fits.\nB: Alkoxy groups define acetals rather than simple ethers.\nC: Ethers are water derivatives in which both hydrogens are replaced by hydrocarbon groups.\nD: Replacing with hydroxyl groups would give peroxides or similar species."},{"id":"med-v4-030","module":"v4","type":"mcq","q":"What is the purpose of the PRODUCT() function?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 6","difficulty":"Hard","options":["To multiply all its arguments","To divide the first argument by the second","To find the average of the arguments","To add all arguments together"],"answer":"To multiply all its arguments","solution":"A: PRODUCT multiplies all of its arguments.\nB: Division is not PRODUCT's purpose.\nC: Averages are computed by AVERAGE.\nD: Addition is performed by SUM, not PRODUCT."},{"id":"med-v7-013","module":"v7","type":"fill","q":"The scores 10, 20, 30 have a mean of 20. Find the sample standard deviation rounded to one decimal place. (Answer as a number.)","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/ZANIPOLO stas pasco.PDF | SLIDE 1","difficulty":"Hard","answer":"10","solution":"Squared deviations from the mean are 100, 0, 100, summing to 200; dividing by n-1 = 2 gives 100, whose square root is 10."},{"id":"med-v3-036","module":"v3","type":"mcq","q":"Statements: (1) Cyclic hemiacetals are usually more stable than noncyclic hemiacetals. (2) A carbonyl group consists of a carbon atom and an oxygen atom joined by a double bond. (3) The compound benzaldehyde contain six carbon atoms","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 8","difficulty":"Hard","options":["None of the statements is true","Only one of the statements is true","Two of the three statements are true","All three statements are true"],"answer":"Two of the three statements are true","solution":"A: None being true is wrong.\nB: Only one statement being true is wrong because two are correct.\nC: Two statements are true: the stability of cyclic hemiacetals and the carbonyl definition.\nD: Cyclic hemiacetals are more stable, but benzaldehyde has seven carbons, so not all three are true."},{"id":"med-v2-054","module":"v2","type":"mcq","q":"Without using the mouse or the arrow keys, what is the fastest way of getting to cell A1 in a spreadsheet?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 15","difficulty":"Devil Mode","options":["Press Home","Press Shift + Home","Press Alt + Home","Press Ctrl +Home"],"answer":"Press Ctrl +Home","solution":"A: Home moves to the beginning of the current row only.\nB: Shift+Home selects cells to the start of the row.\nC: Alt+Home is not the standard shortcut for A1.\nD: Ctrl+Home jumps directly to cell A1 in a spreadsheet."},{"id":"med-v2-055","module":"v2","type":"mcq","q":"Which sugar is a component of RNA and various coenzymes?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 3","difficulty":"Devil Mode","options":["Xylose","Ribose","Erythrose","2-Deoxyribose"],"answer":"Ribose","solution":"A: Xylose is a dietary pentose.\nB: Ribose is present in RNA and in coenzymes such as NAD and FAD.\nC: Erythrose is a four-carbon sugar.\nD: Deoxyribose is the sugar of DNA."},{"id":"med-v6-006","module":"v6","type":"mcq","q":"Post-lingual deafness is characterised by:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 13","difficulty":"Medium","options":["only occurring in infants","having acquired spoken language before hearing diminished","never having acquired spoken language","an inability to use hearing aids"],"answer":"having acquired spoken language before hearing diminished","solution":"A: It is not confined to infants.\nB: In post-lingual deafness speech was acquired before hearing loss.\nC: Never acquiring speech is prelingual.\nD: Hearing aids may still help some post-lingual people."},{"id":"med-v2-056","module":"v2","type":"mcq","q":"Which chemical test gives a blue color in the presence of starch?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 4","difficulty":"Medium","options":["Bial’s test","Molisch’s test","Iodine test","Benedict’s test"],"answer":"Iodine test","solution":"A: Bial's test detects pentoses.\nB: Molisch's test detects carbohydrates generally.\nC: The iodine test gives a blue colour with starch.\nD: Benedict's test detects reducing sugars."},{"id":"med-v2-057","module":"v2","type":"mcq","q":"Which component is present in a nucleotide but absent in a nucleoside?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 1","difficulty":"Medium","options":["Nitrogenous base","Phosphodiester bond","Pentose sugar","Phosphate group"],"answer":"Phosphate group","solution":"A: A nitrogenous base is found in both molecules.\nB: A phosphodiester bond joins nucleotides in a chain rather than defining a single nucleotide.\nC: Pentose sugar is present in both nucleotides and nucleosides.\nD: A nucleotide is a nucleoside plus a phosphate group, so phosphate is the distinguishing component."},{"id":"med-v1-017","module":"v1","type":"mcq","q":"The mitochondrion, like the nucleus, has two or more membrane layers. How is the innermost of these layers different from that of the nucleus?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 9","difficulty":"Medium","options":["The space between the two layers of the nuclear membrane is larger","The inner mitochondrial membrane is highly folded","The two membranes are biochemically very different","The inner membrane of the mitochondrion is separated out into thylakoids"],"answer":"The inner mitochondrial membrane is highly folded","solution":"A: The perinuclear space is not the distinguishing feature asked for.\nB: The inner mitochondrial membrane is folded into cristae, unlike the smooth inner nuclear membrane.\nC: Both organelle membranes are biochemically specialised, so this is not the key structural difference.\nD: Thylakoids occur in chloroplasts, not mitochondria."},{"id":"med-v5-008","module":"v5","type":"mcq","q":"A 'double-barreled' question is one that:","source":"Medicine/HB1 First Semester/Communication skills/ambiguity ppt.pdf | SLIDE 2","difficulty":"Hard","options":["asks about past events","asks about two issues in one item","uses two negatives","offers only yes and no options"],"answer":"asks about two issues in one item","solution":"A: A double-barreled question combines two distinct issues into one item, making the answer hard to interpret.\nB: That describes a dichotomous question.\nC: Recall questions ask about past events.\nD: Two negatives create a double-negative problem."},{"id":"med-v3-037","module":"v3","type":"mcq","q":"Statements: (1) In a “dial” two aldehyde groups are present. (2) Formaldehyde readily participates in polymer formation. (3) Primary alcohol oxidation is a method for producing ketones","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 9","difficulty":"Hard","options":["Only one of the statements is true","None of the statements is true","All three statements are true","Two of the three statements are true"],"answer":"Two of the three statements are true","solution":"A: Only one true is wrong.\nB: None true is wrong.\nC: A dial does contain two aldehyde groups, but primary alcohol oxidation does not give ketones.\nD: Two statements are true: the dial definition and formaldehyde's polymerisation tendency."},{"id":"med-v1-018","module":"v1","type":"mcq","q":"A newspaper ad for a local toy store indicates that a very inexpensive microscope available for a small child is able to magnify specimens nearly as much as the much more costly microscope available in your college lab. What is the primary reason for the price difference?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 2","difficulty":"Hard","options":["The college microscope produces greater contrast in the specimens","The toy microscope magnifies a good deal, but has low resolution and therefore poor quality images","The ad agency is misrepresenting the ability of the toy microscope to magnify","The toy microscope does not have the same fine control for focus of the specimen"],"answer":"The toy microscope magnifies a good deal, but has low resolution and therefore poor quality images","solution":"A: Greater contrast is not the primary reason for the cost gap.\nB: The toy microscope magnifies but has poor resolution, so images lack detail and quality.\nC: The ad need not be exaggerating; magnification claims can be genuine.\nD: Fine focus affects usability, not the decisive price difference."},{"id":"med-v1-019","module":"v1","type":"mcq","q":"In animal cells, hydrolytic enzymes are packaged to prevent general destruction of cellular components. Which of the following organelles functions in this compartmentalization?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 5","difficulty":"Hard","options":["peroxisome","lysosome","chloroplast","central vacuole"],"answer":"lysosome","solution":"A: Peroxisomes handle oxidative reactions, not general hydrolytic enzyme packaging.\nB: Lysosomes compartmentalise hydrolytic enzymes that would otherwise damage the cell.\nC: Chloroplasts carry out photosynthesis, not hydrolytic digestion.\nD: The central vacuole stores water and ions in plants."},{"id":"med-v4-031","module":"v4","type":"mcq","q":"Which feature is used to sort data based on more than one column?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 8","difficulty":"Devil Mode","options":["Consolidate","Filter","Custom Sort","AutoFilter"],"answer":"Custom Sort","solution":"A: Consolidation combines data from multiple sheets.\nB: Filter displays rows meeting criteria rather than multi-column ordering.\nC: Custom Sort allows sorting by more than one column.\nD: AutoFilter is a basic filter control."},{"id":"med-v7-014","module":"v7","type":"mcq","q":"Which of the following is a ”Dichotomous” question?","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 2","difficulty":"Devil Mode","options":["Rate your experience from 1 to 10","What is your favorite time to study?","Which department do you belong to?","Have you ever used the university counseling services? (Yes / No)"],"answer":"Have you ever used the university counseling services? (Yes / No)","solution":"A: A 1-to-10 rating is a scale, not dichotomous.\nB: Asking a favourite time is open-ended.\nC: Asking department yields many categories.\nD: A yes/no item on ever using counselling services is dichotomous."},{"id":"med-v2-058","module":"v2","type":"mcq","q":"How does compartmentation serve a regulatory function?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 4","difficulty":"Medium","options":["By eliminating the need for enzymes","Through the selective permeability of membranes to metabolites","By increasing the speed of diffusion","By changing the shape of the enzymes"],"answer":"Through the selective permeability of membranes to metabolites","solution":"A: Compartmentation does not remove the need for enzymes.\nB: Selective membrane permeability controls metabolite access and thus regulates pathways.\nC: Diffusion speed is not the regulatory basis.\nD: Changing enzyme shape is not how compartments regulate pathways."},{"id":"med-v3-038","module":"v3","type":"mcq","q":"Esters are produced through the reaction of","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 3","difficulty":"Medium","options":["a ketone and an ether","an aldehyde and a phenol","a carboxylic acid and a ketone","a carboxylic acid and an alcohol"],"answer":"a carboxylic acid and an alcohol","solution":"A: Ketones and ethers do not react to give esters.\nB: Aldehydes plus phenols do not give esters.\nC: Carboxylic acid plus ketone is not esterification.\nD: Esters form from a carboxylic acid and an alcohol."},{"id":"med-v3-039","module":"v3","type":"mcq","q":"Which of the following statements concerning the oxidation of aldehydes and ketones is correct?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 3","difficulty":"Medium","options":["ketones are resitant to oxidation and aldehydes readily undergo oxidation","both aldehydes and ketones readily undergo oxidation","both aldehydes and ketones are resistant to oxidation","ketones readily undergo oxidation"],"answer":"ketones are resitant to oxidation and aldehydes readily undergo oxidation","solution":"A: Aldehydes oxidise readily while ketones resist oxidation.\nB: Both being readily oxidised is false because ketones resist.\nC: Aldehydes are not resistant, so the last option is wrong.\nD: Ketones are not readily oxidised."},{"id":"med-v2-059","module":"v2","type":"mcq","q":"Which of the following is an essential fatty acid that mammals must obtain from their diet?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["Oleic acid","Linoleic acid","Palmitic acid","Stearic acid"],"answer":"Linoleic acid","solution":"A: Oleic acid is a nonessential monounsaturated fatty acid.\nB: Linoleic acid is an essential fatty acid that mammals must obtain from diet.\nC: Palmitic acid is synthesised by mammals.\nD: Stearic acid is a saturated fatty acid the body can synthesise."},{"id":"med-v2-060","module":"v2","type":"mcq","q":"Which terpene derivative is a precursor to Vitamin A?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 4","difficulty":"Hard","options":["Limonene","Menthol","β-Carotene","Lycopene"],"answer":"β-Carotene","solution":"A: Limonene is a citrus terpene.\nB: Menthol is a mint terpene.\nC: Beta-carotene is the terpene precursor of vitamin A.\nD: Lycopene is a red carotenoid pigment, not the direct vitamin A precursor cited."},{"id":"med-v4-032","module":"v4","type":"mcq","q":"Which part of an Excel function must always follow the equal sign (=) immediately?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 2","difficulty":"Hard","options":["The function name","The first argument","The opening parenthesis","A cell reference"],"answer":"The function name","solution":"A: The function name immediately follows the equals sign.\nB: Arguments follow the function name, not the equals sign directly.\nC: The opening parenthesis comes after the function name.\nD: A cell reference alone is not a function."},{"id":"med-v4-033","module":"v4","type":"mcq","q":"Which of the following is a standard way to start PowerPoint 2013?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 1","difficulty":"Hard","options":["Use the search bar in the Start menu to find ”PowerPoint”","Press the F5 key while the computer is booting up","Right-click the desktop and select ”New Slide”","Double-click any image file on the computer"],"answer":"Use the search bar in the Start menu to find ”PowerPoint”","solution":"A: Searching the Start menu for PowerPoint is a standard way to launch it.\nB: F5 at boot is not a launch method.\nC: Right-clicking the desktop creates files, not a running application.\nD: Double-clicking an image opens an image viewer."},{"id":"med-v2-061","module":"v2","type":"mcq","q":"Right clicking something in Excel:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 18","difficulty":"Hard","options":["Selects the object","Deletes the object","Nothing the right mouse button is there for left handed people","Opens a shortcut menu listing everything you can do to the object"],"answer":"Opens a shortcut menu listing everything you can do to the object","solution":"A: Left-clicking, not right-clicking, selects an object.\nB: Right-clicking does not delete the object.\nC: The right button is not reserved for left-handed users.\nD: Right-clicking opens a context-sensitive shortcut menu."},{"id":"med-v2-062","module":"v2","type":"mcq","q":"Which nitrogenous base is defined as 5-methyl uracil?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 2","difficulty":"Devil Mode","options":["Cytosine","Thymine","Guanine","Adenine"],"answer":"Thymine","solution":"A: Cytosine is not 5-methyl uracil.\nB: Thymine is 5-methyl uracil.\nC: Guanine is a purine with a different structure.\nD: Adenine is a purine, not a methylated uracil."},{"id":"med-v4-034","module":"v4","type":"mcq","q":"What is a ”Legend” in an Excel chart?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 5","difficulty":"Devil Mode","options":["The data points themselves","The X-axis labels","A guide that explains symbols, patterns, or colors","The title of the chart"],"answer":"A guide that explains symbols, patterns, or colors","solution":"A: Data points are the plotted values themselves.\nB: X-axis labels show categories, not the legend.\nC: A legend explains the symbols, patterns or colours used in a chart.\nD: The chart title names the chart, not the key to symbols."},{"id":"med-v2-063","module":"v2","type":"mcq","q":"Which nitrogenous base is primarily found in DNA but not in RNA?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["Uracil","Adenine","Guanine","Thymine"],"answer":"Thymine","solution":"A: Uracil is found in RNA, not DNA.\nB: Adenine occurs in both.\nC: Guanine occurs in both nucleic acids.\nD: Thymine is the base primarily found in DNA rather than RNA."},{"id":"med-v2-064","module":"v2","type":"mcq","q":"Which of the following amino acids carries a net positive charge at physiological pH?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 3","difficulty":"Medium","options":["Leucine","Isoleucine","Valine","None of the above"],"answer":"None of the above","solution":"A: Leucine is also neutral and nonpolar.\nB: Isoleucine is neutral and nonpolar.\nC: Valine is nonpolar and uncharged at physiological pH.\nD: None of the listed amino acids is positively charged at physiological pH."},{"id":"med-v1-020","module":"v1","type":"mcq","q":"Cells can be described as having a cytoskeleton of internal structures that contribute to the shape, organization, and movement of the cell. Which of the following are part of the cytoskeleton?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 10","difficulty":"Medium","options":["microfilaments","lysosomes","mitochondria","the nuclear envelope"],"answer":"microfilaments","solution":"A: Microfilaments are one of the three cytoskeletal filament systems.\nB: Lysosomes are digestive vesicles, not cytoskeletal components.\nC: Mitochondria are organelles, not part of the cytoskeleton.\nD: The nuclear envelope is a membrane, not a cytoskeletal element."},{"id":"med-v1-021","module":"v1","type":"mcq","q":"A cell has the following molecules and structures: enzymes, DNA, ribosomes, plasma membrane, and mitochondria. It could be a cell from","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 8","difficulty":"Medium","options":["a plant, but not an animal","a plant or an animal","a bacterium","an animal, but not a plant"],"answer":"a plant or an animal","solution":"A: Mitochondria occur in plants too, so 'plant only' is wrong.\nB: The listed features are shared by both plant and animal cells.\nC: A bacterium cannot be correct because the cell has mitochondria.\nD: Mitochondria occur in both animal and plant cells, so 'animal only' is wrong."},{"id":"med-v4-035","module":"v4","type":"mcq","q":"What happens to the automatic page breaks when you set manual page breaks?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 9","difficulty":"Hard","options":["They turn red","They are overridden and repositioned automatically","They prevent the file from being saved","They are deleted"],"answer":"They are overridden and repositioned automatically","solution":"A: Break lines do not turn red.\nB: Manual page breaks override and reposition the automatic ones.\nC: Setting breaks does not block saving.\nD: Automatic breaks are not deleted when manual ones are set."},{"id":"med-v4-036","module":"v4","type":"mcq","q":"Which chart type is commonly used for scientific, statistical, and engi- neering data?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 6","difficulty":"Hard","options":["Stock","Doughnut","Column","XY (Scatter)"],"answer":"XY (Scatter)","solution":"A: Stock charts show price movements.\nB: Doughnut charts show proportions.\nC: Column charts compare discrete categories.\nD: XY scatter charts are standard for scientific, statistical and engineering data."},{"id":"med-v4-037","module":"v4","type":"mcq","q":"Which function returns the absolute value of a number (the number with- out its sign)?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 6","difficulty":"Hard","options":["TRUNC()","INT()","SIGN()","ABS()"],"answer":"ABS()","solution":"A: TRUNC truncates to a given number of digits.\nB: INT returns the integer part by rounding down.\nC: SIGN returns the sign of a number.\nD: ABS returns the absolute value, removing the sign."},{"id":"med-v3-040","module":"v3","type":"mcq","q":"Which of the following is a product of the acid hydrolysis of the following compound? C H CH2 CH3 OH O CH3","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 7","difficulty":"Hard","options":["propanone","ethyl alcohol","methyl alcohol","more than one correct response E) no correct response"],"answer":"methyl alcohol","solution":"A: Propanone is not a hydrolysis product of this ester.\nB: Ethyl alcohol is not the alcohol part of this ester.\nC: Acid hydrolysis of the shown ester releases methyl alcohol.\nD: Only one product is correct."},{"id":"med-v8-009","module":"v8","type":"mcq","q":"The determinant of the 2x2 matrix [[a,b],[c,d]] is:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 8.pdf | SLIDE 1","difficulty":"Devil Mode","options":["ad - bc","ab + cd","ac - bd","ab - cd"],"answer":"ad - bc","solution":"A: The determinant of a 2x2 matrix equals ad minus bc.\nB: That is not the determinant formula.\nC: That is not the determinant formula.\nD: That does not match the standard formula."},{"id":"med-v2-065","module":"v2","type":"mcq","q":"Ligation reactions form bonds by using free energy derived from:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 2","difficulty":"Devil Mode","options":["Solar energy","ATP cleavage","The movement of electrons","The addition of water"],"answer":"ATP cleavage","solution":"A: Solar energy is not used in cellular ligation.\nB: Ligation reactions are driven by ATP cleavage.\nC: Electron movement is redox, not ligation.\nD: Water addition is hydrolysis, not ligation."},{"id":"med-v1-022","module":"v1","type":"mcq","q":"Which of the following are capable of converting light energy to chemical energy?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 8","difficulty":"Medium","options":["peroxisomes","leucoplasts","mitochondria","chloroplasts"],"answer":"chloroplasts","solution":"A: Peroxisomes do not capture light energy.\nB: Leucoplasts are colourless storage plastids without photosynthesis.\nC: Mitochondria release chemical energy from food, not from light.\nD: Chloroplasts convert light energy into chemical energy during photosynthesis."},{"id":"med-v5-009","module":"v5","type":"mcq","q":"A question that suggests the answer the researcher wants is called:","source":"Medicine/HB1 First Semester/Communication skills/ambiguity ppt.pdf | SLIDE 2","difficulty":"Medium","options":["a filter question","a leading question","a dichotomous question","an open-ended question"],"answer":"a leading question","solution":"A: A filter question routes respondents to relevant items.\nB: A leading question suggests a desired answer through its wording.\nC: A dichotomous question simply offers two options.\nD: Open-ended questions allow free answers."},{"id":"med-v2-066","module":"v2","type":"mcq","q":"All the following are characteristics of membrane transporters except they","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 1","difficulty":"Medium","options":["Display saturation kinetics","Have a high degree of structural and stere- ospecificity","Always transport molecules along a concen- tration gradient","Facilitate the movement of molecules through the membrane at a very fast rate"],"answer":"Always transport molecules along a concen- tration gradient","solution":"A: Transporters display saturation kinetics like enzymes.\nB: Transporters show structural and stereospecificity.\nC: Not all transporters move solutes down a gradient; active transporters work against it.\nD: Transporters do facilitate rapid movement across membranes."},{"id":"med-v8-010","module":"v8","type":"mcq","q":"For a set A with elements {1,2}, which statement is true?","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 1.pdf | SLIDE 16","difficulty":"Medium","options":["{1} is both an element and a subset of P(A)","{1} is neither an element nor a subset of P(A)","{1} is a subset of P(A)","{1} is an element of P(A)"],"answer":"{1} is an element of P(A)","solution":"A: It is an element but not a subset of P(A).\nB: It is definitely an element of the power set.\nC: {1} is a subset of A, not of its power set.\nD: Because P(A) contains {1} as one of its members, {1} is an element of P(A)."},{"id":"med-v1-023","module":"v1","type":"mcq","q":"Which is one of the main energy transformers of cells?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 7","difficulty":"Hard","options":["mitochondrion","vacuole","lysosome","Golgi apparatus"],"answer":"mitochondrion","solution":"A: Mitochondria are the principal energy transformers of aerobic cells.\nB: Vacuoles store water and solutes rather than making ATP.\nC: Lysosomes digest material and do not transform energy.\nD: The Golgi processes and packages molecules, not energy conversion."},{"id":"med-v4-038","module":"v4","type":"mcq","q":"Which command allows you to change the layout of a slide that already exists?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 3","difficulty":"Hard","options":["Design (on the Transitions tab)","New Slide","Layout (on the Home tab)","Reset"],"answer":"Layout (on the Home tab)","solution":"A: Design on Transitions is not the layout control.\nB: New Slide adds a slide rather than changing a layout.\nC: The Layout command on the Home tab changes an existing slide's layout.\nD: Reset restores placeholder formatting."},{"id":"med-v3-041","module":"v3","type":"mcq","q":"The IUPAC name for the ester is","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 4","difficulty":"Hard","options":["methyl butyl ester","methyl carboxybutane","butyl methanoate","methyl butanoate"],"answer":"methyl butanoate","solution":"A: Methyl butyl ester is not systematic nomenclature.\nB: Methyl carboxybutane is not a valid ester name.\nC: Butyl methanoate has a four-carbon alcohol part, not this ester.\nD: Methyl butanoate is the correct IUPAC name."},{"id":"med-v8-011","module":"v8","type":"mcq","q":"If A = {2, 4, 8}, then n(A) equals:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 1.pdf | SLIDE 12","difficulty":"Hard","options":["2","3","4","8"],"answer":"3","solution":"A: Two undercounts the elements.\nB: The set has three elements, so its cardinality is 3.\nC: Four overcounts the elements.\nD: Eight is an element, not the cardinality."},{"id":"med-v2-067","module":"v2","type":"mcq","q":"Which enzyme is responsible for splitting the α(1 →6) glycosidic linkages at branch points in starch?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 4","difficulty":"Devil Mode","options":["Lactase","α-amylase","Starch phosphorylase","α(1 →6)-glucosidase"],"answer":"α(1 →6)-glucosidase","solution":"A: Lactase hydrolyses lactose, not starch branches.\nB: Alpha-amylase cleaves internal alpha(1 to 4) bonds, not branch points.\nC: Starch phosphorylase acts on alpha(1 to 4) linkages.\nD: Alpha(1 to 6)-glucosidase splits the branch-point linkages."},{"id":"med-v3-042","module":"v3","type":"mcq","q":"Statements: (1) The compound 4-oxobutanoic acid contains both a carboxyl group and a carbonyl group. (2) Aldehyde oxidation is a method for preparing a carboxylic acid. (3) Both IUPAC and common names for esters consist of two words","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 9","difficulty":"Devil Mode","options":["All three statements are true","Two of the three statements are true","Only one of the statements is true","None of the statements is true"],"answer":"All three statements are true","solution":"A: 4-oxobutanoic acid has both carboxyl and carbonyl groups, aldehyde oxidation gives acids, and ester names use two words, so all three are true.\nB: Two true undercounts the correct statements.\nC: Only one true undercounts them.\nD: None true is wrong."},{"id":"med-v2-068","module":"v2","type":"mcq","q":"Which organelle is responsible for the citric acid cycle and oxidative phosphorylation?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["Endoplasmic reticulum","Mitochondria","Ribosomes","Golgi complex"],"answer":"Mitochondria","solution":"A: The ER synthesises proteins and lipids, not the citric acid cycle.\nB: The mitochondria host the citric acid cycle and oxidative phosphorylation.\nC: Ribosomes synthesise proteins.\nD: The Golgi modifies and sorts proteins."},{"id":"med-v1-024","module":"v1","type":"mcq","q":"A primary objective of cell fractionation is to","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 1","difficulty":"Medium","options":["determine the size of various organelles","separate the major organelles so that their particular functions can be determined","view the structure of cell membranes","identify the enzymes outside the organelles"],"answer":"separate the major organelles so that their particular functions can be determined","solution":"A: Estimating organelle size is incidental, not the primary objective.\nB: Cell fractionation separates organelles so each one's specific function can be studied.\nC: Viewing membrane structure is microscopy's role, not fractionation's objective.\nD: Identifying extracellular enzymes is not the main aim of fractionating cells."},{"id":"med-v2-069","module":"v2","type":"mcq","q":"Terpenes are lipids formed from repeating five-carbon units called:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 4","difficulty":"Medium","options":["Glycerol","Isoprene","Acetate","Sterol"],"answer":"Isoprene","solution":"A: Glycerol is the backbone of fats, not terpene units.\nB: Terpenes are built from repeating five-carbon isoprene units.\nC: Acetate units build fatty acids and sterols via other pathways.\nD: Sterols are derived from terpenes, not the repeating unit."},{"id":"med-v2-070","module":"v2","type":"mcq","q":"What is the preferred method for the analysis of amino acid composition because it is less destruc- tive to specific residues?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 3","difficulty":"Medium","options":["Acid hydrolysis","Alcoholysis","Alkaline hydrolysis","Enzymatic digestion"],"answer":"Acid hydrolysis","solution":"A: Acid hydrolysis is the preferred, less destructive method for amino acid composition analysis here.\nB: Alcoholysis is not the standard method.\nC: Alkaline hydrolysis destroys many residues.\nD: Enzymatic digestion is incomplete for full composition."},{"id":"med-v1-025","module":"v1","type":"mcq","q":"Plasmodesmata in plant cells are most similar in function to which of the following structures in animal cells?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 13","difficulty":"Hard","options":["peroxisomes","desmosomes","gap junctions","extracellular matrix"],"answer":"gap junctions","solution":"A: Peroxisomes are oxidative vesicles, not intercellular channels.\nB: Desmosomes mechanically anchor adjacent cells.\nC: Gap junctions directly connect animal cell cytoplasms, like plasmodesmata in plants.\nD: The extracellular matrix is not a direct cytoplasmic channel."},{"id":"med-v4-039","module":"v4","type":"mcq","q":"How do you ”explode” a slice in a Pie chart?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 6","difficulty":"Hard","options":["Double-click the whole chart","Change the chart type to 3-D","Select the individual slice and drag it away from the center","Right-click and select ”Explode”"],"answer":"Select the individual slice and drag it away from the center","solution":"A: Double-clicking the chart does not explode a single slice.\nB: Changing to 3-D does not explode a slice.\nC: Selecting an individual slice and dragging it outward explodes it.\nD: There is no standard Explode right-click command for one slice."},{"id":"med-v3-043","module":"v3","type":"mcq","q":"Which of the following compounds could not be oxidized to a carboxylic acid?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 6","difficulty":"Hard","options":["2-methyl-1-propanol","more than one correct response","propanal","2-methyl-2-propanol"],"answer":"2-methyl-2-propanol","solution":"A: 2-methyl-1-propanol is a primary alcohol and oxidises to an acid.\nB: Only one compound fails to oxidise, so more than one is wrong.\nC: Propanal is an aldehyde and oxidises to propanoic acid.\nD: 2-methyl-2-propanol is tertiary and cannot be oxidised to a carboxylic acid."},{"id":"med-v2-071","module":"v2","type":"mcq","q":"Which class of lipids is defined as esters of fatty acids with higher molecular weight monohydric alcohols?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 1","difficulty":"Hard","options":["Steroids","True fats","Waxes","Phospholipids"],"answer":"Waxes","solution":"A: Steroids have a fused ring structure and are not fatty acid esters.\nB: True fats are tri-esters of glycerol and fatty acids.\nC: Waxes are esters of fatty acids with high-molecular-weight monohydric alcohols.\nD: Phospholipids contain a phosphate group in addition to fatty acids."},{"id":"med-v2-072","module":"v2","type":"mcq","q":"Which sugar is commonly referred to as table sugar?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 3","difficulty":"Devil Mode","options":["Sucrose","Lactose","Isomaltose","Maltose"],"answer":"Sucrose","solution":"A: Sucrose is common table sugar.\nB: Lactose is milk sugar.\nC: Isomaltose is a branched glucose disaccharide.\nD: Maltose is malt sugar."},{"id":"med-v6-007","module":"v6","type":"mcq","q":"A hard-of-hearing person typically:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 9","difficulty":"Devil Mode","options":["communicates through spoken language and may benefit from hearing aids","has no hearing at all","depends only on sign language","cannot use captioning"],"answer":"communicates through spoken language and may benefit from hearing aids","solution":"A: Hard of hearing people use spoken language and benefit from aids and captioning.\nB: They have partial, not zero, hearing.\nC: Depending only on sign language describes many deaf people, not the hard of hearing.\nD: Captioning is one of the aids they can benefit from."},{"id":"med-v6-008","module":"v6","type":"mcq","q":"Hearing loss involving both the outer/middle ear and the inner ear is called:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 15","difficulty":"Medium","options":["conductive","sensorineural","central","mixed"],"answer":"mixed","solution":"A: Conductive involves only outer or middle ear.\nB: Sensorineural involves only inner ear or nerve.\nC: Central loss involves the CNS pathways.\nD: Mixed loss combines conductive and sensorineural components."},{"id":"med-v2-073","module":"v2","type":"mcq","q":"Lowering pH to about 3 or increasing it to about 12 can cause DNA to denature due to","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 2","difficulty":"Medium","options":["Strong intermolecular bonding","pH disturbance","Disruption of the sugar phosphate back- bone","Protonation and deprotonation"],"answer":"Protonation and deprotonation","solution":"A: Strong intermolecular bonding would stabilise, not denature, DNA.\nB: pH disturbance is too vague a description.\nC: The sugar-phosphate backbone stays intact at these pH values.\nD: Extreme pH protonates or deprotonates bases, disrupting hydrogen bonding and denaturing DNA."},{"id":"med-v3-044","module":"v3","type":"mcq","q":"Which of the following compounds is a constitutional isomer of 2-pentanone?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 6","difficulty":"Medium","options":["isopropyl methyl ketone","3-methyl-2-pentanone","3-methyl-2-butanone","more than one correct response E) no correct response"],"answer":"more than one correct response E) no correct response","solution":"A: Isopropyl methyl ketone is also 3-methyl-2-butanone, another isomer.\nB:
