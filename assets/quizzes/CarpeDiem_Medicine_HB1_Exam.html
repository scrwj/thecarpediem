 3-methyl-2-pentanone has six carbons, not an isomer of 2-pentanone.\nC: 3-methyl-2-butanone is a five-carbon ketone isomer.\nD: More than one listed compound is an isomer, so that option is correct."},{"id":"med-v2-074","module":"v2","type":"mcq","q":"In ion-exchange chromatography, resins containing positive charges that attract negatively charged solutes are called:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 3","difficulty":"Medium","options":["Cation exchangers","Affinity resins","Size exclusion resins","Anion exchangers"],"answer":"Anion exchangers","solution":"A: Cation exchangers carry negative charges and bind cations.\nB: Affinity resins bind specific ligands.\nC: Size exclusion separates by molecular size.\nD: Anion exchangers carry positive charges and attract negatively charged solutes."},{"id":"med-v8-012","module":"v8","type":"mcq","q":"The real numbers R are the union of:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 1.pdf | SLIDE 14","difficulty":"Hard","options":["N, Q and I only","Z, N, Q and I","Q and C","Z and Q only"],"answer":"Z, N, Q and I","solution":"A: Integers are also part of the reals.\nB: The reals are the union of integers, naturals, rationals and irrationals.\nC: Complex numbers are not part of the real numbers.\nD: Naturals and irrationals are omitted here."},{"id":"med-v6-009","module":"v6","type":"mcq","q":"Disability, as defined by CDC, concerns:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 18","difficulty":"Hard","options":["only genetic conditions","difficulty in activities and participation arising from impairment","only personal choice","only the medical diagnosis"],"answer":"difficulty in activities and participation arising from impairment","solution":"A: It is not limited to genetic conditions.\nB: It involves activity limitation and participation restriction interacting with environmental factors.\nC: It is not a matter of personal choice alone.\nD: Disability is broader than a medical diagnosis."},{"id":"med-v2-075","module":"v2","type":"mcq","q":"Where is the primary storage site for triacylglycerols in animals?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["Nervous tissue","Adipose tissue","Liver tissue","Muscle fibers"],"answer":"Adipose tissue","solution":"A: Nervous tissue is not a lipid storage depot.\nB: Adipose tissue is the primary storage site for triacylglycerols.\nC: The liver processes lipids but is not the main storage site.\nD: Muscle fibres use fatty acids but do not store bulk triacylglycerol."},{"id":"med-v4-040","module":"v4","type":"mcq","q":"What does the function MAX() return?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 7","difficulty":"Hard","options":["The average value of arguments","The most frequent value in a list","The largest value in a list of arguments","The total sum of arguments"],"answer":"The largest value in a list of arguments","solution":"A: AVERAGE gives the mean.\nB: MODE returns the most frequent value.\nC: MAX returns the largest value among its arguments.\nD: SUM gives the total, not the largest value."},{"id":"med-v1-026","module":"v1","type":"mcq","q":"Motor proteins provide for molecular motion in cells by interacting with what types of cellular structures?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 9","difficulty":"Devil Mode","options":["sites of energy production in cellular respiration","membrane proteins","ribosomes","cytoskeletons"],"answer":"cytoskeletons","solution":"A: Energy-production sites are mitochondria, not structures motors move along.\nB: Motor proteins interact with filaments, not bulk membrane proteins.\nC: Ribosomes are not tracks for molecular motors.\nD: Motor proteins move along cytoskeleton elements such as microtubules and microfilaments."},{"id":"med-v3-045","module":"v3","type":"mcq","q":"Which of the following statements concerning the structure of the functional group present in carboxylic acids is incorrect?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 1","difficulty":"Devil Mode","options":["A carbon-hydrogen bond is present","An oxygen-hydrogen bond is present","A carbon-oxygen single bond and a carbon-oxygen double bond are present","Two oxygen atoms are present"],"answer":"A carbon-hydrogen bond is present","solution":"A: A carbon-hydrogen bond is not part of the carboxyl functional group.\nB: The O-H bond is part of the carboxyl group.\nC: It has both a carbon-oxygen single and double bond.\nD: The carboxyl group does contain two oxygen atoms."},{"id":"med-v7-015","module":"v7","type":"mcq","q":"Which scale type uses bipolar adjectives at the ends of a continuum to measure the connotative meaning of a concept?","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 1","difficulty":"Medium","options":["Guttman Scale","Likert Scale","Semantic Differential Scale","Nominal Scale"],"answer":"Semantic Differential Scale","solution":"A: Guttman scales form a cumulative hierarchy.\nB: Likert scales use agreement levels, not bipolar adjectives.\nC: The semantic differential uses bipolar adjectives at the ends of a continuum.\nD: Nominal scale merely labels categories."},{"id":"med-v2-076","module":"v2","type":"mcq","q":"Which level of DNA organization refers to the double helical structure?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 3","difficulty":"Medium","options":["Primary structure","Tertiary structure","Quaternary structure","Secondary structure"],"answer":"Secondary structure","solution":"A: Primary structure is the nucleotide sequence.\nB: Tertiary structure is the supercoiled or chromatin form.\nC: Quaternary involves multiple macromolecular subunits.\nD: The double helix is the secondary structure of DNA."},{"id":"med-v2-077","module":"v2","type":"mcq","q":"Galactose is a component of which common disaccharide?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 3","difficulty":"Medium","options":["Lactose","Maltose","Sucrose","Cellobiose"],"answer":"Lactose","solution":"A: Lactose is galactose plus glucose.\nB: Maltose is two glucose units.\nC: Sucrose is glucose plus fructose.\nD: Cellobiose is two glucose units linked differently."},{"id":"med-v2-078","module":"v2","type":"mcq","q":"A deficiency in essential amino acids can lead to which specific disease mentioned in the text?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["Scurvy","Beriberi","Rickets","Kwashiorkor"],"answer":"Kwashiorkor","solution":"A: Scurvy results from vitamin C deficiency.\nB: Beriberi results from thiamine deficiency.\nC: Rickets results from vitamin D deficiency.\nD: Kwashiorkor is the protein-deficiency disease mentioned."},{"id":"med-v1-027","module":"v1","type":"mcq","q":"Which of the following correctly lists the order in which cellular components will be found in the pellet when homogenized cells are treated with increasingly rapid spins in a centrifuge?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 1","difficulty":"Hard","options":["nucleus, mitochondria, ribosomes","chloroplasts, ribosomes, vacuoles","nucleus, ribosomes, chloroplasts","ribosomes, nucleus, mitochondria"],"answer":"nucleus, mitochondria, ribosomes","solution":"A: Increasing spin speed pellets nucleus first, then mitochondria, then ribosomes.\nB: Chloroplasts are not smaller than vacuoles in the sequence given, so the order is invalid.\nC: Ribosomes are the smallest and should come last, not before chloroplasts.\nD: This order is wrong because the nucleus, being largest, should pellet before ribosomes."},{"id":"med-v2-079","module":"v2","type":"mcq","q":"Which coenzyme is primarily involved as an electron carrier in biosynthetic (anabolic) reactions?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 2","difficulty":"Hard","options":["FAD","NADPH","Coenzyme A","NADH"],"answer":"NADPH","solution":"A: FAD participates in oxidation pathways.\nB: NADPH is the electron carrier used in biosynthetic anabolic reductions.\nC: Coenzyme A transfers acyl groups rather than electrons.\nD: NADH mainly supplies electrons for catabolic ATP production."},{"id":"med-v2-080","module":"v2","type":"mcq","q":"Which type of reaction involves the removal of two hydrogen atoms from a substrate and is often catalyzed by dehydrogenases?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 2","difficulty":"Hard","options":["Isomerization reaction","Ligation reaction","Hydrolytic reaction","Oxidation-reduction reaction"],"answer":"Oxidation-reduction reaction","solution":"A: Isomerisation rearranges atoms within a molecule.\nB: Ligation joins molecules using ATP, not hydrogen removal.\nC: Hydrolysis cleaves bonds with water.\nD: Oxidation-reduction removes hydrogen or electrons and is catalysed by dehydrogenases."},{"id":"med-v1-028","module":"v1","type":"mcq","q":"In the fractionation of homogenized cells using centrifugation, the primary factor that determines whether a specific cellular component ends up in the supernatant or the pellet is","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 1","difficulty":"Hard","options":["the size and weight of the component","the relative solubility of the component","the number of enzymes in the fraction","the percentage of carbohydrates in the component"],"answer":"the size and weight of the component","solution":"A: Larger, heavier components pellet first while smaller ones remain in the supernatant.\nB: Sedimentation in a centrifuge depends on mass and size, not on solubility.\nC: Enzyme number is irrelevant to sedimentation rate under centrifugation.\nD: Carbohydrate content does not govern how fast a structure sediments."},{"id":"med-v3-046","module":"v3","type":"mcq","q":"In a secondary alcohol, the hydroxyl-bearing carbon atom","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 5","difficulty":"Devil Mode","options":["cannot be bonded to hydrogen atoms","more than one correct response E) no correct response","is always involved in a double bond","is attached to two other carbon atoms"],"answer":"is attached to two other carbon atoms","solution":"A: It is bonded to one hydrogen and two carbons.\nB: Only one statement is correct.\nC: The hydroxyl-bearing carbon of a secondary alcohol is not in a double bond.\nD: It is attached to two other carbon atoms."},{"id":"med-v4-041","module":"v4","type":"mcq","q":"To move between cells in a table, you can use the mouse or the key","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 7","difficulty":"Devil Mode","options":["Shift","Esc","Alt","Tab"],"answer":"Tab","solution":"A: Shift is a modifier, not the table navigation key.\nB: Esc cancels the current action.\nC: Alt is a modifier key.\nD: Tab moves between cells in a table."},{"id":"med-v2-081","module":"v2","type":"mcq","q":"Getting data from a cell located in a different sheet is called …","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 30","difficulty":"Medium","options":["Accessing","Functioning","Referencing","Updating"],"answer":"Referencing","solution":"A: Accessing is not the specific spreadsheet term.\nB: Functioning is not the relevant term.\nC: Retrieving data from another sheet is called referencing.\nD: Updating changes values rather than fetching them."},{"id":"med-v4-042","module":"v4","type":"mcq","q":"The SUM() function is an example of which type of function?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 3","difficulty":"Medium","options":["Logical-only function","Fixed argument function","Variable argument function","No argument function"],"answer":"Variable argument function","solution":"A: SUM is not a logical-only function.\nB: SUM does not have a fixed number of arguments.\nC: SUM accepts a variable number of arguments.\nD: SUM requires arguments, so it is not a no-argument function."},{"id":"med-v2-082","module":"v2","type":"mcq","q":"Platelet-activating factor (PAF) is unique because it contains which type of linkage at the C-1 position?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 3","difficulty":"Medium","options":["Ether linkage","Ester linkage","Glycosidic linkage","Peptide linkage"],"answer":"Ether linkage","solution":"A: Platelet-activating factor has an ether linkage at C-1.\nB: An ester linkage is typical of most phospholipids, not PAF's C-1 position.\nC: Glycosidic linkages join sugars.\nD: Peptide linkages occur in proteins."},{"id":"med-v3-047","module":"v3","type":"mcq","q":"When an alcohol molecule adds across a carbon-oxygen double bond of an aldehyde or ketone, the","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 4","difficulty":"Medium","options":["OH portion from the alcohol bonds to the carbonyl carbon atom","OH portion from the alcohol bonds to the carbonyl oxygen atom","OR portion from the alcohol bonds to the carbonyl carbon atom","H atom from the alcohol bonds to the carbonyl carbon atom"],"answer":"OR portion from the alcohol bonds to the carbonyl carbon atom","solution":"A: The OH portion is not what bonds to the carbonyl carbon here.\nB: The OH portion does not bond to the carbonyl oxygen.\nC: The OR group from the alcohol attaches to the carbonyl carbon.\nD: The alcohol hydrogen bonds to the carbonyl oxygen, not carbon."},{"id":"med-v2-083","module":"v2","type":"mcq","q":"What is the structural consequence of a cis double bond in a fatty acid chain?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 2","difficulty":"Hard","options":["It causes a ”kink” or bend in the chain","It removes the carboxyl group","It increases the melting point","It makes the chain perfectly straight"],"answer":"It causes a ”kink” or bend in the chain","solution":"A: A cis double bond introduces a kink or bend in the fatty acid chain.\nB: The carboxyl group remains present.\nC: Cis bonds lower rather than raise the melting point.\nD: A cis double bond does not keep the chain straight."},{"id":"med-v4-043","module":"v4","type":"mcq","q":"Which chart type highlights the magnitude of change over time to draw attention to the total value?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 6","difficulty":"Hard","options":["Bar Chart","Doughnut Chart","Area Chart","Radar Chart"],"answer":"Area Chart","solution":"A: Bar charts compare categories horizontally.\nB: Doughnut charts show proportions of a whole.\nC: An area chart emphasises magnitude of change over time and the total.\nD: Radar charts compare multiple variables."},{"id":"med-v4-044","module":"v4","type":"mcq","q":"To rotate a text box, you should click and drag the:","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 6","difficulty":"Hard","options":["Corner sizing handle","Circular arrow icon (Free Rotate)","Side sizing handle","Center of the box"],"answer":"Circular arrow icon (Free Rotate)","solution":"A: Corner handles resize the text box.\nB: The circular rotation arrow is dragged to rotate a text box.\nC: Side handles also resize it.\nD: Dragging the centre moves the box."},{"id":"med-v4-045","module":"v4","type":"mcq","q":"When saving a presentation for the first time, you must use which com- mand?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 4","difficulty":"Hard","options":["Export","Save As","Save","Close"],"answer":"Save As","solution":"A: Export changes file format.\nB: Save As is required to give a new presentation a name on first save.\nC: Save updates an already named file.\nD: Close exits the presentation."},{"id":"med-v2-084","module":"v2","type":"mcq","q":"Tab scrolling button","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 24","difficulty":"Devil Mode","options":["Allow you to view additional worksheet columns to the right","Allow you to view additional worksheet rows down","Allow you to view additional sheets tabs","Allow you to view a different worksheet"],"answer":"Allow you to view additional sheets tabs","solution":"A: Viewing additional columns is handled by horizontal scrolling.\nB: Viewing additional rows is handled by vertical scrolling.\nC: Tab scrolling buttons let you view additional worksheet tabs.\nD: Viewing a different worksheet is not the tab scrolling button's role."},{"id":"med-v4-046","module":"v4","type":"mcq","q":"Which tool guides a user through the process of selecting a function and entering its arguments?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 4","difficulty":"Devil Mode","options":["AutoSum button","Format Painter","Insert Function dialog box","Status Bar"],"answer":"Insert Function dialog box","solution":"A: AutoSum inserts a sum quickly without guiding arguments.\nB: Format Painter copies formatting.\nC: The Insert Function dialog guides selection of a function and its arguments.\nD: Status bar shows information, not function guidance."},{"id":"med-v2-085","module":"v2","type":"mcq","q":"In a nucleotide, the nitrogenous base is covalently linked to which carbon of the pentose sugar?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 1","difficulty":"Medium","options":["C5’","C3’","C1’","C2’"],"answer":"C1’","solution":"A: C5' carries the phosphate group attached to the sugar.\nB: C3' is where phosphodiester linkages form along a chain.\nC: The nitrogenous base is bonded to the C1' carbon of the pentose sugar.\nD: C2' bears a hydrogen or hydroxyl group, not the base."},{"id":"med-v7-016","module":"v7","type":"fill","q":"If 3 cards are drawn from a deck of 52 without replacement, the probability all three are aces is 4/52 times 3/51 times 2/50. Compute this probability rounded to 5 decimal places. (Answer as a decimal.)","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/QUESTIONS ON THE LAW OF TOTAL PROBABILITY AND BAYES RULE MR. BANKU COPY.pdf | SLIDE 1","difficulty":"Medium","answer":"0.00018","solution":"Multiplying 4/52, 3/51 and 2/50 gives 24/132600, which is approximately 0.00018."},{"id":"med-v4-047","module":"v4","type":"mcq","q":"Which command allows you to use a custom image as a bullet point?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 6","difficulty":"Medium","options":["SmartArt","Symbol","Picture (within the Bullets and Numbering dialog)","Numbering"],"answer":"Picture (within the Bullets and Numbering dialog)","solution":"A: SmartArt inserts a diagram.\nB: Symbol inserts a character, not a picture bullet.\nC: Picture bullets are set through Picture in the Bullets and Numbering dialog.\nD: Numbering gives numeric bullets."},{"id":"med-v4-048","module":"v4","type":"mcq","q":"How are multiple arguments typically separated within a function?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 2","difficulty":"Medium","options":["Semicolons","Commas","Periods","Spaces"],"answer":"Commas","solution":"A: Semicolons are separators in some locales, but the standard here is commas.\nB: Function arguments are typically separated by commas.\nC: Periods are not argument separators.\nD: Spaces are not separators in Excel functions."},{"id":"med-v5-010","module":"v5","type":"mcq","q":"A word, phrase or sentence is ambiguous when it can reasonably be interpreted in:","source":"Medicine/HB1 First Semester/Communication skills/ambiguity ppt.pdf | SLIDE 2","difficulty":"Hard","options":["more than one way","no way at all","only a literal way","exactly one way"],"answer":"more than one way","solution":"A: Ambiguity means the expression admits more than one reasonable reading.\nB: If it had no meaning it would be meaningless, not ambiguous.\nC: Literal-only reading would remove ambiguity.\nD: A single interpretation means the expression is clear."},{"id":"med-v2-086","module":"v2","type":"mcq","q":"The complete oxidation of 1 gram of triacylglycerol yields approximately how much energy?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["17 kJ","38 kJ","9 kJ","4 kJ"],"answer":"38 kJ","solution":"A: 17 kJ per gram is too low for fat.\nB: Triacylglycerol oxidation yields about 38 kJ per gram.\nC: 9 kJ is not the per-gram energy for fat.\nD: 4 kJ per gram is the value for carbohydrate or protein."},{"id":"med-v2-087","module":"v2","type":"mcq","q":"Cellulose cannot be degraded by human enzymes because it contains","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 3","difficulty":"Hard","options":["β(1 →4) glycosidic linkages","complex carbohydrates","resistant carbohydrates","non-reductive sugars"],"answer":"β(1 →4) glycosidic linkages","solution":"A: Human enzymes cannot cleave the beta(1 to 4) linkages of cellulose.\nB: Complex carbohydrate is too vague to explain indigestibility.\nC: Resistance alone does not name the structural cause.\nD: Non-reducing sugars are not the reason."},{"id":"med-v4-049","module":"v4","type":"mcq","q":"Grouping multiple objects allows you to:","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 8","difficulty":"Hard","options":["Edit the text in all objects at once","Delete the background of the slide","Treat them as a single object for easier moving and positioning","Save them as a separate .pdf file"],"answer":"Treat them as a single object for easier moving and positioning","solution":"A: Grouping does not merge the text of several objects.\nB: Grouping does not remove a slide background.\nC: Grouping lets several objects be moved and positioned as one unit.\nD: It does not export objects as a separate PDF."},{"id":"med-v3-048","module":"v3","type":"mcq","q":"Alcohols have higher boiling points than alkanes of similar molecular mass because","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 2","difficulty":"Devil Mode","options":["alcohols are acidic and alkanes are not","alcohols are ionic compounds and alkanes are covalent compounds","hydrogen bonding occurs between alcohol molecules but not between alkane molecules","alkane molecules are polar and alcohol molecules are not"],"answer":"hydrogen bonding occurs between alcohol molecules but not between alkane molecules","solution":"A: Alcohol acidity is not the reason for the higher boiling point.\nB: Alcohols are covalent polar molecules, not ionic compounds.\nC: Hydrogen bonding between alcohol molecules raises their boiling points above those of alkanes.\nD: Alcohols are polar while alkanes are essentially nonpolar, so this is reversed."},{"id":"med-v3-049","module":"v3","type":"mcq","q":"What is the IUPAC name of the aldehyde whose common name is propionaldehyde?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 2","difficulty":"Devil Mode","options":["ethanal","propanal","methanal","2-methylbutanal"],"answer":"propanal","solution":"A: Ethanal is acetaldehyde.\nB: Propanal is the IUPAC name for propionaldehyde.\nC: Methanal is formaldehyde.\nD: 2-methylbutanal has a branched five-carbon chain."},{"id":"med-v3-050","module":"v3","type":"mcq","q":"The IUPAC name for the compound CH3 C O CH2 CH CH3 CH3 is","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 2","difficulty":"Medium","options":["2-methyl-4-pentaketone","2-methyl-2-pentanone","2-methyl-4-pentanone","4-methyl-2-pentanone"],"answer":"4-methyl-2-pentanone","solution":"A: Pentaketone is not a valid suffix.\nB: 2-methyl-2-pentanone has the methyl in the wrong position.\nC: 2-methyl-4-pentanone uses incorrect numbering.\nD: 4-methyl-2-pentanone is the correct IUPAC name."},{"id":"med-v2-088","module":"v2","type":"mcq","q":"Maltose is a reducing sugar because","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 3","difficulty":"Medium","options":["it is a strong reducing agent","it reacts with Benedict’s and Fehling’s reagents","it reduces the sweetness of substances to which it is added","it has a free hemiacetal hydroxyl group"],"answer":"it has a free hemiacetal hydroxyl group","solution":"A: Being a strong reducing agent is not the structural reason.\nB: Reacting with Benedict's reagent is a test result, not the cause.\nC: Reducing sweetness is unrelated to reducing sugar chemistry.\nD: Maltose is reducing because one glucose retains a free hemiacetal hydroxyl."},{"id":"med-v1-029","module":"v1","type":"mcq","q":"The Golgi apparatus has a polarity or sidedness to its structure and function. Which of the following statements correctly describes this polarity?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 5","difficulty":"Medium","options":["Lipids in the membrane of the Golgi may be sorted and modified as they move from one side of the Golgi to the other","Transport vesicles fuse with one side of the Golgi and leave from the opposite side","Proteins in the membrane of the Golgi may be sorted and modified as they move from one side of the Golgi to the other","All of the above correctly describe polar characteristics of the Golgi function"],"answer":"All of the above correctly describe polar characteristics of the Golgi function","solution":"A: Golgi membrane lipids are likewise sorted and modified across the stack.\nB: Transport vesicles do fuse on one face and leave from the other, showing polarity.\nC: Golgi membrane proteins are sorted and modified across the stack.\nD: Since A, B, C and D are all correct descriptions, 'all of the above' is right."},{"id":"med-v1-030","module":"v1","type":"mcq","q":"Which structure-function pair is mismatched?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 15","difficulty":"Medium","options":["microtubule; muscle contraction","nucleolus; production of ribosomal subunits","lysosome; intracellular digestion","ribosome; protein synthesis"],"answer":"microtubule; muscle contraction","solution":"A: Microtubules are not responsible for muscle contraction; microfilaments are, so this pair is mismatched.\nB: The nucleolus does produce ribosomal subunits, so this pair is correct.\nC: Lysosomes do carry out intracellular digestion, so this pair is correct.\nD: Ribosomes do synthesise proteins, so this pair is correct."},{"id":"med-v1-031","module":"v1","type":"mcq","q":"Grana, thylakoids, and stroma are all components found in","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 7","difficulty":"Hard","options":["vacuoles","chloroplasts","lysosomes","mitochondria"],"answer":"chloroplasts","solution":"A: Vacuoles do not contain photosynthetic membranes.\nB: Chloroplasts contain grana, thylakoids and stroma for photosynthesis.\nC: Lysosomes are simple digestive vesicles.\nD: Mitochondria have cristae, not grana or thylakoids."},{"id":"med-v5-011","module":"v5","type":"mcq","q":"Select the sentence with NO concord error","source":"Medicine/HB1 First Semester/Communication skills/communication_skills_answered by Abanga.pdf | SLIDE 2","difficulty":"Hard","options":["Neither the boys nor his group members grasp Spanish","Neither the boy nor his step-brothers grasp Spanish","Neither the boy nor his step-brother grasp Spanish","Neither the boy nor his step-sisters grasps Spanish"],"answer":"Neither the boy nor his step-brothers grasp Spanish","solution":"A: The paired subjects are mismatched in number.\nB: With neither-nor the verb agrees with the nearest noun, the plural 'step-brothers', so 'grasp' is correct.\nC: A singular nearest noun requires 'grasps', not 'grasp'.\nD: 'Steps-sisters' is misspelled and the verb is singular."},{"id":"med-v6-010","module":"v6","type":"mcq","q":"Sounds above the range of human hearing are called:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 7","difficulty":"Hard","options":["ultrasound","infrasound","megasound","basalsound"],"answer":"ultrasound","solution":"A: Ultrasound refers to frequencies above human hearing.\nB: Infrasound is below the range.\nC: Megasound is not the correct term.\nD: Basalsound is not a standard term."},{"id":"med-v2-089","module":"v2","type":"mcq","q":"During acid hydrolysis, which amino acid is completely destroyed and must be estimated by other means?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 4","difficulty":"Hard","options":["Tryptophan","Alanine","Lysine","Glycine"],"answer":"Tryptophan","solution":"A: Tryptophan is destroyed during acid hydrolysis and must be estimated otherwise.\nB: Alanine is stable to acid hydrolysis.\nC: Lysine is not completely destroyed.\nD: Glycine survives acid hydrolysis."},{"id":"med-v8-013","module":"v8","type":"mcq","q":"For a quadratic ax^2 + bx + c = 0, the solutions are given by:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 6.pdf | SLIDE 1","difficulty":"Devil Mode","options":["x = (-b ± sqrt(b^2 - 4ac))/2a","x = -b/2a only","x = -c/a","x = b^2 - 4ac"],"answer":"x = (-b ± sqrt(b^2 - 4ac))/2a","solution":"A: The quadratic formula gives both roots using the discriminant.\nB: That gives only the vertex axis, not both roots.\nC: That is not the general solution.\nD: That is the discriminant itself, not the roots."},{"id":"med-v2-090","module":"v2","type":"mcq","q":"Californium was produced by the fusion of","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 1","difficulty":"Devil Mode","options":["Geiger, C-12, U-238","Seaborg, C-12, U-239","Thompson, C-12, U-238","Mendeliev, C-12, U"],"answer":"Thompson, C-12, U-238","solution":"A: Geiger is not part of the described fusion.\nB: Seaborg is associated with discovery but not these fusion reactants.\nC: Thompson, carbon-12 and uranium-238 are given as the fusion partners producing californium.\nD: Mendelevium is not the element fused in this account."},{"id":"med-v1-032","module":"v1","type":"mcq","q":"Which of the following statements correctly describes some aspect of protein disposal from prokaryotic cells?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 6","difficulty":"Medium","options":["The mechanism of protein excretion in prokaryotes is probably the same as that in eukaryotes","Prokaryotes are unlikely to be able to excrete proteins because they lack an endomembrane system","Proteins that are excreted by prokaryotes are synthesized on ribosomes that are bound to the cytoplasmic surface of the plasma membrane","In prokaryotes, the ribosomes that are used for the synthesis of secreted proteins are located outside of the cell"],"answer":"Proteins that are excreted by prokaryotes are synthesized on ribosomes that are bound to the cytoplasmic surface of the plasma membrane","solution":"A: The prokaryotic secretion mechanism differs from the eukaryotic endomembrane route.\nB: Prokaryotes do secrete proteins, so this claim is false.\nC: Excreted prokaryotic proteins are made on ribosomes bound to the cytoplasmic face of the plasma membrane.\nD: Ribosomes are not located outside the cell."},{"id":"med-v3-051","module":"v3","type":"mcq","q":"Statements: (1) 2-propanol is a secondary alcohol. (2) Each of the three methylphenols has a different common name. (3) The compound 4-methoxy-2-butanol is both an alcohol and an ether","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 9","difficulty":"Medium","options":["None of the statements is true","All three statements are true","Only one of the statements is true","Two of the three statements are true"],"answer":"Two of the three statements are true","solution":"A: All true is wrong because the methylphenol names are not all distinct in this key.\nB: 2-propanol is secondary, methylphenols have distinct common names, and 4-methoxy-2-butanol is both alcohol and ether.\nC: One true undercounts.\nD: Two statements are true."},{"id":"med-v2-091","module":"v2","type":"mcq","q":"According to the Big Bang theory","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 1","difficulty":"Medium","options":["all other elements apart from hydrogen and helium were formed in the centre of the stars","hydrogen and helium were formed in the centre of the stars","explosion of the stars resulted in the forma- tion of hydrogen and helium","accumulation of hydrogen and helium caused the collapse of a primordial ball of matter"],"answer":"all other elements apart from hydrogen and helium were formed in the centre of the stars","solution":"A: Big Bang nucleosynthesis produced H and He while heavier elements formed later in stars.\nB: Hydrogen and helium arose in the Big Bang, not in stellar centres.\nC: Stellar explosions did not create hydrogen and helium.\nD: The primordial collapse did not cause an accumulation of H and He in this way."},{"id":"med-v7-017","module":"v7","type":"mcq","q":"What does it mean for response categories to be ”Collectively Exhaustive”?","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 2","difficulty":"Medium","options":["The options cover every possible valid response","The respondent is given at least five options to choose from","No two categories overlap","The question uses a balanced Likert scale"],"answer":"The options cover every possible valid response","solution":"A: Collectively exhaustive categories cover every possible valid response.\nB: Having five options is not the defining property.\nC: Non-overlap defines mutually exclusive categories.\nD: A balanced Likert scale is a different concept."},{"id":"med-v2-092","module":"v2","type":"mcq","q":"What is the normal range for blood glucose levels in humans?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 2","difficulty":"Hard","options":["1.5 – 3.0 mmol/L","10.0 – 12.5 mmol/L","3.9 – 5.5 mmol/L","6.5 – 8.0 mmol/L"],"answer":"3.9 – 5.5 mmol/L","solution":"A: 1.5 to 3.0 mmol/L is below normal fasting glucose.\nB: 10.0 to 12.5 mmol/L is markedly hyperglycaemic.\nC: 3.9 to 5.5 mmol/L is the normal fasting blood glucose range.\nD: 6.5 to 8.0 mmol/L indicates impaired glucose control."},{"id":"med-v4-050","module":"v4","type":"mcq","q":"What is the main difference between the NOW() and TODAY() functions?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 5","difficulty":"Hard","options":["There is no difference between them","NOW() includes both date and time; TODAY() only returns the date portion","NOW() requires an argument; TODAY() does not","TODAY() includes the time; NOW() does not"],"answer":"NOW() includes both date and time; TODAY() only returns the date portion","solution":"A: The two functions differ, so this is false.\nB: NOW returns date and time, while TODAY returns only the date.\nC: Neither function requires an argument.\nD: TODAY does not include time; the statement reverses the roles."},{"id":"med-v2-093","module":"v2","type":"mcq","q":"Membranes are effective as barriers to polar molecules because they are","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 4","difficulty":"Hard","options":["amphibatic","aqueous","transporters","hydrophobic"],"answer":"hydrophobic","solution":"A: Amphipathic describes molecules with both polar and nonpolar parts.\nB: Membranes are not aqueous barriers in this sense.\nC: Transporters move molecules rather than making the membrane a barrier.\nD: The hydrophobic membrane interior blocks polar molecules."},{"id":"med-v6-011","module":"v6","type":"mcq","q":"Prelingual deafness means hearing loss that occurs:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 13","difficulty":"Hard","options":["after old age","before spoken language is acquired, at birth or in infancy","only during illness in adulthood","only after university"],"answer":"before spoken language is acquired, at birth or in infancy","solution":"A: Old-age loss is late-onset, not prelingual.\nB: Prelingual loss occurs at birth or in infancy, delaying language development.\nC: Adult illness-related loss is post-lingual.\nD: University years are far too late to be prelingual."},{"id":"med-v2-094","module":"v2","type":"mcq","q":"Membrane proteins serve all of the following functions except","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 1","difficulty":"Devil Mode","options":["Transport","Signal transduction","Cell sorting","Enzyme activity"],"answer":"Cell sorting","solution":"A: Transport is a major membrane protein function.\nB: Signal transduction is a key membrane protein function.\nC: Cell sorting is not a recognised membrane protein function.\nD: Enzyme activity is carried out by some membrane proteins."},{"id":"med-v4-051","module":"v4","type":"mcq","q":"Where are the Filter buttons placed once the feature is activated?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 8","difficulty":"Devil Mode","options":["In the column headings of the selected range","In the status bar","On the Scroll bar","In the File menu"],"answer":"In the column headings of the selected range","solution":"A: Filter buttons appear in the column headings of the selected range.\nB: Filter buttons are not in the status bar.\nC: They are not on the scroll bar.\nD: They are not in the File menu."},{"id":"med-v2-095","module":"v2","type":"mcq","q":"Enzymes function as biological catalysts by:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 1","difficulty":"Medium","options":["Lowering the activation energy required for a reaction to proceed","Increasing the standard free energy change (∆G◦) of a reaction","Providing the thermal energy necessary to reach the transition state","Shifting the equilibrium constant (Keq) toward the products"],"answer":"Lowering the activation energy required for a reaction to proceed","solution":"A: Lowering the activation energy lets a reaction proceed faster without changing its overall energetics.\nB: Enzymes lower activation energy; they do not raise the reaction's standard free energy change.\nC: Enzymes do not supply thermal energy to reach the transition state.\nD: Enzymes never shift the equilibrium constant toward products."},{"id":"med-v2-096","module":"v2","type":"mcq","q":"Which molecule acts as the repository of genetic information and resists hydrolysis?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 4","difficulty":"Medium","options":["DNA","rRNA","tRNA","mRNA"],"answer":"DNA","solution":"A: DNA is the genetic repository and resists hydrolysis.\nB: rRNA is a structural ribosome RNA.\nC: tRNA is a short adapter molecule.\nD: mRNA is a transient information carrier and is hydrolysed relatively easily."},{"id":"med-v2-097","module":"v2","type":"mcq","q":"A-DNA, B-DNA, and Z-DNA are examples of which level of organization?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 3","difficulty":"Medium","options":["Primary","Quaternary","Tertiary","Secondary"],"answer":"Tertiary","solution":"A: Primary structure is the nucleotide sequence, not A/B/Z forms.\nB: Quaternary involves multiple chains and is not these forms.\nC: A, B and Z DNA describe tertiary forms of the double helix.\nD: Secondary structure is the double helix generally."},{"id":"med-v7-018","module":"v7","type":"mcq","q":"Which level of measurement allows for a ”true zero” point (e.g., age in years, or number of credits earned)?","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 3","difficulty":"Medium","options":["Ratio","Ordinal","Interval","Nominal"],"answer":"Ratio","solution":"A: Ratio data have a true zero point, as with age or credits earned.\nB: Ordinal data have order but no true zero.\nC: Interval data lack a true zero.\nD: Nominal data have no order or zero."},{"id":"med-v1-033","module":"v1","type":"mcq","q":"The peroxisome gets its name from its interaction with hydrogen peroxide. If a liver cell is detoxifying alcohol and some other poisons, it does so by removal of hydrogen from the molecules. What, then, do the enzymes of the peroxisome do?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 9","difficulty":"Hard","options":["transfer the hydrogens to oxygen molecules","combine the hydrogen with ATP","transfer the harmful substances to the mitochondria","use the hydrogen to break down hydrogen peroxide"],"answer":"transfer the hydrogens to oxygen molecules","solution":"A: Peroxisomal enzymes transfer hydrogen atoms from substrates to oxygen, producing hydrogen peroxide.\nB: Hydrogen is not combined with ATP in peroxisomal detox reactions.\nC: Harmful substances are not transferred to mitochondria for this purpose.\nD: Catalase breaks down hydrogen peroxide rather than using substrate hydrogen to do so."},{"id":"med-v4-052","module":"v4","type":"mcq","q":"What determines the category (X) axis when Excel creates a chart auto- matically?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 7","difficulty":"Hard","options":["Only the top row","The shortest side of the selection","The longest side of the selection","Only the left column"],"answer":"The longest side of the selection","solution":"A: Categories are not limited to the top row.\nB: The shortest side is not the category axis determinant.\nC: Excel uses the longest side of a selected range as the category axis.\nD: They are not limited to the left column."},{"id":"med-v6-012","module":"v6","type":"mcq","q":"In the WHO classification, a hearing threshold of 26-40 dB is:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 11","difficulty":"Hard","options":["normal","profound","mild","moderate"],"answer":"mild","solution":"A: Normal hearing is 0-25 dB.\nB: Profound is above 91 dB.\nC: 26-40 dB is classified as mild hearing loss.\nD: Moderate is 41-55 dB."},{"id":"med-v6-013","module":"v6","type":"mcq","q":"Conductive hearing loss arises from disease or obstruction in the:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 14","difficulty":"Hard","options":["central nervous system","inner ear only","auditory nerve only","outer or middle ear"],"answer":"outer or middle ear","solution":"A: CNS damage causes central hearing loss.\nB: Inner ear damage causes sensorineural loss.\nC: Auditory nerve damage is sensorineural.\nD: Conductive loss involves the outer or middle ear and affects frequencies evenly."},{"id":"med-v8-014","module":"v8","type":"mcq","q":"The domain of a function f(x) = 1/x excludes:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 5.pdf | SLIDE 1","difficulty":"Devil Mode","options":["all negative numbers","x = 0","all positive numbers","x = 1"],"answer":"x = 0","solution":"A: Negative numbers are allowed.\nB: Division by zero is undefined, so x = 0 is excluded.\nC: Positive numbers are allowed.\nD: At x = 1 the function equals 1 and is defined."},{"id":"med-v7-019","module":"v7","type":"fill","q":"If P(A)=0.4 and P(B|A)=0.5, find P(A and B). (Answer as a decimal.)","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/QUESTIONS ON THE LAW OF TOTAL PROBABILITY AND BAYES RULE MR. BANKU COPY.pdf | SLIDE 1","difficulty":"Devil Mode","answer":"0.2","solution":"By the multiplication rule P(A and B) = P(A) times P(B|A) = 0.4 times 0.5 = 0.2."},{"id":"med-v8-015","module":"v8","type":"mcq","q":"The notation A ⊂ B means that:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 1.pdf | SLIDE 12","difficulty":"Medium","options":["A equals B","A is a proper subset of B and cannot equal B","A and B are disjoint","B is a subset of A"],"answer":"A is a proper subset of B and cannot equal B","solution":"A: Equality is expressed with A = B, not the proper subset symbol.\nB: The proper subset symbol means A is contained in B but is not equal to it.\nC: Disjoint sets share no elements, which is different.\nD: That would be written B ⊂ A."},{"id":"med-v2-098","module":"v2","type":"mcq","q":"The synthesis of cAMP is activated by which enzyme after a hormone binds to its receptor?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 4","difficulty":"Medium","options":["Isomerase","Hexokinase","Phosphorylase","Adenylyl cyclase"],"answer":"Adenylyl cyclase","solution":"A: Isomerases rearrange molecules and do not make cAMP.\nB: Hexokinase phosphorylates glucose in glycolysis.\nC: Phosphorylase breaks down glycogen.\nD: Adenylyl cyclase converts ATP to cAMP after receptor activation."},{"id":"med-v8-016","module":"v8","type":"mcq","q":"The set of integers is denoted by:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 1.pdf | SLIDE 13","difficulty":"Medium","options":["N","Q","R","Z"],"answer":"Z","solution":"A: N denotes natural numbers.\nB: Q denotes rational numbers.\nC: R denotes real numbers.\nD: Z denotes integers, including negatives and zero."},{"id":"med-v4-053","module":"v4","type":"mcq","q":"To select multiple files that are not listed together in the Open dialog box, which key must be held?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 4","difficulty":"Medium","options":["Shift","Alt","Ctrl","Tab"],"answer":"Ctrl","solution":"A: Shift selects contiguous files.\nB: Alt is not used for non-adjacent selection.\nC: Ctrl selects non-adjacent files in the Open dialog.\nD: Tab moves focus between controls."},{"id":"med-v2-099","module":"v2","type":"mcq","q":"In mammalian lactate dehydrogenase (LDH), the five different isozymes are formed by the tetrameric association of which two subunits?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 4","difficulty":"Hard","options":["Catalytic and Regulatory","Gamma and Delta","Alpha and Beta","A and B (or M and H)"],"answer":"A and B (or M and H)","solution":"A: Catalytic and regulatory describe subunit roles, not LDH chains.\nB: Gamma and delta are not LDH subunits.\nC: Alpha and beta are not the LDH subunit names.\nD: LDH isozymes are tetramers of A (M) and B (H) subunits."},{"id":"med-v2-100","module":"v2","type":"mcq","q":"What term describes the tendency of a molecule to associate with one solvent or phase over another in chromatography?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["Partition coefficient","Ionic strength","Resonance form","Isoelectric point"],"answer":"Partition coefficient","solution":"A: Partition coefficient describes a molecule's relative affinity for two phases in chromatography.\nB: Ionic strength affects ionic interactions, not phase preference.\nC: Resonance form is a structural description.\nD: Isoelectric point is the pH of zero net charge."},{"id":"med-v2-101","module":"v2","type":"mcq","q":"Most enzymes show a sharp decline in activity above 50 −60◦C primarily due to:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["A decrease in molecular collisions","Substrate exhaustion","Thermal denaturation of the protein structure","Feedback inhibition by the product"],"answer":"Thermal denaturation of the protein structure","solution":"A: Molecular collisions increase, not decrease, with heat.\nB: Substrate exhaustion is not the usual cause above 50-60 degrees.\nC: High temperature denatures the enzyme's protein structure, sharply reducing activity.\nD: Feedback inhibition is not temperature-driven."},{"id":"med-v1-034","module":"v1","type":"mcq","q":"Ions can travel directly from the cytoplasm of one animal cell to the cytoplasm of an adjacent cell through","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 14","difficulty":"Hard","options":["plasmodesmata","gap junctions","tight junctions","intermediate filaments"],"answer":"gap junctions","solution":"A: Plasmodesmata connect plant cells, not animal cells.\nB: Gap junctions allow ions to pass directly between animal cell cytoplasms.\nC: Tight junctions seal cells rather than conduct ions.\nD: Intermediate filaments provide mechanical support, not channels."},{"id":"med-v2-102","module":"v2","type":"mcq","q":"A worksheet can have a maximum of …. Number of rows","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 28","difficulty":"Devil Mode","options":["1024","32,000","256","65,535"],"answer":"65,535","solution":"A: 1024 is not the row limit given.\nB: 32,000 is not the row count in this source.\nC: 256 relates to old column limits, not rows.\nD: The source gives 65,535 as the worksheet row maximum."},{"id":"med-v4-054","module":"v4","type":"mcq","q":"Which file format is the default for PowerPoint 2013 and newer versions?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 4","difficulty":"Devil Mode","options":["ppt","pptx","pps","pdf"],"answer":"pptx","solution":"A: PPT is the older binary format, not the default.\nB: PPTX is the default XML-based format for PowerPoint 2013 and later.\nC: PPS is a slide-show format, not the standard editable default.\nD: PDF is an export format, not the editable default."},{"id":"med-v2-103","module":"v2","type":"mcq","q":"In the Michaelis-Menten equation, Vmax represents:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["The initial rate of the reaction","The concentration of substrate required to start the reaction","The binding affinity of the enzyme for the substrate","The maximum catalytic rate when the enzyme is saturated with substrate"],"answer":"The maximum catalytic rate when the enzyme is saturated with substrate","solution":"A: Initial rate is the velocity at the start, not Vmax.\nB: Substrate concentration to start a reaction is not Vmax.\nC: Binding affinity is reflected by Km, not Vmax.\nD: Vmax is the maximum catalytic rate when the enzyme is saturated with substrate."},{"id":"med-v5-012","module":"v5","type":"mcq","q":"Semantic ambiguity is caused by words known as:","source":"Medicine/HB1 First Semester/Communication skills/ambiguity ppt.pdf | SLIDE 6","difficulty":"Medium","options":["hypernyms","hyponyms","homonyms","homophones"],"answer":"homonyms","solution":"A: Hypernyms are general terms above specific ones.\nB: Hyponyms are specific terms under a general term.\nC: Homonyms share spelling and pronunciation but differ in meaning by context.\nD: Homophones cause phonological ambiguity."},{"id":"med-v3-052","module":"v3","type":"mcq","q":"Statements: (1) Structurally, the difference between malonic acid and succinic acid is a -CH2- grouping (2) A carboxylic acid salt is generally more soluble in water than the carboxylic acid from which it is obtained. (3) Ester hydrolysis and ester saponification are “reverse” reactions of each other","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 10","difficulty":"Medium","options":["None of the statements is true","Only one of the statements is true","Two of the three statements are true","All three statements are true"],"answer":"Two of the three statements are true","solution":"A: All true is wrong.\nB: One true undercounts.\nC: Two statements are true.\nD: Malonic and succinic differ by one CH2, salts are more soluble than acids, and hydrolysis and saponification are not simply reverse reactions."},{"id":"med-v2-104","module":"v2","type":"mcq","q":"The site on an enzyme where the catalytic reaction actually occurs is the:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 1","difficulty":"Medium","options":["Apoenzyme","Active site","Regulatory site","Allosteric site"],"answer":"Active site","solution":"A: The apoenzyme is the protein part without its cofactor.\nB: The active site is where substrate binds and catalysis actually occurs.\nC: The regulatory site binds effectors rather than carrying out catalysis.\nD: The allosteric site is a regulatory site away from catalysis."},{"id":"med-v3-053","module":"v3","type":"mcq","q":"When an ester is saponified, one reaction product is","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 4","difficulty":"Hard","options":["an aldehyde","a base","an alcohol","a carboxylic acid"],"answer":"an alcohol","solution":"A: Aldehydes are not saponification products.\nB: Saponification is base hydrolysis, not producing a base.\nC: Saponification of an ester yields an alcohol and a carboxylate salt.\nD: The carboxylate salt forms, not the free acid directly."},{"id":"med-v2-105","module":"v2","type":"mcq","q":"Files created with Lotus 1-2-3 have an extension","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 19","difficulty":"Hard","options":["WK1","XLS","123","DOC"],"answer":"WK1","solution":"A: WK1 is the extension used by Lotus 1-2-3 files.\nB: XLS is the Excel workbook extension.\nC: 123 is not the standard extension cited.\nD: DOC is a Word document extension."},{"id":"med-v1-035","module":"v1","type":"mcq","q":"The liver is involved in detoxification of many poisons and drugs. Which of the following structures is primarily involved in this process and therefore abundant in liver cells?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 6","difficulty":"Hard","options":["smooth ER","Nuclear envelope","Golgi apparatus","rough ER"],"answer":"smooth ER","solution":"A: Smooth ER contains detoxifying enzymes and is abundant in liver cells.\nB: The nuclear envelope is not a site of drug metabolism.\nC: The Golgi modifies and packages molecules rather than detoxifying drugs.\nD: Rough ER is studded with ribosomes and specialises in protein synthesis."},{"id":"med-v3-054","module":"v3","type":"mcq","q":"Which of the following statements concerning a carbonyl group is incorrect?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 5","difficulty":"Hard","options":["It contains two oxygen atoms and one carbon atom","It is present in both aldehydes and ketones","It is polar","more than one correct response E) no correct response"],"answer":"It contains two oxygen atoms and one carbon atom","solution":"A: A carbonyl group has one oxygen and one carbon, not two oxygens, so this statement is incorrect.\nB: It is present in both aldehydes and ketones.\nC: The carbonyl group is polar due to the electronegativity difference.\nD: Only one statement is incorrect here."},{"id":"med-v3-055","module":"v3","type":"mcq","q":"Statements: (1) Aldehydes and ketones readily undergo oxidation to carboxylic acids. (2) Propanone and dimethyl ketone are two names for the same compound. (3) The “silver mirror test” distinguishes between aldehydes and ketones","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 9","difficulty":"Devil Mode","options":["All three statements are true","Only one of the statements is true","Two of the three statements are true","None of the statements is true"],"answer":"Two of the three statements are true","solution":"A: Aldehydes oxidise but ketones resist, while propanone is dimethyl ketone and Tollens' test distinguishes them.\nB: Only one true undercounts.\nC: Two statements are true: the naming equivalence and the silver mirror test.\nD: All true is wrong because ketones resist oxidation."},{"id":"med-v1-036","module":"v1","type":"mcq","q":"When a potassium ion (K+) moves from the soil into the vacuole of a cell on the surface of a root, it must pass through several cellular structures. Which of the following correctly describes the order in which these structures will be encountered by the ion?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 13","difficulty":"Devil Mode","options":["primary cell wall → plasma membrane → tonoplast → cytoplasm → vacuole","primary cell wall → plasma membrane → cytoplasm → tonoplast","secondary cell wall → plasma membrane → primary cell wall → cytoplasm → tonoplast","plasma membrane → primary cell wall → cytoplasm → tonoplast"],"answer":"primary cell wall → plasma membrane → cytoplasm → tonoplast","solution":"A: The tonoplast is reached after the cytoplasm, not before it.\nB: The ion crosses the primary cell wall, then the plasma membrane, then the cytoplasm, then the tonoplast.\nC: Root surface cells have a primary wall, not a secondary wall.\nD: The plasma membrane lies inside the cell wall, so it cannot be encountered first."},{"id":"med-v4-055","module":"v4","type":"mcq","q":"What is the purpose of a logical test in an IF() function?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 9","difficulty":"Medium","options":["To look up a value in a table","To check if a statement is True or False","To format the cell as a number","To sum a range of cells"],"answer":"To check if a statement is True or False","solution":"A: Looking up values is done by lookup functions.\nB: The logical test checks whether a statement is True or False.\nC: Formatting a cell is not the logical test's role.\nD: Summing is done by SUM, not the test."},{"id":"med-v3-056","module":"v3","type":"mcq","q":"Which of the following polyfunctional carboxylic acids is incorrectly characterized?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 1","difficulty":"Medium","options":["pyruvic acid, C3 ketoacid","malic acid, C4 hydroxyacid","glyceric acid, C3 ketodiacid CH CH2 C CH3 CH3 O OH Alex","tartaric acid, C4 dihydroxyacid"],"answer":"glyceric acid, C3 ketodiacid CH CH2 C CH3 CH3 O OH Alex","solution":"A: Pyruvic acid is correctly a C3 keto acid.\nB: Malic acid is correctly a C4 hydroxy acid.\nC: Glyceric acid is incorrectly labelled a C3 ketodiacid.\nD: Tartaric acid is correctly a C4 dihydroxy acid."},{"id":"med-v3-057","module":"v3","type":"mcq","q":"How many saturated noncyclic six-carbon ketones are there?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 2","difficulty":"Medium","options":["two","four","six","eight"],"answer":"six","solution":"A: Two or four undercount the possible noncyclic six-carbon ketones.\nB: Four is too low a count.\nC: There are six saturated noncyclic six-carbon ketones.\nD: Eight overcounts the isomers."},{"id":"med-v6-014","module":"v6","type":"mcq","q":"According to ICIDH, impairment is defined as:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 17","difficulty":"Medium","options":["a personal attitude","an inaccessible building","a restriction in social participation","loss or abnormality of a body structure or function"],"answer":"loss or abnormality of a body structure or function","solution":"A: Attitudes are environmental factors.\nB: An inaccessible building is an environmental factor.\nC: Participation restriction describes disability, not impairment.\nD: Impairment is a medical concept of loss or abnormality of structure or function."},{"id":"med-v2-106","module":"v2","type":"mcq","q":"Which enzyme is responsible for trapping glucose inside a cell by transferring a phosphoryl group from ATP?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["Aconitase","Hexokinase","Aldolase","Enolase"],"answer":"Hexokinase","solution":"A: Aconitase acts in the citric acid cycle.\nB: Hexokinase phosphorylates glucose, trapping it inside the cell.\nC: Aldolase cleaves fructose 1,6-bisphosphate.\nD: Enolase acts late in glycolysis."},{"id":"med-v2-107","module":"v2","type":"mcq","q":"Tuberculostearic acid escapes enzymatic degra- dation in man because it","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 2","difficulty":"Hard","options":["is methylated at 3 positions","is modified","contains cyclic structures","cannot pass through the plasma membrane"],"answer":"is methylated at 3 positions","solution":"A: Methylation at three positions prevents enzymatic degradation of tuberculostearic acid in humans.\nB: Modification is too vague to be the answer.\nC: Cyclic structures are not the reason given.\nD: Plasma membrane passage is not the reason."},{"id":"med-v2-108","module":"v2","type":"mcq","q":"Since most proteins in the body contain the full complement of amino acids, young animals fail to grow on diet deficient in all the following amino acids except","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 1","difficulty":"Hard","options":["Methione","Valine","Asparagine","Histidine"],"answer":"Asparagine","solution":"A: Methionine is essential and must be supplied in the diet.\nB: Valine is an essential branched-chain amino acid.\nC: Asparagine is nonessential and can be synthesised, so its omission does not stop growth.\nD: Histidine is an essential amino acid whose absence prevents growth."},{"id":"med-v4-056","module":"v4","type":"mcq","q":"In PowerPoint, lists are often preferred over paragraphs because:","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 6","difficulty":"Hard","options":["They prevent the use of animations","They are easier for the audience to read quickly","They disable the spelling checker","They use more memory"],"answer":"They are easier for the audience to read quickly","solution":"A: Lists can still be animated.\nB: Lists are easier for an audience to read quickly than dense paragraphs.\nC: Lists do not disable spelling checks.\nD: Lists do not use more memory in any meaningful way."},{"id":"med-v2-109","module":"v2","type":"mcq","q":"Which aromatic amino acid has recently been shown to exhibit phosphorescence?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 3","difficulty":"Devil Mode","options":["Tryptophan","Histidine","Tyrosine","Phenylalanine"],"answer":"Tryptophan","solution":"A: Tryptophan exhibits the phosphorescence described.\nB: Histidine is not an aromatic amino acid in this context.\nC: Tyrosine is aromatic but not the one described.\nD: Phenylalanine is aromatic but not the phosphorescent one cited."},{"id":"med-v7-020","module":"v7","type":"mcq","q":"What is the primary purpose of a ”Filter Question” (Skip Logic) in a questionnaire?","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 1","difficulty":"Devil Mode","options":["To identify a sub-group of respondents for whom specific subsequent questions are relevant","To ensure all respondents answer every question in the set","To measure the intensity of a respondent’s attitude toward a topic","To test the respondent’s honesty"],"answer":"To identify a sub-group of respondents for whom specific subsequent questions are relevant","solution":"A: They route only the relevant subgroup to specific follow-up questions.\nB: They deliberately do not have every respondent answer every item.\nC: Attitude intensity is measured by scales, not filters.\nD: Filter questions do not test honesty directly."},{"id":"med-v5-013","module":"v5","type":"mcq","q":"The word 'ambiguity' comes from a Greek word meaning:","source":"Medicine/HB1 First Semester/Communication skills/ambiguity ppt.pdf | SLIDE 2","difficulty":"Medium","options":["clear","uncertain","hidden","double"],"answer":"uncertain","solution":"A: Clarity is the opposite of ambiguity.\nB: Ambiguity derives from the Greek ambiguus, meaning uncertain.\nC: Hidden is not the etymological meaning.\nD: Double describes one type of ambiguity, not the word's origin."},{"id":"med-v2-110","module":"v2","type":"mcq","q":"Which of the following is an organic non-protein component that is often derived from vitamins and aids in enzyme catalysis?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["Residue","Modulator","Metal ion","Coenzyme"],"answer":"Coenzyme","solution":"A: A residue is an amino acid unit within a protein.\nB: A modulator is a regulatory molecule, not a vitamin-derived catalyst helper.\nC: A metal ion is an inorganic cofactor, not an organic vitamin-derived one.\nD: A coenzyme is an organic non-protein component often derived from vitamins."},{"id":"med-v3-058","module":"v3","type":"mcq","q":"Which of the following functional groups is always found at the end of a carbon chain?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 6","difficulty":"Medium","options":["aldehyde","carboxylic acid","ketone","more than one correct response"],"answer":"more than one correct response","solution":"A: Aldehyde groups occur at the end of a carbon chain.\nB: Carboxylic acid groups also occur at chain ends.\nC: Ketone groups are internal and are not terminal.\nD: Both aldehyde and carboxylic acid are always terminal, so more than one is correct."},{"id":"med-v2-111","module":"v2","type":"mcq","q":"What type of bond bridges the 3’ and 5’ positions of successive sugar residues in a polynucleotide?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["Peptide bond","Hydrogen bond","Phosphodiester bond","Glycosidic bond"],"answer":"Phosphodiester bond","solution":"A: Peptide bonds link amino acids in proteins.\nB: Hydrogen bonds link complementary bases between strands.\nC: Phosphodiester bonds link the 3' and 5' positions of successive sugars.\nD: Glycosidic bonds link the base to the sugar."},{"id":"med-v4-057","module":"v4","type":"mcq","q":"Which tab in the Page Setup dialog box allows you to center a spreadsheet vertically on a page?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 2","difficulty":"Hard","options":["Margins","Sheet","Header/Footer","Page"],"answer":"Margins","solution":"A: Vertical centring is set on the Margins tab of Page Setup.\nB: The Sheet tab handles gridlines and print area.\nC: Header/Footer tab edits headers and footers.\nD: The Page tab handles paper size and orientation."},{"id":"med-v4-058","module":"v4","type":"mcq","q":"When changing printers, how many times do you typically need to select the new printer from the drop-down list?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 1","difficulty":"Hard","options":["Once per worksheet","Every time you open a new workbook","Every time you print","Once, unless you change printers again"],"answer":"Once, unless you change printers again","solution":"A: The setting is not tied to each worksheet.\nB: A new workbook does not reset the printer choice.\nC: Choosing a printer each print job is unnecessary once it is set.\nD: You select the new printer once, and it remains until you change printers again."},{"id":"med-v7-021","module":"v7","type":"fill","q":"For a binomial distribution with n = 10 and p = 0.5, find the mean. (Answer as a number.)","source":"Medicine/HB1 First Semester/Statistical Methods/Slides/Random Variables.pdf | SLIDE 1","difficulty":"Hard","answer":"5","solution":"The mean of a binomial distribution is n times p, so 10 times 0.5 = 5."},{"id":"med-v3-059","module":"v3","type":"mcq","q":"Which of the following is a correct name-composition pairing for an alcohol?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 5","difficulty":"Hard","options":["more than one correct response E) no correct response","2-methylpentanol; 6 carbon atoms and 2 OH groups","glycerol; 3 carbon atoms and 3 OH groups","ethylene glycol; 3 carbon atoms and 2 OH groups"],"answer":"glycerol; 3 carbon atoms and 3 OH groups","solution":"A: Only one pairing is correct.\nB: 2-methylpentanol has six carbons but only one hydroxyl.\nC: Glycerol has three carbons and three hydroxyl groups.\nD: Ethylene glycol has two carbons, not three."},{"id":"med-v4-059","module":"v4","type":"mcq","q":"In a Column chart, where are categories typically organized?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 7","difficulty":"Devil Mode","options":["Plot area","Legend","Vertical axis","Horizontal axis"],"answer":"Horizontal axis","solution":"A: The plot area is the chart region, not the category axis.\nB: The legend identifies series.\nC: The vertical axis holds values in a column chart.\nD: Categories are organised along the horizontal axis."},{"id":"med-v4-060","module":"v4","type":"mcq","q":"The keyboard shortcut to copy a selected slide is:","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 3","difficulty":"Devil Mode","options":["Ctrl + V","Ctrl + C","Ctrl + X","Ctrl + Z"],"answer":"Ctrl + C","solution":"A: Ctrl+V pastes a copied slide.\nB: Ctrl+C copies the selected slide.\nC: Ctrl+X cuts the selected slide.\nD: Ctrl+Z undoes an action."},{"id":"med-v5-014","module":"v5","type":"mcq","q":"The pair 'watch / watch' (a timepiece and the act of looking) illustrates:","source":"Medicine/HB1 First Semester/Communication skills/ambiguity ppt.pdf | SLIDE 6","difficulty":"Medium","options":["semantic ambiguity from homonyms","structural ambiguity","phonological ambiguity","ambiguous reference"],"answer":"semantic ambiguity from homonyms","solution":"A: Watch has two meanings with the same form, so it is semantic homonymy.\nB: No syntactic arrangement is involved.\nC: The words sound the same but the example is about shared form and differing meaning.\nD: The ambiguity is lexical, not pronominal reference."},{"id":"med-v4-061","module":"v4","type":"mcq","q":"How often is it recommended to save your work to prevent data loss?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 3","difficulty":"Medium","options":["Once a day","Every 10 to 15 minutes","Only when finishing the task","Every hour"],"answer":"Every 10 to 15 minutes","solution":"A: Once a day is far too rare.\nB: Saving every ten to fifteen minutes is the recommended habit.\nC: Saving only at the end risks losing work.\nD: Hourly saving is too infrequent to prevent loss."},{"id":"med-v3-060","module":"v3","type":"mcq","q":"In which of the following pairings of compound types does the first listed compound type contain more alkoxy groups than the second listed compound type?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 7","difficulty":"Medium","options":["more than one correct response E) no correct response","aldehyde, hemiacetal","acetal, hemiacetal","hemiacetal, acetal"],"answer":"acetal, hemiacetal","solution":"A: Only one pairing fits.\nB: Aldehydes have no alkoxy groups.\nC: An acetal has two alkoxy groups while a hemiacetal has one, so the first has more.\nD: A hemiacetal has fewer alkoxy groups than an acetal."},{"id":"med-v2-112","module":"v2","type":"mcq","q":"What are the primary elemental components of all lipids?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 1","difficulty":"Medium","options":["Carbon, Oxygen, and Phosphorus","Nitrogen, Phosphorus, and Sulfur","Carbon, Hydrogen, and Oxygen","Carbon, Hydrogen, and Nitrogen"],"answer":"Carbon, Hydrogen, and Oxygen","solution":"A: Phosphorus occurs in phospholipids but not in all lipids.\nB: Nitrogen, phosphorus and sulfur are not universal lipid elements.\nC: Lipids are composed primarily of carbon, hydrogen and oxygen.\nD: Nitrogen is not present in all lipids."},{"id":"med-v3-061","module":"v3","type":"mcq","q":"Statements: (1) In the IUPAC nomenclature system, an aldehyde group has priority over a ketone group. (2) Addition of an alcohol molecule across the carbon-oxygen double bond of an aldehyde produces a compound in which the carbonyl carbon atom bears both an alkoxy group and a hydroxy group. (3) 2-Propenal contains two fewer hydrogen atoms than propionaldehyde","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 10","difficulty":"Hard","options":["All three statements are true","Only one of the statements is true","Two of the three statements are true","None of the statements is true"],"answer":"All three statements are true","solution":"A: Aldehyde outranks ketone in nomenclature, alcohol addition gives an alkoxy and hydroxy on the same carbon, and propenal has two fewer hydrogens, so all three are true.\nB: One true undercounts.\nC: Two true undercounts.\nD: None true is wrong."},{"id":"med-v4-062","module":"v4","type":"mcq","q":"Background styles are variations based on:","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 6","difficulty":"Hard","options":["The font size","Theme colors","The number of slides","The inserted video length"],"answer":"Theme colors","solution":"A: Font size does not define background styles.\nB: Background styles are variations derived from theme colours.\nC: Background styles are not based on slide count.\nD: Video length is irrelevant."},{"id":"med-v8-017","module":"v8","type":"mcq","q":"The indefinite integral of 2x with respect to x is:","source":"Medicine/HB1 First Semester/Algebra/Calculus II.pdf | SLIDE 1","difficulty":"Hard","options":["2x^2 + C","x^2","x^2 + C","2"],"answer":"x^2 + C","solution":"A: The coefficient is wrong.\nB: The constant of integration is missing.\nC: Integrating 2x gives x^2 plus an arbitrary constant C.\nD: Two is the derivative of 2x, not its integral."},{"id":"med-v3-062","module":"v3","type":"mcq","q":"Statements: (1) Propyl alcohol and methoxyethane are constitutional isomers. (2) Zaitsev's rule is used in predicting the major organic product from intermolecular alcohol dehydration. (3) An older name for methyl alcohol is grain alcohol","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 9","difficulty":"Hard","options":["None of the statements is true","Only one of the statements is true","Two of the three statements are true","All three statements are true"],"answer":"Only one of the statements is true","solution":"A: None true is wrong.\nB: Only one of the three statements is true.\nC: Only one statement is true.\nD: Propyl alcohol and methoxyethane are isomers, Zaitsev's rule applies to elimination, but grain alcohol is ethanol not methanol."},{"id":"med-v1-037","module":"v1","type":"mcq","q":"Which of the following is a major cause of the size limits for certain types of cells?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 3","difficulty":"Devil Mode","options":["the difference in plasma membranes between prokaryotes and eukaryotes","the evolution of larger cells after the evolution of smaller cells","the need for a surface area of sufficient area to allow the cellʹs function","the evolution of eukaryotes after the evolution of prokaryotes"],"answer":"the need for a surface area of sufficient area to allow the cellʹs function","solution":"A: Membrane differences between cell types do not set the size limit.\nB: The evolutionary order of cell sizes does not impose a size limit.\nC: Adequate surface area relative to volume is required for exchange and function, limiting cell size.\nD: The sequence of prokaryotic and eukaryotic evolution is unrelated to cell size limits."},{"id":"med-v1-038","module":"v1","type":"mcq","q":"Which of the following relationships between cell structures and their respective functions is correct?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 12","difficulty":"Devil Mode","options":["ribosomes: secretion","chloroplasts: chief sites of cellular respiration","chromosomes: cytoskeleton of the nucleus","cell wall: support, protection"],"answer":"cell wall: support, protection","solution":"A: Ribosomes synthesise proteins rather than performing secretion.\nB: Chloroplasts carry out photosynthesis, not cellular respiration.\nC: Chromosome
