that ethers lack.\nC: Phenols are reactive aromatic compounds.\nD: Ethers are chemically rather inert and resemble alkanes in reactivity."},{"id":"med-v6-020","module":"v6","type":"mcq","q":"Otitis media, mumps and rubella are listed as:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 12","difficulty":"Hard","options":["types of sign language","causes of deafness","hearing threshold categories","forms of sensorineural hearing loss only"],"answer":"causes of deafness","solution":"A: They are unrelated to sign language systems.\nB: These infections and conditions are listed among the causes of deafness.\nC: They are not WHO threshold categories.\nD: They are causes, not types of hearing loss."},{"id":"med-v2-204","module":"v2","type":"mcq","q":"Which base pair requires more energy to separate due to having three hydrogen bonds?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 4","difficulty":"Hard","options":["A - U","G - C","A - T","T - C"],"answer":"G - C","solution":"A: A-U also has two hydrogen bonds.\nB: G-C pairs have three hydrogen bonds and require more energy to separate.\nC: A-T pairs have two hydrogen bonds.\nD: T-C is not a standard Watson-Crick pair."},{"id":"med-v1-062","module":"v1","type":"mcq","q":"Quantum dots are small (15—30 nm diameter), bright particles visible using light microscopy. If the dots can be specifically bound to individual proteins on a plasma membrane of a cell, which of the following correctly describes the advantage of using quantum dots in examining proteins?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 2","difficulty":"Hard","options":["The dots permit the motion of the proteins to be determined more precisely","The dots permit the position of the proteins to be determined more precisely","The dots permit the average distance between the proteins to be determined more precisely","The dots permit the size of the proteins to be determined more precisely"],"answer":"The dots permit the motion of the proteins to be determined more precisely","solution":"A: Quantum dots allow the movement of individual membrane proteins to be tracked over time.\nB: Quantum dots mark location but do not improve positional precision beyond other labels.\nC: Average spacing is not the main advantage of binding dots to individual proteins.\nD: The dots report on the tagged protein, not its precise molecular size."},{"id":"med-v1-063","module":"v1","type":"mcq","q":"Which structure is not part of the endomembrane system?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 15","difficulty":"Devil Mode","options":["chloroplast","nuclear envelope","Golgi apparatus","plasma membrane"],"answer":"chloroplast","solution":"A: Chloroplasts are not part of the endomembrane system.\nB: The nuclear envelope is continuous with the ER and belongs to the endomembrane system.\nC: The Golgi apparatus is a core endomembrane organelle.\nD: The plasma membrane belongs to the endomembrane system."},{"id":"med-v7-035","module":"v7","type":"mcq","q":"A survey asks: ”Don’t you agree that the current grading system is unfair to hard-working stu- dents?” This is an example of:","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 1","difficulty":"Devil Mode","options":["A leading question","A filter question","A recall-dependent question","A double-barreled question"],"answer":"A leading question","solution":"A: The wording 'Don't you agree' pressures the respondent toward agreement, making it a leading question.\nB: It does not route respondents to different questions.\nC: It does not ask about distant past recall.\nD: It asks about one issue only, so it is not double-barreled."},{"id":"med-v2-205","module":"v2","type":"mcq","q":"Which of the following formulas is not entered correctly?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 27","difficulty":"Medium","options":["=10+","10+50","=B7*B1","=B7+"],"answer":"10+50","solution":"A: =10+ is an incomplete formula.\nB: 10+50 lacks the required leading equals sign and is not entered as a formula.\nC: =B7*B1 is correctly entered.\nD: =B7+ is incomplete."},{"id":"med-v1-064","module":"v1","type":"mcq","q":"The chemical reactions involved in respiration are virtually identical between prokaryotic and eukaryotic cells. In eukaryotic cells, ATP is synthesized primarily on the inner membrane of the mitochondria. Where are the corresponding reactions likely to occur in prokaryotic respiration?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 8","difficulty":"Medium","options":["in the cytoplasm","on the endoplasmic reticulum","on the inner plasma membrane","on the inner mitochondrial membrane"],"answer":"on the inner plasma membrane","solution":"A: Glycolysis occurs in the cytoplasm but most ATP synthesis in respiration is membrane-based.\nB: The endoplasmic reticulum is not the site of respiratory ATP synthesis.\nC: Prokaryotes carry out respiratory ATP synthesis on their inner plasma membrane.\nD: The inner mitochondrial membrane applies only to eukaryotes, not prokaryotes."},{"id":"med-v1-065","module":"v1","type":"mcq","q":"Cells require which of the following to form cilia or flagella?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 12","difficulty":"Medium","options":["centrosomes","actin","A and B only","ribosomes"],"answer":"A and B only","solution":"A: Centrosomes give rise to basal bodies that organise the axoneme.\nB: Actin is not a core component of the microtubular axoneme.\nC: Both centrosomes and ribosomes are required, while actin is not.\nD: Ribosomes are needed to make the proteins of the cilia and flagella."},{"id":"med-v2-206","module":"v2","type":"mcq","q":"A sugar is said to be dextrorotatory when it","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 3","difficulty":"Medium","options":["rotates plane polarized light to the right","has OH to the left of the penultimate car- bon","rotates plane polarized light to the left","has OH to the right of the penultimate car- bon"],"answer":"rotates plane polarized light to the right","solution":"A: Dextrorotatory means rotating plane-polarised light to the right.\nB: OH on the left defines an L-sugar, not dextrorotation.\nC: Rotating light left is levorotatory.\nD: OH on the right relates to D configuration, not optical rotation direction."},{"id":"med-v2-207","module":"v2","type":"mcq","q":"You can use drag-and-drop to embed excel worksheet data in a word document","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 31","difficulty":"Hard","options":["By dragging a range of excel data to the word button on the taskbar while pressing the Ctrl key","By dragging a range of excel data to the word button on the taskbar while pressing Shift key","By dragging a range of excel data to the word button on the taskbar while pressing Alt key","None of above"],"answer":"By dragging a range of excel data to the word button on the taskbar while pressing the Ctrl key","solution":"A: Ctrl-drag embeds Excel data into a Word document.\nB: Shift-drag does not embed data in this way.\nC: Alt-drag is not the method described.\nD: A valid method exists, so none of the above is wrong."},{"id":"med-v1-066","module":"v1","type":"mcq","q":"Which of the following contain the 9 + 2 arrangement of microtubules?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 10","difficulty":"Hard","options":["A and C only","flagella","cilia","centrioles"],"answer":"A and C only","solution":"A: Only cilia and flagella have 9+2, so A and C is correct.\nB: Flagella possess the 9+2 microtubule arrangement.\nC: Cilia possess the 9+2 axonemal arrangement.\nD: Centrioles have nine triplet microtubules, not the 9+2 arrangement."},{"id":"med-v2-208","module":"v2","type":"mcq","q":"What is the product of the reaction between an amino acid’s carboxyl group and an amine (R′NH2)?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 2","difficulty":"Hard","options":["A Schiff base","A substituted amide","An acid chloride","An ester"],"answer":"A substituted amide","solution":"A: A Schiff base forms from an aldehyde or ketone with an amine.\nB: A carboxyl group plus an amine gives a substituted amide.\nC: An acid chloride requires a chlorinating agent.\nD: An ester forms from a carboxylic acid and an alcohol."},{"id":"med-v1-067","module":"v1","type":"mcq","q":"The differences among the three categories of cytoskeletal elements would suggest that each of the following has specialized roles. Which of the following is a correct match?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 11","difficulty":"Hard","options":["microfilaments and ciliary motion","microfilaments and the nuclear lamina","microtubules and chromosome movement","microtubules and cleavage furrow formation"],"answer":"microtubules and chromosome movement","solution":"A: Ciliary movement depends on microtubules, not microfilaments.\nB: The nuclear lamina is made of intermediate filaments, not microfilaments.\nC: Microtubules form the spindle that moves chromosomes during division.\nD: Cleavage furrows depend on actin microfilaments, not microtubules."},{"id":"med-v8-024","module":"v8","type":"mcq","q":"If A = {2, 5, 7, 11} and B = {3, 5, 7, 11}, then A ∩ B is:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 1.pdf | SLIDE 17","difficulty":"Devil Mode","options":["{5, 7, 11}","{2, 3, 5, 7, 11}","{2, 3}","the empty set"],"answer":"{5, 7, 11}","solution":"A: The elements common to both sets are 5, 7 and 11.\nB: That is the union, not the intersection.\nC: 2 and 3 are not common to both sets.\nD: The sets do share elements, so the intersection is not empty."},{"id":"med-v2-209","module":"v2","type":"mcq","q":"A typical worksheet has …. Number of columns","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 28","difficulty":"Devil Mode","options":["128","1024","256","512"],"answer":"256","solution":"A: 128 columns is below the standard count given.\nB: 1024 is also above the figure given.\nC: A typical worksheet has 256 columns in this source.\nD: 512 is above the stated figure."},{"id":"med-v2-210","module":"v2","type":"mcq","q":"The disaccharide maltose is produced by the combination of","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 3","difficulty":"Medium","options":["An α-D-glucose and either α- or β-D- glucose","A β-D-glucose and either α- or β-D-glucose","Two α-D-glucose molecules","An α-D-glucose and a β-D-glucose"],"answer":"Two α-D-glucose molecules","solution":"A: An alpha and either alpha or beta is not maltose's definition.\nB: Beta glucose combinations do not give maltose.\nC: Maltose is formed from two alpha-D-glucose molecules.\nD: Alpha plus beta glucose gives a different linkage product."},{"id":"med-v2-211","module":"v2","type":"mcq","q":"One international unit, as defined by the Inter- national Commission on Enzymes, is","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 2","difficulty":"Medium","options":["The amount of enzyme that catalyses the formation of one mole of product in one minute","The amount of enzyme that catalyses the conversion of one mole of substrate to prod- uct in one second","The amount of enzyme that catalyses the formation of one micromole of product in one second","The amount of enzyme that catalyses the formation of one micromole of product in one minute"],"answer":"The amount of enzyme that catalyses the formation of one micromole of product in one minute","solution":"A: One mole per minute is too large a quantity.\nB: One mole per second is not the IU definition.\nC: One micromole per second is not the IU time base.\nD: One IU is the enzyme amount forming one micromole of product per minute."},{"id":"med-v7-036","module":"v7","type":"mcq","q":"Which of the following best describes the flaw in the question: ”Do you believe the university should increase funding for the library and improve student housing?”","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 1","difficulty":"Medium","options":["Leading question","Double-barreled question","Ambiguous question","Loaded question"],"answer":"Double-barreled question","solution":"A: It is not leading because it does not suggest a preferred answer.\nB: It asks about library funding and housing together, so it is double-barreled.\nC: It is not vague but rather combines two issues.\nD: It is not emotionally loaded in the way defined here."},{"id":"med-v3-106","module":"v3","type":"mcq","q":"Which of the following statements concerning the boiling points of carboxylic acids is correct?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 6","difficulty":"Medium","options":["more than one correct response","They are higher than those of corresponding alcohols","They are lower than those of corresponding aldehydes","They are lower than those of corresponding alkanes"],"answer":"They are higher than those of corresponding alcohols","solution":"A: More than one statement is not correct here; only statement A is correct.\nB: Carboxylic acids boil higher than corresponding alcohols because they form hydrogen-bonded dimers.\nC: They do not boil lower than aldehydes; they boil higher.\nD: They do not boil lower than alkanes; carboxylic acids boil higher."},{"id":"med-v2-212","module":"v2","type":"mcq","q":"According to Chargaff’s Rules, which of the following is always true for double-stranded DNA?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["A = C","A + T = G + C","A + G = T + C","G = T"],"answer":"A + G = T + C","solution":"A: A does not equal C; A pairs with T.\nB: A+T need not equal G+C.\nC: In double-stranded DNA A+G equals T+C because purines pair with pyrimidines.\nD: G does not equal T; G pairs with C."},{"id":"med-v2-213","module":"v2","type":"mcq","q":"Lavorotatory sugars are designated as","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 3","difficulty":"Hard","options":["l","d","D","L"],"answer":"L","solution":"A: Lowercase l is not the answer given.\nB: Lowercase d is not the designation used here.\nC: D designates dextrorotatory or D-configuration sugars.\nD: Levorotatory sugars are designated L in this source."},{"id":"med-v4-107","module":"v4","type":"mcq","q":"What is the primary purpose of Microsoft PowerPoint?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 1","difficulty":"Hard","options":["To transform ideas into professional, convincing presentations","To create complex databases","To design high-resolution vector illustrations","To perform advanced statistical calculations"],"answer":"To transform ideas into professional, convincing presentations","solution":"A: PowerPoint's purpose is to turn ideas into professional, convincing presentations.\nB: PowerPoint is not a database tool.\nC: Vector illustration design is not its main function.\nD: Advanced statistics are not its role."},{"id":"med-v4-108","module":"v4","type":"mcq","q":"Which keyboard shortcut closes the active workbook?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 4","difficulty":"Hard","options":["Ctrl + F4","Shift + Esc","Alt + F4","Ctrl + W"],"answer":"Ctrl + F4","solution":"A: Ctrl+F4 closes the active workbook window.\nB: Shift+Esc is not a standard close shortcut.\nC: Alt+F4 closes the whole application window.\nD: Ctrl+W also closes but the source key selects Ctrl+F4."},{"id":"med-v3-107","module":"v3","type":"mcq","q":"Statements: (1) The simplest aldehyde is formaldehyde and the simplest ketone is acetone. (2) Carbonyl group polarity makes dipole-dipole interactions between like aldehyde molecules or like ketone molecules possible. (3) Reaction of a hemiacetal with an alcohol produces an acetal","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 9","difficulty":"Devil Mode","options":["None of the statements is true","Only one of the statements is true","Two of the three statements are true","All three statements are true"],"answer":"All three statements are true","solution":"A: None true is wrong.\nB: One true undercounts.\nC: Two true undercounts.\nD: Formaldehyde and acetone are the simplest aldehydes and ketones, carbonyl polarity allows dipole interactions, and hemiacetals react with alcohols to form acetals, so all three are true."},{"id":"med-v3-108","module":"v3","type":"mcq","q":"The IUPAC name for the compound CH2 C O H CH3 is","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 2","difficulty":"Devil Mode","options":["propanal","acetaldehyde","propionaldehyde","1-ethanal"],"answer":"propanal","solution":"A: Propanal is the IUPAC name of the drawn aldehyde.\nB: Acetaldehyde is a common name, not IUPAC.\nC: Propionaldehyde is the common name of propanal.\nD: 1-ethanal is not a valid IUPAC name."},{"id":"med-v4-109","module":"v4","type":"mcq","q":"What is the file extension for a standard Excel workbook in modern ver- sions?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 3","difficulty":"Medium","options":["XLS","XLM","XLC","XLSX"],"answer":"XLSX","solution":"A: XLS is the older binary format.\nB: XLM relates to old macro sheets.\nC: XLC is not a standard workbook extension.\nD: XLSX is the modern standard Excel workbook extension."},{"id":"med-v7-037","module":"v7","type":"fill","q":"Find the median of 3, 7, 9, 12, 15. (Answer as a number.)","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/ZANIPOLO stas pasco.PDF | SLIDE 1","difficulty":"Medium","answer":"9","solution":"With five ordered values the median is the third value, which is 9."},{"id":"med-v2-214","module":"v2","type":"mcq","q":"In flavin coenzymes, the chemically functional part is the","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 1","difficulty":"Medium","options":["Indole","Imidazole","Isoalloxazine","Pterine"],"answer":"Isoalloxazine","solution":"A: Indole is the ring system of tryptophan, not flavin coenzymes.\nB: Imidazole is a histidine side chain ring.\nC: Isoalloxazine is the chemically functional ring of flavin coenzymes.\nD: Pterine is the ring system of folates."},{"id":"med-v3-109","module":"v3","type":"mcq","q":"Two other acceptable names for the compound acetone are","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 2","difficulty":"Medium","options":["propanone and dimethyl ketone","propanone and diethyl ketone","ethanone and diethyl ketone","ethanone and methyl ethyl ketone"],"answer":"propanone and dimethyl ketone","solution":"A: Acetone is also called propanone and dimethyl ketone.\nB: Diethyl ketone is not another name for acetone.\nC: Ethanone and diethyl ketone are both wrong names here.\nD: Ethanone and methyl ethyl ketone are incorrect for acetone."},{"id":"med-v1-068","module":"v1","type":"mcq","q":"Recent evidence shows that the extracellular matrix can take part in regulating the expression of genes. A likely possibility for this might be which of the following?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 14","difficulty":"Hard","options":["Fibronectin binds to integrins built into the plasma membrane","Intracellular signals might cause changes in the fibronectin binding to the cell surface","Orientation of microfilaments to the ECM can change the gene activity","Mechanical signals of the ECM can alter the cytoskeleton, which can alter intracellular signaling"],"answer":"Mechanical signals of the ECM can alter the cytoskeleton, which can alter intracellular signaling","solution":"A: Fibronectin binding integrins is adhesion, not the described gene-regulating mechanism.\nB: This describes the reverse direction, from inside the cell to the ECM.\nC: Microfilament orientation alone is not the accepted route for ECM-driven gene regulation.\nD: Mechanical signals from the ECM can reshape the cytoskeleton and trigger intracellular signalling that affects gene expression."},{"id":"med-v1-069","module":"v1","type":"mcq","q":"Cyanide binds with at least one molecule involved in producing ATP. If a cell is exposed to cyanide, most of the cyanide would be found within the","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 16","difficulty":"Hard","options":["ribosomes","lysosomes","mitochondria","peroxisomes"],"answer":"mitochondria","solution":"A: Ribosomes are not the primary site of cyanide binding in ATP production.\nB: Lysosomes play no role in cyanide-sensitive ATP production.\nC: Cyanide inhibits cytochrome oxidase in the mitochondrial electron transport chain.\nD: Peroxisomes are not the main site of cyanide's effect on ATP synthesis."},{"id":"med-v4-110","module":"v4","type":"mcq","q":"If a document is wider than it is tall, which orientation is recommended?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 2","difficulty":"Hard","options":["Landscape","Vertical","Narrow","Portrait"],"answer":"Landscape","solution":"A: Landscape orientation suits a document wider than it is tall.\nB: Vertical is another name for portrait.\nC: Narrow is not a standard orientation option.\nD: Portrait is taller than wide, not suitable here."},{"id":"med-v2-215","module":"v2","type":"mcq","q":"Which molecule serves as the ”energy-rich” end product of energy-releasing pathways and drives most cellular processes?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 1","difficulty":"Hard","options":["DNA","mRNA","cAMP","ATP"],"answer":"ATP","solution":"A: DNA stores genetic information rather than driving cellular work directly.\nB: mRNA carries coding information for protein synthesis.\nC: cAMP acts as a signalling molecule, not a universal energy donor.\nD: ATP is the energy-rich product that powers most cellular processes."},{"id":"med-v7-038","module":"v7","type":"fill","q":"In how many ways can 2 items be chosen from 5 distinct items? (Answer as a number.)","source":"Medicine/HB1 First Semester/Statistical Methods/Slides/PERMUTATIONS AND COMBINATIONS A VERY QUICK REVIEW.pdf | SLIDE 1","difficulty":"Devil Mode","answer":"10","solution":"The number of combinations is 5 choose 2, calculated as 5!/(2!3!) = 10."}]};
let mod = BANK.modules[0].id;
let list = [];
let idx = 0;
let ans = {};
let secs = 7200;
let tick = null;
let done = false;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function drawMods(){
  document.getElementById('mods').innerHTML = BANK.modules.map(function(m){
    return '<button class="modbtn'+(m.id===mod?' sel':'')+'" onclick="pick(\''+m.id+'\')">'+
      '<b>'+esc(m.name)+'</b><span>'+esc(m.desc)+' - '+m.count+' questions</span></button>';
  }).join('');
}
function pick(id){ mod=id; drawMods(); }

function begin(){
  list = BANK.questions.filter(function(q){return q.module===mod});
  if(!list.length){alert('No questions in this set');return}
  idx=0; ans={}; secs=7200; done=false;
  document.getElementById('start').style.display='none';
  document.getElementById('exam').style.display='block';
  document.getElementById('results').style.display='none';
  document.getElementById('timerbar').style.display='flex';
  document.getElementById('td').textContent='2:00:00';
  document.getElementById('quizSub').textContent=BANK.modules.filter(function(m){return m.id===mod})[0].name+' - '+list.length+' questions';
  clearInterval(tick);
  tick=setInterval(function(){
    secs--;
    if(secs<=0){clearInterval(tick);finish();return}
    var h=Math.floor(secs/3600), m=Math.floor((secs%3600)/60), s=secs%60;
    document.getElementById('td').textContent=h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    var bar=document.getElementById('timerbar');
    bar.className='timerbar'+(secs<=300?' danger':secs<=900?' warn':'');
  },1000);
  render();
}
function toggleTimer(){
  var b=document.getElementById('timerbar'), td=document.getElementById('td');
  if(b.dataset.hidden==='1'){b.style.display='flex';b.dataset.hidden='0';document.getElementById('hideBtn').textContent='Hide'}
  else{b.style.display='none';b.dataset.hidden='1'}
}
function setAnsIdx(i){
  ans[idx]=list[idx].options[i];
  var btns=document.querySelectorAll('.opt');
  btns.forEach(function(b,j){ b.className='opt'+(j===i?' sel':''); });
  renderNav();
}
function setAns(v){ ans[idx]=v; renderNav(); }

function render(){
  var q=list[idx];
  var opts='';
  if(q.type==='mcq'){
    opts='<div class="opts">'+q.options.map(function(o,i){
      var k=String.fromCharCode(65+i);
      return '<button class="opt'+(ans[idx]===o?' sel':'')+'" onclick="setAnsIdx('+i+')">'+
        '<span class="key">'+k+'</span><span>'+esc(o)+'</span></button>';
    }).join('')+'</div>';
  }else{
    opts='<div class="fillrow"><label>Answer:</label><input type="text" id="fill" placeholder="type your answer" value="'+esc(ans[idx]||'')+'" oninput="ans['+idx+']=this.value;renderNav()"><span class="hint">numeric or short answer</span></div>';
  }
  document.getElementById('exam').innerHTML=
    '<div class="card"><div class="qhead"><span class="qnum">Question '+(idx+1)+' of '+list.length+'</span>'+
    '<span class="qtag">'+esc(q.difficulty||'Medium')+' - '+esc(q.source||'')+'</span></div>'+
    '<div class="qtext">'+esc(q.q)+'</div>'+opts+'</div>'+
    '<div class="navrow"><button class="btn prev" onclick="go(-1)" '+(idx===0?'disabled':'')+'>Previous page</button>'+
    (idx===list.length-1?'<button class="btn finish" onclick="finish()">Submit exam</button>':'<button class="btn next" onclick="go(1)">Next page</button>')+'</div>'+
    '<div class="qgrid" id="qgrid"></div>';
  renderNav();
  window.scrollTo(0,0);
}
function renderNav(){
  var g=document.getElementById('qgrid'); if(!g)return;
  g.innerHTML=list.map(function(_,i){
    var c=(ans[i]!==undefined&&ans[i]!=='')?' done':'';
    if(i===idx)c+=' cur';
    return '<button class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</button>';
  }).join('');
}
function go(d){ var n=idx+d; if(n<0||n>=list.length)return; idx=n; render(); }
function jump(i){ idx=i; render(); }

function finish(){
  if(done)return; done=true; clearInterval(tick);
  var correct=0,wrong=0,skip=0,html='';
  list.forEach(function(q,i){
    var u=ans[i], ok=false;
    if(u===undefined||u===''){skip++}
    else if(q.type==='mcq'){ok=(u===q.answer)}
    else{
      var a=String(q.answer).trim().toLowerCase(), b=String(u).trim().toLowerCase();
      ok=(a===b);
      if(!ok){var na=parseFloat(a),nb=parseFloat(b); if(!isNaN(na)&&!isNaN(nb))ok=Math.abs(na-nb)<=0.005}
    }
    if(ok)correct++;else if(u!==undefined&&u!=='')wrong++;
    html+='<div class="item '+(ok?'':'wrong')+'"><div class="qq">Q'+(i+1)+'. '+esc(q.q)+'</div>'+
      '<div class="aa '+(ok?'ok':'no')+'">Your answer: '+esc(u===undefined||u===''?'-':u)+'</div>'+
      (ok?'':'<div class="aa ok">Correct: '+esc(q.answer)+'</div>')+
      (q.solution?'<div class="sol"><b>Solution:</b> '+esc(q.solution)+'</div>':'')+'</div>';
  });
  var pct=Math.round(correct/list.length*100);
  document.getElementById('exam').style.display='none';
  document.getElementById('timerbar').style.display='none';
  document.getElementById('results').style.display='block';
  document.getElementById('results').innerHTML=
    '<div class="res"><h2>Examination complete</h2><div class="score">'+pct+'%</div>'+
    '<div class="rstat"><div><b>'+correct+'</b>Correct</div><div><b>'+wrong+'</b>Wrong</div><div><b>'+skip+'</b>Skipped</div></div>'+
    '<p style="color:var(--muted);font-size:13px">Review — wrong and skipped answers shown with worked solutions.</p></div>'+html+
    '<button class="bigbtn" onclick="location.reload()">New attempt</button>';
  window.scrollTo(0,0);
}
drawMods();
</script>
</body>
</html>
