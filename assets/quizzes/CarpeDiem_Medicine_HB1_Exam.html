iculty":"Hard","options":["one carbon atom and one oxygen atom","two carbon atoms and two oxygen atoms","one carbon atom and two oxygen atoms","two carbon atoms and one oxygen atom"],"answer":"one carbon atom and one oxygen atom","solution":"A: The simplest alcohol, methanol, has one carbon and one oxygen.\nB: Two carbons and two oxygens is not the simplest alcohol.\nC: Methanol has one oxygen, not two.\nD: Ethanol has two carbons and is not the simplest."},{"id":"med-v4-082","module":"v4","type":"mcq","q":"Which function returns the current date and time from the computer’s system clock?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 5","difficulty":"Devil Mode","options":["DATE()","NOW()","TODAY()","TIME()"],"answer":"NOW()","solution":"A: DATE builds a date from parts rather than reading the clock.\nB: NOW returns the current date and time from the system clock.\nC: TODAY returns only the date, not the time.\nD: TIME returns only the time portion."},{"id":"med-v1-048","module":"v1","type":"mcq","q":"Of the following, which cell structure would most likely be visible with a light microscope that has been manufactured to the maximum resolving power possible?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 10","difficulty":"Devil Mode","options":["mitochondrion","microtubule","largest microfilament","ribosome"],"answer":"mitochondrion","solution":"A: Mitochondria are large enough to be resolved by the best light microscopes.\nB: Microtubules are about 25 nm, below light-microscope resolution.\nC: Microfilaments are far too thin to be seen with light.\nD: Ribosomes at about 20 nm cannot be resolved by light microscopy."},{"id":"med-v4-083","module":"v4","type":"mcq","q":"The Ribbon in PowerPoint 2013 replaces which features found in older versions?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 2","difficulty":"Medium","options":["The Slide Pane and Outline Pane","The Status Bar and Zoom Slider","The Title Bar and Close button","Menus and toolbars"],"answer":"Menus and toolbars","solution":"A: Slide and outline panes still exist.\nB: Status bar and zoom slider remain in the newer interface.\nC: Title bar and close button remain.\nD: The Ribbon replaced traditional menus and toolbars."},{"id":"med-v7-025","module":"v7","type":"mcq","q":"Why should researchers avoid ”Double-Barreled” questions?","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 3","difficulty":"Medium","options":["They take too long for the respondent to read","They force a respondent into a ”Yes” or ”No” answer","They produce data that is impossible to interpret accurately","They are only used in qualitative research"],"answer":"They produce data that is impossible to interpret accurately","solution":"A: Length is not the core methodological problem.\nB: Forcing yes/no describes a dichotomous question, not this flaw.\nC: Combining two issues makes the answer impossible to interpret accurately.\nD: Such questions are not confined to qualitative research."},{"id":"med-v2-169","module":"v2","type":"mcq","q":"An enzyme that is active only over a very narrow pH range and has an optimal pH of approximately 1.5 is most likely:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 3","difficulty":"Medium","options":["Catalase","Pepsin","Trypsin","Arginase"],"answer":"Pepsin","solution":"A: Catalase works near neutral pH.\nB: Pepsin acts in the stomach at about pH 1.5.\nC: Trypsin works in the alkaline small intestine.\nD: Arginase also works near neutral pH."},{"id":"med-v7-026","module":"v7","type":"fill","q":"A die is rolled. What is the probability of an even number? (Answer as a fraction like 1/2.)","source":"Medicine/HB1 First Semester/Statistical Methods/Slides/Statistical_Methods_1__Med_Sch__.pdf | SLIDE 1","difficulty":"Medium","answer":"1/2","solution":"Three of the six faces (2, 4, 6) are even, so the probability is 3/6 = 1/2."},{"id":"med-v2-170","module":"v2","type":"mcq","q":"Corn contains an uncommon amino acid called","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 1","difficulty":"Hard","options":["aminoadipic acid","phosphoserine","N,N,N-trimethyllysin","N-acetyllysin"],"answer":"N-acetyllysin","solution":"A: Aminoadipic acid is not the uncommon amino acid cited for corn.\nB: Phosphoserine is a phosphorylated residue, not this corn amino acid.\nC: Trimethyllysine is a modified lysine but not the corn example here.\nD: N-acetyllysine is the uncommon amino acid given in the source key for corn."},{"id":"med-v2-171","module":"v2","type":"mcq","q":"What is the primary function of the Nucleolus?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 2","difficulty":"Hard","options":["Lipid synthesis","Synthesis of ribosomal RNA","DNA replication","Protein synthesis"],"answer":"Synthesis of ribosomal RNA","solution":"A: Lipid synthesis occurs mainly in the smooth ER.\nB: The nucleolus is the site of ribosomal RNA synthesis and subunit assembly.\nC: DNA replication occurs in the nucleus, not the nucleolus.\nD: Protein synthesis occurs on ribosomes in the cytoplasm or on rough ER."},{"id":"med-v4-084","module":"v4","type":"mcq","q":"What symbol is used as the concatenation operator to join text and num- bers?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 9","difficulty":"Hard","options":["*","+","#","&"],"answer":"&","solution":"A: Asterisk is multiplication.\nB: Plus is arithmetic addition, not text joining.\nC: Hash mark is not a concatenation operator.\nD: The ampersand is the concatenation operator in Excel."},{"id":"med-v3-081","module":"v3","type":"mcq","q":"How many hydrogen bonds can form between an isopropyl molecule and other isopropanol molecules?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 2","difficulty":"Hard","options":["three","four","two","one"],"answer":"three","solution":"A: Three hydrogen bonds can form around an isopropanol molecule in this account.\nB: Four overstates the number.\nC: Two is not the stated number.\nD: One hydrogen bond understates the capacity given in this source."},{"id":"med-v3-082","module":"v3","type":"mcq","q":"Statements: (1) The compound 4-oxopentanal contains both an aldehyde and an ether functional group. (2) An alkoxy group and a hydroxy group attached to the same carbon atom are present in both hemiacetals and acetals. (3) Cyclic aldehyde structures are possible but cyclic ketone structures are not possible","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 10","difficulty":"Devil Mode","options":["All three statements are true","Only one of the statements is true","Two of the three statements are true","None of the statements is true"],"answer":"Two of the three statements are true","solution":"A: 4-oxopentanal has an aldehyde and a ketone, acetals lack a hydroxyl group, and cyclic ketones do exist.\nB: One true is wrong.\nC: None of the statements is true.\nD: All true is wrong."},{"id":"med-v4-085","module":"v4","type":"mcq","q":"What does the function LEN() calculate?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 8","difficulty":"Devil Mode","options":["The width of a column","The font size of the text","The number of characters in a text string","The number of cells in a range"],"answer":"The number of characters in a text string","solution":"A: Column width is a separate setting.\nB: Font size is a formatting property.\nC: LEN returns the number of characters in a text string.\nD: Counting cells in a range is done by COUNT, not LEN."},{"id":"med-v2-172","module":"v2","type":"mcq","q":"Which process allows plants to produce carbohydrates?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 1","difficulty":"Medium","options":["Glycolysis","Fermentation","Photosynthesis","Respiration"],"answer":"Photosynthesis","solution":"A: Glycolysis breaks down glucose rather than making it.\nB: Fermentation is an anaerobic breakdown pathway.\nC: Photosynthesis fixes carbon dioxide to produce carbohydrates in plants.\nD: Respiration consumes carbohydrates to release energy."},{"id":"med-v4-086","module":"v4","type":"mcq","q":"The ”Backstage View” in PowerPoint is primarily used for:","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 1","difficulty":"Medium","options":["Animating individual objects","Grouping and rotating shapes","Creating new blank presentations or choosing templates","Changing the alignment of text within a placeholder"],"answer":"Creating new blank presentations or choosing templates","solution":"A: Animating objects is done from the Animations tab.\nB: Grouping and rotating are Home tab commands.\nC: Backstage View handles file-level tasks like creating new presentations or choosing templates.\nD: Text alignment is a formatting command."},{"id":"med-v2-173","module":"v2","type":"mcq","q":"The Michaelis-Menten constant (Km) is defined as:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["The rate at which the enzyme-substrate complex dissociates into product","The maximum velocity (Vmax) divided by two","The substrate concentration at which the reaction velocity is half of Vmax","The total concentration of enzyme in the reaction"],"answer":"The substrate concentration at which the reaction velocity is half of Vmax","solution":"A: The dissociation rate is not the Km definition.\nB: Vmax divided by two is a value, not the definition of Km.\nC: Km is the substrate concentration at which velocity is half of Vmax.\nD: Total enzyme concentration is not Km."},{"id":"med-v3-083","module":"v3","type":"mcq","q":"The general structural difference between a carboxylic acid and an ester is the same as that between an","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 7","difficulty":"Medium","options":["more than one correct response","alcohol and an ether","alkane and an alkene","aldehyde and a ketone"],"answer":"alcohol and an ether","solution":"A: More than one analogy does not apply, so this option is wrong.\nB: Replacing the acidic hydrogen of a carboxylic acid with an alkyl group gives an ester, analogous to alcohol versus ether.\nC: Alkane and alkene differ in saturation.\nD: Aldehyde and ketone differ by substituents on the carbonyl carbon, not by hydrogen replacement."},{"id":"med-v4-087","module":"v4","type":"mcq","q":"To move a slide to a new location in the presentation, you should:","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 3","difficulty":"Hard","options":["Click and drag the slide in the slides tab on the left","Change the view to ”Slide Show” and right-click","Use the ”Insert” tab and select ”Object”","Copy and paste it multiple times"],"answer":"Click and drag the slide in the slides tab on the left","solution":"A: Dragging the slide in the left slides tab moves it to a new position.\nB: Slide Show view is not for reorganising slides.\nC: Insert Object adds an object, not a move.\nD: Copying and pasting duplicates a slide rather than moving it."},{"id":"med-v3-084","module":"v3","type":"mcq","q":"The correct IUPAC name for is","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 3","difficulty":"Hard","options":["1,4-diiodophenol","2,4-diiodophenol","2,5-diiodophenol","1,5-diiodophenol"],"answer":"2,5-diiodophenol","solution":"A: 1,4-diiodophenol is not the correct locant set shown.\nB: 2,4-diiodophenol misplaces one iodine.\nC: 2,5-diiodophenol is the correct IUPAC name.\nD: 1,5-diiodophenol is not a valid numbering for phenol."},{"id":"med-v3-085","module":"v3","type":"mcq","q":"Comparison of the boiling points of aldehydes and ketones with those of other compounds of similar molecular mass shows that they are","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 3","difficulty":"Hard","options":["higher than those of alcohols but lower than those of alkanes","lower than those of alkanes and alcohols","higher than those of alkanes","higher than those of alcohols and alkanes"],"answer":"higher than those of alkanes","solution":"A: They are not higher than alcohols.\nB: Carbonyl compounds boil higher than alkanes but lower than alcohols.\nC: Their boiling points are higher than those of alkanes of similar mass.\nD: They are not lower than alkanes."},{"id":"med-v2-174","module":"v2","type":"mcq","q":"Which type of reversible inhibition involves the inhibitor binding to the same site as the substrate?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["Uncompetitive inhibition","Competitive inhibition","Noncompetitive inhibition","Allosteric inhibition"],"answer":"Competitive inhibition","solution":"A: Uncompetitive inhibition binds the ES complex.\nB: Competitive inhibition involves binding the same site as the substrate.\nC: Noncompetitive inhibition binds away from the active site.\nD: Allosteric inhibition is a form of noncompetitive regulation."},{"id":"med-v3-086","module":"v3","type":"mcq","q":"What two functional groups are never found at the end of a carbon chain?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 2","difficulty":"Devil Mode","options":["alcohol and ketone","alcohol and aldehyde","ether and aldehyde","ether and ketone"],"answer":"ether and ketone","solution":"A: Ketones are internal, but alcohols may be terminal.\nB: Alcohol groups can occur at chain ends.\nC: Aldehydes are terminal, but ethers are not paired correctly here.\nD: Ether and ketone groups are never found at the end of a carbon chain."},{"id":"med-v3-087","module":"v3","type":"mcq","q":"In which of the following pairs of alcohols do both members of the pair contain two or more hydroxyl groups?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 1","difficulty":"Devil Mode","options":["propanol alcohol and t-butanol alcohol","s-butanol and ethylene glycol","t-butyl alcohol and ethylene glycol","propylene glycol and glycerol"],"answer":"propylene glycol and glycerol","solution":"A: Propanol and t-butanol each have a single hydroxyl.\nB: Secondary butanol has one hydroxyl, so this pair fails.\nC: Tertiary butyl alcohol has only one hydroxyl.\nD: Both propylene glycol and glycerol contain two or more hydroxyl groups."},{"id":"med-v2-175","module":"v2","type":"mcq","q":"Data can be arranged in a worksheet in a easy to understand manner using","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 31","difficulty":"Medium","options":["auto formatting","changing fonts","applying styles","all of above"],"answer":"all of above","solution":"A: Auto formatting can arrange data clearly.\nB: Changing fonts also helps presentation.\nC: Applying styles also improves readability.\nD: All of these methods arrange worksheet data understandably."},{"id":"med-v3-088","module":"v3","type":"mcq","q":"Which of the following general types of compounds is always a heterocyclic compound?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 7","difficulty":"Medium","options":["a substituted phenol","a cyclic compound with both hydroxy and alkoxy substituents on the ring","more than one correct response E) no correct response","a cyclic ether"],"answer":"a cyclic ether","solution":"A: Substituted phenols are not necessarily heterocyclic.\nB: A ring with hydroxy and alkoxy substituents need not contain a heteroatom in the ring.\nC: Only one type is always heterocyclic.\nD: A cyclic ether has a heteroatom in its ring and is always heterocyclic."},{"id":"med-v2-176","module":"v2","type":"mcq","q":"The Chart wizard term data categories refers to","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 29","difficulty":"Medium","options":["The data range that supply chart data","A chart plot area","The organization of individual values with a chart’s data series","A horizontal axis"],"answer":"A horizontal axis","solution":"A: The data range supplies chart data rather than defining categories.\nB: A plot area is not what data categories refer to.\nC: Organisation of individual values describes data series, not categories.\nD: Data categories refer to the horizontal axis in this source."},{"id":"med-v4-088","module":"v4","type":"mcq","q":"What is a ”nested function”?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 3","difficulty":"Medium","options":["A function used only for text manipulation","A function that has failed to calculate","A function that is hidden in the worksheet","A function used as an argument inside another function"],"answer":"A function used as an argument inside another function","solution":"A: Nesting is not limited to text functions.\nB: A failed function is an error, not a nested one.\nC: Nested functions are not hidden in the worksheet.\nD: A nested function is one used as an argument inside another function."},{"id":"med-v7-027","module":"v7","type":"fill","q":"Find the mode of 2, 2, 3, 4, 4, 4, 5. (Answer as a number.)","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/ZANIPOLO stas pasco.PDF | SLIDE 1","difficulty":"Hard","answer":"4","solution":"The value 4 occurs three times, more often than any other, so the mode is 4."},{"id":"med-v8-021","module":"v8","type":"mcq","q":"The logarithm rule for log(a) + log(b) is:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 8.pdf | SLIDE 1","difficulty":"Hard","options":["log(a/b)","log(a + b)","log(ab)","log(a - b)"],"answer":"log(ab)","solution":"A: Log(a/b) equals log a minus log b.\nB: Log of a sum is not log a plus log b.\nC: The product rule states log a + log b equals log(ab).\nD: There is no simple rule giving log of a difference."},{"id":"med-v7-028","module":"v7","type":"mcq","q":"When designing a questionnaire, a ”Pilot Test” is conducted primarily to:","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 3","difficulty":"Hard","options":["Identify and correct ambiguous questions or technical errors","Calculate the final mean and standard deviation","Select the sample population","Gather final data for the research report"],"answer":"Identify and correct ambiguous questions or technical errors","solution":"A: A pilot test identifies ambiguous questions and technical errors before the main study.\nB: Final statistics come from the main study, not the pilot.\nC: It does not select the sample population.\nD: A pilot test is not used to gather final report data."},{"id":"med-v3-089","module":"v3","type":"mcq","q":"In which of the following pairs of compounds are the two members of the pair constitutional isomers?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 4","difficulty":"Hard","options":["pentanol and pentanediol","methoxymethane and ethoxyethane","propyl alcohol and dipropyl ether","isobutyl alcohol and diethyl ether"],"answer":"isobutyl alcohol and diethyl ether","solution":"A: Pentanol and pentanediol differ in oxygen count.\nB: Methoxymethane and ethoxyethane differ by a carbon, not isomers.\nC: Propyl alcohol and dipropyl ether have different formulas.\nD: Isobutyl alcohol and diethyl ether share a formula but differ in connectivity."},{"id":"med-v2-177","module":"v2","type":"mcq","q":"Hydrolytic reactions cleave bonds by:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 3","difficulty":"Devil Mode","options":["Using ATP to form a new bond","Rearranging the molecular structure","Adding water","Removing a carbon dioxide molecule"],"answer":"Adding water","solution":"A: ATP-driven bond formation is ligation.\nB: Rearrangement within a molecule is isomerisation.\nC: Hydrolysis cleaves bonds by adding water across them.\nD: Removing carbon dioxide is decarboxylation, not hydrolysis."},{"id":"med-v3-090","module":"v3","type":"mcq","q":"Statements: (1) A carboxylic acid and its corresponding carboxylate ion differ in the number of oxygen atoms they contain. (2) In ester hydrolysis, the carbon-oxygen double bond breaks producing an alcohol and a carboxylic acid. (3) The acronym PET stands for polyester(terephthalate)","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 9","difficulty":"Devil Mode","options":["Two of the three statements are true","Only one of the statements is true","All three statements are true","None of the statements is true"],"answer":"None of the statements is true","solution":"A: None of the three statements is correct.\nB: Only one true is wrong.\nC: Carboxylic acid and carboxylate differ by a hydrogen, not oxygen count; ester hydrolysis breaks a C-O single bond, and PET is polyethylene terephthalate.\nD: All true is wrong because the statements fail."},{"id":"med-v4-089","module":"v4","type":"mcq","q":"Multimedia in PowerPoint includes which of the following?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 7","difficulty":"Medium","options":["Pictures, sounds, and videos","Only file names and extensions","Only text and tables","Only themes and backgrounds"],"answer":"Pictures, sounds, and videos","solution":"A: Multimedia includes pictures, sounds and videos.\nB: It is not just file names and extensions.\nC: Multimedia is not limited to text and tables.\nD: Themes and backgrounds are separate design features."},{"id":"med-v4-090","module":"v4","type":"mcq","q":"Why is it generally better to use a built-in function like PMT() rather than writing a manual equation for a loan payment?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 2","difficulty":"Medium","options":["Built-in functions reduce the likelihood of typographical errors and solve faster","Manual equations are processed faster by Excel","Manual equations do not allow for the use of cell references","Built-in functions are always more colorful"],"answer":"Built-in functions reduce the likelihood of typographical errors and solve faster","solution":"A: Built-in functions reduce typographical errors and solve more reliably.\nB: Manual equations are not necessarily faster.\nC: Manual equations can use cell references too.\nD: Colours are irrelevant to function choice."},{"id":"med-v1-049","module":"v1","type":"mcq","q":"A biologist ground up some plant leaf cells and then centrifuged the mixture to fractionate the organelles. Organelles in one of the heavier fractions could produce ATP in the light, while organelles in the lighter fraction could produce ATP in the dark. The heavier and lighter fractions are most likely to contain, respectively,","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 8","difficulty":"Medium","options":["chloroplasts and peroxisomes","chloroplasts and mitochondria","mitochondria and chloroplasts","peroxisomes and chloroplasts"],"answer":"chloroplasts and mitochondria","solution":"A: Peroxisomes are not the light fraction that makes ATP in the dark.\nB: Chloroplasts pellet in the heavier fraction and make ATP in light; mitochondria in the lighter fraction make ATP in the dark.\nC: Chloroplasts are heavier than mitochondria, so this order is reversed.\nD: The heavier light-producing fraction is chloroplasts, not peroxisomes."},{"id":"med-v1-050","module":"v1","type":"mcq","q":"A biologist is studying kidney tubules in small mammals. She wants specifically to examine the juxtaposition of different types of cells in these structures. The cells in question can be distinguished by external shape, size, and 3-dimensional characteristics. Which would be the optimum method for her study?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 2","difficulty":"Medium","options":["scanning electron microscopy","transmission electron microscopy","cell fractionation","light microscopy using stains specific to kidney function"],"answer":"scanning electron microscopy","solution":"A: Scanning electron microscopy gives detailed three-dimensional surface views of cells in tissue.\nB: TEM shows thin internal sections, not the three-dimensional arrangement of cell types.\nC: Cell fractionation destroys tissue architecture, so it cannot show cellular juxtaposition.\nD: Stained light microscopy cannot resolve the detailed 3-D cell arrangements required."},{"id":"med-v5-021","module":"v5","type":"mcq","q":"The main goal of effective communication is to:","source":"Medicine/HB1 First Semester/Communication skills/ambiguity ppt.pdf | SLIDE 1","difficulty":"Hard","options":["convey meaning accurately and clearly","speak as quickly as possible","use the longest words possible","avoid all questions"],"answer":"convey meaning accurately and clearly","solution":"A: Clear, accurate transfer of meaning is the central aim.\nB: Speed alone does not ensure understanding.\nC: Long words do not improve communication.\nD: Questions are often essential to communication."},{"id":"med-v4-091","module":"v4","type":"mcq","q":"To remove a filter and show all data again, which command is used?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 9","difficulty":"Hard","options":["Undo","Reset","Clear","Delete"],"answer":"Clear","solution":"A: Undo reverses the last action, not specifically a filter.\nB: Reset is not the standard filter-removal command.\nC: The Clear command removes a filter and shows all data again.\nD: Delete removes content, not a filter."},{"id":"med-v2-178","module":"v2","type":"mcq","q":"Which amino acid does not have a free alpha-amino group because its side chain is fused to the amino group?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 1","difficulty":"Hard","options":["Histidine","Tryptophan","Glycine","Proline"],"answer":"Proline","solution":"A: Histidine has a free alpha-amino group.\nB: Tryptophan also has a free alpha-amino group.\nC: Glycine has a free alpha-amino group.\nD: Proline's amino nitrogen is part of a ring fused to the side chain, so it is not a free alpha-amino group."},{"id":"med-v2-179","module":"v2","type":"mcq","q":"What happens beyond the committed step of a metabolic pathway?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 4","difficulty":"Hard","options":["The pathway stops until more ATP is available","The enzyme is degraded","The reaction proceeds to completion","The reaction reverses"],"answer":"The reaction proceeds to completion","solution":"A: The pathway does not pause for ATP at this point.\nB: The enzyme is not degraded after the committed step.\nC: Beyond the committed step the pathway proceeds to completion.\nD: The committed step does not reverse under normal conditions."},{"id":"med-v3-091","module":"v3","type":"mcq","q":"The sulfhydryl functional group is found in","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 4","difficulty":"Devil Mode","options":["disulfides","thiols","neither thiols nor disulfides","both thiols and disulfides"],"answer":"thiols","solution":"A: Disulfides contain an S-S bond, not free sulfhydryl groups.\nB: The sulfhydryl SH group defines thiols.\nC: It is present in thiols, so neither is wrong.\nD: The group is not present in both types."},{"id":"med-v5-022","module":"v5","type":"mcq","q":"A compound-complex sentence contains:","source":"Medicine/HB1 First Semester/Communication skills/CLASSIFICATION OF SENTENCES.docx | DOCUMENT 1","difficulty":"Devil Mode","options":["two or more independent clauses and at least one subordinate clause","one independent clause only","a single phrase with no verb","only subordinate clauses"],"answer":"two or more independent clauses and at least one subordinate clause","solution":"A: A compound-complex sentence combines compound and complex features, with multiple independent clauses plus a subordinate one.\nB: That describes a simple sentence.\nC: A phrase without a verb is not a compound-complex sentence.\nD: Only subordinate clauses would not form such a sentence."},{"id":"med-v2-180","module":"v2","type":"mcq","q":"Double bonds in natural unsaturated fatty acids are nearly always in which configuration?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["Saturated","Cis","Trans","Branched"],"answer":"Cis","solution":"A: Saturated means no double bonds.\nB: Natural unsaturated fatty acids have nearly always cis double bonds.\nC: Trans double bonds are rare in natural fatty acids.\nD: Branched describes chain shape, not double-bond geometry."},{"id":"med-v3-092","module":"v3","type":"mcq","q":"Statements: (1) Pyruvic acid is the keto-derivative of propanoic acid. (2) Reaction of a carboxylic acid with a thiol produces a thioester, a compound containing two carbon-sulfur single bonds. (3) One of the products of an esterification reaction is water","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 11","difficulty":"Medium","options":["All three statements are true","None of the statements is true","Only one of the statements is true","Two of the three statements are true"],"answer":"All three statements are true","solution":"A: Pyruvic acid is the keto derivative of propanoic acid, thiols give thioesters with two C-S bonds, and esterification releases water, so all three are true.\nB: None true is wrong.\nC: One true undercounts.\nD: Two true undercounts."},{"id":"med-v1-051","module":"v1","type":"mcq","q":"All of the following serve an important role in determining or maintaining the structure of plant cells. Which of the following are distinct from the others in their composition?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 12","difficulty":"Medium","options":["microtubules","plant cell walls","microfilaments","intermediate filaments"],"answer":"plant cell walls","solution":"A: Microtubules are built from the protein tubulin.\nB: Plant cell walls are made of the carbohydrate cellulose, unlike the protein-based structures listed.\nC: Microfilaments are built from the protein actin.\nD: Intermediate filaments are protein filaments."},{"id":"med-v5-023","module":"v5","type":"mcq","q":"Choose the correct usage: 'Duku's lifestyle ... the realities of godliness.'","source":"Medicine/HB1 First Semester/Communication skills/communication_skills_answered by Abanga.pdf | SLIDE 2","difficulty":"Medium","options":["mimics","mimics in","mimics with","mimics on"],"answer":"mimics","solution":"A: Mimic takes a direct object, so 'mimics the realities' is correct.\nB: Mimic is transitive and takes no preposition here.\nC: Adding 'with' is incorrect after mimic.\nD: 'On' is not used with mimic in this sense."},{"id":"med-v7-029","module":"v7","type":"fill","q":"A fair coin is tossed twice. What is the probability of at least one head? (Answer as a decimal.)","source":"Medicine/HB1 First Semester/Statistical Methods/Slides/Random Variables.pdf | SLIDE 1","difficulty":"Hard","answer":"0.75","solution":"Of the four equally likely outcomes, three contain at least one head, so the probability is 3/4 = 0.75."},{"id":"med-v4-092","module":"v4","type":"mcq","q":"If you want to save a presentation as a video, which format should you use?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 4","difficulty":"Hard","options":["ppsx","wmv","pdf","pptm"],"answer":"wmv","solution":"A: PPSX is a slide show format.\nB: WMV is a video format suitable for saving a presentation as a video.\nC: PDF is a document format, not video.\nD: PPTM is a macro-enabled presentation, not video."},{"id":"med-v2-181","module":"v2","type":"mcq","q":"Lecithin is the common name for which phospholipid?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["Sphingomyelin","Phosphatidylcholine","Phosphatidylinositol","Phosphatidylserine"],"answer":"Phosphatidylcholine","solution":"A: Sphingomyelin has a sphingosine backbone.\nB: Lecithin is the common name for phosphatidylcholine.\nC: Phosphatidylinositol has inositol as head group.\nD: Phosphatidylserine is not lecithin."},{"id":"med-v8-022","module":"v8","type":"mcq","q":"The set of complex numbers is denoted by:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 1.pdf | SLIDE 14","difficulty":"Hard","options":["C","R","Q","I"],"answer":"C","solution":"A: C denotes complex numbers of the form a + bi.\nB: R denotes real numbers.\nC: Q denotes rational numbers.\nD: I denotes irrational numbers."},{"id":"med-v2-182","module":"v2","type":"mcq","q":"A ceramide with a single sugar residue (glucose or galactose) attached is called a:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 4","difficulty":"Devil Mode","options":["Wax","Cerebroside","Ganglioside","Phospholipid"],"answer":"Cerebroside","solution":"A: A wax is a fatty acid ester of a long-chain alcohol.\nB: A cerebroside is a ceramide with one glucose or galactose residue.\nC: Gangliosides carry complex oligosaccharide chains with sialic acid.\nD: A phospholipid has a phosphate head, not a single sugar on ceramide."},{"id":"med-v2-183","module":"v2","type":"mcq","q":"The conversion of fructose 1,6-bisphosphate into two three-carbon fragments is catalyzed by which type of enzyme?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 3","difficulty":"Devil Mode","options":["Isomerase","Ligase","Lyase","Transferase"],"answer":"Lyase","solution":"A: Isomerases rearrange atoms within a molecule.\nB: Ligases join molecules using ATP.\nC: A lyase cleaves fructose 1,6-bisphosphate into two three-carbon fragments.\nD: Transferases move functional groups."},{"id":"med-v4-093","module":"v4","type":"mcq","q":"If you want to align three shapes exactly at the top of a slide, you should use the:","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 8","difficulty":"Medium","options":["Align Top command (with ”Align to Slide” selected)","Group command","Rotate command","Transitions tab"],"answer":"Align Top command (with ”Align to Slide” selected)","solution":"A: Align Top with Align to Slide selected aligns shapes exactly at the top.\nB: Grouping combines objects but does not align them to the slide.\nC: Rotate changes orientation, not position.\nD: The Transitions tab controls slide changes."},{"id":"med-v4-094","module":"v4","type":"mcq","q":"The feature that provides a ”live preview” of font changes is useful because:","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 5","difficulty":"Medium","options":["It suggests better synonyms for your text","It shows how the change will look before you actually apply it","It automatically saves the document","It checks for spelling errors in real-time"],"answer":"It shows how the change will look before you actually apply it","solution":"A: It does not suggest synonyms.\nB: Live preview shows how a font change will look before it is applied.\nC: Live preview does not save the document.\nD: It does not check spelling."},{"id":"med-v7-030","module":"v7","type":"mcq","q":"Identify the ”Loaded” element in this question: ”To what extent do you support the university’s progressive new policy on environmental sustainability?”","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 3","difficulty":"Medium","options":["It requires a recall of specific dates","It is a dichotomous question","The word ”progressive” introduces a positive bias","It is double-barreled"],"answer":"The word ”progressive” introduces a positive bias","solution":"A: It does not ask for dates.\nB: It is not a yes/no item.\nC: The word 'progressive' praises the policy and introduces positive bias.\nD: It addresses a single issue, so it is not double-barreled."},{"id":"med-v1-052","module":"v1","type":"mcq","q":"Which of the following is present in a prokaryotic cell?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 15","difficulty":"Medium","options":["nuclear envelope","mitochondrion","ribosome","chloroplast"],"answer":"ribosome","solution":"A: Prokaryotes have no nuclear envelope.\nB: Mitochondria are absent from prokaryotes.\nC: Ribosomes are present in all prokaryotic cells.\nD: Chloroplasts are absent from prokaryotes."},{"id":"med-v3-093","module":"v3","type":"mcq","q":"Statements: (1) Denatured alcohol is ethyl alcohol that has been rendered unfit to drink. (2) The functional group present in the compound 2-butanethiol is the sulfhydryl group. (3) The simplest phenol, phenol itself, is a colorless solid with a medicinal odor","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 8","difficulty":"Hard","options":["None of the statements is true","Only one of the statements is true","All three statements are true","Two of the three statements are true"],"answer":"All three statements are true","solution":"A: None true is wrong.\nB: One true undercounts.\nC: Denatured alcohol is ethanol made undrinkable, 2-butanethiol has a sulfhydryl group, and phenol is a colourless solid with a medicinal odour, so all three are true.\nD: Two true undercounts."},{"id":"med-v4-095","module":"v4","type":"mcq","q":"Which numerical filter would you use to find students with a mark below 40?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 9","difficulty":"Hard","options":["Less Than","Between","Greater Than","Equals"],"answer":"Less Than","solution":"A: Less Than finds marks below 40.\nB: Between finds a range of marks.\nC: Greater Than finds marks above a value.\nD: Equals finds an exact match."},{"id":"med-v5-024","module":"v5","type":"mcq","q":"'Her eyes were blue with age' is a:","source":"Medicine/HB1 First Semester/Communication skills/CLASSIFICATION OF SENTENCES.docx | DOCUMENT 1","difficulty":"Hard","options":["simple sentence","fragment","complex sentence","compound sentence"],"answer":"simple sentence","solution":"A: It is a complete sentence with one clause, not two.\nB: It has a subject and verb, so it is not a fragment.\nC: There is no dependent clause.\nD: No second independent clause is present."},{"id":"med-v7-031","module":"v7","type":"mcq","q":"”Do you not think it is unwise not to save money for emergencies?” This question suffers from:","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 2","difficulty":"Hard","options":["Recall bias","Double-barreled phrasing","Social desirability bias","Double negatives"],"answer":"Double negatives","solution":"A: Recall is not involved.\nB: Only one issue is being asked about, so it is not double-barreled.\nC: Social desirability is not the primary flaw here.\nD: The chain of 'not ... unwise not to' creates multiple negatives."},{"id":"med-v2-184","module":"v2","type":"mcq","q":"Some elements were not incorporated into cells because they are","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 1","difficulty":"Devil Mode","options":["too reactive","cannot form multiple bonds","synthetic","too big"],"answer":"cannot form multiple bonds","solution":"A: Reactivity is not the explanation given.\nB: Elements that cannot form multiple bonds were not incorporated into cells.\nC: Synthetic elements are not the reason elements were excluded from cells.\nD: Size is not the reason in this source."},{"id":"med-v3-094","module":"v3","type":"mcq","q":"Which of the following statements concerning carboxylate ions is correct?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 2","difficulty":"Devil Mode","options":["they contain more carbon atoms than their parent acids","carboxylate ions formed from dicarboxylic acids carry a -2 charge","they may be negatively or positively charged","they are always positively charged"],"answer":"carboxylate ions formed from dicarboxylic acids carry a -2 charge","solution":"A: They have the same carbon skeleton as their parent acids.\nB: Dicarboxylate ions carry a -2 charge.\nC: Carboxylate ions are negatively charged, not variably charged.\nD: They are never positively charged."},{"id":"med-v1-053","module":"v1","type":"mcq","q":"When biologists wish to study the internal ultrastructure of cells, they most likely would use","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 1","difficulty":"Medium","options":["a light microscope","a scanning electron microscope","A and B","a transmission electronic microscope"],"answer":"a transmission electronic microscope","solution":"A: A light microscope lacks the resolution to reveal internal ultrastructure.\nB: Scanning electron microscopy shows surface topography, not internal ultrastructure.\nC: A light microscope cannot resolve ultrastructure, so this combination fails.\nD: Transmission electron microscopy passes electrons through thin sections to reveal internal ultrastructure."},{"id":"med-v2-185","module":"v2","type":"mcq","q":"Fatty acid synthesis is an example of which type of pathway?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 1","difficulty":"Medium","options":["Spiral pathway","Cyclic pathway","Irreversible pathway","Linear pathway"],"answer":"Spiral pathway","solution":"A: Fatty acid synthesis is a spiral pathway adding two-carbon units repeatedly.\nB: A cyclic pathway regenerates its intermediates.\nC: Irreversible is a property, not a pathway type here.\nD: A linear pathway proceeds to a final product without repeating units."},{"id":"med-v2-186","module":"v2","type":"mcq","q":"DNA, the molecule that contains the genetic in- formation of the cell, contains","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 3","difficulty":"Medium","options":["2-deoxyribose","3-deoxyribose","2-deoxyglucose","3-deoxyglucose"],"answer":"2-deoxyribose","solution":"A: DNA contains 2-deoxyribose.\nB: 3-deoxyribose is not the DNA sugar.\nC: 2-deoxyglucose is not the DNA sugar.\nD: 3-deoxyglucose is not a nucleic acid component."},{"id":"med-v2-187","module":"v2","type":"mcq","q":"The chart wizard term data series refers to","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 29","difficulty":"Medium","options":["A set of values you plot in a chart","A chart legend","A data label","A collection of chart data markers"],"answer":"A collection of chart data markers","solution":"A: A set of plotted values describes data more broadly.\nB: A legend identifies series but is not the series itself.\nC: A data label annotates a single point.\nD: A data series is a collection of chart data markers."},{"id":"med-v2-188","module":"v2","type":"mcq","q":"A mother of malnourished child has been in- structed to include a complete protein in the diet of the child. Which of the following should be recommended?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 2","difficulty":"Hard","options":["Milk","Pulses","Wheat","Soy protein"],"answer":"Milk","solution":"A: Milk is the complete protein recommended for the malnourished child in this source.\nB: Pulses are a useful but not the complete protein recommended here.\nC: Wheat protein is incomplete in lysine.\nD: Soy protein is a good plant complete protein."},{"id":"med-v1-054","module":"v1","type":"mcq","q":"The nuclear lamina is an array of filaments on the inner side of the nuclear membrane. If a method were found that could cause the lamina to fall into disarray, what would you expect to be the most likely consequence?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 4","difficulty":"Hard","options":["the inability of the cell to withstand enzymatic digestion","failure of chromosomes to carry genetic information","a change in the shape of the nucleus","the loss of all nuclear function"],"answer":"a change in the shape of the nucleus","solution":"A: The lamina is not what protects the nucleus from enzymes.\nB: Chromosomes still carry genetic information without an intact lamina.\nC: The nuclear lamina supports the nuclear envelope, so its disruption changes nuclear shape.\nD: Disorganising the lamina does not abolish all nuclear function."},{"id":"med-v2-189","module":"v2","type":"mcq","q":"Arachidonic acid is a precursor for the synthesis of which hormone-like compounds?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 2","difficulty":"Hard","options":["Isoprenes","Eicosanoids (e.g., prostaglandins)","Triglycerides","Bile acids"],"answer":"Eicosanoids (e.g., prostaglandins)","solution":"A: Isoprenes form terpenes and steroids.\nB: Eicosanoids such as prostaglandins are synthesised from arachidonic acid.\nC: Triglycerides are storage lipids, not arachidonic acid derivatives.\nD: Bile acids are derived from cholesterol."},{"id":"med-v3-095","module":"v3","type":"mcq","q":"Statements: (1) The boiling points of esters are much higher than those of corresponding carboxylic acids. (2) The compound benzoic acid is a heterocylic compound. (3) In linear form, the ester functional group can be represented as -COOR","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 9","difficulty":"Hard","options":["None of the statements is true","Two of the three statements are true","All three statements are true","Only one of the statements is true"],"answer":"Only one of the statements is true","solution":"A: None true is wrong.\nB: Only the ester notation statement is true.\nC: Esters boil lower than acids, benzoic acid is not heterocyclic, but the ester group is -COOR.\nD: Only one of the three statements is true."},{"id":"med-v3-096","module":"v3","type":"mcq","q":"The IUPAC name for the compound is","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 1","difficulty":"Devil Mode","options":["3-methylpentanoic acid","2-methyl-4-butanoic acid","3-methylbutanoic acid","2-methyl-4-pentanoic acid"],"answer":"3-methylbutanoic acid","solution":"A: 3-methylpentanoic acid has the wrong chain length.\nB: 2-methyl-4-butanoic acid is not a correct locant set.\nC: 3-methylbutanoic acid is the correct IUPAC name.\nD: 2-methyl-4-pentanoic acid misnames the parent chain."},{"id":"med-v3-097","module":"v3","type":"mcq","q":"Statements: (1) Intramolecular alcohol dehydration converts an alcohol to an alkene. (2) An aryl group is an aromatic carbon-ring system from which one hydrogen atom has been removed. (3) Unlike alcohols, phenols are weak acids in solution","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 9","difficulty":"Devil Mode","options":["Only one of the statements is true","Two of the three statements are true","All three statements are true","None of the statements is true"],"answer":"All three statements are true","solution":"A: One true undercounts.\nB: Two true undercounts.\nC: Intramolecular dehydration gives an alkene, an aryl group is a ring minus one hydrogen, and phenols are weak acids, so all three are true.\nD: None true is wrong."},{"id":"med-v2-190","module":"v2","type":"mcq","q":"According to dietary recommendations, what percentage of daily calories should come from carbo- hydrates?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 1","difficulty":"Medium","options":["25-40%","70-85%","10-20%","45-65%"],"answer":"45-65%","solution":"A: Twenty-five to forty percent is still below the recommendation.\nB: Seventy to eighty-five percent exceeds the recommended range.\nC: Ten to twenty percent is below the recommended carbohydrate intake.\nD: Forty-five to sixty-five percent of daily calories is the recommended carbohydrate range."},{"id":"med-v7-032","module":"v7","type":"fill","q":"The data set 4, 8, 12 has a mean of 8. Find its population variance. (Answer as a number.)","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/ZANIPOLO stas pasco.PDF | SLIDE 1","difficulty":"Medium","answer":"10.67","solution":"Deviations from the mean are -4, 0 and 4; their squares are 16, 0, 16, summing to 32, and dividing by 3 gives about 10.67."},{"id":"med-v4-096","module":"v4","type":"mcq","q":"Which of the following is a ”predefined” function in Excel?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 1","difficulty":"Medium","options":["A function built into the package by developers","A formula written by a user, such as =A1+B1","A macro created by a third-party developer","Any text entered into a cell"],"answer":"A function built into the package by developers","solution":"A: A predefined function is one built into the package by its developers.\nB: A user-written formula is not a predefined function.\nC: A third-party macro is not built in by default.\nD: Plain text is not a function."},{"id":"med-v4-097","module":"v4","type":"mcq","q":"What does the ”Slide Pane” specifically display?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 2","difficulty":"Medium","options":["Notes intended for the speaker only","A thumbnail list of all slides","Basic file management commands like Save and Open","The slide you are currently working on"],"answer":"The slide you are currently working on","solution":"A: Speaker notes appear in the Notes pane.\nB: A thumbnail list is the Slides pane, not the Slide pane.\nC: File management commands are in Backstage View.\nD: The Slide pane displays the slide currently being edited."},{"id":"med-v4-098","module":"v4","type":"mcq","q":"What happens immediately after you click the AutoSum button in a cell below a column of numbers?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 4","difficulty":"Hard","options":["Excel automatically deletes the numbers","Excel suggests a range of cells to total and shows the formula","Excel formats the cells as currency","Excel opens the PMT function dialog"],"answer":"Excel suggests a range of cells to total and shows the formula","solution":"A: AutoSum never deletes the numbers.\nB: AutoSum proposes a range and displays the formula for confirmation.\nC: It does not apply currency formatting.\nD: It does not open the PMT dialog."},{"id":"med-v1-055","module":"v1","type":"mcq","q":"A mycoplasma is an organism with a diameter between 0.1 and 1.0 μm. What does its size tell you about how it might be classified?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 3","difficulty":"Hard","options":["It could be almost any typical bacterium","It must be a single celled protist","It could be a very small bacterium","It must be a single celled fungus"],"answer":"It could be a very small bacterium","solution":"A: Typical bacteria are usually 1–10 micrometres, larger than this.\nB: Protists are generally much larger than 0.1–1.0 micrometres.\nC: Mycoplasmas are the smallest known bacteria, fitting the 0.1–1.0 micrometre range.\nD: Fungi are also larger and are not defined by this size range."},{"id":"med-v4-099","module":"v4","type":"mcq","q":"What is the purpose of saving a presentation in PDF format?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 4","difficulty":"Hard","options":["To make the file open directly into a slide show","To enable macros","To share files that you do not want to be changed","To allow others to edit the slides easily"],"answer":"To share files that you do not want to be changed","solution":"A: It does not open directly into a slide show.\nB: PDF does not enable macros.\nC: Saving as PDF shares a file that is not meant to be changed.\nD: PDF is not intended for easy editing."},{"id":"med-v2-191","module":"v2","type":"mcq","q":"Enzyme induction refers to:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["The movement of enzymes into the mitochondria","The binding of a competitive inhibitor","The permanent destruction of an enzyme","Increasing the abundance of enzymes by synthesizing new proteins in response to a substrate"],"answer":"Increasing the abundance of enzymes by synthesizing new proteins in response to a substrate","solution":"A: Enzymes are not moved into mitochondria in induction.\nB: Competitive inhibitor binding is inhibition, not induction.\nC: Enzyme destruction is not induction.\nD: Induction increases enzyme abundance by synthesising new protein in response to substrate."},{"id":"med-v3-098","module":"v3","type":"mcq","q":"Which of the following pairings of aldehyde common and IUPAC names is correct?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 5","difficulty":"Devil Mode","options":["formaldehyde and ethanal","acetaldehyde and methanal","more than one correct response E) no correct response","2-methylbutyraldehyde and 2-methylbutanal"],"answer":"2-methylbutyraldehyde and 2-methylbutanal","solution":"A: Formaldehyde is methanal, not ethanal.\nB: Acetaldehyde is ethanal, not methanal.\nC: Only one pairing is correct, so the combined options are wrong.\nD: 2-methylbutyraldehyde corresponds to 2-methylbutanal."},{"id":"med-v4-100","module":"v4","type":"mcq","q":"Which menu path is used to set manual page breaks?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 1","difficulty":"Devil Mode","options":["Insert ¿ Illustrations ¿ Breaks","Page Layout ¿ Page Setup ¿ Breaks","View ¿ Page Break Preview","File ¿ Print ¿ Settings"],"answer":"Page Layout ¿ Page Setup ¿ Breaks","solution":"A: Illustrations menu does not contain break commands.\nB: Manual page breaks are set through Page Layout, Page Setup, Breaks.\nC: Page Break Preview shows breaks but does not set manual ones.\nD: Print settings do not insert manual breaks."},{"id":"med-v2-192","module":"v2","type":"mcq","q":"Which of the following is an absolute cell reference?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 26","difficulty":"Medium","options":["!A!","A1","$A$","#a#"],"answer":"$A$","solution":"A: !A! is not valid absolute reference notation.\nB: A1 is a relative reference.\nC: The dollar signs in $A$ denote an absolute cell reference.\nD: #a# is not a spreadsheet reference."},{"id":"med-v2-193","module":"v2","type":"mcq","q":"Glycogen differs from amylopectin by having","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 3","difficulty":"Medium","options":["less and shorter branches","less and longer branches","more and shorter branches","more and longer branches"],"answer":"more and shorter branches","solution":"A: Glycogen has more branches than amylopectin, not fewer.\nB: Fewer longer branches describes amylopectin relative to glycogen.\nC: Glycogen has more and shorter branches than amylopectin.\nD: Longer branches are not glycogen's feature."},{"id":"med-v2-194","module":"v2","type":"mcq","q":"Excel uniquely identifies cells within a worksheet with a cell name","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 32","difficulty":"Medium","options":["Cell locator coordinates","Column letters and row numbers","Column numbers and row letters","Cell names"],"answer":"Column letters and row numbers","solution":"A: Cell locator coordinates is not the standard term.\nB: Excel identifies cells by column letter and row number.\nC: Column numbers and row letters reverses the convention.\nD: Cell names are user-defined, not the standard identifier system."},{"id":"med-v4-101","module":"v4","type":"mcq","q":"Which chart type is similar to a Pie chart but can show more than one data series?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 7","difficulty":"Medium","options":["Radar Chart","Bar Chart","Doughnut Chart","Area Chart"],"answer":"Doughnut Chart","solution":"A: Radar charts compare several variables.\nB: Bar charts compare categories.\nC: A doughnut chart resembles a pie but can show multiple data series.\nD: Area charts emphasise magnitude over time."},{"id":"med-v2-195","module":"v2","type":"mcq","q":"Which of the following best describes the primary chemical nature of most enzymes?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 1","difficulty":"Hard","options":["Polysaccharides","Proteins","Phospholipids","Ribonucleic acids"],"answer":"Proteins","solution":"A: Polysaccharides are carbohydrates, not enzymes.\nB: The vast majority of enzymes are proteins.\nC: Phospholipids are membrane lipids, not catalysts.\nD: A few RNAs act as ribozymes, but most enzymes are not RNA."},{"id":"med-v2-196","module":"v2","type":"mcq","q":"Eukaryotes use organelles to compartmentalize pathways. In which location does glycolysis pri- marily occur?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 2","difficulty":"Hard","options":["Mitochondria","Cytosol","Lysosomes","Nucleus"],"answer":"Cytosol","solution":"A: Mitochondria carry out later stages of respiration, not glycolysis.\nB: Glycolysis occurs primarily in the cytosol.\nC: Lysosomes are digestive organelles.\nD: The nucleus is not a glycolytic compartment."},{"id":"med-v8-023","module":"v8","type":"mcq","q":"If a set A has n elements, its power set has:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 1.pdf | SLIDE 16","difficulty":"Hard","options":["n elements","2^n elements","2n elements","n^2 elements"],"answer":"2^n elements","solution":"A: The set itself has n elements, not its power set.\nB: Each element is either in or out, giving 2^n subsets.\nC: Two times n is a common but incorrect guess.\nD: Squaring n is not the correct count."},{"id":"med-v6-019","module":"v6","type":"mcq","q":"Deafness can be described as:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 4","difficulty":"Hard","options":["only a form of mental impairment","both a disability and a cultural issue","only a cultural issue","only a medical condition"],"answer":"both a disability and a cultural issue","solution":"A: Deafness is not a mental impairment.\nB: The course treats deafness as both a disability and a cultural issue.\nC: It is not only cultural; it also involves audiological and functional aspects.\nD: Deafness is more than a medical diagnosis."},{"id":"med-v1-056","module":"v1","type":"mcq","q":"If a modern electron microscope (TEM) can resolve biological images to the nanometer level, as opposed to the best light microscope, this is due to which of the following?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 2","difficulty":"Devil Mode","options":["The focal length of the electron microscope is significantly longer","Contrast is enhanced by staining with atoms of heavy metal","The electron microscope has much greater ratio of image size to real size","Electron beams have much shorter wavelengths than visible light"],"answer":"Electron beams have much shorter wavelengths than visible light","solution":"A: Focal length is not the reason electron microscopes resolve better.\nB: Heavy-metal staining improves contrast, not the intrinsic resolving limit.\nC: Magnification ratio does not determine resolving power.\nD: Electron beams have much shorter wavelengths than visible light, so resolution is far better."},{"id":"med-v4-102","module":"v4","type":"mcq","q":"Which view is the default view where you create and edit slides?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 3","difficulty":"Devil Mode","options":["Slide Sorter","Reading View","Normal","Slide Show"],"answer":"Normal","solution":"A: Slide Sorter is for overviewing slides.\nB: Reading View is for reviewing a show.\nC: Normal view is the default editing view.\nD: Slide Show is presentation mode."},{"id":"med-v4-103","module":"v4","type":"mcq","q":"What is ”Filtering”?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 8","difficulty":"Medium","options":["Summarizing data with a formula","Arranging data from highest to lowest","Deleting unnecessary data","Displaying only rows that meet specific criteria"],"answer":"Displaying only rows that meet specific criteria","solution":"A: Summarising with a formula is not filtering.\nB: Arranging highest to lowest is sorting, not filtering.\nC: Filtering does not delete data.\nD: Filtering displays only rows that meet specified criteria."},{"id":"med-v1-057","module":"v1","type":"mcq","q":"Tay-Sachs disease is a human genetic abnormality that results in cells accumulating and becoming clogged with very large and complex lipids. Which cellular organelle must be involved in this condition?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 6","difficulty":"Medium","options":["the endoplasmic reticulum","the lysosome","the Golgi apparatus","mitochondria"],"answer":"the lysosome","solution":"A: The endoplasmic reticulum is not the storage site for undigested complex lipids.\nB: Tay-Sachs results from a lysosomal enzyme defect, so lysosomes become clogged with gangliosides.\nC: The Golgi sorts proteins but is not the site of lipid accumulation in Tay-Sachs.\nD: Mitochondria are not involved in complex lipid clearance in this disease."},{"id":"med-v4-104","module":"v4","type":"mcq","q":"Which statistical function counts only the cells that contain numbers within a range?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 7","difficulty":"Medium","options":["COUNTBLANK()","COUNTIF()","COUNTA()","COUNT()"],"answer":"COUNT()","solution":"A: COUNTBLANK counts empty cells.\nB: COUNTIF counts cells meeting a criterion.\nC: COUNTA counts all non-empty cells, including text.\nD: COUNT counts only cells containing numbers."},{"id":"med-v3-099","module":"v3","type":"mcq","q":"Carboxylic acids may be prepared by oxidation of either","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 2","difficulty":"Medium","options":["secondary or primary alcohols","ketones or aldehydes","primary alcohols or aldehydes","ketones or secondary alcohols"],"answer":"primary alcohols or aldehydes","solution":"A: Secondary alcohols oxidise to ketones, not directly to acids.\nB: Ketones do not oxidise readily to carboxylic acids.\nC: Primary alcohols and aldehydes oxidise to carboxylic acids.\nD: Neither ketones nor secondary alcohols are the correct precursors."},{"id":"med-v2-197","module":"v2","type":"mcq","q":"Amino acids are classified as ”acidic” when their side chains have a net negative charge at which pH?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 1","difficulty":"Hard","options":["pH 2","pH 7","pH 5","pH 10"],"answer":"pH 7","solution":"A: At pH 2 acidic side chains are protonated and neutral, not negatively charged.\nB: At about pH 7 acidic side chains are deprotonated and carry a net negative charge.\nC: At pH 5 many acidic side chains remain protonated.\nD: At pH 10 nearly all groups are deprotonated, but this is not the classification reference point."},{"id":"med-v3-100","module":"v3","type":"mcq","q":"Which of the following statements concerning aldehydes and ketones is correct?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 1","difficulty":"Hard","options":["cyclic aldehydes exist","neither cyclic ketones nor cyclic aldehydes exist","both cyclic aldehydes and cyclic ketones exist","cyclic ketones exist"],"answer":"cyclic ketones exist","solution":"A: Cyclic aldehydes are not the correct statement here.\nB: Cyclic ketones do exist, so neither exist is wrong.\nC: Claiming both exist is not the answer given.\nD: Cyclic ketones exist, which is the correct statement."},{"id":"med-v2-198","module":"v2","type":"mcq","q":"Which amino acid derivative acts as a potent neurotransmitter and is produced by the decarboxy- lation of glutamic acid?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 2","difficulty":"Hard","options":["Serotonin","Histamine","GABA","Epinephrine"],"answer":"GABA","solution":"A: Serotonin is derived from tryptophan.\nB: Histamine is derived from histidine.\nC: GABA is produced by decarboxylation of glutamic acid.\nD: Epinephrine is derived from tyrosine."},{"id":"med-v1-058","module":"v1","type":"mcq","q":"Under which of the following conditions would you expect to find a cell with a predominance of free ribosomes?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 4","difficulty":"Hard","options":["a cell that is digesting food particles","a cell that is producing cytoplasmic enzymes","a cell that is secreting proteins","a cell that is constructing its cell wall or extracellular matrix"],"answer":"a cell that is producing cytoplasmic enzymes","solution":"A: Digesting food particles depends on lysosomes, not free ribosomes.\nB: Free ribosomes synthesise proteins that remain in the cytosol, such as cytoplasmic enzymes.\nC: Secreted proteins are made on ER-bound ribosomes, not free ones.\nD: Cell-wall and extracellular-matrix proteins are made on bound ribosomes for secretion."},{"id":"med-v4-105","module":"v4","type":"mcq","q":"How is cash you pay out represented in Excel financial arguments?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 8","difficulty":"Devil Mode","options":["As a negative number","As text in red","It is not represented","As a positive number"],"answer":"As a negative number","solution":"A: Cash paid out is represented as a negative number.\nB: It is not entered as text in red.\nC: Outflows must be represented for calculations to work.\nD: Cash inflows are positive in financial functions."},{"id":"med-v1-059","module":"v1","type":"mcq","q":"Which structure is the site of the synthesis of proteins that may be exported from the cell?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 5","difficulty":"Devil Mode","options":["Golgi vesicles","rough ER","plasmodesmata","lysosomes"],"answer":"rough ER","solution":"A: Golgi vesicles modify and sort proteins after synthesis, not make them.\nB: Proteins destined for export are synthesised on ribosomes bound to the rough ER.\nC: Plasmodesmata are plant cell channels, not sites of protein synthesis.\nD: Lysosomes contain hydrolytic enzymes but do not synthesise exported proteins."},{"id":"med-v3-101","module":"v3","type":"mcq","q":"In which of the following pairs of compounds does the first listed compound have a greater solubility in water than the second listed compound?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 7","difficulty":"Medium","options":["sodium butanoate, butanoic acid","pentanoic acid, potassium pentanoate","more than one correct response","hexanoic acid, methanoic acid"],"answer":"sodium butanoate, butanoic acid","solution":"A: Sodium butanoate is an ionic salt and is more soluble than butanoic acid.\nB: The potassium salt is more soluble than the acid, so this order is reversed.\nC: Only one pair has the first more soluble, so more than one is wrong.\nD: Hexanoic acid is less soluble than methanoic acid, so the first is not greater."},{"id":"med-v7-033","module":"v7","type":"mcq","q":"A question asking respondents to ”Rank the following 5 features in order of importance” yields what level of measurement?","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 2","difficulty":"Medium","options":["Ratio","Ordinal","Nominal","Interval"],"answer":"Ordinal","solution":"A: Ratio data have a true zero.\nB: Ranking produces ordinal data showing order without equal intervals.\nC: Nominal data are unordered labels.\nD: Interval data have equal intervals but no true zero."},{"id":"med-v2-199","module":"v2","type":"mcq","q":"Why are triacylglycerols the ”molecule of choice” for energy storage over carbohydrates?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 3","difficulty":"Medium","options":["They are highly hydrated","They contain more nitrogen","They are smaller molecules","They are hydrophobic and aggregate in anhydrous forms"],"answer":"They are hydrophobic and aggregate in anhydrous forms","solution":"A: Triacylglycerols are hydrophobic, not highly hydrated.\nB: They contain little or no nitrogen.\nC: They are larger, not smaller, energy stores.\nD: Their hydrophobic nature allows anhydrous, compact energy storage."},{"id":"med-v2-200","module":"v2","type":"mcq","q":"How is the metabolic flux of metabolites through a pathway primarily controlled?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["By regulating every enzyme in the pathway","By regulating the rate-determining step","By changing the pH of the cytosol","By increasing the temperature of the cell"],"answer":"By regulating the rate-determining step","solution":"A: Regulating every enzyme is inefficient and not the primary mechanism.\nB: Flux is mainly controlled through the rate-determining or committed step.\nC: Cytosolic pH changes are not the main control.\nD: Temperature is not the primary regulatory mechanism."},{"id":"med-v3-102","module":"v3","type":"mcq","q":"Which of the following pairings of ester common and IUPAC names is correct?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 8","difficulty":"Hard","options":["ethyl propionate and propyl ethanoate","ethyl butyrate and butyl ethanoate","more than one correct response","propyl acetate and propyl ethanoate"],"answer":"propyl acetate and propyl ethanoate","solution":"A: Ethyl propionate is not properly matched to propyl ethanoate.\nB: Ethyl butyrate is not butyl ethanoate.\nC: Only one pairing is correct, so more than one is wrong.\nD: Propyl acetate and propyl ethanoate are two names for the same ester."},{"id":"med-v1-060","module":"v1","type":"mcq","q":"Which type of organelle is primarily involved in the synthesis of oils, phospholipids, and steroids?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 4","difficulty":"Hard","options":["lysosome","smooth endoplasmic reticulum","mitochondrion","ribosome"],"answer":"smooth endoplasmic reticulum","solution":"A: Lysosomes digest macromolecules, not synthesise lipids.\nB: The smooth endoplasmic reticulum synthesises oils, phospholipids and steroids.\nC: Mitochondria generate ATP rather than membrane lipids.\nD: Ribosomes synthesise proteins, not lipids."},{"id":"med-v7-034","module":"v7","type":"fill","q":"A fair coin is tossed once. What is the probability of heads? (Answer as a decimal.)","source":"Medicine/HB1 First Semester/Statistical Methods/Slides/Random Variables.pdf | SLIDE 1","difficulty":"Hard","answer":"0.5","solution":"There are two equally likely outcomes and one favourable outcome, giving a probability of 0.5."},{"id":"med-v2-201","module":"v2","type":"mcq","q":"Which hormone is responsible for lowering blood glucose levels?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 2","difficulty":"Hard","options":["Adrenaline","Glucagon","Insulin","Thyroxine"],"answer":"Insulin","solution":"A: Adrenaline raises glucose during stress.\nB: Glucagon raises blood glucose by stimulating glycogenolysis.\nC: Insulin lowers blood glucose by promoting glucose uptake and storage.\nD: Thyroxine regulates metabolic rate rather than lowering glucose directly."},{"id":"med-v3-103","module":"v3","type":"mcq","q":"All of the following general formulas except one represent an ether. The exception is","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 3","difficulty":"Devil Mode","options":["H-O-Ar","R-O-R","Ar-O-R","Ar-O-Ar"],"answer":"H-O-Ar","solution":"A: H-O-Ar is a phenol, not an ether.\nB: R-O-R is a general ether formula.\nC: Ar-O-R is an aryl alkyl ether.\nD: Ar-O-Ar is a diaryl ether."},{"id":"med-v2-202","module":"v2","type":"mcq","q":"Enzymes that catalyze the movement of ions or molecules across membranes are classified as:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 1","difficulty":"Devil Mode","options":["Ligases","Isomerases","Lyases","Translocases"],"answer":"Translocases","solution":"A: Ligases join two molecules, often using ATP.\nB: Isomerases catalyse internal rearrangements.\nC: Lyases cleave bonds non-hydrolytically.\nD: Translocases catalyse movement of ions or molecules across membranes."},{"id":"med-v2-203","module":"v2","type":"mcq","q":"All the following are α-amino acids except","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 1","difficulty":"Medium","options":["Glycine","Tryptophan","Proline","Histidine"],"answer":"Proline","solution":"A: Glycine is an alpha-amino acid.\nB: Tryptophan is an alpha-amino acid.\nC: Proline is an imino acid because its amino nitrogen is part of a ring, so it is the exception.\nD: Histidine is an alpha-amino acid."},{"id":"med-v4-106","module":"v4","type":"mcq","q":"How can you access functions like Average, Count, and Max using the AutoSum tool?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 4","difficulty":"Medium","options":["By clicking the arrow to the right of the AutoSum button","By pressing Ctrl + Shift + S","By right-clicking the formula bar","By double-clicking the AutoSum button"],"answer":"By clicking the arrow to the right of the AutoSum button","solution":"A: The arrow beside AutoSum opens a list including Average, Count and Max.\nB: Ctrl+Shift+S is not the AutoSum menu shortcut.\nC: Right-clicking the formula bar does not open functions.\nD: Double-clicking AutoSum repeats the sum, not other functions."},{"id":"med-v1-061","module":"v1","type":"mcq","q":"A cell lacking the ability to make and secrete glycoproteins would most likely be deficient in its","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 13","difficulty":"Medium","options":["B and C only","Golgi apparatus","extracellular matrix","nuclear DNA"],"answer":"B and C only","solution":"A: Both the extracellular matrix and the Golgi apparatus would be deficient.\nB: The Golgi apparatus is where proteins are glycosylated.\nC: The extracellular matrix contains many glycoproteins.\nD: Nuclear DNA is not a glycoprotein and is unaffected by defective glycosylation."},{"id":"med-v3-104","module":"v3","type":"mcq","q":"Which of the following is an incorrect IUPAC name for a phenol derivative?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 6","difficulty":"Medium","options":["1-chlorophenol","3-methylphenol","2,5-dibromophenol","more than one correct response E) no correct response"],"answer":"more than one correct response E) no correct response","solution":"A: 1-chlorophenol is a valid name even if locant one is implicit.\nB: 3-methylphenol is a valid name.\nC: 2,5-dibromophenol is a valid name.\nD: No listed name is incorrect, so the no-correct-response option applies."},{"id":"med-v3-105","module":"v3","type":"mcq","q":"In chemical reactivity, ethers resemble","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 3","difficulty":"Hard","options":["alkenes","alcohols","phenols","alkanes"],"answer":"alkanes","solution":"A: Alkenes are reactive, unlike ethers.\nB: Alcohols have a reactive O-H group
