<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Carpe Diem Medicine - HB1 — The Carpe Diem</title>
<style>
:root{
  --navy:#0b1b33; --navy2:#12294a; --gold:#f5b301;
  --red:#b3261e; --red2:#8e1b16; --card:#dceaf0; --card2:#e8f1f5;
  --ink:#1c2733; --muted:#5d6b7a; --line:#c8d4de;
  --green:#2e7d32; --good:#e6f4ea; --bad:#fdecea;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f3f5f7;color:var(--ink);font-family:Arial,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer}

/* top bar */
.cdbar{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold)}
.cdmark{width:30px;height:30px;border:2px solid var(--gold);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:bold;font-size:12px;letter-spacing:.5px;flex:none}
.cdbar .brand{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:bold}
.cdbar .crumb{font-size:12px;color:#c8d6e5;margin-left:auto;text-align:right}

/* moodle quiz header */
.quizhead{background:#fff;border-bottom:1px solid var(--line);padding:18px 22px}
.quizhead .path{font-size:11px;color:var(--muted);letter-spacing:.4px}
.quizhead h1{font-size:24px;font-weight:600;margin:4px 0 2px;color:var(--navy)}
.quizhead .sub{font-size:12px;color:var(--muted)}

/* timer banner */
.timerbar{background:linear-gradient(90deg,var(--red2),var(--red));color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:center;position:relative;font-weight:bold;letter-spacing:.5px}
.timerbar .tt{font-size:20px}
.timerbar .td{font-size:20px;font-variant-numeric:tabular-nums;margin-left:12px}
.timerbar.warn{background:linear-gradient(90deg,#a35b00,#d97706)}
.timerbar.danger{background:linear-gradient(90deg,#7f1d1d,#b3261e)}
.timerbar .hide{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);border:0;color:#fff;padding:6px 12px;border-radius:4px;font-size:12px}

.wrap{max-width:860px;margin:0 auto;padding:24px 18px 120px}
.card{background:var(--card);border:1px solid #c2d3de;border-radius:12px;padding:26px;margin-bottom:18px;box-shadow:0 1px 2px rgba(11,27,51,.05)}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}
.qnum{font-size:13px;font-weight:bold;color:var(--navy)}
.qtag{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--muted);white-space:nowrap}
.qtext{font-size:17px;line-height:1.65;margin-bottom:18px;white-space:pre-wrap}
.qtext b{color:var(--navy)}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;width:100%;font-size:15px;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--gold)}
.opt.sel{border:2px solid var(--gold);background:#fff9e6}
.opt .key{width:22px;height:22px;border-radius:50%;border:1px solid #9aa9b8;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.opt.sel .key{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:bold}

.fillrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fillrow label{font-weight:bold;color:var(--navy)}
.fillrow input{background:#fff;border:1px solid #9aa9b8;border-radius:8px;padding:11px 14px;font-size:16px;width:240px;outline:none}
.fillrow input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,179,1,.2)}
.fillrow .hint{font-size:12px;color:var(--muted)}

.navrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.btn{border:0;border-radius:6px;padding:12px 24px;font-size:14px;font-weight:bold}
.btn.prev{background:#e4e9ee;color:var(--navy)}
.btn.next{background:var(--green);color:#fff}
.btn.finish{background:var(--navy);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.qgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.qgrid button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:4px;color:var(--muted);font-size:12px}
.qgrid button.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.qgrid button.cur{outline:2px solid var(--gold)}

/* start screen */
.start{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:18px}
.start h2{color:var(--navy);margin-bottom:6px}
.start p{color:var(--muted);margin-bottom:18px}
.mods{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.modbtn{border:1px solid var(--line);background:#f8fafb;border-radius:8px;padding:12px 16px;text-align:left;min-width:150px}
.modbtn.sel{border:2px solid var(--gold);background:#fff9e6}
.modbtn b{display:block;color:var(--navy);font-size:14px}
.modbtn span{font-size:12px;color:var(--muted)}
.bigbtn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:14px 30px;font-size:15px;font-weight:bold}

/* results */
.res{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:18px}
.score{font-size:52px;font-weight:bold;color:var(--navy);line-height:1}
.rstat{display:flex;gap:28px;margin:16px 0;flex-wrap:wrap}
.rstat div{font-size:13px;color:var(--muted)}
.rstat b{display:block;font-size:22px;color:var(--navy)}
.item{border:1px solid var(--line);border-left:4px solid var(--good);border-radius:8px;padding:16px;margin-bottom:12px;background:#fafcfb}
.item.wrong{border-left-color:#c62828;background:#fffafa}
.item .qq{font-weight:bold;margin-bottom:8px}
.item .aa{font-size:13px;margin:3px 0}
.item .ok{color:var(--green)}
.item .no{color:#c62828}
.sol{font-size:13px;background:#f1f5f9;border-radius:6px;padding:10px 12px;margin-top:8px;color:#37474f;white-space:pre-wrap}

@media(max-width:600px){
  .cdbar .crumb{display:none}
  .quizhead h1{font-size:20px}
  .timerbar .tt,.timerbar .td{font-size:16px}
  .card{padding:18px}
  .qtext{font-size:15px}
  .fillrow input{width:100%}
}
</style>
</head>
<body>

<div class="cdbar">
  <div class="cdmark">CD</div>
  <div class="brand">The Carpe Diem</div>
  <div class="crumb">THE CARPE DIEM / MEDICINE / HB1</div>
</div>

<div class="quizhead">
  <div class="path">THE CARPE DIEM / HB1 MEDICINE / FIRST SEMESTER 2026 / Quiz</div>
  <h1 id="quizTitle">The Carpe Diem Medicine - HB1</h1>
  <div class="sub" id="quizSub">Timed practice — one question per page</div>
</div>

<div class="timerbar" id="timerbar">
  <span class="tt">Time left</span><span class="td" id="td">2:00:00</span>
  <button class="hide" id="hideBtn" onclick="toggleTimer()">Hide</button>
</div>

<div class="wrap" id="wrap">
  <div class="start" id="start">
    <h2>Choose your set</h2>
    <p>Pick a version, then start the timer. Answers save as you go.</p>
    <div class="mods" id="mods"></div>
    <button class="bigbtn" id="startBtn" onclick="begin()">Start attempt</button>
  </div>
  <div id="exam" style="display:none"></div>
  <div id="results" style="display:none"></div>
</div>

<script>
const BANK = {"config":{"title":"The Carpe Diem Medicine - HB1","course":"HB1 MEDICINE","guide":"Ferka's HB1 slides"},"modules":[{"id":"v1","name":"Version 1 - Cell Structure","desc":"Cell ultrastructure, light and electron microscopy, cell fractionation, membranes and the cytoskeleton.","count":69,"source":"Ferka's HB1 slides - HB1 First Semester corpus"},{"id":"v2","name":"Version 2 - Biological Chemistry","desc":"Amino acids, proteins, enzymes, carbohydrates, lipids, nucleic acids and metabolic pathways.","count":215,"source":"Ferka's HB1 slides - HB1 First Semester corpus"},{"id":"v3","name":"Version 3 - Basic Medical Chemistry","desc":"Organic chemistry for medicine: alcohols, ethers, aldehydes, ketones, carboxylic acids, esters and stereochemistry.","count":109,"source":"Ferka's HB1 slides - HB1 First Semester corpus"},{"id":"v4","name":"Version 4 - Computer Appreciation","desc":"Microsoft Excel and PowerPoint: functions, formulas, charts, formatting and presentation design.","count":110,"source":"Ferka's HB1 slides - HB1 First Semester corpus"},{"id":"v5","name":"Version 5 - Communication Skills","desc":"Ambiguity, sentence classification, preposition usage, concord and questionnaire wording.","count":24,"source":"Ferka's HB1 slides - HB1 First Semester corpus"},{"id":"v6","name":"Version 6 - Ghanaian Sign Language","desc":"Concept of deafness, types and degrees of hearing loss, and disability frameworks.","count":20,"source":"Ferka's HB1 slides - HB1 First Semester corpus"},{"id":"v7","name":"Version 7 - Statistical Methods","desc":"Questionnaire design, levels of measurement, probability and descriptive statistics.","count":38,"source":"Ferka's HB1 slides - HB1 First Semester corpus"},{"id":"v8","name":"Version 8 - Algebra","desc":"Set theory, logic, functions and introductory calculus for health science students.","count":24,"source":"Ferka's HB1 slides - HB1 First Semester corpus"}],"questions":[{"id":"med-v2-001","module":"v2","type":"mcq","q":"A tightly bound coenzyme that is often covalently attached to the enzyme is referred to as a:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["Allosteric effector","Cosubstrate","Prosthetic group","Metal cofactor"],"answer":"Prosthetic group","solution":"A: An allosteric effector binds a regulatory site and is not a bound catalytic coenzyme.\nB: A cosubstrate binds transiently and diffuses away, unlike a tightly bound group.\nC: A prosthetic group is a tightly or covalently bound coenzyme.\nD: A metal cofactor is an inorganic ion, not a covalently attached organic group."},{"id":"med-v2-002","module":"v2","type":"mcq","q":"An isomerization reaction is characterized by:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["The cleavage of bonds by adding water","The addition of functional groups to double bonds","The rearrangement of atoms within a molecule","The transfer of a phosphoryl group"],"answer":"The rearrangement of atoms within a molecule","solution":"A: Cleavage by adding water is hydrolysis.\nB: Addition to double bonds is not isomerisation.\nC: Isomerisation rearranges atoms within the same molecule.\nD: Phosphate transfer is phosphorylation."},{"id":"med-v4-001","module":"v4","type":"mcq","q":"What is the default slide layout that appears when a new presentation is created?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 2","difficulty":"Medium","options":["Two Content","Title Slide","Blank","Title and Content"],"answer":"Title Slide","solution":"A: Two Content is a choice for later slides.\nB: A new presentation opens with the Title Slide layout.\nC: Blank is not the default layout.\nD: Title and Content is a layout, not the initial one."},{"id":"med-v2-003","module":"v2","type":"mcq","q":"The activation of zymogens is characterized as:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 4","difficulty":"Medium","options":["Irreversible and proteolytic","Dependent on high substrate concentrations","Instantaneous and allosteric","Reversible and non-covalent"],"answer":"Irreversible and proteolytic","solution":"A: Zymogens are activated irreversibly by proteolytic cleavage.\nB: It does not depend on high substrate concentration.\nC: Activation is not instantaneous allosteric change.\nD: Zymogen activation is not reversible or non-covalent."},{"id":"med-v5-001","module":"v5","type":"mcq","q":"Phonological ambiguity is caused by the use of:","source":"Medicine/HB1 First Semester/Communication skills/ambiguity ppt.pdf | SLIDE 5","difficulty":"Hard","options":["synonyms","homophones","antonyms","homonyms"],"answer":"homophones","solution":"A: Synonyms have similar meanings and do not create this ambiguity.\nB: Homophones sound alike but have different meanings, causing phonological ambiguity.\nC: Antonyms are opposites and do not cause it.\nD: Homonyms share form but are the cause of semantic ambiguity."},{"id":"med-v4-002","module":"v4","type":"mcq","q":"Which process involves assembling data from several worksheets into a master sheet?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 5","difficulty":"Hard","options":["Sorting","Filtering","Scaling","Consolidation"],"answer":"Consolidation","solution":"A: Sorting arranges rows by a key.\nB: Filtering hides rows that do not match criteria.\nC: Scaling changes print size.\nD: Consolidation combines data from several sheets into a master sheet."},{"id":"med-v8-001","module":"v8","type":"mcq","q":"The set of rational numbers is denoted by:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 1.pdf | SLIDE 13","difficulty":"Hard","options":["I","C","Q","N"],"answer":"Q","solution":"A: I denotes irrational numbers.\nB: C denotes complex numbers.\nC: Q denotes rational numbers expressed as fractions.\nD: N denotes natural numbers."},{"id":"med-v1-001","module":"v1","type":"mcq","q":"Which of the following statements about the cytoskeleton is true?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 12","difficulty":"Hard","options":["Microfilaments are structurally rigid and resist compression, while microtubules resist tension (stretching)","Movement of cilia and flagella is the result of motor proteins causing microtubules to move relative to each other","The dynamic aspect of cytoskeletal function is made possible by the assembly and disassembly of a large number of complex proteins into larger aggregates","Chemicals that block the assembly of the cytoskeleton would cause little effect on the cellʹs metabolism"],"answer":"Movement of cilia and flagella is the result of motor proteins causing microtubules to move relative to each other","solution":"A: Microfilaments resist tension while microtubules resist compression; the roles are reversed here.\nB: Cilia and flagella bend because motor proteins slide microtubules relative to one another.\nC: Assembly and disassembly do aid dynamics, but this is not the specific statement being asked.\nD: Blocking cytoskeleton assembly would severely disrupt cell shape, transport and division."},{"id":"med-v1-002","module":"v1","type":"mcq","q":"Centrioles, cilia, flagella, and basal bodies have remarkably similar structural elements and arrangements. This leads us to which of the following as a probable hypothesis?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 11","difficulty":"Devil Mode","options":["Disruption of one of these types of structure should necessarily disrupt each of the others as well","Loss of basal bodies should lead to loss of all cilia, flagella, and centrioles","Natural selection for motility must select for microtubular arrays in circular patterns","Motor proteins such as dynein must have evolved before any of these four kinds of structure"],"answer":"Natural selection for motility must select for microtubular arrays in circular patterns","solution":"A: Disrupting one structure does not necessarily disrupt all the others.\nB: Loss of basal bodies does not automatically eliminate every related structure.\nC: Selection for motility favours circular arrays of microtubules in these structures.\nD: Dynein need not have evolved before these structures existed."},{"id":"med-v4-003","module":"v4","type":"mcq","q":"To exit a Slide Show and return to the editing window, you press:","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 4","difficulty":"Devil Mode","options":["Enter","Space bar","Backspace","Esc"],"answer":"Esc","solution":"A: Enter advances to the next slide.\nB: Space bar advances to the next slide.\nC: Backspace goes back one slide.\nD: Escape exits the slide show and returns to editing."},{"id":"med-v8-002","module":"v8","type":"mcq","q":"A function is onto (surjective) when:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 5.pdf | SLIDE 1","difficulty":"Medium","options":["every element of the codomain is mapped to by some domain element","the function has an inverse","the domain equals the codomain","each domain element maps to exactly one codomain element"],"answer":"every element of the codomain is mapped to by some domain element","solution":"A: That property defines a function generally, not surjectivity.\nB: Having an inverse requires bijectivity.\nC: Equal domain and codomain do not guarantee onto.\nD: Surjectivity means the range covers the whole codomain."},{"id":"med-v1-003","module":"v1","type":"mcq","q":"Microfilaments are well known for their role in which of the following?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 11","difficulty":"Medium","options":["A, B, and C","contracting of muscle cells","formation of cleavage furrows","ameboid movement"],"answer":"A, B, and C","solution":"A: All three processes depend on microfilaments, so A, B and C is right.\nB: Muscle contraction uses actin microfilaments with myosin.\nC: Cleavage furrow formation depends on actin and myosin microfilaments.\nD: Ameboid movement is driven by actin microfilaments."},{"id":"med-v2-004","module":"v2","type":"mcq","q":"A mother of a malnourished child has been in- structed to include a complete protein in the diet of the child. Which of the following should be recommended?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 2","difficulty":"Medium","options":["Milk","Wheat","Pulses","Soy protein"],"answer":"Milk","solution":"A: Milk is the complete protein recommended in this question.\nB: Wheat is limiting in lysine.\nC: Pulses are a decent plant protein but not the recommended complete protein here.\nD: Soy protein is a complete plant protein."},{"id":"med-v3-001","module":"v3","type":"mcq","q":"Statements: (1) “Pleasant odor” is a general characteristic of esters. (2) Citric acid is both a tricarboxylic acid and a ketoacid. (3) Esters and carboxylic acids with the same number of carbon atoms and the same degree of saturation are constitutional isomers","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 10","difficulty":"Medium","options":["Two of the three statements are true","Only one of the statements is true","All three statements are true","None of the statements is true"],"answer":"Two of the three statements are true","solution":"A: Two statements are true.\nB: One true undercounts.\nC: Esters often smell pleasant, citric acid is not a ketoacid, and esters with acids of equal carbon count are isomers.\nD: All true is wrong because citric acid is not a ketoacid."},{"id":"med-v8-003","module":"v8","type":"mcq","q":"If A = {2, 4, 6, 8} and B = {2, 3, 5, 7}, then A ∪ B is:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 1.pdf | SLIDE 17","difficulty":"Hard","options":["{3, 5, 7}","{4, 6, 8}","{2}","{2, 3, 4, 5, 6, 7, 8}"],"answer":"{2, 3, 4, 5, 6, 7, 8}","solution":"A: That is only part of set B.\nB: That is only part of set A.\nC: That is only the common element, the intersection.\nD: The union combines all elements from both sets."},{"id":"med-v8-004","module":"v8","type":"mcq","q":"The expansion of (a + b)^2 is:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 4.pdf | SLIDE 1","difficulty":"Hard","options":["a^2 + b^2","a^2 + 2ab + b^2","a^2 - 2ab + b^2","a^2 + ab + b^2"],"answer":"a^2 + 2ab + b^2","solution":"A: The middle term is missing.\nB: The square of a binomial includes the 2ab cross term.\nC: This is the expansion of (a - b)^2.\nD: The cross term must have coefficient two."},{"id":"med-v3-002","module":"v3","type":"mcq","q":"A hemiacetal is a compound in which","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 4","difficulty":"Hard","options":["two alkoxy groups are attached to the same carbon atom","two alkoxy groups are attached to adjacent carbon atoms","a hydroxyl group and an alkoxy group are attached to adjacent carbon atoms","a hydroxy group and an alkoxy group are attached to the same carbon atom"],"answer":"a hydroxy group and an alkoxy group are attached to the same carbon atom","solution":"A: Two alkoxy groups on one carbon define an acetal.\nB: Two alkoxy groups on adjacent carbons are not a hemiacetal.\nC: Adjacent carbons describe a different arrangement, not a hemiacetal.\nD: A hemiacetal has a hydroxyl and an alkoxy group on the same carbon."},{"id":"med-v4-004","module":"v4","type":"mcq","q":"How can you quickly insert a new worksheet at the end of existing sheets?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 5","difficulty":"Hard","options":["Press F11","Click the ”+” button at the bottom of the screen","Use the File menu","Right-click any tab and select ”Move”"],"answer":"Click the ”+” button at the bottom of the screen","solution":"A: F11 creates a chart in Excel, not a worksheet.\nB: The plus button at the bottom inserts a new worksheet quickly.\nC: The File menu is not the quickest insertion route.\nD: Right-click and Move rearranges existing sheets, not quick insertion."},{"id":"med-v4-005","module":"v4","type":"mcq","q":"Applying a new ”Theme” to a presentation will affect:","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 5","difficulty":"Devil Mode","options":["Only the text you have manually formatted","Only the images inserted from the computer","The background, fonts, and color scheme of the slides","The file size but not the appearance"],"answer":"The background, fonts, and color scheme of the slides","solution":"A: Manually formatted text is not the only part affected.\nB: Inserted images are not the only affected elements.\nC: A theme changes the background, fonts and colour scheme.\nD: Appearance changes, not just file size."},{"id":"med-v4-006","module":"v4","type":"mcq","q":"Which feature allows you to create designer-quality diagrams like organi- zation charts?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 8","difficulty":"Devil Mode","options":["SmartArt","Quick Access Toolbar","WordArt","Text Box"],"answer":"SmartArt","solution":"A: SmartArt creates designer-quality diagrams such as organisation charts.\nB: The Quick Access Toolbar holds commands.\nC: WordArt makes decorative text.\nD: A text box holds typed text, not designer diagrams."},{"id":"med-v4-007","module":"v4","type":"mcq","q":"What is the keyboard shortcut to save a workbook?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 4","difficulty":"Medium","options":["Ctrl + C","Ctrl + V","Ctrl + S","Ctrl + Z"],"answer":"Ctrl + S","solution":"A: Ctrl+C copies; it does not save.\nB: Ctrl+V pastes; it does not save.\nC: Ctrl+S is the save workbook shortcut.\nD: Ctrl+Z undoes the last action."},{"id":"med-v3-003","module":"v3","type":"mcq","q":"The solubility of alcohols in water","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 5","difficulty":"Medium","options":["more than one correct response E) no correct response","increases with increasing molecular mass","decreases as the number of –OH groups present increases","decreases as the carbon chain length increases"],"answer":"decreases as the carbon chain length increases","solution":"A: Only one statement is correct.\nB: Solubility decreases rather than increases with molecular mass.\nC: More hydroxyl groups increase, not decrease, solubility.\nD: Alcohol water solubility decreases as the carbon chain lengthens."},{"id":"med-v2-005","module":"v2","type":"mcq","q":"In the D- and L- nomenclature system, what determines the isomeric form of the sugar?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["The presence of a ring structure","The number of carbon atoms","The position of the carbonyl group","The configuration of the chiral center furthest from the carbonyl group"],"answer":"The configuration of the chiral center furthest from the carbonyl group","solution":"A: Ring formation does not determine D or L.\nB: Carbon number does not set D or L configuration.\nC: Carbonyl position distinguishes aldoses from ketoses.\nD: D/L is set by the chiral centre farthest from the carbonyl group."},{"id":"med-v3-004","module":"v3","type":"mcq","q":"The correct IUPAC name for CH CH2 CH2 CH3 CH2 CH2 OH OH is","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 1","difficulty":"Medium","options":["1,5-hexanediol","hexyl dialcohol","2,6-hexanediol","2,6-dihydroxyhexane"],"answer":"1,5-hexanediol","solution":"A: 1,5-hexanediol correctly names the terminal diol structure.\nB: Hexyl dialcohol is not systematic nomenclature.\nC: 2,6-hexanediol likewise gives internal hydroxyls.\nD: 2,6-dihydroxyhexane places hydroxyl groups internally."},{"id":"med-v2-006","module":"v2","type":"mcq","q":"Which of the following is considered an ”essential” amino acid?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 1","difficulty":"Hard","options":["Alanine","Asparagine","Methionine","Glycine"],"answer":"Methionine","solution":"A: Alanine is a nonessential amino acid.\nB: Asparagine can be synthesised by the body.\nC: Methionine is an essential amino acid that must be obtained from the diet.\nD: Glycine is nonessential."},{"id":"med-v3-005","module":"v3","type":"mcq","q":"The structural difference between a hemiacetal and an acetal is the replacement of a","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 4","difficulty":"Hard","options":["–OH group with an –OR group","–OR group with a –OH group","H atom with an –OR group","H atom with a –OH group"],"answer":"–OH group with an –OR group","solution":"A: An acetal results when a hemiacetal's OH is replaced by an OR group.\nB: The reverse replacement gives a hemiacetal from an acetal.\nC: Replacing hydrogen with OR is not the hemiacetal-to-acetal change.\nD: Replacing hydrogen with OH is not the change described."},{"id":"med-v2-007","module":"v2","type":"mcq","q":"Which part of the amino acid structure gives it its unique identity?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 1","difficulty":"Hard","options":["The R group (side chain)","The alpha-carbon","The amino group","The carboxyl group"],"answer":"The R group (side chain)","solution":"A: The R group or side chain differs between amino acids and gives each its identity.\nB: The alpha-carbon is common to all amino acids and does not distinguish them.\nC: The amino group is shared by all standard amino acids.\nD: The carboxyl group is also common to every amino acid."},{"id":"med-v3-006","module":"v3","type":"mcq","q":"Which of the following compounds is a constitutional isomer of ethyl ethanoate?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 8","difficulty":"Hard","options":["more than one correct response","methyl methanoate","ethyl propanoate","butanoic acid"],"answer":"butanoic acid","solution":"A: Only one compound is isomeric, so more than one is wrong.\nB: Methyl methanoate has fewer carbon atoms than ethyl ethanoate.\nC: Ethyl propanoate has more carbon atoms.\nD: Butanoic acid shares the formula C4H8O2 with ethyl ethanoate and is a constitutional isomer."},{"id":"med-v5-002","module":"v5","type":"mcq","q":"'The shooting of the policeman angered the people' exemplifies:","source":"Medicine/HB1 First Semester/Communication skills/ambiguity ppt.pdf | SLIDE 10","difficulty":"Devil Mode","options":["unclear word order","semantic ambiguity of a homonym","an ambiguous word or phrase in a sentence","phonological ambiguity"],"answer":"an ambiguous word or phrase in a sentence","solution":"A: The order is fixed; the noun phrase itself is ambiguous.\nB: No homonym is the source here.\nC: The phrase can mean the policeman did the shooting or was shot, so the word phrase is ambiguous.\nD: Sound is not the issue."},{"id":"med-v2-008","module":"v2","type":"mcq","q":"Which of the following formulas will Excel Not be able to calculate?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 22","difficulty":"Devil Mode","options":["=SUM(A1:A5)*","=SUM(A1:A5)-10","=SUM(A1:A5)/(10-10)","=SUM(Sales)-A3"],"answer":"=SUM(A1:A5)/(10-10)","solution":"A: =SUM(A1:A5)* is incomplete and invalid syntax.\nB: =SUM(A1:A5)-10 is a valid formula.\nC: =SUM(A1:A5)/(10-10)* divides by zero and cannot be calculated.\nD: =SUM(Sales)-A3 is a valid formula."},{"id":"med-v3-007","module":"v3","type":"mcq","q":"Which of the following types of compounds contains a carbon-sulfur double bond?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 8","difficulty":"Medium","options":["a thial (thioaldehyde)","a sulfoxide","a thione (thioketone)","more than one correct response E) no correct response"],"answer":"more than one correct response E) no correct response","solution":"A: A thial contains a carbon-sulfur double bond.\nB: A sulfoxide has sulfur-oxygen bonding, not a C=S double bond.\nC: A thione also contains a carbon-sulfur double bond.\nD: More than one compound type has a carbon-sulfur double bond."},{"id":"med-v3-008","module":"v3","type":"mcq","q":"For which of the following biochemically important polyfunctional carboxylic acids is its accompanying characterization correct?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 6","difficulty":"Medium","options":["pyruvic acid; an unsaturated acid","fumaric acid; a keto acid","lactic acid; a dihydroxy acid","no correct response"],"answer":"no correct response","solution":"A: Pyruvic acid is a keto acid, not an unsaturated acid.\nB: Fumaric acid is an unsaturated acid, not a keto acid.\nC: Lactic acid is a hydroxy acid, not a dihydroxy acid.\nD: None of the given characterisations is correct, so this option applies."},{"id":"med-v4-008","module":"v4","type":"mcq","q":"When an optional argument is omitted in a function, but a subsequent argument is used, what must be done?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 3","difficulty":"Medium","options":["Insert commas to act as placeholders","Use a period as a placeholder","Use a space as a placeholder","The function will not work and cannot be entered"],"answer":"Insert commas to act as placeholders","solution":"A: Empty commas act as placeholders for omitted optional arguments.\nB: A period is not used as a placeholder.\nC: A space is not a valid placeholder in an argument list.\nD: The function still works if placeholders are inserted."},{"id":"med-v2-009","module":"v2","type":"mcq","q":"A prosthetic group of a protein is a non-protein structure that is","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 3","difficulty":"Medium","options":["A ligand of the protein","Permanently associated with the protein","A part of the secondary structure of the protein","A substrate of the protein"],"answer":"Permanently associated with the protein","solution":"A: A ligand binds reversibly, not permanently.\nB: A prosthetic group is permanently associated with the protein.\nC: Prosthetic groups are not part of secondary structure.\nD: A substrate is converted, not permanently attached."},{"id":"med-v2-010","module":"v2","type":"mcq","q":"Stereoisomers are usually described as being","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 3","difficulty":"Hard","options":["molecules of differing molecular formulae","non-superimposable images of each other","anomeric forms of each other","superimposable images of each other"],"answer":"non-superimposable images of each other","solution":"A: Stereoisomers share the same molecular formula.\nB: Stereoisomers are non-superimposable mirror images of each other.\nC: Anomers are a specific form of stereoisomer, not the general description.\nD: Superimposable images describe identical molecules."},{"id":"med-v8-005","module":"v8","type":"mcq","q":"For A = {1, 2}, the power set P(A) contains how many subsets?","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 1.pdf | SLIDE 15","difficulty":"Hard","options":["2","3","5","4"],"answer":"4","solution":"A: Two is the number of elements in A, not subsets.\nB: Three omits one subset.\nC: Five overcounts the subsets.\nD: The subsets are empty set, {1}, {2} and {1,2}, so four."},{"id":"med-v3-009","module":"v3","type":"mcq","q":"Statements: (1) Butanal and butanone are both correct IUPAC names. (2) The two alcohol molecules produced when an acetal molecule undergoes hydrolysis are always identical. (3) Aldehydes and ketones are both classified as carbonyl-containing compounds","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 10","difficulty":"Hard","options":["Only one of the statements is true","None of the statements is true","All three statements are true","Two of the three statements are true"],"answer":"Only one of the statements is true","solution":"A: Only one statement is true.\nB: None true is wrong.\nC: Butanal and butanone are valid names, but acetal hydrolysis alcohols need not be identical and both are carbonyl compounds.\nD: Only the carbonyl classification statement is true."},{"id":"med-v1-004","module":"v1","type":"mcq","q":"Recent evidence shows that individual chromosomes occupy fairly defined territories within the nucleus. Given the structure and location of the following parts of the nucleus, which would be more probably involved in chromosome location?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 4","difficulty":"Hard","options":["the nuclear matrix","the outer lipid bilayer","the nucleolus","nuclear pores"],"answer":"the nuclear matrix","solution":"A: The nuclear matrix is the internal protein framework thought to anchor chromosome territories.\nB: The outer bilayer is a membrane, not an organising framework.\nC: The nucleolus assembles ribosomal subunits, not chromosome territories.\nD: Nuclear pores mediate transport, not chromosome positioning."},{"id":"med-v1-005","module":"v1","type":"mcq","q":"How does the cell multiply its peroxisomes?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 9","difficulty":"Devil Mode","options":["They are brought into the cell from the environment","They are built de novo from cytosol materials","They split in two after they are too large","They bud off from the ER"],"answer":"They split in two after they are too large","solution":"A: Peroxisomes are not taken up from the extracellular environment.\nB: They are not built entirely de novo in the cytosol in the accepted model.\nC: Peroxisomes multiply by growing and dividing into two.\nD: Peroxisomes do not bud from the endoplasmic reticulum."},{"id":"med-v3-010","module":"v3","type":"mcq","q":"Which of the following compounds contains two oxygen atoms?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 7","difficulty":"Devil Mode","options":["2-ethoxy-1-propanol","1,3-dimethoxybenzene","methoxycyclohexane","more than one correct response E) no correct response"],"answer":"more than one correct response E) no correct response","solution":"A: 2-ethoxy-1-propanol contains two oxygen atoms.\nB: 1,3-dimethoxybenzene contains two oxygen atoms.\nC: Methoxycyclohexane contains one oxygen atom.\nD: More than one listed compound contains two oxygen atoms."},{"id":"med-v4-009","module":"v4","type":"mcq","q":"How does Excel internally represent dates and times for calculations?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 5","difficulty":"Medium","options":["As percentages","As serial numbers","As text strings","As binary code"],"answer":"As serial numbers","solution":"A: Percentages are a display format, not the internal storage.\nB: Excel stores dates and times as serial numbers.\nC: Dates are not stored as text for calculation.\nD: They are not stored as raw binary code visible to users."},{"id":"med-v7-001","module":"v7","type":"fill","q":"Find the mean of the numbers 2, 4, 6 and 8. (Answer as a number.)","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/ZANIPOLO stas pasco.PDF | SLIDE 1","difficulty":"Medium","answer":"5","solution":"The sum is 2+4+6+8 = 20, and dividing by 4 observations gives a mean of 5."},{"id":"med-v2-011","module":"v2","type":"mcq","q":"Which of the following statements is correct? I. Lactose is a component of galactose II. Galac- tose is a component of lactose III. Lactose is also called milk sugar IV. Galactose is also called milk sugar","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 3","difficulty":"Medium","options":["I and IV","III and IV","I and II","II and III"],"answer":"II and III","solution":"A: Including statement I or IV makes the option wrong.\nB: Galactose is not called milk sugar.\nC: Lactose is not a component of galactose; the reverse is true.\nD: Galactose is a component of lactose, and lactose is milk sugar, so II and III are correct."},{"id":"med-v2-012","module":"v2","type":"mcq","q":"What is the term for a 4-carbon sugar that contains an aldehyde group?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["Aldotetrose","Aldopentose","Ketohexose","Ketotetrose"],"answer":"Aldotetrose","solution":"A: An aldotetrose has four carbons and an aldehyde group.\nB: An aldopentose has five carbons.\nC: A ketohexose has six carbons and a ketone.\nD: A ketotetrose has a ketone, not an aldehyde, and four carbons."},{"id":"med-v2-013","module":"v2","type":"mcq","q":"A protein composed of four polypeptide chains of two different kinds (like hemoglobin) is called a:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["Homodimer","Heteromultimer","Monomeric protein","Homotetramer"],"answer":"Heteromultimer","solution":"A: A homodimer has two identical chains.\nB: Haemoglobin, with four chains of two kinds, is a heteromultimer.\nC: A monomeric protein has a single chain.\nD: A homotetramer has four identical chains."},{"id":"med-v4-010","module":"v4","type":"mcq","q":"Which logical function returns TRUE only if all its arguments are TRUE?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 9","difficulty":"Hard","options":["OR()","IF()","NOT()","AND()"],"answer":"AND()","solution":"A: OR is true when at least one argument is true.\nB: IF returns one of two values based on a test.\nC: NOT reverses a single logical value.\nD: AND returns TRUE only when all its arguments are TRUE."},{"id":"med-v2-014","module":"v2","type":"mcq","q":"Which phospholipid was first observed in heart tissue and is also known as cardiolipin?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["Phosphatidylglycerol","Diphosphatidylglycerol","Phosphatidylinositol","Plasmalogen"],"answer":"Diphosphatidylglycerol","solution":"A: Phosphatidylglycerol has one glycerol head, not cardiolipin.\nB: Diphosphatidylglycerol is cardiolipin, first observed in heart tissue.\nC: Phosphatidylinositol has an inositol head group.\nD: Plasmalogens contain a vinyl ether linkage."},{"id":"med-v3-011","module":"v3","type":"mcq","q":"Which of the following statements concerning phenols is incorrect?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 3","difficulty":"Hard","options":["they easily dissolve in water","phenols are flammable","they are easily oxidized and therefore used as antioxidants","unlike alcohols they are weak acids in solution"],"answer":"they easily dissolve in water","solution":"A: Phenols are only slightly soluble in water, so saying they easily dissolve is incorrect.\nB: Phenols are flammable, so that statement is correct.\nC: Phenols are easily oxidised and used as antioxidants.\nD: Phenols are weak acids unlike alcohols."},{"id":"med-v4-011","module":"v4","type":"mcq","q":"Which feature prevents unauthorized opening of a workbook?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 4","difficulty":"Devil Mode","options":["Read-only mode","Protect Workbook Structure","Encrypt with Password","Restrict Access"],"answer":"Encrypt with Password","solution":"A: Read-only mode discourages edits but does not encrypt.\nB: Protecting structure limits changes to sheets, not opening.\nC: Encrypting with a password prevents unauthorised opening.\nD: Restrict Access is not the specific Excel command here."},{"id":"med-v1-006","module":"v1","type":"mcq","q":"Which of the following possesses a microtubular structure similar to a basal body?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 11","difficulty":"Devil Mode","options":["nucleolus","centriole","lysosome","peroxisome"],"answer":"centriole","solution":"A: The nucleolus is a nuclear region, not a microtubular structure.\nB: Centrioles share the microtubular structural organisation of basal bodies.\nC: Lysosomes are membrane vesicles with no microtubule array.\nD: Peroxisomes are simple oxidative vesicles."},{"id":"med-v4-012","module":"v4","type":"mcq","q":"What is the correct syntax to sum the range of cells from A1 to A1000?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 1","difficulty":"Medium","options":["+A1+A2...+A1000","=SUM(A1:A1000)","=ADD(A1:A1000)","=SUM(A1-A1000)"],"answer":"=SUM(A1:A1000)","solution":"A: Manually listing cells is impractical and not the standard syntax.\nB: =SUM(A1:A1000)* correctly sums the range using a colon.\nC: ADD is not an Excel function name.\nD: A hyphen is subtraction, not a range separator."},{"id":"med-v3-012","module":"v3","type":"mcq","q":"A general method for preparing alcohols is the","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 2","difficulty":"Medium","options":["hydrogenation of alkenes","hydration of alkenes","combustion of ethers","combustion of alkanes"],"answer":"hydration of alkenes","solution":"A: Hydrogenation of alkenes gives alkanes, not alcohols.\nB: Alcohols are commonly prepared by hydration of alkenes.\nC: Combustion of ethers destroys the molecule.\nD: Combustion of alkanes gives carbon dioxide and water."},{"id":"med-v1-007","module":"v1","type":"mcq","q":"All of the following are part of a prokaryotic cell except","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 3","difficulty":"Medium","options":["a cell wall","DNA","an endoplasmic reticulum","a plasma membrane"],"answer":"an endoplasmic reticulum","solution":"A: Most prokaryotes have a cell wall, so it is present.\nB: Prokaryotes possess DNA, so this cannot be the exception.\nC: Prokaryotes lack an endoplasmic reticulum because they have no membrane-bound organelles.\nD: A plasma membrane is universal to all cells, including prokaryotes."},{"id":"med-v2-015","module":"v2","type":"mcq","q":"The reaction between two amino acids to form a peptide bond involves the removal of what molecule?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["Ammonia","Carbon dioxide","Water","Hydrogen gas"],"answer":"Water","solution":"A: Ammonia is not the molecule eliminated.\nB: Carbon dioxide is not released in peptide bond formation.\nC: Peptide bond formation between two amino acids releases water.\nD: Hydrogen gas is not produced."},{"id":"med-v2-016","module":"v2","type":"mcq","q":"The interaction of DNA with histone proteins to form chromatin is an example of:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["Secondary structure","Quaternary structure","Primary structure","Tertiary structure"],"answer":"Tertiary structure","solution":"A: Secondary is the DNA double helix itself.\nB: Quaternary would involve higher-order multi-fibre assemblies.\nC: Primary structure is the nucleotide sequence alone.\nD: DNA complexed with histones to form chromatin is tertiary organisation."},{"id":"med-v8-006","module":"v8","type":"mcq","q":"The derivative of x^2 with respect to x is:","source":"Medicine/HB1 First Semester/Algebra/Calculus II.pdf | SLIDE 1","difficulty":"Hard","options":["2x","x","x^3","2"],"answer":"2x","solution":"A: By the power rule the derivative of x^2 is 2x.\nB: That is the derivative of x^2/2.\nC: That would result from integrating x^2.\nD: That is the derivative of 2x."},{"id":"med-v2-017","module":"v2","type":"mcq","q":"A molecule that possesses both polar and nonpolar groups is described as:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 1","difficulty":"Hard","options":["Anhydrous","Hydrophobic","Hydrophilic","Amphipathic"],"answer":"Amphipathic","solution":"A: Anhydrous means without water and is unrelated.\nB: Hydrophobic molecules have only nonpolar character.\nC: Hydrophilic molecules have only polar character.\nD: Amphipathic molecules contain both polar and nonpolar regions."},{"id":"med-v3-013","module":"v3","type":"mcq","q":"The common names for the C2 mono- and dicarboxylic acids are, respectively,","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 1","difficulty":"Hard","options":["oxalic acid and acetic acid","acetic acid and oxalic acid","acetic acid and formic acid","formic acid and acetic acid"],"answer":"acetic acid and oxalic acid","solution":"A: Oxalic with acetic is not the C2 mono/di pair.\nB: Acetic acid and oxalic acid are the C2 mono- and dicarboxylic acids.\nC: The order of mono and diacids is reversed here.\nD: Formic acid is C1 and acetic is C2, not this pair."},{"id":"med-v2-018","module":"v2","type":"mcq","q":"Which of the following is not an example of a value?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 29","difficulty":"Devil Mode","options":["57%","350","Serial Number 50771","May 10, 2001"],"answer":"Serial Number 50771","solution":"A: 57% is a numeric percentage value.\nB: 350 is a numeric value.\nC: A serial number such as 50771 is text, not a value.\nD: A date such as May 10, 2001 is a value."},{"id":"med-v2-019","module":"v2","type":"mcq","q":"What is the central carbon atom in an amino acid called?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 1","difficulty":"Devil Mode","options":["Alpha-carbon","Delta-carbon","Gamma-carbon","Beta-carbon"],"answer":"Alpha-carbon","solution":"A: The central carbon bonded to the amino group, carboxyl group and R group is the alpha-carbon.\nB: The delta-carbon is even further along the chain.\nC: The gamma-carbon is three positions from the carbonyl.\nD: The beta-carbon is further from the carboxyl group."},{"id":"med-v5-003","module":"v5","type":"mcq","q":"'She looks straight ahead' is classified as:","source":"Medicine/HB1 First Semester/Communication skills/CLASSIFICATION OF SENTENCES.docx | DOCUMENT 1","difficulty":"Medium","options":["simple sentence","compound-complex sentence","complex sentence","compound sentence"],"answer":"simple sentence","solution":"A: It contains a single independent clause, so it is simple.\nB: It lacks the multiple clauses required for compound-complex.\nC: There is no subordinate clause.\nD: It has only one independent clause, not two."},{"id":"med-v6-001","module":"v6","type":"mcq","q":"Micro-environmental factors that lead to disability include:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 21","difficulty":"Medium","options":["hospital building design","national transport policy","personal assistance such as glasses or a wheelchair","government legislation"],"answer":"personal assistance such as glasses or a wheelchair","solution":"A: Building design belongs to the wider environment.\nB: Transport policy is a broader environmental factor.\nC: The micro-environment includes aids that follow the person, like glasses or wheelchairs.\nD: Legislation is not part of the micro-environment."},{"id":"med-v1-008","module":"v1","type":"mcq","q":"Which of the following makes it necessary for animal cells, although they have no cell walls, to have intercellular junctions?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 14","difficulty":"Medium","options":["Cell membranes do not distinguish the types of ions and molecules passing through them","Large molecules, especially proteins, do not readily get through one, much less two adjacent cell membranes","Maintenance of connective tissue shape requires cells to adhere to one another","Cell-to-cell communication requires physical attachment of one cell to another"],"answer":"Large molecules, especially proteins, do not readily get through one, much less two adjacent cell membranes","solution":"A: Cell membranes do discriminate between ions and molecules.\nB: Large molecules such as proteins cannot easily cross two adjacent membranes, so junctions are needed.\nC: Connective tissue shape is not the universal reason for intercellular junctions.\nD: Cell-to-cell communication does not require physical attachment."},{"id":"med-v2-020","module":"v2","type":"mcq","q":"To copy cell contents using drag and drop press the","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 20","difficulty":"Medium","options":["End key","Ctrl key","Esc key","Shift key"],"answer":"Ctrl key","solution":"A: The End key does not affect drag-and-drop copying.\nB: Holding Ctrl while dragging copies the cell contents.\nC: Escape cancels the operation rather than copying.\nD: Shift-drag moves rather than copies in standard spreadsheet behaviour."},{"id":"med-v3-014","module":"v3","type":"mcq","q":"The monomers for the formation of a polyester are","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 4","difficulty":"Hard","options":["two monoesters","a dicarboxylic acid and a monoalcohol","two diesters","a dicarboxylic acid and a dialcohol"],"answer":"a dicarboxylic acid and a dialcohol","solution":"A: Two monoesters are not polymer monomers.\nB: A monoalcohol cannot form a polymer chain with a diacid.\nC: Two diesters do not polymerise into a polyester.\nD: Polyesters form from a dicarboxylic acid and a dialcohol."},{"id":"med-v3-015","module":"v3","type":"mcq","q":"Which of the following compounds contains 7 carbon atoms?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 6","difficulty":"Hard","options":["more than one correct response E) no correct response","benzophenone","acetophenone","benzaldehyde"],"answer":"benzaldehyde","solution":"A: Only one compound has seven carbons.\nB: Benzophenone has thirteen carbons.\nC: Acetophenone has eight carbons.\nD: Benzaldehyde has seven carbon atoms, six in the ring plus the formyl carbon."},{"id":"med-v4-013","module":"v4","type":"mcq","q":"If you manually change a font style and then apply a new theme, what happens to that manually changed font?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 5","difficulty":"Hard","options":["It will not change","It becomes bold automatically","It disappears","It reverts to the theme’s default font"],"answer":"It will not change","solution":"A: A manually changed font will not change when a new theme is applied.\nB: It does not become bold automatically.\nC: The font does not disappear.\nD: Manually applied formatting is not overwritten by a new theme."},{"id":"med-v6-002","module":"v6","type":"mcq","q":"Central hearing loss results from damage to:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 15","difficulty":"Hard","options":["the middle ear bones","the cochlea only","the outer ear","nerves or nuclei of the central nervous system"],"answer":"nerves or nuclei of the central nervous system","solution":"A: Middle ear bones are involved in conductive loss.\nB: The cochlea is the inner ear, causing sensorineural loss.\nC: Outer ear damage is conductive.\nD: Central loss arises from CNS pathways or brain nuclei."},{"id":"med-v2-021","module":"v2","type":"mcq","q":"Which symbol must all formula begin with?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 27","difficulty":"Devil Mode","options":["@","(","=","+"],"answer":"=","solution":"A: @ is not the formula prefix.\nB: A parenthesis alone is not a formula prefix.\nC: All Excel formulas begin with an equals sign.\nD: A plus sign alone does not start a standard formula."},{"id":"med-v5-004","module":"v5","type":"mcq","q":"Unintentional ambiguity refers to:","source":"Medicine/HB1 First Semester/Communication skills/ambiguity ppt.pdf | SLIDE 4","difficulty":"Devil Mode","options":["ambiguity caused by homophones only","ambiguity in advertisements only","ambiguity created deliberately in literature","unconscious or unclear use of ambiguous expressions"],"answer":"unconscious or unclear use of ambiguous expressions","solution":"A: Homophones cause phonological ambiguity, which may be either type.\nB: It is not confined to advertising.\nC: Deliberate ambiguity is intentional, not unintentional.\nD: Unintentional ambiguity arises from careless or unconscious unclear expression."},{"id":"med-v2-022","module":"v2","type":"mcq","q":"Which of the following best describes a metabolic pathway?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 1","difficulty":"Medium","options":["A single enzymatic reaction that produces a specific product","A series of connected enzymatic reactions that produce a specific product","A random collection of cellular reactions","A process that only occurs in the mitochondria"],"answer":"A series of connected enzymatic reactions that produce a specific product","solution":"A: A single reaction is not a pathway; pathways have several steps.\nB: A metabolic pathway is a connected series of enzyme-catalysed reactions yielding a product.\nC: Cellular reactions are highly ordered, not a random collection.\nD: Metabolic pathways occur throughout the cell, not only in mitochondria."},{"id":"med-v2-023","module":"v2","type":"mcq","q":"Comments can be added to cells using","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 19","difficulty":"Medium","options":["Insert > Comments","File > Comments","Edit > Comments","View > Comments"],"answer":"View > Comments","solution":"A: Insert menu is not the location given in the source key.\nB: File menu does not manage cell comments.\nC: Edit menu does not hold the comment insertion command described.\nD: Comments are added or viewed through the View menu as per the source key."},{"id":"med-v3-016","module":"v3","type":"mcq","q":"Which of the following is a characteristic property of thiols?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 6","difficulty":"Medium","options":["extremely strong odors","more than one correct response E) no correct response","abnormally high boiling points","strong resistance to oxidation"],"answer":"extremely strong odors","solution":"A: Thiols are known for extremely strong, unpleasant odours.\nB: Only one property is characteristic.\nC: Thiols do not have abnormally high boiling points.\nD: Thiols are readily oxidised, not resistant."},{"id":"med-v2-024","module":"v2","type":"mcq","q":"Purines form glycosidic bonds to the pentose sugar via which atom?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["N1","N3","N9","N7"],"answer":"N9","solution":"A: N1 is the glycosidic bonding atom for pyrimidines, not purines.\nB: N3 is not used for purine glycosidic bonds.\nC: Purines attach to the pentose sugar through N9.\nD: N7 is part of the purine ring but not the sugar linkage."},{"id":"med-v4-014","module":"v4","type":"mcq","q":"Which command allows you to save a file with a new name?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 3","difficulty":"Hard","options":["Export","Save","Share","Save As"],"answer":"Save As","solution":"A: Export produces a different file format.\nB: Save overwrites the existing file with the same name.\nC: Share sends the file to others.\nD: Save As writes the file under a new name or location."},{"id":"med-v3-017","module":"v3","type":"mcq","q":"Statements: (1) Acetals contain three oxygen atoms and hemiacetals contain two oxygen atoms. (2) Reduction of an aldehyde, using hydrogen gas, produces a primary alcohol. (3) In an aldehyde, the carbonyl group can be located on either carbon 1 or carbon 2","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 9","difficulty":"Hard","options":["Two of the three statements are true","Only one of the statements is true","All three statements are true","None of the statements is true"],"answer":"Two of the three statements are true","solution":"A: Two statements are true.\nB: One true undercounts.\nC: Acetals have two alkoxy groups and one hydroxyl-derived oxygen count differs, aldehydes reduce to primary alcohols, but an aldehyde carbonyl is always terminal.\nD: All true is wrong because the aldehyde locant statement fails."},{"id":"med-v2-025","module":"v2","type":"mcq","q":"In globular proteins, where are the hydrophobic amino acid side chains typically located?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 4","difficulty":"Hard","options":["Only at the N-terminal end","Distributed evenly throughout the molecule","In the interior of the molecule","On the surface exposed to water"],"answer":"In the interior of the molecule","solution":"A: They are not confined to the N-terminus.\nB: They are not evenly distributed but segregate internally.\nC: Hydrophobic residues cluster in the interior of globular proteins.\nD: Hydrophobic side chains avoid water rather than sitting on the surface."},{"id":"med-v3-018","module":"v3","type":"mcq","q":"Oxidation of a secondary alochol produces a(n)","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 3","difficulty":"Hard","options":["ether","ketone","aldehyde","carboxylic acid"],"answer":"ketone","solution":"A: Ethers are not oxidation products of alcohols here.\nB: Oxidation of a secondary alcohol gives a ketone.\nC: Primary alcohols give aldehydes on mild oxidation.\nD: Further oxidation to acids requires primary alcohols or aldehydes."},{"id":"med-v1-009","module":"v1","type":"mcq","q":"Which cell would be best for studying lysosomes?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 15","difficulty":"Devil Mode","options":["leaf cell of a plant","nerve cell","muscle cell","phagocytic white blood cell"],"answer":"phagocytic white blood cell","solution":"A: Plant leaf cells contain lytic vacuoles, not animal lysosomes.\nB: Nerve cells are not the classic lysosome-rich cell type.\nC: Muscle cells are not especially rich in lysosomes.\nD: Phagocytic white blood cells contain abundant lysosomes to digest engulfed pathogens."},{"id":"med-v4-015","module":"v4","type":"mcq","q":"Text alignment commands (Left, Center, Right, Justify) align text relative to:","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 5","difficulty":"Devil Mode","options":["The previous slide","The placeholder or text box containing the text","The screen resolution","The entire slide"],"answer":"The placeholder or text box containing the text","solution":"A: It is not relative to the previous slide.\nB: Alignment commands work within the selected placeholder or text box.\nC: Screen resolution is irrelevant.\nD: Alignment is not relative to the whole slide."},{"id":"med-v8-007","module":"v8","type":"mcq","q":"The null set is, by convention:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 1.pdf | SLIDE 15","difficulty":"Medium","options":["a subset of every set","equal to every set","the same as the universal set","not a subset of any set"],"answer":"a subset of every set","solution":"A: It is not equal to arbitrary sets.\nB: It is not the universal set, which contains all elements.\nC: Saying it is not a subset is the opposite of the convention.\nD: The empty set is a subset of all sets by convention."},{"id":"med-v2-026","module":"v2","type":"mcq","q":"Nucleic acids strongly absorb ultraviolet (UV) light with a maximum absorption at approximately:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["300 nm","200 nm","280 nm","260 nm"],"answer":"260 nm","solution":"A: 300 nm is beyond the nucleic acid peak.\nB: Nucleic acids absorb maximally near 260 nm, not 200 nm.\nC: 280 nm is typical for proteins.\nD: The UV absorption maximum of nucleic acids is about 260 nm."},{"id":"med-v4-016","module":"v4","type":"mcq","q":"If the ”type” argument in a financial function is omitted, what does Excel assume?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 8","difficulty":"Medium","options":["Payments are made in advance (1)","Payments are made in arrears (0)","The interest rate is 0","The loan is for one year"],"answer":"Payments are made in arrears (0)","solution":"A: Advance payments are type 1, not the default.\nB: Omitting type assumes payments in arrears, represented by 0.\nC: The interest rate is a separate argument, not assumed zero.\nD: The loan term is given by nper, not assumed to be a year."},{"id":"med-v3-019","module":"v3","type":"mcq","q":"Which of the following statements concerning hydrogen bonding is correct?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 3","difficulty":"Medium","options":["ketone molecules can hydrogen bond to each other","aldehyde molecules cannot hydrogen bond to other aldehyde molecules","aldehyde molecules can hydrogen bond only to other aldehyde molecules","both ketone molecules and aldehyde molecules can hydrogen bond to each other"],"answer":"aldehyde molecules cannot hydrogen bond to other aldehyde molecules","solution":"A: Ketones lack O-H bonds and cannot self hydrogen bond.\nB: Aldehyde molecules cannot hydrogen bond to other aldehyde molecules.\nC: Aldehydes also lack O-H bonds needed for self-association.\nD: Neither can hydrogen bond to themselves in this way."},{"id":"med-v2-027","module":"v2","type":"mcq","q":"The genetic disease galactosemia is caused by the absence of enzymes needed to metabolize:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["Galactose","Sucrose","Fructose","Glucose"],"answer":"Galactose","solution":"A: Galactosemia results from missing enzymes needed to metabolise galactose.\nB: Sucrose is not the sugar involved in this disease.\nC: Fructose metabolism defects cause fructosemia.\nD: Glucose metabolism is not defective in galactosemia."},{"id":"med-v6-003","module":"v6","type":"mcq","q":"A hearing threshold of 56-70 dB corresponds to:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 11","difficulty":"Hard","options":["severe","mild","moderately severe","moderate"],"answer":"moderately severe","solution":"A: Severe is 71-90 dB.\nB: Mild is 26-40 dB.\nC: 56-70 dB is the moderately severe category.\nD: Moderate is 41-55 dB."},{"id":"med-v2-028","module":"v2","type":"mcq","q":"Which of the following is classified as an oligosaccharide?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 1","difficulty":"Hard","options":["A sugar chain with 2-10 units","A chain with more than 10 units","A single sugar unit","A sugar modified with amino groups"],"answer":"A sugar chain with 2-10 units","solution":"A: A chain of two to ten sugar units is classified as an oligosaccharide.\nB: More than ten units forms a polysaccharide.\nC: A single sugar unit is a monosaccharide.\nD: Amino-modified sugars are amino sugars, not defined by chain length alone."},{"id":"med-v1-010","module":"v1","type":"mcq","q":"The extracellular matrix is thought to participate in the regulation of animal cell behavior by communicating information from the outside to the inside of the cell via which of the following?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 13","difficulty":"Hard","options":["DNA and RNA","integrins","gap junctions","the nucleus"],"answer":"integrins","solution":"A: DNA and RNA are intracellular molecules, not transmembrane links.\nB: Integrins span the membrane and transmit ECM signals into the cell.\nC: Gap junctions are cell-to-cell channels, not ECM-to-cell signalling receptors.\nD: The nucleus is inside the cell, not the route for outside-in signalling."},{"id":"med-v4-017","module":"v4","type":"mcq","q":"What is the main benefit of using a Text Box instead of a placeholder?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 6","difficulty":"Devil Mode","options":["They are required for bulleted lists","They automatically create charts","They allow you to place text anywhere on a slide","Text boxes cannot be moved"],"answer":"They allow you to place text anywhere on a slide","solution":"A: Bulleted lists can use placeholders too.\nB: They do not create charts.\nC: Text boxes let you place text anywhere on a slide, unlike fixed placeholders.\nD: Text boxes can be moved freely, so this is false."},{"id":"med-v3-020","module":"v3","type":"mcq","q":"For which of the following types of carboxylic acid derivatives is the parent carboxylic acid(s) a product of the derivative's hydrolysis?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 8","difficulty":"Devil Mode","options":["acid chloride","acid anhydride","ester","more than one correct response"],"answer":"more than one correct response","solution":"A: Acid chlorides hydrolyse to the carboxylic acid.\nB: Acid anhydrides hydrolyse to the parent carboxylic acid.\nC: Esters hydrolyse to an acid and an alcohol.\nD: More than one derivative gives the parent acid on hydrolysis."},{"id":"med-v2-029","module":"v2","type":"mcq","q":"Derived lipids are obtained through which chemical process?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 1","difficulty":"Medium","options":["Hydrogenation","Hydrolysis","Dehydration synthesis","Oxidation"],"answer":"Hydrolysis","solution":"A: Hydrogenation saturates double bonds in fats rather than producing derived lipids.\nB: Derived lipids are produced by hydrolysis of simple and complex lipids.\nC: Dehydration synthesis builds simple lipids from glycerol and fatty acids.\nD: Oxidation is not the general route to derived lipids."},{"id":"med-v3-021","module":"v3","type":"mcq","q":"What is the IUPAC name for the ether whose common name is ethyl phenyl ether?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 3","difficulty":"Medium","options":["1-ethoxybenzene","2-ethoxybenzene","2-phenoxyethane","1-phenoxyethane"],"answer":"1-ethoxybenzene","solution":"A: Ethyl phenyl ether is named 1-ethoxybenzene.\nB: 2-ethoxybenzene would require a substituent at position two.\nC: 2-phenoxyethane is not the correct name.\nD: 1-phenoxyethane is not the preferred IUPAC name here."},{"id":"med-v7-002","module":"v7","type":"fill","q":"For a normal distribution with mean 60 and standard deviation 5, find the z-score of X = 70. (Answer as a number.)","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/NORMAL DISTRIBUTION SAMPLE QUESTIONS.pdf | SLIDE 1","difficulty":"Medium","answer":"2","solution":"The z-score is (X - mean)/sd = (70 - 60)/5 = 2."},{"id":"med-v7-003","module":"v7","type":"mcq","q":"”How many times did you eat at the canteen in the last 12 months?” This question is most susceptible to:","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 2","difficulty":"Medium","options":["Double-barreled error","Recall bias","Leading bias","Sampling error"],"answer":"Recall bias","solution":"A: Only one issue is asked, so it is not double-barreled.\nB: Recalling canteen visits over twelve months is error-prone, so recall bias is most likely.\nC: Leading bias requires suggestive wording, which is absent.\nD: Sampling error concerns who was selected, not the question wording."},{"id":"med-v7-004","module":"v7","type":"fill","q":"If P(A)=0.2 and P(B)=0.3 and A and B are independent, find P(A and B). (Answer as a decimal.)","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/QUESTIONS ON THE LAW OF TOTAL PROBABILITY AND BAYES RULE MR. BANKU COPY.pdf | SLIDE 1","difficulty":"Hard","answer":"0.06","solution":"For independent events P(A and B) = P(A) times P(B) = 0.2 times 0.3 = 0.06."},{"id":"med-v2-030","module":"v2","type":"mcq","q":"Which of the following is a homopolysaccharide composed of glucose?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 4","difficulty":"Hard","options":["Heteroglycan","Mannan","Arabinan","Glucan"],"answer":"Glucan","solution":"A: A heteroglycan contains more than one kind of sugar unit.\nB: Mannan is composed of mannose units.\nC: Arabinan is composed of arabinose units.\nD: A glucan is a homopolysaccharide made of glucose units."},{"id":"med-v8-008","module":"v8","type":"mcq","q":"The complement of a set A consists of:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 1.pdf | SLIDE 18","difficulty":"Hard","options":["all elements of A plus U","all elements in the universal set U that are not in A","only the empty set","elements common to A and another set"],"answer":"all elements in the universal set U that are not in A","solution":"A: Adding A to U gives U, not a complement.\nB: The complement contains exactly those elements of U outside A.\nC: The empty set is only a complement in special cases.\nD: Common elements describe an intersection."},{"id":"med-v1-011","module":"v1","type":"mcq","q":"Why isnʹt the mitochondrion classified as part of the endomembrane system?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 9","difficulty":"Hard","options":["It is not involved in protein synthesis","It only has two membrane layers","Its structure is not derived from the ER","It has too many vesicles"],"answer":"Its structure is not derived from the ER","solution":"A: Mitochondria do synthesise some of their own proteins.\nB: Having two membranes is not the criterion for endomembrane membership.\nC: The endomembrane system derives from the ER, and mitochondrial membranes do not.\nD: Vesicle abundance is irrelevant to membership in the endomembrane system."},{"id":"med-v2-031","module":"v2","type":"mcq","q":"At physiological pH, nucleotide phosphate groups are:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 1","difficulty":"Devil Mode","options":["Single positively charged","Doubly ionized and negatively charged","Neutrally charged","Positively charged"],"answer":"Doubly ionized and negatively charged","solution":"A: They are not singly positive.\nB: Phosphate groups are doubly ionised and carry a negative charge at physiological pH.\nC: They are not neutral under physiological conditions.\nD: Phosphate groups are negatively charged at physiological pH, not positive."},{"id":"med-v4-018","module":"v4","type":"mcq","q":"Which text function is used to join several text items into a single text item?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 7","difficulty":"Devil Mode","options":["MERGE()","JOIN()","LEFT()","CONCATENATE()"],"answer":"CONCATENATE()","solution":"A: MERGE is not the text-joining function.\nB: JOIN is not the standard Excel function name.\nC: LEFT extracts characters from the start.\nD: CONCATENATE joins several text items into one."},{"id":"med-v4-019","module":"v4","type":"mcq","q":"To create a presentation based on a pre-designed layout and color scheme, you should choose:","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 2","difficulty":"Medium","options":["Normal View","A Template","The Outline Pane","Blank Presentation"],"answer":"A Template","solution":"A: Normal view is a viewing mode, not a design source.\nB: A template provides a pre-designed layout and colour scheme.\nC: The Outline pane is for text organisation.\nD: A blank presentation has no pre-designed theme."},{"id":"med-v2-032","module":"v2","type":"mcq","q":"D-amino acids occur naturally in small amounts in","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 3","difficulty":"Medium","options":["bacterial peptidoglycan cell wall","cellulosic plant cell wall","all of the above","fungal chitanous cell wall"],"answer":"bacterial peptidoglycan cell wall","solution":"A: D-amino acids occur in bacterial peptidoglycan cell walls.\nB: Plant cell walls are cellulose, which has no D-amino acids.\nC: Since only bacterial walls apply, all of the above is wrong.\nD: Fungal walls contain chitin with L-linked units, not D-amino acids."},{"id":"med-v5-005","module":"v5","type":"mcq","q":"The advertisement 'I like the sprite in you' is an example of:","source":"Medicine/HB1 First Semester/Communication skills/ambiguity ppt.pdf | SLIDE 3","difficulty":"Medium","options":["intentional ambiguity","a double-negative","structural ambiguity only","unintentional ambiguity"],"answer":"intentional ambiguity","solution":"A: The pun on sprite/spirit is created deliberately, so it is intentional ambiguity.\nB: There is no double negative in the phrase.\nC: The joke relies on lexical, not purely structural, ambiguity.\nD: Unintentional ambiguity is unconscious and accidental."},{"id":"med-v2-033","module":"v2","type":"mcq","q":"What is the simplest glycerophospholipid and the parent compound for more complex phospho- lipids?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 3","difficulty":"Medium","options":["Phosphatidylethanolamine","Phosphatidylcholine","Cardiolipin","Phosphatidic acid"],"answer":"Phosphatidic acid","solution":"A: Phosphatidylethanolamine is also more complex.\nB: Phosphatidylcholine is a more complex glycerophospholipid.\nC: Cardiolipin is a dimeric, more complex phospholipid.\nD: Phosphatidic acid is the simplest glycerophospholipid and the parent compound."},{"id":"med-v4-020","module":"v4","type":"mcq","q":"Which view displays slides in thumbnail form, allowing you to see many slides at once?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 3","difficulty":"Hard","options":["Normal","Notes Page","Slide Show","Slide Sorter"],"answer":"Slide Sorter","solution":"A: Normal view shows one editable slide.\nB: Notes Page shows speaker notes.\nC: Slide Show presents full-screen.\nD: Slide Sorter displays slides as thumbnails for overview."},{"id":"med-v6-004","module":"v6","type":"mcq","q":"A hearing threshold greater than 91 dB is classified as:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 11","difficulty":"Hard","options":["severe","mild","profound","moderate"],"answer":"profound","solution":"A: Severe covers 71-90 dB.\nB: Mild is 26-40 dB.\nC: Above 91 dB is profound
