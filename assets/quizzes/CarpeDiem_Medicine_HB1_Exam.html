s carry genetic information, not a nuclear cytoskeleton.\nD: The cell wall provides support and protection, a correct structure-function match."},{"id":"med-v3-063","module":"v3","type":"mcq","q":"Statements: (1) Glycerin, a three-carbon diol, has a great affinity for moisture (water vapor). (2) Oxidation of a thiol produces a disulfide. (3) MTBE is a water-soluble polymeric alcohol","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 8","difficulty":"Medium","options":["All three statements are true","Two of the three statements are true","Only one of the statements is true","None of the statements is true"],"answer":"Only one of the statements is true","solution":"A: Glycerin is a triol, and MTBE is not a polymeric alcohol.\nB: Only the thiol oxidation statement is true.\nC: Only one of the statements is true.\nD: None true is wrong because thiol oxidation is correct."},{"id":"med-v5-015","module":"v5","type":"mcq","q":"'Visiting friends can be boring' is ambiguous because:","source":"Medicine/HB1 First Semester/Communication skills/ambiguity ppt.pdf | SLIDE 9","difficulty":"Medium","options":["'friends' is misspelled","'boring' has two meanings","it contains a double negative","'visiting' can be a noun-like modifier or a participial verb"],"answer":"'visiting' can be a noun-like modifier or a participial verb","solution":"A: Boring has a single meaning here.\nB: There is no negative construction in the sentence.\nC: Visiting can describe friends who visit or the act of visiting them, creating unclear modification.\nD: The word friends is spelled correctly."},{"id":"med-v5-016","module":"v5","type":"mcq","q":"'Take the items from the boxes and wash them' is an example of:","source":"Medicine/HB1 First Semester/Communication skills/ambiguity ppt.pdf | SLIDE 10","difficulty":"Medium","options":["ambiguous reference","lexical ambiguity","phonological ambiguity","a filter question"],"answer":"ambiguous reference","solution":"A: The words themselves are not lexically ambiguous.\nB: No homophones are involved.\nC: It is not a questionnaire filter item.\nD: 'Them' could refer to the items or the boxes, so the pronoun reference is unclear."},{"id":"med-v4-063","module":"v4","type":"mcq","q":"Which option should you use to scale a document to fit a specific number of pages?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 2","difficulty":"Medium","options":["Custom Scaling","Print Quality","Fit To","Adjust To"],"answer":"Fit To","solution":"A: Custom Scaling is not the standard term.\nB: Print Quality relates to resolution.\nC: Fit To scales a document to a specified number of pages.\nD: Adjust To scales by percentage rather than page count."},{"id":"med-v2-113","module":"v2","type":"mcq","q":"Linoleic and y-linolenic acids are examples of............ fatty acids","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 2","difficulty":"Hard","options":["rare","essential","saturated","non-essential"],"answer":"essential","solution":"A: They are common dietary fatty acids, not rare.\nB: Linoleic and gamma-linolenic acids are essential fatty acids.\nC: Linoleic acid is polyunsaturated, not saturated.\nD: They are essential, so non-essential is wrong."},{"id":"med-v4-064","module":"v4","type":"mcq","q":"In sorting, what does ”Sort A to Z” signify?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 8","difficulty":"Hard","options":["Descending order","Random order","Ascending order","Chronological only"],"answer":"Ascending order","solution":"A: Descending order is Z to A.\nB: Sorting is not random.\nC: Sort A to Z arranges data in ascending order.\nD: It is not limited to chronological data."},{"id":"med-v1-039","module":"v1","type":"mcq","q":"The volume enclosed by the plasma membrane of plant cells is often much larger than the corresponding volume in animal cells. The most reasonable explanation for this observation is that","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 3","difficulty":"Hard","options":["animal cells are more spherical, while plant cells are elongated","plant cells have a much more highly convoluted (folded) plasma membrane than animal cells","plant cells contain a large vacuole that reduces the volume of the cytoplasm","plant cells are capable of having a much higher surface-to-volume ratio than animal cells"],"answer":"plant cells contain a large vacuole that reduces the volume of the cytoplasm","solution":"A: Shape differences alone do not explain the much larger internal volume.\nB: Plant plasma membranes are not notably more convoluted than those of animal cells.\nC: The large central vacuole occupies most of the volume, leaving a thin layer of cytoplasm.\nD: Plant cells actually have a lower cytoplasmic surface-to-volume ratio due to the vacuole."},{"id":"med-v3-064","module":"v3","type":"mcq","q":"Statements: (1) Alcohols have higher boiling points than alkanes of similar molecular mass because of hydrogen bonding. (2) Ethylene glycol contains two carbon atoms and two hydroxyl groups. (3) Primary and secondary alcohols give the same type of product when subjected to mild oxidizing agents","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 9","difficulty":"Hard","options":["Two of the three statements are true","None of the statements is true","Only one of the statements is true","All three statements are true"],"answer":"Two of the three statements are true","solution":"A: Two statements are true.\nB: All true is wrong.\nC: One true undercounts.\nD: Hydrogen bonding raises alcohol boiling points and ethylene glycol has two carbons and two OH groups, but primary and secondary alcohols give different products."},{"id":"med-v4-065","module":"v4","type":"mcq","q":"What character does Excel display in a cell if a column is not wide enough to show a number or date?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 9","difficulty":"Devil Mode","options":["@","#","!","?"],"answer":"#","solution":"A: The at sign is not the narrow-column indicator.\nB: Excel shows a row of hash marks when a column is too narrow for a number or date.\nC: An exclamation mark is not the overflow indicator.\nD: A question mark is not used for this purpose."},{"id":"med-v2-114","module":"v2","type":"mcq","q":"Glycine and proline are the most abundant mod- ifiable amino acids in the structure of","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 3","difficulty":"Devil Mode","options":["collagen","myoglobin","Insulin","haemoglobin"],"answer":"collagen","solution":"A: Collagen's triple helix is rich in glycine and modifiable proline residues.\nB: Myoglobin is a compact globular protein.\nC: Insulin is a small hormone with few such residues.\nD: Haemoglobin is globular and not rich in glycine and proline repeats."},{"id":"med-v2-115","module":"v2","type":"mcq","q":"What type of bond links two monosaccharides to form a disaccharide?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 3","difficulty":"Medium","options":["Peptide bond","Hydrogen bond","Phosphodiester bond","Glycosidic bond"],"answer":"Glycosidic bond","solution":"A: Peptide bonds link amino acids.\nB: Hydrogen bonds stabilise structure but do not form the disaccharide linkage.\nC: Phosphodiester bonds link nucleotides.\nD: A glycosidic bond joins two monosaccharides in a disaccharide."},{"id":"med-v4-066","module":"v4","type":"mcq","q":"Which argument in the PMT() function determines if payments are made at the beginning or the end of a period?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 8","difficulty":"Medium","options":["fv","rate","type","pv"],"answer":"type","solution":"A: FV is the future value argument.\nB: Rate is the interest rate per period.\nC: The type argument sets payments at the beginning or end of a period.\nD: PV is the present value argument."},{"id":"med-v1-040","module":"v1","type":"mcq","q":"The fact that the outer membrane of the nuclear envelope has bound ribosomes allows one to most reliably conclude that","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 5","difficulty":"Medium","options":["small vesicles from the Golgi fuse with the nuclear envelope","at least some of the proteins that function in the nuclear envelope are made by the ribosomes on the nuclear envelope","the nuclear envelope is not part of the endomembrane system","the nuclear envelope is physically continuous with the endoplasmic reticulum"],"answer":"at least some of the proteins that function in the nuclear envelope are made by the ribosomes on the nuclear envelope","solution":"A: Golgi vesicles fusing with the envelope is not implied by bound ribosomes.\nB: Bound ribosomes on the outer nuclear membrane make proteins that function in the nuclear envelope.\nC: The nuclear envelope is in fact part of the endomembrane system.\nD: Continuity with the ER is true but is not concluded from bound ribosomes alone."},{"id":"med-v2-116","module":"v2","type":"mcq","q":"Triacylglycerols are formed by the esterification of three fatty acids with which backbone?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["Cholesterol","Glycerol","Sphingosine","Isoprene"],"answer":"Glycerol","solution":"A: Cholesterol is a steroid, not a triglyceride backbone.\nB: Triacylglycerols are three fatty acids esterified to glycerol.\nC: Sphingosine is the backbone of sphingolipids.\nD: Isoprene units build terpenes and steroids."},{"id":"med-v2-117","module":"v2","type":"mcq","q":"Coenzymes which are tightly bound to their en- zymes are referred to as","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 3","difficulty":"Hard","options":["Prosthetic groups","Peripheral coenzymes","Fixative groups","Apoenzyme"],"answer":"Prosthetic groups","solution":"A: Tightly bound coenzymes are called prosthetic groups.\nB: Peripheral is not the standard term for tightly bound coenzymes.\nC: Fixative groups is not the accepted terminology.\nD: Apoenzyme is the protein lacking its cofactor."},{"id":"med-v4-067","module":"v4","type":"mcq","q":"When you insert a picture, where is it typically placed by default?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 7","difficulty":"Hard","options":["Centered in the middle of the slide or placeholder","Top left corner","On a new blank slide at the end","Bottom right corner"],"answer":"Centered in the middle of the slide or placeholder","solution":"A: An inserted picture is typically centred on the slide or placeholder.\nB: Pictures are not placed at the top left by default.\nC: It is not placed on a new final slide.\nD: They are not placed at the bottom right."},{"id":"med-v7-022","module":"v7","type":"mcq","q":"If a researcher wants to calculate a mean score of student satisfaction, which question format is most appropriate?","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 2","difficulty":"Hard","options":["Dichotomous","Likert-type scale","Open-ended","Multiple choice (Check all that apply)"],"answer":"Likert-type scale","solution":"A: A dichotomous item yields only two values.\nB: A Likert-type scale yields numeric ratings suitable for computing a mean.\nC: Open-ended text is hard to average numerically.\nD: Check-all-that-apply yields categorical counts."},{"id":"med-v1-041","module":"v1","type":"mcq","q":"Which structure is common to plant and animal cells?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 15","difficulty":"Hard","options":["mitochondrion","wall made of cellulose","central vacuole","chloroplast"],"answer":"mitochondrion","solution":"A: Mitochondria are present in both plant and animal cells.\nB: A cellulose wall is plant-specific.\nC: A large central vacuole is typical of plant cells.\nD: Chloroplasts occur only in plant cells."},{"id":"med-v5-017","module":"v5","type":"mcq","q":"In 'the minister decided to appoint a panel of doctors to examine his deputy on August 31', the ambiguity concerns:","source":"Medicine/HB1 First Semester/Communication skills/ambiguity ppt.pdf | SLIDE 8","difficulty":"Devil Mode","options":["what event 'on August 31' modifies","the spelling of 'deputy'","which doctor is meant","the meaning of 'panel'"],"answer":"what event 'on August 31' modifies","solution":"A: The date could modify deciding, appointing or examining, so modification is unclear.\nB: Spelling is not at issue.\nC: The doctors are not individually ambiguous.\nD: Panel has a single meaning in this context."},{"id":"med-v2-118","module":"v2","type":"mcq","q":"Vitamin B1 (thiamine) is a precursor for which essential coenzyme?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 2","difficulty":"Devil Mode","options":["Thiamine pyrophosphate (TPP)","NAD+","Biotin","FAD"],"answer":"Thiamine pyrophosphate (TPP)","solution":"A: Thiamine is the precursor of thiamine pyrophosphate.\nB: NAD+ derives from niacin, not thiamine.\nC: Biotin is a separate vitamin cofactor.\nD: FAD derives from riboflavin."},{"id":"med-v3-065","module":"v3","type":"mcq","q":"Which of the following statements concerning the properties of carboxylic acids is incorrect?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 2","difficulty":"Medium","options":["Carboxylic acids have higher boiling points than alcohols of similar molecular mass","Short-chain monocarboxylic acids are liquids at room temperature","Carboxylic acids cannot hydrogen bond to water","Carboxylic acids can hydrogen bond to each other"],"answer":"Carboxylic acids cannot hydrogen bond to water","solution":"A: Carboxylic acids do have higher boiling points than similar alcohols.\nB: Short-chain monocarboxylic acids are indeed liquids at room temperature.\nC: Carboxylic acids can hydrogen bond to water, so this statement is incorrect.\nD: They can hydrogen bond to each other, which is true."},{"id":"med-v4-068","module":"v4","type":"mcq","q":"”Bring to Front” is used to:","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 8","difficulty":"Medium","options":["Move an object to the very top layer of a stack","Open the ”File” menu","Advance to the next slide in a show","Increase the brightness of a picture"],"answer":"Move an object to the very top layer of a stack","solution":"A: Bring to Front moves an object to the top layer of a stack.\nB: It does not open the File menu.\nC: It does not advance slides.\nD: It does not change picture brightness."},{"id":"med-v3-066","module":"v3","type":"mcq","q":"Statements: (1) Common names for alcohols have two words and IUPAC names for alcohols are only one word. (2) Mild oxidizing agents readily oxidize tertiary alcohols. (3) Cyclic ethers are examples of heterocyclic organic compounds","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 8","difficulty":"Medium","options":["None of the statements is true","Two of the three statements are true","Only one of the statements is true","All three statements are true"],"answer":"Two of the three statements are true","solution":"A: All true is wrong.\nB: Two statements are true.\nC: One true undercounts.\nD: Common alcohol names can be two words, and tertiary alcohols resist mild oxidation, while cyclic ethers are heterocyclic."},{"id":"med-v4-069","module":"v4","type":"mcq","q":"Which tab in Page Setup is used to create custom headers?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 9","difficulty":"Medium","options":["Header/Footer","Sheet","Margins","Page"],"answer":"Header/Footer","solution":"A: Custom headers are created on the Header/Footer tab.\nB: The Sheet tab handles print area and gridlines.\nC: The Margins tab handles margins and centring.\nD: The Page tab handles size and orientation."},{"id":"med-v7-023","module":"v7","type":"fill","q":"Find the range of 5, 12 and 18. (Answer as a number.)","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/ZANIPOLO stas pasco.PDF | SLIDE 1","difficulty":"Hard","answer":"13","solution":"The range is the maximum minus the minimum, 18 - 5 = 13."},{"id":"med-v2-119","module":"v2","type":"mcq","q":"Which of the following is considered the most crucial function of lipids in an organism?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 1","difficulty":"Hard","options":["Building cellular membranes","Energy storage","Thermal insulation","Chemical communication"],"answer":"Building cellular membranes","solution":"A: Forming cellular membranes is the most crucial lipid function according to the source.\nB: Energy storage is important but not the most crucial role given.\nC: Thermal insulation is a secondary role.\nD: Chemical communication is a specialised lipid role."},{"id":"med-v3-067","module":"v3","type":"mcq","q":"Hydrogenation, with a catalyst, of which of the following compounds would produce a four-carbon alcohol?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 7","difficulty":"Hard","options":["diethylketone","butanal","2-butanone","more than one correct response E) no correct response"],"answer":"more than one correct response E) no correct response","solution":"A: Diethyl ketone, or 3-pentanone, gives a five-carbon alcohol.\nB: Butanal hydrogenates to butanol, a four-carbon alcohol.\nC: 2-butanone hydrogenates to 2-butanol.\nD: Butanal and 2-butanone both yield four-carbon alcohols, so more than one is correct."},{"id":"med-v2-120","module":"v2","type":"mcq","q":"Cellulose is effective as a structural polysaccha- ride because it","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 2","difficulty":"Hard","options":["has extensive hydrogen bonding","is only found in plants","is resistant to digestion","can absorb a lot of water"],"answer":"has extensive hydrogen bonding","solution":"A: Extensive hydrogen bonding between cellulose chains gives it structural strength.\nB: Being plant-specific is a location fact, not a structural reason.\nC: Resistance to digestion alone does not explain cellulose's structural role.\nD: Water absorption is not the basis of its structural function."},{"id":"med-v2-121","module":"v2","type":"mcq","q":"Which group of amino acids is responsible for the significant ultraviolet light absorption of proteins above 250 nm?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 3","difficulty":"Devil Mode","options":["Basic amino acids","Aromatic amino acids","Acidic amino acids","Nonpolar aliphatic amino acids"],"answer":"Aromatic amino acids","solution":"A: Basic amino acids also lack strong UV absorption there.\nB: Aromatic amino acids absorb UV above 250 nm.\nC: Acidic amino acids do not absorb strongly above 250 nm.\nD: Nonpolar aliphatic amino acids lack chromophores."},{"id":"med-v5-018","module":"v5","type":"mcq","q":"Choose the correct usage: 'The principals ... the procedures for analysis.'","source":"Medicine/HB1 First Semester/Communication skills/communication_skills_answered by Abanga.pdf | SLIDE 2","difficulty":"Devil Mode","options":["discuss with the procedures","discuss in the procedures","discuss the procedures","discuss about the procedures"],"answer":"discuss the procedures","solution":"A: 'With' would require a person, not the procedures.\nB: 'In' is incorrect here.\nC: Discuss is transitive and takes a direct object without a preposition.\nD: Discuss does not take 'about' before its object."},{"id":"med-v3-068","module":"v3","type":"mcq","q":"In which of the following pairs of names do both names represent the same alcohol?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 4","difficulty":"Medium","options":["2-methyl-2-propanol and isobutyl alcohol","2-propanol and propyl alcohol","1-propanol and isopropyl alcohol","more than one correct response E) no correct response"],"answer":"more than one correct response E) no correct response","solution":"A: 2-methyl-2-propanol is tert-butanol and isobutyl alcohol is 2-methyl-1-propanol.\nB: 2-propanol is isopropanol while propyl alcohol is the normal isomer.\nC: 1-propanol and isopropyl alcohol are different compounds.\nD: No listed pair names the same alcohol, so the no-correct-response option is right."},{"id":"med-v2-122","module":"v2","type":"mcq","q":"Which of the following is not a proenzyme?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 2","difficulty":"Medium","options":["Proelastase","Trypsinogen","Pepsinogen","Fibrinogen"],"answer":"Fibrinogen","solution":"A: Proelastase is the precursor of elastase.\nB: Trypsinogen is the inactive precursor of trypsin.\nC: Pepsinogen is the inactive precursor of pepsin.\nD: Fibrinogen is a plasma clotting protein, not a proenzyme."},{"id":"med-v2-123","module":"v2","type":"mcq","q":"What is the general molecular formula for most carbohydrates?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 1","difficulty":"Medium","options":["(CH2)n","CxHyOz","CnH2nO","Cx(H2O)y"],"answer":"Cx(H2O)y","solution":"A: (CH2)n is the formula for hydrocarbon chains.\nB: CxHyOz is too generic to be the carbohydrate formula.\nC: CnH2nO corresponds to simple alcohols or aldehydes, not carbohydrates generally.\nD: Carbohydrates generally have the formula Cx(H2O)y, reflecting hydrated carbon."},{"id":"med-v2-124","module":"v2","type":"mcq","q":"The analogy that an enzyme is specific for only one substrate is best explained by the hypothesis","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 2","difficulty":"Medium","options":["Induced fit","Lock and key","Single reaction","Specificity"],"answer":"Lock and key","solution":"A: Induced fit involves substrate-shaped active site adjustment.\nB: The lock-and-key hypothesis best explains one-substrate enzyme specificity.\nC: Single reaction is not a description of enzyme specificity hypothesis.\nD: Specificity names the property but not the explanatory hypothesis."},{"id":"med-v3-069","module":"v3","type":"mcq","q":"Which of the following conditions for an alcohol dehydration reaction with H2SO4 as the catalyst will produce an ether?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 5","difficulty":"Hard","options":["2º alcohol, 140ºC","1º alcohol, 180ºC","more than one correct response E) no correct response","1º alcohol, 140ºC"],"answer":"1º alcohol, 140ºC","solution":"A: A secondary alcohol at 140 degrees is not the stated condition.\nB: At 180 degrees a primary alcohol gives an alkene by dehydration.\nC: Only one condition set produces an ether.\nD: A primary alcohol at about 140 degrees with sulfuric acid gives an ether."},{"id":"med-v2-125","module":"v2","type":"mcq","q":"Why can’t lactose be absorbed directly into the human bloodstream?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["It is toxic to cells","It is insoluble in water","It is too large and must be hydrolyzed by lactase","It lacks a reducing end"],"answer":"It is too large and must be hydrolyzed by lactase","solution":"A: Lactose is not toxic to cells.\nB: Lactose is water soluble.\nC: Lactose is too large to absorb and must be hydrolysed by lactase first.\nD: It has a reducing end, so that is not the reason."},{"id":"med-v4-070","module":"v4","type":"mcq","q":"What happens when you select ”Always Open Read-Only”?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 4","difficulty":"Hard","options":["The file is hidden","Readers are asked to opt-in to editing to prevent accidental changes","The file cannot be edited by anyone","The file is encrypted"],"answer":"Readers are asked to opt-in to editing to prevent accidental changes","solution":"A: The file is not hidden.\nB: Read-Only Recommended prompts readers to opt into editing, preventing accidental changes.\nC: Read-only recommendation does not make editing impossible.\nD: The file is not encrypted by this setting."},{"id":"med-v4-071","module":"v4","type":"mcq","q":"The ”Picture Tools Format” tab appears when:","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 8","difficulty":"Hard","options":["You change the view to Slide Sorter","You open the program","You save a file","A picture is selected"],"answer":"A picture is selected","solution":"A: Changing to Slide Sorter view does not activate it.\nB: The tab does not appear merely on opening the program.\nC: It does not appear on saving a file.\nD: Picture Tools Format appears when a picture is selected."},{"id":"med-v2-126","module":"v2","type":"mcq","q":"Squalene and lanosterol are triterpenes that serve as precursors for:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 4","difficulty":"Devil Mode","options":["Proteins","Cholesterol and other steroids","Vitamin C","Glucose"],"answer":"Cholesterol and other steroids","solution":"A: Proteins are not derived from triterpenes.\nB: Squalene and lanosterol are precursors of cholesterol and other steroids.\nC: Vitamin C is not made from squalene.\nD: Glucose is not a terpene precursor product."},{"id":"med-v2-127","module":"v2","type":"mcq","q":"The stability of nucleic acids is attributable to","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 1","difficulty":"Devil Mode","options":["Base stacking","Extensive hydrogen bonding and base stacking","The strong phosphodiester linkages","Numerous hydrogen bonding"],"answer":"Extensive hydrogen bonding and base stacking","solution":"A: Base stacking alone is incomplete.\nB: Base stacking together with extensive hydrogen bonding stabilises nucleic acid structure.\nC: Phosphodiester bonds provide covalent backbone strength but not the main stability described.\nD: Hydrogen bonding alone is an incomplete explanation."},{"id":"med-v2-128","module":"v2","type":"mcq","q":"What is the structural difference between the sugar in RNA and the sugar in DNA?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 1","difficulty":"Medium","options":["RNA has a hydroxyl group at C2’, while DNA has a hydrogen atom","DNA has a hydroxyl group at C2’, while RNA does not","DNA contains ribose, while RNA contains deoxyribose","RNA has a hexose sugar, DNA has a pentose sugar"],"answer":"RNA has a hydroxyl group at C2’, while DNA has a hydrogen atom","solution":"A: RNA has a hydroxyl at C2' while DNA has a hydrogen there.\nB: DNA lacks a hydroxyl at C2'; RNA is the one that has it.\nC: DNA contains deoxyribose and RNA contains ribose, not the reverse.\nD: Both RNA and DNA contain pentose, not hexose, sugars."},{"id":"med-v2-129","module":"v2","type":"mcq","q":"Concatenation of text can be done using","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 31","difficulty":"Medium","options":["Hash (#)","Apostrophe ('","Exclamation (!)","Ampersand (&"],"answer":"Ampersand (&","solution":"A: Hash is not used for concatenation.\nB: Apostrophe is used for text prefixes, not joining text.\nC: Exclamation is not a text-joining operator.\nD: The ampersand joins text strings in Excel."},{"id":"med-v8-018","module":"v8","type":"mcq","q":"The imaginary unit i is defined as:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 1.pdf | SLIDE 14","difficulty":"Medium","options":["the square root of -1","the reciprocal of 1","the square root of 1","the cube root of -1"],"answer":"the square root of -1","solution":"A: By definition i equals the square root of minus one.\nB: The reciprocal of 1 is 1.\nC: The square root of 1 is 1 or -1, not imaginary.\nD: The cube root of minus one is minus one."},{"id":"med-v2-130","module":"v2","type":"mcq","q":"The 3D structure of a protein can be determined by","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 3","difficulty":"Medium","options":["X-ray crystallography","Spectroscopy","Both A and B","Nuclear Magnetic Resonance"],"answer":"Both A and B","solution":"A: X-ray crystallography also determines structure but is not alone the answer.\nB: Spectroscopy is too general a term.\nC: Both NMR and X-ray crystallography are used, so A and B is correct.\nD: NMR can determine protein structure but is not the only method here."},{"id":"med-v2-131","module":"v2","type":"mcq","q":"What is the defining functional group of an aldose sugar?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 1","difficulty":"Hard","options":["Hydroxyl group","Aldehyde group","Ketone group","Phosphate group"],"answer":"Aldehyde group","solution":"A: Hydroxyl groups occur in all sugars but do not define an aldose.\nB: An aldehyde group is the defining functional group of an aldose sugar.\nC: A ketone group defines a ketose, not an aldose.\nD: Phosphate groups occur in phosphorylated sugars, not aldoses by definition."},{"id":"med-v2-132","module":"v2","type":"mcq","q":"Competitive inhibition can be overcome by:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["Adding a noncompetitive inhibitor","Decreasing the temperature","Increasing the substrate concentration","Increasing the enzyme concentration"],"answer":"Increasing the substrate concentration","solution":"A: Adding a noncompetitive inhibitor would reduce activity further.\nB: Lowering temperature is not the standard way to overcome inhibition.\nC: Increasing substrate concentration outcompetes a competitive inhibitor.\nD: Adding more enzyme does not relieve competition at the active site."},{"id":"med-v4-072","module":"v4","type":"mcq","q":"Which tab appears on the Ribbon specifically when a table is selected?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES POWERPOINT.pdf | SLIDE 7","difficulty":"Hard","options":["Animations","Transitions","Table Tools Layout","View"],"answer":"Table Tools Layout","solution":"A: Animations tab is not table-specific.\nB: Transitions tab controls slide transitions.\nC: Selecting a table brings up Table Tools Layout on the Ribbon.\nD: View tab changes the workspace view."},{"id":"med-v2-133","module":"v2","type":"mcq","q":"A noncompetitive inhibitor binds to:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["Only the enzyme-substrate (ES) complex","The active site only","An allosteric site, regardless of whether substrate is bound","The product of the reaction"],"answer":"An allosteric site, regardless of whether substrate is bound","solution":"A: Binding only the ES complex describes uncompetitive inhibition.\nB: Active-site binding describes competitive, not noncompetitive, inhibition.\nC: A noncompetitive inhibitor binds an allosteric site whether or not substrate is bound.\nD: Inhibitors do not bind the product in this classification."},{"id":"med-v2-134","module":"v2","type":"mcq","q":"Which enzyme classification is responsible for catalyzing oxidation-reduction reactions involving electron transfer?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 1","difficulty":"Devil Mode","options":["Hydrolases","Isomerases","Oxidoreductases","Transferases"],"answer":"Oxidoreductases","solution":"A: Hydrolases cleave bonds by adding water.\nB: Isomerases catalyse intramolecular rearrangements.\nC: Oxidoreductases catalyse oxidation-reduction reactions involving electron transfer.\nD: Transferases move functional groups between molecules."},{"id":"med-v3-070","module":"v3","type":"mcq","q":"Statements: (1) Butanal and 2-butanone are constitutional isomers. (2) The linear notation for an aldehyde is RCOH and that for a ketone is RCOR. (3) Water molecules can hydrogen bond with aldehyde and ketone molecules","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 10","difficulty":"Devil Mode","options":["None of the statements is true","Only one of the statements is true","All three statements are true","Two of the three statements are true"],"answer":"Two of the three statements are true","solution":"A: All true is wrong because the notation statement fails.\nB: One true undercounts.\nC: Butanal and 2-butanone are isomers, the RCOH notation is imprecise, and water can hydrogen bond to carbonyls.\nD: Two statements are true."},{"id":"med-v2-135","module":"v2","type":"mcq","q":"Sequence specific proteins usually interact with DNA at the","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 1","difficulty":"Medium","options":["Major groove","Sugar-phosphate bond","Minor groove","Nucleotide"],"answer":"Major groove","solution":"A: Sequence-specific proteins usually read the major groove of DNA.\nB: The sugar-phosphate backbone is largely uniform and not sequence-specific.\nC: The minor groove offers less distinctive chemical information.\nD: Individual nucleotides are not the main recognition feature."},{"id":"med-v2-136","module":"v2","type":"mcq","q":"The various blood groups in the ABO system differ from each other by virtue of the membrane carbohydrates they possess","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 1","difficulty":"Medium","options":["Proteins","DNA","Carbohydrates","Lipids"],"answer":"Carbohydrates","solution":"A: Membrane proteins are not the determinants of ABO antigen specificity.\nB: DNA is not a component of the membrane antigens.\nC: ABO groups differ by the terminal membrane carbohydrates on glycoproteins and glycolipids.\nD: Membrane lipids do not define the ABO blood group differences."},{"id":"med-v3-071","module":"v3","type":"mcq","q":"In which of the following pairs of compounds does the first listed compound have a greater water solubility than the second listed compound?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 6","difficulty":"Medium","options":["more than one correct response E) no correct response","butanal, methanal","propanone, 2-pentanone","hexanal, 2-butanone"],"answer":"propanone, 2-pentanone","solution":"A: Only one pair has the first more soluble.\nB: Butanal is less soluble than methanal, so the order is wrong.\nC: Propanone is more water soluble than 2-pentanone.\nD: Hexanal is less soluble than 2-butanone."},{"id":"med-v7-024","module":"v7","type":"mcq","q":"”How often do you usually utilize the campus facilities?” What is the primary methodological weakness of this item?","source":"Medicine/HB1 First Semester/Statistical Methods/Past Questions/SAMPLE QUESTIONS ON QUESTIONNAIRE.pdf | SLIDE 1","difficulty":"Medium","options":["it is a dichotomous item","It is a double-negative question","It uses an exhaustive scale","It contains an ambiguous qualifier"],"answer":"It contains an ambiguous qualifier","solution":"A: It is not a dichotomous yes-no item.\nB: The item contains no double negative.\nC: It does not use an exhaustive scale.\nD: 'Usually' is an ambiguous qualifier open to different interpretations."},{"id":"med-v2-137","module":"v2","type":"mcq","q":"Approximately how much energy is released from burning one gram of carbohydrate?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 1","difficulty":"Hard","options":["7 kilocalories","9 kilocalories","2 kilocalories","4 kilocalories"],"answer":"4 kilocalories","solution":"A: Seven kilocalories is closer to alcohol, not carbohydrate.\nB: Nine kilocalories is the value for fat.\nC: Two kilocalories per gram underestimates carbohydrate energy.\nD: Carbohydrate oxidation releases about four kilocalories per gram."},{"id":"med-v2-138","module":"v2","type":"mcq","q":"The cyclization of a monosaccharide like glucose involves a reaction between an alcohol and an aldehyde to form a:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 2","difficulty":"Hard","options":["Hemiketal","Hemiacetal","Glycoside","Acetal"],"answer":"Hemiacetal","solution":"A: A hemiketal forms from a ketone plus an alcohol, not an aldehyde.\nB: An aldehyde plus an intramolecular alcohol gives a hemiacetal on cyclisation.\nC: A glycoside is an acetal with an aglycone substituent.\nD: A full acetal requires further reaction with a second alcohol."},{"id":"med-v2-139","module":"v2","type":"mcq","q":"You can convert existing excel worksheet data an charts to an HTML document by using","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 11","difficulty":"Hard","options":["FTP wizard","Import wizard","Internet assistant wizard","Intranet wizard"],"answer":"Internet assistant wizard","solution":"A: The FTP wizard is for file transfer, not HTML conversion.\nB: The Import wizard brings data into Excel rather than exporting HTML.\nC: The Internet Assistant wizard converts worksheet data and charts into HTML documents.\nD: There is no standard Intranet wizard for this conversion."},{"id":"med-v3-072","module":"v3","type":"mcq","q":"Which of the following structural features is possessed by aldehydes but not ketones?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 1","difficulty":"Hard","options":["At least one hydrogen atom is bonded to the carbonyl carbon atom","The carbonyl carbon atom is bonded to two other carbon atoms","At least one hydroxyl group is bonded to the carbonyl carbon atom","The carbonyl carbon atom is part of a ring structure"],"answer":"At least one hydrogen atom is bonded to the carbonyl carbon atom","solution":"A: Aldehydes have at least one hydrogen bonded to the carbonyl carbon.\nB: Two carbon substituents on the carbonyl define a ketone.\nC: A hydroxyl on the carbonyl carbon describes a hydrate, not an aldehyde distinction.\nD: Ring membership does not distinguish aldehydes from ketones."},{"id":"med-v2-140","module":"v2","type":"mcq","q":"In which of the following separation methods are proteins separated on the basis of their net charge?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 3","difficulty":"Devil Mode","options":["Affinity chromatography","Gel filtration chromatography","Dialysis","Ion exchange chromatography"],"answer":"Ion exchange chromatography","solution":"A: Affinity chromatography separates by specific binding affinity.\nB: Gel filtration separates by size.\nC: Dialysis removes small molecules by diffusion.\nD: Ion exchange chromatography separates proteins by net charge."},{"id":"med-v3-073","module":"v3","type":"mcq","q":"Which of the following statements concerning acid anhydrides is incorrect?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 4","difficulty":"Devil Mode","options":["They are generally less reactive than the corresponding acid chloride","They undergo hydrolysis to produce the parent carboxylic acid","They have structures in which three oxygen atoms are present","They are produced by reacting two carboxylic acids with each other. CH2 CH2 C CH3 O O CH3"],"answer":"They are produced by reacting two carboxylic acids with each other. CH2 CH2 C CH3 O O CH3","solution":"A: They are less reactive than acid chlorides.\nB: Acid anhydrides do hydrolyse to the parent acid.\nC: They contain three oxygen atoms in the anhydride linkage.\nD: They are not produced by simply reacting two carboxylic acids with each other."},{"id":"med-v2-141","module":"v2","type":"mcq","q":"What happens to the viscosity of a DNA solution when it denatures?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 3","difficulty":"Medium","options":["It remains constant","It decreases significantly","It increases significantly","It fluctuates rapidly"],"answer":"It decreases significantly","solution":"A: Viscosity does not remain constant on denaturation.\nB: Denatured single strands collapse and solution viscosity decreases.\nC: Denatured DNA does not become more viscous.\nD: Viscosity does not fluctuate rapidly."},{"id":"med-v2-142","module":"v2","type":"mcq","q":"Which rare amino acids are found primarily in collagen and gelatin?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["Aminoadipic acid and pyroglutamic acid","Methylhistidine and trimethyllysine","Thyroxine and triiodothyronine","Hydroxylysine and hydroxyproline"],"answer":"Hydroxylysine and hydroxyproline","solution":"A: Aminoadipic and pyroglutamic acids are not collagen-specific.\nB: Methylhistidine and trimethyllysine are modified residues elsewhere.\nC: Thyroxine and triiodothyronine are thyroid hormones, not collagen residues.\nD: Hydroxylysine and hydroxyproline are characteristic of collagen and gelatin."},{"id":"med-v2-143","module":"v2","type":"mcq","q":"The temperature at which half of the DNA helical structure is lost is called the:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 4","difficulty":"Medium","options":["Annealing temperature","Boiling point","Midpoint temperature","Melting temperature (Tm)"],"answer":"Melting temperature (Tm)","solution":"A: Annealing temperature relates to hybrid formation.\nB: Boiling point is not the DNA melting term.\nC: Midpoint temperature is not the standard name.\nD: Tm is the temperature at which half the DNA helix is lost."},{"id":"med-v4-073","module":"v4","type":"mcq","q":"In Excel’s date system, what date is represented by the serial number 1?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 5","difficulty":"Medium","options":["January 1, 1990","December 31, 1899","January 1, 1900","January 1, 2000"],"answer":"January 1, 1900","solution":"A: Excel's serial number 1 is not 1990.\nB: December 31, 1899 is the day before serial one in some systems, not Excel's value.\nC: Serial number 1 represents January 1, 1900 in Excel's date system.\nD: January 1, 2000 is a much later serial number."},{"id":"med-v4-074","module":"v4","type":"mcq","q":"Which function would you use to find the remainder after a division?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 7","difficulty":"Hard","options":["MOD()","REM()","DIV()","QUOTIENT()"],"answer":"MOD()","solution":"A: MOD returns the remainder after division.\nB: REM is not the Excel remainder function.\nC: DIV is not an Excel function name.\nD: QUOTIENT returns the integer part of a division."},{"id":"med-v1-042","module":"v1","type":"mcq","q":"If an individual has abnormal microtubules, due to a hereditary condition, in which organs or tissues would you expect dysfunction?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 11","difficulty":"Hard","options":["all ducts, such as those from salivary or sebaceous glands","microvilli, alveoli, and glomeruli","sperm, larynx, and trachea","limbs, hearts, areas with a good deal of contraction"],"answer":"sperm, larynx, and trachea","solution":"A: Gland ducts are not the main structures affected by microtubule dysfunction.\nB: Microvilli use actin cores, and alveoli and glomeruli are not microtubule-driven.\nC: Sperm flagella, and ciliated larynx and trachea, depend on microtubules.\nD: Limbs and heart rely mainly on actin microfilaments, not microtubules."},{"id":"med-v2-144","module":"v2","type":"mcq","q":"What is the term for a multi-enzyme complex where intermediate metabolites are passed directly from one active site to the next?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 1","difficulty":"Hard","options":["Lysosome","Ribosome","Metabolon","Organelle"],"answer":"Metabolon","solution":"A: A lysosome is a digestive organelle.\nB: A ribosome synthesises proteins, not metabolite channel complexes.\nC: A metabolon is a multi-enzyme complex that channels intermediates between active sites.\nD: An organelle is a broad term, not this specific multi-enzyme complex."},{"id":"med-v2-145","module":"v2","type":"mcq","q":"Allosteric modifiers control enzyme activity by binding to:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 3","difficulty":"Hard","options":["The active site","Specific regulatory sites (allosteric sites)","The product","The substrate"],"answer":"Specific regulatory sites (allosteric sites)","solution":"A: Allosteric modifiers do not bind the active site.\nB: They bind specific regulatory allosteric sites on the enzyme.\nC: They do not act by binding the product.\nD: They do not bind the substrate itself."},{"id":"med-v5-019","module":"v5","type":"mcq","q":"Structural ambiguity is best described as ambiguity in:","source":"Medicine/HB1 First Semester/Communication skills/ambiguity ppt.pdf | SLIDE 7","difficulty":"Devil Mode","options":["single word meanings","syntax","pronunciation","spelling"],"answer":"syntax","solution":"A: Word meanings are lexical ambiguity, not structural.\nB: Structural ambiguity arises from how words are combined, that is syntax.\nC: Pronunciation relates to phonological ambiguity.\nD: Spelling is not the source of structural ambiguity."},{"id":"med-v2-146","module":"v2","type":"mcq","q":"What is the most common method of covalent modification used to control enzyme activity?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 3","difficulty":"Devil Mode","options":["Hydrolysis","Phosphorylation","ADP-ribosylation","Adenylation"],"answer":"Phosphorylation","solution":"A: Hydrolysis is not a covalent modification activating enzymes here.\nB: Phosphorylation is the most common covalent modification controlling enzyme activity.\nC: ADP-ribosylation is also less common.\nD: Adenylation is a rarer modification."},{"id":"med-v3-074","module":"v3","type":"mcq","q":"Hydrolysis of an acetal in an acid solution would yield","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 4","difficulty":"Medium","options":["an aldehyde, a ketone, and two alcohols","an aldehyde or a ketone and one alcohol","an aldehyde, a ketone, and one alcohol","an aldehyde or a ketone and two alcohols"],"answer":"an aldehyde or a ketone and two alcohols","solution":"A: It does not give both an aldehyde and a ketone together.\nB: It does not give both together either.\nC: An acetal hydrolyses to a carbonyl compound and two alcohol molecules.\nD: Acidic hydrolysis of an acetal gives an aldehyde or a ketone plus two alcohols."},{"id":"med-v3-075","module":"v3","type":"mcq","q":"Which of the following carboxylic acids possesses two acidic hydrogen atoms?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 7","difficulty":"Medium","options":["succinic acid","2-methylbutanoic acid","butanedioic acid","more than one correct response"],"answer":"more than one correct response","solution":"A: Succinic acid has two acidic hydrogens.\nB: 2-methylbutanoic acid has only one acidic hydrogen.\nC: Butanedioic acid, that is succinic acid, has two acidic hydrogens.\nD: More than one listed acid has two acidic hydrogens, so this option applies."},{"id":"med-v6-015","module":"v6","type":"mcq","q":"Normally a human should hear sound intensity of about:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 8","difficulty":"Medium","options":["0-25 dB","26-40 dB","41-55 dB","71-90 dB"],"answer":"0-25 dB","solution":"A: 0-25 dB is the normal hearing range.\nB: 26-40 dB is classified as mild hearing loss.\nC: 41-55 dB is moderate loss.\nD: 71-90 dB is severe loss."},{"id":"med-v2-147","module":"v2","type":"mcq","q":"What level of protein structure refers specifically to the sequence of amino acids?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 4","difficulty":"Medium","options":["Quaternary","Secondary","Primary","Tertiary"],"answer":"Primary","solution":"A: Quaternary structure is the arrangement of subunits.\nB: Secondary structure refers to local folding patterns.\nC: Primary structure is the amino acid sequence of a polypeptide.\nD: Tertiary structure is the overall three-dimensional fold."},{"id":"med-v3-076","module":"v3","type":"mcq","q":"Carboxylic acid salts may be converted to their \"parent\" carboxylic acids by reacting them with","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alex (2).pdf | SLIDE 2","difficulty":"Hard","options":["a strong acid such as HI","a ketone such as acetone","a strong base such as NaOH","an alcohol such as methanol"],"answer":"a strong acid such as HI","solution":"A: A strong acid such as HI protonates the carboxylate to give the parent carboxylic acid.\nB: Acetone does not convert carboxylate salts to acids.\nC: Strong base would form the salt, not regenerate the acid.\nD: Methanol would esterify rather than acidify the salt."},{"id":"med-v4-075","module":"v4","type":"mcq","q":"Which of the following functions requires exactly one argument?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 3","difficulty":"Hard","options":["ROUNDDOWN()","SUM()","INT()","PMT()"],"answer":"INT()","solution":"A: ROUNDDOWN takes two arguments.\nB: SUM accepts a variable number of arguments.\nC: INT requires exactly one argument.\nD: PMT takes several arguments."},{"id":"med-v8-019","module":"v8","type":"mcq","q":"The value of 5! (5 factorial) is:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 7.pdf | SLIDE 1","difficulty":"Hard","options":["25","625","5","120"],"answer":"120","solution":"A: Twenty-five is five squared, not factorial.\nB: Six hundred twenty-five is five to the fourth power.\nC: Five is just the number itself.\nD: Five factorial is 5 times 4 times 3 times 2 times 1, giving 120."},{"id":"med-v6-016","module":"v6","type":"mcq","q":"Humans can hear sounds at frequencies approximately from:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 7","difficulty":"Hard","options":["2 Hz to 200 Hz","200 Hz to 2,000 Hz","20,000 Hz to 40,000 Hz","20 Hz to 20,000 Hz"],"answer":"20 Hz to 20,000 Hz","solution":"A: That range is far below human hearing.\nB: This is too narrow and shifted upward.\nC: This is in the ultrasonic range beyond human hearing.\nD: Human hearing spans about 20 Hz to 20,000 Hz."},{"id":"med-v2-148","module":"v2","type":"mcq","q":"Which RNA molecule acts as an adapter, serving as a physical link between nucleotides and amino acids?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 4","difficulty":"Devil Mode","options":["mRNA","tRNA","rRNA","snRNA"],"answer":"tRNA","solution":"A: mRNA carries the coding template, not an adapter role.\nB: tRNA acts as the adapter linking codons to amino acids.\nC: rRNA is a structural and catalytic ribosome component.\nD: snRNA is involved in RNA splicing."},{"id":"med-v1-043","module":"v1","type":"mcq","q":"Of the following molecules of the ECM, which is capable of transmitting signals between the ECM and the cytoskeleton?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 14","difficulty":"Devil Mode","options":["fibronectin","integrins","proteoglycans","collagen"],"answer":"integrins","solution":"A: Fibronectin is an ECM ligand, not the transmembrane signal transducer itself.\nB: Integrins span the plasma membrane and link the ECM to the cytoskeleton.\nC: Proteoglycans are structural ECM molecules.\nD: Collagen provides structural support, not signal transfer."},{"id":"med-v2-149","module":"v2","type":"mcq","q":"Silicon is more abundant in the earth’s crust than it is in living cells because it is","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 1","difficulty":"Medium","options":["Inert","toxic","too big","radioactive"],"answer":"Inert","solution":"A: Silicon's inertness explains why it is scarce in living cells despite crustal abundance.\nB: Silicon is not toxic in the sense implied here.\nC: Silicon's crustal abundance is not due to atomic size.\nD: Silicon is not radioactive."},{"id":"med-v2-150","module":"v2","type":"mcq","q":"Why are histidine and arginine referred to as ”semi-essential”?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["They can only be synthesized by infants","They are only required during illness","They are only found in certain proteins","They are synthesized by the body, but not in adequate amounts"],"answer":"They are synthesized by the body, but not in adequate amounts","solution":"A: They are not synthesised only by infants.\nB: They are required beyond illness periods.\nC: Histidine and arginine occur in many proteins, not just certain ones.\nD: They are synthesised but in amounts inadequate for adult needs, hence semi-essential."},{"id":"med-v4-076","module":"v4","type":"mcq","q":"What is the keyboard shortcut to create a chart automatically on a new sheet?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 6","difficulty":"Medium","options":["F2","F5","F12","F11"],"answer":"F11","solution":"A: F2 edits the active cell.\nB: F5 opens the Go To dialog or starts a slide show.\nC: F12 opens Save As.\nD: F11 creates a chart automatically on a new sheet."},{"id":"med-v2-151","module":"v2","type":"mcq","q":"How many characters can be typed in a single cell in Excel?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 28","difficulty":"Medium","options":["1024","256","65,535","32,000"],"answer":"65,535","solution":"A: 1024 is not the cell character limit given.\nB: 256 is the old column count, not cell characters.\nC: The source gives 65,535 as the cell character capacity.\nD: 32,000 is close but not the source's figure."},{"id":"med-v3-077","module":"v3","type":"mcq","q":"In which of the following pairs of names do both names represent the same ether?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 6","difficulty":"Hard","options":["ethyl isopropyl ether and 2-ethoxypropane","methyl isopropyl ether and 1-methoxypropane","diethyl ether and 1,2-diethoxyethane","more than one correct response E) no correct response"],"answer":"ethyl isopropyl ether and 2-ethoxypropane","solution":"A: Ethyl isopropyl ether and 2-ethoxypropane are the same compound.\nB: Methyl isopropyl ether is not 1-methoxypropane.\nC: Diethyl ether is not 1,2-diethoxyethane.\nD: Only one pair names the same ether."},{"id":"med-v2-152","module":"v2","type":"mcq","q":"Bacteriorhodopsin, a unique light driven proton- pumping protein, contains which of the following derived amino acids?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 1","difficulty":"Hard","options":["y-Carboxyglutamic acid","Pyroglutamic acid","5-Hydroxyserine","Y-Amino butyric acid"],"answer":"y-Carboxyglutamic acid","solution":"A: Gamma-carboxyglutamic acid is the derived amino acid given in the source key.\nB: Pyroglutamic acid is not the residue described.\nC: 5-Hydroxyserine is not the derived amino acid in bacteriorhodopsin.\nD: Gamma-aminobutyric acid is a neurotransmitter, not this protein's residue."},{"id":"med-v2-153","module":"v2","type":"mcq","q":"Which of the following is considered the ”monomeric unit” of nucleic acids?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 1","difficulty":"Hard","options":["Nucleotide","Nucleoside","Nitrogenous base","Ribose sugar"],"answer":"Nucleotide","solution":"A: The nucleotide is the monomeric unit of nucleic acids.\nB: A nucleoside is base plus sugar, lacking phosphate.\nC: A nitrogenous base is only one part of the monomer.\nD: Ribose sugar alone is not the monomer."},{"id":"med-v2-154","module":"v2","type":"mcq","q":"The glycosidic linkage(s) in amylopectin is/are","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM.pdf | SLIDE 3","difficulty":"Hard","options":["α(1 →4)","α(1 →4) and β(1 →4)","α(1 →4) and α(1 →6)","α(1 →6)"],"answer":"α(1 →4) and α(1 →6)","solution":"A: Alpha(1 to 4) alone describes amylose, not amylopectin.\nB: Beta(1 to 4) is cellulose, not amylopectin.\nC: Amylopectin has both alpha(1 to 4) chains and alpha(1 to 6) branches.\nD: Alpha(1 to 6) alone describes branch points only."},{"id":"med-v4-077","module":"v4","type":"mcq","q":"What is the main difference between cylinder, cone, and pyramid charts?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 7","difficulty":"Devil Mode","options":["They cannot be 3-D","The shape of the markers","The number of axes","The data they can represent"],"answer":"The shape of the markers","solution":"A: They can be rendered in 3-D.\nB: They differ mainly in the shape of the data markers.\nC: They all use similar axes.\nD: These chart types represent the same kind of data."},{"id":"med-v6-017","module":"v6","type":"mcq","q":"According to the medical definition, a deaf person is one who:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 9","difficulty":"Devil Mode","options":["has normal hearing but poor speech","has mild hearing loss only","cannot understand speech with sound alone","can always use a telephone"],"answer":"cannot understand speech with sound alone","solution":"A: Poor speech with normal hearing is not deafness.\nB: Mild loss describes hard of hearing, not deafness.\nC: Deafness means speech cannot be understood through sound alone, even with aids.\nD: Telephone use would not be typical for a deaf person."},{"id":"med-v4-078","module":"v4","type":"mcq","q":"Which chart type is best for showing trends over time at equal intervals?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 5","difficulty":"Medium","options":["Scatter Chart","Pie Chart","Column Chart","Line Chart"],"answer":"Line Chart","solution":"A: Scatter charts show relationships between two variables.\nB: Pie charts show proportions of a whole.\nC: Column charts compare values across categories.\nD: Line charts are best for trends over time at equal intervals."},{"id":"med-v2-155","module":"v2","type":"mcq","q":"Why are metabolic pathways considered irreversible?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 1","difficulty":"Medium","options":["They require water for every step","They are highly exergonic, giving the pathway direction","They always occur in the nucleus","Enzymes can only work in one direction"],"answer":"They are highly exergonic, giving the pathway direction","solution":"A: Water is not required in every step of a pathway.\nB: Highly exergonic steps make pathways effectively irreversible by giving them direction.\nC: Most metabolic pathways do not occur in the nucleus.\nD: Enzymes can catalyse reverse reactions under suitable conditions."},{"id":"med-v3-078","module":"v3","type":"mcq","q":"Which of the following pairings of ketone IUPAC and common names is correct?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 6","difficulty":"Medium","options":["propanone and dimethyl ketone","2-methyl-3-pentanone and methyl propyl ketone","more than one correct response E) no correct response","3-methyl-2-pentanone and isopropyl methyl ketone"],"answer":"propanone and dimethyl ketone","solution":"A: Propanone is commonly called dimethyl ketone.\nB: 2-methyl-3-pentanone is not methyl propyl ketone.\nC: Only one pairing is correct.\nD: 3-methyl-2-pentanone is not isopropyl methyl ketone."},{"id":"med-v2-156","module":"v2","type":"mcq","q":"Catalytic power is defined as","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 2","difficulty":"Medium","options":["The alternative reaction path provided by the catalyst","The amount of catalyst present in a catal- ysed reaction","The ratio of the catalysed to the uncatal- ysed rate of reaction","The tendency for a catalysed reaction to proceed"],"answer":"The ratio of the catalysed to the uncatal- ysed rate of reaction","solution":"A: The alternative pathway describes mechanism, not the ratio.\nB: Amount of catalyst is unrelated to catalytic power.\nC: Catalytic power is the ratio of catalysed to uncatalysed reaction rates.\nD: The tendency to proceed relates to thermodynamics, not catalytic power."},{"id":"med-v4-079","module":"v4","type":"mcq","q":"What must you do before printing a worksheet for a quick visual check?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 1","difficulty":"Hard","options":["Select the print area","Set manual page breaks","Preview the document","Change the paper orientation"],"answer":"Preview the document","solution":"A: Selecting a print area is optional for a quick check.\nB: Manual page breaks are optional, not a prerequisite for printing.\nC: Previewing the document gives the quick visual check before printing.\nD: Orientation changes are not required."},{"id":"med-v2-157","module":"v2","type":"mcq","q":"A worksheet range is a","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 24","difficulty":"Hard","options":["A group of worksheets","A group of cells","A range of values such as from 23 to 234","A command used for data modeling"],"answer":"A group of cells","solution":"A: It is not a group of worksheets.\nB: A worksheet range is a group of cells.\nC: A range of numeric values is not the Excel meaning of the term.\nD: A worksheet range is not a data modelling command."},{"id":"med-v2-158","module":"v2","type":"mcq","q":"A complete, catalytically active enzyme system consisting of a protein component and its required cofactor is called a:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 2","difficulty":"Hard","options":["Apoenzyme","Holoenzyme","Isoenzyme","Zymogen"],"answer":"Holoenzyme","solution":"A: Apoenzyme is the inactive protein without its cofactor.\nB: Holoenzyme is the complete active enzyme with protein and cofactor.\nC: Isoenzyme is a molecular variant of an enzyme.\nD: Zymogen is an inactive precursor activated by cleavage."},{"id":"med-v2-159","module":"v2","type":"mcq","q":"Which of the following is a correct order of precedence in formula calculation?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/Gyasi’s MCQs on excel-1.pdf | SLIDE 13","difficulty":"Hard","options":["Multiplication and division, positive and negative values, addition and subtraction","Addition and subtraction, positive and negative values, exponentiation","All of above","Exponentiation, Multiplication and division, positive and negative values"],"answer":"All of above","solution":"A: Multiplication/division before signs and addition/subtraction is also cited as correct.\nB: Addition and subtraction first is not a valid Excel precedence order.\nC: The source key marks all of the listed statements as correct orders of precedence.\nD: Exponentiation before multiplication/division and then signs is a valid precedence rule."},{"id":"med-v4-080","module":"v4","type":"mcq","q":"Why do trigonometric functions in Excel sometimes require conversion formulas?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 1.pdf | SLIDE 6","difficulty":"Devil Mode","options":["Excel uses radians for trigonometric measurements","Excel requires angles to be entered as text","Excel cannot calculate sine or cosine directly","Excel only calculates in degrees"],"answer":"Excel uses radians for trigonometric measurements","solution":"A: Excel's trigonometric functions use radians, so degree inputs need conversion.\nB: Angles are not entered as text.\nC: Excel can compute sine and cosine directly.\nD: Excel does not calculate only in degrees."},{"id":"med-v2-160","module":"v2","type":"mcq","q":"Which genetic disease is characterized by the accumulation of ganglioside GM2 due to missing degradative enzymes?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 4","difficulty":"Devil Mode","options":["Diabetes","Scurvy","Tay-Sachs disease","Atherosclerosis"],"answer":"Tay-Sachs disease","solution":"A: Diabetes is a glucose-regulation disorder.\nB: Scurvy is vitamin C deficiency.\nC: Tay-Sachs disease features ganglioside GM2 accumulation from missing degradative enzymes.\nD: Atherosclerosis involves lipid deposition, not GM2 accumulation."},{"id":"med-v2-161","module":"v2","type":"mcq","q":"A peptide chain consisting of 15 amino acid residues would be classified as a(n):","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM PROTEINS MCQS.pdf | SLIDE 3","difficulty":"Medium","options":["Polypeptide","Protein","Dipeptide","Oligopeptide"],"answer":"Oligopeptide","solution":"A: A polypeptide is much longer.\nB: A protein is a large folded polypeptide.\nC: A dipeptide has only two residues.\nD: A chain of about fifteen residues is an oligopeptide."},{"id":"med-v2-162","module":"v2","type":"mcq","q":"Pyrimidines form glycosidic bonds to the pentose sugar via which atom?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM NUCLEIC ACIDS MCQS.pdf | SLIDE 2","difficulty":"Medium","options":["N3","C6","N9","N1"],"answer":"N9","solution":"A: N3 is not the glycosidic bond atom in pyrimidines.\nB: C6 is a carbon atom, not the glycosidic bonding nitrogen.\nC: Pyrimidines form their glycosidic bond through N1.\nD: Purines bond to sugar via N9, not pyrimidines."},{"id":"med-v8-020","module":"v8","type":"mcq","q":"The symbol ⊆ indicates that:","source":"Medicine/HB1 First Semester/Algebra/MATH 157 ALGEBRA 1.pdf | SLIDE 12","difficulty":"Medium","options":["a subset that may also be equal","a proper subset that cannot be equal","a superset","the empty set only"],"answer":"a subset that may also be equal","solution":"A: The subset-or-equal symbol allows equality between the sets.\nB: A proper subset uses the ⊂ symbol.\nC: A superset would reverse the symbol direction.\nD: It applies to any sets, not only the empty set."},{"id":"med-v1-044","module":"v1","type":"mcq","q":"Which of the following is a compartment that often takes up much of the volume of a plant cell?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 7","difficulty":"Medium","options":["mitochondrion","Golgi apparatus","lysosome","vacuole"],"answer":"vacuole","solution":"A: Mitochondria are relatively small and numerous, not volume-dominant.\nB: The Golgi is a stack of cisternae occupying little volume.\nC: Lysosomes are digestive organelles, not major plant storage compartments.\nD: The central vacuole occupies much of a mature plant cell's volume."},{"id":"med-v6-018","module":"v6","type":"mcq","q":"Sensorineural hearing loss results from damage to:","source":"Medicine/HB1 First Semester/Ghanaian Sign Language/CONCEPT OF DEAFNESS.pdf | SLIDE 14","difficulty":"Hard","options":["the eardrum only","the pinna","the outer ear canal","sensory hair cells of the inner ear or their nerves"],"answer":"sensory hair cells of the inner ear or their nerves","solution":"A: Eardrum problems are conductive.\nB: The pinna is part of the outer ear.\nC: Outer ear problems cause conductive loss.\nD: Damage to inner-ear hair cells or nerves defines sensorineural loss."},{"id":"med-v2-163","module":"v2","type":"mcq","q":"The ”Induced Fit” hypothesis proposed by Daniel Koshland suggests that:","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 4","difficulty":"Hard","options":["Enzymes only work when keys are inserted into locks","The enzyme’s active site undergoes a conformational change upon substrate binding","Catalysis occurs without the formation of an enzyme-substrate complex","The substrate is rigid and the enzyme must match it perfectly"],"answer":"The enzyme’s active site undergoes a conformational change upon substrate binding","solution":"A: The keys and locks phrase is only an analogy, not Koshland's proposal.\nB: Induced fit means the active site changes shape on substrate binding.\nC: An enzyme-substrate complex does form during catalysis.\nD: A rigid substrate with a perfect preformed match is the lock-and-key idea."},{"id":"med-v1-045","module":"v1","type":"mcq","q":"Which of the following produces and modifies polysaccharides that will be secreted?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 6","difficulty":"Hard","options":["lysosome","mitochondrion","Golgi apparatus","vacuole"],"answer":"Golgi apparatus","solution":"A: Lysosomes degrade material rather than produce secreted polysaccharides.\nB: Mitochondria produce ATP, not polysaccharides.\nC: The Golgi apparatus produces and modifies polysaccharides destined for secretion.\nD: Vacuoles store substances but do not manufacture secreted polysaccharides."},{"id":"med-v2-164","module":"v2","type":"mcq","q":"Which sugar is known as the sweetest simple sugar and is found in high amounts in honey?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM CARBOHYDRATES MCQS.pdf | SLIDE 2","difficulty":"Hard","options":["Maltose","Fructose","Glucose","Galactose"],"answer":"Fructose","solution":"A: Maltose is a disaccharide, not a simple sugar.\nB: Fructose is the sweetest simple sugar and is abundant in honey.\nC: Glucose is sweet but not the sweetest common simple sugar.\nD: Galactose is less sweet than fructose."},{"id":"med-v2-165","module":"v2","type":"mcq","q":"In which type of pathway are the intermediates regenerated with every turn?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM METABOLIC PATHWAYS MCQS.pdf | SLIDE 1","difficulty":"Devil Mode","options":["Linear pathway","Spiral pathway","Cyclic pathway","Branched pathway"],"answer":"Cyclic pathway","solution":"A: Linear pathways do not regenerate their intermediates each turn.\nB: Spiral pathways are not the term used for regenerated intermediates.\nC: Cyclic pathways regenerate the starting intermediate after every turn.\nD: Branched pathways split fluxes rather than cycling intermediates."},{"id":"med-v2-166","module":"v2","type":"mcq","q":"Lipids are primarily defined by which physical property?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM LIPIDS MCQS.pdf | SLIDE 1","difficulty":"Devil Mode","options":["Low solubility in water and high solubility in nonpolar solvents","High electrical conductivity","Low solubility in nonpolar solvents","High solubility in water"],"answer":"Low solubility in water and high solubility in nonpolar solvents","solution":"A: Lipids are defined by low water solubility and high solubility in nonpolar solvents.\nB: Lipids are poor electrical conductors.\nC: Lipids dissolve readily in nonpolar solvents.\nD: Lipids are poorly soluble in water, not highly soluble."},{"id":"med-v2-167","module":"v2","type":"mcq","q":"What is the standard International Unit (IU) for measuring enzyme activity?","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/BIOL CHEM ENZYMES MCQS.pdf | SLIDE 3","difficulty":"Medium","options":["1 µmol of product formed per minute","1 gram of enzyme per liter of solution","10 molecules of substrate per hour","1 mol of product per second"],"answer":"1 µmol of product formed per minute","solution":"A: One International Unit is one micromole of product formed per minute.\nB: Grams per litre is a concentration, not enzyme activity.\nC: Ten molecules per hour is not the standard definition.\nD: One mole per second is far larger than an International Unit."},{"id":"med-v3-079","module":"v3","type":"mcq","q":"The oxidizing agent in the Tollen's test for the presence of an aldehyde is","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Coded.pdf | SLIDE 3","difficulty":"Medium","options":["Cu2+","Ag+","Ag","Cu2O"],"answer":"Ag+","solution":"A: Cu2+ is used in Fehling's or Benedict's test.\nB: The oxidising agent in Tollens' test is Ag+ ion.\nC: Metallic silver is the deposited product, not the oxidant.\nD: Cu2O is the red precipitate in those tests."},{"id":"med-v1-046","module":"v1","type":"mcq","q":"Tubulin is a dimer, made up of 2 slightly different polypeptides, alpha and beta. Given the structure above, what is the most likely consequence to the structure of the microtubule?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 10","difficulty":"Medium","options":["Microtubules grow by adding a complete circular layer at a time rather than spiraling","One end of a microtubule can grow or release dimers at a faster rate than the other","Microtubules in cilia must never grow or become shorter","One ʺhalf-pipeʺ side of the tubule must be heavier in alpha and the other in beta subunits"],"answer":"One end of a microtubule can grow or release dimers at a faster rate than the other","solution":"A: Microtubules grow by adding dimers at ends, not whole circular layers.\nB: The alpha/beta polarity of tubulin gives microtubules distinct fast-growing and shrinking ends.\nC: Cilia microtubules can be remodelled and are not static.\nD: Tubulin dimers are arranged uniformly, not as heavy alpha and beta halves."},{"id":"med-v2-168","module":"v2","type":"mcq","q":"Protein purification refers to","source":"Medicine/HB1 First Semester/Biological Chemistry/Past Questions/PRACTICE MCQS BIOL CHEM BATCH 2.pdf | SLIDE 3","difficulty":"Medium","options":["Separation of proteins from other biomolecules","Purification of protein","All of the above","Separation of particular proteins from other contaminants"],"answer":"Separation of particular proteins from other contaminants","solution":"A: Separating proteins from other biomolecules is also part of it.\nB: Purifying protein broadly is part of the process.\nC: Not all listed statements are equally precise, so all of the above is not best.\nD: Isolating a particular protein from contaminants is the precise meaning."},{"id":"med-v1-047","module":"v1","type":"mcq","q":"Which of the following contains its own DNA and ribosomes?","source":"Medicine/HB1 First Semester/Cell Structure/Past Questions/AYISHA ZIBLIM, CELL STRUCTURE 1.pdf | SLIDE 7","difficulty":"Hard","options":["mitochondrion","lysosome","Golgi apparatus","vacuole"],"answer":"mitochondrion","solution":"A: Mitochondria possess their own DNA and ribosomes, reflecting their endosymbiotic origin.\nB: Lysosomes lack their own DNA and ribosomes.\nC: The Golgi apparatus has no DNA or ribosomes.\nD: Vacuoles contain no genetic apparatus of their own."},{"id":"med-v4-081","module":"v4","type":"mcq","q":"If a worksheet value changes, what happens to the linked chart?","source":"Medicine/HB1 First Semester/Computer appreciation/Past Questions/passco/CSM_MCQS_FROM_SLIDES EXCEL QUIZ 3.pdf | SLIDE 6","difficulty":"Hard","options":["It remains the same until manual refresh","It is automatically updated","It must be recreated","It shows an error"],"answer":"It is automatically updated","solution":"A: Manual refresh is unnecessary.\nB: A linked chart updates automatically when worksheet values change.\nC: The chart does not need to be recreated after a value change.\nD: No error is shown for a normal value change."},{"id":"med-v5-020","module":"v5","type":"mcq","q":"Choose the correct usage: 'Riley and Stella are ... the results of their examinations.'","source":"Medicine/HB1 First Semester/Communication skills/communication_skills_answered by Abanga.pdf | SLIDE 2","difficulty":"Hard","options":["awaiting off the results","awaiting of the results","awaiting the results","awaiting for the results"],"answer":"awaiting the results","solution":"A: 'Off' is incorrect after await.\nB: Await does not take 'of'.\nC: Await is transitive and takes a direct object, so no preposition is needed.\nD: Await does not take 'for'."},{"id":"med-v3-080","module":"v3","type":"mcq","q":"The simplest alcohol, from a structural standpoint, contains how many carbon atoms and how many oxygen atoms?","source":"Medicine/HB1 First Semester/Basic Medical Chemistry/Past Questions/BMC_PastQuestions Alcohols  ethers and esters.pdf | SLIDE 1","diff
