 mls:[
  {title:'4.2 PROCEDURE: RECEIVING A LABORATORY REQUEST',subs:[{h:'Intro',b:'4.2 PROCEDURE: RECEIVING A LABORATORY REQUEST'},{h:'Purpose',b:'To confirm that a laboratory request is complete, appropriate and associated with the correct patient.'},{h:'Environment',b:'Specimen reception and accessioning area.'},{h:'Equipment',b:' Laboratory information system.  Request forms.  Barcode scanner where available.  Specimen racks.  Appropriate personal protective equipment.  Rejection and discrepancy documentation forms.'},{h:'Procedure',b:'Step 1: Receive the request. The laboratory receives the request from the authorised requesting department. Step 2: Confirm patient identifiers. Check the patient information on the request. Step 3: Review requested investigations. Identify which tests have been requested. Step 4: Review specimen requirements. Determine the appropriate specimen type, container and handling requirements for each requested test. Step 5: Check clinical information. Review relevant information provided on the request.'},{h:'For example:',b:' Suspected severe malaria.  Altered consciousness.  Anaemia.  Hypoglycaemia. Step 6: Identify discrepancies.'},{h:'Examples include:',b:' Missing patient identifiers.  Unlabelled specimen.  Incorrect specimen container.  Insufficient specimen.  Specimen integrity problem.  Incomplete request. Step 7: Accept or reject according to policy. Do not accept an unsuitable specimen without following the laboratory\'s documented policy. Step 8: Accession the request. Assign the appropriate laboratory identifier. Step 9: Direct the specimen to the correct section. Different investigations may require different processing pathways.'},{h:'Simulation implementation',b:'The student should interact with actual request records and specimen containers.'},{h:'The system should generate realistic problems such as:',b:' Request form and specimen label mismatch.  Missing collection time.  Incorrect tube.  Insufficient sample.  Haemolysed specimen. The student must decide whether to accept, clarify or reject according to the validated policy.'}]},
  {title:'4.3 PROCEDURE: PHLEBOTOMY',subs:[{h:'Intro',b:'4.3 PROCEDURE: PHLEBOTOMY'},{h:'Purpose',b:'To collect blood specimens from a patient for laboratory investigations.'},{h:'Environment',b:'Phlebotomy room.'},{h:'Equipment and materials',b:' Phlebotomy chair or suitable patient bed.  Gloves.  Tourniquet.  Skin antiseptic.  Appropriate blood collection needle or device.  Blood collection tubes.  Gauze.  Adhesive dressing.  Sharps container.  Specimen labels.  Request form or electronic order.'},{h:'Scientific foundation',b:'Venepuncture involves accessing a vein to obtain a blood specimen. The specimen must remain suitable for the requested investigation. Different collection tubes contain different additives or have different specimen-processing requirements.'},{h:'EDTA tube',b:'Commonly used for full blood count and malaria blood films. EDTA prevents coagulation by binding calcium.'},{h:'Fluoride-containing tube',b:'May be used for glucose measurement, depending on the laboratory\'s validated method. Fluoride-containing tubes inhibit glycolysis, helping preserve glucose concentration after collection. The exact tube formulation and processing requirements must follow the laboratory\'s validated procedure.'},{h:'Serum tube',b:'May be used for relevant biochemical investigations according to the laboratory\'s method. The exact tube requirements for each investigation must be defined by the laboratory.'},{h:'Procedure',b:'Step 1: Review the request. Confirm which investigations require blood specimens. Step 2: Identify the patient. Use the correct patient identification procedure. Step 3: Explain the procedure. Explain what will happen and obtain appropriate cooperation or consent according to the patient\'s condition and local policy. Step 4: Assess the patient.'},{h:'Consider:',b:' Suitable veins.  Patient position.  Previous difficult venepuncture.  Relevant safety concerns. Step 5: Prepare equipment. Check the collection equipment, tubes and labels. Step 6: Perform hand hygiene and apply appropriate PPE. Follow infection-prevention requirements. Step 7: Apply the tourniquet. Use an appropriate technique and avoid unnecessary prolonged application. Step 8: Identify a suitable vein. Select an appropriate site. Step 9: Clean the site. Use the approved antiseptic method and allow the area to dry as required. Step 10: Perform venepuncture. Use the approved collection technique. Step 11: Collect the required specimens. Use the correct collection tubes and validated order of draw. The simulation should teach the reason for the order of draw and the risk of additive carryover. Step 12: Release the tourniquet and complete collection. Follow the approved technique. Step 13: Withdraw the needle safely. Apply appropriate pressure. Step 14: Dispose of the needle immediately. Use the approved sharps container. Do not recap used needles. Step 15: Label the specimen at the appropriate time and location. Use the laboratory\'s approved bedside identification procedure. The label must match the patient and request. Step 16: Mix additive-containing tubes as specified. Use the correct inversion procedure for the specific tube. Do not shake specimens vigorously. Step 17: Check the patient. Assess the puncture site and the patient\'s response. Step 18: Transport the specimen appropriately. Follow the stability, temperature and transport requirements for each test.'},{h:'Common errors',b:' Incorrect patient identification.  Incorrect tube selection.  Incorrect order of draw.  Prolonged tourniquet application.  Difficult collection causing haemolysis.  Clotted EDTA specimen.  Insufficient volume.  Incorrect labelling.  Delayed processing.  Incorrect storage.'},{h:'The student may encounter:',b:' Difficult venous access.  Patient movement.  A specimen that becomes haemolysed.  A clotted EDTA specimen.  A label mismatch.  Insufficient specimen volume. The simulation should explain the analytical consequences of each error.'}]},
  {title:'4.4 PROCEDURE: SPECIMEN RECEPTION AND ACCESSIONING',subs:[{h:'Intro',b:'4.4 PROCEDURE: SPECIMEN RECEPTION AND ACCESSIONING'},{h:'Purpose',b:'To formally receive and register the specimen within the laboratory system.'},{h:'Environment',b:'Specimen reception and accessioning room.'},{h:'Equipment',b:' Laboratory information system.  Barcode scanner.  Specimen racks.  PPE.  Request forms.  Accession labels.'},{h:'Procedure',b:'Step 1: Receive the specimen. Confirm that the specimen has arrived in the laboratory. Step 2: Verify identifiers. Compare the specimen label with the request. Step 3: Check specimen integrity.'},{h:'Look for:',b:' Leakage.  Incorrect container.  Haemolysis where assessable.  Clots where inappropriate.  Insufficient volume.  Other unacceptable conditions. Step 4: Confirm test requirements. Check whether the specimen is suitable for each requested investigation. Step 5: Assign laboratory accession number. Create the laboratory record. Step 6: Record collection and receipt times. These timestamps support specimen traceability and retrospective turnaround-time calculation. Step 7: Accept or reject. Follow the approved specimen acceptance and rejection criteria. Step 8: Direct specimens to the appropriate sections.'},{h:'For this case, specimens may be directed to:',b:' Haematology.  Parasitology.  Clinical chemistry.  Transfusion science.'},{h:'Important distinction',b:'Patient-facing laboratory reception and specimen reception are different environments. A patient may arrive at laboratory reception for collection or other services. A specimen arrives at specimen reception for laboratory processing. Do not combine these functions into one generic reception workflow.'}]},
  {title:'4.5 PROCEDURE: SPECIMEN PROCESSING',subs:[{h:'Intro',b:'4.5 PROCEDURE: SPECIMEN PROCESSING'},{h:'Purpose',b:'To prepare specimens for the analytical methods required.'},{h:'Environment',b:'Specimen processing room.'},{h:'Depending on the investigation:',b:' Centrifuge.  Centrifuge tubes.  Pipettes.  Transfer devices.  Tube racks.  Aliquot containers.  Labels.  PPE.  Biohazard waste containers.'},{h:'Procedure',b:'Step 1: Review the specimen. Confirm its identity and required investigations. Step 2: Identify the required processing pathway. Not all specimens require centrifugation.'},{h:'For example:',b:' EDTA whole blood used for a full blood count is generally analysed without routine separation into serum or plasma.  Serum investigations may require clotting and centrifugation according to the method.  Other tests may require different preparation. Step 3: Select the correct processing equipment. Confirm that the equipment is appropriate for the specimen and method. Step 4: Inspect the centrifuge where required.'},{h:'Check:',b:' Rotor condition.  Correct tube compatibility.  Rotor loading.  Balance.  Lid condition.  Equipment status. Step 5: Balance the centrifuge. Opposing positions must be appropriately balanced according to the manufacturer\'s instructions. Step 6: Select the validated method settings.'},{h:'Settings depend on:',b:' Specimen type.  Tube type.  Rotor characteristics.  Required relative centrifugal force.  Method requirements. Do not use one universal centrifuge speed for every specimen. Step 7: Run the centrifuge. Operate according to the approved method. Step 8: Remove the specimens safely. Allow the rotor to stop completely before opening. Step 9: Inspect the processed specimen. Check whether the expected separation or processing has occurred. Step 10: Aliquot where required. Transfer material into an appropriately labelled secondary container without contaminating it. Step 11: Direct specimens to the appropriate analytical section.'},{h:'Scientific mechanism: centrifugation',b:'Centrifugation uses rotational motion to generate centrifugal acceleration. Components with different sedimentation behaviour separate according to their physical properties, including density, size, shape and the medium in which they are suspended.'},{h:'The process may separate:',b:' Serum or plasma from cellular components.  Cellular material from supernatant.  Other components required for particular analytical procedures.'},{h:'Common errors',b:' Incorrect tube.  Unbalanced rotor.  Incorrect settings.  Incompatible tube and rotor.  Damaged tube.  Incorrect specimen identification.  Disturbance of separated layers.  Incorrect aliquot labelling.'},{h:'Coding requirements',b:'The centrifuge should be a functioning interactive object.'},{h:'The student should be able to:',b:' Inspect it.  Select compatible tubes.  Load the rotor.  Balance the load.  Select a validated method.  Start the process.  Observe the result.  Identify errors. The system must use method-specific validated settings rather than inventing universal values.'}]},
  {title:'4.6 PROCEDURE: FULL BLOOD COUNT',subs:[{h:'Intro',b:'4.6 PROCEDURE: FULL BLOOD COUNT'},{h:'Purpose',b:'To measure and assess major cellular components of blood.'},{h:'Environment',b:'Haematology laboratory.'},{h:'Equipment',b:' Automated haematology analyser.  EDTA blood specimens.  Sample racks.  Calibrators where applicable.  Quality-control materials.  Reagents.  Laboratory information system.  Appropriate PPE.'},{h:'Scientific foundation',b:'Automated haematology analysers use different analytical technologies.'},{h:'These may include:',b:' Electrical impedance.  Optical or light-scattering methods.  Fluorescence methods.  Haemoglobin measurement methods. The exact technologies depend on the analyser.'},{h:'Procedure',b:'Step 1: Receive the specimen. Confirm that the EDTA specimen has been accepted. Step 2: Inspect the specimen. Check for clots, insufficient volume and other unacceptable conditions. Step 3: Mix the specimen appropriately. Ensure that cells are distributed sufficiently for representative analysis. Avoid excessive mixing. Step 4: Review analyser status.'},{h:'Confirm:',b:' Equipment readiness.  Reagent availability.  Maintenance status.  Quality-control status. Step 5: Perform quality control. Run the appropriate control materials according to the laboratory\'s quality-control schedule and acceptance rules. Step 6: Load the specimen. Identify the specimen correctly and place it in the appropriate position. Step 7: Run the analysis. The analyser measures the relevant blood cell parameters. Step 8: Review the output.'},{h:'Check:',b:' Haemoglobin.  Haematocrit.  Red blood cell count.  Red blood cell indices.  White blood cell count.  Differential count where available.  Platelet count.  Instrument flags. Step 9: Investigate flags or unexpected findings. An abnormal result must not automatically be accepted without appropriate review.'},{h:'Possible follow-up may include:',b:' Repeat analysis.  Blood film review.  Specimen inspection.  Independent review.  Investigation of analytical interference. Step 10: Verify the results. Use the laboratory\'s approved validation and authorisation process. Step 11: Release the report. The result is released through the laboratory reporting system.'},{h:'The analyser output must match the locked case dataset:',b:' Hb: 6.6 g/dL.  Hct: 20%.  RBC: 2.75 × 1012/L.  MCV: 88 fL.  WBC: 13.6 × 109/L.  Neutrophils: 82%.  Platelets: 68 × 109/L.'},{h:'Common errors',b:' Clotted EDTA sample.  Poor mixing.  Incorrect specimen identification.  Reagent problem.  Instrument flag ignored.  Failed quality control.  Carryover.  Analytical interference.  Incorrect result validation.'},{h:'Important MLS learning point',b:'The analyser generates measurements. The MLS professional must evaluate analytical reliability before releasing the report. A machine-generated result is not automatically a verified result.'}]},
  {title:'4.7 PROCEDURE: PREPARATION OF THICK AND THIN MALARIA BLOOD FILMS',subs:[{h:'Intro',b:'4.7 PROCEDURE: PREPARATION OF THICK AND THIN MALARIA BLOOD FILMS'},{h:'Purpose',b:'To prepare blood films suitable for microscopic detection and identification of malaria parasites.'},{h:'Environment',b:'Medical parasitology laboratory.'},{h:'Equipment and materials',b:' Clean microscope slides.  EDTA blood specimen or appropriate fresh blood specimen.  Spreader slide.  Applicator where required.  Appropriate staining reagents.  Staining rack.  Drying area.  Microscope.  Immersion oil where required.  PPE.  Laboratory worksheet.'},{h:'Scientific purpose',b:'The thick film concentrates blood material within a relatively small area. Red blood cells are lysed during the appropriate staining process, allowing parasites to be detected among concentrated blood elements. This makes the thick film useful for malaria parasite detection.'},{h:'Procedure',b:'Step 1: Confirm the specimen identity. Check the specimen against the request. Step 2: Prepare a clean slide. Ensure that the slide is clean and suitable for microscopy. Step 3: Apply the blood. Place the appropriate blood volume onto the slide according to the validated method. Step 4: Spread the blood. Create a thick film of suitable size and consistency. Step 5: Allow the film to dry. Use the validated drying method. Step 6: Stain the film. Use the approved malaria staining procedure. The thick film must not be fixed with methanol before staining in the usual method because the red blood cells need to be lysed. Step 7: Allow the stain to act. Follow the validated staining procedure. Step 8: Examine the slide. Use the appropriate microscope and systematic examination method. Step 9: Identify parasites. Recognise relevant malaria parasite morphology. Step 10: Record the findings. Document whether malaria parasites are detected and any required additional information.'},{h:'Scientific purpose',b:'The thin film preserves red blood cell morphology.'},{h:'It is useful for:',b:' Species identification.  Parasite morphology.  Assessing parasite density using an appropriate method.'},{h:'Procedure',b:'Step 1: Confirm specimen identity. Step 2: Place a suitable blood drop on the slide. Step 3: Position the spreader slide. Step 4: Spread the blood. Use the validated technique to produce an appropriate film. Step 5: Allow the film to dry. Step 6: Fix the thin film. Use the validated fixation procedure, commonly involving methanol. Step 7: Stain the film. Apply the appropriate staining method. Step 8: Examine microscopically. Assess parasite morphology and red blood cell appearance. Step 9: Identify the species where possible. Record the relevant morphological features. Step 10: Document the findings. Record the species identification and any other required findings.'},{h:'Staining mechanism',b:'Giemsa staining uses dye components that interact with cellular structures. It helps distinguish parasite structures from surrounding blood components. The exact staining concentration, buffer, pH and staining duration must follow the validated laboratory method. Do not hard-code unverified universal staining settings.'}]},
  {title:'4.8 PROCEDURE: MALARIA MICROSCOPY',subs:[{h:'Intro',b:'4.8 PROCEDURE: MALARIA MICROSCOPY'},{h:'Purpose',b:'To detect malaria parasites and identify the species where possible.'},{h:'Equipment',b:' Light microscope.  Appropriate objective lenses.  Immersion oil where required.  Prepared thick and thin blood films.  Slide labels.  Microscope cleaning materials.  Laboratory worksheet.'},{h:'Procedure',b:'Step 1: Confirm slide identity. Check the patient and specimen identifiers. Step 2: Check slide quality. Inspect the preparation and staining. Step 3: Select the appropriate film. Use the thick film primarily for parasite detection and the thin film for morphology and species identification. Step 4: Examine systematically. Follow the validated microscopy procedure. Step 5: Identify parasite structures. Recognise the appearance of malaria parasites and distinguish them from artefacts or other structures. Step 6: Consider species identification. Use appropriate morphological features. Step 7: Assess the presence of parasites. Document whether parasites are detected. Step 8: Determine whether quantification is required. If parasite density is requested, use the laboratory\'s validated counting method. Step 9: Record the result. Include the relevant species and parasite density information. Step 10: Seek review where necessary. Uncertain or discordant findings should be reviewed through the appropriate laboratory process.'},{h:'Case result',b:'Thin film demonstrates P. falciparum ring forms. Thick film is positive. Reported parasitaemia: 7.8%.'},{h:'The student must understand:',b:' Why thick and thin films are different.  Why staining matters.  Why slide quality affects interpretation.  Why systematic examination is necessary.  Why species identification matters.  Why parasite density requires a defined method.'},{h:'Common errors',b:' Poor film thickness.  Incorrect staining.  Inadequate drying.  Incorrect fixation.  Contaminated slide.  Inadequate microscopic examination.  Misidentification of artefacts.  Incorrect parasite density calculation.'}]},
  {title:'4.9 PROCEDURE: PARASITE DENSITY ASSESSMENT',subs:[{h:'Intro',b:'4.9 PROCEDURE: PARASITE DENSITY ASSESSMENT'},{h:'Purpose',b:'To estimate the level of malaria parasitaemia using a validated microscopy method.'},{h:'Scientific foundation',b:'Parasite density describes the amount of malaria parasitaemia present in the examined blood. It can be expressed using different methods. One approach involves calculating the percentage of infected red blood cells in a thin film. Another approach involves counting parasites against white blood cells in a thick film and using an appropriate white blood cell count or validated assumed count. The method must be explicitly defined.'},{h:'Procedure',b:'Step 1: Confirm the slide quality. Step 2: Select the validated quantification method. Step 3: Examine the appropriate microscopic field. Step 4: Count according to the method. Step 5: Apply the correct calculation. Step 6: Record the denominator and units. Step 7: Verify the result. Step 8: Report the parasite density.'},{h:'Critical coding requirement',b:'The case result of 7.8% must be linked to its validated method and denominator. Do not allow the game to display a parasite percentage without defining how it was obtained. Do not mix a percentage of infected red cells with a parasites-per-microlitre calculation.'}]},
  {title:'4.10 PROCEDURE: MALARIA RAPID DIAGNOSTIC TEST',subs:[{h:'Intro',b:'4.10 PROCEDURE: MALARIA RAPID DIAGNOSTIC TEST'},{h:'Purpose',b:'To detect malaria-related antigen in a blood specimen using an immunochromatographic test.'},{h:'Environment',b:'Parasitology or designated rapid-testing area.'},{h:'Equipment',b:' Approved malaria RDT kit.  Blood collection device.  Buffer supplied with the kit.  Timer.  Gloves.  PPE.  Test worksheet.'},{h:'Scientific mechanism',b:'Many malaria rapid diagnostic tests use lateral-flow immunochromatography. The test contains antibodies designed to bind specific malaria antigens. As the sample moves along the test strip, antigen-antibody interactions produce visible lines. The test line indicates detection of the targeted antigen. The control line indicates that the test has functioned sufficiently to permit interpretation. The exact target and interpretation depend on the specific kit.'},{h:'Procedure',b:'Step 1: Confirm the request and specimen. Step 2: Check the kit.'},{h:'Review:',b:' Expiry.  Packaging integrity.  Storage conditions.  Manufacturer\'s instructions. Step 3: Prepare the test area. Use the required PPE and arrange the materials. Step 4: Apply the specimen. Use the correct sample volume and application point. Step 5: Add buffer. Follow the manufacturer\'s instructions. Step 6: Start the timer. Use the reading interval specified by the kit. Step 7: Interpret the lines. Determine whether the control line and relevant test line are present. Step 8: Classify the result. The result may be positive, negative or invalid according to the kit instructions. Step 9: Record the result. Include kit identity and relevant traceability information where required.'},{h:'Case result',b:'PfHRP2 RDT: Positive.'},{h:'Common errors',b:' Expired kit.  Incorrect storage.  Incorrect sample volume.  Incorrect buffer volume.  Reading too early.  Reading after the permitted interval.  Failure of the control line.  Incorrect interpretation of faint lines.'},{h:'Teaching point',b:'A positive PfHRP2 result does not independently quantify parasitaemia or establish clinical severity. Microscopy and clinical assessment remain important.'}]},
  {title:'4.11 PROCEDURE: CLINICAL CHEMISTRY ANALYSIS',subs:[{h:'Intro',b:'4.11 PROCEDURE: CLINICAL CHEMISTRY ANALYSIS'},{h:'Purpose',b:'To measure biochemical substances in the patient\'s blood and provide information about glucose, renal function, electrolytes and other metabolic abnormalities.'},{h:'Environment',b:'Clinical chemistry laboratory.'},{h:'Depending on the method:',b:' Clinical chemistry analyser.  Reagents.  Calibrators.  Quality-control materials.  Serum or plasma specimens.  Fluoride-containing glucose specimen where required.  Pipettes or automated sampling systems.  Sample racks.  Laboratory information system.'},{h:'General analytical workflow',b:'Step 1: Receive the specimen. Confirm patient identity and specimen suitability. Step 2: Inspect the specimen.'},{h:'Check for:',b:' Haemolysis.  Lipaemia.  Icterus where relevant.  Insufficient volume.  Incorrect container. Step 3: Confirm specimen requirements. Different tests may require different sample types and preparation. Step 4: Check analyser readiness. Confirm maintenance, reagents, calibration status and quality-control status. Step 5: Run quality control. Verify that control results meet the laboratory\'s acceptance criteria. Step 6: Load the specimen. Use the correct identification and sample position. Step 7: Perform the requested analysis. The analyser applies the relevant analytical method. Step 8: Review the output. Check results, flags and possible interference. Step 9: Investigate unexpected results. Repeat analysis or seek further review when indicated. Step 10: Verify and release. Follow the laboratory\'s authorisation process.'},{h:'A. Glucose analysis',b:'Glucose is a major circulating carbohydrate used in cellular energy metabolism. Laboratory glucose measurement commonly uses an enzymatic method. The exact method depends on the analyser. Fluoride-containing tubes may be used to inhibit glycolysis, helping preserve glucose after collection. The student must understand that cells continue metabolising glucose after collection if the specimen is not appropriately handled. Delayed separation or inappropriate storage can therefore affect results.'},{h:'Relevant tests include:',b:' Urea.  Creatinine.  Electrolytes. The laboratory measures these substances using validated analytical methods. The clinician uses the results alongside clinical history, urine output and other findings. MLS must ensure that the analytical result is valid and correctly reported.'},{h:'Relevant measurements include:',b:' Bilirubin.  AST.  ALT. The student must understand that these tests provide different kinds of biochemical information. AST and ALT are associated with cellular injury and are not direct measurements of the liver\'s synthetic function.'},{h:'The case includes:',b:' Bicarbonate: 17 mmol/L.  Lactate: 4.3 mmol/L. The student must understand the importance of appropriate specimen collection and processing for these investigations. Blood gas and lactate testing may have specific collection and handling requirements. The laboratory must follow the validated method.'},{h:'Common chemistry errors',b:' Haemolysis.  Incorrect tube.  Delayed processing.  Incorrect storage.  Reagent deterioration.  Failed calibration.  Failed quality control.  Sample contamination.  Incorrect patient identification.  Analytical interference.'},{h:'Important simulation feature',b:'The student should be able to inspect a specimen and receive information about possible interference.'},{h:'Scenario: Haemolysed specimen',b:'The system explains that red cell rupture can release intracellular substances into the specimen. This may affect measurements such as potassium and AST. The student must decide whether the result is reliable, requires comment, repeat analysis or recollection according to the validated method.'}]},
  {title:'4.12 PROCEDURE: BLOOD BANK AND PRE-TRANSFUSION TESTING',subs:[{h:'Intro',b:'4.12 PROCEDURE: BLOOD BANK AND PRE-TRANSFUSION TESTING'},{h:'Purpose',b:'To establish the patient\'s blood group and assess compatibility when blood transfusion is being considered.'},{h:'Why this is relevant to Kwame',b:'Kwame\'s haemoglobin is 6.6 g/dL. This is severe anaemia. The responsible clinician must assess whether transfusion is indicated. The MLS transfusion science team supports this decision by performing the required compatibility investigations. A low haemoglobin result does not mean that the MLS professional independently decides to transfuse.'},{h:'Environment',b:'Blood bank/transfusion science laboratory.'},{h:'Equipment and materials',b:' Appropriate blood specimen.  Blood grouping reagents or validated analyser.  Compatibility testing materials.  Appropriate identification system.  Blood storage equipment.  Quality-control materials.  Transfusion documentation.'},{h:'Procedure',b:'Step 1: Receive the request. Confirm the clinical request for grouping and compatibility testing. Step 2: Confirm patient identity. Check the specimen and request carefully. Step 3: Check specimen acceptability. Apply the transfusion laboratory\'s identification and specimen acceptance rules. Step 4: Perform ABO grouping. Determine the patient\'s ABO blood group using the validated method. Step 5: Perform RhD typing. Determine the patient\'s RhD status. Step 6: Perform additional testing where required. This may include antibody screening and other tests according to policy. Step 7: Perform compatibility testing. Use the approved crossmatch method when indicated. Step 8: Investigate incompatibility. Do not release incompatible blood. Step 9: Select and issue compatible blood. Follow the laboratory\'s validated procedures and documentation requirements. Step 10: Communicate availability and limitations. Inform the appropriate clinical team.'},{h:'Important clinical distinction',b:'The clinician decides whether transfusion is required. MLS performs the laboratory compatibility work. Nursing and the responsible clinical team follow the approved transfusion administration and monitoring procedures. The simulation must preserve these professional boundaries.'}]},
  {title:'4.13 PROCEDURE: QUALITY CONTROL AND RESULT VERIFICATION',subs:[{h:'Intro',b:'4.13 PROCEDURE: QUALITY CONTROL AND RESULT VERIFICATION'},{h:'Purpose',b:'To ensure that laboratory results are sufficiently reliable before they are released.'},{h:'Quality control',b:'Quality control evaluates whether the analytical system is functioning within defined limits.'},{h:'Procedure',b:'Step 1: Identify the analytical system. Confirm which analyser or method is being used. Step 2: Review quality-control requirements. Determine which controls are required. Step 3: Run control material. Use the appropriate control material according to the method. Step 4: Review control results. Compare results with the laboratory\'s acceptance limits. Step 5: Determine whether the run is acceptable. If controls fail, patient results must not be released as though the analytical system has passed. Step 6: Investigate failure.'},{h:'Possible causes include:',b:' Reagent problems.  Calibration problems.  Equipment malfunction.  Operator error.  Control material deterioration.  Environmental problems. Step 7: Correct the problem. Follow the validated corrective-action procedure. Step 8: Repeat quality control. Confirm acceptable performance before proceeding.'},{h:'Before release, review:',b:' Patient identity.  Specimen identity.  Analytical flags.  Quality-control status.  Result plausibility.  Reference intervals.  Units.  Relevant previous results where available.  Possible specimen interference.  Need for repeat analysis or independent review.'},{h:'Important distinction',b:'Quality control and result verification are related but different. Quality control evaluates analytical system performance. Result verification evaluates whether a particular patient result is suitable for release. A second opinion or independent slide review is not automatically the same thing as formal quality control.'}]},
  {title:'4.14 PROCEDURE: CRITICAL RESULT COMMUNICATION',subs:[{h:'Intro',b:'4.14 PROCEDURE: CRITICAL RESULT COMMUNICATION'},{h:'Purpose',b:'To ensure that clinically significant laboratory findings reach the appropriate healthcare professional promptly.'},{h:'Potentially urgent results include:',b:' Severe anaemia.  Hypoglycaemia.  Significant biochemical abnormalities.  Other findings meeting the laboratory\'s validated critical-result policy. The exact critical thresholds must be defined by the institution and applicable guidelines.'},{h:'Procedure',b:'Step 1: Identify the result. Determine whether it meets the laboratory\'s critical-result criteria. Step 2: Verify the result. Follow the appropriate verification process. Step 3: Identify the responsible recipient. Confirm the requesting clinician or other authorised recipient. Step 4: Communicate promptly. Use the approved communication channel. Step 5: State the result clearly.'},{h:'Include:',b:' Patient identity.  Investigation.  Result.  Unit.  Relevant urgency. Step 6: Obtain acknowledgement. Confirm that the recipient has received and understood the result. Step 7: Escalate if necessary. If the intended recipient cannot be reached, follow the escalation pathway. Step 8: Document.'},{h:'Record:',b:' Result.  Sender.  Recipient.  Communication time.  Acknowledgement.  Escalation.  Relevant action.'},{h:'Example',b:'"Critical laboratory communication: Kwame Mensah\'s haemoglobin is 6.6 g/dL. Please acknowledge receipt and review the result in the context of the patient\'s clinical condition." The simulation must not assume that the doctor has automatically received a result simply because MLS released it.'}]},
  {title:'4.15 PROCEDURE: RESULT REPORTING',subs:[{h:'Intro',b:'4.15 PROCEDURE: RESULT REPORTING'},{h:'Purpose',b:'To issue a verified laboratory report to the appropriate clinical team.'},{h:'Required report elements',b:' Patient identifiers.  Laboratory number.  Investigation.  Result.  Unit.  Reference interval or decision limit where appropriate.  Relevant comments.  Specimen information.  Date and time.  Authorisation status.  Laboratory identity.'},{h:'Interpretation boundary',b:'MLS may provide analytical comments and appropriate laboratory interpretation. The final clinical diagnosis belongs to the responsible clinician. The system must not provide an MLS student with a "Final Diagnosis" button. The MLS student\'s appropriate final action is to release or submit the laboratory report through the authorised workflow.'}]},
 ],
 pharmacy:[
  {title:'5.2 PROCEDURE: RECEIVING AND REVIEWING THE PRESCRIPTION',subs:[{h:'Intro',b:'5.2 PROCEDURE: RECEIVING AND REVIEWING THE PRESCRIPTION'},{h:'Purpose',b:'To ensure that the prescribed medicine is appropriate, complete and safe before supply or administration.'},{h:'Environment',b:'Clinical pharmacy workstation or inpatient pharmacy.'},{h:'Equipment',b:' Prescription record.  Patient medication history.  Electronic prescribing system.  Drug reference resources.  Calculator.  Allergy record.  Product information.  Medication stock system.'},{h:'Procedure',b:'Step 1: Receive the prescription. Confirm that the prescription belongs to Kwame. Step 2: Identify the prescriber. Confirm that the prescription has been issued by an authorised professional. Step 3: Review the medication.'},{h:'Check:',b:' Medicine name.  Formulation.  Strength.  Dose.  Route.  Frequency.  Duration or treatment schedule. Step 4: Review the patient.'},{h:'Check:',b:' Age.  Weight.  Allergies.  Relevant medical history.  Renal function.  Liver-related information.  Other medicines.  Ability to receive the prescribed route. Step 5: Identify medication-related problems.'},{h:'Examples:',b:' Incorrect dose.  Incorrect route.  Incomplete prescription.  Allergy concern.  Drug interaction.  Contraindication.  Product unavailable.  Preparation uncertainty. Step 6: Clarify discrepancies. Contact the prescriber where required. Step 7: Document the review. Record any intervention, clarification or concern.'}]},
  {title:'5.3 PROCEDURE: WEIGHT-BASED DOSE CALCULATION',subs:[{h:'Intro',b:'5.3 PROCEDURE: WEIGHT-BASED DOSE CALCULATION'},{h:'Purpose',b:'To calculate a medication dose using the patient\'s weight when the treatment protocol requires weight-based dosing.'},{h:'Case information',b:'Kwame\'s recorded weight: 68 kg. The case\'s severe malaria artesunate calculation uses 2.4 mg/kg per dose.'},{h:'Calculation:',b:'2.4 mg × 68 kg = 163.2 mg. Therefore, the calculated dose is 163.2 mg per dose under the specified case regimen.'},{h:'Procedure',b:'Step 1: Confirm the patient\'s weight. Use the verified case weight. Step 2: Confirm the prescribed dose per kilogram. Check the applicable treatment protocol. Step 3: Multiply the dose per kilogram by the patient\'s weight. 2.4 mg/kg × 68 kg = 163.2 mg. Step 4: Check the arithmetic. Repeat the calculation or use an independent verification method according to policy. Step 5: Compare the calculated dose with the product and protocol requirements. Do not assume that the calculated milligram dose directly determines the volume to administer. Step 6: Document the calculation.'},{h:'Record:',b:' Weight.  Dose per kilogram.  Calculation.  Final calculated dose.  Person performing the calculation.  Verification.'},{h:'The calculated dose is not the same as:',b:' Vial strength.  Reconstituted concentration.  Volume to withdraw.  Final administration volume. These depend on the specific product and approved preparation instructions.'}]},
  {title:'5.4 PROCEDURE: MEDICATION PRODUCT SELECTION AND STOCK VERIFICATION',subs:[{h:'Intro',b:'5.4 PROCEDURE: MEDICATION PRODUCT SELECTION AND STOCK VERIFICATION'},{h:'Purpose',b:'To ensure that the correct pharmaceutical product is selected and is suitable for use.'},{h:'Procedure',b:'Step 1: Identify the required medicine. Confirm the prescribed medication and formulation. Step 2: Locate the product. Search the pharmacy stock system. Step 3: Confirm product identity. Check the label. Step 4: Confirm strength and formulation. Ensure that the selected product matches the required preparation. Step 5: Check expiry. Do not supply expired medication. Step 6: Check packaging integrity. Look for damage, contamination or other signs of compromised product quality. Step 7: Review storage conditions. Confirm that the product has been stored according to its requirements. Step 8: Confirm availability. Record whether sufficient stock is available. Step 9: Document selection. Record the product and relevant batch information according to policy.'},{h:'The student may encounter:',b:' Correct drug but incorrect formulation.  Incorrect strength.  Expired stock.  Damaged packaging.  Insufficient stock.  Product requiring special preparation. The student must identify the problem before supply.'}]},
  {title:'5.5 PROCEDURE: INTRAVENOUS ARTESUNATE PREPARATION',subs:[{h:'Intro',b:'5.5 PROCEDURE: INTRAVENOUS ARTESUNATE PREPARATION'},{h:'Purpose',b:'To prepare intravenous artesunate for administration according to the specific product\'s instructions.'},{h:'Important clinical context',b:'Severe malaria requires urgent treatment. The pharmacy student must understand the role of artesunate and the importance of accurate preparation. The case calculation is 163.2 mg per dose. However, preparation details depend on the exact product supplied.'},{h:'Different manufacturers and formulations may have different:',b:' Vial strengths.  Reconstitution instructions.  Diluent requirements.  Resulting concentrations.  Stability periods.  Administration instructions. The simulation must not invent one universal preparation method.'},{h:'Depending on the approved product:',b:' Artesunate product vial.  Manufacturer-specified diluent.  Appropriate sterile preparation equipment.  Syringes.  Needles or transfer devices.  Appropriate PPE.  Medication preparation label.  Approved preparation reference.  Sharps container.  Medication record.'},{h:'Procedure',b:'Step 1: Verify the prescription. Confirm patient, drug, dose, route and schedule. Step 2: Confirm the calculated dose. Check the 163.2 mg case calculation. Step 3: Identify the exact product. Confirm the manufacturer, vial strength and formulation. Step 4: Retrieve the approved product instructions. Use the correct product information. Step 5: Check the required diluent. Do not substitute another diluent without authorisation. Step 6: Prepare the working area. Use the appropriate aseptic preparation environment and equipment. Step 7: Perform hand hygiene and use appropriate PPE. Follow sterile preparation requirements. Step 8: Reconstitute the product. Follow the exact manufacturer-approved instructions. Step 9: Mix as directed. Use the product-specific method. Step 10: Inspect the preparation. Check for abnormalities such as unexpected particles, discolouration or other signs of compromised preparation. Step 11: Determine the final concentration. Use the concentration specified by the validated product instructions. Step 12: Calculate the volume required. Volume is calculated from the prescribed dose and verified final concentration. Step 13: Independently verify the calculation where required. Use the appropriate double-check process. Step 14: Label the prepared medication. Include the required identification and preparation information. Step 15: Confirm the administration instructions. Ensure that the product is supplied with the correct route and administration information. Step 16: Document preparation. Record the product, dose, preparation details, time and responsible personnel.'},{h:'Critical implementation rule',b:'Do not hard-code an invented reconstitution volume or administration volume. The exact product must be selected before those values can be determined. The simulation should use product-specific validated preparation data.'}]},
  {title:'5.6 PROCEDURE: ARTESUNATE TREATMENT SCHEDULE',subs:[{h:'Intro',b:'5.6 PROCEDURE: ARTESUNATE TREATMENT SCHEDULE'},{h:'Purpose',b:'To understand the dosing schedule used for the severe malaria regimen in the case.'},{h:'Case regimen',b:'The case uses artesunate at 2.4 mg/kg.'},{h:'For Kwame:',b:'2.4 mg/kg × 68 kg = 163.2 mg per dose.'},{h:'The specified case schedule is:',b:' Initial dose at 0 hours.  Second dose at 12 hours.  Third dose at 24 hours.  Further daily doses while indicated under the applicable treatment protocol.'},{h:'The Pharmacy student should:',b:'1. Verify the prescribed schedule. 2. Check the calculated dose. 3. Check the product. 4. Verify preparation requirements. 5. Ensure the correct route. 6. Record each supplied dose. 7. Monitor availability. 8. Review the treatment plan. 9. Support the transition to oral treatment when clinically appropriate and prescribed.'},{h:'Important distinction',b:'The simulation\'s event timestamps are an audit record. They must not create artificial waiting. If the required clinical workflow has been completed and the next scheduled treatment event is ready to be represented, the simulation should progress through its predefined clinical logic without making the student wait in real time.'}]},
  {title:'5.7 PROCEDURE: MEDICATION SUPPLY AND HANDOVER',subs:[{h:'Intro',b:'5.7 PROCEDURE: MEDICATION SUPPLY AND HANDOVER'},{h:'Purpose',b:'To transfer the prepared or dispensed medication to the appropriate clinical professional with the necessary information.'},{h:'Procedure',b:'Step 1: Confirm the patient. Check the medication against the correct patient record. Step 2: Verify the medication. Confirm medicine, dose, formulation and route. Step 3: Verify the label. Ensure that the label contains the required information. Step 4: Provide administration instructions. Communicate relevant preparation and administration details. Step 5: Identify the receiving professional. Confirm who is receiving the medication. Step 6: Complete the handover. Transfer the medication using the approved process. Step 7: Document the supply.'},{h:'Record:',b:' Medication.  Dose.  Quantity.  Product details.  Recipient.  Time.  Relevant instructions.'},{h:'Communication example',b:'"The prescribed artesunate dose for Kwame Mensah has been calculated as 163.2 mg. The product-specific preparation instructions and administration requirements have been verified. Please confirm receipt and follow the authorised administration procedure."'}]},
  {title:'5.8 PROCEDURE: MEDICATION MONITORING AND PHARMACEUTICAL CARE',subs:[{h:'Intro',b:'5.8 PROCEDURE: MEDICATION MONITORING AND PHARMACEUTICAL CARE'},{h:'Purpose',b:'To monitor medication-related safety and effectiveness.'},{h:'Monitoring areas',b:' Correct administration.  Therapeutic response.  Adverse reactions.  Allergy concerns.  Medication errors.  Treatment interruptions.  Product availability.  Relevant laboratory abnormalities.'},{h:'Procedure',b:'Step 1: Review the treatment record. Confirm which medicines have been prescribed and administered. Step 2: Review the patient\'s clinical condition. Consider relevant observations and laboratory findings. Step 3: Identify possible adverse reactions. Assess reported symptoms and observed abnormalities. Step 4: Review medication-related risks. Consider contraindications, interactions and relevant organ dysfunction. Step 5: Communicate concerns. Contact the responsible clinician when intervention is required. Step 6: Document the pharmaceutical intervention. Record the concern, recommendation, recipient and outcome.'},{h:'Case-specific considerations',b:'The patient\'s renal biochemical abnormalities are relevant to medication review. The Pharmacy student must understand that renal dysfunction can influence the handling of certain medicines. However, the simulation must not automatically adjust every medication dose simply because creatinine is elevated. Dose adjustments must be based on the specific medication, applicable guidance and clinical assessment.'}]},
  {title:'5.9 PROCEDURE: TRANSITION TO ORAL ANTIPARASITIC TREATMENT',subs:[{h:'Intro',b:'5.9 PROCEDURE: TRANSITION TO ORAL ANTIPARASITIC TREATMENT'},{h:'Purpose',b:'To understand the transition from parenteral treatment to an appropriate oral antimalarial regimen when the patient meets the relevant clinical criteria.'},{h:'Clinical context',b:'Patients treated for severe malaria may require parenteral treatment initially. When clinically appropriate, treatment is completed using a recommended oral antimalarial combination.'},{h:'Pharmacy responsibilities',b:'Step 1: Review the medical plan. Confirm that the responsible clinician has assessed the patient\'s suitability for oral treatment. Step 2: Confirm the selected regimen. Use the current applicable national guideline. Step 3: Review the patient.'},{h:'Assess:',b:' Ability to swallow.  Vomiting.  Allergy history.  Medication history.  Contraindications.  Relevant interactions. Step 4: Verify the prescription. Check the medicine, dose, frequency and duration. Step 5: Supply the medicine. Follow the approved dispensing process. Step 6: Counsel the patient.'},{h:'Explain:',b:' How to take the medicine.  When to take it.  What to do if vomiting occurs.  The importance of completing the regimen.  Possible adverse effects.  When to seek medical attention. Step 7: Document counselling. Record the information provided and any concerns.'},{h:'Important rule',b:'The exact oral regimen must be validated against the current applicable Ghanaian malaria treatment guideline. Do not invent a regimen simply to complete the simulation.'},{h:'PART 6 — INTERDEPARTMENTAL COMMUNICATION',b:'The hospital must operate as one connected environment. The four departments should not feel like separate games. Each department must receive the information it reasonably needs.'}]},

    else if (preferAbove) { top = Math.max(8, innerHeight - ch - 8); }
    else { top = Math.min(r.bottom + 12, innerHeight - ch - 8); }
    top = Math.min(Math.max(top, 8), Math.max(8, innerHeight - ch - 8));
    card.style.top = top + "px";
    card.style.transform = "translateX(-50%)";
    var arr = document.createElement("div"); arr.className = "cArr"; card.appendChild(arr);
    var cardLeft = (innerWidth - cw2) / 2;
    var ax = Math.min(Math.max(r.left + r.width / 2 - cardLeft - 10, 8), cw2 - 28) + "px";
    if (top >= r.bottom) { arr.style.bottom = "100%"; arr.style.borderBottomColor = "#d4af37"; }
    else { arr.style.top = "100%"; arr.style.borderTopColor = "#d4af37"; }
    arr.style.left = ax;
  }
  function end() {
    try { localStorage.setItem("cdcoach:" + (key || "x"), "1"); } catch (e) {}
    hole.style.display = "none"; card.style.display = "none"; try { window.CDCoachActive = false; } catch (e) {}
    var f = onEnd; onEnd = null; if (f) f();
  }
  card.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    if (b.id === "cdNext") { i++; if (i >= steps.length) end(); else draw(); }
    else if (b.id === "cdPrev") { if (i > 0) { i--; draw(); } }
    else if (b.id === "cdSkip") { end(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && card.style.display === "block") end();
  });
  addEventListener("resize", function () { if (card.style.display === "block") draw(); });
  addEventListener("scroll", function () { if (card.style.display === "block") draw(); }, true);
  window.CDCoach = {
    start: function (k, def, cb) { key = k; steps = def.steps; i = 0; onEnd = cb || null; try { window.CDCoachActive = true; } catch (e) {} draw(); },
    maybe: function (k, def, cb) {
      var seen = null; try { seen = localStorage.getItem("cdcoach:" + k); } catch (e) {}
      if (!seen) this.start(k, def, cb);
    },
    stop: end
  };
})();
