   var text = (maybeText!==undefined)? maybeText : roleOrText;

   if(!text) return Promise.resolve(false);
   queue.push(text);
   if(!speaking) next();
   return Promise.resolve(true);

   var arr=(lines!==undefined?lines:roleOrLines).slice();
   arr.forEach(function(t){ queue.push(t); });

 stationShell('Medicine — Emergency Ward Round',body);
 var bs=document.querySelectorAll('[data-cmd]');
 for(var i=0;i<bs.length;i++)bs[i].onclick=(function(k){return function(){medCmd(k);};})(bs[i].dataset.cmd);

function medCmd(c){
 var M=G.M;
 if(c==='ABC'){M.abc=1;G.clock=TL.triage;save();add('safe',3);
  Mlog('<span class="time">'+TL.triage+'</span> <b>A</b>irway patent (confused) · <b>B</b>reathing RR 28, SpO₂ 94 % air · <b>C</b>irculation HR 126, BP 96/58, delayed capillary refill · <b>D</b>isability GCS 8/15 (E2 V2 M4) · <b>E</b>xposure: hot, no rash, no bleeding.<br><b>Verdict:</b> critically unwell — reverse the reversible threats NOW, labels later.');
  voice('Airway breathing circulation disability exposure assessed. Critically unwell patient. Reverse the reversible threats now. Labels come later.','narrator');medStation();}
 else if(c==='GLU'){M.glu=1;G.clock=TL.glu;save();add('safe',4);
  Mlog('<span class="time">'+TL.glu+'</span> <b>Capillary glucose:</b> 2.6 mmol/L — <b>hypoglycaemia</b>. Correction is the immediate priority — a glucose this low can itself impair consciousness.');
  voice('Capillary glucose two point six. Hypoglycaemia. Correct immediately, then reassess.','narrator');medStation();}
 else if(c==='FIX'){M.fix=1;G.clock=TL.dxt;save();add('safe',3);
  Mlog('<span class="time">'+TL.dxt+'</span> <b>IV dextrose per current approved protocol.</b><span class="mut"> The case files flag: concentration/dose must match the current Ghana protocol — REQUIRES CLINICAL VALIDATION. The simulation will not invent an unverified dose.</span>');
  voice('Glucose correction given per current protocol. Reassessment follows.','narrator');medStation();}
 else if(c==='REA'){M.rea=1;G.clock=TL.rea;save();add('hist',4);
  Mlog('<span class="time">'+TL.rea+'</span> <b>Honest reassessment:</b> GCS now 10/15 (E3 V3 M4). <b>Persistent impairment.</b> Hypoglycaemia contributed — it did not explain everything. Evaluation continues; the initial GCS is not the whole story.');
  voice('Glasgow coma scale ten out of fifteen after correction. Still impaired. Evaluation continues.','narrator');medStation();}
 else if(c==='HX'){M.hx=1;G.clock=TL.hx;save();add('hist',8);
  Mlog('<span class="time">'+TL.hx+'</span> <b>Focused history</b> (accompanying relative): 8 days of fever + chills · headache · weakness · poor intake · vomiting · cocoa farmer near Ejisu · slept outdoors during harvest · two home doses of an antipyretic · <b>respectful herbal ask:</b> the family confirms a herbal preparation WAS taken during the illness — product identity, preparation, dose and last-taken time are NOT yet recorded (question-to-complete at the Herbal desk).');
  voice('History taken. Fever eight days. Two antipyretic doses. A herbal preparation is confirmed. Its details remain a question to complete at the herbal desk.','narrator');medStation();}
 else if(c==='EX'){M.ex=1;save();add('hist',8);
  Mlog('<span class="time">'+G.clock+'</span> <b>Focused examination:</b> pallor · delayed capillary refill · spleen palpable ~2 cm below costal margin · no haemorrhagic signs · no neck stiffness demonstrated · chest clear to auscultation · abdomen soft.');
  voice('Examination done. Pallor, delayed refill, spleen two centimetres.','narrator');medStation();}
 else if(c==='ORD'){M.ord=1;G.clock=TL.ord;save();add('inv',10);
  Mlog('<span class="time">'+TL.ord+'</span> <b>STAT ORDER → MLS</b> — '+esc(PAT.name)+' · 68 kg<br>FBC (EDTA) · Malaria RDT PfHRP2 (EDTA) · thick + thin film (EDTA) · fluoride glucose · serum urea/creatinine · electrolytes · LFTs · bicarbonate + lactate.<br><span class="mut">Collection: EDTA inverted 8–10×, fluoride per protocol, labelled at bedside with 2 identifiers + time.</span>');
  voice('STAT order sent to the laboratory. Bench timeline begins.','narrator');medStation();}
 else if(c==='READ'){
  if(!isRel('fbc')&&!isRel('chem')&&!isRel('rdt')&&!isRel('film')){
   Mlog('<div class="labr">Released results appear the moment the MLS workflow completes. Parallel work continues: review the Nursing observations (attributed, button 8b), refine the problem list, and commit the differential with whatever evidence is already released.</div>');
   voice('Results appear the moment the M L S workflow completes. Meanwhile, review the nursing observations, refine the problem list, and build the differential with released evidence.','narrator');
  }else{
   M.read=1;G.clock=TL.release;save();add('inv',10);add('inv',5);
   var out='';
   LABS.forEach(function(lb){if(isRel(lb.id)){out+='<b>'+lb.name+'</b> — released <span class="time">'+lb.time+'</span><br>';
    lb.rows.forEach(function(r){var rr=(someRange())?' <span class="mut">['+r[2]+']</span>':'';out+='· '+r[0]+': <b>'+esc(r[1])+'</b>'+rr+'<br>';});}});
   Mlog(out);
   G.clock=TL.crit;save();
   voice('Results released. Severe anaemia. Very low glucose. Deranged renal and hepatic lines. Antigen positive. Parasitaemia counted on the film.','narrator');
  }
  medStation();
 }
 else if(c==='HNO'){if(G.N.triage&&!M.hno){M.hno=1;save();add('hist',5);
   var nh='<div class="a"><span class="time">'+(G.N.hand?TL.ack:TL.triage)+'</span> <b>Nursing observations + handover (ATTRIBUTED to Nursing):</b> triage ZONE CRITICAL '+TL.triage+' · obs trend HR 126 → 112, T 40.1 → 39.6 · GCS components E3 V3 M4 after correction · capillary recheck 4.9 at 10:34 · fluid balance charted · '+(G.crit.sent?('critical call '+(G.crit.ack?('acknowledged '+TL.ack):'awaiting acknowledgement')):'monitoring continues')+(G.N.hand?' · structured SBAR handover delivered':' · SBAR handover pending')+'.<br><span class="mut">Attribution rule: the bedside picture reaches Medicine through DOCUMENTED nursing observations + handover — each department signs its own work.</span></div>';
   Mlog(nh);
   voice('Nursing observations retrieved through the attributed handover. The bedside picture arrives as documented nursing work. Each department signs its own record.','narrator');
  }medStation();}
 else if(c==='DIFF'){diffPage();}
 else if(c==='ACK'){if(G.crit.sent&&!G.crit.ack){G.crit.ack=1;M.ack=1;G.clock=TL.ack;save();add('inv',5);
  Mlog('<span class="time">'+TL.ack+'</span> <b>ACKNOWLEDGED:</b> Medicine received the critical glucose call at '+TL.ack+' — time, recipient, message and acknowledgement logged in the shared case record.');
  voice('Acknowledged. Critical glucose call received and logged. The communication loop is closed.','narrator');
 }medStation();}
 else medStation();
}
function Mlog(h){G.Mlog=(G.Mlog||'')+'<div class="a">'+h+'</div>';G.M.arr=(G.M.arr||[]);G.M.arr.push(h);if(G.M.arr.length>300)G.M.arr.shift();
 if(STEPVIEW.arr===G.M.arr)STEPVIEW.pos=G.M.arr.length-1;save();AUL(h,'Medicine');}
/* ---------- differential ---------- */
function diffPage(){
 var picks=G.diffPick||{};
 var opts=DIFFS_CASE.map(function(d){return '<button class="opt'+(picks[d.id]?' on':'')+'" data-dif="'+d.id+'">'+esc(d.label)+'</button>'+
 ((picks[d.id]&&G.diffDone)?'<div class="stage mut">For: '+esc(d.f)+'<br>Against: '+esc(d.a)+'</div>':'');}).join('');
 var done=G.diffDone?'<div class="a"><b>Differential committed</b> — for/against reasoning is in the shared record.</div>'+(G.GATE?'<button class="btn" id="toFinal">→ Proceed to the FINAL gate</button>':'<div class="warn">Not all bench evidence is released — the final gate stays closed.</div>'):'<button class="btn" id="commitD">Commit differential</button>';
 screen('<div class="brandbar"><div class="bb">THE CARPE DIEM GAMING EXPERIENCE</div><div class="bs">Case 01 · Differential gate · '+dOf().label+'</div></div>'+
 '<div class="card"><h1>🧠 Differential — build it with evidence</h1><p class="mut">Select the possibilities you will defend (at least two), then commit. Naming the leading one <i>with released evidence</i> earns the differential score; naming without evidence does not.</p>'+opts+done+
 '<button class="btn alt" id="bk">← back</button></div>');
 var bs=document.querySelectorAll('[data-dif]');
 for(var i=0;i<bs.length;i++)bs[i].onclick=function(){var id=this.dataset.dif;picks[id]=!picks[id];this.classList.toggle('on');G.diffPick=picks;save();diffPage();};
 var cb=el('commitD');
 if(cb)cb.onclick=function(){
  var n=0;for(var k in picks){if(picks[k])n++;}
  if(n<2){alert('A differential is a comparison — choose at least two.');return;}
  G.diffPick=picks;G.diffDone=1;save();
  var ok=DIFFS_CASE.some(function(d){return picks[d.id]&&d.ok;});
   AUL('<b>Differential committed</b> — possibilities weighed with for/against reasoning; leading pick '+(ok?'is supported by released evidence':'lacks this evidence'),'Medicine');
  add('diff_',ok?20:8);
  if(ok){G.FINALREADY=1;}
  save();
  voice(ok?'Differential committed. The leading possibility stands with released evidence behind it.':'Differential committed. Without the leading possibility, the score reflects an unsupported pick.','narrator');
  diffPage();
 };
 var tf=el('toFinal');if(tf)tf.onclick=finalPage;
 el('bk').onclick=function(){if(G.discipline==='medicine')medStation();else floorPage();};
}

function finalPage(){
 var ready=G.FINALREADY&&G.diffDone&&G.GATE;

 nursing:[

  {title:'2.4 PROCEDURE: TRIAGE',subs:[{h:'Intro',b:'2.4 PROCEDURE: TRIAGE'},{h:'What is triage?',b:'Triage is the process of assessing patients when they arrive at a healthcare facility to determine how urgently they need medical attention. It helps healthcare workers prioritise patients according to clinical urgency. Triage does not establish the final diagnosis. A patient can have a condition that is not yet diagnosed but still require immediate attention because of dangerous clinical findings.'},{h:'Purpose',b:'To identify patients who need immediate or urgent intervention and ensure that their level of priority reflects their clinical condition.'},{h:'Equipment',b:' Triage assessment form.  Thermometer.  Blood pressure monitor.  Pulse oximeter.  Watch or timer.  Glucose meter.  Stethoscope.  Patient identification record.  Personal protective equipment.'},{h:'Procedure',b:'Step 1: Receive the patient. Establish the reason for presentation and observe the patient\'s general condition. Step 2: Identify immediate danger.'},{h:'Check whether the patient has:',b:' Reduced consciousness.  Difficulty breathing.  Severe circulatory compromise.  Convulsions.  Severe bleeding.  Other immediately dangerous findings. Step 3: Obtain essential observations. Measure the appropriate vital signs and assess neurological responsiveness. Step 4: Identify clinical warning signs. Compare findings with the applicable triage framework. Step 5: Assign urgency. Use the hospital\'s validated triage system. Do not invent a triage category or assign one solely from an isolated measurement. Step 6: Escalate. Patients with immediately dangerous findings must be directed to urgent clinical assessment. Step 7: Document.'},{h:'Record:',b:' Arrival time.  Presenting complaint.  Observations.  Relevant warning signs.  Triage category.  Reason for the category.  Person notified.  Time of escalation.'},{h:'Application to Kwame',b:'Kwame\'s GCS of 8/15, glucose of 2.6 mmol/L, pulse of 126 beats per minute and blood pressure of 96/58 mmHg are serious findings. He should not be placed into a routine waiting pathway. The nurse must recognise the urgency and activate the appropriate emergency response.'},{h:'The student may encounter:',b:' A patient who appears unwell but has not yet had observations measured.  A patient whose vital signs are abnormal.  A patient with reduced consciousness.  A patient who deteriorates while waiting. The system should reward early recognition and appropriate escalation. It should penalise unnecessary delay.'}]},
  {title:'2.5 PROCEDURE: TEMPERATURE MEASUREMENT',subs:[{h:'Intro',b:'2.5 PROCEDURE: TEMPERATURE MEASUREMENT'},{h:'Purpose',b:'To measure body temperature and identify fever or an abnormally low temperature. Temperature provides information about the patient\'s thermoregulatory state. Fever may occur when inflammatory mediators alter the body\'s temperature-regulating set point. In malaria, fever can occur as infected red blood cells rupture and release parasite-related material that stimulates inflammatory responses.'},{h:'Equipment',b:' Appropriate clinical thermometer.  Disposable probe cover, where applicable.  Cleaning materials.  Documentation system.'},{h:'Procedure',b:'Step 1: Explain the procedure. Tell the patient what you are doing when they can understand and respond. Step 2: Select the measurement site. The method may be oral, axillary, tympanic or another approved route. The route used must be recorded because readings obtained through different methods are not always directly interchangeable. Step 3: Prepare the thermometer. Check that the device is clean, functional and suitable for the measurement site. Apply a disposable cover where required. Step 4: Position the thermometer correctly. Follow the equipment manufacturer\'s instructions and the approved clinical method. Step 5: Obtain the reading. Allow the device to complete its measurement cycle. Step 6: Read and assess the result. Record the temperature together with the measurement route. Step 7: Clean and store the equipment. Dispose of single-use covers and clean reusable equipment according to infection-prevention procedures. Step 8: Document and communicate. Record the result and report significant abnormalities according to the clinical pathway.'},{h:'Application to Kwame',b:'Recorded temperature: 40.1°C. This is a markedly elevated temperature. The student should recognise that fever alone does not establish malaria. It must be interpreted alongside the history, examination and investigations.'},{h:'Common errors',b:' Incorrect measurement site.  Incorrect positioning.  Device malfunction.  Failure to allow the measurement cycle to complete.  Failure to record the route.  Recording a previous reading as though it were current.'},{h:'The simulation should record:',b:' Measurement site.  Equipment used.  Reading.  Unit.  Timestamp.  Student action.  Whether the result was escalated.'}]},
  {title:'2.6 PROCEDURE: PULSE MEASUREMENT',subs:[{h:'Intro',b:'2.6 PROCEDURE: PULSE MEASUREMENT'},{h:'Purpose',b:'To assess heart rate and provide information about cardiovascular activity. The pulse represents the pressure wave generated when the heart ejects blood into the arterial circulation.'},{h:'Equipment',b:' Watch or timer with seconds.  Appropriate documentation system.  Stethoscope if an apical pulse is required.'},{h:'Procedure: Peripheral pulse',b:'Step 1: Position the patient. Ensure that the patient is positioned appropriately for the measurement. Step 2: Identify the pulse site. The radial artery at the wrist is commonly used when accessible. Step 3: Place the fingers correctly. Use the index and middle fingers to palpate the artery. Do not use the thumb because it has its own palpable pulse. Step 4: Assess the pulse.'},{h:'Evaluate:',b:' Rate.  Rhythm.  Volume or strength. Step 5: Count the pulse. Count for an appropriate duration. An irregular pulse requires a full assessment according to the clinical method rather than relying on a short estimate. Step 6: Record the findings. Record the rate in beats per minute and describe any relevant irregularity or abnormality.'},{h:'Application to Kwame',b:'Pulse: 126 beats per minute. This is tachycardia, meaning an abnormally fast heart rate.'},{h:'Possible contributors include:',b:' Fever.  Reduced circulating volume.  Physiological stress.  Anaemia.  Infection.  Other cardiovascular or metabolic disturbances. The pulse alone cannot establish which mechanism is responsible.'},{h:'Common errors',b:' Using the thumb.  Counting for an insufficient period.  Failing to assess rhythm.  Measuring immediately after activity without considering its effect.  Recording a number without the unit.'},{h:'The student should be able to select:',b:' Pulse site.  Measurement method.  Counting duration.  Pulse characteristics. The simulation should distinguish a correct measurement technique from a correct interpretation.'}]},
  {title:'2.7 PROCEDURE: BLOOD PRESSURE MEASUREMENT',subs:[{h:'Intro',b:'2.7 PROCEDURE: BLOOD PRESSURE MEASUREMENT'},{h:'Purpose',b:'To estimate arterial blood pressure and assess circulatory status.'},{h:'Blood pressure is recorded as:',b:' Systolic pressure: pressure during ventricular contraction.  Diastolic pressure: pressure during cardiac relaxation.'},{h:'Equipment',b:' Manual sphygmomanometer or validated automated blood pressure monitor.  Appropriate cuff size.  Stethoscope when using the manual method.  Documentation system.'},{h:'Scientific foundation',b:'Blood pressure is influenced by cardiac output and systemic vascular resistance. Cardiac output is the amount of blood pumped by the heart per minute. Systemic vascular resistance describes the resistance encountered by blood as it flows through the systemic circulation. Blood pressure is therefore affected by multiple physiological factors.'},{h:'Preparation',b:'Step 1: Explain the procedure. Explain the measurement to the patient where possible. Step 2: Position the patient. Use an appropriate position and support the arm. Step 3: Select the cuff. Choose a cuff appropriate for the patient\'s arm circumference. An incorrect cuff size can produce an inaccurate reading. Step 4: Position the cuff. Place it on the upper arm according to the device instructions. Step 5: Identify the measurement method. The simulation should distinguish automated measurement from manual auscultatory measurement.'},{h:'Manual measurement',b:'Step 1: Position the cuff correctly. Step 2: Locate the brachial artery. Step 3: Position the stethoscope over the appropriate arterial location. Step 4: Inflate the cuff according to the approved method. Step 5: Release pressure gradually. Step 6: Identify the first Korotkoff sound, which represents systolic pressure. Step 7: Identify the disappearance of the Korotkoff sounds, which generally represents diastolic pressure in adults. Step 8: Record the reading. The simulation must teach the meaning of Korotkoff sounds and must not reduce the process to simply selecting two numbers.'},{h:'Application to Kwame',b:'Blood pressure: 96/58 mmHg. This is a low reading that requires assessment in the context of the patient\'s condition.'},{h:'The nurse should consider:',b:' Pulse rate.  Peripheral perfusion.  Mental status.  Fluid balance.  Other signs of circulatory compromise. The student must not conclude that the patient has shock from one blood pressure reading alone, but must recognise the concerning combination of findings.'},{h:'Common errors',b:' Wrong cuff size.  Cuff positioned incorrectly.  Arm unsupported.  Patient movement.  Failure to allow an appropriate measurement.  Incorrect reading of Korotkoff sounds.  Failure to repeat or escalate an unexpected measurement when clinically indicated.'},{h:'Record:',b:' Systolic pressure.  Diastolic pressure.  Unit.  Arm and position where relevant.  Measurement method.  Timestamp.  Relevant clinical observations.'}]},
  {title:'2.8 PROCEDURE: RESPIRATORY RATE MEASUREMENT',subs:[{h:'Intro',b:'2.8 PROCEDURE: RESPIRATORY RATE MEASUREMENT'},{h:'Purpose',b:'To determine how many breaths the patient takes per minute and assess the pattern of breathing. Respiratory rate is an important indicator of physiological distress.'},{h:'It can change in response to:',b:' Fever.  Metabolic acidosis.  Hypoxaemia.  Pain.  Respiratory disease.  Circulatory compromise.'},{h:'Equipment',b:' Watch or timer.  Observation chart.'},{h:'Procedure',b:'Step 1: Observe the patient. Assess breathing without unnecessarily drawing attention to the measurement. Step 2: Observe chest or abdominal movement. Identify a complete respiratory cycle. One inspiration and one expiration constitute one breath. Step 3: Count the respiratory rate. Count over an appropriate interval. Step 4: Assess the breathing pattern.'},{h:'Look for:',b:' Regularity.  Depth.  Increased effort.  Accessory muscle use.  Abnormal sounds where assessable. Step 5: Record the result. Document breaths per minute and any abnormal characteristics.'},{h:'Application to Kwame',b:'Respiratory rate: 28 breaths per minute. This is tachypnoea, meaning an abnormally fast respiratory rate. Possible contributors include fever, metabolic acidosis, physiological stress or respiratory compromise. The bicarbonate of 17 mmol/L and lactate of 4.3 mmol/L are additional findings that require medical interpretation. The nurse should not independently diagnose the cause of the increased respiratory rate.'}]},
  {title:'2.9 PROCEDURE: PULSE OXIMETRY',subs:[{h:'Intro',b:'2.9 PROCEDURE: PULSE OXIMETRY'},{h:'Purpose',b:'To estimate peripheral oxygen saturation using a non-invasive optical device. Pulse oximetry estimates the percentage of haemoglobin carrying oxygen in pulsatile arterial blood.'},{h:'Equipment',b:' Pulse oximeter.  Appropriate sensor.  Documentation system.'},{h:'Scientific mechanism',b:'Pulse oximeters use light absorption characteristics of oxygenated and deoxygenated haemoglobin. The device analyses changes in light absorption associated with pulsatile blood flow to estimate oxygen saturation. The result is an estimate, not a direct measurement of arterial oxygen tension.'},{h:'Procedure',b:'Step 1: Select the measurement site. A finger is commonly used when suitable. Step 2: Assess the site.'},{h:'Check for factors that may interfere with measurement, including:',b:' Poor peripheral perfusion.  Excessive movement.  Cold extremities.  Nail products or artificial nails where relevant.  Sensor positioning problems. Step 3: Apply the sensor. Position the sensor according to the equipment instructions. Step 4: Allow the reading to stabilise. Do not record an unstable display as a reliable result. Step 5: Assess the displayed result. Record oxygen saturation and pulse information. Step 6: Interpret in context. Consider the patient\'s breathing, circulation, clinical appearance and other findings.'},{h:'Application to Kwame',b:'SpO2: 94%. This reading should be interpreted in clinical context. The simulation must not assume that a reading of 94% automatically means the patient requires a particular oxygen intervention. The need for oxygen and the appropriate target must be determined using the clinical assessment and applicable protocol.'},{h:'Common errors',b:' Poor sensor positioning.  Patient movement.  Cold extremities.  Poor perfusion.  Unstable signal.  Treating the reading as perfectly accurate in every circumstance.'}]},
  {title:'2.10 PROCEDURE: GLASGOW COMA SCALE ASSESSMENT',subs:[{h:'Intro',b:'2.10 PROCEDURE: GLASGOW COMA SCALE ASSESSMENT'},{h:'Purpose',b:'To assess and document the patient\'s level of consciousness using three components: 1. Eye opening. 2. Verbal response. 3. Motor response. The Glasgow Coma Scale is commonly abbreviated as GCS.'},{h:'Equipment',b:' Assessment chart.  Pen or electronic record.  Appropriate environment for neurological assessment.'},{h:'The examiner assesses whether the patient opens their eyes:',b:' Spontaneously.  In response to voice.  In response to pressure.  Not at all.'},{h:'The examiner assesses whether the patient:',b:' Is oriented.  Is confused.  Produces inappropriate words.  Produces incomprehensible sounds.  Makes no verbal response. If verbal assessment cannot be performed for a reason such as intubation, that limitation must be recorded rather than assigning an ordinary verbal score without explanation.'},{h:'The examiner assesses whether the patient:',b:' Obeys commands.  Localises a stimulus.  Withdraws from a stimulus.  Demonstrates abnormal flexion.  Demonstrates extension.  Makes no motor response. The assessment must use an approved technique and appropriate training.'},{h:'Procedure',b:'Step 1: Establish the patient\'s baseline condition. Observe the patient before testing. Step 2: Assess eye opening. Record the appropriate response. Step 3: Assess verbal response. Use an appropriate verbal prompt. Step 4: Assess motor response. Assess the best motor response using the appropriate examination method. Step 5: Calculate the total score. The three components are added to produce a total score from 3 to 15. Step 6: Record the individual components. Do not document only the total. Step 7: Compare with previous observations. A reduction in GCS can indicate deterioration. Step 8: Escalate concerning findings. A significantly reduced GCS requires urgent clinical attention.'},{h:'Application to Kwame',b:'GCS: 8/15. This indicates a significant reduction in consciousness. However, the patient also has a blood glucose concentration of 2.6 mmol/L. Hypoglycaemia can cause altered consciousness. The simulation must therefore teach the importance of identifying and correcting the low glucose and reassessing consciousness. The GCS score alone must not be used to declare cerebral malaria.'},{h:'Simulation branches',b:' Student records the GCS correctly and escalates.  Student records only a total score without components.  Student fails to recognise the severity of the reduction.  Student fails to reassess after glucose correction.  Patient\'s consciousness changes during subsequent monitoring.'}]},
  {title:'2.11 PROCEDURE: CAPILLARY BLOOD GLUCOSE MEASUREMENT',subs:[{h:'Intro',b:'2.11 PROCEDURE: CAPILLARY BLOOD GLUCOSE MEASUREMENT'},{h:'Purpose',b:'To obtain a rapid estimate of blood glucose using a point-of-care glucose meter. This is particularly important in patients with altered consciousness because low blood glucose may cause neurological dysfunction.'},{h:'Equipment',b:' Glucose meter.  Compatible test strips.  Single-use safety lancet.  Gloves.  Appropriate skin-cleaning materials.  Gauze or cotton.  Sharps disposal container.'},{h:'Scientific mechanism',b:'Glucose meters use an analytical reaction within the test strip. Depending on the device, the strip contains an enzyme-based system that reacts with glucose. The resulting electrical or optical signal is converted into an estimated glucose concentration. Different devices use different analytical technologies.'},{h:'Procedure',b:'Step 1: Identify the patient. Confirm the correct patient record. Step 2: Explain the procedure. Explain that a small blood sample will be taken from the fingertip when the patient can understand. Step 3: Prepare the equipment.'},{h:'Check:',b:' Meter function.  Test-strip compatibility.  Strip expiry.  Storage conditions.  Device quality-control status according to policy. Step 4: Prepare the sampling site. Select an appropriate finger and site. Clean according to the approved method and allow the site to dry where required. Step 5: Obtain the blood sample. Use a single-use safety lancet. Avoid excessive squeezing because tissue fluid contamination can affect the sample. Step 6: Apply the sample. Apply the blood to the test strip according to the meter instructions. Step 7: Read the result. Allow the device to complete the measurement. Step 8: Interpret and communicate. A concerning low result must be communicated promptly and managed through the approved clinical pathway. Step 9: Dispose of equipment. Discard the lancet immediately into an approved sharps container. Step 10: Document. Record the result, time, method and relevant action taken.'},{h:'Application to Kwame',b:'Capillary glucose: 2.6 mmol/L. This is an important abnormal finding. The student must recognise that hypoglycaemia can contribute to altered consciousness and requires urgent attention. The result should be communicated to the responsible clinician. A point-of-care result and a laboratory glucose result are not automatically interchangeable. Differences may occur because of sample type, device performance, perfusion and analytical factors.'}]},
  {title:'2.12 PROCEDURE: FLUID BALANCE MONITORING',subs:[{h:'Intro',b:'2.12 PROCEDURE: FLUID BALANCE MONITORING'},{h:'Purpose',b:'To monitor fluid intake and output and provide information about the patient\'s fluid status. This is important in severe malaria because renal dysfunction and circulatory abnormalities may coexist. Fluid administration must be carefully assessed because excessive fluid can cause harm.'},{h:'Equipment',b:' Fluid balance chart.  Measuring container.  Urine collection equipment where indicated.  Intravenous fluid record.  Electronic documentation system.'},{h:'Procedure',b:'Step 1: Establish the monitoring period. Record the time from which fluid balance monitoring begins. Step 2: Record fluid intake.'},{h:'Include relevant sources:',b:' Oral fluids.  Intravenous fluids.  Fluid-containing medications where required by the charting system.  Other documented fluid sources. Step 3: Record fluid output.'},{h:'Include:',b:' Urine.  Vomitus.  Drain output where applicable.  Other measurable losses. Step 4: Measure accurately. Use appropriate measuring equipment. Do not estimate a measurable volume when accurate measurement is available. Step 5: Calculate the balance. Fluid balance is calculated as total intake minus total measured output over the specified period. Step 6: Assess trends. Look for changes in urine output, intake, output and clinical condition. Step 7: Communicate concerns. Report concerning changes to the responsible clinical team.'},{h:'Application to Kwame',b:'The patient\'s urea is 12 mmol/L and creatinine is 150 µmol/L. These results require medical assessment of renal function. Nursing should monitor urine output and fluid balance according to the prescribed care plan. The simulation must not automatically prescribe a fluid volume simply because the patient has a low blood pressure.'},{h:'Important teaching point',b:'Fluid management in adult severe malaria requires caution. Both inadequate perfusion and fluid overload can be dangerous. The student should understand the importance of repeated assessment rather than treating fluid administration as a fixed, automatic response.'}]},
  {title:'2.13 PROCEDURE: MEDICATION ADMINISTRATION',subs:[{h:'Intro',b:'2.13 PROCEDURE: MEDICATION ADMINISTRATION'},{h:'Purpose',b:'To administer prescribed medication safely and accurately.'},{h:'Required checks',b:'The nurse must follow the institution\'s medication-administration policy.'},{h:'The simulation should teach checks relating to:',b:' Correct patient.  Correct medicine.  Correct dose.  Correct route.  Correct time.  Correct documentation.  Correct indication.  Allergy status.  Relevant monitoring.  Patient response. The exact required checks may vary by institutional policy.'},{h:'Procedure',b:'Step 1: Review the prescription. Confirm that the medication has been prescribed by an authorised professional. Step 2: Identify the patient. Use the approved identification procedure. Step 3: Review allergies and contraindications. Check the record and clarify uncertainties. Step 4: Verify the medication. Check the label, formulation, strength, expiry and integrity. Step 5: Confirm the dose and route. Ensure that the medication matches the prescription. Step 6: Prepare the medication. Follow the product instructions and local policy. Step 7: Explain the medication. Provide appropriate information to the patient when possible. Step 8: Administer. Use the prescribed route and appropriate technique. Step 9: Monitor. Observe for expected effects, adverse reactions and clinical response. Step 10: Document. Record the medicine, dose, route, time, administering professional and relevant response.'},{h:'Case-specific relevance',b:'Kwame requires urgent treatment for severe malaria. Nursing may be involved in administering prescribed intravenous artesunate after the medication has been appropriately prescribed, prepared and supplied. The nurse must not independently alter the prescription.'}]},
  {title:'2.14 PROCEDURE: NURSING-TO-MEDICINE HANDOVER',subs:[{h:'Intro',b:'2.14 PROCEDURE: NURSING-TO-MEDICINE HANDOVER'},{h:'Purpose',b:'To communicate the patient\'s condition and relevant findings to the medical team. A handover is not simply telling the doctor that the patient is unwell. It should communicate the information needed to understand the situation and take appropriate action.'},{h:'Example handover',b:'"Doctor, I am calling about Kwame Mensah, a 29-year-old male who has presented with fever, vomiting and reduced consciousness. His temperature is 40.1°C, pulse is 126 beats per minute, blood pressure is 96/58 mmHg and respiratory rate is 28 breaths per minute. His oxygen saturation is 94%, GCS is 8/15 and capillary blood glucose is 2.6 mmol/L. I am concerned about his reduced consciousness, low glucose and circulatory findings. He requires urgent medical assessment."'},{h:'Record:',b:' Sender.  Recipient.  Department.  Patient identity.  Information communicated.  Urgency.  Time.  Recipient acknowledgement.  Action requested.  Response. A handover is not complete merely because the sender clicks "send".'}]},
 ],
 medicine:[
  {title:'3.2 PROCEDURE: RECEIVING AND REVIEWING NURSING HANDOVER',subs:[{h:'Intro',b:'3.2 PROCEDURE: RECEIVING AND REVIEWING NURSING HANDOVER'},{h:'Purpose',b:'To receive the initial clinical information from Nursing and establish the patient\'s immediate problems.'},{h:'Procedure',b:'Step 1: Receive the handover. Review the information communicated by Nursing. Step 2: Confirm patient identity. Ensure that the correct patient record is open. Step 3: Review observations.'},{h:'Examine:',b:' Temperature.  Pulse.  Blood pressure.  Respiratory rate.  Oxygen saturation.  GCS.  Capillary glucose. Step 4: Identify immediate threats. Consider the patient\'s reduced consciousness, low glucose, circulatory findings and respiratory rate. Step 5: Determine the need for urgent assessment. The medical student should not proceed as though this is a routine outpatient consultation. Step 6: Acknowledge the handover. The system should record that the information has been received.'},{h:'Learning point',b:'The doctor does not need to repeat every procedure already performed by Nursing. The doctor should review the findings, confirm what requires reassessment and perform additional clinical examination when indicated.'}]},
  {title:'3.3 PROCEDURE: INITIAL CLINICAL STABILISATION ASSESSMENT',subs:[{h:'Intro',b:'3.3 PROCEDURE: INITIAL CLINICAL STABILISATION ASSESSMENT'},{h:'Purpose',b:'To identify and address immediate threats to life before completing the full diagnostic assessment.'},{h:'ABCDE stands for:',b:' Airway.  Breathing.  Circulation.  Disability.  Exposure.'},{h:'A — Airway',b:'Assess whether the airway is open and whether the patient can maintain airway protection.'},{h:'Consider:',b:' Airway obstruction.  Abnormal airway sounds.  Vomiting or secretions.  Reduced consciousness.  Risk of aspiration. Kwame\'s GCS of 8/15 makes airway protection an important concern. The medical student must recognise the need for urgent senior assessment and appropriate airway management. The simulation should not allow a student to treat a reduced GCS as a minor finding.'},{h:'Assess:',b:' Respiratory rate.  Work of breathing.  Chest movement.  Oxygen saturation.  Relevant respiratory examination findings. Kwame\'s respiratory rate is 28 breaths per minute and SpO2 is 94%. The clinician must interpret these findings alongside the metabolic and circulatory state.'},{h:'Assess:',b:' Pulse.  Blood pressure.  Peripheral perfusion.  Capillary refill.  Skin temperature.  Urine output.  Evidence of bleeding.  Relevant laboratory findings. Kwame has a pulse of 126 beats per minute and blood pressure of 96/58 mmHg. The examination also identifies delayed capillary refill. These findings require urgent assessment of circulation and possible impaired perfusion.'},{h:'Assess:',b:' Level of consciousness.  GCS.  Pupillary findings where indicated.  Capillary glucose.  Seizure activity.  Other neurological abnormalities. Kwame\'s glucose of 2.6 mmol/L is a major finding. The clinician must address hypoglycaemia through the appropriate treatment pathway and reassess neurological status.'},{h:'E — Exposure',b:'Perform an appropriate examination while preserving dignity and preventing heat loss.'},{h:'Assess:',b:' Temperature.  Pallor.  Skin findings.  Signs of bleeding.  Other relevant physical findings.'},{h:'Implementation',b:'The simulation should allow the student to move through ABCDE rather than presenting one combined "assess patient" button.'},{h:'Each section should have:',b:' Examination options.  Relevant findings.  Clinical significance.  Escalation triggers.  Documentation.'}]},
  {title:'3.4 PROCEDURE: HISTORY TAKING',subs:[{h:'Intro',b:'3.4 PROCEDURE: HISTORY TAKING'},{h:'Purpose',b:'To obtain information about the patient\'s illness, background, risk factors and relevant exposures. History taking helps the clinician understand the progression of the illness and develop possible explanations.'},{h:'Equipment',b:' Patient record.  Clinical history form.  Documentation system.'},{h:'Procedure',b:'Step 1: Establish communication. Introduce yourself, confirm identity and explain the purpose of the assessment. Step 2: Assess the patient\'s ability to provide a history. Kwame has reduced consciousness. The clinician must determine whether he can provide reliable information. Step 3: Obtain the presenting complaint. Identify the main reason for presentation. Step 4: Explore the history of the presenting illness.'},{h:'Ask about:',b:' Onset.  Duration.  Progression.  Fever pattern.  Chills.  Headache.  Weakness.  Appetite.  Vomiting.  Changes in consciousness.  Collapse. Step 5: Obtain relevant malaria history.'},{h:'Explore:',b:' Previous malaria episodes.  Previous treatment.  Recent antimalarial medication.  Preventive measures where relevant.  Possible exposure history. Step 6: Obtain medication history. Ask about prescribed medicines, over-the-counter medicines and other substances used. Step 7: Obtain allergy history. Clarify known allergies and previous reactions. Step 8: Obtain relevant medical history. Ask about previous illnesses, hospital admissions and relevant chronic conditions. Step 9: Obtain social and occupational history. Kwame is a cocoa farmer from Ejisu. The occupational and geographical context may contribute to exposure assessment, but it must not be treated as proof of malaria. Step 10: Document the information. Separate confirmed information from assumptions and unavailable history.'},{h:'Collateral history',b:'If the patient cannot provide a reliable account, the clinician may seek information from an appropriate accompanying person.'},{h:'The simulation must distinguish:',b:' Information reported by the patient.  Information reported by another person.  Information observed directly.  Information not yet established. Do not invent family relationships or additional history.'}]},
  {title:'3.5 PROCEDURE: PHYSICAL EXAMINATION',subs:[{h:'Intro',b:'3.5 PROCEDURE: PHYSICAL EXAMINATION'},{h:'Purpose',b:'To identify physical signs that support or challenge the clinician\'s diagnostic hypotheses.'},{h:'Assess:',b:' General appearance.  Level of consciousness.  Pallor.  Jaundice where relevant.  Hydration and perfusion.  Nutritional appearance.  Temperature.  Other relevant visible findings.'},{h:'Assess:',b:' Pulse characteristics.  Heart rate.  Heart sounds.  Peripheral perfusion.  Capillary refill.  Blood pressure.'},{h:'Assess:',b:' Respiratory rate.  Chest movement.  Work of breathing.  Breath sounds.  Signs of respiratory compromise.'},{h:'Assess:',b:' Abdominal appearance.  Tenderness.  Organ enlargement.  Other relevant findings. Kwame has a palpable spleen approximately 2 cm below the costal margin. The student should understand that splenic enlargement can occur in malaria but is not independently diagnostic.'},{h:'Assess:',b:' Consciousness.  GCS.  Pupillary response where indicated.  Motor response.  Relevant neurological signs.  Seizure activity.'},{h:'Documentation',b:'Record positive and negative findings accurately. Do not turn an unexamined feature into a negative finding. For example, if the abdominal examination has not been completed, the system must not automatically document "abdomen normal".'}]},
  {title:'3.6 PROCEDURE: FORMULATING DIFFERENTIAL DIAGNOSES',subs:[{h:'Intro',b:'3.6 PROCEDURE: FORMULATING DIFFERENTIAL DIAGNOSES'},{h:'Purpose',b:'To develop a list of possible explanations for the patient\'s clinical presentation. A differential diagnosis is not the same as a final diagnosis. The student should formulate possible diagnoses before all investigation results are available.'},{h:'Kwame presents with:',b:' Eight days of fever.  Chills.  Headache.  Weakness.  Poor appetite.  Vomiting.  Confusion.  Collapse.'},{h:'Possible diagnostic considerations may include:',b:' Severe malaria.  Sepsis from another infection.  Meningitis or encephalitis.  Severe metabolic disturbance.  Other causes of altered consciousness. The exact differential list should be controlled by the case design.'},{h:'Procedure',b:'Step 1: Identify the major clinical problems.'},{h:'For example:',b:' Fever.  Altered consciousness.  Hypoglycaemia.  Anaemia.  Possible circulatory compromise. Step 2: Generate possible explanations. Consider conditions that could produce the observed combination. Step 3: Identify supporting evidence. For each possibility, record which findings support it. Step 4: Identify contradictory or missing evidence. Do not ignore findings that do not fit. Step 5: Select investigations. Choose investigations that help distinguish between the possibilities. Step 6: Revise the differential. As results become available, update the assessment.'},{h:'The simulation must maintain four separate concepts:',b:'Initial impression: The clinician\'s first interpretation. Differential diagnosis: The list of possible conditions. Working diagnosis: The leading explanation based on currently available evidence. Final diagnosis: The diagnosis formally established and recorded by the responsible clinician after the relevant assessment. Do not force the student to select malaria before seeing the evidence.'}]},
  {title:'3.7 PROCEDURE: SELECTING AND REQUESTING INVESTIGATIONS',subs:[{h:'Intro',b:'3.7 PROCEDURE: SELECTING AND REQUESTING INVESTIGATIONS'},{h:'Purpose',b:'To select investigations that answer specific clinical questions. The student must learn why an investigation is being requested rather than ordering every available test automatically.'},{h:'Purpose:',b:' Assess haemoglobin.  Assess red blood cell indices.  Assess white blood cell count.  Assess platelet count.'},{h:'Purpose:',b:' Detect malaria parasites.  Identify parasite species.  Estimate parasitaemia when the method supports it.'},{h:'Clinical question:',b:' Is malaria parasitaemia demonstrated, and what is the reported species and density?'},{h:'Purpose:',b:' Detect malaria antigen using an immunochromatographic method.'},{h:'Purpose:',b:' Identify hypoglycaemia or hyperglycaemia.'},{h:'Purpose:',b:' Assess renal biochemical abnormalities.  Assess electrolyte disturbances.'},{h:'Purpose:',b:' Assess bilirubin and relevant enzyme measurements.'},{h:'Purpose:',b:' Assess metabolic disturbance and possible impaired tissue perfusion.'},{h:'Clinical question:',b:' Is there evidence of metabolic acidosis or elevated lactate requiring urgent clinical interpretation?'},{h:'Purpose:',b:' Establish blood group and assess compatibility if transfusion is considered.'},{h:'Clinical question:',b:' Is compatible blood available if the responsible clinician decides transfusion is indicated?'},{h:'Requesting procedure',b:'Step 1: Select the investigation. Step 2: Identify the clinical indication. Step 3: Select the correct patient. Step 4: Enter the priority. Step 5: Confirm the requested investigation. Step 6: Transmit the request to MLS. Step 7: Review the request status.'},{h:'Every investigation request must record:',b:' Patient.  Requesting clinician.  Department.  Investigation.  Clinical indication.  Priority.  Request timestamp.  Specimen requirements.  Request status. The student must understand that ordering a test does not mean the test has already been performed.'}]},
  {title:'3.8 PROCEDURE: INTERPRETING MALARIA INVESTIGATIONS',subs:[{h:'Intro',b:'3.8 PROCEDURE: INTERPRETING MALARIA INVESTIGATIONS'},{h:'Purpose',b:'To interpret malaria results in the context of the patient\'s clinical condition.'},{h:'Malaria rapid diagnostic test',b:'Kwame\'s PfHRP2 rapid diagnostic test is positive. PfHRP2 means Plasmodium falciparum histidine-rich protein 2. The test detects a malaria-related antigen.'},{h:'The student must understand that:',b:' A positive test indicates detection of the targeted antigen.  It does not independently establish the severity of malaria.  Antigen may remain detectable after parasites have cleared.  Results must be interpreted with microscopy and clinical findings.'},{h:'Thick blood film',b:'The thick film is designed to concentrate blood elements in a small examination area. It is particularly useful for detecting malaria parasites. The student should understand why thick films are used for parasite detection.'},{h:'Thin blood film',b:'The thin film preserves red blood cell morphology and is useful for identifying parasite species and assessing parasite density using the appropriate method.'},{h:'Case results',b:' Thick film: Positive.  Thin film: P. falciparum ring forms.  Reported parasitaemia: 7.8%. The 7.8% figure must be tied to the validated calculation method and denominator used by the laboratory. The simulation must not silently change the denominator or present an unvalidated calculation as fact.'}]},
  {title:'3.9 PROCEDURE: INTERPRETING THE FULL BLOOD COUNT',subs:[{h:'Intro',b:'3.9 PROCEDURE: INTERPRETING THE FULL BLOOD COUNT'},{h:'Purpose',b:'To assess the patient\'s blood cell profile and identify abnormalities that may influence clinical management.'},{h:'Haemoglobin',b:'6.6 g/dL'},{h:'Haematocrit',b:'20%'},{h:'Red blood cells',b:'2.75 × 1012/L'},{h:'MCV',b:'88 fL'},{h:'White blood cells',b:'13.6 × 109/L'},{h:'Neutrophils',b:'82%'},{h:'Platelets',b:'68 × 109/L'},{h:'Haemoglobin',b:'Haemoglobin is the oxygen-carrying protein in red blood cells. The result of 6.6 g/dL indicates severe anaemia. The student should understand that severe anaemia can reduce oxygen delivery to tissues.'},{h:'Haematocrit',b:'Haematocrit is the proportion of blood volume occupied by red blood cells. The result is 20%. It supports the presence of significant anaemia.'},{h:'Red blood cell count',b:'The RBC count is 2.75 × 1012/L. This indicates a reduced red blood cell count in the context of the case.'},{h:'MCV',b:'MCV means mean corpuscular volume. It describes the average volume of an individual red blood cell. The result of 88 fL is within the usual adult normocytic range, subject to the laboratory\'s validated reference interval. The anaemia is therefore described as normocytic by MCV.'},{h:'White blood cell count',b:'The WBC count is 13.6 × 109/L. WBC means white blood cell. The count is elevated relative to many adult reference intervals.'},{h:'Neutrophils',b:'Neutrophils are a type of white blood cell involved in innate immune defence. The neutrophil proportion is 82%. This should be interpreted alongside the total white blood cell count and clinical picture.'},{h:'Platelets',b:'Platelets are cell fragments involved in blood clotting. The count of 68 × 109/L indicates thrombocytopenia. The student should understand that thrombocytopenia can occur in malaria and may increase concern about bleeding risk, although the platelet count alone does not determine whether bleeding will occur.'},{h:'The medical student should recognise:',b:' Significant anaemia.  Thrombocytopenia.  Elevated white blood cell count.  Positive malaria investigations. These findings contribute to the overall assessment but must not be interpreted in isolation.'}]},
  {title:'3.10 PROCEDURE: INTERPRETING GLUCOSE AND RENAL/METABOLIC RESULTS',subs:[{h:'Intro',b:'3.10 PROCEDURE: INTERPRETING GLUCOSE AND RENAL/METABOLIC RESULTS'},{h:'Glucose',b:'Result: 2.6 mmol/L. This is a low glucose concentration.'},{h:'Hypoglycaemia can cause:',b:' Confusion.  Reduced consciousness.  Seizures.  Other neurological manifestations. In Kwame\'s case, this result is especially important because he has a GCS of 8/15. The clinician must ensure that the low glucose is addressed and consciousness reassessed.'},{h:'Sodium',b:'Result: 130 mmol/L. Sodium is an important extracellular electrolyte involved in fluid balance and neurological function. The result indicates hyponatraemia. The clinician must consider its severity, context and possible contribution to neurological symptoms.'},{h:'Potassium',b:'Result: 4.4 mmol/L. Interpret using the laboratory\'s reference interval and clinical context.'},{h:'Urea',b:'Result: 12 mmol/L. Urea is a nitrogen-containing waste product formed during protein metabolism and excreted through the kidneys. An elevated concentration can occur in renal dysfunction, reduced perfusion and other circumstances.'},{h:'Creatinine',b:'Result: 150 µmol/L. Creatinine is a waste product associated with muscle metabolism and is used in assessing renal function. The result requires interpretation with baseline information, urine output and other clinical findings. A single creatinine value does not independently establish the full nature or duration of renal impairment.'},{h:'Bilirubin',b:'Result: 42. The unit must be verified in the case source before implementation. Bilirubin is produced during haemoglobin breakdown and is processed by the liver. An elevated bilirubin result may reflect increased red cell destruction, impaired hepatic handling or other causes.'},{h:'Results:',b:' AST: 78.  ALT: 65. The units and reference intervals must be validated. AST and ALT are enzymes used in assessing cellular injury, including possible liver involvement. They are not direct measurements of liver function.'},{h:'Bicarbonate',b:'Result: 17 mmol/L. Bicarbonate contributes to the body\'s acid-base buffering system. A reduced concentration may be associated with metabolic acidosis.'},{h:'Lactate',b:'Result: 4.3 mmol/L. Lactate may rise when production and clearance become imbalanced. An elevated lactate can occur in impaired tissue perfusion and other metabolic states. It must be interpreted with the patient\'s circulation and overall condition.'}]},
  {title:'3.11 PROCEDURE: REASSESSING CONSCIOUSNESS AFTER GLUCOSE',subs:[{h:'Intro',b:'3.11 PROCEDURE: REASSESSING CONSCIOUSNESS AFTER GLUCOSE'},{h:'Purpose',b:'To determine whether the patient\'s neurological condition improves after the low glucose has been addressed.'},{h:'Procedure',b:'Step 1: Review the initial GCS and glucose result. Step 2: Ensure that the hypoglycaemia is managed through the appropriate clinical pathway. Step 3: Repeat glucose measurement at the clinically appropriate time. Step 4: Repeat neurological assessment. Step 5: Compare the new GCS with the original components and total. Step 6: Document the response. Step 7: Escalate persistent or worsening altered consciousness.'},{h:'Important diagnostic principle',b:'Kwame\'s reduced consciousness must not automatically be attributed to cerebral malaria. Hypoglycaemia is a competing and potentially reversible explanation. The student must understand that neurological reassessment after glucose correction is essential. The final diagnosis must follow validated diagnostic criteria and clinical review.'}]},
  {title:'3.12 PROCEDURE: FORMULATING THE WORKING DIAGNOSIS',subs:[{h:'Intro',b:'3.12 PROCEDURE: FORMULATING THE WORKING DIAGNOSIS The working diagnosis should evolve as evidence becomes available.'},{h:'The student may consider several possible causes of:',b:' Fever.  Vomiting.  Altered consciousness.  Collapse.'},{h:'After initial investigations',b:'The positive malaria microscopy, positive PfHRP2 test and clinical presentation increase the likelihood of severe falciparum malaria. The severe anaemia, hypoglycaemia and other biochemical abnormalities contribute to the assessment.'},{h:'Working diagnosis',b:'Severe Plasmodium falciparum malaria with severe anaemia, hypoglycaemia and associated renal/metabolic abnormalities requiring assessment. The possibility of cerebral malaria must be assessed using validated criteria and reassessment after addressing hypoglycaemia.'},{h:'Final diagnosis gate',b:'Only the responsible doctor in the Medicine workflow may release the final diagnosis.'},{h:'The student should:',b:'1. Review the available evidence. 2. Review the differential diagnoses. 3. Identify the main diagnosis. 4. Record relevant complications or associated abnormalities. 5. Explain the reasoning. 6. Submit the final diagnosis for release. The final diagnosis must not appear automatically before the student completes the required reasoning.'}]},
