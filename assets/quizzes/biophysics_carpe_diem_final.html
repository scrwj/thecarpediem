<script>
const SPEC = {"title": "Biophysics: The Energy Furnace", "story": "Medical Village. The Furnace has gone cold. Answer with real biophysics to relight it and face the Warden.", "theme": {"accent": "#6c8cff"}, "slides": [{"n": 1, "title": "Glycolysis overview", "text": "Glycolysis occurs in the cytosol.\nIt converts one glucose (6 carbons) into two pyruvate (3 carbons).\nNet yield: 2 ATP (4 produced, 2 consumed in the investment phase) and 2 NADH per glucose.\nUnder anaerobic conditions pyruvate is reduced to lactate by lactate dehydrogenase (LDH), regenerating NAD+."}, {"n": 2, "title": "Key steps of glycolysis", "text": "1. Glucose is phosphorylated to glucose-6-phosphate by hexokinase\n2. Glucose-6-phosphate is isomerized to fructose-6-phosphate\n3. Fructose-6-phosphate is phosphorylated to fructose-1,6-bisphosphate by phosphofructokinase-1\n4. Aldolase splits fructose-1,6-bisphosphate into two triose phosphates\n5. Glyceraldehyde-3-phosphate is oxidized to 1,3-bisphosphoglycerate, producing NADH\n6. 1,3-bisphosphoglycerate transfers a phosphate to ADP, forming ATP and 3-phosphoglycerate\n7. Phosphoenolpyruvate transfers a phosphate to ADP, forming pyruvate and ATP"}, {"n": 3, "title": "Enzyme classes", "text": "Oxidoreductases: catalyze oxidation-reduction reactions (e.g. lactate dehydrogenase)\nTransferases: transfer a functional group between molecules (e.g. hexokinase)\nHydrolases: cleave bonds using water (e.g. lipase)\nLyases: cleave bonds without water or oxidation (e.g. aldolase)"}, {"n": 4, "title": "Regulation of glycolysis", "text": "Phosphofructokinase-1 (PFK-1) is the main rate-limiting enzyme of glycolysis.\nPFK-1 is inhibited by ATP and citrate, and activated by AMP and fructose-2,6-bisphosphate.\nHexokinase is inhibited by its own product, glucose-6-phosphate.\nPyruvate kinase is activated by fructose-1,6-bisphosphate (feed-forward activation)."}, {"n": 5, "title": "Glucose in the lab", "text": "Red blood cells keep carrying out glycolysis in a collected sample, so glucose in unseparated blood falls by about 5-7% per hour.\nFluoride oxalate tubes (grey top) inhibit glycolysis, so glucose is preserved for measurement.\nSeparate plasma from cells promptly if the sample is not in a preservative tube."}], "levels": [{"game": "quiz", "title": "The Bridge — The Vault Door", "items": [{"q": "What is biophysics?", "options": ["Biology that avoids all mathematics", "Applying the theories and methods of physics to understand how biological systems work", "The study of ecosystems only", "The chemistry of non-living matter"], "answer": 1, "explain": "Correct. Biophysics applies the theories and methods of physics to understand how biological systems work.", "slide": 1}, {"q": "Which technique diffracts X-rays through crystals to reveal the atomic structure of proteins and DNA?", "options": ["Spirometry", "Patch clamping", "Fluorescence microscopy", "X-ray crystallography"], "answer": 3, "explain": "Correct. X-ray crystallography gives atomic-resolution structures of proteins and nucleic acids.", "slide": 1}, {"q": "Which of these is a diagnostic imaging technique developed with biophysics?", "options": ["Kidney dialysis", "Cardiac pacemaker", "PET scan", "Radiation therapy"], "answer": 2, "explain": "Correct. PET, along with MRI and CT, is a diagnostic imaging technique.", "slide": 1}, {"q": "Why have maths and statistics become essential in biology?", "options": ["Experiments now produce huge amounts of data that must be modelled", "Living things contain no chemistry", "Physics is easier than biology", "Calculators became cheaper"], "answer": 0, "explain": "Correct. Modern experiments generate huge datasets, so models and statistics are needed to understand them and predict how systems work.", "slide": 1}, {"q": "Which form of energy is associated with membrane potentials and nerve impulses?", "options": ["Electrical", "Chemical", "Mechanical", "Thermal"], "answer": 0, "explain": "Correct. Electrical energy is tied to membrane potentials and nerve impulses.", "slide": 1}]}, {"game": "quiz", "title": "Fuel, Fire and Calories — Furnace Room", "items": [{"q": "In nutrition, food energy is given in kilocalories. How does one kcal compare with one small calorie (cal)?", "options": ["1 kcal = 1 cal", "1 kcal = 100 cal", "1 kcal = 1000 cal", "1 kcal = 0.001 cal"], "answer": 2, "explain": "Correct. One kcal is 1000 cal, and the kilojoule is the SI unit of food energy.", "slide": 1}, {"q": "Per kilogram, which fuel releases about twice as much energy as carbohydrate or protein?", "options": ["Protein", "Fat", "Glucose", "Dietary fibre"], "answer": 1, "explain": "Correct. Fat releases about 39.4 MJ per kg against 17.2 for carbohydrate.", "slide": 1}, {"q": "Complete aerobic respiration of a fuel yields which products?", "options": ["Lactic acid and energy", "Glycerol and amino acids", "Oxygen and glucose", "Water, carbon dioxide and energy"], "answer": 3, "explain": "Correct. Fuel plus oxygen gives water, carbon dioxide and energy.", "slide": 1}, {"q": "In extreme starvation such as marasmus, which macronutrient, rarely used as fuel, gets burnt?", "options": ["Dietary fibre", "Cholesterol", "Protein", "Vitamin C"], "answer": 2, "explain": "Correct. With fat and glycogen depleted, the body breaks down its own protein for energy.", "slide": 1}, {"q": "Where is carbohydrate stored in the body, and in what form?", "options": ["Liver and muscle, as glycogen", "Adipose tissue, as triglycerides", "Blood plasma, as lactic acid", "Kidneys, as ATP"], "answer": 0, "explain": "Correct. Glycogen in liver and muscle cells is broken down by enzyme to glucose when energy is needed.", "slide": 1}]}, {"game": "quiz", "title": "The Vault — Storage & The Lactic Burn", "items": [{"q": "During heavy exercise oxygen is insufficient. Muscle glucose is converted to what?", "options": ["Glycerol and fatty acids", "Amino acids", "Carbon dioxide and water only", "Lactic acid and energy"], "answer": 3, "explain": "Correct. Without enough oxygen, glucose becomes lactic acid plus a little energy, and fatigue follows.", "slide": 1}, {"q": "A blood lactate assay is run on a sprinter right after a 400 m race. Compared with rest, what is expected?", "options": ["Lower, because sprinting burns lactate completely", "Higher, because muscles rely on anaerobic respiration at high intensity", "Unchanged, because lactate is only made at rest", "Zero, because blood contains no lactate"], "answer": 1, "explain": "Correct. Oxygen supply cannot keep up, so anaerobic respiration raises blood lactate.", "slide": 1}, {"q": "Which of these would LOWER a person's BMR?", "options": ["Fever from malaria", "Growth in a child", "Excess thyroid hormone in Graves disease", "Crash dieting with loss of lean muscle"], "answer": 3, "explain": "Correct. Crash dieting makes the body conserve energy and lose lean muscle, so BMR drops.", "slide": 1}, {"q": "Two people weigh the same. X has more muscle, Y has more fat. Who burns more energy at rest?", "options": ["Y, because fat is metabolically busier", "X, because muscle tissue uses more calories than fat even at rest", "Both are identical, body composition does not matter", "Neither, nothing burns at rest"], "answer": 1, "explain": "Correct. Muscle uses more calories than fat, even at rest.", "slide": 1}, {"q": "A 20-year-old man weighs 70 kg and is 175 cm tall. By Harris-Benedict, what is his BMR?", "options": ["About 1750 kcal per day", "About 1300 kcal per day", "About 1980 kcal per day", "About 2900 kcal per day"], "answer": 0, "explain": "Correct. 88.362 + 937.8 + 839.8 − 113.5 comes to about 1752 kcal.", "slide": 1}]}, {"game": "quiz", "title": "BMR — The Engine at Idle", "items": [{"q": "Which lab technique estimates resting energy expenditure from the oxygen a person consumes and the carbon dioxide produced?", "options": ["Bomb calorimetry", "X-ray crystallography", "Indirect calorimetry", "Patch clamping"], "answer": 2, "explain": "Correct. Indirect calorimetry estimates energy use from oxygen consumed and carbon dioxide produced.", "slide": 1}, {"q": "Roughly what fraction of a meal's calories is used by the thermic effect of food?", "options": ["About 1%", "About 10%", "About 50%", "About 90%"], "answer": 1, "explain": "Correct. About 10% of meal calories go to digesting, metabolizing and storing the food.", "slide": 1}, {"q": "How many kcal does a 68 kg player expend in 1 hour of tennis at 7.4 kcal per minute?", "options": ["74 kcal", "222 kcal", "444 kcal", "740 kcal"], "answer": 2, "explain": "Correct. 7.4 × 60 minutes = 444 kcal.", "slide": 1}, {"q": "One slide says no energy is lost converting chemical energy to mechanical energy. Which statement is physically correct?", "options": ["Muscles are 100% efficient, so no heat is made", "Energy is destroyed whenever muscles contract", "Fat is converted to work with about 90% efficiency", "Total energy is conserved, but only about 25 to 30% becomes useful work in muscle, the rest leaves as heat"], "answer": 3, "explain": "Correct. Energy is conserved, but most of it becomes heat rather than work.", "slide": 1}, {"q": "A student eats 3000 kcal per day but expends only 2500 kcal per day for months. What is expected?", "options": ["Weight gain as the surplus is stored as fat, raising risk of type 2 diabetes and heart disease", "Weight loss", "Weight stays exactly the same", "Only muscle gain, with no fat stored"], "answer": 0, "explain": "Correct. A 500 kcal daily surplus is stored as fat, and over time raises the risk of type 2 diabetes, heart disease, stroke and joint damage.", "slide": 1}]}], "npc": "Grandmaster Orlic", "bossName": "Warden of the Pathway", "bossQuest": "The Warden wakes. It feeds on every mistake you made on the way up. Three hits and you fall. Show it everything you learned.", "stories": [{"seed": 473781, "world": "fantasy", "worldName": "Tower Fantasy", "weapon": "sword", "tropes": ["rival-shadow", "found-family", "rescue", "mentor-falls", "rival-ally", "chosen-one", "awakening"], "T": {"hub": "Adventurers Guild", "hubSub": "Contract hall", "hubPill": "🏰 GUILD", "place": "Tower", "floorWord": "Floor", "contractWord": "contract", "contractHead": "GUILD CONTRACT", "promoHead": "GUILD PROMOTION", "promoBtn": "Accept the guild card", "enter": "Enter the Furnace", "done": "Tower cleared", "board": "QUEST BOARD", "skill": "Sword skill!", "bossLoc": "The Summit", "labels": {"quiz": "Strike", "order": "Sword skill", "sort": "Weak point", "boss": "Boss"}, "hp": "hearts", "toolHit": "strike"}, "ranks": ["Novice", "Apprentice", "Adventurer", "Veteran", "Elite", "Champion", "Legend"], "mentor": {"name": "Grandmaster Orlic", "title": "Grandmaster", "look": {"robe": "#2f2160", "robe2": "#3d2c80", "hair": "#f2f2fa", "orb": "#59c8ff"}}, "rival": {"name": "Vorn", "personality": "friendly", "look": {"hair": "#d9dcef", "scarf": "#c0243a", "coat": "#2a1020"}, "first": [["Vorn", "Hey, rookie! Good luck out there. Don't let it scare you!"], ["You", "Thanks. I'll try."]], "mid": [["Vorn", "Nice work! I'm [rv] now. Race you to the top?"], ["Vorn", "Still standing? Love that for you."], ["Vorn", "A whole party? Okay, now I'm jealous."]], "boss": [["Vorn", "This one's scary. I believe in you, though. Truly."]], "epiS": ["Vorn", "S-Rank! You did it! Okay, rematch tomorrow."], "epiA": ["Vorn", "So close! Next time it's S, I can feel it."]}, "allies": {"mira": {"role": "Archer", "icon": "🏹", "tool": "bow", "coat": "#1f7a6b", "trim": "#7dffd9", "hair": "#ff9d4a", "skin": "#f3cfae", "name": "Wren", "slot": "ranged", "cheer": ["You've got this!", "Trust yourself!", "I believe in you!"], "fall": ["I... I can't feel my arm...", "Go... I'll cover you from here."], "final": "We did it! I knew you'd make it!", "perk": "Fires bow with you. Extra XP on a streak of 2+."}, "brock": {"role": "Knight", "icon": "🛡", "tool": "shield", "coat": "#56658a", "trim": "#c9a227", "hair": "#3a2a20", "skin": "#e0b08a", "name": "Hale", "slot": "tank", "cheer": [     $('#go').onclick = res;
  });
}
const questFor = (l, i) => fmt(l.quest || ST.quests[i] || ST.quests[0], { enemy: l.enemy || l.title });
async function guildScene(i, l, boss) {
  await enterGuild();
  const who = MENTOR.name, rk = `${rank()}-Rank ${rankName()}`, rv = `${GRANKS[rivalIdx()]}-Rank`, hb = ST.hub, bt = ST.beats, V = { rk, rv };
  if (boss && bt.mentorFall.length) for (const [n, t] of bt.mentorFall) await say(n, t);
  else await say(who, fmt(i === 0 ? hb.greet0[ST.seed % 3] : hb.greetN[i % 3], V));
  if (i === 0 && bt.hook.length) await playLines(bt.hook);
  const tgt = targetRank();
  if (i > 0 && tgt > G.rank) {
    await say(who, hb.promoPre);
    await promote(tgt);
    await say(who, fmt(hb.promoPost, { title: RTITLE[GRANKS[tgt]] }));
  } else if (i > 0) {
    const ls = G.stats[i - 1];
    if (ls && ls.right / (ls.right + ls.wrong) < .7) await say(who, hb.sloppy);
  }
  if (!boss && i === bt.revealFloor) { if (bt.reveal.length) await playLines(bt.reveal); if (bt.secretHint.length) await playLines(bt.secretHint); }
  if (G.down && boss) await say(who, fmt(hb.bench, { ally: PARTY[G.down].name }));
  await playLines(i === 0 ? RIVAL.first : boss ? RIVAL.boss : [[RIVAL.mid[(i - 1) % 3][0], fmt(RIVAL.mid[(i - 1) % 3][1], V)]]);
  const lines = [];
  if (boss) lines.push(hb.bossBrief); else lines.push(questFor(l, i));
  lines.push(fmt(hb.target, { enemy: l.enemy || l.title }));
  for (const t of lines) await say(who, t);
  await contract(l, i, boss);
  scene.noteTaken = true; burst(66, 54, '#ffc857', 22, 2.5); sfx.lvl(); heroCheer();
  await wait(800); await tween(fx, { fade: 1 }, 450);
}
async function epilogue() {
  const acc = overallAcc(), who = MENTOR.name, hb = ST.hub;
  await enterGuild();
  await say(who, hb.epiOpen);
  const tgt = acc >= 85 ? 6 : 5;
  if (tgt > G.rank) {
    await say(who, fmt(acc >= 85 ? hb.epiS : hb.epiA, { acc }));
    await promote(tgt);
    await say(who, tgt === 6 ? hb.epiAfterS : hb.epiAfterA);
  }
  if (ST.beats.secretReveal.length) await playLines(ST.beats.secretReveal);
  await playLines([G.rank >= 6 ? RIVAL.epiS : RIVAL.epiA]);
  for (const a of allies.slice(0, 3)) await say(PARTY[a.id].name, FINAL[a.id]);
}

/* ---------- story scenes: rescues, rivals, party ---------- */
function stageGuest(sc) {
  const g = makeAlly(sc.ally);
  if (sc.kind === 'rival') { g.x = 165; g.y = GY + 8; g.front = true; } else { g.x = 292; g.y = GY; g.captive = true; g.rope = sc.kind === 'rope'; g.cage = sc.kind === 'cage'; g.kneel = sc.kind === 'rope'; }
  guest = g; guestCry = performance.now() + 2500;
}
async function playLines(lines) { for (const [n, t, tag] of lines) { if (tag === 'x') { speedLines(45); shake = 5; } await say(n, t); } }
async function storyPre(sc) { speedLines(35); banner('!!', 'Something is wrong...', 1200); await wait(500); await playLines(sc.pre()); }
async function storyPost(sc) {
  const g = guest; if (!g) return;
  if (g.captive) { g.rope = false; g.cage = false; g.kneel = false; g.captive = false; burst(g.x, g.y - 20, '#ffe29a', 22, 3); sfx.lvl(); await tween(g, { x: HEROX + 40, y: GY + 4 }, 800, easeOut); }
  else await tween(g, { x: HEROX + 40 }, 500, easeOut);
  await playLines(sc.post());
  await joinParty(g);
}
function joinParty(g) {
  const d = PARTY[g.id]; G.party.push(g.id); save(); allies.push(g); guest = null; g.front = false; g.captive = false;
  hudDom(); sfx.lvl(); banner('Party joined!', d.name + ' the ' + d.role, 1600); burst(g.x, g.y - 24, d.trim, 24, 3);
  return new Promise(res => { ui(`<div class="card pop" style="text-align:center"><span class="badge">New party member</span><h1>${d.icon} ${d.name}</h1><p><b>${d.role}</b></p><p>${d.perk}</p><button class="btn" id="go">Welcome to the party</button></div>`); $('#go').onclick = res; });
}
async function fallScene() {
  const v = allyById('brock') || live()[0], d = PARTY[v.id], o = live().find(a => a !== v);
  speedLines(40); flashC = '#ff2d55'; flashA = .5; shake = 9; sfx.hit();
  banner(ST.fall.banner[0], ST.fall.banner[1], 1400); await wait(700);
  v.down = true; G.down = v.id; save(); burst(v.x, v.y - 20, '#ff5c7a', 20, 3);
  const vars = { d: d.name, o: o ? PARTY[o.id].name : '' };
  const L = [[d.name, d.fall[0], 'x'], ['You', d.name + '!', 'x'], [d.name, d.fall[1]]];
  for (const [n, t] of ST.fall.tail) { const sp = fmt(n, vars); if (sp) L.push([sp, fmt(t, vars)]); }
  await playLines(L);
}
async function bossRally() {
  if (!live().length) return;
  const L = [];
  for (const k of ['mira', 'brock', 'lyra']) if (hasA(k)) L.push(ST.rally[k]);
  L.push(['You', "We didn't come this far to lose. Let's finish this together!", 'x'], ['Party', 'Right! Together!', 'x']);
  speedLines(30); await playLines(L);
}
const autoQuest = l => questFor(l, LV.indexOf(l));
async function floor(i, intro) {
  const l = LV[i], boss = l.game === 'boss';
  G.lvl = i; save(); scene.theme = boss ? 6 : i % 6; scene.tower = false; inFight = false; mon = null; titleText = null; hudDom();
  hero.max = hero.hp = boss ? 3 : 4; hero.shown = hero.hp; hero.x = HEROX; hero.y = GY; hero.ox = 0; hero.dead = 0; hero.sword = -.6; hero.hop = 0; hero.aura = 0; scene.guild = false; if (intro) guest = null;
  if (intro) {
    await guildScene(i, l, boss);
    scene.guild = false; scene.theme = boss ? 6 : i % 6; hero.y = GY; hero.x = HEROX; hero.state = 'run'; scene.speed = 2.4; hudDom();
    ui(`<div class="card dlg pop"><b>Climbing…</b><p class="mut">${boss ? 'The summit' : T.floorWord + ' ' + (i + 1) + ' of ' + LV.length}</p></div>`);
    tween(fx, { fade: 0 }, 500);
    banner(boss ? 'Boss ' + T.floorWord.toLowerCase() : T.floorWord + ' ' + (i + 1), l.title, 1700); await wait(1700);
    scene.speed = 0; hero.state = 'idle';
  } else { hero.state = 'idle'; scene.speed = 0; fx.fade = 0; }
  const sc = l.story && !G.party.includes(l.story.ally) ? l.story : null;
  if (intro && sc) stageGuest(sc);
  await spawn(l);
  if (intro && sc) await storyPre(sc);
  if (intro && boss) await bossRally();
  inFight = true; banner(boss ? 'Boss' : 'Encounter', mon.name, 1200); if (boss) sfx.boss(); else sfx.explore(); await wait(900);
  const r = await fight(l, i, boss);
  if (r !== 'dead' && sc) await storyPost(sc);
  if (r !== 'dead' && !boss && i === LV.length - 2 && LV[LV.length - 1].game === 'boss' && live().length && !G.down && ST.fall) await fallScene();
  return r;
}
function cleared(i, r) {
  const acc = r.right / (r.right + r.wrong), stars = acc >= .85 ? 3 : acc >= .6 ? 2 : 1, bonus = stars * 25;
  G.xp += bonus; G.stats[i] = { title: LV[i].title, right: r.right, wrong: r.wrong }; G.lvl = i + 1; G.streak = G.streak; save(); hudDom();
  const last = G.lvl >= LV.length;
  sfx.door(); sfx.explore();
  return new Promise(res => {
    ui(`<div class="card pop"><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div><h1 style="text-align:center">${LV[i].game === 'boss' ? 'Boss defeated!' : T.floorWord + ' cleared!'}</h1><p style="text-align:center">${Math.round(acc * 100)}% accuracy · +${bonus} XP · Codex ${Object.keys(G.codex).length}</p><div class="dots">${LV.map((_, k) => `<i class="${k <= i ? 'd' : ''}"></i>`).join('')}</div><button class="btn" id="go">${last ? 'Report to ' + esc(MENTOR.title) : 'Return to ' + esc(T.hub)}</button></div>`);
    $('#go').onclick = () => res();
  });
}
async function run(from) {
  for (let i = from; i < LV.length; i++) { let r, first = true; do { r = await floor(i, first); first = false; } while (r === 'dead'); await cleared(i, r); }
  await epilogue();
  report();
}
function report() {
  inFight = false; mon = null; scene.theme = 6; scene.speed = 0; hero.state = 'idle'; hudDom(); heroCheer(); sfx.win();
  for (let k = 0; k < 6; k++) setTimeout(() => burst(rnd(40, 280), rnd(30, 90), ['#ffc857', '#59c8ff', '#ff6bd6', '#2fd38a'][k % 4], 18, 3), k * 220 * TS);
  const st = G.stats.filter(Boolean), R = st.reduce((a, s) => a + s.right, 0), Wr = st.reduce((a, s) => a + s.wrong, 0), acc = Math.round(100 * R / Math.max(1, R + Wr));
  const weak = Object.values(G.missed).sort((a, b) => b.n - a.n);
  const sheet = `${S.title}: review sheet\n\n` + (weak.length ? weak.map((m, k) => `${k + 1}. ${m.text}\n   → ${m.explain || ''}${m.slide ? ` (Slide ${m.slide})` : ''}`).join('\n\n') : 'Nothing missed. Flawless.');
  ui(`<div class="card pop"><span class="badge">${esc(T.done)}</span><h1>${acc >= 85 ? '🏆 Mastered' : acc >= 60 ? '👍 Solid' : '📚 Keep climbing'}</h1><p>${rank()}-Rank ${rankName()} · Lv ${heroLv()} · ⚡ ${G.xp} XP · ${acc}% accuracy · Codex ${Object.keys(G.codex).length} · ${weak.length} to review</p>${st.map(s => { const p = Math.round(100 * s.right / (s.right + s.wrong)); return `<div class="lv"><span>${esc(s.title)}</span><span>${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div>`; }).join('')}</div>
  <div class="card"><h2>Review these</h2>${weak.length ? weak.map(m => `<div class="entry weak"><b>${esc(m.text)}</b><br>${esc(m.explain)} ${slideBtn(m.slide)}<br><span class="mut">missed ${m.n}×</span></div>`).join('') : '<p>Nothing missed. Flawless.</p>'}<button class="btn ghost" id="cp">Copy review sheet</button></div><button class="btn" id="re">Play again</button>`);
  $('#cp').onclick = () => { try { navigator.clipboard.writeText(sheet); $('#cp').textContent = 'Copied ✓'; } catch (e) { $('#cp').textContent = 'Copy failed'; } };
  $('#re').onclick = () => { G = fresh(); save(); newStory(); };
}
function carpeIntro(done) {
  // Narrator gets its own page — hide game canvas/HUD until intro finishes
  try {
    const topEl = document.querySelector('#top');
    if (topEl) topEl.style.display = 'none';
    document.body.classList.add('narrator-page');
    const style = document.createElement('style');
    style.textContent = 'body.narrator-page{background:#0a0d16!important} body.narrator-page #wrap{max-width:640px!important;padding-top:36px!important} body.narrator-page #top{display:none!important}';
    document.head.appendChild(style);
  } catch(e){}
  try { hudDom(); } catch(e){}
  const steps = [
    {who:'SHADOW-MASKED NARRATOR', tag:'The Carpe Diem Gaming Experience', text:'Welcome to the Carpe Diem Gaming Experience... Powered by Kingfahd Pappoe.', btn:'Begin the Summoning'},
    {who:'SHADOW-MASKED NARRATOR', tag:'Medical Village', text:'Somewhere, a student is studying at two in the morning. Tonight, biophysics answers. You are summoned to Medical Village — a village where every calorie is a law of physics.', btn:'Enter the Furnace'},
    {who:'THE SLIDE WARDEN (Preview)', tag:'Final Boss · Threat 5/5', text:'At the end of the realm waits the Slide Warden. "These are my slides. You have studied them — or at least, I hope you have. Now... can you defeat my slides?"', btn:'Accept the Challenge'},
  ];
  let step = 0;
  function autoSpeakCurrent() {
    try {
      const el = document.querySelector('#panel');
      // Find status element to confirm playing
      const t = steps[step].text;
      speak(t, { pitch: 0.82, rate: 0.95 });
    } catch(e){}
  }
  function show() { unlockAudio(); autoSpeakCurrent();
    const s = steps[step];
    ui(`<div class="card pop" style="text-align:center;padding:28px 18px"><div style="display:flex;justify-content:center;margin-bottom:12px"><svg width="220" height="260" viewBox="0 0 220 260" style="max-width:100%;height:auto" aria-label="Shadow-Masked Narrator">
  <defs><radialGradient id="floorGlow" cx="50%" cy="0%" r="80%"><stop offset="0%" stop-color="#d4af37" stop-opacity=".28"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient></defs>
  <ellipse cx="110" cy="230" rx="90" ry="18" fill="url(#floorGlow)"/>
  <!-- long hooded cloak -->
  <path d="M110 18 C 78 18, 58 42, 56 74 L 62 118 C 50 150, 58 198, 74 232 L 146 232 C 162 198, 170 150, 158 118 L 164 74 C 162 42, 142 18, 110 18 Z" fill="#0b0e1a" stroke="#d4af37" stroke-width="2.5"/>
  <!-- hood point -->
  <path d="M110 8 C 100 8, 94 14, 94 22 L 126 22 C 126 14, 120 8, 110 8 Z" fill="#151d33" stroke="#d4af37"/>
  <!-- masked face area -->
  <ellipse cx="110" cy="72" rx="26" ry="30" fill="#05060c" stroke="#d4af37" stroke-width="1.5"/>
  <!-- eyes (glowing, shadowed) -->
  <ellipse cx="100" cy="68" rx="4" ry="2.5" fill="#d4af37"/><ellipse cx="120" cy="68" rx="4" ry="2.5" fill="#d4af37"/>
  <!-- gold mask lines -->
  <path d="M92 80 Q110 88 128 80" stroke="#d4af37" stroke-width="1.5" fill="none" opacity=".7"/>
  <path d="M98 52 L94 84 M122 52 L126 84" stroke="#d4af37" stroke-width="1" opacity=".4"/>
  <!-- chest cloth + clasp -->
  <path d="M86 112 C 98 124, 122 124, 134 112 L 128 142 C 118 150, 102 150, 92 142 Z" fill="#151d33" stroke="#d4af37" stroke-width="1"/>
  <circle cx="110" cy="124" r="5" fill="#d4af37" stroke="#0b0e1a"/>
  <!-- sleeves -->
  <path d="M64 118 C 52 142, 56 172, 66 188 L 78 180 C 70 162, 70 138, 76 124 Z" fill="#10162a" stroke="#d4af37" stroke-width="1"/>
  <path d="M156 118 C 168 142, 164 172, 154 188 L 142 180 C 150 162, 150 138, 144 124 Z" fill="#10162a" stroke="#d4af37" stroke-width="1"/>
  <!-- floating lantern (Locus-style, gold) -->
  <g><circle cx="168" cy="92" r="10" fill="#1a1400" stroke="#d4af37" stroke-width="2"/><circle cx="168" cy="92" r="4" fill="#f0d47a"/><path d="M168 82 L168 76 M162 76 L174 76" stroke="#d4af37" stroke-width="1.5"/><circle cx="168" cy="92" r="16" fill="none" stroke="#d4af37" opacity=".3"/><animate attributeName="cy" values="92;88;92" dur="2.4s" repeatCount="indefinite"/></g>
  <!-- ground shadow -->
  <ellipse cx="110" cy="236" rx="52" ry="7" fill="#000" opacity=".6"/>
</svg></div><div style="letter-spacing:3px;font-size:11px;color:#d4af37;font-weight:800;text-transform:uppercase">${esc(s.tag)}</div><div style="letter-spacing:1.5px;font-size:12px;color:#8f9ad6;margin:8px 0 6px">${esc(s.who)}</div><p style="font-size:17px;line-height:1.6;min-height:4.5em">${esc(s.text)}</p><p class="mut">5 Floors · 25 Challenges · [Slides] Only — every answer cites its slide. Voice: Web Speech — tap 🎙️ Voice to toggle.</p><p class="mut">Rules: tap/click to answer. Wrong = explanation + second try. Locus hints cost a little XP, not your grade.</p><div style="display:flex;gap:8px;margin-top:6px"><button class="btn ghost" id="hearBtn" style="flex:1">🔊 Hear Narrator</button><button class="btn" id="introBtn" style="flex:1.4">${esc(s.btn)}</button></div><p class="mut" style="font-size:11px;margin-top:6px">Voice uses your browser's speakers — tap 🔊 Hear Narrator if it doesn't play automatically.</p></div>`);
    const hb = $('#hearBtn');
    if (hb) hb.onclick = async () => {
      sfx.ok(); unlockAudio();
      if (G.muted) { G.muted = false; save(); if (window.STUDYVERSE_TTS) STUDYVERSE_TTS.setMuted(false); hudDom(); }
      hb.textContent = 'Playing narrator...';
      try {
        if (window.STUDYVERSE_TTS) {
          const role = STUDYVERSE_TTS.roleForName(steps[step].who) || 'narrator';
          await STUDYVERSE_TTS.speak(role, steps[step].text);

        } else {
          speak(steps[step].who + ': ' + steps[step].text, { pitch: 0.82, rate: 0.95 });

      } catch(e) { hb.textContent = 'Voice failed - tap again'; setTimeout(() => { hb.textContent = '🔊 Hear Narrator'; }, 2000); }
    };
    $('#introBtn').onclick = () => { step++; sfx.ok(); if (step < steps.length) show(); else { document.body.classList.remove('narrator-page'); const topEl = document.querySelector('#top'); if (topEl) topEl.style.display = ''; done(); } };
  }
  show();
  // Auto-play on first interaction (Chrome gesture gate) - narrator speaks without needing the Hear button
  const autoOnce = () => { try { unlockAudio(); autoSpeakCurrent(); } catch(e){} };
  document.addEventListener('pointerdown', autoOnce, { once: true });
  document.addEventListener('keydown', autoOnce, { once: true });
  document.addEventListener('touchstart', autoOnce, { once: true });
}
function title() {
  inFight = false; mon = null; scene.theme = 0; scene.tower = true; scene.guild = false; hero.y = GY; fx.fade = 0; scene.speed = .4; syncAllies(); hero.state = 'idle'; hero.x = HEROX; hero.dead = 0; hero.ox = 0; hero.sword = -.6; hero.hop = 0; titleText = S.title;
  const saved = G.lvl > 0 && G.lvl < LV.length; hudDom();
  ui(`<div class="card pop"><div class="mut" style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#d4af37">THE CARPE DIEM GAMING EXPERIENCE · <i>The Beauty in the Gnarly</i></div><span class="badge">${esc(ST.worldName)}</span><h1>${esc(S.title)}</h1><p>${esc(ST.world === 'fantasy' && typeof S.story === 'string' && S.story ? S.story : 'The double-helix arch is broken. Answer with real biophysics to crack each door and face the Slide Warden.')}</p><p class="mut">${LV.length} ${esc(T.floorWord.toLowerCase())}s · ${LV.reduce((a, l) => a + l.items.length, 0)} challenges</p><p class="mut">${esc(ST.tropes.map(x => x.replace(/-/g, ' ')).join(' · '))}</p>${saved ? `<button class="btn" id="go">Continue (${esc(T.floorWord)} ${G.lvl + 1})</button><button class="btn ghost" id="new">Start over</button>` : `<button class="btn" id="go">${esc(T.enter)}</button>`}${STORIES.length > 1 ? '<button class="btn ghost" id="rr">🎲 New story</button>' : ''}<p class="mut" style="font-size:11px;margin-top:10px">Powered by Kingfahd Pappoe · MLS 155 Biophysics</p></div>`);
  const begin = from => { document.body.classList.remove('narrator-page'); const topEl = document.querySelector('#top'); if (topEl) topEl.style.display = ''; titleText = null; scene.tower = false; scene.speed = 0; run(from); };
  $('#go').onclick = () => begin(saved ? G.lvl : 0);

}

if (/debug/.test(location.hash)) window.__dbg = { ST, PARTY, hero, scene, LV, G: () => G, get mon() { return mon; }, monAttack, spawn, enrage, set inFight(v) { inFight = v; } };
(function(){
