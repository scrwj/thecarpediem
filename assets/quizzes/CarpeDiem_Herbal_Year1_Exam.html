","q":"Transformation, conjugation and transduction are all mechanisms of ______.","options":["genetic exchange between bacterial cells","spore formation","binary fission","capsule synthesis"],"answer":"genetic exchange between bacterial cells","solution":"A: Correct: the slides list transformation, conjugation and transduction as forms of sexual reproduction/genetic exchange in bacteria.\nB: Sporulation is not genetic exchange.\nC: Binary fission is asexual reproduction without genetic exchange.\nD: Capsule synthesis is not a genetic exchange process.","source":"Bacteriology.pdf | SLIDE 60","difficulty":"Medium"},{"id":"her-v2-022","module":"v2","type":"mcq","q":"In conjugation, bacteria capable of transferring genetic material contain a ______.","options":["spore plasmid and are designated S+ strains","fertility factor and are designated F+ strains","capsular factor and are designated C+ strains","toxin plasmid and are designated T+ strains"],"answer":"fertility factor and are designated F+ strains","solution":"A: There is no S+ designation for conjugation in the slides.\nB: Correct: the slides state F+ strains contain a fertility factor and transfer genetic material to F- strains.\nC: Capsules are not involved in conjugation designation.\nD: Toxigenicity is not the basis of F+ designation.","source":"Bacteriology.pdf | SLIDE 64","difficulty":"Hard"},{"id":"her-v2-023","module":"v2","type":"mcq","q":"Transduction involves the transfer of bacterial genetic material by means of ______.","options":["sex pili","direct uptake of free DNA","bacteriophages (viruses)","binary fission"],"answer":"bacteriophages (viruses)","solution":"A: Sex pili mediate conjugation, not transduction.\nB: Direct uptake of exogenous DNA is transformation.\nC: Correct: the slides state bacteriophages attack bacteria and can pass genetic material from one cell to another.\nD: Binary fission does not transfer DNA between cells.","source":"Bacteriology.pdf | SLIDE 66","difficulty":"Medium"},{"id":"her-v2-024","module":"v2","type":"mcq","q":"A bacterial growth curve typically consists of which phases?","options":["Lag, log, plateau, germination","Initial, middle, final, resting","Log, stationary, sporulation, death","Lag, exponential (log), stationary, decline/death"],"answer":"Lag, exponential (log), stationary, decline/death","solution":"A: Germination is a spore process, not a standard growth curve phase.\nB: These are not the named phases in the slides.\nC: Sporulation is not one of the four standard growth curve phases listed.\nD: Correct: the slides list lag, exponential (log), stationary and decline/death phases of bacterial growth.","source":"Bacteriology.pdf | SLIDE 72","difficulty":"Hard"},{"id":"her-v2-025","module":"v2","type":"mcq","q":"Termination of bacterial growth in a closed culture is due to all of the following EXCEPT ______.","options":["excessive oxygen availability","Exhaustion of nutrients","Accumulation of toxic metabolic end-products","Achievement of maximum population density"],"answer":"excessive oxygen availability","solution":"A: Correct: the slides list exhaustion of nutrients, accumulation of toxic metabolites and achievement of maximum population density, not excess oxygen.\nB: Nutrient exhaustion is explicitly listed as a cause of growth termination.\nC: Toxic end-product accumulation is explicitly listed.\nD: Maximum population density is explicitly listed.","source":"Bacteriology.pdf | SLIDE 73","difficulty":"Devil Mode"},{"id":"her-v2-026","module":"v2","type":"mcq","q":"Agar used to solidify culture media is derived from ______.","options":["brown seaweed such as Laminaria","red algae such as Gelidium species","the seeds of the agar tree","bacterial capsules"],"answer":"red algae such as Gelidium species","solution":"A: Agar is from red algae; alginates come from brown seaweed.\nB: Correct: the slides state agar is found in the cell wall of red algae, especially Gelidium, and is extracted by boiling seaweed.\nC: There is no agar tree; agar is a seaweed polysaccharide.\nD: Agar is not a bacterial product.","source":"Bacteriology.pdf | SLIDE 95","difficulty":"Medium"},{"id":"her-v2-027","module":"v2","type":"mcq","q":"The Gram stain was discovered by which Danish physician and in what year?","options":["Robert Koch in 1877","Louis Pasteur in 1864","Hans Christian Gram in 1884","Ferdinand Cohn in 1876"],"answer":"Hans Christian Gram in 1884","solution":"A: Koch developed staining with aniline dyes and pure cultures, not the Gram stain.\nB: Pasteur worked on fermentation and spontaneous generation.\nC: Correct: the slides state Gram's stain was discovered by Danish physician Hans Christian Gram in 1884.\nD: Cohn discovered heat-resistant spores.","source":"Bacteriology.pdf | SLIDE 98","difficulty":"Hard"},{"id":"her-v2-028","module":"v2","type":"mcq","q":"The correct sequence of steps in Gram staining is ______.","options":["safranin, iodine, crystal violet, ethanol","crystal violet, ethanol, iodine, safranin","iodine, crystal violet, safranin, ethanol","crystal violet, iodine, acetone/ethanol, safranin"],"answer":"crystal violet, iodine, acetone/ethanol, safranin","solution":"A: Safranin is the counterstain and comes last, not first.\nB: Iodine (mordant) must be applied before the decolouriser.\nC: Crystal violet is the primary stain and must be applied first.\nD: Correct: the slides list primary stain crystal violet, mordant iodine, decolouriser acetone/ethanol and counterstain safranin.","source":"Bacteriology.pdf | SLIDE 99","difficulty":"Medium"},{"id":"her-v2-029","module":"v2","type":"mcq","q":"Which of the following media characteristics is required before use?","options":["It must be sterilized and free from microorganisms","It must contain antibiotics","It must be kept at 37 C at all times","It must have a pH of exactly 7.0"],"answer":"It must be sterilized and free from microorganisms","solution":"A: Correct: the slides state all media must be initially free from microorganisms and sterilized before use.\nB: Antibiotics are not a universal requirement for culture media.\nC: Incubation temperature depends on the organism, not a medium characteristic.\nD: Media need a proper pH but not necessarily exactly 7.0.","source":"Bacteria Growth requirements.pptx | SLIDE 7","difficulty":"Hard"},{"id":"her-v2-030","module":"v2","type":"mcq","q":"Microorganisms that use light as their energy source are called ______.","options":["chemotrophs","phototrophs","lithotrophs","heterotrophs"],"answer":"phototrophs","solution":"A: Chemotrophs utilize chemicals for energy.\nB: Correct: the growth requirements slides state phototrophs utilize sunlight for energy while chemotrophs use chemicals.\nC: Lithotrophs use inorganic substances as an electron source.\nD: Heterotrophs use organic carbon, which is a carbon-source classification.","source":"Bacteria Growth requirements.pptx | SLIDE 4","difficulty":"Devil Mode"},{"id":"her-v2-031","module":"v2","type":"mcq","q":"Autotrophs use which substance as their sole carbon source?","options":["glucose","amino acids","Carbon dioxide","ammonium salts"],"answer":"Carbon dioxide","solution":"A: Glucose is an organic carbon source used by heterotrophs.\nB: Amino acids are organic carbon sources for heterotrophs.\nC: Correct: the slides define autotrophs as using carbon dioxide as sole carbon source.\nD: Ammonium salts are a nitrogen source, not the sole carbon source of autotrophs.","source":"Bacteria Growth requirements.pptx | SLIDE 5","difficulty":"Medium"},{"id":"her-v2-032","module":"v2","type":"mcq","q":"Which element makes up about 50% of the dry weight of a bacterial cell?","options":["Nitrogen","Phosphorus","Oxygen","Carbon"],"answer":"Carbon","solution":"A: Nitrogen makes up about 14% of dry cell weight.\nB: Phosphorus is used in DNA, RNA, ATP and phospholipids but is not 50% of dry weight.\nC: Oxygen is a chemical requirement but is not stated as 50% of dry weight.\nD: Correct: the slides state carbon makes up 50% of dry cell weight and is the structural backbone of organic compounds.","source":"Bacteria Growth requirements.pptx | SLIDE 8","difficulty":"Hard"},{"id":"her-v2-033","module":"v2","type":"mcq","q":"Which element is required for cell wall synthesis in bacteria?","options":["Calcium","Iron","Zinc","Molybdenum"],"answer":"Calcium","solution":"A: Correct: the slides state calcium is required for cell wall synthesis and potassium, magnesium and calcium often serve as enzyme cofactors.\nB: Iron is a trace element used as an enzyme cofactor.\nC: Zinc is a trace element cofactor, not specifically for cell wall synthesis.\nD: Molybdenum is a trace element cofactor.","source":"Bacteria Growth requirements.pptx | SLIDE 9","difficulty":"Medium"},{"id":"her-v2-034","module":"v2","type":"mcq","q":"Bacterial growth factors are classified into all of the following groups EXCEPT ______.","options":["Amino acids","carbohydrates","Vitamins","Purines and pyrimidines"],"answer":"carbohydrates","solution":"A: Amino acids are listed as one of the three groups of growth factors.\nB: Correct: the slides classify growth factors as amino acids, vitamins and purines/pyrimidines, not carbohydrates.\nC: Vitamins are listed as enzyme cofactor growth factors.\nD: Purines and pyrimidines are listed as nucleic acid building blocks.","source":"Bacteria Growth requirements.pptx | SLIDE 10","difficulty":"Hard"},{"id":"her-v2-035","module":"v2","type":"mcq","q":"Psychrophiles are organisms that grow best at temperatures ______.","options":["20-45 C","45-80 C","Below 20 C only","above 80 C"],"answer":"Below 20 C only","solution":"A: That range describes mesophiles.\nB: That range describes thermophiles.\nC: Correct: the slides define psychrophiles as growing below 20 C, with true psychrophiles at 15 C or below.\nD: Above 80 C describes hyperthermophiles.","source":"Bacteria Growth requirements.pptx | SLIDE 15","difficulty":"Devil Mode"},{"id":"her-v2-036","module":"v2","type":"mcq","q":"The optimum growth temperature of pathogenic bacteria is ______.","options":["25 C","42 C","55 C","37 C"],"answer":"37 C","solution":"A: 25 C is within the mesophile range but not the optimum for pathogens.\nB: 42 C is near the upper limit, not the optimum.\nC: 55 C is in the thermophile range.\nD: Correct: the slides state pathogenic bacteria have an optimum growth temperature of 37 C with limits of 15-20 C and 40-50 C.","source":"Bacteria Growth requirements.pptx | SLIDE 14","difficulty":"Medium"},{"id":"her-v2-037","module":"v2","type":"mcq","q":"Bacteria that grow best at alkaline pH 8.5-11 are called ______.","options":["alkaliphiles","acidophiles","neutralophiles","halophiles"],"answer":"alkaliphiles","solution":"A: Correct: the slides define alkaliphiles, e.g. Bacillus subtilis, as growing best at pH 8.5-11.\nB: Acidophiles grow best at acidic pH below 5.5.\nC: Neutralophiles grow at neutral pH 7.4-7.6.\nD: Halophiles are classified by salt tolerance, not pH.","source":"Bacteria Growth requirements.pptx | SLIDE 16","difficulty":"Hard"},{"id":"her-v2-038","module":"v2","type":"mcq","q":"Obligate anaerobes are inhibited by oxygen because they lack ______.","options":["superoxide dismutase only","catalase needed to break down hydrogen peroxide","the enzyme cytochrome oxidase","a cell wall"],"answer":"catalase needed to break down hydrogen peroxide","solution":"A: The slides specifically identify lack of catalase for H2O2 breakdown.\nB: Correct: the slides state anaerobes lack catalase for H2O2 to O2 + H2O and are inhibited by oxygen's toxic product.\nC: Cytochrome oxidase is part of aerobic respiration, not the H2O2 defence cited.\nD: Anaerobes have cell walls; lack of a wall is not the reason for oxygen inhibition.","source":"Bacteria Growth requirements.pptx | SLIDE 17","difficulty":"Medium"},{"id":"her-v2-039","module":"v2","type":"mcq","q":"Microaerophiles require oxygen ______.","options":["only in the complete absence of oxygen","at high concentrations only","but at low concentrations","but cannot tolerate any carbon dioxide"],"answer":"but at low concentrations","solution":"A: That describes obligate anaerobes.\nB: High oxygen would inhibit microaerophiles.\nC: Correct: the slides define microaerophiles such as Campylobacter as requiring oxygen at low concentrations.\nD: Carbon dioxide requirements are discussed separately for capnophiles.","source":"Bacteria Growth requirements.pptx | SLIDE 18","difficulty":"Hard"},{"id":"her-v2-040","module":"v2","type":"mcq","q":"Capnophiles such as gonococci and meningococci require increased levels of ______.","options":["oxygen","salt","light","carbon dioxide"],"answer":"carbon dioxide","solution":"A: Oxygen requirements define aerobes and anaerobes, not capnophiles.\nB: Salt requirements define halophiles.\nC: Light is an energy source for phototrophs, not the capnophile factor.\nD: Correct: the slides state gonococci, meningococci and Brucella abortus need large amounts of CO2 and are called capnophiles.","source":"Bacteria Growth requirements.pptx | SLIDE 19","difficulty":"Devil Mode"},{"id":"her-v2-041","module":"v2","type":"mcq","q":"Mild halophiles such as Staphylococcus aureus require what salt concentration?","options":["1-6% NaCl","6-15% NaCl","above 30% NaCl","0.1-0.5% NaCl"],"answer":"1-6% NaCl","solution":"A: Correct: the slides state mild halophiles require 1-6% NaCl, moderate halophiles 6-15% and extreme halophiles above 15-30%.\nB: That describes moderate halophiles such as Vibrio fisheri.\nC: That exceeds even the extreme halophile range given.\nD: That is far below the mild halophile requirement.","source":"Bacteria Growth requirements.pptx | SLIDE 20","difficulty":"Medium"},{"id":"her-v2-042","module":"v2","type":"mcq","q":"Carotenoid pigments protect some bacteria from the lethal effects of light by ______.","options":["absorbing all visible light completely","interfering with the formation and action of singlet oxygen","repairing DNA after exposure","increasing the rate of spore formation"],"answer":"interfering with the formation and action of singlet oxygen","solution":"A: Carotenoids interfere with singlet oxygen, not by blocking all light.\nB: Correct: the slides state yellow, orange or red carotenoid pigments interfere with singlet oxygen formation and action.\nC: Pigments act preventively, not by DNA repair.\nD: Spore formation is not the protective mechanism described.","source":"Bacteria Growth requirements.pptx | SLIDE 22","difficulty":"Hard"},{"id":"her-v2-043","module":"v2","type":"mcq","q":"A virus is best described as ______.","options":["a small free-living cell with ribosomes","a particle containing both DNA and RNA","a sub-microscopic obligate intracellular particle containing either DNA or RNA, never both","a type of bacteria that lacks a cell wall"],"answer":"a sub-microscopic obligate intracellular particle containing either DNA or RNA, never both","solution":"A: Viruses lack ribosomes and cannot live independently.\nB: Viruses contain either DNA or RNA, never both.\nC: Correct: the slides define viruses as sub-microscopic (20-400 nm), obligate intracellular, possessing DNA or RNA but never both.\nD: Mycoplasmas, not viruses, are bacteria lacking a rigid wall.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 72","difficulty":"Medium"},{"id":"her-v2-044","module":"v2","type":"mcq","q":"A fully assembled infectious virus particle is called a ______.","options":["capsid","prion","viroid","virion"],"answer":"virion","solution":"A: The capsid is only the protein coat, not the complete particle.\nB: A prion is an infectious protein with no nucleic acid.\nC: A viroid is a naked circular RNA without a protein coat.\nD: Correct: the slides define a virion as the complete viral particle, fully assembled.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 74","difficulty":"Hard"},{"id":"her-v2-045","module":"v2","type":"mcq","q":"The protein coat of a virus is called the ______.","options":["capsid","envelope","peplomer","nucleocapsid only"],"answer":"capsid","solution":"A: Correct: the slides define the capsid as a protective protein coat surrounding the viral nucleic acid.\nB: The envelope is an outer lipoprotein membrane, not the protein coat.\nC: Peplomers are glycoprotein spikes on the envelope.\nD: Nucleocapsid includes nucleic acid plus capsid; the protein coat alone is the capsid.","source":"Virology 2.pptx | SLIDE 7","difficulty":"Devil Mode"},{"id":"her-v2-046","module":"v2","type":"mcq","q":"Which of the following statements about viruses is TRUE?","options":["They reproduce by binary fission","They are resistant to antibiotics but may be inhibited by antiviral agents such as interferon","They possess both DNA and RNA","They are readily killed by antibacterial antibiotics"],"answer":"They are resistant to antibiotics but may be inhibited by antiviral agents such as interferon","solution":"A: Viruses replicate by assembly, not binary fission.\nB: Correct: the slides state viruses are resistant to antibiotics but may be inhibited by antiviral agents like interferon.\nC: Viruses possess DNA or RNA, never both.\nD: Antibiotics do not act on viruses.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 72","difficulty":"Medium"},{"id":"her-v2-047","module":"v2","type":"mcq","q":"Which enzyme system is found in cells but absent from viruses?","options":["A protein capsid","Either DNA or RNA as genetic material","Mitochondria / full enzyme systems for energy generation","An envelope in some cases"],"answer":"Mitochondria / full enzyme systems for energy generation","solution":"A: Viruses have a capsid; cells do not.\nB: Viruses have DNA or RNA; cells have both.\nC: Correct: the comparison table shows viruses lack mitochondria and have few or no enzymes, unlike cells.\nD: Envelopes are a viral feature, present in some viruses.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 91","difficulty":"Hard"},{"id":"her-v2-048","module":"v2","type":"mcq","q":"In viral replication, the step in which the virus binds to the host cell is called ______.","options":["penetration","maturation","release","adsorption/attachment"],"answer":"adsorption/attachment","solution":"A: Penetration is injection of the genome after attachment.\nB: Maturation is the final assembly of viral components.\nC: Release is expulsion of new viruses from the host cell.\nD: Correct: the slides list adsorption/attachment as the first step where the virus binds to the host cell.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 94","difficulty":"Medium"},{"id":"her-v2-049","module":"v2","type":"mcq","q":"Enveloped viruses are typically released from the host cell by ______.","options":["budding","lysis","binary fission","sporulation"],"answer":"budding","solution":"A: Correct: the notes state enveloped viruses such as influenza A are released by budding, acquiring their envelope, without usually killing the cell.\nB: Lysis kills the cell and is typical of non-enveloped cytolytic viruses.\nC: Viruses do not divide by binary fission.\nD: Sporulation is a bacterial survival process.","source":"Virology 2.pptx | SLIDE 21","difficulty":"Hard"},{"id":"her-v2-050","module":"v2","type":"mcq","q":"Which family of viruses is described as 28-30 nm, non-enveloped, ssRNA, and includes poliovirus and hepatitis A virus?","options":["Caliciviridae","Picornaviridae","Flaviviridae","Astroviridae"],"answer":"Picornaviridae","solution":"A: Caliciviridae are 30-38 nm with cup-shaped depressions and cause gastroenteritis.\nB: Correct: the slides describe Picornaviridae as 28-30 nm icosahedral ssRNA viruses, including enterovirus (polio) and hepatovirus (hepatitis A).\nC: Flaviviridae are 45-60 nm enveloped viruses including yellow fever virus.\nD: Astroviridae are 28-30 nm but cause infections in humans and animals and are not the polio family.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 32","difficulty":"Devil Mode"},{"id":"her-v2-051","module":"v2","type":"mcq","q":"Which virus family includes the rubella virus and is transmitted by mosquitoes and other hematophagous arthropods?","options":["Coronaviridae","Paramyxoviridae","Togaviridae","Hepadnaviridae"],"answer":"Togaviridae","solution":"A: Coronaviridae cause common colds and are transmitted by aerosol, faecal-oral and fomite routes.\nB: Paramyxoviridae include mumps and measles, transmitted by aerosols and droplets.\nC: Correct: the slides state Togaviridae include Alphavirus and Rubivirus (rubella), transmitted by mosquitoes and hematophagous arthropods.\nD: Hepadnaviridae include hepatitis B and are host specific.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 39","difficulty":"Medium"},{"id":"her-v2-052","module":"v2","type":"mcq","q":"Which family includes the influenza viruses and exhibits hemagglutinating activity?","options":["Paramyxoviridae","Picornaviridae","Retroviridae","Orthomyxoviridae"],"answer":"Orthomyxoviridae","solution":"A: Paramyxoviridae include mumps and measles, not influenza A/B/C.\nB: Picornaviridae include rhinovirus and poliovirus.\nC: Retroviridae include HIV and are positive-sense RNA.\nD: Correct: the slides list Orthomyxoviridae as 80-120 nm negative-sense ssRNA with genera Influenzavirus A, B and C and hemagglutinating activity.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 48","difficulty":"Hard"},{"id":"her-v2-053","module":"v2","type":"mcq","q":"Retroviridae are associated with many diseases including ______.","options":["leukaemia, lymphomas, sarcomas and immunodeficiencies","the common cold only","malaria and amoebiasis","influenza and mumps"],"answer":"leukaemia, lymphomas, sarcomas and immunodeficiencies","solution":"A: Correct: the slides state Retroviridae are associated with leukaemia, lymphomas, sarcomas, carcinomas and immunodeficiencies.\nB: The common cold is associated with coronaviruses and rhinoviruses.\nC: These are parasitic diseases, not retroviral diseases.\nD: Influenza and mumps are caused by orthomyxo- and paramyxoviruses.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 49","difficulty":"Medium"},{"id":"her-v2-054","module":"v2","type":"mcq","q":"Hepatitis B virus belongs to which family?","options":["Picornaviridae","Hepadnaviridae","Retroviridae","Herpesviridae"],"answer":"Hepadnaviridae","solution":"A: Picornaviridae include hepatitis A, not B.\nB: Correct: the slides describe Hepadnaviridae as 40-48 nm spherical particles with a single DNA molecule, including Orthohepadnavirus (hepatitis B).\nC: Retroviridae are RNA viruses including HIV, not hepatitis B.\nD: Herpesviridae cause chicken pox and herpes simplex.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 53","difficulty":"Hard"},{"id":"her-v2-055","module":"v2","type":"mcq","q":"Poxviruses are described as ______.","options":["small icosahedral ssRNA viruses","enveloped helical negative-sense RNA viruses","large brick-shaped viruses with a single molecule of double-stranded DNA","naked circular RNA molecules"],"answer":"large brick-shaped viruses with a single molecule of double-stranded DNA","solution":"A: That describes picornaviruses.\nB: That describes paramyxo- and orthomyxoviruses.\nC: Correct: the slides describe Poxviridae as large, brick-shaped, dsDNA viruses including Orthopoxvirus causing smallpox and cowpox.\nD: That describes viroids.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 59","difficulty":"Devil Mode"},{"id":"her-v2-056","module":"v2","type":"mcq","q":"The ICTV taxonomic rank 'family' is identified by which suffix?","options":["-virales","-virus","-virinae","-viridae"],"answer":"-viridae","solution":"A: -virales is the suffix for orders.\nB: -virus is the suffix for genera and species.\nC: -virinae is the suffix for subfamilies.\nD: Correct: the slides state virus families end with the suffix -viridae.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 20","difficulty":"Medium"},{"id":"her-v2-057","module":"v2","type":"mcq","q":"Which suffix is used for virus genera according to ICTV nomenclature?","options":["-virus","-viridae","-viricota","-viria"],"answer":"-virus","solution":"A: Correct: the slides state genera are designated with the suffix -virus and there are over 1400 genera.\nB: -viridae denotes families.\nC: -viricota denotes phyla.\nD: -viria denotes realms.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 23","difficulty":"Hard"},{"id":"her-v2-058","module":"v2","type":"mcq","q":"A virus species is defined by ICTV as a ______.","options":["group defined by a single unique gene","polythetic class defined by more than one property, all of them important","class defined only by host range","formal Latin binomial name"],"answer":"polythetic class defined by more than one property, all of them important","solution":"A: A species is defined by multiple properties, not a single gene.\nB: Correct: the slides state a virus species is a polythetic class defined by more than one property with all properties important.\nC: Host range alone is insufficient under the polythetic concept.\nD: Virus names are not latinized binomials.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 25","difficulty":"Medium"},{"id":"her-v2-059","module":"v2","type":"mcq","q":"In formal virus nomenclature, genus and species names are ______.","options":["always written in capital letters","written in bold","printed in italics","given as latinized binomials"],"answer":"printed in italics","solution":"A: Species designations are not capitalized except for place or host names.\nB: Bold is not part of the formal rules given.\nC: Correct: the slides state first letters of family, subfamily and genus are capitalized, genus and species names are italicized, and species are not capitalized.\nD: The slides explicitly say there are no Latinized binomial terms for viruses.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 26","difficulty":"Hard"},{"id":"her-v2-060","module":"v2","type":"mcq","q":"Which of the following arrangements is NOT a basis for classifying viruses according to the slides?","options":["Nucleic acid type","Host range","Mode of transmission","by the colour of the virion"],"answer":"by the colour of the virion","solution":"A: Nucleic acid is a listed classification basis.\nB: Host range is a listed classification basis.\nC: Mode of transmission is a listed basis.\nD: Correct: classification is based on nucleic acid, structure, replication, host range, transmission and chemical susceptibility, not colour.","source":"Virology 2.pptx | SLIDE 54","difficulty":"Devil Mode"},{"id":"her-v2-061","module":"v2","type":"mcq","q":"DNA viruses replicate using which enzyme?","options":["a DNA-dependent DNA polymerase","RNA-dependent RNA polymerase","reverse transcriptase only","no enzyme at all"],"answer":"a DNA-dependent DNA polymerase","solution":"A: Correct: the slides state DNA viruses replicate using a DNA-dependent polymerase.\nB: That enzyme is used by RNA viruses.\nC: Reverse transcriptase is used by retroviruses, not all DNA viruses.\nD: Viruses rely on host or viral enzymes for genome replication.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 77","difficulty":"Medium"},{"id":"her-v2-062","module":"v2","type":"mcq","q":"About what proportion of all viruses are RNA viruses?","options":["10%","70%","30%","90%"],"answer":"70%","solution":"A: RNA viruses are the majority, not a small fraction.\nB: Correct: the slides state RNA viruses comprise 70% of all viruses and show higher mutation rates than DNA viruses.\nC: 30-50% is the share of traditional herbal preparations in China, not RNA viruses.\nD: The figure given in the slides is 70%.","source":"Virology 2.pptx | SLIDE 58","difficulty":"Hard"},{"id":"her-v2-063","module":"v2","type":"mcq","q":"Which viruses have higher mutation rates according to the slides?","options":["dsDNA viruses","ssDNA viruses","ssRNA viruses","Prions"],"answer":"ssRNA viruses","solution":"A: DNA viruses have lower mutation rates due to proofreading.\nB: ssDNA is usually expanded to dsDNA in the host and is not cited as high-mutation.\nC: Correct: the slides state ssRNA viruses show much higher mutation rates than DNA viruses due to error-prone RNA replication.\nD: Prions contain no nucleic acid and are not covered by this mutation comparison.","source":"Virology 2.pptx | SLIDE 58","difficulty":"Medium"},{"id":"her-v2-064","module":"v2","type":"mcq","q":"Which of the following are examples of double-stranded RNA viruses?","options":["Poliovirus and hepatitis A virus","Rabies virus and influenza virus","Adenovirus and herpesvirus","Reovirus, rotavirus and orbivirus"],"answer":"Reovirus, rotavirus and orbivirus","solution":"A: These are positive-sense ssRNA viruses.\nB: These are negative-sense ssRNA viruses.\nC: These are double-stranded DNA viruses.\nD: Correct: the slides list reovirus, rotavirus and orbivirus as dsRNA viruses.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 66","difficulty":"Hard"},{"id":"her-v2-065","module":"v2","type":"mcq","q":"A positive-sense RNA genome can be ______.","options":["translated directly into protein","translated only after becoming dsDNA","used only as a template for negative-sense RNA","never used for protein synthesis"],"answer":"translated directly into protein","solution":"A: Correct: the quiz notes state positive-sense nucleic acid can be translated directly into protein, while negative-sense cannot.\nB: That describes retroviral replication, not positive-sense RNA.\nC: That describes negative-sense virus replication.\nD: Positive-sense RNA functions as mRNA.","source":"Virology 2.pptx | SLIDE 89","difficulty":"Devil Mode"},{"id":"her-v2-066","module":"v2","type":"mcq","q":"Which of the following is a DNA virus?","options":["Poliovirus","Adenovirus","Influenza virus","Rotavirus"],"answer":"Adenovirus","solution":"A: Poliovirus is a positive-sense ssRNA virus.\nB: Correct: the slides list adenovirus, herpesvirus, SV40 and smallpox virus as double-stranded DNA viruses.\nC: Influenza is a negative-sense ssRNA virus.\nD: Rotavirus is a double-stranded RNA virus.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 65","difficulty":"Medium"},{"id":"her-v2-067","module":"v2","type":"mcq","q":"Bacteriophages are cultivated by ______.","options":["growing them on nutrient agar without bacteria","inoculating embryonated chicken eggs only","infecting a broth culture of the appropriate bacterium","rubbing them on plant leaves"],"answer":"infecting a broth culture of the appropriate bacterium","solution":"A: Phages need living bacterial hosts to replicate.\nB: Egg inoculation is used for animal viruses.\nC: Correct: the slides state phage stock cultures are prepared by allowing phages to infect a broth culture of the appropriate bacterium.\nD: That is a plant virus inoculation method.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 105","difficulty":"Hard"},{"id":"her-v2-068","module":"v2","type":"mcq","q":"Plaque-forming units (pfu) are based on the assumption that ______.","options":["each plaque arises from a single bacterium","each plaque contains exactly one phage","plaques are counted in grams of agar","each visible plaque arises from infection by a single phage particle"],"answer":"each visible plaque arises from infection by a single phage particle","solution":"A: Plaques arise from phage infection of bacteria in a lawn.\nB: A plaque contains many progeny phages, not exactly one.\nC: Plaque counts are expressed per ml of suspension.\nD: Correct: the slides state quantification assumes each plaque arises from a single phage particle.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 108","difficulty":"Medium"},{"id":"her-v2-069","module":"v2","type":"mcq","q":"Viroids consist solely of ______.","options":["a short circular single-stranded RNA without a protein coat or envelope","a misfolded protein with no nucleic acid","DNA enclosed in a protein capsid","host cell DNA inside a capsid"],"answer":"a short circular single-stranded RNA without a protein coat or envelope","solution":"A: Correct: the slides define viroids as short circular ssRNA molecules without a protein coat or envelope, infecting angiosperms.\nB: That describes a prion.\nC: That describes a DNA virus.\nD: That describes a pseudovirion.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 117","difficulty":"Hard"},{"id":"her-v2-070","module":"v2","type":"mcq","q":"Prions are infectious particles composed of ______.","options":["single-stranded RNA only","protein only, with no detectable nucleic acid","double-stranded DNA and a capsid","a lipid envelope with glycoproteins"],"answer":"protein only, with no detectable nucleic acid","solution":"A: That describes viroids.\nB: Correct: the slides define prions as infectious protein particles composed solely of protein with no detectable nucleic acid.\nC: That describes a DNA virus.\nD: Enveloped viruses have lipid envelopes, not prions.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 118","difficulty":"Devil Mode"},{"id":"her-v2-071","module":"v2","type":"mcq","q":"Oncogenes are genes associated with ______.","options":["normal cell replication only","production of antibodies","conversion of a cell to a cancerous form","the formation of the capsid"],"answer":"conversion of a cell to a cancerous form","solution":"A: Protooncogenes serve normal replication; oncogenes are the altered cancer-associated forms.\nB: Antibody genes are not oncogenes.\nC: Correct: the slides define an oncogene as a gene associated with conversion of a cell to a cancerous form.\nD: Capsid genes are structural viral genes, not oncogenes.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 120","difficulty":"Medium"},{"id":"her-v2-072","module":"v2","type":"mcq","q":"Which of the following is an advantageous use of viruses?","options":["Causing disease in humans only","Destroying useful bacteria exclusively","Weaponization for biological warfare","Preparation of vaccines and use in genetic engineering"],"answer":"Preparation of vaccines and use in genetic engineering","solution":"A: Disease is listed as a disadvantage.\nB: Destroying useful bacteria is listed as a disadvantage.\nC: Biological warfare is listed as a disadvantage.\nD: Correct: the slides list vaccine preparation (pox, mumps, polio), genetic studies and nanotechnology as advantages.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 122","difficulty":"Hard"},{"id":"her-v2-073","module":"v2","type":"mcq","q":"A definitive host is one that ______.","options":["harbours the parasite in its adult stage or where sexual reproduction occurs","harbours only larval stages","is never affected by the infection","is naturally infected by the parasite"],"answer":"harbours the parasite in its adult stage or where sexual reproduction occurs","solution":"A: Correct: the slides define a definitive host as harbouring the adult stage or supporting sexual reproduction.\nB: That describes an intermediate host.\nC: That describes a reservoir host.\nD: That describes a natural host.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 6","difficulty":"Medium"},{"id":"her-v2-074","module":"v2","type":"mcq","q":"A paratenic host is one in which the parasite ______.","options":["undergoes sexual reproduction","does not develop or replicate but remains until the host is eaten by the definitive host","completes all larval development","always suffers severe disease"],"answer":"does not develop or replicate but remains until the host is eaten by the definitive host","solution":"A: Sexual reproduction occurs in the definitive host.\nB: Correct: the slides define paratenic hosts as hosts where the parasite does not develop or replicate but persists until ingestion by the definitive host.\nC: Larval development occurs in intermediate hosts.\nD: Paratenic hosts are not defined by disease severity.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 6","difficulty":"Hard"},{"id":"her-v2-075","module":"v2","type":"mcq","q":"Which parasite is given as an example of a facultative parasite?","options":["Plasmodium species","Hymenolepis diminuta","Naegleria fowleri","Toxoplasma gondii"],"answer":"Naegleria fowleri","solution":"A: Plasmodium is an obligate parasite.\nB: Hymenolepis diminuta is given as an accidental parasite.\nC: Correct: the slides define facultative parasites as exhibiting both parasitic and free-living modes and give Naegleria fowleri as the example.\nD: Toxoplasma gondii is given as an opportunistic parasite.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 4","difficulty":"Devil Mode"},{"id":"her-v2-076","module":"v2","type":"mcq","q":"Which parasite is described as an erratic parasite?","options":["Entamoeba histolytica in the large intestine","Lice living on the human body","Fasciola species infecting animals","Entamoeba histolytica when found in the liver or lung"],"answer":"Entamoeba histolytica when found in the liver or lung","solution":"A: The large intestine is its normal habitat, so it is not erratic there.\nB: Lice are permanent ectoparasites.\nC: Fasciola is given as a zoonotic parasite.\nD: Correct: the slides define an erratic parasite as one wandering into an organ where it is not usually found, giving E. histolytica in liver or lung.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 5","difficulty":"Medium"},{"id":"her-v2-077","module":"v2","type":"mcq","q":"Human malaria is caused by four main Plasmodium species. Which is the fifth species noted as having evolved?","options":["Plasmodium knowlesi","Plasmodium berghei","Plasmodium cynomolgi","Plasmodium gallinaceum"],"answer":"Plasmodium knowlesi","solution":"A: Correct: the slides list P. vivax, P. ovale, P. malariae and P. falciparum, with P. knowlesi as a new fifth species.\nB: P. berghei is a rodent malaria parasite, not listed as the fifth human species.\nC: P. cynomolgi is a monkey malaria parasite, not listed here.\nD: P. gallinaceum is an avian malaria parasite.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 17","difficulty":"Hard"},{"id":"her-v2-078","module":"v2","type":"mcq","q":"In the Plasmodium life cycle, the asexual phase occurs in ______.","options":["the female Anopheles mosquito","humans","both humans and mosquitoes equally","the liver only"],"answer":"humans","solution":"A: The mosquito supports the sexual phase and sporogony.\nB: Correct: the slides state the human host supports the asexual phase while the female Anopheles mosquito supports the sexual phase.\nC: The phases are divided: asexual in humans, sexual in mosquitoes.\nD: The liver is part of the human phase, but the asexual cycle also includes the blood stage.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 18","difficulty":"Medium"},{"id":"her-v2-079","module":"v2","type":"mcq","q":"The erythrocytic schizogony cycle is completed in 72 hours in ______.","options":["Plasmodium falciparum","Plasmodium vivax","Plasmodium malariae","Plasmodium ovale"],"answer":"Plasmodium malariae","solution":"A: P. falciparum has a 48-hour erythrocytic cycle.\nB: P. vivax has a 48-hour cycle.\nC: Correct: the slides state the blood phase is 48 hours in P. falciparum, P. vivax and P. ovale, and 72 hours in P. malariae.\nD: P. ovale has a 48-hour cycle.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 23","difficulty":"Hard"},{"id":"her-v2-080","module":"v2","type":"mcq","q":"Dormant liver forms that can become active later are called ______.","options":["gametocytes","schizonts","merozoites","hypnozoites"],"answer":"hypnozoites","solution":"A: Gametocytes are the sexual blood forms taken up by mosquitoes.\nB: Schizonts are dividing forms, not dormant forms.\nC: Merozoites are the invasive forms released from schizonts.\nD: Correct: the slides state that in P. vivax and P. ovale some merozoites re-invade liver cells and remain dormant as hypnozoites.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 22","difficulty":"Devil Mode"},{"id":"her-v2-081","module":"v2","type":"mcq","q":"Black water fever is a complication of malaria characterized by ______.","options":["massive haemolysis, haemoglobinuria and acute renal failure","coma due to cerebral capillary plugging","liver enlargement only","severe skin rash"],"answer":"massive haemolysis, haemoglobinuria and acute renal failure","solution":"A: Correct: the slides describe black water fever as rapid RBC destruction with high haemoglobinuria leading to renal failure.\nB: That describes cerebral malaria, not black water fever.\nC: Liver involvement is a separate complication described.\nD: No rash is described for black water fever.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 25","difficulty":"Medium"},{"id":"her-v2-082","module":"v2","type":"mcq","q":"Which local herb is listed in the slides for malaria treatment?","options":["Digitalis purpurea leaves","Cryptolepis sanguinolenta roots","Atropa belladonna roots","Papaver somniferum leaves"],"answer":"Cryptolepis sanguinolenta roots","solution":"A: Digitalis is a source of digoxin, not an antimalarial herb in the slides.\nB: Correct: the slides list Cryptolepis sanguinolenta roots among local herbs for malaria, along with Argemone mexicana and Carica papaya leaves.\nC: Atropa belladonna is a poisonous plant, not listed for malaria.\nD: Opium poppy is not listed as an antimalarial herb.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 27","difficulty":"Hard"},{"id":"her-v2-083","module":"v2","type":"mcq","q":"Entamoeba histolytica has two stages in its life cycle: ______.","options":["trophozoite and sporozoite","cyst and gametocyte","trophozoite (motile feeding) and cyst (quiescent infective)","promastigote and amastigote"],"answer":"trophozoite (motile feeding) and cyst (quiescent infective)","solution":"A: Sporozoites are malaria stages, not amoeba stages.\nB: Gametocytes are Plasmodium sexual forms.\nC: Correct: the slides describe the trophozoite as the motile feeding stage and the cyst as the resistant infective stage.\nD: These are Leishmania forms.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 28","difficulty":"Medium"},{"id":"her-v2-084","module":"v2","type":"mcq","q":"Which organ is most commonly involved in extraintestinal amoebiasis?","options":["The spleen","The lungs only","The brain","The liver (right lobe)"],"answer":"The liver (right lobe)","solution":"A: The spleen is not the most common site of extraintestinal amoebiasis.\nB: Lungs can be involved but the liver is most common.\nC: Brain involvement is possible but rare.\nD: Correct: the slides state the liver, especially the right lobe, is most commonly involved in extraintestinal amoebiasis.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 31","difficulty":"Hard"},{"id":"her-v2-085","module":"v2","type":"mcq","q":"Naegleria fowleri causes ______.","options":["primary amoebic meningoencephalitis (PAM)","amoebic dysentery","giardiasis","trichomoniasis"],"answer":"primary amoebic meningoencephalitis (PAM)","solution":"A: Correct: the slides state N. fowleri causes a fatal brain infection known as naegleriasis or primary amoebic meningoencephalitis.\nB: Dysentery is caused by Entamoeba histolytica.\nC: Giardiasis is caused by Giardia lamblia.\nD: Trichomoniasis is caused by Trichomonas vaginalis.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 34","difficulty":"Devil Mode"},{"id":"her-v2-086","module":"v2","type":"mcq","q":"Naegleria fowleri enters the human body through the ______.","options":["mouth, via contaminated food","nose, migrating to the brain via olfactory nerves","skin, through a cut","blood transfusion"],"answer":"nose, migrating to the brain via olfactory nerves","solution":"A: Ingestion is not the route; the nasal route is described.\nB: Correct: the slides state the amoeba enters the nose during swimming or sinus irrigation and migrates to the brain via olfactory nerves.\nC: Skin penetration is not the route for Naegleria.\nD: Blood transfusion is not the transmission route described.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 36","difficulty":"Medium"},{"id":"her-v2-087","module":"v2","type":"mcq","q":"Giardia lamblia is transmitted by ______.","options":["the bite of an insect vector","sexual contact","ingestion of the infective cyst","inhalation of aerosols"],"answer":"ingestion of the infective cyst","solution":"A: Giardia is not vector-borne.\nB: Sexual transmission is described for Trichomonas, not Giardia.\nC: Correct: the slides state Giardia's life cycle has trophozoite and cyst stages and transmission is by ingestion of the infective cyst.\nD: Inhalation is the route for Naegleria, not Giardia.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 39","difficulty":"Hard"},{"id":"her-v2-088","module":"v2","type":"mcq","q":"Giardiasis stool typically shows ______.","options":["bloody stools with extensive tissue destruction","terminal haematuria","steatorrhoea with blood and pus","foul-smelling watery diarrhoea with blood and pus rarely present"],"answer":"foul-smelling watery diarrhoea with blood and pus rarely present","solution":"A: Giardia does not invade the mucosa, so blood is rare.\nB: Haematuria is a feature of S. haematobium infection.\nC: Steatorrhoea occurs but blood and pus are rare.\nD: Correct: the slides state blood and pus are rarely present, consistent with absence of tissue destruction.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 41","difficulty":"Medium"},{"id":"her-v2-089","module":"v2","type":"mcq","q":"Trichomonas vaginalis has which life-cycle stage?","options":["Trophozoite only","Cyst and trophozoite","Trophozoite and sporozoite","Cyst only"],"answer":"Trophozoite only","solution":"A: Correct: the slides state Trichomonas has a trophozoite stage only and replicates by binary fission.\nB: Trichomonas has no cyst stage.\nC: Sporozoites are malaria stages.\nD: A cyst-only cycle is not described for any parasite here.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 43","difficulty":"Hard"},{"id":"her-v2-090","module":"v2","type":"mcq","q":"Leishmania species exist in which two forms?","options":["trophozoite and cyst","amastigote (aflagellar) and promastigote (flagellated)","sporozoite and merozoite","microfilaria and filariform larva"],"answer":"amastigote (aflagellar) and promastigote (flagellated)","solution":"A: Those are amoebic stages.\nB: Correct: the slides state Leishmania has amastigote and promastigote forms and is transmitted by sandflies.\nC: Those are Plasmodium stages.\nD: Those are filarial worm stages.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 48","difficulty":"Devil Mode"},{"id":"her-v2-091","module":"v2","type":"mcq","q":"Visceral leishmaniasis caused by Leishmania donovani is also known as ______.","options":["sleeping sickness","Chagas disease","kala-azar","river blindness"],"answer":"kala-azar","solution":"A: Sleeping sickness is African trypanosomiasis.\nB: Chagas disease is American trypanosomiasis caused by T. cruzi.\nC: Correct: the slides describe visceral leishmaniasis with fever, weight loss, anaemia and hepatosplenomegaly; it is commonly called kala-azar.\nD: River blindness is onchocerciasis.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 51","difficulty":"Medium"},{"id":"her-v2-092","module":"v2","type":"mcq","q":"African sleeping sickness is transmitted by which vector?","options":["The female Anopheles mosquito","Sandflies","Blackflies (Simulium)","The tsetse fly"],"answer":"The tsetse fly","solution":"A: Anopheles transmits malaria.\nB: Sandflies transmit leishmaniasis.\nC: Blackflies transmit onchocerciasis.\nD: Correct: the slides state the vector for both T. b. gambiense and T. b. rhodesiense is the tsetse fly.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 53","difficulty":"Hard"},{"id":"her-v2-093","module":"v2","type":"mcq","q":"Which drug is approved as a 10-day oral treatment for both stages of Trypanosoma brucei gambiense sleeping sickness?","options":["Fexinidazole","Chloroquine","Metronidazole","Praziquantel"],"answer":"Fexinidazole","solution":"A: Correct: the slides state fexinidazole was approved in 2018 as a 10-day oral regimen for both stages of T. b. gambiense sleeping sickness.\nB: Chloroquine is an antimalarial drug.\nC: Metronidazole treats amoebiasis and giardiasis.\nD: Praziquantel treats schistosomiasis.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 56","difficulty":"Medium"},{"id":"her-v2-094","module":"v2","type":"mcq","q":"Schistosoma haematobium causes ______.","options":["intestinal schistosomiasis","urinary schistosomiasis with terminal haematuria","cerebral malaria","elephantiasis"],"answer":"urinary schistosomiasis with terminal haematuria","solution":"A: Intestinal schistosomiasis is caused by S. mansoni, S. japonicum, S. intercalatum and S. mekongi.\nB: Correct: the slides state S. haematobium causes urinary schistosomiasis and infected patients suffer terminal haematuria and painful micturition.\nC: Cerebral malaria is a Plasmodium falciparum complication.\nD: Elephantiasis is caused by Wuchereria bancrofti.","source":"Helminths Parasitology.pptx | SLIDE 8","difficulty":"Hard"},{"id":"her-v2-095","module":"v2","type":"mcq","q":"The snail intermediate host preferred by Schistosoma mansoni is ______.","options":["Bulinus species","Oncomelania species","Biomphalaria species","Anopheles mosquitoes"],"answer":"Biomphalaria species","solution":"A: Bulinus is preferred by S. haematobium and S. intercalatum.\nB: Oncomelania is infected by S. japonicum.\nC: Correct: the slide notes state S. mansoni prefers Biomphalaria species, while Bulinus is preferred by S. haematobium.\nD: Mosquitoes are not snail intermediate hosts.","source":"Helminths Parasitology.pptx | SLIDE 5","difficulty":"Devil Mode"},{"id":"her-v2-096","module":"v2","type":"mcq","q":"The infective stage of Schistosoma for humans is the ______.","options":["miracidium","oncosphere","microfilaria","cercaria"],"answer":"cercaria","solution":"A: The miracidium hatches from the egg and infects the snail, not humans.\nB: Oncosphere is the larval stage of Taenia.\nC: Microfilaria is the larval stage of filarial worms.\nD: Correct: the slides state cercariae develop in the snail and penetrate human skin during exposure to infested water.","source":"Helminths Parasitology.pptx | SLIDE 7","difficulty":"Medium"},{"id":"her-v2-097","module":"v2","type":"mcq","q":"Which drug is effective against all Schistosoma species?","options":["Praziquantel","Oxamniquine","Metrifonate","Niclosamide"],"answer":"Praziquantel","solution":"A: Correct: the slides state praziquantel is effective against all species, while oxamniquine and metrifonate are species-specific.\nB: Oxamniquine is effective only against S. mansoni.\nC: Metrifonate is effective for urinary schistosomiasis (S. haematobium).\nD: Niclosamide is used for tapeworm infections.","source":"Helminths Parasitology.pptx | SLIDE 10","difficulty":"Hard"},{"id":"her-v2-098","module":"v2","type":"mcq","q":"Taenia saginata is commonly called the ______.","options":["pork tapeworm","beef tapeworm","dwarf tapeworm","rat tapeworm"],"answer":"beef tapeworm","solution":"A: The pork tapeworm is Taenia solium.\nB: Correct: the slides label T. saginata as the beef tapeworm with cattle as the intermediate host.\nC: The dwarf tapeworm is Hymenolepis nana.\nD: The rat tapeworm is Hymenolepis diminuta.","source":"Helminths Parasitology.pptx | SLIDE 12","difficulty":"Medium"},{"id":"her-v2-099","module":"v2","type":"mcq","q":"Humans acquire Taenia saginata infection by ______.","options":["drinking water containing miracidia","being bitten by a tsetse fly","eating undercooked beef containing cysticercus bovis","skin penetration by cercariae"],"answer":"eating undercooked beef containing cysticercus bovis","solution":"A: Miracidia are trematode stages, not Taenia stages.\nB: Tsetse flies transmit trypanosomiasis.\nC: Correct: the slides state humans acquire infective larvae from eating undercooked meat, with cattle as intermediate host.\nD: That is schistosome transmission.","source":"Helminths Parasitology.pptx | SLIDE 14","difficulty":"Hard"},{"id":"her-v2-100","module":"v2","type":"mcq","q":"Hymenolepis nana is unique among tapeworms described because its egg ______.","options":["requires an intermediate snail host","must develop in undercooked meat","is acquired only by insect bites","is immediately infective when passed, allowing autoinfection"],"answer":"is immediately infective when passed, allowing autoinfection","solution":"A: H. nana does not require a snail host.\nB: That applies to Taenia species.\nC: H. nana is acquired by ingestion of eggs.\nD: Correct: the slides state H. nana eggs are immediately infective when passed and autoinfection is common.","source":"Helminths Parasitology.pptx | SLIDE 16","difficulty":"Devil Mode"},{"id":"her-v2-101","module":"v2","type":"mcq","q":"Ascaris lumbricoides larvae migrate through which route before reaching the small intestine?","options":["intestinal mucosa, portal circulation, heart, lungs, trachea, oesophagus","directly from stomach to small intestine without migration","through the skin and then the lymphatics","via the urinary bladder"],"answer":"intestinal mucosa, portal circulation, heart, lungs, trachea, oesophagus","solution":"A: Correct: the slides describe larvae hatching in the duodenum, entering the portal circulation, reaching the heart and lungs, ascending the trachea and descending to the small intestine.\nB: A tissue migration phase is described.\nC: That is the hookworm or Strongyloides route.\nD: That route is not described for Ascaris.","source":"Helminths Parasitology.pptx | SLIDE 19","difficulty":"Medium"},{"id":"her-v2-102","module":"v2","type":"mcq","q":"A female Ascaris lumbricoides may produce up to how many eggs per day?","options":["2,000-10,000","240,000","40,000","1,000,000"],"answer":"240,000","solution":"A: That is the daily egg output of Trichuris trichiura.\nB: Correct: the slides state a female may produce up to 240,000 immature eggs per day.\nC: That is the approximate number of primary oocytes at puberty in the female reproductive system notes.\nD: This exceeds the figure given in the slides.","source":"Helminths Parasitology.pptx | SLIDE 21","difficulty":"Hard"},{"id":"her-v2-103","module":"v2","type":"mcq","q":"Hookworm infection causes iron deficiency anaemia because the adult worms ______.","options":["destroy red blood cells in the lungs","block the lymphatic vessels","feed on blood in the small intestine","prevent iron absorption in the stomach"],"answer":"feed on blood in the small intestine","solution":"A: Larvae may inflame lungs, but anaemia results from adult blood feeding.\nB: Lymphatic blockage is caused by filarial worms.\nC: Correct: the slides state adult hookworms feed on blood, causing iron deficiency anaemia.\nD: The mechanism described is blood feeding, not blocked absorption.","source":"Helminths Parasitology.pptx | SLIDE 26","difficulty":"Medium"},{"id":"her-v2-104","module":"v2","type":"mcq","q":"Wuchereria bancrofti microfilariae show nocturnal periodicity, being most numerous in peripheral blood ______.","options":["between 6 am and 10 am","only during fever spikes","throughout the day equally","between 10 pm and 2 am"],"answer":"between 10 pm and 2 am","solution":"A: That is not the period given in the slides.\nB: Periodicity is described by time of day, not fever.\nC: The slides describe a marked nocturnal periodicity.\nD: Correct: the slides state microfilariae are seen in greatest numbers in peripheral blood at night between 10 pm and 2 am.","source":"Helminths Parasitology.pptx | SLIDE 30","difficulty":"Hard"},{"id":"her-v2-105","module":"v2","type":"mcq","q":"Elephantiasis (gross lymphedema with thickened skin) is caused by ______.","options":["Wuchereria bancrofti","Onchocerca volvulus","Loa loa","Trichuris trichiura"],"answer":"Wuchereria bancrofti","solution":"A: Correct: the slides state adult W. bancrofti cause lymphatic blockage leading to lymphedema and elephantiasis.\nB: Onchocerca causes river blindness and skin nodules.\nC: Loa loa causes Calabar swellings and eye worm.\nD: Trichuris causes trichuriasis, not elephantiasis.","source":"Helminths Parasitology.pptx | SLIDE 31","difficulty":"Devil Mode"},{"id":"her-v2-106","module":"v2","type":"mcq","q":"Onchocerciasis, or 'river blindness', is transmitted by ______.","options":["Anopheles mosquitoes","female blackflies (Simulium damnosum)","Chrysops (mango/deer flies)","Tsetse flies"],"answer":"female blackflies (Simulium damnosum)","solution":"A: Anopheles transmit malaria.\nB: Correct: the slides state Onchocerca volvulus is transmitted by female blackflies breeding in fast-flowing rivers.\nC: Chrysops transmits Loa loa.\nD: Tsetse flies transmit African trypanosomiasis.","source":"Helminths Parasitology.pptx | SLIDE 33","difficulty":"Medium"},{"id":"her-v2-107","module":"v2","type":"mcq","q":"Ivermectin treatment of onchocerciasis ______.","options":["kills adult worms immediately in one dose","is ineffective against microfilariae","kills microfilariae but not adult worms, requiring repeated treatment","requires surgical removal of nodules"],"answer":"kills microfilariae but not adult worms, requiring repeated treatment","solution":"A: Ivermectin does not kill adult worms.\nB: Ivermectin is effective against microfilariae.\nC: Correct: the slides state ivermectin kills microfilariae but not adult worms and repeated treatment is needed over years.\nD: Nodule removal is not the described treatment.","source":"Helminths Parasitology.pptx | SLIDE 37","difficulty":"Hard"},{"id":"her-v2-108","module":"v2","type":"mcq","q":"Loa loa filariasis is transmitted by which vector?","options":["Simulium blackflies","Culex mosquitoes","Sandflies","Chrysops species (mango/deer/horse flies)"],"answer":"Chrysops species (mango/deer/horse flies)","solution":"A: Simulium transmits Onchocerca volvulus.\nB: Culex is not the vector given for Loa loa.\nC: Sandflies transmit Leishmania.\nD: Correct: the slides state the vector for Loa loa is the mango fly/deer fly/horse fly, Chrysops species.","source":"Helminths Parasitology.pptx | SLIDE 38","difficulty":"Medium"},{"id":"her-v2-109","module":"v2","type":"mcq","q":"A severe adverse event following ivermectin or DEC treatment of heavy Loa loa infection is ______.","options":["post-IVM/DEC encephalopathy from rapid killing of microfilariae","acute liver failure","severe haemolysis","anaphylaxis from the fly bite"],"answer":"post-IVM/DEC encephalopathy from rapid killing of microfilariae","solution":"A: Correct: the slides describe post-IVM/DEC encephalopathy due to rapid microfilarial killing and CNS inflammation.\nB: The described severe event is encephalopathy, not liver failure.\nC: Haemolysis is not the described adverse event.\nD: The event follows treatment, not the bite.","source":"Helminths Parasitology.pptx | SLIDE 39","difficulty":"Hard"},{"id":"her-v2-110","module":"v2","type":"mcq","q":"Strongyloides stercoralis is described as a ______.","options":["strict obligate parasite","facultative parasite with free-living and parasitic cycles","tapeworm with proglottids","trematode with a snail host"],"answer":"facultative parasite with free-living and parasitic cycles","solution":"A: Strongyloides can live free in soil, so it is facultative.\nB: Correct: the slides state S. stercoralis is a facultative parasite that can complete cycles in soil or in humans.\nC: Strongyloides is a roundworm (nematode).\nD: Strongyloides does not use a snail host.","source":"Helminths Parasitology.pptx | SLIDE 40","difficulty":"Devil Mode"},{"id":"her-v2-111","module":"v2","type":"mcq","q":"Strongyloides stercoralis can cause autoinfection because ______.","options":["eggs are immediately infective when passed in stool","adult worms live in the lungs","rhabditiform larvae in the lumen can moult into infective filariform larvae that penetrate the intestinal wall","it requires an insect vector for each cycle"],"answer":"rhabditiform larvae in the lumen can moult into infective filariform larvae that penetrate the intestinal wall","solution":"A: That applies to Enterobius and Hymenolepis nana.\nB: Adults live in the small intestine.\nC: Correct: the slides describe larvae moulting to filariform larvae in the lumen and penetrating the intestinal wall, causing autoinfection.\nD: No insect vector is required.","source":"Helminths Parasitology.pptx | SLIDE 41","difficulty":"Medium"},{"id":"her-v2-112","module":"v2","type":"mcq","q":"Enterobius vermicularis (pinworm) females lay their eggs ______.","options":["in the small intestine lumen","in the large intestine and passed in stool only","inside a snail intermediate host","on the perianal skin at night"],"answer":"on the perianal skin at night","solution":"A: Eggs are deposited on perianal skin, not in the lumen.\nB: Perianal deposition is the described behaviour.\nC: No snail host is involved.\nD: Correct: the slides state the female moves out through the anus to glue eggs on the perianal skin, usually at night.","source":"Helminths Parasitology.pptx | SLIDE 45","difficulty":"Hard"},{"id":"her-v2-113","module":"v2","type":"mcq","q":"The characteristic symptom of enterobiasis is ______.","options":["nocturnal itching around the anus (pruritus ani)","terminal haematuria","elephantiasis of the leg","cercarial dermatitis (swimmer's itch)"],"answer":"nocturnal itching around the anus (pruritus ani)","solution":"A: Correct: the slides state worm migration causes allergic reactions and nocturnal itching (pruritus ani) and enuresis.\nB: Haematuria is a schistosome symptom.\nC: That is lymphatic filariasis.\nD: That is a schistosome symptom.","source":"Helminths Parasitology.pptx | SLIDE 46","difficulty":"Medium"},{"id":"her-v2-114","module":"v2","type":"mcq","q":"Trichuris trichiura eggs become embryonated and infective in soil after ______.","options":["14 days to several weeks","2-3 weeks","24 hours","6 months"],"answer":"2-3 weeks","solution":"A: That is the embryonation time for Ascaris eggs.\nB: Correct: the slides state eggs become embryonated infective eggs in the soil after 2-3 weeks.\nC: Embryonation takes much longer than one day.\nD: This is far longer than the period given.","source":"Helminths Parasitology.pptx | SLIDE 47","difficulty":"Hard"},{"id":"her-v1-076","module":"v1","type":"mcq","q":"Which of the following are classified as lexical (open-class) items in the word classes lecture?","options":["Prepositions, pronouns and determiners","Conjunctions, interjections and determiners","Only nouns and verbs","Nouns, verbs, adjectives and adverbs"],"answer":"Nouns, verbs, adjectives and adverbs","solution":"A: These are closed-class (non-lexical) items.\nB: These are non-lexical items with little semantic content alone.\nC: Adjectives and adverbs are also lexical items.\nD: Correct: the slides state lexical items carry semantic content, are open class, and comprise nouns, verbs, adjectives and adverbs.","source":"157 - word classes.pptx | SLIDE 3","difficulty":"Devil Mode"},{"id":"her-v1-077","module":"v1","type":"mcq","q":"Which suffix is NOT listed as commonly associated with nouns?","options":["-ly","-ness","-ion","-hood"],"answer":"-ly","solution":"A: Correct: -ly is identified as an adverb suffix, while -er, -ion, -or, -ness and -hood are listed as noun suffixes.\nB: -ness forms nouns such as fitness and dryness.\nC: -ion forms nouns such as nation and consultation.\nD: -hood forms nouns such as childhood and neighbourhood.","source":"157 - word classes.pptx | SLIDE 5","difficulty":"Medium"},{"id":"her-v1-078","module":"v1","type":"mcq","q":"Nouns ending in 'y' after a consonant form their plural by ______.","options":["adding only 's'","dropping the 'y' and adding 'ies'","adding 'es' without dropping the 'y'","changing the 'y' to 'ies' only for proper nouns"],"answer":"dropping the 'y' and adding 'ies'","solution":"A: That rule applies to most count nouns like book-books, not consonant + y nouns.\nB: Correct: the slides give lady-ladies, country-countries and baby-babies as examples of this rule.\nC: The 'y' must be dropped before adding 'ies'.\nD: The rule applies to common nouns such as lady and baby.","source":"157 - word classes.pptx | SLIDE 6","difficulty":"Hard"},{"id":"her-v1-079","module":"v1","type":"mcq","q":"Which of these is a non-count noun that retains the same form in singular and plural?","options":["Book","Baby","News","Mango"],"answer":"News","solution":"A: Book is a count noun with plural books.\nB: Baby is a count noun with plural babies.\nC: Correct: the slides list news, luggage and knowledge as non-count nouns that retain their form.\nD: Mango is a count noun with plural mangoes.","source":"157 - word classes.pptx | SLIDE 7","difficulty":"Medium"},{"id":"her-v1-080","module":"v1","type":"mcq","q":"The plural possessive of a plural noun ending in 's' is formed by ______.","options":["adding an apostrophe and 's'","adding only 's'","adding no mark at all","adding only an apostrophe"],"answer":"adding only an apostrophe","solution":"A: That is used for singular nouns and plural nouns not ending in s.\nB: An apostrophe is required to show possession.\nC: Possession must be indicated by an apostrophe.\nD: Correct: the slides give 'the players' ball' as the example of a plural noun ending in s taking only an apostrophe.","source":"157 - word classes.pptx | SLIDE 8","difficulty":"Hard"},{"id":"her-v1-081","module":"v1","type":"mcq","q":"In the sentence 'Kwame goes to school', 'Kwame' functions as the ______.","options":["subject","object","complement","appositive"],"answer":"subject","solution":"A: Correct: the slides show a noun before the main verb functions as the subject.\nB: The object occurs after an action verb, as in 'Kofi eats rice'.\nC: A complement follows a linking verb, as in 'My father is a farmer'.\nD: An appositive renames another noun, as in 'Michael Essien, the footballer'.","source":"157 - word classes.pptx | SLIDE 10","difficulty":"Devil Mode"},{"id":"her-v1-082","module":"v1","type":"mcq","q":"Regular verbs form their simple past tense by ______.","options":["adding -s or -es","adding -d or -ed","adding -ing","changing the vowel only"],"answer":"adding -d or -ed","solution":"A: That forms the third-person singular present tense.\nB: Correct: the slides state regular verbs add -d or -ed, e.g. cook-cooked, while irregular verbs change structurally.\nC: That forms the progressive aspect.\nD: Vowel change is typical of irregular verbs like sing-sang.","source":"157 - word classes.pptx | SLIDE 20","difficulty":"Medium"},{"id":"her-v1-083","module":"v1","type":"mcq","q":"The progressive aspect of a verb is written with ______.","options":["a form of 'have' plus a past participle","'will' plus the bare form","a form of 'be' plus the -ing form of the verb","only the bare form of the verb"],"answer":"a form of 'be' plus the -ing form of the verb","solution":"A: That describes the perfective aspect.\nB: That indicates future time.\nC: Correct: the slides state the progressive uses be (am, is, are, was, were) with a verb in its -ing form.\nD: The bare form alone does not mark aspect.","source":"157 - word classes.pptx | SLIDE 21","difficulty":"Hard"},{"id":"her-v1-084","module":"v1","type":"mcq","q":"Which adverb suffix is mentioned in the slides as identifying many adverbs?","options":["-ous","-ive","-ness","-ly"],"answer":"-ly","solution":"A: -ous is an adjective suffix such as famous.\nB: -ive is an adjective suffix such as attractive.\nC: -ness is a noun suffix such as fitness.\nD: Correct: the slides state some adverbs are identified with the suffix -ly.","source":"157 - word classes.pptx | SLIDE 29","difficulty":"Medium"},{"id":"her-v1-085","module":"v1","type":"mcq","q":"Which statement about adverb placement is correct according to the slides?","options":["Adverbs are mobile and can begin, end, or follow the subject, but misplacement can cause ambiguity","Adverbs must always come at the end of a sentence","Adverbs never cause ambiguity","Adverbs can only modify nouns"],"answer":"Adverbs are mobile and can begin, end, or follow the subject, but misplacement can cause ambiguity","solution":"A: Correct: the slides describe adverb mobility and warn that improper placement causes ambiguity.\nB: The slides explicitly say adverbs can begin a sentence or follow the subject.\nC: The slides warn misplaced adverbs cause ambiguity.\nD: Adverbs modify verbs, adjectives and other adverbs.","source":"157 - word classes.pptx | SLIDE 30","difficulty":"Hard"},{"id":"her-v1-086","module":"v1","type":"mcq","q":"Prepositions of time 'at', 'on' and 'in' are used respectively for ______.","options":["days, specific times, and years","specific times, days/dates, and non-specific parts of day/month/season/year","months, dates, and clock times","only for places, never for time"],"answer":"specific times, days/dates, and non-specific parts of day/month/season/year","solution":"A: The assignments are reversed for at and on.\nB: Correct: the slides give at 4:00am, on Monday, and in 1982 as the respective uses.\nC: These do not match the rules in the slides.\nD: The slides give a separate section on prepositions of time.","source":"157 - word classes.pptx | SLIDE 39","difficulty":"Devil Mode"},{"id":"her-v1-087","module":"v1","type":"mcq","q":"Which of the following is NOT a type of pronoun listed in the slides?","options":["Demonstrative pronoun","Interrogative pronoun","Relative conjunction","Personal pronoun"],"answer":"Relative conjunction","solution":"A: This, that, these and those are listed as demonstrative pronouns.\nB: Wh-words are listed as interrogative pronouns.\nC: Correct: the listed pronoun types include personal, demonstrative, relative, interrogative, indefinite, reflexive and intensive, not 'relative conjunction'.\nD: I, we, you, he, she, it and they are listed as personal pronouns.","source":"157 - word classes.pptx | SLIDE 43","difficulty":"Medium"},{"id":"her-v1-088","module":"v1","type":"mcq","q":"The wh-words 'what, which, who, whom, when, whose' are examples of ______.","options":["demonstrative pronouns","relative pronouns","interjections","interrogative pronouns"],"answer":"interrogative pronouns","solution":"A: Demonstrative pronouns are this, that, these and those.\nB: Relative pronouns are not the wh-words listed here.\nC: Interjections express emotion, e.g. ouch or wow.\nD: Correct: the slides state these wh-words are interrogative pronouns that introduce questions.","source":"157 - word classes.pptx | SLIDE 47","difficulty":"Hard"},{"id":"her-v1-089","module":"v1","type":"mcq","q":"Which conjunction is given as showing contrast between two grammatical units?","options":["But","And","So","Because"],"answer":"But","solution":"A: Correct: the slides state conjunctions such as but and yet show contrast.\nB: And joins similar units but does not show contrast.\nC: So indicates result, not contrast.\nD: Because indicates subordination/cause.","source":"157 - word classes.pptx | SLIDE 52","difficulty":"Medium"},{"id":"her-v1-090","module":"v1","type":"mcq","q":"Which conjunction is listed as indicating subordination in clauses?","options":["Yet","Because","For","Or"],"answer":"Because","solution":"A: Yet shows contrast between units.\nB: Correct: the slides list because, while, if and since as conjunctions indicating subordination.\nC: For is given as a joining/contrast conjunction in the slides.\nD: Or joins alternatives, not subordination.","source":"157 - word classes.pptx | SLIDE 53","difficulty":"Hard"},{"id":"her-v1-091","module":"v1","type":"mcq","q":"Reading that involves understanding meanings embedded in stresses and intonation is called ______.","options":["reading aloud","skimming","reading for comprehension","scanning"],"answer":"reading for comprehension","solution":"A: Reading aloud focuses on the relationship between symbols and sounds.\nB: Skimming seeks the gist of a text.\nC: Correct: the slides contrast reading aloud with reading for comprehension, which links orthography directly to meaning.\nD: Scanning locates a specific fact.","source":"Comprehension and Summary.pptx | SLIDE 3","difficulty":"Devil Mode"},{"id":"her-v1-092","module":"v1","type":"mcq","q":"Skimming as a reading technique aims at ______.","options":["locating one specific fact quickly","yielding the full meaning of a text","memorizing every word","identifying the gist of a story or text"],"answer":"identifying the gist of a story or text","solution":"A: That is scanning.\nB: That is close reading.\nC: Skimming does not seek individual words.\nD: Correct: the slides define skimming as obtaining the gist rather than identifying individual words or figures.","source":"Comprehension and Summary.pptx | SLIDE 8","difficulty":"Medium"},{"id":"her-v1-093","module":"v1","type":"mcq","q":"Which comprehension question type has answers that can be found directly in the passage?","options":["Content questions","Inferential questions","Appreciative questions","Vocabulary in context questions"],"answer":"Content questions","solution":"A: Correct: the slides state content questions have answers found directly in the passage and begin with who, when, what, how or which.\nB: Inferential answers are cued but not stated directly.\nC: These ask about the writer's choice of words and figures of speech.\nD: These require a replacement word based on context.","source":"Comprehension and Summary.pptx | SLIDE 12","difficulty":"Hard"},{"id":"her-v1-094","module":"v1","type":"mcq","q":"The figure of speech that compares two dissimilar things using 'like' or 'as' is ______.","options":["metaphor","simile","personification","hyperbole"],"answer":"simile","solution":"A: Metaphor makes the comparison without like or as.\nB: Correct: the lecture notes define simile as comparison between two dissimilar things saying one is like the other.\nC: Personification gives human traits to non-human things.\nD: Hyperbole uses exaggeration for emphasis.","source":"Comprehension and Summary.pptx | SLIDE 13","difficulty":"Medium"},{"id":"her-v1-095","module":"v1","type":"mcq","q":"SQ3R stands for ______.","options":["Scan, Question, Read, Record, Revise","Survey, Quiz, Read, Repeat, Revise","Survey, Question, Read, Recite, Review","Summarise, Question, Read, Recite, Report"],"answer":"Survey, Question, Read, Recite, Review","solution":"A: The first step is Survey, not Scan.\nB: The correct terms are Question, Recite and Review.\nC: Correct: the slides spell out SQ3R as Survey, Question, Read, Recite and Review.\nD: The first and last steps are Survey and Review.","source":"Comprehension and Summary.pptx | SLIDE 14","difficulty":"Hard"},{"id":"her-v1-096","module":"v1","type":"mcq","q":"A good summary should ______.","options":["include all descriptive details and examples","add the writer's personal judgements","reproduce the original sentence by sentence","be brief, focus on essential points and be in your own words"],"answer":"be brief, focus on essential points and be in your own words","solution":"A: Descriptive details and examples are excluded from a summary.\nB: A summary must not include comments or judgements.\nC: Points in a summary do not correspond sentence by sentence.\nD: Correct: the slides state a summary restates, is brief, focuses on essential points and uses your own words.","source":"Comprehension and Summary.pptx | SLIDE 19","difficulty":"Devil Mode"},{"id":"her-v1-097","module":"v1","type":"mcq","q":"Ambiguity is defined as ______.","options":["a sentence or part of a sentence having more than one reasonable interpretation","the use of a word exactly as the dictionary defines it","a sentence with one clear meaning","only deliberate use of metaphor"],"answer":"a sentence or part of a sentence having more than one reasonable interpretation","solution":"A: Correct: the slides define ambiguity as a language situation where a sentence has more than one meaning or interpretation.\nB: That is precise usage, not ambiguity.\nC: That is the opposite of ambiguity.\nD: Ambiguity may be intended or unintended, and is not limited to metaphor.","source":"ENGL 157 - Ambiguity, Dangling and Misrelated Cons-1 (1).pptx | SLIDE 2","difficulty":"Medium"},{"id":"her-v1-098","module":"v1","type":"mcq","q":"The sentence 'I met Mr. Anane at the court' is an example of lexical ambiguity because ______.","options":["the verb 'met' has two tenses","'court' has more than one possible meaning","the subject is missing","it uses a figure of speech"],"answer":"'court' has more than one possible meaning","solution":"A: The ambiguity arises from the noun 'court', not the verb tense.\nB: Correct: the slides list the possible meanings of 'court' as a legal place, a games space, an overlord's residence or a space in a house.\nC: The sentence has a subject; the ambiguity is lexical.\nD: The ambiguity is due to multiple word meanings, not figurative language.","source":"ENGL 157 - Ambiguity, Dangling and Misrelated Cons-1 (1).pptx | SLIDE 3","difficulty":"Hard"},{"id":"her-v1-099","module":"v1","type":"mcq","q":"Unclear modification is a source of which type of ambiguity?","options":["Lexical ambiguity","Categorical ambiguity","Structural ambiguity","Conceptual ambiguity"],"answer":"Structural ambiguity","solution":"A: Lexical ambiguity arises from a single word with several meanings.\nB: Categorical ambiguity arises when a word functions differently in different contexts.\nC: Correct: the slides list unclear modification, wrong adverb placement, nominal clauses and pronoun placement as sources of structural ambiguity.\nD: Conceptual ambiguity arises when a word refers to different concepts.","source":"ENGL 157 - Ambiguity, Dangling and Misrelated Cons-1 (1).pptx | SLIDE 8","difficulty":"Medium"},{"id":"her-v1-100","module":"v1","type":"mcq","q":"In 'Having finished the assignment, the TV was turned on', the dangling modifier arises because ______.","options":["the verb is in the passive voice","the sentence has no object","the word 'finished' is misspelled","the introductory phrase is not attached to the noun that performed the action"],"answer":"the introductory phrase is not attached to the noun that performed the action","solution":"A: Passive voice is not the cause; the problem is the modifier's attachment.\nB: The sentence has an object; the problem is the modifier.\nC: The error is structural, not orthographic.\nD: Correct: the slides explain that an introductory phrase must relate to the first noun or pronoun following it; here the TV did not finish the assignment.","source":"ENGL 157 - Ambiguity, Dangling and Misrelated Cons-1 (1).pptx | SLIDE 15","difficulty":"Hard"},{"id":"her-v1-101","module":"v1","type":"mcq","q":"Which of the following is a cause of misrelated/dangling modification?","options":["Omission of the subject that should be modified","Overuse of conjunctions","Using too many adjectives","Incorrect spelling"],"answer":"Omission of the subject that should be modified","solution":"A: Correct: the slides list misplacement of subject, omission of subject and modifiers modifying other modifiers as causes.\nB: Conjunction overuse is not listed as a cause.\nC: Adjective quantity is not the cause described.\nD: Spelling is not the cause of dangling modification.","source":"ENGL 157 - Ambiguity, Dangling and Misrelated Cons-1 (1).pptx | SLIDE 17","difficulty":"Devil Mode"},{"id":"her-v1-102","module":"v1","type":"mcq","q":"A correctly formed summary should exclude ______.","options":["The main idea of each paragraph","rhetorical questions and parenthetical examples","Transitional markers","Neutral presentation of material"],"answer":"rhetorical questions and parenthetical examples","solution":"A: Main ideas are essential to a summary.\nB: Correct: the slides instruct summary writers to remove examples, parenthetical examples and rhetorical questions.\nC: Transitional markers are noted as useful guidelines in summary writing.\nD: The summary must be presented in a neutral
