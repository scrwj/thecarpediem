:"v2","type":"mcq","q":"Trace elements such as iron, copper, molybdenum and zinc serve mainly as ______.","options":["structural components of the capsule","enzyme cofactors","the main source of energy","the sole carbon source"],"answer":"enzyme cofactors","solution":"A: Capsules are polysaccharide or polypeptide.\nB: Correct: the slides state many trace elements are used as enzyme cofactors.\nC: Energy comes from chemicals or light, not trace elements.\nD: Trace elements are not carbon sources.","source":"Bacteria Growth requirements.pptx | SLIDE 9","difficulty":"Medium"},{"id":"her-v2-334","module":"v2","type":"mcq","q":"Which growth factor group consists of the building blocks of nucleic acids?","options":["Amino acids","Vitamins","Purines and pyrimidines","Minerals"],"answer":"Purines and pyrimidines","solution":"A: Amino acids are protein building blocks.\nB: Vitamins serve as enzyme cofactors.\nC: Correct: the slides state purines and pyrimidines are the nucleic acid building blocks among bacterial growth factors.\nD: Minerals are not listed as a growth factor group.","source":"Bacteria Growth requirements.pptx | SLIDE 10","difficulty":"Hard"},{"id":"her-v2-335","module":"v2","type":"mcq","q":"Which element is a component of bacterial cytochromes and of peroxidase and catalase?","options":["Biotin","Lipoic acid","Folic acid","Haematin (iron-containing)"],"answer":"Haematin (iron-containing)","solution":"A: Biotin is a vitamin cofactor for carboxylation.\nB: Lipoic acid is needed in oxidative decarboxylation of pyruvate.\nC: Folic acid is involved in one-carbon metabolism.\nD: Correct: the slides state haematin is a component of bacterial cytochromes and the enzymes peroxidase and catalase.","source":"Bacteria Growth requirements.pptx | SLIDE 12","difficulty":"Devil Mode"},{"id":"her-v2-336","module":"v2","type":"mcq","q":"Which group is the most reactive metals with one valence electron?","options":["Group 1 alkali metals","Group 2 alkaline earth metals","Group 17 halogens","Group 18 noble gases"],"answer":"Group 1 alkali metals","solution":"A: Correct: the atomic structure slides state Group 1 alkali metals are the most reactive metals with one valence electron.\nB: Group 2 has two valence electrons and is less reactive.\nC: Halogens are reactive nonmetals, not metals.\nD: Noble gases are inert.","source":"ATOMIC STRUCTURE_curr.pptx | SLIDE 17","difficulty":"Medium"},{"id":"her-v2-337","module":"v2","type":"mcq","q":"Which bond type is formed by equal sharing of electron pairs between atoms of similar electronegativity?","options":["Ionic","Nonpolar covalent","Polar covalent","Metallic"],"answer":"Nonpolar covalent","solution":"A: Ionic bonding involves electron transfer between atoms of very different electronegativity.\nB: Correct: the slides describe covalent bonds between nonmetals of similar electronegativity, with electrons shared equally.\nC: Polar covalent bonds involve unequal sharing.\nD: Metallic bonding involves delocalised electrons among metal atoms.","source":"ATOMIC STRUCTURE_curr.pptx | SLIDE 36","difficulty":"Hard"},{"id":"her-v2-338","module":"v2","type":"mcq","q":"Lister first used which substance as a disinfectant?","options":["Chlorhexidine","Glutaraldehyde","Phenol (carbolic acid)","Iodine tincture"],"answer":"Phenol (carbolic acid)","solution":"A: Chlorhexidine is a biguanide used later.\nB: Glutaraldehyde is used for high-level disinfection of endoscopes.\nC: Correct: the BHM 162 slides state phenol was first used by Lister as a disinfectant and serves as the standard in some official tests.\nD: Tincture of iodine was one of the first antiseptics, but Lister's was phenol.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 54","difficulty":"Medium"},{"id":"her-v2-339","module":"v2","type":"mcq","q":"Which pharmacognosy arrangement uses the binomial system with classes, orders, families, genera and species?","options":["Alphabetical","Morphological","Chemical","Taxonomic"],"answer":"Taxonomic","solution":"A: Alphabetical arrangement gives no interrelationships.\nB: Morphological arrangement groups by plant part.\nC: Chemical arrangement groups by constituents.\nD: Correct: the slides state taxonomic arrangement uses an accepted botanical classification and binomial nomenclature.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 32","difficulty":"Hard"},{"id":"her-v2-340","module":"v2","type":"mcq","q":"Which ICT concept is defined as a decentralised digital ledger of transactions recorded with an immutable hash?","options":["Blockchain","Cloud computing","Edge computing","IoT"],"answer":"Blockchain","solution":"A: Correct: the ICT slides define blockchain as a decentralised distributed ledger with immutable cryptographic hashes.\nB: Cloud computing is scalable compute and storage at distributed locations.\nC: Edge computing places compute at the data source.\nD: IoT networks physical objects with sensors.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 19","difficulty":"Devil Mode"},{"id":"her-v2-341","module":"v2","type":"mcq","q":"Which computer component connects all hardware components and includes the CPU socket and RAM slots?","options":["CPU","Motherboard","PSU","RAM"],"answer":"Motherboard","solution":"A: The CPU executes instructions but is a component on the motherboard.\nB: Correct: the ICT slides define the motherboard as the main circuit board connecting all hardware components.\nC: The PSU converts electrical power.\nD: RAM is temporary memory in slots on the motherboard.","source":"Unit 2 - Computer Hardware and Software - 2024-25.pdf | SLIDE 4","difficulty":"Medium"},{"id":"her-v2-342","module":"v2","type":"mcq","q":"Which test gives a silver mirror with aldehydes but not ketones?","options":["2,4-DNP (Brady's) test","Iodoform test","Tollens' test","Lucas test"],"answer":"Tollens' test","solution":"A: Both aldehydes and ketones give a positive 2,4-DNP test.\nB: Iodoform detects methyl ketones, not all aldehydes.\nC: Correct: the past question answer key gives Tollens' test; aldehydes are oxidized to carboxylates with deposition of silver.\nD: Lucas test classifies alcohols.","source":"Trial for 152.pdf | SLIDE 7","difficulty":"Hard"},{"id":"her-v2-343","module":"v2","type":"mcq","q":"PCC is used to oxidize primary alcohols to ______.","options":["Carboxylic acids directly","Alkanes","Esters","Aldehydes without further oxidation to acids"],"answer":"Aldehydes without further oxidation to acids","solution":"A: PCC stops at aldehydes; stronger oxidants give acids.\nB: PCC oxidizes alcohols, not reduces them to alkanes.\nC: Esters are not the product of PCC oxidation of primary alcohols.\nD: Correct: the past question answer key states PCC is a mild anhydrous oxidant that stops at the aldehyde stage.","source":"Trial for 152.pdf | SLIDE 6","difficulty":"Medium"},{"id":"her-v2-344","module":"v2","type":"mcq","q":"Which statement about acid chlorides is correct (past question 13, answer a)?","options":["They are more reactive than esters toward nucleophiles because chloride is a better leaving group than alkoxide","They are less reactive than esters","They react only with alcohols","They are produced by oxidation of aldehydes"],"answer":"They are more reactive than esters toward nucleophiles because chloride is a better leaving group than alkoxide","solution":"A: Correct: the answer key marks statement 13 as 'a' (true/true related); chloride is a better leaving group than alkoxide.\nB: This is statement 13's negation and is false.\nC: Acid chlorides react with many nucleophiles, not only alcohols.\nD: Acid chlorides come from carboxylic acids with SOCl2/PCl5.","source":"Trial for 152.pdf | SLIDE 4","difficulty":"Hard"},{"id":"her-v2-345","module":"v2","type":"mcq","q":"Which factor increases the acidity of a carboxylic acid?","options":["Electron-donating groups only","Electron-withdrawing groups and resonance stabilization of the conjugate base","Dimer formation in non-polar solvents","Longer alkyl chains"],"answer":"Electron-withdrawing groups and resonance stabilization of the conjugate base","solution":"A: Electron-donating groups decrease acidity.\nB: Correct: the past question multi-select answer (25) includes electron-withdrawing groups and resonance stabilisation as acidity-increasing factors.\nC: Dimerisation affects boiling point, not acidity.\nD: Longer alkyl chains are electron-donating and lower acidity.","source":"Trial for 152.pdf | SLIDE 5","difficulty":"Devil Mode"},{"id":"her-v2-346","module":"v2","type":"mcq","q":"Which reagent converts a carboxylic acid to an acyl chloride (past question 49, answer C)?","options":["NaCl","Cl2","PCl3","KMnO4"],"answer":"PCl3","solution":"A: This is option A and does not form acyl chlorides.\nB: This is option B and is not the standard reagent here.\nC: Correct: the answer key gives C; phosphorus trichloride converts -COOH to -COCl.\nD: This is option E and is an oxidant.","source":"Trial for 152.pdf | SLIDE 7","difficulty":"Medium"},{"id":"her-v2-347","module":"v2","type":"mcq","q":"What is the product of saponification of a triglyceride?","options":["Only ethanol","Only glycerol","An acid chloride and water","Glycerol and fatty acid salts (soap)"],"answer":"Glycerol and fatty acid salts (soap)","solution":"A: Ethanol is not a saponification product.\nB: Fatty acid salts are also produced.\nC: Those are not saponification products.\nD: Correct: the past question multi-select answer (23) includes sodium stearate, potassium palmitate and glycerol as saponification products.","source":"Trial for 152.pdf | SLIDE 4","difficulty":"Hard"},{"id":"her-v2-348","module":"v2","type":"mcq","q":"Which statement about glycolysis regulation is correct?","options":["Pyruvate kinase is inhibited by ATP, acetyl-CoA and fatty acids","PFK-1 is activated by high ATP","Hexokinase is not inhibited by G6P","Insulin inhibits glycolysis in the liver"],"answer":"Pyruvate kinase is inhibited by ATP, acetyl-CoA and fatty acids","solution":"A: Correct: the biochemistry summary states pyruvate kinase is inhibited by ATP, acetyl-CoA and fatty acids when energy is abundant.\nB: High ATP inhibits PFK-1.\nC: Hexokinases I-III are inhibited by G6P.\nD: Insulin stimulates glycolysis.","source":"Carbohydrate Metabolism summary.pdf | SLIDE 2","difficulty":"Medium"},{"id":"her-v2-349","module":"v2","type":"mcq","q":"Which enzyme is a heme-containing terminal oxidase in the mitochondrial respiratory chain?","options":["Catalase","Cytochrome oxidase","Xanthine oxidase","Superoxide dismutase"],"answer":"Cytochrome oxidase","solution":"A: Catalase breaks down H2O2 in peroxisomes.\nB: Correct: the biological oxidation summary describes cytochrome oxidase as a heme-containing enzyme and the final electron acceptor in the respiratory chain.\nC: Xanthine oxidase converts purines to uric acid.\nD: SOD converts superoxide to H2O2 and O2.","source":"Biological Oxidation summary.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-350","module":"v2","type":"mcq","q":"Which fatty acid is a precursor for eicosanoids?","options":["Stearic acid","Oleic acid","Arachidonic acid","Palmitic acid"],"answer":"Arachidonic acid","solution":"A: Stearic acid is a saturated fatty acid.\nB: Oleic acid is a monounsaturated fatty acid.\nC: Correct: the lipids summary states arachidonic acid is the precursor for eicosanoids (hormone-like molecules).\nD: Palmitic acid is a saturated fatty acid.","source":"Lipids summary.pdf | SLIDE 1","difficulty":"Devil Mode"},{"id":"her-v2-351","module":"v2","type":"mcq","q":"Which vitamin deficiency is associated with neural tube defects in the fetus?","options":["Vitamin B12","Vitamin B6","Vitamin E","Folate (B9)"],"answer":"Folate (B9)","solution":"A: B12 deficiency causes pernicious anaemia.\nB: B6 deficiency causes microcytic anaemia and nerve issues.\nC: Vitamin E deficiency causes fragile red cells.\nD: Correct: the vitamins summary states folate deficiency causes megaloblastic anaemia and neural tube defects in the fetus.","source":"Vitamins summary.pdf | SLIDE 2","difficulty":"Medium"},{"id":"her-v2-352","module":"v2","type":"mcq","q":"Which cell type in the CNS lines ventricles and helps form the choroid plexus?","options":["Ependymal cells","Microglia","Oligodendrocytes","Satellite cells"],"answer":"Ependymal cells","solution":"A: Correct: the nervous tissues slides state ependymal cells line the brain ventricles and central canal and help form choroid plexuses that secrete CSF.\nB: Microglia are macrophages.\nC: Oligodendrocytes form CNS myelin.\nD: Satellite cells surround neuron bodies in ganglia.","source":"NERVOUS TISSUES (KNUST 2024).pdf | SLIDE 20","difficulty":"Hard"},{"id":"her-v2-353","module":"v2","type":"mcq","q":"Which part of the sperm cell contains mitochondria for ATP production?","options":["Head","Midpiece","Tail","Acrosome"],"answer":"Midpiece","solution":"A: The head contains DNA and acrosome enzymes.\nB: Correct: the MRS summary table states the midpiece contains mitochondria for ATP, which supports motility.\nC: The tail provides motility via microtubules.\nD: The acrosome contains penetrating enzymes.","source":"MRS Summary.pdf | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-354","module":"v2","type":"mcq","q":"Which hormone maintains the corpus luteum during early pregnancy?","options":["FSH (follicle-stimulating hormone)","LH (luteinizing hormone, ovulation trigger)","hCG (human chorionic gonadotropin)","Relaxin, the uterine relaxing hormone"],"answer":"hCG (human chorionic gonadotropin)","solution":"A: FSH stimulates follicle growth, not corpus luteum maintenance.\nB: The LH surge triggers ovulation; hCG maintains the corpus luteum in pregnancy.\nC: Correct: the FRS summary states hCG maintains the corpus luteum until the placenta takes over hormone production.\nD: Relaxin relaxes the uterus for implantation.","source":"FRS Summary.pdf | SLIDE 2","difficulty":"Hard"},{"id":"her-v2-355","module":"v2","type":"mcq","q":"Which anatomical region is the 'hypogastrium'?","options":["The central upper abdominal region","The right upper region","The left lower region","The central lower abdominal region above the pubis"],"answer":"The central lower abdominal region above the pubis","solution":"A: That is the epigastrium.\nB: That is the right hypochondrium.\nC: That is the left inguinal/groin region.\nD: Correct: the anatomy slides list hypogastrium as the central lower of the nine abdominal regions (pubic region).","source":"Intro to Anatomy DRS.pptx | SLIDE 86","difficulty":"Devil Mode"},{"id":"her-v2-356","module":"v2","type":"mcq","q":"Which anatomical term means 'away from the midline'?","options":["Lateral","Medial","Proximal","Superficial"],"answer":"Lateral","solution":"A: Correct: the anatomy slides list medial and lateral as directional terms, with lateral meaning away from the midline.\nB: Medial means toward the midline.\nC: Proximal means nearer the trunk.\nD: Superficial means toward the surface.","source":"Intro to Anatomy DRS.pptx | SLIDE 23","difficulty":"Medium"}]};
let mod = BANK.modules[0].id;
let list = [];
let idx = 0;
let ans = {};
let secs = 7200;
let tick = null;
let done = false;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function drawMods(){
  document.getElementById('mods').innerHTML = BANK.modules.map(function(m){
    return '<button class="modbtn'+(m.id===mod?' sel':'')+'" onclick="pick(\''+m.id+'\')">'+
      '<b>'+esc(m.name)+'</b><span>'+esc(m.desc)+' - '+m.count+' questions</span></button>';
  }).join('');
}
function pick(id){ mod=id; drawMods(); }

function begin(){
  list = BANK.questions.filter(function(q){return q.module===mod});
  if(!list.length){alert('No questions in this set');return}
  idx=0; ans={}; secs=7200; done=false;
  document.getElementById('start').style.display='none';
  document.getElementById('exam').style.display='block';
  document.getElementById('results').style.display='none';
  document.getElementById('timerbar').style.display='flex';
  document.getElementById('td').textContent='2:00:00';
  document.getElementById('quizSub').textContent=BANK.modules.filter(function(m){return m.id===mod})[0].name+' - '+list.length+' questions';
  clearInterval(tick);
  tick=setInterval(function(){
    secs--;
    if(secs<=0){clearInterval(tick);finish();return}
    var h=Math.floor(secs/3600), m=Math.floor((secs%3600)/60), s=secs%60;
    document.getElementById('td').textContent=h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    var bar=document.getElementById('timerbar');
    bar.className='timerbar'+(secs<=300?' danger':secs<=900?' warn':'');
  },1000);
  render();
}
function toggleTimer(){
  var b=document.getElementById('timerbar'), td=document.getElementById('td');
  if(b.dataset.hidden==='1'){b.style.display='flex';b.dataset.hidden='0';document.getElementById('hideBtn').textContent='Hide'}
  else{b.style.display='none';b.dataset.hidden='1'}
}
function setAnsIdx(i){
  ans[idx]=list[idx].options[i];
  var btns=document.querySelectorAll('.opt');
  btns.forEach(function(b,j){ b.className='opt'+(j===i?' sel':''); });
  renderNav();
}
function setAns(v){ ans[idx]=v; renderNav(); }

function render(){
  var q=list[idx];
  var opts='';
  if(q.type==='mcq'){
    opts='<div class="opts">'+q.options.map(function(o,i){
      var k=String.fromCharCode(65+i);
      return '<button class="opt'+(ans[idx]===o?' sel':'')+'" onclick="setAnsIdx('+i+')">'+
        '<span class="key">'+k+'</span><span>'+esc(o)+'</span></button>';
    }).join('')+'</div>';
  }else{
    opts='<div class="fillrow"><label>Answer:</label><input type="text" id="fill" placeholder="type your answer" value="'+esc(ans[idx]||'')+'" oninput="ans['+idx+']=this.value;renderNav()"><span class="hint">numeric or short answer</span></div>';
  }
  document.getElementById('exam').innerHTML=
    '<div class="card"><div class="qhead"><span class="qnum">Question '+(idx+1)+' of '+list.length+'</span>'+
    '<span class="qtag">'+esc(q.difficulty||'Medium')+' - '+esc(q.source||'')+'</span></div>'+
    '<div class="qtext">'+esc(q.q)+'</div>'+opts+'</div>'+
    '<div class="navrow"><button class="btn prev" onclick="go(-1)" '+(idx===0?'disabled':'')+'>Previous page</button>'+
    (idx===list.length-1?'<button class="btn finish" onclick="finish()">Submit exam</button>':'<button class="btn next" onclick="go(1)">Next page</button>')+'</div>'+
    '<div class="qgrid" id="qgrid"></div>';
  renderNav();
  window.scrollTo(0,0);
}
function renderNav(){
  var g=document.getElementById('qgrid'); if(!g)return;
  g.innerHTML=list.map(function(_,i){
    var c=(ans[i]!==undefined&&ans[i]!=='')?' done':'';
    if(i===idx)c+=' cur';
    return '<button class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</button>';
  }).join('');
}
function go(d){ var n=idx+d; if(n<0||n>=list.length)return; idx=n; render(); }
function jump(i){ idx=i; render(); }

function finish(){
  if(done)return; done=true; clearInterval(tick);
  var correct=0,wrong=0,skip=0,html='';
  list.forEach(function(q,i){
    var u=ans[i], ok=false;
    if(u===undefined||u===''){skip++}
    else if(q.type==='mcq'){ok=(u===q.answer)}
    else{
      var a=String(q.answer).trim().toLowerCase(), b=String(u).trim().toLowerCase();
      ok=(a===b);
      if(!ok){var na=parseFloat(a),nb=parseFloat(b); if(!isNaN(na)&&!isNaN(nb))ok=Math.abs(na-nb)<=0.005}
    }
    if(ok)correct++;else if(u!==undefined&&u!=='')wrong++;
    html+='<div class="item '+(ok?'':'wrong')+'"><div class="qq">Q'+(i+1)+'. '+esc(q.q)+'</div>'+
      '<div class="aa '+(ok?'ok':'no')+'">Your answer: '+esc(u===undefined||u===''?'-':u)+'</div>'+
      (ok?'':'<div class="aa ok">Correct: '+esc(q.answer)+'</div>')+
      (q.solution?'<div class="sol"><b>Solution:</b> '+esc(q.solution)+'</div>':'')+'</div>';
  });
  var pct=Math.round(correct/list.length*100);
  document.getElementById('exam').style.display='none';
  document.getElementById('timerbar').style.display='none';
  document.getElementById('results').style.display='block';
  document.getElementById('results').innerHTML=
    '<div class="res"><h2>Examination complete</h2><div class="score">'+pct+'%</div>'+
    '<div class="rstat"><div><b>'+correct+'</b>Correct</div><div><b>'+wrong+'</b>Wrong</div><div><b>'+skip+'</b>Skipped</div></div>'+
    '<p style="color:var(--muted);font-size:13px">Review — wrong and skipped answers shown with worked solutions.</p></div>'+html+
    '<button class="bigbtn" onclick="location.reload()">New attempt</button>';
  window.scrollTo(0,0);
}
drawMods();
</script>
</body>
</html>
