<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Carpe Diem Herbal Medicine - Year 1 — The Carpe Diem</title>
<style>
:root{
  --navy:#0b1b33; --navy2:#12294a; --gold:#f5b301;
  --red:#b3261e; --red2:#8e1b16; --card:#dceaf0; --card2:#e8f1f5;
  --ink:#1c2733; --muted:#5d6b7a; --line:#c8d4de;
  --green:#2e7d32; --good:#e6f4ea; --bad:#fdecea;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f3f5f7;color:var(--ink);font-family:Arial,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer}

/* top bar */
.cdbar{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold)}
.cdmark{width:30px;height:30px;border:2px solid var(--gold);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:bold;font-size:12px;letter-spacing:.5px;flex:none}
.cdbar .brand{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:bold}
.cdbar .crumb{font-size:12px;color:#c8d6e5;margin-left:auto;text-align:right}

/* moodle quiz header */
.quizhead{background:#fff;border-bottom:1px solid var(--line);padding:18px 22px}
.quizhead .path{font-size:11px;color:var(--muted);letter-spacing:.4px}
.quizhead h1{font-size:24px;font-weight:600;margin:4px 0 2px;color:var(--navy)}
.quizhead .sub{font-size:12px;color:var(--muted)}

/* timer banner */
.timerbar{background:linear-gradient(90deg,var(--red2),var(--red));color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:center;position:relative;font-weight:bold;letter-spacing:.5px}
.timerbar .tt{font-size:20px}
.timerbar .td{font-size:20px;font-variant-numeric:tabular-nums;margin-left:12px}
.timerbar.warn{background:linear-gradient(90deg,#a35b00,#d97706)}
.timerbar.danger{background:linear-gradient(90deg,#7f1d1d,#b3261e)}
.timerbar .hide{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);border:0;color:#fff;padding:6px 12px;border-radius:4px;font-size:12px}

.wrap{max-width:860px;margin:0 auto;padding:24px 18px 120px}
.card{background:var(--card);border:1px solid #c2d3de;border-radius:12px;padding:26px;margin-bottom:18px;box-shadow:0 1px 2px rgba(11,27,51,.05)}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}
.qnum{font-size:13px;font-weight:bold;color:var(--navy)}
.qtag{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--muted);white-space:nowrap}
.qtext{font-size:17px;line-height:1.65;margin-bottom:18px;white-space:pre-wrap}
.qtext b{color:var(--navy)}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;width:100%;font-size:15px;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--gold)}
.opt.sel{border:2px solid var(--gold);background:#fff9e6}
.opt .key{width:22px;height:22px;border-radius:50%;border:1px solid #9aa9b8;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.opt.sel .key{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:bold}

.fillrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fillrow label{font-weight:bold;color:var(--navy)}
.fillrow input{background:#fff;border:1px solid #9aa9b8;border-radius:8px;padding:11px 14px;font-size:16px;width:240px;outline:none}
.fillrow input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,179,1,.2)}
.fillrow .hint{font-size:12px;color:var(--muted)}

.navrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.btn{border:0;border-radius:6px;padding:12px 24px;font-size:14px;font-weight:bold}
.btn.prev{background:#e4e9ee;color:var(--navy)}
.btn.next{background:var(--green);color:#fff}
.btn.finish{background:var(--navy);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.qgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.qgrid button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:4px;color:var(--muted);font-size:12px}
.qgrid button.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.qgrid button.cur{outline:2px solid var(--gold)}

/* start screen */
.start{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:18px}
.start h2{color:var(--navy);margin-bottom:6px}
.start p{color:var(--muted);margin-bottom:18px}
.mods{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.modbtn{border:1px solid var(--line);background:#f8fafb;border-radius:8px;padding:12px 16px;text-align:left;min-width:150px}
.modbtn.sel{border:2px solid var(--gold);background:#fff9e6}
.modbtn b{display:block;color:var(--navy);font-size:14px}
.modbtn span{font-size:12px;color:var(--muted)}
.bigbtn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:14px 30px;font-size:15px;font-weight:bold}

/* results */
.res{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:18px}
.score{font-size:52px;font-weight:bold;color:var(--navy);line-height:1}
.rstat{display:flex;gap:28px;margin:16px 0;flex-wrap:wrap}
.rstat div{font-size:13px;color:var(--muted)}
.rstat b{display:block;font-size:22px;color:var(--navy)}
.item{border:1px solid var(--line);border-left:4px solid var(--good);border-radius:8px;padding:16px;margin-bottom:12px;background:#fafcfb}
.item.wrong{border-left-color:#c62828;background:#fffafa}
.item .qq{font-weight:bold;margin-bottom:8px}
.item .aa{font-size:13px;margin:3px 0}
.item .ok{color:var(--green)}
.item .no{color:#c62828}
.sol{font-size:13px;background:#f1f5f9;border-radius:6px;padding:10px 12px;margin-top:8px;color:#37474f;white-space:pre-wrap}

@media(max-width:600px){
  .cdbar .crumb{display:none}
  .quizhead h1{font-size:20px}
  .timerbar .tt,.timerbar .td{font-size:16px}
  .card{padding:18px}
  .qtext{font-size:15px}
  .fillrow input{width:100%}
}
</style>
</head>

<script>
const BANK = {"config":{"title":"The Carpe Diem Herbal Medicine - Year 1","course":"BHM YEAR 1","guide":"Herbal First Year slides"},"modules":[{"id":"v1","name":"Version 1 - Semester 1","desc":"Semester 1 herbal first-year courses: BHM 151, BHM 161, ENG 157, Math 151, Pharm 151, Pharm 171 and Pharm 191.","count":260,"source":"Year 1 Sem 1 extracted slide corpus (BHM 151 / BHM 161 / ENG 157 / Math 151 / Pharm 151 / Pharm 171 / Pharm 191)"},{"id":"v2","name":"Version 2 - Semester 2","desc":"Semester 2 herbal first-year courses: BHM 162, ENG 158, PHARM 152, PHARM 186, SMS 184 and SMS 186.","count":356,"source":"Year 1 Sem 2 extracted slide corpus (BHM 162 / ENG 158 / PHARM 152 / PHARM 186 / SMS 184 / SMS 186)"}],"questions":[{"id":"her-v1-001","module":"v1","type":"mcq","q":"What is a monograph as defined in the BHM 151 introduction lecture?","options":["A detailed, written study on a specific subject such as a drug, herb or compound that provides standardized information.","A short label attached to a medicine packet describing only its price.","A legal certificate issued by a pharmacy to allow a herb to be sold.","A traditional chant recited when a herbal medicine is prepared."],"answer":"A detailed, written study on a specific subject such as a drug, herb or compound that provides standardized information.","solution":"A: Correct: the lecture defines a monograph as a detailed written study giving standardized information to ensure quality, safety and efficacy.\nB: A price label is not a detailed study and gives no standardized quality or safety information.\nC: A registration certificate is a regulatory document, not the written study described in the lecture.\nD: A chant is an oral ritual, not a written standardized study of a medicinal substance.","source":"BHM 151 Introduction to Herbal Monographs.pptx | SLIDE 2","difficulty":"Medium"},{"id":"her-v1-002","module":"v1","type":"mcq","q":"Which of the following is NOT listed as a type of monograph in the slides?","options":["Pharmacopoeial monograph","Clinical trial monograph","Herbal monograph","Manufacturer monograph"],"answer":"Clinical trial monograph","solution":"A: Pharmacopoeial monographs are explicitly listed as found in official pharmacopoeias such as USP and BP.\nB: Correct: the listed types are pharmacopoeial, herbal, scientific and manufacturer monographs; a 'clinical trial monograph' is not one of them.\nC: Herbal monographs are listed as giving data on medicinal plants, traditional uses and pharmacology.\nD: Manufacturer monographs are listed as proprietary product details from pharmaceutical companies.","source":"BHM 151 Introduction to Herbal Monographs.pptx | SLIDE 3","difficulty":"Hard"},{"id":"her-v1-003","module":"v1","type":"mcq","q":"What information does a herbal monograph provide about a herb?","options":["Only the plant's common name and its market price","Only data on synthetic drugs and their adverse effects","A basic description, chemical constituents, actions, clinical uses and recommended dosage","Only identification tests and nothing about use"],"answer":"A basic description, chemical constituents, actions, clinical uses and recommended dosage","solution":"A: The monograph is far more detailed and includes constituents, actions and dosage.\nB: Herbal monographs are specifically about medicinal plants and botanical drugs.\nC: Correct: the slide states a herbal monograph defines botanical drugs and lists description, constituents, actions, uses and dosage.\nD: Identification is one component; uses and dosage are also included.","source":"BHM 151 Introduction to Herbal Monographs.pptx | SLIDE 4","difficulty":"Medium"},{"id":"her-v1-004","module":"v1","type":"mcq","q":"Which component of a herbal monograph deals with contaminants, microbial load and heavy metals?","options":["Assay methods","Identification tests","Storage conditions","Purity standards"],"answer":"Purity standards","solution":"A: Assay methods quantify active compounds rather than check contaminants.\nB: Identification tests use microscopy, chromatography and spectroscopy to confirm identity.\nC: Storage conditions cover stability and potency guidelines, not contaminant limits.\nD: Correct: purity standards are defined in the slides as covering contaminants, microbial load and heavy metals.","source":"BHM 151 Introduction to Herbal Monographs.pptx | SLIDE 5","difficulty":"Hard"},{"id":"her-v1-005","module":"v1","type":"mcq","q":"Which pharmacopoeia is described as focusing on traditional herbal medicines and providing international standards through WHO monographs?","options":["WHO Monographs on Medicinal Plants","United States Pharmacopeia (USP)","British Pharmacopoeia (BP)","Chinese Pharmacopoeia (ChP)"],"answer":"WHO Monographs on Medicinal Plants","solution":"A: Correct: WHO monographs on medicinal plants are listed as providing international standards for herbal medicines.\nB: USP covers synthetic and herbal drugs but is a national pharmacopoeia, not the WHO international set.\nC: BP is the official UK reference, not the WHO international monograph series.\nD: ChP focuses on traditional Chinese herbal medicine within China rather than international WHO standards.","source":"BHM 151 Introduction to Herbal Monographs.pptx | SLIDE 7","difficulty":"Devil Mode"},{"id":"her-v1-006","module":"v1","type":"mcq","q":"Which of the following is NOT a stated importance of monographs?","options":["Standardization of herbal medicines","Increasing the retail price of herbal products","Regulatory compliance","Education and training"],"answer":"Increasing the retail price of herbal products","solution":"A: Standardization ensures consistent quality and therapeutic effects and is explicitly listed.\nB: Correct: the listed importance is standardization, regulatory compliance, research and development, and education, not price inflation.\nC: Monographs help meet safety and legal requirements and are listed as important.\nD: Monographs support pharmacy, herbal medicine and healthcare professionals and are listed.","source":"BHM 151 Introduction to Herbal Monographs.pptx | SLIDE 6","difficulty":"Medium"},{"id":"her-v1-007","module":"v1","type":"mcq","q":"Who coined the term 'ethnobotany' in 1896?","options":["Richard Evans Schultes","Michael J. Balick","William John Harshberger","Paul Alan Cox"],"answer":"William John Harshberger","solution":"A: Schultes is described as a best-known modern ethnobotanist, not the coiner of the term.\nB: Balick is listed as another ethnobotanist, not the person who coined the term.\nC: Correct: the slides state ethnobotany was coined by William John Harshberger, an American botanist, in 1896.\nD: Cox is an ethnobotanist associated with drug discovery work, not the coiner of the term.","source":"ETHNOBOTANY-151.pptx | SLIDE 3","difficulty":"Hard"},{"id":"her-v1-008","module":"v1","type":"mcq","q":"Ethnobotany is defined as the scientific study of the relationships that exist between ______.","options":["animals and their habitats","plants and their chemical constituents","microorganisms and disease","people and plants"],"answer":"people and plants","solution":"A: That is ecology or zoology, not the people-plant focus of ethnobotany.\nB: That is phytochemistry, which is only one tool used within ethnobotany.\nC: That is microbiology, not the subject matter of ethnobotany.\nD: Correct: the lecture defines ethnobotany as the scientific study of relationships between people and plants.","source":"ETHNOBOTANY-151.pptx | SLIDE 3","difficulty":"Medium"},{"id":"her-v1-009","module":"v1","type":"mcq","q":"Which discipline is NOT listed among the multidisciplinary areas of ethnobotany?","options":["Astrophysics","Pharmacognosy","Linguistics","Religious Studies"],"answer":"Astrophysics","solution":"A: Correct: the slides list anthropology, pharmacology, botany, chemistry, ecology, sociology and others, but not astrophysics.\nB: Pharmacognosy is explicitly listed as part of ethnobotany's multidisciplinary scope.\nC: Linguistics is listed as one of the disciplines contributing to ethnobotany.\nD: Religious Studies is listed among the humanities included in ethnobotany.","source":"ETHNOBOTANY-151.pptx | SLIDE 6","difficulty":"Hard"},{"id":"her-v1-010","module":"v1","type":"mcq","q":"The earliest recorded uses of plants in traditional medicine cited in the ethnobotany slides come from ______.","options":["the Neolithic revolution around 10,000 BC","Babylon (Code of Hammurabi, ca. 1770 BC) and ancient Egypt (ca. 1550 BC)","the Ebers Papyrus of 3000 BC","modern clinical trials of the 20th century"],"answer":"Babylon (Code of Hammurabi, ca. 1770 BC) and ancient Egypt (ca. 1550 BC)","solution":"A: The Neolithic revolution is discussed as a probable origin but not as the earliest written record.\nB: Correct: the slides cite the Code of Hammurabi around 1770 BC and ancient Egypt around 1550 BC as the earliest records.\nC: The Ebers Papyrus is dated around 1550 BC in the slides, not 3000 BC.\nD: Modern trials are a recent development, not the earliest recorded uses.","source":"ETHNOBOTANY-151.pptx | SLIDE 7","difficulty":"Devil Mode"},{"id":"her-v1-011","module":"v1","type":"mcq","q":"Richard Evans Schultes studied which plant and found it had antibiotic properties even against penicillin-resistant Staphylococcus?","options":["Cinchona tree","Pacific yew tree","Peyote cactus (Lophophora williamsii)","Artemisia annua"],"answer":"Peyote cactus (Lophophora williamsii)","solution":"A: Cinchona bark is associated with quinine for malaria, not Schultes' antibiotic study.\nB: The Pacific yew is the source of paclitaxel, a cancer drug, not the subject of Schultes' work.\nC: Correct: the slides state Schultes studied the Peyote cactus, rubbed on cuts to prevent infection, with antibiotic properties.\nD: Artemisia annua is the source of artemisinin, not the plant Schultes studied.","source":"ETHNOBOTANY-151.pptx | SLIDE 10","difficulty":"Medium"},{"id":"her-v1-012","module":"v1","type":"mcq","q":"Dr Oku Ampofo is credited in the ethnobotany slides with ______.","options":["coining the term ethnobotany","discovering the antibiotic properties of Peyote","formulating the Nagoya Protocol","collecting and documenting medicinal plants leading to the Centre for Plant Medicine Research"],"answer":"collecting and documenting medicinal plants leading to the Centre for Plant Medicine Research","solution":"A: The term was coined by Harshberger, not Oku Ampofo.\nB: That work is attributed to Richard Evans Schultes.\nC: The Nagoya Protocol is an international agreement, not Oku Ampofo's work.\nD: Correct: the slides state his work assembled a vast document on medicinal plants and set up what is now the Centre for Plant Medicine Research.","source":"ETHNOBOTANY-151.pptx | SLIDE 11","difficulty":"Hard"},{"id":"her-v1-013","module":"v1","type":"mcq","q":"When investigating natural products used by a culture as medicine, the slides advise that the method of collection, extraction and preparation should ______.","options":["follow as done by the ethnic group, as this may be the key to safe usage","be replaced by modern laboratory methods entirely","be standardized to European pharmacopoeia methods first","be kept secret from the community"],"answer":"follow as done by the ethnic group, as this may be the key to safe usage","solution":"A: Correct: the lecture explicitly says following the ethnic group's method may be the key to safe usage of the plant or product.\nB: The slides recommend following traditional methods, not discarding them.\nC: European standardization is not advised as the first step in the field guidance given.\nD: The slides emphasize working with knowledgeable persons, not secrecy.","source":"ETHNOBOTANY-151.pptx | SLIDE 13","difficulty":"Medium"},{"id":"her-v1-014","module":"v1","type":"mcq","q":"Quinine, originally derived from the bark of the Cinchona tree, became a key drug for treating ______.","options":["cancer","malaria","diabetes","tuberculosis"],"answer":"malaria","solution":"A: Paclitaxel from the Pacific yew, not quinine, is the anti-cancer example given.\nB: Correct: the ethnobotany slides state quinine from Cinchona bark was used by indigenous South Americans for fevers and became a key anti-malarial drug.\nC: Metformin from Galega officinalis is the anti-diabetic example, not quinine.\nD: No anti-tuberculosis use is attributed to quinine in the slides.","source":"ETHNOBOTANY-151.pptx | SLIDE 22","difficulty":"Hard"},{"id":"her-v1-015","module":"v1","type":"mcq","q":"Artemisinin, a key anti-malarial component, comes from which plant?","options":["Cinchona succirubra","Taxus brevifolia","Artemisia annua","Salix alba"],"answer":"Artemisia annua","solution":"A: Cinchona is the source of quinine, not artemisinin.\nB: Taxus brevifolia is the Pacific yew, source of paclitaxel.\nC: Correct: the slides state artemisinin comes from Artemisia annua, used in traditional Chinese medicine for centuries.\nD: Salix alba (willow) is the source of salicin, the precursor of aspirin.","source":"ETHNOBOTANY-151.pptx | SLIDE 22","difficulty":"Devil Mode"},{"id":"her-v1-016","module":"v1","type":"mcq","q":"Which of the following is listed as an important consideration when using ethnobotanical knowledge?","options":["Maximizing harvest regardless of plant population","Ignoring intellectual property rights","Skipping scientific testing of traditional claims","Cultural sensitivity, scientific validation and sustainability"],"answer":"Cultural sensitivity, scientific validation and sustainability","solution":"A: Overharvesting is explicitly warned against to protect plant populations.\nB: The slides stress respecting intellectual property rights and informed consent.\nC: Traditional knowledge must be complemented with rigorous scientific research.\nD: Correct: the slides list cultural sensitivity with informed consent, scientific validation and avoidance of overharvesting.","source":"ETHNOBOTANY-151.pptx | SLIDE 24","difficulty":"Medium"},{"id":"her-v1-017","module":"v1","type":"mcq","q":"The Convention on Biological Diversity (CBD) is described as an international instrument for ______.","options":["conservation of biodiversity, sustainable use and fair and equitable sharing of benefits from genetic resources","banning all traditional medicine practices","regulating only the sale of synthetic drugs","establishing pharmacopoeias worldwide"],"answer":"conservation of biodiversity, sustainable use and fair and equitable sharing of benefits from genetic resources","solution":"A: Correct: the slide gives exactly this three-part description of the CBD.\nB: The CBD does not ban traditional medicine; it addresses conservation and benefit sharing.\nC: The CBD covers genetic resources and biodiversity, not just synthetic drugs.\nD: Pharmacopoeias are standard-setting documents, not the purpose of the CBD.","source":"ETHNOBOTANY-151.pptx | SLIDE 25","difficulty":"Hard"},{"id":"her-v1-018","module":"v1","type":"mcq","q":"The Cartagena Protocol deals specifically with ______.","options":["fair sharing of benefits from genetic resources","biosafety issues involving movement of living modified organisms between countries","conservation of botanical gardens","registration of herbal products"],"answer":"biosafety issues involving movement of living modified organisms between countries","solution":"A: That is the Nagoya Protocol, not the Cartagena Protocol.\nB: Correct: the slides define the Cartagena Protocol as dealing with biosafety of living modified organisms (LMOs).\nC: Botanical garden conservation is not the subject of the Cartagena Protocol.\nD: Product registration is handled by national regulators such as the FDA.","source":"ETHNOBOTANY-151.pptx | SLIDE 25","difficulty":"Medium"},{"id":"her-v1-019","module":"v1","type":"mcq","q":"Systematics is defined in the taxonomy lecture as ______.","options":["the science of naming only","the study of fossils exclusively","the study of diversity and kinds of organisms and the relationships between them through time","the classification of chemical compounds"],"answer":"the study of diversity and kinds of organisms and the relationships between them through time","solution":"A: Naming alone is nomenclature, a component of systematics.\nB: Fossil study is palaeontology, which systematics may draw on but is not limited to.\nC: Correct: the slide defines systematics as the study of diversity and kinds of organisms and their relationships through time.\nD: Classifying compounds is chemistry, not systematics.","source":"taxonomy bhm 151.pptx | SLIDE 2","difficulty":"Hard"},{"id":"her-v1-020","module":"v1","type":"mcq","q":"Which term is defined as the 'art and science of describing organisms'?","options":["Biodiversity","Biogeography","Phylogeny","Taxonomy"],"answer":"Taxonomy","solution":"A: Biodiversity is defined as the number and kinds of organisms.\nB: Biogeography is the study of the distribution of organisms.\nC: Phylogeny is the study of evolutionary relationships via molecular sequencing.\nD: Correct: the slides define taxonomy as the art and science of describing organisms.","source":"taxonomy bhm 151.pptx | SLIDE 3","difficulty":"Devil Mode"},{"id":"her-v1-021","module":"v1","type":"mcq","q":"Binomial nomenclature was adopted by Linnaeus in his monumental work ______.","options":["Species Plantarum","De Materia Medica","The Canon of Medicine","Pen Tsao"],"answer":"Species Plantarum","solution":"A: Correct: the slides state Linnaeus adopted the two-word naming system in Species Plantarum.\nB: De Materia Medica is the work of Dioscorides, not Linnaeus.\nC: The Canon of Medicine was written by Ibn Sina (Avicenna).\nD: Pen Tsao is the ancient Chinese herbal attributed to Shen Nung.","source":"taxonomy bhm 151.pptx | SLIDE 24","difficulty":"Medium"},{"id":"her-v1-022","module":"v1","type":"mcq","q":"In a scientific name such as Zea mays L., what does the 'L.' stand for?","options":["the Latin word for leaf","Linnaeus, the author who first published the name","the locality where the plant was found","the plant family name"],"answer":"Linnaeus, the author who first published the name","solution":"A: 'L.' is an author abbreviation, not a Latin descriptive word.\nB: Correct: the slides state the 'L.' stands for Linnaeus, the person who first published the name.\nC: Locality is indicated by an epithet such as 'canadensis', not by an author initial.\nD: Family names end in -aceae and are not given as a single initial after the binomial.","source":"taxonomy bhm 151.pptx | SLIDE 26","difficulty":"Hard"},{"id":"her-v1-023","module":"v1","type":"mcq","q":"Which of these is a valid reason why scientific names are preferred over common names?","options":["Scientific names are always short and easy to pronounce","Scientific names change with every new discovery","The same scientific name cannot be given to more than one plant and it indicates relationships","Common names never have more than one meaning"],"answer":"The same scientific name cannot be given to more than one plant and it indicates relationships","solution":"A: The slides actually list difficulty of pronunciation as a challenge of scientific names.\nB: Names may change but stability is governed by rules; frequent change is listed as a challenge, not an advantage.\nC: Correct: the slides state scientific names are universal, unique, governed by an international code and indicate relationships.\nD: The slides say a plant may have more than one common name and the same common name may refer to different plants.","source":"taxonomy bhm 151.pptx | SLIDE 21","difficulty":"Medium"},{"id":"her-v1-024","module":"v1","type":"mcq","q":"The specific epithet 'officinale' in a plant name most likely indicates ______.","options":["a tall growth form","a yellow colour","origin in China","medicinal use"],"answer":"medicinal use","solution":"A: Tall growth is indicated by epithets such as 'altissimus' or 'elata'.\nB: Yellow is indicated by 'aureus', not 'officinale'.\nC: Chinese origin is indicated by 'sinensis' or 'siensis'.\nD: Correct: the taxonomy slides list 'officinale' among epithets meaning medicinal, under the 'uses' category.","source":"taxonomy bhm 151.pptx | SLIDE 44","difficulty":"Hard"},{"id":"her-v1-025","module":"v1","type":"mcq","q":"The genus name Atropa is derived from Atropos, the goddess who cuts the thread of life, referring to ______.","options":["the strongly poisonous properties of the plant","its use as a culinary herb","the shape of its flowers","its ability to cure all diseases"],"answer":"the strongly poisonous properties of the plant","solution":"A: Correct: the slides state the name refers to the strongly poisonous properties of the plant (deadly nightshade).\nB: Atropa belladonna is poisonous, not a culinary herb.\nC: The mythological reference is to poison and fate, not flower shape.\nD: The plant is toxic and is not presented as a universal cure.","source":"taxonomy bhm 151.pptx | SLIDE 34","difficulty":"Devil Mode"},{"id":"her-v1-026","module":"v1","type":"mcq","q":"In traditional African medicine, the three broad levels of specialization are ______.","options":["herbalism, surgery and pharmacy","divination, spiritualism and herbalism","divination, acupuncture and herbalism","spiritualism, homeopathy and herbalism"],"answer":"divination, spiritualism and herbalism","solution":"A: Surgery and pharmacy are not listed as the three levels of African TM.\nB: Correct: the slides state African traditional medicine comprises three levels: divination, spiritualism and herbalism.\nC: Acupuncture belongs to Chinese medicine, not the African levels given.\nD: Homeopathy is a separate CAM system, not one of the African levels.","source":"Principles and methods of TM in different regions.pptx | SLIDE 22","difficulty":"Medium"},{"id":"her-v1-027","module":"v1","type":"mcq","q":"A traditional healer who acts as an interface between the spiritual and physical world to obtain guidance to heal is performing ______.","options":["herbalism","bone setting","divination","massage"],"answer":"divination","solution":"A: Herbalism is the use of plant remedies, not the spiritual-physical interface.\nB: Bone setting deals with musculoskeletal injuries, not divination.\nC: Correct: the slides define divination as a healing process where healers act as interface between spiritual and physical worlds.\nD: Massage is a manual technique, not divination.","source":"Principles and methods of TM in different regions.pptx | SLIDE 5","difficulty":"Hard"},{"id":"her-v1-028","module":"v1","type":"mcq","q":"In the classification of practitioners, faith healers/prophets are described as ______.","options":["using herbs and brown or white clay as their main treatment","diagnosing by reading the entrails of animals","relying on trans-rational intuition without any faith basis","using God as the believed source of power and not administering organic preparations"],"answer":"using God as the believed source of power and not administering organic preparations","solution":"A: That describes diviner-herbalists, not faith healers.\nB: That is a divination technique, not faith healing.\nC: Faith healers explicitly base their practice on Christian faith.\nD: Correct: the slides state faith healers believe power comes from God and do not administer organic preparations.","source":"Principles and methods of TM in different regions.pptx | SLIDE 27","difficulty":"Medium"},{"id":"her-v1-029","module":"v1","type":"mcq","q":"Which of the following is a stated benefit of traditional medicine in Ghana?","options":["Reducing the national health burden because of high accessibility, affordability and trust","Replacing all biomedical services with traditional ones","Eliminating the need for research into herbal medicines","Guaranteeing a cure for every disease"],"answer":"Reducing the national health burden because of high accessibility, affordability and trust","solution":"A: Correct: the slides attribute high dependence on herbal medicine to accessibility, affordability and trust and note prospects for cancer and diabetes.\nB: The slides discuss integration, not wholesale replacement of biomedicine.\nC: Research gaps are described as a challenge, so more research is needed.\nD: The slides speak of prospects, not guaranteed cures for all diseases.","source":"BHM HERBAL MED IN GHANA.pptx | SLIDE 13","difficulty":"Hard"},{"id":"her-v1-030","module":"v1","type":"mcq","q":"The ratio of traditional health practitioners to the Ghanaian population was about ______.","options":["1:20,000","1:200","1:2,000","1:40,000"],"answer":"1:200","solution":"A: That is the ratio for medical doctors, not traditional practitioners.\nB: Correct: the slides state the ratio of traditional practitioners to population was about 1:200 versus 1:20,000 for medical doctors.\nC: No such ratio is given in the slides.\nD: 40,000 is the approximate number of GHAFTRAM practitioners, not a population ratio.","source":"BHM HERBAL MED IN GHANA.pptx | SLIDE 13","difficulty":"Devil Mode"},{"id":"her-v1-031","module":"v1","type":"mcq","q":"The Traditional Medicine Practice Council (TMPC) in Ghana was established by which legislation?","options":["PNDC Law 305B of 1992","Act 851 of 2012","Act 575 of 2000","The Native Customs Regulation Ordinance of 1878"],"answer":"Act 575 of 2000","solution":"A: PNDC Law 305B is the Food and Drugs Law, not the TMPC Act.\nB: Act 851 is the Public Health Act that replaced the Food and Drugs Law.\nC: Correct: the slides state Act 575 (2000) established the TMPC for registration and regulation of traditional practitioners.\nD: That ordinance banned traditional healing practices in the colonial era.","source":"BHM HERBAL MED IN GHANA.pptx | SLIDE 8","difficulty":"Medium"},{"id":"her-v1-032","module":"v1","type":"mcq","q":"In which year was the Centre for Plant Medicine Research (CPMR) established at Mampong-Akwapim?","options":["1961","1999","2001","1975"],"answer":"1975","solution":"A: 1961 is the year the Ghana Psychic and Traditional Healers Association was formed.\nB: 1999 is when TAMD was established by upgrading the Traditional Medicine Unit.\nC: 2001 is when the BSc Herbal Medicine programme started at KNUST.\nD: Correct: the slides state CPMR, formerly the Centre for Scientific Research into Plant Medicine, was established in 1975.","source":"BHM HERBAL MED IN GHANA.pptx | SLIDE 7","difficulty":"Hard"},{"id":"her-v1-033","module":"v1","type":"mcq","q":"About what proportion of herbal products analysed at CPMR in 2021 were below quality control standards?","options":["50%","5%","25%","80%"],"answer":"50%","solution":"A: Correct: the slides state about 50% of 615 products analysed in 2021 at CPMR were below quality control standards.\nB: 5% is far lower than the figure reported in the slides.\nC: The reported figure is about half of the products, not a quarter.\nD: 80% refers to reliance on traditional medicine, not the Quality Control failure rate.","source":"BHM HERBAL MED IN GHANA.pptx | SLIDE 17","difficulty":"Medium"},{"id":"her-v1-034","module":"v1","type":"mcq","q":"A major registration challenge for herbal medicines in Ghana is the lack of data on ______.","options":["patent ownership","shelf life (stability studies)","clinical efficacy data only","packaging colour"],"answer":"shelf life (stability studies)","solution":"A: Patents are discussed under IPR policy, not as the main FDA registration data gap.\nB: Correct: the slides state almost all products for FDA registration lack stability data, so liquids are licensed for only one year.\nC: Efficacy data are required, but the specific missing data highlighted are shelf-life studies.\nD: Packaging standards are a cost challenge, not the missing stability data.","source":"BHM HERBAL MED IN GHANA.pptx | SLIDE 17","difficulty":"Hard"},{"id":"her-v1-035","module":"v1","type":"mcq","q":"The doctrine of signatures was propounded by ______.","options":["Hippocrates","Dioscorides","Paracelsus","Galen"],"answer":"Paracelsus","solution":"A: Hippocrates is associated with the four humours, not the doctrine of signatures.\nB: Dioscorides wrote De Materia Medica, not the doctrine of signatures.\nC: Correct: the slides state the doctrine of signatures was propounded by Paracelsus (1493-1541).\nD: Galen developed systems of classifying illnesses and remedies, not the doctrine of signatures.","source":"BHM 151-ROLE OF SCIENCE IN HERBALISM.pptx | SLIDE 13","difficulty":"Devil Mode"},{"id":"her-v1-036","module":"v1","type":"mcq","q":"The doctrine of signatures suggested that ______.","options":["only plants with flowers could be medicinal","plant remedies must be approved by the FDA before use","bitter plants were always poisonous","God provided clues about a plant's medicinal value in its general appearance"],"answer":"God provided clues about a plant's medicinal value in its general appearance","solution":"A: Flower presence was not the criterion of the doctrine.\nB: Regulatory approval is a modern concept, not part of the doctrine.\nC: Bitterness relates to belief-based therapy in the slides, not to the doctrine of signatures.\nD: Correct: the slide states the doctrine suggested God gave clues about medicinal value in the plant's appearance, e.g. Kigelia africana fruit for breast diseases.","source":"BHM 151-ROLE OF SCIENCE IN HERBALISM.pptx | SLIDE 13","difficulty":"Medium"},{"id":"her-v1-037","module":"v1","type":"mcq","q":"According to the drug discovery process slides, developing a new drug from original idea to launch can take ______.","options":["12-15 years and cost in excess of $1 billion","1-2 years and under $1 million","5 years and about $100 million","20-30 years and over $10 billion"],"answer":"12-15 years and cost in excess of $1 billion","solution":"A: Correct: the slide states development can take 12-15 years and cost over $1 billion.\nB: That greatly understates the time and cost given in the slides.\nC: The quoted figures are 12-15 years and over $1 billion.\nD: The slides give 12-15 years, not 20-30 years.","source":"BHM 151-ROLE OF SCIENCE IN HERBALISM.pptx | SLIDE 18","difficulty":"Hard"},{"id":"her-v1-038","module":"v1","type":"mcq","q":"Which is the correct order of early stages in modern drug discovery as listed in the slides?","options":["Preclinical studies, target identification, lead optimization, FDA review","Target identification, hit generation, lead compounds, lead optimization, preclinical studies","Lead optimization, hit generation, target identification, clinical trials","FDA review, clinical trials, target identification, hit generation"],"answer":"Target identification, hit generation, lead compounds, lead optimization, preclinical studies","solution":"A: Preclinical studies come after lead optimization, not first.\nB: Correct: the slides list target identification and validation, hit generation by high-throughput screening, lead compounds, lead optimization then preclinical studies.\nC: Target identification must precede hit generation and lead optimization.\nD: FDA review comes near the end, after clinical trials.","source":"BHM 151-ROLE OF SCIENCE IN HERBALISM.pptx | SLIDE 19","difficulty":"Medium"},{"id":"her-v1-039","module":"v1","type":"mcq","q":"Phase 1 clinical trials typically involve ______.","options":["1000-3000 patients","100-300 patients","20-80 healthy individuals","only laboratory animals"],"answer":"20-80 healthy individuals","solution":"A: That describes Phase 3 trials.\nB: That describes Phase 2 trials.\nC: Correct: the slides list Phase 1 as 20-80 healthy individuals, Phase 2 as 100-300 patients and Phase 3 as 1000-3000 patients.\nD: Animal studies are preclinical, before Phase 1 in humans.","source":"BHM 151-ROLE OF SCIENCE IN HERBALISM.pptx | SLIDE 19","difficulty":"Hard"},{"id":"her-v1-040","module":"v1","type":"mcq","q":"ADME in drug development stands for ______.","options":["Approval, Dosage, Monitoring, Evaluation","Assessment of Drug Market Entry","Active, Dormant, Metabolised, Excreted states","Absorption, Distribution, Metabolism, Excretion"],"answer":"Absorption, Distribution, Metabolism, Excretion","solution":"A: Those are not the processes abbreviated as ADME.\nB: ADME describes what the body does to a drug, not market entry.\nC: ADME refers to processes, and 'Active/Dormant' are not part of the abbreviation.\nD: Correct: the slides define ADME as Absorption, Distribution, Metabolism and Excretion.","source":"BHM 151-ROLE OF SCIENCE IN HERBALISM.pptx | SLIDE 21","difficulty":"Devil Mode"},{"id":"her-v1-041","module":"v1","type":"mcq","q":"Morphine was isolated from opium, which comes from which plant?","options":["Papaver somniferum","Strychnos nux-vomica","Atropa belladonna","Erythroxylon coca"],"answer":"Papaver somniferum","solution":"A: Correct: the slides list isolation of morphine from opium (Papaver somniferum).\nB: Strychnos nux-vomica is the source of strychnine.\nC: Atropa belladonna is the source of atropine.\nD: Erythroxylon coca is the source of cocaine.","source":"BHM 151-ROLE OF SCIENCE IN HERBALISM.pptx | SLIDE 26","difficulty":"Medium"},{"id":"her-v1-042","module":"v1","type":"mcq","q":"Metformin, the anti-diabetic drug, was developed from which plant?","options":["Artemisia annua","Galega officinalis","Taxus brevifolia","Digitalis purpurea"],"answer":"Galega officinalis","solution":"A: Artemisia annua yields artemisinin, an anti-malarial.\nB: Correct: the slides list guanidine/bioformin/tenoformin/metformin from Galega officinalis.\nC: Taxus brevifolia yields the anti-cancer drug paclitaxel.\nD: Digitalis purpurea yields digoxin, used in heart disease.","source":"BHM 151-ROLE OF SCIENCE IN HERBALISM.pptx | SLIDE 27","difficulty":"Hard"},{"id":"her-v1-043","module":"v1","type":"mcq","q":"Which of the following correctly matches a drug with its plant source?","options":["Vincristine - Cinchona succirubra","Colchicine - Curcuma longa","Digoxin - Digitalis purpurea","Salicin - Artemisia annua"],"answer":"Digoxin - Digitalis purpurea","solution":"A: Vincristine comes from the periwinkle plant, not Cinchona.\nB: Colchicine comes from Colchicum autumnale; Curcuma longa yields curcumin.\nC: Correct: the slides list digoxin/digitoxin from Digitalis purpurea and D. lanata.\nD: Salicin comes from willow (Salix alba), not Artemisia annua.","source":"BHM 151-ROLE OF SCIENCE IN HERBALISM.pptx | SLIDE 27","difficulty":"Medium"},{"id":"her-v1-044","module":"v1","type":"mcq","q":"Zulu traditional medicine is guided by principles including Ubuntu, Holism and Spiritualism. 'Ubuntu' refers to ______.","options":["the balance of the four bodily humours","the use of divination only","worship of ancestors alone","interconnectedness and community"],"answer":"interconnectedness and community","solution":"A: The four humours belong to Greco-Arabic medicine, not Zulu principles.\nB: Divination is a practice, but Ubuntu specifically means interconnectedness.\nC: Spiritualism involves ancestors, but Ubuntu is about community interconnectedness.\nD: Correct: the slides define Ubuntu as the concept of interconnectedness and community.","source":"BHM 151 TRADITIONAL MEDICINE PRACTICES IN AFRICA.pptx | SLIDE 5","difficulty":"Hard"},{"id":"her-v1-045","module":"v1","type":"mcq","q":"Traditional Zulu healers are known as ______.","options":["sangomas or inyangas","laibons","bokaye","wanzam"],"answer":"sangomas or inyangas","solution":"A: Correct: the slides state traditional healers in Zulu medicine are known as sangomas or inyangas.\nB: Laibons are Maasai traditional healers.\nC: Bokaye are Hausa traditional healers.\nD: Wanzam refers to traditional circumcisers.","source":"BHM 151 TRADITIONAL MEDICINE PRACTICES IN AFRICA.pptx | SLIDE 4","difficulty":"Devil Mode"},{"id":"her-v1-046","module":"v1","type":"mcq","q":"Which traditional practitioners specialize in treating bone fractures, dislocations and sprains?","options":["Traditional birth attendants","Bone setters","Diviners","Fetish priests"],"answer":"Bone setters","solution":"A: TBAs assist with childbirth and prenatal/postnatal care, not bone setting.\nB: Correct: the slides describe bone setters as healers specializing in musculoskeletal disorders such as fractures, dislocations and sprains.\nC: Diviners diagnose through spiritual means rather than treating fractures.\nD: Fetish priests use consecrated objects, not bone manipulation.","source":"BHM 151 TRADITIONAL MEDICINE PRACTICES IN AFRICA.pptx | SLIDE 11","difficulty":"Medium"},{"id":"her-v1-047","module":"v1","type":"mcq","q":"A traditional birth attendant (TBA) is best described as ______.","options":["a qualified medical doctor in a rural hospital","a specialist who only performs circumcision","a community-based provider who assists childbirth and gives prenatal and postnatal care using traditional practices","a diviner who diagnoses by throwing bones"],"answer":"a community-based provider who assists childbirth and gives prenatal and postnatal care using traditional practices","solution":"A: A TBA is a traditional community provider, not a medically qualified doctor.\nB: Circumcisers are a separate category of traditional practitioner.\nC: Correct: the slides define TBAs as community-based providers assisting with childbirth and providing prenatal and postnatal care.\nD: That describes divination, not the role of a TBA.","source":"BHM 151 TRADITIONAL MEDICINE PRACTICES IN AFRICA.pptx | SLIDE 15","difficulty":"Hard"},{"id":"her-v1-048","module":"v1","type":"mcq","q":"In traditional African spirituality, a fetish is ______.","options":["a herbal medicine prepared from tree bark","a ritual dance performed at festivals","a type of traditional bone-setting instrument","an object believed to possess spiritual powers or energies"],"answer":"an object believed to possess spiritual powers or energies","solution":"A: A fetish is an object, not a herbal preparation.\nB: A dance is a ritual practice, not the object called a fetish.\nC: Bone-setting tools are not described as fetishes.\nD: Correct: the slides define a fetish as an object such as a statue, mask or amulet believed to possess spiritual powers.","source":"BHM 151 TRADITIONAL MEDICINE PRACTICES IN AFRICA.pptx | SLIDE 19","difficulty":"Medium"},{"id":"her-v1-049","module":"v1","type":"mcq","q":"Which is a stated purpose of fetishism in the slides?","options":["Protection, healing, divination and spiritual growth","Manufacturing herbal medicines for export","Replacing traditional birth attendants","Conducting surgical operations"],"answer":"Protection, healing, divination and spiritual growth","solution":"A: Correct: the slides list protection, healing, divination and spiritual growth as purposes of fetishism.\nB: Manufacturing for export is an industry topic, not a purpose of fetishism.\nC: Fetishism does not replace TBAs in the lecture.\nD: Surgery is not listed as a purpose of fetishism.","source":"BHM 151 TRADITIONAL MEDICINE PRACTICES IN AFRICA.pptx | SLIDE 20","difficulty":"Hard"},{"id":"her-v1-050","module":"v1","type":"mcq","q":"In Ghana before colonialism, healthcare was mainly delivered by ______.","options":["a national network of government hospitals","men and women recognized as competent, usually custodians of cultural norms such as priest-healers","trained biomedical doctors","the Food and Drugs Authority"],"answer":"men and women recognized as competent, usually custodians of cultural norms such as priest-healers","solution":"A: Government hospitals came later; the pre-colonial period had no organized system.\nB: Correct: the slides state there was no organized system and care was delivered by recognized competent persons, usually priest-healers.\nC: Biomedicine was introduced during the colonial era.\nD: The FDA is a modern regulatory body.","source":"BHM HERBAL MED IN GHANA.pptx | SLIDE 3","difficulty":"Devil Mode"},{"id":"her-v1-051","module":"v1","type":"mcq","q":"Which ordinance banned traditional healing practices outright in the Gold Coast Colony?","options":["Act 575 of 2000","PNDC Law 305 of 1992","The Native Customs Regulation Ordinance of 1878","The Public Health Act 851 of 2012"],"answer":"The Native Customs Regulation Ordinance of 1878","solution":"A: Act 575 established the TMPC to regulate practitioners, not to ban them.\nB: That law established the FDA, not a ban on traditional healing.\nC: Correct: the slides state traditional healing was banned under the Native Customs Regulation Ordinance of 1878.\nD: Act 851 replaced the Food and Drugs Law, not a colonial ban.","source":"BHM HERBAL MED IN GHANA.pptx | SLIDE 6","difficulty":"Medium"},{"id":"her-v1-052","module":"v1","type":"mcq","q":"Ghana approved the integration of traditional medicine into its healthcare system in which year?","options":["1991","2001","2019","2011"],"answer":"2011","solution":"A: 1991 is when the Traditional Medicine Unit was formed.\nB: 2001 is when the KNUST Herbal Medicine Department was established.\nC: 2019 is when ITAM was established.\nD: Correct: the slides state government approved integration of traditional medicine into the healthcare system in 2011.","source":"BHM HERBAL MED IN GHANA.pptx | SLIDE 9","difficulty":"Hard"},{"id":"her-v1-053","module":"v1","type":"mcq","q":"The Department of Herbal Medicine at KNUST was established in 2001 to offer ______.","options":["a 4-year BSc Programme in Herbal Medicine","a 2-year diploma in pharmacy","a postgraduate MSc only","a short course for traditional healers"],"answer":"a 4-year BSc Programme in Herbal Medicine","solution":"A: Correct: the slides state the department was established in 2001 to offer a four-year BSc programme.\nB: The programme is a four-year BSc, not a two-year diploma.\nC: The department was established for a BSc programme.\nD: A full BSc degree programme was established, not a short course.","source":"BHM HERBAL MED IN GHANA.pptx | SLIDE 10","difficulty":"Medium"},{"id":"her-v1-054","module":"v1","type":"mcq","q":"GHAFTRAM is ______.","options":["a government hospital for herbal medicine","an umbrella federation of traditional medicine practitioner associations in Ghana","a regulatory body that registers drugs","a research institute at Mampong"],"answer":"an umbrella federation of traditional medicine practitioner associations in Ghana","solution":"A: GHAFTRAM is a federation of practitioners, not a hospital.\nB: Correct: the slides describe GHAFTRAM as the Ghana Federation of Traditional Medicine Practitioners Associations, an umbrella body.\nC: Registration of practitioners is the TMPC; GHAFTRAM is a federation.\nD: The research institute is CPMR, not GHAFTRAM.","source":"BHM HERBAL MED IN GHANA.pptx | SLIDE 12","difficulty":"Hard"},{"id":"her-v1-055","module":"v1","type":"mcq","q":"A way forward proposed for Ghana's herbal industry is converting liquid formulations into capsules and tablets, which ______.","options":["increases the microbial load of products","removes the need for FDA registration","masks bitter taste and makes transportation easier","eliminates all adverse effects"],"answer":"masks bitter taste and makes transportation easier","solution":"A: Solid dosage forms are proposed to help control contamination, not increase it.\nB: Registration remains necessary regardless of dosage form.\nC: Correct: the slides state solid dosage forms mask bitter taste and make products easy to transport.\nD: No dosage form eliminates all adverse effects.","source":"BHM 151 amponsah.pptx | SLIDE 16","difficulty":"Devil Mode"},{"id":"her-v1-056","module":"v1","type":"mcq","q":"The global herbal medicine market was expected to be valued at about how much by 2029?","options":["USD 17.7 billion","USD 1.77 trillion","USD 233 billion","USD 177.65 billion"],"answer":"USD 177.65 billion","solution":"A: This is ten times smaller than the projected value given.\nB: The slides give 177.65 billion, not 1.77 trillion.\nC: USD 233.08 billion is the 2024 market value from another slide, not the 2029 projection.\nD: Correct: the slides state the global herbal medicine market was expected to reach USD 177.65 billion by 2029.","source":"BHM 151 amponsah.pptx | SLIDE 3","difficulty":"Medium"},{"id":"her-v1-057","module":"v1","type":"mcq","q":"Ghana exports medicinal plants including Griffonia simplicifolia, which is rich in ______.","options":["5-HTP","quinine","artemisinin","paclitaxel"],"answer":"5-HTP","solution":"A: Correct: the slides state Griffonia simplicifolia is rich in 5-HTP and is among Ghana's medicinal plant exports.\nB: Quinine comes from Cinchona bark, not Griffonia simplicifolia.\nC: Artemisinin comes from Artemisia annua.\nD: Paclitaxel comes from the Pacific yew tree.","source":"BHM 151 amponsah.pptx | SLIDE 7","difficulty":"Hard"},{"id":"her-v1-058","module":"v1","type":"mcq","q":"A key challenge facing the herbal industry in Ghana is the rise of charlatans, which the slides say ______.","options":["increases government revenue from registration","undermines the integrity of the profession and puts the public at risk","improves the quality of herbal products","eliminates the need for standardization"],"answer":"undermines the integrity of the profession and puts the public at risk","solution":"A: Charlatans are a problem, not a revenue source.\nB: Correct: the slides state unqualified individuals posing as certified professionals undermine integrity and put clients at risk.\nC: Unqualified practitioners reduce quality and trust, not improve it.\nD: Standardization remains essential despite charlatans.","source":"BHM 151 amponsah.pptx | SLIDE 12","difficulty":"Medium"},{"id":"her-v1-059","module":"v1","type":"mcq","q":"Which sociological perspective focuses on the meanings healers and patients attach to traditional healing and the trust between them?","options":["Functionalist perspective","Conflict perspective","Interactionist perspective","Structural perspective"],"answer":"Interactionist perspective","solution":"A: Functionalism focuses on social stability and meeting community healthcare needs.\nB: Conflict theory examines power dynamics and inequality between traditional and modern medicine.\nC: Correct: the slides state the interactionist perspective focuses on individual interactions and symbolic meanings and trust.\nD: Structural theory is not one of the three perspectives listed in the slides.","source":"BHM 151 Sociological Considerations in Traditional Medicine Practice.pptx | SLIDE 5","difficulty":"Hard"},{"id":"her-v1-060","module":"v1","type":"mcq","q":"Functionalist perspective views traditional medicine as ______.","options":["a struggle between competing medical systems","a purely individual symbolic interaction","irrelevant to rural healthcare access","maintaining social stability by promoting health and addressing community healthcare needs"],"answer":"maintaining social stability by promoting health and addressing community healthcare needs","solution":"A: That is the conflict perspective.\nB: That describes the interactionist perspective.\nC: Functionalism highlights healthcare access in rural areas as a key role.\nD: Correct: the slides state functionalism examines how traditional medicine maintains social stability and functioning of society.","source":"BHM 151 Sociological Considerations in Traditional Medicine Practice.pptx | SLIDE 6","difficulty":"Devil Mode"},{"id":"her-v1-061","module":"v1","type":"mcq","q":"According to the slides, traditional medical knowledge is often transmitted through ______.","options":["apprenticeships and oral traditions","only through university lectures","exclusively through written pharmacopoeias","through mass media advertising"],"answer":"apprenticeships and oral traditions","solution":"A: Correct: the slides state knowledge is passed down through apprenticeships and oral traditions, with documentation as a preservation effort.\nB: Universities are a modern preservation avenue, not the traditional mode.\nC: Traditional knowledge is largely oral, not exclusively written.\nD: Mass media are not the traditional transmission route described.","source":"BHM 151 Sociological Considerations in Traditional Medicine Practice.pptx | SLIDE 18","difficulty":"Medium"},{"id":"her-v1-062","module":"v1","type":"mcq","q":"The Ghana Herbal Pharmacopoeia was first launched in which year?","options":["2007","1992","1975","2011"],"answer":"1992","solution":"A: 2007 is when the second edition of the Ghana Herbal Pharmacopoeia was published.\nB: Correct: the _IKA slides state the Ghana Herbal Pharmacopoeia was launched in 1992.\nC: 1975 is when CPMR was established.\nD: 2011 is when integration of traditional medicine into healthcare was approved.","source":"BHM 151 _IKA .pdf | SLIDE 40","difficulty":"Hard"},{"id":"her-v1-063","module":"v1","type":"mcq","q":"Complementary medicine is defined in the _IKA slides as ______.","options":["non-mainstream practices used instead of conventional medicine","only herbal medicines prescribed by doctors","non-mainstream practices used together with conventional medicine","the official national healthcare system"],"answer":"non-mainstream practices used together with conventional medicine","solution":"A: That is the definition of alternative medicine in the slides.\nB: Complementary medicine covers a broad set of practices, not only doctor-prescribed herbs.\nC: Correct: the slides define complementary medicine as non-mainstream practices used together with conventional medicine, while alternative is used instead of.\nD: The official system is conventional or orthodox medicine.","source":"BHM 151 _IKA .pdf | SLIDE 8","difficulty":"Medium"},{"id":"her-v1-064","module":"v1","type":"mcq","q":"When both conventional and complementary care are offered by the same providers and facilities, this is called ______.","options":["alternative medicine","orthodox medicine","phytotherapy","integrative medicine"],"answer":"integrative medicine","solution":"A: Alternative means non-mainstream used instead of conventional care.\nB: Orthodox medicine refers to the conventional system alone.\nC: Phytotherapy is the use of plant medicines, not the combination of two systems.\nD: Correct: the slides define integrative medicine as the situation where providers and facilities offer both types of care.","source":"BHM 151 _IKA .pdf | SLIDE 8","difficulty":"Hard"},{"id":"her-v1-065","module":"v1","type":"mcq","q":"The Alma-Ata declaration of 1978 is associated with ______.","options":["Health for All by 2000 and recognition of traditional medicine in primary healthcare","the founding of the World Health Organization","the ban on traditional healing in Ghana","the discovery of penicillin"],"answer":"Health for All by 2000 and recognition of traditional medicine in primary healthcare","solution":"A: Correct: the slides state the 1978 WHA-UNICEF Alma-Ata declaration gave recognition for developing TM and TMPs and spurred interest in TM.\nB: WHO was founded in 1948, not at Alma-Ata in 1978.\nC: The ban was the 1878 Native Customs Regulation Ordinance.\nD: Penicillin's discovery is unrelated to Alma-Ata.","source":"BHM 151 _IKA .pdf | SLIDE 27","difficulty":"Devil Mode"},{"id":"her-v1-066","module":"v1","type":"mcq","q":"According to the global trends slides, in China traditional herbal preparations account for what share of total medicinal consumption?","options":["5%-10%","30%-50%","60%-70%","over 90%"],"answer":"30%-50%","solution":"A: This understates the share given in the slides.\nB: Correct: the slides state that in China traditional herbal preparations account for 30%-50% of total medicinal consumption.\nC: 60-70% is the Ghana reliance figure, not the China figure.\nD: Over 90% is the Ethiopian reliance figure, not China's medicinal consumption share.","source":"BHM 151 _IKA .pdf | SLIDE 33","difficulty":"Medium"},{"id":"her-v1-067","module":"v1","type":"mcq","q":"The 'Herbalists Charter' granted British herbalists the right to practise herbal medicine in 1543. Who granted it?","options":["Queen Elizabeth I","Paracelsus","Henry VIII","Nicholas Culpeper"],"answer":"Henry VIII","solution":"A: Elizabeth I is not named in the slides as the granter of the charter.\nB: Paracelsus was a Swiss physician/alchemist, not a British monarch.\nC: Correct: the slides state Henry VIII granted British herbalists the right and freedom to practise herbal medicine in 1543.\nD: Culpeper was an English herbalist, not the monarch granting the charter.","source":"HERBALISM-NEW.pptx | SLIDE 30","difficulty":"Hard"},{"id":"her-v1-068","module":"v1","type":"mcq","q":"Paracelsus is noted for the statement that ______.","options":["all plants are safe if they are natural","herbal medicines cannot be standardized","only minerals can be medicines","the right dose differentiates a poison from a remedy"],"answer":"the right dose differentiates a poison from a remedy","solution":"A: Paracelsus emphasized dose and toxicity, not safety by naturalness.\nB: The slides present Paracelsus as a founder of chemical medicine, not as opposing standardization.\nC: His work integrated physical, spiritual and chemical approaches, not minerals alone.\nD: Correct: the slides quote Paracelsus saying all chemicals can be poisons and the right dose differentiates a poison from a remedy.","source":"HERBALISM-NEW.pptx | SLIDE 27","difficulty":"Medium"},{"id":"her-v1-069","module":"v1","type":"mcq","q":"Hippocrates is credited in the herbalism history slides with developing the Four Humours system consisting of ______.","options":["blood, phlegm, yellow bile and black bile","earth, water, fire and air","hot, cold, wet and dry","sanguine, choleric, melancholic and phlegmatic temperaments"],"answer":"blood, phlegm, yellow bile and black bile","solution":"A: Correct: the slides state Hippocrates developed the Four Humours: blood, phlegm, yellow bile and black bile.\nB: Those are Empedocles' Four Roots developed by Plato into Four Elements.\nC: Those qualities are associated with Galen's later developments, not the four humours listed.\nD: These are temperament types derived from the humours, not the humours themselves.","source":"HERBALISM-NEW.pptx | SLIDE 15","difficulty":"Hard"},{"id":"her-v1-070","module":"v1","type":"mcq","q":"The earliest evidence of plant-based medicine cited in HERBALISM-NEW comes from a Neanderthal grave at ______ dated to about 60,000 BC.","options":["El Sidron, Spain","Shanidar, Iraq","Thebes, Egypt","Mampong, Ghana"],"answer":"Shanidar, Iraq","solution":"A: El Sidron is mentioned for dental calculus analysis but is Spanish, not the 60,000 BC grave.\nB: Correct: the slides cite the Shanidar Neanderthal grave in Iraq, dated to 60,000 BC, as the earliest evidence.\nC: Egyptian papyri are dated much later than 60,000 BC.\nD: Mampong is the location of CPMR, not a prehistoric burial site.","source":"HERBALISM-NEW.pptx | SLIDE 9","difficulty":"Devil Mode"},{"id":"her-v1-071","module":"v1","type":"mcq","q":"The Ebers Papyrus, written around 1550 BC, contains approximately how many prescriptions?","options":["365","600","876","1892"],"answer":"876","solution":"A: 365 is the number of medicinal plants in the Chinese Pen Tsao.\nB: Dioscorides described over 600 plants in De Materia Medica.\nC: Correct: the role-of-science slides state the Ebers Papyrus contains 876 prescriptions made up of more than 500 substances.\nD: 1892 is the number of drugs in Li Shi Zhen's Pen T'sao Kan Mu.","source":"BHM 151-ROLE OF SCIENCE IN HERBALISM.pptx | SLIDE 10","difficulty":"Medium"},{"id":"her-v1-072","module":"v1","type":"mcq","q":"The Ebers Papyrus and other Egyptian medical writings are examples of knowledge recorded on ______.","options":["baked clay tablets","parchment only","printed paper","papyrus"],"answer":"papyrus","solution":"A: Clay tablets are associated with Sumerian and Assyrian cuneiform records.\nB: Parchment is mentioned but the Ebers Papyrus is specifically written on papyrus.\nC: Printing came much later; these records predate printing.\nD: Correct: the pharmacognosy slides state the Egyptians documented knowledge on papyrus made from Cyperus aquaticus.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 7","difficulty":"Hard"},{"id":"her-v1-073","module":"v1","type":"mcq","q":"The 'Pen Tsao' or Native Herbal is traditionally attributed to ______.","options":["Shen Nung (about 2700 BC)","Li Shi Zhen","Hippocrates","Charaka"],"answer":"Shen Nung (about 2700 BC)","solution":"A: Correct: the slides attribute the first Pen Tsao recording 365 drugs to Shen Nung, the Chinese emperor.\nB: Li Shi Zhen wrote the Pen T'sao Kan Mu much later, in 1578.\nC: Hippocrates is the Greek father of medicine.\nD: Charaka is an ancient Indian herbalist associated with Ayurveda.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 10","difficulty":"Medium"},{"id":"her-v1-074","module":"v1","type":"mcq","q":"Ayurveda, as described in the pharmacognosy slides, considers illness to result from ______.","options":["infection by pathogenic microorganisms only","imbalance between the elements earth, water, fire, air and space","the will of the gods alone","a deficiency of vitamins"],"answer":"imbalance between the elements earth, water, fire, air and space","solution":"A: Modern biomedicine emphasizes pathogens; Ayurveda emphasizes elemental imbalance.\nB: Correct: the slides state Ayurveda holds that illness is the consequence of imbalance between the five elements and treatment restores balance.\nC: Ayurveda's emphasis is on elemental balance, not divine will alone.\nD: Vitamin deficiency is a modern nutritional concept, not the Ayurvedic model described.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 13","difficulty":"Hard"},{"id":"her-v1-075","module":"v1","type":"mcq","q":"Which of the following is a correct match between a historic figure and a contribution to anatomy/herbalism?","options":["Paracelsus - the Four Humours","Shen Nung - the Canon of Medicine","Dioscorides - De Materia Medica describing over 600 medicinal plants","Hippocrates - the doctrine of signatures"],"answer":"Dioscorides - De Materia Medica describing over 600 medicinal plants","solution":"A: The Four Humours are attributed to Hippocrates and developed by Galen.\nB: The Canon of Medicine is by Ibn Sina; Shen Nung is linked to the Pen Tsao.\nC: Correct: both the role-of-science and pharmacognosy slides credit Dioscorides with De Materia Medica and over 600 medicinal plants.\nD: The doctrine of signatures is attributed to Paracelsus.","source":"BHM 151-ROLE OF SCIENCE IN HERBALISM.pptx | SLIDE 11","difficulty":"Devil Mode"},{"id":"her-v2-001","module":"v2","type":"mcq","q":"Microbiology is the study of living organisms of microscopic size. Who introduced the term?","options":["Louis Pasteur","Anthony van Leeuwenhoek","Robert Koch","Ferdinand Cohn"],"answer":"Louis Pasteur","solution":"A: Correct: the Bacteriology slides state the term microbiology was introduced by French chemist Louis Pasteur.\nB: Leeuwenhoek first saw microorganisms in 1675 and called them animalcules, but did not introduce the term.\nC: Koch developed pure culture isolation methods, not the term microbiology.\nD: Cohn discovered heat-resistant spores, not the term microbiology.","source":"Bacteriology.pdf | SLIDE 4","difficulty":"Medium"},{"id":"her-v2-002","module":"v2","type":"mcq","q":"Anthony van Leeuwenhoek first saw microorganisms in 1675 and called them ______.","options":["spores","animalcules","bacteriophages","protozoa"],"answer":"animalcules","solution":"A: Spores were discovered by Ferdinand Cohn in 1876.\nB: Correct: the slides state Leeuwenhoek observed microorganisms with a microscope in 1675 and termed them 'animalcules'.\nC: Bacteriophages were named by d'Herelle in the 20th century.\nD: Leeuwenhoek's term was animalcules, not protozoa.","source":"Bacteriology.pdf | SLIDE 4","difficulty":"Hard"},{"id":"her-v2-003","module":"v2","type":"mcq","q":"Which scientist settled the controversy of spontaneous generation using specific conditions for sterility (115-120 C)?","options":["Louis Joblot and John Needham","Robert Koch and Ferdinand Cohn","Lazzaro Spallanzani and Louis Pasteur","Hans Christian Gram and Alexander Fleming"],"answer":"Lazzaro Spallanzani and Louis Pasteur","solution":"A: Joblot and Needham supported spontaneous generation, they did not settle it.\nB: Koch developed pure cultures and Cohn discovered spores, not the sterility controversy.\nC: Correct: the slides credit Spallanzani (1765/1776) and Pasteur (1860-64) with settling the spontaneous generation controversy.\nD: Gram developed staining and Fleming discovered penicillin, unrelated to this controversy.","source":"Bacteriology.pdf | SLIDE 5","difficulty":"Medium"},{"id":"her-v2-004","module":"v2","type":"mcq","q":"Bacteria are prokaryotic microorganisms with a typical size range of ______.","options":["20-400 nanometres","5-50 micrometres","0.02-0.2 micrometres","0.5-5 micrometres"],"answer":"0.5-5 micrometres","solution":"A: That size range describes viruses, not bacteria.\nB: That is larger than the typical bacterial range given.\nC: That range is smaller than typical bacteria and overlaps with viruses.\nD: Correct: the slides state bacteria are 0.5-5 um in size, with some giants such as Thiomargarita namibiensis.","source":"Bacteriology.pdf | SLIDE 6","difficulty":"Hard"},{"id":"her-v2-005","module":"v2","type":"mcq","q":"Which of the following is NOT a phenotype used in the classification of bacteria?","options":["DNA-DNA hybridization","Morphological characteristics","Staining characteristics","Biochemical reactions"],"answer":"DNA-DNA hybridization","solution":"A: Correct: DNA-DNA hybridization and G+C content are genotypic methods; phenotypic methods include morphology, staining and biochemical reactions.\nB: Morphology is listed as a phenotypic basis of classification.\nC: Staining reactions such as Gram stain are phenotypic criteria.\nD: Biochemical reactions are listed among phenotypic classification bases.","source":"Bacteriology.pdf | SLIDE 7","difficulty":"Devil Mode"},{"id":"her-v2-006","module":"v2","type":"mcq","q":"Which bacterial morphology is described as flexible spiral forms?","options":["Spirilla","Spirochaetes","Vibrio","Actinomycetes"],"answer":"Spirochaetes","solution":"A: Spirilla are rigid spiral forms, not flexible.\nB: Correct: the slides classify spirochaetes as flexible spiral forms, while spirilla are rigid spiral forms.\nC: Vibrio are comma-shaped bacteria.\nD: Actinomycetes are filamentous bacteria.","source":"Bacteriology.pdf | SLIDE 8","difficulty":"Medium"},{"id":"her-v2-007","module":"v2","type":"mcq","q":"Mycoplasmas differ from true bacteria in that they ______.","options":["possess a thick peptidoglycan wall","are strict intracellular parasites","lack a rigid cell wall and show extreme pleomorphism","are always rod-shaped"],"answer":"lack a rigid cell wall and show extreme pleomorphism","solution":"A: Mycoplasmas lack a rigid cell wall; thick peptidoglycan is characteristic of Gram-positive bacteria.\nB: Rickettsiae and chlamydiae are strict intracellular parasites, not mycoplasmas.\nC: Correct: the slides state mycoplasmas are prokaryotes with no rigid cell wall, leading to pleomorphism and osmotic sensitivity.\nD: Mycoplasmas are pleomorphic precisely because they lack a rigid wall.","source":"Bacteriology.pdf | SLIDE 17","difficulty":"Hard"},{"id":"her-v2-008","module":"v2","type":"mcq","q":"Which structure is responsible for swimming movement in bacteria?","options":["Sex pilus","Fimbriae","Capsule","Flagella"],"answer":"Flagella","solution":"A: The sex pilus stabilizes mating bacteria during conjugation, not swimming.\nB: Fimbriae are for attachment to surfaces, not motility.\nC: The capsule protects against phagocytosis and desiccation, not movement.\nD: Correct: the structure-function table lists flagella, made of flagellin, as locomotor organs for swimming movement.","source":"Bacteriology.pdf | SLIDE 21","difficulty":"Medium"},{"id":"her-v2-009","module":"v2","type":"mcq","q":"The rigidity of the bacterial cell wall is due to ______.","options":["peptidoglycan (murein)","teichoic acids","the outer membrane","the cytoplasmic membrane"],"answer":"peptidoglycan (murein)","solution":"A: Correct: the slides state cell wall rigidity is due to peptidoglycan or murein, made of N-acetyl glucosamine and N-acetyl muramic acid.\nB: Teichoic acids regulate cation movement and antigenicity but do not provide rigidity.\nC: The outer membrane is a permeability barrier in Gram-negatives, not the source of rigidity.\nD: The cytoplasmic membrane is a phospholipid bilayer, not the rigid layer.","source":"Bacteriology.pdf | SLIDE 22","difficulty":"Hard"},{"id":"her-v2-010","module":"v2","type":"mcq","q":"Peptidoglycan makes up what portion of the Gram-positive cell wall?","options":["5-10%","50-90%","100%","25-30%"],"answer":"50-90%","solution":"A: That is the proportion in Gram-negative bacteria.\nB: Correct: the slides state peptidoglycan makes up 50-90% of the Gram-positive wall, versus 5-10% in Gram-negatives.\nC: Teichoic acids and polysaccharides are also present in Gram-positive walls.\nD: This is not the figure given in the slides.","source":"Bacteriology.pdf | SLIDE 24","difficulty":"Devil Mode"},{"id":"her-v2-011","module":"v2","type":"mcq","q":"Protoplasts are osmotically sensitive and can only be maintained intact in ______ solutions.","options":["hypotonic","isotonic","hypertonic","sterile distilled water"],"answer":"hypertonic","solution":"A: Protoplasts lyse rapidly in hypotonic solutions.\nB: Protoplasts also lyse in isotonic solutions according to the slides.\nC: Correct: the slides state protoplasts undergo rapid lysis in isotonic or hypotonic solutions and can only be maintained in hypertonic solutions.\nD: Distilled water is strongly hypotonic and would cause lysis.","source":"Bacteriology.pdf | SLIDE 24","difficulty":"Medium"},{"id":"her-v2-012","module":"v2","type":"mcq","q":"What is the sedimentation coefficient of the complete bacterial ribosome?","options":["80S","50S","30S","70S"],"answer":"70S","solution":"A: 80S ribosomes are found in eukaryotes, not bacteria.\nB: 50S is only the large subunit of the bacterial ribosome.\nC: 30S is only the small subunit of the bacterial ribosome.\nD: Correct: the slides state individual ribosomes have a sedimentation coefficient of 70S, composed of 50S and 30S subunits.","source":"Bacteriology.pdf | SLIDE 31","difficulty":"Hard"},{"id":"her-v2-013","module":"v2","type":"mcq","q":"Bacterial flagella are composed of the protein ______.","options":["flagellin","pilin","peptidoglycan","teichoic acid"],"answer":"flagellin","solution":"A: Correct: the slides describe flagella as helical structures composed of proteins called flagellin.\nB: Pilin is the protein of fimbriae and pili, not flagella.\nC: Peptidoglycan is the cell wall structural polymer.\nD: Teichoic acid is a cell wall component of Gram-positives.","source":"Bacteriology.pdf | SLIDE 33","difficulty":"Medium"},{"id":"her-v2-014","module":"v2","type":"mcq","q":"Which genera produce highly resistant dormant spore forms?","options":["Escherichia and Klebsiella","Bacillus and Clostridium","Staphylococcus and Streptococcus","Pseudomonas and Vibrio"],"answer":"Bacillus and Clostridium","solution":"A: These genera do not produce endospores.\nB: Correct: the slides state bacteria of the genera Bacillus and Clostridium produce highly resistant dormant spores.\nC: These are non-spore-forming Gram-positive cocci.\nD: These Gram-negative rods are not spore-formers.","source":"Bacteriology.pdf | SLIDE 38","difficulty":"Hard"},{"id":"her-v2-015","module":"v2","type":"mcq","q":"Heat resistance of bacterial spores is related to the presence of ______.","options":["high water content in the cortex","teichoic acid in the spore coat","a calcium dipicolinic acid chelate","flagellin protein"],"answer":"a calcium dipicolinic acid chelate","solution":"A: Spores are dehydrated and resistant, not dependent on high water content.\nB: Teichoic acid is a vegetative cell wall component, not the heat resistance factor given.\nC: Correct: the slides state spore heat resistance is related to a calcium dipicolinic acid chelate.\nD: Flagellin is a motility protein, unrelated to spore heat resistance.","source":"Bacteriology.pdf | SLIDE 45","difficulty":"Devil Mode"},{"id":"her-v2-016","module":"v2","type":"mcq","q":"The spore cortex and increased radiation resistance are associated with being unusually rich in ______.","options":["calcium and phosphorus only","aromatic amino acids","unsaturated fatty acids","sulphur-containing amino acids such as cysteine"],"answer":"sulphur-containing amino acids such as cysteine","solution":"A: Calcium dipicolinic acid relates to heat resistance, not the radiation resistance discussed here.\nB: Aromatic amino acids are not cited as the radiation resistance factor.\nC: These are not cited as the basis of spore radiation resistance.\nD: Correct: the slides state spores are rich in sulphur-containing amino acids and disulphide linkages give increased radiation resistance.","source":"Bacteriology.pdf | SLIDE 44","difficulty":"Medium"},{"id":"her-v2-017","module":"v2","type":"mcq","q":"Capsules of pathogenic bacteria are important in virulence because they ______.","options":["inhibit engulfment of the bacteria by phagocytes","increase the rate of binary fission","produce antibiotics that kill competitors","serve as the main site of ATP generation"],"answer":"inhibit engulfment of the bacteria by phagocytes","solution":"A: Correct: the slides state capsules inhibit phagocytic engulfment and losing the capsule makes the organism avirulent.\nB: Capsules affect virulence via phagocytosis resistance, not division rate.\nC: Capsules are not antibiotic-producing structures.\nD: ATP generation occurs at the cytoplasmic membrane, not the capsule.","source":"Bacteriology.pdf | SLIDE 48","difficulty":"Hard"},{"id":"her-v2-018","module":"v2","type":"mcq","q":"The 'negative staining' procedure is used to demonstrate which bacterial structure?","options":["Flagella","Capsules","Ribosomes","Plasma membrane"],"answer":"Capsules","solution":"A: Flagella require special staining techniques, not negative staining of capsules.\nB: Correct: the slides state capsules have low affinity for aniline dyes and are demonstrated by negative staining.\nC: Ribosomes are internal and not demonstrated by negative staining.\nD: The plasma membrane is internal and visualized by other methods.","source":"Bacteriology.pdf | SLIDE 47","difficulty":"Medium"},{"id":"her-v2-019","module":"v2","type":"mcq","q":"What are metachromatic or volutin granules?","options":["Reserve granules of starch in Bacillus species","Lipid inclusions used for ATP storage","Polyphosphate granules highly characteristic of corynebacteria","Spore coat proteins"],"answer":"Polyphosphate granules highly characteristic of corynebacteria","solution":"A: Volutin granules are polyphosphate, not starch.\nB: Lipid inclusions are a different type of inclusion.\nC: Correct: the slides describe metachromatic/volutin granules as polyphosphate granules characteristic of corynebacteria that stain intensely with basic dyes.\nD: Volutin granules are cytoplasmic inclusions, not spore structures.","source":"Bacteriology.pdf | SLIDE 51","difficulty":"Hard"},{"id":"her-v2-020","module":"v2","type":"mcq","q":"Most bacteria reproduce by ______.","options":["sporulation","mitosis","budding","binary fission"],"answer":"binary fission","solution":"A: Sporulation is a survival response, not reproduction.\nB: Bacteria lack a nucleus and do not undergo mitosis.\nC: Budding is typical of yeasts, not most bacteria.\nD: Correct: the slides state the majority of bacteria reproduce by simple division or binary fission.","source":"Bacteriology.pdf | SLIDE 54","difficulty":"Devil Mode"},{"id":"her-v2-021","module":"v2","type":"mcq
