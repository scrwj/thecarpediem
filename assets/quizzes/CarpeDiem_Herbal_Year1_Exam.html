fashion.","source":"Comprehension and Summary.pptx | SLIDE 22","difficulty":"Medium"},{"id":"her-v1-103","module":"v1","type":"mcq","q":"A paragraph is defined in the slides as ______.","options":["a single sentence with a full stop","a collection of unrelated sentences","a group of related sentences that develops one main idea","a chapter of a book"],"answer":"a group of related sentences that develops one main idea","solution":"A: A paragraph is a group of sentences, not one sentence.\nB: Sentences in a paragraph must be related.\nC: Correct: the slides define a paragraph as a group of related sentences developing one main idea and call it a miniature essay.\nD: A paragraph is smaller than a chapter.","source":"finalPARAGRAPH LECTURE SLIDES (1).pptx | SLIDE 2","difficulty":"Hard"},{"id":"her-v1-104","module":"v1","type":"mcq","q":"A 'UCC' good paragraph, according to the slides, has ______.","options":["unity, clarity and correctness","uniformity, coherence and conciseness","unity, cohesion and brevity","unity, coherence/cohesion and completeness"],"answer":"unity, coherence/cohesion and completeness","solution":"A: Clarity and correctness are not the three UCC qualities named.\nB: The correct terms are unity and completeness.\nC: Completeness, not brevity, is the third quality.\nD: Correct: the slides list unity, coherence/cohesion and completeness as the qualities of a good paragraph, summarised as UCC.","source":"finalPARAGRAPH LECTURE SLIDES (1).pptx | SLIDE 11","difficulty":"Medium"},{"id":"her-v1-105","module":"v1","type":"mcq","q":"The sentence that contains the main idea developed in a paragraph is the ______.","options":["topic sentence","concluding sentence","minor supporting sentence","transitional sentence"],"answer":"topic sentence","solution":"A: Correct: the slides define the topic sentence as containing the main idea, being the most general sentence in the paragraph.\nB: The concluding sentence restates or summarizes the paragraph.\nC: A minor supporting sentence indirectly develops the topic.\nD: A transitional sentence leads into the next paragraph.","source":"finalPARAGRAPH LECTURE SLIDES (1).pptx | SLIDE 22","difficulty":"Hard"},{"id":"her-v1-106","module":"v1","type":"mcq","q":"A topic sentence must NOT ______.","options":["include the topic within it","include details or transitions suggesting examples","be a general sentence","end in a plural noun"],"answer":"include details or transitions suggesting examples","solution":"A: The topic sentence must include the topic.\nB: Correct: the slides state a topic sentence is general, must not include details and must not contain transitions such as 'for instance'.\nC: A topic sentence is general by definition.\nD: It may end in a plural noun that is a general term.","source":"finalPARAGRAPH LECTURE SLIDES (1).pptx | SLIDE 29","difficulty":"Devil Mode"},{"id":"her-v1-107","module":"v1","type":"mcq","q":"A paragraph that tells a story with a beginning, middle and end is a ______ paragraph.","options":["descriptive","expository","narrative","argumentative"],"answer":"narrative","solution":"A: A descriptive paragraph shows what a thing or person is like through the senses.\nB: An expository paragraph explains something or provides instruction.\nC: Correct: the slides define the narrative paragraph as telling a story with a sequence of action and a clear beginning, middle and end.\nD: An argumentative paragraph tries to get the reader to accept a point of view.","source":"finalPARAGRAPH LECTURE SLIDES (1).pptx | SLIDE 15","difficulty":"Medium"},{"id":"her-v1-108","module":"v1","type":"mcq","q":"Spelling is defined in the slides as ______.","options":["the pronunciation of a word","the grammatical function of a word","the meaning of a word","the combination of alphabetical letters to form a written word"],"answer":"the combination of alphabetical letters to form a written word","solution":"A: Pronunciation is speech, not spelling.\nB: That is syntax or word class, not spelling.\nC: Meaning is semantics, not spelling.\nD: Correct: the slides define spelling as the combination of alphabetical letters to form a written word.","source":"final SPELLING IN ENGLISH SLIDES-1.pptx | SLIDE 5","difficulty":"Hard"},{"id":"her-v1-109","module":"v1","type":"mcq","q":"According to the 'i before e' rule as taught in the slides, which word is correctly spelled?","options":["Belief","Acheive","Recieve","Collegue"],"answer":"Belief","solution":"A: Correct: the slides give belief, siege and yield as examples where 'i' comes before 'e' for the /i:/ sound.\nB: This is a listed common misspelling; the correct form is achieve.\nC: The correct spelling is receive, an exception to i-before-e.\nD: The correct spelling is colleague.","source":"final SPELLING IN ENGLISH SLIDES-1.pptx | SLIDE 11","difficulty":"Medium"},{"id":"her-v1-110","module":"v1","type":"mcq","q":"Which British spelling corresponds to the American word 'Color'?","options":["Center","Colour","Defense","Humor"],"answer":"Colour","solution":"A: Center is the American spelling of the British 'centre', not the British form of color.\nB: Correct: the slides list the British/American pair Colour - Color among spelling variants.\nC: Defense is the American spelling of the British 'defence'.\nD: Humor is the American spelling of the British 'humour'.","source":"final SPELLING IN ENGLISH SLIDES-1.pptx | SLIDE 24","difficulty":"Hard"},{"id":"her-v1-111","module":"v1","type":"mcq","q":"Which of the following is NOT listed as a cause of misspelling?","options":["Mispronunciation","Homophones","Reading too many books","Typing errors"],"answer":"Reading too many books","solution":"A: Mispronunciation is explicitly listed as a cause.\nB: Homophones are listed as a cause of misspelling.\nC: Correct: the listed causes are mispronunciation, homophones, typing errors, different versions and lack of knowledge of correct spellings.\nD: Typing errors are listed as a cause.","source":"final SPELLING IN ENGLISH SLIDES-1.pptx | SLIDE 20","difficulty":"Devil Mode"},{"id":"her-v1-112","module":"v1","type":"mcq","q":"Punctuation marks are described as ______.","options":["alphabetical symbols used to show emphasis","another name for capitalisation","only the full stop and comma","non-alphabetical symbols used in writing for clarity and comprehension"],"answer":"non-alphabetical symbols used in writing for clarity and comprehension","solution":"A: Punctuation marks are non-alphabetical.\nB: Capitalisation is explicitly said not to be part of punctuation.\nC: The slides list many marks including semicolon, colon, dash and quotation marks.\nD: Correct: the slides define punctuation as non-alphabetical symbols used for clarity and comprehension and note capitalisation is not part of it.","source":"final PUNCTUATION IN ENGLISH LECTURE SLIDES.pptx | SLIDE 3","difficulty":"Medium"},{"id":"her-v1-113","module":"v1","type":"mcq","q":"Which end mark should replace the full stop in 'Did you feed your dog this morning.'?","options":["A question mark","A comma","An exclamation point","A colon"],"answer":"A question mark","solution":"A: Correct: this is a literal past question from the slides whose correct option is D: the end mark should be a question mark.\nB: A comma would not close a direct question; this is option A and is wrong.\nC: That is option B and is wrong for a direct question.\nD: That is option C and is wrong here.","source":"final PUNCTUATION IN ENGLISH LECTURE SLIDES.pptx | SLIDE 11","difficulty":"Hard"},{"id":"her-v1-114","module":"v1","type":"mcq","q":"Which sentence has the correct end punctuation?","options":["Where did you find that cute puppy.","What a great big grin he has on his face!","Roll over, you good girl?","Why can't we keep her."],"answer":"What a great big grin he has on his face!","solution":"A: This is a direct question and should end with a question mark.\nB: Correct: this is a literal past question whose correct option is B; an exclamatory sentence takes an exclamation mark.\nC: This is a command and should end with a full stop or exclamation mark.\nD: This is a direct question and should end with a question mark.","source":"final PUNCTUATION IN ENGLISH LECTURE SLIDES.pptx | SLIDE 13","difficulty":"Medium"},{"id":"her-v1-115","module":"v1","type":"mcq","q":"A colon is described as a mark of ______.","options":["a sudden break in thought","a stronger break than a full stop","expectation or addition, signalling the reader to watch for what is coming","a mark of omission only"],"answer":"expectation or addition, signalling the reader to watch for what is coming","solution":"A: That is the function of a dash.\nB: The semicolon is stronger than a comma, roughly equal to a period.\nC: Correct: the slides state the colon's primary function is to signal the reader to watch for what is coming.\nD: Ellipsis marks omission, not the colon.","source":"final PUNCTUATION IN ENGLISH LECTURE SLIDES.pptx | SLIDE 26","difficulty":"Hard"},{"id":"her-v1-116","module":"v1","type":"mcq","q":"A semicolon is used ______.","options":["to introduce a list after a full sentence","to end a sentence","after a salutation in a business letter","to separate independent clauses not joined by a simple conjunction"],"answer":"to separate independent clauses not joined by a simple conjunction","solution":"A: That is a use of the colon.\nB: A full stop ends a sentence; a semicolon links equal clauses.\nC: A colon, not a semicolon, follows a business salutation.\nD: Correct: the slides list this as the first use of the semicolon and note it is a mark of coordination between elements of equal rank.","source":"final PUNCTUATION IN ENGLISH LECTURE SLIDES.pptx | SLIDE 28","difficulty":"Devil Mode"},{"id":"her-v1-117","module":"v1","type":"mcq","q":"Which mark is used to divide a word at the end of a line or to join compound words?","options":["Hyphen","Dash","Semicolon","Apostrophe"],"answer":"Hyphen","solution":"A: Correct: the slides state the hyphen divides words at line ends and joins parts of compound words such as sister-in-law.\nB: The dash indicates a sudden break or shift in thought.\nC: The semicolon separates independent clauses.\nD: The apostrophe marks contractions and possession.","source":"final PUNCTUATION IN ENGLISH LECTURE SLIDES.pptx | SLIDE 32","difficulty":"Medium"},{"id":"her-v1-118","module":"v1","type":"mcq","q":"A dictionary is essential in a summary or comprehension task mainly because it gives ______.","options":["only the spelling of words","meanings, pronunciation, grammatical forms and usage of words","only the history of the language","the answers to comprehension questions"],"answer":"meanings, pronunciation, grammatical forms and usage of words","solution":"A: A dictionary provides far more than spelling.\nB: Correct: the paragraph slides' rearranged passage states a college dictionary should provide pronunciation, meaning, grammatical patterns and usage.\nC: That is not the main use described.\nD: A dictionary aids vocabulary but does not supply passage-specific answers.","source":"finalPARAGRAPH LECTURE SLIDES (1).pptx | SLIDE 13","difficulty":"Hard"},{"id":"her-v1-119","module":"v1","type":"fill","q":"For the arithmetic sequence 4, 7, 10, 13, 16, 19, 22, ..., what is the common difference?","answer":"3","solution":"The common difference d = a2 - a1 = 7 - 4 = 3 (slide 13).","source":"Series and squence.pdf | SLIDE 13","difficulty":"Medium"},{"id":"her-v1-120","module":"v1","type":"fill","q":"For the arithmetic sequence 4, 7, 10, ..., what is the 21st term?","answer":"64","solution":"The nth term is 3n + 1, so a21 = 3(21) + 1 = 64 (slide 15).","source":"Series and squence.pdf | SLIDE 15","difficulty":"Hard"},{"id":"her-v1-121","module":"v1","type":"fill","q":"The sum of the series 1 + 8 + 15 + ... is 396. How many terms does the series contain?","answer":"11","solution":"Solving n(7n - 5)/2 = 396 gives 7n^2 - 5n - 792 = 0 = (7n + 72)(n - 11), so n = 11 since the negative root is not an integer in Z+ (slide 22).","source":"Series and squence.pdf | SLIDE 22","difficulty":"Devil Mode"},{"id":"her-v1-122","module":"v1","type":"fill","q":"The 6th term of an AP is -5 and the 10th term is -21. Find the sum of the first 30 terms.","answer":"-1290","solution":"Solving a + 5d = -5 and a + 9d = -21 gives d = -4 and a = 15; S30 = 30/2 (30 + 29(-4)) = -1290 (slide 24).","source":"Series and squence.pdf | SLIDE 24","difficulty":"Medium"},{"id":"her-v1-123","module":"v1","type":"fill","q":"For the geometric sequence 1, 4, 16, 64, 256, 1024, ..., what is the 9th term?","answer":"65536","solution":"The common ratio r = 4 and T9 = 1 x 4^8 = 65536 (slide 26).","source":"Series and squence.pdf | SLIDE 26","difficulty":"Hard"},{"id":"her-v1-124","module":"v1","type":"fill","q":"If the 5th term of a GP is 162 and the 8th term is 4374, find the common ratio.","answer":"3","solution":"Dividing ar^7 by ar^4 gives r^3 = 4374/162 = 27, so r = 3 (slide 28).","source":"Series and squence.pdf | SLIDE 28","difficulty":"Medium"},{"id":"her-v1-125","module":"v1","type":"fill","q":"If the 5th term of a GP is 162 and the 8th term is 4374, find the first term a.","answer":"2","solution":"With r = 3, ar^4 = 162 gives a = 162/81 = 2 (slide 29).","source":"Series and squence.pdf | SLIDE 29","difficulty":"Hard"},{"id":"her-v1-126","module":"v1","type":"fill","q":"Evaluate the sigma notation sum from i = 3 to 6 of (i^2 + 1).","answer":"90","solution":"The sum is (9+1) + (16+1) + (25+1) + (36+1) = 10 + 17 + 26 + 37 = 90 (slide 9).","source":"Series and squence.pdf | SLIDE 9","difficulty":"Devil Mode"},{"id":"her-v1-127","module":"v1","type":"fill","q":"A plant is 3 inches tall and grows 2 inches every month. How tall will it be after 6 months?","answer":"15","solution":"This is arithmetic: height = 3 + 6(2) = 15 inches (slide 30).","source":"Series and squence.pdf | SLIDE 30","difficulty":"Medium"},{"id":"her-v1-128","module":"v1","type":"fill","q":"A rabbit population follows 2, 4, 8, 16, ... . How many rabbits will there be in the 8th generation?","answer":"256","solution":"This is geometric with a = 2 and r = 2, so T8 = 2 x 2^7 = 256 (slide 33).","source":"Series and squence.pdf | SLIDE 33","difficulty":"Hard"},{"id":"her-v1-129","module":"v1","type":"mcq","q":"A sequence in which terms are formed by adding or subtracting a constant is called ______.","options":["geometric","harmonic","arithmetic","sigma"],"answer":"arithmetic","solution":"A: Geometric sequences use multiplication/division and a common ratio.\nB: Harmonic sequences are not discussed as a type in the slides.\nC: Correct: the slides state arithmetic sequences are solved with addition/subtraction and have a common difference.\nD: Sigma notation represents a series sum, not a sequence type.","source":"Series and squence.pdf | SLIDE 10","difficulty":"Medium"},{"id":"her-v1-130","module":"v1","type":"mcq","q":"A series is formed by ______.","options":["multiplying the terms of a sequence","subtracting consecutive terms","arranging numbers in a particular order","adding the terms of a sequence"],"answer":"adding the terms of a sequence","solution":"A: Multiplication does not define a series.\nB: Subtracting gives differences, not a series.\nC: That defines a sequence, not a series.\nD: Correct: the slides define a series as the sum of sequence terms, e.g. 1 + 2 + 3 + ... + 10.","source":"Series and squence.pdf | SLIDE 4","difficulty":"Hard"},{"id":"her-v1-131","module":"v1","type":"mcq","q":"Simplify: square root of 28 + square root of 63 - square root of 112.","options":["square root of 7","5 times the square root of 7","square root of 21","Zero, since the three terms cancel"],"answer":"square root of 7","solution":"A: Correct: sqrt28 + sqrt63 - sqrt112 = 2sqrt7 + 3sqrt7 - 4sqrt7 = sqrt7 (slide 11).\nB: This would ignore the subtraction of 4sqrt7.\nC: The radicands are not combined into 21 in this simplification.\nD: The three terms do not cancel: 2sqrt7 + 3sqrt7 - 4sqrt7 = sqrt7.","source":"Surds.pdf | SLIDE 11","difficulty":"Devil Mode"},{"id":"her-v1-132","module":"v1","type":"mcq","q":"Simplify: 3 times square root of 507 + 7 times square root of 147 - 2 times square root of 27 - 6 times square root of 192.","options":["44 times the square root of 3","34 times the square root of 3","28 times the square root of 3","34 times the square root of 7"],"answer":"34 times the square root of 3","solution":"A: This ignores the subtraction of 48sqrt3.\nB: Correct: the worked example reduces to 39sqrt3 + 49sqrt3 - 6sqrt3 - 48sqrt3 = 34sqrt3 (slide 13).\nC: This is not the result of the worked simplification.\nD: The common factor is sqrt3, not sqrt7.","source":"Surds.pdf | SLIDE 13","difficulty":"Medium"},{"id":"her-v1-133","module":"v1","type":"mcq","q":"Which statement about surds is TRUE?","options":["All surds are rational numbers","The square root of a perfect square such as 4 is a surd","Their square roots give non-terminating decimals and they cannot be written down exactly","Pi is not a surd"],"answer":"Their square roots give non-terminating decimals and they cannot be written down exactly","solution":"A: Surds are irrational numbers.\nB: sqrt4 = 2 is terminating and rational, so it is not a surd.\nC: Correct: the slides define surds as numbers whose square roots give non-terminating decimals and whose values cannot be written down exactly.\nD: The slides give pi as an example of a surd.","source":"Surds.pdf | SLIDE 2","difficulty":"Hard"},{"id":"her-v1-134","module":"v1","type":"mcq","q":"The multiplication property of surds states that square root of x times square root of y equals ______.","options":["square root of x plus square root of y","x times y","square root of x over square root of y","square root of xy"],"answer":"square root of xy","solution":"A: That is the addition form, not multiplication.\nB: The product of roots is the root of the product, not xy.\nC: That is the division property.\nD: Correct: the slides state sqrt(x) x sqrt(y) = sqrt(xy) and give sqrt3 x sqrt7 = sqrt21.","source":"Surds.pdf | SLIDE 5","difficulty":"Medium"},{"id":"her-v1-135","module":"v1","type":"mcq","q":"Rationalising 1 over square root of 13 gives ______.","options":["square root of 13 over 13","13 over square root of 13","square root of 13 over 1","1 over 13"],"answer":"square root of 13 over 13","solution":"A: Correct: the slides show multiplying by sqrt13/sqrt13 gives sqrt13/13 (slide 24).\nB: That is the reciprocal form, not rationalised.\nC: The denominator must become a whole number, 13.\nD: The numerator must retain the surd.","source":"Surds.pdf | SLIDE 24","difficulty":"Hard"},{"id":"her-v1-136","module":"v1","type":"mcq","q":"Rationalising 1 over (1 + square root of 2) gives ______.","options":["1 minus square root of 2","square root of 2 minus 1","1 over (1 - square root of 2)","square root of 2 plus 1"],"answer":"square root of 2 minus 1","solution":"A: The result is the negative of this expression.\nB: Correct: the worked example multiplies by (1 - sqrt2)/(1 - sqrt2) and obtains sqrt2 - 1 (slide 27).\nC: That is an intermediate step, not the final rationalised form.\nD: The sign is wrong.","source":"Surds.pdf | SLIDE 27","difficulty":"Devil Mode"},{"id":"her-v1-137","module":"v1","type":"mcq","q":"A logarithm is another name for a ______.","options":["root","coefficient","power or index","fraction"],"answer":"power or index","solution":"A: A root is the inverse of a power, not a logarithm.\nB: A coefficient multiplies a variable, not a logarithm.\nC: Correct: the logarithms lecture defines a logarithm as another name for a power or index.\nD: A logarithm is not defined as a fraction.","source":"LOGARITHMS.pptx | SLIDE 2","difficulty":"Medium"},{"id":"her-v1-138","module":"v1","type":"mcq","q":"When the base of a logarithm is not written, the base is understood to be ______.","options":["e","2","1","10"],"answer":"10","solution":"A: Base e is used for natural logarithms, which are written as ln.\nB: Base 2 must be written explicitly as log base 2.\nC: A logarithm cannot have base 1.\nD: Correct: the slides state that when no base is written, the base is 10.","source":"LOGARITHMS.pptx | SLIDE 2","difficulty":"Hard"},{"id":"her-v1-139","module":"v1","type":"mcq","q":"The logarithm of a negative number ______.","options":["does not exist","is always negative","equals zero","is the same as the log of its positive value"],"answer":"does not exist","solution":"A: Correct: the slides state the logarithm of a negative number does not exist.\nB: The slides say it does not exist, not that it is negative.\nC: log(1) = 0, not log of a negative number.\nD: That is not valid for real logarithms.","source":"LOGARITHMS.pptx | SLIDE 2","difficulty":"Medium"},{"id":"her-v1-140","module":"v1","type":"mcq","q":"The Aufbau principle states that ______.","options":["no two electrons can have the same spin","each electron occupies the lowest energy orbital first","electrons fill degenerate orbitals singly first","each orbital holds at most two electrons"],"answer":"each electron occupies the lowest energy orbital first","solution":"A: That is related to the Pauli exclusion principle.\nB: Correct: the atomic structure slides state each electron occupies the lowest energy orbital.\nC: That is Hund's rule.\nD: That is the Pauli exclusion principle.","source":"ATOMIC STRUCTURE_curr.pptx | SLIDE 4","difficulty":"Hard"},{"id":"her-v1-141","module":"v1","type":"mcq","q":"The Pauli exclusion principle states that a maximum of two electrons may occupy one orbital only if they ______.","options":["have the same spin","occupy different energy levels","have opposite spins","are both in the 2p sub-orbital"],"answer":"have opposite spins","solution":"A: Same-spin electrons cannot share an orbital under Pauli's principle.\nB: They occupy the same orbital, which is the same energy level.\nC: Correct: the slides state a maximum of two electrons may occupy a single orbital, but only with opposite spins.\nD: The principle is about spin, not the specific sub-orbital.","source":"ATOMIC STRUCTURE_curr.pptx | SLIDE 5","difficulty":"Devil Mode"},{"id":"her-v1-142","module":"v1","type":"mcq","q":"Hund's rule requires that ______.","options":["electrons pair up before occupying empty orbitals","only one electron can occupy a principal energy level","all electrons must spin down","single electrons with the same spin occupy each degenerate orbital before pairing"],"answer":"single electrons with the same spin occupy each degenerate orbital before pairing","solution":"A: That is the opposite of Hund's rule.\nB: Multiple electrons occupy each level.\nC: Spins alternate up and down.\nD: Correct: the slides state single electrons with the same spin must occupy each degenerate orbital before opposite-spin electrons pair.","source":"ATOMIC STRUCTURE_curr.pptx | SLIDE 6","difficulty":"Medium"},{"id":"her-v1-143","module":"v1","type":"mcq","q":"Chromium's configuration is written 4s1 3d5 rather than 4s2 3d4 because ______.","options":["a half-filled d sub-orbital is more stable","4s2 3d4 has too many electrons","the 4s orbital is always full","d orbitals cannot hold five electrons"],"answer":"a half-filled d sub-orbital is more stable","solution":"A: Correct: the slides state d4 and d9 endings are relatively unstable and promotion from s to d stabilises the atom.\nB: Both configurations have the same electron count.\nC: Chromium is the exception where 4s has one electron.\nD: A d sub-level can hold up to ten electrons.","source":"ATOMIC STRUCTURE_curr.pptx | SLIDE 8","difficulty":"Hard"},{"id":"her-v1-144","module":"v1","type":"mcq","q":"Mendeleev arranged the periodic table by ______.","options":["atomic number","atomic mass","electronegativity","number of neutrons"],"answer":"atomic mass","solution":"A: Atomic number ordering was introduced by Moseley.\nB: Correct: the slides state Mendeleev arranged his periodic table by atomic mass and could predict properties of unknown elements.\nC: Electronegativity is a property, not Mendeleev's arranging principle.\nD: Neutrons were unknown in Mendeleev's time and not used for arrangement.","source":"ATOMIC STRUCTURE_curr.pptx | SLIDE 10","difficulty":"Medium"},{"id":"her-v1-145","module":"v1","type":"mcq","q":"Moseley discovered that the periodic nature of elements is associated with ______.","options":["atomic mass","electron affinity only","atomic number, not atomic mass","the number of isotopes"],"answer":"atomic number, not atomic mass","solution":"A: That was Mendeleev's arrangement.\nB: Electron affinity is not the basis of periodicity described.\nC: Correct: the slides state Moseley associated periodicity with atomic number rather than atomic mass.\nD: Isotope count does not determine periodicity.","source":"ATOMIC STRUCTURE_curr.pptx | SLIDE 11","difficulty":"Hard"},{"id":"her-v1-146","module":"v1","type":"mcq","q":"How many columns (groups) are there on the periodic table?","options":["7","8","16","18"],"answer":"18","solution":"A: 7 is the number of periods (rows).\nB: 8 is the traditional number of main groups, not the total columns.\nC: The slides specify 18 columns.\nD: Correct: the slides state there are 18 columns (groups) and 7 rows (periods).","source":"ATOMIC STRUCTURE_curr.pptx | SLIDE 12","difficulty":"Devil Mode"},{"id":"her-v1-147","module":"v1","type":"mcq","q":"Group 17 elements, the halogens, have how many valence electrons?","options":["7","8","6","1"],"answer":"7","solution":"A: Correct: the slides state halogens have 7 valence electrons, a charge of -1, and are the most reactive nonmetals.\nB: 8 valence electrons characterise the noble gases.\nC: 6 valence electrons characterise the oxygen family (group 16).\nD: 1 valence electron characterises the alkali metals.","source":"ATOMIC STRUCTURE_curr.pptx | SLIDE 21","difficulty":"Medium"},{"id":"her-v1-148","module":"v1","type":"mcq","q":"An ionic bond is formed by ______.","options":["the sharing of electron pairs between atoms","the transfer of electrons between a metal and a nonmetal with very different electronegativities","the attraction between metal atoms and delocalised electrons","the overlap of two p orbitals only"],"answer":"the transfer of electrons between a metal and a nonmetal with very different electronegativities","solution":"A: Sharing electrons defines a covalent bond.\nB: Correct: the slides define ionic bonding as electron transfer producing charged ions between atoms of very different electronegativity.\nC: That describes metallic bonding.\nD: Orbital overlap forms covalent sigma or pi bonds.","source":"ATOMIC STRUCTURE_curr.pptx | SLIDE 25","difficulty":"Hard"},{"id":"her-v1-149","module":"v1","type":"mcq","q":"Lattice energy increases with ______.","options":["decreasing charge and increasing ion size","increasing ion size alone","increasing ionic charge and decreasing ion size","the colour of the ionic compound"],"answer":"increasing ionic charge and decreasing ion size","solution":"A: Both changes would lower lattice energy.\nB: Larger ions decrease lattice energy.\nC: Correct: the slides state lattice energy increases with charge on the ions and with decreasing ion size.\nD: Colour is unrelated to lattice energy.","source":"ATOMIC STRUCTURE_curr.pptx | SLIDE 34","difficulty":"Medium"},{"id":"her-v1-150","module":"v1","type":"mcq","q":"Water is a polar molecule because ______.","options":["hydrogen is more electronegative than oxygen","the molecule has no bond dipole","oxygen and hydrogen have equal electronegativity","oxygen is more electronegative than hydrogen and pulls electrons closer to itself"],"answer":"oxygen is more electronegative than hydrogen and pulls electrons closer to itself","solution":"A: The opposite is true; oxygen attracts electrons more strongly.\nB: Water has bond dipoles due to unequal sharing.\nC: Equal electronegativity would give a nonpolar bond.\nD: Correct: the slides state oxygen's greater electronegativity gives water a polar character with delta-negative oxygen and delta-positive hydrogens.","source":"ATOMIC STRUCTURE_curr.pptx | SLIDE 43","difficulty":"Hard"},{"id":"her-v1-151","module":"v1","type":"mcq","q":"Which type of hybridisation gives methane its tetrahedral shape with bond angles of 109.5 degrees?","options":["sp3","sp2","sp","d2sp3"],"answer":"sp3","solution":"A: Correct: the slides state sp3 hybrid orbitals around carbon give a tetrahedral shape with 109.5 degree angles.\nB: sp2 gives trigonal planar geometry with 120 degree angles.\nC: sp gives linear geometry with 180 degree angles.\nD: d2sp3 gives octahedral geometry, not methane's tetrahedral shape.","source":"ATOMIC STRUCTURE_curr.pptx | SLIDE 66","difficulty":"Devil Mode"},{"id":"her-v1-152","module":"v1","type":"mcq","q":"In alkenes, the carbon-carbon double bond consists of ______.","options":["two sigma bonds","one sigma bond and one pi bond","two pi bonds","one sigma and two pi bonds"],"answer":"one sigma bond and one pi bond","solution":"A: Only one sigma bond forms between two atoms.\nB: Correct: the slides state the double bond arises from one sigma bond and one weaker pi bond from sideways overlap of unhybridised p orbitals.\nC: Two pi bonds make a triple bond, not a double bond.\nD: That describes a triple bond.","source":"ATOMIC STRUCTURE_curr.pptx | SLIDE 74","difficulty":"Medium"},{"id":"her-v1-153","module":"v1","type":"mcq","q":"Benzene is described as conjugated because ______.","options":["it contains only sigma bonds","it has alternating single and double bonds that never delocalise","its unhybridized 2p orbitals combine into delocalised pi molecular orbitals above and below the plane","it has no ring structure"],"answer":"its unhybridized 2p orbitals combine into delocalised pi molecular orbitals above and below the plane","solution":"A: Benzene has delocalised pi orbitals, not only sigma bonds.\nB: The electrons are delocalised, which is the basis of conjugation.\nC: Correct: the slides state benzene's unhybridised 2p orbitals combine to form delocalised pi molecular orbitals above and below the ring plane.\nD: Benzene is a six-membered ring.","source":"ATOMIC STRUCTURE_curr.pptx | SLIDE 76","difficulty":"Hard"},{"id":"her-v1-154","module":"v1","type":"mcq","q":"Pharmacognosy is derived from the Greek words 'pharmakon' and 'gignosco', meaning ______.","options":["poison and treatment","plant and science","drug and preparation","remedy and knowledge"],"answer":"remedy and knowledge","solution":"A: Pharmakon means remedy and gignosco means knowledge, not poison and treatment.\nB: The Greek roots are remedy and knowledge, not plant and science.\nC: The literal roots given are remedy and knowledge.\nD: Correct: the slides state pharmacognosy derives from pharmakon (remedy) and gignosco (knowledge).","source":"General Introduction to Pharmacognosy.pdf | SLIDE 23","difficulty":"Medium"},{"id":"her-v1-155","module":"v1","type":"mcq","q":"Pharmacognosy is defined as the science of ______.","options":["nature-derived pharmaceuticals and poisons","synthetic drug design only","the study of human anatomy","purely the cultivation of ornamental plants"],"answer":"nature-derived pharmaceuticals and poisons","solution":"A: Correct: the slides define pharmacognosy as the science of nature-derived pharmaceuticals and poisons, covering crude herbs, extracts, pure compounds and health foods.\nB: Synthetic drug design is outside the natural-source focus of pharmacognosy.\nC: Anatomy is a different discipline.\nD: Horticulture is only one contributing discipline.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 23","difficulty":"Hard"},{"id":"her-v1-156","module":"v1","type":"mcq","q":"The term 'materia medica' refers to ______.","options":["a list of medicinal plants in one herbarium","the body of collected knowledge about the therapeutic properties of substances used for healing","the official Ghanaian drug registration form","a type of crude plant drug that is unorganized"],"answer":"the body of collected knowledge about the therapeutic properties of substances used for healing","solution":"A: Materia medica is broader than one herbarium's collection.\nB: Correct: the slides define materia medica as a Latin term for collected knowledge about therapeutic properties of healing substances.\nC: That is a regulatory document, not materia medica.\nD: Materia medica is a body of knowledge, not a drug category.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 4","difficulty":"Devil Mode"},{"id":"her-v1-157","module":"v1","type":"mcq","q":"Pedanius Dioscorides is considered the 'Father of Pharmacognosy' mainly because he ______.","options":["coined the word pharmacognosy","wrote the Ebers Papyrus","described over 600 medicinal plants in his work","founded the first pharmacopoeia"],"answer":"described over 600 medicinal plants in his work","solution":"A: The term derives from Greek roots; Dioscorides did not coin it.\nB: The Ebers Papyrus is an Egyptian document, not Dioscorides' work.\nC: Correct: the slides state Dioscorides is considered Father of Pharmacognosy and described over 600 medicinal plants.\nD: The first pharmacopoeias appeared much later, in city states.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 9","difficulty":"Medium"},{"id":"her-v1-158","module":"v1","type":"mcq","q":"The Ebers Papyrus dates from about ______.","options":["3000 BC","650 BC","1618 AD","1500 BC"],"answer":"1500 BC","solution":"A: The slides date the Ebers Papyrus to about 1500 BC.\nB: 650 BC is the date of Ashurbanipal's cuneiform tablets from Nineveh.\nC: 1618 is the date of the Pharmacopoeia Londiniensis.\nD: Correct: the pharmacognosy slides state the Ebers Papyrus originated around 1500 BC and is an important medical handbook.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 7","difficulty":"Hard"},{"id":"her-v1-159","module":"v1","type":"mcq","q":"Information on medicinal plants was documented before printing by all of the following means EXCEPT ______.","options":["printed journals","oral transmission (folklore)","writing on baked clay tablets","parchments and manuscript herbals"],"answer":"printed journals","solution":"A: Correct: the slides list oral transmission, papyrus, baked clay tablets, parchments and manuscript herbals, all prior to printing.\nB: Oral folklore is listed as a documentation method.\nC: Cuneiform clay tablets from Nineveh are listed.\nD: These are listed as pre-printing documentation media.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 6","difficulty":"Medium"},{"id":"her-v1-160","module":"v1","type":"mcq","q":"The first pharmacopoeias were issued by ______.","options":["national governments only","Autonomous city authorities with legally binding standards","universities","professional herbalist guilds"],"answer":"Autonomous city authorities with legally binding standards","solution":"A: The first were city-level, e.g. Florence, Nuremberg and London.\nB: Correct: the slides state the first pharmacopoeias were issued by autonomous cities as legally binding documents.\nC: Universities were not the issuers of the first pharmacopoeias described.\nD: Guilds such as the Apothecaries were separate from pharmacopoeia issuance.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 17","difficulty":"Hard"},{"id":"her-v1-161","module":"v1","type":"mcq","q":"Which is the correct match of an early pharmacopoeia and its city?","options":["Pharmacopoeia Londiniensis - Nuremberg, 1546","Ricettario Florentino - London, 1618","Ricettario Florentino - Florence, Italy (1498)","Pharmacopoeia of Nuremberg - Florence, 1498"],"answer":"Ricettario Florentino - Florence, Italy (1498)","solution":"A: Londiniensis refers to London, not Nuremberg.\nB: Ricettario Florentino is the Florence pharmacopoeia of 1498.\nC: Correct: the slides list Ricettario Florentino (Florence, 1498), the Pharmacopoeia of Nuremberg (1546) and Pharmacopoeia Londiniensis (1618).\nD: The Nuremberg pharmacopoeia dates from 1546.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 17","difficulty":"Devil Mode"},{"id":"her-v1-162","module":"v1","type":"mcq","q":"The Worshipful Society of Apothecaries was founded in London in which year?","options":["1498","1673","1618","1617"],"answer":"1617","solution":"A: 1498 is the date of the Ricettario Florentino.\nB: 1673 is when the Chelsea Physic Garden was formed.\nC: 1618 is the date of the Pharmacopoeia Londiniensis.\nD: Correct: the slides state the Society was founded in 1617 and formed the Chelsea Physic Garden in 1673.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 18","difficulty":"Medium"},{"id":"her-v1-163","module":"v1","type":"mcq","q":"Morphine was first identified as an alkaloid from opium poppy by ______.","options":["F. W. Serturner in 1804","Pelletier and Caventou","Johannes Buchner","Claude Bernard"],"answer":"F. W. Serturner in 1804","solution":"A: Correct: the slides state morphine was first identified by F. W. Serturner of Germany in 1804 and chemically characterised in 1817.\nB: They isolated quinine from cinchona bark.\nC: Buchner first isolated salicin from willow bark.\nD: Bernard studied curare, not morphine.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 22","difficulty":"Hard"},{"id":"her-v1-164","module":"v1","type":"mcq","q":"Aspirin (acetylsalicylic acid) was developed from which natural product?","options":["Quinine from cinchona bark","Salicin from willow bark","Morphine from opium poppy","D-tubocurarine from curare"],"answer":"Salicin from willow bark","solution":"A: Quinine is an antimalarial, not the precursor of aspirin.\nB: Correct: the slides state salicin from willow bark was derivatised to salicylic acid in 1838 and to acetylsalicylic acid (aspirin) by Bayer in 1899.\nC: Morphine is an analgesic alkaloid, not the aspirin precursor.\nD: D-tubocurarine is a muscle relaxant alkaloid.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 22","difficulty":"Medium"},{"id":"her-v1-165","module":"v1","type":"mcq","q":"Claude Bernard's studies on curare led to the isolation of which alkaloid?","options":["Morphine","Quinine","D-tubocurarine","Salicin"],"answer":"D-tubocurarine","solution":"A: Morphine came from opium poppy, not curare.\nB: Quinine came from cinchona bark.\nC: Correct: the slides state the active ingredient of curare was isolated as the alkaloid D-tubocurarine, a bisbenzylisoquinoline.\nD: Salicin came from willow bark.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 21","difficulty":"Hard"},{"id":"her-v1-166","module":"v1","type":"mcq","q":"Quinine was first isolated from cinchona bark by ______.","options":["Serturner","Buchner","Li Shi Zhen","Pelletier and Caventou"],"answer":"Pelletier and Caventou","solution":"A: Serturner isolated morphine.\nB: Buchner isolated salicin.\nC: Li Shi Zhen compiled the Pen T'sao Kan Mu.\nD: Correct: the slides credit Pierre Joseph Pelletier and Joseph Bienaime Caventou with first isolating quinine.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 22","difficulty":"Devil Mode"},{"id":"her-v1-167","module":"v1","type":"mcq","q":"Li Shi Zhen's Pen T'sao Kan Mu, completed in 1578, listed how many drugs?","options":["1892","365","600","1734"],"answer":"1892","solution":"A: Correct: the slides state the book lists 1892 drugs, 376 described for the first time, with 1160 drawings and over 11,000 prescriptions.\nB: 365 is the number of drugs in Shen Nung's earlier Pen Tsao.\nC: 600 is the number of medicinal plants described by Dioscorides.\nD: 1734 is the number of formulations in the Indonesian manuscript Serat kawruh bab jampi-jampi.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 11","difficulty":"Medium"},{"id":"her-v1-168","module":"v1","type":"mcq","q":"Ayurveda means ______.","options":["herbal healing","knowledge of life","way of the earth","balance of humours"],"answer":"knowledge of life","solution":"A: The literal roots are life and knowledge, not herbal healing.\nB: Correct: the slides state 'ayur' means life and 'veda' means knowledge.\nC: The roots given are ayur (life) and veda (knowledge).\nD: Humoral balance belongs toUnani/Greco-Arabic medicine.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 12","difficulty":"Hard"},{"id":"her-v1-169","module":"v1","type":"mcq","q":"Jamu is the traditional medicine of ______.","options":["Japan","China","Indonesia","India"],"answer":"Indonesia","solution":"A: Japan's traditional medicine is Kampo.\nB: China's traditional system is TCM.\nC: Correct: the slides describe Jamu as Indonesian traditional medicine originating in the palaces of Surakarta and Yogyakarta.\nD: India's traditional system is Ayurveda.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 14","difficulty":"Medium"},{"id":"her-v1-170","module":"v1","type":"mcq","q":"Kampo, the traditional medicine of Japan, was heavily influenced by ______.","options":["Ayurveda, the Indian system","Unani, the Islamic medical system","Jamu, the Indonesian system","Traditional Chinese Medicine"],"answer":"Traditional Chinese Medicine","solution":"A: Ayurveda is Indian, not the main influence on Kampo described.\nB: Unani is the Islamic/Greco-Arabic system.\nC: Jamu is Indonesian and is not cited as the main influence on Kampo.\nD: Correct: the slides state Kampo had a lot of influence from TCM and Japan's 701 medical system was an exact copy of the T'ang dynasty system.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 16","difficulty":"Hard"},{"id":"her-v1-171","module":"v1","type":"mcq","q":"Vegetable drugs can be organized for study under all of the following headings EXCEPT ______.","options":["alphabetical, taxonomic, morphological, pharmacological and geological","Alphabetical","Taxonomic","Chemical or biogenetic"],"answer":"alphabetical, taxonomic, morphological, pharmacological and geological","solution":"A: Correct: the slides list alphabetical, taxonomic, morphological, pharmacological/therapeutic and chemical/biogenetic; 'geological' is not among them.\nB: Alphabetical arrangement is listed and used for dictionaries and pharmacopoeias.\nC: Taxonomic arrangement uses botanical classification.\nD: Chemical/biogenetic classification is the fifth listed heading.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 30","difficulty":"Devil Mode"},{"id":"her-v1-172","module":"v1","type":"mcq","q":"Which arrangement of vegetable drugs gives no indication of interrelationships between drugs but is suitable for quick reference?","options":["Taxonomic","Alphabetical","Pharmacological","Chemical"],"answer":"Alphabetical","solution":"A: Taxonomic arrangement gives precise ordered relationships without ambiguity.\nB: Correct: the slides state alphabetical arrangement is suitable for quick reference but gives no indication of interrelationships.\nC: Pharmacological grouping relates drugs by action or therapeutic use.\nD: Chemical grouping relates drugs by constituents or biosynthetic pathways.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 31","difficulty":"Medium"},{"id":"her-v1-173","module":"v1","type":"mcq","q":"Organized drugs are ______.","options":["plant exudates such as gums and resins","prepared by extraction and containing no cellular tissue","direct parts of plants consisting of cellular tissues","only animal-derived products"],"answer":"direct parts of plants consisting of cellular tissues","solution":"A: Gums and resins are unorganized drugs prepared by physical processes.\nB: That describes unorganized drugs.\nC: Correct: the slides define organized drugs as direct plant parts made of cellular tissues, e.g. leaves, barks, roots.\nD: Organized drugs are plant parts, not exclusively animal products.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 34","difficulty":"Hard"},{"id":"her-v1-174","module":"v1","type":"mcq","q":"Which of the following is an unorganized drug?","options":["Leaves","Barks","Roots","Gums and resins"],"answer":"Gums and resins","solution":"A: Leaves are organized drugs (direct plant parts).\nB: Barks are organized drugs.\nC: Roots are organized drugs.\nD: Correct: the slides list dried latices, extracts, gums, resins, oils, fats and waxes as unorganized drugs.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 33","difficulty":"Medium"},{"id":"her-v1-175","module":"v1","type":"mcq","q":"The Pharmacognostical Scheme includes all of the following headings EXCEPT ______.","options":["market price and patent status","Biological source","Microscopical characters","Adulterants"],"answer":"market price and patent status","solution":"A: Correct: the scheme lists biological source, geographical source, cultivation, morphology, microscopy, constituents, uses, substituents, adulterants and chemical tests.\nB: Biological source is the first heading in the scheme.\nC: Microscopical characters are listed in the scheme.\nD: Adulterants are listed in the scheme.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 37","difficulty":"Hard"},{"id":"her-v1-176","module":"v1","type":"mcq","q":"A study of crude drugs from plants, animals and mineral sources and their constituents best describes ______.","options":["pharmacology","pharmacognosy","pharmaceutics","taxonomy"],"answer":"pharmacognosy","solution":"A: Pharmacology studies drug effects on the body, not crude drugs from natural sources.\nB: Correct: the slides state pharmacognosy may be defined as the study of crude drugs obtained from plants, animals and minerals and their constituents.\nC: Pharmaceutics is formulation and manufacture of medicines.\nD: Taxonomy is the description, naming and classification of organisms.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 24","difficulty":"Devil Mode"},{"id":"her-v1-177","module":"v1","type":"mcq","q":"A complete understanding of medicinal plants requires all of the following disciplines EXCEPT ______.","options":["Botany","Quality control","astrophysics","Pharmacology"],"answer":"astrophysics","solution":"A: Botany is listed as one of the contributing disciplines.\nB: Quality control is listed as part of the unified whole.\nC: Correct: the slides list commerce, botany, horticulture, chemistry, enzymology, genetics, quality control and pharmacology, not astrophysics.\nD: Pharmacology is listed among the disciplines.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 24","difficulty":"Medium"},{"id":"her-v1-178","module":"v1","type":"mcq","q":"Marine organisms are of interest in pharmacognosy because ______.","options":["they are the only source of crude drugs","they contain no useful compounds","they replace the need for quality control","they have potent pharmacological actions and are being searched for new drugs"],"answer":"they have potent pharmacological actions and are being searched for new drugs","solution":"A: Plants, animals and minerals are also sources.\nB: The slides say the opposite.\nC: Quality control remains essential.\nD: Correct: the slides state marine plants and animals with potent pharmacological actions receive increasing attention in the search for new drugs.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 26","difficulty":"Hard"},{"id":"her-v1-179","module":"v1","type":"mcq","q":"Which crude drug category includes cotton, silk and jute used in surgical dressing?","options":["Supplies used by physicians and surgeons or pharmacists","Volatile oils","Mineral acids only","Animal hormones"],"answer":"Supplies used by physicians and surgeons or pharmacists","solution":"A: Correct: the slides list cotton, silk, jute and nylon in surgical dressing and kaolin/diatomite for filtration among such crude drugs.\nB: Volatile oils are plant exudates used as flavours or vehicles.\nC: Kaolin and diatomite are minerals but the category is broader than mineral acids.\nD: Hormones are animal-derived products, not surgical dressings.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 25","difficulty":"Medium"},{"id":"her-v1-180","module":"v1","type":"mcq","q":"Finite pure chemical entities isolated from plants became the focus of which field?","options":["Ethnobotany","Phytochemistry","Systematics","Pharmacopoeia compilation"],"answer":"Phytochemistry","solution":"A: Ethnobotany studies people-plant relationships, not isolated molecules.\nB: Correct: the slides state that by the early 19th century the pharmaceutical properties of plants were traced to specific molecules, leading to phytochemistry.\nC: Systematics classifies organisms.\nD: Pharmacopoeias are official standards books, not a field of molecular study.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 19","difficulty":"Hard"},{"id":"her-v1-181","module":"v1","type":"mcq","q":"Which animal-derived product is listed among crude drugs in pharmacognosy?","options":["Cinchona bark","Gum acacia","Fish liver oils","Kaolin"],"answer":"Fish liver oils","solution":"A: Cinchona bark is a plant-derived crude drug.\nB: Gum acacia is a plant exudate.\nC: Correct: the slides list whole animals, glandular products, liver extracts, fish liver oils, musk, beeswax, hormones, enzymes and antitoxins.\nD: Kaolin is a mineral, not animal-derived.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 27","difficulty":"Devil Mode"},{"id":"her-v1-182","module":"v1","type":"mcq","q":"Which of the following best states the universal role of plants in medicine according to the concluding remarks?","options":["Plants are used only in African traditional medicine","Plants are being replaced entirely by synthetic drugs","Plants have no role in modern pharmacy","Plants are used in all major systems of medicine regardless of underlying philosophy"],"answer":"Plants are used in all major systems of medicine regardless of underlying philosophy","solution":"A: The slides explicitly say all major systems use plants.\nB: The slides emphasise their continuing universal role.\nC: Pharmacognosy remains relevant to healthcare training.\nD: Correct: the slides conclude that the universal role of plants is exemplified by their use in all major systems of medicine irrespective of philosophical premise.","source":"General Introduction to Pharmacognosy.pdf | SLIDE 38","difficulty":"Medium"},{"id":"her-v1-183","module":"v1","type":"mcq","q":"Information and Communication Technology (ICT) refers to ______.","options":["technologies that provide access to information through telecommunications","only the use of computers in hospitals","the study of computer hardware alone","a type of computer software"],"answer":"technologies that provide access to information through telecommunications","solution":"A: Correct: the ICT slides define ICT as technologies providing access to information through telecommunications.\nB: ICT is broader than hospital computer use.\nC: Hardware is only one aspect of ICT.\nD: ICT encompasses devices, applications and services, not just software.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 2","difficulty":"Hard"},{"id":"her-v1-184","module":"v1","type":"mcq","q":"Which is NOT listed as a scope area of ICT?","options":["Communication technologies","Astrology","Data management","Office automation"],"answer":"Astrology","solution":"A: Email, instant messaging and video conferencing are listed.\nB: Correct: the listed scope areas are communication technologies, data management, networking, media technologies and office automation.\nC: Databases and cloud computing are listed under data management.\nD: Word processors, spreadsheets and presentation software are listed.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 3","difficulty":"Medium"},{"id":"her-v1-185","module":"v1","type":"mcq","q":"The telegraph enabling long-distance communication using Morse code dates from ______.","options":["the 1870s","the 1950s","the 1830s","the 1990s"],"answer":"the 1830s","solution":"A: The 1870s is the date of the telephone, not the telegraph.\nB: Mainframe computers date from the 1950s-60s.\nC: Correct: the slides date the telegraph to the 1830s and the telephone to 1876.\nD: The Internet rose in the 1990s.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 5","difficulty":"Hard"},{"id":"her-v1-186","module":"v1","type":"mcq","q":"Who invented the telephone in 1876?","options":["Charles Babbage","Tim Berners-Lee","Ada Lovelace","Alexander Graham Bell"],"answer":"Alexander Graham Bell","solution":"A: Babbage developed the Analytical Engine.\nB: Berners-Lee developed the World Wide Web in 1989.\nC: Lovelace is associated with early programming of the Analytical Engine.\nD: Correct: the slides state the telephone was invented by Alexander Graham Bell in 1876.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 5","difficulty":"Devil Mode"},{"id":"her-v1-187","module":"v1","type":"mcq","q":"The World Wide Web was developed by Tim Berners-Lee in ______.","options":["1989","1971","2007","1830"],"answer":"1989","solution":"A: Correct: the slides state Tim Berners-Lee developed the World Wide Web in 1989.\nB: 1971 is the date of Intel's first microprocessor.\nC: 2007 is when the iPhone was introduced.\nD: 1830s is the date of the telegraph.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 8","difficulty":"Medium"},{"id":"her-v1-188","module":"v1","type":"mcq","q":"Which company's first microprocessor, the 4004, was released in 1971?","options":["Apple","Intel","IBM","Amazon"],"answer":"Intel","solution":"A: Apple introduced the iPhone in 2007 and popular PCs in the 1980s.\nB: Correct: the slides state Intel's first microprocessor, the 4004, paved the way for personal computing in 1971.\nC: IBM introduced personal computers in the 1980s.\nD: Amazon is associated with cloud computing in the slides.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 6","difficulty":"Hard"},{"id":"her-v1-189","module":"v1","type":"mcq","q":"A computer is best defined as ______.","options":["only the physical parts of a system","a device that can only display information","an electronic device that collects, stores, processes and retrieves data under stored programs","a network of computers"],"answer":"an electronic device that collects, stores, processes and retrieves data under stored programs","solution":"A: The physical parts are hardware; a computer also needs software.\nB: Computers also collect, store and process data.\nC: Correct: the slides define a computer as an electronic device that collects, stores, processes and retrieves data under the direction of programs.\nD: A network connects multiple computers, not a single computer.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 9","difficulty":"Medium"},{"id":"her-v1-190","module":"v1","type":"mcq","q":"Quantum computing uses ______.","options":["ordinary bits with values 1 or 0 only","only magnetic disks","only binary transistors","qubits that can exist in more than one state at the same time"],"answer":"qubits that can exist in more than one state at the same time","solution":"A: Classical computers use ordinary bits; quantum computing uses qubits.\nB: Magnetic disks are storage devices, not quantum units.\nC: Binary transistors are classical computing hardware.\nD: Correct: the slides state quantum computing uses quantum bits (qubits) that can be a 1 and a 0 at the same time via superposition.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 17","difficulty":"Hard"},{"id":"her-v1-191","module":"v1","type":"mcq","q":"Edge computing is best described as ______.","options":["deploying computing and storage at the location where data is produced","storing all data in one central cloud region","using only quantum processors","connecting devices with cables only"],"answer":"deploying computing and storage at the location where data is produced","solution":"A: Correct: the slides define edge computing as placing compute and storage at the same point as the data source at the network edge.\nB: That is cloud computing, not edge computing.\nC: Quantum computing is a different technology.\nD: That describes network cabling, not edge computing.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 15","difficulty":"Devil Mode"},{"id":"her-v1-192","module":"v1","type":"mcq","q":"Which of the following are major cloud computing providers named in the slides?","options":["Intel, AMD and Nvidia","AWS, Microsoft Azure and Google Cloud Platform","Windows, macOS and Linux","Python, Java and C++"],"answer":"AWS, Microsoft Azure and Google Cloud Platform","solution":"A: These are chip manufacturers, not the cloud providers listed.\nB: Correct: the slides list AWS, Microsoft Azure and Google Cloud Platform as major players dominating the cloud market.\nC: These are operating systems, not cloud providers.\nD: These are programming languages, not cloud platforms.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 16","difficulty":"Medium"},{"id":"her-v1-193","module":"v1","type":"mcq","q":"Robotic Process Automation (RPA) is best described as ______.","options":["a hardware robot that performs surgery","a programming language","using software to automate repetitive business processes","a type of computer network"],"answer":"using software to automate repetitive business processes","solution":"A: RPA is software automation, not physical robotics.\nB: RPA is a technology for automation, not a language.\nC: Correct: the slides define RPA as the use of software to automate business processes such as processing transactions and replying to emails.\nD: RPA is not a network technology.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 14","difficulty":"Hard"},{"id":"her-v1-194","module":"v1","type":"mcq","q":"Virtual reality differs from augmented reality in that VR ______.","options":["adds digital elements to a live camera view","only works on quantum computers","is a type of antivirus software","replaces the real environment with a simulated one"],"answer":"replaces the real environment with a simulated one","solution":"A: That describes augmented reality.\nB: VR does not require quantum computing.\nC: VR is an immersive technology, not security software.\nD: Correct: the slides define VR as a completely immersive replacement of real life with a simulated environment, while AR adds digital elements to a live view.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 18","difficulty":"Medium"},{"id":"her-v1-195","module":"v1","type":"mcq","q":"A blockchain is best described as ______.","options":["a decentralised distributed ledger with immutable cryptographic hashes","an antivirus program","a programming language","a type of computer monitor"],"answer":"a decentralised distributed ledger with immutable cryptographic hashes","solution":"A: Correct: the slides define blockchain as a decentralised, distributed ledger where transactions are recorded with an immutable cryptographic signature called a hash.\nB: Blockchain is a ledger technology, not security software.\nC: Blockchain is not a programming language.\nD: Blockchain is unrelated to display hardware.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 19","difficulty":"Hard"},{"id":"her-v1-196","module":"v1","type":"mcq","q":"Internet of Things (IoT) refers to ______.","options":["only large industrial robots","physical objects embedded with sensors and software that connect and exchange data over the internet","the internet of banking services only","a type of wireless security protocol"],"answer":"physical objects embedded with sensors and software that connect and exchange data over the internet","solution":"A: IoT ranges from household objects to industrial tools.\nB: Correct: the slides define IoT as the network of physical things embedded with sensors, software and technologies to connect and exchange data.\nC: IoT covers everyday objects such as appliances and thermostats.\nD: IoT is a network of objects, not a security protocol.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 20","difficulty":"Devil Mode"},{"id":"her-v1-197","module":"v1","type":"mcq","q":"5G technology offers ______.","options":["slower speeds but wider coverage only","only wired connections","higher multi-Gbps speeds, ultra-low latency and massive network capacity","no improvement over 4G"],"answer":"higher multi-Gbps speeds, ultra-low latency and massive network capacity","solution":"A: 5G is designed for higher speeds and lower latency.\nB: 5G is a wireless standard.\nC: Correct: the slides state 5G delivers multi-Gbps peak data speeds, ultra-low latency, reliability and massive capacity.\nD: 5G is described as a new global wireless standard after 4G.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 21","difficulty":"Medium"},{"id":"her-v1-198","module":"v1","type":"mcq","q":"The digital divide refers to ______.","options":["the difference between hardware and software","the gap between 4G and 5G networks","the cost of antivirus software","the gap in access to ICT and the internet between groups at different socioeconomic levels"],"answer":"the gap in access to ICT and the internet between groups at different socioeconomic levels","solution":"A: That is a different concept, not the digital divide.\nB: Network generations are not the digital divide.\nC: Antivirus cost is not the subject of the digital divide.\nD: Correct: the slides define the digital divide as the gap between individuals, households and areas at different socioeconomic levels in access to ICT and the internet.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 27","difficulty":"Hard"},{"id":"her-v1-199","module":"v1","type":"mcq","q":"Which Ghanaian initiative is cited as helping bridge the digital divide?","options":["GIFEC (Ghana Investment Fund for Electronic Communications)","GHAFTRAM (traditional healers federation)","CPMR (plant medicine research centre)","TMPC (traditional medicine practice council)"],"answer":"GIFEC (Ghana Investment Fund for Electronic Communications)","solution":"A: Correct: the slides cite GIFEC as providing ICT systems for government and educational institutions to expand access in rural and low-income areas.\nB: GHAFTRAM is a federation of traditional medicine practitioners.\nC: CPMR is the Centre for Plant Medicine Research.\nD: TMPC is the Traditional Medicine Practice Council.","source":"Unit 1 - Introduction to ICT - 2024-25.pdf | SLIDE 30","difficulty":"Medium"},{"id":"her-v1-200","module":"v1","type":"mcq","q":"Which component is known as the 'brain' of the computer and executes instructions?","options":["RAM","CPU","PSU","Motherboard"],"answer":"CPU","solution":"A: RAM is short-term memory for temporary data storage.\nB: Correct: the slides define the CPU as the brain that executes software instructions and performs calculations, with CU, ALU and registers.\nC: The PSU converts electrical power to usable form.\nD: The motherboard connects all hardware components.","source":"Unit 2 - Computer Hardware and Software - 2024-25.pdf | SLIDE 2","difficulty":"Hard"},{"id":"her-v1-201","module":"v1","type":"mcq","q":"RAM is best described as ______.","options":["permanent storage for files","the main circuit board","short-term memory that stores data temporarily while the system is running","the power conversion unit"],"answer":"short-term memory that stores data temporarily while the system is running","solution":"A: Permanent storage is the role of HDDs and SSDs.\nB: That is the motherboard.\nC: Correct: the slides define RAM as the computer's short-term memory used while the system is running, with types DDR3, DDR4 and DDR5.\nD: That is the PSU.","source":"Unit 2 - Computer Hardware and Software - 2024-25.pdf | SLIDE 3","difficulty":"Devil Mode"},{"id":"her-v1-202","module":"v1","type":"mcq","q":"An SSD differs from an HDD mainly in that an SSD ______.","options":["uses spinning magnetic disks","is always cheaper per GB","cannot be used as a storage device","uses flash memory and has faster read/write speeds and greater durability"],"answer":"uses flash memory and has faster read/write speeds and greater durability","solution":"A: That is an HDD.\nB: SSDs have higher cost per GB.\nC: SSDs are storage devices.\nD: Correct: the slides state SSDs use flash memory, are faster and more durable, but cost more per GB than HDDs.","source":"Unit 2 - Computer Hardware and Software - 2024-25.pdf | SLIDE 9","difficulty":"Medium"},{"id":"her-v1-203","module":"v1","type":"mcq","q":"System software is best described as software that ______.","options":["provides a platform for other software and controls hardware","helps users perform specific tasks like word processing","performs maintenance tasks such as antivirus scanning","is only used for playing games"],"answer":"provides a platform for other software and controls hardware","solution":"A: Correct: the slides define system software as providing a platform for other software, controlling hardware and providing essential services, e.g. operating systems.\nB: That describes application software.\nC: That describes utility software.\nD: Games are applications, not system software.","source":"Unit 2 - Computer Hardware and Software - 2024-25.pdf | SLIDE 14","difficulty":"Hard"},{"id":"her-v1-204","module":"v1","type":"mcq","q":"Which of the following is an example of application software?","options":["Windows 10","Microsoft Word","Device drivers","CCleaner"],"answer":"Microsoft Word","solution":"A: Windows 10 is an operating system (system software).\nB: Correct: the slides list word processors such as Microsoft Word as application software.\nC: Device drivers are system software.\nD: CCleaner is utility software.","source":"Unit 2 - Computer Hardware and Software - 2024-25.pdf | SLIDE 15","difficulty":"Medium"},{"id":"her-v1-205","module":"v1","type":"mcq","q":"Which operating system is described as open-source, secure and flexible with distributions such as Ubuntu and Fedora?","options":["Windows","macOS","Linux","DOS"],"answer":"Linux","solution":"A: Windows is a proprietary Microsoft OS.\nB: macOS is Apple's OS for Mac computers.\nC: Correct: the slides describe Linux as open-source, known for security and flexibility, with distributions Ubuntu, Fedora, Debian and Red Hat.\nD: DOS is not listed among the operating systems discussed.","source":"Unit 2 - Computer Hardware and Software - 2024-25.pdf | SLIDE 19","difficulty":"Hard"},{"id":"her-v1-206","module":"v1","type":"mcq","q":"Corrective software maintenance involves ______.","options":["updating software for new hardware or OS versions","enhancing features and performance","making changes to prevent future issues","fixing bugs and errors"],"answer":"fixing bugs and errors","solution":"A: That is adaptive maintenance.\nB: That is perfective maintenance.\nC: That is preventive maintenance.\nD: Correct: the slides define corrective maintenance as fixing bugs and errors.","source":"Unit 2 - Computer Hardware and Software - 2024-25.pdf | SLIDE 24","difficulty":"Devil Mode"},{"id":"her-v1-207","module":"v1","type":"mcq","q":"Which programming language is described as high-level, interpreted and known for readability, with Django as a web framework?","options":["Python","Java","C++","SQL"],"answer":"Python","solution":"A: Correct: the slides describe Python as high-level, interpreted, readable and versatile, with Django as a popular web framework.\nB: Java is object-oriented and platform-independent, used in Android and enterprise apps.\nC: C++ is an extension of C used for game development and system software.\nD: SQL is a database query language, not described here.","source":"Unit 2 - Computer Hardware and Software - 2024-25.pdf | SLIDE 21","difficulty":"Medium"},{"id":"her-v1-208","module":"v1","type":"mcq","q":"A LAN is best described as ______.","options":["a network spanning multiple countries","a network connecting computers within a limited area such as a home, school or office","the global public network of networks","a single computer without connections"],"answer":"a network connecting computers within a limited area such as a home, school or office","solution":"A: That describes a WAN.\nB: Correct: the slides define a LAN as connecting computers in a limited area with high-speed, low-latency connectivity.\nC: That is the Internet.\nD: A LAN requires multiple connected devices.","source":"Unit 2 - Computer Hardware and Software - 2024-25.pdf | SLIDE 27","difficulty":"Hard"},{"id":"her-v1-209","module":"v1","type":"mcq","q":"A router's main function is ______.","options":["connecting devices within a LAN using MAC addresses","converting digital data to analog signals for transmission","forwarding data packets between computer networks and directing internet traffic","providing temporary memory for running programs"],"answer":"forwarding data packets between computer networks and directing internet traffic","solution":"A: That is a switch.\nB: That is a modem.\nC: Correct: the slides define a router as a device that forwards data packets between networks and can provide security through firewalls.\nD: That is RAM.","source":"Unit 2 - Computer Hardware and Software - 2024-25.pdf | SLIDE 30","difficulty":"Medium"},{"id":"her-v1-210","module":"v1","type":"mcq","q":"Which protocol is used for transmitting web pages between browsers and servers?","options":["FTP","SMTP","VPN","HTTP"],"answer":"HTTP","solution":"A: FTP is used for transferring files between computers.\nB: SMTP is used for sending email messages between servers.\nC: VPN creates an encrypted tunnel, not a web page protocol.\nD: Correct: the slides define HTTP as the protocol used for transmitting web pages and facilitating browser-server communication.","source":"Unit 2 - Computer Hardware and Software - 2024-25.pdf | SLIDE 33","difficulty":"Hard"},{"id":"her-v1-211","module":"v1","type":"mcq","q":"SMTP is the protocol used for ______.","options":["sending email messages between servers","transferring files to a web server","transmitting web pages","encrypting a VPN tunnel"],"answer":"sending email messages between servers","solution":"A: Correct: the slides define SMTP as the protocol for sending email messages between servers.\nB: That is FTP.\nC: That is HTTP.\nD: VPNs use IPsec, SSL/TLS and OpenVPN.","source":"Unit 2 - Computer Hardware and Software - 2024-25.pdf | SLIDE 35","difficulty":"Devil Mode"},{"id":"her-v1-212","module":"v1","type":"mcq","q":"In star topology, ______.","options":["all devices share a single central cable","all devices connect to a central hub or switch","each device connects to two others in a circle","each device connects to every other device"],"answer":"all devices connect to a central hub or switch","solution":"A: That describes bus topology.\nB: Correct: the slides define star topology as all devices connected to a central hub or switch, easy to manage but with a central point of failure.\nC: That describes ring topology.\nD: That describes mesh topology.","source":"Unit 2 - Computer Hardware and Software - 2024-25.pdf | SLIDE 41","difficulty":"Medium"},{"id":"her-v1-213","module":"v1","type":"mcq","q":"Which topology offers high redundancy because every device connects to every other device?","options":["Star","Bus","Mesh","Ring"],"answer":"Mesh","solution":"A: Star uses a central hub and has a single point of failure.\nB: Bus uses a single cable and is difficult to troubleshoot.\nC: Correct: the slides state mesh topology connects each device to every other device, giving high redundancy and reliability but high cost and complexity.\nD: Ring has a circular path and a single point can disrupt the network.","source":"Unit 2 - Computer Hardware and Software - 2024-25.pdf | SLIDE 42","difficulty":"Hard"},{"id":"her-v1-214","module":"v1","type":"mcq","q":"Cybersecurity is best described as ______.","options":["the process of installing application software","a type of network topology","the design of computer hardware","practices and technologies that protect systems, networks and data from unauthorized access and attacks"],"answer":"practices and technologies that protect systems, networks and data from unauthorized access and attacks","solution":"A: Software installation is a different process.\nB: Topology is network layout, not security.\nC: Hardware design is not cybersecurity.\nD: Correct: the slides define cybersecurity as protecting systems, networks and data from unauthorized access, attacks and damage.","source":"Unit 2 - Computer Hardware and Software - 2024-25.pdf | SLIDE 36","difficulty":"Medium"},{"id":"her-v1-215","module":"v1","type":"mcq","q":"Which of the following is an example of a healthcare software system mentioned in the ICT slides?","options":["Electronic patient medical records","Traditional birth attendant registers only","Herbal monograph printing","Prescription handwritten pads only"],"answer":"Electronic patient medical records","solution":"A: Correct: the slides list patient registration, electronic patient/medical records, patient accounting, physician order entry and drug information systems.\nB: Not listed as a healthcare software example.\nC: Not listed in the healthcare software examples.\nD: Electronic systems, not handwritten pads, are listed.","source":"Unit 2 - Computer Hardware and Software - 2024-25.pdf | SLIDE 26","difficulty":"Hard"},{"id":"her-v2-115","module":"v2","type":"mcq","q":"Antisepsis is defined as ______.","options":["removing microorganisms from inanimate objects","killing all microbial life including spores","reduction or inhibition of microbes on living tissue","mechanical removal of microbes by washing"],"answer":"reduction or inhibition of microbes on living tissue","solution":"A: That is disinfection.\nB: That is sterilization.\nC: Correct: the BHM 162 slides define antisepsis as reduction or inhibition of microbes on living tissue.\nD: That is degerming.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 3","difficulty":"Devil Mode"},{"id":"her-v2-116","module":"v2","type":"mcq","q":"Which agent is applied on or in the living body of humans or animals?","options":["Disinfectant","Sanitizer","Bactericide only","Antiseptic"],"answer":"Antiseptic","solution":"A: Disinfectants are applied to inanimate objects.\nB: Sanitizers reduce contaminants in the inanimate environment.\nC: Bactericide describes killing bacteria regardless of application site.\nD: Correct: the slides state antiseptic products are applied on or in the living body.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 3","difficulty":"Medium"},{"id":"her-v2-117","module":"v2","type":"mcq","q":"A disinfectant is best described as an agent that ______.","options":["destroys harmful microorganisms on inanimate objects but may not kill bacterial spores","is applied only to living tissue","always achieves complete sterilization","inhibits growth without killing"],"answer":"destroys harmful microorganisms on inanimate objects but may not kill bacterial spores","solution":"A: Correct: the slides define a disinfectant as a chemical or physical agent applied to inanimate objects that may not kill spores.\nB: That describes an antiseptic.\nC: Disinfection does not necessarily kill all microorganisms.\nD: That describes a bacteriostat.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 4","difficulty":"Hard"},{"id":"her-v2-118","module":"v2","type":"mcq","q":"A bacteriostat is an agent that ______.","options":["kills bacteria outright","inhibits bacterial growth but does not necessarily kill the bacteria","kills viruses only","removes microbes mechanically"],"answer":"inhibits bacterial growth but does not necessarily kill the bacteria","solution":"A: That is a bactericide.\nB: Correct: the slides define bacteriostats as agents that inhibit growth but do not necessarily kill bacteria.\nC: That is a virucide.\nD: That is degerming.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 3","difficulty":"Medium"},{"id":"her-v2-119","module":"v2","type":"mcq","q":"High-level disinfectants are also called ______.","options":["hospital disinfectants","tuberculocides","sterilants or chemosterilants","sanitizers"],"answer":"sterilants or chemosterilants","solution":"A: That is the term for low-level disinfectants.\nB: That is the term for intermediate-level disinfectants.\nC: Correct: the slides state high-level disinfectants (sterilants) kill all organisms except high levels of bacterial spores and some are called liquid chemical sterilants.\nD: Sanitizers reduce contaminants to safe levels in inanimate environments.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 5","difficulty":"Hard"},{"id":"her-v2-120","module":"v2","type":"mcq","q":"Intermediate-level disinfectants (tuberculocides) kill ______.","options":["only bacterial spores","all organisms including high spore levels","only most vegetative bacteria and fungi","all vegetative bacteria including Mycobacterium tuberculosis but may exclude spores"],"answer":"all vegetative bacteria including Mycobacterium tuberculosis but may exclude spores","solution":"A: Spores are excluded from theIntermediate-level claim.\nB: That describes high-level disinfectants/sterilants.\nC: That describes low-level disinfectants.\nD: Correct: the slides state intermediate-level disinfectants kill vegetative bacteria including M. tuberculosis but may exclude some fungi, viruses and spores.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 5","difficulty":"Devil Mode"},{"id":"her-v2-121","module":"v2","type":"mcq","q":"Critical medical items are those that ______.","options":["enter normal tissue or the vascular system or through which blood flows and should be sterile","touch only intact skin","contact intact mucous membranes only","never touch the patient"],"answer":"enter normal tissue or the vascular system or through which blood flows and should be sterile","solution":"A: Correct: the slides define critical items as devices entering tissue or the vascular system and requiring sterilization.\nB: Those are non-critical items needing low-level disinfection.\nC: Those are semi-critical items needing high-level disinfection.\nD: Those are non-critical items.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 6","difficulty":"Medium"},{"id":"her-v2-122","module":"v2","type":"mcq","q":"Semi-critical items such as feeding tubes should receive at least ______.","options":["sterilization","high-level disinfection","low-level disinfection","simple cleaning with water only"],"answer":"high-level disinfection","solution":"A: Sterilization is required for critical items.\nB: Correct: the slides state semi-critical items contacting intact mucous membranes should receive at least high-level disinfection.\nC: Low-level disinfection is for non-critical items.\nD: A defined disinfection level is required.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 6","difficulty":"Hard"},{"id":"her-v2-123","module":"v2","type":"mcq","q":"Which factor does NOT affect the choice of a disinfectant according to the slides?","options":["Concentration of the agent","Organic matter","The colour of the packaging","Microbial challenge (bioburden)"],"answer":"The colour of the packaging","solution":"A: Concentration is listed under properties of the chemical agent.\nB: Organic matter may affect adsorption or inactivation.\nC: Correct: the listed factors are chemical properties, concentration, temperature, pH, intended application, organic matter, toxicity and microbial challenge.\nD: Bioburden affects exposure time and concentration.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 7","difficulty":"Medium"},{"id":"her-v2-124","module":"v2","type":"mcq","q":"As temperature increases, the extinction time of a disinfectant ______.","options":["increases","remains constant","becomes zero","decreases"],"
