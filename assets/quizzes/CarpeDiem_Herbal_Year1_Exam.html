answer":"decreases","solution":"A: Higher temperature speeds killing, so extinction time falls.\nB: Temperature coefficient describes the change in rate.\nC: Some time is still required for kill.\nD: Correct: the slides state as temperature increases, the rate of disinfection increases and extinction time decreases.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 15","difficulty":"Hard"},{"id":"her-v2-125","module":"v2","type":"mcq","q":"The Q10 value is calculated using extinction times at two temperatures differing by exactly ______.","options":["10 degrees Celsius","1 degree Celsius","5 degrees Celsius","20 degrees Celsius"],"answer":"10 degrees Celsius","solution":"A: Correct: the slides state Q10 is determined from extinction times at temperatures differing exactly by 10 C.\nB: The temperature coefficient theta is per degree; Q10 is per 10 degrees.\nC: Q10 requires a 10 degree difference.\nD: That is not the definition of Q10.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 16","difficulty":"Devil Mode"},{"id":"her-v2-126","module":"v2","type":"mcq","q":"For phenol, mercury chloride and ethanol, which statement about the concentration exponent is correct?","options":["Phenol has an exponent of 1 like mercuric chloride","Mercuric chloride has an exponent of 1, so a threefold dilution reduces activity to a third","Activity is unaffected by dilution","Higher dilution always increases potency"],"answer":"Mercuric chloride has an exponent of 1, so a threefold dilution reduces activity to a third","solution":"A: Phenol has an exponent of about 6, so a threefold dilution cuts activity 729-fold.\nB: Correct: the slides state mercuric chloride's exponent is 1, so a threefold dilution reduces activity threefold and triples disinfection time.\nC: Concentration and time are exponentially related.\nD: Dilution reduces potency.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 18","difficulty":"Medium"},{"id":"her-v2-127","module":"v2","type":"mcq","q":"A change of pH can affect disinfection by all of the following EXCEPT ______.","options":["Growth rate of the inoculum","Potency of the antibacterial agent","changing the molecular weight of the microbe","Adsorption at the cell surface"],"answer":"changing the molecular weight of the microbe","solution":"A: Optimum bacterial growth pH is 6 to 8.\nB: Degree of ionization affects activity, e.g. phenolics most active unionized.\nC: Correct: the slides state pH affects growth of the inoculum, potency/ionization of the agent and adsorption at the cell surface, not molecular weight.\nD: Higher external pH makes the cell surface more negatively charged, favouring cationic agents.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 19","difficulty":"Hard"},{"id":"her-v2-128","module":"v2","type":"mcq","q":"Which group of microorganisms is described as the most resistant of all infectious agents to chemical inactivation?","options":["Bacterial spores","Mycobacteria","Enveloped viruses","Prions"],"answer":"Prions","solution":"A: Spores are the most resistant bacteria, but prions are more resistant still.\nB: Mycobacteria are more resistant than other non-sporulating bacteria, not the most resistant overall.\nC: Enveloped viruses are relatively susceptible to lipophilic biocides.\nD: Correct: the slides state prions are the most resistant infectious agents to chemical inactivation.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 27","difficulty":"Medium"},{"id":"her-v2-129","module":"v2","type":"mcq","q":"The three target sites of non-antibiotic antimicrobial agents are ______.","options":["cell wall, cytoplasmic membrane and cytoplasm","nucleus, ribosome and mitochondria","capsule, flagella and pili","DNA, RNA and plasmids only"],"answer":"cell wall, cytoplasmic membrane and cytoplasm","solution":"A: Correct: the slides state non-antibiotic antimicrobial agents are broadly non-specific protoplasmic poisons acting on cell wall, membrane and cytoplasm.\nB: Bacteria lack a nucleus and mitochondria; these are not the listed targets.\nC: These are not the target sites listed.\nD: Nucleic acids are one cytoplasmic target, not the three broad sites.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 24","difficulty":"Hard"},{"id":"her-v2-130","module":"v2","type":"mcq","q":"Chlorhexidine inhibits bacteria mainly by ______.","options":["intercalating into DNA","inhibiting membrane ATPase and causing leakage of intracellular constituents","forming covalent crosslinks with amino groups","oxidizing thiol groups"],"answer":"inhibiting membrane ATPase and causing leakage of intracellular constituents","solution":"A: Acridine dyes, not chlorhexidine, intercalate into DNA.\nB: Correct: the slides list chlorhexidine as an ATPase inhibitor causing leakage of potassium ions, amino acids and other cell contents.\nC: Glutaraldehyde and formaldehyde react with amino groups.\nD: Chlorine and iodine oxidize thiol groups.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 26","difficulty":"Devil Mode"},{"id":"her-v2-131","module":"v2","type":"mcq","q":"Which type of resistance to biocides is usually chromosomal and demonstrated by Gram-negative bacteria, mycobacteria and spores?","options":["Acquired resistance","Plasmid-encoded resistance only","Intrinsic resistance","Cross-resistance only"],"answer":"Intrinsic resistance","solution":"A: Acquired resistance arises by mutation or plasmids/transposons.\nB: Plasmid resistance is a form of acquired resistance.\nC: Correct: the slides state intrinsic resistance is usually chromosomally controlled and shown by Gram-negatives, mycobacteria and spores.\nD: Cross-resistance is not the chromosomal intrinsic type described.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 28","difficulty":"Medium"},{"id":"her-v2-132","module":"v2","type":"mcq","q":"The phenol coefficient is ______.","options":["the ratio of two temperatures","the concentration exponent n","the number of plaque-forming units","the ratio of the highest dilution of phenol killing in 10 minutes to the highest dilution of the test disinfectant giving the same result"],"answer":"the ratio of the highest dilution of phenol killing in 10 minutes to the highest dilution of the test disinfectant giving the same result","solution":"A: That is the temperature coefficient.\nB: That is the dilution coefficient.\nC: That is a phage titre measure.\nD: Correct: the slides define phenol coefficient exactly this way.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 32","difficulty":"Hard"},{"id":"her-v2-133","module":"v2","type":"mcq","q":"Which test is a capacity use-dilution test involving successive addition of bacteria at different times?","options":["Kelsey-Sykes","Rideal-Walker","Chick-Martin","European suspension test"],"answer":"Kelsey-Sykes","solution":"A: Correct: the slides describe the Kelsey-Sykes test as a capacity use-dilution test with successive bacterial additions using S. aureus, E. coli, P. aeruginosa and P. vulgaris.\nB: Rideal-Walker is a phenol coefficient test.\nC: Chick-Martin is a phenol coefficient test including organic matter.\nD: That is a quantitative suspension test, not the capacity use-dilution test.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 32","difficulty":"Medium"},{"id":"her-v2-134","module":"v2","type":"mcq","q":"Which organism is used as an indicator for mycobactericidal activity testing?","options":["Mycobacterium tuberculosis","Mycobacterium terrae","Bacillus subtilis","Staphylococcus aureus"],"answer":"Mycobacterium terrae","solution":"A: It is pathogenic and slow-growing; M. terrae is the safer indicator.\nB: Correct: the slides state the non-pathogenic M. terrae can be used as an indicator organism for mycobactericidal activity.\nC: Bacillus species are used as spore indicators.\nD: S. aureus is used in use-dilution tests, not mycobactericidal tests.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 34","difficulty":"Hard"},{"id":"her-v2-135","module":"v2","type":"mcq","q":"The optimum concentration of ethanol for disinfection is ______.","options":["100%","40%","70%","95%"],"answer":"70%","solution":"A: Pure ethanol is less effective because water aids protein denaturation and diffusion.\nB: The optimum given is 70%.\nC: Correct: the slides state ethanol's optimum disinfecting concentration is 70%, which kills most rapidly and is bactericidal.\nD: The slides specify 70% as the optimum.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 39","difficulty":"Devil Mode"},{"id":"her-v2-136","module":"v2","type":"mcq","q":"Alcohols act mainly by ______.","options":["forming covalent crosslinks with DNA","oxidizing thiol groups","intercalating into nucleic acid","denaturing proteins and dissolving membrane lipids"],"answer":"denaturing proteins and dissolving membrane lipids","solution":"A: That is not the mechanism of alcohols.\nB: Oxidizing agents like chlorine act this way.\nC: Acridine dyes intercalate, not alcohols.\nD: Correct: the slides state alcohols act by denaturing proteins and disrupting cell membranes by dissolving lipids.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 39","difficulty":"Medium"},{"id":"her-v2-137","module":"v2","type":"mcq","q":"Formalin is a aqueous solution of formaldehyde at a concentration of ______.","options":["37%-40%","2%","10%","0.5%"],"answer":"37%-40%","solution":"A: Correct: the slides state formalin is a 37%-40% aqueous solution of methanal used as a disinfectant and specimen preservative.\nB: 2% is the concentration given for glutaraldehyde.\nC: 10-30% is the range given for sporicidal hydrogen peroxide.\nD: 0.5% is given for chlorbutol.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 42","difficulty":"Hard"},{"id":"her-v2-138","module":"v2","type":"mcq","q":"Glutaraldehyde is notable because it ______.","options":["is only used as a food preservative","is one of the few chemical disinfectants that is a sterilizing agent, used for endoscopes","has no activity against spores","is more irritating than formaldehyde"],"answer":"is one of the few chemical disinfectants that is a sterilizing agent, used for endoscopes","solution":"A: It is a hospital disinfectant and sterilant.\nB: Correct: the slides state glutaraldehyde is a sterilizing agent for low-temperature disinfection of endoscopes and instruments.\nC: A 2% solution is sporicidal in 3-10 hours.\nD: The slides say it is less irritating and more effective.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 43","difficulty":"Medium"},{"id":"her-v2-139","module":"v2","type":"mcq","q":"Chlorhexidine's activity is greatest at approximately ______.","options":["pH 2-3","pH 10-11","pH 7-8","pH 4-5"],"answer":"pH 7-8","solution":"A: Chlorhexidine is not most active at strongly acidic pH.\nB: Activity is reduced at strongly alkaline pH.\nC: Correct: the slides state chlorhexidine's activity is pH dependent and works best at pH 7-8.\nD: That is not the optimum range given.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 44","difficulty":"Hard"},{"id":"her-v2-140","module":"v2","type":"mcq","q":"Chlorine combines with water to form which active species?","options":["Hydrochloric acid only","Hypochlorite ion only at high pH","Chloramine","Hypochlorous acid"],"answer":"Hypochlorous acid","solution":"A: HCl alone is not the active disinfecting species.\nB: The hypochlorite ion is less active than HOCl.\nC: Chloramines form when chlorine reacts with ammonia.\nD: Correct: the slides give the reaction Cl2 + H2O = H+ + Cl- + HOCl (hypochlorous acid).","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 45","difficulty":"Devil Mode"},{"id":"her-v2-141","module":"v2","type":"mcq","q":"Hypochlorites are most active at ______.","options":["low pH","high pH","neutral pH only","boiling temperatures only"],"answer":"low pH","solution":"A: Correct: the slides state hypochlorites are most active at low pH and activity declines as pH increases.\nB: Activity declines with increasing pH.\nC: Activity is highest at low pH.\nD: pH, not boiling, is the factor stated.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 46","difficulty":"Medium"},{"id":"her-v2-142","module":"v2","type":"mcq","q":"Iodophors are ______.","options":["pure iodine crystals","complexes of iodine with a solubilizing carrier that act as a reservoir of free iodine","iodine combined with chlorine","iodine bound to a metal surface"],"answer":"complexes of iodine with a solubilizing carrier that act as a reservoir of free iodine","solution":"A: Iodophors are complexes, not pure iodine.\nB: Correct: the slides define iodophors as complexes of iodine and a solubilizing agent or carrier acting as a reservoir of free iodine.\nC: That is not the definition of an iodophor.\nD: The carrier is an organic solubilizing agent such as PVP.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 49","difficulty":"Hard"},{"id":"her-v2-143","module":"v2","type":"mcq","q":"The oligodynamic effect refers to ______.","options":["the growth of bacteria in pure water","the effect of high temperatures on spores","antimicrobial activity of metals and metal ions in very tiny amounts","the resistance of spores to disinfectants"],"answer":"antimicrobial activity of metals and metal ions in very tiny amounts","solution":"A: Oligodynamic action concerns metals, not water growth.\nB: That is heat sterilization, not oligodynamic action.\nC: Correct: the slides define oligodynamic action as metals and metal ions in very tiny amounts being effective antimicrobials.\nD: That is spore resistance, not the oligodynamic effect.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 51","difficulty":"Medium"},{"id":"her-v2-144","module":"v2","type":"mcq","q":"Which heavy metal compound is used as a preservative for bacterial and viral vaccines at 0.01-0.02%?","options":["Silver sulphadiazine","Copper sulphate","Zinc oxide","Thiomersal"],"answer":"Thiomersal","solution":"A: Silver sulphadiazine is used for burns, not vaccine preservation.\nB: Copper sulphate kills algae in pools.\nC: Zinc oxide is an antifungal in paints and wound dressings.\nD: Correct: the slides state thiomersal (0.01-0.02% w/v) is used as a preservative for bacterial and viral vaccines.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 52","difficulty":"Hard"},{"id":"her-v2-145","module":"v2","type":"mcq","q":"Phenol acts mainly by ______.","options":["protein denaturation and disruption of the cytoplasmic membrane","inhibiting cell wall synthesis only","chelation of iron","DNA intercalation"],"answer":"protein denaturation and disruption of the cytoplasmic membrane","solution":"A: Correct: the slides state phenol's mode of action is protein denaturation and entry into the cytoplasmic membrane disrupting structure and function.\nB: Penicillin-like agents inhibit cell wall synthesis, not phenol.\nC: Chelators such as EDTA act this way, not phenol.\nD: Acridine dyes intercalate DNA.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 54","difficulty":"Devil Mode"},{"id":"her-v2-146","module":"v2","type":"mcq","q":"Quaternary ammonium compounds (QACs) are ______.","options":["anionic soaps that are always effective against Pseudomonas","cationic surfactants effective against Gram-positive bacteria but with Pseudomonas resistance","sporicidal agents","neutralized by cationic detergents"],"answer":"cationic surfactants effective against Gram-positive bacteria but with Pseudomonas resistance","solution":"A: Soaps are anionic; QACs are cationic and Pseudomonas can resist them.\nB: Correct: the slides state QACs are cationic surface-active agents effective against Gram-positive bacteria, with resistant Pseudomonas strains a hospital concern.\nC: QACs are not sporicidal.\nD: They are neutralized by soaps and anionic detergents.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 58","difficulty":"Medium"},{"id":"her-v2-147","module":"v2","type":"mcq","q":"Peracetic acid is considered more potent than hydrogen peroxide because it ______.","options":["cannot decompose","is only active against viruses","Broad microbicidal potency at low concentrations even in organic loads","is destroyed by peroxidases"],"answer":"Broad microbicidal potency at low concentrations even in organic loads","solution":"A: PAA decomposes to acetic acid and oxygen.\nB: It is active against spores, bacteria, viruses and fungi.\nC: Correct: the slides state peracetic acid is a more potent biocide than H2O2, active below 0.3% and in organic loads.\nD: PAA is free from decomposition by peroxidases.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 62","difficulty":"Hard"},{"id":"her-v2-148","module":"v2","type":"mcq","q":"An ideal antimicrobial preservative should be ______.","options":["only active against bacteria","microbistatic only","absorbed by the packaging material","microbicidal rather than microbistatic and broadly active against bacteria, yeast and moulds"],"answer":"microbicidal rather than microbistatic and broadly active against bacteria, yeast and moulds","solution":"A: Broad spectrum includes yeast and moulds.\nB: An ideal preservative is microbicidal, not merely microbistatic.\nC: It should not be absorbed by packaging.\nD: Correct: the slides list microbicidal, rapid action, broad spectrum, stability and compatibility among ideal preservative properties.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 63","difficulty":"Medium"},{"id":"her-v2-149","module":"v2","type":"mcq","q":"Benzoic acid is most active at ______.","options":["pH 4 and below when undissociated","pH 8-9","pH 7 only","any pH equally"],"answer":"pH 4 and below when undissociated","solution":"A: Correct: the slides state benzoic acid is active when undissociated and best active at pH 4 and below.\nB: Benzoic acid is weakly active at alkaline pH.\nC: It is most active in acidic conditions.\nD: Activity depends on the undissociated fraction.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 66","difficulty":"Hard"},{"id":"her-v2-150","module":"v2","type":"mcq","q":"Parabens are unsatisfactory as preservatives for oil-in-water creams made with PEG emulsifiers because ______.","options":["they are destroyed by heat sterilization","the preservative is lost through hydrogen bonding to the emulgent","PEG makes them too soluble in water","they react with the oil phase chemically"],"answer":"the preservative is lost through hydrogen bonding to the emulgent","solution":"A: Heat is not the stated reason.\nB: Correct: the slides state preservative is lost through hydrogen bonding to the emulgent in such creams.\nC: Loss is due to hydrogen bonding, not solubility shift.\nD: The stated cause is hydrogen bonding to the emulgent.","source":"2025 Ph 2 n BHM1 S 2 abridged.pptx | SLIDE 67","difficulty":"Devil Mode"},{"id":"her-v2-151","module":"v2","type":"mcq","q":"Communication is described in ENG 158 as ______.","options":["only the act of speaking","writing formal letters only","the process of transmitting and receiving information","a one-way transfer with no feedback"],"answer":"the process of transmitting and receiving information","solution":"A: Communication includes receiving and feedback, not only speaking.\nB: Letters are one format, not the definition.\nC: Correct: the slides define communication as the process of transmitting and receiving information, involving a speaker and listener.\nD: The slides expect feedback, describing communication as give and take.","source":"Communication pptx.pptx | SLIDE 2","difficulty":"Medium"},{"id":"her-v2-152","module":"v2","type":"mcq","q":"Communication is described as bipolar because it involves ______.","options":["two languages at once","two separate messages","only written and spoken modes","a speaker (source) and a listener (destination)"],"answer":"a speaker (source) and a listener (destination)","solution":"A: Bipolar refers to the two roles, not two languages.\nB: The two poles are source and destination.\nC: Those are modes, not the reason for 'bipolar'.\nD: Correct: the slides state communication involves a speaker and a listener, hence it is bipolar.","source":"Communication pptx.pptx | SLIDE 2","difficulty":"Hard"},{"id":"her-v2-153","module":"v2","type":"mcq","q":"Which of the following is NOT one of the four main components of communication listed in the slides?","options":["Feedback loop","Message/information","Channel","Destination/receiver"],"answer":"Feedback loop","solution":"A: Correct: the four main components are message, source/sender, destination/receiver and channel.\nB: The message is one of the four main components.\nC: The channel is one of the four main components.\nD: The receiver is one of the four main components.","source":"Communication pptx.pptx | SLIDE 7","difficulty":"Medium"},{"id":"her-v2-154","module":"v2","type":"mcq","q":"Effective communication is defined as ______.","options":["communication with no feedback","communication that achieves the desired goals","communication using only formal language","the longest possible message"],"answer":"communication that achieves the desired goals","solution":"A: Effective communication is two-way and involves feedback.\nB: Correct: the slides define effective communication as communication ending in the achievement of desired goals and as a two-way process requiring effort from both parties.\nC: Formality is one variable, not the definition.\nD: Length does not define effectiveness.","source":"Communication pptx.pptx | SLIDE 10","difficulty":"Hard"},{"id":"her-v2-155","module":"v2","type":"mcq","q":"Communication breakdown occurs when ______.","options":["the speaker uses gestures","the listener asks questions","the intended information does not achieve the desired goals","both parties are present"],"answer":"the intended information does not achieve the desired goals","solution":"A: Gestures are non-verbal communication, not breakdown.\nB: Questions are feedback, not breakdown.\nC: Correct: the slides define communication breakdown as intended information failing to achieve desired goals.\nD: Co-presence does not define breakdown.","source":"Communication pptx.pptx | SLIDE 10","difficulty":"Devil Mode"},{"id":"her-v2-156","module":"v2","type":"mcq","q":"Intrapersonal communication is ______.","options":["communication between two people","communication to a large audience","communication within an organization only","communication within oneself"],"answer":"communication within oneself","solution":"A: That is interpersonal communication.\nB: That is mass/impersonal communication.\nC: That is organizational communication.\nD: Correct: the slides define intrapersonal communication as communication within oneself, including mental processing of stimuli.","source":"Communication pptx.pptx | SLIDE 12","difficulty":"Medium"},{"id":"her-v2-157","module":"v2","type":"mcq","q":"Which form of interpersonal communication is one-way out?","options":["Giving commands or instructions","Conversation","Question and answer","Interviews and discussions"],"answer":"Giving commands or instructions","solution":"A: Correct: the slides list monolineal (one-way) forms such as giving information, commands, instructions and writing memos.\nB: Conversation is a bilineal give-and-take form.\nC: This is bilineal.\nD: These are bilineal/multilineal forms.","source":"Communication pptx.pptx | SLIDE 16","difficulty":"Hard"},{"id":"her-v2-158","module":"v2","type":"mcq","q":"Impersonal or mass communication is characterized by ______.","options":["immediate feedback from every listener","a large audience with no direct contact between source and destination","only face-to-face interaction","communication within oneself"],"answer":"a large audience with no direct contact between source and destination","solution":"A: Mass communication has limited immediate feedback.\nB: Correct: the slides state mass communication is meant for many people with no direct source-destination contact, usually via mass media.\nC: Mass media are typically used.\nD: That is intrapersonal communication.","source":"Communication pptx.pptx | SLIDE 19","difficulty":"Medium"},{"id":"her-v2-159","module":"v2","type":"mcq","q":"The study of how space communicates is called ______.","options":["chronemics","oculesics","proxemics","haptics"],"answer":"proxemics","solution":"A: Chronemics is the use of time.\nB: Oculesics is eye contact.\nC: Correct: the slides define proxemics as how space communicates, e.g. a church conveying reverence.\nD: Haptics is touch.","source":"Communication pptx.pptx | SLIDE 22","difficulty":"Hard"},{"id":"her-v2-160","module":"v2","type":"mcq","q":"Which form of non-verbal communication involves eye contact?","options":["Proxemics","Vocalics","Objectics","Oculesics"],"answer":"Oculesics","solution":"A: Proxemics concerns space.\nB: Vocalics concerns voice qualities such as pitch and volume.\nC: Objectics concerns artifacts and environment.\nD: Correct: the slides define oculesics as communication by means of eye contact, conveying interest, respect or disgust.","source":"Communication pptx.pptx | SLIDE 24","difficulty":"Devil Mode"},{"id":"her-v2-161","module":"v2","type":"mcq","q":"Vocalics refers to ______.","options":["how the voice communicates through speed, pitch, intonation, stress and volume","the words chosen in a speech","the distance between speakers","the use of gestures"],"answer":"how the voice communicates through speed, pitch, intonation, stress and volume","solution":"A: Correct: the slides define vocalics as communication through voice qualities and sounds such as laughter or silence.\nB: Word choice is verbal, not vocalics.\nC: That is proxemics.\nD: That is kinesics.","source":"Communication pptx.pptx | SLIDE 27","difficulty":"Medium"},{"id":"her-v2-162","module":"v2","type":"mcq","q":"Downward communication in an organization refers to ______.","options":["information from subordinate to superior","information flow from superior to subordinate","communication between peers at the same level","communication across departments at different levels"],"answer":"information flow from superior to subordinate","solution":"A: That is upward communication.\nB: Correct: the slides define downward communication as flow from superior to subordinate, e.g. job descriptions and instructions.\nC: That is horizontal communication.\nD: That is diagonal communication.","source":"Communication pptx.pptx | SLIDE 30","difficulty":"Hard"},{"id":"her-v2-163","module":"v2","type":"mcq","q":"Which of the following encourages upward communication?","options":["Issuing bulletins and briefings only","Creating a culture of communication from the top","Introduction of suggestion boxes","Holding morning devotions"],"answer":"Introduction of suggestion boxes","solution":"A: Those improve downward communication.\nB: That is listed under downward communication.\nC: Correct: the slides list suggestion boxes, regular meetings and an open policy as ways to improve upward communication.\nD: That is listed as improving downward communication.","source":"Communication pptx.pptx | SLIDE 35","difficulty":"Medium"},{"id":"her-v2-164","module":"v2","type":"mcq","q":"Horizontal communication takes place ______.","options":["from a superior to a subordinate","between different levels in different departments","only within one's own mind","between or among people at the same hierarchical level"],"answer":"between or among people at the same hierarchical level","solution":"A: That is downward communication.\nB: That is diagonal communication.\nC: That is intrapersonal communication.\nD: Correct: the slides define horizontal communication as between people of the same level, e.g. inter-departmental or inter-faculty.","source":"Communication pptx.pptx | SLIDE 36","difficulty":"Hard"},{"id":"her-v2-165","module":"v2","type":"mcq","q":"Diagonal communication is usually discouraged in organizations because ______.","options":["communication should follow the line of command within a department or section","it is too fast","it uses too many words","it only occurs between superiors"],"answer":"communication should follow the line of command within a department or section","solution":"A: Correct: the slides state diagonal communication crosses levels and sections and is discouraged in favour of the line of command.\nB: Speed is not the reason given.\nC: Wordiness is not the reason.\nD: Diagonal crosses different levels and sections.","source":"Communication pptx.pptx | SLIDE 38","difficulty":"Devil Mode"},{"id":"her-v2-166","module":"v2","type":"mcq","q":"An organogram is ______.","options":["a type of memorandum","a diagram showing an organization's structure, roles, flow of power and communication routes","a diagram of the human body only","a list of employees' salaries"],"answer":"a diagram showing an organization's structure, roles, flow of power and communication routes","solution":"A: A memo is a written communication format.\nB: Correct: the slides define an organogram as a diagram showing the structure of an organization and relationships of its parts and positions.\nC: That is anatomy, not organizational structure.\nD: Salaries are not the subject of an organogram.","source":"Communication pptx.pptx | SLIDE 39","difficulty":"Medium"},{"id":"her-v2-167","module":"v2","type":"mcq","q":"KNUST's three-tier academic/administrative structure under the college system consists of ______.","options":["Chancellor, Vice Chancellor and Registrar only","Students, lecturers and professors","Provosts of Colleges, Deans of Faculties and Heads of Departments","Faculty, staff and alumni"],"answer":"Provosts of Colleges, Deans of Faculties and Heads of Departments","solution":"A: Those are principal officers, not the academic three-tier structure.\nB: These are not the administrative tiers described.\nC: Correct: the ENG 158 slides list Provosts, Deans and Heads as the three tiers of KNUST's college system.\nD: These groups are not the tiers listed.","source":"ENGL 158 - Organizational Communication.pptx | SLIDE 11","difficulty":"Hard"},{"id":"her-v2-168","module":"v2","type":"mcq","q":"Which of the following is a communication format in organizations?","options":["A prescription pad only","A herbal monograph","A lecture slide only","Memorandum"],"answer":"Memorandum","solution":"A: Not listed as an organizational communication format.\nB: That is a technical document, not listed here.\nC: Slides are teaching aids, not listed as organizational formats.\nD: Correct: the slides list letter writing, memorandum, e-mails, reports, minutes and technological means such as WhatsApp and Telegram.","source":"ENGL 158 - Organizational Communication.pptx | SLIDE 19","difficulty":"Medium"},{"id":"her-v2-169","module":"v2","type":"mcq","q":"To confirm the presence of hexanoic acid in a mixture with hexanol, which chemical test is specific (past question, correct option B)?","options":["Reaction with NaHCO3 to produce CO2 gas","Lucas test","Tollens' reagent","Fehling's solution"],"answer":"Reaction with NaHCO3 to produce CO2 gas","solution":"A: Correct: the literal past question's answer key gives B; carboxylic acids react with sodium bicarbonate to liberate CO2, while alcohols do not.\nB: This is option A in the past question; the Lucas test distinguishes alcohol classes, not acids.\nC: This is option C; Tollens' detects aldehydes.\nD: This is option D; Fehling's detects reducing sugars/aldehydes.","source":"Trial for 152.pdf | SLIDE 3","difficulty":"Hard"},{"id":"her-v2-170","module":"v2","type":"mcq","q":"Which reagent reduces benzoic acid to benzyl alcohol without affecting a C=C double bond in the side chain (past question, correct option C)?","options":["H2/Pd","LiAlH4","NaBH4","KMnO4"],"answer":"LiAlH4","solution":"A: This is option A; catalytic hydrogenation would also reduce the C=C bond.\nB: Correct: the answer key gives C; LiAlH4 reduces -COOH to -CH2OH without reducing isolated C=C bonds.\nC: This is option B; NaBH4 is too mild to reduce carboxylic acids.\nD: This is option D; KMnO4 is an oxidizing agent, not a reducing agent.","source":"Trial for 152.pdf | SLIDE 3","difficulty":"Devil Mode"},{"id":"her-v2-171","module":"v2","type":"mcq","q":"When sodium hydroxide is added to ethyl acetate and heated, the products are (past question, correct option C):","options":["Ethanol and acetic acid","Sodium acetate and ethanol (reversible)","Sodium acetate and ethanol (irreversible)","Sodium ethoxide and acetic acid"],"answer":"Sodium acetate and ethanol (irreversible)","solution":"A: This is option A; base hydrolysis gives the salt, not the free acid.\nB: This is option D; acid-catalysed esterification is reversible, not base hydrolysis.\nC: Correct: the answer key gives C; saponification with NaOH is irreversible and yields sodium acetate and ethanol.\nD: These are not the products of NaOH hydrolysis of ethyl acetate.","source":"Trial for 152.pdf | SLIDE 3","difficulty":"Medium"},{"id":"her-v2-172","module":"v2","type":"mcq","q":"Which group has naming priority under IUPAC rules (past question, correct option D)?","options":["Alcohol over carboxylic acid","Aldehyde over carboxylic acid","Ketone over carboxylic acid","Carboxylic acid over alcohol, aldehyde or ketone"],"answer":"Carboxylic acid over alcohol, aldehyde or ketone","solution":"A: This is option A and is wrong; -COOH has higher priority.\nB: This is option B and is wrong.\nC: This is option C and is wrong.\nD: Correct: the answer key gives D; the carboxylic acid group outranks alcohol, aldehyde and ketone in IUPAC priority.","source":"Trial for 152.pdf | SLIDE 3","difficulty":"Hard"},{"id":"her-v2-173","module":"v2","type":"mcq","q":"Carboxylic acids have higher boiling points than alcohols of similar molecular weight mainly because (past question, correct option B):","options":["They form strong intermolecular hydrogen-bonded dimers","They have more polar C=O bonds","They are more acidic","They have more electrons"],"answer":"They form strong intermolecular hydrogen-bonded dimers","solution":"A: Correct: the answer key gives B; cyclic hydrogen-bonded dimers double the effective molecular association.\nB: This is option A; polarity alone does not explain the large difference.\nC: This is option C; acidity is not the cause of higher boiling point.\nD: This is option D and does not explain the trend.","source":"Trial for 152.pdf | SLIDE 3","difficulty":"Medium"},{"id":"her-v2-174","module":"v2","type":"mcq","q":"Which statement about solubility is correct (past question, correct option B)?","options":["Water solubility increases with chain length","Water solubility decreases as carbon chain length increases","Solubility is independent of chain length","All carboxylic acids are insoluble in water"],"answer":"Water solubility decreases as carbon chain length increases","solution":"A: This is option A and is wrong.\nB: Correct: the answer key gives B; the non-polar alkyl chain dominates as it grows, reducing water solubility.\nC: This is option C and is wrong.\nD: This is option D; low molecular weight acids are miscible.","source":"Trial for 152.pdf | SLIDE 3","difficulty":"Hard"},{"id":"her-v2-175","module":"v2","type":"mcq","q":"The greater acidity of carboxylic acids compared with alcohols is due to (past question, correct option B):","options":["Inductive effect only","Hydrogen bonding","Resonance stabilization of the carboxylate ion","More oxygen atoms"],"answer":"Resonance stabilization of the carboxylate ion","solution":"A: This is option A; resonance is the major factor.\nB: This is option C and is not the main reason.\nC: Correct: the answer key gives B; the negative charge is delocalised over two oxygen atoms in the carboxylate.\nD: This is option D and is incomplete without resonance.","source":"Trial for 152.pdf | SLIDE 3","difficulty":"Devil Mode"},{"id":"her-v2-176","module":"v2","type":"mcq","q":"Which substituent increases the acidity of a carboxylic acid (past question, correct option C)?","options":["-CH3","-OH","-NH2","-Cl"],"answer":"-Cl","solution":"A: This is option A; alkyl groups are electron-donating and decrease acidity.\nB: This is option B; its effect is not as strong as halogen withdrawal in this question.\nC: This is option D; amino groups are electron-donating.\nD: Correct: the answer key gives C; chlorine is electron-withdrawing and stabilises the conjugate base.","source":"Trial for 152.pdf | SLIDE 3","difficulty":"Medium"},{"id":"her-v2-177","module":"v2","type":"mcq","q":"Which reagent oxidizes an aldehyde to a carboxylic acid without affecting alcohols (past question, correct option C)?","options":["Tollens' reagent (Ag(NH3)2OH)","LiAlH4, a strong reducing agent","SOCl2, an acid-chloride forming reagent","PCl5, a chlorinating reagent"],"answer":"Tollens' reagent (Ag(NH3)2OH)","solution":"A: Correct: the answer key gives C; Tollens' reagent is a mild oxidant selective for aldehydes.\nB: This is option A and is a reducing agent.\nC: This is option B and converts acids to acid chlorides.\nD: This is option D and chlorinates alcohols/acids.","source":"Trial for 152.pdf | SLIDE 3","difficulty":"Hard"},{"id":"her-v2-178","module":"v2","type":"mcq","q":"Primary and secondary alkyl groups attached directly to a benzene ring can be oxidized to -COOH by (past question, correct option B):","options":["NaBH4","KMnO4","H2","SOCl2"],"answer":"KMnO4","solution":"A: This is option A and is a reducing agent.\nB: Correct: the answer key gives B; hot alkaline KMnO4 oxidises any benzylic carbon bearing hydrogen to -COOH.\nC: This is option C and is used for hydrogenation.\nD: This is option D and forms acid chlorides.","source":"Trial for 152.pdf | SLIDE 3","difficulty":"Medium"},{"id":"her-v2-179","module":"v2","type":"mcq","q":"What is the main product when acetone reacts with HCN (past question, correct option A)?","options":["Alcohol","Carboxylic acid","Cyanohydrin","Aldol"],"answer":"Cyanohydrin","solution":"A: This is option B; a cyanohydrin contains both -OH and -CN.\nB: This is option C and is not formed directly.\nC: Correct: the answer key gives A; HCN adds across the carbonyl to give acetone cyanohydrin.\nD: This is option D; aldol products need an enolisable aldehyde/ketone under base.","source":"Trial for 152.pdf | SLIDE 6","difficulty":"Hard"},{"id":"her-v2-180","module":"v2","type":"mcq","q":"The product formed when acetaldehyde reacts with excess H2 in the presence of Ni is (past question, correct option A):","options":["Ethanoic acid","Propan-1-ol","Methanol","Ethanol"],"answer":"Ethanol","solution":"A: This is option B; hydrogenation does not oxidise.\nB: This is option C; the carbon skeleton has two carbons, not three.\nC: This is option D; the carbonyl carbon is retained.\nD: Correct: the answer key gives A; catalytic hydrogenation of acetaldehyde reduces it to ethanol.","source":"Trial for 152.pdf | SLIDE 7","difficulty":"Devil Mode"},{"id":"her-v2-181","module":"v2","type":"mcq","q":"Which test distinguishes aldehydes from ketones (past question, correct option D)?","options":["Tollens' test","Fehling's test","Brady's test (2,4-DNP)","Iodoform test"],"answer":"Tollens' test","solution":"A: Correct: the answer key gives D; Tollens' reagent oxidises aldehydes but not ketones, giving a silver mirror.\nB: This is option A; Fehling's works for aliphatic aldehydes but the key selects Tollens'.\nC: This is option B; both aldehydes and ketones give a positive 2,4-DNP test.\nD: This is option C; it detects methyl ketones and some alcohols.","source":"Trial for 152.pdf | SLIDE 7","difficulty":"Medium"},{"id":"her-v2-182","module":"v2","type":"mcq","q":"Which carbonyl compound has the highest reactivity toward nucleophiles (past question, correct option A)?","options":["Acetaldehyde","Formaldehyde","Acetone","Benzophenone"],"answer":"Formaldehyde","solution":"A: This is option B; one alkyl group reduces reactivity slightly.\nB: Correct: the answer key gives A; formaldehyde has two hydrogens, minimal steric hindrance and the most electrophilic carbonyl carbon.\nC: This is option C; two alkyl groups reduce electrophilicity.\nD: This is option D; bulky phenyl groups greatly reduce reactivity.","source":"Trial for 152.pdf | SLIDE 7","difficulty":"Hard"},{"id":"her-v2-183","module":"v2","type":"mcq","q":"Which is the correct general formula for aldehydes (past question, correct option A)?","options":["R-CO-R'","R-COOH","R-CHO","R-COOR'"],"answer":"R-CHO","solution":"A: This is option B, the general formula for ketones.\nB: This is option C, the formula for carboxylic acids.\nC: Correct: the answer key gives A; aldehydes have at least one hydrogen on the carbonyl carbon.\nD: This is option D, the formula for esters.","source":"Trial for 152.pdf | SLIDE 7","difficulty":"Medium"},{"id":"her-v2-184","module":"v2","type":"mcq","q":"The product formed when benzaldehyde reacts with excess H2 in the presence of Ni is (past question, correct option D):","options":["Ethanol","Ethanoic acid","Phenol","Benzyl alcohol"],"answer":"Benzyl alcohol","solution":"A: This is option A; benzaldehyde has seven carbons.\nB: This is option B; reduction does not give a two-carbon acid.\nC: This is option C; the -CHO becomes -CH2OH, not -OH on the ring.\nD: Correct: the answer key gives D; hydrogenation of the aldehyde group gives benzyl alcohol while the ring is retained.","source":"Trial for 152.pdf | SLIDE 7","difficulty":"Hard"},{"id":"her-v2-185","module":"v2","type":"mcq","q":"Which solvent is most suitable for preparing a Grignard reagent (past question, correct option C)?","options":["Diethyl ether","Water","Ethanol","Acetone"],"answer":"Diethyl ether","solution":"A: Correct: the answer key gives C; anhydrous ether stabilises the Grignard reagent, whereas protic solvents destroy it.\nB: This is option A; water destroys Grignard reagents.\nC: This is option B; the acidic OH proton destroys the reagent.\nD: This is option D; the carbonyl would react with the Grignard reagent.","source":"Trial for 152.pdf | SLIDE 7","difficulty":"Devil Mode"},{"id":"her-v2-186","module":"v2","type":"mcq","q":"Which compound cannot be used to prepare a Grignard reagent (past question, correct option C)?","options":["CH3CH2Br","CH3OH","C6H5Cl","CH2=CHBr"],"answer":"CH3OH","solution":"A: This is option A; ethyl bromide forms ethylmagnesium bromide.\nB: Correct: the answer key gives C; methanol is protic and would quench the Grignard reagent immediately.\nC: This is option B; aryl chlorides can form Grignard reagents under suitable conditions.\nD: This is option D; vinyl bromide can form a Grignard reagent.","source":"Trial for 152.pdf | SLIDE 7","difficulty":"Medium"},{"id":"her-v2-187","module":"v2","type":"mcq","q":"What is the general structure of an alkyl halide (past question, correct option B)?","options":["R-OH","R-NH2","R-X","R-COOH"],"answer":"R-X","solution":"A: This is option A, the formula for alcohols.\nB: This is option C, the formula for amines.\nC: Correct: the answer key gives B; alkyl halides have the formula R-X where X is a halogen.\nD: This is option D, the formula for carboxylic acids.","source":"Trial for 152.pdf | SLIDE 8","difficulty":"Hard"},{"id":"her-v2-188","module":"v2","type":"mcq","q":"Which alkyl halide is least likely to undergo an SN2 reaction (past question, correct option C)?","options":["CH3CH2Br","CH3CH2CH2Cl","CH3Br","(CH3)3CBr"],"answer":"(CH3)3CBr","solution":"A: This is option A; primary halides react readily by SN2.\nB: This is option B; primary halides are good SN2 substrates.\nC: This is option D; methyl halides are the fastest SN2 substrates.\nD: Correct: the answer key gives C; tert-butyl bromide is too sterically hindered for backside attack.","source":"Trial for 152.pdf | SLIDE 8","difficulty":"Medium"},{"id":"her-v2-189","module":"v2","type":"mcq","q":"Which conditions favour an E2 reaction for a secondary alkyl halide such as 2-chlorobutane (past question, correct option B)?","options":["Strong base in an aprotic solvent","Weak base, protic solvent","Weak nucleophile, protic solvent","Strong nucleophile, protic solvent"],"answer":"Strong base in an aprotic solvent","solution":"A: Correct: the answer key gives B; strong bases in aprotic solvents promote concerted E2 elimination.\nB: This is option A and favours SN1/E1.\nC: This is option C and favours SN1.\nD: This is option D and is less favourable for E2.","source":"Trial for 152.pdf | SLIDE 8","difficulty":"Hard"},{"id":"her-v2-190","module":"v2","type":"mcq","q":"What is the effect of using a polar protic solvent in an SN2 reaction (past question, correct option B)?","options":["It increases the rate by stabilizing the transition state","It decreases the reaction rate by solvating the nucleophile","It has no effect on the rate","It converts the reaction to SN1"],"answer":"It decreases the reaction rate by solvating the nucleophile","solution":"A: This is option A and is wrong for protic solvents in SN2.\nB: Correct: the answer key gives B; protic solvents hydrogen-bond to the nucleophile and reduce its reactivity.\nC: This is option C and is wrong.\nD: This is option D; solvent alone does not change the mechanism.","source":"Trial for 152.pdf | SLIDE 8","difficulty":"Devil Mode"},{"id":"her-v2-191","module":"v2","type":"mcq","q":"Which is a stronger base: acetamide or ethanamine, according to the trial solutions?","options":["Acetamide","Both are equally strong","Ethanamine","Neither is basic"],"answer":"Ethanamine","solution":"A: The amide lone pair is resonance-delocalised and less available for protonation.\nB: Resonance makes acetamide far weaker.\nC: Correct: the trial solutions state ethanamine is the stronger base because acetamide's nitrogen lone pair is delocalised into the C=O by resonance.\nD: Ethanamine is a typical basic amine.","source":"Trial152 Solutions.pdf | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-192","module":"v2","type":"mcq","q":"The most stable conformer of butane is ______.","options":["Eclipsed (0 degrees)","Gauche (60 degrees)","Fully eclipsed methyl-methyl","Anti (staggered, 180 degrees between methyl groups)"],"answer":"Anti (staggered, 180 degrees between methyl groups)","solution":"A: This is the least stable conformer due to torsional and steric strain.\nB: Gauche is staggered but has steric strain, less stable than anti.\nC: That is the highest-energy conformation.\nD: Correct: the trial solutions state the most stable butane conformer is anti-staggered and the least stable is eclipsed.","source":"Trial152 Solutions.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-193","module":"v2","type":"mcq","q":"Aspirin (o-acetylsalicylic acid) is prepared from benzene by which route in the trial solutions?","options":["Benzene to phenol to salicylic acid (Kolbe-Schmitt) to acetylated aspirin","Benzene to toluene to benzoic acid directly","Benzene directly to aspirin by nitration","Benzene to aniline to aspirin"],"answer":"Benzene to phenol to salicylic acid (Kolbe-Schmitt) to acetylated aspirin","solution":"A: Correct: the solutions give benzene -> phenol -> Kolbe-Schmitt -> salicylic acid -> acetylation -> aspirin.\nB: That route gives benzoic acid, not acetylsalicylic acid.\nC: Nitration gives nitrobenzene, not aspirin.\nD: Aniline is not the precursor in the given route.","source":"Trial152 Solutions.pdf | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-194","module":"v2","type":"mcq","q":"Which reaction sequence gives a carboxylic acid from a Grignard reagent (past question, correct option A)?","options":["RMgX then O2 then H3O+","RMgX then CO2 then H3O+","RMgX then KMnO4 then H3O+","RMgX then SOCl2 then H3O+"],"answer":"RMgX then CO2 then H3O+","solution":"A: This is option B and gives an alcohol/phenol-type product.\nB: Correct: the answer key gives A; carbonation of a Grignard reagent followed by acidification yields a carboxylic acid.\nC: This is option C and is not the standard carbonation route.\nD: This is option D and does not give a carboxylic acid.","source":"Trial for 152.pdf | SLIDE 7","difficulty":"Hard"},{"id":"her-v2-195","module":"v2","type":"mcq","q":"Metabolism is defined as ______.","options":["only the breakdown of glucose","the physical process of chewing","the sum of all chemical reactions after digestion and absorption","the excretion of waste only"],"answer":"the sum of all chemical reactions after digestion and absorption","solution":"A: Metabolism includes both anabolic and catabolic reactions, not just glucose breakdown.\nB: Chewing is mastication, not metabolism.\nC: Correct: the carbohydrate metabolism summary defines metabolism as the sum of all chemical reactions after digestion and absorption.\nD: Excretion is elimination, not the sum of metabolic reactions.","source":"Carbohydrate Metabolism summary.pdf | SLIDE 1","difficulty":"Devil Mode"},{"id":"her-v2-196","module":"v2","type":"mcq","q":"Anabolic pathways are ______.","options":["breaking down pathways that release energy","pathways with both roles such as the TCA cycle","only found in plants","building pathways that require energy (endergonic)"],"answer":"building pathways that require energy (endergonic)","solution":"A: That describes catabolic pathways.\nB: That describes amphibolic pathways.\nC: Anabolic pathways occur in all organisms.\nD: Correct: the summary states anabolic pathways synthesize macromolecules and are endergonic.","source":"Carbohydrate Metabolism summary.pdf | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-197","module":"v2","type":"mcq","q":"Which pathway is given as an example of an amphibolic pathway?","options":["TCA cycle","Glycolysis only","Pentose phosphate pathway","Glycogenolysis only"],"answer":"TCA cycle","solution":"A: Correct: the summary states the TCA cycle is amphibolic, functioning in both anabolic and catabolic roles.\nB: Glycolysis is catabolic, not given as the amphibolic example.\nC: PPP is mainly anabolic, providing ribose and NADPH.\nD: Glycogenolysis is catabolic.","source":"Carbohydrate Metabolism summary.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-198","module":"v2","type":"mcq","q":"Glycolysis takes place in the ______.","options":["mitochondria","cytosol of all cells","nucleus","rough endoplasmic reticulum"],"answer":"cytosol of all cells","solution":"A: Mitochondria host the TCA cycle and oxidative phosphorylation, not glycolysis.\nB: Correct: the summary states glycolysis occurs in the cytosol of both prokaryotic and eukaryotic cells.\nC: The nucleus is not a site of glycolysis.\nD: The RER is involved in protein synthesis, not glycolysis.","source":"Carbohydrate Metabolism summary.pdf | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-199","module":"v2","type":"mcq","q":"The net energy yield of glycolysis per glucose is ______.","options":["4 ATP and 2 NADH","2 ATP and 0 NADH","2 ATP and 2 NADH","38 ATP"],"answer":"2 ATP and 2 NADH","solution":"A: 4 ATP is the gross payoff, not the net yield.\nB: NADH is also produced in the payoff phase.\nC: Correct: the summary states glycolysis consumes 2 ATP in the preparatory phase and produces 4 ATP and 2 NADH, giving a net 2 ATP and 2 NADH.\nD: That is the total aerobic yield per glucose, not glycolysis alone.","source":"Carbohydrate Metabolism summary.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-200","module":"v2","type":"mcq","q":"Which enzyme is the rate-limiting, committed step of glycolysis?","options":["Hexokinase","Glucokinase","Pyruvate kinase","Phosphofructokinase-1 (PFK-1)"],"answer":"Phosphofructokinase-1 (PFK-1)","solution":"A: Hexokinase traps glucose as G6P but is not the committed rate-limiting step.\nB: Glucokinase is the liver isoform not inhibited by G6P.\nC: Pyruvate kinase is regulated but is not the committed step.\nD: Correct: the summary identifies PFK-1 as the rate-limiting committed step inhibited by high ATP.","source":"Carbohydrate Metabolism summary.pdf | SLIDE 2","difficulty":"Devil Mode"},{"id":"her-v2-201","module":"v2","type":"mcq","q":"Which enzyme is NOT inhibited by glucose-6-phosphate?","options":["Glucokinase (hexokinase IV)","Hexokinase I","Hexokinase II","Hexokinase III"],"answer":"Glucokinase (hexokinase IV)","solution":"A: Correct: the summary states glucokinase in liver is not inhibited by G6P, allowing hepatic glucose storage.\nB: Hexokinases I-III are feedback-inhibited by G6P.\nC: Hexokinase II is inhibited by G6P.\nD: Hexokinase III is inhibited by G6P.","source":"Carbohydrate Metabolism summary.pdf | SLIDE 2","difficulty":"Medium"},{"id":"her-v2-202","module":"v2","type":"mcq","q":"In the fed state, insulin ______.","options":["promotes gluconeogenesis in the liver","increases glucose uptake, stimulates HK and PFK and promotes glycogen synthesis","inhibits glycogen synthesis","stimulates glycogenolysis in muscle"],"answer":"increases glucose uptake, stimulates HK and PFK and promotes glycogen synthesis","solution":"A: That is glucagon's action in fasting.\nB: Correct: the summary states insulin increases glucose uptake, stimulates glycolysis and promotes glycogen synthesis.\nC: Insulin promotes glycogen synthesis.\nD: Epinephrine stimulates glycogenolysis in muscle.","source":"Carbohydrate Metabolism summary.pdf | SLIDE 2","difficulty":"Hard"},{"id":"her-v2-203","module":"v2","type":"mcq","q":"The Warburg effect describes cancer cells' reliance on ______.","options":["oxidative phosphorylation only","the pentose phosphate pathway exclusively","anaerobic glycolysis even with oxygen, with glycolysis about 10 times faster","glycogen synthesis"],"answer":"anaerobic glycolysis even with oxygen, with glycolysis about 10 times faster","solution":"A: Cancer cells rely on glycolysis even in oxygen.\nB: PPP is not the Warburg effect.\nC: Correct: the summary states cancer cells depend heavily on anaerobic glycolysis due to hypoxia and fewer mitochondria, with glycolysis ~10x faster.\nD: The Warburg effect concerns increased glycolysis, not storage.","source":"Carbohydrate Metabolism summary.pdf | SLIDE 2","difficulty":"Medium"},{"id":"her-v2-204","module":"v2","type":"mcq","q":"Galactosemia results from a defect in which enzyme?","options":["Lactase","Hexokinase","Glucokinase","Galactose-1-phosphate uridylyltransferase"],"answer":"Galactose-1-phosphate uridylyltransferase","solution":"A: Lactase deficiency causes lactose intolerance, not galactosemia.\nB: Hexokinase deficiency is not the cause of galactosemia.\nC: Glucokinase deficiency is not the cause described.\nD: Correct: the summary states galactosemia is caused by an enzyme defect in galactose-1-P uridylyltransferase.","source":"Carbohydrate Metabolism summary.pdf | SLIDE 3","difficulty":"Hard"},{"id":"her-v2-205","module":"v2","type":"mcq","q":"Glycerol enters glycolysis after conversion to ______.","options":["dihydroxyacetone phosphate (DHAP)","glucose-1-phosphate","pyruvate directly","acetyl-CoA"],"answer":"dihydroxyacetone phosphate (DHAP)","solution":"A: Correct: the summary states glycerol from lipolysis is converted to DHAP, which enters glycolysis.\nB: That is the entry point for galactose.\nC: Glycerol does not become pyruvate directly.\nD: Acetyl-CoA is not the entry point for glycerol.","source":"Carbohydrate Metabolism summary.pdf | SLIDE 3","difficulty":"Devil Mode"},{"id":"her-v2-206","module":"v2","type":"mcq","q":"The pentose phosphate pathway produces ______.","options":["ATP and pyruvate only","ribose-5-phosphate and NADPH","glucose-6-phosphate","glycogen"],"answer":"ribose-5-phosphate and NADPH","solution":"A: ATP and pyruvate are the outputs of glycolysis.\nB: Correct: the summary states PPP produces ribose-5-P for DNA/RNA and NADPH for biosynthesis and antioxidant defence.\nC: G6P is the substrate, not the product.\nD: Glycogen is produced by glycogenesis, not PPP.","source":"Carbohydrate Metabolism summary.pdf | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-207","module":"v2","type":"mcq","q":"Oxidation in biological systems is defined as ______.","options":["gain of electrons","loss of protons only","loss of electrons from a molecule","binding of oxygen only"],"answer":"loss of electrons from a molecule","solution":"A: That is reduction.\nB: Electron loss is the definition given.\nC: Correct: the biological oxidation summary defines oxidation as loss of electrons and reduction as gain of electrons.\nD: Biological oxidation may occur without molecular oxygen.","source":"Biological Oxidation summary.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-208","module":"v2","type":"mcq","q":"Which are the four main classes of oxidoreductase enzymes?","options":["Kinases, phosphatases, ligases and isomerases","Amylases, lipases, proteases and nucleases","Synthases, carboxylases, dehydratases and racemases","Oxidases, dehydrogenases, hydroperoxidases and oxygenases"],"answer":"Oxidases, dehydrogenases, hydroperoxidases and oxygenases","solution":"A: These are other enzyme classes, not oxidoreductases.\nB: These are hydrolases.\nC: These belong to other enzyme classes.\nD: Correct: the summary lists these four classes of oxidoreductases.","source":"Biological Oxidation summary.pdf | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-209","module":"v2","type":"mcq","q":"Cytochrome oxidase is inhibited by which toxins?","options":["Carbon monoxide, cyanide and hydrogen sulphide","Penicillin and aspirin","Atropine and propranolol","Vitamin C and vitamin E"],"answer":"Carbon monoxide, cyanide and hydrogen sulphide","solution":"A: Correct: the summary states cytochrome oxidase is inhibited by CO, cyanide and H2S, causing respiratory poisoning.\nB: These do not inhibit cytochrome oxidase.\nC: These act on autonomic receptors, not cytochrome oxidase.\nD: These are antioxidants, not inhibitors of cytochrome oxidase.","source":"Biological Oxidation summary.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-210","module":"v2","type":"mcq","q":"Which cofactors are used by flavoprotein oxidases?","options":["NAD+ and NADP+ only","FMN and FAD derived from riboflavin","Biotin and folate","Vitamin K and calcium"],"answer":"FMN and FAD derived from riboflavin","solution":"A: NAD/NADP are used by dehydrogenases, not flavoprotein oxidases.\nB: Correct: the summary states flavoprotein oxidases use FMN or FAD from riboflavin as cofactors.\nC: These are carboxylation and one-carbon cofactors.\nD: Vitamin K is for clotting factors, not flavoprotein oxidases.","source":"Biological Oxidation summary.pdf | SLIDE 1","difficulty":"Devil Mode"},{"id":"her-v2-211","module":"v2","type":"mcq","q":"Xanthine oxidase converts purines to ______.","options":["lactic acid","urea","uric acid","bilirubin"],"answer":"uric acid","solution":"A: Lactic acid is produced from pyruvate by lactate dehydrogenase.\nB: Urea is produced in the urea cycle.\nC: Correct: the summary states xanthine oxidase converts purines to uric acid and contains molybdenum.\nD: Bilirubin comes from haem breakdown.","source":"Biological Oxidation summary.pdf | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-212","module":"v2","type":"mcq","q":"Catalase breaks down hydrogen peroxide into ______.","options":["glucose and ATP","superoxide and nitrate","hydroxyl radicals","water and oxygen"],"answer":"water and oxygen","solution":"A: Catalase does not produce glucose or ATP.\nB: Superoxide dismutase handles superoxide, not catalase.\nC: Hydroxyl radicals are generated by H2O2 in other contexts, not the catalase products.\nD: Correct: the summary states catalase breaks H2O2 into water and oxygen and is one of the fastest enzymes known.","source":"Biological Oxidation summary.pdf | SLIDE 2","difficulty":"Hard"},{"id":"her-v2-213","module":"v2","type":"mcq","q":"Superoxide dismutase protects cells by ______.","options":["converting superoxide radicals into hydrogen peroxide and oxygen","converting H2O2 into water only","incorporating oxygen into substrates","transferring hydrogen to NAD+"],"answer":"converting superoxide radicals into hydrogen peroxide and oxygen","solution":"A: Correct: the summary states SOD converts superoxide radicals to H2O2 and O2, preventing free radical chain reactions.\nB: That is catalase's role.\nC: That is oxygenase function.\nD: That is dehydrogenase function.","source":"Biological Oxidation summary.pdf | SLIDE 3","difficulty":"Medium"},{"id":"her-v2-214","module":"v2","type":"mcq","q":"Cytochrome P450 enzymes are responsible for approximately what share of drug modification and degradation?","options":["10%","75%","25%","100%"],"answer":"75%","solution":"A: This greatly understates the role of P450 in drug metabolism.\nB: Correct: the summary states P450 enzymes are responsible for about 75% of drug modification and degradation.\nC: The figure given is about 75%.\nD: Other enzymes also contribute, so it is not 100%.","source":"Biological Oxidation summary.pdf | SLIDE 3","difficulty":"Hard"},{"id":"her-v2-215","module":"v2","type":"mcq","q":"Dioxygenases differ from monooxygenases in that they ______.","options":["add only one oxygen atom","do not require any oxygen","add both oxygen atoms of O2 to the substrate","only act in the mitochondria"],"answer":"add both oxygen atoms of O2 to the substrate","solution":"A: That describes monooxygenases.\nB: Both classes incorporate oxygen.\nC: Correct: the summary states dioxygenases add both oxygen atoms while monooxygenases add one and reduce the other to water.\nD: Localization is not the defining difference.","source":"Biological Oxidation summary.pdf | SLIDE 2","difficulty":"Devil Mode"},{"id":"her-v2-216","module":"v2","type":"mcq","q":"Lipids are primarily composed of ______.","options":["nitrogen and sulphur only","carbon, hydrogen and nitrogen","only phosphorus and oxygen","carbon, hydrogen and oxygen and are mostly nonpolar"],"answer":"carbon, hydrogen and oxygen and are mostly nonpolar","solution":"A: These are not the main elements of lipids.\nB: Nitrogen is not a defining element of simple lipids.\nC: Phospholipids contain phosphorus but lipids generally are C, H and O.\nD: Correct: the lipids summary states lipids are nonpolar biological substances made from carbon, hydrogen and oxygen.","source":"Lipids summary.pdf | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-217","module":"v2","type":"mcq","q":"Fats differ from oils in that fats are ______.","options":["solid at room temperature while oils are liquid","always liquid at room temperature","always of plant origin only","incapable of being oxidized"],"answer":"solid at room temperature while oils are liquid","solution":"A: Correct: the summary states fats are solid and oils liquid at room temperature.\nB: That describes oils.\nC: Fats are generally animal origin but the difference given is physical state.\nD: Lipids can be oxidized.","source":"Lipids summary.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-218","module":"v2","type":"mcq","q":"Lipid digestion begins in the stomach with which enzymes?","options":["Pancreatic lipase and bile salts","Lingual and gastric lipases","Amylase and trypsin","Lipoprotein lipase"],"answer":"Lingual and gastric lipases","solution":"A: These act in the small intestine.\nB: Correct: the summary states lipid digestion begins in the stomach with lingual and gastric lipases.\nC: Amylase digests starch and trypsin digests protein.\nD: That acts on lipoproteins in capillaries.","source":"Lipids summary.pdf | SLIDE 2","difficulty":"Medium"},{"id":"her-v2-219","module":"v2","type":"mcq","q":"Which two fatty acids are essential and must be obtained from the diet?","options":["Oleic acid and stearic acid","Palmitic acid and myristic acid","Linoleic acid and linolenic acid","Arachidonic acid and DHA"],"answer":"Linoleic acid and linolenic acid","solution":"A: These can be synthesized by the body.\nB: These are non-essential saturated fatty acids.\nC: Correct: the summary names linoleic and linolenic acids as essential fatty acids.\nD: Arachidonic can be synthesised from linoleic acid in adults.","source":"Lipids summary.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-220","module":"v2","type":"mcq","q":"A cis double bond in a fatty acid causes ______.","options":["a straight chain that packs tightly","a longer chain length","removal of hydrogen only","a kinked chain that prevents tight packing and stays liquid at room temperature"],"answer":"a kinked chain that prevents tight packing and stays liquid at room temperature","solution":"A: That describes saturated or trans fatty acids.\nB: Cis bonds do not change chain length.\nC: Hydrogen removal is part of unsaturation, but the structural consequence is the kink.\nD: Correct: the summary states cis double bonds cause kinks that prevent tight packing, keeping oils liquid.","source":"Lipids summary.pdf | SLIDE 3","difficulty":"Devil Mode"},{"id":"her-v2-221","module":"v2","type":"mcq","q":"Which lipoprotein is responsible for reverse cholesterol transport?","options":["HDL","VLDL","LDL","IDL"],"answer":"HDL","solution":"A: Correct: the summary states HDL removes cholesterol from tissues (reverse cholesterol transport).\nB: VLDL carries endogenous triglycerides.\nC: LDL carries most blood cholesterol to tissues.\nD: IDL is an intermediary between VLDL and LDL.","source":"Lipids summary.pdf | SLIDE 4","difficulty":"Medium"},{"id":"her-v2-222","module":"v2","type":"mcq","q":"Atherogenic dyslipidemia is characterized by ______.","options":["high HDL and low LDL","high triglycerides, low HDL and small dense LDL particles","low triglycerides only","high HDL and high VLDL"],"answer":"high triglycerides, low HDL and small dense LDL particles","solution":"A: That is a protective pattern, not atherogenic.\nB: Correct: the summary defines atherogenic dyslipidemia as high TG, low HDL and moderate/small dense LDL.\nC: Triglycerides are elevated in this pattern.\nD: HDL is low in the atherogenic pattern.","source":"Lipids summary.pdf | SLIDE 4","difficulty":"Hard"},{"id":"her-v2-223","module":"v2","type":"mcq","q":"Vitamins are classified into which two groups?","options":["Essential and non-essential","Animal and plant vitamins","Water-soluble (B-complex and C) and fat-soluble (A, D, E, K)","Primary and secondary vitamins"],"answer":"Water-soluble (B-complex and C) and fat-soluble (A, D, E, K)","solution":"A: All vitamins are essential micronutrients.\nB: Source is not the classification basis given.\nC: Correct: the vitamins summary classifies vitamins as water-soluble (B complex, C) and fat-soluble (A, D, E, K).\nD: No such classification is described.","source":"Vitamins summary.pdf | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-224","module":"v2","type":"mcq","q":"Which vitamins can the body synthesize under suitable conditions?","options":["Vitamins A, C and K","All B vitamins","Vitamin C only","Vitamin D, niacin from tryptophan and biotin from gut bacteria"],"answer":"Vitamin D, niacin from tryptophan and biotin from gut bacteria","solution":"A: These must come from the diet.\nB: Most B vitamins cannot be synthesized by humans.\nC: Humans cannot synthesize vitamin C.\nD: Correct: the summary states the body can usually not synthesize vitamins except vitamin D, niacin from tryptophan and biotin from gut flora.","source":"Vitamins summary.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-225","module":"v2","type":"mcq","q":"Vitamin A deficiency causes ______.","options":["night blindness, dry eyes and skin, stunted growth","Scurvy from vitamin C deficiency","Rickets from vitamin D deficiency","Pellagra from niacin deficiency"],"answer":"night blindness, dry eyes and skin, stunted growth","solution":"A: Correct: the summary lists night blindness, dry eyes/skin and stunted growth as vitamin A deficiency effects.\nB: Scurvy is vitamin C deficiency.\nC: Rickets is vitamin D deficiency in children.\nD: Pellagra is niacin (B3) deficiency.","source":"Vitamins summary.pdf | SLIDE 1","difficulty":"Devil Mode"},{"id":"her-v2-226","module":"v2","type":"mcq","q":"Vitamin B1 (thiamine) deficiency causes ______.","options":["pellagra","beriberi and Wernicke-Korsakoff syndrome","pernicious anaemia","Scurvy from vitamin C deficiency"],"answer":"beriberi and Wernicke-Korsakoff syndrome","solution":"A: Pellagra is niacin deficiency.\nB: Correct: the summary states thiamine deficiency causes beriberi and, in alcoholics, Wernicke-Korsakoff syndrome.\nC: Pernicious anaemia is B12 deficiency.\nD: Scurvy is vitamin C deficiency.","source":"Vitamins summary.pdf | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-227","module":"v2","type":"mcq","q":"Pellagra, characterized by the three D's, results from deficiency of ______.","options":["Thiamine (B1)","Riboflavin (B2)","Niacin (B3)","Folate (B9)"],"answer":"Niacin (B3)","solution":"A: Thiamine deficiency causes beriberi.\nB: Riboflavin deficiency causes cheilitis and glossitis.\nC: Correct: the summary states niacin deficiency causes pellagra with dermatitis, diarrhoea and dementia.\nD: Folate deficiency causes megaloblastic anaemia.","source":"Vitamins summary.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-228","module":"v2","type":"mcq","q":"Vitamin B12 deficiency causes ______.","options":["megaloblastic anaemia from folate deficiency only","Burning feet syndrome of B5 deficiency","Scurvy from vitamin C deficiency","pernicious anaemia and neurological damage"],"answer":"pernicious anaemia and neurological damage","solution":"A: Folate deficiency also causes megaloblastic anaemia, but B12 deficiency specifically causes pernicious anaemia.\nB: That is B5 deficiency.\nC: Scurvy is vitamin C deficiency.\nD: Correct: the summary states B12 deficiency causes pernicious anaemia due to lack of intrinsic factor and neurological damage.","source":"Vitamins summary.pdf | SLIDE 2","difficulty":"Medium"},{"id":"her-v2-229","module":"v2","type":"mcq","q":"Vitamin C is required for ______.","options":["collagen synthesis, antioxidant defence and enhanced iron absorption","blood clotting factor synthesis","calcium absorption only","visual pigment formation"],"answer":"collagen synthesis, antioxidant defence and enhanced iron absorption","solution":"A: Correct: the summary lists collagen synthesis, antioxidant action, immunity and enhanced iron absorption for vitamin C.\nB: Vitamin K is required for clotting factors.\nC: Vitamin D regulates calcium absorption.\nD: Vitamin A forms rhodopsin for vision.","source":"Vitamins summary.pdf | SLIDE 2","difficulty":"Hard"},{"id":"her-v2-230","module":"v2","type":"mcq","q":"Vitamin D deficiency causes ______.","options":["scurvy in adults","rickets in children and osteomalacia in adults","night blindness","beriberi"],"answer":"rickets in children and osteomalacia in adults","solution":"A: Scurvy is vitamin C deficiency.\nB: Correct: the summary states vitamin D deficiency causes rickets in children and osteomalacia in adults.\nC: Night blindness is vitamin A deficiency.\nD: Beriberi is vitamin B1 deficiency.","source":"Vitamins summary.pdf | SLIDE 2","difficulty":"Devil Mode"},{"id":"her-v2-231","module":"v2","type":"mcq","q":"Vitamin K is essential for ______.","options":["collagen cross-linking","visual cycle","Blood clotting factors and bone osteocalcin synthesis","energy metabolism coenzymes"],"answer":"Blood clotting factors and bone osteocalcin synthesis","solution":"A: Vitamin C is needed for collagen synthesis.\nB: Vitamin A is needed for vision.\nC: Correct: the summary states vitamin K is essential for clotting factor formation and osteocalcin synthesis.\nD: B vitamins serve this role.","source":"Vitamins summary.pdf | SLIDE 3","difficulty":"Medium"},{"id":"her-v2-232","module":"v2","type":"mcq","q":"Which vitamin's toxicity is described as causing liver damage, bone loss and teratogenic effects?","options":["Vitamin C","Vitamin B2","Vitamin B12","Vitamin A"],"answer":"Vitamin A","solution":"A: Vitamin C toxicity is rare, causing diarrhoea and kidney stones.\nB: Riboflavin toxicity is negligible due to limited absorption.\nC: No toxicity is known for B12.\nD: Correct: the summary lists liver damage, bone loss and teratogenic effects in pregnancy as vitamin A toxicity.","source":"Vitamins summary.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-233","module":"v2","type":"mcq","q":"Enzymes are described in the PHARM 186 enzyme slides primarily as ______.","options":["biological catalysts that speed up reactions without being consumed","reactants consumed in metabolism","structural components of cell membranes only","hormones that act at a distance"],"answer":"biological catalysts that speed up reactions without being consumed","solution":"A: Correct: enzymes are protein biological catalysts; this is consistent with the enzyme topic in the course slides.\nB: Catalysts are not consumed in the reactions they catalyse.\nC: Membranes are mainly lipids and proteins, not enzymes.\nD: Hormones are signalling molecules, not enzymes.","source":"Enzymes.pdf | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-234","module":"v2","type":"mcq","q":"Physiology is defined as ______.","options":["the study of diseases only","the study of life's physical and chemical mechanisms","the study of body structures only","the study of drugs only"],"answer":"the study of life's physical and chemical mechanisms","solution":"A: That is pathology.\nB: Correct: the general physiology summary defines physiology as the study of life's physical and chemical mechanisms.\nC: That is anatomy.\nD: That is pharmacology.","source":"GENERAL PHYSIOLOGY SUMMARY.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-235","module":"v2","type":"mcq","q":"How many levels of biological organization are listed in the general physiology summary?","options":["Four","Five","Six","Seven"],"answer":"Six","solution":"A: Only four would omit tissue and organ system levels.\nB: Five would omit one of the six listed levels.\nC: Correct: the summary lists chemical, cellular, tissue, organ, organ system and organism (six levels).\nD: The summary lists six, not seven.","source":"GENERAL PHYSIOLOGY SUMMARY.pdf | SLIDE 1","difficulty":"Devil Mode"},{"id":"her-v2-236","module":"v2","type":"mcq","q":"Total body water in adults is approximately what percentage of body weight?","options":["40%","70%","90%","60%"],"answer":"60%","solution":"A: 40% is roughly the intracellular fraction of total body weight, not TBW.\nB: 70-80% refers to reliance on traditional medicine, not body water.\nC: TBW is about 60%, not 90%.\nD: Correct: the summary states TBW is about 60% of body weight in adults.","source":"GENERAL PHYSIOLOGY SUMMARY.pdf | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-237","module":"v2","type":"mcq","q":"What fraction of total body water is intracellular fluid?","options":["Two thirds","One third","One half","One quarter"],"answer":"Two thirds","solution":"A: Correct: the summary states ICF is 2/3 of TBW and ECF is 1/3.\nB: One third is the extracellular fraction.\nC: The split is two thirds to one third.\nD: The summary says 2/3, not 1/4.","source":"GENERAL PHYSIOLOGY SUMMARY.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-238","module":"v2","type":"mcq","q":"Which transport mechanism moves substances against a concentration gradient using ATP?","options":["Simple diffusion","Active transport","Facilitated diffusion","Osmosis"],"answer":"Active transport","solution":"A: Simple diffusion moves down a gradient without ATP.\nB: Correct: the summary states active transport moves substances against gradients using ATP, including the Na+/K+ pump.\nC: Facilitated diffusion is passive and carrier-mediated.\nD: Osmosis is passive water movement.","source":"GENERAL PHYSIOLOGY SUMMARY.pdf | SLIDE 2","difficulty":"Medium"},{"id":"her-v2-239","module":"v2","type":"mcq","q":"Which of the following is a form of vesicular transport?","options":["Filtration","Symport","Endocytosis","Simple diffusion"],"answer":"Endocytosis","solution":"A: Filtration is a passive transport process.\nB: Symport is secondary active transport.\nC: Correct: the summary lists endocytosis (phagocytosis, pinocytosis, receptor-mediated), exocytosis and transcytosis as vesicular transport.\nD: Simple diffusion is passive, not vesicular.","source":"GENERAL PHYSIOLOGY SUMMARY.pdf | SLIDE 2","difficulty":"Hard"},{"id":"her-v2-240","module":"v2","type":"mcq","q":"Which system and endocrine pair are the primary controllers of homeostasis?","options":["Digestive and respiratory systems","Reproductive and skeletal systems","Integumentary and muscular systems","Nervous and endocrine systems"],"answer":"Nervous and endocrine systems","solution":"A: These are not the primary controllers of homeostasis.\nB: Reproductive is not essential for individual homeostasis.\nC: These are effectors, not the primary controllers.\nD: Correct: the homeostasis summary states the nervous and endocrine systems are the primary controllers.","source":"Homeo summary.pdf | SLIDE 1","difficulty":"Devil Mode"},{"id":"her-v2-241","module":"v2","type":"mcq","q":"The term homeostasis was coined by ______.","options":["Walter Cannon in 1932","Claude Bernard","Hippocrates","Walter Cannon in 1948"],"answer":"Walter Cannon in 1932","solution":"A: Correct: the summary states homeostasis was coined by Walter Cannon in 1932, building on Claude Bernard's milieu intérieur.\nB: Bernard introduced the idea of milieu intérieur, not the term homeostasis.\nC: Hippocrates is associated with the humours, not homeostasis.\nD: Cannon coined the term in 1932; 1948 is the WHO health definition year.","source":"Homeo summary.pdf | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-242","module":"v2","type":"mcq","q":"Which is the main mechanism of homeostatic control?","options":["Positive feedback","Negative feedback","Feedforward control","No feedback"],"answer":"Negative feedback","solution":"A: Positive feedback amplifies responses, e.g. childbirth and clotting.\nB: Correct: the summary states negative feedback is the main mechanism, reversing deviations such as in temperature and blood glucose.\nC: Feedforward anticipates change, e.g. heart rate before exercise.\nD: Homeostasis relies heavily on feedback mechanisms.","source":"Homeo summary.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-243","module":"v2","type":"mcq","q":"Which of the following is an example of positive feedback?","options":["Thermoregulation","Blood glucose regulation by insulin","Childbirth (oxytocin) and blood clotting","Water balance via ADH"],"answer":"Childbirth (oxytocin) and blood clotting","solution":"A: Thermoregulation is negative feedback.\nB: Insulin/glucagon regulation is negative feedback.\nC: Correct: the summary lists childbirth, blood clotting and milk ejection as positive feedback examples.\nD: Osmoregulation via ADH is negative feedback.","source":"Homeo summary.pdf | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-244","module":"v2","type":"mcq","q":"Which component of a homeostatic control system compares a change against a set point?","options":["Sensor/receptor","Effector","Efferent pathway only","Control centre"],"answer":"Control centre","solution":"A: The sensor detects changes.\nB: The effector acts to restore balance.\nC: The pathway carries signals, not comparison.\nD: Correct: the summary lists sensor/receptor, control centre (compares against set point) and effector.","source":"Homeo summary.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-245","module":"v2","type":"mcq","q":"The three main functions of the nervous system are ______.","options":["sensory input, integration and motor output","digestion, absorption and excretion","support, protection and movement only","secretion, excretion and reproduction"],"answer":"sensory input, integration and motor output","solution":"A: Correct: the nervous summary lists sensory input, integration and motor output.\nB: These are digestive functions.\nC: These are skeletal/muscular functions.\nD: These are not the listed nervous system functions.","source":"Nervous summary.pdf | SLIDE 1","difficulty":"Devil Mode"},{"id":"her-v2-246","module":"v2","type":"mcq"
