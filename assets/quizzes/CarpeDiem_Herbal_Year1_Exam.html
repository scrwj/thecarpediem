,"q":"Which cells myelinate axons in the PNS?","options":["Oligodendrocytes","Schwann cells","Astrocytes","Microglia"],"answer":"Schwann cells","solution":"A: Oligodendrocytes myelinate CNS axons.\nB: Correct: the nervous summary states Schwann cells myelinate in the PNS, while oligodendrocytes myelinate in the CNS.\nC: Astrocytes support and form the blood-brain barrier.\nD: Microglia are phagocytes.","source":"Nervous summary.pdf | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-247","module":"v2","type":"mcq","q":"The resting membrane potential of a neuron is approximately ______.","options":["0 mV","+30 mV","-70 mV","-30 mV"],"answer":"-70 mV","solution":"A: The membrane is polarised, not at zero.\nB: That is near the peak of an action potential.\nC: Correct: the nervous summary states RMP is about -70 mV, maintained by ion channels and the Na+/K+ pump.\nD: That is closer to threshold, not the resting potential.","source":"Nervous summary.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-248","module":"v2","type":"mcq","q":"During an action potential, depolarization is caused by ______.","options":["K+ efflux","Cl- influx","Ca2+ efflux","Na+ influx"],"answer":"Na+ influx","solution":"A: K+ efflux causes repolarization.\nB: Chloride influx is associated with inhibitory signals.\nC: Calcium influx, not efflux, triggers transmitter release.\nD: Correct: the nervous summary lists depolarization (Na+ influx), repolarization (K+ efflux) and hyperpolarization.","source":"Nervous summary.pdf | SLIDE 2","difficulty":"Medium"},{"id":"her-v2-249","module":"v2","type":"mcq","q":"During the absolute refractory period ______.","options":["no action potential can be generated","a strong stimulus can generate an AP","the membrane is hyperpolarized permanently","the neuron is resting normally"],"answer":"no action potential can be generated","solution":"A: Correct: the nervous summary states no AP is possible during the absolute refractory period.\nB: That describes the relative refractory period.\nC: Hyperpolarization is brief.\nD: The refractory period follows an AP.","source":"Nervous summary.pdf | SLIDE 2","difficulty":"Hard"},{"id":"her-v2-250","module":"v2","type":"mcq","q":"Saltatory conduction occurs in ______.","options":["unmyelinated axons only","myelinated axons, jumping from node to node","muscle fibres only","the synapse only"],"answer":"myelinated axons, jumping from node to node","solution":"A: Unmyelinated axons conduct continuously and more slowly.\nB: Correct: the nervous summary states saltatory conduction in myelinated axons is faster and jumps node to node.\nC: Muscle fibres are not neurons.\nD: Synaptic transmission is chemical, not saltatory.","source":"Nervous summary.pdf | SLIDE 2","difficulty":"Devil Mode"},{"id":"her-v2-251","module":"v2","type":"mcq","q":"Which neurotransmitter is primarily excitatory and which primarily inhibitory?","options":["GABA is excitatory; glutamate is inhibitory","Acetylcholine is always inhibitory","Glutamate is excitatory; GABA is inhibitory","Dopamine is always inhibitory"],"answer":"Glutamate is excitatory; GABA is inhibitory","solution":"A: The roles are reversed.\nB: ACh is excitatory at the neuromuscular junction.\nC: Correct: the nervous summary lists glutamate as excitatory and GABA as inhibitory.\nD: Dopamine's effect depends on the receptor.","source":"Nervous summary.pdf | SLIDE 2","difficulty":"Medium"},{"id":"her-v2-252","module":"v2","type":"mcq","q":"Which hormone lowers blood calcium levels?","options":["Parathyroid hormone (PTH)","Aldosterone","Cortisol","Calcitonin"],"answer":"Calcitonin","solution":"A: PTH raises blood calcium.\nB: Aldosterone regulates Na+/K+ balance.\nC: Cortisol is a glucocorticoid for stress response.\nD: Correct: the endocrine summary states thyroid calcitonin lowers blood calcium while PTH raises it.","source":"Endocrine System summary.pdf | SLIDE 2","difficulty":"Hard"},{"id":"her-v2-253","module":"v2","type":"mcq","q":"Which hormone is responsible for 'fight or flight' responses?","options":["Epinephrine (adrenaline)","Insulin","Melatonin","Oxytocin"],"answer":"Epinephrine (adrenaline)","solution":"A: Correct: the endocrine summary states the adrenal medulla secretes epinephrine and norepinephrine for fight-or-flight, increasing HR, BP and glucose.\nB: Insulin lowers blood glucose.\nC: Melatonin regulates circadian rhythm.\nD: Oxytocin is for labour and bonding.","source":"Endocrine System summary.pdf | SLIDE 2","difficulty":"Medium"},{"id":"her-v2-254","module":"v2","type":"mcq","q":"Insulin is secreted by which pancreatic cells?","options":["Alpha cells","Beta cells","Delta cells","F cells"],"answer":"Beta cells","solution":"A: Alpha cells secrete glucagon.\nB: Correct: the endocrine summary states beta cells secrete insulin which lowers blood glucose.\nC: Delta cells secrete somatostatin.\nD: F cells secrete pancreatic polypeptide.","source":"Endocrine System summary.pdf | SLIDE 3","difficulty":"Hard"},{"id":"her-v2-255","module":"v2","type":"mcq","q":"A permissive hormonal interaction is one where ______.","options":["hormones have opposing effects","combined effects exceed the sum of individual effects","one hormone enhances the effect of another","a hormone blocks its own receptor"],"answer":"one hormone enhances the effect of another","solution":"A: That is antagonistic, e.g. insulin vs glucagon.\nB: That is synergistic.\nC: Correct: the endocrine summary defines permissive effects as one hormone enhancing another's effect.\nD: That is not a described interaction.","source":"Endocrine System summary.pdf | SLIDE 1","difficulty":"Devil Mode"},{"id":"her-v2-256","module":"v2","type":"mcq","q":"Which gland produces melatonin?","options":["Thymus","Thyroid","Pancreas","Pineal gland"],"answer":"Pineal gland","solution":"A: The thymus produces thymosin and thymopoietin.\nB: The thyroid produces T3, T4 and calcitonin.\nC: The pancreas produces insulin, glucagon and somatostatin.\nD: Correct: the endocrine summary states the pineal gland produces melatonin for circadian rhythm and puberty timing.","source":"Endocrine System summary.pdf | SLIDE 3","difficulty":"Medium"},{"id":"her-v2-257","module":"v2","type":"mcq","q":"Which hormone is produced by the testes?","options":["Testosterone","Estrogen","Progesterone","hCG"],"answer":"Testosterone","solution":"A: Correct: the endocrine summary states the testes produce testosterone for male traits and sperm production.\nB: Estrogen is produced mainly by the ovaries.\nC: Progesterone is produced by the corpus luteum/ovaries.\nD: hCG is produced by the placenta.","source":"Endocrine System summary.pdf | SLIDE 3","difficulty":"Hard"},{"id":"her-v2-258","module":"v2","type":"mcq","q":"Oogenesis in females begins with primordial germ cells migrating from the ______.","options":["liver to the ovary","yolk sac to the ovary","bone marrow to the ovary","placenta to the uterus"],"answer":"yolk sac to the ovary","solution":"A: The yolk sac is the stated origin.\nB: Correct: the FRS summary states primordial germ cells migrate from the yolk sac to the ovary and differentiate into oogonia.\nC: Bone marrow is not the origin of primordial germ cells.\nD: The migration described is to the ovary.","source":"FRS Summary.pdf | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-259","module":"v2","type":"mcq","q":"From birth to puberty, primary oocytes are arrested in which stage?","options":["Metaphase I","Metaphase II","Prophase I","Anaphase II"],"answer":"Prophase I","solution":"A: That is not the arrest stage given.\nB: Secondary oocytes arrest in metaphase II until fertilization.\nC: Correct: the FRS summary states primary oocytes arrest in prophase I and the literal MCQ answer is B (Prophase I).\nD: That occurs only after fertilization.","source":"FRS Summary.pdf | SLIDE 3","difficulty":"Hard"},{"id":"her-v2-260","module":"v2","type":"mcq","q":"Approximately how many primary oocytes remain at puberty?","options":["200,000-2 million","7 million","400-500","40,000"],"answer":"40,000","solution":"A: That is the number at birth.\nB: That is the number produced by week 24 of fetal life.\nC: That is the number that actually ovulate in a lifetime.\nD: Correct: the FRS summary states about 40,000 remain at puberty and the literal MCQ answer is B.","source":"FRS Summary.pdf | SLIDE 3","difficulty":"Devil Mode"},{"id":"her-v2-261","module":"v2","type":"mcq","q":"Ovulation is triggered by ______.","options":["the LH surge around day 14","a rise in progesterone","FSH alone","falling estrogen only"],"answer":"the LH surge around day 14","solution":"A: Correct: the FRS summary states the Graafian follicle ruptures around day 14, triggered by the LH surge.\nB: Progesterone dominates the luteal phase after ovulation.\nC: FSH stimulates follicle growth but the surge is LH.\nD: High estrogen positive feedback causes the LH surge.","source":"FRS Summary.pdf | SLIDE 2","difficulty":"Medium"},{"id":"her-v2-262","module":"v2","type":"mcq","q":"The corpus luteum secretes all of the following EXCEPT ______ (FRS past question, answer D).","options":["Estrogen","hCG","Progesterone","Inhibin"],"answer":"hCG","solution":"A: This is option A and is secreted by the corpus luteum.\nB: Correct: the literal past question answer is D; the corpus luteum secretes estrogen, progesterone and inhibin, not hCG.\nC: This is option B and is a major corpus luteum product.\nD: This is option C and is also secreted.","source":"FRS Summary.pdf | SLIDE 4","difficulty":"Hard"},{"id":"her-v2-263","module":"v2","type":"mcq","q":"Which hormone makes cervical mucus thin and watery (FRS past question, answer B)?","options":["Progesterone","Inhibin","Estrogen","Relaxin"],"answer":"Estrogen","solution":"A: This is option A; progesterone makes mucus thick.\nB: This is option C; inhibin inhibits FSH.\nC: Correct: the literal past question answer is B; estrogen makes cervical mucus thin and watery, aiding sperm passage.\nD: This is option D; relaxin relaxes the uterus.","source":"FRS Summary.pdf | SLIDE 4","difficulty":"Medium"},{"id":"her-v2-264","module":"v2","type":"mcq","q":"Capacitation of sperm refers to (FRS past question, answer B):","options":["Acrosome enzyme release","Fusion of pronuclei","Zona pellucida binding","removal of glycoproteins and cholesterol from the sperm membrane"],"answer":"removal of glycoproteins and cholesterol from the sperm membrane","solution":"A: This is option A, the acrosome reaction.\nB: This is option C, which occurs after entry.\nC: This is option D, which follows capacitation.\nD: Correct: the literal past question answer is B; capacitation alters the sperm membrane to enable fertilization.","source":"FRS Summary.pdf | SLIDE 5","difficulty":"Hard"},{"id":"her-v2-265","module":"v2","type":"mcq","q":"Which block to polyspermy occurs first (FRS past question, answer C)?","options":["Fast block (membrane depolarization)","Slow block (cortical reaction)","Zona hardening","Pronuclear fusion"],"answer":"Fast block (membrane depolarization)","solution":"A: Correct: the literal past question answer is C; the fast block precedes the slow cortical reaction.\nB: This is option A and occurs second.\nC: This is option B and is part of the slow block.\nD: This is option D and occurs later.","source":"FRS Summary.pdf | SLIDE 5","difficulty":"Devil Mode"},{"id":"her-v2-266","module":"v2","type":"mcq","q":"A woman with primary amenorrhea has (FRS past question, answer B):","options":["No menstruation for at least 3 months","never initiated menstruation by age 15-16","Cycles longer than 36 days","Excessive bleeding during menses"],"answer":"never initiated menstruation by age 15-16","solution":"A: This is option A, secondary amenorrhea.\nB: Correct: the literal past question answer is B, matching the summary's definition of primary amenorrhea.\nC: This is option C, oligomenorrhea.\nD: This is option D, menorrhagia.","source":"FRS Summary.pdf | SLIDE 4","difficulty":"Medium"},{"id":"her-v2-267","module":"v2","type":"mcq","q":"Cycles shorter than 21 days are called ______.","options":["Oligomenorrhea","Amenorrhea","Polymenorrhea","Dysmenorrhea"],"answer":"Polymenorrhea","solution":"A: Oligomenorrhea means cycles longer than 36 days.\nB: Amenorrhea is absence of menstruation.\nC: Correct: the FRS summary defines polymenorrhea as cycles shorter than 21 days.\nD: Dysmenorrhea is painful menstruation.","source":"FRS Summary.pdf | SLIDE 2","difficulty":"Hard"},{"id":"her-v2-268","module":"v2","type":"mcq","q":"The testes are kept cooler than body temperature mainly by the ______.","options":["Dartos muscle","Tunica albuginea","Vas deferens","Pampiniform plexus (MRS past question, answer B)"],"answer":"Pampiniform plexus (MRS past question, answer B)","solution":"A: This is option A; dartos adjusts scrotal surface area.\nB: This is option C; it is the fibrous testicular coat.\nC: This is option D; it transports sperm.\nD: Correct: the literal past question answer is B; the pampiniform plexus acts as a counter-current heat exchanger.","source":"MRS Summary.pdf | SLIDE 5","difficulty":"Medium"},{"id":"her-v2-269","module":"v2","type":"mcq","q":"Sertoli cells form the blood-testis barrier and secrete ______.","options":["Inhibin and ABP","Testosterone and LH","FSH and GnRH","Prostaglandins only"],"answer":"Inhibin and ABP","solution":"A: Correct: the MRS summary states Sertoli cells form the blood-testis barrier and secrete inhibin and androgen-binding protein.\nB: Leydig cells produce testosterone in response to LH.\nC: FSH and GnRH act on Sertoli cells/Leydig cells.\nD: Prostaglandins come from seminal vesicles.","source":"MRS Summary.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-270","module":"v2","type":"mcq","q":"Testosterone is converted to dihydrotestosterone by which enzyme (MRS past question, answer C)?","options":["Aromatase","5-alpha reductase","3-beta-HSD","17-beta-HSD"],"answer":"5-alpha reductase","solution":"A: This is option A; aromatase converts testosterone to estradiol.\nB: Correct: the literal past question answer is C; 5-alpha reductase converts testosterone to DHT.\nC: This is option B; it is involved in steroid synthesis.\nD: This is option D; it acts earlier in steroidogenesis.","source":"MRS Summary.pdf | SLIDE 5","difficulty":"Devil Mode"},{"id":"her-v2-271","module":"v2","type":"mcq","q":"Which gland produces seminalplasmin (MRS past question, answer C)?","options":["Seminal vesicles","Bulbourethral glands","Prostate gland","Epididymis"],"answer":"Prostate gland","solution":"A: This is option A; they secrete fructose and prostaglandins.\nB: This is option B; they secrete alkaline mucus.\nC: Correct: the literal past question answer is C; the prostate secretes seminalplasmin, enzymes and zinc.\nD: This is option D; it stores and matures sperm.","source":"MRS Summary.pdf | SLIDE 6","difficulty":"Medium"},{"id":"her-v2-272","module":"v2","type":"mcq","q":"The primary energy source for sperm motility is ______ (MRS past question, answer B).","options":["Zinc","Citric acid","Albumin","Fructose"],"answer":"Fructose","solution":"A: This is option A; zinc is a prostatic secretion component.\nB: This is option C; citric acid is present in prostatic fluid.\nC: This is option D; albumin is a transport protein.\nD: Correct: the literal past question answer is B; fructose from seminal vesicles supports sperm motility.","source":"MRS Summary.pdf | SLIDE 6","difficulty":"Hard"},{"id":"her-v2-273","module":"v2","type":"mcq","q":"Spermatogenesis takes approximately how long (MRS past question, answer C)?","options":["74 days","24 hours","7 days","120 days"],"answer":"74 days","solution":"A: Correct: the literal past question answer is C; the MRS summary states spermatogenesis lasts about 74 days.\nB: This is option A and is far too short.\nC: This is option B and is too short.\nD: This is option D and is longer than the stated duration.","source":"MRS Summary.pdf | SLIDE 8","difficulty":"Medium"},{"id":"her-v2-274","module":"v2","type":"mcq","q":"Which muscle type is striated, involuntary and found only in the heart?","options":["Skeletal muscle","Cardiac muscle","Smooth muscle","Cardiac and smooth together"],"answer":"Cardiac muscle","solution":"A: Skeletal muscle is striated but voluntary.\nB: Correct: the muscle summary classifies cardiac muscle as striated, involuntary and located in the heart only.\nC: Smooth muscle is involuntary but non-striated.\nD: Smooth muscle is not striated.","source":"Muscle Physiology summary.pdf | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-275","module":"v2","type":"mcq","q":"The contractile proteins of muscle are ______.","options":["Troponin and tropomyosin","Titin and dystrophin","Actin and myosin","Collagen and elastin"],"answer":"Actin and myosin","solution":"A: These are regulatory proteins, not contractile.\nB: Titin is structural; dystrophin is not the main contractile pair.\nC: Correct: the muscle summary states thick filaments are myosin and thin filaments are actin, with troponin and tropomyosin as regulatory proteins.\nD: These are connective tissue proteins.","source":"Muscle Physiology summary.pdf | SLIDE 1","difficulty":"Devil Mode"},{"id":"her-v2-276","module":"v2","type":"mcq","q":"Muscle contraction is triggered when ______.","options":["Na+ binds myosin","ATP binds tropomyosin","K+ binds actin","Ca2+ binds troponin C causing tropomyosin to shift and expose actin"],"answer":"Ca2+ binds troponin C causing tropomyosin to shift and expose actin","solution":"A: Sodium is involved in action potentials, not the troponin switch.\nB: ATP binds myosin for crossbridge cycling, not tropomyosin.\nC: Potassium is involved in repolarization, not contraction triggering.\nD: Correct: the summary states Ca2+ binds troponin C, tropomyosin shifts and myosin binds actin.","source":"Muscle Physiology summary.pdf | SLIDE 3","difficulty":"Medium"},{"id":"her-v2-277","module":"v2","type":"mcq","q":"Which neuromuscular disorder involves antibodies blocking acetylcholine receptors?","options":["Myasthenia gravis","Botulism","Multiple sclerosis","Pernicious anaemia"],"answer":"Myasthenia gravis","solution":"A: Correct: the muscle summary defines myasthenia gravis as an autoimmune condition where antibodies block ACh receptors.\nB: Botulinum toxin prevents ACh release rather than blocking receptors.\nC: MS is demyelination of CNS neurons.\nD: That is B12 deficiency, not a neuromuscular junction disorder.","source":"Muscle Physiology summary.pdf | SLIDE 4","difficulty":"Hard"},{"id":"her-v2-278","module":"v2","type":"mcq","q":"Acetylcholine at the neuromuscular junction is broken down by ______.","options":["Monoamine oxidase","Acetylcholinesterase (AChE)","Acetyl-CoA synthetase","Choline acetyltransferase"],"answer":"Acetylcholinesterase (AChE)","solution":"A: MAO breaks down monoamines, not ACh at the NMJ.\nB: Correct: the muscle summary states AChE deactivates ACh after stimulation.\nC: That enzyme is involved in metabolism, not ACh breakdown.\nD: That enzyme synthesizes ACh, not breaks it down.","source":"Muscle Physiology summary.pdf | SLIDE 2","difficulty":"Medium"},{"id":"her-v2-279","module":"v2","type":"mcq","q":"In the standard anatomical position, the body is ______.","options":["lying face down with palms down","upright with palms facing backward","upright with head and toes forward, arms at sides with palms forward and feet parallel","sitting with knees bent"],"answer":"upright with head and toes forward, arms at sides with palms forward and feet parallel","solution":"A: That is the prone position, not anatomical position.\nB: Palms face forward in anatomical position.\nC: Correct: the anatomy introduction defines anatomical position with head, eyes and toes forward, palms forward and lower limbs close with feet parallel.\nD: The standard position is standing upright.","source":"Intro to Anatomy DRS.pptx | SLIDE 19","difficulty":"Hard"},{"id":"her-v2-280","module":"v2","type":"mcq","q":"Which plane divides the body into equal left and right halves?","options":["Sagittal plane","Coronal plane","Transverse plane","Median (midsagittal) plane"],"answer":"Median (midsagittal) plane","solution":"A: A sagittal plane is parallel to the median but does not necessarily give equal halves.\nB: The coronal plane divides front and back.\nC: The transverse plane divides upper and lower parts.\nD: Correct: the anatomy slides define the median plane as a vertical longitudinal plane dividing the body into equal left and right halves.","source":"Intro to Anatomy DRS.pptx | SLIDE 21","difficulty":"Devil Mode"},{"id":"her-v2-281","module":"v2","type":"mcq","q":"Which plane divides the body into front and back portions?","options":["Coronal (frontal) plane","Transverse plane","Sagittal plane","Oblique plane"],"answer":"Coronal (frontal) plane","solution":"A: Correct: the slides define the coronal/frontal plane as a vertical plane at 90 degrees to the median dividing front and back.\nB: Transverse divides upper and lower.\nC: Sagittal divides left and right.\nD: Oblique is not the plane described for front/back division.","source":"Intro to Anatomy DRS.pptx | SLIDE 21","difficulty":"Medium"},{"id":"her-v2-282","module":"v2","type":"mcq","q":"A structure closer to the trunk than another is described as ______.","options":["Distal","Proximal","Superficial","Lateral"],"answer":"Proximal","solution":"A: Distal means farther from the trunk.\nB: Correct: the slides list proximal and distal among directional terms; proximal means nearer the point of attachment/trunk.\nC: Superficial means nearer the surface.\nD: Lateral means away from the midline.","source":"Intro to Anatomy DRS.pptx | SLIDE 23","difficulty":"Hard"},{"id":"her-v2-283","module":"v2","type":"mcq","q":"Flexion is defined as ______.","options":["straightening a joint","turning the palm upward","bending a joint or decreasing the angle between two bones","moving a part away from the midline"],"answer":"bending a joint or decreasing the angle between two bones","solution":"A: That is extension.\nB: That is supination.\nC: Correct: the anatomy slides define flexion as bending a joint or decreasing the angle between bones.\nD: That is abduction.","source":"Intro to Anatomy DRS.pptx | SLIDE 30","difficulty":"Medium"},{"id":"her-v2-284","module":"v2","type":"mcq","q":"Which movement turns the sole of the foot inward?","options":["Eversion","Dorsiflexion","Plantarflexion","Inversion"],"answer":"Inversion","solution":"A: Eversion turns the sole outward.\nB: Dorsiflexion brings the foot toward the shin.\nC: Plantarflexion points the foot downward.\nD: Correct: the slides define inversion as turning the sole of the foot inward and eversion as outward.","source":"Intro to Anatomy DRS.pptx | SLIDE 33","difficulty":"Hard"},{"id":"her-v2-285","module":"v2","type":"mcq","q":"In anatomical colour coding, which colour usually represents nerves?","options":["Yellow","Red","Blue","Green"],"answer":"Yellow","solution":"A: Correct: the slides state red for arteries, blue for veins, yellow for nerves and green for lymphatics.\nB: Red is used for arteries.\nC: Blue is used for veins.\nD: Green is used for lymphatics.","source":"Intro to Anatomy DRS.pptx | SLIDE 89","difficulty":"Devil Mode"},{"id":"her-v2-286","module":"v2","type":"mcq","q":"The dorsal body cavity is lined by membranes called ______ and contains the brain and spinal cord.","options":["Serous membranes","Meninges","Peritoneum","Pleurae"],"answer":"Meninges","solution":"A: Serous membranes line the ventral body cavity.\nB: Correct: the slides state the dorsal body cavity is lined by three membrane layers called meninges.\nC: Peritoneum lines the abdominopelvic cavity.\nD: Pleurae line the pleural cavities.","source":"Intro to Anatomy DRS.pptx | SLIDE 43","difficulty":"Medium"},{"id":"her-v2-287","module":"v2","type":"mcq","q":"The nine abdominal regions are formed by ______.","options":["median and transumbilical planes","sagittal and coronal planes only","two midclavicular planes, subcostal/transpyloric and transtubercular planes","only one transverse plane"],"answer":"two midclavicular planes, subcostal/transpyloric and transtubercular planes","solution":"A: These form the four abdominal quadrants.\nB: These are general anatomical planes.\nC: Correct: the slides state the nine regions are formed by two midclavicular planes, subcostal/transpyloric and transtubercular planes.\nD: Multiple planes are required to form nine regions.","source":"Intro to Anatomy DRS.pptx | SLIDE 83","difficulty":"Hard"},{"id":"her-v2-288","module":"v2","type":"mcq","q":"Which imaging technique uses high-frequency sound waves and the pulse-echo effect?","options":["Conventional radiography","CT (computed tomography)","MRI (magnetic resonance imaging)","Ultrasonography"],"answer":"Ultrasonography","solution":"A: Radiography uses ionizing X-rays.\nB: CT uses rotating X-ray tubes and detectors.\nC: MRI uses magnetic fields and radiofrequency pulses.\nD: Correct: the slides state ultrasonography uses high-frequency sound waves and pulse echoes converted by a transducer.","source":"Intro to Anatomy DRS.pptx | SLIDE 95","difficulty":"Medium"},{"id":"her-v2-289","module":"v2","type":"mcq","q":"In conventional radiography, the order of X-ray absorption is ______.","options":["air < fat < fluid < soft tissue < bone < metal","metal < bone < soft tissue < air","air < bone < fat < fluid < metal","all tissues absorb X-rays equally"],"answer":"air < fat < fluid < soft tissue < bone < metal","solution":"A: Correct: the slides give this exact order of X-ray absorption.\nB: This reverses the stated order.\nC: Bone absorbs more than fat and fluid.\nD: Differential absorption creates the image.","source":"Intro to Anatomy DRS.pptx | SLIDE 92","difficulty":"Hard"},{"id":"her-v2-290","module":"v2","type":"mcq","q":"Which anatomical term means 'pertaining to under the liver'?","options":["Epicardial","Subhepatic","Infraorbital","Gastritis"],"answer":"Subhepatic","solution":"A: Epicardial means over the heart (epi-).\nB: Correct: the slides use subhepatic as the example where 'sub-' is the prefix meaning under.\nC: Infraorbital means below the orbit.\nD: Gastritis means inflammation of the stomach.","source":"Intro to Anatomy DRS.pptx | SLIDE 14","difficulty":"Devil Mode"},{"id":"her-v2-291","module":"v2","type":"mcq","q":"Which suffix means 'inflammation' in medical terminology?","options":["-ectomy","-algia","-itis","-oscopy"],"answer":"-itis","solution":"A: -ectomy means cutting out.\nB: -algia means pain.\nC: Correct: the slides list -itis as the suffix for inflammation, e.g. hepatitis.\nD: -scopy means to view.","source":"Intro to Anatomy DRS.pptx | SLIDE 18","difficulty":"Medium"},{"id":"her-v2-292","module":"v2","type":"mcq","q":"Andreas Vesalius is often called the father of anatomy because he ______.","options":["wrote the first anatomy manual","founded comparative anatomy","discovered X-rays","refuted past misconceptions by direct observation and experiment"],"answer":"refuted past misconceptions by direct observation and experiment","solution":"A: Menes wrote the first anatomy manual about 3400 BC.\nB: Aristotle founded comparative anatomy.\nC: Roentgen discovered X-rays in 1895.\nD: Correct: the anatomy contribution table states Vesalius refuted misconceptions by direct observation and experiment.","source":"Intro to Anatomy DRS.pptx | SLIDE 6","difficulty":"Hard"},{"id":"her-v2-293","module":"v2","type":"mcq","q":"In the cerebral hemisphere, gray matter is located chiefly ______.","options":["at the periphery as the cerebral cortex","in the central medullary region only","only in the spinal cord","exclusively in the ventricles"],"answer":"at the periphery as the cerebral cortex","solution":"A: Correct: the nervous tissues slides state gray matter in the cerebral hemisphere is at the periphery or cortex.\nB: White matter spreads toward the medullary region.\nC: Gray matter is also in the cortex and basal nuclei.\nD: Ventricles contain CSF and choroid plexus, not gray matter.","source":"NERVOUS TISSUES (KNUST 2024).pdf | SLIDE 3","difficulty":"Medium"},{"id":"her-v2-294","module":"v2","type":"mcq","q":"Which cells form myelin sheaths around axons in the CNS?","options":["Schwann cells","Oligodendrocytes","Astrocytes","Ependymal cells"],"answer":"Oligodendrocytes","solution":"A: Schwann cells myelinate in the PNS.\nB: Correct: the nervous tissues slides state oligodendrocytes form myelin sheaths around axons in the CNS.\nC: Astrocytes support and help form the blood-brain barrier.\nD: Ependymal cells line ventricles and help form choroid plexus.","source":"NERVOUS TISSUES (KNUST 2024).pdf | SLIDE 22","difficulty":"Hard"},{"id":"her-v2-295","module":"v2","type":"mcq","q":"Astrocytes promote formation of the blood-brain barrier by ______.","options":["secreting myelin","producing CSF","promoting tight junctions","phagocytosing debris"],"answer":"promoting tight junctions","solution":"A: Oligodendrocytes and Schwann cells form myelin.\nB: Ependymal cells/choroid plexus produce CSF.\nC: Correct: the nervous tissues slides list promoting tight junctions to form the blood-brain barrier among astrocyte functions.\nD: Microglia are the phagocytes of the CNS.","source":"NERVOUS TISSUES (KNUST 2024).pdf | SLIDE 18","difficulty":"Devil Mode"},{"id":"her-v2-296","module":"v2","type":"mcq","q":"Which neuroglial cells are specialized macrophages in the nervous system?","options":["Astrocytes","Satellite cells","Ependymal cells","Microglia"],"answer":"Microglia","solution":"A: Astrocytes are supportive, not phagocytic macrophages.\nB: Satellite cells surround neuron cell bodies in ganglia.\nC: Ependymal cells line ventricles and the central canal.\nD: Correct: the slides describe microglia as specialized macrophages contributing to inflammation and necrosis.","source":"NERVOUS TISSUES (KNUST 2024).pdf | SLIDE 21","difficulty":"Medium"},{"id":"her-v2-297","module":"v2","type":"mcq","q":"Which neuron type has a single process that gives rise to both dendritic and axonal branches?","options":["Unipolar neuron","Bipolar neuron","Multipolar neuron","Pyramidal cell"],"answer":"Unipolar neuron","solution":"A: Correct: the nervous tissues slides describe unipolar neurons as having a single process giving rise to both dendritic and axon branches.\nB: Bipolar neurons have a process at each end of the cell body.\nC: Multipolar neurons have multiple processes from the cell body.\nD: Pyramidal cells are multipolar with a conical shape.","source":"NERVOUS TISSUES (KNUST 2024).pdf | SLIDE 11","difficulty":"Hard"},{"id":"her-v2-298","module":"v2","type":"mcq","q":"Which cerebral cortex layer is also called the ganglionic layer?","options":["Molecular layer","Internal pyramidal layer (layer V)","External granular layer","Multiform layer"],"answer":"Internal pyramidal layer (layer V)","solution":"A: The molecular (plexiform) layer is layer I.\nB: Correct: the slides list the ganglionic (internal pyramidal) layer as one of the six cortical layers (layer 5).\nC: The external granular layer is layer II.\nD: The multiform layer is layer VI.","source":"NERVOUS TISSUES (KNUST 2024).pdf | SLIDE 30","difficulty":"Medium"},{"id":"her-v2-299","module":"v2","type":"mcq","q":"In osteology quiz 1, which structure interconnects haversian systems in compact bone (answer B)?","options":["Interstitial lamellae","Concentric lamellae","Volkmann's canal","Circumferential lamellae"],"answer":"Volkmann's canal","solution":"A: This is option B in the quiz; interstitial lamellae are remnants between osteons.\nB: This is option C; these surround the haversian canal.\nC: Correct: the literal osteology quiz answer is Volkmann's canal, which links adjacent haversian systems.\nD: This is option E; these cover the outer/inner bone surfaces.","source":"Osteology Quiz 1.PDF | SLIDE 2","difficulty":"Hard"},{"id":"her-v2-300","module":"v2","type":"mcq","q":"In the epiphyseal plate, cartilage grows by (osteology quiz 1):","options":["pulling the diaphysis toward the epiphysis","pushing the epiphysis away from the diaphysis","secretion of bone matrix into the medullary cavity","interstitial growth of the epiphyseal plate"],"answer":"interstitial growth of the epiphyseal plate","solution":"A: This is option B and is not the growth mechanism.\nB: This is option C and is not the correct mechanism.\nC: This is not cartilage growth in the plate.\nD: Correct: the literal osteology quiz answer is interstitial growth (option A).","source":"Osteology Quiz 1.PDF | SLIDE 2","difficulty":"Devil Mode"},{"id":"her-v2-301","module":"v2","type":"mcq","q":"Spongy bone is made up of a framework called ______ (osteology quiz 1).","options":["Trabeculae","Osteons","Lamellar bone","Howship's canal"],"answer":"Trabeculae","solution":"A: Correct: the literal osteology quiz answer is trabeculae (option C).\nB: This is option A; osteons are the structural units of compact bone.\nC: This is option B and is a broader category.\nD: This is option E; it is associated with osteoclasts.","source":"Osteology Quiz 1.PDF | SLIDE 2","difficulty":"Medium"},{"id":"her-v2-302","module":"v2","type":"mcq","q":"Which hormone is important for bone growth during infancy and childhood (osteology quiz 1)?","options":["Thyroid hormone","Growth hormone","Somatomedins","Calcitonin"],"answer":"Growth hormone","solution":"A: This is option A and is not the answer given.\nB: Correct: the literal osteology quiz answer is growth hormone (option C).\nC: This is option B and mediates GH action but is not the quiz answer.\nD: This is option E and lowers blood calcium.","source":"Osteology Quiz 1.PDF | SLIDE 3","difficulty":"Hard"},{"id":"her-v2-303","module":"v2","type":"mcq","q":"Ostealgia means ______ (osteology quiz 1).","options":["A disease of the bone","A defect called club foot","pain in a bone","A fractured bone"],"answer":"pain in a bone","solution":"A: This is option B and is not the quiz answer.\nB: This is option A and is unrelated.\nC: Correct: the literal osteology quiz answer is 'pain in a bone' (option C).\nD: This is option D and is not the term ostealgia.","source":"Osteology Quiz 1.PDF | SLIDE 4","difficulty":"Medium"},{"id":"her-v2-304","module":"v2","type":"mcq","q":"Which cranial bone is called the 'keystone' of the cranial floor (osteology quiz 2)?","options":["Frontal bone","Parietal bone","Occipital bone","Sphenoid bone"],"answer":"Sphenoid bone","solution":"A: This is option A and forms the forehead.\nB: This is option B and forms the roof of the cranium.\nC: This is option D and surrounds the foramen magnum.\nD: Correct: the literal osteology quiz answer is the sphenoid bone (option C).","source":"2025 Osteology Quiz 2.PDF | SLIDE 2","difficulty":"Hard"},{"id":"her-v2-305","module":"v2","type":"mcq","q":"The suture separating the parietal bones from the frontal bone is the ______ (osteology quiz 2).","options":["Coronal suture","Sagittal suture","Lambdoid suture","Squamosal suture"],"answer":"Coronal suture","solution":"A: Correct: the literal osteology quiz answer is the coronal suture (option D).\nB: This is option A; it joins the two parietal bones.\nC: This is option B; it joins parietal bones to the occipital bone.\nD: This is option C; it joins parietal and temporal bones.","source":"2025 Osteology Quiz 2.PDF | SLIDE 2","difficulty":"Devil Mode"},{"id":"her-v2-306","module":"v2","type":"mcq","q":"The mastoid process is a feature of which bone (osteology quiz 2)?","options":["Parietal bone","Temporal bone","Frontal bone","Zygomatic bone"],"answer":"Temporal bone","solution":"A: This is option B and has no mastoid process.\nB: Correct: the literal osteology quiz answer is the temporal bone (option A).\nC: This is option C and forms the forehead.\nD: This is option D and forms the cheek.","source":"2025 Osteology Quiz 2.PDF | SLIDE 3","difficulty":"Medium"},{"id":"her-v2-307","module":"v2","type":"mcq","q":"Which bone forms the posterior portion of the hard palate (osteology quiz 2)?","options":["Maxilla","Zygomatic bone","Palatine bone","Vomer"],"answer":"Palatine bone","solution":"A: This is option B; the maxilla forms the anterior hard palate.\nB: This is option C; it forms the cheek and orbit.\nC: Correct: the literal osteology quiz answer is the palatine bone (option A).\nD: This is option D; it forms part of the nasal septum.","source":"2025 Osteology Quiz 2.PDF | SLIDE 3","difficulty":"Hard"},{"id":"her-v2-308","module":"v2","type":"mcq","q":"Which foramen allows passage of the optic nerve (osteology quiz 3)?","options":["Foramen ovale","Foramen rotundum","Foramen magnum","Optic canal"],"answer":"Optic canal","solution":"A: This is option A; it transmits the mandibular nerve.\nB: This is option B; it transmits the maxillary nerve.\nC: This is option C; it transmits the spinal cord.\nD: Correct: the literal osteology quiz answer is the optic canal (option D).","source":"2025 Osteology Quiz 3.PDF | SLIDE 1","difficulty":"Medium"},{"id":"her-v2-309","module":"v2","type":"mcq","q":"Which bone articulates with the temporal bone at the temporomandibular joint (osteology quiz 3)?","options":["Mandible","Maxilla","Zygomatic bone","Sphenoid bone"],"answer":"Mandible","solution":"A: Correct: the literal osteology quiz answer is the mandible (option B).\nB: This is option A; it is fixed to the skull.\nC: This is option C; it forms the cheek.\nD: This is option D; it is at the cranial base.","source":"2025 Osteology Quiz 3.PDF | SLIDE 2","difficulty":"Hard"},{"id":"her-v2-310","module":"v2","type":"mcq","q":"Which small bones in the medial wall of the orbit are involved in tear duct blockage (osteology quiz 3)?","options":["Ethmoid bones","Lacrimal bones","Sphenoid bones","Palatine bones"],"answer":"Lacrimal bones","solution":"A: These form part of the medial orbital wall but are not the quiz answer.\nB: Correct: the literal osteology quiz answer is the lacrimal bones.\nC: These are at the cranial base.\nD: These form the posterior hard palate.","source":"2025 Osteology Quiz 3.PDF | SLIDE 3","difficulty":"Devil Mode"},{"id":"her-v2-311","module":"v2","type":"mcq","q":"Which bone forms the inferior portion of the nasal septum (osteology quiz 4-related anatomy)?","options":["Nasal bone","Inferior nasal concha","Vomer","Ethmoid bone"],"answer":"Vomer","solution":"A: Nasal bones form the bridge of the nose.\nB: These are scroll-like bones in the lateral nasal wall.\nC: Correct: the vomer forms the inferior part of the bony nasal septum, consistent with the osteology quiz content.\nD: The perpendicular plate of ethmoid forms the superior part.","source":"2025 Osteology Quiz 3.PDF | SLIDE 4","difficulty":"Medium"},{"id":"her-v2-312","module":"v2","type":"mcq","q":"Which foramen is most likely affected in a patient with anosmia after head injury (osteology quiz 4)?","options":["Foramen ovale","Foramen rotundum","Foramen spinosum","Cribriform foramina"],"answer":"Cribriform foramina","solution":"A: This is option A and transmits the mandibular nerve.\nB: This is option B and transmits the maxillary nerve.\nC: This is option C and transmits the middle meningeal artery.\nD: Correct: the literal osteology quiz answer is the cribriform foramina (option D), which transmit olfactory nerve fibres.","source":"2025Osteology Quiz 4.PDF | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-313","module":"v2","type":"mcq","q":"Which foramen is involved when chronic ear infection spreads to the facial nerve (osteology quiz 4)?","options":["Stylomastoid foramen","Foramen ovale","Foramen rotundum","Foramen magnum"],"answer":"Stylomastoid foramen","solution":"A: Correct: the literal osteology quiz answer is the stylomastoid foramen (option A), through which the facial nerve exits.\nB: This is option B and transmits the mandibular nerve.\nC: This is option C and transmits the maxillary nerve.\nD: This is option D and transmits the spinal cord.","source":"2025Osteology Quiz 4.PDF | SLIDE 2","difficulty":"Medium"},{"id":"her-v2-314","module":"v2","type":"mcq","q":"Which carpal bone is named for a large hook-shaped projection on its anterior surface (osteology quiz 6)?","options":["Lunate","Hamate","Scaphoid","Triquetrum"],"answer":"Hamate","solution":"A: This is option A and is crescent-shaped.\nB: Correct: the literal osteology quiz answer is the hamate (option D), which has the hamulus.\nC: This is option B and is boat-shaped.\nD: This is option C and is three-sided.","source":"2025 Osteology Quiz 6.PDF | SLIDE 1","difficulty":"Hard"},{"id":"her-v2-315","module":"v2","type":"mcq","q":"The capitulum of the humerus articulates with which bone (osteology quiz 6)?","options":["Ulna","Scapula","Radius","Carpal bones"],"answer":"Radius","solution":"A: This is option B; the trochlea articulates with the ulna.\nB: This is option C; the head articulates with the glenoid cavity.\nC: Correct: the literal osteology quiz answer is the radius (option A).\nD: This is option D and is not the articulation described.","source":"2025 Osteology Quiz 6.PDF | SLIDE 2","difficulty":"Devil Mode"},{"id":"her-v2-316","module":"v2","type":"mcq","q":"How many carpals, metacarpals and phalanges are in the human hand (osteology quiz 6)?","options":["5 carpals, 8 metacarpals and 14 phalanges","8 carpals, 6 metacarpals and 14 phalanges","8 carpals, 5 metacarpals and 15 phalanges","8 carpals, 5 metacarpals and 14 phalanges"],"answer":"8 carpals, 5 metacarpals and 14 phalanges","solution":"A: This is option A and reverses carpals and metacarpals.\nB: This is option B; there are 5 metacarpals.\nC: This is option C; there are 14 phalanges.\nD: Correct: the literal osteology quiz answer is 8 carpals, 5 metacarpals and 14 phalanges (option D).","source":"2025 Osteology Quiz 6.PDF | SLIDE 4","difficulty":"Medium"},{"id":"her-v2-317","module":"v2","type":"mcq","q":"Which part of the clavicle articulates with the manubrium (osteology quiz 6)?","options":["Sternal end (medial end)","Acromial end","Shaft (middle third)","Conoid tubercle"],"answer":"Sternal end (medial end)","solution":"A: Correct: the medial/sternal end of the clavicle articulates with the manubrium at the sternoclavicular joint.\nB: The acromial (lateral) end articulates with the scapula.\nC: The shaft is the common fracture site, not the manubrium articulation.\nD: This is a ligament attachment site.","source":"2025 Osteology Quiz 6.PDF | SLIDE 3","difficulty":"Hard"},{"id":"her-v2-318","module":"v2","type":"mcq","q":"Why does a clavicular fracture usually occur in the mid-region (osteology quiz 6)?","options":["Due to medial pressure from inflated lungs","Due to weakness at the junction of the two curves of the clavicle","Due to ligament-reinforced strength of the acromial joint","Due to its position relative to the humerus"],"answer":"Due to weakness at the junction of the two curves of the clavicle","solution":"A: This is option A and is not the quiz answer.\nB: Correct: the literal osteology quiz answer is weakness at the junction of the two curves (option C).\nC: This is option B and is not the reason.\nD: This is option D and is not the explanation given.","source":"2025 Osteology Quiz 6.PDF | SLIDE 4","difficulty":"Medium"},{"id":"her-v1-216","module":"v1","type":"mcq","q":"The word 'systema', from which systematics is derived, means ______.","options":["law","organized whole","arrangement","diversity only"],"answer":"organized whole","solution":"A: 'Nomos' means law and belongs to taxonomy, not systematics.\nB: Correct: the taxonomy slides state systematics derives from the latinized Greek 'Systema' meaning organized whole.\nC: 'Taxis' means arrangement and relates to taxonomy.\nD: Biodiversity, not systema, means number and kinds of organisms.","source":"taxonomy bhm 151.pptx | SLIDE 2","difficulty":"Hard"},{"id":"her-v1-217","module":"v1","type":"mcq","q":"Which term is the study of evolutionary relationships via molecular sequencing techniques?","options":["Biogeography","Nomenclature","Phylogeny","Classification"],"answer":"Phylogeny","solution":"A: Biogeography studies the distribution of organisms.\nB: Nomenclature is the science of naming organisms.\nC: Correct: the slides define phylogeny as the study of evolutionary relationships via molecular sequencing techniques.\nD: Classification is the methods of grouping organisms.","source":"taxonomy bhm 151.pptx | SLIDE 3","difficulty":"Devil Mode"},{"id":"her-v1-218","module":"v1","type":"mcq","q":"Descriptive taxonomy, developed in the 19th century, classified plants mainly on the basis of ______.","options":["molecular sequencing data","cytological and genetic findings","palaeobotany exclusively","gross morphological characters"],"answer":"gross morphological characters","solution":"A: Molecular data belong to modern phylogeny, not 19th-century descriptive taxonomy.\nB: Those influenced experimental taxonomy in the 20th century.\nC: Palaeobotany is used to determine species origin under phylogeny.\nD: Correct: the slides state descriptive taxonomy was concerned with similarities and differences in gross morphological characters.","source":"taxonomy bhm 151.pptx | SLIDE 8","difficulty":"Medium"},{"id":"her-v1-219","module":"v1","type":"mcq","q":"Which principle of plant taxonomy uses palaeobotany and genetics to account for the origin of species?","options":["Phylogeny","Descriptive taxonomy","Experimental taxonomy","Nomenclature"],"answer":"Phylogeny","solution":"A: Correct: the slides state that under phylogeny, determining a species' origin depends on palaeobotany and genetics.\nB: Descriptive taxonomy relies on gross morphology.\nC: Experimental taxonomy uses cytology, anatomy and physiology but is not the origin principle.\nD: Nomenclature is naming, not determining origin.","source":"taxonomy bhm 151.pptx | SLIDE 9","difficulty":"Hard"},{"id":"her-v1-220","module":"v1","type":"mcq","q":"Two reasons given for preferring scientific names are that they ______.","options":["are always short and memorable","are universal and indicate relationships","never change over time","are the same as vernacular names"],"answer":"are universal and indicate relationships","solution":"A: The slides list difficulty of pronunciation as a challenge.\nB: Correct: the slides state scientific names facilitate free transfer of ideas, are universal, unique and indicate relationships.\nC: The slides note scientific names are changed from time to time.\nD: Vernacular names are local; scientific names are universal.","source":"taxonomy bhm 151.pptx | SLIDE 21","difficulty":"Medium"},{"id":"her-v1-221","module":"v1","type":"mcq","q":"In the binomial 'Mangifera indica', 'indica' is the ______.","options":["genus","family name","specific epithet","author abbreviation"],"answer":"specific epithet","solution":"A: Mangifera is the genus; indica is the second element.\nB: Family names end in -aceae and are not the second element.\nC: Correct: the slides state the second element of a scientific name is the specific epithet, often incorrectly called the species.\nD: Author names follow the binomial, e.g. the 'L.' in Zea mays L.","source":"taxonomy bhm 151.pptx | SLIDE 25","difficulty":"Hard"},{"id":"her-v1-222","module":"v1","type":"mcq","q":"Which epithet means 'creeping' in plant nomenclature?","options":["Arboreus","Prostratus","Scandens","Repens"],"answer":"Repens","solution":"A: Arboreus means tree.\nB: Prostratus means lying flat.\nC: Scandens means climbing.\nD: Correct: the slides list Repens (creeping) under growth form epithets.","source":"taxonomy bhm 151.pptx | SLIDE 41","difficulty":"Devil Mode"},{"id":"her-v1-223","module":"v1","type":"mcq","q":"Which epithet indicates a plant's use in dyeing?","options":["Tinctorius","Edulis","Somniferum","Textilis"],"answer":"Tinctorius","solution":"A: Correct: the slides list tinctorius under 'uses' as used in dyeing.\nB: Edulis means edible.\nC: Somniferum means sleep-inducing.\nD: Textilis means used for textiles/fibres.","source":"taxonomy bhm 151.pptx | SLIDE 44","difficulty":"Medium"},{"id":"her-v1-224","module":"v1","type":"mcq","q":"Which generic name is derived from a mythological nymph loved by Apollo?","options":["Achillea","Acanthus","Artemisia","Atropa"],"answer":"Acanthus","solution":"A: Achillea is named after the Greek hero Achilles.\nB: Correct: the slides state Acanthus derives from a Greek word for thorn and the nymph Acantha loved by Apollo.\nC: Artemisia derives from the goddess Artemis.\nD: Atropa derives from Atropos, the goddess who cuts the thread of life.","source":"taxonomy bhm 151.pptx | SLIDE 32","difficulty":"Hard"},{"id":"her-v1-225","module":"v1","type":"mcq","q":"Which genus commemorates the diplomat Jean Nicot?","options":["Adonsonia","Parkinsonia","Nicotiana","Serenoa"],"answer":"Nicotiana","solution":"A: Adonsonia commemorates the botanist Michael Adanson.\nB: Parkinsonia commemorates John Parkinson, an apothecary.\nC: Correct: the slides list Nicotiana - Jean Nicot, diplomat, under commemorative names.\nD: Serenoa commemorates Sereno Watson, a botanist.","source":"taxonomy bhm 151.pptx | SLIDE 35","difficulty":"Medium"},{"id":"her-v1-226","module":"v1","type":"mcq","q":"Ethnobotany is a subset of which broader field?","options":["Ethnobiology only","Phytochemistry","Systematics","Ethnoecology"],"answer":"Ethnoecology","solution":"A: Ethnobotany is a branch of ethnobiology but a subset of ethnoecology.\nB: Phytochemistry is the chemistry of plant compounds.\nC: Systematics classifies organisms.\nD: Correct: the slides state ethnobotany is a subset of ethnoecology, the study of interactions between people and the natural environment.","source":"ETHNOBOTANY-151.pptx | SLIDE 5","difficulty":"Hard"},{"id":"her-v1-227","module":"v1","type":"mcq","q":"Which ethnobotanist is listed alongside Paul Alan Cox and Michael J. Balick in the slides?","options":["Abbiw","Paracelsus","Dioscorides","Shen Nung"],"answer":"Abbiw","solution":"A: Correct: the slides list Paul Alan Cox, Michael J. Balick, Abbiw and Irvine as other ethnobotanists.\nB: Paracelsus is associated with the doctrine of signatures.\nC: Dioscorides wrote De Materia Medica.\nD: Shen Nung is the legendary Chinese emperor associated with the Pen Tsao.","source":"ETHNOBOTANY-151.pptx | SLIDE 11","difficulty":"Devil Mode"},{"id":"her-v1-228","module":"v1","type":"mcq","q":"Voucher specimens collected by ethnobotanists are deposited in ______.","options":["a pharmacy dispensary","an herbarium, arboretum or special garden in the host country","the collector's kitchen","a clinical trial registry"],"answer":"an herbarium, arboretum or special garden in the host country","solution":"A: Voucher specimens are botanical references, not dispensary stock.\nB: Correct: the slides state plants are pressed and dried as voucher specimens and deposited in the host country in an herbarium, arboretum or special gardens.\nC: Specimens must be preserved in a proper institution.\nD: Clinical trial registries record trials, not plant vouchers.","source":"ETHNOBOTANY-151.pptx | SLIDE 15","difficulty":"Medium"},{"id":"her-v1-229","module":"v1","type":"mcq","q":"Bioassay-guided fractionation is used in ethnobotany to ______.","options":["count the number of plant species in a forest","translate local languages","guide extraction and fractionation to isolate active ingredients responsible for medicinal effects","register herbal products with the FDA"],"answer":"guide extraction and fractionation to isolate active ingredients responsible for medicinal effects","solution":"A: That is a floristic survey, not fractionation.\nB: Linguistic work is a different ethnobotanical skill.\nC: Correct: the slides state ethnobotanical information guides extraction and fractionation to isolate the active ingredients.\nD: Product registration is a regulatory process.","source":"ETHNOBOTANY-151.pptx | SLIDE 20","difficulty":"Hard"},{"id":"her-v1-230","module":"v1","type":"mcq","q":"Paclitaxel (Taxol) was derived from the bark of which tree?","options":["Cinchona tree","Willow tree","Foxglove","Pacific yew (Taxus brevifolia)"],"answer":"Pacific yew (Taxus brevifolia)","solution":"A: Cinchona bark yields quinine.\nB: Willow bark yields salicin.\nC: Foxglove yields digoxin/digitoxin.\nD: Correct: the slides state paclitaxel was derived from the bark of the Pacific yew tree, traditionally used by Native Americans.","source":"ETHNOBOTANY-151.pptx | SLIDE 22","difficulty":"Medium"},{"id":"her-v1-231","module":"v1","type":"mcq","q":"Doctrine of signatures examples in the slides include ______.","options":["Kigelia africana fruit for breast diseases and carrots for eye diseases","quinine for malaria and aspirin for pain","artemisinin for fever and metformin for diabetes","praziquantel for worms and ivermectin for filariasis"],"answer":"Kigelia africana fruit for breast diseases and carrots for eye diseases","solution":"A: Correct: the slides list Kigelia africana fruit for breast diseases and carrot for eye diseases as signature examples.\nB: These are modern isolated drugs, not signature examples.\nC: These are isolated compounds, not appearance-based signatures.\nD: These are synthetic/semi-synthetic antiparasitics.","source":"BHM 151-ROLE OF SCIENCE IN HERBALISM.pptx | SLIDE 14","difficulty":"Hard"},{"id":"her-v1-232","module":"v1","type":"mcq","q":"Which civilization is credited with the earliest written medicinal plant records on clay tablets about 5000 years ago?","options":["Ancient Egyptians","Sumerians of Mesopotamia","Ancient Greeks","Ancient Indians"],"answer":"Sumerians of Mesopotamia","solution":"A: Egyptians wrote on papyrus, e.g. the Ebers Papyrus.\nB: Correct: the role-of-science slides state the first dated written record of medicinal plants was on clay tablets by Sumerians over 5000 years ago.\nC: Greek records such as Dioscorides came later.\nD: Ayurvedic knowledge was initially oral.","source":"HERBALISM-NEW.pptx | SLIDE 12","difficulty":"Devil Mode"},{"id":"her-v1-233","module":"v1","type":"mcq","q":"The 'Four Elements' theory was developed from Empedocles' Four Roots by ______.","options":["Hippocrates","Galen","Plato","Avicenna"],"answer":"Plato","solution":"A: Hippocrates developed the Four Humours, not the Four Elements.\nB: Galen further developed the humoral system.\nC: Correct: the herbalism history slides state Plato developed Empedocles' Four Roots into the Four Elements, which Hippocrates developed into the Four Humours.\nD: Avicenna contributed to Unani-Tibb.","source":"HERBALISM-NEW.pptx | SLIDE 14","difficulty":"Medium"},{"id":"her-v1-234","module":"v1","type":"mcq","q":"The Ebers Papyrus dealt with internal injuries and contained recipes including which substances?","options":["Only mineral salts and metals","Quinine, aspirin and morphine","Only honey and lemon","Senna, opium poppy, camphor oil, essential oils, aloes and onion"],"answer":"Senna, opium poppy, camphor oil, essential oils, aloes and onion","solution":"A: The papyrus included many herbal substances.\nB: These pure compounds were isolated in the 19th century.\nC: Honey and lemon are home remedies in the approach-to-health slides, not papyrus contents.\nD: Correct: the herbalism slides list senna, opium poppy, camphor oil, essential oils, aloes and onion in the Ebers Papyrus.","source":"HERBALISM-NEW.pptx | SLIDE 11","difficulty":"Hard"},{"id":"her-v1-235","module":"v1","type":"mcq","q":"Which two plants are described as integrally linked to slavery in the ethnobotany slides?","options":["Cotton (Gossypium arboreum) and sugar cane (Saccharum officinarum)","Cinchona and Artemisia","Papyrus and paprika","Yarrow and St John's wort"],"answer":"Cotton (Gossypium arboreum) and sugar cane (Saccharum officinarum)","solution":"A: Correct: the slides describe cotton and sugar cane as two plants integrally linked to slavery.\nB: Both are medicinal antimalarial plants, not linked to slavery in the slides.\nC: Papyrus was used for writing, not described in this context.\nD: These are European medicinal herbs.","source":"ETHNOBOTANY-151.pptx | SLIDE 9","difficulty":"Medium"},{"id":"her-v1-236","module":"v1","type":"mcq","q":"Rickettsiae are best described as ______.","options":["free-living bacteria with a rigid wall","small Gram-negative organisms that mostly grow only in living tissues","spore-forming rods","non-pathogenic soil organisms"],"answer":"small Gram-negative organisms that mostly grow only in living tissues","solution":"A: Rickettsiae mostly require living tissue.\nB: Correct: the slides describe rickettsiae as rod-shaped, spherical or pleomorphic Gram-negative organisms that mostly grow only in living tissues.\nC: Rickettsiae are not spore-formers.\nD: Rickettsia prowazekii is pathogenic.","source":"Bacteriology.pdf | SLIDE 19","difficulty":"Hard"},{"id":"her-v1-237","module":"v1","type":"mcq","q":"Chlamydiae differ from rickettsiae in that they ______.","options":["are always extracellular","form endospores","have a more complex intracellular cycle","are larger than true bacteria"],"answer":"have a more complex intracellular cycle","solution":"A: Chlamydiae are intracellular.\nB: Chlamydiae do not form spores.\nC: Correct: the slides state chlamydiae are similar to rickettsiae but have a more complex intracellular cycle.\nD: Like rickettsiae, they are smaller than true bacteria.","source":"Bacteriology.pdf | SLIDE 19","difficulty":"Devil Mode"},{"id":"her-v1-238","module":"v1","type":"mcq","q":"Bacterial ribosomes dissociate into 50S and 30S subunits in ______.","options":["high magnesium concentrations","the absence of oxygen","acidic pH only","low magnesium concentrations"],"answer":"low magnesium concentrations","solution":"A: High magnesium stabilises the 70S ribosome.\nB: Oxygen is not linked to ribosome dissociation.\nC: Magnesium, not pH, is the stated factor.\nD: Correct: the slides state in the presence of magnesium 50S and 30S form stable 70S ribosomes, and in low magnesium they dissociate.","source":"Bacteriology.pdf | SLIDE 31","difficulty":"Medium"},{"id":"her-v1-239","module":"v1","type":"mcq","q":"The sparingly soluble spore cortex contains most of the spore's ______.","options":["mucopeptide","flagellin","teichoic acid","lipopolysaccharide"],"answer":"mucopeptide","solution":"A: Correct: the slides state the cortex appears to contain most of the mucopeptide of the spore.\nB: Flagellin is in flagella, not the cortex.\nC: Teichoic acid is a vegetative Gram-positive wall component.\nD: LPS is in the Gram-negative outer membrane.","source":"Bacteriology.pdf | SLIDE 44","difficulty":"Hard"},{"id":"her-v1-240","module":"v1","type":"mcq","q":"Sporulation is initiated when ______.","options":["nutrients are abundant","nutrient limitation terminates rapid growth","the cell is exposed to light only","oxygen is completely absent"],"answer":"nutrient limitation terminates rapid growth","solution":"A: Abundant nutrients favour vegetative growth, not sporulation.\nB: Correct: the slides state sporulation is initiated under nutrient limitation when rapid growth is terminated.\nC: Light is not the stated trigger.\nD: Anaerobes can sporulate; oxygen absence is not the trigger.","source":"Bacteriology.pdf | SLIDE 45","difficulty":"Medium"},{"id":"her-v1-241","module":"v1","type":"mcq","q":"Capsules of most pathogenic bacteria are ______.","options":["pure protein in all species","readily stained by aniline dyes","viscous polysaccharide gums giving a mucoid colony appearance","essential for bacterial life"],"answer":"viscous polysaccharide gums giving a mucoid colony appearance","solution":"A: Bacillus capsules are largely polypeptide, but most are polysaccharide.\nB: Capsules have low affinity for aniline dyes.\nC: Correct: the slides state capsules of most pathogenic bacteria are viscous polysaccharide gums giving colonies a mucoid appearance.\nD: Capsules may be lost by mutation without loss of viability.","source":"Bacteriology.pdf | SLIDE 47","difficulty":"Hard"},{"id":"her-v1-242","module":"v1","type":"mcq","q":"Which bacterial genus has capsules composed largely of polypeptide?","options":["Streptococcus","Escherichia","Staphylococcus","Bacillus"],"answer":"Bacillus","solution":"A: Streptococcal capsules are typically polysaccharide.\nB: E. coli capsules are polysaccharide.\nC: Staphylococcal capsules are polysaccharide.\nD: Correct: the slides state Bacillus genus is unusual in having capsules composed largely of polypeptide.","source":"Bacteriology.pdf | SLIDE 48","difficulty":"Devil Mode"},{"id":"her-v1-243","module":"v1","type":"mcq","q":"Microcapsules or surface antigens include which examples?","options":["M antigens of streptococci and Vi antigens of S. typhi","Flagellin and pilin","Teichoic acid and peptidoglycan","Capsular polysaccharide only"],"answer":"M antigens of streptococci and Vi antigens of S. typhi","solution":"A: Correct: the slides give M antigens of Streptococci and Vi antigens of S. typhi as examples of microcapsules.\nB: Those are motility and conjugation proteins.\nC: Those are cell wall components.\nD: Microcapsules are antigenic layers, not just capsule polysaccharide.","source":"Bacteriology.pdf | SLIDE 49","difficulty":"Medium"},{"id":"her-v1-244","module":"v1","type":"mcq","q":"A pure culture on solid medium arises from ______.","options":["many different cells mixed together","descendants of a single cell deposited on the surface","a spore germinating in liquid","the agar itself"],"answer":"descendants of a single cell deposited on the surface","solution":"A: A colony is a clone of one cell.\nB: Correct: the slides state each colony consists of descendants of a single cell deposited on the medium surface.\nC: Colonies form on solid medium.\nD: Agar is the gelling agent, not the source of colonies.","source":"Bacteriology.pdf | SLIDE 93","difficulty":"Hard"},{"id":"her-v1-245","module":"v1","type":"mcq","q":"In liquid media, aerobic bacteria grow mainly ______.","options":["at the bottom","evenly throughout the medium","on the surface of the medium","only on the glass wall"],"answer":"on the surface of the medium","solution":"A: Anaerobes grow at the bottom.\nB: Some species grow diffusely, but aerobes favour the surface.\nC: Correct: the slides state aerobes grow mainly on the surface while anaerobes grow at the bottom.\nD: That is not the described pattern.","source":"Bacteriology.pdf | SLIDE 92","difficulty":"Medium"},{"id":"her-v1-246","module":"v1","type":"mcq","q":"Which virus family is 30-38 nm with 32 cup-shaped surface depressions?","options":["Picornaviridae","Astroviridae","Coronaviridae","Caliciviridae"],"answer":"Caliciviridae","solution":"A: Picornaviridae are 28-30 nm with icosahedral symmetry.\nB: Astroviridae are 28-30 nm and spherical.\nC: Coronaviridae are 80-220 nm and pleomorphic.\nD: Correct: the slides describe Caliciviridae as 30-38 nm with 32 cup-shaped depressions and positive ssRNA.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 34","difficulty":"Hard"},{"id":"her-v1-247","module":"v1","type":"mcq","q":"Astroviruses are notable for being ______.","options":["thermostable and resistant to acidic pH, ether, chloroform and detergents","rapidly inactivated by acidic pH","sensitive to all lipid solvents","unstable at high temperatures"],"answer":"thermostable and resistant to acidic pH, ether, chloroform and detergents","solution":"A: Correct: the slides state astroviruses are thermostable and resistant to acidic pH, ether, chloroform, lipid solvents and detergents.\nB: Astroviruses resist acidic pH.\nC: They are resistant to lipid solvents.\nD: They are thermostable.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 37","difficulty":"Devil Mode"},{"id":"her-v1-248","module":"v1","type":"mcq","q":"Which family includes yellow fever virus and is transmitted by mosquitoes and ticks?","options":["Togaviridae","Flaviviridae","Coronaviridae","Hepadnaviridae"],"answer":"Flaviviridae","solution":"A: Togaviridae include rubella, transmitted by contact and aerosols.\nB: Correct: the slides state Flavivirus causes yellow fever, is cytolytic and transmitted by mosquitoes and ticks.\nC: Coronaviruses cause common colds.\nD: Hepadnaviridae include hepatitis B.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 40","difficulty":"Medium"},{"id":"her-v1-249","module":"v1","type":"mcq","q":"Hepatitis C virus infects only humans and is transmitted by ______.","options":["mosquito bites only","the faecal-oral route","close contact, sexual contact and blood transfusion","respiratory droplets"],"answer":"close contact, sexual contact and blood transfusion","solution":"A: Hepatitis C is not described as mosquito-borne.\nB: That is the route for hepatitis A.\nC: Correct: the slides state hepatitis C infects only humans and is transmitted by close contact, sexual contact and blood transfusion.\nD: That is the route for influenza.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 41","difficulty":"Hard"},{"id":"her-v1-250","module":"v1","type":"mcq","q":"Coronaviruses mature by ______.","options":["assembly inside the nucleus only","binary fission","forming plaques in agar","budding through the endoplasmic reticulum and Golgi membranes in the cytoplasm"],"answer":"budding through the endoplasmic reticulum and Golgi membranes in the cytoplasm","solution":"A: Coronaviruses assemble in the cytoplasm.\nB: Viruses do not divide by binary fission.\nC: Plaques are a culture phenomenon, not maturation.\nD: Correct: the slides state coronavirions mature in the cytoplasm by budding through ER and Golgi membranes.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 42","difficulty":"Medium"},{"id":"her-v1-251","module":"v1","type":"mcq","q":"Paramyxoviruses are transmitted mainly by ______.","options":["aerosols and droplets","blood transfusion","faecal-oral route","mosquito vectors"],"answer":"aerosols and droplets","solution":"A: Correct: the slides state paramyxovirus transmission is mainly by aerosols and droplets.\nB: That is the route for HIV and hepatitis B.\nC: That is the route for polio and hepatitis A.\nD: Mosquitoes transmit togaviruses and flaviviruses.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 45","difficulty":"Hard"},{"id":"her-v1-252","module":"v1","type":"mcq","q":"Herpesviridae are characterized by all of the following EXCEPT ______.","options":["a narrow host range","always causing acute infection and never persisting","transmission by contact such as saliva","an envelope and icosahedral capsid"],"answer":"always causing acute infection and never persisting","solution":"A: Herpesviruses have a narrow host range.\nB: Correct: the slides state most herpesviruses persist for the lifetime of their hosts, so this statement is false.\nC: Contact transmission is described.\nD: The virion has an envelope and icosahedral capsid.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 56","difficulty":"Devil Mode"},{"id":"her-v1-253","module":"v1","type":"mcq","q":"Which virus family has large brick-shaped virions with dsDNA?","options":["Herpesviridae","Papovaviridae","Poxviridae","Picornaviridae"],"answer":"Poxviridae","solution":"A: Herpesviruses are spherical/pleomorphic with an icosahedral capsid.\nB: Papovaviruses are small with circular DNA.\nC: Correct: the slides describe Poxviridae as large brick-shaped viruses with a single dsDNA molecule.\nD: Picornaviruses are small ssRNA viruses.","source":"Virology 2.pptx | SLIDE 117","difficulty":"Medium"},{"id":"her-v1-254","module":"v1","type":"mcq","q":"Which of the following is NOT an atypical virus-like agent discussed in the slides?","options":["Defective virus","Pseudovirion","Viroid","Prion-dependent viroid"],"answer":"Prion-dependent viroid","solution":"A: Defective viruses need a helper virus.\nB: Pseudovirions contain host DNA in the capsid.\nC: Viroids are naked circular RNA.\nD: Correct: the atypical agents listed are defective viruses, pseudovirions, viroids and prions, not a 'prion-dependent viroid'.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 116","difficulty":"Hard"},{"id":"her-v1-255","module":"v1","type":"mcq","q":"Defective viruses cannot replicate without ______.","options":["a helper virus providing the missing function","an insect vector","a bacterial host only","high salt concentration"],"answer":"a helper virus providing the missing function","solution":"A: Correct: the slides state defective viruses cannot replicate without a helper virus supplying the missing function.\nB: Helper viruses, not vectors, provide the missing function.\nC: Defective viruses may infect other cells but need a helper.\nD: Salt is not the missing factor.","source":"Upload Virology Sem. 1 2021.pdf | SLIDE 116","difficulty":"Medium"},{"id":"her-v1-256","module":"v1","type":"mcq","q":"Which organism is the vector of Trypanosoma brucei gambiense?","options":["Female Anopheles","Tsetse fly","Sandfly","Blackfly"],"answer":"Tsetse fly","solution":"A: Anopheles mosquitoes transmit malaria.\nB: Correct: the slides state the tsetse fly is the vector for both T. b. gambiense and T. b. rhodesiense.\nC: Sandflies transmit leishmaniasis.\nD: Blackflies transmit onchocerciasis.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 53","difficulty":"Hard"},{"id":"her-v1-257","module":"v1","type":"mcq","q":"Toxoplasma gondii is given as an example of which kind of parasite?","options":["Obligate parasite","Accidental parasite","Opportunistic parasite","Erratic parasite"],"answer":"Opportunistic parasite","solution":"A: Plasmodium species are the obligate example.\nB: Hymenolepis diminuta is the accidental example.\nC: Correct: the parasitology slides list Toxoplasma gondii as an opportunistic parasite.\nD: E. histolytica in the liver/lung is the erratic example.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 5","difficulty":"Devil Mode"},{"id":"her-v1-258","module":"v1","type":"mcq","q":"Which parasite is a zoonotic parasite according to the slides?","options":["Naegleria fowleri","Hymenolepis diminuta","Plasmodium falciparum","Fasciola species"],"answer":"Fasciola species","solution":"A: Naegleria is a facultative parasite.\nB: H. diminuta is an accidental parasite.\nC: P. falciparum is an obligate human parasite.\nD: Correct: the slides give Fasciola species as an example of a zoonotic parasite that primarily infects animals and is transmittable to humans.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 5","difficulty":"Medium"},{"id":"her-v1-259","module":"v1","type":"mcq","q":"Elevated eosinophil count is a common laboratory finding in ______.","options":["parasitic infections","viral infections only","all bacterial infections","autoimmune disease only"],"answer":"parasitic infections","solution":"A: Correct: the parasitology slides list elevated eosinophil count among diagnostic indicators of parasitic infections.\nB: Eosinophilia is more typical of parasitic and allergic conditions.\nC: Bacterial infections typically raise neutrophils.\nD: Autoimmune disease is not the main association given.","source":"Pharm 263 Med. Parasitology.pptx | SLIDE 13","difficulty":"Hard"},{"id":"her-v1-260","module":"v1","type":"mcq","q":"Which sample is used for diagnosis of onchocerciasis?","options":["Stool microscopy for eggs","Skin snip examined in saline for microfilariae","Urine sediment examination","Sputum microscopy"],"answer":"Skin snip examined in saline for microfilariae","solution":"A: Onchocerca does not release eggs in stool.\nB: Correct: the slides state a superficial skin snip is allowed to stand in saline for 30 minutes and examined microscopically for microfilariae.\nC: Urine is used for S. haematobium.\nD: Sputum is not the diagnostic sample described.","source":"Helminths Parasitology.pptx | SLIDE 37","difficulty":"Medium"},{"id":"her-v2-319","module":"v2","type":"mcq","q":"Cutaneous larva migrans in humans is caused by ______.","options":["Schistosoma cercariae","Wuchereria microfilariae","animal hookworm larvae trapped in subcutaneous tissue","Enterobius eggs"],"answer":"animal hookworm larvae trapped in subcutaneous tissue","solution":"A: Cercariae cause swimmer's itch but complete their cycle in humans.\nB: Filariae do not cause cutaneous larva migrans.\nC: Correct: the slides state animal hookworm larvae penetrate human skin but cannot complete their cycle, migrating in subcutaneous tissue causing pruritus and dermatitis.\nD: Pinworm eggs cause enterobiasis, not larva migrans.","source":"Helminths Parasitology.pptx | SLIDE 27","difficulty":"Hard"},{"id":"her-v2-320","module":"v2","type":"mcq","q":"Trichuris trichiura adult worms live mainly in the ______.","options":["small intestine only","large intestine exclusively","stomach","caecum"],"answer":"caecum","solution":"A: The small intestine is a migration site, not the adult habitat.\nB: The caecum is the specific site given.\nC: The stomach is not the habitat described.\nD: Correct: the slides state infective larvae develop in the small intestine and move to the caecum to complete development as adults.","source":"Helminths Parasitology.pptx | SLIDE 47","difficulty":"Devil Mode"},{"id":"her-v2-321","module":"v2","type":"fill","q":"Evaluate the arithmetic sum: 1 + 8 + 15 + 22 + 29 + 36 + 43 + 50 + 57 + 64 + 71.","answer":"396","solution":"This is an AP with a = 1, d = 7 and n = 11, and S11 = 11/2 (2 + 70) = 396 (slide 18-22).","source":"Series and squence.pdf | SLIDE 18","difficulty":"Medium"},{"id":"her-v2-322","module":"v2","type":"fill","q":"A car priced at 2000 cedis depreciates by 5% each year. What is its value in the 5th year (to the nearest cedi, using 2000 x 0.95^4)?","answer":"1629","solution":"Depreciation is geometric with r = 0.95; value in year 5 = 2000 x 0.95^4 = 1629.025, about 1629 cedis (slide 31).","source":"Series and squence.pdf | SLIDE 31","difficulty":"Hard"},{"id":"her-v2-323","module":"v2","type":"fill","q":"An estate dealer earns $3750 on the first house sold and $500 more per additional house. How many houses must be sold to reach a total commission of $6500?","answer":"2","solution":"With a = 3750 and d = 500, S2 = 2/2(7500 + 500) = 8000 exceeds 6500 while S1 = 3750, so the second house reaches/exceeds the target (slide 32).","source":"Series and squence.pdf | SLIDE 32","difficulty":"Medium"},{"id":"her-v2-324","module":"v2","type":"mcq","q":"Simplify: 1/6(4 times square root of 18 - 3 times square root of 2).","options":["3/2 times the square root of 2","2 times the square root of 2","9 times the square root of 2","square root of 2"],"answer":"3/2 times the square root of 2","solution":"A: Correct: 4sqrt18 = 12sqrt2, minus 3sqrt2 = 9sqrt2, divided by 6 gives (3/2)sqrt2 (exercise slide 14).\nB: This ignores the 1/6 factor.\nC: This is before division by 6.\nD: The coefficient is 3/2, not 1.","source":"Surds.pdf | SLIDE 14","difficulty":"Hard"},{"id":"her-v2-325","module":"v2","type":"mcq","q":"Rationalising 12 over (square root of 24 - square root of 6) gives ______.","options":["12(square root of 24 + square root of 6)","2(square root of 24 + square root of 6) over 3","square root of 24 - square root of 6","4 times the square root of 6"],"answer":"2(square root of 24 + square root of 6) over 3","solution":"A: This omits division by the difference of squares.\nB: Correct: multiplying by the conjugate gives 12(sqrt24 + sqrt6)/(24-6) = (2/3)(sqrt24 + sqrt6) after simplification (exercise slide 28).\nC: This is the original denominator, not rationalised.\nD: This is not the result of rationalisation.","source":"Surds.pdf | SLIDE 28","difficulty":"Devil Mode"},{"id":"her-v2-326","module":"v2","type":"mcq","q":"In logarithms, log base a of (xy) equals ______.","options":["log base a of x times log base a of y","log base a of x minus log base a of y","log base a of x plus log base a of y","y times log base a of x"],"answer":"log base a of x plus log base a of y","solution":"A: Logarithms convert products to sums, not products of logs.\nB: That is the quotient rule.\nC: Correct: the product rule of logarithms states log(xy) = log x + log y, one of the rules listed in the logarithms slides.\nD: That is the power rule.","source":"LOGARITHMS.pptx | SLIDE 6","difficulty":"Medium"},{"id":"her-v2-327","module":"v2","type":"mcq","q":"Which expression is equivalent to 2 raised to the power 3 times 2 raised to the power 4?","options":["2 raised to the power 12","4 raised to the power 7","2 raised to the power 1","2 raised to the power 7"],"answer":"2 raised to the power 7","solution":"A: Exponents are added, not multiplied.\nB: The base stays 2.\nC: The exponents add to 7, not 1.\nD: Correct: the indices rule for multiplying powers with the same base adds the exponents: 2^3 x 2^4 = 2^7.","source":"INDICES.pptx | SLIDE 2","difficulty":"Hard"},{"id":"her-v2-328","module":"v2","type":"mcq","q":"Which of these is an example of a simple sentence subject that is a nominal adjective?","options":["The rich","The students from Togo","What he said","They"],"answer":"The rich","solution":"A: Correct: the concord slides list nominal adjectives such as 'the rich' as units that can function as subject.\nB: That is a complex subject (noun phrase with post-modifier).\nC: That is a nominal clause.\nD: That is a pronoun.","source":"finalCONCORD IN ENGLISH LECTURE SLIDES-1.pptx | SLIDE 16","difficulty":"Medium"},{"id":"her-v2-329","module":"v2","type":"mcq","q":"Which form takes a plural verb in subject-verb concord?","options":["The number of those who do not","A number of the students","Everyone in the class","Every computer, printer and fax machine"],"answer":"A number of the students","solution":"A: This selects a singular verb.\nB: Correct: the concord slides state 'a number of' always requires a plural verb, whereas 'the number of' takes a singular verb.\nC: Indefinite pronouns like everyone take singular verbs.\nD: With each/every preceding, the verb is singular.","source":"finalCONCORD IN ENGLISH LECTURE SLIDES-1.pptx | SLIDE 36","difficulty":"Hard"},{"id":"her-v2-330","module":"v2","type":"mcq","q":"With correlative conjunctions such as 'neither...nor', the verb number is determined by ______.","options":["the first noun phrase always","the furthest noun phrase (remote concord)","the noun phrase closest to the verb (proximity concord)","the conjunction itself only"],"answer":"the noun phrase closest to the verb (proximity concord)","solution":"A: Proximity, not position of the first NP, determines the verb.\nB: Remote concord applies to quasi-conjunctions like 'as well as'.\nC: Correct: the slides state the proximity concord rule applies to correlative conjunctions, so the nearer noun phrase determines the verb.\nD: The adjacent noun phrase, not the conjunction, determines number.","source":"finalCONCORD IN ENGLISH LECTURE SLIDES-1.pptx | SLIDE 26","difficulty":"Devil Mode"},{"id":"her-v2-331","module":"v2","type":"mcq","q":"Which of the following is NOT a punctuation mark listed in the punctuation lecture?","options":["Semicolon","Parentheses","Ellipsis","Ampersand"],"answer":"Ampersand","solution":"A: The semicolon is listed.\nB: Parentheses are listed.\nC: Ellipsis is discussed in the slides.\nD: Correct: the listed marks include full stop, question mark, exclamation, dash, hyphen, apostrophe, comma, semicolon, colon, quotation marks, parentheses and brackets, but not ampersand.","source":"final PUNCTUATION IN ENGLISH LECTURE SLIDES.pptx | SLIDE 4","difficulty":"Medium"},{"id":"her-v2-332","module":"v2","type":"mcq","q":"Which element makes up 14% of the dry weight of a bacterial cell?","options":["Nitrogen","Carbon","Phosphorus","Sulphur"],"answer":"Nitrogen","solution":"A: Correct: the growth requirements slides state nitrogen makes up 14% of dry cell weight and forms amino acids, DNA and RNA.\nB: Carbon makes up 50% of dry weight.\nC: Phosphorus forms DNA, RNA, ATP and phospholipids.\nD: Sulphur forms proteins and some vitamins.","source":"Bacteria Growth requirements.pptx | SLIDE 8","difficulty":"Hard"},{"id":"her-v2-333","module"
