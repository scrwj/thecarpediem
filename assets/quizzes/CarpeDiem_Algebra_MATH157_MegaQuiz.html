: 3[(20\\cdot21)/(2)-(5\\cdot4)/(2)]+2*16=632; direct summation gives the same value.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-340","module":"v3"},{"type":"fill","q":"Evaluate sum from k=10 to 40(4k-3).","answer":"3007","solution":"Use linearity: 4[(40\\cdot41)/(2)-(10\\cdot9)/(2)]+-3*31=3007; direct summation gives the same value.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-342","module":"v3"},{"type":"fill","q":"Evaluate sum from k=1 to 30(5k+2).","answer":"2385","solution":"Use linearity: 5[(30\\cdot31)/(2)-(1\\cdot0)/(2)]+2*30=2385; direct summation gives the same value.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-344","module":"v3"},{"type":"fill","q":"Evaluate sum from k=2 to 25(6k-1).","answer":"1920","solution":"Use linearity: 6[(25\\cdot26)/(2)-(2\\cdot1)/(2)]+-1*24=1920; direct summation gives the same value.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-346","module":"v3"},{"type":"fill","q":"Evaluate sum from k=7 to 31(3k+4).","answer":"1525","solution":"Use linearity: 3[(31\\cdot32)/(2)-(7\\cdot6)/(2)]+4*25=1525; direct summation gives the same value.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-348","module":"v3"},{"type":"fill","q":"Evaluate sum from k=4 to 19(7k-2).","answer":"1256","solution":"Use linearity: 7[(19\\cdot20)/(2)-(4\\cdot3)/(2)]+-2*16=1256; direct summation gives the same value.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-350","module":"v3"},{"type":"fill","q":"Evaluate sum from k=11 to 29(2k+5).","answer":"855","solution":"Use linearity: 2[(29\\cdot30)/(2)-(11\\cdot10)/(2)]+5*19=855; direct summation gives the same value.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-352","module":"v3"},{"type":"mcq","q":"Using the rules of summation, simplify sum from k=1 to n(4x_k+7).","options":["4sum x_k+7n","4sum x_k+7","sum x_k+7n","4sum x_k+n"],"answer":"4sum x_k+7n","solution":"Rule 1 pulls out the factor 4; Rule 2 gives sum from k=1 to n7=7n.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-354","module":"v3"},{"type":"mcq","q":"Which statement is true about the index of summation in sum from k=1 to nk^2?","options":["The index k may be replaced by any other dummy letter without changing the sum.","The value of the sum changes when k is replaced by j.","The index must always start at 1.","The index equals the upper limit n."],"answer":"The index k may be replaced by any other dummy letter without changing the sum.","solution":"A summation index is a dummy variable; renaming it leaves both the terms and the sum unchanged.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-356","module":"v3"},{"type":"mcq","q":"sum from k=1 to n(x_k+y_k) equals:","options":["sum x_k+sum y_k","sum x_ksum y_k","2sum x_k","sum(x_k y_k)"],"answer":"sum x_k+sum y_k","solution":"This is Rule 3 (linearity of summation).","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-358","module":"v3"},{"type":"fill","q":"An arithmetic sequence has first term 4 and common difference 5. Find the 11th term.","answer":"54","solution":"u_11 = a + (11 - 1)d = 4 + 10(5) = 54.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-360","module":"v3"},{"type":"fill","q":"An arithmetic sequence has first term 7 and common difference -3. Find the 20th term.","answer":"-50","solution":"u_20 = a + (20 - 1)d = 7 + 19(-3) = -50.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-362","module":"v3"},{"type":"fill","q":"An arithmetic sequence has first term 2 and common difference 6. Find the 15th term.","answer":"86","solution":"u_15 = a + (15 - 1)d = 2 + 14(6) = 86.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-364","module":"v3"},{"type":"fill","q":"An arithmetic sequence has first term 100 and common difference -7. Find the 12th term.","answer":"23","solution":"u_12 = a + (12 - 1)d = 100 + 11(-7) = 23.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-366","module":"v3"},{"type":"fill","q":"An arithmetic sequence has first term -3 and common difference 4. Find the 10th term.","answer":"33","solution":"u_10 = a + (10 - 1)d = -3 + 9(4) = 33.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-368","module":"v3"},{"type":"fill","q":"An arithmetic sequence has first term 12 and common difference 9. Find the 8th term.","answer":"75","solution":"u_8 = a + (8 - 1)d = 12 + 7(9) = 75.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-370","module":"v3"},{"type":"fill","q":"Find the sum of the first 15 terms of the AP with first term 4 and common difference 5.","answer":"585","solution":"S_15 = 15/2[2(4) + 14(5)] = 585, verified by adding the 15 terms.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-372","module":"v3"},{"type":"fill","q":"Find the sum of the first 12 terms of the AP with first term 3 and common difference 7.","answer":"498","solution":"S_12 = 12/2[2(3) + 11(7)] = 498, verified by adding the 12 terms.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-374","module":"v3"},{"type":"fill","q":"Find the sum of the first 20 terms of the AP with first term 10 and common difference 3." e 2 and sum 160. Find the number of terms.","answer":"10","solution":"Solving 10/2[2(7) + (n - 1)(2)] = 160 gives the quadratic 2n² + 12n - 320 = 0, whose positive root is n = 10.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-388","module":"v3"},{"type":"fill","q":"An AP has first term 3, common difference 5 and sum 255. Find the number of terms.","answer":"10","solution":"Solving 10/2[2(3) + (n - 1)(5)] = 255 gives the quadratic 2n² + 1n - 510 = 0, whose positive root is n = 10.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-390","module":"v3"},{"type":"fill","q":"Find the 12th term of the GP with first term 128 and common ratio 0.5.","answer":"0.0625","solution":"u_12 = a·r^(n-1) = 128·(0.5)^11 = 0.0625.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-392","module":"v3"},{"type":"fill","q":"Find the 10th term of the GP with first term 3 and common ratio 2.","answer":"1536","solution":"u_10 = a·r^(n-1) = 3·(2)^9 = 1536.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-394","module":"v3"},{"type":"fill","q":"Find the 6th term of the GP with first term 5 and common ratio 3.","answer":"1215","solution":"u_6 = a·r^(n-1) = 5·(3)^5 = 1215.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-396","module":"v3"},{"type":"fill","q":"Find the 8th term of the GP with first term 2 and common ratio -2.","answer":"-256","solution":"u_8 = a·r^(n-1) = 2·(-2)^7 = -256.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-398","module":"v3"},{"type":"fill","q":"Find the 5th term of the GP with first term 81 and common ratio 0.3333333333333333.","answer":"1","solution":"u_5 = a·r^(n-1) = 81·(0.3333333333333333)^4 = 1.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-400","module":"v3"},{"type":"fill","q":"Find the 7th term of the GP with first term 1 and common ratio 4.","answer":"4096","solution":"u_7 = a·r^(n-1) = 1·(4)^6 = 4096.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-402","module":"v3"},{"type":"fill","q":"Find the sum of the first 10 terms of the GP with a = 1 and r = 2.","answer":"1023","solution":"S_n = a(1 - r^n)/(1 - r) = 1(1 - (2)^10)/(1 - 2) ≈ 1023.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-404","module":"v3"},{"type":"fill","q":"Find the sum of the first 6 terms of the GP with a = 3 and r = 0.5.","answer":"5.90625","solution":"S_n = a(1 - r^n)/(1 - r) = 3(1 - (0.5)^6)/(1 - 0.5) ≈ 5.90625.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-406","module":"v3"},{"type":"fill","q":"Find the sum of the first 5 terms of the GP with a = 5 and r = 3.","answer":"605","solution":"S_n = a(1 - r^n)/(1 - r) = 5(1 - (3)^5)/(1 - 3) ≈ 605.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-408","module":"v3"},{"type":"fill","q":"Find the sum of the first 4 terms of the GP with a = 2 and r = 4.","answer":"170","solution":"S_n = a(1 - r^n)/(1 - r) = 2(1 - (4)^4)/(1 - 4) ≈ 170.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-410","module":"v3"},{"type":"fill","q":"Find the sum of the first 9 terms of the GP with a = 100 and r = 0.8.","answer":"432.89114","solution":"S_n = a(1 - r^n)/(1 - r) = 100(1 - (0.8)^9)/(1 - 0.8) ≈ 432.89114.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-412","module":"v3"},{"type":"fill","q":"Find the sum of the first 6 terms of the GP with a = 7 and r = -2.","answer":"-147","solution":"S_n = a(1 - r^n)/(1 - r) = 7(1 - (-2)^6)/(1 - -2) ≈ -147.","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-414","module":"v3"},{"type":"fill","q":"Find the sum to infinity of the GP with first term 8 and ratio 0.5.","answer":"16","solution":"S∞ = a/(1 - r) = 8/(1 - 0.5) = 16 (valid since |r| < 1).","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-416","module":"v3"},{"type":"fill","q":"Find the sum to infinity of the GP with first term 12 and ratio 0.3333333333333333.","answer":"18","solution":"S∞ = a/(1 - r) = 12/(1 - 0.3333333333333333) = 18 (valid since |r| < 1).","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-418","module":"v3"},{"type":"fill","q":"Find the sum to infinity of the GP with first term 20 and ratio 0.75.","answer":"80","solution":"S∞ = a/(1 - r) = 20/(1 - 0.75) = 80 (valid since |r| < 1).","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-420","module":"v3"},{"type":"fill","q":"Find the sum to infinity of the GP with first term 6 and ratio 0.9.","answer":"60","solution":"S∞ = a/(1 - r) = 6/(1 - 0.9) = 60 (valid since |r| < 1).","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-422","module":"v3"},{"type":"fill","q":"Find the sum to infinity of the GP with first term 5 and ratio 0.2.","answer":"6.25","solution":"S∞ = a/(1 - r) = 5/(1 - 0.2) = 6.25 (valid since |r| < 1).","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-424","module":"v3"},{"type":"fill","q":"Find the sum to infinity of the GP with first term 100 and ratio 0.1.","answer":"111.11111","solution":"S∞ = a/(1 - r) = 100/(1 - 0.1) = 111.11111 (valid since |r| < 1).","source":"MATH 157 ALGEBRA 4.pdf (sequences & series) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-426",  3","solution":"Change of base: log_p q = 1/(log_q p).","source":"MATH 157 ALGEBRA 3.pdf (logarithms) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-512","module":"v3"},{"type":"mcq","q":"Express log_4 5 in terms of log_5 4.","options":["1/log_5 4","log_5 4","-log_5 4","1"],"answer":"1/log_5 4","solution":"Change of base: log_p q = 1/(log_q p).","source":"MATH 157 ALGEBRA 3.pdf (logarithms) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-514","module":"v3"},{"type":"mcq","q":"Express log_2 7 in terms of log_7 2.","options":["1/log_7 2","log_7 2","-log_7 2","1"],"answer":"1/log_7 2","solution":"Change of base: log_p q = 1/(log_q p).","source":"MATH 157 ALGEBRA 3.pdf (logarithms) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-516","module":"v3"},{"type":"fill","q":"Solve log₂x + log₂(x - 2) = 3.","answer":"4","solution":"log₂[x(x - 2)] = 3 → x² - 2x = 8 → x = 4 or -2; only x = 4 is in the domain.","source":"MATH 157 ALGEBRA 3.pdf (logarithms) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-518","module":"v3"},{"type":"fill","q":"Solve 3^(2x) - 4·3^x + 3 = 0.","answer":"0 or 1","solution":"Let y = 3^x: y² - 4y + 3 = 0 → y = 1 or 3 → x = 0 or 1.","source":"MATH 157 ALGEBRA 3.pdf (logarithms) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-520","module":"v3"},{"type":"fill","q":"Find the determinant of [[3, 5], [2, 4]].","answer":"2","solution":"For a 2 × 2 matrix, det = ad - bc = 3(4) - (5)(2) = 2.","source":"MATH 157 ALGEBRA 8.pdf (matrices) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-522","module":"v3"},{"type":"fill","q":"Find the determinant of [[1, -2], [3, 7]].","answer":"13","solution":"For a 2 × 2 matrix, det = ad - bc = 1(7) - (-2)(3) = 13.","source":"MATH 157 ALGEBRA 8.pdf (matrices) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-524","module":"v3"},{"type":"fill","q":"Find the determinant of [[0, 4], [-1, 6]].","answer":"4","solution":"For a 2 × 2 matrix, det = ad - bc = 0(6) - (4)(-1) = 4.","source":"MATH 157 ALGEBRA 8.pdf (matrices) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-526","module":"v3"},{"type":"fill","q":"Find the determinant of [[5, 0], [-3, 2]].","answer":"10","solution":"For a 2 × 2 matrix, det = ad - bc = 5(2) - (0)(-3) = 10.","source":"MATH 157 ALGEBRA 8.pdf (matrices) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-528","module":"v3"},{"type":"fill","q":"Find the determinant of [[2, 7], [4, 1]].","answer":"-26","solution":"For a 2 × 2 matrix, det = ad - bc = 2(1) - (7)(4) = -26.","source":"MATH 157 ALGEBRA 8.pdf (matrices) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-530","module":"v3"},{"type":"fill","q":"Find the determinant of [[1, 2, 3], [4, 5, 6], [7, 8, 10]].","answer":"-3","solution":"det = 1(5·10 - 6·8) - 2(4·10 - 6·7) + 3(4·8 - 5·7) = -3.","source":"MATH 157 ALGEBRA 8.pdf (matrices) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-532","module":"v3"},{"type":"fill","q":"Find the determinant of [[2, 0, 1], [3, -1, 2], [1, 4, -2]].","answer":"1","solution":"det = 2(-1·-2 - 2·4) - 0(3·-2 - 2·1) + 1(3·4 - -1·1) = 1.","source":"MATH 157 ALGEBRA 8.pdf (matrices) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-534","module":"v3"},{"type":"fill","q":"Find the determinant of [[1, -2, 3], [0, 5, -4], [2, 1, 6]].","answer":"20","solution":"det = 1(5·6 - -4·1) - -2(0·6 - -4·2) + 3(0·1 - 5·2) = 20.","source":"MATH 157 ALGEBRA 8.pdf (matrices) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-536","module":"v3"},{"type":"fill","q":"Find the determinant of [[3, 1, 0], [2, -4, 5], [1, 2, -1]].","answer":"-11","solution":"det = 3(-4·-1 - 5·2) - 1(2·-1 - 5·1) + 0(2·2 - -4·1) = -11.","source":"MATH 157 ALGEBRA 8.pdf (matrices) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-538","module":"v3"},{"type":"fill","q":"Find the determinant of [[1, 1, 1], [2, 3, 1], [1, 2, 4]].","answer":"4","solution":"det = 1(3·4 - 1·2) - 1(2·4 - 1·1) + 1(2·2 - 3·1) = 4.","source":"MATH 157 ALGEBRA 8.pdf (matrices) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-540","module":"v3"},{"type":"mcq","q":"Find the inverse of [[4, 7], [2, 4]].","options":["[[4/2, -7/2], [-2/2, 4/2]]","[[4, -7], [-2, 4]]","[[4, 2], [7, 4]]","undefined"],"answer":"[[4/2, -7/2], [-2/2, 4/2]]","solution":"For [[a,b],[c,d]], A⁻¹ = (1/(ad - bc))[[d, -b], [-c, a]]; here ad - bc = 2.","source":"Elementary-Linear-Algebra-with-Applications-Anton-Rorres.pdf (textbook exercise, verified)","difficulty":"Hard","id":"alg-v3-542","module":"v3"},{"type":"mcq","q":"Find the inverse of [[3, 1], [2, 1]].","options":["[[1/1, -1/1], [-2/1, 3/1]]","[[1, -1], [-2, 3]]","[[3, 2], [1, 1]]","undefined"],"answer":"[[1/1, -1/1], [-2/1, 3/1]]","solution":"For [[a,b],[c,d]], A⁻¹ = (1/(ad - bc))[[d, -b], [-c, a]]; here ad - bc = 1.","source":"Elementary-Linear-Algebra-with-Applications-Anton-Rorres.pdf (textbook exercise, verified)","difficulty":"Hard","id":"alg-v3-544","module":"v3"},{"type":"mcq","q":"Find the inverse of [[5, -2], [3, -1]].","options":["[[-1/1, 2/1], [-3/1, 5/1]]","[[-1, 2], [-3, 5]]","[[5, 3], [-2, -1]]","undefined"],"answer":"[[-1/1, 2/1], [-3/1, 5/1]]","solution":"For [[a,b],[c,d]], A⁻¹ = (1/(ad - bc))[[d, -b], [-c, a]]; here ad - bc = 1.","source":"Elementary-Linear-Algebra-with-Applications-Anton-Rorres.pdf (textbook exercise, verified)","difficulty":"Hard","id":"alg-v3-546","module":"v3"},{"type":"fill","q":"A is 2 × 3 and B is 3 × 4. If AB exists, how many rows does AB have?","answer":"2","solution":"AB is defined only when the inner dimensions match (columns of A = rows of B); its size is (2 × 4).","source":"Elementary-Linear-Algebra-with-Applications-Anton-Rorres.pdf (textbook exercise, verified)","difficulty":"Medium","id":"alg-v3-548","module":"v3"},{"type":"fill","q":"A is 3 × 2 and B is 2 × 5. If AB exists, how many rows does AB have?","answer":"3","solution":"AB is defined only when the inner dimensions match (columns of A = rows of B); its size is (3 × 5).","source":"Elementary-Linear-Algebra-with-Applications-Anton-Rorres.pdf (textbook exercise, verified)","difficulty":"Medium","id":"alg-v3-550","module":"v3"},{"type":"fill","q":"A is 4 × 4 and B is 4 × 4. If AB exists, how many rows does AB have?","answer":"4","solution":"AB is defined only when the inner dimensions match (columns of A = rows of B); its size is (4 × 4).","source":"Elementary-Linear-Algebra-with-Applications-Anton-Rorres.pdf (textbook exercise, verified)","difficulty":"Medium","id":"alg-v3-552","module":"v3"},{"type":"fill","q":"Find all real k for which [[k, 3], [4, k]] is singular.","answer":"no real k","solution":"det = k² - 3(4) = k² -12; setting it to zero gives k² = -12.","source":"MATH 157 ALGEBRA 8.pdf (matrices) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-554","module":"v3"},{"type":"fill","q":"Find all real k for which [[k, 3], [3, k]] is singular.","answer":"no real k","solution":"det = k² - 3(3) = k² -9; setting it to zero gives k² = -9.","source":"MATH 157 ALGEBRA 8.pdf (matrices) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-556","module":"v3"},{"type":"fill","q":"Find all real k for which [[k, 3], [0, k]] is singular.","answer":"k = ±0","solution":"det = k² - 3(0) = k² +0; setting it to zero gives k² = 0.","source":"MATH 157 ALGEBRA 8.pdf (matrices) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-558","module":"v3"},{"type":"mcq","q":"If A is 3 × 5, B is 5 × 2 and C is 2 × 4, what is the size of ABC?","options":["3 × 4","3 × 2","5 × 4","undefined"],"answer":"3 × 4","solution":"AB is 3 × 2, so (AB)C is 3 × 4.","source":"Elementary-Linear-Algebra-with-Applications-Anton-Rorres.pdf (textbook exercise, verified)","difficulty":"Medium","id":"alg-v3-560","module":"v3"},{"type":"mcq","q":"Which property holds for every square matrix A?","options":["(Aᵀ)ᵀ = A","A + Aᵀ = 0","Aᵀ = A","det(Aᵀ) = -det(A)"],"answer":"(Aᵀ)ᵀ = A","solution":"Transposing twice returns the original matrix; det(Aᵀ) = det(A), not its negative.","source":"Elementary-Linear-Algebra-with-Applications-Anton-Rorres.pdf (textbook exercise, verified)","difficulty":"Medium","id":"alg-v3 H 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-694","module":"v3"},{"type":"fill","q":"If n(A) = 9, n(B) = 14 and n(A ∩ B) = 4, find n(A ∪ B).","answer":"19","solution":"Inclusion–exclusion: n(A ∪ B) = 9 + 14 - 4 = 19.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-696","module":"v3"},{"type":"fill","q":"If n(A) = 17, n(B) = 11 and n(A ∩ B) = 6, find n(A ∪ B).","answer":"22","solution":"Inclusion–exclusion: n(A ∪ B) = 17 + 11 - 6 = 22.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-698","module":"v3"},{"type":"fill","q":"A set has 3 elements. How many subsets does it have?","answer":"8","solution":"The power set has 2^n = 2^3 = 8 elements.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-700","module":"v3"},{"type":"fill","q":"A set has 4 elements. How many subsets does it have?","answer":"16","solution":"The power set has 2^n = 2^4 = 16 elements.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-702","module":"v3"},{"type":"fill","q":"A set has 5 elements. How many subsets does it have?","answer":"32","solution":"The power set has 2^n = 2^5 = 32 elements.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-704","module":"v3"},{"type":"fill","q":"A set has 6 elements. How many subsets does it have?","answer":"64","solution":"The power set has 2^n = 2^6 = 64 elements.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-706","module":"v3"},{"type":"fill","q":"A set has 4 elements. How many of its subsets contain a given fixed element?","answer":"8","solution":"Choose whether or not to include each of the other 3 elements: 2^3 = 8.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-708","module":"v3"},{"type":"fill","q":"A set has 5 elements. How many of its subsets contain a given fixed element?","answer":"16","solution":"Choose whether or not to include each of the other 4 elements: 2^4 = 16.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-710","module":"v3"},{"type":"fill","q":"A set has 6 elements. How many of its subsets contain a given fixed element?","answer":"32","solution":"Choose whether or not to include each of the other 5 elements: 2^5 = 32.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-712","module":"v3"},{"type":"fill","q":"U = {1, …, 20}, A = multiples of 2 in U, B = multiples of 3 in U. Find |A ∪ B|.","answer":"13","solution":"|A| = 10, |B| = 6, |A ∩ B| = 3, so |A ∪ B| = 13.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-714","module":"v3"},{"type":"fill","q":"U = {1, …, 30}, A = multiples of 2 in U, B = multiples of 3 in U. Find |A ∪ B|.","answer":"13","solution":"|A| = 9, |B| = 5, |A ∩ B| = 1, so |A ∪ B| = 13.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-716","module":"v3"},{"type":"fill","q":"U = {1, …, 15}, A = multiples of 2 in U, B = multiples of 3 in U. Find |A ∪ B|.","answer":"9","solution":"|A| = 7, |B| = 4, |A ∩ B| = 2, so |A ∪ B| = 9.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Hard","id":"alg-v3-718","module":"v3"},{"type":"mcq","q":"Which statement is always true for sets A and B?","options":["(A ∪ B)' = A' ∩ B'","(A ∪ B)' = A' ∪ B'","A ∩ B = A ∪ B","(A')' = ∅"],"answer":"(A ∪ B)' = A' ∩ B'","solution":"This is De Morgan's law for the union of two sets.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-720","module":"v3"}]};
let mod = BANK.modules[0].id;
let list = [];
let idx = 0;
let ans = {};
let secs = 7200;
let tick = null;
let done = false;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function drawMods(){
  document.getElementById('mods').innerHTML = BANK.modules.map(function(m){
    return '<button class="modbtn'+(m.id===mod?' sel':'')+'" onclick="pick(\''+m.id+'\')">'+
      '<b>'+esc(m.name)+'</b><span>'+esc(m.desc)+' - '+m.count+' questions</span></button>';
  }).join('');
}
function pick(id){ mod=id; drawMods(); }

function begin(){
  list = BANK.questions.filter(function(q){return q.module===mod});
  if(!list.length){alert('No questions in this set');return}
  idx=0; ans={}; secs=7200; done=false;
  document.getElementById('start').style.display='none';
  document.getElementById('exam').style.display='block';
  document.getElementById('results').style.display='none';
  document.getElementById('timerbar').style.display='flex';
  document.getElementById('td').textContent='2:00:00';
  document.getElementById('quizSub').textContent=BANK.modules.filter(function(m){return m.id===mod})[0].name+' - '+list.length+' questions';
  clearInterval(tick);
  tick=setInterval(function(){
    secs--;
    if(secs<=0){clearInterval(tick);finish();return}
    var h=Math.floor(secs/3600), m=Math.floor((secs%3600)/60), s=secs%60;
    document.getElementById('td').textContent=h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    var bar=document.getElementById('timerbar');
    bar.className='timerbar'+(secs<=300?' danger':secs<=900?' warn':'');
  },1000);
  render();
}
function toggleTimer(){
  var b=document.getElementById('timerbar'), td=document.getElementById('td');
  if(b.dataset.hidden==='1'){b.style.display='flex';b.dataset.hidden='0';document.getElementById('hideBtn').textContent='Hide'}
  else{b.style.display='none';b.dataset.hidden='1'}
}
function setAnsIdx(i){
  ans[idx]=list[idx].options[i];
  var btns=document.querySelectorAll('.opt');
  btns.forEach(function(b,j){ b.className='opt'+(j===i?' sel':''); });
  renderNav();
}
function setAns(v){ ans[idx]=v; renderNav(); }

function render(){
  var q=list[idx];
  var opts='';
  if(q.type==='mcq'){
    opts='<div class="opts">'+q.options.map(function(o,i){
      var k=String.fromCharCode(65+i);
      return '<button class="opt'+(ans[idx]===o?' sel':'')+'" onclick="setAnsIdx('+i+')">'+
        '<span class="key">'+k+'</span><span>'+esc(o)+'</span></button>';
    }).join('')+'</div>';
  }else{
    opts='<div class="fillrow"><label>Answer:</label><input type="text" id="fill" placeholder="type your answer" value="'+esc(ans[idx]||'')+'" oninput="ans['+idx+']=this.value;renderNav()"><span class="hint">numeric or short answer</span></div>';
  }
  document.getElementById('exam').innerHTML=
    '<div class="card"><div class="qhead"><span class="qnum">Question '+(idx+1)+' of '+list.length+'</span>'+
    '<span class="qtag">'+esc(q.difficulty||'Medium')+' - '+esc(q.source||'')+'</span></div>'+
    '<div class="qtext">'+esc(q.q)+'</div>'+opts+'</div>'+
    '<div class="navrow"><button class="btn prev" onclick="go(-1)" '+(idx===0?'disabled':'')+'>Previous page</button>'+
    (idx===list.length-1?'<button class="btn finish" onclick="finish()">Submit exam</button>':'<button class="btn next" onclick="go(1)">Next page</button>')+'</div>'+
    '<div class="qgrid" id="qgrid"></div>';
  renderNav();
  window.scrollTo(0,0);
}
function renderNav(){
  var g=document.getElementById('qgrid'); if(!g)return;
  g.innerHTML=list.map(function(_,i){
    var c=(ans[i]!==undefined&&ans[i]!=='')?' done':'';
    if(i===idx)c+=' cur';
    return '<button class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</button>';
  }).join('');
}
function go(d){ var n=idx+d; if(n<0||n>=list.length)return; idx=n; render(); }
function jump(i){ idx=i; render(); }

function finish(){
  if(done)return; done=true; clearInterval(tick);
  var correct=0,wrong=0,skip=0,html='';
  list.forEach(function(q,i){
    var u=ans[i], ok=false;
    if(u===undefined||u===''){skip++}
    else if(q.type==='mcq'){ok=(u===q.answer)}
    else{
      var a=String(q.answer).trim().toLowerCase(), b=String(u).trim().toLowerCase();
      ok=(a===b);
      if(!ok){var na=parseFloat(a),nb=parseFloat(b); if(!isNaN(na)&&!isNaN(nb))ok=Math.abs(na-nb)<=0.005}
    }
    if(ok)correct++;else if(u!==undefined&&u!=='')wrong++;
    html+='<div class="item '+(ok?'':'wrong')+'"><div class="qq">Q'+(i+1)+'. '+esc(q.q)+'</div>'+
      '<div class="aa '+(ok?'ok':'no')+'">Your answer: '+esc(u===undefined||u===''?'-':u)+'</div>'+
      (ok?'':'<div class="aa ok">Correct: '+esc(q.answer)+'</div>')+
      (q.solution?'<div class="sol"><b>Solution:</b> '+esc(q.solution)+'</div>':'')+'</div>';
  });
  var pct=Math.round(correct/list.length*100);
  document.getElementById('exam').style.display='none';
  document.getElementById('timerbar').style.display='none';
  document.getElementById('results').style.display='block';
  document.getElementById('results').innerHTML=
    '<div class="res"><h2>Examination complete</h2><div class="score">'+pct+'%</div>'+
    '<div class="rstat"><div><b>'+correct+'</b>Correct</div><div><b>'+wrong+'</b>Wrong</div><div><b>'+skip+'</b>Skipped</div></div>'+
    '<p style="color:var(--muted);font-size:13px">Review — wrong and skipped answers shown with worked solutions.</p></div>'+html+
    '<button class="bigbtn" onclick="location.reload()">New attempt</button>';
  window.scrollTo(0,0);
}
drawMods();
</script>
</body>
</html>
