"source":"MATH 157 lecture slides (Kwame Piesie) — Arithmetic Progression","difficulty":"Hard"},{"id":"alg-v3-146","module":"v3","type":"mcq","q":"If a = 4 and d = -2, what is the sum of the first 5 terms of the arithmetic progression?","options":["-10","0","5","10"],"answer":"0","solution":"First term a=4, d=-2 → terms: 4, 2, 0, -2, -4. Sum = 4+2+0-2-4 = 0 (or S5 = 5/2·(4+(-4)) = 0).","source":"MATH 157 lecture slides (Kwame Piesie) — Sum of AP","difficulty":"Medium"},{"id":"alg-v3-147","module":"v3","type":"mcq","q":"In a geometric sequence where the sixth term is eight times the third term, what is the common ratio?","options":["1","2","3","4"],"answer":"2","solution":"Let the first term be a and common ratio r. Sixth term = a r^5, third term = a r^2. Given a r^5 = 8·(a r^2) → r^3 = 8 → r = 2. Check: a·2^5 = 32a, a·2^2 = 4a, 32a = 8·4a, true.","source":"MATH 157 lecture slides (Kwame Piesie) — Geometric Progression","difficulty":"Hard"},{"id":"alg-v3-148","module":"v3","type":"mcq","q":"If the second and fourth terms of a geometric sequence are 9 and 4 respectively, what is the sum of the first and third terms?","options":["19","19.5","20","21"],"answer":"19.5","solution":"Let first term = a, ratio = r. Then ar = 9 and ar^3 = 4 ⇒ r^2 = 4/9 ⇒ r = 2/3 (positive). So a = 9 / r = 9·3/2 = 27/2 = 13.5. Third term = ar^2 = 13.5·(4/9)=6. Sum of first and third = 13.5+6 = 19.5 → option B.","source":"MATH 157 lecture slides (Kwame Piesie) — Geometric Progression","difficulty":"Hard"},{"id":"alg-v3-149","module":"v3","type":"mcq","q":"If a geometric progression has first term 5 and common ratio 3/4, what is its sum to infinity?","options":["20","15","5","10"],"answer":"20","solution":"S∞ = a/(1−r) = 5/(1−3/4) = 5/(1/4) = 20, which matches option A. Verification: 5+5·(3/4)+5·(3/4)²+… = 5+3.75+2.8125+… → limit 20.","source":"MATH 157 lecture slides (Kwame Piesie) — Sum to Infinity","difficulty":"Hard"},{"id":"alg-v3-150","module":"v3","type":"mcq","q":"With the same sequence as above (first term 1, ratio 2), what is the sum of the terms from the 5th to the 11th inclusive?","options":["2048","2032","2016","2000"],"answer":"2032","solution":"a_n = 1·2^n-1. Terms 5‑11 are 2^4 through 2^10. Sum = 2^4(2^7-1)/(2-1)=16·127=2032, which matches 16+32+64+128+256+512+1024=2032.","source":"MATH 157 lecture slides (Kwame Piesie) — Geometric Progression","difficulty":"Hard"},{"id":"alg-v3-151","module":"v3","type":"mcq","q":"For which of the following values of the common ratio r is the sum to infinity of a geometric series defined?","options":["|r|<1","r=2","r=-1","r=1"],"answer":"|r|<1","solution":"Sum to infinity of a geometric series exists iff |r|<1. Options: A states this condition, B (r=2) and D (r=1) have |r|≥1, C (r=-1) has |r|=1, so only A is correct.","source":"MATH 157 lecture slides (Kwame Piesie) — Sum to Infinity","difficulty":"Hard"},{"id":"alg-v3-152","module":"v3","type":"mcq","q":"The sum to infinity of a geometric series is 12 and its first term is 4. What is the common ratio?","options":["1/2","2/3","3/4","5/6"],"answer":"2/3","solution":"For an infinite geometric series with first term a and ratio r (|r|<1), sum S = a/(1−r). Given a=4 and S=12: 4/(1−r)=12 ⇒ 1−r=4/12=1/3 ⇒ r=1−1/3=2/3. This matches option B.","source":"MATH 157 lecture slides (Kwame Piesie) — Sum to Infinity","difficulty":"Medium"},{"id":"alg-v3-153","module":"v3","type":"mcq","q":"After 5 years of depreciating at 15% per annum, what will be the value of a car originally priced at GH¢30 000 000?","options":["GH¢12 795 000","GH¢13 311 000","GH¢14 250 000","GH¢15 000 000"],"answer":"GH¢13 311 000","solution":"Compound depreciation: V=30,000,000(1-0.15)^5=30,000,000(0.85)^5=30,000,000×0.4437053125≈13,311,159, which rounds to GH¢13,311,000. Check: straight-line would be 30,000,000(1-5×0.15)=7,500,000, not an option, confirming compound depreciation is intended.","source":"MATH 157 lecture slides (Kwame Piesie) — Depreciation","difficulty":"Hard"},{"id":"alg-v3-154","module":"v3","type":"mcq","q":"In the example series 7/10 + 7/100 + 7/1000 + …, what is the sum to infinity?","options":["7/9","7/10","7/90","7/99"],"answer":"7/9","solution":"Geometric series with first term a=7/10 and ratio r=1/10. Sum to infinity S = a/(1‑r) = (7/10)/(1‑1/10) = (7/10)/(9/10)=7/9. Decimal check: 0.777… = 7/9, confirming the result.","source":"MATH 157 lecture slides (Kwame Piesie) — Sum to Infinity","difficulty":"Medium"},{"id":"alg-v3-155","module":"v3","type":"mcq","q":"What percentage of its original price remains after 5 years of 15% annual depreciation?","options":["33 %","44 %","55 %","66 %"],"answer":"44 %","solution":"Target: Final value after 5 years of 15% annual depreciation on original price. Method: Apply compound decay formula V = P(1 - 0.15)^5. Steps: (0.85)^5 = 0.4437 ≈ 44.4%, closest to option B (44%). Verification: Direct multiplication yields same result.","source":"MATH 157 lecture slides (Kwame Piesie) — Depreciation","difficulty":"Hard"},{"id":"alg-v3-156","module":"v3","type":"mcq","q":"Which of the following is NOT a permutation of the set {A, B, C}?","options":["ABC","ACB","BAC","XYZ"],"answer":"XYZ","solution":"A permutation of {A,B,C} must contain exactly the elements A, B, C with no repeats. Options A-ABC: valid permutation; B-ACB: valid; C-BAC: valid. Option D-XYZ: contains X,Y,Z which are not in the original set, thus not a permutation. Hinge step: checking that D has elements outside {A,B,C}. Verified: X,Y,Z are distinct but not A,B,C. Therefore D is not a permutation.","source":"MATH 157 lecture slides (Kwame Piesie) — Algebra","difficulty":"Hard"},{"id":"alg-v3-157","module":"v3","type":"mcq","q":"Which statement correctly describes a permutation?","options":["Order does not matter","It is an unordered selection","It is an ordered arrangement","It only applies to numbers"],"answer":"It is an ordered arrangement","solution":"Definition: A permutation is an ordered arrangement of distinct objects taken from a set. Given n distinct objects, selecting k of them where order matters gives P(n,k)=n!/(n-k)!. Example: arranging 3 books out of 5 on a shelf - order is critical. Verification: Option A (order doesn't matter) describes combinations, not permutations. Option B (unordered selection) also describes combinations. Opti","source":"MATH 157 lecture slides (Kwame Piesie) — Algebra","difficulty":"Hard"},{"id":"alg-v3-158","module":"v3","type":"mcq","q":"How many distinct permutations are there for the letters A, B, and C?","options":["3","4","6","9"],"answer":"6","solution":"3 distinct letters → 3! = 6 permutations. Verification: ABC, ACB, BAC, BCA, CAB, CBA = 6.","source":"MATH 157 lecture slides (Kwame Piesie) — Algebra","difficulty":"Hard"},{"id":"alg-v3-159","module":"v3","type":"mcq","q":"If n is a positive integer, which statement about factorials is always true?","options":["0! = 0","1! = 1","n! = n × (n‑1)!","(n+1)! = n! × (n+2)"],"answer":"n! = n × (n‑1)!","solution":"For positive integer n, n! = n(n-1)...1 = n·(n-1)! by peeling off the factor n; this holds for every n>=1. Check options: A false since 0!=1; B is true as a constant but does not quantify over n; C matches the recurrence and is always true; D false since (n+1)!=(n+1)n!, not (n+2)n!. Verification: n=1 gives 1!=1·0!=1; n=3 gives 6=3·2!. Answer C.","source":"MATH 157 lecture slides (Kwame Piesie) — Factorial Notation","difficulty":"Medium"},{"id":"alg-v3-160","module":"v3","type":"mcq","q":"If we consider the ordered arrangement of 4 distinct objects, how many possible permutations are there?","options":["4","8","12","24"],"answer":"24","solution":"Permutations of 4 distinct objects = 4! = 4×3×2×1 = 24. Verification: For 3 distinct objects, permutations = 6 = 3!, consistent with factorial pattern. Option D is 24.","source":"MATH 157 lecture slides (Kwame Piesie) — Algebra","difficulty":"Hard"},{"id":"alg-v3-161","module":"v3","type":"mcq","q":"How many permutations are there of 5 distinct objects taken all at a time?","options":["5","120","25","60"],"answer":"120","solution":"5! = 5×4×3×2×1 = 120. Permutations of n distinct objects taken all at a time is n!.","source":"MATH 157 lecture slides (Kwame Piesie) — Permutations","difficulty":"Hard"},{"id":"alg-v3-162","module":"v3","type":"mcq","q":"How many ways can 3 books be selected and ordered from a set of 7 distinct books?","options":["56","210","35","84"],"answer":"210","solution":"Target: count ordered selections of 3 distinct books from 7. Domain: permutations of size 3 from 7 distinct items. Method: use permutation formula P(n,k)=n!/(n‑k)!. Compute P(7,3)=7!/(7‑3)!=7!/4!=7·6·5=210. Verify: small‑case check with 4 books, selecting & ordering 3 gives 4·3·2=24, which matches 4!/(4‑3)!=24, confirming the method. Hence the correct choice is B (210).","source":"MATH 157 lecture slides (Kwame Piesie) — Permutations","difficulty":"Medium"},{"id":"alg-v3-163","module":"v3","type":"mcq","q":"Which expression correctly rewrites 6! in terms of 5!?","options":["6 × 5!","6 × 4!","6 × 5 × 4!","6 × 5 × 4 × 3!"],"answer":"6 × 5!","solution":"1) Target: rewrite 6! using 5!. Given: n! = n·(n‑1)!. 2) Map: 6! = 6·5!. 3) Solve: 6! = 6·5! (direct). 4) Verify: 6! =720, 5! =120, 6·120 =720 ✓. Hence option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Factorial Notation","difficulty":"Hard"},{"id":"alg-v3-164","module":"v3","type":"mcq","q":"What is the third term in the binomial expansion of ((x-2y)^5)?","options":["40,x^3y^2","10,x^3y^2","20,x^3y^2","40,x^2y^3"],"answer":"40,x^3y^2","solution":"Third term = C(5,2) x^5-2 (-2y)^2 = 10·x^3·4y^2 = 40 x^3 y^2, matching option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Binomial Expansion","difficulty":"Medium"},{"id":"alg-v3-165","module":"v3","type":"mcq","q":"In the expansion of ((2x-t)^6), what is the coefficient of the term (x^4t^2)?","options":["240","480","120","60"],"answer":"240","solution":"Target: coefficient of x^4 t^2 in (2x‑t)^6. \nGeneral term: C(6,k)(2x)^k(-t)^6‑k. Need k=4 (x^4) → 6‑k=2 (t^2). \nCoefficient = C(6,4)·2^4·(-1)^2 = 15·16·1 = 240. \nVerification: direct substitution of k=4 in the binomial expansion gives the same term 240 x^4 t^2, confirming the result.","source":"MATH 157 lecture slides (Kwame Piesie) — Binomial Expansion","difficulty":"Hard"},{"id":"alg-v3-166","module":"v3","type":"mcq","q":"What is the coefficient of the term linear in (x) in the expansion of ((x+5y)^5)?","options":["3125,y^4","625,y^4","15625,y^4","2500,y^4"],"answer":"3125,y^4","solution":"Use binomial theorem: (x+5y)^5 = Σ C(5,k) x^5-k(5y)^k. Linear in x requires exponent of x = 1 → 5‑k = 1 → k = 4. Term = C(5,4) x (5y)^4 = 5·5^4 y^4 x = 3125 y^4 x. Coefficient = 3125 y^4, matching option A. Verification: direct computation of C(5,4)·5^4 = 5·625 = 3125.","source":"MATH 157 lecture slides (Kwame Piesie) — Binomial Expansion","difficulty":"Medium"},{"id":"alg-v3-167","module":"v3","type":"mcq","q":"What is the coefficient of the term (x^4) in the expansion of ((2x-1)^6)?","options":["240","480","120","64"],"answer":"240","solution":"Use binomial theorem: (2x-1)^6 = Σ C(6,k)(2x)^k(-1)^6-k. For x^4 we need k=4. Coefficient = C(6,4)·(2)^4·(-1)^2=15·16·1=240. Verify by plugging x=1: (2·1-1)^6=1, sum of all coefficients =1, and the x^4 term contributes 240·1^4 =240, consistent with the computed coefficient.","source":"MATH 157 lecture slides (Kwame Piesie) — Binomial Expansion","difficulty":"Medium"},{"id":"alg-v3-168","module":"v3","type":"mcq","q":"What is the sum of all the coefficients in the expansion of ((3-6x)^8)?","options":["6561","6560","6562","5120"],"answer":"6561","solution":"Sum of coefficients = f(1) = (3-6*1)^8 = (-3)^8 = 3^8 = 6561, which matches option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Binomial Expansion","difficulty":"Medium"},{"id":"alg-v3-169","module":"v3","type":"mcq","q":"Find the length of the line segment joining A(1,2) and B(4,6).","options":["3","5","6","7"],"answer":"5","solution":"Distance = √[(4‑1)²+(6‑2)²] = √[3²+4²] = √[9+16] = √25 = 5. Verified by the 3‑4‑5 right‑triangle.","source":"MATH 157 lecture slides (Kwame Piesie) — Distance between two points","difficulty":"Medium"},{"id":"alg-v3-170","module":"v3","type":"mcq","q":"How many distinct arrangements are there of the letters in the word \"NOTATION\"?","options":["5040","2016","40320","504"],"answer":"5040","solution":"Word \"NOTATION\" has 8 letters. Letter counts: N×2, O×2, T×2, A×1, I×1. Distinct permutations = 8! / (2!·2!·2!) = 40320 / 8 = 5040. This matches option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Combinatorics","difficulty":"Hard"},{"id":"alg-v3-171","module":"v3","type":"mcq","q":"If the distance between the points (x,0) and (0,y) is 10, which equation must be true?","options":["x^2 + y^2 = 100","x + y = 10","x^2 - y^2 = 100","2(x + y) = 10"],"answer":"x^2 + y^2 = 100","solution":"Distance between (x,0) and (0,y): √[(x‑0)²+(0‑y)²]=√[x²+y²]=10 → square: x²+y²=100 (option A). Verify: e.g., x=6, y=8 gives 36+64=100 and √100=10.","source":"MATH 157 lecture slides (Kwame Piesie) — Distance between two points","difficulty":"Hard"},{"id":"alg-v3-172","module":"v3","type":"mcq","q":"The points (2, -1) and (5, 3) are vertices of a line segment. What is its length?","options":["√7","5","7","√25"],"answer":"5","solution":"Δx = 5-2 = 3, Δy = 3-(-1) = 4. Distance = √(3²+4²) = √(9+16) = √25 = 5. Substituting back confirms the length is 5, matching option B.","source":"MATH 157 lecture slides (Kwame Piesie) — Distance between two points","difficulty":"Medium"},{"id":"alg-v3-173","module":"v3","type":"mcq","q":"Points A(p, q) and B(r, s) are 13 units apart and the horizontal difference p - r equals 5. What is |q - s|?","options":["5","12","13","25"],"answer":"12","solution":"Distance formula: √[(p‑r)²+(q‑s)²]=13. Given p‑r=5 ⇒ (p‑r)²=25. Then (q‑s)²=13²‑25=169‑25=144 ⇒ |q‑s|=√144=12. Verify: 5²+12²=25+144=169=13².","source":"MATH 157 lecture slides (Kwame Piesie) — Distance between two points","difficulty":"Devil Mode"},{"id":"alg-v3-174","module":"v3","type":"mcq","q":"Find the distance between A(0, 0) and B(3, 4).","options":["3","4","5","6"],"answer":"5","solution":"Target: distance between A(0,0) and B(3,4). Givens: points in ℝ². Method: Euclidean distance formula d = √[(x₂−x₁)²+(y₂−y₁)²]. Compute: √[(3−0)²+(4−0)²] = √[9+16] = √25 = 5. Verify: 3‑4‑5 right triangle gives hypotenuse 5, matches calculation.","source":"MATH 157 lecture slides (Kwame Piesie) — Distance between points","difficulty":"Medium"},{"id":"alg-v3-175","module":"v3","type":"mcq","q":"What are the coordinates of the midpoint of the segment joining A(2, -5) and B(-8, 7)?","options":["(-3, 1)","(3, -1)","(-3, -1)","(3, 1)"],"answer":"(-3, 1)","solution":"Midpoint formula: ((2+(-8))/2, (-5+7)/2) = (-6/2, 2/2) = (-3,1). This matches option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Midpoint","difficulty":"Hard"},{"id":"alg-v3-176","module":"v3","type":"mcq","q":"What is the distance between the points P(-2, 3) and Q(5, -1)?","options":["√65","√53","7","5"],"answer":"√65","solution":"Distance = √[(5‑(‑2))² + (‑1‑3)²] = √[7² + (‑4)²] = √[49+16] = √65. Verified by substitution.","source":"MATH 157 lecture slides (Kwame Piesie) — Distance between points","difficulty":"Medium"},{"id":"alg-v3-177","module":"v3","type":"mcq","q":"Find the gradient of the line joining P(2, -3) and Q(5, 4).","options":["7/3","-7/3","3/7","-3/7"],"answer":"7/3","solution":"Gradient = (y_Q - y_P)/(x_Q - x_P) = (4 - (-3))/(5 - 2) = 7/3. Substituting back: (4+3)/(5-2)=7/3 matches option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Gradient","difficulty":"Hard"},{"id":"alg-v3-178","module":"v3","type":"mcq","q":"A line has gradient 2 and passes through (1,5). What is the y‑coordinate when x = 4?","options":["8","11","14","17"],"answer":"11","solution":"Point-slope: y-5=2(x-1) => y=2x+3. At x=4, y=2(4)+3=11. Verify slope: (11-5)/(4-1)=6/3=2 ✓. Option B.","source":"MATH 157 lecture slides (Kwame Piesie) — Gradient / Equation of line","difficulty":"Medium"},{"id":"alg-v3-179","module":"v3","type":"mcq","q":"If a road has a gradient of 3/2, which statement correctly describes the relationship between horizontal and vertical distances?","options":["For every 2 m moved horizontally, the road rises 3 m vertically, matching the 3/2 ratio.","For every 3 m moved horizontally, the road rises 2 m vertically, which does not match 3/2.","The road is flat; vertical change is zero, contradicting a non‑zero gradient.","The road descends 3 m for each 2 m horizontal movement, implying a negative gradient."],"answer":"For every 2 m moved horizontally, the road rises 3 m vertically, matching the 3/2 ratio.","solution":"Gradient = rise/run = 3/2 → rise = (3/2)·run. For run = 2 m, rise = (3/2)·2 = 3 m, matching option A. Verify: run = 4 m → rise = 6 m, ratio 6/4 = 3/2.","source":"MATH 157 lecture slides (Kwame Piesie) — Gradient and Direction","difficulty":"Medium"},{"id":"alg-v3-180","module":"v3","type":"mcq","q":"What is the midpoint of the segment joining points B(7, 3) and C(‑3, ‑2)?","options":["(2, 0.5)","(5, 1)","(3.5, 0.5)","(2, ‑0.5)"],"answer":"(2, 0.5)","solution":"Midpoint formula: ((7+(-3))/2, (3+(-2))/2) = (4/2, 1/2) = (2, 0.5). Substituting back, the average of the x‑coordinates is 2 and the average of the y‑coordinates is 0.5, matching option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Midpoint and Triangle Properties","difficulty":"Medium"},{"id":"alg-v3-181","module":"v3","type":"mcq","q":"What is the midpoint of the line segment with endpoints (1/2, 3/4) and (5/2, -1/4)?","options":["(3/2, 1/4)","(2, 1)","(1, 1/2)","(5/4, 1/4)"],"answer":"(3/2, 1/4)","solution":"Midpoint = ((1/2+5/2)/2, (3/4+(-1/4))/2) = (6/2/2, 2/4/2) = (3/2, 1/4). Matches option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Midpoint","difficulty":"Devil Mode"},{"id":"alg-v3-182","module":"v3","type":"mcq","q":"What is the gradient of the line joining M(2, 3) and N(2, 5)?","options":["0","1","undefined","2"],"answer":"undefined","solution":"Gradient = (5-3)/(2-2)=2/0 → division by zero, vertical line → slope undefined (option C). Verify: both points have x=2, so the line is vertical and has no finite gradient.","source":"MATH 157 lecture slides (Kwame Piesie) — Gradient and Direction","difficulty":"Medium"},{"id":"alg-v3-183","module":"v3","type":"mcq","q":"Which statement about triangle ABC with vertices A(7, 3), B(‑4, 1) and C(‑3, ‑2) is true?","options":["AB = AC","AB = BC","AC = BC","All three sides are equal."],"answer":"AB = AC","solution":"Compute squared distances: AB²=(7‑(‑4))²+(3‑1)²=11²+2²=125; AC²=(7‑(‑3))²+(3‑(‑2))²=10²+5²=125; BC²=(‑4‑(‑3))²+(1‑(‑2))²=(-1)²+3²=10. Since AB²=AC², AB=AC, while BC is different. Hence option A is true.","source":"MATH 157 lecture slides (Kwame Piesie) — Triangle Properties","difficulty":"Hard"},{"id":"alg-v3-184","module":"v3","type":"mcq","q":"If the points (2,5) and (7,11) lie on a straight line, what is the gradient of the line?","options":["2/5","6/5","5/6","1/2"],"answer":"6/5","solution":"Gradient = (11-5)/(7-2)=6/5. Verify by substituting the points into y = mx + c, confirming consistent slope.","source":"MATH 157 lecture slides (Kwame Piesie) — gradient calculation","difficulty":"Hard"},{"id":"alg-v3-185","module":"v3","type":"mcq","q":"In a distance‑time graph, the gradient represents:","options":["acceleration","speed","distance","time"],"answer":"speed","solution":"In a distance‑time graph, distance (d) is plotted on the vertical axis and time (t) on the horizontal axis. The gradient (slope) is Δd/Δt, which is the definition of speed (rate of change of distance with respect to time). Therefore the gradient represents speed, corresponding to option B.","source":"MATH 157 lecture slides (Kwame Piesie) — rate of change","difficulty":"Medium"},{"id":"alg-v3-186","module":"v3","type":"mcq","q":"What does a gradient of zero indicate about a line in a coordinate plane?","options":["It is vertical","It is horizontal","It has undefined slope","It passes through the origin"],"answer":"It is horizontal","solution":"The gradient (slope) of a line is the change in y over change in x. A gradient of zero means Δy = 0 for any Δx, so the line has constant y‑value; this is the definition of a horizontal line. Verification: the line y = k has equation slope 0 and is horizontal, and substituting any point (x, k) satisfies the condition.","source":"MATH 157 lecture slides (Kwame Piesie) — gradient interpretation","difficulty":"Medium"},{"id":"alg-v3-187","module":"v3","type":"mcq","q":"Which statement correctly describes a line with an infinite (undefined) gradient?","options":["The line is flat","The line is vertical","The gradient is zero","The line has no y‑intercept"],"answer":"The line is vertical","solution":"A line with an undefined (infinite) gradient has a vertical direction; its slope tends to ±∞, which occurs only for a vertical line. Option B directly states 'The line is vertical', matching this definition. Verification: a vertical line (e.g., x=2) cannot be expressed as y=mx+b, confirming its slope is undefined, so B is correct.","source":"MATH 157 lecture slides (Kwame Piesie) — gradient extremes","difficulty":"Hard"},{"id":"alg-v3-188","module":"v3","type":"mcq","q":"Given the line 3x + 4y - 12 = 0 and the point (2, -1), what is the perpendicular distance from the point to the line?","options":["1","2","3","4"],"answer":"2","solution":"Line: 3x+4y-12=0 → A=3, B=4, C=-12. Point (2,-1). Distance = |3·2+4·(-1)-12| / √(3²+4²) = |6-4-12| / √25 = | -10| /5 = 10/5 = 2. Verified by substitution: plugging (2,-1) into the line gives -10, and the perpendicular distance is 2.","source":"MATH 157 lecture slides (Kwame Piesie) — Coordinate Geometry","difficulty":"Hard"},{"id":"alg-v3-189","module":"v3","type":"mcq","q":"If tan α = b/a, which of the following expresses sec² α?","options":["(a² + b²)/b²","(a² + b²)/a²","a²/(a² + b²)","b²/(a² + b²)"],"answer":"(a² + b²)/a²","solution":"tan α = b/a, so adjacent = a and opposite = b. Hypotenuse = sqrt(a²+b²). sec² α = 1 + tan² α = 1 + b²/a² = (a²+b²)/a². This matches option B.","source":"MATH 157 lecture slides (Kwame Piesie) — Trigonometry","difficulty":"Medium"},{"id":"alg-v3-190","module":"v3","type":"mcq","q":"Which of the following correctly gives cos α in terms of a and b?","options":["± b/√(a² + b²)","± a/√(a² + b²)","± √(a² + b²)/a","± √(a² + b²)/b"],"answer":"± a/√(a² + b²)","solution":"Assuming α is the angle with adjacent side a and opposite side b in a right triangle, hypotenuse = √(a² + b²). Thus cos α = adjacent/hypotenuse = a/√(a² + b²). This matches option B.","source":"MATH 157 lecture slides (Kwame Piesie) — Trigonometry","difficulty":"Hard"},{"id":"alg-v3-191","module":"v3","type":"mcq","q":"If an angle is measured clockwise from the positive x‑axis, its sign is:","options":["Positive","Negative","Zero","Cannot be determined"],"answer":"Negative","solution":"Standard convention: angles positive when measured counter‑clockwise from +x axis. Clockwise measurement is opposite, thus the angle’s sign is negative (e.g., 90° clockwise = –90°). Hence option B.","source":"MATH 157 lecture slides (Kwame Piesie) — TRIGONOMETRY","difficulty":"Medium"},{"id":"alg-v3-192","module":"v3","type":"mcq","q":"For any real numbers a and b, the expression a cos α + b sin α satisfies which of the following statements?","options":["It can never exceed √(a² + b²).","It can be greater than √(a² + b²) if a or b is negative.","Its minimum value is -√(a² + b²).","Both A and C are correct."],"answer":"Both A and C are correct.","solution":"Let R=√(a²+b²) and φ=atan2(b,a). Then a cosα+b sinα = R cos(α-φ). Since cosθ∈[-1,1], the expression is bounded by ±R. Hence it never exceeds √(a²+b²) (A true) and its minimum is -√(a²+b²) (C true). Both A and C hold, so D is correct. Verify: for a=3,b=4,R=5, choose α=φ gives 5, α=φ+π gives -5, confirming bounds.","source":"MATH 157 lecture slides (Kwame Piesie) — Trigonometry","difficulty":"Medium"},{"id":"alg-v3-193","module":"v3","type":"mcq","q":"In a right‑angled triangle, which trigonometric ratio represents the length of the side opposite an angle divided by the length of the hypotenuse?","options":["sine","cosine","tangent","cotangent"],"answer":"sine","solution":"In a right‑angled triangle let θ be one of the acute angles, opposite side = O, adjacent side = A, hypotenuse = H. By definition sin θ = O/H, cos θ = A/H, tan θ = O/A, cot θ = A/O. The ratio asked is opposite/hypotenuse = O/H, which is exactly sin θ. Hence the correct choice is A.","source":"MATH 157 lecture slides (Kwame Piesie) — TRIGONOMETRY","difficulty":"Medium"},{"id":"alg-v3-194","module":"v3","type":"mcq","q":"If sin θ = 3/5 and θ is an acute angle, which of the following is the value of cos θ?","options":["4/5","5/3","3/4","1/5"],"answer":"4/5","solution":"Given sinθ = 3/5 and θ acute, cosθ = √(1 - sin²θ) = √(1 - (3/5)²) = √(1 - 9/25) = √(16/25) = 4/5. Substituting back: sin²θ + cos²θ = 9/25 + 16/25 = 1, confirming correctness. Option A corresponds to 4/5.","source":"MATH 157 lecture slides (Kwame Piesie) — Trigonometric Functions","difficulty":"Hard"},{"id":"alg-v3-195","module":"v3","type":"mcq","q":"Which statement best describes what trigonometric functions do in a right‑angled triangle?","options":["They give the actual lengths of the sides.","They give the ratios of two sides relative to the third side.","They apply only to triangles with an obtuse angle.","They are independent of the direction in which the angle is measured."],"answer":"They give the ratios of two sides relative to the third side.","solution":"In a right‑angled triangle the trigonometric functions (sin, cos, tan, etc.) are defined as ratios of two sides to the third side (the hypotenuse). For an acute angle θ, sin θ = opposite/hypotenuse, cos θ = adjacent/hypotenuse, tan θ = opposite/adjacent. This matches option B. A is wrong because the functions give ratios, not absolute lengths. C is wrong; they apply to any triangle, not only obtus","source":"MATH 157 lecture slides (Kwame Piesie) — TRIGONOMETRY","difficulty":"Medium"},{"id":"alg-v3-196","module":"v3","type":"mcq","q":"If tan θ = 1/√3 and θ is acute, what is θ in degrees?","options":["15°","30°","45°","60°"],"answer":"30°","solution":"tanθ=1/√3 → θ=30° (acute) → matches option B","source":"MATH 157 lecture slides (Kwame Piesie) — Trigonometric Functions","difficulty":"Hard"},{"id":"alg-v3-197","module":"v3","type":"mcq","q":"Convert 210° to radians using the relation R/π = D/180.","options":["7π/6","5π/6","2π/3","π/2"],"answer":"7π/6","solution":"Use R/π = D/180 → R = (π/180)·210 = 210π/180 = 7π/6. Verify: 210° = 180°+30° → π + π/6 = 7π/6.","source":"MATH 157 lecture slides (Kwame Piesie) — Conversion from degree to radian","difficulty":"Medium"},{"id":"alg-v3-198","module":"v3","type":"mcq","q":"An angle θ is measured clockwise and has a magnitude of 35°. What is the sign of sin θ?","options":["Positive","Negative","Zero","Cannot be determined"],"answer":"Negative","solution":"θ is measured clockwise with magnitude 35°, so in standard position θ = -35° (or equivalently 360°-35° = 325°). This places θ in the fourth quadrant, where sine is negative. Indeed sin(-35°) = -sin35° ≈ -0.574 < 0, confirming the sign is negative.","source":"MATH 157 lecture slides (Kwame Piesie) — TRIGONOMETRY","difficulty":"Hard"},{"id":"alg-v3-199","module":"v3","type":"mcq","q":"Which radian measure corresponds to 105°?","options":["7π/12","5π/8","2π/3","3π/5"],"answer":"7π/12","solution":"Target: convert 105° to radians. Use conversion factor π/180. 105°·π/180 = (105π)/180 = divide numerator and denominator by 15 → 7π/12. Verify: (7π/12)·(180/π)=7·15=105°, confirming the result. Option A corresponds to 7π/12.","source":"MATH 157 lecture slides (Kwame Piesie) — Degrees to Radians","difficulty":"Medium"},{"id":"alg-v3-200","module":"v3","type":"mcq","q":"In a right‑angled triangle, the side opposite angle α is 9 and the hypotenuse is 15. What is sin α?","options":["3/5","9/14","5/9","1/2"],"answer":"3/5","solution":"sin α = opposite/hypotenuse = 9/15 = 3/5, which matches option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Trigonometric Functions","difficulty":"Medium"},{"id":"alg-v3-201","module":"v3","type":"mcq","q":"If 180° equals π radians, what is 2π/3 radians in degrees?","options":["60°","90°","120°","150°"],"answer":"120°","solution":"180° = π rad ⇒ 1 rad = 180/π°. Multiply 2π/3 rad by 180/π°: (2π/3)*(180/π)=2*180/3=120°. Verified by substituting: 120°/180°=2/3, matching the rad fraction.","source":"MATH 157 lecture slides (Kwame Piesie) — Degrees to Radians","difficulty":"Hard"},{"id":"alg-v3-202","module":"v3","type":"mcq","q":"Which description correctly gives the general solution for sin θ = −1⁄2?","options":["θ = 7π⁄6 + 2πk or θ = 11π⁄6 + 2πk, k ∈ ℤ","θ = π⁄6 + 2πk or θ = 5π⁄6 + 2πk, k ∈ ℤ","θ = π⁄2 + πk, k ∈ ℤ","θ = 0 + πk, k ∈ ℤ"],"answer":"θ = 7π⁄6 + 2πk or θ = 11π⁄6 + 2πk, k ∈ ℤ","solution":"Target: solve sin θ = −1/2 for all real θ.\nGivens: sine is negative in quadrants III and IV; reference angle for |sin| = 1/2 is π/6.\nHinge step: θ = π + π/6 = 7π/6 (QIII) or θ = 2π − π/6 = 11π/6 (QIV).\nGeneral solution: add period 2πk, k∈ℤ → θ = 7π/6 + 2πk or θ = 11π/6 + 2πk.\nVerification: sin(7π/6) = −1/2, sin(11π/6) = −1/2; adding 2πk leaves sine unchanged. Option A matches exactly; other option","source":"MATH 157 lecture slides (Kwame Piesie) — Trigonometry","difficulty":"Hard"},{"id":"alg-v3-203","module":"v3","type":"mcq","q":"Given 22.5° = π/8 rad, what is the radian measure of 56.25°?","options":["5π/16","7π/16","9π/16","11π/16"],"answer":"5π/16","solution":"Given 22.5° = π/8 rad, then 56.25° = (56.25/22.5) × (π/8) = 2.5 × π/8 = 5π/16. Alternatively, 56.25° × π/180 = 56.25π/180 = 5π/16.","source":"MATH 157 lecture slides (Kwame Piesie) — Degrees to Radians","difficulty":"Devil Mode"},{"id":"alg-v3-204","module":"v3","type":"mcq","q":"Given sin θ = 4/5 and θ is in the first quadrant, which ordered pair (cos θ, tan θ) is correct?","options":["(3/5, 4/3)","(4/5, 3/4)","(5/4, 4/3)","(3/4, 5/4)"],"answer":"(3/5, 4/3)","solution":"sin θ = 4/5, first quadrant => cos θ = sqrt(1 - (4/5)^2) = 3/5. tan θ = sin θ / cos θ = (4/5)/(3/5) = 4/3. Thus (cos θ, tan θ) = (3/5, 4/3), which is option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Pythagorean identities","difficulty":"Hard"},{"id":"alg-v3-205","module":"v3","type":"mcq","q":"Which factorization correctly rewrites the quadratic expression 6x² − x − 2?","options":["(3x − 2)(2x + 1)","(3x + 2)(2x − 1)","(6x − 1)(x + 2)","(2x − 2)(3x + 1)"],"answer":"(3x − 2)(2x + 1)","solution":"Factor 6x² - x - 2: find two numbers multiplying to -12 and summing to -1: 3 and -4. Rewrite: 6x² + 3x - 4x - 2 = 3x(2x+1) - 2(2x+1) = (3x-2)(2x+1). This matches option A. Verification: (3x-2)(2x+1) = 6x² + 3x - 4x - 2 = 6x² - x - 2.","source":"MATH 157 lecture slides (Kwame Piesie) — Algebraic manipulation","difficulty":"Hard"},{"id":"alg-v3-206","module":"v3","type":"mcq","q":"If a square matrix A satisfies A^T = A, then A is called:","options":["Symmetric","Skew-symmetric","Orthogonal","Diagonal"],"answer":"Symmetric","solution":"By definition, a square matrix A satisfying A^T = A is symmetric. Skew-symmetric requires A^T = -A. Orthogonal requires A^T = A^-1. Diagonal matrices are a subset of symmetric matrices but not all symmetric matrices are diagonal. Verified by checking standard definitions and counterexamples: identity matrix satisfies A^T = A, is symmetric (not skew/orth), and is diagonal but diagonal is not requ","source":"MATH 157 lecture slides (Kwame Piesie) — Transpose Matrix Properties","difficulty":"Medium"},{"id":"alg-v3-207","module":"v3","type":"mcq","q":"For any scalar α and matrix A, which identity holds for the transpose?","options":["(αA)^T = α A^T","(αA)^T = α A","(αA)^T = A^T","(αA)^T = α^2 A"],"answer":"(αA)^T = α A^T","solution":"Target: find identity for (αA)^T. Given scalar α and matrix A. Use linearity of transpose: (cM)^T = c M^T for any scalar c. Hence (αA)^T = α A^T. Verify: let α=2, A=[[1,2],[3,4]]. Then αA=[[2,4],[6,8]], its transpose is [[2,6],[4,8]]. Compute α A^T = 2·[[1,3],[2,4]] = [[2,6],[4,8]], which matches. Therefore option A is correct.","source":"MATH 157 lecture slides (Kwame Piesie) — Transpose Matrix Properties","difficulty":"Medium"},{"id":"alg-v3-208","module":"v3","type":"mcq","q":"If sin θ = 5/13 with θ in the first quadrant, which option gives the correct values of cos θ and tan θ?","options":["(12/13, 5/12)","(5/12, 12/5)","(12/5, 5/12)","(13/12, 5/13)"],"answer":"(12/13, 5/12)","solution":"Given sin θ = 5/13, θ in Q1. By Pythagorean identity, cos θ = √(1 - sin²θ) = √(1 - 25/169) = √(144/169) = 12/13 (positive in Q1). Then tan θ = sin θ / cos θ = (5/13)/(12/13) = 5/12. This matches option A: (12/13, 5/12). Verification: sin²θ + cos²θ = 25/169 + 144/169 = 1; tan θ = 5/12.","source":"MATH 157 lecture slides (Kwame Piesie) — Trigonometric ratios","difficulty":"Medium"},{"id":"alg-v3-209","module":"v3","type":"mcq","q":"If A is a 2×3 matrix and B is a 3×4 matrix, what are the dimensions of (AB)^T?","options":["2×4","4×2","3×3","4×3"],"answer":"4×2","solution":"A (2×3)·B (3×4) = AB (2×4). Transpose of a 2×4 matrix is 4×2, so (AB)^T is 4×2. Verify: rows of (AB)^T = columns of AB = 4, columns of (AB)^T = rows of AB = 2.","source":"MATH 157 lecture slides (Kwame Piesie) — Transpose Matrix Properties","difficulty":"Hard"},{"id":"alg-v3-210","module":"v3","type":"mcq","q":"In the example matrix A = [[2,1,4],[3,5,0],[7,3,9]], what is the entry in row 2 column 3 of its transpose A^T?","options":["1","3","4","7"],"answer":"3","solution":"A = [[2,1,4],[3,5,0],[7,3,9]]. Its transpose A^T has entry (i,j) = A(j,i). For row 2 column 3 of A^T we need A(3,2). Row 3 of A is [7,3,9]; its second entry is 3. Hence the required entry is 3, which matches option B. Verification: A^T = [[2,3,7],[1,5,3],[4,0,9]]; row 2 column 3 = 3.","source":"MATH 157 lecture slides (Kwame Piesie) — Example of Transpose","difficulty":"Medium"},{"id":"alg-v3-211","module":"v3","type":"mcq","q":"If a row of a square matrix is multiplied by the scalar 5, how does the determinant change?","options":["remains the same","is multiplied by 5","is multiplied by 1/5","becomes zero"],"answer":"is multiplied by 5","solution":"Let A be an n×n matrix and let row i of A be multiplied by 5 to obtain matrix B. The determinant is multilinear in the rows, so scaling a single row by a factor k multiplies the determinant by the same factor. Hence det(B)=5·det(A). Verification: for a 2×2 matrix [[a,b],[c,d]], scaling the first row by 5 gives [[5a,5b],[c,d]] with det =5a·d−5b·c =5(ad−bc)=5 det(A).","source":"MATH 157 lecture slides (Kwame Piesie) — Determinants","difficulty":"Medium"},{"id":"alg-v3-212","module":"v3","type":"mcq","q":"Which of the following statements about determinants is FALSE?","options":["The determinant of the identity matrix is 1.","Interchanging any two rows of a square matrix multiplies its determinant by –1.","If a row of a matrix consists entirely of zeros, then the determinant is 1.","If two rows of a square matrix are identical, its determinant is 0."],"answer":"If a row of a matrix consists entirely of zeros, then the determinant is 1.","solution":"Restated the four statements. A: det(I)=1 (true). B: row swap multiplies det by –1 (true). C: a row of all zeros makes the matrix singular, so det=0, not 1 (false). D: identical rows give det=0 (true). Verified by noting a matrix with a zero row has determinant 0, e.g., [[0,1],[0,2]] has det=0.","source":"MATH 157 lecture slides (Kwame Piesie) — Determinants","difficulty":"Devil Mode"},{"id":"alg-v3-213","module":"v3","type":"mcq","q":"If |A| = 9 for a 2×2 matrix A, what is the value of |A^T|?","options":["9","-9","1/9","0"],"answer":"9","solution":"Target: find |A^T| given |A|=9 for a 2×2 matrix A. Givens: A is 2×2, determinant of A is 9. Property: determinant of a matrix equals determinant of its transpose (|A^T| = |A|). Hinge step: apply this property directly → |A^T| = 9. Verification: choose a concrete matrix, e.g., A=[[3,0],[0,3]] has |A|=9; its transpose is the same matrix, so |A^T|=9, confirming the result. Option A corresponds to 9.","source":"MATH 157 lecture slides (Kwame Piesie) — Determinants","difficulty":"Medium"},{"id":"alg-v3-214","module":"v3","type":"mcq","q":"The adjoint of a matrix A is defined as the transpose of the matrix of cofactors. Which statement is true?","options":["The adjoint equals the cofactor matrix itself.","The adjoint is the transpose of the cofactor matrix.","The adjoint is the determinant of A.","The adjoint exists only for 2×2 matrices."],"answer":"The adjoint is the transpose of the cofactor matrix.","solution":"Definition: adjoint(A)= (cofactor matrix C)^T. Hence adjoint is the transpose of the cofactor matrix, matching option B. Verify with a 2×2 example: A=[[a,b],[c,d]], C=[[d,-c],[-b,a]], C^T=[[d,-b],[-c,a]] which is the adjoint, not the cofactor matrix itself, not the determinant, and exists for any n×n matrix.","source":"MATH 157 lecture slides (Kwame Piesie) — Cofactor and Adjoint","difficulty":"Medium"},{"id":"alg-v3-215","module":"v3","type":"mcq","q":"If i = 2 and j = 3 for an element a_ij of a square matrix, what is the sign factor (−1)^i+j in the cofactor formula?","options":["(+1) because i+j is even","(-1) because i+j is odd","0","depends on the matrix entries"],"answer":"(-1) because i+j is odd","solution":"i=2, j=3 ⇒ i+j=5 (odd). (-1)^5= -1, so the sign factor is -1. This matches option B.","source":"MATH 157 lecture slides (Kwame Piesie) — Cofactor and Adjoint","difficulty":"Medium"},{"id":"alg-v3-216","module":"v3","type":"mcq","q":"If the determinant of a 3×3 matrix M is 12, what is the determinant of the matrix obtained by interchanging its first and second rows?","options":["12","-12","24","0"],"answer":"-12","solution":"Swapping two rows of a matrix multiplies its determinant by -1. Since det(M)=12, after interchanging the first and second rows the determinant becomes -12, which corresponds to option B.","source":"MATH 157 lecture slides (Kwame Piesie) — Determinants","difficulty":"Hard"},{"id":"alg-v3-217","module":"v3","type":"mcq","q":"For the 2×2 matrix (begin2 & 5 3 & 7end), which of the following is its inverse?","options":["[[7, -5], [-3, 2]]","[[-7, 5], [3, -2]]","[[-7, -5], [-3, 2]]","[[7, 5], [3, 2]]"],"answer":"[[-7, 5], [3, -2]]","solution":"Matrix A = [[2,5],[3,7]]. Determinant det = 2·7 - 5·3 = 14-15 = -1. Inverse formula: A⁻¹ = (1/det) * [[7, -5], [-3, 2]] = -1 * [[7, -5], [-3, 2]] = [[-7, 5], [3, -2]]. This matches option B.","source":"MATH 157 lecture slides (Kwame Piesie) — Inverse of 2×2 Matrix","difficulty":"Hard"},{"id":"alg-v3-218","module":"v3","type":"mcq","q":"According to Cramer’s Rule as presented in the slides, how is x₁ expressed in terms of determinants?","options":["|A₁| / |A|","|A| / |A₁|","|A₂| / |A|","|A₃| / |A|"],"answer":"|A₁| / |A|","solution":"Cramer’s Rule states that for a system A x = b with det(A)≠0, each variable x_i = det(A_i)/det(A), where A_i is A with its i‑th column replaced by b. For x₁ we replace the first column of A by b, forming A₁, so x₁ = |A₁| / |A|. This matches option A. Verification: in a 2×2 example [[a,b],[c,d]] with b‑vector [e,f], x₁ = (ae‑bf)/(ad‑bc) = |A₁|/|A|, confirming the formula.","source":"MATH 157 lecture slides (Kwame Piesie) — Cramer's Rule","difficulty":"Hard"},{"id":"alg-v3-219","module":"v3","type":"mcq","q":"Which statement guarantees that a square matrix has an inverse?","options":["Its determinant is zero.","Its determinant is non‑zero.","Its trace is positive.","Its columns are orthogonal."],"answer":"Its determinant is non‑zero.","solution":"Determinant non‑zero ⇔ invertible; if det=0 matrix singular, not invertible. Verify: I₂ has det=1≠0 and is invertible; [[1,1],[1,1]] has det=0 and no inverse.","source":"MATH 157 lecture slides (Kwame Piesie) — Matrix Invertibility","difficulty":"Medium"},{"id":"alg-v3-220","module":"v3","type":"mcq","q":"For Cramer’s Rule to be applicable to a system of linear equations, the determinant of the coefficient matrix must be:","options":["any real number","non‑zero","positive","zero"],"answer":"non‑zero","solution":"Cramer's rule uses the inverse of the coefficient matrix; an inverse exists only when the determinant is non‑zero. Thus the determinant must be ≠ 0 (option B). Verification: if det=0 the formulas involve division by zero, so no unique solution; a non‑zero determinant guarantees a unique solution and the Cramer's formulas are valid.","source":"MATH 157 lecture slides (Kwame Piesie) — Determinants","difficulty":"Medium"},{"id":"alg-v3-221","module":"v3","type":"mcq","q":"If f(x) = x^3 - 4x + 2, which of the following is the derivative f'(x)?","options":["3x^2 - 4","3x^2 + 4","2x - 4","x^2 - 4"],"answer":"3x^2 - 4","solution":"f(x)=x^3-4x+2. Differentiate term‑wise: d/dx(x^3)=3x^2, d/dx(-4x)=-4, d/dx(2)=0. Hence f'(x)=3x^2-4 (option A). Verify: for x=1, f'(1)=3-4=-1; the slope of the tangent to f at x=1 computed via limit (f(1+h)-f(1))/h → -1, confirming the derivative.","source":"MATH 157 lecture slides (Kwame Piesie) — Differentiation","difficulty":"Hard"},{"id":"alg-v3-222","module":"v3","type":"mcq","q":"For f(x) = sin(x) + x^2, what is f'(π/2)?","options":["1 + π","0 + π","-1 + π","2 + π"],"answer":"0 + π","solution":"f'(x)=cos(x)+2x; at x=π/2, cos(π/2)=0 and 2·(π/2)=π, so f'(π/2)=π = 0+π, matching option B (index 1). Verified by direct substitution.","source":"MATH 157 lecture slides (Kwame Piesie) — Differentiation","difficulty":"Medium"},{"id":"alg-v3-223","module":"v3","type":"mcq","q":"Which matrix is obtained by replacing the second column of the coefficient matrix A with the vector b?","options":["A₁","A₂","A₃","A"],"answer":"A₂","solution":"In Cramer's rule, A_i denotes the matrix formed by replacing the i‑th column of the coefficient matrix A with the right‑hand side vector b. Replacing the second column therefore yields A₂, which corresponds to option B.","source":"MATH 157 lecture slides (Kwame Piesie) — Cramer's Rule","difficulty":"Medium"},{"id":"alg-v3-224","module":"v3","type":"mcq","q":"If f'(x) = 0 for all x in an interval, what can be concluded about f(x) on that interval?","options":["f(x) is constant on the interval","f(x) is linear","f(x) is quadratic","f(x) could be any function"],"answer":"f(x) is constant on the interval","solution":"Restated: f′(x)=0 for all x∈I. Since f is differentiable on I, for any a,b∈I the Mean Value Theorem gives c between a and b with f(b)-f(a)=f′(c)(b-a)=0, so f(b)=f(a). Hence f is constant on I. Verification: a constant function has derivative 0 everywhere, and any non‑constant differentiable function must have a non‑zero derivative at some point, so the conclusion is correct. Therefore option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Differentiation","difficulty":"Medium"},{"id":"alg-v3-225","module":"v3","type":"mcq","q":"According to the lecture slides, which statement correctly describes the derivative of y with respect to x?","options":["It measures average change over an interval","It is the instantaneous rate of change of y at x","It represents total area under the curve","It is the slope of the tangent line only at endpoints"],"answer":"It is the instantaneous rate of change of y at x","solution":"1) Target: Identify the statement that correctly defines the derivative dy/dx. 2) Given: Lecture slides define derivative as the limit of the difference quotient as Δx→0, i.e., the instantaneous rate of change of y at a specific x. 3) Method: Use the definition of derivative (limit of [f(x+Δx)-f(x)]/Δx) to compare each option. 4) Hinge step: The derivative equals the instantaneous rate of change a","source":"MATH 157 lecture slides (Kwame Piesie) — Derivative concept","difficulty":"Hard"},{"id":"alg-v3-226","module":"v3","type":"mcq","q":"Which statement about the gradient function (derivative) is FALSE?","options":["It gives the slope of the tangent to the curve at that point","It can be used to find the equation of the tangent line","It represents the average rate of change over the interval","It is the instantaneous rate of change of y with respect to x"],"answer":"It represents the average rate of change over the interval","solution":"A: derivative = tangent slope – true. B: using f'(x0) in point‑slope form gives tangent line – true. D: derivative = instantaneous rate of change – true. C: average rate of change over an interval is (f(b)-f(a))/(b-a), the secant slope, not the derivative – false. Example: f(x)=x^2, f'(1)=2 (instantaneous), but average rate on [0,2] is (4-0)/2=2, which equals the secant, not the derivative at inte","source":"MATH 157 lecture slides (Kwame Piesie) — Gradient function","difficulty":"Medium"},{"id":"alg-v3-227","module":"v3","type":"mcq","q":"Find dy/dx for y = ∛(2x - 4).","options":["(2/3)(2x-4)^-2/3","(1/3)(2x-4)^-2/3","(2/3)(2x-4)^-1/3","(2/3)(2x-4)^2/3"],"answer":"(2/3)(2x-4)^-2/3","solution":"Let y = (2x-4)^1/3. Then dy/dx = (1/3)(2x-4)^-2/3·(d/dx)(2x-4) = (1/3)(2x-4)^-2/3·2 = (2/3)(2x-4)^-2/3. This matches option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Chain Rule","difficulty":"Hard"},{"id":"alg-v3-228","module":"v3","type":"mcq","q":"Differentiate f(x) = (x^2 + 1)^15 with respect to x.","options":["30x (x^2+1)^14","15 (x^2+1)^14","30 (x^2+1)^14","30x (x^2+1)^15"],"answer":"30x (x^2+1)^14","solution":"Target: differentiate f(x)=(x^2+1)^15. Givens: polynomial inside power 15. Method: chain rule. Inner derivative d/dx (x^2+1)=2x. Apply: f' = 15 (x^2+1)^14·2x = 30x (x^2+1)^14. Verify: at x=0, f'=0; option A yields 0, others not. Hence correct choice A.","source":"MATH 157 lecture slides (Kwame Piesie) — Chain Rule","difficulty":"Medium"},{"id":"alg-v3-229","module":"v3","type":"mcq","q":"Compute the derivative of y = (2x^2 - 5x)^4.","options":["4(2x^2-5x)^3(4x-5)","8(2x^2-5x)^3(4x-5)","4(2x^2-5x)^4(4x-5)","(2x^2-5x)^3(4x-5)"],"answer":"4(2x^2-5x)^3(4x-5)","solution":"y' = 4(2x^2-5x)^3·(4x-5) (chain rule). Verify by substituting a simple x, e.g., x=1: y=(2-5)^4=(-3)^4=81, y' = 4(-3)^3·(4-5)=4(-27)(-1)=108. Numerical derivative via limit approx gives ~108, confirming.","source":"MATH 157 lecture slides (Kwame Piesie) — Chain Rule","difficulty":"Medium"},{"id":"alg-v3-230","module":"v3","type":"mcq","q":"Which statement about the derivative of y = a^x (a>0, a≠1) is FALSE?","options":["The derivative is proportional to the function itself.","The constant of proportionality is ln a.","The derivative is a^x * a.","The derivative exists for all real x."],"answer":"The derivative is a^x * a.","solution":"For y = a^x (a>0, a≠1), differentiate: dy/dx = a^x ln a. \n- This shows the derivative is proportional to the function itself (A true). \n- The constant of proportionality is ln a (B true). \n- The derivative exists for all real x because a^x is defined and smooth everywhere (D true). \n- Statement C claims dy/dx = a^x * a = a^x+1, which is not equal to a^x ln a except for special a; thus C is f","source":"MATH 157 lecture slides (Kwame Piesie) — Derivative of General Exponential Function","difficulty":"Medium"},{"id":"alg-v3-231","module":"v3","type":"mcq","q":"If y = sin(3x^2 + 2x), which of the following is dy/dx?","options":["(6x+2)cos(3x^2+2x)","(6x+2)sin(3x^2+2x)","(3x^2+2x)cos(6x+2)","(6x+2)cos(3x^2+2x)*(3x^2+2x)"],"answer":"(6x+2)cos(3x^2+2x)","solution":"y = sin(u) with u = 3x^2+2x → dy/dx = cos(u)·u' = cos(3x^2+2x)·(6x+2). This matches option A. Verification: differentiate sin(3x^2+2x) directly using chain rule, yielding the same expression; a quick numeric check (e.g., x=0.1) also confirms the derivative.","source":"MATH 157 lecture slides (Kwame Piesie) — Derivative of Trigonometric Functions (Chain Rule)","difficulty":"Hard"},{"id":"alg-v3-232","module":"v3","type":"mcq","q":"What is the derivative of y = 7^x?","options":["7^x ln 7","7^x / ln 7","7^x * 7","7^x + ln 7"],"answer":"7^x ln 7","solution":"y=7^x → ln y = x ln 7 → (1/y)y' = ln 7 → y' = 7^x ln 7. Verified: at x=0, y'=ln7≈1.946, matching A; other options fail substitution check.","source":"MATH 157 lecture slides (Kwame Piesie) — Derivative of General Exponential Function","difficulty":"Medium"},{"id":"alg-v3-233","module":"v3","type":"mcq","q":"Differentiate y = cos(2x^3) with respect to x.","options":["−6x^2 sin(2x^3)","6x^2 cos(2x^3)","−2x^3 sin(2x^3)","−6x^2 sin(2x^3)·2x^3"],"answer":"−6x^2 sin(2x^3)","solution":"y = cos(2x^3); dy/dx = -sin(2x^3)·d(2x^3)/dx = -sin(2x^3)·6x^2 = -6x^2 sin(2x^3). Verify by direct substitution for x=1: y' = -6·1^2·sin(2) ≈ -6·sin2, matches derivative of cos(2).","source":"MATH 157 lecture slides (Kwame Piesie) — Derivative of Trigonometric Functions (Chain Rule)","difficulty":"Medium"},{"id":"alg-v3-234","module":"v3","type":"mcq","q":"If y = tan(x^2 + 5x), then dy/dx equals:","options":["(2x+5)sec^2(x^2+5x)","(2x+5)tan(x^2+5x)","(2x+5)sec(x^2+5x)","(2x+5)sec^2(x^2+5x)·(x^2+5x)"],"answer":"(2x+5)sec^2(x^2+5x)","solution":"y = tan(u) with u = x^2+5x → dy/dx = sec^2(u)·du/dx = sec^2(x^2+5x)·(2x+5). This matches option A. Verification: differentiate tan(z) → sec^2(z)·dz/dx; here z = x^2+5x, dz/dx = 2x+5. No other option matches the derived form.","source":"MATH 157 lecture slides (Kwame Piesie) — Derivative of Trigonometric Functions (Chain Rule)","difficulty":"Hard"},{"id":"alg-v3-235","module":"v3","type":"mcq","q":"Given that the derivative of y = k^x is y' = 4y and y(0)=2, what is k?","options":["e^4","4","e^2","2"],"answer":"e^4","solution":"From y = k^x we have y' = k^x ln k. The condition y' = 4y gives k^x ln k = 4k^x ⇒ ln k = 4 ⇒ k = e^4. This matches option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Derivative of General Exponential Function","difficulty":"Hard"},{"id":"alg-v3-236","module":"v3","type":"mcq","q":"Given y = sin(4x) + cos(5x), the derivative dy/dx is:","options":["4cos(4x) − 5sin(5x)","4sin(4x) + 5cos(5x)","−4cos(4x) − 5sin(5x)","4cos(4x) + 5sin(5x)"],"answer":"4cos(4x) − 5sin(5x)","solution":"Derivative of sin(4x) is 4cos(4x); derivative of cos(5x) is -5sin(5x). Summing gives dy/dx = 4cos(4x) - 5sin(5x), which matches option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Derivative of Trigonometric Functions","difficulty":"Medium"},{"id":"alg-v3-237","module":"v3","type":"mcq","q":"If y = 2 cos³(3x), what is dy/dx?","options":["-18 cos²(3x) sin(3x)","6 cos²(3x) sin(3x)","-6 cos²(3x) sin(3x)","18 cos²(3x) sin(3x)"],"answer":"-18 cos²(3x) sin(3x)","solution":"y=2[cos(3x)]^3 → dy/dx = 2·3[cos(3x)]^2·(-sin(3x)·3) = -18 cos²(3x) sin(3x) (matches option A)","source":"MATH 157 lecture slides (Kwame Piesie) — Derivative of Powers of Trigonometric Functions","difficulty":"Hard"},{"id":"alg-v3-238","module":"v3","type":"mcq","q":"Determine the derivative of y = tan² x.","options":["2 tan x sec² x","2 tan x sec x","2 tan² x sec² x","2 sec² x"],"answer":"2 tan x sec² x","solution":"y = (tan x)^2 → dy/dx = 2·tan x·(tan x)′ = 2·tan x·sec^2 x. This matches option A. Verification: chain rule on u^2 with u=tan x gives same result; no other option yields the correct factors.","source":"MATH 157 lecture slides (Kwame Piesie) — Derivative of Powers of Trigonometric Functions","difficulty":"Medium"},{"id":"alg-v3-239","module":"v3","type":"mcq","q":"Find the derivative of y = sin^5 x with respect to x.","options":["5 sin^4 x cos x","5 cos^5 x","5 sin^4 x","5 sin^5 x cot x"],"answer":"5 sin^4 x cos x","solution":"Target: differentiate y = (sin x)^5. Givens: y = (sin x)^5, x ∈ ℝ. Object: composite function (outer power 5, inner sin x). Method: chain rule → dy/dx = 5 (sin x)^5‑1·(d/dx sin x) = 5 sin^4 x·cos x. Verification: substitute x=0 → sin0=0, derivative =0, matches option A; other options fail (B lacks sin factor, C lacks cos, D introduces cot).","source":"MATH 157 lecture slides (Kwame Piesie) — Derivative of Powers of Trigonometric Functions","difficulty":"Medium"},{"id":"alg-v3-240","module":"v3","type":"mcq","q":"For the implicit equation xy² + y - 4x = 0, the derivative dy/dx is:","options":["(4 - y²) / (2xy + 1)","(y² - 4) / (2xy + 1)","(4 + y²) / (2xy - 1)","(y² + 4) / (2xy + 1)"],"answer":"(4 - y²) / (2xy + 1)","solution":"Given F(x,y)=xy²+y-4x=0. Differentiate implicitly: d/dx(xy²)=y²+2xy·dy/dx, d/dx(y)=dy/dx, d/dx(-4x)=-4. So y²+2xy·dy/dx+dy/dx-4=0 → (2xy+1)dy/dx = 4 - y² → dy/dx = (4 - y²)/(2xy+1). This matches option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Implicit Differentiation","difficulty":"Hard"},{"id":"alg-v3-241","module":"v3","type":"mcq","q":"If x² + y² = 3xy, which of the following expresses dy/dx correctly?","options":["(3y - 2x) / (2y - 3x)","(2x - 3y) / (2y - 3x)","(3y + 2x) / (2y + 3x)","(2x + 3y) / (2y - 3x)"],"answer":"(3y - 2x) / (2y - 3x)","solution":"Differentiate x^2 + y^2 = 3xy → 2x + 2y y' = 3(x y' + y). Rearranged: 2y y' - 3x y' = 3y - 2x → y'(2y - 3x) = 3y - 2x → y' = (3y - 2x)/(2y - 3x). This matches option A. Verification: for a point satisfying the equation (e.g., x=1, y=(3+√5)/2), the derived dy/dx equals the constant ratio y/x, confirming correctness.","source":"MATH 157 lecture slides (Kwame Piesie) — Implicit Differentiation","difficulty":"Medium"},{"id":"alg-v3-242","module":"v3","type":"mcq","q":"For a sealed cylindrical can of radius r and height h, the total surface area A is given by which expression?","options":["A = 2πr(r + h)","A = πr^2 + 2πrh","A = 2πrh","A = πr(r + h)"],"answer":"A = 2πr(r + h)","solution":"Total surface area of a closed cylinder = area of two circles (2πr²) + lateral area (2πrh) = 2πr(r + h). This matches option A. Verification: substitute r=1, h=2 → A = 2π·1·(1+2)=6π; compute directly: 2π·1² + 2π·1·2 = 2π + 4π = 6π, confirming.","source":"MATH 157 lecture slides (Kwame Piesie) — Cylindrical Can","difficulty":"Hard"},{"id":"alg-v3-243","module":"v3","type":"mcq","q":"If the total surface area A of the cylinder equals 24π, which expression correctly gives the height h in terms of the radius r?","options":["h = 12/r - r","h = 12/r + r","h = 6/r - r","h = 6/r + r"],"answer":"h = 12/r - r","solution":"Total surface area of a cylinder: A = 2πr^2 + 2πrh. Set A = 24π → 2π(r^2 + rh) = 24π → r^2 + rh = 12 → rh = 12 - r^2 → h = (12 - r^2)/r = 12/r - r. This matches option A. Verification: for r=2, h = 12/2 - 2 = 4; surface area = 2π(2^2) + 2π(2)(4) = 8π + 16π = 24π, confirming correctness.","source":"MATH 157 lecture slides (Kwame Piesie) — Cylindrical Can","difficulty":"Hard"},{"id":"alg-v3-244","module":"v3","type":"mcq","q":"Simplify the expression ln(e^5 * e^2 / e^3) using the properties of natural logarithms.","options":["4","5","6","7"],"answer":"4","solution":"ln(e^5 * e^2 / e^3) = ln(e^5+2-3) = ln(e^4) = 4; verification: 5+2-3 = 4, and ln(e^4)=4.","source":"MATH 157 lecture slides (Kwame Piesie) — Properties of Natural Logarithm","difficulty":"Hard"},{"id":"alg-v3-245","module":"v3","type":"mcq","q":"Using the relation h = 12/r - r derived from A = 24π, which value of r maximises the volume V = πr²h?","options":["r = 1","r = 2","r = √3","r = 3"],"answer":"r = 2","solution":"V = πr²h = πr²(12/r - r) = π(12r - r³). dV/dr = π(12 - 3r²)=0 → r²=4 → r=2 (positive). Second derivative negative, so maximum. Verify: r=2 gives h=4, V=16π; other options give smaller V.","source":"MATH 157 lecture slides (Kwame Piesie) — Cylindrical Can","difficulty":"Hard"},{"id":"alg-v3-246","module":"v3","type":"mcq","q":"Given ln x = 3 and ln y = -2, evaluate ln( x^2 * y^3 / e ).","options":["-1","0","1","2"],"answer":"-1","solution":"ln x =3 ⇒ x=e^3; ln y = -2 ⇒ y=e^-2. Then ln(x^2 y^3 / e)=2ln x+3ln y-1=2·3+3·(-2)-1=6-6-1=-1, which matches option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Properties of Natural Logarithm","difficulty":"Hard"},{"id":"alg-v3-247","module":"v3","type":"mcq","q":"For the function y = x² + 3x, the gradient of the curve at the point (a, b) is given by which expression?","options":["2a + 3","2a + 3b","2 + 3a","a² + 3"],"answer":"2a + 3","solution":"Target: find dy/dx for y = x² + 3x. Givens: function defined for all real x; point (a,b) has x = a. Method: differentiate y with respect to x (power rule). dy/dx = 2x + 3. Evaluate at x = a → gradient = 2a + 3. Verification: direct differentiation gives 2a+3; limit definition yields same result, and substituting a = 1 gives derivative 5, matching (2·1+3). Hence option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Applications of Differentiation","difficulty":"Medium"},{"id":"alg-v3-248","module":"v3","type":"mcq","q":"If y = f(x) and the gradient of the tangent to the curve at point P(2,5) is 3, which equation represents the tangent at P?","options":["y - 5 = 3(x - 2)","y - 5 = 3(x + 2)","y + 5 = 3(x - 2)","y - 5 = 2(x - 2)"],"answer":"y - 5 = 3(x - 2)","solution":"Point‑slope form: y‑y₀ = m(x‑x₀). With P(2,5) and m=3 → y‑5 = 3(x‑2), which matches option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Tangents and Normals","difficulty":"Medium"},{"id":"alg-v3-249","module":"v3","type":"mcq","q":"Solve for x > 1: ln x + ln(x-1) = ln 6.","options":["2","3","4","6"],"answer":"3","solution":"Combine logs: ln[x(x-1)]=ln6 → x(x-1)=6 → x^2−x−6=0 → (x-3)(x+2)=0 → x=3 (x>1). Verify: ln3+ln2=ln6, true.","source":"MATH 157 lecture slides (Kwame Piesie) — Properties of Natural Logarithm","difficulty":"Medium"},{"id":"alg-v3-250","module":"v3","type":"mcq","q":"Which of the following is equivalent to ln( (a^2 b^-3) / (c^4) )?","options":["2 ln a + 3 ln b - 4 ln c","2 ln a - 3 ln b - 4 ln c","2 ln a - 3 ln b + 4 ln c","-2 ln a + 3 ln b - 4 ln c"],"answer":"2 ln a - 3 ln b - 4 ln c","solution":"ln((a^2 b^-3)/c^4) = ln(a^2) + ln(b^-3) - ln(c^4) = 2 ln a - 3 ln b - 4 ln c. Verification: for a=b=c=e, LHS = ln(e^-5) = -5, RHS (option B) = 2-3-4 = -5, confirming correctness.","source":"MATH 157 lecture slides (Kwame Piesie) — Properties of Natural Logarithm","difficulty":"Devil Mode"},{"id":"alg-v3-251","module":"v3","type":"mcq","q":"The volume V of a sphere is given by V = (4)/(3)pi r^3. If the radius of the sphere is increased by 2.5%, what is the approximate percentage increase in the volume of the sphere?","options":["2.5%","7.5%","5%","0.25%"],"answer":"7.5%","solution":"Let r' = 1.025r. Then V' = (4/3)π(r')³ = (4/3)π(1.025³)r³ = V·1.025³. 1.025³ ≈ 1 + 3·0.025 + 3·0.025² + 0.025³ ≈ 1.0769, so increase ≈ 0.0769 → 7.69%. Using differentials, dV/V = 3·dr/r = 3·0.025 = 0.075 → 7.5%. Both give ≈7.5%, matching option B.","source":"MATH 157 lecture slides (Kwame Piesie) — Differentials and Percentage Change","difficulty":"Medium"},{"id":"alg-v3-252","module":"v3","type":"mcq","q":"For the function y = x^3, at x = 2, if Δx = 0.01, what is the approximate change Δy using the differential approximation?","options":["0.12","0.15","0.012","0.24"],"answer":"0.12","solution":"dy = f'(2)Δx = 3·2²·0.01 = 12·0.01 = 0.12; exact Δy = (2+0.01)³−2³ ≈0.1206, confirming the differential approximation.","source":"MATH 157 lecture slides (Kwame Piesie) — Small Changes","difficulty":"Medium"},{"id":"alg-v3-253","module":"v3","type":"mcq","q":"Find the derivative dy/dx of y = 5x^3 - 12x + 7.","options":["15x^2 - 12","5x^2 - 12","15x - 12","12x^2 - 5"],"answer":"15x^2 - 12","solution":"Derivative of 5x^3 is 5·3x^2=15x^2; derivative of -12x is -12; constant 7 gives 0. Hence dy/dx = 15x^2 - 12, which matches option A. Verified by direct substitution and limit check.","source":"MATH 157 lecture slides (Kwame Piesie) — Derivatives","difficulty":"Medium"},{"id":"alg-v3-254","module":"v3","type":"mcq","q":"If x = 10 and y = x^2, then dy/dx = 20. When x increases by 5%, what is the approximate percentage increase in y?","options":["5%","10%","15%","20%"],"answer":"10%","solution":"Let y = x^2. Then dy = 2x dx. The fractional change in y is dy/y = (2x dx)/(x^2) = 2 (dx/x). With a 5 % rise in x, dx/x = 0.05, so dy/y = 2·0.05 = 0.10 → 10 % increase in y. Direct check: x→10.5 gives y=110.25, up 10.25 % from 100, confirming the 10 % estimate. Hence option B.","source":"MATH 157 lecture slides (Kwame Piesie) — Small Changes","difficulty":"Hard"},{"id":"alg-v3-255","module":"v3","type":"mcq","q":"Which statement about the differential approximation Δy ≈ dy/dx·Δx is true when Δx is not infinitesimally small?","options":["Δy = dy/dx·Δx holds exactly","The approximation becomes an equality for any Δx","Δy = dy/dx·Δx is only an approximation","The formula is valid only when dy/dx is constant"],"answer":"Δy = dy/dx·Δx is only an approximation","solution":"Δy = f(x+Δx)-f(x). Linearization gives f(x+Δx)≈f(x)+f'(x)Δx, so Δy≈f'(x)Δx. The exact relation is Δy = f'(x)Δx + ½f''(ξ)Δx^2 (Mean Value form) → extra term unless Δx→0 or f''=0 (constant slope). Hence for non‑infinitesimal Δx the equality fails; the formula is only an approximation. Verification: f(x)=x^2, Δx=1 → Δy=2x+1, while f'(x)Δx=2x, not equal except at x=0.","source":"MATH 157 lecture slides (Kwame Piesie) — Small Changes","difficulty":"Devil Mode"},{"id":"alg-v3-256","module":"v3","type":"mcq","q":"For the function y = x^3 - 6x^2 + 9x, find the x‑values of its stationary points.","options":["x = 0, x = 3","x = 1, x = 3","x = -1, x = 2","x = 2, x = 4"],"answer":"x = 1, x = 3","solution":"Derivative y' = 3x^2 - 12x + 9 = 3(x-1)(x-3); setting y'=0 yields x=1 and x=3. Verification: y'' = 6x-12, giving y''(1) = -6 (max) and y''(3)=6 (min), confirming stationary points at x=1 and x=3.","source":"MATH 157 lecture slides (Kwame Piesie) — Stationary points","difficulty":"Hard"},{"id":"alg-v3-257","module":"v3","type":"mcq","q":"For y = x^3 - 3x + 2, the stationary point at x = -1 is:","options":["Maximum","Minimum","Point of inflection","No stationary point"],"answer":"Maximum","solution":"Target: classify stationary point of y = x^3 - 3x + 2 at x = -1.\nGivens: cubic function, derivative y' = 3x^2 - 3, second derivative y'' = 6x.\nMethod: use second‑derivative test (or first‑derivative sign change).\nSteps:\n1. y' = 3(x^2 - 1) = 3(x-1)(x+1); y' = 0 at x = -1 (and x = 1), so x = -1 is a stationary point.\n2. y'' = 6x; at x = -1, y'' = -6 < 0 → concave down → local maximum.\nVerification:","source":"MATH 157 lecture slides (Kwame Piesie) — Nature of stationary points","difficulty":"Hard"},{"id":"alg-v3-258","module":"v3","type":"mcq","q":"For the function f(x)=2x³+3x², which statement correctly describes the nature of its turning points?","options":["Both turning points are minima","x=0 is a maximum and x=-1 is a minimum","x=0 is a minimum and x=-1 is a maximum","x=0 and x=-1 are inflection points"],"answer":"x=0 is a minimum and x=-1 is a maximum","solution":"f(x)=2x^3+3x^2. f'(x)=6x^2+6x=6x(x+1). Critical points: x=0, x=-1. f''(x)=12x+6. f''(0)=6>0 → local minimum at x=0. f''(-1)=-6<0 → local maximum at x=-1. Verified by first derivative test: f' changes from - to + at 0 (min); from + to - at -1 (max). Option C matches.","source":"MATH 157 lecture slides (Kwame Piesie) — Turning points and second derivative","difficulty":"Medium"},{"id":"alg-v3-259","module":"v3","type":"mcq","q":"Consider the curve y = x(x² − 16). Which of the following statements about its turning points is correct?","options":["The curve has a single turning point at x=0","The curve has a maximum at x = -4/√3 and a minimum at x = 4/√3","The curve has a minimum at x = -4/√3 and a maximum at x = 4/√3","The curve has no turning points"],"answer":"The curve has a maximum at x = -4/√3 and a minimum at x = 4/√3","solution":"y' = 3x²-16 = 0 → x = ±4/√3. y'' = 6x: y''(-4/√3) < 0 → local max, y''(4/√3) > 0 → local min. Sign of y' changes +→- at -4/√3 and -→+ at 4/√3, confirming a max at -4/√3 and a min at 4/√3.","source":"MATH 157 lecture slides (Kwame Piesie) — Sketching cubic curves","difficulty":"Hard"},{"id":"alg-v3-260","module":"v3","type":"mcq","q":"If the displacement of a particle is given by x(t) meters, which expression correctly represents its instantaneous velocity?","options":["dx/dt","d^2x/dt^2","x/t","(x2 - x1)/(t2 - t1)"],"answer":"dx/dt","solution":"Instantaneous velocity is defined as the limit of the average velocity over a vanishing time interval: v(t)=lim_Δt→0 (x(t+Δt)-x(t))/Δt, which is the derivative of the displacement function. Hence v(t)=dx/dt. Substituting a simple case, e.g., x(t)=t^2 gives dx/dt=2t, the known instantaneous velocity, confirming the expression.","source":"MATH 157 lecture slides (Kwame Piesie) — Differentiation","difficulty":"Medium"},{"id":"alg-v3-261","module":"v3","type":"mcq","q":"If the second derivative of a function equals zero at a turning point, the slide states that the turning point is an:","options":["Maximum","Minimum","Inflection point","Cannot be determined"],"answer":"Cannot be determined","solution":"The slide's statement concerns the second derivative test at a turning point (where f' = 0). If f'' = 0, the test is inconclusive— the point could be a maximum, minimum, or a horizontal inflection (e.g., f(x)=x^3 at x=0). Hence the nature cannot be determined, matching option D.","source":"MATH 157 lecture slides (Kwame Piesie) — Second derivative test","difficulty":"Medium"},{"id":"alg-v3-262","module":"v3","type":"mcq","q":"If the velocity v of a particle is negative (v < 0), which statement about its motion is true?","options":["The particle moves in the same direction as its initial motion","The particle is momentarily at rest","The particle moves opposite to its initial direction","The particle is accelerating"],"answer":"The particle moves in the same direction as its initial motion","solution":"short derivation + verification","source":"MATH 157 lecture slides (Kwame Piesie) — Kinematics","difficulty":"Hard"},{"id":"alg-v3-263","module":"v3","type":"mcq","q":"A particle moves a distance x1 in time t1 and a distance x2 in time t2 (with t2 > t1). Which formula gives the average velocity of the particle during the interval from t1 to t2?","options":["(x2 - x1)/(t2 - t1)","(x2 + x1)/(t2 + t1)","(x2 - x1)/t1","x2/t2"],"answer":"(x2 - x1)/(t2 - t1)","solution":"short derivation + verification","source":"MATH 157 lecture slides (Kwame Piesie) — Average Velocity","difficulty":"Medium"},{"id":"alg-v3-264","module":"v3","type":"mcq","q":"If a particle has a positive acceleration (a > 0), which of the following must be true?","options":["its velocity is increasing (becoming more positive)","its velocity is decreasing","its speed is constant","its direction of motion reverses"],"answer":"its velocity is increasing (becoming more positive)","solution":"a>0 ⇒ dv/dt>0, so velocity increases (becomes more positive). Verified by example v(t)=t (a=1>0) where v rises with time.","source":"MATH 157 lecture slides (Kwame Piesie) — Acceleration","difficulty":"Hard"},{"id":"alg-v3-265","module":"v3","type":"mcq","q":"The slides state that the condition for minimizing average cost is C'(x) = C(x). Which of the following statements is equivalent to this condition?","options":["Marginal cost equals average cost","Marginal revenue equals average revenue","Total cost equals total revenue","Average profit equals zero"],"answer":"Marginal cost equals average cost","solution":"C'(x) is marginal cost; C(x) is average cost. Setting them equal (C'(x)=C(x)) directly states that marginal cost equals average cost, which matches option A. Verification: by definition marginal cost = derivative of total cost, average cost = C(x); equality of the two is exactly the given condition.","source":"MATH 157 lecture slides (Kwame Piesie) — Minimising Average Cost","difficulty":"Hard"},{"id":"alg-v3-266","module":"v3","type":"mcq","q":"Which of the following correctly defines the Average Revenue function AR(x) as given in the slides?","options":["AR(x) = R(x)/x","AR(x) = C(x)/x","AR(x) = π(x)/x","AR(x) = R(x) - C(x)"],"answer":"AR(x) = R(x)/x","solution":"Average Revenue (AR) is defined as Total Revenue (R) divided by quantity (x). Thus AR(x) = R(x)/x. Option A matches this definition. Verification: Option B is Average Cost (C(x)/x), Option C is Average Profit (π(x)/x), Option D is Total Profit (R(x)-C(x)).","source":"MATH 157 lecture slides (Kwame Piesie) — Average Revenue","difficulty":"Medium"},{"id":"alg-v3-267","module":"v3","type":"mcq","q":"According to the slides, the Average Profit function AP(x) is defined as:","options":["AP(x) = π(x)/x","AP(x) = R(x)/x","AP(x) = C(x)/x","AP(x) = R(x) - C(x)"],"answer":"AP(x) = π(x)/x","solution":"Profit π(x) = R(x) - C(x). Average profit is profit per unit: AP(x) = π(x)/x. Option A matches this definition. Option B is average revenue, C is average cost, D is total profit. Verified with example: R=10x, C=2x+5 → π=8x-5, AP=8-5/x; only A yields this.","source":"MATH 157 lecture slides (Kwame Piesie) — Average Profit","difficulty":"Medium"},{"id":"alg-v3-268","module":"v3","type":"mcq","q":"If the total cost of producing x items is C(x)=2680+2x+0.001x^2, what is the cost of producing 150 items?","options":["3002.5","2980","3025","3080"],"answer":"3002.5","solution":"C(150)=2680+2*150+0.001*150^2=2680+300+22.5=3002.5, which matches option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Cost Functions","difficulty":"Medium"},{"id":"alg-v3-269","module":"v3","type":"mcq","q":"From the derivative calculation in the slides, setting d(AC)/dx = 0 leads to which equation?","options":["x C'(x) - C(x) = 0","C'(x) - C(x) = 0","x C'(x) + C(x) = 0","C'(x) = 0"],"answer":"x C'(x) - C(x) = 0","solution":"The slides define AC = C(x)/x. Differentiating, d(AC)/dx = (x·C'(x) – C(x))/x². Setting this derivative to zero requires the numerator to vanish: x·C'(x) – C(x) = 0, which is option A. Verification: for C(x)=k·x, AC = k (constant) → derivative 0, and x·C'(x) – C(x) = x·k – k·x = 0, confirming the equation.","source":"MATH 157 lecture slides (Kwame Piesie) — Derivative Condition","difficulty":"Medium"},{"id":"alg-v3-270","module":"v3","type":"mcq","q":"If the gradient function of a curve is dy/dx = 5x - 2 and the curve passes through the point (2, 7), which of the following is the equation of the curve?","options":["y = (5/2)x^2 - 2x + 3","y = (5/2)x^2 - 2x + 5","y = (5/2)x^2 - 2x + 1","y = (5/2)x^2 - 2x + 9"],"answer":"y = (5/2)x^2 - 2x + 1","solution":"Integrate dy/dx = 5x-2 → y = (5/2)x² - 2x + C. Use (2,7): (5/2)(4)-4+C = 10-4+C = 6+C = 7 → C=1. Thus y = (5/2)x² - 2x + 1, which is option C. Verified by substitution.","source":"MATH 157 lecture slides (Kwame Piesie) — Integration to find equation of curve","difficulty":"Medium"},{"id":"alg-v3-271","module":"v3","type":"mcq","q":"The gradient function of a curve is dy/dx = 6x^2 - 4x + 1. If the curve passes through the point (0, -3), which equation represents the curve?","options":["y = 2x^3 - 2x^2 + x - 3","y = 2x^3 - 2x^2 + x + 3","y = 2x^3 - 2x^2 + 2x - 3","y = 2x^3 - 2x^2 + x - 5"],"answer":"y = 2x^3 - 2x^2 + x - 3","solution":"1) Integrate dy/dx = 6x^2 - 4x + 1 to find y: y = (6x^3)/3 - (4x^2)/2 + x + C = 2x^3 - 2x^2 + x + C. 2) Apply boundary condition (0, -3): -3 = 2(0)^3 - 2(0)^2 + 0 + C => C = -3. 3) Equation is y = 2x^3 - 2x^2 + x - 3. 4) Verify derivative: d/dx(2x^3 - 2x^2 + x - 3) = 6x^2 - 4x + 1. Matches given gradient. Option A matches.","source":"MATH 157 lecture slides (Kwame Piesie) — Integration to find equation of curve","difficulty":"Hard"},{"id":"alg-v3-272","module":"v3","type":"mcq","q":"A curve has gradient function dy/dx = kx + 4. It passes through (1, 5) and the tangent at that point is horizontal. Find k and the equation of the curve.","options":["k = -4, y = -2x^2 + 4x + 3","k = -4, y = -2x^2 + 4x - 3","k = 4, y = -2x^2 + 4x + 3","k = -4, y = -2x^2 - 4x + 3"],"answer":"k = -4, y = -2x^2 + 4x + 3","solution":"At x=1 the tangent is horizontal, so dy/dx=0 ⇒ k·1+4=0 ⇒ k=−4. Integrate dy/dx=−4x+4 → y=∫(−4x+4)dx=−2x²+4x+C. Use (1,5): 5=−2(1)²+4(1)+C ⇒ C=3. Hence y=−2x²+4x+3, which matches option A. Verification: derivative = −4x+4 gives 0 at x=1 (horizontal) and y(1)=−2+4+3=5.","source":"MATH 157 lecture slides (Kwame Piesie) — Finding constants and curve equation","difficulty":"Hard"},{"id":"alg-v3-273","module":"v3","type":"mcq","q":"If dy/dx = 3x^2 + 2x + 1 and the curve passes through (2, 7), which of the following is the equation of the curve?","options":["y = x^3 + x^2 + x - 7","y = x^3 + x^2 + x + 7","y = x^3 + 2x^2 + x - 7","y = x^3 + x^2 + 2x - 7"],"answer":"y = x^3 + x^2 + x - 7","solution":"Integrate dy/dx = 3x^2+2x+1 → y = x^3 + x^2 + x + C. Use (2,7): 8+4+2+C=7 ⇒ C=-7. Hence y = x^3 + x^2 + x - 7, which matches option A. Verified by differentiation and substitution.","source":"MATH 157 lecture slides (Kwame Piesie) — Integration to find equation of curve","difficulty":"Medium"},{"id":"alg-v3-274","module":"v3","type":"mcq","q":"If the demand function is p = 80 - q^2 and the equilibrium price is p0 = 30, what is the consumer surplus (approximately)?","options":["150","236","300","450"],"answer":"236","solution":"1. Find equilibrium quantity q0: 30 = 80 - q0^2 => q0^2 = 50 => q0 = sqrt(50) ≈ 7.071. 2. Consumer Surplus (CS) formula: CS = ∫[0 to q0] (80 - q^2) dq - p0*q0. 3. Evaluate integral: [80q - q^3/3] from 0 to sqrt(50) = 80(50^(1/2)) - (50^(3/2))/3 = 50^(1/2)(80 - 50/3) = sqrt(50)(190/3). 4. Calculate CS: CS = sqrt(50)(190/3) - 30(sqrt(50)) = sqrt(50)(190/3 - 90/3) = sqrt(50)(100/3) ≈ 7.071 * 33.333 ≈","source":"MATH 157 lecture slides (Kwame Piesie) — Consumer Surplus","difficulty":"Hard"},{"id":"alg-v3-275","module":"v3","type":"mcq","q":"Given the demand curve p = 100 - 4q and equilibrium quantity q0 = 5, what is the consumer surplus?","options":["5","50","100","200"],"answer":"50","solution":"CS = ∫₀⁵(100-4q)dq - p₀·5. p₀=100-4·5=80. Integral = [100q-2q²]₀⁵ = 500-50=450. Subtract revenue 80·5=400 → CS=50. Geometry check: triangle base 5, height 100-80=20 → 0.5·5·20=50.","source":"MATH 157 lecture slides (Kwame Piesie) — Consumer Surplus","difficulty":"Medium"},{"id":"alg-v3-276","module":"v3","type":"mcq","q":"A solution of a differential equation that includes an arbitrary constant is defined as:","options":["particular solution","general solution","singular solution","particular integral"],"answer":"general solution","solution":"The definition asks for a solution that contains an arbitrary constant(s). In differential equations, a solution with arbitrary constants represents the full family of solutions and is called the **general solution**. A particular solution has no arbitrary constants, a singular solution is an envelope of a family, and a particular integral is another term for a particular solution. Hence the corre","source":"MATH 157 lecture slides (Kwame Piesie) — Differential Equations","difficulty":"Medium"},{"id":"alg-v3-277","module":"v3","type":"mcq","q":"Given the general solution y = C e^x of a first‑order ODE, which of the following satisfies the initial condition y(0)=5?","options":["y = 5 e^x","y = 5 e^0","y = 5","y = e^x"],"answer":"y = 5 e^x","solution":"General solution y = C e^x. Apply y(0)=5 → C e^0=C =5, so C=5. Hence y =5 e^x, which is option A. Verify: y(0)=5 e^0=5, satisfying the initial condition.","source":"MATH 157 lecture slides (Kwame Piesie) — Differential Equations","difficulty":"Medium"},{"id":"alg-v3-278","module":"v3","type":"mcq","q":"What is the general solution of the differential equation dy/dx = 5/x^2?","options":["y = -5/x + C","y = 5/x + C","y = -5/x^2 + C","y = 5/x^2 + C"],"answer":"y = -5/x + C","solution":"Integrate dy/dx = 5/x^2 → dy = 5 x^-2dx. ∫5 x^-2dx = 5(-x^-1)+C = -5/x + C. Hence y = -5/x + C, which matches option A. Verification: d/dx(-5/x) = 5/x^2.","source":"MATH 157 lecture slides (Kwame Piesie) — Differential Equations","difficulty":"Medium"},{"id":"alg-v3-279","module":"v3","type":"mcq","q":"Find the particular solution of dy/dx = 1 - 3x that satisfies y(0)=7.","options":["y = x - 1.5x^2 + 7","y = x - 0.5x^2 + 7","y = 2x - 1.5x^2 + 7","y = x - 1.5x^2 + 5"],"answer":"y = x - 1.5x^2 + 7","solution":"Integrate dy/dx = 1 - 3x → y = ∫(1 - 3x)dx = x - (3/2)x² + C. Use y(0)=7 → C=7. Hence y = x - 1.5x² + 7, which matches option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Differential Equations","difficulty":"Hard"},{"id":"alg-v3-280","module":"v3","type":"mcq","q":"Which of the following is the value of f(1, -2) for f(x, y) = 2x^2 - 3y^3?","options":["26","-26","14","0"],"answer":"26","solution":"f(1,-2) = 2(1)^2 - 3(-2)^3 = 2 - 3(-8) = 2 + 24 = 26. Direct substitution confirms the result matches option A.","source":"MATH 157 lecture slides (Kwame Piesie) — Evaluation of multivariable functions","difficulty":"Medium"},{"id":"alg-v3-281","module":"v3","type":"mcq","q":"Which statement best describes how the partial derivative ∂f/∂x of a function f(x, y) is obtained?","options":["Differentiate f with respect to both x and y simultaneously.","Treat y as a constant and differentiate f with respect to x.","Treat x as a constant and differentiate f with respect to y.","Set y = 0 before differentiating with respect to x."],"answer":"Treat y as a constant and differentiate f with respect to x.","solution":"By definition, the partial derivative ∂f/∂x of a function f(x,y) is computed by treating y as a constant and differentiating f with respect to x. Option B matches this definition. Option A describes a total derivative or gradient, option C describes ∂f/∂y, and option D incorrectly sets y=0 rather than holding it constant.","source":"MATH 157 lecture slides (Kwame Piesie) — Partial derivatives","difficulty":"Medium"},{"type":"fill","q":"Evaluate sum from k=1 to 12 k.","answer":"78","solution":"Using sum from k=1 to nk=(n(n+1))/(2): (12\\cdot13)/(2)=78. Direct addition confirms this.","source":"MATH 157 ALGEBRA 1.pdf (sigma notation, sets) - Kwame Piesie","difficulty":"Medium","id":"alg-v3-282","module":"v3"},{"type":"fill","q":"Evaluate sum from k=1 to 15 k.","answer":"120","solution":"Using sum from k=1 to nk=(n(n+1))/(2): (15\\cdot16)/(2)=120. Direct addit
