<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Carpe Diem Algebra - MATH 157 — The Carpe Diem</title>
<style>
:root{
  --navy:#0b1b33; --navy2:#12294a; --gold:#f5b301;
  --red:#b3261e; --red2:#8e1b16; --card:#dceaf0; --card2:#e8f1f5;
  --ink:#1c2733; --muted:#5d6b7a; --line:#c8d4de;
  --green:#2e7d32; --good:#e6f4ea; --bad:#fdecea;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f3f5f7;color:var(--ink);font-family:Arial,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer}

/* top bar */
.cdbar{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold)}
.cdmark{width:30px;height:30px;border:2px solid var(--gold);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:bold;font-size:12px;letter-spacing:.5px;flex:none}
.cdbar .brand{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:bold}
.cdbar .crumb{font-size:12px;color:#c8d6e5;margin-left:auto;text-align:right}

/* moodle quiz header */
.quizhead{background:#fff;border-bottom:1px solid var(--line);padding:18px 22px}
.quizhead .path{font-size:11px;color:var(--muted);letter-spacing:.4px}
.quizhead h1{font-size:24px;font-weight:600;margin:4px 0 2px;color:var(--navy)}
.quizhead .sub{font-size:12px;color:var(--muted)}

/* timer banner */
.timerbar{background:linear-gradient(90deg,var(--red2),var(--red));color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:center;position:relative;font-weight:bold;letter-spacing:.5px}
.timerbar .tt{font-size:20px}
.timerbar .td{font-size:20px;font-variant-numeric:tabular-nums;margin-left:12px}
.timerbar.warn{background:linear-gradient(90deg,#a35b00,#d97706)}
.timerbar.danger{background:linear-gradient(90deg,#7f1d1d,#b3261e)}
.timerbar .hide{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);border:0;color:#fff;padding:6px 12px;border-radius:4px;font-size:12px}

.wrap{max-width:860px;margin:0 auto;padding:24px 18px 120px}
.card{background:var(--card);border:1px solid #c2d3de;border-radius:12px;padding:26px;margin-bottom:18px;box-shadow:0 1px 2px rgba(11,27,51,.05)}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}
.qnum{font-size:13px;font-weight:bold;color:var(--navy)}
.qtag{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--muted);white-space:nowrap}
.qtext{font-size:17px;line-height:1.65;margin-bottom:18px;white-space:pre-wrap}
.qtext b{color:var(--navy)}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;width:100%;font-size:15px;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--gold)}
.opt.sel{border:2px solid var(--gold);background:#fff9e6}
.opt .key{width:22px;height:22px;border-radius:50%;border:1px solid #9aa9b8;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.opt.sel .key{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:bold}

.fillrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fillrow label{font-weight:bold;color:var(--navy)}
.fillrow input{background:#fff;border:1px solid #9aa9b8;border-radius:8px;padding:11px 14px;font-size:16px;width:240px;outline:none}
.fillrow input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,179,1,.2)}
.fillrow .hint{font-size:12px;color:var(--muted)}

.navrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.btn{border:0;border-radius:6px;padding:12px 24px;font-size:14px;font-weight:bold}
.btn.prev{background:#e4e9ee;color:var(--navy)}
.btn.next{background:var(--green);color:#fff}
.btn.finish{background:var(--navy);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.qgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.qgrid button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:4px;color:var(--muted);font-size:12px}
.qgrid button.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.qgrid button.cur{outline:2px solid var(--gold)}

/* start screen */
.start{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:18px}
.start h2{color:var(--navy);margin-bottom:6px}
.start p{color:var(--muted);margin-bottom:18px}
.mods{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.modbtn{border:1px solid var(--line);background:#f8fafb;border-radius:8px;padding:12px 16px;text-align:left;min-width:150px}
.modbtn.sel{border:2px solid var(--gold);background:#fff9e6}
.modbtn b{display:block;color:var(--navy);font-size:14px}
.modbtn span{font-size:12px;color:var(--muted)}
.bigbtn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:14px 30px;font-size:15px;font-weight:bold}

/* results */
.res{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:18px}
.score{font-size:52px;font-weight:bold;color:var(--navy);line-height:1}
.rstat{display:flex;gap:28px;margin:16px 0;flex-wrap:wrap}
.rstat div{font-size:13px;color:var(--muted)}
.rstat b{display:block;font-size:22px;color:var(--navy)}
.item{border:1px solid var(--line);border-left:4px solid var(--good);border-radius:8px;padding:16px;margin-bottom:12px;background:#fafcfb}
.item.wrong{border-left-color:#c62828;background:#fffafa}
.item .qq{font-weight:bold;margin-bottom:8px}
.item .aa{font-size:13px;margin:3px 0}
.item .ok{color:var(--green)}
.item .no{color:#c62828}
.sol{font-size:13px;background:#f1f5f9;border-radius:6px;padding:10px 12px;margin-top:8px;color:#37474f;white-space:pre-wrap}

@media(max-width:600px){
  .cdbar .crumb{display:none}
  .quizhead h1{font-size:20px}
  .timerbar .tt,.timerbar .td{font-size:16px}
  .card{padding:18px}
  .qtext{font-size:15px}
  .fillrow input{width:100%}
}
</style>

<script>
const BANK = {"config":{"title":"The Carpe Diem Algebra - MATH 157","course":"MATH 157","guide":"Kwame Piesie"},"modules":[{"id":"v1","name":"Version 1 - Real Exam","desc":"Kwame Piesie midsem questions","count":14,"source":"Gyasi's Algebra by Kwame Piesie"},{"id":"v2","name":"Version 2 - Other Exam Documents","desc":"Midsems, Pasco, quiz documents","count":143,"source":"exam PDFs"},{"id":"v3","name":"Version 3 - Slides & Textbook","desc":"MATH 157 lecture slides and textbooks","count":500,"source":"MATH 157 ALGEBRA 1-11"}],"questions":[{"id":"alg-v1-001","module":"v1","type":"mcq","q":"If log_e a, log_e b and log_e c are consecutive terms of an arithmetic progression, which of the following is true? I. log_e b −log_e a = log_e b −log_e c. II. b² = ac III. b = ½(a + c)","options":["I only","I and II only","II only","II and III only"],"answer":"II only","solution":"Let log_e a, log_e b, log_e c be consecutive terms of an AP, so 2 log_e b = log_e a + log_e c. This gives log_e (b²) = log_e(ac), hence b² = ac (II is true). For I: subtracting equal differences gives a = c, implying b = a = c, which isn't generally true. For III: b = (a+c)/2 contradicts b² = ac except for trivial cases. Thus only II holds.","source":"Gyasi's Algebra by Kwame Piesie (MATH 157 Feb 2023 midsem)","difficulty":"Hard"},{"id":"alg-v1-002","module":"v1","type":"mcq","q":"The total cost of 74 bags of maize and 47 bags of beans is GH¢6184. The cost of 39 bags of maize is the same as the cost of 33 3/7 bags of beans. How much will a trader pay for 12 bags of maize and 17 bags of beans?","options":["GH¢5600","GH¢8160","GH¢1488","GH¢6720","None of the above choices"],"answer":"None of the above choices","solution":"Let m and b be the unit costs. 74m + 47b = 6184 and 39m = (234/7)b, so m = (6/7)b. Then (444/7 + 47)b = (773/7)b = 6184, giving b = 56 and m = 48. Hence 12m + 17b = 576 + 952 = 1528, which is not listed: 'None of the above choices'.","source":"Gyasi's Algebra by Kwame Piesie (MATH 157 Feb 2023 midsem)","difficulty":"Hard"},{"id":"alg-v1-003","module":"v1","type":"mcq","q":"In a combined class at the School of Medicine and Dentistry there were 250 more Human Biology students than Dentistry students. The number of students offering Nursing was twice the number of students offering Dentistry. The number of student offering Human Biology was twice the number of students offering Dentistry and Nursing combined. How many students were in the class?","options":["450","300","100","150"],"answer":"450","solution":"Let D be Dentistry students, H Human Biology, N Nursing. Equations: H = D + 250, N = 2D, H = 2(D+N). Substitute N into third: H = 2(D+2D) = 6D. Set equal to first: D+250 = 6D → 250 = 5D → D = 50. Then N = 100, H = 300. Total = 50+100+300 = 450. Matches option A.","source":"Gyasi's Algebra by Kwame Piesie (MATH 157 Feb 2023 midsem)","difficulty":"Hard"},{"id":"alg-v1-004","module":"v1","type":"mcq","q":"Which of the following sets is/are a null set? I. {x : x is prime and 7 < x < 10} II. {x : x ∈N and 0 < x < 1} III. {x : x ∈ϕ}","options":["I only","I and II only","II and III only","I, II and III"],"answer":"I, II and III","solution":"I: no primes between 7 and 10 → empty. II: no natural number >0 and <1 → empty. III: set of elements of the empty set → empty. All three are null sets → D.","source":"Gyasi's Algebra by Kwame Piesie (MATH 157 Feb 2023 midsem)","difficulty":"Hard"},{"id":"alg-v1-005","module":"v1","type":"mcq","q":"In a class 156 students passed Mathematics or Physics and 75 passed both subjects. If the number of students who passed Mathematics were 9 more than those who passed Physics, and each student passed at least one of the subjects, how many students passed one subject?","options":["45","36","81","75"],"answer":"81","solution":"Let M = Math, P = Physics. Union = 156, intersection = 75, M = P+9. Union formula: M+P-75=156 → M+P=231. Substitute M: (P+9)+P=231 → 2P=222 → P=111, M=120. Exactly one subject = (M-75)+(P-75)=45+36=81. Option C.","source":"Gyasi's Algebra by Kwame Piesie (MATH 157 Feb 2023 midsem)","difficulty":"Hard"},{"id":"alg-v1-006","module":"v1","type":"mcq","q":"A 16-team Ghana Premier League has GH¢80, 000 to be awarded as prize money. If the last-place team is awarded GH¢2750 in prize money and the award in- creases by the same amount for each successive finishing place, how much will the first-place team receive?","options":["GH¢7250","GH¢7520","GH¢7052","GH¢7205"],"answer":"GH¢7250","solution":"Arithmetic progression: a16=2750, a1=2750+15d. Sum=16/2(2750+(2750+15d))=80000 => 8(5500+15d)=80000 => d=300. a1=2750+15*300=7250. Choice A.","source":"Gyasi's Algebra by Kwame Piesie (MATH 157 Feb 2023 midsem)","difficulty":"Hard"},{"id":"alg-v1-007","module":"v1","type":"mcq","q":"Find the value(s) of the real number k for which the matrix A = [[k, 6], [k + 4, 2k]] is singular.","options":["{k : k = −2 or k = −4}","{k : k = 2 or k = −4}","{k : k = −2 or k = 4}","{k : k = 2 or k = 4}","None of the above choices"],"answer":"None of the above choices","solution":"det A = 2k² − 6(k + 4) = 2(k² − 3k − 12) = 0 gives k = (3 ± √57)/2, not an integer pair as in A–D.","source":"Gyasi's Algebra by Kwame Piesie (MATH 157 Feb 2023 midsem)","difficulty":"Hard"},{"id":"alg-v1-008","module":"v1","type":"mcq","q":"Find the value of x if log_√2 8 = log₂ x.","options":["x = 6","x = 2⁶","x = 6²","None of the above choices"],"answer":"x = 2⁶","solution":"log_√28 = 3/(1/2) = 6, so log₂x = 6 and x = 2⁶ = 64.","source":"Gyasi's Algebra by Kwame Piesie (MATH 157 Feb 2023 midsem)","difficulty":"Hard"},{"id":"alg-v1-009","module":"v1","type":"mcq","q":"Find the set of all real numbers that satisfy the equation x² = x⁻².","options":["{x : x = 1}","{x : x = −1}","{x : x = ±1}","None of the above choices"],"answer":"{x : x = ±1}","solution":"For x ≠ 0, multiply both sides by x²: x⁴ = 1. The real roots are x = ±1 (the highlighted answer in the exam PDF).","source":"Gyasi's Algebra by Kwame Piesie (MATH 157 Feb 2023 midsem)","difficulty":"Hard"},{"id":"alg-v1-010","module":"v1","type":"mcq","q":"Find the value of x if log₃x − 4·logₓ3 = 0.","options":["{x : x = ±2}","{x : x = 1/9 or x = 9}","{x : x = 2}","{x : x = 9}"],"answer":"{x : x = 1/9 or x = 9}","solution":"Let t = log₃x; then logₓ3 = 1/t and t − 4/t = 0 gives t = ±2, so x = 3² = 9 or x = 3⁻² = 1/9.","source":"Gyasi's Algebra by Kwame Piesie (MATH 157 Feb 2023 midsem)","difficulty":"Hard"},{"id":"alg-v1-011","module":"v1","type":"mcq","q":"Find the ratio of the sum of the first n terms of the series log x + log x² + log x⁴ + log x⁸ + … to the first term.","options":["2ⁿ⁻¹","1 − 2ⁿ","2ⁿ − 1","None of the above choices"],"answer":"2ⁿ − 1","solution":"The exponents are 1, 2, 4, …, 2ⁿ⁻¹, so the sum is (1 + 2 + 4 + … + 2ⁿ⁻¹)log x = (2ⁿ − 1)log x. Dividing by the first term log x gives 2ⁿ − 1.","source":"Gyasi's Algebra by Kwame Piesie (MATH 157 Feb 2023 midsem)","difficulty":"Hard"},{"id":"alg-v1-012","module":"v1","type":"mcq","q":"If A = ϕ is a subset of R which of the following statements is/are not true about A ? I. card(A)̸ = 0 II. card(P(A)) = 1 III. A is not a singleton.","options":["II only","I and II only","I only","I, II and III"],"answer":"I only","solution":"A = ∅ (empty set). I. card(A) = 0, so card(A) ≠ 0 is false (not true). II. P(∅) = {∅}, card = 1, so statement is true. III. ∅ has 0 elements, so it is not a singleton; statement is true. Only statement I is not true → I only → option C.","source":"Gyasi's Algebra by Kwame Piesie (MATH 157 Feb 2023 midsem)","difficulty":"Hard"},{"id":"alg-v1-013","module":"v1","type":"mcq","q":"Let S = {ϕ, {ϕ}} be a subset of R. Which of these statements about S is/are not true? I. ϕ ⊂S II. {ϕ} ⊂S III. {ϕ} ∈S","options":["I and III only","II and III only","I and II only","None of the above choices A, B, C or D."],"answer":"None of the above choices A, B, C or D.","solution":"The set S = {∅, {∅}}. \nI. ∅ ⊂ S is always true because the empty set is a subset of every set.\nII. {∅} ⊂ S is true because the only element of {∅} (which is ∅) is in S.\nIII. {∅} ∈ S is true as {∅} is explicitly listed as an element of S.\nAll statements are true, so there are no statements that are not true. Therefore option E is correct.","source":"Gyasi's Algebra by Kwame Piesie (MATH 157 Feb 2023 midsem)","difficulty":"Hard"},{"id":"alg-v1-014","module":"v1","type":"mcq","q":"If the lines L1 : x + 2y −3 = 0 and L2 : 4x + 5y −9 = 0 intersect at a point P, find the equation of a line that passes through P and perpendicular to the line L3 : 3x + 2y −5 = 0.","options":["2x + 3y + 13 = 0","−2x + 3y −13 = 0","−2x + 3y + 13 = 0","None of the above choices"],"answer":"None of the above choices","solution":"Intersection of L1 and L2 gives P(1,1). L3 has slope -3/2, so a perpendicular line has slope 2/3. Through (1,1) the equation is y-1 = (2/3)(x-1) → 2x - 3y + 1 = 0, which is not among options A‑D, so choose E.","source":"Gyasi's Algebra by Kwame Piesie (MATH 157 Feb 2023 midsem)","difficulty":"Hard"},{"type":"mcq","q":"If A = {x ∈ ℝ : 4x² = 2^(x+3)} and B = {x ∈ ℝ : log(x²) = (log x)²}, find A ∩ B.","options":["A ∩ B = {−1, 0, 3/2, 2}","A ∩ B = {−1, 3/2}","A ∩ B = ∅","A ∩ B = {0, 2}","None of the above choices"],"answer":"A ∩ B = ∅","solution":"A: 4x² = 2^(x+3). Checking x = −1 gives 4 = 2² = 4 (so −1 ∈ A); no other listed value satisfies it. B: log(x²) = (log x)² needs x > 0; with t = log x, t² = 2t so t = 0 or t = 2, i.e. B = {1, 100}. Neither 1 nor 100 is in A, so the intersection is empty (answer key option C).","source":"algebra solved midsem - Benjamin Abbam.pdf (20-question midsem)","difficulty":"Hard","id":"alg-v2-001","module":"v2"},{"type":"mcq","q":"Find the truth set of the equation 2^(2x+1) − 9(2^x) + 4 = 0.","options":["{x : x = 1/2 or x = 2}","{x : x = 1/2 or x = 4}","{x : x = 1/2 or x = ±2}","{x : x = −1 or x = −2}","None of the above choices"],"answer":"None of the above choices","solution":"Put y = 2^x > 0. Then 2y² − 9y + 4 = 0, so y = (9 ± 7)/4 = 4 or 1/2. Hence x = 2 or x = −1. That pair is not among A–D, so 'None of the above choices' is correct.","source":"algebra solved midsem - Benjamin Abbam.pdf (20-question midsem)","difficulty":"Hard","id":"alg-v2-002","module":"v2"},{"type":"mcq","q":"Evaluate the sum Σ_k=1^50 (4k² − 18k + 2(−1)^k).","options":["148,705","148,075","148,507","148,750","None of the above choices"],"answer":"148,750","solution":"4·(50·51·101/6) − 18·(50·51/2) + 2·0 = 4·42,925 − 18·1,275 = 171,700 − 22,950 = 148,750 (the alternating part sums to zero over 50 terms).","source":"algebra solved midsem - Benjamin Abbam.pdf (20-question midsem)","difficulty":"Hard","id":"alg-v2-003","module":"v2"},{"type":"mcq","q":"Find the sum Σ_k=4^148 (4k³ + 15).","options":["486,292,753","486,292,573","486,292,375","486,292,735","None of the above choices"],"answer":"486,292,735","solution":"Σ_k=4^148 k³ = (148·149/2)² − (3·4/2)² = 11,026² − 6² = 121,572,676 − 36 = 121,572,640. Multiplying by 4 gives 486,290,560. There are 148 − 4 + 1 = 145 terms, so add 15·145 = 2,175: total = 486,292,735, matching option D.","source":"algebra solved midsem - Benjamin Abbam.pdf (20-question midsem)","difficulty":"Devil Mode","id":"alg-v2-004","module":"v2"},{"type":"mcq","q":"Find the common ratio of the geometric progression (√2 − 1) + (3 − 2√2) + (5√2 − 7) + (17 − 12√2) + …","options":["√(2 − 1)","√2 + 1","√2 − 1","1 − √2","None of the above choices"],"answer":"√2 − 1","solution":"(3 − 2√2)/(√2 − 1) = (3 − 2√2)(√2 + 1)/1 = 3√2 + 3 − 4 − 2√2 = √2 − 1 ≈ 0.4142. Also (5√2 − 7)/(3 − 2√2) = √2 − 1, confirming a constant ratio.","source":"algebra solved midsem - Benjamin Abbam.pdf (20-question midsem)","difficulty":"Hard","id":"alg-v2-005","module":"v2"},{"type":"mcq","q":"Find the value(s) of the real number k for which the matrix A = [[k, 6], [k + 4, 2k]] is singular.","options":["{k : k = 2 or k = 4}","None of the other four choices.","{k : k = 2 or k = −4}","{k : k = −2 or k = −4}","{k : k = −2 or k = 4}"],"answer":"None of the other four choices.","solution":"det A = 2k² − 6(k + 4) = 2(k² − 3k − 12). Setting it to zero gives k = (3 ± √57)/2 ≈ 5.275 or −2.275, neither of which is any listed integer pair; hence 'None of the other four choices.'","source":"ALGEBRA QUIZZES.pdf","difficulty":"Hard","id":"alg-v2-006","module":"v2"},{"type":"mcq","q":"Evaluate the sum log α + log(αx) + log(αx²) + … + log(αxⁿ).","options":["n log α + ½n(n − 1) log x","(n + 1) log α + ½n(n + 1) log x","n log α + ½n(n − 1) log x","None of the other four choices.","(n + 1) log α + ½(n − 1) log x"],"answer":"(n + 1) log α + ½n(n + 1) log x","solution":"There are n + 1 terms. Each contributes log α, giving (n + 1) log α; the powers of x add 0 + 1 + … + n = n(n + 1)/2, giving ½n(n + 1) log x.","source":"ALGEBRA QUIZZES.pdf","difficulty":"Hard","id":"alg-v2-007","module":"v2"},{"type":"mcq","q":"The sum of the first and fourth terms of an arithmetic sequence is 2 and the sum of their squares is 20. Find the ratio of the product of the two terms to their sum.","options":["20","None of the other four choices.","−8","2","−4"],"answer":"−4","solution":"Let u and v be the two terms. u + v = 2 and u² + v² = 20, so uv = [(u + v)² − (u² + v²)]/2 = (4 − 20)/2 = −8. Hence uv/(u + v) = −8/2 = −4.","source":"ALGEBRA QUIZZES.pdf","difficulty":"Hard","id":"alg-v2-008","module":"v2"},{"type":"mcq","q":"Evaluate cos{tan⁻¹(√3) − sin⁻¹(1/2)}.","options":["None of the other four choices.","√3/2","√2","0","1"],"answer":"√3/2","solution":"tan⁻¹(√3) = 60° and sin⁻¹(1/2) = 30°, so the difference is 30° and cos 30° = √3/2.","source":"ALGEBRA QUIZZES.pdf","difficulty":"Medium","id":"alg-v2-009","module":"v2"},{"type":"mcq","q":"Find the set of all real numbers that satisfy x² = x⁻².","options":["{x : x = ±1}","{x : x = −1}","None of the other four choices.","{x : x ∈ ℝ}","{x : x = 1}"],"answer":"{x : x = ±1}","solution":"Multiply by x² (x ≠ 0): x⁴ = 1, whose real solutions are x = ±1.","source":"ALGEBRA QUIZZES.pdf","difficulty":"Medium","id":"alg-v2-010","module":"v2"},{"type":"mcq","q":"Find the equation of the straight line with gradient 4 passing through the origin.","options":["y − x/4 = 0","None of the other four choices.","y + 4x = 0","y − 4/x = 0","y − 4x = 0"],"answer":"y − 4x = 0","solution":"Through the origin with slope 4: y = 4x, i.e. y − 4x = 0.","source":"ALGEBRA QUIZZES.pdf","difficulty":"Medium","id":"alg-v2-011","module":"v2"},{"type":"mcq","q":"Find the equation of the line connecting the origin to the midpoint of A(3, 2) and B(5, −1).","options":["8y − x = 0","None of the other four choices.","8y + x = 0","y − 8x = 0","y + (1/8)x = 0"],"answer":"8y − x = 0","solution":"Midpoint = ((3 + 5)/2, (2 − 1)/2) = (4, 1/2). Slope from the origin = (1/2)/4 = 1/8, so y = x/8, i.e. 8y − x = 0.","source":"ALGEBRA QUIZZES.pdf","difficulty":"Medium","id":"alg-v2-012","module":"v2"},{"type":"mcq","q":"Evaluate Σ_k=1^50 (4k² − 18k + 2(−1)^k).","options":["148,750","148,507","148,075","148,705","None of the other four choices."],"answer":"148,750","solution":"4 Σk² = 171,700; −18 Σk = −22,950; Σ(−1)^k = 0 for 50 terms. Total = 148,750.","source":"ALGEBRA QUIZZES.pdf","difficulty":"Hard","id":"alg-v2-013","module":"v2"},{"type":"mcq","q":"If sin α = 3/√10 and α is acute, find cos 2α.","options":["None of the other four choices.","−8/10","8/10","1/√10","−1/10"],"answer":"−8/10","solution":"cos 2α = 1 − 2sin²α = 1 − 2(9/10) = −8/10.","source":"ALGEBRA QUIZZES.pdf","difficulty":"Medium","id":"alg-v2-014","module":"v2"},{"type":"mcq","q":"Which of the following is the best classification for −4?","options":["integer, rational number, real number","irrational number, real number","rational number, real number","whole number, integer, real number"],"answer":"integer, rational number, real number","solution":"−4 is an integer; every integer is rational (−4 = −4/1) and every rational is real. It is not a whole number.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-015","module":"v2"},{"type":"mcq","q":"Which of these sets of numbers contains all rational numbers?","options":["π, 1/2, −13","−3.0541…, √99, 0.14363","−6, −√225, 4 2/8","√21, 0.75, 0"],"answer":"−6, −√225, 4 2/8","solution":"−√225 = −15 and 4 2/8 = 4.25 are rational, as is −6. π, √99 and √21 are irrational.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-016","module":"v2"},{"type":"mcq","q":"Which statement is NOT true about rational numbers?","options":["Whole numbers are rational numbers","Only fractions are rational numbers","Integers, whole numbers and natural numbers are rational numbers","Repeating decimals and terminating decimals are rational numbers"],"answer":"Only fractions are rational numbers","solution":"Integers are rational too (n = n/1), so rationals are not only fractions as written with a numerator/denominator.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-017","module":"v2"},{"type":"mcq","q":"Which statement is TRUE?","options":["All integers are rational numbers","A number can be both rational and irrational","Every integer is a whole number","All real numbers are rational"],"answer":"All integers are rational numbers","solution":"n = n/1 for every integer n. Negative integers are not whole numbers, not all reals are rational, and no number is both rational and irrational.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-018","module":"v2"},{"type":"mcq","q":"Which set contains NO irrational numbers?","options":["0.5, 2/7, −5.333…, π","√25, √1, √64, √20","√25, 4 2/5, 0.8, −7","−37/8, 0, √36, 3.45…"],"answer":"√25, 4 2/5, 0.8, −7","solution":"√25 = 5, 4 2/5 = 4.4, 0.8 and −7 are all rational. π and √20 are irrational.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-019","module":"v2"},{"type":"mcq","q":"Which of the following numbers is an irrational number?","options":["5.499","√17","−√9","−10"],"answer":"√17","solution":"17 is not a perfect square, so √17 is irrational; −√9 = −3, 5.499 and −10 are rational.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-020","module":"v2"},{"type":"mcq","q":"Which number in the list is NOT an integer?","options":["12/4","−4²","√25","−4.8"],"answer":"−4.8","solution":"12/4 = 3, −4² = −16 and √25 = 5 are integers; −4.8 is not.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-021","module":"v2"},{"type":"mcq","q":"Write the first five terms of the arithmetic sequence with a = −2.6 and d = −0.4.","options":["−2.6, −6.6, −10.6, −14.6, −18.6","−2.6, −3.0, −3.4, −3.8, −4.2","−2.6, −2.2, −1.8, −1.4, −1","0.4, −3, −5.6, −8.2, −10.8"],"answer":"−2.6, −3.0, −3.4, −3.8, −4.2","solution":"Add d = −0.4 repeatedly: −2.6, −3.0, −3.4, −3.8, −4.2.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-022","module":"v2"},{"type":"mcq","q":"If the first term of an arithmetic sequence is 6 and the common difference is −5, find the fifth term.","options":["26","−14","−4","9"],"answer":"−14","solution":"u₅ = 6 + 4(−5) = 6 − 20 = −14.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-023","module":"v2"},{"type":"mcq","q":"Find the sum of the arithmetic sequence with a = 100, u₂₅ = 220 and n = 25.","options":["4000","1280","320","8000"],"answer":"4000","solution":"S₂₅ = 25(100 + 220)/2 = 25·160 = 4000.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-024","module":"v2"},{"type":"mcq","q":"Find the sum Σ_n=1^100 5n.","options":["50,500","505","12,625","25,250"],"answer":"25,250","solution":"Σn = 100·101/2 = 5,050, so the required sum is 5·5,050 = 25,250.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-025","module":"v2"},{"type":"mcq","q":"Evaluate Σ_n=1^20 ((2/3)n + 1/3).","options":["41/3","40/3","440/3","210/3"],"answer":"440/3","solution":"(2/3)·(20·21/2) + (1/3)·20 = 140 + 20/3 = 440/3.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-026","module":"v2"},{"type":"mcq","q":"Decompose −6x / ((x + 5)(x − 5)) into partial fractions.","options":["−3/(x + 5) − 3/(x − 5)","3/(x + 5) − 3/(x − 5)","3/(x + 5) + 3/(x − 5)","−3/(x + 5) + 3/(x − 5)"],"answer":"−3/(x + 5) − 3/(x − 5)","solution":"Write −6x = A(x − 5) + B(x + 5). Letting x = 5 gives B = −3; x = −5 gives A = −3.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-027","module":"v2"},{"type":"mcq","q":"Which of the following is the sum of the series 1 + 1/3 + 1/9 + 1/27 + … ?","options":["7/4","11/4","5/2","3/2"],"answer":"3/2","solution":"Geometric with a = 1, r = 1/3: S∞ = a/(1 − r) = 1/(2/3) = 3/2.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-028","module":"v2"},{"type":"mcq","q":"If |3x + 5| = 8, find x.","options":["{1, −13/3}","{1, −1}","{4 1/3, −1}","{4 1/3, −4 1/3}"],"answer":"{1, −13/3}","solution":"3x + 5 = 8 gives x = 1; 3x + 5 = −8 gives x = −13/3.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-029","module":"v2"},{"type":"mcq","q":"If (1/3)|x + 8| = 6, find x.","options":["{10, −26}","{10, −10}","{26, −10}","{26, −26}"],"answer":"{10, −26}","solution":"|x + 8| = 18, so x + 8 = 18 or −18, giving x = 10 or x = −26.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-030","module":"v2"},{"type":"mcq","q":"If |x + 11| ≥ 2, find all x satisfying the inequality.","options":["x ≤ −13 or x ≥ −9","x ≤ −9 or x ≥ 13","x ≤ −13 or x ≥ 13","x ≤ −9 or x ≥ 9"],"answer":"x ≤ −13 or x ≥ −9","solution":"x + 11 ≥ 2 gives x ≥ −9; x + 11 ≤ −2 gives x ≤ −13.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-031","module":"v2"},{"type":"mcq","q":"Given 7 − 3|4x + 7| ≤ −2, find all x satisfying the inequality.","options":["x ≤ −2.5 or x ≥ −1","x ≤ −1 or x ≥ 1","x ≤ −2.5 or x ≥ 2.5","x ≤ 1 or x ≥ 2.5"],"answer":"x ≤ −2.5 or x ≥ −1","solution":"−3|4x + 7| ≤ −9 → |4x + 7| ≥ 3. Then 4x + 7 ≥ 3 (x ≥ −1) or 4x + 7 ≤ −3 (x ≤ −2.5).","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-032","module":"v2"},{"type":"mcq","q":"Given the absolute value inequality |ax + b| ≥ c, the inequalities needed to solve are:","options":["−c < ax + b < c","−c ≤ ax + b ≤ c","ax + b ≤ −c or ax + b ≥ c","None of the above"],"answer":"ax + b ≤ −c or ax + b ≥ c","solution":"|u| ≥ c (c > 0) means u ≤ −c or u ≥ c.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-033","module":"v2"},{"type":"mcq","q":"An absolute value equation for the temperature t on Tuesday is |t − 60| = 15. The high and low temperatures were:","options":["t = 75 and t = 45","t = 15 and t = 60","t = 60 only","t = 15 only"],"answer":"t = 75 and t = 45","solution":"t − 60 = ±15 gives t = 75 or t = 45.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-034","module":"v2"},{"type":"mcq","q":"Write the solution set of 11(3x + 1) > 11 in interval notation.","options":["[0, ∞)","(0, ∞)","[1/3, ∞)","(1/3, ∞)"],"answer":"(0, ∞)","solution":"Divide by 11: 3x + 1 > 1 → 3x > 0 → x > 0, i.e. (0, ∞).","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-035","module":"v2"},{"type":"mcq","q":"Which interval notation represents all numbers from 2 through 7, exclusive?","options":["(2, 7]","(2, 7)","[2, 7)","[2, 7]"],"answer":"(2, 7)","solution":"Excluding both endpoints gives the open interval (2, 7).","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-036","module":"v2"},{"type":"mcq","q":"Which set-builder notation describes {−3, −2, −1, 0, 1, 2}?","options":["{x : −3 < x < 2, x ∈ ℤ}","{x : −3 ≤ x < 2, x ∈ ℤ}","{x : −3 < x ≤ 2, x ∈ ℤ}","{x : −3 ≤ x ≤ 2, x ∈ ℤ}"],"answer":"{x : −3 ≤ x ≤ 2, x ∈ ℤ}","solution":"Both endpoints are included, so −3 ≤ x ≤ 2 with x an integer.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-037","module":"v2"},{"type":"mcq","q":"Which interval represents all real numbers ≥ 2 and < 20?","options":["(2, 20)","(2, 20]","[2, 20)","[2, 20]"],"answer":"[2, 20)","solution":"The left endpoint is included (square bracket) and the right excluded (round bracket).","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-038","module":"v2"},{"type":"mcq","q":"The solution of 2x² + 5x − 3 ≤ 0 in interval notation is:","options":["(−∞, −3] ∪ [1/2, ∞)","(−3, 1/2]","(−3, ∞]","[−3, 1/2]"],"answer":"[−3, 1/2]","solution":"2x² + 5x − 3 = (2x − 1)(x + 3); the parabola is non-positive between the roots −3 and 1/2 inclusive.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-039","module":"v2"},{"type":"mcq","q":"Simplify √(x² + 25).","options":["x + 5","|x + 5|","x + 10","None of the above"],"answer":"None of the above","solution":"√(x² + 25) cannot be simplified to x + 5 (since (x + 5)² = x² + 10x + 25).","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-040","module":"v2"},{"type":"mcq","q":"The set {11, 12} is equivalent to:","options":["{x : 11 < x < 12, x ∈ ℤ}","{x : 11 < x ≤ 12, x ∈ ℤ}","{x : 10 ≤ x < 12, x ∈ ℤ}","{x : 10 < x ≤ 12, x ∈ ℤ}"],"answer":"{x : 10 < x ≤ 12, x ∈ ℤ}","solution":"Integer x with 10 < x ≤ 12 gives exactly 11 and 12.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-041","module":"v2"},{"type":"mcq","q":"Solve √(10 + 2x) = 5 + x.","options":["x = 3 or x = 5","x = −1 or x = 3","x = 1 or x = −3","x = −3 or x = −5"],"answer":"x = −3 or x = −5","solution":"Squaring: 10 + 2x = x² + 10x + 25 → x² + 8x + 15 = 0 → x = −3 or −5. Both check in the original equation.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-042","module":"v2"},{"type":"mcq","q":"Solve x² = 49.","options":["{7, 7}","{24, 5}","{8, −8}","{7, −7}"],"answer":"{7, −7}","solution":"Both square roots satisfy the equation: x = ±7.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-043","module":"v2"},{"type":"mcq","q":"Which is true about s² + 3s − 4 = 0?","options":["Two non-real complex solutions","One rational solution","Two irrational solutions","Two rational solutions"],"answer":"Two rational solutions","solution":"Discriminant = 9 + 16 = 25 is a positive perfect square, so the two roots (−1, 4) are rational.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-044","module":"v2"},{"type":"mcq","q":"Which is true about t² + 8t + 16 = 0?","options":["Two irrational solutions","One rational solution","Two rational solutions","Two non-real complex solutions"],"answer":"One rational solution","solution":"Discriminant = 64 − 64 = 0, so there is one repeated rational root (t = −4).","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-045","module":"v2"},{"type":"mcq","q":"Which is true about 4y² = 6y − y?","options":["Two irrational solutions","One rational solution","Two non-real complex solutions","Two rational solutions"],"answer":"Two rational solutions","solution":"4y² − 5y = y(4y − 5) = 0 gives y = 0 and y = 5/4, both rational.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-046","module":"v2"},{"type":"mcq","q":"Write y = −2(x + 2)(x − 1) in standard form.","options":["y = −2x² + 4","y = −2x² − 2x − 4","y = −2x² − 2x + 4","y = −2x² + 2x + 4"],"answer":"y = −2x² − 2x + 4","solution":"(x + 2)(x − 1) = x² + x − 2; multiplying by −2 gives −2x² − 2x + 4.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-047","module":"v2"},{"type":"mcq","q":"Which quadratic has axis of symmetry x = 2 and minimum value −4?","options":["y = 3(x + 2)² − 4","y = −3(x + 2)² + 4","y = 3(x − 2)² − 4","y = −3(x − 2)² + 4"],"answer":"y = 3(x − 2)² − 4","solution":"Vertex form y = a(x − h)² + k gives h = 2, k = −4; a > 0 is needed for a minimum.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-048","module":"v2"},{"type":"mcq","q":"What is the y-intercept of y = 2(x − 2)² + 2?","options":["(0, −6)","(0, 6)","(0, −10)","(0, 10)"],"answer":"(0, 10)","solution":"At x = 0: y = 2(4) + 2 = 10, so the intercept is (0, 10).","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-049","module":"v2"},{"type":"mcq","q":"Which statement is true about a quadratic function?","options":["The graph always increases","The graph always crosses the x-axis","The graph is always symmetric about the y-axis","The equation is always a second-degree equation"],"answer":"The equation is always a second-degree equation","solution":"A quadratic has degree 2; it need not always increase, need not cross the x-axis, and its axis of symmetry need not be the y-axis.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-050","module":"v2"},{"type":"mcq","q":"The graph of y = (x + 7)² + 4 is the image of y = x² after:","options":["a horizontal translation of 7 and vertical translation of 4","a horizontal translation of −7 and vertical translation of 4","a horizontal translation of 7 and vertical translation of −4","a horizontal translation of −7 and vertical translation of −4"],"answer":"a horizontal translation of −7 and vertical translation of 4","solution":"Replacing x by x + 7 shifts the graph 7 units left (−7 horizontally); adding 4 shifts it 4 units up.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-051","module":"v2"},{"type":"mcq","q":"If the roots of an equation are −2 and 4, then the discriminant is:","options":["an imaginary number","0","a positive number","a negative number"],"answer":"a positive number","solution":"Two distinct real roots imply b² − 4ac > 0.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-052","module":"v2"},{"type":"mcq","q":"Which form represents a downward-opening parabola with vertex (h, k) where h, k > 0?","options":["y = −a(x − h)² + k","y = −a(x + h)² − k","y = a(x + h)² − k","y = a(x − h)² + k"],"answer":"y = −a(x − h)² + k","solution":"Vertex form is y = a(x − h)² + k; opening downward requires a < 0, written −a with a > 0.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-053","module":"v2"},{"type":"mcq","q":"In the binomial expansion of (2a − 3b)¹², the term containing b⁵ is the:","options":["4th term","5th term","6th term","7th term"],"answer":"6th term","solution":"The general term is C(12, r)(2a)^(12−r)(−3b)^r; b⁵ requires r = 5, so the term is T₆ (the 6th term).","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-054","module":"v2"},{"type":"mcq","q":"In the expansion of (x − 2)ⁿ, the 6th term is −8064x⁵. Find n.","options":["5","6","10","11"],"answer":"10","solution":"T₆ = C(n, 5)(−2)⁵x^(n−5). Matching x⁵ gives n = 10, and −32·C(10, 5) = −32·252 = −8064. ✓","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-055","module":"v2"},{"type":"mcq","q":"In (a + b)¹⁵, what is the numerical coefficient of the term containing a²b¹³?","options":["55","72","98","105"],"answer":"105","solution":"C(15, 2) = C(15, 13) = 105 (the a and b coefficients are both 1).","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-056","module":"v2"},{"type":"mcq","q":"What is the position of the term containing x³⁰ in (2x³ + 4)¹²?","options":["2nd term","3rd term","4th term","5th term"],"answer":"3rd term","solution":"T_(r+1) has x^(3(12−r)); 3(12 − r) = 30 gives r = 2, so it is the 3rd term.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-057","module":"v2"},{"type":"mcq","q":"How many terms are in the binomial expansion of (2x² + 3/x)⁶?","options":["5","6","7","8"],"answer":"7","solution":"A binomial expansion of power n has n + 1 terms; here 6 + 1 = 7.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-058","module":"v2"},{"type":"mcq","q":"In the expansion of (p − 2/p)¹⁰, which term is independent of p?","options":["3rd term","4th term","5th term","6th term"],"answer":"6th term","solution":"T_(r+1) = C(10, r)p^(10−r)(−2/p)^r = C(10, r)(−2)^r p^(10−2r). Set 10 − 2r = 0 → r = 5 → 6th term.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-059","module":"v2"},{"type":"mcq","q":"In the expansion of (p − 2/p)¹⁰, find the value of the term independent of p.","options":["−8064","−4428","4428","8064"],"answer":"−8064","solution":"With r = 5 the term is C(10, 5)(−2)⁵ = 252 × (−32) = −8064.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-060","module":"v2"},{"type":"mcq","q":"What is the size of the matrix A with rows (1, 2, 3, 4), (12, 3, 4, 1) and (13, 14, 1, 2)?","options":["2 × 3","3 × 2","4 × 3","3 × 4"],"answer":"3 × 4","solution":"The matrix has 3 rows and 4 columns.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-061","module":"v2"},{"type":"mcq","q":"Given A = [[1, 2, 3, 4], [12, 3, 4, 1], [13, 14, 1, 2]], which element is a₂₃?","options":["3","4","12","14"],"answer":"4","solution":"a₂₃ is the entry in row 2, column 3, which is 4.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-062","module":"v2"},{"type":"mcq","q":"If A is 2 × 3 and B is 3 × 4, how many columns does AB have?","options":["2","3","4","6"],"answer":"4","solution":"The product AB has the same number of columns as B, namely 4.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-063","module":"v2"},{"type":"mcq","q":"What value of x satisfies [[0, −x], [3x − 2, 5]] = [[0, 7x + 14], [x + 8, 5]]ᵀ?","options":["−2","−4","4","5"],"answer":"−4","solution":"Transposing the right side gives [[0, x + 8], [7x + 14, 5]]. Equating: −x = x + 8 and 3x − 2 = 7x + 14 both give x = −4.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-064","module":"v2"},{"type":"mcq","q":"Which of the following 2 × 2 matrices is singular?","options":["[[1, 3], [0, −1]]","[[−5, 0], [0, 4]]","[[5, −5], [3, −3]]","[[1, 2], [−1, 2]]"],"answer":"[[5, −5], [3, −3]]","solution":"Its determinant is 5(−3) − (−5)(3) = −15 + 15 = 0.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-065","module":"v2"},{"type":"mcq","q":"If A is a symmetric matrix then Aᵀ equals:","options":["A","|A|","0","the diagonal matrix"],"answer":"A","solution":"By definition A is symmetric exactly when Aᵀ = A.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Medium","id":"alg-v2-066","module":"v2"},{"type":"mcq","q":"If [[a, 2, −3], [b, c, 5], [d, e, f]] is skew-symmetric, find a + b + c + d + e + f.","options":["−4","0","1","4"],"answer":"−4","solution":"Skew-symmetry forces a = c = f = 0, b = −2, d = 3, e = −5; the sum is −2 + 3 − 5 = −4.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-067","module":"v2"},{"type":"mcq","q":"Given A = [[1, 5, −6], [−1, −4, 4], [−2, −7, 9]] with |A| = 3, find |B| when B = [[1, −1, −2], [5, −4, −7], [−6, 4, 9]].","options":["−3","3","2","−2"],"answer":"3","solution":"B = Aᵀ and a matrix and its transpose have equal determinants.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-068","module":"v2"},{"type":"mcq","q":"Given A = [[1, 5, −6], [−1, −4, 4], [−2, −7, 9]] with |A| = 3, find |B| when B = [[−2, −7, 9], [−1, −4, 4], [1, 5, −6]].","options":["−3","3","2","−2"],"answer":"−3","solution":"B is obtained from A by swapping rows 1 and 3, which multiplies the determinant by −1.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-069","module":"v2"},{"type":"mcq","q":"Write the system x − 4y − 2z = 21, 2x + y + 2z = 3, 3x + 2y − z = −2 in the form Ax = b.","options":["A = [[1, −4, −2], [2, 2, 1], [3, −1, 2]], b = [21, 3, −2]","A = [[1, −4, −2], [2, 2, 1], [3, −1, 2]], b = [−2, 3, 21]","A = [[1, −4, −2], [2, 1, 2], [3, 2, −1]], b = [21, 3, −2]","A = [[1, 2, 3], [−4, 1, 2], [−2, 2, −1]], b = [21, 3, −2]"],"answer":"A = [[1, −4, −2], [2, 1, 2], [3, 2, −1]], b = [21, 3, −2]","solution":"The coefficient matrix holds the coefficients of x, y, z in order, and b holds the right-hand sides.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-070","module":"v2"},{"type":"mcq","q":"For the augmented matrix of the system above, which row operation reduces a₂₁ to 0?","options":["2R₂ − R₁ → R₂","R₂ − 2R₁ → R₂","3R₂ − 2R₁ → R₂","R₂ − 3R₁ → R₂"],"answer":"R₂ − 2R₁ → R₂","solution":"a₂₁ = 2 and a₁₁ = 1, so subtracting 2R₁ from R₂ zeroes it.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-071","module":"v2"},{"type":"mcq","q":"After applying R₂ − 2R₁ → R₂, which operation reduces a₃₁ to 0?","options":["R₃ − 2R₁ → R₃","3R₃ − 2R₁ → R₃","R₃ − 3R₁ → R₃","3R₃ − R₁ → R₃"],"answer":"R₃ − 3R₁ → R₃","solution":"a₃₁ = 3 and a₁₁ = 1, so R₃ − 3R₁ → R₃ zeroes the entry.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-072","module":"v2"},{"type":"mcq","q":"After the previous two operations the rows are [1, −4, −2], [0, 9, 6] and [0, 14, 7]. Which operation reduces a₃₂ to 0?","options":["R₃ − (9/14)R₂ → R₃","R₃ − (14/9)R₂ → R₃","R₃ − (7/14)R₂ → R₃","R₃ − (14/7)R₂ → R₃"],"answer":"R₃ − (14/9)R₂ → R₃","solution":"a₃₂ = 14 and a₂₂ = 9, so subtract (14/9) times row 2 from row 3.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Devil Mode","id":"alg-v2-073","module":"v2"},{"type":"mcq","q":"Solve the system x − 4y − 2z = 21, 2x + y + 2z = 3, 3x + 2y − z = −2.","options":["x = 1, y = 3, z = −5","x = 3, y = −5, z = 1","x = −3, y = 5, z = −1","x = −1, y = −3, z = 5"],"answer":"x = 3, y = −5, z = 1","solution":"Check: 3 − 4(−5) − 2(1) = 21 ✓; 2(3) + (−5) + 2(1) = 3 ✓; 3(3) + 2(−5) − 1 = −2 ✓.","source":"Algebra 2.pdf / Algebra 1.pdf (Kwame Piesie practice packet)","difficulty":"Hard","id":"alg-v2-074","module":"v2"},{"type":"mcq","q":"Evaluate log₅2 + log₅50 − log₅4.","options":["2","5","25","1","√21"],"answer":"2","solution":"log₅(2·50/4) = log₅25 = 2.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-075","module":"v2"},{"type":"mcq","q":"Given x = log₅3 + log₅4, find x (to two decimal places).","options":["log 12","log 5","1.54","2.4","3.47"],"answer":"1.54","solution":"x = log₅12 = ln 12 / ln 5 ≈ 2.4849/1.6094 ≈ 1.544.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-076","module":"v2"},{"type":"mcq","q":"Find x if 4 logₓ6 − 2 logₓ4 = 1.","options":["16","4","1.296","81","27√6"],"answer":"81","solution":"logₓ(6⁴/4²) = logₓ81 = 1, hence x = 81.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-077","module":"v2"},{"type":"mcq","q":"Solve log₁₀(x² − 3) − log₁₀x = log₁₀2.","options":["3","−1","1","4","−3"],"answer":"3","solution":"(x² − 3)/x = 2 → x² − 2x − 3 = 0 → x = 3 or −1; only x = 3 lies in the domain (x > 0 and x² > 3).","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-078","module":"v2"},{"type":"mcq","q":"Solve log(x − 1) + log(x + 8) = 2 log(x + 2).","options":["3","2","1","4","−4"],"answer":"4","solution":"(x − 1)(x + 8) = (x + 2)² → x² + 7x − 8 = x² + 4x + 4 → 3x = 12 → x = 4.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-079","module":"v2"},{"type":"mcq","q":"Solve 2^(x+1) = 3^(2x−5) (to two decimal places).","options":["2.69","4.11","0.65","0.95","1.36"],"answer":"4.11","solution":"(x + 1)ln2 = (2x − 5)ln3 → x = (5ln3 + ln2)/(2ln3 − ln2) ≈ 4.114.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-080","module":"v2"},{"type":"mcq","q":"Find x if 6^(2x−1) = 36^(−x).","options":["−4","1/3","1/4","4","2/3"],"answer":"1/4","solution":"36^(−x) = 6^(−2x), so 2x − 1 = −2x → 4x = 1 → x = 1/4.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-081","module":"v2"},{"type":"mcq","q":"Find x if 3^(x+2) − 3^(x+1) = 2/3.","options":["1/6","2","1/9","−2","None of these"],"answer":"−2","solution":"3^(x+1)(3 − 1) = 2/3 → 3^(x+1) = 1/3 = 3^(−1) → x + 1 = −1 → x = −2.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-082","module":"v2"},{"type":"mcq","q":"Solve for x if 27^(2x−5) = 1/√(9^(x+1)).","options":["14","2","7","√7","5"],"answer":"2","solution":"3^(6x−15) = 3^(−(x+1)) → 6x − 15 = −x − 1 → 7x = 14 → x = 2.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-083","module":"v2"},{"type":"mcq","q":"Find the 15th term of the series 3, 9, 15, 21, …","options":["78","84","87","81","76"],"answer":"87","solution":"AP with a = 3, d = 6: u₁₅ = 3 + 14·6 = 87.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-084","module":"v2"},{"type":"mcq","q":"Determine the number of the term whose value is 22 in the series 2.5, 4, 5.5, 7, …","options":["13","14","15","16","17"],"answer":"14","solution":"2.5 + (n − 1)(1.5) = 22 → n − 1 = 13 → n = 14.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-085","module":"v2"},{"type":"mcq","q":"Find the sum of the first 12 terms of the series 5, 9, 13, 17, …","options":["44","10","324","648","6"],"answer":"324","solution":"S₁₂ = 12/2 [2·5 + 11·4] = 6(10 + 44) = 324.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-086","module":"v2"},{"type":"mcq","q":"The sum of 7 terms of an AP is 35 and the common difference is 1.2. Find the first term.","options":["7.2","10","2.8","35","1.4"],"answer":"1.4","solution":"35 = 7/2 [2a + 6(1.2)] → 10 = 2a + 7.2 → a = 1.4.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-087","module":"v2"},{"type":"mcq","q":"Find the sum of the first 9 terms of the series 72.0, 57.6, 46.08, …","options":["311.7","72","389.6","546.5","472.3"],"answer":"311.7","solution":"GP with a = 72, r = 0.8: S₉ = 72(1 − 0.8⁹)/0.2 ≈ 311.68 ≈ 311.7.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-088","module":"v2"},{"type":"mcq","q":"Determine the 10th term of the series 3, 6, 12, 24, …","options":["512","1024","3072","3","1536"],"answer":"1536","solution":"GP with a = 3, r = 2: u₁₀ = 3·2⁹ = 1536.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-089","module":"v2"},{"type":"mcq","q":"The first term of a GP is 12 and the fifth term is 55. Find the 11th term.","options":["1.64","172.3","539.7","11.64","593.7"],"answer":"539.7","solution":"r⁴ = 55/12, so u₁₁ = a·r¹⁰ = 12(55/12)^(2.5) ≈ 539.7.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-090","module":"v2"},{"type":"mcq","q":"In the expansion (a − 2b)³, the coefficient of b³ is:","options":["2a³","−4a","−8a","12a","15a","−8"],"answer":"−8","solution":"The b³ term is C(3, 3)(−2b)³ = −8b³, so the numerical coefficient is −8.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-091","module":"v2"},{"type":"mcq","q":"Write down the first three terms of (2 − 3x)⁵ in ascending powers of x.","options":["32 + 240x + 720x²","32 − 240x + 720x²","32 + 240x − 720x²","32 − 240x − 720x²","None of these"],"answer":"32 − 240x + 720x²","solution":"2⁵ = 32; C(5, 1)2⁴(−3x) = −240x; C(5, 2)2³(−3x)² = 720x².","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-092","module":"v2"},{"type":"mcq","q":"The partial fraction 2/((x + 1)(x − 1)) = A/(x + 1) + B/(x − 1). Find 2A + B.","options":["3","−1","4","1","2"],"answer":"−1","solution":"2 = A(x − 1) + B(x + 1); x = −1 gives A = −1, x = 1 gives B = 1, so 2A + B = −1.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-093","module":"v2"},{"type":"mcq","q":"Construct an equation with roots √5 + 2 and √5 − 2.","options":["x² − 2√5x + 1 = 0","x² + 2√5x + 1 = 0","x² − 2√5x − 1 = 0","x² − 5√2x + 1 = 0","None of these"],"answer":"x² − 2√5x + 1 = 0","solution":"Sum of roots = 2√5 and product = (√5)² − 2² = 1, so x² − (sum)x + product = 0.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-094","module":"v2"},{"type":"mcq","q":"If α, β are roots of 3x² − x − 5 = 0, form the equation whose roots are 2α − 1/β and 2β − 1/α.","options":["15x² + 13x − 169 = 0","15x² − 6x − 169 = 0","15x² − 13x − 169 = 0","15x² − 6x + 169 = 0","15x² − 13x + 169 = 0"],"answer":"15x² − 13x − 169 = 0","solution":"α + β = 1/3, αβ = −5/3. New sum = 2(1/3) − (1/3)/(−5/3) = 13/15. New product = 4αβ − 4 + 1/(αβ) = −169/15. Hence 15x² − 13x − 169 = 0.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Devil Mode","id":"alg-v2-095","module":"v2"},{"type":"mcq","q":"One root of 2x² + bx + c = 0 is three times the other. Which relation is true?","options":["3b = 32c","3b² = 16c","b² = 32c","9b² = 32c","3b² = 32c"],"answer":"3b² = 32c","solution":"With roots r and 3r: 4r = −b/2 and 3r² = c/2. Eliminating r gives 3b² = 32c.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Devil Mode","id":"alg-v2-096","module":"v2"},{"type":"mcq","q":"What is the size of A = [[1, 2, 3, 4], [12, 3, 4, 1], [13, 14, 1, 2]]?","options":["2 × 3","3 × 2","4 × 3","3 × 3","3 × 4"],"answer":"3 × 4","solution":"Three rows and four columns.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-097","module":"v2"},{"type":"mcq","q":"What is the size of the product [[1, −11, 2], [0, 7, 0], [−3, 4, 9], [2, 3, 0]] · [[4, 0, 0], [0, 1, 5], [3, 2, −1]]?","options":["3 × 4","4 × 4","4 × 3","3 × 3","Not possible"],"answer":"4 × 3","solution":"The first factor is 4 × 3 and the second is 3 × 3, so the product is 4 × 3.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-098","module":"v2"},{"type":"mcq","q":"For A = [[2, −3], [0, 2], [7, −2]] and B = [[1, −2, 0], [5, 1, 2]], find 3(Aᵀ + 2B).","options":["[[12, −12, 21], [21, 12, 6]]","[[12, 12, 21], [21, −12, −6]]","[[21, 4, 7], [−4, 4, 2]]","undefined","[[12, 21, −12], [12, 21, −6]]"],"answer":"[[12, −12, 21], [21, 12, 6]]","solution":"Aᵀ = [[2, 0, 7], [−3, 2, −2]]; 2B = [[2, −4, 0], [10, 2, 4]]; adding and tripling gives [[12, −12, 21], [21, 12, 6]].","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-100","module":"v2"},{"type":"mcq","q":"Find the product [[3, −1], [0, 4], [1, 6]] · [[1, 3, 6, 0], [−2, 1, 0, 1]].","options":["[[5, 8, 18, −1], [−8, 4, 0, 4], [−11, 9, 6, 6]]","[[5, 8, 2, −3], [−8, 0, 4, 0], [11, 6, 9, 6]]","[[5, 18], [−11, 6]]","[[15, 18, 8, −1], [−8, 4, 0, 4], [−11, 9, 6, 6]]","undefined"],"answer":"[[5, 8, 18, −1], [−8, 4, 0, 4], [−11, 9, 6, 6]]","solution":"Row 1: (3·1 + (−1)(−2), 9 − 1, 18 + 0, 0 − 1) = (5, 8, 18, −1); row 2 = (−8, 4, 0, 4); row 3 = (−11, 9, 6, 6).","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-101","module":"v2"},{"type":"mcq","q":"If cos C = 1/√5 and C is acute, find sin 2C.","options":["3/5","4/5","4/3","5/3","2"],"answer":"4/5","solution":"sin C = 2/√5, so sin 2C = 2·(1/√5)(2/√5) = 4/5.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-102","module":"v2"},{"type":"mcq","q":"If cos C = 1/√5 and C is acute, find cot 2C.","options":["5/3","5/4","−3/4","3/5","1"],"answer":"−3/4","solution":"cos 2C = 1/5 − 4/5 = −3/5 and sin 2C = 4/5, so cot 2C = (−3/5)/(4/5) = −3/4.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-103","module":"v2"},{"type":"mcq","q":"If cos C = 1/√5 and C is acute, find cos 2C.","options":["3/5","−3/5","−4/5","4/5","−2/√5"],"answer":"−3/5","solution":"cos 2C = 2cos²C − 1 = 2/5 − 1 = −3/5.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-104","module":"v2"},{"type":"mcq","q":"Find cot θ given cos θ = 21/29 and θ is in the fourth quadrant.","options":["−21√2/4","29/21","−20/21","−21/20","1/20"],"answer":"−21/20","solution":"sin θ = −20/29 (fourth quadrant), so cot θ = (21/29)/(−20/29) = −21/20.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-105","module":"v2"},{"type":"mcq","q":"Find the exact value of cos 960°.","options":["−√3","√2/2","−1/2","−√3/2","1/2"],"answer":"−1/2","solution":"960° − 720° = 240°, and cos 240° = −1/2.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-106","module":"v2"},{"type":"mcq","q":"Simplify 1 − 2sin²x + sin⁴x.","options":["1 + tan²x","sin²x","cos⁴x","1 − sin²x","1 + sin²x"],"answer":"cos⁴x","solution":"The expression equals (1 − sin²x)² = (cos²x)² = cos⁴x.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-107","module":"v2"},{"type":"mcq","q":"Simplify sin²θ + tan²θ + cos²θ.","options":["tan²θ","sec²θ","cos³θ","sinθ","cot²θ"],"answer":"sec²θ","solution":"sin²θ + cos²θ = 1, so the expression is 1 + tan²θ = sec²θ.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-108","module":"v2"},{"type":"mcq","q":"Solve sin 2θ = −sin θ for 0° ≤ θ ≤ 180°.","options":["{0°, 120°, 180°, 240°}","{0°, 60°, 120°, 180°, 240°, 300°}","{60°, 120°, 180°, 300°}","{120°, 150°, 180°, 240°}","None of the above"],"answer":"{0°, 120°, 180°, 240°}","solution":"sin θ(2cos θ + 1) = 0, giving θ = 0°, 180° (and 360°, the same direction as 0°) or cos θ = −1/2 → 120°, 240°.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-109","module":"v2"},{"type":"mcq","q":"Express cos(−305°) as a function of a positive acute angle.","options":["−cos 55°","cos 55°","−sin 55°","sin 55°","−tan 55°"],"answer":"cos 55°","solution":"cos(−305°) = cos 305° = cos(360° − 55°) = cos 55°.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-110","module":"v2"},{"type":"mcq","q":"If tan A = 2/3 and sin B = 5/√41, with A and B acute, find tan(A + B).","options":["4/√41","1/6","23/12","5/4","23/2","√2"],"answer":"23/2","solution":"tan B = 5/4; tan(A + B) = (2/3 + 5/4)/(1 − 10/12) = (23/12)/(2/12) = 23/2.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-111","module":"v2"},{"type":"mcq","q":"Eliminate θ from x = 1 + tan θ, y = cos θ.","options":["y²(x − 1)² + y² = 1","x² + y² = 25","xy = 1","y²(x + 1)² − y² = 1","x²y² = 1"],"answer":"y²(x − 1)² + y² = 1","solution":"tan θ = x − 1 and cos²θ = 1/(1 + tan²θ), so y²[1 + (x − 1)²] = 1.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-112","module":"v2"},{"type":"mcq","q":"Solve sin(θ/2) = 1/2 for 0° ≤ θ ≤ 360°.","options":["30°, 150°","60°, 300°","60°, 330°","30°, 240°","None of the above"],"answer":"60°, 300°","solution":"θ/2 = 30° or 150°, so θ = 60° or 300°.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-113","module":"v2"},{"type":"mcq","q":"If x = sin θ, simplify (1 − x²)/x.","options":["cos θ","tan θ","cos θ cot θ","sin θ cot θ","cos θ tan θ"],"answer":"cos θ cot θ","solution":"(1 − sin²θ)/sin θ = cos²θ/sin θ = cos θ·cot θ.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-114","module":"v2"},{"type":"mcq","q":"In which quadrant must A lie if both sin A and cos A are negative?","options":["first","second","third","fourth","none of these"],"answer":"third","solution":"Sine and cosine are both negative only in quadrant III.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-115","module":"v2"},{"type":"mcq","q":"In which quadrant must A lie if both tan A and cos A are negative?","options":["first","second","third","fourth","none of these"],"answer":"second","solution":"tan is negative in II and IV; cos is negative in II and III; their intersection is quadrant II.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Medium","id":"alg-v2-116","module":"v2"},{"type":"fill","q":"Use Cramer's rule to solve: 3x + 4y − 3z = 5, 3x − 2y + 4z = 7, 3x + 2y − z = 3. Report x, y, z.","answer":"x=-7/3, y=9, z=8","solution":"The coefficient determinant is 3[(-2)(-1) − 4·2] − 4[3(−1) − 4·3] + (−3)[3·2 − (−2)3] = 3(−6) − 4(−15) − 3(12) = 6. Replacing the x-column gives −14, so x = −14/6 = −7/3; the y- and z-determinants are 54 and 48, giving y = 9, z = 8. Check: 3(−7/3) + 36 − 24 = 5 ✓; −7 − 18 + 32 = 7 ✓; −7 + 18 − 8 = 3 ✓.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Devil Mode","id":"alg-v2-117","module":"v2"},{"type":"fill","q":"In a GP the sixth term is 8 times the third term and the sum of the seventh and eighth terms is 192. Find the common ratio and the first term.","answer":"r=2, a=1","solution":"ar⁵ = 8ar² → r³ = 8 → r = 2. Then ar⁶ + ar⁷ = a(64 + 128) = 192a = 192 → a = 1.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-118","module":"v2"},{"type":"fill","q":"For the GP in the previous question, find the sum of the 5th to 11th terms inclusive.","answer":"2032","solution":"With a = 1 and r = 2 the terms are u₅ = 16, 32, 64, 128, 256, 512, u₁₁ = 1024. Their sum = (2¹¹ − 2⁴)/(2 − 1) = 2048 − 16 = 2032, confirmed by direct addition.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Hard","id":"alg-v2-119","module":"v2"},{"type":"fill","q":"A drilling machine has six speeds from 50 rev/min to 750 rev/min forming a GP. List the speeds to the nearest whole number.","answer":"50, 86, 148, 254, 436, 750","solution":"a = 50 and ar⁵ = 750, so r = 15^(1/5) ≈ 1.71877. Multiplying successively gives ≈ 50, 85.94, 147.72, 253.86, 436.34, 750, which round to 50, 86, 148, 254, 436, 750.","source":"Algebra Pasco - Benjamin Abbam.pdf","difficulty":"Devil Mode","id":"alg-v2-120","module":"v2"},{"type":"mcq","q":"Find a common ratio for the GP n − 4, n + 2, 3n + 1, …","options":["−5/2","1/3","2/5","5/3","None of the other four options."],"answer":"None of the other four options.","solution":"(n + 2)² = (n − 4)(3n + 1) → 2n² − 15n − 8 = 0 → n = 8, giving terms 4, 10, 25 and ratio 5/2, which is not among A–D (option a is −5/2).","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-121","module":"v2"},{"type":"mcq","q":"A college office ordered 40 boxes of markers at GH¢24, 120 boxes of pens at GH¢20, 100 dusters at GH¢5 and 400 packs of A4 sheets at GH¢22. Using v·c, find the total cost.","options":["GH¢2,400","GH¢9,600","GH¢8,800","GH¢11,790","None of the other four options."],"answer":"None of the other four options.","solution":"40(24) + 120(20) + 100(5) + 400(22) = 960 + 2,400 + 500 + 8,800 = 12,660, which is not listed.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Medium","id":"alg-v2-122","module":"v2"},{"type":"mcq","q":"If the first three terms of (1 + αx)ⁿ in ascending powers of x are 1, 15x and 90x², find α and n.","options":["α = 3, n = 5","α = 3, n = 15","α = 5, n = 3","α = 15, n = 5","None of the other four options."],"answer":"α = 3, n = 5","solution":"nα = 15 and C(n, 2)α² = 90. Substituting α = 15/n gives 225(n − 1)/(2n) = 90 → n = 5, α = 3.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-123","module":"v2"},{"type":"mcq","q":"A trader repays GH¢3,250 by paying GH¢305 in the first month, decreasing the payment by GH¢15 each month. How long will it take to clear the loan?","options":["21.6 years","21½ months","1 year 8 months","20 years","None of the other four options."],"answer":"1 year 8 months","solution":"Sₙ = n/2[2(305) − (n − 1)15] = 3250 gives n = 20 months (10·325 = 3250), i.e. 1 year 8 months.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-124","module":"v2"},{"type":"mcq","q":"The sum of the first n terms of a series is Sₙ = 4 − (1/2)^(n−1). Find the least n such that Sₙ > 3.9999.","options":["8","11","10","15","None of the other four options."],"answer":"15","solution":"4 − 2^(−(n−1)) > 3.9999 requires 2^(n−1) > 10,000. Since 2¹³ = 8192 and 2¹⁴ = 16384, n − 1 ≥ 14, so n = 15.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-125","module":"v2"},{"type":"mcq","q":"Find the ratio of the term with x⁵ to the term with x³ in the expansion of (2x + 3)⁶.","options":["0.13x²","1.2x²","0.83x²","(15/2)x²","None of the other four options."],"answer":"0.13x²","solution":"Term in x⁵: C(6, 1)2⁵·3 = 576x⁵. Term in x³: C(6, 3)2³·3³ = 4320x³. Ratio = (576/4320)x² ≈ 0.133x².","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-126","module":"v2"},{"type":"mcq","q":"A line through A(1, 5) parallel to the x-axis meets 3y − 2x + 5 = 0 at B. Find AB.","options":["2 units","5 units","9 units","3 units","None of the other four options."],"answer":"9 units","solution":"The horizontal line is y = 5; substituting gives 15 − 2x + 5 = 0, so x = 10 and B = (10, 5). AB = 10 − 1 = 9.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-127","module":"v2"},{"type":"mcq","q":"A line through A(1, 5) parallel to the x-axis meets PQ: 3y − 2x + 5 = 0 at B. Find the sine of the angle between PQ and AB.","options":["2√13/13","3√13/8","8√13/3","13√13/2","None of the other four options."],"answer":"2√13/13","solution":"PQ has slope 2/3, so tan θ = 2/3 and sin θ = 2/√13 = 2√13/13.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-128","module":"v2"},{"type":"mcq","q":"Find the area of the triangle formed by 3y − 2x + 5 = 0 and the coordinate axes.","options":["5/3","25/6","25/6","25/12","None of the other four options."],"answer":"25/12","solution":"Intercepts: x = 5/2 when y = 0, y = −5/3 when x = 0. Area = ½·(5/2)(5/3) = 25/12.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-129","module":"v2"},{"type":"mcq","q":"How many even numbers greater than 2000 can be formed from the digits 1, 2, 4, 8, each used once?","options":["12","4!","6!","3!","None of the other four options."],"answer":"12","solution":"The thousands digit can be 2, 4 or 8 (3 ways); the units digit must be even (2 remaining choices); the middle digits can then be arranged in 2 ways: 3 × 2 × 2 = 12.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-130","module":"v2"},{"type":"mcq","q":"Simplify (n + 2)! + (n + 1)! + n! for n ∈ ℕ.","options":["n!(n + 2)²","n!(n + 2)","(n + 2)²","n!(n + 1)²","None of the other four options."],"answer":"n!(n + 2)²","solution":"Factor n!: n![(n + 2)(n + 1) + (n + 1) + 1] = n![n² + 4n + 4] = n!(n + 2)².","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-131","module":"v2"},{"type":"mcq","q":"How many arrangements of the letters of THIRTIETH are possible?","options":["15,102","15,012","15,210","15,120","None of the other four options."],"answer":"15,120","solution":"9 letters with T repeated 3 times, I twice and H twice: 9!/(3!·2!·2!) = 362,880/24 = 15,120.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-132","module":"v2"},{"type":"mcq","q":"Lines y = m₁x + c₁ and y = m₂x + c₂ intersect at right angles. Which condition holds?","options":["m₁m₂ > −1","m₁ = 1/m₂","m₁m₂ = 1","m₁ = m₂","None of the other four options."],"answer":"None of the other four options.","solution":"Perpendicular lines need m₁m₂ = −1, which is not listed; option b (m₁ = 1/m₂) gives product +1.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Medium","id":"alg-v2-133","module":"v2"},{"type":"mcq","q":"Find the circumcentre of triangle ABC with A(1, 6), B(−5, 2), C(3, 4).","options":["(4/5, −11/5)","(−4/5, −11/5)","(−4/5, 11/5)","(4/5, 11/5)","None of the other four options."],"answer":"(−4/5, 11/5)","solution":"Perpendicular bisector of AB: y = −1.5x + 1. Of BC: y = −4x − 1. Solving gives x = −4/5, y = 11/5.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Devil Mode","id":"alg-v2-134","module":"v2"},{"type":"mcq","q":"Solve 1 + 4 + 7 + 10 + … + x = 925.","options":["x = 25","x = 74","x = 37","x = 73","None of the other four options."],"answer":"x = 73","solution":"n(3n − 1)/2 = 925 → 3n² − n − 1850 = 0 → n = 25; last term = 1 + 24·3 = 73.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-135","module":"v2"},{"type":"mcq","q":"A patient receives 100 mg on day 1 and 20 mg more each day for 7 days. Find the total dosage.","options":["1,220 mg","840 mg","980 mg","1,260 mg","None of the other four options."],"answer":"None of the other four options.","solution":"S₇ = 7/2[2(100) + 6(20)] = 7/2 · 320 = 1,120 mg, which is not among A–D.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-136","module":"v2"},{"type":"mcq","q":"For A = ∅ ⊆ ℝ, which statements are NOT true? I. card(A) ≠ 0 II. card(P(A)) = 1 III. A is a singleton.","options":["II only","I and III only","I only","I, II and III","None of the other four options."],"answer":"I and III only","solution":"For the empty set card(A) = 0 (so I is false), card(P(A)) = 1 (II is true), and A is not a singleton (III is false).","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-137","module":"v2"},{"type":"mcq","q":"The first three terms of a GP are k − 3, 2k − 4, 4k − 3. Find k.","options":["5","6","7","8","None of the other four options."],"answer":"7","solution":"(2k − 4)² = (k − 3)(4k − 3) → 4k² − 16k + 16 = 4k² − 15k + 9 → k = 7.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-138","module":"v2"},{"type":"mcq","q":"Let S = {∅, {∅}}. Which statements about S are TRUE? I. ∅ ⊂ S II. {∅} ⊂ S III. {∅} ∈ S.","options":["I and III only","II and III only","I and II only","I, II and III","None of the other four options."],"answer":"I, II and III","solution":"∅ is a subset of every set; {∅} is one of the two elements of S and is a proper subset of S; and {∅} ∈ S by definition.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-139","module":"v2"},{"type":"mcq","q":"A rectangular screen has a 19 m diagonal and area 180 m². Find its dimensions to the nearest thousandth of a metre.","options":["12.925 by 13.925","12.9257 by 13.9257","12.926 by 13.926","12.93 by 13.93","None of the other four options."],"answer":"12.926 by 13.926","solution":"a² + b² = 361, ab = 180 → (a + b)² = 721 and a − b = 1, giving a = (√721 + 1)/2 ≈ 13.92572 and b ≈ 12.92572; rounded to the nearest thousandth: 13.926 by 12.926.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Devil Mode","id":"alg-v2-140","module":"v2"},{"type":"mcq","q":"Find the perpendicular distance from P(7, 5) to the line 3x + 4y − 16 = 0.","options":["−5","3","5","−3","None of the other four options."],"answer":"5","solution":"d = |3(7) + 4(5) − 16|/√(9 + 16) = 25/5 = 5.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-141","module":"v2"},{"type":"mcq","q":"Find the points of intersection of 4y = x² and y = x.","options":["(0, 0) and (4, 0)","(4, 4) and (4, 0)","(0, 4) and (0, 0)","(0, 4) and (4, 0)","None of the other four options."],"answer":"None of the other four options.","solution":"x² = 4x → x = 0 or 4, giving (0, 0) and (4, 4); that pair is not listed.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Medium","id":"alg-v2-142","module":"v2"},{"type":"mcq","q":"The line x − y − 6 = 0 cuts y² = 8x at P and Q. Find |PQ|.","options":["2√6","4√2","16√2","16","None of the other four options."],"answer":"16√2","solution":"Substituting y = x − 6: x² − 20x + 36 = 0 → x = 18 or 2, giving (18, 12) and (2, −4). Distance = √(16² + 16²) = 16√2.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Devil Mode","id":"alg-v2-143","module":"v2"},{"type":"mcq","q":"A point P has x-coordinate α and lies on y − 3x + 7 = 0; Q = (4, 1). Find |PQ|.","options":["√(10α² − 56α + 80)","√(10α² − 65α + 80)","√(10α² − 55α² + 80)","√(10α² + 56α² − 80)","None of the other four options."],"answer":"√(10α² − 56α + 80)","solution":"P = (α, 3α − 7); |PQ|² = (α − 4)² + (3α − 8)² = 10α² − 56α + 80.","source":"mid sem algebra.pdf (2026 Moodle exam)","difficulty":"Hard","id":"alg-v2-144","module":"v2"},{"id":"alg-v3-001","module":"v3","type":"mcq","q":"Consider the notation sum from m=0 to 4 a_m. According to the definition of sigma notation provided in the lecture, what are the indices of the first and last terms in the expansion?","options":["First index is 1, last index is 4","First index is 0, last index is 4","First index is 0, last index is 5","First index is a_0, last index is a_4"],"answer":"First index is 0, last index is 4","solution":"The sigma notation Σ_m=0^4 a_m expands as a_0 + a_1 + a_2 + a_3 + a_4. According to the definition, the first term corresponds to the lower index m=0 and the last term to the upper index m=4. Thus the first index is 0 and the last index is 4. Option B is correct.","source":"MATH 157 lecture slides (Kwame Piesie) — Sigma Notation","difficulty":"Medium"},{"id":"alg-v3-002","module":"v3","type":"mcq","q":"If the sum of the even integers from 2 to 2n is represented by the sigma notation sum from k=1 to n 2k, what is the value of the summand when k=5?","options":["10","5","2n","2"],"answer":"10","solution":"Target: Find summand at k=5 in σ_k=1^n 2k. Given: sum of even integers 2 to 2n. Mapping: sigma term is 2k. Method: evaluate 2k at k=5. Solution: 2(5)=10. Verification: first four terms are 2,4,6,8; k=5 gives 10, consistent with even sequence. Answer is 10 (option A).","source":"MATH 157 lecture slides (Kwame Piesie) — Sigma Notation","difficulty":"Medium"},{"id":"alg-v3-003","module":"v3","type":"mcq","q":"Using the rules of summation, express ( sum from k=1 to nk) in closed form.","options":["(n(n+1))/(2)","((n-1)n)/(2)","(n(n-1))/(2)","(n(n+2))/(2)"],"answer":"(n(n+1))/(2)","solution":"Target: Closed form for Σk=1 to n k. Given: k is positive integer, n is upper limit. Method: Use Gauss pairing or induction. Derivation: Pair terms: (1+n) + (2+(n-1)) + ... gives n/2 pairs each summing to (n+1), yielding n(n+1)/2. Verify: For n=3, sum=1+2+3=6; formula gives 3·4/2=6. For n=4, sum=10; formula gives 4·5/2=10. Matches option A: n(n+1)/2. Option B gives (n-1)n/2 → for n=3: 2·3/2=3≠6. O","source":"MATH 157 lecture slides (Kwame Piesie) — Summation Rules","difficulty":"Medium"},{"id":"alg-v3-004","module":"v3","type":"mcq","q":"Compute ( sum from k=1 to n(3k+4)) using the linearity of summation.","options":["(3n(n+1))/(2)+4n","(3n(n-1))/(2)+4n","(3n(n+1))/(2)+4","(3n(n-1))/(2)+4"],"answer":"(3n(n+1))/(2)+4n","solution":"Sum = 3∑_k=1^n k + 4∑_k=1^n 1 = 3·n(n+1)/2 + 4n. Check n=1: LHS=3·1+4=7, RHS=3·1·2/2+4=3+4=7, confirming the formula.","source":"MATH 157 lecture slides (Kwame Piesie) — Summation Rules","difficulty":"Medium"},{"id":"alg-v3-005","module":"v3","type":"mcq","q":"If (S=sum from k=1 to n(k+5)+sum_k=1^n(k+7)), which expression equals (S) in terms of (n)?","options":["n^2+13n","n^2+12n","n^2+14n","n^2+11n"],"answer":"n^2+13n","solution":"S = sum from k=1 to n(k+5) + sum from k=1 to n(k+7) = sum from k=1 to n(2k+12). Split into sums: 2sum from k=1 to nk + sum from k=1 to n12. Use sum from k=1 to nk = (n(n+1))/(2) and sum from k=1 to n1 = n. Thus, S = 2((n(n+1))/(2)) + 12n = n(n+1) + 12n = n^2 + n + 12n = n^2 + 13n. Verification for n=1: S = (1+5) + (1+7) = 6+8=14. Option A: 1^2+13(1)=14. Match.","source":"MATH 157 lecture slides (Kwame Piesie) — Summation Rules","difficulty":"Hard"},{"id":"alg-v3-006","module":"v3","type":"mcq","q":"Given the baby weights (x_1=3.2, x_2=3.7, x_3=1.4, x_4=2.8, x_5=3.3), what is their average weight?","options":["2.88 kg","3.44 kg","2.98 kg","3.02 kg"],"answer":"3.02 kg","solution":"Sum = 3.2 + 3.7 + 1.4 + 2.8 + 3.3 = 14.4 kg. N = 5. Average = 14.4 / 5 = 2.88 kg. Verification: 2.88 * 5 = 13.2 + 1.2 = 14.4. Matches option A (Index 0? No, Option A is index 0. Let's re-read options. A: 2.88, B: 3.44, C: 2.98, D: 3.02. Correct option is A. Index for A is 0.)","source":"MATH 157 lecture slides (Kwame Piesie) — Summation","difficulty":"Medium"},{"id":"alg-v3-007","module":"v3","type":"mcq","q":"If we change the summation index from (k) to (j) in (sum from k=1 to n(2k+1)), which statement remains true?","options":["The number of terms changes.","The value of each individual term changes.","The value of the entire sum changes.","Both the number of terms and the sum stay the same."],"answer":"Both the number of terms and the sum stay the same.","solution":"Let S = sum from k=1 to n (2k+1). Changing the index variable to j yields S' = sum from j=1 to n (2j+1). The dummy index k is bound within the summation and does not affect the range of values or the count of terms. The lower limit is 1 and the upper limit is n, so the number of terms is always n - 1 + 1 = n. The values generated by the sequence are 3, 5, ..., 2n+1 in both cases. Therefo","source":"MATH 157 lecture slides (Kwame Piesie) — Index of Summation","difficulty":"Hard"},{"id":"alg-v3-008","module":"v3","type":"mcq","q":"What is the value of (sum from k=1 to 5(k^2+k))?","options":["70","75","80","85"],"answer":"70","solution":"Term by term: k² + k = 2, 6, 12, 20, 30 for k = 1…5. Their sum is 70. Equivalently Σk² = 55 and Σk = 15, so 55 + 15 = 70.","source":"MATH 157 lecture slides (Kwame Piesie) — Summation","difficulty":"Hard"},{"id":"alg-v3-009","module":"v3","type":"mcq","q":"In the notation sum from k=1 to n x_k, if the number of terms being summed is fixed at 5 (as in the baby weight example), how is the summand defined?","options":["It is the variable n","It is the term x_k","It is the sum x_1 + ... + x_5","It is the index k"],"answer":"It is the term x_k","solution":"The summand in sigma notation sum from k=1 to n x_k is the expression being summed, which is x_k. Fixing the number of terms at 5 only sets n=5; it does not change the definition of the summand. Option A is the upper limit (or number of terms), Option C is the sum itself, Option D is the index of summation. Thus the correct answer is B.","source":"MATH 157 lecture slides (Kwame Piesie) — Sigma Notation","difficulty":"Medium"},{"id":"alg-v3-010","module":"v3","type":"mcq","q":"The slide states that irrational numbers (I) include square roots of non-perfect squares, such as sqrt(2), sqrt(3), and sqrt(5). Consider the set of numbers S = . How many elements in S belong strictly to the set of irrational numbers I?","options":["1","2","3","4"],"answer":"2","soluti
