   return voices.length?voices[0]:null;
 }

 var queue=[], speaking=false;
 function next(){
   if(isMuted() || !queue.length){ speaking=false; return; }
   var text=queue.shift(); speaking=true;
   try{
     var u=new SpeechSynthesisUtterance(text);
     var v=pickVoice(); if(v) u.voice=v;
     u.rate=0.96; u.pitch=1; u.volume=1;
     u.onend=u.onerror=function(){ speaking=false; if(queue.length) next(); };

   }catch(e){ speaking=false; }
 }

   var text = (maybeText!==undefined)? maybeText : roleOrText;

   if(!text) return Promise.resolve(false);

   var arr=(lines!==undefined?lines:roleOrLines).slice();

  }
  function end() {
    try { localStorage.setItem("cdcoach:" + (key || "x"), "1"); } catch (e) {}
    hole.style.display = "none"; card.style.display = "none"; try { window.CDCoachActive = false; } catch (e) {}
    var f = onEnd; onEnd = null; if (f) f();
  }
  card.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    if (b.id === "cdNext") { i++; if (i >= steps.length) end(); else draw(); }
    else if (b.id === "cdPrev") { if (i > 0) { i--; draw(); } }
    else if (b.id === "cdSkip") { end(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && card.style.display === "block") end();
  });
  addEventListener("resize", function () { if (card.style.display === "block") draw(); });
  addEventListener("scroll", function () { if (card.style.display === "block") draw(); }, true);
  window.CDCoach = {
    start: function (k, def, cb) { key = k; steps = def.steps; i = 0; onEnd = cb || null; try { window.CDCoachActive = true; } catch (e) {} draw(); },
    maybe: function (k, def, cb) {
      var seen = null; try { seen = localStorage.getItem("cdcoach:" + k); } catch (e) {}
      if (!seen) this.start(k, def, cb);
    },
    stop: end
  };
})();
