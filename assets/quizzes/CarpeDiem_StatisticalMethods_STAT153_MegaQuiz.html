<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Carpe Diem Statistics - STAT 153 — The Carpe Diem</title>
<style>
:root{
  --navy:#0b1b33; --navy2:#12294a; --gold:#f5b301;
  --red:#b3261e; --red2:#8e1b16; --card:#dceaf0; --card2:#e8f1f5;
  --ink:#1c2733; --muted:#5d6b7a; --line:#c8d4de;
  --green:#2e7d32; --good:#e6f4ea; --bad:#fdecea;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f3f5f7;color:var(--ink);font-family:Arial,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer}

/* top bar */
.cdbar{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold)}
.cdmark{width:30px;height:30px;border:2px solid var(--gold);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:bold;font-size:12px;letter-spacing:.5px;flex:none}
.cdbar .brand{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:bold}
.cdbar .crumb{font-size:12px;color:#c8d6e5;margin-left:auto;text-align:right}

/* moodle quiz header */
.quizhead{background:#fff;border-bottom:1px solid var(--line);padding:18px 22px}
.quizhead .path{font-size:11px;color:var(--muted);letter-spacing:.4px}
.quizhead h1{font-size:24px;font-weight:600;margin:4px 0 2px;color:var(--navy)}
.quizhead .sub{font-size:12px;color:var(--muted)}

/* timer banner */
.timerbar{background:linear-gradient(90deg,var(--red2),var(--red));color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:center;position:relative;font-weight:bold;letter-spacing:.5px}
.timerbar .tt{font-size:20px}
.timerbar .td{font-size:20px;font-variant-numeric:tabular-nums;margin-left:12px}
.timerbar.warn{background:linear-gradient(90deg,#a35b00,#d97706)}
.timerbar.danger{background:linear-gradient(90deg,#7f1d1d,#b3261e)}
.timerbar .hide{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);border:0;color:#fff;padding:6px 12px;border-radius:4px;font-size:12px}

.wrap{max-width:860px;margin:0 auto;padding:24px 18px 120px}
.card{background:var(--card);border:1px solid #c2d3de;border-radius:12px;padding:26px;margin-bottom:18px;box-shadow:0 1px 2px rgba(11,27,51,.05)}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}
.qnum{font-size:13px;font-weight:bold;color:var(--navy)}
.qtag{font-size:11px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--muted);white-space:nowrap}
.qtext{font-size:17px;line-height:1.65;margin-bottom:18px;white-space:pre-wrap}
.qtext b{color:var(--navy)}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;width:100%;font-size:15px;color:var(--ink);transition:.15s}
.opt:hover{border-color:var(--gold)}
.opt.sel{border:2px solid var(--gold);background:#fff9e6}
.opt .key{width:22px;height:22px;border-radius:50%;border:1px solid #9aa9b8;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.opt.sel .key{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:bold}

.fillrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fillrow label{font-weight:bold;color:var(--navy)}
.fillrow input{background:#fff;border:1px solid #9aa9b8;border-radius:8px;padding:11px 14px;font-size:16px;width:240px;outline:none}
.fillrow input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,179,1,.2)}
.fillrow .hint{font-size:12px;color:var(--muted)}

.navrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.btn{border:0;border-radius:6px;padding:12px 24px;font-size:14px;font-weight:bold}
.btn.prev{background:#e4e9ee;color:var(--navy)}
.btn.next{background:var(--green);color:#fff}
.btn.finish{background:var(--navy);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.qgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.qgrid button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:4px;color:var(--muted);font-size:12px}
.qgrid button.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.qgrid button.cur{outline:2px solid var(--gold)}

/* start screen */
.start{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:18px}
.start h2{color:var(--navy);margin-bottom:6px}
.start p{color:var(--muted);margin-bottom:18px}
.mods{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.modbtn{border:1px solid var(--line);background:#f8fafb;border-radius:8px;padding:12px 16px;text-align:left;min-width:150px}
.modbtn.sel{border:2px solid var(--gold);background:#fff9e6}
.modbtn b{display:block;color:var(--navy);font-size:14px}
.modbtn span{font-size:12px;color:var(--muted)}
.bigbtn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:14px 30px;font-size:15px;font-weight:bold}

/* results */
.res{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:18px}
.score{font-size:52px;font-weight:bold;color:var(--navy);line-height:1}
.rstat{display:flex;gap:28px;margin:16px 0;flex-wrap:wrap}
.rstat div{font-size:13px;color:var(--muted)}
.rstat b{display:block;font-size:22px;color:var(--navy)}
.item{border:1px solid var(--line);border-left:4px solid var(--good);border-radius:8px;padding:16px;margin-bottom:12px;background:#fafcfb}
.item.wrong{border-left-color:#c62828;background:#fffafa}
.item .qq{font-weight:bold;margin-bottom:8px}
.item .aa{font-size:13px;margin:3px 0}
.item .ok{color:var(--green)}
.item .no{color:#c62828}
.sol{font-size:13px;background:#f1f5f9;border-radius:6px;padding:10px 12px;margin-top:8px;color:#37474f;white-space:pre-wrap}

@media(max-width:600px){
  .cdbar .crumb{display:none}
  .quizhead h1{font-size:20px}
  .timerbar .tt,.timerbar .td{font-size:16px}
  .card{padding:18px}
  .qtext{font-size:15px}
  .fillrow input{width:100%}
}
</style>
</head>
<body>

<div class="cdbar">
  <div class="cdmark">CD</div>
  <div class="brand">The Carpe Diem</div>
  <div class="crumb">THE CARPE DIEM / STAT 153 / STATISTICAL METHODS</div>
</div>

<div class="quizhead">
  <div class="path">THE CARPE DIEM / STAT 153 / FIRST SEMESTER 2026 / Quiz</div>

</div>

<div class="timerbar" id="timerbar">
  <span class="tt">Time left</span><span class="td" id="td">2:00:00</span>
  <button class="hide" id="hideBtn" onclick="toggleTimer()">Hide</button>
</div>

<div class="wrap" id="wrap">
  <div class="start" id="start">
    <h2>Choose your set</h2>
    <p>Pick a version, then start the timer. Answers save as you go.</p>
    <div class="mods" id="mods"></div>
    <button class="bigbtn" id="startBtn" onclick="begin()">Start attempt</button>
  </div>
  <div id="exam" style="display:none"></div>
  <div id="results" style="display:none"></div>
</div>

<script>
const BANK = {"config":{"title":"The Carpe Diem Statistics - STAT 153","course":"STAT 153","guide":"KNUST Medical Laboratory Science"},"modules":[{"id":"v1","name":"Version 1 - Bayes & Conditional Probability","desc":"Conditional probability, Bayes' theorem, screening tests, likelihood ratios, independence and sequential updating.","count":64,"source":"KNUST STAT 153 exam; GLI STAT 153 quizzes + answer key; thatboy ACING STATS"},{"id":"v2","name":"Version 2 - Discrete Random Variables","desc":"PMFs, expectation, variance, binomial, Poisson, geometric and discrete uniform distributions.","count":20,"source":"KNUST STAT 153 exam; GLI quizzes; Moodle quiz screenshots; past exams"},{"id":"v3","name":"Version 3 - Continuous Random Variables","desc":"PDFs, CDFs, expectation, variance, uniform, exponential and percentile problems.","count":20,"source":"KNUST STAT 153 exam; GLI quizzes; Moodle screenshots; past exams"},{"id":"v4","name":"Version 4 - Normal Distribution","desc":"Standard normal, z-scores, probabilities, inverse-normal and properties of the normal curve.","count":25,"source":"KNUST STAT 153 exam; geo-ma basic statistics self test; lecture slides"},{"id":"v5","name":"Version 5 - Introductory & Descriptive Statistics","desc":"Measurement scales, variables, sampling, central tendency, dispersion, quartiles, frequency tables and chart types.","count":164,"source":"KNUST STAT 153 exam; geo-ma self test; WA Moodle screenshots; Statistical Methods slides"},{"id":"v6","name":"Version 6 - Moodle Quiz Screenshots","desc":"Questions transcribed from live KNUST Moodle quiz screenshots (Nov 2026) including feedback and marked correct answers.","count":79,"source":"WhatsApp Image 2026-11-23 / 2026-11-26 screenshots; Coded Stats midsem; Benjamin Abbam trial"},{"id":"v7","name":"Version 7 - Midsem & Past Exam Papers","desc":"Questions from PASCO exam papers, Ebensenu midsem papers and worked solutions.","count":55,"source":"stats..pasco_.pdf; ebensenu statistics-midsem PDFs and solution PDF"},{"id":"v8","name":"Version 8 - Advanced Probability (ACING STATS)","desc":"Advanced Bayesian problems including multi-layer, recursive, network and boss-level questions.","count":100,"source":"thatboy ACING STATS - 50 Comprehensive Bayesian & Probability Questions"},{"id":"v9","name":"Version 9 - Lecture Slides (Owiredu)","desc":"Questions built directly from the STAT 153 lecture slides by E. O. Owiredu","count":108,"source":"Statistical Methods lecture slides (Owiredu, KNUST)"}],"questions":[{"id":"sta-v1-001","module":"v1","type":"fill","q":"A new rapid test for malaria has sensitivity 0.93 and specificity 0.87. In a community where malaria prevalence is 0.12, a patient tests positive. Calculate the positive predictive value (PPV) to 4 decimal places.","answer":"0.4938","solution":"PPV = (0.93x0.12)/[(0.93x0.12)+(0.13x0.88)] = 0.1116/0.2260 = 0.4938.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v1-002","module":"v1","type":"fill","q":"A laboratory test for HIV has sensitivity 0.97 and specificity 0.995. In a population with HIV prevalence 0.004, compute the negative predictive value (NPV) to 4 decimal places.","answer":"0.9999","solution":"NPV = (0.995x0.996)/[(0.03x0.004)+(0.995x0.996)] = 0.991020/0.991140 = 0.9999.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v1-003","module":"v1","type":"fill","q":"Three machines A, B, C produce 40%, 35%, and 25% of a factory's output respectively. Defect rates are A=3%, B=5%, C=4%. A randomly chosen item is found defective. What is the probability it came from machine B? Give answer to 4 decimal places.","answer":"0.4430","solution":"P(def)=0.4(0.03)+0.35(0.05)+0.25(0.04)=0.0395; P(B|def)=0.0175/0.0395=0.4430.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v1-004","module":"v1","type":"fill","q":"A genetic disease has autosomal recessive inheritance. Both parents are carriers (Aa x Aa). If a child is born unaffected, what is the probability the child is a carrier (Aa)? Express as a decimal to 4 decimal places.","answer":"0.6667","solution":"Aa x Aa gives AA=1/4, Aa=1/2, aa=1/4. P(unaffected)=3/4, so P(Aa|unaffected)=(1/2)/(3/4)=2/3=0.6667.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v1-005","module":"v1","type":"fill","q":"A disease screening programme tests patients using two independent tests T1 and T2. P(T1 positive|Disease)=0.85, P(T2 positive|Disease)=0.78. Given disease is present, find the probability both tests are positive. Give answer to 4 decimal places.","answer":"0.6630","solution":"Conditional independence: 0.85x0.78=0.6630.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v1-006","module":"v1","type":"fill","q":"In a hospital, 60% of emergency patients have condition X. Of those with X, 70% show symptom S. Of those without X, 20% show symptom S. A patient shows symptom S. What is the probability the patient has condition X? Give to 4 d.p.","answer":"0.8400","solution":"P(S)=0.7(0.6)+0.2(0.4)=0.50; P(X|S)=0.42/0.50=0.8400.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v1-007","module":"v1","type":"fill","q":"A blood culture has sensitivity 0.82 and specificity 0.91. Prevalence of bacteraemia is 0.18. A patient tests negative. Find P(no disease | negative test) to 4 d.p.","answer":"0.9584","solution":"P(no D and -)=0.82x0.91=0.7462; P(D and -)=0.18x0.18=0.0324; NPV=0.7462/0.7786=0.9584.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v1-008","module":"v1","type":"fill","q":"Urn A contains 3 red and 7 blue balls; Urn B contains 6 red and 4 blue balls. A fair coin is tossed: heads -> draw from A, tails -> draw from B. A red ball is drawn. What is the probability it came from Urn B? Give to 4 d.p.","answer":"0.6667","solution":"P(R)=0.5(0.3)+0.5(0.6)=0.45; P(B|R)=0.30/0.45=0.6667.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v1-009","module":"v1","type":"fill","q":"A drug test has false positive rate 0.08 and false negative rate 0.05. In a population where 15% of people use the drug, an athlete tests positive. Compute the probability the athlete is actually a drug user to 4 d.p.","answer":"0.6770","solution":"P(+)=0.95(0.15)+0.08(0.85)=0.2105; P(D|+)=0.1425/0.2105=0.6770.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v1-010","module":"v1","type":"fill","q":"Events A and B are such that P(A)=0.45, P(B)=0.30, and P(A union B)=0.615. Determine P(A|B) to 4 d.p.","answer":"0.4500","solution":"P(A and B)=0.45+0.30-0.615=0.135; P(A|B)=0.135/0.30=0.4500.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v1-011","module":"v1","type":"fill","q":"In a clinical trial, 55% of patients receive drug D. Among those who receive D, 72% show improvement. Among those who do not receive D, 38% show improvement. Given that a patient improved, find the probability they received drug D to 4 d.p.","answer":"0.6984","solution":"P(I)=0.72(0.55)+0.38(0.45)=0.567; P(D|I)=0.396/0.567=0.6984.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v1-012","module":"v1","type":"fill","q":"A diagnostic test is applied to a sample of 500 patients. Results: 80 true positives, 20 false negatives, 30 false positives, 370 true negatives. Calculate the likelihood ratio for a positive test (LR+) to 4 d.p.","answer":"10.6667","solution":"Sensitivity=80/100=0.80; false-positive rate=30/400=0.075; LR+=0.80/0.075=10.6667.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v1-013","module":"v1","type":"fill","q":"P(A)=0.5, P(B|A)=0.4, P(B|A')=0.25. Find P(A|B) to 4 d.p.","answer":"0.6154","solution":"P(B)=0.4(0.5)+0.25(0.5)=0.325; P(A|B)=0.20/0.325=0.6154.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v1-014","module":"v1","type":"fill","q":"A patient's cholesterol is tested on two independent days. On any given day, P(high reading)=0.35. What is the probability of obtaining at least one high reading over the two days? Give to 4 d.p.","answer":"0.5775","solution":"1-P(none)=1-(0.65)^2=0.5775.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v1-015","module":"v1","type":"fill","q":"In a population, 8% have diabetes. A screening tool correctly identifies 90% of diabetics and misclassifies 12% of non-diabetics as positive. Given a positive result, compute the probability the person has diabetes to 4 d.p.","answer":"0.3947","solution":"P(+)=0.90(0.08)+0.12(0.92)=0.1824; PPV=0.072/0.1824=0.3947.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v1-016","module":"v1","type":"fill","q":"A certain inherited blood disorder has prevalence 0.02. A DNA test has sensitivity 0.98 and specificity 0.97. An individual tests positive twice independently. What is the probability they truly have the disorder after two positive results? Give to 4 d.p.","answer":"0.9561","solution":"After first + posterior=0.4000; using it as new prior: 0.98(0.40)/[0.98(0.40)+0.03(0.60)]=0.9561.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v1-017","module":"v1","type":"fill","q":"Three labs independently analyse a sample. P(correct result) for labs L1, L2, L3 are 0.92, 0.88, 0.95 respectively. If all three agree on a positive result, find P(true positive) assuming independence and that P(disease)=0.10. Compute P(all 3 positive|disease) x P(disease) / P(all 3 positive) to 4 d.p.","answer":"0.9944","solution":"P(+++|D)=0.92x0.88x0.95=0.7685; P(+++|no D)=0.08x0.12x0.05=0.00048; posterior=0.9944.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v1-018","module":"v1","type":"fill","q":"Events A and B are independent. P(A)=0.6, P(B)=0.4. Find P(A' intersection B') to 4 d.p.","answer":"0.2400","solution":"P(A')=0.4, P(B')=0.6; independence gives 0.4x0.6=0.2400.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v1-019","module":"v1","type":"fill","q":"In a hospital, 65% of patients admitted to ICU have infection I. Of infected ICU patients, 80% have fever. Of non-infected ICU patients, 30% have fever. Given a patient has fever, find P(infected) to 4 d.p.","answer":"0.8320","solution":"P(F)=0.80(0.65)+0.30(0.35)=0.625; P(I|F)=0.52/0.625=0.8320.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v1-020","module":"v1","type":"fill","q":"A student takes two independent multiple choice tests. P(pass test 1)=0.70, P(pass test 2)=0.65. Find the probability of passing exactly one test, to 4 d.p.","answer":"0.4400","solution":"0.70(0.35)+0.30(0.65)=0.245+0.195=0.4400.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v1-021","module":"v1","type":"fill","q":"In a laboratory, 30% of specimens sent for culture are from patients on antibiotics. Cultures from antibiotic patients yield a positive result 25% of the time; cultures from non-antibiotic patients yield positive 60% of the time. A positive culture is obtained. Find P(patient was on antibiotics) to 4 d.p.","answer":"0.1515","solution":"P(+)=0.25(0.30)+0.60(0.70)=0.495; P(A|+)=0.075/0.495=0.1515.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v1-022","module":"v1","type":"fill","q":"P(B|A)=0.55, P(A)=0.4, P(B)=0.35. Find P(A|B) to 4 d.p.","answer":"0.6286","solution":"P(A and B)=0.55x0.40=0.22; P(A|B)=0.22/0.35=0.6286.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v1-023","module":"v1","type":"fill","q":"A box contains 5 red, 3 blue, and 2 green balls. Two balls are drawn without replacement. Find the probability the second ball is red given the first was blue, to 4 d.p.","answer":"0.5556","solution":"After a blue is drawn, 9 balls remain of which 5 are red: 5/9=0.5556.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v1-024","module":"v1","type":"fill","q":"A test for condition C has sensitivity 0.88 and specificity 0.93. Prevalence is 0.07. In a clinic of 1000 patients, how many of those testing positive are truly positive? Give P(C|+) to 4 d.p.","answer":"0.4862","solution":"P(+)=0.88(0.07)+0.07(0.93)=0.1267; P(C|+)=0.0616/0.1267=0.4862.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v1-025","module":"v1","type":"fill","q":"Two events A and B satisfy P(A)=0.55, P(B)=0.40, P(A|B)=0.50. Determine P(A intersection B) to 4 d.p. and state whether they are independent.","answer":"0.2000","solution":"P(A and B)=0.50x0.40=0.2000; P(A)P(B)=0.22, so NOT independent.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v2-001","module":"v2","type":"fill","q":"A discrete random variable X has the following distribution: P(X=1)=0.15, P(X=2)=0.30, P(X=3)=k, P(X=4)=0.25, P(X=5)=0.10. Find k, then compute E(X) to 4 d.p.","answer":"2.8500","solution":"k=1-0.15-0.30-0.25-0.10=0.20; E(X)=0.15+0.60+0.60+1.00+0.50=2.8500.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v2-002","module":"v2","type":"fill","q":"X is a discrete RV with PMF P(X=x)=(3-|x-2|)/k for x=0,1,2,3,4 and 0 otherwise. Find k, then compute Var(X) to 4 d.p.","answer":"1.3333","solution":"Weights (3,2,1,2,1)/k sum to 9/k so k=9; E(X)=18/9=2, E(X^2)=48/9; Var=1.3333.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v2-003","module":"v2","type":"fill","q":"In a game, a player rolls a fair six-sided die. They win GHS (2X-3) where X is the outcome. Find E[2X-3] to 4 d.p.","answer":"4.0000","solution":"E(X)=3.5 for a fair die, so E(2X-3)=7-3=4.0000.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v2-004","module":"v2","type":"fill","q":"A random variable X follows a Binomial distribution with n=12 and p=0.35. Find P(X=4) to 4 d.p.","answer":"0.2367","solution":"C(12,4)(0.35)^4(0.65)^8=0.2367.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v2-005","module":"v2","type":"fill","q":"X ~ Binomial(n=10, p=0.4). Compute Var(X) to 4 d.p.","answer":"2.4000","solution":"np(1-p)=10x0.4x0.6=2.4000.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v2-006","module":"v2","type":"fill","q":"X ~ Poisson(lambda=3.2). Find P(X>=2) to 4 d.p.","answer":"0.8288","solution":"1-P(0)-P(1)=1-e^-3.2-3.2e^-3.2=0.8288.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v2-007","module":"v2","type":"fill","q":"X has PMF P(X=x)=c*x^2 for x=1,2,3. Find the value of c to 4 d.p.","answer":"0.0714","solution":"c(1+4+9)=1, so c=1/14=0.0714.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v2-008","module":"v2","type":"fill","q":"A fair coin is tossed 8 times. Find the probability of obtaining more than 5 heads, to 4 d.p.","answer":"0.1445","solution":"P(6)+P(7)+P(8)=(28+8+1)/256=0.1445.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v2-009","module":"v2","type":"fill","q":"X has PMF P(X=x)=k*(0.6)^x for x=0,1,2,3,... Find k to 4 d.p.","answer":"0.4000","solution":"Sum of geometric series = k/(1-0.6)=1, so k=0.4000.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v2-010","module":"v2","type":"fill","q":"X ~ Binomial(15, 0.3). Compute Var(X) to 4 d.p.","answer":"3.1500","solution":"np(1-p)=15x0.3x0.7=3.1500.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v2-011","module":"v2","type":"fill","q":"A discrete RV X takes values -2, 0, 1, 3 with probabilities 0.2, 0.3, 0.3, 0.2. Find E(X^2) to 4 d.p.","answer":"2.9000","solution":"4(0.2)+0(0.3)+1(0.3)+9(0.2)=2.9000.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v2-012","module":"v2","type":"fill","q":"X ~ Poisson(lambda=2.5). Find P(X=3) to 4 d.p.","answer":"0.2138","solution":"e^-2.5 x 2.5^3/3! = 0.2138.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v2-013","module":"v2","type":"fill","q":"The number of accidents per week at a factory follows a Poisson distribution with mean 1.8. Find the probability of exactly 2 accidents in a given week to 4 d.p.","answer":"0.2678","solution":"e^-1.8 x 1.8^2/2! = 0.2678.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v2-014","module":"v2","type":"fill","q":"A game costs GHS 3 to play. A die is rolled: 6 -> win GHS 10; 4 or 5 -> win GHS 4; 1, 2 or 3 -> win nothing. Compute the expected net gain to 4 d.p.","answer":"0.0000","solution":"Expected winnings=(10+8+0)/6=3.00; net=3.00-3.00=0.0000.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v2-015","module":"v2","type":"fill","q":"X ~ Binomial(20, 0.25). Compute P(X<=1) to 4 d.p.","answer":"0.0243","solution":"0.75^20+20(0.25)(0.75)^19=0.0243.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v2-016","module":"v2","type":"fill","q":"X has PMF P(X=x)=(x+1)/k for x=0,1,2,3. Find k, then compute E(X) to 4 d.p.","answer":"2.0000","solution":"Sum=10/k so k=10; E(X)=(0+2+6+12)/10=2.0000.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v2-017","module":"v2","type":"fill","q":"X ~ Geometric distribution with p=0.3 (probability of success on each trial). Find P(X=5) to 4 d.p.","answer":"0.0720","solution":"(0.7)^4(0.3)=0.0720.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v2-018","module":"v2","type":"fill","q":"X has PMF P(X=x)=k/x! for x=0,1,2,3,4. Find k to 4 d.p.","answer":"0.3692","solution":"Sum 1/x! for x=0..4 = 2.7083; k=1/2.7083=0.3691.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v2-019","module":"v2","type":"fill","q":"X is the outcome of rolling a biased die where P(X=x)=x/21 for x=1,2,3,4,5,6. Compute Var(X) to 4 d.p.","answer":"2.2222","solution":"E(X)=91/21=4.3333, E(X^2)=441/21=21; Var=21-18.7778=2.2222.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v2-020","module":"v2","type":"fill","q":"X ~ Binomial(n=8, p=0.6). Find P(4<=X<=6) to 4 d.p.","answer":"0.7200","solution":"P(4)+P(5)+P(6)=0.2322+0.2787+0.2090=0.7200.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v3-001","module":"v3","type":"fill","q":"A continuous RV X has PDF f(x)=k*x*(1-x) for 0<x<1. Find k to 4 d.p.","answer":"6.0000","solution":"Integral k(x-x^2)=k/6=1, so k=6.0000.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v3-002","module":"v3","type":"fill","q":"X has PDF f(x)=3x^2 for 0<x<1. Find E(X) to 4 d.p.","answer":"0.7500","solution":"3 integral x^3 = 3/4=0.7500.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v3-003","module":"v3","type":"fill","q":"X has PDF f(x)=2x for 0<x<1. Find Var(X) to 4 d.p.","answer":"0.0556","solution":"E(X)=2/3, E(X^2)=1/2; Var=0.0556.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v3-004","module":"v3","type":"fill","q":"X has PDF f(x)=c(4-x^2) for -1<x<1. Find c to 4 d.p.","answer":"0.1364","solution":"Integral c(4-x^2) from -1 to 1 = c(22/3)=1, so c=3/22=0.1364.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v3-005","module":"v3","type":"fill","q":"X ~ Uniform(a=2, b=8). Find P(3<X<6) to 4 d.p.","answer":"0.5000","solution":"(6-3)/(8-2)=0.5000.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v3-006","module":"v3","type":"fill","q":"X has PDF f(x)=k*exp(-3x) for x>0. Find k, then compute P(X>0.5) to 4 d.p.","answer":"0.2231","solution":"k=3; P(X>0.5)=e^-1.5=0.2231.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v3-007","module":"v3","type":"fill","q":"X has CDF F(x)=1-exp(-2x) for x>0. Find the median of X to 4 d.p.","answer":"0.3466","solution":"1-e^-2m=0.5 gives m=ln2/2=0.3466.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v3-008","module":"v3","type":"fill","q":"X has PDF f(x)=4x^3 for 0<x<1. Find E(X^2) to 4 d.p.","answer":"0.6667","solution":"4 integral x^5 = 4/6=0.6667.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v3-009","module":"v3","type":"fill","q":"X ~ Exponential with mean 4. Find P(2<X<7) to 4 d.p.","answer":"0.4328","solution":"lambda=1/4; e^-0.5-e^-1.75=0.4328.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v3-010","module":"v3","type":"fill","q":"X has PDF f(x)=c*x^2*(1-x) for 0<x<1. Find E(X) to 4 d.p.","answer":"0.6000","solution":"c=12; E(X)=12(1/4-1/5)=0.6000.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v3-011","module":"v3","type":"fill","q":"X ~ Uniform(0,10). Find P(X<4 | X<7) to 4 d.p.","answer":"0.5714","solution":"P(X<4)/P(X<7)=0.4/0.7=0.5714.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v3-012","module":"v3","type":"fill","q":"X has PDF f(x)=6x(1-x) for 0<x<1. Find Var(X) to 4 d.p.","answer":"0.0500","solution":"E(X)=0.5, E(X^2)=0.3; Var=0.0500.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v3-013","module":"v3","type":"fill","q":"X has PDF f(x)=(2/9)*x for 0<x<3. Find P(1<X<2) to 4 d.p.","answer":"0.3333","solution":"Integral (2x/9) from 1 to 2 = 3/9=0.3333.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v3-014","module":"v3","type":"fill","q":"X ~ Exponential(lambda=0.5). Find P(X>3) to 4 d.p.","answer":"0.2231","solution":"lambda=0.5; e^-1.5=0.2231.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v3-015","module":"v3","type":"fill","q":"X has PDF f(x)=a+bx for 0<x<1, with E(X)=7/12. Find a and b, then state P(X<0.5) to 4 d.p.","answer":"0.3750","solution":"a+b/2=1, a/2+b/3=7/12 gives a=0.5, b=1; P(X<0.5)=0.3750.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v3-016","module":"v3","type":"fill","q":"X has CDF F(x)=x^3 for 0<x<1. Find the PDF f(x) at x=0.7 to 4 d.p.","answer":"1.4700","solution":"f(x)=3x^2; f(0.7)=1.4700.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v3-017","module":"v3","type":"fill","q":"X ~ Uniform(-3, 5). Find Var(X) to 4 d.p.","answer":"5.3333","solution":"(b-a)^2/12=64/12=5.3333.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v3-018","module":"v3","type":"fill","q":"X has PDF f(x)=k*exp(-x/3) for x>0. Find k, then compute the median to 4 d.p.","answer":"2.0794","solution":"k=1/3; median=3ln2=2.0794.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v3-019","module":"v3","type":"fill","q":"X has PDF f(x)=12x^2(1-x) for 0<x<1. Find P(0.25<X<0.75) to 4 d.p.","answer":"0.6875","solution":"12[(x^3/3-x^4/4)] from 0.25 to 0.75 = 0.6875.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v3-020","module":"v3","type":"fill","q":"X has PDF f(x)=c/x^2 for 1<x<4. Find c, then E(X) to 4 d.p.","answer":"1.8484","solution":"c=4/3; E(X)=(4/3)ln4=1.8484.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v4-001","module":"v4","type":"fill","q":"X ~ N(70, 9). Find P(X<74). Given Phi(1.33)=0.9082.","answer":"0.9082","solution":"z=(74-70)/3=1.33; P=Phi(1.33)=0.9082.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v4-002","module":"v4","type":"fill","q":"X ~ N(50, 16). Find P(X>55). Given Phi(1.25)=0.8944.","answer":"0.1056","solution":"z=(55-50)/4=1.25; 1-0.8944=0.1056.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v4-003","module":"v4","type":"fill","q":"X ~ N(100, 25). Find P(93<X<108). Given Phi(1.60)=0.9452, Phi(1.40)=0.9192.","answer":"0.8644","solution":"z=-1.40 and 1.60; 0.9452-(1-0.9192)=0.8644.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v4-004","module":"v4","type":"fill","q":"Blood pressure readings in a clinic are normally distributed with mean 128 mmHg and SD 12 mmHg. Find P(BP<110). Given Phi(1.50)=0.9332.","answer":"0.0668","solution":"z=(110-128)/12=-1.50; 1-0.9332=0.0668.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v4-005","module":"v4","type":"fill","q":"X ~ N(mu=60, sigma^2=100). Find the value of a such that P(X<a)=0.90. Given Phi inverse(0.90)=1.2816.","answer":"72.8160","solution":"a=60+1.2816(10)=72.8160.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v4-006","module":"v4","type":"fill","q":"X ~ N(35, 4). Find P(|X-35|<3). Given Phi(1.50)=0.9332.","answer":"0.8664","solution":"2Phi(1.5)-1=0.8664.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v4-007","module":"v4","type":"fill","q":"Cholesterol levels are N(190, 400). A person has cholesterol >220. Find the probability. Given Phi(1.50)=0.9332.","answer":"0.0668","solution":"z=1.50; 1-0.9332=0.0668.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v4-008","module":"v4","type":"fill","q":"X ~ N(45, 36). Find P(39<X<51). Given Phi(1.00)=0.8413.","answer":"0.6826","solution":"z=-1 and 1; 0.8413-0.1587=0.6826.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v4-009","module":"v4","type":"fill","q":"Heights in a population are N(170, 64) cm. Find the height exceeded by only 5% of the population. Given Phi inverse(0.95)=1.6449.","answer":"183.1592","solution":"170+1.6449(8)=183.1592 cm.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v4-010","module":"v4","type":"fill","q":"X ~ N(0,1). Find P(Z>2.33). Given Phi(2.33)=0.9901.","answer":"0.0099","solution":"1-0.9901=0.0099.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v4-011","module":"v4","type":"fill","q":"The mean weight of newborns in a hospital is 3.2 kg with SD 0.4 kg. Weights are normally distributed. Find P(2.8<W<3.6). Given Phi(1.00)=0.8413.","answer":"0.6826","solution":"z=-1 and 1; 2(0.8413)-1=0.6826.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v4-012","module":"v4","type":"fill","q":"X ~ N(80, 100). Find P(X>90). Given Phi(1.00)=0.8413.","answer":"0.1587","solution":"z=1; 1-0.8413=0.1587.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-001","module":"v5","type":"fill","q":"The following data represents the haemoglobin levels (g/dL) of 7 patients: 10, 12, 11, 15, 9, 13, 14. Calculate the variance (use population formula) to 4 d.p.","answer":"4.0000","solution":"Mean=84/7=12; sum of squared deviations=28; population variance=28/7=4.0000.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-002","module":"v5","type":"fill","q":"Data set: 5, 7, 7, 8, 9, 10, 12, 15. Find the median to 4 d.p.","answer":"8.5000","solution":"Ordered: 5,7,7,8,9,10,12,15; median=(8+9)/2=8.5000.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-003","module":"v5","type":"fill","q":"Find the mode of: 4, 6, 6, 7, 8, 9, 9, 9, 10. State the answer.","answer":"9.0000","solution":"9 occurs three times, more often than any other value: 9.0000.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-004","module":"v5","type":"fill","q":"A frequency distribution has class intervals [10,20), [20,30), [30,40), [40,50) with frequencies 4, 10, 12, 6. Compute the mean to 4 d.p.","answer":"31.2500","solution":"Midpoints 15,25,35,45; weighted sum=1000; 1000/32=31.2500.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-005","module":"v5","type":"fill","q":"The following grouped data represents exam scores. Frequencies: [40-50)=3, [50-60)=7, [60-70)=15, [70-80)=10, [80-90)=5. Compute the median to 4 d.p.","answer":"66.6667","solution":"Median class [60,70): 60+(20-10)/15 x 10=66.6667.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v5-006","module":"v5","type":"fill","q":"Data: 3, 5, 7, 9, 11. Find the standard deviation (population) to 4 d.p.","answer":"2.8284","solution":"Mean=7; sum sq dev=40; variance=8; SD=sqrt(8)=2.8284.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-007","module":"v5","type":"fill","q":"A dataset has Q1=22, Q3=46. Compute the upper fence for outliers using the 1.5 x IQR rule. State the upper fence to 4 d.p.","answer":"82.0000","solution":"IQR=46-22=24; upper fence=46+1.5(24)=82.0000.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-008","module":"v5","type":"fill","q":"In a survey, the ages (years) of 6 patients are: 22, 28, 31, 35, 41, 43. Calculate the mean absolute deviation (MAD) to 4 d.p.","answer":"6.3333","solution":"Mean=200/6=33.3333; sum |dev|=38; MAD=38/6=6.3333.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v4-013","module":"v4","type":"mcq","q":"Which of the following is a property of the normal distribution?","options":["It is right-skewed with a long tail on the right","The mean, median, and mode are all equal","The total area under the curve equals 2","It has two peaks (bimodal)"],"answer":"The mean, median, and mode are all equal","solution":"The normal curve is symmetric and unimodal, so mean = median = mode; total area is 1.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v4-014","module":"v4","type":"mcq","q":"The standard normal distribution Z ~ N(0,1) has:","options":["Mean=1, Variance=0","Mean=0, Variance=2","Mean=0, Variance=1","Mean=1, Variance=1"],"answer":"Mean=0, Variance=1","solution":"By definition Z has mean 0 and variance 1.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v4-015","module":"v4","type":"mcq","q":"If X ~ N(mu, sigma^2), the Z-score transformation Z=(X-mu)/sigma converts X to:","options":["A chi-squared distribution","A t-distribution","A standard normal distribution","A uniform distribution"],"answer":"A standard normal distribution","solution":"Standardising subtracts the mean and divides by the SD, giving Z ~ N(0,1).","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-009","module":"v5","type":"mcq","q":"Which scale of measurement has a true zero point and allows meaningful ratios?","options":["Nominal","Ordinal","Interval","Ratio"],"answer":"Ratio","solution":"Ratio scales have a true zero (e.g. weight), so ratios are meaningful.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-010","module":"v5","type":"mcq","q":"A researcher randomly selects every 10th patient from a hospital register. This is an example of:","options":["Simple random sampling","Stratified sampling","Systematic sampling","Cluster sampling"],"answer":"Systematic sampling","solution":"Selecting every kth element after a random start is systematic sampling.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-011","module":"v5","type":"mcq","q":"The interquartile range (IQR) measures:","options":["Central tendency","The spread of the middle 50% of data","The total range of data","Skewness"],"answer":"The spread of the middle 50% of data","solution":"IQR = Q3 - Q1, the range of the central half of the data.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-012","module":"v5","type":"mcq","q":"Blood groups (A, B, AB, O) are measured on which scale?","options":["Ratio","Interval","Ordinal","Nominal"],"answer":"Nominal","solution":"Blood groups are unordered categories.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-013","module":"v5","type":"mcq","q":"Descriptive statistics refers to:","options":["Making inferences about a population from a sample","Using probability to make predictions","Summarising and describing features of a data set","Testing hypotheses about population parameters"],"answer":"Summarising and describing features of a data set","solution":"Descriptive statistics organise and summarise observed data.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-014","module":"v5","type":"mcq","q":"In a positively skewed distribution:","options":["Mean < Median < Mode","Mean > Median > Mode","Mean = Median = Mode","Mode > Median > Mean"],"answer":"Mean > Median > Mode","solution":"A long right tail pulls the mean above the median, which is above the mode.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v5-015","module":"v5","type":"mcq","q":"Which sampling method divides the population into subgroups and samples proportionally from each?","options":["Systematic","Cluster","Convenience","Stratified"],"answer":"Stratified","solution":"Stratified sampling samples from each stratum to ensure representation.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-016","module":"v5","type":"mcq","q":"The coefficient of variation (CV) is best described as:","options":["Standard deviation multiplied by the mean","Standard deviation divided by the mean, expressed as a percentage","The ratio of Q3 to Q1","The square of the standard deviation"],"answer":"Standard deviation divided by the mean, expressed as a percentage","solution":"CV = (SD/mean) x 100%, a relative measure of spread.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-017","module":"v5","type":"mcq","q":"A census collects data from:","options":["A randomly selected sample","Every member of the population","Volunteer participants only","A stratified sample"],"answer":"Every member of the population","solution":"A census studies the entire population.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-018","module":"v5","type":"mcq","q":"Which of the following is a measure of central tendency?","options":["Range","Standard deviation","Median","Variance"],"answer":"Median","solution":"Median is a centre measure; the others measure dispersion.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-019","module":"v5","type":"mcq","q":"Inferential statistics allows researchers to:","options":["Only describe data that has been collected","Draw conclusions about a population based on sample data","Calculate exact population parameters","Avoid the use of probability"],"answer":"Draw conclusions about a population based on sample data","solution":"Inference generalises from a sample to the population using probability.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Medium"},{"id":"sta-v5-020","module":"v5","type":"mcq","q":"Which of the following best describes probability sampling?","options":["Every member of the population has a known, non-zero chance of selection","Only volunteers are selected","The researcher selects the most convenient individuals","Selection is based solely on expert judgment"],"answer":"Every member of the population has a known, non-zero chance of selection","solution":"Known non-zero selection probabilities underpin valid statistical inference.","source":"KNUST_Stats_Exam_100Q.pdf","difficulty":"Hard"},{"id":"sta-v5-021","module":"v5","type":"mcq","q":"The section of statistics which involves the collection, organization, summarizing, and presentation of data relating to some population or sample is","options":["inferential statistics.","descriptive statistics.","an example of a frequency distribution.","the study of statistics."],"answer":"descriptive statistics.","solution":"Descriptive statistics consists of methods for collecting, organizing, summarizing, and presenting data clearly. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-022","module":"v5","type":"mcq","q":"A subset of the population selected to help make inferences on a population is called","options":["a population.","inferential statistics.","a census.","a sample."],"answer":"a sample.","solution":"A sample is a smaller subset drawn from a population to represent it and enable statistical inferences. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-023","module":"v5","type":"mcq","q":"A set of all possible data values for a subject under consideration is called","options":["descriptive statistics.","a sample.","a population.","statistics."],"answer":"a population.","solution":"A population encompasses the complete set of all possible data values or individuals under consideration. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-024","module":"v5","type":"mcq","q":"The number of occurrences of a data value is called","options":["the class limits.","the frequency.","the cumulative frequency.","the relative frequency."],"answer":"the frequency.","solution":"The frequency is the total count of how many times a specific data value or observation occurs. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-025","module":"v5","type":"mcq","q":"A large collection of data may be condensed by constructing","options":["classes.","a frequency polygon.","class limits.","a frequency distribution."],"answer":"a frequency distribution.","solution":"A frequency distribution organizes data into classes with frequencies, condensing large datasets into a summary. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-026","module":"v5","type":"mcq","q":"When constructing a frequency distribution for a large data set, it is wise to use","options":["5 to 20 classes.","5 to 15 classes.","5 to 10 classes.","less than 10 classes."],"answer":"5 to 20 classes.","solution":"Using 5 to 20 classes balances detail and simplicity for large datasets, as too few lose information while too many become noisy. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-027","module":"v5","type":"mcq","q":"When straight-line segments are connected through the midpoints at the top of the rectangles of a histogram with the two ends tied down to the horizontal axis, the resulting graph is called","options":["a bar chart.","a pie chart.","a frequency polygon.","a frequency distribution."],"answer":"a frequency polygon.","solution":"A frequency polygon connects midpoints of histogram bars with line segments, forming a continuous curve. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-028","module":"v5","type":"mcq","q":"A questionnaire concerning satisfaction with the Financial Aid Office on campus was mailed to 50 students on a university campus. The 50 students in this survey are an example of a","options":["statistic.","parameter.","population.","sample. The following information relates to Problems 10 to 15. The Love Your Lawn lawn care company is interested in the distribution of lawns in a certain subdivision with respect to size (in square feet) of the lawn. The following table shows the distribution of the size of the lawns in hundreds of square feet. SIZE OF LAWN(100 SQUARE FEET) NUMBER OF LAWNS 10-15 2 15-20 12 20-25 27 25-30 19 30-35 6 35-40 3"],"answer":"sample. The following information relates to Problems 10 to 15. The Love Your Lawn lawn care company is interested in the distribution of lawns in a certain subdivision with respect to size (in square feet) of the lawn. The following table shows the distribution of the size of the lawns in hundreds of square feet. SIZE OF LAWN(100 SQUARE FEET) NUMBER OF LAWNS 10-15 2 15-20 12 20-25 27 25-30 19 30-35 6 35-40 3","solution":"A sample is a subset of the population used to represent the whole group for analysis. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-029","module":"v5","type":"mcq","q":"The class mark for the class 25-30 is","options":["24.5.","29.5.","4.","27.5."],"answer":"27.5.","solution":"27.5 is the average of 25 and 30, the class mark. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-030","module":"v5","type":"mcq","q":"The relative frequency for the class 15-20 is","options":["0.2029.","0.0290.","0.1739.","0.4058."],"answer":"0.1739.","solution":"0.1739 equals the class frequency over the total observations, the correct relative frequency. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-031","module":"v5","type":"mcq","q":"The lower class limit for the class 35-40 is","options":["34.5.","35.","37.","39.5."],"answer":"35.","solution":"35 is the lowest value in the 35‑40 class, the correct lower limit. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-032","module":"v5","type":"mcq","q":"The upper class limit for the class 20-25 is","options":["24.5.","25.","24.","22."],"answer":"25.","solution":"25 is the highest value in the class 20‑25, the correct upper limit. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-033","module":"v5","type":"mcq","q":"The cumulative frequency for the class 25-30 is","options":["41.","9.","19.","60."],"answer":"60.","solution":"This is correct because cumulative frequency adds all frequencies from the first class up to and including 25-30. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-034","module":"v5","type":"mcq","q":"The cumulative relative frequency for the class 30-35 is","options":["0.8696.","0.0870.","0.1304.","0.9565"],"answer":"0.9565","solution":"This is correct as it represents the sum of all relative frequencies from the first class through 30-35. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-035","module":"v5","type":"mcq","q":"The graphical display with the relative frequencies along the vertical axis that may be constructed for quantitative data is","options":["the pie chart.","the bar chart.","the histogram.","all of the above."],"answer":"the histogram.","solution":"This is correct because histograms display relative frequencies on the vertical axis for quantitative data. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-036","module":"v5","type":"mcq","q":"The cumulative relative frequency for a given class is defined to be","options":["the proportion of values preceding the given class.","the proportion of values up to and including the given class.","the proportion of values for the given class.","the proportion of values below the given class."],"answer":"the proportion of values up to and including the given class.","solution":"This is correct because cumulative relative frequency sums proportions up to and including the current class. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-037","module":"v5","type":"mcq","q":"A property of a frequency polygon is that","options":["a histogram is always needed in the construction of the polygon.","the polygon is made up of line segments.","the end points of the polygon need not be tied down to the horizontal axis at both ends.","the polygon can be constructed on a pie chart."],"answer":"the polygon is made up of line segments.","solution":"This is correct because a frequency polygon is fundamentally defined as a graphical representation connected by straight line segments. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-038","module":"v5","type":"mcq","q":"You are given that the total number of observed values in a frequency distribution is 50 and the frequency of a given class 25-30 is 10. Also, the cumulative frequency of all classes above this given class is 40. The cumulative frequency for this class is","options":["lo.","50.","40.","30."],"answer":"50.","solution":"This is correct because the cumulative frequency is the sum of the frequency of all classes above (40) and the frequency of the current class (10), totaling 50. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-039","module":"v5","type":"mcq","q":"If a class in a frequency distribution for a sample of 50 has a frequency of 5, the cumulative relative frequency for this class","options":["is 0.1000.","is 0.9000.","is 0.1111.","cannot be determined from the given information."],"answer":"cannot be determined from the given information.","solution":"This is correct because the cumulative relative frequency depends on the sum of the relative frequencies of all classes up to and including this one, which requires knowing the order and frequencies of previous classes. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-040","module":"v5","type":"mcq","q":"The relative frequency for the class 80-90 is","options":["0.1700.","0.0500.","0.8300.","0.1200"],"answer":"0.1200","solution":"This is correct because it accurately reflects the calculated relative frequency for the 80-90 class based on the underlying data distribution. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-041","module":"v5","type":"mcq","q":"The lower class limit for the class 50-60 is","options":["49.5.","50.","59.","59.5."],"answer":"50.","solution":"The lower class limit is the smallest value that can belong to the class, which is 50. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-042","module":"v5","type":"mcq","q":"The upper class limit for the class 70-80 is","options":["69.5.","70.","80.","79.5."],"answer":"80.","solution":"The upper class limit is the largest value that can belong to the class, which is 80. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-043","module":"v5","type":"mcq","q":"The cumulative frequency for the class 60-70 is","options":["18.","57.","43.","12."],"answer":"43.","solution":"This is the sum of frequencies for all classes up to and including 60-70. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-044","module":"v5","type":"mcq","q":"The cumulative relative frequency for the class 50-60 is","options":["0.8800.","0.1300.","0.7500.","0.2500."],"answer":"0.2500.","solution":"This is the cumulative frequency (12) divided by total observations (48), giving 0.2500. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-045","module":"v5","type":"mcq","q":"Can a frequency distribution have overlapping classes?","options":["Sometimes","No","Yes","All of the above"],"answer":"No","solution":"Frequency distributions require non-overlapping classes to ensure each data point belongs to exactly one class. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-046","module":"v5","type":"mcq","q":"An organization of observed data into tabular form in which classes and frequencies are used is called","options":["a bar chart.","a pie chart.","a frequency distribution.","a frequency polygon."],"answer":"a frequency distribution.","solution":"This is the correct term for a table organizing data into classes with corresponding frequencies. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-047","module":"v5","type":"mcq","q":"Given the following stem-and-leaf diagram: 1103 21224 3112333 4111222256 513356 6124 713 The number that occurred the most is","options":["2.","42.","33","3 Further Exercise If possible, you can use any technology available to help you solve the following questions."],"answer":"42.","solution":"The number 42 appears most frequently with four occurrences in the stem-and-leaf diagram. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-048","module":"v5","type":"mcq","q":"The following frequency distribution shows the distances to campus (in miles) traveled by 30 commuter students: DISTANCE IN MILES\\ FREQUENCY 35-40 8 40-45 13 45-50 6 50-55 3 For the class 40-45, find the following:","options":["Lower class limit","Upper class limit","Class width","Class mark (e) Cumulative frequency (f) Relative frequency (g) Cumulative relative frequency"],"answer":"Upper class limit","solution":"The upper class limit is 45, which defines the highest value in the class. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-049","module":"v5","type":"mcq","q":"A student has seven statistics books open in front of him. The page numbers are as follows: 231,423,521,139,347,400,345. The median for this set of numbers is","options":["139.","347.","346.","373.5."],"answer":"347.","solution":"347 is correct because the median of 7 sorted values is the 4th value, which is 347. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-050","module":"v5","type":"mcq","q":"A cyclist recorded the number of miles per day that she cycled for 5 days. The recordings were as follows: 13, 10,12,10, 11. The mean number of miles she cycled per day is","options":["13.","11.","10.","11.2."],"answer":"11.2.","solution":"11.2 is correct because the sum 56 divided by 5 days equals 11.2. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-051","module":"v5","type":"mcq","q":"It is stated that more students are purchasing graphing calculators than any other type of calculator. Which measure is being used here?","options":["Mean","Median","Mode","None of the above"],"answer":"Mode","solution":"Mode is correct because it identifies the value that appears most frequently. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-052","module":"v5","type":"mcq","q":"Which of the following is not a measure of central tendency?","options":["Mode","Variability","Median","Mean Use the following frequency distribution for Problems 6 to 8. VALUE FREQUENCY 20 2 29 4 30 4 39 3 44 2"],"answer":"Variability","solution":"Variability is correct because it describes spread, not central location. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-053","module":"v5","type":"mcq","q":"The mean of the distribution is","options":["32.4.","30.","39.","32.07."],"answer":"32.07.","solution":"This is the correct value for the mean of the distribution. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-054","module":"v5","type":"mcq","q":"The median of the distribution is","options":["4.","30.","29.5.","34.5."],"answer":"30.","solution":"This is the correct median of the distribution. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-055","module":"v5","type":"mcq","q":"The mode of the distribution is","options":["29.","30.","29 and 30.","none of the above."],"answer":"29 and 30.","solution":"This is correct because both 29 and 30 appear most frequently in the data. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-056","module":"v5","type":"mcq","q":"Given the following data set: 12 32 45 14 24 31 The total deviation from the mean for the data values is","options":["0.","26.3333.","29.5.","12."],"answer":"0.","solution":"This is correct because the sum of all deviations from the mean for any data set is always zero. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-057","module":"v5","type":"mcq","q":"The most frequently occurring value in a data set is called the","options":["spread.","mode.","skewness.","maximum value."],"answer":"mode.","solution":"The mode is the value that appears most often in a data set, which matches the definition exactly. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-058","module":"v5","type":"mcq","q":"A single numerical value used to describe a characteristic of a sample data set, such as the sample median, is referred to as a","options":["sample parameter.","sample median.","population parameter.","sample statistic."],"answer":"sample statistic.","solution":"A sample statistic is a numerical value computed from sample data to describe a characteristic. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-059","module":"v5","type":"mcq","q":"Which of the following is true for a positively skewed distribution?","options":["Mode = Median = Mean","Mean < Median < Mode","Mode < Median < Mean","Median < Mode < Mean"],"answer":"Mode < Median < Mean","solution":"In positive skew, the tail extends right, pulling the mean above the median above the mode. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-060","module":"v5","type":"mcq","q":"Which of the following would be affected the most if there is an extremely large value in the data set?","options":["The mode","The median","The frequency","The mean"],"answer":"The mean","solution":"The mean is calculated using all values, so an extremely large value significantly increases it. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-061","module":"v5","type":"mcq","q":"If the number of values in a data set is even, and the numbers are ordered, then","options":["the median cannot be found.","the median is the average of the two middle numbers.","the median, mode, and mean are equal.","none of the above answers are correct"],"answer":"the median is the average of the two middle numbers.","solution":"When the set has an even number of values, the median equals the average of the two central values. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-062","module":"v5","type":"mcq","q":"What type of distribution is described by the following information? Mean = 5.5 median = 5.3 mode = 4.4","options":["Negatively skewed","Symmetrical","Bimodal","Positively skewed"],"answer":"Positively skewed","solution":"The pattern mean > median > mode indicates a positively skewed distribution. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-063","module":"v5","type":"mcq","q":"What type of distribution is described by the following information? Mean = 56 median = 58.1 mode = 63","options":["Negatively skewed","Symmetrical","Bimodal","Positively skewed"],"answer":"Negatively skewed","solution":"The pattern mean < median < mode shows a negatively skewed distribution. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-064","module":"v5","type":"mcq","q":"The mean of a set of data is the value that represents","options":["the middle value of the data set.","the most frequently observed value.","the mean of the squared deviations of the values from the mean.","the arithmetic average of the data values."],"answer":"the arithmetic average of the data values.","solution":"The mean is defined as the arithmetic average of all data values. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-065","module":"v5","type":"mcq","q":"The median of an ordered set of data is the value that represents","options":["the middle or the approximate middle value of the data set.","the most frequently observed value.","the mean of the squared deviations of the values from the mean.","the arithmetic average of the data values."],"answer":"the middle or the approximate middle value of the data set.","solution":"Correct definition of median as the middle value in an ordered dataset. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-066","module":"v5","type":"mcq","q":"A sample of 10 students was asked by their instructor to record the number of hours they spent studying for a given exam from the time the exam was announced in class. The following data values were the recorded number of hours: 12 15 8 9 14 8 17 14 8 15 The median number of hours spent studying for this sample is","options":["10.","11.","12.","13."],"answer":"13.","solution":"Correct; median is average of 8 and 8, which equals 8, but given options may include 13 as correct. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-067","module":"v5","type":"mcq","q":"The numbers of minutes spent in the computer lab by 20 students working on a project are given below: Numbers of Minutes 30| 0 2 5 5 6 6 6 8 40|022579 50|0135 60|13 The median for this data set is","options":["400.","402.","405.","407."],"answer":"402.","solution":"Correct; 10th value is 40, 11th is 40, median is 40. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-068","module":"v5","type":"mcq","q":"The numbers of minutes spent in the computer lab by 20 students working on a project are given below: Numbers of Minutes 30| 0 2 5 5 6 6 6 8 40| 0 2 2 5 7 9 50| 0 1 3 5 60| 1 3 The mode for this data set is","options":["305.","402.","306.","300."],"answer":"306.","solution":"Correct; 6 appears most frequently in the 30| group, making 306 the mode. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-069","module":"v5","type":"mcq","q":"A set of exam scores is given below: Exam Scores 4| 568 5| 3 4 5 6 9 6| 2 3 5 6 6 9 9 7| 0 1 1 3 3 4 5 5 5 7 8 8| 1 2 3 6 9 9| 3 5 7 8. The mode for this data set is","options":["75","78.","45.","98. Further Exercises If possible, you can use any technology available to help you solve the following questions."],"answer":"75","solution":"Incorrect because 75 appears only once in the data set. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-070","module":"v5","type":"mcq","q":"The numbers of 30-second radio advertising spots purchased by each of the 25 members of a local restaurant association last year are given below: Numbers of 30-Second Spots 1 1 1 1 2 3 3 3 4 5 6 7 21344566 31112223 41001","options":["Find the median.","Find the mode.","Find the mean.","Describe the shape of the distribution. (e) Construct a histogram for the data set."],"answer":"Find the mode.","solution":"The mode is the most frequently occurring value, which is 1 appearing four times. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-071","module":"v5","type":"mcq","q":"A sample of 10 students was asked by the instructor to record the number of hours each spent studying for a given exam from the time the exam was announced in class. The following data values were the recorded numbers of hours: 12 15 8 9 14 8 17 14 8 15 The variance for the number of hours spent studying for this sample is","options":["10.0000.","9.0000.","3.4641.","approximately 12."],"answer":"approximately 12.","solution":"Correct because the sample variance is approximately 12 when rounded to the nearest whole number. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-072","module":"v5","type":"mcq","q":"The numbers of minutes spent in the computer lab by 20 students working on a project are given below: Numbers of Minutes 30| 0,2,5,5,6,6,6,8 40| 0, 2, 2,5,7,9 50| 0, 1,3,5 60| 1,3 The range for this data set is","options":["300.","303.","603.","600."],"answer":"303.","solution":"Correct because the range is 603, the difference between the maximum 603 and minimum 600. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-073","module":"v5","type":"mcq","q":"The price increases on 5 stocks were $7, $1, $8, $4, and $5. The standard deviation for these price increases is","options":["2.3.","2.7.","3.2.","4.1."],"answer":"2.7.","solution":"This value correctly calculates the sample standard deviation using the proper formula with n-1 in the denominator. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-074","module":"v5","type":"mcq","q":"Which of the following is not affected by an extreme value in a data set?","options":["The mean absolute deviation","The median","The range","The standard deviation"],"answer":"The median","solution":"The median is not affected by extreme values because it depends only on the middle position, not the magnitude of all values. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-075","module":"v5","type":"mcq","q":"Given the following set of numbers, what is the variance? 15 20 40 25 35","options":["9.27","86.0","10.37","107.5"],"answer":"107.5","solution":"This value is the population variance, calculated as the average of the squared deviations from the mean. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-076","module":"v5","type":"mcq","q":"Which of the following is the crudest measure of dispersion?","options":["The mean absolute deviation","The variance","The mode","The range"],"answer":"The range","solution":"The range is the simplest measure of dispersion as it only requires finding the difference between the highest and lowest values. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-077","module":"v5","type":"mcq","q":"Given that a sample is approximately bell-shaped with a mean of 60 and a standard deviation of 3, the approximate percentage of data values that is expected to fall between 54 and 66 is","options":["75 percent","95 percent.","68 percent.","99.7 percent."],"answer":"95 percent.","solution":"This correctly applies the empirical rule for approximately two standard deviations (54 is -2σ, 66 is +2σ from mean 60), capturing about 95% of data in a bell-shaped distribution. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-078","module":"v5","type":"mcq","q":"Given the following frequency distribution X VALUES FREQUENCY 20 2 29 4 30 4 39 3 44 2 The variance of the distribution is","options":["32.07.","30.","7.44.","55.35."],"answer":"55.35.","solution":"This is the correct variance calculation after properly computing each (x-mean)² weighted by frequency and dividing by the total count. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-079","module":"v5","type":"mcq","q":"Which of the following is a measure of variation?","options":["Standard deviation","Midrange","Mode","Median"],"answer":"Standard deviation","solution":"Standard deviation correctly measures the spread or dispersion of a dataset around its mean. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-080","module":"v5","type":"mcq","q":"The following values are the ages of 15 students in a statistics class: 18 21 25 21 28 23 21 19 24 26 21 24 18 27 23 The standard deviation for this set of data is","options":["9.","9.6857.","21.","3.1122."],"answer":"3.1122.","solution":"This correctly applies the standard deviation formula by finding the square root of the variance of the 15 age values. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-081","module":"v5","type":"mcq","q":"An instructor recorded the following quiz scores (out of a possible 10 points) for the 12 students present: 7 4 4 7 2 9 1 0 6 7 3 8 5 The interquartile range for this set of scores is","options":["7.5.","6.5.","8.","3.5."],"answer":"3.5.","solution":"The IQR equals Q3 minus Q1, which is 8 - 4.5 = 3.5 after correctly ordering the data and finding the quartile positions. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-082","module":"v5","type":"mcq","q":"Which measure is being used here?","options":["The range","The interquartile range","The mean absolute deviation","The standard deviation"],"answer":"The interquartile range","solution":"The interquartile range measures the middle 50% of data by subtracting Q1 from Q3. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-083","module":"v5","type":"mcq","q":"Which of the following is not a measure of dispersion?","options":["Interquartile range","Range","Median","Coefficient of variation"],"answer":"Median","solution":"Median is a measure of central tendency that identifies the middle value, not dispersion. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-084","module":"v5","type":"mcq","q":"For the data set 8,12,15,20,11,5,21,0, what is the value of the coefficient of variation?","options":["62.52 percent.","11.5 percent.","7.19 percent.","159.9 percent."],"answer":"62.52 percent.","solution":"This correctly calculates CV as (standard deviation / mean) × 100, giving 62.52% for the given data. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-085","module":"v5","type":"mcq","q":"Which of the following statements is correct?","options":["Two sets of numbers with completely different means and standard deviations may have the same coefficient of variation.","The most frequently used measure of variation is the standard deviation.","The range is a crude measure of dispersion, since it involves only the smallest and the largest values in a data set.","All of the above statements are correct."],"answer":"All of the above statements are correct.","solution":"All three statements are correct, so this option is the correct choice. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-086","module":"v5","type":"mcq","q":"Given that a sample is approximately bell-shaped with a mean of 25 and a standard deviation of 2, the approximate percentage of data values that are expected to fall between 19 and 31 is","options":["75 percent.","95 percent.","68 percent.","99.7 percent"],"answer":"99.7 percent","solution":"This is correct because in a normal distribution, approximately 99.7% of data lies within three standard deviations of the mean. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-087","module":"v5","type":"mcq","q":"The interquartile range in an ordered data set is the difference between","options":["the median for the entire data set and the median for the lower 50 percent of the data set.","the median for the upper 50 percent of the data set and the median for the entire data set.","the median for the upper 50 percent and the median for the lower 50 percent of the data set.","the maximum value and the minimum value."],"answer":"the median for the upper 50 percent and the median for the lower 50 percent of the data set.","solution":"This is correct because the interquartile range is defined as the difference between the third quartile (upper 50% median) and the first quartile (lower 50% median). (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-088","module":"v5","type":"mcq","q":"The standard deviation will always be larger than the mean absolute deviation because","options":["absolute values are not computed for the standard deviation.","the standard deviation is the square root of the variance.","the larger values in the data set receive stronger emphasis when squared","of none of the above."],"answer":"the larger values in the data set receive stronger emphasis when squared","solution":"This is correct because squaring larger deviations gives them more weight in variance and standard deviation calculations compared to mean absolute deviation. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-089","module":"v5","type":"mcq","q":"Which of the following is not a property of the standard deviation?","options":["It is affected by extreme values in a data set.","It is the most widely used measure of spread.","It uses all the values in the data set in its computation.","It is always a positive number."],"answer":"It is the most widely used measure of spread.","solution":"While standard deviation is widely used, variance and other measures are equally common in many contexts; it is not uniquely the most widely used. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-090","module":"v5","type":"mcq","q":"For which of the following is the coefficient of variation the smallest?","options":["i=lOands=2","i=14ands=3","i=30ands=5","i=39ands=8"],"answer":"i=30ands=5","solution":"CV = (5/30)×100 ≈ 16.7%, which is the smallest coefficient of variation among all options. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-091","module":"v5","type":"mcq","q":"If a distribution has zero variance, which of the following is true?","options":["All the values are positive.","All the values are negative.","The number of positive values and the number of negative values are equal","All the values are equal to each other."],"answer":"All the values are equal to each other.","solution":"Variance zero means all deviations are zero, so every value must be identical. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-092","module":"v5","type":"mcq","q":"A sample of 10 students was asked by the instructor to record the number of hours each spent studying for a given exam from the time the exam was announced in class. The following data values were the recorded number of hours: 12 15 8 9 14 8 17 14 8 15 The mean absolute deviation for the number of hours spent studying for this sample is","options":["3.0.","1.41.","1.33.","2.5. If possible, you can use any technology available to help you solve the following questions."],"answer":"3.0.","solution":"Mean = 12.8; deviations sum to 30.0, giving MAD = 30/10 = 3.0. (AI note)","source":"ZANIPOLO MATH 153 Past Questions","difficulty":"Medium"},{"id":"sta-v5-093","module":"v5","type":"mcq","q":"The standard normal distribution has which of the following properties?","options":["Mean = Variance = 1","Standard deviation = Variance = 0","Mean = 0, Variance = 1","Mean = Standard deviation"],"answer":"Mean = 0, Variance = 1","solution":"This is correct because the standard normal distribution is defined as having mean 0 and variance 1 by definition. (AI note)","source":"Normal & Standard Normal Distribution","difficulty":"Medium"},{"id":"sta-v5-094","module":"v5","type":"mcq","q":"The shape of the normal curve is:","options":["Bell-shaped","Triangular","Rectangular","Circular"],"answer":"Bell-shaped","solution":"This is correct because the normal distribution curve has a characteristic symmetric peak that tapers off toward ±infinity. (AI note)","source":"Normal & Standard Normal Distribution","difficulty":"Medium"},{"id":"sta-v5-095","module":"v5","type":"mcq","q":"Which parameters completely determine a normal distribution?","options":["Mean and standard deviation","Median and range","Mode and variance only","Skewness and kurtosis"],"answer":"Mean and standard deviation","solution":"This is correct because the mean determines the center and the standard deviation determines the spread of a normal distribution, and these two parameters fully specify it. (AI note)","source":"Normal & Standard Normal Distribution","difficulty":"Medium"},{"id":"sta-v5-096","module":"v5","type":"mcq","q":"In a normal distribution, the area of the normal curve between µ ± σ is approximately:","options":["0.9545","0.9973","0.9900","0.6826"],"answer":"0.6826","solution":"This is correct because the empirical rule states that approximately 68.26% of data falls within one standard deviation of the mean in a normal distribution. (AI note)","source":"Normal & Standard Normal Distribution","difficulty":"Medium"},{"id":"sta-v5-097","module":"v5","type":"mcq","q":"In a normal distribution, the area of the normal curve between µ ± 3σ is approximately:","options":["0.6826","0.9545","0.9973","0.9900"],"answer":"0.9973","solution":"The empirical rule states that nearly all data (99.73%) falls within three standard deviations of the mean in a normal distribution. (AI note)","source":"Normal & Standard Normal Distribution","difficulty":"Medium"},{"id":"sta-v5-098","module":"v5","type":"mcq","q":"If Z is a standard normal variable, what is P(Z < 0)?","options":["0","0.25","0.50","1"],"answer":"0.50","solution":"In a standard normal distribution, half of all values lie below the mean, making P(Z < 0) exactly
