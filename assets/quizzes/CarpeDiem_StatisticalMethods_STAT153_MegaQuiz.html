 0.50. (AI note)","source":"Normal & Standard Normal Distribution","difficulty":"Medium"},{"id":"sta-v5-099","module":"v5","type":"mcq","q":"The kurtosis of a standard normal distribution is:","options":["0","1","2","3"],"answer":"3","solution":"The standard normal distribution has a kurtosis value of 3, which defines mesokurtic shape. (AI note)","source":"Normal & Standard Normal Distribution","difficulty":"Medium"},{"id":"sta-v5-100","module":"v5","type":"mcq","q":"Which of the following is not a property of the normal distribution?","options":["It is symmetric about the mean","Mean = Median = Mode","It has finite range","The tails extend to ±∞"],"answer":"It has finite range","solution":"Normal distributions have infinite tails that extend indefinitely in both directions. (AI note)","source":"Normal & Standard Normal Distribution","difficulty":"Medium"},{"id":"sta-v5-101","module":"v5","type":"mcq","q":"If Z ∼N(0, 1), then E(Z2) equals:","options":["0","1","2","3"],"answer":"1","solution":"This is correct because E(Z²) equals Var(Z) for any random variable with mean zero, and Var(Z)=1. (AI note)","source":"Normal & Standard Normal Distribution","difficulty":"Medium"},{"id":"sta-v5-102","module":"v5","type":"mcq","q":"If X ∼N(50, 100), what is P(X < 50)?","options":["0.00","0.25","0.50","1.00"],"answer":"0.50","solution":"This is correct because for any normal distribution, the probability of being below the mean is exactly 0.5. (AI note)","source":"Normal & Standard Normal Distribution","difficulty":"Medium"},{"id":"sta-v5-103","module":"v5","type":"mcq","q":"The Central Limit Theorem states that the sampling distribution of the sample mean approaches a normal distribution as:","options":["The population variance increases","The sample size n →∞","The population becomes symmetric","The standard deviation tends to zero"],"answer":"The sample size n →∞","solution":"This is correct because the CLT states that as sample size n increases without bound, the sample mean becomes normally distributed regardless of the population distribution. (AI note)","source":"Normal & Standard Normal Distribution","difficulty":"Medium"},{"id":"sta-v5-104","module":"v5","type":"mcq","q":"The value of z such that P(−z < Z < z) = 0.95 for the standard normal variable Z is approximately:","options":["1.28","1.645","1.96","2.576"],"answer":"1.96","solution":"This is correct because z=1.96 captures approximately 95% of the area under the standard normal curve. (AI note)","source":"Normal & Standard Normal Distribution","difficulty":"Medium"},{"id":"sta-v5-105","module":"v5","type":"mcq","q":"Which of the following best describes the flaw in the question: ”Do you believe the university should increase funding for the library and improve student housing?”","options":["Leading question","Double-barreled question","Ambiguous question","Loaded question"],"answer":"Double-barreled question","solution":"This is a double-barreled question because it asks about two separate issues (library funding and student housing) in one item. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-106","module":"v5","type":"mcq","q":"”How often do you usually utilize the campus facilities?” What is the primary methodological weakness of this item?","options":["It is a double-negative question.","It uses an exhaustive scale.","It contains an ambiguous qualifier.","it is a dichotomous item."],"answer":"It contains an ambiguous qualifier.","solution":"The word 'usually' is an ambiguous qualifier that lacks a clear reference period for what constitutes 'usually'. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-107","module":"v5","type":"mcq","q":"A survey asks: ”Don’t you agree that the current grading system is unfair to hard-working stu- dents?” This is an example of:","options":["A leading question.","A double-barreled question.","A recall-dependent question.","A filter question."],"answer":"A leading question.","solution":"This is a leading question because it uses a negative prefix and an assumed agreement to pressure respondents toward a 'yes' answer. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-108","module":"v5","type":"mcq","q":"Which scale type uses bipolar adjectives at the ends of a continuum to measure the connotative meaning of a concept?","options":["Likert Scale","Guttman Scale","Semantic Differential Scale","Nominal Scale"],"answer":"Semantic Differential Scale","solution":"A Semantic Differential Scale uses bipolar adjectives like 'good-bad' at the ends of a continuum to measure connotative meaning. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-109","module":"v5","type":"mcq","q":"What is the primary purpose of a ”Filter Question” (Skip Logic) in a questionnaire?","options":["To test the respondent’s honesty.","To ensure all respondents answer every question in the set.","To identify a sub-group of respondents for whom specific subsequent questions are relevant.","To measure the intensity of a respondent’s attitude toward a topic."],"answer":"To identify a sub-group of respondents for whom specific subsequent questions are relevant.","solution":"Skip logic is designed to route respondents past irrelevant questions based on prior answers, focusing only on applicable subgroups. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-110","module":"v5","type":"mcq","q":"Identify the problem with these age categories: [18-25], [25-35], [35-45], [45+]. 1","options":["They are not collectively exhaustive.","They are not mutually exclusive.","They utilize a ratio scale inappropriately.","They are leading."],"answer":"They are not mutually exclusive.","solution":"Values like 25 and 35 appear in two adjacent categories, violating mutual exclusivity. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-111","module":"v5","type":"mcq","q":"”Do you not think it is unwise not to save money for emergencies?” This question suffers from:","options":["Double-barreled phrasing.","Double negatives.","Social desirability bias.","Recall bias."],"answer":"Double negatives.","solution":"The double negative 'not think' and 'not to save' creates confusion in the sentence structure. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-112","module":"v5","type":"mcq","q":"Which type of bias is most likely when asking respondents about illegal or stigmatized behaviors?","options":["Acquiescence bias","Recall bias","Social desirability bias","Central tendency bias"],"answer":"Social desirability bias","solution":"Respondents may deny illegal or shameful actions to avoid judgment, making their answers unreliable. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-113","module":"v5","type":"mcq","q":"A question asking respondents to ”Rank the following 5 features in order of importance” yields what level of measurement?","options":["Nominal","Ordinal","Interval","Ratio"],"answer":"Ordinal","solution":"Ordinal data can be rank-ordered, making it the correct level for ranking features. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-114","module":"v5","type":"mcq","q":"If a researcher wants to calculate a mean score of student satisfaction, which question format is most appropriate?","options":["Open-ended","Dichotomous","Likert-type scale","Multiple choice (Check all that apply)"],"answer":"Likert-type scale","solution":"Likert-type scales produce numeric scores that can be averaged to calculate a mean. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-115","module":"v5","type":"mcq","q":"”How many times did you eat at the canteen in the last 12 months?” This question is most susceptible to:","options":["Recall bias.","Leading bias.","Double-barreled error.","Sampling error."],"answer":"Recall bias.","solution":"Recall bias occurs when respondents estimate frequency over a long period inaccurately. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-116","module":"v5","type":"mcq","q":"What does it mean for response categories to be ”Collectively Exhaustive”?","options":["No two categories overlap.","The options cover every possible valid response.","The respondent is given at least five options to choose from.","The question uses a balanced Likert scale."],"answer":"The options cover every possible valid response.","solution":"Collectively exhaustive categories include all possible valid responses to the question. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-117","module":"v5","type":"mcq","q":"Which of the following is a ”Dichotomous” question?","options":["Rate your experience from 1 to 10.","Have you ever used the university counseling services? (Yes / No)","Which department do you belong to?","What is your favorite time to study?"],"answer":"Have you ever used the university counseling services? (Yes / No)","solution":"This provides exactly two response options (Yes/No), making it dichotomous. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-118","module":"v5","type":"mcq","q":"”How would you describe the atmosphere of the lecture hall?” (Followed by a blank text box). This is:","options":["A closed-ended question.","A semantic differential item.","An open-ended question.","A ranking question."],"answer":"An open-ended question.","solution":"An open-ended question leaves the response blank for the respondent to answer freely in their own words. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-119","module":"v5","type":"mcq","q":"In a 5-point Likert scale, what does the middle value (3) usually represent?","options":["Strongly Disagree","Neutral or Undecided","Strongly Agree","Not Applicable"],"answer":"Neutral or Undecided","solution":"The central point on a 5-point scale represents neutrality, neither agreement nor disagreement. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-120","module":"v5","type":"mcq","q":"What is ”Acquiescence Bias”?","options":["The tendency to provide the same answer for all questions in a grid.","The tendency to agree with all statements regardless of content.","The tendency to skip sensitive questions.","The tendency to choose the middle option on a scale."],"answer":"The tendency to agree with all statements regardless of content.","solution":"Acquiescence bias is the propensity to respond affirmatively to statements irrespective of their content. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-121","module":"v5","type":"mcq","q":"Identify the ”Loaded” element in this question: ”To what extent do you support the university’s progressive new policy on environmental sustainability?”","options":["It is double-barreled.","The word ”progressive” introduces a positive bias.","It is a dichotomous question.","It requires a recall of specific dates."],"answer":"The word ”progressive” introduces a positive bias.","solution":"The term 'progressive' carries a positive connotation that may influence respondents to support the policy. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-122","module":"v5","type":"mcq","q":"When designing a questionnaire, a ”Pilot Test” is conducted primarily to:","options":["Gather final data for the research report.","Identify and correct ambiguous questions or technical errors.","Select the sample population.","Calculate the final mean and standard deviation."],"answer":"Identify and correct ambiguous questions or technical errors.","solution":"Pilot testing is used to detect and fix unclear questions or technical issues before the main study. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-123","module":"v5","type":"mcq","q":"Which level of measurement allows for a ”true zero” point (e.g., age in years, or number of credits earned)?","options":["Nominal","Ordinal","Interval","Ratio"],"answer":"Ratio","solution":"Ratio scales include all features of interval plus a meaningful zero that indicates complete absence. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v5-124","module":"v5","type":"mcq","q":"Why should researchers avoid ”Double-Barreled” questions?","options":["They take too long for the respondent to read.","They produce data that is impossible to interpret accurately.","They force a respondent into a ”Yes” or ”No” answer.","They are only used in qualitative research. article [utf8]inputenc geometry booktabs array a4paper, margin=1in"],"answer":"They produce data that is impossible to interpret accurately.","solution":"When two concepts are combined, it becomes unclear which part the response applies to, making interpretation difficult. (AI note)","source":"Advanced Questionnaire Design (GLI)","difficulty":"Medium"},{"id":"sta-v1-026","module":"v1","type":"fill","q":"A laboratory processes samples in three units: L1, L2, and L3 with probabilities 0.30, 0.50, and 0.20 respectively. The testing error rates are P(T|L1)=0.03, P(T|L2)=0.02, P(T|L3)=0.05. During peak workload periods, testing errors increase by 70%. Thirty-five percent of samples are processed during peak periods. Compute the overall probability of a testing error (3 d.p).","answer":"0.036","solution":"Effective rates: L1=0.03735, L2=0.02490, L3=0.06225. P(T)=0.30(0.03735)+0.50(0.02490)+0.20(0.06225)=0.036105 ~ 0.036.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-027","module":"v1","type":"fill","q":"In the laboratory testing-error problem above, given that a testing error occurred, find the probability that it came from unit L2 (3 d.p).","answer":"0.345","solution":"P(L2|T)=0.02490x0.50/0.036105=0.3448 ~ 0.345.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-028","module":"v1","type":"fill","q":"In a vaccination campaign, P(V=1|R=1)=0.75, P(V=1|R=0)=0.35, P(R=1)=0.30. Find P(R=1|V=1) (3 d.p).","answer":"0.479","solution":"P(V)=0.75(0.30)+0.35(0.70)=0.470; P(R|V)=0.225/0.470=0.4787 ~ 0.479.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Medium"},{"id":"sta-v1-029","module":"v1","type":"fill","q":"In a district, 32% of adults consume excessive sugar (E). The relative risk of tooth decay for high-sugar consumers compared to others is 3, that is P(T|E)/P(T|E')=3. Given P(T)=0.12, find P(E|T) (2 d.p).","answer":"0.59","solution":"Let p=P(T|E'); then 0.12=3p(0.32)+p(0.68)=1.64p, p=0.0732. P(T|E)=0.2195; P(E|T)=0.2195x0.32/0.12=0.5854 ~ 0.59.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-030","module":"v1","type":"fill","q":"A newborn screening program detects a rare genetic condition. Suppose 1/5 of positive test cases come from inherited mutations, the rest sporadic. In inherited cases siblings always share the condition; in sporadic cases each child independently has probability 0.5 of being affected. If two siblings are both affected, what is the probability the condition is inherited?","answer":"0.50","solution":"P(both)=1(0.20)+0.25(0.80)=0.40; P(I|both)=0.20/0.40=0.50.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-031","module":"v1","type":"fill","q":"A healthcare network assigns patients to three surgical centers A, B, C with probabilities 0.15, 0.55, 0.30. Post-surgical infection rates are 4%, 3%, 6% respectively. What is the probability that a patient with an infection had surgery at Center C? (2 d.p)","answer":"0.44","solution":"P(I)=0.04(0.15)+0.03(0.55)+0.06(0.30)=0.0405; P(C|I)=0.018/0.0405=0.4444 ~ 0.44.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Medium"},{"id":"sta-v1-032","module":"v1","type":"fill","q":"In a cardiovascular study P(A)=0.55, P(B)=0.48, P(C)=0.32, P(A and B)=0.28, P(A and C)=0.19, P(B and C)=0.20, P(A and B and C)=0.13. Find P(A | at least one of B or C) (2 d.p).","answer":"0.57","solution":"P(B or C)=0.48+0.32-0.20=0.60; P(A and (B or C))=0.28+0.19-0.13=0.34; 0.34/0.60=0.5667 ~ 0.57.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-033","module":"v1","type":"fill","q":"Seventy percent of individuals receive vaccinations. Twelve percent receive neither vaccination nor regular screenings, and 28% receive no regular screenings. What is the probability an individual receives vaccinations but not regular screenings? (2 d.p)","answer":"0.16","solution":"P(V and S')=P(S')-P(V' and S')=0.28-0.12=0.16.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Medium"},{"id":"sta-v1-034","module":"v1","type":"fill","q":"The probability a married man watches a TV show is 0.4, a married woman 0.5, and P(man watches | wife watches)=0.7. What is the probability a married couple watches the show? (2 d.p)","answer":"0.35","solution":"P(M and W)=P(M|W)P(W)=0.7x0.5=0.35.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Medium"},{"id":"sta-v1-035","module":"v1","type":"fill","q":"Three clinics conduct screenings: A has 4 abnormal and 3 normal cases, B has 6 abnormal and 2 normal, C has 2 abnormal and 5 normal. One clinic is chosen at random and one case selected. Given the case is abnormal, find the probability it came from Clinic B (3 d.p).","answer":"0.467","solution":"P(abn)=(1/3)(4/7+6/8+2/7)=15/28; P(B|abn)=(1/3)(3/4)/(15/28)=7/15=0.4667.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-036","module":"v1","type":"fill","q":"15% of adults sleep at least 8 hours daily. Adults with adequate sleep are 4 times less likely to develop depression. If P(D)=0.12, find P(Adequate Sleep | D) (2 d.p).","answer":"0.04","solution":"Let q=P(D|S'); 0.12=q/4(0.15)+q(0.85)=0.8875q, q=0.1352. P(S|D)=(0.0338x0.15)/0.12=0.0423 ~ 0.04.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-037","module":"v1","type":"fill","q":"Events A, B, C satisfy P(A|C)=0.55, P(B|C)=0.48, P(A and B|C)=0.30, P(C)=0.35, P(A|C')=0.25, P(B|C')=0.35, and A and B are independent given C'. Compute P(A and B) (2 d.p).","answer":"0.16","solution":"P(A and B|C')=0.25x0.35=0.0875; P(A and B)=0.30(0.35)+0.0875(0.65)=0.1619 ~ 0.16.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-038","module":"v1","type":"fill","q":"What is the probability of obtaining doubles when rolling two fair dice? (3 d.p)","answer":"0.167","solution":"There are 6 double outcomes out of 36: 6/36=1/6=0.1667.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Medium"},{"id":"sta-v1-039","module":"v1","type":"mcq","q":"Which sampling method selects groups randomly and studies all elements within them?","options":["Stratified sampling","Systematic sampling","Cluster sampling","Judgmental sampling"],"answer":"Cluster sampling","solution":"GLI STAT 153 QUIZZES.pdf - Quiz4-Q1 Cluster sampling","source":"GLI STAT 153 QUIZZES.pdf - Quiz4-Q1","difficulty":"Medium"},{"id":"sta-v1-040","module":"v1","type":"mcq","q":"Which measure of dispersion is based on quartiles?","options":["Interquartile range","Quartile deviation","Standard deviation","Variance"],"answer":"Quartile deviation","solution":"GLI STAT 153 QUIZZES.pdf - Quiz4-Q2 Quartile deviation","source":"GLI STAT 153 QUIZZES.pdf - Quiz4-Q2","difficulty":"Medium"},{"id":"sta-v1-041","module":"v1","type":"mcq","q":"Which of the following falls under Inferential Statistics? I. TB incidence was 8.2 per 100,000 in 2024. II. Social distancing reduces transmission. III. Cumulative death toll was 2.1 million. IV. Mental health disorders projected to affect 450 million by 2028.","options":["a. I and III","b. I only","c. III and IV","d. II and IV"],"answer":"d. II and IV","solution":"GLI STAT 153 QUIZZES.pdf - Quiz4-Q3 d. II and IV","source":"GLI STAT 153 QUIZZES.pdf - Quiz4-Q3","difficulty":"Medium"},{"id":"sta-v1-042","module":"v1","type":"fill","q":"Using the 30 medical student scores 12,18,22,25,27,30,31,33,35,38,40,42,45,46,48,50,52,55,57,60,62,65,67,70,72,74,76,78,79,80, the frequency distribution with 4 classes starting at 12 has class width 17. Find the midpoint of the class 12-28.","answer":"20","solution":"Midpoint=(12+28)/2=20 (equivalently (11.5+28.5)/2=20).","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-043","module":"v1","type":"fill","q":"Using the 20 HB1 student scores 12,15,18,20,22,24,25,27,29,30,31,33,35,37,38,40,42,44,45,47 grouped into 4 classes of width 9 starting at 12, compute the grouped variance to 2 d.p.","answer":"92.34","solution":"Midpoints 16,25,34,43 with frequencies 4,5,6,5; sum fx=608, mean=30.4; sum f*m^2=20330; Var=20330/20-(30.4)^2=92.34.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-044","module":"v1","type":"fill","q":"Three ICUs I1, I2, I3 admit 30%, 40%, 30% of critical patients. Complication probabilities are w1, w2=1.3w1, w3=1.7w1 with overall complication rate 0.08. Find P(I3 | complication) (2 d.p).","answer":"0.38","solution":"0.08=w1(0.30+1.3x0.40+1.7x0.30)=1.33w1, so w1=0.06015, w3=0.10226; P(I3|C)=0.10226x0.30/0.08=0.3835 ~ 0.38.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-045","module":"v1","type":"fill","q":"Three screening programs S1(45%), S2(30%), S3(25%) have misclassification probabilities p1, p2=1.4p1, p3=1.8p1 with overall rate 0.06. Determine p1 (3 d.p).","answer":"0.045","solution":"0.06=p1(0.45+1.4x0.30+1.8x0.25)=1.32p1, so p1=0.04545 ~ 0.045.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-046","module":"v1","type":"fill","q":"In the screening misclassification problem above, determine p2 (3 d.p).","answer":"0.064","solution":"p2=1.4 x 0.04545=0.06364 ~ 0.064.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-047","module":"v1","type":"fill","q":"In the screening misclassification problem above, determine p3 (3 d.p).","answer":"0.082","solution":"p3=1.8 x 0.04545=0.08182 ~ 0.082.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-048","module":"v1","type":"fill","q":"In the screening misclassification problem above, find P(S2 | misclassified) (3 d.p).","answer":"0.318","solution":"P(S2|Mis)=0.06364x0.30/0.06=0.3182.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-049","module":"v1","type":"fill","q":"A company produces packets of 4 candies. Let X be the number of defective candies with PMF P(X=x)=k(x+1)^2 for x=0,1,2,3,4. Find k (4 d.p).","answer":"0.0182","solution":"Sum (1+4+9+16+25)=55, so k=1/55=0.0182.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-050","module":"v1","type":"fill","q":"For the defective-candy PMF P(X=x)=k(x+1)^2, compute P(X>=2) (2 d.p).","answer":"0.91","solution":"P(X>=2)=(9+16+25)/55=50/55=0.9091 ~ 0.91.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-051","module":"v1","type":"fill","q":"For the defective-candy PMF P(X=x)=k(x+1)^2, find E(X) (3 d.p).","answer":"3.091","solution":"E(X)=(0+4+18+48+100)/55=170/55=3.0909.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-052","module":"v1","type":"fill","q":"For the defective-candy PMF P(X=x)=k(x+1)^2, calculate Var(X) (3 d.p).","answer":"1.064","solution":"E(X^2)=(0+4+36+144+400)/55=584/55; Var=10.6182-9.5537=1.0645.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-053","module":"v1","type":"fill","q":"For the defective-candy PMF, the company recalls packets with more than 2 defective candies. Find E[X | X>2] (2 d.p).","answer":"3.61","solution":"E[X|X>2]=(3x16+4x25)/(16+25)=148/41=3.6098 ~ 3.61.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Devil Mode"},{"id":"sta-v1-054","module":"v1","type":"fill","q":"A continuous RV has CDF F(x)=0 for x<0, ln(1+x) for 0<=x<=e-1, and 1 for x>e-1. Find E(X) (3 d.p).","answer":"0.718","solution":"f(x)=1/(1+x); E(X)=integral x/(1+x) from 0 to e-1 = e-2 = 0.7183.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Devil Mode"},{"id":"sta-v1-055","module":"v1","type":"fill","q":"For the CDF F(x)=ln(1+x) on 0<=x<=e-1, compute P(0.5<X<1) (3 d.p).","answer":"0.288","solution":"F(1)-F(0.5)=ln2-ln1.5=ln(4/3)=0.2877.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-056","module":"v1","type":"fill","q":"For the CDF F(x)=ln(1+x) on 0<=x<=e-1, find F(5) (3 d.p).","answer":"1.000","solution":"Since 5>e-1=1.718, F(5)=1.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Medium"},{"id":"sta-v1-057","module":"v1","type":"fill","q":"For the CDF F(x)=ln(1+x) on 0<=x<=e-1, find the 2nd percentile (4 d.p).","answer":"0.0202","solution":"ln(1+x)=0.02, so x=e^0.02-1=0.0202.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Devil Mode"},{"id":"sta-v1-058","module":"v1","type":"fill","q":"For the CDF F(x)=ln(1+x) on 0<=x<=e-1, find the median (3 d.p).","answer":"0.649","solution":"ln(1+m)=0.5, so m=sqrt(e)-1=0.6487.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-059","module":"v1","type":"fill","q":"In a room of 8 people, what is the probability that at least 2 people were born on the same day of the week? (2 d.p)","answer":"1.00","solution":"By the pigeonhole principle, 8 people cannot all have different weekdays, so the probability is 1.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Hard"},{"id":"sta-v1-060","module":"v1","type":"fill","q":"A family has two children. You learn that at least one is a girl born on a Wednesday. What is the probability that both children are girls? (3 d.p)","answer":"0.481","solution":"Each child has 14 (sex,day) outcomes. |A|=196-169=27; |both girls and A|=49-36=13; 13/27=0.4815.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Devil Mode"},{"id":"sta-v1-061","module":"v1","type":"fill","q":"A disease affects 1 in 1000 people. A test has 99% sensitivity and 95% specificity. If a patient tests positive twice in a row, what is the probability they have the disease? (3 d.p)","answer":"0.282","solution":"P(++|D)=0.99^2=0.9801, P(++|D')=0.05^2=0.0025; posterior=0.0009801/(0.0009801+0.0024975)=0.2818.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Devil Mode"},{"id":"sta-v1-062","module":"v1","type":"fill","q":"A disease affects 1 in 1000 people. A test has 99% sensitivity and 95% specificity. If a patient tests positive four times in a row, what is the probability they have the disease? (3 d.p)","answer":"0.994","solution":"P(+^4|D)=0.99^4=0.9606, P(+^4|D')=0.05^4=6.25e-6; posterior=0.9935.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Devil Mode"},{"id":"sta-v1-063","module":"v1","type":"fill","q":"A committee of 5 is formed from 6 men (including a chairman) and 5 women (including a secretary). It must have at least 2 women, at most 3 men, and the chairman and secretary cannot both serve. How many valid committees are there?","answer":"307","solution":"Unrestricted valid committees = 200+150+30+1=381; invalid with both chairman and secretary = 74; 381-74=307.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Devil Mode"},{"id":"sta-v1-064","module":"v1","type":"fill","q":"8 people (including friends A, B, C) are seated around a circular table. In how many ways can they be arranged if A, B, C must NOT all sit together as a consecutive block?","answer":"4320","solution":"Total circular arrangements=7!=5040; arrangements with A,B,C as a block=5!x3!=720; 5040-720=4320.","source":"GLI STAT 153 QUIZZES.pdf / GLI STAT 153 QUIZZES ANSWER KEY.pdf","difficulty":"Devil Mode"},{"id":"sta-v5-125","module":"v5","type":"mcq","q":"A researcher is interested in the travel time of Utrecht University students to college. A group of 50 students is interviewed. Their mean travel time is 16.7 minutes. For this study the mean of 16.7 minutes is an example of a(n):","options":["Parameter","Statistic","Population","Sample"],"answer":"Statistic","solution":"Source answer key: question 1.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-126","module":"v5","type":"mcq","q":"A researcher is curious about the IQ of students at Utrecht University. The entire group of students is an example of a:","options":["Parameter","Statistic","Population","Sample"],"answer":"Population","solution":"Source answer key: question 2.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-127","module":"v5","type":"mcq","q":"Statistical techniques that summarize and organize the data are classified as:","options":["Population statistics","Sample statistics","Descriptive statistics","Inferential statistics"],"answer":"Descriptive statistics","solution":"Source answer key: question 3.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-128","module":"v5","type":"mcq","q":"A sports psychologist studies the effects of a six-week imagery intervention on an athlete's ability to execute a sport-specific skill such as penalty taking. How might the imagery variable be defined?","options":["Independent variable","Dependent variable","Outcome variable","Resultant variable"],"answer":"Independent variable","solution":"Source answer key: question 4.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-129","module":"v5","type":"mcq","q":"Five-point Likert scales (strongly disagree, disagree, neutral, agree, strongly agree) are frequently used to measure motivations and attitudes. A Likert scale is a:","options":["Discrete variable","Ordinal variable","Categorical variable","All of the above options (A, B and C)"],"answer":"All of the above options (A, B and C)","solution":"Source answer key: question 5.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Hard"},{"id":"sta-v5-130","module":"v5","type":"mcq","q":"In a 500m speed skating race, time results would be considered an example of which level of measurement?","options":["Nominal","Ordinal","Interval","Ratio"],"answer":"Ratio","solution":"Source answer key: question 6.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-131","module":"v5","type":"mcq","q":"IQ tests are standardized so that the mean score is 100 for the entire group of people who take the test. If you select a group of 50 who took the test, you probably would not get 100. What statistical concept explains the difference between the two means?","options":["Statistical error","Inferential error","Residual error","Sampling error"],"answer":"Sampling error","solution":"Source answer key: question 7.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-132","module":"v5","type":"mcq","q":"A researcher studies the factors that determine the number of children future couples decide to have. The variable 'number of children' is a:","options":["Discrete variable","Continuous variable","Categorical variable","Ordinal variable"],"answer":"Discrete variable","solution":"Source answer key: question 8.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-133","module":"v5","type":"mcq","q":"A teacher asks students to identify their favorite reality television show. What type of measurement scale do the different television shows make up?","options":["Nominal","Ordinal","Interval","Ratio"],"answer":"Nominal","solution":"Source answer key: question 9.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-134","module":"v5","type":"mcq","q":"The median is always:","options":["The most frequently occurring score in a data set","The middle score when results are ranked in order of magnitude","The same as the mean","The difference between the maximum and minimum scores"],"answer":"The middle score when results are ranked in order of magnitude","solution":"Source answer key: question 10.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-135","module":"v5","type":"mcq","q":"The seminar rooms in a library are identified by letters A to H. A researcher records the number of classes held in each room during the first semester. What kind of graph is appropriate for these data?","options":["Histogram","Scatterplot","Bar chart","Box plot"],"answer":"Bar chart","solution":"Source answer key: question 11.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-136","module":"v5","type":"mcq","q":"A histogram shows bars that tend to decrease in height from left to right. What is the shape of the distribution?","options":["Leptokurtic","Positively skewed","Negatively skewed","Normal"],"answer":"Positively skewed","solution":"Source answer key: question 12.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-137","module":"v5","type":"mcq","q":"What is the mean for the scores: 2, 5, 4, 1, 8?","options":["3","4","5","20"],"answer":"4","solution":"Source answer key: question 13.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-138","module":"v5","type":"mcq","q":"What is the mean for the scores in the frequency distribution: value 1 (f=1), 2 (f=3), 3 (f=3), 4 (f=2), 5 (f=1)?","options":["1.5","3.0","2.9","5.8"],"answer":"2.9","solution":"Source answer key: question 14.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-139","module":"v5","type":"mcq","q":"What is the median for the scores: 2, 5, 4, 1, 8?","options":["3.5","4","4.5","7"],"answer":"4","solution":"Source answer key: question 15.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-140","module":"v5","type":"mcq","q":"A teacher computed measures of central tendency for test scores. Which statement cannot be an accurate description?","options":["The majority of students had scores above the mean","The majority of students had scores above the median","The majority of students had scores above the mode","All of the above are false statements"],"answer":"The majority of students had scores above the median","solution":"Source answer key: question 16.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Hard"},{"id":"sta-v5-141","module":"v5","type":"mcq","q":"Which set of scores has the greatest variability (range)?","options":["2, 5, 8, 11","13, 13, 13, 13","20, 25, 26, 27","42, 43, 44, 45"],"answer":"2, 5, 8, 11","solution":"Source answer key: question 17.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-142","module":"v5","type":"mcq","q":"Which statement is the most accurate description of standard deviation?","options":["The total distance from the smallest to the highest score","The square root of the total distance from smallest to highest","The squared average distance between all scores and the mean","The average distance between a score and the mean"],"answer":"The average distance between a score and the mean","solution":"Source answer key: question 18.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-143","module":"v5","type":"mcq","q":"What is the variance for the scores: 2, 2, 2, 2, 2?","options":["0","2","4","25"],"answer":"0","solution":"Source answer key: question 19.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v4-016","module":"v4","type":"mcq","q":"Normally distributed data are normally referred to as:","options":["Bell-shaped","Asymmetrical","Skewed","Peaked"],"answer":"Bell-shaped","solution":"Source answer key: question 20.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v4-017","module":"v4","type":"mcq","q":"Take the formula Z=(X-mu)/sigma. What does this formula calculate?","options":["Confidence interval","Standard score","Standard error of the mean","Variance"],"answer":"Standard score","solution":"Source answer key: question 21.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v4-018","module":"v4","type":"mcq","q":"A population has mean mu=35 and SD sigma=5. After 3 points are added to every score, what are the new mean and SD?","options":["mu=35 and sigma=5","mu=35 and sigma=8","mu=38 and sigma=5","mu=38 and sigma=8"],"answer":"mu=38 and sigma=5","solution":"Source answer key: question 22.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v4-019","module":"v4","type":"mcq","q":"Which Z-score represents the location closest to the mean?","options":["Z=+0.5","Z=+1.0","Z=-1.5","Z=-0.3"],"answer":"Z=-0.3","solution":"Source answer key: question 23.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v4-020","module":"v4","type":"mcq","q":"If test scores have mean 26 and SD 4, what is the z-score for a score of 18?","options":["2","11","-2","-1.41"],"answer":"-2","solution":"Source answer key: question 24.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v4-021","module":"v4","type":"mcq","q":"A population has mu=50 and sigma=10. If scores are transformed into z-scores, the z-score population has mean and SD:","options":["mu=50 and sigma=10","mu=50 and sigma=1.96","mu=1 and sigma=0","mu=0 and sigma=1"],"answer":"mu=0 and sigma=1","solution":"Source answer key: question 25.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v4-022","module":"v4","type":"mcq","q":"If all possible samples of size n=30 are selected from a population with mu=80 and sigma=10 and the mean computed for each, what shape is expected for the distribution of sample means?","options":["Sample means tend to form a normal-shaped distribution whether the population is normal or not","Only if the population is normal","n=30 is too small to predict the shape","The means will be very close to 80 with little variability"],"answer":"Sample means tend to form a normal-shaped distribution whether the population is normal or not","solution":"Source answer key: question 26.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v4-023","module":"v4","type":"mcq","q":"What is a definition of the standard error?","options":["Standard deviation of the sample","Squared standard deviation","Standard deviation of sample means","Standard deviation of the population mean"],"answer":"Standard deviation of sample means","solution":"Source answer key: question 27.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-144","module":"v5","type":"mcq","q":"If a researcher sets a significance level of .05 (5%), what does this mean?","options":["Five times out of 100 a significant result will be found due to chance alone","95 times out of 100 a significant result will be found due to chance alone","Five times out of 100 a significant result is not due to chance","None of the above"],"answer":"Five times out of 100 a significant result will be found due to chance alone","solution":"Source answer key: question 28.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-145","module":"v5","type":"mcq","q":"When does a researcher risk a Type I error?","options":["Anytime the decision is 'fail to reject'","Anytime H0 is rejected","Anytime H1 is rejected","All of the above"],"answer":"Anytime H0 is rejected","solution":"Source answer key: question 29.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-146","module":"v5","type":"mcq","q":"Which assumptions are required for an independent t-test?","options":["Samples drawn from a normally distributed population","Homogeneity of variances","Data are interval or ratio scales","All the above assumptions are required"],"answer":"All the above assumptions are required","solution":"Source answer key: question 30.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-147","module":"v5","type":"mcq","q":"What is the correct decision if a t-statistic falls in the critical region?","options":["Reject H0","Fail to reject H0","Reject H1","Fail to reject H1"],"answer":"Reject H0","solution":"Source answer key: question 31.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Hard"},{"id":"sta-v5-148","module":"v5","type":"mcq","q":"How does the shape of the t distribution compare to the normal distribution?","options":["Taller and less spread out, especially when n is large","Taller and less spread out, especially when n is small","Flatter and more spread out, especially when n is large","Flatter and more spread out, especially when n is small"],"answer":"Flatter and more spread out, especially when n is small","solution":"Source answer key: question 32.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-149","module":"v5","type":"mcq","q":"How would you convert a two-tailed p=.284 to a one-tailed test?","options":[".284/2=.142",".284x2=.568",".284/0.05=5.68",".284x0.05=.0142"],"answer":".284/2=.142","solution":"Source answer key: question 33.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Hard"},{"id":"sta-v5-150","module":"v5","type":"mcq","q":"A report states t(35)=5.2, p<0.05. Which interpretation is correct?","options":["H0 was not rejected and Type I error probability <.05","H0 was not rejected and Type II error probability <.05","H0 was rejected and Type I error probability <.05","H0 was rejected and Type II error probability <.05"],"answer":"H0 was rejected and Type I error probability <.05","solution":"Source answer key: question 34.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-151","module":"v5","type":"mcq","q":"Which is true about a 95% confidence interval of the mean?","options":["95 out of 100 sample means fall within the limits","There is a 95% chance the population mean falls within the limits","95 out of 100 population means fall within the limits","There is a .05 probability the population mean falls within the limits"],"answer":"There is a 95% chance the population mean falls within the limits","solution":"Source answer key: question 35.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Hard"},{"id":"sta-v5-152","module":"v5","type":"mcq","q":"What effect would increasing the sample size have on a confidence interval?","options":["It would increase in size","It would decrease in size","It is unaffected by sample size","It could either increase or decrease"],"answer":"It would decrease in size","solution":"Source answer key: question 36.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-153","module":"v5","type":"mcq","q":"In an SPSS independent t-test, Levene's test gives p=.006. What can we infer?","options":["Means assumed unequal","Means assumed equal","Variances assumed unequal","Variances assumed equal"],"answer":"Variances assumed unequal","solution":"Source answer key: question 37.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Hard"},{"id":"sta-v5-154","module":"v5","type":"mcq","q":"What does ANOVA stand for?","options":["Analysis of values and averages","Analysis of variance","Analysis of variability","Analysis of non ordinal values"],"answer":"Analysis of variance","solution":"Source answer key: question 38.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-155","module":"v5","type":"mcq","q":"What kind of variables would you crosstabulate?","options":["Two or more categorical","Two or more continuous","One continuous and two or more categorical","One categorical and two or more continuous"],"answer":"Two or more categorical","solution":"Source answer key: question 39.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-156","module":"v5","type":"mcq","q":"Which test identifies a relationship between two categorical variables?","options":["Student's t-test","Spearman's correlation test","Pearson's Chi-square test","Mann-Whitney test"],"answer":"Pearson's Chi-square test","solution":"Source answer key: question 40.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-157","module":"v5","type":"mcq","q":"What does Cramer's V indicate?","options":["Significance of the Chi-square test","Expected frequencies in a contingency table","Common variability of two numeric variables","Strength of association between two categorical variables"],"answer":"Strength of association between two categorical variables","solution":"Source answer key: question 41.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Hard"},{"id":"sta-v5-158","module":"v5","type":"mcq","q":"What is the null hypothesis for a Chi-square test?","options":["Both variables have a significant relationship","Both variables have equal means","Both variables are independent","Both variables are dependent"],"answer":"Both variables are independent","solution":"Source answer key: question 42.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-159","module":"v5","type":"mcq","q":"What data are required for Pearson's correlation coefficient?","options":["Nominal","Ordinal","Interval","Ratio"],"answer":"Ratio","solution":"Source answer key: question 43.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-160","module":"v5","type":"mcq","q":"A Pearson correlation of r=-0.6 indicates:","options":["Increase in X accompanied by increase in Y; strong","Increase in X with increase in Y; moderate","Increase in X with decrease in Y; strong","Increase in X with decrease in Y; moderate"],"answer":"Increase in X with decrease in Y; moderate","solution":"Pearson r = -0.6: the negative sign means X and Y move in opposite directions; magnitude 0.6 is moderate.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Hard"},{"id":"sta-v5-161","module":"v5","type":"mcq","q":"A scatterplot shows:","options":["The frequency with which values appear","The average value of groups of data","Scores on one variable plotted against scores on a second","The proportion of data falling into categories"],"answer":"Scores on one variable plotted against scores on a second","solution":"Source answer key: question 45.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v4-024","module":"v4","type":"mcq","q":"R2 is the notation for:","options":["Coefficient of correlation","Coefficient of determination","Coefficient of variation","Coefficient of regression"],"answer":"Coefficient of determination","solution":"Source answer key: question 46.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v4-025","module":"v4","type":"mcq","q":"If the correlation between height and weight is +0.80, what proportion of variability in weight is explained by height?","options":["20%","36%","64%","80%"],"answer":"64%","solution":"Source answer key: question 47.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-162","module":"v5","type":"mcq","q":"In Y=a+bX, what does b denote?","options":["The regression coefficient, the slope of the line","The intercept with the Y-axis","The correlation coefficient","The score on X"],"answer":"The regression coefficient, the slope of the line","solution":"Source answer key: question 48.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-163","module":"v5","type":"mcq","q":"In a linear regression equation, what does a slope of 2.5 indicate?","options":["For every increase of 2.5 on the y-axis, increase of 5 on the x-axis","For every increase of 2.5 on the x-axis, equivalent increase on the y-axis","For every increase of 1.00 on the x-axis, increase of 2.5 on the y-axis","For every increase of 1.00 on the y-axis, decrease of 2.5 on the x-axis"],"answer":"For every increase of 1.00 on the x-axis, increase of 2.5 on the y-axis","solution":"Source answer key: question 49.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Medium"},{"id":"sta-v5-164","module":"v5","type":"mcq","q":"Which statement about the t-statistic in regression is NOT true?","options":["It tests whether b=0","It shows how well a predictor predicts the outcome","It shows whether a predictor makes a significant contribution","It equals the regression coefficient divided by its standard deviation"],"answer":"It equals the regression coefficient divided by its standard deviation","solution":"Source answer key: question 50.","source":"geo-ma-hg-basic-statistics-self-test.pdf","difficulty":"Hard"},{"id":"sta-v8-001","module":"v8","type":"fill","q":"In a hospital, three doctors D1, D2, D3 handle 40%, 35%, 25% of patients. Misdiagnosis probabilities are 0.05, 0.03, 0.07. A patient is misdiagnosed. Find P(D2 | misdiagnosis) (3 d.p).","answer":"0.219","solution":"P(M)=0.4(0.05)+0.35(0.03)+0.25(0.07)=0.043; P(D2|M)=0.35(0.03)/0.043=0.2186.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-002","module":"v8","type":"fill","q":"A factory has machines M1, M2, M3 producing 50%, 30%, 20% of output with defect rates 0.02, 0.04, 0.01. If an item is defective, find P(M1 | defective) (3 d.p).","answer":"0.417","solution":"P(D)=0.5(0.02)+0.3(0.04)+0.2(0.01)=0.024; P(M1|D)=0.01/0.024=0.4167.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-003","module":"v8","type":"fill","q":"In disease screening P(Disease)=0.05, P(Positive|Disease)=0.92, P(Positive|No Disease)=0.08. Find P(Disease | Positive) (3 d.p).","answer":"0.377","solution":"PPV=0.92(0.05)/[0.92(0.05)+0.08(0.95)]=0.046/0.122=0.3770.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-004","module":"v8","type":"fill","q":"A cybersecurity firm detects attacks from Internal (30%), External (50%), Unknown (20%) with detection probabilities 0.6, 0.8, 0.4. Given an attack is detected, find P(External | Detected) (3 d.p).","answer":"0.606","solution":"P(detected)=0.3(0.6)+0.5(0.8)+0.2(0.4)=0.66; P(E|D)=0.40/0.66=0.6061.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-005","module":"v8","type":"fill","q":"In a genetics study P(Carrier)=0.2, P(Trait|Carrier)=0.85, P(Trait|Non-carrier)=0.1. A person shows the trait. Find P(Carrier | Trait) (3 d.p).","answer":"0.680","solution":"P(T)=0.85(0.2)+0.1(0.8)=0.25; P(C|T)=0.17/0.25=0.6800.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-006","module":"v8","type":"fill","q":"In a vaccination campaign P(V=1|A=1)=0.80, P(V=1|A=0)=0.45, P(A=1)=0.30. Find P(A=1 | V=1) (3 d.p).","answer":"0.432","solution":"P(V)=0.8(0.3)+0.45(0.7)=0.555; P(A|V)=0.24/0.555=0.4324.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-007","module":"v8","type":"fill","q":"Technicians T1, T2, T3 handle 35%, 45%, 20% of samples with error rates 0.04, 0.02, 0.06. Night shifts increase errors by 60% and P(Night)=0.40. Find the overall P(error) (3 d.p).","answer":"0.043","solution":"Effective rates (1.24r) are 0.0496, 0.0248, 0.0744; P(E)=0.35(0.0496)+0.45(0.0248)+0.2(0.0744)=0.0434.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-008","module":"v8","type":"fill","q":"In the technician error problem above, given an error occurred find P(T2 | E) (3 d.p).","answer":"0.257","solution":"P(T2|E)=0.45(0.0248)/0.0434=0.01116/0.0434=0.2571.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-009","module":"v8","type":"fill","q":"A rare metabolic disorder is genetic with probability 1/6 or environmental with probability 5/6. If genetic both twins are always affected; if environmental each twin is independently affected with probability 0.40. Given both twins are affected, find P(Genetic | both affected) (3 d.p).","answer":"0.556","solution":"P(both)=1(1/6)+0.16(5/6)=0.30; P(G|both)=(1/6)/0.30=0.5556.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-010","module":"v8","type":"fill","q":"In a dental study 28% of children consume excessive sugar (E). Sugar consumers are 4 times more likely to develop cavities; P(C)=0.15. Find P(E | C) (3 d.p).","answer":"0.609","solution":"Let p=P(C|E'): 0.15=4p(0.28)+p(0.72)=1.84p, p=0.08152; P(E|C)=4p(0.28)/0.15=0.6087.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-011","module":"v8","type":"fill","q":"Cancer risk groups Low(50%), Medium(30%), High(20%) have P(Pos)=0.05, 0.15, 0.40. Peak season increases positive rates by 50% and P(Peak)=0.30. Find overall P(Positive) (3 d.p).","answer":"0.173","solution":"Effective rates (1.15r) are 0.0575, 0.1725, 0.46; P(Pos)=0.5(0.0575)+0.3(0.1725)+0.2(0.46)=0.1725.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-012","module":"v8","type":"fill","q":"In the cancer risk problem above, find P(High | Positive) (3 d.p).","answer":"0.533","solution":"Effective rates are 0.0575, 0.1725, 0.46; P(Pos)=0.1725; P(High|Pos)=0.2(0.46)/0.1725=0.5333.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-013","module":"v8","type":"fill","q":"In a blood donation campaign P(D=1|H=1)=0.70, P(D=1|H=0)=0.25, P(H=1)=0.60. Find P(H=1 | D=1) (3 d.p).","answer":"0.808","solution":"P(D)=0.7(0.6)+0.25(0.4)=0.52; P(H|D)=0.42/0.52=0.8077.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-014","module":"v8","type":"fill","q":"Three production lines L1(45%), L2(35%), L3(20%) have contamination rates 0.03, 0.05, 0.02. Maintenance increases rates by 80% and P(Maintenance)=0.25. Find overall P(contamination) (3 d.p).","answer":"0.042","solution":"Effective rates (1.2r) are 0.036, 0.060, 0.024; P(C)=0.45(0.036)+0.35(0.060)+0.2(0.024)=0.0420.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-015","module":"v8","type":"fill","q":"In the production-line contamination problem above, find P(L2 | contamination) (3 d.p).","answer":"0.500","solution":"Effective rates are 0.036, 0.060, 0.024; P(L2|C)=0.35(0.060)/0.0420=0.5000.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-016","module":"v8","type":"fill","q":"In a twin autism study the condition is hereditary with probability 1/4 or environmental with probability 3/4. If hereditary both twins are always diagnosed; if environmental each twin is independently diagnosed with probability 0.35. Given both are diagnosed, find P(Hereditary | both) (3 d.p).","answer":"0.731","solution":"P(both)=1(0.25)+0.1225(0.75)=0.341875; P(H|both)=0.25/0.341875=0.7313.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-017","module":"v8","type":"fill","q":"In an obesity study 35% of adults are inactive (I); inactive adults are 5 times more likely to be obese. P(O)=0.20. Find P(I | O) (3 d.p).","answer":"0.729","solution":"Let p=P(O|active): 0.20=5p(0.35)+p(0.65)=2.4p, p=0.0833; P(I|O)=5p(0.35)/0.20=0.7292.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-018","module":"v8","type":"fill","q":"A COVID centre classifies patients Low(45%), Medium(35%), High(20%) with P(Pos)=0.04, 0.18, 0.55. Festive season increases rates by 40% and P(Festive)=0.25. Find overall P(Positive) (3 d.p).","answer":"0.210","solution":"Effective rates are 1.1r: 0.044, 0.198, 0.605; P(Pos)=0.45(0.044)+0.35(0.198)+0.2(0.605)=0.2101.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-019","module":"v8","type":"fill","q":"In the COVID testing problem above, find P(High | Positive) (3 d.p).","answer":"0.576","solution":"P(H|Pos)=0.2(0.605)/0.2101=0.1210/0.2101=0.5759.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-020","module":"v8","type":"fill","q":"In a mental health campaign P(T=1|S=1)=0.65, P(T=1|S=0)=0.20, P(S=1)=0.40. Find P(S=1 | T=1) (3 d.p).","answer":"0.684","solution":"P(T)=0.65(0.4)+0.2(0.6)=0.38; P(S|T)=0.26/0.38=0.6842.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-021","module":"v8","type":"fill","q":"A water plant has filtration units F1(40%), F2(40%), F3(20%) with escape rates 0.02, 0.05, 0.03. Heavy rainfall increases rates by 90% and P(Rain)=0.30. Find overall P(contamination) (3 d.p).","answer":"0.043","solution":"Effective rates (1.27r) are 0.0254, 0.0635, 0.0381; P(C)=0.4(0.0254)+0.4(0.0635)+0.2(0.0381)=0.0432.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-022","module":"v8","type":"fill","q":"In the water contamination problem above, find P(F2 | contamination) (3 d.p).","answer":"0.588","solution":"P(F2|C)=0.4(0.0635)/0.0432=0.0254/0.0432=0.5882.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-023","module":"v8","type":"fill","q":"In a hereditary blindness study the condition is genetic with probability 1/3 or random mutation with probability 2/3. If genetic both siblings always affected; if mutation each sibling independently affected with probability 0.30. Given both affected, find P(Genetic | both) (3 d.p).","answer":"0.847","solution":"P(both)=1(1/3)+0.09(2/3)=0.39333; P(G|both)=0.3333/0.39333=0.8475.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-024","module":"v8","type":"fill","q":"In a nutrition study 42% of teenagers consume excessive fast food (F); consumers are 3 times more likely to have high cholesterol; P(H)=0.18. Find P(F | H) (3 d.p).","answer":"0.685","solution":"Let p=P(H|non-F): 0.18=3p(0.42)+p(0.58)=1.84p, p=0.09783; P(F|H)=3p(0.42)/0.18=0.6848.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-025","module":"v8","type":"fill","q":"Malaria patients are Urban(50%), Peri-urban(30%), Rural(20%) with P(Pos)=0.03, 0.12, 0.45. Rainy season increases rates by 65% and P(Rainy)=0.40. Find overall P(Positive) (3 d.p).","answer":"0.178","solution":"Effective rates (1.26r) are 0.0378, 0.1512, 0.567; P(Pos)=0.5(0.0378)+0.3(0.1512)+0.2(0.567)=0.1777.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-026","module":"v8","type":"fill","q":"In the malaria testing problem above, find P(Rural | Positive) (3 d.p).","answer":"0.638","solution":"Effective rates are 0.0378, 0.1512, 0.567; P(Rural|Pos)=0.2(0.567)/0.1777=0.6383.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-027","module":"v8","type":"fill","q":"In a family planning campaign P(C=1|E=1)=0.78, P(C=1|E=0)=0.32, P(E=1)=0.45. Find P(E=1 | C=1) (3 d.p).","answer":"0.666","solution":"P(C)=0.78(0.45)+0.32(0.55)=0.527; P(E|C)=0.351/0.527=0.6660.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-028","module":"v8","type":"fill","q":"A food company has units U1(30%), U2(50%), U3(20%) with spoilage rates 0.04, 0.02, 0.06. Summer increases rates by 75% and P(Summer)=0.35. Find overall P(spoilage) (3 d.p).","answer":"0.043","solution":"Effective rates (1.2625r) are 0.0505, 0.02525, 0.07575; P(S)=0.3(0.0505)+0.5(0.02525)+0.2(0.07575)=0.0429.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-029","module":"v8","type":"fill","q":"In the food spoilage problem above, find P(U1 | spoilage) (3 d.p).","answer":"0.353","solution":"P(U1|S)=0.3(0.0505)/0.0429=0.01515/0.0429=0.3529.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-030","module":"v8","type":"fill","q":"In a sickle cell study both parents are carriers with probability 1/5, only one parent with probability 4/5. If both are carriers both siblings are always affected; if one, each sibling independently affected with probability 0.25. Given both siblings affected, find P(both carriers | both affected) (3 d.p).","answer":"0.800","solution":"P(both)=1(0.2)+0.0625(0.8)=0.25; P(BC|both)=0.2/0.25=0.8000.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-031","module":"v8","type":"fill","q":"In a liver disease study 38% are heavy alcohol consumers (A), 6 times more likely to develop liver disease; P(L)=0.16. Find P(A | L) (3 d.p).","answer":"0.786","solution":"Let p=P(L|non-A): 0.16=6p(0.38)+p(0.62)=2.9p, p=0.05517; P(A|L)=6p(0.38)/0.16=0.7862.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-032","module":"v8","type":"fill","q":"TB screening classes Good(40%), Moderate(40%), Poor(20%) with P(Pos)=0.02, 0.10, 0.50. Winter increases rates by 55% and P(Winter)=0.35. Find overall P(Positive) (3 d.p).","answer":"0.177","solution":"Effective rates (1.1925r) are 0.02385, 0.11925, 0.59625; P(Pos)=0.4(0.02385)+0.4(0.11925)+0.2(0.59625)=0.1765.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-033","module":"v8","type":"fill","q":"In the TB screening problem above, find P(Poor | Positive) (3 d.p).","answer":"0.676","solution":"Effective rates are 0.02385, 0.11925, 0.59625; P(Poor|Pos)=0.2(0.59625)/0.1765=0.6757.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-034","module":"v8","type":"fill","q":"In a mammography campaign P(M=1|F=1)=0.82, P(M=1|F=0)=0.38, P(F=1)=0.25. Find P(F=1 | M=1) (3 d.p).","answer":"0.418","solution":"P(M)=0.82(0.25)+0.38(0.75)=0.49; P(F|M)=0.205/0.49=0.4184.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-035","module":"v8","type":"fill","q":"Mining sites S1(35%), S2(45%), S3(20%) have failure rates 0.05, 0.03, 0.07. Dry season increases rates by 85% and P(Dry)=0.45. Find overall P(failure) (3 d.p).","answer":"0.062","solution":"Effective rates (1.3825r) are 0.0691, 0.0415, 0.0968; P(F)=0.35(0.0691)+0.45(0.0415)+0.2(0.0968)=0.0622.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-036","module":"v8","type":"fill","q":"In the mining problem above, find P(S3 | failure) (3 d.p).","answer":"0.311","solution":"P(S3|F)=0.2(0.0968)/0.0622=0.01936/0.0622=0.3111.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-037","module":"v8","type":"fill","q":"In a Down syndrome study nondisjunction has probability 1/7, translocation 6/7. If nondisjunction both siblings always affected; if translocation each independently affected with probability 0.20. Given both affected, find P(nondisjunction | both) (3 d.p).","answer":"0.806","solution":"P(both)=1(1/7)+0.04(6/7)=0.17714; P(N|both)=0.14286/0.17714=0.8065.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-038","module":"v8","type":"fill","q":"In a hypertension study 44% are sedentary (S), 4 times more likely to develop hypertension; P(H)=0.22. Find P(S | H) (3 d.p).","answer":"0.759","solution":"Let p=P(H|active): 0.22=4p(0.44)+p(0.56)=2.32p, p=0.09483; P(S|H)=4p(0.44)/0.22=0.7586.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-039","module":"v8","type":"fill","q":"Cholera cases classified Pipe(50%), Borehole(30%), Stream(20%) with P(Inf)=0.02, 0.08, 0.55. Flooding increases rates by 70% and P(Flood)=0.30. Find overall P(infection) (3 d.p).","answer":"0.174","solution":"Effective rates 0.044, 0.176, 1.0*0.55... recomputed value = 0.1742.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-040","module":"v8","type":"fill","q":"In the cholera problem above, find P(Stream | infection) (3 d.p).","answer":"0.764","solution":"P(Stream|Inf)=0.2(0.6655)/0.1742=0.7639.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-041","module":"v8","type":"fill","q":"In an HIV prevention campaign P(P=1|A=1)=0.88, P(P=1|A=0)=0.30, P(A=1)=0.55. Find P(A=1 | P=1) (3 d.p).","answer":"0.782","solution":"P(P)=0.88(0.55)+0.30(0.45)=0.619; P(A|P)=0.484/0.619=0.7819.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-042","module":"v8","type":"fill","q":"Textile units W1(25%), W2(55%), W3(20%) have defect rates 0.06, 0.02, 0.08. Harmattan increases rates by 65% and P(Harmattan)=0.30. Find overall P(defect) (3 d.p).","answer":"0.050","solution":"Effective rates (1.195r) are 0.0717, 0.0239, 0.0956; P(D)=0.25(0.0717)+0.55(0.0239)+0.2(0.0956)=0.0502.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-043","module":"v8","type":"fill","q":"In the textile problem above, find P(W2 | defect) (3 d.p).","answer":"0.262","solution":"P(W2|D)=0.55(0.0239)/0.0502=0.01315/0.0502=0.2619.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-044","module":"v8","type":"fill","q":"In a cystic fibrosis study both parents carry the recessive gene with probability 1/8, spontaneous mutation 7/8. If carriers both siblings always affected; if mutation each independently affected with probability 0.15. Given both affected, find P(both carriers | both affected) (3 d.p).","answer":"0.864","solution":"P(both)=1(0.125)+0.0225(0.875)=0.14469; P(C|both)=0.125/0.14469=0.8639.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-045","module":"v8","type":"fill","q":"In a kidney disease study 36% are diabetic (D), 5 times more likely to develop kidney disease; P(K)=0.14. Find P(D | K) (3 d.p).","answer":"0.738","solution":"Let p=P(K|non-D): 0.14=5p(0.36)+p(0.64)=2.44p, p=0.05738; P(D|K)=5p(0.36)/0.14=0.7377.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-046","module":"v8","type":"fill","q":"Typhoid cases High(45%), Medium(35%), Low(20%) sanitation with P(Inf)=0.03, 0.12, 0.48. Dry season increases rates by 45% and P(Dry)=0.40. Find overall P(infection) (3 d.p).","answer":"0.179","solution":"Effective rates (1.18r) are 0.0354, 0.1416, 0.5664; P(Inf)=0.45(0.0354)+0.35(0.1416)+0.2(0.5664)=0.1788.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-047","module":"v8","type":"fill","q":"In the typhoid problem above, find P(Low | infection) (3 d.p).","answer":"0.634","solution":"P(Low|Inf)=0.2(0.5664)/0.1788=0.11328/0.1788=0.6337.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-048","module":"v8","type":"fill","q":"Two drugs A and B are administered independently with effectiveness probabilities 0.65 and 0.72. Find P(both effective) (3 d.p).","answer":"0.468","solution":"0.65x0.72=0.4680.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-049","module":"v8","type":"fill","q":"For the two independent drugs above, find P(at least one effective) (3 d.p).","answer":"0.902","solution":"1-P(both fail)=1-0.35x0.28=1-0.098=0.9020.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-050","module":"v8","type":"fill","q":"For the two independent drugs above, given Drug A was effective, find the probability that Drug B failed (3 d.p).","answer":"0.280","solution":"Independence gives P(B fails|A effective)=1-0.72=0.2800.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-051","module":"v8","type":"fill","q":"Loan applicants Very Low(20%), Low(35%), Medium(30%), High(15%) have default rates 0.01, 0.04, 0.12, 0.35. Recession increases rates by 120% and P(Recession)=0.25. Find overall P(default) (3 d.p).","answer":"0.136","solution":"Effective rates 0.022, 0.088, 0.264, 0.77; P(D)=0.2(0.022)+0.35(0.088)+0.3(0.264)+0.15(0.77)=0.1358.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-052","module":"v8","type":"fill","q":"In the loan default problem above, find P(High | default) (3 d.p).","answer":"0.502","solution":"P(H|D)=0.15(0.77)/0.1358=0.1155/0.1358=0.5024.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-053","module":"v8","type":"fill","q":"In the loan default problem above, find P(Very Low | default) (3 d.p).","answer":"0.019","solution":"P(VL|D)=0.2(0.022)/0.1358=0.0044/0.1358=0.0191.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-054","module":"v8","type":"fill","q":"A diabetes test has sensitivity 0.94, specificity 0.88, prevalence 0.09. Find P(Positive) (3 d.p).","answer":"0.194","solution":"P(+)=0.94(0.09)+0.12(0.91)=0.0846+0.1092=0.1938.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-055","module":"v8","type":"fill","q":"For the diabetes test above, find the positive predictive value P(Diabetic | Positive) (3 d.p).","answer":"0.437","solution":"PPV=0.0846/0.1938=0.4365.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-056","module":"v8","type":"fill","q":"For the diabetes test above, find the negative predictive value P(Non-diabetic | Negative) (3 d.p).","answer":"0.993","solution":"NPV=0.88(0.91)/(1-0.1938)=0.8008/0.8062=0.9933.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-057","module":"v8","type":"fill","q":"A patient undergoes three tests: P(Pass T1)=0.70, P(Pass T2|Pass T1)=0.80, P(Pass T2|Fail T1)=0.45. Find P(Pass Test 2) (3 d.p).","answer":"0.695","solution":"0.70(0.80)+0.30(0.45)=0.56+0.135=0.6950.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-058","module":"v8","type":"fill","q":"With P(Pass T3|Pass T2)=0.85 and P(Pass T3|Fail T2)=0.40, find P(Pass Test 3) (3 d.p).","answer":"0.713","solution":"0.695(0.85)+0.305(0.40)=0.59075+0.122=0.7127.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-059","module":"v8","type":"fill","q":"In the three-test sequence above, find P(Pass T1 | Fail T2) (3 d.p).","answer":"0.459","solution":"P(T1 and fail T2)=0.7(0.2)=0.14; P(fail T2)=0.305; 0.14/0.305=0.4590.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-060","module":"v8","type":"fill","q":"A researcher believes P(H)=0.30 with P(R|H)=0.85 and P(R|H')=0.20. Find the posterior P(H|R) after one experiment (3 d.p).","answer":"0.646","solution":"P(R)=0.85(0.3)+0.2(0.7)=0.395; P(H|R)=0.255/0.395=0.6456.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-061","module":"v8","type":"fill","q":"Using the posterior from the first experiment as the new prior, find P(H|R,R) after a second independent experiment (3 d.p).","answer":"0.886","solution":"0.85(0.6456)/[0.85(0.6456)+0.2(0.3544)]=0.5488/0.6197=0.8856.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-062","module":"v8","type":"fill","q":"A disease affects 7%. Two conditionally independent tests have P(T1+|D)=0.95, P(T1+|D')=0.08, P(T2+|D)=0.90, P(T2+|D')=0.06. Find P(both tests positive) (3 d.p).","answer":"0.064","solution":"0.07(0.95)(0.90)+0.93(0.08)(0.06)=0.05985+0.004464=0.0643.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-063","module":"v8","type":"fill","q":"For the two-test screening above, find P(D | both tests positive) (3 d.p).","answer":"0.931","solution":"0.07(0.95)(0.90)/0.0643=0.05985/0.06431=0.9306.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-064","module":"v8","type":"fill","q":"For the two-test screening above, find P(D | T1 positive only) (3 d.p).","answer":"0.472","solution":"P(T1+)=0.07(0.95)+0.93(0.08)=0.1379; P(D|T1+)=0.0665/0.1379=0.4720.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-065","module":"v8","type":"fill","q":"Flood risk: P(High)=0.25, P(Flood|High)=0.70, P(Flood|Low)=0.15. Find P(High | first flood) (3 d.p).","answer":"0.609","solution":"P(F)=0.7(0.25)+0.15(0.75)=0.2875; P(H|F)=0.175/0.2875=0.6087.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-066","module":"v8","type":"fill","q":"In the flood risk problem, using the first posterior as new prior, find P(High | second flood) (3 d.p).","answer":"0.879","solution":"0.7(0.6087)/[0.7(0.6087)+0.15(0.3913)]=0.4261/0.4848=0.8789.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-067","module":"v8","type":"fill","q":"In the flood risk problem, find P(High | third flood) (3 d.p).","answer":"0.971","solution":"Repeating the update once more gives 0.9713.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-068","module":"v8","type":"fill","q":"A hospital receives patients from District1(40%: 60% elderly), District2(35%: 30% elderly), District3(25%: 50% elderly). Find the overall proportion of elderly patients (3 d.p).","answer":"0.470","solution":"0.4(0.6)+0.35(0.3)+0.25(0.5)=0.24+0.105+0.125=0.4700.","source":"thatboy ACING STATS.pdf","difficulty":"Hard"},{"id":"sta-v8-069","module":"v8","type":"fill","q":"With P(ICU|Elderly)=0.35 and P(ICU|Young)=0.08, find overall P(ICU admission) (3 d.p).","answer":"0.207","solution":"0.47(0.35)+0.53(0.08)=0.1645+0.0424=0.2069.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-070","module":"v8","type":"fill","q":"In the hospital mixture problem, given ICU admission find P(District 1 | ICU) (3 d.p).","answer":"0.468","solution":"P(D1 and ICU)=0.4[0.6(0.35)+0.4(0.08)]=0.0968; 0.0968/0.2069=0.4679.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-071","module":"v8","type":"fill","q":"Chest pain causes: Heart Attack(0.30), Pulmonary Embolism(0.25), Acid Reflux(0.45). P(+|H)=0.92, P(+|E)=0.78, P(+|A)=0.15. Find P(Positive) (3 d.p).","answer":"0.538","solution":"0.3(0.92)+0.25(0.78)+0.45(0.15)=0.276+0.195+0.0675=0.5385.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-072","module":"v8","type":"fill","q":"In the chest pain problem, find P(Heart Attack | +) (3 d.p).","answer":"0.513","solution":"0.276/0.5385=0.5125.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-073","module":"v8","type":"fill","q":"In the chest pain problem, find P(Pulmonary Embolism | +) (3 d.p).","answer":"0.362","solution":"0.195/0.5385=0.3621.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-074","module":"v8","type":"fill","q":"In the chest pain problem, find P(Acid Reflux | +) (3 d.p).","answer":"0.125","solution":"0.0675/0.5385=0.1253.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-075","module":"v8","type":"fill","q":"A second independent test gives P(+|H)=0.88, P(+|E)=0.70, P(+|A)=0.10. Using posteriors from the first test as priors, find updated P(H | +,+) (3 d.p).","answer":"0.629","solution":"0.5125(0.88)/[0.5125(0.88)+0.3621(0.70)+0.1253(0.10)]=0.451/0.7171=0.6290.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-076","module":"v8","type":"fill","q":"Public health study: P(S)=0.30, P(P)=0.40 independent. P(L|S,P)=0.85, P(L|S,P')=0.60, P(L|S',P)=0.25, P(L|S',P')=0.05. Find P(Lung Disease) (3 d.p).","answer":"0.301","solution":"0.3(0.4)(0.85)+0.3(0.6)(0.6)+0.7(0.4)(0.25)+0.7(0.6)(0.05)=0.102+0.108+0.07+0.021=0.3010.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-077","module":"v8","type":"fill","q":"In the public health study above, find P(S | L) (3 d.p).","answer":"0.698","solution":"P(S and L)=0.102+0.108=0.21; 0.21/0.301=0.6977.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-078","module":"v8","type":"fill","q":"In the public health study above, find P(S and P | L) (3 d.p).","answer":"0.339","solution":"P(S and P and L)=0.102; 0.102/0.301=0.3389.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-079","module":"v8","type":"fill","q":"Pandemic model: Vaccination V(0.65), Comorbidity C(0.30), New variant N(0.20) are independent with eight conditional hospitalisation probabilities given in the question. Find overall P(Hospitalisation) (3 d.p).","answer":"0.097","solution":"Sum of the eight joint terms = 0.0968.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-080","module":"v8","type":"fill","q":"In the pandemic model above, find P(unvaccinated | hospitalised) (3 d.p).","answer":"0.691","solution":"Sum of hospitalised-and-unvaccinated terms / P(H) = 0.6912.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-081","module":"v8","type":"fill","q":"In the pandemic model above, find P(V', C, N | H) (3 d.p).","answer":"0.119","solution":"P(V',C,N,H)=0.35x0.30x0.20x0.55=0.01155; P(H)=0.09682; 0.01155/0.09682=0.1193.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-082","module":"v8","type":"fill","q":"Forensic DNA: prior P(Guilty)=0.15 with three independent pieces of evidence: P(E1|G)=0.95,P(E1|G')=0.05; P(E2|G)=0.88,P(E2|G')=0.10; P(E3|G)=0.76,P(E3|G')=0.18. Find P(G|E1) (3 d.p).","answer":"0.770","solution":"P(E1)=0.95(0.15)+0.05(0.85)=0.185; P(G|E1)=0.1425/0.185=0.7703.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-083","module":"v8","type":"fill","q":"In the forensic problem, update after Evidence 2 to find P(G|E1,E2) (3 d.p).","answer":"0.967","solution":"Using 0.7703 as prior: 0.88(0.7703)/[0.88(0.7703)+0.10(0.2297)]=0.9672.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-084","module":"v8","type":"fill","q":"In the forensic problem, update after Evidence 3 to find P(G|E1,E2,E3) (3 d.p).","answer":"0.992","solution":"Using 0.9672 as prior: 0.76(0.9672)/[0.76(0.9672)+0.18(0.0328)]=0.9920.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-085","module":"v8","type":"fill","q":"In the forensic problem, calculate the overall likelihood ratio across all three pieces of evidence (3 d.p).","answer":"705.96","solution":"LR=(0.95/0.05)x(0.88/0.10)x(0.76/0.18)=19x8.8x4.2222=705.9556.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-086","module":"v8","type":"fill","q":"A rare genetic disorder affects 2%. A test has P(+|Affected)=0.97, P(+|Unaffected)=0.04. Find P(Affected | Positive) at prevalence 2% (3 d.p).","answer":"0.331","solution":"PPV=0.97(0.02)/[0.97(0.02)+0.04(0.98)]=0.0194/0.0586=0.3311.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-087","module":"v8","type":"fill","q":"For the genetic disorder test, find P(Affected | Positive) if prevalence rises to 10% (3 d.p).","answer":"0.729","solution":"0.97(0.10)/[0.97(0.10)+0.04(0.90)]=0.097/0.133=0.7293.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-088","module":"v8","type":"fill","q":"For the genetic disorder test, find P(Affected | Positive) if prevalence rises to 25% (3 d.p).","answer":"0.890","solution":"0.97(0.25)/[0.97(0.25)+0.04(0.75)]=0.2425/0.2725=0.8899.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"}
