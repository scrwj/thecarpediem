,{"id":"sta-v8-089","module":"v8","type":"fill","q":"For the genetic disorder test, at what prevalence does P(Affected|+) first exceed 0.80? (3 d.p)","answer":"0.142","solution":"Solving 0.97p/(0.97p+0.04(1-p))=0.80 gives p=0.1416.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-090","module":"v8","type":"fill","q":"Cholera epidemic model: P(I1)=0.05, P(I2|I1)=0.80, P(I2|I1')=0.10, P(I3|I2)=0.75, P(I3|I2')=0.08. Find P(I2) (3 d.p).","answer":"0.135","solution":"0.05(0.80)+0.95(0.10)=0.04+0.095=0.1350.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-091","module":"v8","type":"fill","q":"In the cholera epidemic model, find P(I3) (3 d.p).","answer":"0.170","solution":"0.135(0.75)+0.865(0.08)=0.10125+0.0692=0.1704.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-092","module":"v8","type":"fill","q":"In the cholera epidemic model, a patient is infected at stage 3. Find P(I1 | I3) (3 d.p).","answer":"0.176","solution":"0.05(0.80)(0.75)/0.1704=0.03/0.1704=0.1761.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-093","module":"v8","type":"fill","q":"In the cholera epidemic model, find P(I1' | I3) and interpret (3 d.p).","answer":"0.824","solution":"1-0.1761=0.8239; about 82% of stage-3 infections did not begin at stage 1.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-094","module":"v8","type":"fill","q":"National surveillance: X(0.10), Y(0.06), Z(0.04), None(0.80) with P(R|X)=0.96, P(R|Y)=0.88, P(R|Z)=0.75, P(R|None)=0.05. Detection rates increase by 40% in P(Season)=0.30. Find overall P(R) accounting for season (3 d.p).","answer":"0.313","solution":"Normal P(R)=0.096+0.0528+0.03+0.04=0.2188; peak rates 0.976,0.928,0.85,0.07 give 0.2512; overall=0.7(0.2188)+0.3(0.2512)=0.3125.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-095","module":"v8","type":"fill","q":"In the surveillance system, find P(X | R) during the normal period (3 d.p).","answer":"0.439","solution":"0.096/0.2188=0.4388.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-096","module":"v8","type":"fill","q":"In the surveillance system, find P(Y | R) during the normal period (3 d.p).","answer":"0.241","solution":"0.0528/0.2188=0.2413.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-097","module":"v8","type":"fill","q":"In the surveillance system, find P(Z | R) during the normal period (3 d.p).","answer":"0.137","solution":"0.03/0.2188=0.1371.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-098","module":"v8","type":"fill","q":"In the surveillance system, find P(None | R) during the normal period (3 d.p).","answer":"0.183","solution":"0.04/0.2188=0.1828.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-099","module":"v8","type":"fill","q":"In the surveillance system, find P(X | R) during peak season (3 d.p).","answer":"0.184","solution":"0.10(0.976)/0.2512=0.0976/0.2512=0.1837.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v8-100","module":"v8","type":"fill","q":"In the surveillance system, a confirmatory test gives P(R2|X)=0.92, P(R2|Y)=0.80, P(R2|Z)=0.65, P(R2|None)=0.02. Using normal-period posteriors as priors, find updated P(X | R,R2) (3 d.p).","answer":"0.585","solution":"0.4388(0.92)/[0.4388(0.92)+0.2413(0.80)+0.1371(0.65)+0.1828(0.02)]=0.5854.","source":"thatboy ACING STATS.pdf","difficulty":"Devil Mode"},{"id":"sta-v6-001","module":"v6","type":"mcq","q":"In a study of antibiotic sales without prescription across pharmacies in a region, the individual is:","options":["An antibiotic tablet","A customer","A pharmacy","A prescription"],"answer":"A pharmacy","solution":"The individual is the unit on which data are collected; here data are collected on each pharmacy.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-002","module":"v6","type":"mcq","q":"A parameter differs from a statistic in that a parameter is:","options":["Unknown and varies randomly","Computed from the sample","Fixed but usually unknown","Known but varies by sample"],"answer":"Fixed but usually unknown","solution":"Statistics vary between samples and are known once measured; parameters are fixed but typically unknown.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-003","module":"v6","type":"mcq","q":"A pharmacist interviews 150 randomly selected outpatients to estimate the proportion who take their drugs as prescribed. The sample proportion is denoted by:","options":["mu, the population mean","p-hat (p̂)","x-bar, the sample mean","p, the population proportion"],"answer":"p-hat (p̂)","solution":"p-hat is the sample statistic; p (or pi) is the population parameter.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-004","module":"v6","type":"mcq","q":"A doctor randomly selects hypertensive patients at one teaching hospital. Without extra assumptions, the results apply to:","options":["Hypertensive adults at that hospital","All hypertensive patients in the country","All adults in the surrounding region","Patients at any other hospital"],"answer":"Hypertensive adults at that hospital","solution":"Inference is limited to the population from which the sample was drawn.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-005","module":"v6","type":"mcq","q":"A dentist examines 300 randomly selected 12-year-olds in a district and records each child's DMFT score. The INDIVIDUAL is:","options":["A 12-year-old child","The 300 children examined","All 12-year-olds in the district","The DMFT score"],"answer":"A 12-year-old child","solution":"The individual is the unit on which data are collected.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-006","module":"v6","type":"mcq","q":"A study samples 165 of 4,200 pregnant women in a municipality. Which is correct?","options":["N=165 and sigma=4,200","N=4,200 and n=165","N=4,200 and s=165 (sample SD)","n=4,200 and N=165 respectively"],"answer":"N=4,200 and n=165","solution":"N is the population size and n the sample size.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-007","module":"v6","type":"mcq","q":"In the DMFT study, the PARAMETER is:","options":["Mean DMFT of the 300 children examined","Mean DMFT of all district 12-year-olds","The 300 randomly selected children","The DMFT score of each child"],"answer":"Mean DMFT of all district 12-year-olds","solution":"The parameter describes the population, not the sample.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-008","module":"v6","type":"mcq","q":"Two researchers each sample 100 patients from the same hospital and their mean BPs are 130 and 134 mmHg. The best explanation is:","options":["The parameter changed between samples","Sampling variability","The population is unknown to both","One computed a parameter, the other a statistic"],"answer":"Sampling variability","solution":"A statistic varies from sample to sample while the parameter stays fixed.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-009","module":"v6","type":"mcq","q":"Which pair correctly gives the notation for the standard deviation of a SAMPLE and of a POPULATION?","options":["x-bar and mu","sigma and s","s^2 and sigma^2","s and sigma"],"answer":"s and sigma","solution":"Sample SD is s; population SD is sigma. Variances are s^2 and sigma^2.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-010","module":"v6","type":"mcq","q":"A researcher codes sex as 1=male and 2=female and reports a mean sex code of 1.6 for 50 patients. What is the main flaw?","options":["Codes of 1 and 2 are too small; values above 10 are required before any mean can be computed","The mean should have been replaced by the sum, since qualitative codes can never be divided","Sex is a quantitative variable, so the mean is valid but must be rounded","Sex remains a qualitative variable despite numeric codes, so the mean has no meaningful interpretation"],"answer":"Sex remains a qualitative variable despite numeric codes, so the mean has no meaningful interpretation","solution":"Numeric codes do not change a qualitative variable into a quantitative one.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-011","module":"v6","type":"mcq","q":"Which of the following is a PARAMETER?","options":["Number of adults screened in the survey","Proportion hypertensive among the 400 adults screened","Proportion hypertensive among all district adults","Mean age of the 400 adults screened"],"answer":"Proportion hypertensive among all district adults","solution":"A parameter describes the whole population; the others describe the sample.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-012","module":"v6","type":"mcq","q":"Which statement about quantitative and qualitative data is accurate?","options":["Qualitative data are always collected by interview, while quantitative data are always collected by questionnaire","Quantitative data come only from experiments, whereas qualitative data come only from observational studies","Quantitative data express amounts that can be measured or counted; qualitative data describe categories or attributes","Qualitative data can be averaged meaningfully, but quantitative data can only be placed in categories"],"answer":"Quantitative data express amounts that can be measured or counted; qualitative data describe categories or attributes","solution":"The distinction concerns the nature of the values, not the collection method.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-013","module":"v6","type":"mcq","q":"Nurses at a polyclinic fill a malaria register daily for a year; the records are later summarised in a bar chart. Which statement fits?","options":["The bar chart is the data, and the register entries are only a sample taken from it","The register entries are the raw material (data); the bar chart merely presents results derived from them","Neither is data, since data arise only from a designed laboratory experiment","Only the bar chart counts as data because it displays numbers rather than words"],"answer":"The register entries are the raw material (data); the bar chart merely presents results derived from them","solution":"Data are the raw material of statistics; charts and tables are products of analysis.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-014","module":"v6","type":"mcq","q":"At Komfo Anokye Teaching Hospital a researcher records haemoglobin level (g/dL), ABO blood group and ward of admission for 120 inpatients. Which classification is correct?","options":["Haemoglobin level and blood group are quantitative, while ward alone is qualitative","All three are quantitative because each was recorded directly from patients","Haemoglobin level is quantitative, whereas blood group and ward of admission are qualitative","Haemoglobin level and ward are qualitative, while blood group is quantitative"],"answer":"Haemoglobin level is quantitative, whereas blood group and ward of admission are qualitative","solution":"Haemoglobin is measured on a scale; blood group and ward are categories.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-015","module":"v6","type":"mcq","q":"A triage nurse records pain severity (none, mild, moderate, severe) and the number of antenatal visits for each woman. Which statement is correct?","options":["Both are qualitative because neither was obtained from a laboratory instrument","Pain severity is quantitative, while number of visits is qualitative","Both are quantitative because each can be ranked, ordered or counted","Pain severity is qualitative, while number of antenatal visits is quantitative"],"answer":"Pain severity is qualitative, while number of antenatal visits is quantitative","solution":"Pain severity is a descriptive category; number of visits is a count.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-016","module":"v6","type":"mcq","q":"A study of 200 diabetic patients records age, fasting blood glucose, sex and type of treatment for every patient. Which statement is correct?","options":["There are 200 variables, one for each patient","There are four variables, each measured on 200 individuals","There is a single variable, diabetes, observed 800 times","There are four variables, all quantitative in nature"],"answer":"There are four variables, each measured on 200 individuals","solution":"Variables are the recorded characteristics; patients are the individuals. Sex and treatment type are qualitative.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-017","module":"v6","type":"mcq","q":"Which statement best defines data as used in probability and statistics?","options":["The conclusions and recommendations reached once analysis is complete","Recorded observations or measurements from individuals, objects or events in a study","Only numerical values already organised into tables, charts or graphs","A summary statistic such as a mean or proportion computed from a sample"],"answer":"Recorded observations or measurements from individuals, objects or events in a study","solution":"Data are the recorded observations or measurements: the raw material of statistics.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-018","module":"v6","type":"mcq","q":"From each outpatient folder an assistant extracts body temperature (degrees C), number of tablets prescribed, tribe, and insurance status. How many quantitative variables are there?","options":["Two: body temperature and number of tablets prescribed","One: only body temperature, since tablets are merely counted","Three: temperature, tablets and insurance status","Four: every item was written down as a recorded entry"],"answer":"Two: body temperature and number of tablets prescribed","solution":"Temperature (measured) and tablets (counted) are quantitative; tribe and insurance status are categories.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-019","module":"v6","type":"mcq","q":"A research assistant extracting variables from patient folders produces four lists. Which list contains ONLY quantitative variables?","options":["Systolic blood pressure, body mass index, number of children","Blood group, body mass index, age in completed years","Occupation, body weight, height in centimetres","Religion, pulse rate, number of hospital admissions"],"answer":"Systolic blood pressure, body mass index, number of children","solution":"Each other list contains at least one categorical variable.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-020","module":"v6","type":"mcq","q":"HIV status (positive or negative) is best classified as:","options":["Qualitative, ordinal (ranked grades)","Quantitative, continuous (measured)","Qualitative, nominal (binary)","Quantitative, discrete (counted values)"],"answer":"Qualitative, nominal (binary)","solution":"A nominal variable with two categories is binary (dichotomous).","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-021","module":"v6","type":"mcq","q":"Which of the following is CONTINUOUS?","options":["Salivary pH","Number of falls on a ward","Number of decayed teeth","Number of beds occupied"],"answer":"Salivary pH","solution":"Salivary pH is measured on a scale; the others are counts.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-022","module":"v6","type":"mcq","q":"Which of the following is DISCRETE?","options":["Herbal products used by a patient (count)","Dose of herbal extract given in mg","Time to symptom relief in hours","Parasite density per microlitre of blood sample"],"answer":"Herbal products used by a patient (count)","solution":"If you count it, it is discrete; if you measure it on a scale, it is continuous.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-023","module":"v6","type":"mcq","q":"Which of the following is a QUALITATIVE variable?","options":["Body temperature measured in degrees C","Number of children vaccinated at a clinic","Level of education attained","Number of years spent in formal school"],"answer":"Level of education attained","solution":"Level of education (basic, secondary, tertiary) is an ordered category; the rest are numerical.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-024","module":"v6","type":"mcq","q":"In a study that includes only hypertensive patients, which is a CONSTANT?","options":["Age of the patient","Sex of the patient","Hypertension status","Systolic blood pressure"],"answer":"Hypertension status","solution":"A constant has the same value for everyone in the study.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-025","module":"v6","type":"mcq","q":"Which is the DOMAIN of the variable blood group?","options":["All patients tested in the study","Any value between 0 and 100","The number of patients in each group","A, B, AB, O"],"answer":"A, B, AB, O","solution":"The domain is the set of values a variable can take.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-026","module":"v6","type":"mcq","q":"A systolic BP of 138 mmHg recorded for patient 3 is:","options":["An observation","A constant of the study","A variable of the study","A parameter of the population"],"answer":"An observation","solution":"An observation is the value of a variable recorded for one individual.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-027","module":"v6","type":"mcq","q":"Blood groups are coded 1=A, 2=B, 3=AB, 4=O. Which statement is true?","options":["Coding makes it a discrete quantitative variable","Coding makes it an ordinal variable","Still nominal; the codes are only labels","Blood group becomes continuous when coded"],"answer":"Still nominal; the codes are only labels","solution":"Coding with numbers does not turn a qualitative variable into a quantitative one.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-028","module":"v6","type":"mcq","q":"Age recorded in completed years is best classified as:","options":["Ordinal, because older people rank higher","Nominal, because each age is a label","Discrete, because it is recorded as whole numbers","Continuous; rounding does not make it discrete"],"answer":"Continuous; rounding does not make it discrete","solution":"Rounding a measurement does not make a continuous variable discrete.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-029","module":"v6","type":"mcq","q":"Which of the following is an ORDINAL variable?","options":["Gingivitis grade (none to severe)","Type of dental restoration (amalgam, composite)","Sickle cell status (AA, AS, SS)","Route of drug administration (oral, IV, topical)"],"answer":"Gingivitis grade (none to severe)","solution":"The categories have a natural order.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-030","module":"v6","type":"mcq","q":"In a wound-care study, 'number of days until complete healing' is recorded for 40 patients. A student labels it qualitative because 'healing' describes a condition. Evaluate.","options":["Correct: any variable describing a clinical condition is qualitative","Correct: time variables are qualitative because days cannot be measured with an instrument","Incorrect: the variable is the number of days, a measured numerical quantity, so it is quantitative","Incorrect: it is neither type, because time-to-event outcomes fall outside both classes"],"answer":"Incorrect: the variable is the number of days, a measured numerical quantity, so it is quantitative","solution":"The recorded value is a number of days, hence quantitative.","source":"WhatsApp Image 2026-11-23 (Moodle quiz screenshots)","difficulty":"Medium"},{"id":"sta-v6-031","module":"v6","type":"mcq","q":"In a frequency polygon, points are plotted at:","options":["Class marks","Frequencies","Cumulative frequencies","Class boundaries"],"answer":"Class marks","solution":"A frequency polygon joins the frequencies plotted against class midpoints (class marks).","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-032","module":"v6","type":"mcq","q":"In survey design, ambiguous wording mainly affects:","options":["Probability rules","Validity","Mean","Variance"],"answer":"Validity","solution":"Ambiguous questions measure the wrong construct, threatening validity.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-033","module":"v6","type":"mcq","q":"Which of these is true for negatively skewed data?","options":["Mean < Mode >= Median","Mean > Median > Mode","Mode > Median > Mean","Mean <= Median <= Mode"],"answer":"Mode > Median > Mean","solution":"A long left tail pulls the mean below the median, which lies below the mode.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-034","module":"v6","type":"mcq","q":"The range is strongly affected by outliers.","options":["True","False"],"answer":"True","solution":"The range uses only the extreme values, so a single outlier changes it dramatically.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-035","module":"v6","type":"mcq","q":"You want the probability that a person has a disease given a positive test result. Which concept is mainly required?","options":["Bayes' Theorem","Complements","Independence","Classical probability"],"answer":"Bayes' Theorem","solution":"P(disease | positive) is a posterior probability obtained with Bayes' theorem.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-036","module":"v6","type":"mcq","q":"The probability that a patient came from a clinic given a positive result is an example of:","options":["Joint probability only","Prior probability","Marginal probability","Posterior probability"],"answer":"Posterior probability","solution":"A conditional probability computed after observing evidence is a posterior probability.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-037","module":"v6","type":"mcq","q":"Which statements fall under inferential statistics? I. Smoking rate 11.3% in 2024. II. Vaccination programs will decrease measles incidence. III. COVID cases reported last month 45,230. IV. Obesity projected to reach 25% by 2030.","options":["I and III","II and IV","I, III and IV","II only"],"answer":"II and IV","solution":"II makes a causal claim and IV a projection; I and III are descriptive facts.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-038","module":"v6","type":"mcq","q":"In highly skewed data, the best measure of central tendency is:","options":["Mean","Range","Midrange","Median"],"answer":"Median","solution":"The median is resistant to extreme values and skew.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-039","module":"v6","type":"mcq","q":"Complements are mainly used to:","options":["Compute means","Fit regression","Simplify 'at least one' problems","Estimate variance"],"answer":"Simplify 'at least one' problems","solution":"P(at least one) = 1 - P(none), which is the complement rule.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-040","module":"v6","type":"mcq","q":"Ethical analysis requires results to be:","options":["Reproducible","Selective","Manipulated","Hidden"],"answer":"Reproducible","solution":"Transparent, reproducible analysis is an ethical requirement.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-041","module":"v6","type":"mcq","q":"What is the set of boundaries for 6.78 kg?","options":["6.68 - 6.88","6.70 - 6.80","6.775 - 6.785","6.779 - 6.681"],"answer":"6.775 - 6.785","solution":"To 2 d.p., values 6.775 to 6.785 round to 6.78.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-042","module":"v6","type":"mcq","q":"Probabilities obtained from patient records are:","options":["Classical probability","Empirical probability","Theoretical probability","Impossible to classify"],"answer":"Empirical probability","solution":"Empirical probability is based on observed relative frequencies.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-043","module":"v6","type":"mcq","q":"If events A and B are mutually exclusive and both have non-zero probability, then:","options":["P(A union B)=P(A)P(B)","P(A|B)=P(A)","P(A intersection B)=0","P(A union B)=1"],"answer":"P(A intersection B)=0","solution":"Mutually exclusive events cannot occur together.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-044","module":"v6","type":"mcq","q":"A positive diagnostic test does not necessarily imply high disease probability because:","options":["Mean changes","Prevalence matters","Sample size decreases","Variance increases"],"answer":"Prevalence matters","solution":"PPV depends strongly on disease prevalence (Bayes' theorem).","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-045","module":"v6","type":"mcq","q":"In a boxplot, if the median lies to the right of the centre of the box, the distribution is:","options":["Positively skewed","Negatively skewed","Symmetric","Bimodal"],"answer":"Negatively skewed","solution":"A median to the right indicates a longer lower tail (negative skew).","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-046","module":"v6","type":"fill","q":"Using the cholesterol frequency table (140-149:4, 150-159:7, 160-169:11, 170-179:13, 180-189:9, 190-199:6), find the median to 1 d.p.","answer":"171.8","solution":"N=50; median class 170-179 with L=169.5, CF=22, f=13, h=10: 169.5+(25-22)/13x10=171.8.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-047","module":"v6","type":"fill","q":"Using the cholesterol frequency table above, find the mode to 1 d.p.","answer":"172.8","solution":"Modal class 170-179: 169.5+(13-11)/(2x13-11-9)x10=172.8.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-048","module":"v6","type":"fill","q":"Using the cholesterol frequency table above, find the sample variance to 1 d.p.","answer":"210.0","solution":"Using midpoints 144.5,...,194.5, the sample variance is about 209.96, i.e. 210.0.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Devil Mode"},{"id":"sta-v6-049","module":"v6","type":"mcq","q":"In a study of hypertension (22%) and diabetes (28%), the probability that a person has both is:","options":["Between 0% and 22%","Exactly 22%","At least 28%","Cannot be determined"],"answer":"Between 0% and 22%","solution":"P(A and B) lies between max(0, 0.22+0.28-1)=0 and min(0.22,0.28)=0.22.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-050","module":"v6","type":"fill","q":"According to an epidemiological study, individuals with high blood pressure are 11 times less likely to develop stroke than those with normal BP. If 28% of adults have high BP, find P(high BP | stroke) to 2 d.p.","answer":"0.03","solution":"Let p=P(stroke|normal). P(H|stroke)=0.28p/[0.28p+0.72(11p)]=0.28/8.2=0.034 ~ 0.03.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-051","module":"v6","type":"fill","q":"A nurse administers medication correctly with probability 0.85 if fully trained and 0.30 if untrained. If 60% of nurses are fully trained, find P(correct administration) to 2 d.p.","answer":"0.63","solution":"0.60(0.85)+0.40(0.30)=0.51+0.12=0.63.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-052","module":"v6","type":"fill","q":"Three vaccination centres C1, C2, C3 vaccinate 30%, 40%, 30% of patients. Adverse reaction rates are g1, g2=1.8g1, g3=1.5g1 with overall rate 0.03. Find g1 (3 d.p).","answer":"0.020","solution":"0.03=g1(0.30+0.40x1.8+0.30x1.5)=1.47g1, so g1=0.0204.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-053","module":"v6","type":"fill","q":"In the vaccination-centre problem above, find g2 (3 d.p).","answer":"0.037","solution":"g2=1.8 x 0.0204=0.0367.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-054","module":"v6","type":"fill","q":"In the vaccination-centre problem above, find g3 (3 d.p).","answer":"0.031","solution":"g3=1.5 x 0.0204=0.0306.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-055","module":"v6","type":"fill","q":"In the vaccination-centre problem above, find P(C1 | adverse reaction) (3 d.p).","answer":"0.204","solution":"P(C1|A)=0.30(0.0204)/0.03=0.2041.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-056","module":"v6","type":"fill","q":"A genetic mutation has prior probability 0.2. Given the mutation, P(severe condition)=0.6; without it, P(severe)=0.25. Given a child has the severe form, find P(mutation | severe) (3 d.p).","answer":"0.375","solution":"0.6(0.2)/[0.6(0.2)+0.25(0.8)]=0.12/0.32=0.375.","source":"Coded Stats midsem_20260313_173000.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-057","module":"v6","type":"mcq","q":"Which measure describes how spread out the values in a dataset are?","options":["Mean","Mode","Median","Standard Deviation"],"answer":"Standard Deviation","solution":"Standard deviation quantifies spread around the mean.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-058","module":"v6","type":"mcq","q":"The interquartile range (IQR) is calculated as:","options":["Q2-Q1","Q3-Q1","Q1-Q3","Q3+Q1"],"answer":"Q3-Q1","solution":"IQR is the difference between the third and first quartiles.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-059","module":"v6","type":"mcq","q":"The ages of five students are 10, 12, 14, 16, 18. If the mean is 14, what is the standard deviation (1 d.p)?","options":["3.2","4.2","2.0","2.8"],"answer":"2.8","solution":"Population variance=(16+4+0+4+16)/5=8; SD=sqrt(8)=2.8.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-060","module":"v6","type":"mcq","q":"Which of the following correctly describes the first quartile (Q1)?","options":["It is the value below which 25% of the data fall","It is the middle value of the dataset","It is always equal to the mode","It is the same as the median"],"answer":"It is the value below which 25% of the data fall","solution":"Q1 is the 25th percentile.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-061","module":"v6","type":"mcq","q":"A dataset with a right-skewed distribution has a mean that is:","options":["Greater than the median","Less than the median","Equal to the median","Zero"],"answer":"Greater than the median","solution":"A long right tail pulls the mean above the median.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-062","module":"v6","type":"mcq","q":"If a dataset has kurtosis greater than 3, the distribution is:","options":["Negatively skewed","Flatter than normal","Normal","More peaked than normal"],"answer":"More peaked than normal","solution":"Excess kurtosis above 3 (or positive excess kurtosis) indicates a leptokurtic, heavy-tailed peaked distribution.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-063","module":"v6","type":"mcq","q":"If a dataset has two values that appear most frequently, the dataset is said to be:","options":["Unimodal","Bimodal","Multimodal","Trimodal"],"answer":"Bimodal","solution":"Two modes means bimodal.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-064","module":"v6","type":"mcq","q":"If mean=40, median=35 and mode=30, what type of skewness does the distribution have?","options":["Negatively skewed","Zero skewness","Positively skewed","Symmetric"],"answer":"Positively skewed","solution":"Mean > median > mode indicates positive (right) skew.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-065","module":"v6","type":"mcq","q":"In a class of 50 students, a student ranks 10th. What percentile does the student belong to?","options":["20th percentile","80th percentile","60th percentile","90th percentile"],"answer":"20th percentile","solution":"10/50=20%.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-066","module":"v6","type":"mcq","q":"Which graphical method is most useful for identifying outliers?","options":["Bar chart","Boxplot","Pie chart","Histogram"],"answer":"Boxplot","solution":"Boxplots display outliers explicitly as points beyond the whiskers.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-067","module":"v6","type":"mcq","q":"The expected value of X, where X takes values 1,2,3,4,5 with equal probability, is:","options":["3","4","3.5","2.5"],"answer":"3","solution":"E(X)=(1+2+3+4+5)/5=3.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-068","module":"v6","type":"mcq","q":"The probability mass function (PMF) of a random variable X gives:","options":["The expected value of X","The probability of a continuous range of X","The cumulative probability","The probability of each possible value of X"],"answer":"The probability of each possible value of X","solution":"A PMF assigns probability to each discrete value.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-069","module":"v6","type":"mcq","q":"If X takes values 2, 4, 6 with probabilities 0.2, 0.5, 0.3 respectively, find E(X^2).","options":["19.6","23.1","12","18"],"answer":"19.6","solution":"E(X^2)=4(0.2)+16(0.5)+36(0.3)=0.8+8+10.8=19.6.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-070","module":"v6","type":"mcq","q":"If Var(X)=4 and Var(Y)=9, and X and Y are independent, find Var(3X-2Y).","options":["24","48","72","12"],"answer":"72","solution":"Var(3X-2Y)=9Var(X)+4Var(Y)=9(4)+4(9)=72.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-071","module":"v6","type":"mcq","q":"Let X have PDF f(x)=k(4-x) for 0<=x<=4. Find P(1<X<=3.5).","options":["0.75","0.55","0.46","0.68"],"answer":"0.55","solution":"k=1/8; integral from 1 to 3.5 of (4-x)dx = [4x-x^2/2]=4.375; P=4.375/8=0.5469 ~ 0.55.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Devil Mode"},{"id":"sta-v6-072","module":"v6","type":"mcq","q":"Find Var(X) for the distribution X=1,2,3,4 with P(X=x)=0.2,0.3,0.4,0.1.","options":["1.21","0.81","2.3","1.01"],"answer":"0.81","solution":"E(X)=2.4, E(X^2)=6.6, Var=6.6-5.76=0.81.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-073","module":"v6","type":"mcq","q":"A discrete random variable is characterized by:","options":["Having a countable number of possible values","None of the above","Having a probability density function","Taking any value in an interval"],"answer":"Having a countable number of possible values","solution":"Discrete variables have countable values.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-074","module":"v6","type":"mcq","q":"If E(X)=5 and E(Y)=3, then E(2X+Y) is:","options":["11","10","13","15"],"answer":"13","solution":"2(5)+3=13.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-075","module":"v6","type":"mcq","q":"A restaurant menu has 3 shells, 4 meats, 3 cheeses and 5 salsas. How many distinct tacos can be ordered?","options":["180","4","15","24"],"answer":"180","solution":"3x4x3x5=180.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Medium"},{"id":"sta-v6-076","module":"v6","type":"mcq","q":"In a college, 40% are Art students and the rest Science. 70% of Art and 80% of Science students passed. A failed student is chosen. Find P(Science | failed).","options":["0.37","0.5","0.76","0.24"],"answer":"0.5","solution":"P(S|fail)=0.6(0.2)/[0.4(0.3)+0.6(0.2)]=0.12/0.24=0.5.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-077","module":"v6","type":"mcq","q":"How many five-digit numbers can be formed from digits 5,6,7,8,9,0 without repetition?","options":["240","64","120","600"],"answer":"600","solution":"First digit has 5 choices (not 0), then 5x4x3x2=120; total 600.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Hard"},{"id":"sta-v6-078","module":"v6","type":"mcq","q":"Given the distribution X=8,12,16,20,24 with probabilities 1/8, 1/6, 3/8, 1/4, 1/12, what is Var(X)?","options":["21","23","22","20"],"answer":"20","solution":"E(X)=16, E(X^2)=276; Var=276-256=20.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Devil Mode"},{"id":"sta-v6-079","module":"v6","type":"mcq","q":"A continuous RV Z has PDF f(x)=k(x-1) for 2<=z<=4. Find the variance of Z.","options":["19/6","31/3","11/36","16/36"],"answer":"11/36","solution":"k=1/4, E(Z)=19/6, E(Z^2)=31/3; Var=31/3-(19/6)^2=11/36.","source":"Statistics trial - Benjamin Abbam.pdf (Moodle screenshots)","difficulty":"Devil Mode"},{"id":"sta-v7-001","module":"v7","type":"mcq","q":"Given P(A)=0.59, P(B)=0.30 and P(A intersection B)=0.21, find P(A union B).","options":["A. 0.68","B. 0.38","C. 0.79","D. 0.32","E. none of these"],"answer":"A. 0.68","solution":"P(A union B)=0.59+0.30-0.21=0.68.","source":"stats..pasco_.pdf","difficulty":"Medium"},{"id":"sta-v7-002","module":"v7","type":"mcq","q":"Given P(A)=0.59, P(B)=0.30 and P(A intersection B)=0.21, find P(A intersection B').","options":["A. 0.68","B. 0.38","C. 0.79","D. 0.32","E. none of these"],"answer":"B. 0.38","solution":"P(A and B')=P(A)-P(A and B)=0.59-0.21=0.38.","source":"stats..pasco_.pdf","difficulty":"Medium"},{"id":"sta-v7-003","module":"v7","type":"mcq","q":"Among the 78 doctors on a hospital staff, 64 carry malpractice insurance, 36 are surgeons, and 34 of the surgeons carry insurance. If one doctor is chosen at random, what is P(not a surgeon and does not carry insurance)?","options":["A. 2/13","B. 1/39","C. 17/39","D. 15/39","E. none of these"],"answer":"A. 2/13","solution":"P(surgeon or insured)=36+64-34=66; non-surgeons without insurance=78-66=12; 12/78=2/13.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-004","module":"v7","type":"mcq","q":"The probability of surviving a transplant operation is 0.55. Given survival, P(body rejects transplant within a month)=0.20. What is P(survive and not reject)?","options":["A. 0.11","B. 0.90","C. 0.44","D. 0.36","E. none of these"],"answer":"C. 0.44","solution":"P(survive and no rejection)=0.55(1-0.20)=0.55x0.80=0.44.","source":"stats..pasco_.pdf","difficulty":"Medium"},{"id":"sta-v7-005","module":"v7","type":"mcq","q":"If events A and B are independent with P(A)=0.3 and P(B)=0.5, find P(A intersection B).","options":["A. 0.15","B. 0.65","C. 0.35","D. 0.85","E. none of these"],"answer":"A. 0.15","solution":"Independence gives P(A and B)=0.3x0.5=0.15.","source":"stats..pasco_.pdf","difficulty":"Medium"},{"id":"sta-v7-006","module":"v7","type":"mcq","q":"At KNUST hospital there are 8 nurses, 5 of whom are pregnant. If 3 are selected at random to serve on a committee, what is P(all 3 are pregnant)?","options":["A. 5/28","B. 3/28","C. 1/56","D. 5/56","E. none of these"],"answer":"A. 5/28","solution":"C(5,3)/C(8,3)=10/56=5/28.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-007","module":"v7","type":"mcq","q":"From the 8 nurses (5 pregnant) problem, find P(none of the 3 selected is pregnant).","options":["A. 5/28","B. 3/28","C. 1/56","D. 5/56","E. none of these"],"answer":"C. 1/56","solution":"C(3,3)/C(8,3)=1/56.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-008","module":"v7","type":"mcq","q":"Events A and B satisfy P(A)=2/3, P(A|B)=2/3, P(B)=1/4. Find P(B|A).","options":["A. 3/4","B. 5/6","C. 1/4","D. 1/6","E. none of these"],"answer":"C. 1/4","solution":"P(A and B)=(2/3)(1/4)=1/6; P(B|A)=(1/6)/(2/3)=1/4.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-009","module":"v7","type":"mcq","q":"Using the same events, find P(A intersection B).","options":["A. 3/4","B. 5/6","C. 1/4","D. 1/6","E. none of these"],"answer":"D. 1/6","solution":"P(A and B)=P(A|B)P(B)=(2/3)(1/4)=1/6.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-010","module":"v7","type":"mcq","q":"Four names are drawn from 24 club members for president, vice president, treasurer and secretary. In how many ways can this be done?","options":["A. 255024","B. 10626","C. 116280","D. 127512","E. none of these"],"answer":"A. 255024","solution":"Order matters: 24P4=24x23x22x21=255024.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-011","module":"v7","type":"mcq","q":"How many distinct permutations are there of the letters in the word STATISTICS?","options":["A. 3628800","B. 50400","C. 40320","D. 3360","E. none of these"],"answer":"B. 50400","solution":"10!/(3!3!2!)=3628800/72=50400.","source":"STAT 153 midsem / past exam papers","difficulty":"Devil Mode"},{"id":"sta-v7-012","module":"v7","type":"mcq","q":"From the permutations of STATISTICS, how many begin and end with the letter S?","options":["A. 3628800","B. 50400","C. 40320","D. 3360","E. none of these"],"answer":"D. 3360","solution":"Fix S at both ends; arrange the remaining 8 letters (three T's, two I's, one A, one C, one S): 8!/(3!2!)=3360.","source":"STAT 153 midsem / past exam papers","difficulty":"Devil Mode"},{"id":"sta-v7-013","module":"v7","type":"mcq","q":"From the STATISTICS permutations, find the probability that a random permutation begins and ends with S.","options":["A. 0.01","B. 0.80","C. 0.07","D. 0.08","E. none of these"],"answer":"C. 0.07","solution":"3360/50400=0.0667 ~ 0.07.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-014","module":"v7","type":"mcq","q":"A and B are exhaustive events with P(A|B)=1/3 and P(B)=2/3. Find P(A).","options":["A. 0.5","B. 0.67","C. 0.33","D. 0.25","E. none of these"],"answer":"E. none of these","solution":"P(A and B)=(1/3)(2/3)=2/9; exhaustive gives P(A and B')=P(B')=1/3; P(A)=2/9+1/3=5/9=0.5556, which is not listed.","source":"STAT 153 midsem / past exam papers","difficulty":"Devil Mode"},{"id":"sta-v7-015","module":"v7","type":"mcq","q":"The probability that a visit to a primary care physician's office results in neither lab work nor referral is 35%. P(referral)=35% and P(lab work)=40%. Find P(both lab work and referral).","options":["A. 0.95","B. 0.65","C. 0.05","D. 0.60","E. none of these"],"answer":"E. none of these","solution":"P(R union L)=1-0.35=0.65=0.35+0.40-P(R and L), so P(R and L)=0.10, which is not among A-D.Hard","source":"stats..pasco_.pdf","difficulty":"Medium"},{"id":"sta-v7-016","module":"v7","type":"mcq","q":"Two fair dice are thrown. Find P(sum is a multiple of 5).","options":["A. 7/36","B. 1/6","C. 5/18","D. 1/12","E. none of these"],"answer":"A. 7/36","solution":"Sums of 5 (4 ways) and 10 (3 ways): 7/36.","source":"stats..pasco_.pdf","difficulty":"Medium"},{"id":"sta-v7-017","module":"v7","type":"mcq","q":"Two fair dice are thrown. Find P(sum is greater than 9).","options":["A. 7/36","B. 1/6","C. 5/18","D. 1/12","E. none of these"],"answer":"B. 1/6","solution":"Sums 10,11,12 occur 3+2+1=6 times: 6/36=1/6.","source":"stats..pasco_.pdf","difficulty":"Medium"},{"id":"sta-v7-018","module":"v7","type":"mcq","q":"Two fair dice are thrown. Find P(sum is a multiple of 5 OR greater than 9).","options":["A. 7/36","B. 1/6","C. 5/18","D. 1/12","E. none of these"],"answer":"C. 5/18","solution":"Favourable sums 5,10,11,12: 4+3+2+1=10 outcomes; 10/36=5/18.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-019","module":"v7","type":"mcq","q":"Two fair dice are thrown. Find P(sum is a multiple of 5 AND greater than 9).","options":["A. 7/36","B. 1/6","C. 5/18","D. 1/12","E. none of these"],"answer":"D. 1/12","solution":"Only sum 10 qualifies: 3/36=1/12.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-020","module":"v7","type":"mcq","q":"P(A)=8/15, P(B)=1/3, P(A|B)=1/5. Find P(A intersection B).","options":["A. 11/15","B. 1/15","C. 1/5","D. 1/3","E. none of these"],"answer":"B. 1/15","solution":"(1/5)(1/3)=1/15.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-021","module":"v7","type":"mcq","q":"Using the same events, find P(exactly one of A and B occurs).","options":["A. 11/15","B. 1/15","C. 1/5","D. 1/3","E. none of these"],"answer":"A. 11/15","solution":"P(A)+P(B)-2P(A and B)=8/15+5/15-2/15=11/15.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-022","module":"v7","type":"fill","q":"Using P(A)=8/15, P(B)=1/3, P(A|B)=1/5, find P(neither A nor B).","answer":"0.2667","solution":"P(A union B)=8/15+5/15-2/15=11/15; P(neither)=4/15=0.2667.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-023","module":"v7","type":"mcq","q":"A frequency distribution has class intervals 0-4, 5-9, 10-14, 15-19, 20-24, 25-29 with frequencies 10, 25, 50, 90, 110, 120. What is the median interval?","options":["A. 0-4","B. 15-19","C. 10-14","D. 20-24","E. None"],"answer":"D. 20-24","solution":"N=405; N/2=202.5; cumulative frequencies 10,35,85,175,285,405, so the median lies in 20-24.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-024","module":"v7","type":"fill","q":"In the frequency distribution above, what is the cumulative frequency for the class 20-24?","answer":"285","solution":"10+25+50+90+110=285.","source":"stats..pasco_.pdf","difficulty":"Medium"},{"id":"sta-v7-025","module":"v7","type":"mcq","q":"In the frequency distribution above, which interval contains the upper quartile Q3?","options":["A. 25-29","B. 10-14","C. 20-24","D. 15-19","E. None"],"answer":"A. 25-29","solution":"3N/4=303.75, which falls in the last class 25-29.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-026","module":"v7","type":"mcq","q":"The extent to which numerical data tend to spread about an average is known as:","options":["A. Central tendency","B. Dispersion","C. Kurtosis","D. Skewness","E. None"],"answer":"B. Dispersion","solution":"Dispersion measures spread around a central value.","source":"stats..pasco_.pdf","difficulty":"Medium"},{"id":"sta-v7-027","module":"v7","type":"mcq","q":"In a mathematics association, the pie sectors for Science and Business students are 168° and 48°. There are 147 Science students and 35 Vocational students. How many Business students are there?","options":["A. 45","B. 42","C. 40","D. 44","E. none"],"answer":"B. 42","solution":"Total=147x360/168=315; Business=315x48/360=42.","source":"STAT 153 midsem / past exam papers","difficulty":"Devil Mode"},{"id":"sta-v7-028","module":"v7","type":"mcq","q":"In the association problem, find the angle of the Vocational sector.","options":["A. 43°","B. 45°","C. 41°","D. 40°","E. none"],"answer":"D. 40°","solution":"35/315x360=40°.","source":"stats..pasco_.pdf","difficulty":"Medium"},{"id":"sta-v7-029","module":"v7","type":"mcq","q":"In the association problem, how many Arts students are there?","options":["A. 91","B. 89","C. 90","D. 93","E. none"],"answer":"A. 91","solution":"315-147-42-35=91.","source":"stats..pasco_.pdf","difficulty":"Medium"},{"id":"sta-v7-030","module":"v7","type":"mcq","q":"The number of classes K and class width C for grouped data are approximately given by:","options":["A. K=1+3.322log10 N and C=Range/K","B. K=1+3.223log10 N and C=Range/K","C. K=1+3.322log10 N and C=Range/K","D. K=1+3.322log10 N and K=Range/C","E. none"],"answer":"C. K=1+3.322log10 N and C=Range/K","solution":"Sturges' rule: K=1+3.322log10(N) and class width C=Range/K.","source":"stats..pasco_.pdf","difficulty":"Medium"},{"id":"sta-v7-031","module":"v7","type":"mcq","q":"The word statisticians use to describe any process that generates a set of data is:","options":["A. Trial","B. Experiment","C. Event","D. Sampling","E. none"],"answer":"B. Experiment","solution":"An experiment is any process that generates data.","source":"stats..pasco_.pdf","difficulty":"Medium"},{"id":"sta-v7-032","module":"v7","type":"mcq","q":"Marks in six courses are 56, 68, 65, 70, 78, 80 with credits 4, 3, 3, 4, 3, 2. Determine the weighted average mark.","options":["A. 68.26","B. 70.52","C. 78.26","D. 69.41","E. none"],"answer":"A. 68.26","solution":"(224+204+195+280+234+160)/19=1297/19=68.26.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-033","module":"v7","type":"mcq","q":"Consider the data 25, 18, 15, 27, 30. The geometric mean is:","options":["A. 22.66","B. 22.26","C. 23.00","D. 26.22","E. none"],"answer":"B. 22.26","solution":"(25x18x15x27x30)^(1/5)=22.26.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-034","module":"v7","type":"mcq","q":"For the data 25, 18, 15, 27, 30, the harmonic mean is:","options":["A. 26.22","B. 22.26","C. 23.00","D. 22.66","E. none"],"answer":"E. none","solution":"H=5/(1/25+1/18+1/15+1/27+1/30)=21.50, which is not among the listed options.Hard","source":"stats..pasco_.pdf","difficulty":"Medium"},{"id":"sta-v7-035","module":"v7","type":"mcq","q":"The mean and standard deviation of 2, 3, 6, 9 are:","options":["A. 5 and 2.7 respectively","B. 5 and 1.3 respectively","C. 5 and 2.5 respectively","D. 5 and 3.7 respectively","E. none"],"answer":"A. 5 and 2.7 respectively","solution":"Mean=5; population SD=sqrt(30/4)=2.74.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-036","module":"v7","type":"mcq","q":"Measures of central tendency are also known as:","options":["A. Means","B. Modes","C. Averages","D. Medians","E. none"],"answer":"C. Averages","solution":"Measures of central tendency are commonly called averages.","source":"stats..pasco_.pdf","difficulty":"Medium"},{"id":"sta-v7-037","module":"v7","type":"mcq","q":"For X=2,-5,4,-8 and Y=-8,-8,10,6, compute sum (X+Y)(X-Y).","options":["A. 100","B. -100","C. 109","D. -109","E. none"],"answer":"E. none","solution":"sum (X^2-Y^2)=109-264=-155, which is not among the listed options.","source":"STAT 153 midsem / past exam papers","difficulty":"Devil Mode"},{"id":"sta-v7-038","module":"v7","type":"mcq","q":"A frequency table has values 1-5 with frequencies x, 11, y, 8, 9, total frequency 50 and mean 2.7. Find x and y.","options":["A. x=15, y=7","B. x=7, y=15","C. x=12, y=10","D. x=5, y=15","E. none"],"answer":"A. x=15, y=7","solution":"x+y=22 and x+3y=36, giving y=7 and x=15.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-039","module":"v7","type":"mcq","q":"The number of errors on each of 200 pages had sum x=920 and sum x^2=5032. Find the mean and standard deviation.","options":["A. 6.4 and 2","B. 4.6 and 2","C. 4.6 and 2.5","D. 4.6 and 2.8","E. none"],"answer":"B. 4.6 and 2","solution":"Mean=920/200=4.6; variance=5032/200-4.6^2=25.16-21.16=4; SD=2.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-040","module":"v7","type":"mcq","q":"A set of 12 numbers has mean 4 and SD 2; another set of 20 numbers has mean 5 and SD 3. Find the combined mean (2 s.f.).","options":["A. 3.6","B. 4.5","C. 4.6","D. 5.6","E. none"],"answer":"C. 4.6","solution":"(12x4+20x5)/32=148/32=4.625 ~ 4.6.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-041","module":"v7","type":"mcq","q":"For the 17 grades 73,77,77,70,59,82,82,84,68,91,80,79,66,76,68,91,90, find the mean deviation.","options":["A. 7.1","B. 7.2","C. 6.9","D. 7.3","E. none"],"answer":"B. 7.2","solution":"Mean=77.24; mean absolute deviation=7.19 ~ 7.2.","source":"STAT 153 midsem / past exam papers","difficulty":"Hard"},{"id":"sta-v7-042","module":"v7","type":"mcq","q":"Complete: 'Statistical methods may be described as methods for drawing conclusions about _____ based on _____ computed from the _____.'","options":["A. statistics, samples, populations","B. populations, parameters, samples","C. statistics, parameters, samples","D. parameters, statistics, populations","E. populations, statistics, samples"],"answer":"E. populations, statistics, samples","solution":"Inference draws conclusions about populations using statistics computed from samples.","source":"stats..pasco_.pdf","difficulty":"Medium"},{"id":"sta-v7-043","module":"v7","type":"mcq","q":"Complete: 'The entire group of objects or people about which information is wanted is the _____. Individual members are called _____. The _____ is the part actually examined.'","options":["A. population, explanatory variables, subgroup","B. whole, items of interest, stratum","C. response group, respondents, non-response group","D. sample, units, target population","E. population, units, sample"],"answer":"E. population, units, sample","solution":"Standard definitions of population, units and sample.","source":"stats..pasco_.pdf","difficulty":"Medium"},{"id":"sta-v7-044","module":"v7","type":"fill","q":"Events A and B satisfy P(A)=2/3, P(B|A)=1/2, P(B|A')=1/4. Find P(A|B').","answer":"0.5714","solution":"P(A and B)=1/3, P(B)=5/12, P(B')=7/12; P(A|B')=(2/3-1/3)/(7/12)=4/7=0.5714.","source":"ebensenu..statistics-midsem.pdf (+ worked solution)","difficulty":"Hard"},{"id":"sta-v7-045","module":"v7","type":"fill","q":"Using the same events, find P(A|B).","answer":"0.8000","solution":"P(A and B)=1/3; P(B)=5/12; P(A|B)=(1/3)/(5/12)=0.8000.","source":"ebensenu..statistics-midsem.pdf (+ worked solution)","difficulty":"Hard"},{"id":"sta-v7-046","module":"v7","type":"fill","q":"A discrete random variable X has CDF F(x)=kx for x=1,2,3. Find k.","answer":"0.3333","solution":"F(3)=3k=1, so k=1/3.","source":"ebensenu..statistics-midsem.pdf (+ worked solution)","difficulty":"Medium"},{"id":"sta-v7-047","module":"v7","type":"fill","q":"For that CDF, find P(X<3).","answer":"0.6667","solution":"P(X<3)=F(2)=2/3.","source":"ebensenu..statistics-midsem.pdf (+ worked solution)","difficulty":"Medium"},{"id":"sta-v7-048","module":"v7","type":"fill","q":"Given P(A')=0.6, P(B')=0.55 and P(A intersection B)=0.17, find P(A union B).","answer":"0.6800","solution":"P(A)=0.4, P(B)=0.45; P(A union B)=0.4+0.45-0.17=0.68.","source":"ebensenu..statistics-midsem.pdf (+ worked solution)","difficulty":"Medium"},{"id":"sta-v7-049","module":"v7","type":"fill","q":"Using the same probabilities, find P(A but not B).","answer":"0.2300","solution":"P(A)-P(A and B)=0.40-0.17=0.23.","source":"ebensenu..statistics-midsem.pdf (+ worked solution)","difficulty":"Medium"},{"id":"sta-v7-050","module":"v7","type":"fill","q":"Using the same probabilities, find P(B but not A).","answer":"0.2800","solution":"P(B)-P(A and B)=0.45-0.17=0.28.","source":"ebensenu..statistics-midsem.pdf (+ worked solution)","difficulty":"Medium"},{"id":"sta-v7-051","module":"v7","type":"fill","q":"Using the same probabilities, find P(A' intersection B').","answer":"0.3200","solution":"1-P(A union B)=1-0.68=0.32.","source":"ebensenu..statistics-midsem.pdf (+ worked solution)","difficulty":"Medium"},{"id":"sta-v7-052","module":"v7","type":"fill","q":"P(A)=2/7, P(B|A)=1/5. Find P(A union B).","answer":"0.7857","solution":"P(A and B)=2/35; P(B)=P(A and B)/P(A)=1/5; P(A union B)=2/7+1/5-2/35=11/14=0.7857.","source":"ebensenu..statistics-midsem.pdf (+ worked solution)","difficulty":"Hard"},{"id":"sta-v7-053","module":"v7","type":"fill","q":"A committee of 4 is chosen from 7 men and 3 women. Find P(at least one woman) to 4 d.p.","answer":"0.8333","solution":"1-C(7,4)/C(10,4)=1-35/210=5/6=0.8333.","source":"ebensenu..statistics-midsem.pdf (+ worked solution)","difficulty":"Hard"},{"id":"sta-v7-054","module":"v7","type":"fill","q":"For that committee, find the expected number of women.","answer":"1.2000","solution":"E(W)=4x(3/10)=1.2.","source":"ebensenu..statistics-midsem.pdf (+ worked solution)","difficulty":"Hard"},{"id":"sta-v7-055","module":"v7","type":"fill","q":"For that committee, find the expected number of men.","answer":"2.8000","solution":"E(M)=4x(7/10)=2.8.","source":"ebensenu..statistics-midsem.pdf (+ worked solution)","difficulty":"Medium"},{"id":"sta-v7-056","module":"v9","type":"fill","q":"Find the sample space for tossing a fair coin three times.","answer":"{HHH, HHT, HTH, HTT, THH, THT, TTH, TTT}","solution":"Each toss has two outcomes; 2^3=8 ordered triples.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Medium"},{"id":"sta-v7-057","module":"v9","type":"fill","q":"A couple plans three children with equal chances of boy/girl. Find P(exactly two girls).","answer":"0.3750","solution":"S has 8 equally likely outcomes; event {BGG,GBG,GGB} has 3 outcomes; 3/8=0.375.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Medium"},{"id":"sta-v7-058","module":"v9","type":"fill","q":"In a population of women, 40% have had breast cancer, 20% smoke, and 13% both. Find P(breast cancer or smokes).","answer":"0.4700","solution":"0.40+0.20-0.13=0.47.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Medium"},{"id":"sta-v7-059","module":"v9","type":"fill","q":"If P(A)=0.6, P(B)=0.5 and P(A union B)=0.8, find P(A|B).","answer":"0.6000","solution":"P(A and B)=0.6+0.5-0.8=0.3; 0.3/0.5=0.6.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Medium"},{"id":"sta-v7-060","module":"v9","type":"fill","q":"Using P(A)=0.6, P(B)=0.5, P(A and B)=0.3, are A and B independent?","answer":"Yes","solution":"P(A)P(B)=0.6x0.5=0.3=P(A and B), so they are independent.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Medium"},{"id":"sta-v7-061","module":"v9","type":"fill","q":"In a medical clinic P(bacterial infection)=0.75. Of those, 60% require antibiotics; of viral cases 30% require antibiotics. Find P(bacterial | requires antibiotics).","answer":"0.8571","solution":"P(AB)=0.75(0.60)+0.25(0.30)=0.45+0.075=0.525; P(B|AB)=0.45/0.525=0.8571.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Hard"},{"id":"sta-v7-062","module":"v9","type":"fill","q":"The ordered data 4,6,8,10,12,14,16 has n=7. Find Q1.","answer":"6","solution":"Position=(7+1)/4=2, so Q1=6.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Medium"},{"id":"sta-v7-063","module":"v9","type":"fill","q":"For the ordered data 4,6,8,10,12,14,16, find Q3.","answer":"14","solution":"Position=3(8)/4=6, so Q3=14.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Medium"},{"id":"sta-v7-064","module":"v9","type":"fill","q":"For the ordered data 3,5,7,9,11,13,15,17,19, find the 4th decile D4.","answer":"9","solution":"Position=4(10)/10=4, so D4=9.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Medium"},{"id":"sta-v7-065","module":"v9","type":"fill","q":"For the ordered data 10,12,14,16,18,20,22,24,26, find the 75th percentile P75.","answer":"23","solution":"Position=75(10)/100=7.5; average 7th and 8th values: (22+24)/2=23.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Hard"},{"id":"sta-v7-066","module":"v9","type":"fill","q":"For grouped data with classes 10-19(4), 20-29(6), 30-39(10), 40-49(8), 50-59(7), 60-69(5), find the grouped mean.","answer":"40.2500","solution":"Midpoints 14.5,...,64.5; sum fx=1610, sum f=40; mean=40.25.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Hard"},{"id":"sta-v7-067","module":"v9","type":"fill","q":"For the same grouped data, find the population variance to 2 d.p.","answer":"224.44","solution":"sum f(x-mean)^2=8977.4; population variance=8977.4/40=224.44.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Hard"},{"id":"sta-v7-068","module":"v9","type":"fill","q":"For the same grouped data, find the population standard deviation to 2 d.p.","answer":"14.98","solution":"sqrt(224.44)=14.98.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Hard"},{"id":"sta-v7-069","module":"v9","type":"fill","q":"A discrete RV has PMF p(0)=1/4, p(1)=1/8, p(2)=1/2, p(3)=1/8. Find F(2).","answer":"0.8750","solution":"F(2)=1/4+1/8+1/2=7/8=0.875.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Medium"},{"id":"sta-v7-070","module":"v9","type":"fill","q":"A continuous RV has PDF f(x)=x/2 for 0<=x<=2. Find F(1).","answer":"0.2500","solution":"F(x)=x^2/4; F(1)=0.25.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Medium"},{"id":"sta-v7-071","module":"v9","type":"fill","q":"For a discrete uniform distribution on {1,2,3,4,5}, find E(X).","answer":"3","solution":"E(X)=(1+5)/2=3.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Medium"},{"id":"sta-v7-072","module":"v9","type":"fill","q":"For a discrete uniform distribution on {1,2,3,4,5}, find Var(X).","answer":"2","solution":"Var=(5^2-1)/12=24/12=2.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Hard"},{"id":"sta-v7-073","module":"v9","type":"fill","q":"For a Bernoulli trial with success probability p, what is Var(X)?","answer":"p(1-p)","solution":"Bernoulli variance is p(1-p).","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Medium"},{"id":"sta-v7-074","module":"v9","type":"fill","q":"A fair coin is tossed twice. How many outcomes are in the sample space?","answer":"4","solution":"S={HH,HT,TH,TT}.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Medium"},{"id":"sta-v7-075","module":"v9","type":"fill","q":"The five-number summary of the gym weights data is Min=90, Q1=115, Median=126, Q3=136, Max=158. What is the IQR?","answer":"21","solution":"IQR=Q3-Q1=136-115=21.","source":"Statistical Methods lecture slides (E. O. Owiredu, KNUST)","difficulty":"Medium"},{"id":"sta-v5-165","module":"v9","type":"mcq","q":"Statistics is best defined as:","options":["A scientific method of collecting, compiling, analysing and presenting numerical facts for informed decisions","The study of numbers only","A branch of pure mathematics","The art of guessing outcomes"],"answer":"A scientific method of collecting, compiling, analysing and presenting numerical facts for informed decisions","solution":"The lecture defines statistics as a scientific method of handling numerical facts for decision making.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-166","module":"v9","type":"mcq","q":"Which activity is NOT typically a role of a statistician in scientific research?","options":["Designing experiments and surveys","Collecting and managing data","Analysing data and measuring goodness of inference","Prescribing medication to patients"],"answer":"Prescribing medication to patients","solution":"Statisticians design, collect, analyse and infer; clinical treatment is a clinician's role.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-167","module":"v9","type":"mcq","q":"The acronym IVPPSS used in the course stands for:","options":["Individual, Variable, Population, Parameter, Sample, Statistic","Independent, Variable, Population, Parameter, Sample, Survey","Individual, Value, Population, Parameter, Sample, Statistic","Individual, Variable, Probability, Parameter, Sample, Statistic"],"answer":"Individual, Variable, Population, Parameter, Sample, Statistic","solution":"These six items must be identified at the start of any analysis.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-168","module":"v9","type":"fill","q":"In the antenatal-visits example (165 pregnant women sampled), what is the variable?","answer":"Number of antenatal visits","solution":"The variable is the characteristic recorded on each individual.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-169","module":"v9","type":"fill","q":"In the antenatal-visits example, what is the sample?","answer":"The 165 randomly selected pregnant women","solution":"The sample is the subset studied.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-170","module":"v9","type":"fill","q":"In the antenatal-visits example, what is the statistic?","answer":"The mean number of antenatal visits of the 165 women","solution":"A statistic describes a sample.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-171","module":"v9","type":"mcq","q":"A numerical description of a sample characteristic is called a:","options":["Parameter","Statistic","Population","Variable"],"answer":"Statistic","solution":"By definition a statistic describes a sample.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-172","module":"v9","type":"mcq","q":"A quantitative measure describing a population characteristic is a:","options":["Parameter","Statistic","Sample","Observation"],"answer":"Parameter","solution":"Parameters describe populations and are usually unknown.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-173","module":"v9","type":"mcq","q":"Which is an example of a discrete variable?","options":["Blood pressure (mmHg)","Number of children vaccinated","Cholesterol level (mg/dL)","Body temperature (degrees C)"],"answer":"Number of children vaccinated","solution":"Counts are discrete; measurements on a scale are continuous.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-174","module":"v9","type":"mcq","q":"Which is an example of a continuous variable?","options":["Number of patients in a ward","Number of malaria parasites counted","Lung capacity (litres)","Number of hospital visits"],"answer":"Lung capacity (litres)","solution":"Lung capacity is measured on a continuous scale.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-175","module":"v9","type":"mcq","q":"Cancer stage (I, II, III, IV) is measured on which scale?","options":["Nominal","Ordinal","Interval","Ratio"],"answer":"Ordinal","solution":"The stages have a natural order but unequal intervals.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-176","module":"v9","type":"mcq","q":"Temperature in degrees Celsius is measured on which scale?","options":["Nominal","Ordinal","Interval","Ratio"],"answer":"Interval","solution":"Differences are meaningful but zero degrees does not mean absence of heat.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-177","module":"v9","type":"mcq","q":"Which scale possesses order, equal intervals and a true zero?","options":["Nominal","Ordinal","Interval","Ratio"],"answer":"Ratio","solution":"Ratio scales have all three properties.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-178","module":"v9","type":"mcq","q":"For nominal or ordinal data, the appropriate graphs are:","options":["Histogram and ogive","Bar charts and pie charts","Scatterplots only","Boxplots only"],"answer":"Bar charts and pie charts","solution":"Categorical data are displayed with bars or pie sectors.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-179","module":"v9","type":"mcq","q":"For interval or ratio data, appropriate graphs include:","options":["Histogram, frequency polygon and ogive","Bar chart and pie chart only","Pie chart only","Time-series only"],"answer":"Histogram, frequency polygon and ogive","solution":"Numerical data are summarised with histograms, polygons and ogives.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-180","module":"v9","type":"mcq","q":"Data that have already been compiled by someone else are called:","options":["Primary data","Secondary data","Raw data","Experimental data"],"answer":"Secondary data","solution":"Secondary data are already available.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-181","module":"v9","type":"mcq","q":"Which is an advantage of primary data?","options":["Cheap and quick","Specific to the research purpose","Already compiled","Large historical scope"],"answer":"Specific to the research purpose","solution":"Primary data are collected firsthand for the study at hand.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-182","module":"v9","type":"mcq","q":"Which method is NOT one of the data collection methods listed in the course?","options":["Interviews","Self-administered questionnaire","Biometric and physiological measurement","Astronomical observation of stars"],"answer":"Astronomical observation of stars","solution":"The listed methods are interviews, questionnaires, measurements, observation and experimentation.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-183","module":"v9","type":"mcq","q":"The three basic steps in designing a questionnaire are:","options":["Designing the instrument, pretesting, editing results","Sampling, analysing, reporting","Printing, distributing, collecting","Coding, tabulating, publishing"],"answer":"Designing the instrument, pretesting, editing results","solution":"These are the three steps given in the lecture.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-184","module":"v9","type":"mcq","q":"Pilot testing a questionnaire is done to:","options":["Collect the final data","Test clarity of questions and inform study design","Replace the main survey","Increase sample size"],"answer":"Test clarity of questions and inform study design","solution":"A pilot survey tests the technique, not to collect viable data.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-185","module":"v9","type":"mcq","q":"Which is a disadvantage of questionnaire methods?","options":["Interviewer bias","Low response rates","High cost per respondent","Inability to reach large samples"],"answer":"Low response rates","solution":"Questionnaires can suffer low response rates and misinterpretation.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-186","module":"v9","type":"mcq","q":"Which ethical principle requires researchers to inform participants about the study?","options":["Seek consent","Avoid bias","Maintain confidentiality","Use appropriate language"],"answer":"Seek consent","solution":"Seeking informed consent is a core ethical requirement.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-187","module":"v9","type":"mcq","q":"The first stage of a statistical investigation is:","options":["Statement of problems and objectives","Data handling","Interpretation and presentation","Pilot survey"],"answer":"Statement of problems and objectives","solution":"A clear objective must be stated before data collection.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-188","module":"v9","type":"mcq","q":"Sampling units should be:","options":["Distinct, current, non-overlapping and covering the whole population","Overlapping to ensure coverage","Selected from volunteers only","Always individuals, never groups"],"answer":"Distinct, current, non-overlapping and covering the whole population","solution":"These are the required properties of sampling units.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-189","module":"v9","type":"mcq","q":"The median is the:","options":["Arithmetic average","Middle value when data are ordered","Most frequent value","Difference between max and min"],"answer":"Middle value when data are ordered","solution":"Order the data and take the middle value.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-190","module":"v9","type":"mcq","q":"The mode is:","options":["The average","The middle value","The most frequently occurring value","The square of the SD"],"answer":"The most frequently occurring value","solution":"Mode is the most frequent observation.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-191","module":"v9","type":"mcq","q":"Which measure of dispersion is the difference between the maximum and minimum?","options":["Variance","Standard deviation","Range","IQR"],"answer":"Range","solution":"Range = maximum - minimum.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-192","module":"v9","type":"mcq","q":"The sample variance divides the sum of squared deviations by:","options":["n","n-1","n+1","2n"],"answer":"n-1","solution":"The sample variance uses n-1 (Bessel's correction).","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-193","module":"v9","type":"mcq","q":"The population variance divides the sum of squared deviations by:","options":["n","n-1","n+1","2n"],"answer":"n","solution":"Population variance uses N (the population size).","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-194","module":"v9","type":"mcq","q":"The coefficient of variation is useful for:","options":["Comparing variability across data sets with different units","Measuring central tendency","Testing hypotheses","Drawing histograms"],"answer":"Comparing variability across data sets with different units","solution":"CV is a relative measure of spread.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-195","module":"v9","type":"mcq","q":"The five-number summary consists of:","options":["Minimum, Q1, Median, Q3, Maximum","Mean, median, mode, range, SD","Min, max, mean, variance, SD","Q1, Q2, Q3, IQR, range"],"answer":"Minimum, Q1, Median, Q3, Maximum","solution":"These five numbers form the boxplot summary.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-196","module":"v9","type":"mcq","q":"A boxplot is constructed from:","options":["Mean and SD","The five-number summary","Only the mode","Only the range"],"answer":"The five-number summary","solution":"The box spans Q1 to Q3 with whiskers to min and max.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-197","module":"v9","type":"mcq","q":"In a stem-and-leaf plot, the 'leaf' is:","options":["The leading digit","The trailing digit","The median","The frequency"],"answer":"The trailing digit","solution":"For 90 the stem is 9 and the leaf is 0.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-198","module":"v9","type":"mcq","q":"A dot plot displays:","options":["A dot for each value along a number line","Only the mean","Cumulative frequencies","Pie sectors"],"answer":"A dot for each value along a number line","solution":"Repeated values stack vertically.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-199","module":"v9","type":"mcq","q":"An ogive is:","options":["A cumulative frequency curve","A frequency polygon","A bar chart","A pie chart"],"answer":"A cumulative frequency curve","solution":"An ogive joins upper class boundaries to cumulative frequencies.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-200","module":"v9","type":"mcq","q":"A histogram is:","options":["A bar chart for categorical data","Rectangles over class boundaries with heights equal to frequencies","A line graph of means","A plot of two variables"],"answer":"Rectangles over class boundaries with heights equal to frequencies","solution":"Histograms display grouped numerical data.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-201","module":"v9","type":"mcq","q":"A frequency polygon plots frequencies against:","options":["Class boundaries","Class midpoints","Cumulative frequencies","Sample sizes"],"answer":"Class midpoints","solution":"Class marks (midpoints) are used for frequency polygons.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-202","module":"v9","type":"mcq","q":"Outliers are:","options":["Values near the mean","Data values far from the rest of the data","The most frequent values","Values equal to the median"],"answer":"Data values far from the rest of the data","solution":"Outliers lie very far from the bulk of the data.","source":"Statistical Methods lecture slides (Owiredu, KNUST,
