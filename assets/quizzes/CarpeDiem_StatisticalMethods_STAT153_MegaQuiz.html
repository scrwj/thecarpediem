 2026)","difficulty":"Medium"},{"id":"sta-v5-203","module":"v9","type":"mcq","q":"The five important characteristics in EDA are:","options":["Centre, variation, distribution, outliers, time","Mean, median, mode, range, SD","Sample, population, parameter, statistic, variable","Nominal, ordinal, interval, ratio, discrete"],"answer":"Centre, variation, distribution, outliers, time","solution":"These are the EDA characteristics listed in the lecture.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-204","module":"v9","type":"mcq","q":"Sturges' rule gives the number of classes as:","options":["K=1+3.322 log10(n)","K=log2(n)","K=n/5","K=sqrt(n)"],"answer":"K=1+3.322 log10(n)","solution":"Sturges' approximation is K=1+3.322 log10(n).","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-205","module":"v9","type":"fill","q":"A grouped distribution has range 68 and 4 classes. Using Sturges-style width, what is the class width?","answer":"17","solution":"Width=ceil(68/4)=17.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-206","module":"v9","type":"fill","q":"For the frequency table 300-399(13), 400-499(20), 500-599(7), what is the lower class boundary of the first class?","answer":"299.5","solution":"Lower boundary is the midpoint between 299 and 300.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-207","module":"v9","type":"fill","q":"For class 300-399, what is the upper class boundary?","answer":"399.5","solution":"Upper boundary is the midpoint between 399 and 400.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-208","module":"v9","type":"fill","q":"For class 300-399, what is the class width?","answer":"100","solution":"399.5-299.5=100.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-209","module":"v9","type":"fill","q":"For class 300-399, what is the class midpoint?","answer":"349.5","solution":"(399.5+299.5)/2=349.5.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-210","module":"v9","type":"mcq","q":"The 2^k >= n rule is used to:","options":["Determine the number of classes","Compute the mean","Test hypotheses","Draw a pie chart"],"answer":"Determine the number of classes","solution":"It gives a guide to the number of classes for a frequency distribution.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-211","module":"v9","type":"mcq","q":"A random experiment is one in which:","options":["The result is certain","Outcomes cannot be predicted with certainty","Only one outcome is possible","No data are generated"],"answer":"Outcomes cannot be predicted with certainty","solution":"Random experiments have uncertain outcomes.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-212","module":"v9","type":"mcq","q":"A trial is:","options":["One repetition of an experiment","The set of all outcomes","An event with probability 1","A type of graph"],"answer":"One repetition of an experiment","solution":"Each performance of an experiment is a trial.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-213","module":"v9","type":"mcq","q":"The sample space of an experiment is:","options":["One particular outcome","The collection of all possible outcomes","The probability of success","The average result"],"answer":"The collection of all possible outcomes","solution":"S is the set of all possible outcomes.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-214","module":"v9","type":"fill","q":"How many outcomes are in the sample space for rolling two fair dice?","answer":"36","solution":"6x6=36 ordered pairs.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-215","module":"v9","type":"fill","q":"In a football match the possible outcomes are win, loss and draw. How many outcomes are in the sample space?","answer":"3","solution":"S={W,L,D}.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-216","module":"v9","type":"mcq","q":"An event containing exactly one outcome is called a:","options":["Simple event","Compound event","Certain event","Null event"],"answer":"Simple event","solution":"A single outcome is a simple event.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-217","module":"v9","type":"mcq","q":"Getting an odd number when a die is rolled is a:","options":["Simple event","Compound event","Impossible event","Complement of the sample space"],"answer":"Compound event","solution":"It consists of three outcomes {1,3,5}.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-218","module":"v9","type":"mcq","q":"Classical probability assumes:","options":["Equally likely outcomes","Observed past frequencies","Personal judgement","Large samples only"],"answer":"Equally likely outcomes","solution":"Classical (a priori) probability assumes equally likely outcomes.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-219","module":"v9","type":"mcq","q":"Empirical probability is based on:","options":["Equally likely outcomes","Observed relative frequencies in past trials","Expert opinion only","The normal distribution"],"answer":"Observed relative frequencies in past trials","solution":"Empirical probability uses long-run relative frequency.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-220","module":"v9","type":"mcq","q":"Subjective probability is based on:","options":["Degree of belief using available evidence","Counting equally likely outcomes","Formal experiments only","Sample means"],"answer":"Degree of belief using available evidence","solution":"Subjective probability reflects personal judgement or expertise.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-221","module":"v9","type":"mcq","q":"If P(A)=0, event A is:","options":["Certain","Impossible","Equally likely","Independent"],"answer":"Impossible","solution":"Probability zero means the event cannot occur.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-222","module":"v9","type":"mcq","q":"For any event A, P(A') equals:","options":["1+P(A)","1-P(A)","P(A)-1","P(A)^2"],"answer":"1-P(A)","solution":"The complement rule.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-223","module":"v9","type":"mcq","q":"Events A and B are mutually exclusive if:","options":["P(A and B)=P(A)P(B)","P(A and B)=0","P(A)+P(B)=1","A and B are independent"],"answer":"P(A and B)=0","solution":"Mutually exclusive events share no outcomes.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-224","module":"v9","type":"mcq","q":"Events A and B are independent if:","options":["P(A and B)=0","P(A and B)=P(A)+P(B)","P(A and B)=P(A)P(B)","P(A|B)=0"],"answer":"P(A and B)=P(A)P(B)","solution":"This is the mathematical definition of independence.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-225","module":"v9","type":"mcq","q":"Events are exhaustive if:","options":["Their union is the sample space","They are mutually exclusive","Each has probability 1","They are independent"],"answer":"Their union is the sample space","solution":"Exhaustive events cover the whole sample space.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-226","module":"v9","type":"mcq","q":"A partition of the sample space requires events to be:","options":["Nonempty, mutually exclusive and collectively exhaustive","Independent and equally likely","Mutually exclusive only","Exhaustive only"],"answer":"Nonempty, mutually exclusive and collectively exhaustive","solution":"All three conditions are required.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-227","module":"v9","type":"mcq","q":"The conditional probability of A given B is:","options":["P(A)/P(B)","P(A and B)/P(B)","P(B and A)/P(A)","P(A)+P(B)"],"answer":"P(A and B)/P(B)","solution":"P(A|B)=P(A and B)/P(B) for P(B)>0.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-228","module":"v9","type":"mcq","q":"Bayes' theorem expresses P(A|B) as:","options":["P(B|A)P(A)/P(B)","P(A)P(B)","P(B)/P(A)","1-P(A|B)"],"answer":"P(B|A)P(A)/P(B)","solution":"Bayes' theorem reverses conditional probabilities.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Hard"},{"id":"sta-v5-229","module":"v9","type":"mcq","q":"The multiplication rule states P(A and B) =","options":["P(A)P(B)","P(A|B)P(B)","P(A)+P(B)","P(A|B)+P(B)"],"answer":"P(A|B)P(B)","solution":"This is the general multiplication rule.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-230","module":"v9","type":"mcq","q":"A continuous random variable is one that:","options":["Takes a countable number of values","Can assume infinitely many values in an interval","Only takes whole numbers","Has a PMF"],"answer":"Can assume infinitely many values in an interval","solution":"Continuous variables are measured on a continuum.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-231","module":"v9","type":"mcq","q":"For a PDF f(x), which property must hold?","options":["f(x) can be negative","Integral of f over all x equals 1","f(x) is always less than 1","Sum of f(x) equals 0"],"answer":"Integral of f over all x equals 1","solution":"A PDF must be nonnegative and integrate to 1.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-232","module":"v9","type":"mcq","q":"For a continuous random variable, P(X=a) is:","options":["1","0","Undefined","Equal to the mean"],"answer":"0","solution":"The probability of any single exact value is zero for a continuous RV.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-233","module":"v9","type":"mcq","q":"The CDF F(x) is defined as:","options":["P(X>x)","P(X<=x)","P(X=x)","The derivative of the PDF"],"answer":"P(X<=x)","solution":"By definition F(x)=P(X<=x).","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-234","module":"v9","type":"mcq","q":"For a continuous RV, the PDF is:","options":["The integral of the CDF","The derivative of the CDF","Always constant","Equal to the variance"],"answer":"The derivative of the CDF","solution":"f(x)=dF/dx where the derivative exists.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-235","module":"v9","type":"fill","q":"Write the formula for E(X) of a discrete random variable in terms of x and p(x).","answer":"sum of x*p(x)","solution":"E(X)=the sum over all x of x times P(X=x).","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-236","module":"v9","type":"fill","q":"Write the computational formula for Var(X).","answer":"E(X^2) - [E(X)]^2","solution":"Var(X)=E(X^2)-(E(X))^2.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-237","module":"v9","type":"mcq","q":"For a discrete uniform distribution on a,...,b, E(X) is:","options":["(a+b)/2","(b-a)/2","b-a+1","1/(b-a+1)"],"answer":"(a+b)/2","solution":"The mean is the average of the endpoints.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-238","module":"v9","type":"mcq","q":"A Bernoulli trial has:","options":["Exactly two mutually exclusive outcomes: success and failure","More than two outcomes","Continuous outcomes","Always p=0.5"],"answer":"Exactly two mutually exclusive outcomes: success and failure","solution":"Bernoulli trials are binary.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-239","module":"v9","type":"mcq","q":"Which condition is NOT required for a Bernoulli process?","options":["Constant probability of success","Independent trials","Binary outcome","Increasing probability of success over trials"],"answer":"Increasing probability of success over trials","solution":"The probability p must remain constant.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-240","module":"v9","type":"mcq","q":"A binomial distribution requires:","options":["A fixed number of independent Bernoulli trials","Sampling without replacement always","Continuous outcomes","Variable p across trials"],"answer":"A fixed number of independent Bernoulli trials","solution":"Binomial trials are independent with constant p.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-241","module":"v9","type":"mcq","q":"The Poisson distribution is commonly used to model:","options":["Counts of events in a fixed interval of time or space","Heights of patients","Continuous measurements","Proportions only"],"answer":"Counts of events in a fixed interval of time or space","solution":"Poisson models event counts.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-242","module":"v9","type":"mcq","q":"For a Poisson distribution, E(X) and Var(X) are:","options":["Both equal lambda","E=lambda, Var=lambda^2","E=lambda^2, Var=lambda","Different in all cases"],"answer":"Both equal lambda","solution":"The Poisson has mean and variance both equal to lambda.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-243","module":"v9","type":"mcq","q":"For an exponential distribution with rate lambda, E(X) is:","options":["lambda","1/lambda","lambda^2","1/lambda^2"],"answer":"1/lambda","solution":"The exponential mean is 1/lambda.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-244","module":"v9","type":"mcq","q":"The normal distribution is:","options":["Symmetric and bell-shaped","Right-skewed","Uniform","Always centred at 0"],"answer":"Symmetric and bell-shaped","solution":"The normal curve is symmetric about its mean.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-245","module":"v9","type":"mcq","q":"For a normal distribution, approximately what percentage of observations lie within two standard deviations of the mean?","options":["68%","95%","99.7%","50%"],"answer":"95%","solution":"The empirical rule gives about 95% within 2 SD.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-246","module":"v9","type":"mcq","q":"The standard normal distribution has:","options":["Mean 0 and SD 1","Mean 1 and SD 0","Mean mu and SD sigma","Mean 0 and variance 2"],"answer":"Mean 0 and SD 1","solution":"Z is standardised normal.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-247","module":"v9","type":"fill","q":"For X~N(50,25), what is the z-score for X=60?","answer":"2","solution":"z=(60-50)/5=2.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-248","module":"v9","type":"fill","q":"For Z~N(0,1), P(-1<Z<1) using Phi(1)=0.8413 is:","answer":"0.6826","solution":"2(0.8413)-1=0.6826.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-249","module":"v9","type":"mcq","q":"Sampling in which every member has a known non-zero chance of selection is:","options":["Probability sampling","Non-probability sampling","Convenience sampling","Judgmental sampling"],"answer":"Probability sampling","solution":"This is the defining property of probability sampling.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-250","module":"v9","type":"mcq","q":"Which sampling method first divides the population into strata and then samples from each?","options":["Cluster","Stratified","Systematic","Convenience"],"answer":"Stratified","solution":"Stratified sampling samples within each stratum.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-251","module":"v9","type":"mcq","q":"A researcher selects every kth person from a list. This is:","options":["Stratified sampling","Systematic sampling","Cluster sampling","Simple random sampling"],"answer":"Systematic sampling","solution":"Systematic sampling selects at a fixed interval.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"},{"id":"sta-v5-252","module":"v9","type":"mcq","q":"A study uses all members of a randomly chosen set of classes. This is:","options":["Cluster sampling","Stratified sampling","Simple random sampling","Systematic sampling"],"answer":"Cluster sampling","solution":"Clusters are randomly chosen and all their members studied.","source":"Statistical Methods lecture slides (Owiredu, KNUST, 2026)","difficulty":"Medium"}]};
let mod = BANK.modules[0].id;
let list = [];
let idx = 0;
let ans = {};
let secs = 7200;
let tick = null;
let done = false;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function drawMods(){
  document.getElementById('mods').innerHTML = BANK.modules.map(function(m){
    return '<button class="modbtn'+(m.id===mod?' sel':'')+'" onclick="pick(\''+m.id+'\')">'+
      '<b>'+esc(m.name)+'</b><span>'+esc(m.desc)+' - '+m.count+' questions</span></button>';
  }).join('');
}
function pick(id){ mod=id; drawMods(); }

function begin(){
  list = BANK.questions.filter(function(q){return q.module===mod});
  if(!list.length){alert('No questions in this set');return}
  idx=0; ans={}; secs=7200; done=false;
  document.getElementById('start').style.display='none';
  document.getElementById('exam').style.display='block';
  document.getElementById('results').style.display='none';
  document.getElementById('timerbar').style.display='flex';
  document.getElementById('td').textContent='2:00:00';
  document.getElementById('quizSub').textContent=BANK.modules.filter(function(m){return m.id===mod})[0].name+' - '+list.length+' questions';
  clearInterval(tick);
  tick=setInterval(function(){
    secs--;
    if(secs<=0){clearInterval(tick);finish();return}
    var h=Math.floor(secs/3600), m=Math.floor((secs%3600)/60), s=secs%60;
    document.getElementById('td').textContent=h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    var bar=document.getElementById('timerbar');
    bar.className='timerbar'+(secs<=300?' danger':secs<=900?' warn':'');
  },1000);
  render();
}
function toggleTimer(){
  var b=document.getElementById('timerbar'), td=document.getElementById('td');
  if(b.dataset.hidden==='1'){b.style.display='flex';b.dataset.hidden='0';document.getElementById('hideBtn').textContent='Hide'}
  else{b.style.display='none';b.dataset.hidden='1'}
}
function setAnsIdx(i){
  ans[idx]=list[idx].options[i];
  var btns=document.querySelectorAll('.opt');
  btns.forEach(function(b,j){ b.className='opt'+(j===i?' sel':''); });
  renderNav();
}
function setAns(v){ ans[idx]=v; renderNav(); }

function render(){
  var q=list[idx];
  var opts='';
  if(q.type==='mcq'){
    opts='<div class="opts">'+q.options.map(function(o,i){
      var k=String.fromCharCode(65+i);
      return '<button class="opt'+(ans[idx]===o?' sel':'')+'" onclick="setAnsIdx('+i+')">'+
        '<span class="key">'+k+'</span><span>'+esc(o)+'</span></button>';
    }).join('')+'</div>';
  }else{
    opts='<div class="fillrow"><label>Answer:</label><input type="text" id="fill" placeholder="type your answer" value="'+esc(ans[idx]||'')+'" oninput="ans['+idx+']=this.value;renderNav()"><span class="hint">numeric or short answer</span></div>';
  }
  document.getElementById('exam').innerHTML=
    '<div class="card"><div class="qhead"><span class="qnum">Question '+(idx+1)+' of '+list.length+'</span>'+
    '<span class="qtag">'+esc(q.difficulty||'Medium')+' - '+esc(q.source||'')+'</span></div>'+
    '<div class="qtext">'+esc(q.q)+'</div>'+opts+'</div>'+
    '<div class="navrow"><button class="btn prev" onclick="go(-1)" '+(idx===0?'disabled':'')+'>Previous page</button>'+
    (idx===list.length-1?'<button class="btn finish" onclick="finish()">Submit exam</button>':'<button class="btn next" onclick="go(1)">Next page</button>')+'</div>'+
    '<div class="qgrid" id="qgrid"></div>';
  renderNav();
  window.scrollTo(0,0);
}
function renderNav(){
  var g=document.getElementById('qgrid'); if(!g)return;
  g.innerHTML=list.map(function(_,i){
    var c=(ans[i]!==undefined&&ans[i]!=='')?' done':'';
    if(i===idx)c+=' cur';
    return '<button class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</button>';
  }).join('');
}
function go(d){ var n=idx+d; if(n<0||n>=list.length)return; idx=n; render(); }
function jump(i){ idx=i; render(); }

function finish(){
  if(done)return; done=true; clearInterval(tick);
  var correct=0,wrong=0,skip=0,html='';
  list.forEach(function(q,i){
    var u=ans[i], ok=false;
    if(u===undefined||u===''){skip++}
    else if(q.type==='mcq'){ok=(u===q.answer)}
    else{
      var a=String(q.answer).trim().toLowerCase(), b=String(u).trim().toLowerCase();
      ok=(a===b);
      if(!ok){var na=parseFloat(a),nb=parseFloat(b); if(!isNaN(na)&&!isNaN(nb))ok=Math.abs(na-nb)<=0.005}
    }
    if(ok)correct++;else if(u!==undefined&&u!=='')wrong++;
    html+='<div class="item '+(ok?'':'wrong')+'"><div class="qq">Q'+(i+1)+'. '+esc(q.q)+'</div>'+
      '<div class="aa '+(ok?'ok':'no')+'">Your answer: '+esc(u===undefined||u===''?'-':u)+'</div>'+
      (ok?'':'<div class="aa ok">Correct: '+esc(q.answer)+'</div>')+
      (q.solution?'<div class="sol"><b>Solution:</b> '+esc(q.solution)+'</div>':'')+'</div>';
  });
  var pct=Math.round(correct/list.length*100);
  document.getElementById('exam').style.display='none';
  document.getElementById('timerbar').style.display='none';
  document.getElementById('results').style.display='block';
  document.getElementById('results').innerHTML=
    '<div class="res"><h2>Examination complete</h2><div class="score">'+pct+'%</div>'+
    '<div class="rstat"><div><b>'+correct+'</b>Correct</div><div><b>'+wrong+'</b>Wrong</div><div><b>'+skip+'</b>Skipped</div></div>'+
    '<p style="color:var(--muted);font-size:13px">Review — wrong and skipped answers shown with worked solutions.</p></div>'+html+
    '<button class="bigbtn" onclick="location.reload()">New attempt</button>';
  window.scrollTo(0,0);
}
drawMods();
</script>
</body>
</html>
